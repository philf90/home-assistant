# Zaehler im Owlet-Stil: Stromzaehlerstaende fuer Bezug und Einspeisung und
# die Gaswerte in einer Karte, als Zeilen statt Kacheln -- fuenfstellige
# Zaehlerstaende passen so auch auf dem Handy ungekuerzt hinein. Zahlen mit
# Dezimalkomma, Monatsname auf Deutsch.
#
# Ersetzt in der Energie-View "Stromverbrauch" (energie-pv-button-card.yaml)
# und gas-wasser-button-card.yaml; beide bleiben als aeltere Varianten. Der
# Wasserzaehler entfaellt.
#
# Voraussetzung: custom:button-card + card-mod (HACS), Templates aus
# energie-button-card-templates.yaml (energie_kopf, energie_zaehler_zeile).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
- type: custom:button-card
  template: energie_kopf
  icon: mdi:counter
  name: Zähler
  label: Strom · Gas
- type: custom:button-card
  name: Strom
  show_icon: false
  show_state: false
  tap_action:
    action: none
  styles:
    name:
    - justify-self: start
    - font-size: 11.5px
    - font-weight: 700
    - letter-spacing: 0.06em
    - text-transform: uppercase
    - color: '#8794a5'
    card:
    - background: none
    - box-shadow: none
    - border: none
    - padding: 2px 2px 0
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.hmip_esi_stromzahler_energiezahler_ch2
  icon: mdi:transmission-tower-import
  name: Zählerstand Bezug
  variables:
    accent: '#e6b566'
    decimals: 1
    unit: kWh
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.hmip_esi_stromzahler_energiezahler_ch4
  icon: mdi:transmission-tower-export
  name: Zählerstand Einspeisung
  variables:
    accent: '#89d2b0'
    decimals: 1
    unit: kWh
- type: custom:button-card
  name: Gas
  show_icon: false
  show_state: false
  tap_action:
    action: none
  styles:
    name:
    - justify-self: start
    - font-size: 11.5px
    - font-weight: 700
    - letter-spacing: 0.06em
    - text-transform: uppercase
    - color: '#8794a5'
    card:
    - background: none
    - box-shadow: none
    - border: none
    - padding: 2px 2px 0
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.hmip_esi_gaszahler_gas_volumen
  icon: mdi:meter-gas
  name: Zählerstand
  variables:
    accent: '#e6b566'
    decimals: 2
    unit: m³
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.gasverbrauch_taglich
  icon: mdi:fire
  name: Verbrauch heute
  variables:
    accent: '#e6b566'
    decimals: 2
    unit: m³
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.hmip_esi_gaszahler_gas_fluss
  icon: mdi:pipe-valve
  name: Flussrate
  variables:
    accent: '#e6b566'
    decimals: 2
    unit: m³/h
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.gasverbrauch_monthly
  icon: mdi:calendar-month
  name: "[[[ return 'Verbrauch ' + new Date().toLocaleString('de-DE', {month: 'long'}); ]]]"
  variables:
    accent: '#8794a5'
    decimals: 2
    unit: m³
- type: custom:button-card
  template: energie_zaehler_zeile
  entity: sensor.gasverbrauch_yearly
  icon: mdi:calendar
  name: "[[[ return 'Verbrauch ' + new Date().getFullYear(); ]]]"
  variables:
    accent: '#8794a5'
    decimals: 2
    unit: m³
