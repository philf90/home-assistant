# Pollenflug-Index im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Fasst die bisher einzelnen mushroom-template-Karten zu EINER Owlet-Karte
# zusammen: Kopfzeile + 2-spaltiges Raster (wie das 2x2-Raster der Owlet-Karte).
#
# - Nur Pollenarten mit Belastung > 0 werden angezeigt.
# - Die ganze Karte blendet sich aus, wenn keine Art belastet ist (Saison-Ende).
# - Farbe je Stufe: gering -> gruen, mittel -> amber, hoch -> rot.
# - Kopf-Icon faerbt sich nach der hoechsten aktuellen Belastung.
#
# Weitere/andere Region: Eintraege unter variables.pollen und triggers_update
# anpassen (hier DWD-Region 101).
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: sensor.pollenflug_graeser_101
show_name: false
show_state: false
show_icon: false
show_label: false
tap_action:
  action: more-info
triggers_update:
  - sensor.pollenflug_graeser_101
  - sensor.pollenflug_ambrosia_101
  - sensor.pollenflug_beifuss_101
  - sensor.pollenflug_birke_101
  - sensor.pollenflug_erle_101
  - sensor.pollenflug_esche_101
  - sensor.pollenflug_hasel_101
  - sensor.pollenflug_roggen_101
variables:
  pollen:
    - name: Gräser
      entity: sensor.pollenflug_graeser_101
      kind: grass
    - name: Ambrosia
      entity: sensor.pollenflug_ambrosia_101
      kind: pollen
    - name: Beifuß
      entity: sensor.pollenflug_beifuss_101
      kind: pollen
    - name: Birke
      entity: sensor.pollenflug_birke_101
      kind: pollen
    - name: Erle
      entity: sensor.pollenflug_erle_101
      kind: pollen
    - name: Esche
      entity: sensor.pollenflug_esche_101
      kind: pollen
    - name: Hasel
      entity: sensor.pollenflug_hasel_101
      kind: pollen
    - name: Roggen
      entity: sensor.pollenflug_roggen_101
      kind: pollen
styles:
  card:
    - padding: 16px 18px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: '0 18px 44px -22px rgba(0,0,0,0.7)'
    - overflow: hidden
    # Ganze Karte ausblenden, wenn keine Pollenart Belastung > 0 hat
    - display: |
        [[[
          const list = variables.pollen || [];
          const any = list.some((p) => {
            const s = states[p.entity];
            const v = s ? parseFloat(s.state) : NaN;
            return !isNaN(v) && v > 0;
          });
          return any ? 'block' : 'none';
        ]]]
  grid:
    - grid-template-areas: '"body"'
  custom_fields:
    body:
      - width: 100%
custom_fields:
  body: |
    [[[
      // ---------- Palette ----------
      const green = '#a6d49e';
      const value = '#f2f5f8';
      const muted = '#6e7988';
      const amber = '#e6b566';
      const red   = '#f0736a';

      const list = variables.pollen || [];

      // ---------- Stufen-Info ----------
      const lvlInfo = (n) => {
        if (n <= 1) return { text: 'Geringe Belastung', color: green, tint: 'rgba(166,212,158,0.12)', border: 'rgba(166,212,158,0.22)' };
        if (n <= 2) return { text: 'Mittlere Belastung', color: amber, tint: 'rgba(230,181,102,0.13)', border: 'rgba(230,181,102,0.24)' };
        return { text: 'Hohe Belastung', color: red, tint: 'rgba(240,115,106,0.14)', border: 'rgba(240,115,106,0.26)' };
      };

      // ---------- Icons ----------
      const grassSvg = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:23px;height:23px;">
        <path d="M12 21v-9"/>
        <path d="M12 12c0-3.2-1.8-5.6-4.8-6.4.2 3.2 2 5.6 4.8 6.4Z"/>
        <path d="M12 12c0-3.2 1.8-5.6 4.8-6.4-.2 3.2-2 5.6-4.8 6.4Z"/></svg>`;

      const flowerSvg = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:23px;height:23px;">
        <circle cx="12" cy="14" r="2.1"/>
        <circle cx="12" cy="9.4" r="2.1"/>
        <circle cx="15.9" cy="11.7" r="2.1"/>
        <circle cx="14.6" cy="16.3" r="2.1"/>
        <circle cx="9.4" cy="16.3" r="2.1"/>
        <circle cx="8.1" cy="11.7" r="2.1"/>
        <circle cx="18.5" cy="5" r="0.5" fill="${c}" stroke="none"/>
        <circle cx="20.5" cy="6.7" r="0.5" fill="${c}" stroke="none"/>
        <circle cx="18.2" cy="7.4" r="0.5" fill="${c}" stroke="none"/></svg>`;

      // ---------- Aktive Arten ----------
      const active = [];
      let maxN = 0;
      list.forEach((p) => {
        const s = states[p.entity];
        const v = s ? parseFloat(s.state) : NaN;
        if (isNaN(v) || v <= 0) return;
        const n = parseInt(s.state);
        if (n > maxN) maxN = n;
        active.push({ name: p.name, kind: p.kind, n: n });
      });

      // ---------- Zellen ----------
      const cells = active.map((p) => {
        const info = lvlInfo(p.n);
        const icon = (p.kind === 'grass') ? grassSvg(info.color) : flowerSvg(info.color);
        return `
          <div style="display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:16px; background:${info.tint}; border:1px solid ${info.border}; min-width:0;">
            <div style="flex:0 0 auto; width:24px; height:24px; display:grid; place-items:center;">${icon}</div>
            <div style="min-width:0;">
              <div style="font-size:15px; font-weight:700; letter-spacing:-0.01em; color:${value}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
              <div style="font-size:12.5px; font-weight:600; color:${info.color}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${info.text}</div>
            </div>
          </div>`;
      }).join('');

      // ---------- Kopfzeile ----------
      const hdr = lvlInfo(maxN || 1);
      const subtitle = `${active.length} ${active.length === 1 ? 'Pollenart' : 'Pollenarten'} mit Belastung`;

      return `
        <div style="width:100%; color:${value}; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; text-align:left;">
          <div style="display:flex; align-items:center; gap:15px;">
            <div style="flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:${hdr.tint}; border:1px solid ${hdr.border}; display:grid; place-items:center;">${flowerSvg(hdr.color)}</div>
            <div style="min-width:0;">
              <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; line-height:1.15;">Pollenflug</div>
              <div style="font-size:13px; color:${muted}; margin-top:2px;">${subtitle}</div>
            </div>
          </div>
          <div style="margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            ${cells}
          </div>
        </div>`;
    ]]]
