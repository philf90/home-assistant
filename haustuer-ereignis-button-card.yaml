# Haustuer-Ereignis im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# ============================================================================
# Zeigt das juengste Ereignis an der Haustuer -- Paket, Klingel, Person,
# Zugang, NFC, Fingerabdruck -- und blendet sich aus, sobald nichts mehr
# aktuell ist. Ergaenzt die Schloss-Karte (haustuer-lock-button-card.yaml),
# die daneben liegt und den Dauerzustand des Schlosses traegt.
#
# WELCHE ENTITAETEN -- UND WELCHE AUSDRUECKLICH NICHT:
#   Die UniFi-Protect-Entitaeten "binary_sensor.haustur_detections_*" sind
#   KEINE Erkennungen, sondern Konfigurationsschalter ("Paketerkennung ist
#   aktiviert"). Sie stehen dauerhaft auf "on" und taugen nicht als Ausloeser.
#   Verwendet werden stattdessen die event-Entitaeten: ihr State ist der
#   Zeitstempel des letzten Ereignisses, das Attribut event_type die Art.
#   Ausnahme sind die beiden Akutzustaende unten (klingelt / steht davor),
#   die als binary_sensor vorliegen und Vorrang vor der Historie haben.
#
# SICHTBARKEIT (Regel "leer heisst weg"):
#   - Akutzustand aktiv                      -> immer sichtbar
#   - juengstes Ereignis juenger als window_minutes        -> sichtbar
#   - Paket juenger als package_window_minutes             -> sichtbar
#   - sonst                                                -> display:none
#   Ein Paket bleibt liegen, bis es hereingeholt wird -- deshalb das eigene,
#   deutlich laengere Fenster. Bewegung ist an einer Klingel zu verrauscht
#   fuer die Startseite und daher per include_motion abgeschaltet.
#
# WARUM sensor.time IN triggers_update:
#   Die Karte rechnet mit Zeitabstaenden ("vor 12 Min."). Ohne einen Ausloeser,
#   der jede Minute feuert, blieben Relativzeit UND Selbstausblendung bis zum
#   naechsten Reload stehen. sensor.time (Integration "Time & Date") liefert
#   genau diesen Minutentakt.
#
# ABWEICHUNG VON DER border-left-KONVENTION:
#   Die anderen Karten faerben den linken Rand ueber styles.card.border-left.
#   Das braeuchte hier einen zweiten JS-Block, der die komplette Ereignisauswahl
#   ein zweites Mal durchlaeuft -- zwei Quellen fuer dieselbe Entscheidung, die
#   beim naechsten Umbau auseinanderlaufen. Der Statusbalken wird deshalb im
#   body-Block als 4-px-Element mit negativen Aussenabstaenden gezeichnet:
#   optisch identisch, aber nur eine Stelle, die die Farbe bestimmt.
#
# ANPASSEN:
#   - variables.window_minutes / package_window_minutes -> Standzeiten
#   - variables.include_motion: true -> Bewegungsmeldungen mitzeigen
#   - variables.preview_entity: '' -> Vorschaubild abschalten
#     (Das Bild ist die Live-Vorschau des Door Hubs, KEIN Schnappschuss des
#      Ereignisses -- es zeigt die Tuer jetzt, nicht zum Ereigniszeitpunkt.)
#   - Andere Kamera/Tuer: Eintraege unter variables.events und die IDs in
#     triggers_update anpassen. triggers_update wird nicht getemplatet,
#     die IDs stehen dort deshalb ausgeschrieben.
#
# Voraussetzung: custom:button-card (HACS) + Integration "Time & Date"
#                (sensor.time).
# ============================================================================
type: custom:button-card
entity: event.eingang_haustur_intelligente_erkennung
show_name: false
show_state: false
show_icon: false
show_label: false
tap_action:
  action: navigate
  navigation_path: /dashboard-home/kamera
hold_action:
  action: more-info
triggers_update:
  - event.eingang_haustur_paket
  - event.eingang_haustur_intelligente_erkennung
  - event.eingang_haustur_bewegungserkennung
  - event.haustur_turklingel
  - event.haustur_door_hub_turklingel
  - event.haustur_door_hub_zugang
  - event.haustur_nfc
  - event.haustur_fingerabdruck
  - binary_sensor.haustur_doorbell
  - binary_sensor.haustur_person_detected
  - image.haustur_door_hub_vorschaubild
  - sensor.time
variables:
  # Standzeit in Minuten, bis sich die Karte wieder ausblendet.
  window_minutes: 45
  # Eigenes Fenster fuer Pakete: liegen bleiben sie deutlich laenger.
  package_window_minutes: 720
  # Bewegung an einer Klingel meldet auch jeden Passanten -- standardmaessig aus.
  include_motion: false
  # Live-Vorschau rechts. Leerer String schaltet das Bild ab.
  preview_entity: image.haustur_door_hub_vorschaubild
  # Ereignisquellen, absteigend nach Aussagekraft.
  #   level: alert (rot) | warn (amber) | ok (gruen) | info (blau)
  #   kind:  waehlt das Icon
  #   window: package -> laengeres Fenster, sonst window_minutes
  #   types:  event_type-abhaengige Texte; Typen ohne Eintrag werden ignoriert
  events:
    - entity: event.eingang_haustur_paket
      text: Paket abgelegt
      level: alert
      kind: package
      window: package
    - entity: event.haustur_turklingel
      text: Es hat geklingelt
      level: warn
      kind: bell
    - entity: event.haustur_door_hub_turklingel
      text: Es hat geklingelt
      level: warn
      kind: bell
    - entity: event.eingang_haustur_intelligente_erkennung
      text: Bewegung erkannt
      level: info
      kind: person
      types:
        person: { text: Person an der Tür, level: warn, kind: person }
        face: { text: Gesicht erkannt, level: warn, kind: person }
        package: { text: Paket abgelegt, level: alert, kind: package, window: package }
        vehicle: { text: Fahrzeug in der Einfahrt, level: info, kind: vehicle }
        car: { text: Fahrzeug in der Einfahrt, level: info, kind: vehicle }
        license_plate: { text: Kennzeichen erkannt, level: info, kind: vehicle }
        animal: { text: Tier vor der Tür, level: info, kind: animal }
        pet: { text: Tier vor der Tür, level: info, kind: animal }
    - entity: event.haustur_door_hub_zugang
      text: Zugang
      level: ok
      kind: key
      types:
        access_granted: { text: Zugang gewährt, level: ok, kind: key }
        access_denied: { text: Zugang verweigert, level: alert, kind: key }
    - entity: event.haustur_nfc
      text: NFC-Tag gescannt
      level: ok
      kind: nfc
    - entity: event.haustur_fingerabdruck
      text: Fingerabdruck
      level: ok
      kind: finger
      types:
        identified: { text: Fingerabdruck erkannt, level: ok, kind: finger }
        not_identified: { text: Fingerabdruck abgelehnt, level: alert, kind: finger }
    - entity: event.eingang_haustur_bewegungserkennung
      text: Bewegung an der Tür
      level: info
      kind: motion
styles:
  card:
    - padding: 16px 18px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: '0 18px 44px -22px rgba(0,0,0,0.7)'
    - overflow: hidden
    # Ganze Karte ausblenden, wenn kein Akutzustand und kein Ereignis im
    # Zeitfenster liegt. Bewusst nur die Ja/Nein-Frage -- Text, Farbe und
    # Reihenfolge entscheidet allein der body-Block.
    - display: |
        [[[
          const bell = states['binary_sensor.haustur_doorbell'];
          const person = states['binary_sensor.haustur_person_detected'];
          if ((bell && bell.state === 'on') || (person && person.state === 'on')) {
            return 'block';
          }
          const now = Date.now();
          const any = (variables.events || []).some((e) => {
            if (e.kind === 'motion' && !variables.include_motion) return false;
            const s = states[e.entity];
            if (!s) return false;
            const t = Date.parse(s.state);
            if (isNaN(t)) return false;
            const typ = s.attributes ? s.attributes.event_type : null;
            const hit = (e.types && typ) ? e.types[typ] : null;
            if (e.types && !hit) return false;
            const win = ((hit && hit.window) || e.window) === 'package'
              ? variables.package_window_minutes
              : variables.window_minutes;
            return (now - t) / 60000 <= win;
          });
          return any ? 'block' : 'none';
        ]]]
  grid:
    - grid-template-areas: '"body"'
  custom_fields:
    body:
      - width: 100%
      - min-width: 0
custom_fields:
  body: |
    [[[
      // ---------- Palette (identisch zur Owlet-Karte) ----------
      const value = '#f2f5f8';
      const muted = '#6e7988';
      const green = '#a6d49e';
      const amber = '#e6b566';
      const red   = '#f0736a';
      const blue  = '#7fb3d5';

      // Flaeche ~12 %, Rand ~24 % desselben Tons -- Repo-Konvention.
      const tone = {
        alert: { color: red,   tint: 'rgba(240,115,106,0.14)', border: 'rgba(240,115,106,0.26)' },
        warn:  { color: amber, tint: 'rgba(230,181,102,0.13)', border: 'rgba(230,181,102,0.24)' },
        ok:    { color: green, tint: 'rgba(166,212,158,0.12)', border: 'rgba(166,212,158,0.22)' },
        info:  { color: blue,  tint: 'rgba(127,179,213,0.13)', border: 'rgba(127,179,213,0.24)' }
      };

      // ---------- Icons (Linienstil wie Pollenflug-Karte) ----------
      const svg = (c, inner, size) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:${size || 23}px;height:${size || 23}px;">${inner}</svg>`;
      const icons = {
        package: (c, s) => svg(c, '<path d="M3.5 7.6L12 3.4l8.5 4.2v8.8L12 20.6 3.5 16.4z"/><path d="M3.5 7.6L12 11.8l8.5-4.2M12 11.8v8.8"/>', s),
        bell: (c, s) => svg(c, '<path d="M18 9.2a6 6 0 1 0-12 0c0 5.4-2 6.8-2 6.8h16s-2-1.4-2-6.8z"/><path d="M13.7 19.6a2 2 0 0 1-3.4 0"/>', s),
        person: (c, s) => svg(c, '<circle cx="12" cy="8" r="3.4"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/>', s),
        vehicle: (c, s) => svg(c, '<path d="M3.4 16.4v-3.1l1.9-4.6a2 2 0 0 1 1.9-1.2h9.6a2 2 0 0 1 1.9 1.2l1.9 4.6v3.1"/><path d="M3.4 13.3h17.2"/><circle cx="7.3" cy="16.8" r="1.6"/><circle cx="16.7" cy="16.8" r="1.6"/>', s),
        animal: (c, s) => svg(c, '<circle cx="7.2" cy="9.4" r="1.9"/><circle cx="12" cy="7.4" r="1.9"/><circle cx="16.8" cy="9.4" r="1.9"/><path d="M12 12.2c2.6 0 4.6 2 4.6 4.2 0 1.8-1.4 2.8-3 2.8h-3.2c-1.6 0-3-1-3-2.8 0-2.2 2-4.2 4.6-4.2z"/>', s),
        key: (c, s) => svg(c, '<circle cx="8.4" cy="15.6" r="3.4"/><path d="M10.8 13.2l7.4-7.4M15.6 8.4l2 2M18 6l2 2"/>', s),
        nfc: (c, s) => svg(c, '<path d="M8.6 15.8V9.6a2.2 2.2 0 0 1 4.2-1l3.4 6.6a2.2 2.2 0 0 0 4.2-1V8"/><path d="M5.4 19.4A9.6 9.6 0 0 1 5.4 4.6"/>', s),
        finger: (c, s) => svg(c, '<path d="M12 3.6a6.4 6.4 0 0 1 6.4 6.4v2"/><path d="M5.6 10a6.4 6.4 0 0 1 3.2-5.5"/><path d="M8.8 10a3.2 3.2 0 0 1 6.4 0v3.6"/><path d="M12 10v4.4a5.6 5.6 0 0 0 1.4 3.7"/><path d="M5.6 13.2v1.2c0 2 .7 3.9 2 5.4"/>', s),
        motion: (c, s) => svg(c, '<circle cx="12" cy="12" r="2.4"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4"/><path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/>', s)
      };
      const iconFor = (kind, color, size) => (icons[kind] || icons.motion)(color, size);

      // ---------- Ereignisse im Zeitfenster einsammeln ----------
      const now = Date.now();
      const found = [];
      (variables.events || []).forEach((e) => {
        if (e.kind === 'motion' && !variables.include_motion) return;
        const s = states[e.entity];
        if (!s) return;
        const t = Date.parse(s.state);
        if (isNaN(t)) return;
        const typ = s.attributes ? s.attributes.event_type : null;
        const hit = (e.types && typ) ? e.types[typ] : null;
        // Quelle mit Typtabelle, aber unbekanntem Typ -> lieber nichts behaupten.
        if (e.types && !hit) return;
        const win = ((hit && hit.window) || e.window) === 'package'
          ? variables.package_window_minutes
          : variables.window_minutes;
        const age = (now - t) / 60000;
        if (age > win) return;
        found.push({
          text: hit ? hit.text : e.text,
          level: (hit ? hit.level : e.level) || 'info',
          kind: (hit ? (hit.kind || e.kind) : e.kind) || 'motion',
          t: t
        });
      });
      found.sort((a, b) => b.t - a.t);

      // ---------- Akutzustaende haben Vorrang ----------
      const acute = [];
      const bell = states['binary_sensor.haustur_doorbell'];
      if (bell && bell.state === 'on') {
        acute.push({ text: 'Es klingelt', when: 'gerade jetzt', level: 'alert', kind: 'bell' });
      }
      const person = states['binary_sensor.haustur_person_detected'];
      if (person && person.state === 'on') {
        acute.push({ text: 'Jemand steht vor der Tür', when: 'gerade jetzt', level: 'warn', kind: 'person' });
      }

      // ---------- Relativzeit ----------
      const ago = (ms) => {
        const min = Math.floor((now - ms) / 60000);
        if (min < 1) return 'gerade eben';
        if (min < 60) return `vor ${min} Min.`;
        const h = Math.floor(min / 60);
        if (h < 24) return `vor ${h} Std.`;
        const d = new Date(ms);
        const pad = (n) => (n < 10 ? '0' + n : '' + n);
        const clock = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        // Groessere Fenster als 24 h sind ueber die Variablen moeglich --
        // dann traegt "gestern" nicht mehr und es braucht das Datum.
        if (h < 48) return `gestern ${clock}`;
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${clock}`;
      };

      // ---------- Kopfzeile bestimmen ----------
      const head = acute.length
        ? acute[0]
        : (found.length ? { text: found[0].text, when: ago(found[0].t), level: found[0].level, kind: found[0].kind } : null);
      // Ohne Kopfzeile blendet styles.card.display die Karte bereits aus.
      if (!head) return '';
      const t0 = tone[head.level] || tone.info;

      // ---------- Vorschaubild (Live-Bild, kein Ereignis-Schnappschuss) ----------
      const prevEnt = variables.preview_entity ? states[variables.preview_entity] : null;
      const prevUrl = (prevEnt && prevEnt.attributes) ? prevEnt.attributes.entity_picture : null;
      const preview = prevUrl
        ? `<div style="flex:0 0 auto; width:56px; height:56px; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,0.07); background:#232a37;">
             <img src="${prevUrl}" alt="" style="width:100%; height:100%; object-fit:cover; display:block;">
           </div>`
        : '';

      // ---------- Vorherige Ereignisse ----------
      // Ohne Akutzustand steht found[0] bereits in der Kopfzeile. Mit
      // Akutzustand beschreibt das juengste gleichartige Ereignis meist
      // denselben Vorgang (Klingel-Sensor + Klingel-Event) -- sonst stuende
      // "Es klingelt" und darunter nochmal "Es hat geklingelt".
      const rest = acute.length
        ? found.filter((e) => !(e.kind === acute[0].kind && (now - e.t) / 60000 < 2))
        : found.slice(1);
      const earlier = rest.slice(0, 2).map((e) => {
        const tn = tone[e.level] || tone.info;
        return `
          <div style="display:flex; align-items:center; gap:9px; padding:8px 0 0; min-width:0;">
            <div style="flex:0 0 auto; width:16px; height:16px; display:grid; place-items:center;">${iconFor(e.kind, muted, 16)}</div>
            <div style="font-size:13px; color:${muted}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.text}</div>
            <div style="margin-left:auto; font-size:12.5px; font-weight:600; color:${muted}; font-variant-numeric:tabular-nums; white-space:nowrap;">${ago(e.t)}</div>
          </div>`;
      }).join('');
      const earlierBlock = earlier
        ? `<div style="margin-top:9px; padding-top:3px; border-top:1px solid rgba(255,255,255,0.06);">${earlier}</div>`
        : '';

      // Statusbalken links: 4 px ueber die volle Kartenhoehe. Die negativen
      // Aussenabstaende heben das Kartenpadding (16px 18px) wieder auf.
      return `
        <div style="display:flex; align-items:stretch; color:${value}; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; text-align:left;">
          <div style="flex:0 0 4px; width:4px; margin:-16px 18px -16px -18px; background:${t0.color};"></div>
          <div style="flex:1 1 auto; min-width:0;">
            <div style="display:flex; align-items:center; gap:15px;">
              <div style="flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:${t0.tint}; border:1px solid ${t0.border}; display:grid; place-items:center;">${iconFor(head.kind, t0.color)}</div>
              <div style="flex:1 1 auto; min-width:0;">
                <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${head.text}</div>
                <div style="font-size:13px; font-weight:600; color:${t0.color}; margin-top:2px;">${head.when}</div>
              </div>
              ${preview}
            </div>
            ${earlierBlock}
          </div>
        </div>`;
    ]]]
