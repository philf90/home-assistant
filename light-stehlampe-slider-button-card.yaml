type: custom:button-card
entity: light.stehlampe_2
name: Stehlampe
icon: hue:signe
show_name: true
show_state: false
tap_action:
  action: toggle
layout: custom

# Icon-Farbe: Lichtfarbe wenn an, grau wenn aus
color: |
  [[[
    if (entity.state !== 'on') return 'var(--disabled-color, #9E9E9E)';
    const rgb = entity.attributes.rgb_color;
    return rgb ? `rgb(${rgb.join(',')})` : 'var(--primary-color)';
  ]]]

styles:
  card:
    - border-radius: 24px
    - padding: 10px 16px
  grid:
    - grid-template-areas: '"i n sl"'
    - grid-template-columns: 44px auto 1fr
    - grid-template-rows: 1fr
    - align-items: center
    - column-gap: 10px
  icon:
    - width: 34px
    - height: 34px
  name:
    - font-size: 14px
    - font-weight: 600
    - justify-self: start
    - align-self: center
    - white-space: nowrap
  custom_fields:
    sl:
      - justify-self: stretch
      - align-self: center
      - pointer-events: all

custom_fields:
  # Helligkeits- und Farbtemperatur-Slider
  sl: |
    [[[
      const entityId = entity.entity_id;
      const isOn = entity.state === 'on';

      // --- Helligkeit ---
      const brightness = entity.attributes.brightness ?? 0;
      const pct = isOn ? Math.round((brightness / 255) * 100) : 0;

      // --- Farbtemperatur ---
      const supportedModes = entity.attributes.supported_color_modes ?? [];
      const supportsColorTemp = supportedModes.includes('color_temp');
      const minMireds = entity.attributes.min_mireds ?? 153;
      const maxMireds = entity.attributes.max_mireds ?? 500;
      // Kelvin-Slider: links = warm (niedrig K), rechts = kalt (hoch K)
      const minK = Math.round(1000000 / maxMireds);
      const maxK = Math.round(1000000 / minMireds);
      const currentMireds = entity.attributes.color_temp ?? maxMireds;
      const currentK = Math.round(1000000 / currentMireds);

      const colorTempSlider = supportsColorTemp ? `
        <div style="display:flex;align-items:center;gap:6px;width:100%;margin-top:5px;">
          <ha-icon
            icon="mdi:thermometer"
            style="--mdc-icon-size:14px;color:var(--secondary-text-color);flex-shrink:0;"
          ></ha-icon>
          <input
            type="range"
            min="${minK}" max="${maxK}"
            value="${currentK}"
            style="
              flex:1;cursor:pointer;
              accent-color:#ffb347;
            "
            oninput="
              event.stopPropagation();
              this.nextElementSibling.textContent = this.value + 'K';
            "
            onchange="
              event.stopPropagation();
              const hass = document.querySelector('home-assistant').__hass;
              const mireds = Math.round(1000000 / parseInt(this.value));
              hass.callService('light', 'turn_on', {entity_id: '${entityId}', color_temp: mireds});
            "
          />
          <span style="font-size:12px;color:var(--secondary-text-color);min-width:42px;text-align:right;">${currentK}K</span>
        </div>
      ` : '';

      return `
        <div
          style="display:flex;flex-direction:column;width:100%;padding:2px 0;"
          onclick="event.stopPropagation();"
        >
          <div style="display:flex;align-items:center;gap:6px;width:100%;">
            <ha-icon
              icon="mdi:brightness-6"
              style="--mdc-icon-size:14px;color:var(--secondary-text-color);flex-shrink:0;"
            ></ha-icon>
            <input
              type="range"
              min="1" max="100"
              value="${pct}"
              style="flex:1;accent-color:var(--primary-color);cursor:pointer;"
              oninput="
                event.stopPropagation();
                this.nextElementSibling.textContent = this.value + '%';
              "
              onchange="
                event.stopPropagation();
                const hass = document.querySelector('home-assistant').__hass;
                hass.callService('light', 'turn_on', {entity_id: '${entityId}', brightness_pct: parseInt(this.value)});
              "
            />
            <span style="font-size:12px;color:var(--secondary-text-color);min-width:32px;text-align:right;">${pct}%</span>
          </div>
          ${colorTempSlider}
        </div>
      `;
    ]]]
