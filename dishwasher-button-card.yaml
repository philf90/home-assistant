type: custom:button-card
entity: sensor.013120394858001191_bsh_common_status_operationstate
icon: mdi:dishwasher
name: Geschirrspüler
show_state: false
show_name: true
show_icon: true

variables:
  progress_entity: sensor.013120394858001191_bsh_common_option_programprogress
  time_entity: sensor.013120394858001191_bsh_common_option_remainingprogramtime
  program_entity: sensor.013120394858001191_active_program

# Dynamische Icon-Farbe je nach Betriebsstatus
color: |
  [[[
    const state = entity.state;
    if (state.includes('Run')) return 'var(--primary-color)';
    if (state.includes('Finished')) return 'var(--success-color, #4CAF50)';
    if (state.includes('Error')) return 'var(--error-color, #F44336)';
    if (state.includes('Pause')) return 'var(--warning-color, #FF9800)';
    return 'var(--disabled-color, #9E9E9E)';
  ]]]

# Karte nur animieren wenn die Maschine läuft
state:
  - value: BSH.Common.EnumType.OperationState.Run
    spin: true

styles:
  card:
    - padding: 12px
    - border-radius: 12px
  grid:
    - grid-template-areas: '"i n" "i status" "i progress" "i time"'
    - grid-template-columns: min-content auto
    - grid-template-rows: auto auto auto auto
  icon:
    - width: 48px
    - height: 48px
    - margin-right: 12px
  name:
    - font-size: 1em
    - font-weight: bold
    - text-align: left
    - justify-self: start
    - align-self: end
  custom_fields:
    status:
      - font-size: 0.85em
      - color: var(--secondary-text-color)
      - text-align: left
      - justify-self: start
      - align-self: start
      - padding-bottom: 8px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    progress:
      - width: 100%
      - padding: 4px 0
    time:
      - font-size: 0.8em
      - color: var(--secondary-text-color)
      - text-align: right
      - width: 100%
      - padding-top: 2px

custom_fields:
  # Lesbarer Betriebsstatus + aktives Programm (nur wenn läuft)
  status: |
    [[[
      const state = entity.state;
      const stateMap = {
        'BSH.Common.EnumType.OperationState.Inactive':       'Inaktiv',
        'BSH.Common.EnumType.OperationState.Ready':          'Bereit',
        'BSH.Common.EnumType.OperationState.DelayedStart':   'Startverzögerung',
        'BSH.Common.EnumType.OperationState.Run':            'Läuft',
        'BSH.Common.EnumType.OperationState.Pause':          'Pausiert',
        'BSH.Common.EnumType.OperationState.ActionRequired': 'Eingriff erforderlich',
        'BSH.Common.EnumType.OperationState.Finished':       'Fertig',
        'BSH.Common.EnumType.OperationState.Error':          'Fehler',
        'BSH.Common.EnumType.OperationState.Aborting':       'Wird abgebrochen',
      };
      const statusLabel = stateMap[state] || state;

      const isRunning = state.includes('Run');
      const programEntity = states[variables.program_entity];
      const programRaw = programEntity ? programEntity.state : null;

      const programMap = {
        'Dishcare.DishWasher.Program.Auto1':         'Auto 45-65°',
        'Dishcare.DishWasher.Program.Auto2':         'Auto 50-65°',
        'Dishcare.DishWasher.Program.Auto3':         'Auto 60-70°',
        'Dishcare.DishWasher.Program.Eco50':         'Eco 50°',
        'Dishcare.DishWasher.Program.Quick45':       'Quick 45°',
        'Dishcare.DishWasher.Program.Intensiv70':    'Intensiv 70°',
        'Dishcare.DishWasher.Program.Normal65':      'Normal 65°',
        'Dishcare.DishWasher.Program.GlassShine':    'Glanz & Frische',
        'Dishcare.DishWasher.Program.PreRinse':      'Vorspülen',
        'Dishcare.DishWasher.Program.MachineCare':   'Maschinenpflege',
        'Dishcare.DishWasher.Program.SteamFresh':    'Steam Fresh',
        'Dishcare.DishWasher.Program.MixedLoad':     'Gemischte Beladung',
      };

      let programLabel = '';
      if (isRunning && programRaw && programRaw !== 'unavailable' && programRaw !== 'unknown') {
        if (programMap[programRaw]) {
          programLabel = programMap[programRaw];
        } else {
          // Letztes Segment nach dem letzten Punkt, CamelCase → lesbar
          const parts = programRaw.split('.');
          programLabel = parts[parts.length - 1]
            .replace(/([A-Z])/g, ' $1').trim();
        }
      }

      if (programLabel) {
        return `${statusLabel} <span style="opacity:0.6">·</span> ${programLabel}`;
      }
      return statusLabel;
    ]]]

  # Progress Bar
  progress: |
    [[[
      const progressEntity = states[variables.progress_entity];
      const progress = progressEntity ? parseFloat(progressEntity.state) || 0 : 0;

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive) return '';

      const color = operationState.includes('Pause')
        ? 'var(--warning-color, #FF9800)'
        : 'var(--primary-color)';

      return `
        <div style="
          width: 100%;
          background: var(--secondary-background-color, #e0e0e0);
          border-radius: 4px;
          height: 6px;
          overflow: hidden;
        ">
          <div style="
            width: ${progress}%;
            background: ${color};
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
          "></div>
        </div>
      `;
    ]]]

  # Verbleibende Zeit (Endzeit-Timestamp aus Entität)
  time: |
    [[[
      const timeEntity = states[variables.time_entity];
      const progressEntity = states[variables.progress_entity];

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || !timeEntity) return '';

      // Entität liefert einen ISO-Timestamp (Endzeitpunkt)
      const endTime = new Date(timeEntity.state);
      const remainingSeconds = Math.max(0, Math.round((endTime - new Date()) / 1000));
      const progress = parseFloat(progressEntity ? progressEntity.state : 0) || 0;

      if (isNaN(endTime.getTime()) || remainingSeconds === 0) return `${progress.toFixed(0)}%`;

      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);

      let timeStr = '';
      if (hours > 0) timeStr += `${hours}h `;
      timeStr += `${minutes}min`;

      return `${progress.toFixed(0)}% &nbsp;·&nbsp; noch ca. ${timeStr}`;
    ]]]
