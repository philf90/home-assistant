# Staubsauger im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
#
# Hybrid: Owlet-Sektion (Huelle + Kopfzeile mit Status-Badge) + die
# funktionalen Spezialkarten mushroom-vacuum-card (Steuerung/Animation) und
# xiaomi-vacuum-map-card (Reinigungskarte), jeweils Owlet-gerahmt per card-mod.
# Die Karte erscheint nur beim Reinigen (conditional / visibility).
#
# Status-Badge: sensor.roborock_s6_maxv_status (lokalisierter Text) + Akku,
# Farbe nach vacuum-Zustand.
#
# Voraussetzung: custom:button-card + Mushroom + xiaomi-vacuum-map-card +
# card-mod (HACS).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopfzeile mit Status-Badge ----
  - type: custom:button-card
    entity: vacuum.roborock_s6_maxv
    icon: mdi:robot-vacuum
    name: Staubsauger
    show_icon: true
    show_name: true
    show_state: false
    triggers_update: all
    tap_action:
      action: none
    custom_fields:
      badge: |
        [[[
          const v=states['vacuum.roborock_s6_maxv'];
          const st=v?v.state:'';
          const stat=states['sensor.roborock_s6_maxv_status'];
          const txt= (stat && stat.state) ? stat.state : st;
          const bat= (v&&v.attributes)?v.attributes.battery_level:undefined;
          let c='#a6d49e';
          if(st==='cleaning') c='#e6b566';
          else if(st==='returning') c='#7fb3d5';
          else if(st==='paused') c='#e6b566';
          else if(st==='error') c='#f0736a';
          const batStr=(bat!==undefined&&bat!==null)?` · ${Math.round(bat)}%`:'';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">${txt}${batStr}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
  # ---- Geraet + Steuerung (Owlet-gerahmt) ----
  - type: custom:mushroom-vacuum-card
    entity: vacuum.roborock_s6_maxv
    icon_animation: true
    fill_container: true
    commands:
      - start_pause
      - stop
      - locate
      - return_home
    card_mod: &owlet
      style: |
        ha-card {
          background: rgba(255,255,255,0.028) !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
        }
  # ---- Reinigungskarte (nur beim Saugen) ----
  - type: conditional
    conditions:
      - entity: vacuum.roborock_s6_maxv
        state: cleaning
    card:
      type: custom:xiaomi-vacuum-map-card
      entity: vacuum.roborock_s6_maxv
      map_source:
        camera: image.roborock_s6_maxv_erdgeschoss
      vacuum_platform: default
      calibration_source:
        camera: true
      map_locked: true
      two_finger_pan: false
      card_mod: *owlet
