# =============================================================================
#  Nocturne iOS  ·  Home Assistant Theme
#  Palette:  #0D1B2A  #1B263B  #415A77  #778DA9  #E0E1DD
#            (Rich Black · Oxford Blue · YInMn Blue · Shadow Blue · Platinum)
#
#  Design: iOS / iPhone inspired – SF-Pro Font-Stack, große Radien,
#          "Frosted Glass"-Karten, weiche Schatten, iOS-Toggles & -Slider.
#
#  Installation:
#    1. Diese Datei nach  <config>/themes/nocturne-ios.yaml  kopieren.
#    2. In configuration.yaml sicherstellen:
#         frontend:
#           themes: !include_dir_merge_named themes
#    3. Home Assistant neu starten (oder "Themes neu laden" in den
#       Entwicklerwerkzeugen aufrufen).
#    4. Profil  →  Design  →  "Nocturne iOS" auswählen.
# =============================================================================

Nocturne iOS:
  # ---------------------------------------------------------------------------
  #  Farb-Tokens der Palette (zentral, damit leicht anpassbar)
  # ---------------------------------------------------------------------------
  palette-black: "#0D1B2A"       # Rich Black
  palette-oxford: "#1B263B"      # Oxford Blue
  palette-blue: "#415A77"        # YInMn Blue
  palette-shadow: "#778DA9"      # Shadow Blue
  palette-platinum: "#E0E1DD"    # Platinum

  # abgeleitete Töne
  palette-oxford-elevated: "#213150"
  palette-blue-bright: "#5A78A0"
  palette-glass: "rgba(27, 38, 59, 0.72)"
  palette-glass-strong: "rgba(13, 27, 42, 0.85)"
  palette-hairline: "rgba(224, 225, 221, 0.10)"

  # ---------------------------------------------------------------------------
  #  Grundfarben
  # ---------------------------------------------------------------------------
  primary-color: "#415A77"
  dark-primary-color: "#213150"
  light-primary-color: "#778DA9"
  accent-color: "#778DA9"
  divider-color: "var(--palette-hairline)"
  disabled-color: "#5A6B84"
  scrollbar-thumb-color: "#415A77"

  primary-background-color: "#0D1B2A"
  secondary-background-color: "#1B263B"

  # Statusfarben (an die Palette angeglichen, aber gut lesbar)
  error-color: "#E06C75"
  warning-color: "#E5B567"
  success-color: "#7FB98B"
  info-color: "#778DA9"
  error-state-color: "var(--error-color)"
  warning-state-color: "var(--warning-color)"
  success-state-color: "var(--success-color)"

  # ---------------------------------------------------------------------------
  #  Text
  # ---------------------------------------------------------------------------
  primary-text-color: "#E0E1DD"
  secondary-text-color: "#778DA9"
  text-primary-color: "#E0E1DD"
  disabled-text-color: "#5A6B84"
  app-header-text-color: "#E0E1DD"
  text-accent-color: "#0D1B2A"

  # ---------------------------------------------------------------------------
  #  Typografie – iOS / SF Pro Stack
  # ---------------------------------------------------------------------------
  primary-font-family: >-
    -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif
  paper-font-common-base_-_font-family: >-
    -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif
  paper-font-body1_-_font-family: >-
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
    "Segoe UI", Roboto, system-ui, sans-serif
  ha-card-header-font-family: >-
    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
    "Segoe UI", Roboto, system-ui, sans-serif
  paper-font-headline_-_font-family: >-
    -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif

  # ---------------------------------------------------------------------------
  #  Karten (Frosted Glass, iOS-Radien)
  # ---------------------------------------------------------------------------
  card-background-color: "var(--palette-glass)"
  ha-card-background: "var(--palette-glass)"
  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--palette-hairline)"
  ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.35)"
  ha-card-backdrop-filter: "saturate(180%) blur(20px)"
  ha-card-header-color: "#E0E1DD"
  mush-card-primary-font-weight: "600"

  # ---------------------------------------------------------------------------
  #  Kopf- / Seitenleiste
  # ---------------------------------------------------------------------------
  app-header-background-color: "var(--palette-glass-strong)"
  app-header-backdrop-filter: "saturate(180%) blur(24px)"
  app-header-border-bottom: "1px solid var(--palette-hairline)"

  sidebar-background-color: "var(--palette-glass-strong)"
  sidebar-icon-color: "#778DA9"
  sidebar-text-color: "#E0E1DD"
  sidebar-selected-icon-color: "#E0E1DD"
  sidebar-selected-text-color: "#E0E1DD"
  sidebar-selected-background-color: "rgba(65, 90, 119, 0.35)"

  # ---------------------------------------------------------------------------
  #  Icons & Zustände
  # ---------------------------------------------------------------------------
  state-icon-color: "#778DA9"
  state-icon-active-color: "#E0E1DD"
  paper-item-icon-color: "#778DA9"
  paper-item-icon-active-color: "#E0E1DD"
  state-icon-unavailable-color: "#5A6B84"

  # entitätsspezifische Zustandsfarben
  state-on-color: "#7FB98B"
  state-off-color: "#5A6B84"
  state-light-active-color: "#E5B567"
  state-switch-active-color: "#778DA9"
  state-binary_sensor-active-color: "#E5B567"
  state-climate-heat-color: "#E5B567"
  state-climate-cool-color: "#778DA9"

  # ---------------------------------------------------------------------------
  #  Schalter / Toggles  (iOS-Look)
  # ---------------------------------------------------------------------------
  switch-checked-color: "#7FB98B"
  switch-unchecked-color: "#5A6B84"
  switch-checked-button-color: "#E0E1DD"
  switch-unchecked-button-color: "#E0E1DD"
  switch-checked-track-color: "#7FB98B"
  switch-unchecked-track-color: "rgba(119, 141, 169, 0.4)"
  paper-toggle-button-checked-bar-color: "#7FB98B"
  paper-toggle-button-checked-button-color: "#E0E1DD"
  paper-toggle-button-unchecked-bar-color: "rgba(119, 141, 169, 0.4)"
  paper-toggle-button-unchecked-button-color: "#E0E1DD"

  # ---------------------------------------------------------------------------
  #  Slider  (iOS-Look)
  # ---------------------------------------------------------------------------
  slider-color: "#415A77"
  slider-secondary-color: "#778DA9"
  slider-bar-color: "rgba(119, 141, 169, 0.25)"
  slider-track-color: "rgba(119, 141, 169, 0.25)"
  ha-slider-color: "#415A77"
  paper-slider-active-color: "#415A77"
  paper-slider-secondary-color: "#778DA9"
  paper-slider-knob-color: "#E0E1DD"
  paper-slider-knob-start-color: "#E0E1DD"
  paper-slider-pin-color: "#415A77"
  paper-slider-container-color: "rgba(119, 141, 169, 0.25)"

  # ---------------------------------------------------------------------------
  #  Buttons / Toggles (Material-Komponenten)
  # ---------------------------------------------------------------------------
  mdc-theme-primary: "#778DA9"
  mdc-theme-secondary: "#415A77"
  mdc-theme-on-primary: "#0D1B2A"
  mdc-button-outline-color: "var(--palette-hairline)"
  mdc-checkbox-unchecked-color: "#778DA9"
  mdc-checkbox-ink-color: "#0D1B2A"
  ha-chip-background-color: "rgba(65, 90, 119, 0.35)"

  # ---------------------------------------------------------------------------
  #  Formular-/Eingabefelder
  # ---------------------------------------------------------------------------
  input-fill-color: "rgba(224, 225, 221, 0.06)"
  input-ink-color: "#E0E1DD"
  input-label-ink-color: "#778DA9"
  input-idle-line-color: "var(--palette-hairline)"
  input-hover-line-color: "#778DA9"
  input-dropdown-icon-color: "#778DA9"
  mdc-select-fill-color: "rgba(224, 225, 221, 0.06)"
  mdc-select-ink-color: "#E0E1DD"

  # ---------------------------------------------------------------------------
  #  Diagramme / Verlauf
  # ---------------------------------------------------------------------------
  graph-base-background-color: "transparent"
  history-unavailable-color: "rgba(90, 107, 132, 0.35)"
  energy-grid-consumption-color: "#778DA9"
  energy-grid-return-color: "#415A77"
  energy-solar-color: "#E5B567"
  energy-battery-in-color: "#7FB98B"
  energy-battery-out-color: "#5A78A0"

  # ---------------------------------------------------------------------------
  #  Dialoge / Menüs / Popups
  # ---------------------------------------------------------------------------
  mdc-dialog-scrim-color: "rgba(13, 27, 42, 0.6)"
  ha-dialog-border-radius: "26px"
  dialog-backdrop-filter: "blur(4px)"
  menu-surface-background-color: "var(--palette-glass-strong)"
  divider-color: "var(--palette-hairline)"

  # ---------------------------------------------------------------------------
  #  Badges / Labels / Markierungen
  # ---------------------------------------------------------------------------
  label-badge-background-color: "var(--palette-glass)"
  label-badge-text-color: "#E0E1DD"
  label-badge-red: "#E06C75"
  label-badge-green: "#7FB98B"
  label-badge-blue: "#778DA9"
  label-badge-yellow: "#E5B567"
  label-badge-grey: "#5A6B84"

  # ---------------------------------------------------------------------------
  #  Codeeditor (YAML) – passend zur Palette
  # ---------------------------------------------------------------------------
  code-editor-background-color: "#0D1B2A"
  codemirror-property: "#778DA9"
  codemirror-string: "#7FB98B"
  codemirror-keyword: "#E5B567"
  codemirror-number: "#5A78A0"

  # ---------------------------------------------------------------------------
  #  Optionale iOS-Feinheiten (von Custom-Cards genutzt)
  # ---------------------------------------------------------------------------
  ha-view-sections-column-gap: "12px"
  ha-view-sections-row-gap: "12px"

  # ---------------------------------------------------------------------------
  #  Modes: der Palette folgend ist Nocturne primär ein dunkles Theme.
  #  Ein heller Modus (invertiert) wird für "auto" bereitgestellt.
  # ---------------------------------------------------------------------------
  modes:
    dark:
      primary-background-color: "#0D1B2A"
      secondary-background-color: "#1B263B"
      card-background-color: "var(--palette-glass)"
      primary-text-color: "#E0E1DD"
      secondary-text-color: "#778DA9"
    light:
      primary-background-color: "#E0E1DD"
      secondary-background-color: "#EEEFEC"
      card-background-color: "rgba(255, 255, 255, 0.72)"
      ha-card-background: "rgba(255, 255, 255, 0.72)"
      primary-text-color: "#0D1B2A"
      secondary-text-color: "#415A77"
      text-primary-color: "#0D1B2A"
      app-header-text-color: "#0D1B2A"
      app-header-background-color: "rgba(224, 225, 221, 0.85)"
      sidebar-background-color: "rgba(224, 225, 221, 0.9)"
      sidebar-text-color: "#0D1B2A"
      sidebar-icon-color: "#415A77"
      sidebar-selected-text-color: "#0D1B2A"
      state-icon-color: "#415A77"
      state-icon-active-color: "#0D1B2A"
      paper-item-icon-color: "#415A77"
      paper-item-icon-active-color: "#0D1B2A"
      ha-card-box-shadow: "0 8px 24px rgba(65, 90, 119, 0.18)"
      palette-hairline: "rgba(13, 27, 42, 0.10)"
      disabled-text-color: "#8B98AB"
