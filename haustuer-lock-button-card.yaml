# Haustuer-Schloss im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Ersetzt die custom:mushroom-lock-card durch einen custom:button-card-Nachbau.
#
# - Owlet-Huelle + rundlich-quadratische Icon-Kachel, die sich nach Zustand
#   faerbt: verschlossen -> gruen, aufgeschlossen/offen -> rot, in Bewegung -> amber.
# - Linker Kartenrand (4 px) traegt dieselbe Zustandsfarbe -> der Zustand ist
#   auch aus dem Augenwinkel erkennbar, ohne die Statuszeile zu lesen.
# - Statuszeile auf Deutsch (Verschlossen / Aufgeschlossen / ...).
# - Zwei Aktions-Buttons: Verriegeln/Entriegeln (toggle) und Oeffnen (lock.open).
#
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: lock.haustur_schloss
name: Haustür
show_icon: true
show_name: true
show_state: false
show_label: true
tap_action:
  action: more-info
label: |
  [[[
    const map = {
      locked: 'Verschlossen', unlocked: 'Aufgeschlossen',
      locking: 'Verriegelt…', unlocking: 'Entriegelt…',
      jammed: 'Klemmt', open: 'Offen', opening: 'Öffnet…'
    };
    return map[entity.state] || entity.state;
  ]]]
icon: |
  [[[ return (entity.state === 'locked') ? 'mdi:lock' : 'mdi:lock-open-variant'; ]]]
styles:
  card:
    - padding: 16px 18px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: '0 18px 44px -22px rgba(0,0,0,0.7)'
    - overflow: hidden
    # Statusrand links (wie Personenkarten / Meteoalarm-Popup). Muss NACH
    # "border" stehen, sonst ueberschreibt die Kurzform ihn wieder.
    # Farben identisch zur Icon-Kachel darunter.
    - border-left: |
        [[[
          const s = entity.state;
          if (s === 'locked') return '4px solid #a6d49e';
          if (s === 'unlocked' || s === 'open') return '4px solid #f0736a';
          return '4px solid #e6b566';
        ]]]
  grid:
    - grid-template-areas: '"i n" "i l" "buttons buttons"'
    - grid-template-columns: min-content 1fr
    - grid-template-rows: min-content min-content min-content
  img_cell:
    - width: 46px
    - height: 46px
    - border-radius: 14px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - margin-right: 15px
    - background: |
        [[[
          const s = entity.state;
          if (s === 'locked') return 'rgba(166,212,158,0.14)';
          if (s === 'unlocked' || s === 'open') return 'rgba(240,115,106,0.16)';
          return 'rgba(230,181,102,0.15)';
        ]]]
  icon:
    - width: 24px
    - height: 24px
    - color: |
        [[[
          const s = entity.state;
          if (s === 'locked') return '#a6d49e';
          if (s === 'unlocked' || s === 'open') return '#f0736a';
          return '#e6b566';
        ]]]
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: '#f2f5f8'
  label:
    - justify-self: start
    - align-self: start
    - font-size: 14px
    - font-weight: 500
    - color: '#6e7988'
    - margin-top: 2px
  custom_fields:
    buttons:
      - margin-top: 16px
custom_fields:
  buttons:
    card:
      type: horizontal-stack
      cards:
        # ---------- Verriegeln / Entriegeln ----------
        - type: custom:button-card
          entity: lock.haustur_schloss
          show_name: true
          show_icon: true
          show_state: false
          name: |
            [[[ return (entity.state === 'locked') ? 'Entriegeln' : 'Verriegeln'; ]]]
          icon: |
            [[[ return (entity.state === 'locked') ? 'mdi:lock-open-variant' : 'mdi:lock'; ]]]
          tap_action:
            action: toggle
          styles:
            card:
              - padding: 12px
              - border-radius: 14px
              - background: rgba(255, 255, 255, 0.05)
              - border: 1px solid rgba(255, 255, 255, 0.06)
              - box-shadow: none
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: min-content min-content
              - justify-content: center
              - align-items: center
            img_cell:
              - margin-right: 8px
              - align-self: center
              - margin-top: -4px
            icon:
              - width: 20px
              - height: 20px
              - align-self: center
              - transform: translateY(-2px)
              - color: '#e7ecf3'
            name:
              - font-size: 14px
              - font-weight: 600
              - line-height: 1
              - color: '#e7ecf3'
        # ---------- Oeffnen ----------
        - type: custom:button-card
          entity: lock.haustur_schloss
          show_name: true
          show_icon: true
          show_state: false
          name: Öffnen
          icon: mdi:door-open
          tap_action:
            action: call-service
            service: lock.open
            data:
              entity_id: lock.haustur_schloss
          styles:
            card:
              - padding: 12px
              - border-radius: 14px
              - background: rgba(255, 255, 255, 0.05)
              - border: 1px solid rgba(255, 255, 255, 0.06)
              - box-shadow: none
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: min-content min-content
              - justify-content: center
              - align-items: center
            img_cell:
              - margin-right: 8px
              - align-self: center
              - margin-top: -4px
            icon:
              - width: 20px
              - height: 20px
              - align-self: center
              - transform: translateY(-2px)
              - color: '#e7ecf3'
            name:
              - font-size: 14px
              - font-weight: 600
              - line-height: 1
              - color: '#e7ecf3'
