# Netzwerk-Status – Owlet-Karte (Kopf der Netzwerk-View)
#
# Beantwortet auf einen Blick: Laeuft alles? Ersetzt die fruehere Internet-
# Karte (Kopf mit Badge) und die Infrastruktur-Karte.
#
#   Kopf     Icon-Kachel + "Netzwerk" + Badge (alles ok / n Stoerung(en))
#            Unterzeile: Geraete online · inaktiv · Firmware-Status
#   Hinweise je gestoertem Geraet bzw. je Leitung ohne Internet, mit Dauer
#   Chips    aktive Leitung mit Latenz · Durchsatz live · Clients WLAN/LAN
#
# Geraete und Clients zaehlt die Karte genau wie der Netzplan
# (unifi-netzplan-card.js): alle Geraete der UniFi-Integration mit
# Zustandssensor, Clients als device_tracker der Integration (WLAN = mit
# ap_mac). Neue oder ausgemusterte Geraete brauchen deshalb keine Pflege
# dieser Datei, und Statuskarte und Netzplan zeigen dieselben Zahlen.
#
# Farben: gruen = alles ok, gelb = Geraet gestoert oder Backup-Leitung ohne
# Internet, rot = Hauptleitung ohne Internet.
#
# ┌────────────── ENTITÄTEN PRÜFEN ───────────────────────────────────────────┐
# │ variables.inactive und variables.exclude_clients wie inactive bzw. das     │
# │ Modem (wan[].device) in unifi-netzplan-card.yaml halten. Die Sensoren      │
# │ unter variables.wans legt "UniFi WAN" an; ihre IDs enthalten Host und Site │
# │ der eigenen Konsole. Latenz: WAN-Latenz-Sensoren der UniFi-Integration     │
# │ (standardmäßig deaktiviert).                                              │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Voraussetzung: custom:button-card (HACS), UniFi-Network-Integration,
#                optional "UniFi WAN" (HACS, benutzerdefiniertes Repository).
type: custom:button-card
show_icon: false
show_name: false
show_state: false
triggers_update: all
tap_action:
  action: none
variables:
  # device_tracker von Geraeten, die bewusst getrennt sind (grau statt Stoerung)
  inactive:
    - device_tracker.usw_lite_8_poe_garage
  # device_tracker, die nicht als Client zaehlen (z. B. das Modem einer Leitung)
  exclude_clients:
    - device_tracker.draytek_vigor_167
  # Reihenfolge = Anzeige, primary = Leitung, die per Regel den Verkehr traegt
  wans:
    - name: Glasfaser
      primary: true
      internet: binary_sensor.unifi_wan_192_168_1_1_default_unifi_wan2_internet
      latency: sensor.dream_machine_special_edition_cloudflare_wan2_latency
    - name: VDSL
      internet: binary_sensor.unifi_wan_192_168_1_1_default_unifi_wan1_internet
      latency: sensor.dream_machine_special_edition_cloudflare_wan_latency
  rx: sensor.unifi_wan_192_168_1_1_default_unifi_wan_download
  tx: sensor.unifi_wan_192_168_1_1_default_unifi_wan_upload
custom_fields:
  body: |
    [[[
      const G='#a6d49e', A='#e6b566', R='#f0736a', M='#6e7988', V='#f2f5f8';
      const st=hass.states, ents=hass.entities||{}, devs=hass.devices||{};
      const uni=Object.values(ents).filter(e=>e.platform==='unifi');
      const inactiveDev=new Set((variables.inactive||[]).map(id=>ents[id]&&ents[id].device_id).filter(Boolean));
      const exclude=new Set(variables.exclude_clients||[]);
      const since=(iso)=>{
        const m=Math.max(0,Math.round((Date.now()-Date.parse(iso))/60000));
        if(m<60) return `seit ${m} min`;
        const h=Math.floor(m/60); if(h<48) return `seit ${h} h`;
        return `seit ${Math.floor(h/24)} T`;
      };
      const STATE_DE={disconnected:'offline', unavailable:'offline', heartbeat_missed:'ohne Rückmeldung', upgrading:'Update läuft', provisioning:'wird eingerichtet', pending:'wartet', adopting:'wird übernommen', isolated:'isoliert'};
      const fmt=(v)=>{
        if(!Number.isFinite(v)) return '–';
        return (v<10?v.toFixed(1):Math.round(v).toString()).replace('.',',');
      };

      // --- Geraete (wie Netzplan: Zustandssensor der UniFi-Integration) ---
      const infraDev=new Set(), problems=[];
      let total=0, ok=0, off=0;
      for(const e of uni){
        if(e.translation_key!=='device_state') continue;
        const s=st[e.entity_id];
        if(!s || s.attributes.restored) continue;
        total++; if(e.device_id) infraDev.add(e.device_id);
        const d=devs[e.device_id]||{};
        const name=d.name_by_user||d.name||s.attributes.friendly_name||e.entity_id;
        if(s.state==='connected') ok++;
        else if(inactiveDev.has(e.device_id)) off++;
        else problems.push({sev:'warn', text:`<b>${name}</b> ${STATE_DE[s.state]||s.state} · ${since(s.last_changed)}`});
      }

      // --- Leitungen ---
      let lineChip=null, worst='ok';
      (variables.wans||[]).forEach((w,i)=>{
        const s=st[w.internet];
        const up=!s || s.state==='on';
        if(!up){
          const sev=w.primary?'bad':'warn';
          problems.unshift({sev, text:`<b>${w.name}</b> ohne Internet · ${since(s.last_changed)}`});
        }
        if(up && !lineChip){
          const l=st[w.latency]; const v=l?parseFloat(l.state):NaN;
          lineChip={v:Number.isFinite(v)?Math.round(v):'–', u:'ms', l:`${w.name}${w.primary?' aktiv':' (Backup)'}`, c:w.primary?V:A};
        }
      });
      if(!lineChip) lineChip={v:'–', u:'', l:'kein Internet', c:R};
      if(problems.some(p=>p.sev==='bad')) worst='bad';
      else if(problems.length) worst='warn';

      // --- Clients (wie Netzplan) ---
      let wlan=0, lan=0;
      for(const e of uni){
        if(!e.entity_id.startsWith('device_tracker.')) continue;
        if(e.device_id && infraDev.has(e.device_id)) continue;
        if(exclude.has(e.entity_id)) continue;
        const s=st[e.entity_id];
        if(!s || s.state!=='home') continue;
        if(s.attributes.ap_mac) wlan++; else lan++;
      }

      // --- Firmware ---
      const upd=uni.filter(e=>e.entity_id.startsWith('update.') && st[e.entity_id] && st[e.entity_id].state==='on').length;

      // --- Durchsatz ---
      const rx=st[variables.rx]?parseFloat(st[variables.rx].state):NaN;
      const tx=st[variables.tx]?parseFloat(st[variables.tx].state):NaN;

      const c=worst==='bad'?R:worst==='warn'?A:G;
      const nProb=problems.length;
      const badge=nProb?`${nProb} Störung${nProb>1?'en':''}`:'alles ok';
      const sub=`${ok}/${total-off} Geräte${off?` · ${off} inaktiv`:''} · ${upd?`<span style="color:${A}">${upd} Update${upd>1?'s':''}</span>`:'Firmware aktuell'}`;

      const chip=(v,l,col)=>`<div style="background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:9px 10px 8px;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:16px;font-weight:750;letter-spacing:-0.02em;color:${col||V};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v}</span>
          <span style="font-size:11px;color:${M};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${l}</span></div>`;
      const small=(t)=>`<span style="font-size:0.62em;color:${M};font-weight:600;margin:0 3px 0 1px;">${t}</span>`;

      const shown=problems.slice(0,3);
      const alerts=shown.map(p=>{
        const pc=p.sev==='bad'?R:A;
        return `<div style="display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 11px;background:${pc}14;border:1px solid ${pc}38;font-size:12.5px;color:#c3ccd8;line-height:1.35;">
          <ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:19px;color:${pc};flex:0 0 auto;"></ha-icon><span>${p.text}</span></div>`;
      }).join('')+(problems.length>3?`<div style="font-size:11.5px;color:${M};padding-left:4px;">+${problems.length-3} weitere, Details im Netzplan</div>`:'');

      return `<div style="display:flex;flex-direction:column;gap:10px;text-align:left;">
        <div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;">
          <div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:${c}1f;border:1px solid ${c}33;">
            <ha-icon icon="mdi:lan" style="--mdc-icon-size:23px;color:${c};"></ha-icon></div>
          <div style="min-width:0;">
            <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${V};line-height:1.2;">Netzwerk</div>
            <div style="font-size:12.5px;color:${M};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sub}</div></div>
          <span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${badge}</span>
        </div>
        ${alerts}
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
          ${chip(`${lineChip.v}${small(lineChip.u)}`, lineChip.l, lineChip.c)}
          ${chip(`${fmt(rx)}${small('↓')}${fmt(tx)}${small('↑')}`, 'Mbit/s live')}
          ${chip(`${wlan}${small('WLAN')}${lan}${small('LAN')}`, 'Clients')}
        </div>
      </div>`;
    ]]]
styles:
  card:
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - border-radius: 22px
    - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
    - padding: 16px 18px
  grid:
    - grid-template-areas: '"body"'
    - grid-template-columns: 1fr
    - grid-template-rows: min-content
  custom_fields:
    body:
      - justify-self: stretch
