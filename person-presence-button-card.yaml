# Personen-Präsenzkarte im Design der überarbeiteten Owlet-Smart-Sock-Karte
# Gleiche Kartenhülle, Palette (#a6d49e / #f2f5f8 / #6e7988), Linien-Icons und
# fette Ziffern mit Schwellenwert-Färbung wie owlet-smart-sock-button-card.yaml.
#
# Layout: Kopfzeile mit Avatar (links) und Akku-Pille (rechts), darunter Name und
# Status über die volle Kartenbreite -> Texte werden auch bei schmaler
# horizontal-stack-Spalte (iPhone) vollständig angezeigt statt abgeschnitten.
# Zustand "home" -> gruener Ring + gruener Home-Badge, "not_home" -> Graustufen-Foto
# + roter Home-Export-Badge. Akku: gruen >= 30 %, gelb 15-29 %, rot < 15 %.
# Zusaetzlich faerbt sich der linke Kartenrand (4 px) statusabhaengig in den
# Identitaetsfarben: Zuhause -> Night Violet #1E1033, Abwesend -> Dragonfruit
# #FF4696. Hinweis: #1E1033 liegt sehr nah am Kartenhintergrund #1b2231, der
# Rand ist im Zustand "Zuhause" daher bewusst nur dezent zu sehen.
# Beim Laden (charging_entity = ..._battery_state): gruener Akku + Lade-Blitz.
#
# Voraussetzung: custom:button-card (HACS).
type: horizontal-stack
cards:
  - type: custom:button-card
    entity: person.philipp
    variables:
      battery_entity: sensor.philipps_iphone17pro_battery_level
      charging_entity: sensor.philipps_iphone17pro_battery_state
      avatar_fallback: linear-gradient(160deg,#4a5a74,#33404f)
    tap_action:
      action: more-info
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    styles:
      card:
        - padding: 14px 15px
        - border-radius: 22px
        - border: 1px solid rgba(255, 255, 255, 0.05)
        - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
        - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
        - overflow: hidden
        # Statusrand links (Vorbild: Warnungsblock im Meteoalarm-Popup,
        # meteoalarm-button-card.yaml -> border-left:3px solid ${color}).
        # Muss NACH "border" stehen, sonst ueberschreibt die Kurzform hier.
        - border-left: &edge_tpl |
            [[[
              return (entity && entity.state === 'home')
                ? '4px solid #1E1033'
                : '4px solid #FF4696';
            ]]]
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
    custom_fields:
      body: &body_tpl |
        [[[
          // ---------- Palette (identisch zur Owlet-Karte) ----------
          const green = '#a6d49e';
          const value = '#f2f5f8';
          const muted = '#6e7988';
          const warn  = '#e6b566';
          const bad   = '#f0736a';
          const cardBot = '#171d29';

          // ---------- Person ----------
          const e = entity;
          const home = e && e.state === 'home';
          const stateMap = { home: 'Zuhause', not_home: 'Unterwegs' };
          const raw = e ? e.state : 'unknown';
          const statusLabel = stateMap[raw] || (raw.charAt(0).toUpperCase() + raw.slice(1));
          const pic  = e && e.attributes ? e.attributes.entity_picture : null;
          const name = (e && e.attributes && e.attributes.friendly_name) || '';
          const initial = name ? name.trim().charAt(0).toUpperCase() : '?';
          const accent = home ? green : muted;
          const fb = variables.avatar_fallback || 'linear-gradient(160deg,#4a5a74,#33404f)';

          // ---------- Akku ----------
          const bat = states[variables.battery_entity];
          const batBad = !bat || bat.state === 'unavailable' || bat.state === 'unknown';
          const batVal = batBad ? null : parseFloat(bat.state);
          const batColor = batBad ? muted : (batVal < 15 ? bad : (batVal < 30 ? warn : green));
          const batTxt = batBad ? '–' : Math.round(batVal);
          const fill = batBad ? 0 : Math.max(1, Math.min(10.6, (batVal / 100) * 10.6));

          // ---------- Ladezustand ----------
          const chg = states[variables.charging_entity];
          const isCharging = chg && ['charging', 'full'].includes(String(chg.state).toLowerCase());
          const batIconColor = isCharging ? green : batColor;

          // ---------- Icons ----------
          const icoHomeStatus = `<svg viewBox="0 0 24 24" fill="none" stroke="${muted}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex:none;">
            <path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.6V19h12v-8.4"/></svg>`;
          const icoAwayStatus = `<svg viewBox="0 0 24 24" fill="none" stroke="${muted}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex:none;">
            <circle cx="12" cy="10" r="3"/><path d="M12 21c5-4.6 7-7.6 7-11a7 7 0 1 0-14 0c0 3.4 2 6.4 7 11Z"/></svg>`;
          const statusIcon = home ? icoHomeStatus : icoAwayStatus;

          const badgeHome = `<svg viewBox="0 0 24 24" fill="none" stroke="#12161f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;">
            <path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.6V19h12v-8.4"/></svg>`;
          const badgeAway = `<svg viewBox="0 0 24 24" fill="none" stroke="#12161f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;">
            <path d="M4 11.5 11 5.7V19h-5v-8.4"/><path d="M13 12h8m0 0-3-3m3 3-3 3"/></svg>`;
          const badgeBg   = home ? green : bad;
          const badgeIcon = home ? badgeHome : badgeAway;

          const icoBat = `<svg viewBox="0 0 24 24" fill="none" stroke="${batIconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none;">
            <rect x="2.5" y="8" width="16.5" height="8" rx="2.4"/>
            <rect x="4.4" y="9.9" width="${fill}" height="4.2" rx="1.2" fill="${batIconColor}" stroke="none"/>
            <path d="M21.4 10.7v2.6"/></svg>`;

          // Lade-Blitz (nur waehrend des Ladens)
          const boltIco = isCharging
            ? `<svg viewBox="0 0 24 24" fill="${green}" stroke="none" style="width:11px;height:14px;flex:none;margin:0 -1px 0 -3px;"><path d="M13 2 5 13.5h5l-1 8.5 9-12.5h-5.5z"/></svg>`
            : '';

          // ---------- Avatar ----------
          const dim = 'width:46px;height:46px;flex:none;';
          const photo = pic
            ? `<img src="${pic}" style="${dim}border-radius:50%;object-fit:cover;box-sizing:border-box;border:2px solid ${accent};${home ? '' : 'filter:grayscale(100%);opacity:0.82;'}"/>`
            : `<div style="${dim}border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:#12161f;box-sizing:border-box;background:${fb};border:2px solid ${accent};${home ? '' : 'filter:grayscale(100%);opacity:0.82;'}">${initial}</div>`;

          const avatar = `
            <div style="position:relative;flex:none;width:46px;height:46px;">
              ${photo}
              <div style="position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:${badgeBg};display:grid;place-items:center;border:2px solid ${cardBot};">${badgeIcon}</div>
            </div>`;

          // ---------- Akku-Pille (oben rechts) ----------
          const batteryPill = `
            <div style="display:flex;align-items:center;gap:4px;flex:none;padding:4px 9px 4px 7px;border-radius:999px;background:${isCharging ? 'rgba(166,212,158,0.10)' : 'rgba(255,255,255,0.045)'};border:1px solid ${isCharging ? 'rgba(166,212,158,0.22)' : 'rgba(255,255,255,0.06)'};">
              ${icoBat}${boltIco}
              <span style="font-size:15px;font-weight:700;color:${value};font-variant-numeric:tabular-nums;line-height:1;">${batTxt}<span style="font-size:10px;color:${muted};font-weight:600;margin-left:1px;">%</span></span>
            </div>`;

          // ---------- Aufbau ----------
          return `
            <div style="display:flex;flex-direction:column;gap:11px;width:100%;box-sizing:border-box;overflow:hidden;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                ${avatar}
                ${batteryPill}
              </div>
              <div style="min-width:0;">
                <div style="font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:3px;color:${muted};font-size:13px;line-height:1.2;min-width:0;">
                  ${statusIcon}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${statusLabel}</span>
                </div>
              </div>
            </div>`;
        ]]]

  - type: custom:button-card
    entity: person.annalena
    variables:
      battery_entity: sensor.samsung_s25_battery_level
      charging_entity: sensor.samsung_s25_battery_state
      avatar_fallback: linear-gradient(160deg,#6d5480,#4a3a5c)
    tap_action:
      action: more-info
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    styles:
      card:
        - padding: 14px 15px
        - border-radius: 22px
        - border: 1px solid rgba(255, 255, 255, 0.05)
        - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
        - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
        - overflow: hidden
        - border-left: *edge_tpl
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
    custom_fields:
      body: *body_tpl
