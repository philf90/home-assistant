# Kameras im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
#
# Jede webrtc-camera ist eine Live-Stream-Spezialkarte und bleibt funktional
# erhalten (Vollbild, Ton, Play/Pause); sie bekommt nur die Owlet-Huelle mit
# runden Ecken und je eine Owlet-Kopfzeile mit Icon, Name und LIVE-Badge.
#
# Sichtbarkeit (nur fuer die beiden freigegebenen Benutzer) bleibt am
# Wurzel-Element erhalten.
#
# Gemeinsame Optik ueber YAML-Anker: &shell, &header_styles, &cam_frame,
# &live_badge.
#
# Voraussetzung: custom:button-card + custom:webrtc-camera + card-mod (HACS).
type: vertical-stack
cards:
  # ================================ PAULINE ================================
  - type: vertical-stack
    card_mod: &shell
      style: |
        #root {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
      - type: custom:button-card
        icon: mdi:teddy-bear
        name: Pauline
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: none
        custom_fields:
          live: &live_badge >
            <span style="display:inline-flex;align-items:center;gap:6px;color:#a6d49e;background:rgba(166,212,158,0.13);border:1px solid rgba(166,212,158,0.24);font-size:11px;font-weight:800;letter-spacing:0.09em;padding:5px 10px;border-radius:10px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:#a6d49e;box-shadow:0 0 0 3px rgba(166,212,158,0.2);"></span>LIVE</span>
        styles: &header_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 4px
          grid:
            - grid-template-areas: '"i n live"'
            - grid-template-columns: min-content 1fr min-content
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: 'rgba(166, 212, 158, 0.12)'
            - border: 1px solid rgba(166, 212, 158, 0.2)
          icon:
            - width: 23px
            - height: 23px
            - color: '#a6d49e'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          custom_fields:
            live:
              - justify-self: end
              - align-self: center
      - type: custom:webrtc-camera
        entity: camera.kinderzimmer_high_resolution_channel
        card_mod: &cam_frame
          style: |
            ha-card {
              border-radius: 16px !important;
              overflow: hidden !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
              box-shadow: none !important;
              background: #000 !important;
            }

  # ================================= MORITZ =================================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:teddy-bear
        name: Moritz
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: none
        custom_fields:
          live: *live_badge
        styles: *header_styles
      - type: custom:webrtc-camera
        entity: camera.g4_instant_high_resolution_channel
        card_mod: *cam_frame

  # =============================== EINGANGSTÜR ===============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:doorbell-video
        name: Eingangstür
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: none
        custom_fields:
          live: *live_badge
        styles: *header_styles
      - type: custom:webrtc-camera
        entity: camera.haustur_high_resolution_channel
        card_mod: *cam_frame

# Sichtbarkeit wie im Original (nur freigegebene Benutzer)
visibility:
  - condition: user
    users:
      - cd2f999e65374610be36639942858fed
      - 04c7352352c44b94a1c5557bb90aa99b
