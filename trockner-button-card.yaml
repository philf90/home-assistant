# Trockner (Home Connect / BSH) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# Icon in zustandsgefaerbter Owlet-Kachel, Owlet-Huelle, separate Programmzeile
# (gruen, nur beim Laufen), Fortschrittsbalken + Restzeit in Owlet-Palette.
# Zustandsfarben: laeuft -> gruen, fertig -> teal, pausiert -> amber, Fehler -> rot,
# sonst gedaempft.
#
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: sensor.463120392821005583_bsh_common_status_operationstate
icon: mdi:tumble-dryer
name: Trockner
show_state: false
show_name: true
show_icon: true
variables:
  progress_entity: sensor.463120392821005583_bsh_common_option_programprogress
  time_entity: sensor.463120392821005583_bsh_common_option_estimatedtotalprogramtime
  program_entity: sensor.463120392821005583_active_program
state:
  - value: BSH.Common.EnumType.OperationState.Run
    spin: true
styles:
  card:
    - padding: 14px 16px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
    - overflow: hidden
    # Statusrand links (wie Personenkarten / Meteoalarm-Popup). Muss NACH
    # "border" stehen, sonst ueberschreibt die Kurzform ihn wieder.
    # "Finished" wird VOR "Run" geprueft - sonst greift der Run-Zweig zuerst.
    - border-left: |
        [[[
          const s = entity.state;
          if (s.includes('Finished')) return '4px solid #7fd0d5';
          if (s.includes('Error'))    return '4px solid #f0736a';
          if (s.includes('Pause'))    return '4px solid #e6b566';
          if (s.includes('Run'))      return '4px solid #a6d49e';
          return '4px solid #2a3346';
        ]]]
  grid:
    - grid-template-areas: '"i n" "i status" "i program" "i progress" "i time"'
    - grid-template-columns: min-content auto
    - grid-template-rows: auto auto auto auto auto
  img_cell:
    - width: 52px
    - height: 52px
    - border-radius: 15px
    - margin-right: 14px
    - align-self: center
    - background: |
        [[[
          const s = entity.state;
          let a = '#6e7988';
          if (s.includes('Finished')) a = '#7fd0d5';
          else if (s.includes('Run')) a = '#a6d49e';
          else if (s.includes('Error')) a = '#f0736a';
          else if (s.includes('Pause')) a = '#e6b566';
          return a + '20';
        ]]]
    - border: |
        [[[
          const s = entity.state;
          let a = '#6e7988';
          if (s.includes('Finished')) a = '#7fd0d5';
          else if (s.includes('Run')) a = '#a6d49e';
          else if (s.includes('Error')) a = '#f0736a';
          else if (s.includes('Pause')) a = '#e6b566';
          return '1px solid ' + a + '40';
        ]]]
  icon:
    - width: 28px
    - height: 28px
    - color: |
        [[[
          const s = entity.state;
          if (s.includes('Finished')) return '#7fd0d5';
          if (s.includes('Run')) return '#a6d49e';
          if (s.includes('Error')) return '#f0736a';
          if (s.includes('Pause')) return '#e6b566';
          return '#6e7988';
        ]]]
  name:
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: '#f2f5f8'
    - text-align: left
    - justify-self: start
    - align-self: end
  custom_fields:
    status:
      - font-size: 13px
      - color: '#6e7988'
      - text-align: left
      - justify-self: start
      - align-self: start
      - margin-top: 2px
    program:
      - font-size: 12.5px
      - font-weight: 600
      - color: '#a6d49e'
      - text-align: left
      - justify-self: start
      - align-self: start
      - padding-bottom: 8px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    progress:
      - width: 100%
      - padding: 2px 0
    time:
      - font-size: 12px
      - color: '#6e7988'
      - text-align: right
      - width: 100%
      - padding-top: 4px
custom_fields:
  status: |
    [[[
      const state = entity.state;
      const stateMap = {
        'BSH.Common.EnumType.OperationState.Inactive':      'Inaktiv',
        'BSH.Common.EnumType.OperationState.Ready':         'Bereit',
        'BSH.Common.EnumType.OperationState.DelayedStart':  'Startverzögerung',
        'BSH.Common.EnumType.OperationState.Run':           'Läuft',
        'BSH.Common.EnumType.OperationState.Pause':         'Pausiert',
        'BSH.Common.EnumType.OperationState.ActionRequired':'Eingriff erforderlich',
        'BSH.Common.EnumType.OperationState.Finished':      'Fertig',
        'BSH.Common.EnumType.OperationState.Error':         'Fehler',
        'BSH.Common.EnumType.OperationState.Aborting':      'Wird abgebrochen',
      };
      return stateMap[state] || state;
    ]]]
  program: |
    [[[
      const operationState = entity.state;
      if (!operationState.includes('Run')) return '';

      const programEntity = states[variables.program_entity];
      if (!programEntity || programEntity.state === 'unavailable' || programEntity.state === 'unknown') return '';

      const programMap = {
        'LaundryCare.Dryer.Program.Cotton':           'Baumwolle',
        'LaundryCare.Dryer.Program.Synthetic':        'Pflegeleicht',
        'LaundryCare.Dryer.Program.Mix':              'Mischgewebe',
        'LaundryCare.Dryer.Program.BusinessShirts':   'Hemden',
        'LaundryCare.Dryer.Program.Delicates':        'Feinwäsche',
        'LaundryCare.Dryer.Program.WoolFinish':       'Wolle',
        'LaundryCare.Dryer.Program.Hygiene':          'Hygiene',
        'LaundryCare.Dryer.Program.Jeans':            'Jeans',
        'LaundryCare.Dryer.Program.Outdoor':          'Outdoor',
        'LaundryCare.Dryer.Program.Towels':           'Handtücher',
        'LaundryCare.Dryer.Program.Sportswear':       'Sportswear',
        'LaundryCare.Dryer.Program.Pillow':           'Kissen',
        'LaundryCare.Dryer.Program.AntiShrink':       'Knitterschutz',
        'LaundryCare.Dryer.Program.MyTime.MyDryingTime': 'Zeittrocknen',
      };

      const label = programMap[programEntity.state] || programEntity.state;
      return label;
    ]]]
  progress: |
    [[[
      const progressEntity = states[variables.progress_entity];
      const progress = progressEntity ? parseFloat(progressEntity.state) || 0 : 0;

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive) return '';

      const color = operationState.includes('Pause') ? '#e6b566' : '#a6d49e';

      return `
        <div style="
          width: 100%;
          background: rgba(255,255,255,0.08);
          border-radius: 5px;
          height: 6px;
          overflow: hidden;
        ">
          <div style="
            width: ${progress}%;
            background: ${color};
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
          "></div>
        </div>
      `;
    ]]]
  time: |
    [[[
      const timeEntity = states[variables.time_entity];
      const progressEntity = states[variables.progress_entity];

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || !timeEntity) return '';

      // State liegt im Format "H:MM" (Stunden:Minuten) vor
      const timeParts = timeEntity.state.split(':');
      let remainingSeconds = 0;
      if (timeParts.length === 2) {
        remainingSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60;
      } else if (timeParts.length === 3) {
        remainingSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60 + parseInt(timeParts[2]);
      }
      if (!remainingSeconds) return '';

      const progress = parseFloat(progressEntity ? progressEntity.state : 0) || 0;

      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);

      let timeStr = '';
      if (hours > 0) timeStr += `${hours} h `;
      timeStr += `${minutes} min`;

      return `${progress.toFixed(0)}% &nbsp;<span style="opacity:0.5">·</span>&nbsp; noch ca. ${timeStr}`;
    ]]]
