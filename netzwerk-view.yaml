# Netzwerk – komplette Ansicht (View) im Owlet-Stil
#
# Bindet die schwebende Navbar, einen Owlet-Header und alle UniFi-Karten per
# !include zu einer fertigen Dashboard-Ansicht zusammen. Passt zur Navbar-Route
# /dashboard-home/netzwerk.
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include netzwerk-view.yaml
#   ODER den Inhalt unterhalb "title:" in die bestehende Netzwerk-View kopieren.
#
# Hinweis zu !include: Die Pfade sind relativ zum Home-Assistant-Konfig-Ordner.
# Liegen die Karten-Dateien in einem Unterordner, den Pfad entsprechend
# voranstellen (z. B. dashboards/unifi-button-card.yaml).
#
# Voraussetzung: custom:button-card + custom:navbar-card + custom:uptime-card
#                + card-mod (alle via HACS).
title: Netzwerk
path: netzwerk
icon: mdi:router-network
type: masonry
cards:
  # Schwebende Navbar (auf Wunsch entfernen, falls global eingebunden)
  - !include navbar-card.yaml

  # ------------------------------ Owlet-Header ------------------------------
  - type: custom:button-card
    icon: mdi:router-network
    name: Netzwerk
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    triggers_update: all
    label: UniFi · Dream Machine SE
    tap_action:
      action: none
    card_mod:
      style: |
        #root {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
          padding: 16px 18px !important;
        }
    custom_fields:
      badge: |
        [[[
          const ids=['sensor.u7_outdoor_state','sensor.u7_outdoor_state_2','sensor.u6_pro_wohnzimmer_state','sensor.u6_pro_spielzimmer_state','sensor.u6_pro_kinderzimmer_state','sensor.u6_pro_state','sensor.usw_pro_max_24_poe_uptime','sensor.dream_machine_special_edition_uptime'];
          const bad=['off','unavailable','disconnected','unknown','offline','none',''];
          let on=0; ids.forEach(id=>{ const s=states[id]; if(s && !bad.includes(String(s.state).toLowerCase())) on++; });
          const c=on===ids.length?'#a6d49e':'#e6b566';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${on}/${ids.length} online</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
      grid:
        - grid-template-areas: '"i n badge" "i l badge"'
        - grid-template-columns: min-content 1fr min-content
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 48px
        - height: 48px
        - border-radius: 14px
        - margin-right: 15px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 25px
        - height: 25px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: end
        - font-size: 21px
        - font-weight: 750
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12.5px
        - color: '#6e7988'
        - margin-top: 2px
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center

  # --------------------------- UniFi-Karten (Owlet) ---------------------------
  # Internet + Infrastruktur (bestehende Karte)
  - !include unifi-button-card.yaml
  # UDM SE · Systemzustand (CPU / RAM / Temperatur / Uptime)
  - !include unifi-udm-system-button-card.yaml
  # WAN · Durchsatz live (Rx / Tx)
  - !include unifi-wan-durchsatz-button-card.yaml
  # Clients (WLAN gesamt / APs online / Gäste)
  - !include unifi-clients-button-card.yaml
  # Steuerung (Schnellaktionen)
  - !include unifi-steuerung-button-card.yaml
