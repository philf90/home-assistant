# Kombinierte Fenster-/Tueren-Status fuer den Passat (OF - LC 728).
#
# Fasst die je vier Einzel-Kontakte zu einem Gesamt-Status zusammen:
#   binary_sensor.passat_fenster  -> "on" (offen), wenn irgendein Fenster offen ist
#   binary_sensor.passat_tueren   -> "on" (offen), wenn irgendeine Tuer offen ist
# Attribut "geoeffnet" liefert zusaetzlich die Anzahl offener Kontakte.
#
# Einbinden in configuration.yaml, z. B.:
#   template: !include template-autos-passat.yaml
# oder den Inhalt in einen bestehenden `template:`-Block kopieren.
#
# Danach koennen in autos-button-card.yaml die Fenster-/Tueren-Chips optional
# auf diese Sammel-Entitaeten umgestellt werden (statt der In-Karte-Zaehlung).
- binary_sensor:
    - name: Passat Fenster
      unique_id: passat_of_lc728_fenster_kombiniert
      device_class: window
      icon: >-
        {{ 'mdi:window-open-variant' if this.state == 'on' else 'mdi:window-closed-variant' }}
      state: >-
        {{ ['binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_vorne_links',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_vorne_rechts',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_hinten_links',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_hinten_rechts']
           | select('is_state', 'on') | list | count > 0 }}
      attributes:
        geoeffnet: >-
          {{ ['binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_vorne_links',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_vorne_rechts',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_hinten_links',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_fenster_hinten_rechts']
             | select('is_state', 'on') | list | count }}
    - name: Passat Türen
      unique_id: passat_of_lc728_tueren_kombiniert
      device_class: door
      icon: mdi:car-door
      state: >-
        {{ ['binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_vorne_links',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_vorne_rechts',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_hinten_links',
            'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_hinten_rechts']
           | select('is_state', 'on') | list | count > 0 }}
      attributes:
        geoeffnet: >-
          {{ ['binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_vorne_links',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_vorne_rechts',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_hinten_links',
              'binary_sensor.passat_variant_elegance_20_l_tdi_scr_tur_hinten_rechts']
             | select('is_state', 'on') | list | count }}
