# Begrüßungs-Banner im Design der überarbeiteten Owlet-Smart-Sock-Karte
# Gleiche Kartenhuelle, Palette (#a6d49e / #f2f5f8 / #6e7988) und Typografie wie
# owlet-smart-sock-button-card.yaml.
#
# Aufbau: Foto des angemeldeten Nutzers links, Begruessung "Hi, <Name>!" mit
# statusabhaengigem Untertitel, rechts Wetter (Aussentemperatur + Zustand-Icon)
# und darunter Wochentag/Datum.
# Nutzer nicht zu Hause -> Foto in Graustufen, Untertitel wechselt.
#
# Wetter-Quellen (hybrid): Das Zustand-Icon kommt aus der weather-Entitaet, die
# angezeigte Temperatur ist der lokale Messwert der HomematicIP Wetterstation.
# Die Station liefert keinen Wetterzustand, daher bleibt das Icon bei der
# Vorhersage.
#
# Anpassen: variables.weather_entity auf die eigene weather-Entitaet und
# variables.temperature_entity auf den eigenen Aussentemperatur-Sensor setzen.
# Beide zusaetzlich in triggers_update eintragen -- die Karte rendert sonst nur
# bei einer Zustandsaenderung der eigenen entity (Person) neu, und die per
# states[...] gelesenen Wetterwerte bleiben bis zum naechsten Reload stehen.
# triggers_update wird nicht getemplatet, daher die IDs dort ausgeschrieben.
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: '[[[ return "person." + user.name.toLowerCase() ]]]'
variables:
  weather_entity: weather.forecast_home
  temperature_entity: sensor.wetterstation_pro_temperatur
triggers_update:
  - weather.forecast_home
  - sensor.wetterstation_pro_temperatur
tap_action:
  action: more-info
show_name: false
show_state: false
show_icon: false
show_label: false
styles:
  card:
    - padding: 16px 20px
    - border-radius: 24px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
    - overflow: hidden
  grid:
    - grid-template-areas: '"body"'
  custom_fields:
    body:
      - width: 100%
      - min-width: 0
custom_fields:
  body: |
    [[[
      // ---------- Palette (identisch zur Owlet-Karte) ----------
      const green = '#a6d49e';
      const value = '#f2f5f8';
      const muted = '#6e7988';

      // ---------- Nutzer / Begruessung ----------
      const me = entity;
      const meHome = me && me.state === 'home';
      const uname = (typeof user !== 'undefined' && user && user.name)
        ? user.name
        : ((me && me.attributes && me.attributes.friendly_name) || '');
      // Tageszeit-abhaengige Begruessung (kurz -> bricht nie um)
      const h = new Date().getHours();
      const timeGreeting =
        (h >= 5  && h < 11) ? 'Guten Morgen' :
        (h >= 11 && h < 17) ? 'Guten Tag' :
        (h >= 17 && h < 22) ? 'Guten Abend' :
                              'Gute Nacht';
      const subtitle = meHome ? 'Willkommen zu Hause' : 'Aktuell unterwegs';
      const mePic  = me && me.attributes ? me.attributes.entity_picture : null;
      const meInit = uname ? uname.trim().charAt(0).toUpperCase() : '?';
      const meAccent = meHome ? green : 'rgba(255,255,255,0.08)';
      const meGray = meHome ? '' : 'filter:grayscale(100%);opacity:0.7;';

      const meDim = 'width:52px;height:52px;flex:none;';
      const mePhoto = mePic
        ? `<img src="${mePic}" style="${meDim}border-radius:16px;object-fit:cover;box-sizing:border-box;border:2px solid ${meAccent};${meGray}"/>`
        : `<div style="${meDim}border-radius:16px;display:grid;place-items:center;font-size:21px;font-weight:700;color:#12161f;box-sizing:border-box;background:linear-gradient(160deg,#4a5a74,#33404f);border:2px solid ${meAccent};${meGray}">${meInit}</div>`;

      // ---------- Datum ----------
      const now = new Date();
      const wd = now.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
      const dm = now.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
      const dateStr = wd + ' · ' + dm;

      // ---------- Wetter ----------
      // Zustand (fuer das Icon) aus der Vorhersage-Entitaet.
      const w = states[variables.weather_entity];
      const wBad = !w || w.state === 'unavailable' || w.state === 'unknown';
      const cond = wBad ? '' : w.state;

      // Temperatur bevorzugt als lokaler Messwert der Wetterstation; faellt auf
      // die Vorhersage zurueck, wenn der Sensor keinen Wert liefert.
      const ts = states[variables.temperature_entity];
      const tsBad = !ts || ts.state === 'unavailable' || ts.state === 'unknown';
      const tLocal = tsBad ? NaN : parseFloat(ts.state);
      const tAttr = (w && w.attributes && w.attributes.temperature !== undefined) ? w.attributes.temperature : null;
      const tVal = !isNaN(tLocal) ? tLocal : tAttr;
      const tempTxt = (tVal === null || tVal === undefined || isNaN(tVal)) ? '–' : Math.round(tVal);

      // Zustand -> Icon + Farbe (Owlet-Linienstil)
      const wxIcon = (c) => {
        const S = (inner, stroke) => `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;flex:none;">${inner}</svg>`;
        const sun   = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>';
        const moon  = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>';
        const cloud = '<path d="M7 18h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 9.4 3.8 3.8 0 0 0 7 18Z"/>';
        const pcloud= '<circle cx="8.5" cy="7.5" r="3"/><path d="M8.5 2.5v1.4M13.5 7.5h-1.4M12 4l-1 1M5 4l1 1"/><path d="M9 19h8a3.2 3.2 0 0 0 .3-6.4A4.6 4.6 0 0 0 8.7 11 3.5 3.5 0 0 0 9 19Z"/>';
        const rain  = '<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M8.5 18l-1 2.2M12 18l-1 2.2M15.5 18l-1 2.2"/>';
        const snow  = '<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>';
        const bolt  = '<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path d="M12.5 13l-2.5 4h3l-2 4"/>';
        const fog   = '<path d="M5 9h14M4 13h16M6 17h12"/>';
        const wind  = '<path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a3 3 0 1 1-3 3M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/>';
        const warm='#e6b566', grey='#8794a5', blue='#7fb3d5', ice='#cfe3f2', night='#9aa7bd';
        const map = {
          'sunny':[sun,warm], 'clear-night':[moon,night], 'partlycloudy':[pcloud,warm],
          'cloudy':[cloud,grey], 'fog':[fog,grey],
          'rainy':[rain,blue], 'pouring':[rain,blue], 'lightning-rainy':[bolt,warm],
          'hail':[snow,ice], 'snowy-rainy':[snow,ice], 'snowy':[snow,ice],
          'lightning':[bolt,warm], 'windy':[wind,grey], 'windy-variant':[wind,grey],
          'exceptional':[cloud,grey]
        };
        const e = map[c] || [cloud, grey];
        return S(e[0], e[1]);
      };

      const weatherBlock = `
        <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-left:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            ${wxIcon(cond)}
            <span style="font-size:26px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1;color:${value};">${tempTxt}°</span>
          </div>
          <div style="font-size:13px;color:${muted};line-height:1.2;white-space:nowrap;">${dateStr}</div>
        </div>`;

      // ---------- Aufbau ----------
      return `
        <div style="display:flex;align-items:center;gap:16px;width:100%;box-sizing:border-box;overflow:hidden;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
          ${mePhoto}
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto;">
            <div style="font-size:13px;color:${muted};line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${timeGreeting}</div>
            <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${uname}</div>
            <div style="font-size:13px;color:${muted};line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${subtitle}</div>
          </div>
          ${weatherBlock}
        </div>`;
    ]]]
