# HINWEIS PLATZHALTER: Zigbee-IEEE-Adresse in der Entity-ID (ieee_adresse)
# Anonymisiert -- vor dem Einfuegen durch die eigenen Werte ersetzen.
# Tabelle und Vorgehen: README.md, Abschnitt "Platzhalter ersetzen".
#
# Pflanzen – komplette Ansicht (View) im Owlet-Stil, ohne custom:flower-card
#
# Ersetzt die sieben flower-cards und die Statusliste
# (pflanzen-flower-card.yaml, pflanzen-status-button-card.yaml; beide bleiben
# als aeltere Fassung im Repo).
#
#   Kopfkarte    Zusammenfassung der Bodenfeuchte ("2 zu trocken · 1 zu nass")
#                und das Klima am Standort (Temperatur, Luftfeuchte, Licht der
#                Wetterstation) -- einmal statt in jeder Pflanzenkarte, weil
#                alle Pflanzen dieselbe Wetterstation nutzen
#   je Pflanze   Template owlet_pflanze: Foto, Art, Status-Pille, Kacheln
#                Bodenfeuchte und Bodentemperatur mit Sollband, Akku und
#                Sensorname; Antippen: Popup mit Bodenfeuchte 7 Tage;
#                Knopf "Abgeerntet" -> statt der Werte eine schmale Zeile mit
#                "Wieder bepflanzt". Die Kopfkarte zaehlt abgeerntete Pflanzen
#                nicht mit. Die Plant-Integration misst weiter (nur Anzeige).
#
# Farben: Abweichung vom Sollbereich amber (Hinweis), im Sollbereich gruen,
# keine Daten grau. Rot nur beim Akku unter 15 % (wie person-presence-…).
# Die Grenzwerte kommen live aus den number.<pflanze>_min_/max_…-Entities der
# Plant-Integration.
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include pflanzen-view.yaml
#   Das Template owlet_pflanze steht in pflanzen-decluttering-templates.yaml.
#
# Voraussetzung: custom:button-card (v7) + custom:decluttering-card
#                + custom:apexcharts-card + browser_mod (alle via HACS),
#                Integration "Home Assistant
#                Plant" (Olen/homeassistant-plant, HACS), je Pflanze ein
#                Helfer input_boolean.<pflanze>_abgeerntet (Schalter, ohne
#                Anfangswert, damit er Neustarts uebersteht), Templates aus
#                decluttering-templates.yaml und
#                pflanzen-decluttering-templates.yaml.
type: sections
max_columns: 3
title: Pflanzen
path: pflanzen
icon: mdi:flower
sections:
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: top_navigation
      # Kopf: Zusammenfassung + Klima am Standort (einmal statt 7x)
      - type: custom:button-card
        name: Pflanzen
        icon: mdi:sprout
        show_icon: true
        show_name: true
        tap_action:
          action: none
        variables:
          pflanzen: [erdbeeren, tomaten, pimentos, gurken, aprikosenbaum, olivenbaum, bananen]
        custom_fields:
          summary: |
            [[[
              const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
              const aktiv=variables.pflanzen.filter(p=>{const s=states[`input_boolean.${p}_abgeerntet`];return !(s&&s.state==='on');});
              let tr=0, na=0;
              aktiv.forEach(p=>{
                const f=zahl(`sensor.${p}_bodenfeuchtigkeit`);
                if(f<zahl(`number.${p}_min_bodenfeuchtigkeit`)) tr++;
                else if(f>zahl(`number.${p}_max_bodenfeuchtigkeit`)) na++;
              });
              const teile=[];
              if(tr) teile.push(`${tr} zu trocken`);
              if(na) teile.push(`${na} zu nass`);
              // Status-Pille wie die Kopf-Badges der anderen Views (Energie, Gesundheit, Fenster)
              const c=teile.length?'#e6b566':'#a6d49e';
              return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}1f;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:11px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${teile.length?teile.join(' · '):'Boden überall im Soll'}</span>`;
            ]]]
          klima: |
            [[[
              const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
              const de=(v,d)=>Number.isFinite(v)?v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
              const t=zahl('sensor.wetterstation_pro_temperatur');
              const h=zahl('sensor.wetterstation_pro_luftfeuchtigkeit');
              const l=zahl('sensor.wetterstation_pro_beleuchtungsstarke');
              const aktiv=variables.pflanzen.filter(p=>{const s=states[`input_boolean.${p}_abgeerntet`];return !(s&&s.state==='on');});
              const ueber=aktiv.filter(p=>h>zahl(`number.${p}_max_luftfeuchtigkeit`)).length;
              const hCol=ueber?'#e6b566':'#a6d49e';
              const chip=(icon,wert,col)=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:11px;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);color:#f2f5f8;font-size:12.5px;font-weight:650;white-space:nowrap;"><ha-icon icon="${icon}" style="--mdc-icon-size:15px;width:15px;height:15px;display:flex;color:${col};"></ha-icon>${wert}</span>`;
              const hinweis=ueber?`<div style="font-size:11.5px;color:#e6b566;margin-top:6px;">Luftfeuchte über Soll bei ${ueber} von ${aktiv.length} Pflanzen</div>`:'';
              return `<div style="display:flex;flex-wrap:wrap;gap:6px;">${chip('mdi:thermometer',de(t,1)+' °C','#7fb3d5')}${chip('mdi:water-percent',de(h,0)+' %',hCol)}${chip('mdi:white-balance-sunny',de(l,0)+' lx','#e6c15a')}</div>${hinweis}<div style="font-size:11px;color:#8794a5;margin-top:6px;">Klima am Standort · Wetterstation, gilt für alle Pflanzen</div>`;
            ]]]
        styles:
          card:
            - padding: 16px 18px
            - border-radius: 22px
            - border: 1px solid rgba(255, 255, 255, 0.05)
            - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
            - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
          grid:
            - grid-template-areas: '"i n summary" "klima klima klima"'
            - grid-template-columns: min-content 1fr min-content
            - grid-template-rows: min-content min-content
            - row-gap: 12px
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - background: 'rgba(166, 212, 158, 0.16)'
            - border: 1px solid rgba(166, 212, 158, 0.24)
          icon:
            - width: 23px
            - color: '#a6d49e'
          name:
            - justify-self: start
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          custom_fields:
            summary:
              - justify-self: end
            klima:
              - justify-self: start
              - text-align: left
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: erdbeeren
          - akku: sensor.erdbeeren_battery
          - sensor: Erdbeeren
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: tomaten
          - akku: sensor.ieee_adresse_battery
          - sensor: Hochbeet links
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: pimentos
          - akku: sensor.hochbeet_rechts_battery
          - sensor: Hochbeet rechts
          - hinweis: geteilt mit Gurken
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: gurken
          - akku: sensor.hochbeet_rechts_battery
          - sensor: Hochbeet rechts
          - hinweis: geteilt mit Pimentos
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: aprikosenbaum
          - akku: sensor.aprikosenbaum_battery
          - sensor: Aprikosenbaum
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: olivenbaum
          - akku: sensor.olivenbaum_battery
          - sensor: Olivenbaum
      - type: custom:decluttering-card
        template: owlet_pflanze
        variables:
          - pflanze: bananen
          - akku: sensor.bananen_battery
          - sensor: Bananen
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: floating_navbar
