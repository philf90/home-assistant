# "Fenster & Lichter" im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Ersetzt die custom:bubble-card durch einen custom:button-card-Nachbau.
#
# - Owlet-Huelle, Palette und rundlich-quadratische Icon-Kachel wie die
#   anderen Karten.
# - Zwei Chips rechts (offene Fenster/Tueren + Lichter an) mit eigener
#   Tap-Navigation; Farbe je Zustand: nichts offen/aus -> gruen bzw. gedaempft,
#   offen -> blau, Licht an -> amber.
# - Haupt-Tap toggelt weiterhin light.alle_lichter.
#
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: light.alle_lichter
name: Fenster & Lichter
show_icon: true
show_name: true
show_state: false
show_label: false
icon: mdi:home-lightbulb
tap_action:
  action: toggle
styles:
  card:
    - padding: 14px 16px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: '0 18px 44px -22px rgba(0,0,0,0.7)'
    - overflow: hidden
  grid:
    - grid-template-areas: '"i n c1 c2"'
    - grid-template-columns: min-content 1fr min-content min-content
    - grid-template-rows: min-content
  img_cell:
    - width: 46px
    - height: 46px
    - border-radius: 14px
    - background: 'linear-gradient(160deg, #313a46 0%, #2a323d 100%)'
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - margin-right: 15px
  icon:
    - width: 24px
    - height: 24px
    - color: '#a6d49e'
  name:
    - justify-self: start
    - align-self: center
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: '#f2f5f8'
  custom_fields:
    c1:
      - align-self: center
      - justify-self: end
    c2:
      - align-self: center
      - justify-self: end
      - margin-left: 8px
custom_fields:
  # ---------- Chip 1: offene Fenster & Tueren ----------
  c1:
    card:
      type: custom:button-card
      entity: sensor.summe_offene_fenster_turen
      show_name: false
      show_icon: true
      show_state: true
      icon: |
        [[[ return (parseFloat(entity.state) || 0) > 0 ? 'mdi:window-open' : 'mdi:window-closed'; ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/lichter-fenster-temp
      styles:
        card:
          - padding: 7px 13px 7px 11px
          - border-radius: 999px
          - box-shadow: none
          - background: |
              [[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? 'rgba(127,179,213,0.15)' : 'rgba(166,212,158,0.12)';
              ]]]
          - border: |
              [[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? '1px solid rgba(127,179,213,0.32)' : '1px solid rgba(166,212,158,0.28)';
              ]]]
        grid:
          - grid-template-areas: '"i s"'
          - grid-template-columns: min-content min-content
          - grid-template-rows: min-content
          - align-items: center
        img_cell:
          - width: 18px
          - height: 18px
          - margin-right: 7px
          - align-self: center
          - margin-top: -4px
        icon:
          - width: 18px
          - height: 18px
          - align-self: center
          - transform: translateY(-2px)
          - color: |
              [[[ return (parseFloat(entity.state) || 0) > 0 ? '#7fb3d5' : '#a6d49e'; ]]]
        state:
          - font-size: 15px
          - font-weight: 700
          - font-variant-numeric: tabular-nums
          - line-height: 1
          - color: |
              [[[ return (parseFloat(entity.state) || 0) > 0 ? '#f2f5f8' : '#a6d49e'; ]]]
  # ---------- Chip 2: Lichter an ----------
  c2:
    card:
      type: custom:button-card
      entity: sensor.lichter_an
      show_name: false
      show_icon: true
      show_state: true
      icon: |
        [[[ return (parseFloat(entity.state) || 0) > 0 ? 'mdi:lightbulb-group' : 'mdi:lightbulb-outline'; ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/lichter-fenster-temp
      styles:
        card:
          - padding: 7px 13px 7px 11px
          - border-radius: 999px
          - box-shadow: none
          - background: |
              [[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? 'rgba(230,181,102,0.15)' : 'rgba(255,255,255,0.05)';
              ]]]
          - border: |
              [[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? '1px solid rgba(230,181,102,0.32)' : '1px solid rgba(255,255,255,0.08)';
              ]]]
        grid:
          - grid-template-areas: '"i s"'
          - grid-template-columns: min-content min-content
          - grid-template-rows: min-content
          - align-items: center
        img_cell:
          - width: 18px
          - height: 18px
          - margin-right: 7px
          - align-self: center
          - margin-top: -4px
        icon:
          - width: 18px
          - height: 18px
          - align-self: center
          - transform: translateY(-2px)
          - color: |
              [[[ return (parseFloat(entity.state) || 0) > 0 ? '#e6b566' : '#6e7988'; ]]]
        state:
          - font-size: 15px
          - font-weight: 700
          - font-variant-numeric: tabular-nums
          - line-height: 1
          - color: |
              [[[ return (parseFloat(entity.state) || 0) > 0 ? '#f2f5f8' : '#6e7988'; ]]]
