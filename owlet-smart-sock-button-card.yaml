# Owlet Smart Sock – Widget im Design des offiziellen Screenshots
# Kopfzeile (Baby-Kachel + Titel + Schlafzustand) über einem 2x2-Metrik-Raster.
# Werte + Icons färben sich anhand medizinischer Schwellwerte; bei gesunden
# Werten bleibt alles grün.
#
# Jede Kachel ist eine EIGENE button-card -> Tap = more-info der jeweiligen
# Entität (Kopf = Schlafzustand). Owlet-Huelle liegt als card_mod-Shell auf
# dem umgebenden vertical-stack.
#
# Die Karte wird nur angezeigt, wenn ein Schlafzustand erkannt wird (auch "Wach").
# Ohne Messung (Socke am Laden / nicht getragen -> Sensor unavailable/unknown)
# blendet der conditional-Wrapper die Karte komplett aus.
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: conditional
conditions:
  - entity: sensor.owlet_sock_ac000w042836543_sleep_state
    state_not: unavailable
  - entity: sensor.owlet_sock_ac000w042836543_sleep_state
    state_not: unknown
card:
  type: vertical-stack
  card_mod:
    style: |
      #root {
        background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 22px !important;
        box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
        padding: 16px 18px 18px !important;
        gap: 18px !important;
      }
  cards:
    # ---------------------------- Kopfzeile ----------------------------
    - type: custom:button-card
      entity: sensor.owlet_sock_ac000w042836543_sleep_state
      show_name: false
      show_state: false
      show_icon: false
      show_label: false
      tap_action:
        action: more-info
      styles: &bare
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 0
          - text-align: left
        grid:
          - grid-template-areas: '"cell"'
          - justify-items: start
        custom_fields:
          cell:
            - width: 100%
            - justify-self: start
      custom_fields:
        cell: |
          [[[
            const green='#a6d49e', muted='#6e7988';
            const slp=(typeof entity!=='undefined')?entity:null;
            const bad=(!slp||slp.state==='unavailable'||slp.state==='unknown');
            const sleepMap={awake:'Wach',light_sleep:'Leichter Schlaf',deep_sleep:'Tiefschlaf',movement:'Bewegung'};
            const sleepLabel=bad?'–':(sleepMap[slp.state]||slp.state);
            const icoBaby=`<svg viewBox="0 0 48 48" fill="none" stroke="${green}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:34px;height:34px;"><path d="M37 25a13 13 0 1 1-26 0 13 13 0 0 1 26 0Z"/><path d="M24 11.7c-.3-2.4 1.3-4.2 3.4-3.6 1.7.5 2 2.8.3 3.6"/><circle cx="19" cy="24" r="1.5" fill="${green}" stroke="none"/><circle cx="29" cy="24" r="1.5" fill="${green}" stroke="none"/><path d="M19.5 30c1.9 2.6 7.1 2.6 9 0"/></svg>`;
            const icoSleep=`<svg viewBox="0 0 24 24" fill="none" stroke="${green}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M4 9.5c2-2.6 4-2.6 6 0s4 2.6 6 0"/><path d="M6 15c1.7-2.1 3.4-2.1 5.1 0s3.4 2.1 5.1 0"/></svg>`;
            return `<div style="display:flex;align-items:center;gap:15px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
              <div style="flex:0 0 auto;width:60px;height:60px;border-radius:16px;background:linear-gradient(160deg,#313a46 0%,#2a323d 100%);border:1px solid rgba(255,255,255,0.04);display:grid;place-items:center;">${icoBaby}</div>
              <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1 1 auto;text-align:left;">
                <div style="font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;color:#f2f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;">Owlet Smart Sock</div>
                <div style="display:inline-flex;align-items:center;gap:7px;color:${muted};font-size:14.5px;">${icoSleep}<span>${sleepLabel}</span></div>
              </div>
            </div>`;
          ]]]
    # ------------------------- 2x2 Metrik-Raster -------------------------
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:button-card
          entity: sensor.owlet_sock_ac000w042836543_heart_rate
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          tap_action: { action: more-info }
          variables: { kind: heart, unit: bpm, label: Herzfrequenz, decimals: 0, badLow: 60, warnLow: 80, warnHigh: 180, badHigh: 220 }
          styles: *bare
          custom_fields:
            cell: &cell_tpl |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                const green='#a6d49e', value='#f2f5f8', muted='#6e7988';
                const bad=(e===null||e.state==='unavailable'||e.state==='unknown');
                const v=bad?NaN:parseFloat(e.state);
                let c=muted;
                if(!bad && !isNaN(v)){
                  const V=variables;
                  const isBadv=(V.badLow!=null && v<V.badLow)||(V.badHigh!=null && v>V.badHigh);
                  const isWarn=(V.warnLow!=null && v<V.warnLow)||(V.warnHigh!=null && v>V.warnHigh);
                  c=isBadv?'#f0736a':(isWarn?'#e6b566':green);
                }
                const d=(variables.decimals===undefined?0:variables.decimals);
                const num=isNaN(v)?'–':v.toFixed(d).replace('.',',');
                const icons={
                  heart:`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><path d="M2 13h4.5L8.5 7 11 17l2-7 1.5 3H22"/></svg>`,
                  oxy:`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><path d="M12 5c-1 3-3 5-4 8-.7 2 .8 3.6 3 3 .6-.2 1-.8 1-1.6"/><path d="M12 5c1 3 3 5 4 8 .7 2-.8 3.6-3 3-.6-.2-1-.8-1-1.6"/></svg>`,
                  temp:`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><path d="M12 9.2v5.2"/><circle cx="12" cy="17.4" r="1.9" fill="${c}" stroke="none"/></svg>`,
                  bat:`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><rect x="2.5" y="8" width="16.5" height="8" rx="2.4"/><rect x="4.4" y="9.9" width="10.6" height="4.2" rx="1.2" fill="${c}" stroke="none"/><path d="M21.4 10.7v2.6"/></svg>`
                };
                const icon=icons[variables.kind]||'';
                return `<div style="display:flex;align-items:center;gap:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                  <div style="flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;">${icon}</div>
                  <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
                    <div style="display:flex;align-items:baseline;gap:6px;line-height:1.05;">
                      <span style="font-size:22px;font-weight:700;letter-spacing:-0.01em;color:${value};font-variant-numeric:tabular-nums;">${num}</span>
                      <span style="font-size:13px;color:${muted};">${variables.unit}</span>
                    </div>
                    <div style="font-size:12.5px;color:${muted};">${variables.label}</div>
                  </div>
                </div>`;
              ]]]
        - type: custom:button-card
          entity: sensor.owlet_sock_ac000w042836543_o2_saturation
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          tap_action: { action: more-info }
          variables: { kind: oxy, unit: '%', label: 'SpO<sub>2</sub>', decimals: 0, badLow: 90, warnLow: 95 }
          styles: *bare
          custom_fields: { cell: *cell_tpl }
        - type: custom:button-card
          entity: sensor.owlet_sock_ac000w042836543_skin_temperature
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          tap_action: { action: more-info }
          variables: { kind: temp, unit: °C, label: Hauttemp., decimals: 1, badLow: 34.0, warnLow: 35.5, warnHigh: 37.5, badHigh: 38.5 }
          styles: *bare
          custom_fields: { cell: *cell_tpl }
        - type: custom:button-card
          entity: sensor.owlet_sock_ac000w042836543_battery_percentage
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          tap_action: { action: more-info }
          variables: { kind: bat, unit: '%', label: Akku, decimals: 0, badLow: 15, warnLow: 30 }
          styles: *bare
          custom_fields: { cell: *cell_tpl }
