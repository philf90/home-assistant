# Owlet Smart Sock – Widget im Design des offiziellen Screenshots
# Kopfzeile (Smiley-Kachel + Titel + Schlafzustand) über einem 2x2-Metrik-Raster.
# Werte + Icons färben sich anhand medizinischer Schwellwerte; bei gesunden
# Werten bleibt alles grün – exakt wie im Screenshot.
#
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: sensor.owlet_smart_sock_heart_rate
show_name: false
show_state: false
show_icon: false
show_label: false

variables:
  heart_rate_entity: sensor.owlet_smart_sock_heart_rate
  oxygen_entity: sensor.owlet_smart_sock_oxygen_saturation
  skin_temp_entity: sensor.owlet_smart_sock_skin_temperature
  battery_entity: sensor.owlet_smart_sock_battery_level
  sleep_state_entity: sensor.owlet_sock_ac000w042836543_sleep_state
  # Farbpalette aus dem Screenshot
  c_green: '#a6d49e'
  c_value: '#f2f5f8'
  c_muted: '#6e7988'

styles:
  card:
    - padding: '26px 30px 30px'
    - border-radius: 30px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: '0 24px 60px -24px rgba(0,0,0,0.7)'
  grid:
    - grid-template-areas: '"body"'
  custom_fields:
    body:
      - width: 100%

custom_fields:
  body: |
    [[[
      // ---------- Helfer ----------
      const V = variables;
      const s = (id) => states[id];
      const isBad = (e) => !e || e.state === 'unavailable' || e.state === 'unknown';

      // Deutsche Zahl (Komma) mit fester Nachkommastelle
      const de = (num, digits) => {
        if (num === null || num === undefined || isNaN(num)) return '–';
        return num.toFixed(digits).replace('.', ',');
      };

      // ---------- Werte einlesen ----------
      const hr   = s(V.heart_rate_entity);
      const ox   = s(V.oxygen_entity);
      const tmp  = s(V.skin_temp_entity);
      const bat  = s(V.battery_entity);
      const slp  = s(V.sleep_state_entity);

      const green = V.c_green;
      const value = V.c_value;
      const muted = V.c_muted;

      // ---------- Farb-Bewertung (grün/orange/rot) ----------
      const heartColor = (() => {
        if (isBad(hr)) return muted;
        const b = parseFloat(hr.state) || 0;
        if (b < 60 || b > 220) return '#f0736a';
        if (b < 80 || b > 180) return '#e6b566';
        return green;
      })();

      const oxyColor = (() => {
        if (isBad(ox)) return muted;
        const o = parseFloat(ox.state) || 0;
        if (o < 90) return '#f0736a';
        if (o < 95) return '#e6b566';
        return green;
      })();

      const tempColor = (() => {
        if (isBad(tmp)) return muted;
        const t = parseFloat(tmp.state) || 0;
        if (t < 34.0 || t > 38.5) return '#f0736a';
        if (t < 35.5 || t > 37.5) return '#e6b566';
        return green;
      })();

      const batColor = (() => {
        if (isBad(bat)) return muted;
        const l = parseFloat(bat.state) || 0;
        if (l < 15) return '#f0736a';
        if (l < 30) return '#e6b566';
        return green;
      })();

      // ---------- Schlafzustand ----------
      const sleepMap = {
        'awake':        'Wach',
        'light_sleep':  'Leichter Schlaf',
        'deep_sleep':   'Tiefschlaf',
        'movement':     'Bewegung',
      };
      const sleepLabel = isBad(slp) ? '–' : (sleepMap[slp.state] || slp.state);

      // ---------- Icons (identisch zum Mockup) ----------
      const icoBaby = `<svg viewBox="0 0 48 48" fill="none" stroke="${green}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:46px;height:46px;">
        <circle cx="18" cy="20" r="0.6"/><circle cx="30" cy="20" r="0.6"/>
        <path d="M16 28c2 3 4.4 4.5 8 4.5S30 31 32 28"/></svg>`;

      const icoSleep = `<svg viewBox="0 0 24 24" fill="none" stroke="${green}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;">
        <path d="M4 9.5c2-2.6 4-2.6 6 0s4 2.6 6 0"/>
        <path d="M6 15c1.7-2.1 3.4-2.1 5.1 0s3.4 2.1 5.1 0"/></svg>`;

      const icoHeart = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
        <path d="M2 13h4.5L8.5 7 11 17l2-7 1.5 3H22"/></svg>`;

      const icoOxy = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
        <path d="M12 5c-1 3-3 5-4 8-.7 2 .8 3.6 3 3 .6-.2 1-.8 1-1.6"/>
        <path d="M12 5c1 3 3 5 4 8 .7 2-.8 3.6-3 3-.6-.2-1-.8-1-1.6"/></svg>`;

      const icoTemp = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
        <path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/>
        <path d="M12 9.2v5.2"/><circle cx="12" cy="17.4" r="1.9" fill="${c}" stroke="none"/></svg>`;

      const icoBat = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
        <rect x="2.5" y="8" width="16.5" height="8" rx="2.4"/>
        <rect x="4.4" y="9.9" width="10.6" height="4.2" rx="1.2" fill="${c}" stroke="none"/>
        <path d="M21.4 10.7v2.6"/></svg>`;

      // ---------- Eine Metrik-Zelle ----------
      const cell = (icon, num, unit, label) => `
        <div style="display:flex; align-items:center; gap:16px;">
          <div style="flex:0 0 auto; width:32px; height:32px; display:grid; place-items:center;">${icon}</div>
          <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
            <div style="display:flex; align-items:baseline; gap:7px; line-height:1.05;">
              <span style="font-size:27px; font-weight:700; letter-spacing:-0.01em; color:${value}; font-variant-numeric:tabular-nums;">${num}</span>
              <span style="font-size:16px; color:${muted};">${unit}</span>
            </div>
            <div style="font-size:16px; color:${muted};">${label}</div>
          </div>
        </div>`;

      // ---------- Aufbau ----------
      const hrTxt  = isBad(hr)  ? '–' : de(parseFloat(hr.state), 0);
      const oxTxt  = isBad(ox)  ? '–' : de(parseFloat(ox.state), 0);
      const tmpTxt = isBad(tmp) ? '–' : de(parseFloat(tmp.state), 1);
      const batTxt = isBad(bat) ? '–' : de(parseFloat(bat.state), 0);

      return `
        <div style="width:100%; color:${value}; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; text-align:left;">

          <!-- Kopfzeile -->
          <div style="display:flex; align-items:center; gap:20px;">
            <div style="flex:0 0 auto; width:92px; height:92px; border-radius:22px; background:linear-gradient(160deg,#313a46 0%,#2a323d 100%); border:1px solid rgba(255,255,255,0.04); display:grid; place-items:center;">${icoBaby}</div>
            <div style="display:flex; flex-direction:column; gap:6px; min-width:0;">
              <div style="font-size:27px; font-weight:700; letter-spacing:-0.01em; line-height:1.1;">Owlet Smart Sock</div>
              <div style="display:inline-flex; align-items:center; gap:8px; color:${muted}; font-size:19px;">
                ${icoSleep}<span>${sleepLabel}</span>
              </div>
            </div>
          </div>

          <!-- Metriken -->
          <div style="margin-top:30px; display:grid; grid-template-columns:1fr 1fr; row-gap:28px; column-gap:24px;">
            ${cell(icoHeart(heartColor), hrTxt, 'bpm', 'Herzfrequenz')}
            ${cell(icoOxy(oxyColor),   oxTxt, '%',   'SpO<sub>2</sub>')}
            ${cell(icoTemp(tempColor), tmpTxt, '°C', 'Hauttemp.')}
            ${cell(icoBat(batColor),   batTxt, '%',  'Akku')}
          </div>
        </div>`;
    ]]]
