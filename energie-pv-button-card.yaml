        name: Solarleistung
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { kind: pv, decimals: 0, unit: W }
        label: *lbl_num
        styles: *tile_styles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solar_pv1
            icon: mdi:solar-panel
            name: PV1
            show_icon: true
            show_name: true
            show_label: true
