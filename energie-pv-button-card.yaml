# Energie- & PV-Ansicht im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
# Variante B: Hero "Jetzt" (Akku-Ring + Live-Leistungen) + drei Detail-Sektionen.
#
# Jede Kachel ist eine EIGENE button-card -> nativ klickbar (Tap = more-info).
# (Inline-onclick wird von HAs CSP blockiert und funktioniert nicht.)
# Gemeinsame Optik ueber YAML-Anker: &shell (Owlet-Huelle), &header_styles,
# &tile_styles, &lbl_num. Farbe pro Kachel ueber variables.accent bzw.
# variables.kind (battery / signed / netz / pv) fuer dynamische Faerbung.
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: vertical-stack
cards:
  # ============================ JETZT (Hero) ============================
  - type: vertical-stack
    card_mod: &shell
      style: |
        #root {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
      - type: custom:button-card
        icon: mdi:flash
        name: Jetzt
        show_icon: true
        show_name: true
        tap_action:
          action: none
        styles: &header_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: min-content 1fr
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - background: 'rgba(166, 212, 158, 0.12)'
            - border: 1px solid rgba(166, 212, 158, 0.2)
          icon:
            - width: 23px
            - height: 23px
            - color: '#a6d49e'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: '#f2f5f8'

      # ---- Ladestand-Ring (ganze Breite, Tap -> Ladestand) ----
      - type: custom:button-card
        entity: sensor.solarbank_3_e2700_pro_ladestand
        show_name: false
        show_state: false
        show_icon: false
        show_label: false
        triggers_update:
          - sensor.solarbank_3_e2700_pro_ladestand
          - sensor.solarbank_3_e2700_pro_akkuleistung
        styles:
          card:
            - border-radius: 16px
            - padding: 12px 14px
            - box-shadow: none
            - background: 'rgba(166, 212, 158, 0.10)'
            - border: 1px solid rgba(166, 212, 158, 0.20)
          grid:
            - grid-template-areas: '"body"'
          custom_fields:
            body:
              - width: 100%
        custom_fields:
          body: |
            [[[
              const green='#a6d49e', red='#f0736a', muted='#6e7988', value='#f2f5f8';
              const soc=(()=>{const e=states['sensor.solarbank_3_e2700_pro_ladestand'];return e?Math.round(parseFloat(e.state)||0):0;})();
              const socColor= soc<=10 ? red : green;
              const akku=(()=>{const e=states['sensor.solarbank_3_e2700_pro_akkuleistung'];return e?Math.round(parseFloat(e.state)||0):0;})();
              const akkuColor= akku>0 ? green : (akku<0 ? red : muted);
              const cap= akku>0 ? 'Akku lädt' : (akku<0 ? 'Akku entlädt' : 'Akku bereit');
              const circ=238.76, off=Math.max(0, circ*(1-soc/100));
              return `
                <div style="display:flex;align-items:center;gap:16px;width:100%;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
                  <div style="flex:none;position:relative;width:84px;height:84px;">
                    <svg viewBox="0 0 100 100" style="width:84px;height:84px;transform:rotate(-90deg);">
                      <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
                      <circle cx="50" cy="50" r="38" fill="none" stroke="${socColor}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:750;letter-spacing:-0.02em;">${soc}<span style="font-size:12px;margin-left:1px;">%</span></div>
                  </div>
                  <div style="min-width:0;">
                    <div style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">Ladestand</div>
                    <div style="font-size:13px;color:${akkuColor};margin-top:3px;">${cap} · ${akku} W</div>
                  </div>
                </div>`;
            ]]]

      # ---- Live-Leistungen (klickbar) ----
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solarleistung
            icon: mdi:solar-power
            name: Solar
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: pv, decimals: 0, unit: W }
            label: &lbl_num |
              [[[
                const e=states[entity.entity_id]; let v=e?parseFloat(e.state):NaN;
                let n;
                if(isNaN(v)) n='–';
                else { const d=(variables.decimals===undefined?0:variables.decimals); n=v.toFixed(d); if(variables.signed && v>0) n='+'+n; }
                return `${n}<span style="font-size:0.55em;color:#6e7988;font-weight:600;margin-left:3px;">${variables.unit||''}</span>`;
              ]]]
            styles: &tile_styles
              card:
                - border-radius: 16px
                - padding: 12px 14px
                - box-shadow: none
                - background: |
                    [[[
                      const e=states[entity.entity_id]; const v=e?parseFloat(e.state):NaN; const k=variables.kind;
                      let a=variables.accent||'#7fb3d5';
                      if(k==='battery')a=v<=10?'#f0736a':'#a6d49e';
                      else if(k==='signed')a=v>0?'#a6d49e':(v<0?'#f0736a':'#6e7988');
                      else if(k==='netz')a=v>0?'#f0736a':'#a6d49e';
                      else if(k==='pv')a=v>0?'#e6c15a':'#6e7988';
                      return a+'14';
                    ]]]
                - border: |
                    [[[
                      const e=states[entity.entity_id]; const v=e?parseFloat(e.state):NaN; const k=variables.kind;
                      let a=variables.accent||'#7fb3d5';
                      if(k==='battery')a=v<=10?'#f0736a':'#a6d49e';
                      else if(k==='signed')a=v>0?'#a6d49e':(v<0?'#f0736a':'#6e7988');
                      else if(k==='netz')a=v>0?'#f0736a':'#a6d49e';
                      else if(k==='pv')a=v>0?'#e6c15a':'#6e7988';
                      return '1px solid '+a+'26';
                    ]]]
              grid:
                - grid-template-columns: min-content 1fr
                - grid-template-areas: '"i l" "i n"'
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 42px
                - height: 42px
                - border-radius: 12px
                - margin-right: 13px
                - align-self: center
                - background: |
                    [[[
                      const e=states[entity.entity_id]; const v=e?parseFloat(e.state):NaN; const k=variables.kind;
                      let a=variables.accent||'#7fb3d5';
                      if(k==='battery')a=v<=10?'#f0736a':'#a6d49e';
                      else if(k==='signed')a=v>0?'#a6d49e':(v<0?'#f0736a':'#6e7988');
                      else if(k==='netz')a=v>0?'#f0736a':'#a6d49e';
                      else if(k==='pv')a=v>0?'#e6c15a':'#6e7988';
                      return a+'22';
                    ]]]
                - border: |
                    [[[
                      const e=states[entity.entity_id]; const v=e?parseFloat(e.state):NaN; const k=variables.kind;
                      let a=variables.accent||'#7fb3d5';
                      if(k==='battery')a=v<=10?'#f0736a':'#a6d49e';
                      else if(k==='signed')a=v>0?'#a6d49e':(v<0?'#f0736a':'#6e7988');
                      else if(k==='netz')a=v>0?'#f0736a':'#a6d49e';
                      else if(k==='pv')a=v>0?'#e6c15a':'#6e7988';
                      return '1px solid '+a+'3d';
                    ]]]
              icon:
                - width: 22px
                - height: 22px
                - color: |
                    [[[
                      const e=states[entity.entity_id]; const v=e?parseFloat(e.state):NaN; const k=variables.kind;
                      let a=variables.accent||'#7fb3d5';
                      if(k==='battery')a=v<=10?'#f0736a':'#a6d49e';
                      else if(k==='signed')a=v>0?'#a6d49e':(v<0?'#f0736a':'#6e7988');
                      else if(k==='netz')a=v>0?'#f0736a':'#a6d49e';
                      else if(k==='pv')a=v>0?'#e6c15a':'#6e7988';
                      return a;
                    ]]]
              label:
                - justify-self: start
                - align-self: end
                - font-size: 20px
                - font-weight: 700
                - letter-spacing: -0.02em
                - color: '#f2f5f8'
              name:
                - justify-self: start
                - align-self: start
                - font-size: 12px
                - color: '#6e7988'
                - margin-top: 2px
                - white-space: nowrap
                - overflow: hidden
                - text-overflow: ellipsis
          - type: custom:button-card
            entity: sensor.smart_meter_netzbezug
            icon: mdi:transmission-tower
            name: Netzbezug
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: netz, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_ac_hausabgabe
            icon: mdi:home-import-outline
            name: Hausabgabe
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5', decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_akkuleistung
            icon: mdi:battery-charging
            name: Akku
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: signed, decimals: 0, unit: W, signed: true }
            label: *lbl_num
            styles: *tile_styles

  # ============================ STROMVERBRAUCH ============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:home-lightning-bolt
        name: Stromverbrauch
        show_icon: true
        show_name: true
        tap_action:
          action: none
        styles: *header_styles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.hmip_esi_stromzahler_energiezahler_ch2
            icon: mdi:counter
            name: Zählerstand
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#e6b566', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.stromverbrauch_taglich
            icon: mdi:home-lightning-bolt-outline
            name: Verbrauch heute
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.hmip_esi_stromzahler_energiezahler_ch4
            icon: mdi:transmission-tower-export
            name: Einspeisung
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#a6d49e', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.smart_meter_netzbezug
            icon: mdi:flash
            name: Leistung aktuell
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: netz, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.stromverbrauch_monthly
            icon: mdi:calendar-month
            name: "[[[ return 'Verbrauch ' + (states['sensor.aktueller_monat'] ? states['sensor.aktueller_monat'].state : 'Monat'); ]]]"
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#8794a5', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.stromverbrauch_yearly
            icon: mdi:calendar
            name: "[[[ return 'Verbrauch ' + (states['sensor.aktuelles_jahr'] ? states['sensor.aktuelles_jahr'].state : 'Jahr'); ]]]"
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#8794a5', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles

  # ============================ SOLARBANK 3 PRO ============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:battery-charging-high
        name: Solarbank 3 Pro
        show_icon: true
        show_name: true
        tap_action:
          action: none
        styles: *header_styles
      # Betriebszustand (ganze Breite, lokalisiert)
      - type: custom:button-card
        entity: sensor.solarbank_3_e2700_pro_betriebszustand
        icon: mdi:state-machine
        name: Betriebszustand
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#7fb3d5' }
        label: |
          [[[
            const bz=states[entity.entity_id];
            const bzMap={
              'detection':'Erkennung','bypass':'Nulleinspeisung','discharge':'Entladen',
              'charge':'Laden','charge_bypass':'Überschussladung','charge_priority':'Vorrangladung',
              'full_bypass':'Voller Bypass','wakeup':'Aufwachen','standby':'Standby',
              'protection_charge':'Schutzladung','output':'Ausgabe'
            };
            let t = bz ? bz.state : '–';
            if (bz) {
              try { const f=(typeof hass!=='undefined'&&hass&&typeof hass.formatEntityState==='function')?hass.formatEntityState(bz):null; if(f&&f!==bz.state) t=f; } catch(e){}
              if (t===bz.state && bzMap[bz.state]) t=bzMap[bz.state];
              if (t===bz.state) t=String(bz.state).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
            }
            return t;
          ]]]
        styles: *tile_styles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_ac_hausabgabe
            icon: mdi:home-import-outline
            name: Hausabgabe
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5', decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_ladestand
            icon: mdi:battery-50
            name: Ladestand
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: battery, decimals: 0, unit: "%" }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_akkuenergie
            icon: mdi:home-battery-outline
            name: Akkuenergie
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5', decimals: 0, unit: Wh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_akkuleistung
            icon: mdi:battery-charging
            name: Akkuleistung
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: signed, decimals: 0, unit: W, signed: true }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.system_muhlweg_tagliche_pv_hausabgabe
            icon: mdi:transmission-tower-import
            name: Hausabgabe heute
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#a6d49e', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.system_muhlweg_taglicher_solarertrag
            icon: mdi:solar-power
            name: Solarertrag heute
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#e6c15a', decimals: 2, unit: kWh }
            label: *lbl_num
            styles: *tile_styles

  # ============================ PV MODULE ============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:solar-panel
        name: PV Module
        show_icon: true
        show_name: true
        tap_action:
          action: none
        styles: *header_styles
      - type: custom:button-card
        entity: sensor.solarbank_3_e2700_pro_solarleistung
        icon: mdi:solar-power-variant
        name: Solarleistung
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { kind: pv, decimals: 0, unit: W }
        label: *lbl_num
        styles: *tile_styles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solar_pv1
            icon: mdi:solar-panel
            name: PV1
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: pv, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solar_pv2
            icon: mdi:solar-panel
            name: PV2
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: pv, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solar_pv3
            icon: mdi:solar-panel
            name: PV3
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: pv, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_solar_pv4
            icon: mdi:solar-panel
            name: PV4
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { kind: pv, decimals: 0, unit: W }
            label: *lbl_num
            styles: *tile_styles
