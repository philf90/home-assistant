# Owlet-Palette -- die verbindliche Farbliste fuer alle Karten in diesem Repo.
#
# Regeln und Bausteine stehen in DESIGN.md. Diese Datei ist die einzige Quelle:
# ci/check_palette.py prueft jede Farbangabe in den Karten (*.yaml, *.js
# ausserhalb von ci/ und design/, Dateiliste aus ci/dateien.py),
# ci/check_grafana.py die Farben der Grafana-Dashboards gegen die Liste hier.
#
# Eine Farbe aufnehmen: Eintrag hier ergaenzen (hex, name, status, zweck) und
# in DESIGN.md begruenden. Ohne Eintrag schlaegt die CI fehl.
#
# Heller Modus: am Ende der Datei stehen hell_farben (Werte nur fuer den
# hellen Modus) und theme (jede Variable mit Wert dunkel und hell). Daraus
# erzeugt ci/gen_theme.py das Theme; Regeln in DESIGN.md, "Heller Modus".
#
# status:
#   bestand  -- im Dashboard etabliert
#   neu      -- Ergaenzung der Palette, fuer neue Karten freigegeben
#   sonder   -- an einen Zweck gebunden (Identitaet, Vorgabe von aussen);
#               nur dort verwenden, wo "zweck" es beschreibt
#
# Deckkraft: Jede Farbe darf mit Deckkraft verwendet werden, als rgba() oder
# als 8-stelliger Hex-Wert (#rrggbbaa). Weiss gibt es nur so, nie deckend.

deckkraft:
  # Feste Stufen fuer getoente Akzentfarben (siehe DESIGN.md, "Toenungen").
  # Hex-Suffix in Klammern. Nicht maschinell geprueft.
  flaeche: 0.12      # (1f) getoenter Kachelgrund
  icon_kachel: 0.16  # (29) Grund der Icon-Kachel
  schein: 0.18       # (2e) weicher Farbschatten, Ring um Punkte
  rand: 0.24         # (3d) Rand getoenter Kacheln
  leuchten: 0.5      # (80) Glow und Rand aktiver Kacheln

# Mit Deckkraft < 1 immer erlaubt, deckend nicht. Ausnahme "deckend_auf":
# deckend nur als Schrift auf diesen Farben; ci/check_palette.py laesst den
# Wert deckend zu, wenn eine davon in derselben Zeile steht.
nur_mit_deckkraft:
  - {hex: "#ffffff", name: Weiss, zweck: "Innenflaechen (0.028), Raender (0.05-0.08), Nebentext (0.55-0.66); deckend nur als Schrift auf Vereinsrot (4,88:1, #f2f5f8 dort 4,46:1)", deckend_auf: ["#e30613"]}

farben:
  flaechen:
    - {hex: "#1b2231", name: Kartenhuelle oben, status: bestand, zweck: "Verlauf 180 Grad oben, Popup-Grund, --card-background-color"}
    - {hex: "#171d29", name: Kartenhuelle unten, status: bestand, zweck: "Verlauf ab 55 %, Seitengrund, --primary-background-color"}
    - {hex: "#222b3c", name: Erhoehte Flaeche, status: neu, zweck: "Popups, Dropdowns, Hover und aktive Unterkachel"}
    - {hex: "#10151d", name: Vertiefte Flaeche, status: bestand, zweck: "Diagrammflaeche, Kamerarahmen, Log-Ausgaben, dunkle Schrift auf hellen Badges"}
    - {hex: "#12161f", name: Dunkle Badge-Schrift, status: bestand, zweck: "Schrift auf hellen Personen-Badges"}
    - {hex: "#3a4453", name: Zustand aus, status: bestand, zweck: "Thermostat-Bogen aus, Rand im Leerlauf, neutrale Icon-Kachel"}
    - {hex: "#000000", name: Schwarz, status: sonder, zweck: "nur Schrift-Schatten und Video-Hintergrund (Letterbox)"}

  text:
    - {hex: "#f2f5f8", name: Primaertext, status: bestand, zweck: "Primaertext und Messwerte, --primary-text-color"}
    - {hex: "#e7ecf3", name: Titel, status: bestand, zweck: "Titel und Kopfzeilen-Icons"}
    - {hex: "#b4c0cf", name: Hellgrau, status: bestand, zweck: "helle Labels, Hinweistext, Kartenbeschriftung, helle Icons"}
    - {hex: "#8794a5", name: Sekundaertext, status: bestand, zweck: "Sekundaertext und jede kleine Schrift (5,2:1), --secondary-text-color"}
    - {hex: "#6e7988", name: Muted, status: bestand, zweck: "nur Icons, inaktive Symbole, Deko; nie fuer Text (3,6:1)"}

  status:
    - {hex: "#a6d49e", name: Gruen, status: bestand, zweck: "OK, geschlossen, Akku gut, positive Werte"}
    - {hex: "#e6b566", name: Amber, status: bestand, zweck: "Hinweis und Warnung, offen (unkritisch)"}
    - {hex: "#e7936e", name: Koralle-Orange, status: neu, zweck: "Stufe erhoeht zwischen Amber und Rot; immer mit Text (Grafana: Mittelton #c75e2a)"}
    - {hex: "#f0736a", name: Rot, status: bestand, zweck: "kritisch, Alarm, Netzbezug, Akku leer"}

  # Grafana gibt Hex-Werte in beiden Themes unveraendert aus (keine
  # Theme-Variablen). Mittelton: OKLCH-Farbton des dunklen Werts, Chroma x1,3
  # (hoechstens 0,15), Helligkeit so, dass er auf beiden Panelgruenden gleich
  # viel Kontrast hat: #ffffff (hell) und #181b1f (dunkel), je etwa 4,15:1.
  # Zellgrund: farbige Tabellenzelle; Grafana waehlt die Schrift selbst
  # (dunkel ab YIQ-Helligkeit 180). Regeln in DESIGN.md, "Grafana".
  grafana:
    - {hex: "#508a47", name: Gruen Grafana, status: sonder, zweck: "Grafana: ok, Linien, Balken, Werte; 4,14:1 hell, 4,17:1 dunkel"}
    - {hex: "#a57301", name: Amber Grafana, status: sonder, zweck: "Grafana: Hinweis, Gas; 4,16:1 hell und dunkel"}
    - {hex: "#c75e2a", name: Koralle Grafana, status: sonder, zweck: "Grafana: erhoeht, immer mit Text; 4,15:1 hell, 4,17:1 dunkel"}
    - {hex: "#cc5750", name: Rot Grafana, status: sonder, zweck: "Grafana: kritisch, Netzbezug, Grenzlinien; 4,16:1 hell, 4,15:1 dunkel"}
    - {hex: "#1e8d65", name: Mint Grafana, status: sonder, zweck: "Grafana: Autarkie ab 85 %; 4,16:1 hell und dunkel"}
    - {hex: "#997801", name: Sonnengelb Grafana, status: sonder, zweck: "Grafana: PV; 4,17:1 hell, 4,15:1 dunkel"}
    - {hex: "#3d83ad", name: Blau Grafana, status: sonder, zweck: "Grafana: Hausverbrauch, Annotationen; 4,16:1 hell, 4,15:1 dunkel"}
    - {hex: "#8f6db7", name: Violett Grafana, status: sonder, zweck: "Grafana: Kosten; 4,17:1 hell, 4,15:1 dunkel"}
    - {hex: "#ffa198", name: Rot Zellgrund Grafana, status: sonder, zweck: "Grafana-Tabelle: Zellgrund kritisch (Gruen und Amber: #a6d49e, #e6b566); dunkle Schrift 8,20:1"}

  akzente:
    - {hex: "#7fb3d5", name: Blau, status: bestand, zweck: "Standard-Akzent, Info-Werte, Navigation Home"}
    - {hex: "#7fd0d5", name: Tuerkis, status: bestand, zweck: "Verbraucher, Hausgeraete"}
    - {hex: "#77d4d0", name: Tuerkis hell, status: bestand, zweck: "Navigation Verbrauch, Schlafphase REM"}
    - {hex: "#79b8c9", name: Petrol, status: bestand, zweck: "Navigation Heizung"}
    - {hex: "#b399d4", name: Violett, status: bestand, zweck: "Navigation Geraete, Kategorie Netzwerk/Homematic"}
    - {hex: "#bdd27f", name: Limette, status: bestand, zweck: "Navigation Garten, Bewaesserung, niedrige Pollenbelastung"}
    - {hex: "#89d2b0", name: Mint, status: neu, zweck: "Einspeisung, Autarkie, Eigenverbrauch, Luftqualitaet gut (Grafana: Mittelton #1e8d65)"}
    - {hex: "#8ea2e6", name: Indigo, status: neu, zweck: "Nacht und Schlaf, Nachtmodus, Abwesenheits- und Urlaubsmodus, Szenen"}
    - {hex: "#e6a0c4", name: Rose, status: neu, zweck: "Personen und Gesundheit: Puls, Schritte, Aktivitaet"}
    - {hex: "#cdd6e0", name: Wolkengrau, status: bestand, zweck: "Navigation Wetter"}
    - {hex: "#cfe3f2", name: Eis, status: bestand, zweck: "Begruessung: kalt"}
    - {hex: "#9aa7bd", name: Nachtgrau, status: bestand, zweck: "Begruessung: Nacht"}

  energie_licht:
    - {hex: "#e6c15a", name: Sonnengelb, status: bestand, zweck: "PV und Solar"}
    - {hex: "#f0c274", name: Licht an, status: bestand, zweck: "Text, Rand und Leuchten bei Licht an"}
    - {hex: "#f2cf93", name: Licht-Verlauf oben, status: bestand, zweck: "Verlauf #f2cf93 -> #e6b566 der gefuellten Lichtkachel"}
    - {hex: "#3a2c12", name: Schrift auf Amber, status: bestand, zweck: "Icon und Schrift auf gefuellter Amber-Kachel (7,2:1)"}

  schrift_auf_fuellung:
    - {hex: "#1d3320", name: Schrift auf Gruen, status: neu, zweck: "gefuellte Kachel in #a6d49e (8,1:1)"}
    - {hex: "#132a3c", name: Schrift auf Blau, status: neu, zweck: "gefuellte Kachel in #7fb3d5 (6,5:1)"}
    - {hex: "#3d1512", name: Schrift auf Rot, status: neu, zweck: "gefuellte Kachel in #f0736a (5,6:1)"}
    - {hex: "#2a1b3d", name: Schrift auf Violett, status: neu, zweck: "gefuellte Kachel in #b399d4 (6,4:1)"}
    - {hex: "#103436", name: Schrift auf Tuerkis, status: neu, zweck: "gefuellte Kachel in #7fd0d5 (7,6:1)"}

  sonder:
    # Owlet-Identitaet
    - {hex: "#ff4696", name: Dragonfruit, status: sonder, zweck: "Owlet-Identitaet und Abwesend-Rand der Personenkarte; keine Statusfarbe"}
    - {hex: "#1e1033", name: Night Violet, status: sonder, zweck: "Owlet-Huelle unten"}
    - {hex: "#241542", name: Night Violet oben, status: sonder, zweck: "Owlet-Huelle oben"}
    - {hex: "#3a1f5c", name: Night Violet hell, status: sonder, zweck: "Owlet-Icon-Kachel"}
    - {hex: "#4b2e7a", name: Night Violet Rand, status: sonder, zweck: "Zuhause-Rand der Personenkarte; #1e1033 waere als Rand unsichtbar"}
    - {hex: "#7cc4d6", name: Leichter Schlaf, status: sonder, zweck: "Owlet-Schlafzustand"}
    # Personen
    - {hex: "#4a5a74", name: Avatar neutral oben, status: sonder, zweck: "Avatar-Platzhalter ohne Profilbild"}
    - {hex: "#33404f", name: Avatar neutral unten, status: sonder, zweck: "Avatar-Platzhalter ohne Profilbild"}
    - {hex: "#6d5480", name: Avatar violett oben, status: sonder, zweck: "Avatar-Platzhalter der zweiten Person"}
    - {hex: "#4a3a5c", name: Avatar violett unten, status: sonder, zweck: "Avatar-Platzhalter der zweiten Person"}
    # Fussball
    - {hex: "#e30613", name: Vereinsrot, status: sonder, zweck: "Lieblingsverein, Live-Badge"}
    - {hex: "#ff8a80", name: Tor, status: sonder, zweck: "Tor-Hinweis"}
    - {hex: "#2a1418", name: Vereinshuelle oben, status: sonder, zweck: "rot getoente Sonderhuelle im Fussball-View"}
    - {hex: "#1f1013", name: Vereinshuelle unten, status: sonder, zweck: "rot getoente Sonderhuelle im Fussball-View"}
    # Flugradar
    - {hex: "#f2c94c", name: Flugradar-Gelb, status: sonder, zweck: "Hervorhebung und Leuchten im Flugradar"}
    # Wetterwarnungen: offizielle DWD-Stufenfarben, nicht anpassen
    - {hex: "#7c8ba1", name: DWD Stufe 0, status: sonder, zweck: "Vorabinformation"}
    - {hex: "#f2c500", name: DWD Stufe 1, status: sonder, zweck: "Wetterwarnung"}
    - {hex: "#fb9a12", name: DWD Stufe 2, status: sonder, zweck: "Markante Warnung"}
    - {hex: "#e6480e", name: DWD Stufe 3, status: sonder, zweck: "Unwetterwarnung"}
    - {hex: "#c0392b", name: DWD Stufe 4, status: sonder, zweck: "Extremes Unwetter"}
    - {hex: "#4ade80", name: Warnung aktiv, status: sonder, zweck: "Kennzeichnung einer laufenden Warnung"}
    # World of Warcraft: offizielle Qualitaetsfarben der Items, nicht anpassen.
    # Nur als Rand am Item-Symbol der WoW-Karte, nie als Schrift (Selten und
    # Episch halten auf der Huelle nur 3,06:1 bzw. 3,02:1). Gewoehnlich (im
    # Spiel Weiss) nimmt den Primaertext #f2f5f8.
    - {hex: "#9d9d9d", name: WoW Schlecht, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Schlecht (POOR); Huelle 5,44:1"}
    - {hex: "#1eff00", name: WoW Ungewoehnlich, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Ungewoehnlich (UNCOMMON); Huelle 10,79:1"}
    - {hex: "#0070dd", name: WoW Selten, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Selten (RARE); Huelle 3,06:1, nie Schrift"}
    - {hex: "#a335ee", name: WoW Episch, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Episch (EPIC); Huelle 3,02:1, nie Schrift"}
    - {hex: "#ff8000", name: WoW Legendaer, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Legendaer (LEGENDARY); Huelle 5,86:1"}
    - {hex: "#e6cc80", name: WoW Artefakt, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Artefakt (ARTIFACT); Huelle 9,35:1"}
    - {hex: "#00ccff", name: WoW Erbstueck, status: sonder, zweck: "WoW-Karte: Rand Item-Qualitaet Erbstueck (HEIRLOOM) und WoW-Marke; Huelle 7,79:1"}

# ---------------------------------------------------------------------------
# Heller Modus -- Regeln und Messwerte in DESIGN.md, Abschnitt "Heller Modus"
# ---------------------------------------------------------------------------
# hell_farben: Werte, die nur der helle Modus braucht. Sie stehen nur im Theme
# (theme.datei); Karten greifen ueber die Variablen unten darauf zu.
# ci/check_palette.py laesst sie ausserhalb des Themes nicht zu.
#
# Akzente im Tiefband: OKLCH-Farbton wie das dunkle Gegenstueck (hoechstens
# 5 Grad verschoben), Chroma x1,3 (hoechstens 0,15), Helligkeit so, dass
# Schrift auf der eigenen Toenung 0,12 mindestens 4,6:1 haelt. Die Zahlen im
# zweck sind Kontraste gegen den unguenstigsten Grund (siehe DESIGN.md).
hell_farben:
  flaechen:
    - {hex: "#e6eaf0", name: Seitengrund hell, zweck: "Seitengrund, --primary-background-color im hellen Modus"}
    - {hex: "#fafbfd", name: Kartenhuelle oben hell, zweck: "Verlauf 180 Grad oben, --card-background-color im hellen Modus"}
    - {hex: "#f3f5f8", name: Kartenhuelle unten hell, zweck: "Verlauf ab 55 % im hellen Modus"}
    - {hex: "#e9edf2", name: Vertiefte Flaeche hell, zweck: "Diagrammflaeche, Log-Ausgaben im hellen Modus"}

  text:
    - {hex: "#586475", name: Sekundaertext hell, zweck: "Sekundaertext und jede kleine Schrift im hellen Modus (5,21:1)"}

  status:
    - {hex: "#38702e", name: Gruen hell, zweck: "Gruen im hellen Modus (4,64:1 auf Toenung)"}
    - {hex: "#855c04", name: Amber hell, zweck: "Amber und Licht an im hellen Modus (4,64:1 auf Toenung)"}
    - {hex: "#a94302", name: Koralle-Orange hell, zweck: "Koralle-Orange im hellen Modus (4,63:1 auf Toenung); immer mit Text"}
    - {hex: "#ae3c38", name: Rot hell, zweck: "Rot im hellen Modus (4,62:1 auf Toenung)"}

  akzente:
    - {hex: "#266994", name: Blau hell, zweck: "Blau im hellen Modus (4,61:1 auf Toenung; Farbton +3,2 Grad)"}
    - {hex: "#016f74", name: Tuerkis hell-Modus, zweck: "Tuerkis und Tuerkis hell im hellen Modus (4,60:1 auf Toenung); beide Rollen fallen hell zusammen, getrennt waeren es nur Delta E00 3,2"}
    - {hex: "#066d86", name: Petrol hell, zweck: "Petrol im hellen Modus (4,60:1 auf Toenung; Farbton +4,7 Grad)"}
    - {hex: "#76559c", name: Violett hell, zweck: "Violett im hellen Modus (4,62:1 auf Toenung)"}
    - {hex: "#5a6b04", name: Limette hell, zweck: "Limette im hellen Modus (4,61:1 auf Toenung)"}
    - {hex: "#00714f", name: Mint hell, zweck: "Mint im hellen Modus (4,66:1 auf Toenung)"}
    - {hex: "#4b5eb1", name: Indigo hell, zweck: "Indigo im hellen Modus (4,63:1 auf Toenung)"}
    - {hex: "#994776", name: Rose hell, zweck: "Rose im hellen Modus (4,62:1 auf Toenung)"}
    - {hex: "#5b6571", name: Wolkengrau hell, zweck: "Wolkengrau im hellen Modus (4,64:1 auf Toenung)"}
    - {hex: "#506778", name: Eis hell, zweck: "Eis im hellen Modus (4,62:1 auf Toenung)"}
    - {hex: "#35435c", name: Nachtgrau hell, zweck: "Nachtgrau im hellen Modus, bewusst tiefer (7,51:1), damit es sich wie dunkel ueber die Helligkeit von Wolkengrau abhebt"}
    - {hex: "#776202", name: Sonnengelb hell, zweck: "Sonnengelb im hellen Modus (4,61:1 auf Toenung; Farbton +4,6 Grad)"}
    - {hex: "#a47800", name: Sonnengelb Grafik hell, zweck: "PV in Grafiken neben Rot (Netz) im hellen Modus: Tiefton #776202 ist so hell wie Rot #ae3c38 (1,01:1); #a47800 1,50:1, Huelle 3,65:1, Balkenspur 3,13:1"}

# Theme fuer Home Assistant mit beiden Modi. Jede Variable mit ihrem Wert im
# dunklen und im hellen Modus; ha nennt die Standard-Variablen von Home
# Assistant, die denselben Wert bekommen. Die Datei theme.datei wird daraus
# erzeugt: python ci/gen_theme.py (nie von Hand aendern).
#
# Im Theme steht jede Rolle, deren Wert sich zwischen den Modi unterscheidet.
# Gleich bleiben und deshalb fehlen: Fuellungen und Schrift auf Fuellung,
# Licht-Verlauf oben, die Sonderfarben (Identitaetshuellen bleiben dunkel)
# und Schwarz. Muted steht trotzdem drin, damit jede Textrolle eine Variable hat.
theme:
  name: owlet
  datei: dashboard/allgemein/owlet-theme-konfig.yaml
  variablen:
    # Flaechen
    - {name: owlet-seite, dunkel: "#171d29", hell: "#e6eaf0", ha: [primary-background-color], zweck: Seitengrund}
    - {name: owlet-huelle-oben, dunkel: "#1b2231", hell: "#fafbfd", ha: [card-background-color], zweck: "Kartenhuelle, Verlauf oben"}
    - {name: owlet-huelle-unten, dunkel: "#171d29", hell: "#f3f5f8", zweck: "Kartenhuelle, Verlauf ab 55 %"}
    - {name: owlet-huelle-rand, dunkel: "rgba(255, 255, 255, 0.05)", hell: "rgba(23, 29, 41, 0.06)", zweck: Rand der Kartenhuelle}
    - {name: owlet-schatten, dunkel: "rgba(0, 0, 0, 0.7)", hell: "rgba(23, 29, 41, 0.3)", zweck: "Schatten der Kartenhuelle (0 18px 44px -22px)"}
    - {name: owlet-unterkachel, dunkel: "rgba(255, 255, 255, 0.028)", hell: "rgba(23, 29, 41, 0.03)", zweck: Grund der Unterkachel}
    - {name: owlet-unterkachel-rand, dunkel: "rgba(255, 255, 255, 0.06)", hell: "rgba(23, 29, 41, 0.07)", zweck: Rand der Unterkachel}
    - {name: owlet-neutral-kachel, dunkel: "rgba(255, 255, 255, 0.05)", hell: "rgba(23, 29, 41, 0.05)", zweck: "Grund der neutralen Icon-Kachel"}
    - {name: owlet-flaeche-erhoeht, dunkel: "#222b3c", hell: "#ffffff", zweck: "Popups, Dropdowns, Hover; Weiss nur hier deckend"}
    - {name: owlet-flaeche-vertieft, dunkel: "#10151d", hell: "#e9edf2", zweck: "Diagrammflaeche, Log-Ausgaben"}
    - {name: owlet-aus, dunkel: "#3a4453", hell: "#b4c0cf", zweck: "Zustand aus: Bogen, Rand im Leerlauf"}
    # Text
    - {name: owlet-text, dunkel: "#f2f5f8", hell: "#171d29", ha: [primary-text-color], zweck: "Primaertext, Messwerte"}
    - {name: owlet-titel, dunkel: "#e7ecf3", hell: "#1b2231", zweck: "Titel, Kopfzeilen"}
    - {name: owlet-label, dunkel: "#b4c0cf", hell: "#3a4453", zweck: "Labels, Hinweistext, neutrale Icons"}
    - {name: owlet-text-sekundaer, dunkel: "#8794a5", hell: "#586475", ha: [secondary-text-color], zweck: "Sekundaertext und jede kleine Schrift"}
    - {name: owlet-muted, dunkel: "#6e7988", hell: "#6e7988", zweck: "nur Icons und Deko, nie Text"}
    # Status
    - {name: owlet-gruen, dunkel: "#a6d49e", hell: "#38702e", zweck: "OK, geschlossen, Pflanzen"}
    - {name: owlet-amber, dunkel: "#e6b566", hell: "#855c04", zweck: "Hinweis, Warnung, Lichter"}
    - {name: owlet-koralle, dunkel: "#e7936e", hell: "#a94302", zweck: "erhoeht, immer mit Text"}
    - {name: owlet-rot, dunkel: "#f0736a", hell: "#ae3c38", zweck: "kritisch, Alarm, Netzbezug"}
    # Akzente
    - {name: owlet-blau, dunkel: "#7fb3d5", hell: "#266994", zweck: "Home, Standard-Akzent, Info-Werte"}
    - {name: owlet-tuerkis, dunkel: "#7fd0d5", hell: "#016f74", zweck: "Verbraucher, Hausgeraete"}
    - {name: owlet-tuerkis-hell, dunkel: "#77d4d0", hell: "#016f74", zweck: "Navigation Verbrauch, Schlafphase REM; hell gleich Tuerkis"}
    - {name: owlet-petrol, dunkel: "#79b8c9", hell: "#066d86", zweck: Heizung}
    - {name: owlet-violett, dunkel: "#b399d4", hell: "#76559c", zweck: "Geraete, Netzwerk, Kosten"}
    - {name: owlet-limette, dunkel: "#bdd27f", hell: "#5a6b04", zweck: "Garten, Bewaesserung"}
    - {name: owlet-mint, dunkel: "#89d2b0", hell: "#00714f", zweck: "Einspeisung, Autarkie"}
    - {name: owlet-indigo, dunkel: "#8ea2e6", hell: "#4b5eb1", zweck: "Nacht, Schlaf, Abwesenheit, Szenen"}
    - {name: owlet-rose, dunkel: "#e6a0c4", hell: "#994776", zweck: "Personen und Gesundheit"}
    - {name: owlet-wolkengrau, dunkel: "#cdd6e0", hell: "#5b6571", zweck: Wetter}
