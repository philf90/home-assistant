# Labels, Kategorien und Bereiche der Instanz -- die verbindliche Liste.
#
# Labels gibt es nur in der Home-Assistant-Oberflaeche, nicht in YAML
# (Einstellungen -> Bereiche, Labels & Zonen -> Labels). Diese Datei ist das
# Register dazu: Ein neues Label wird zuerst hier eingetragen, dann in der
# Instanz angelegt; das gilt auch fuer Aenderungen direkt in der Instanz.
# Regeln und Begruendung: CONTRIBUTING.md, Abschnitt "Labels, Bereiche und
# Kategorien". Keine Pruefung liest diese Datei bisher.
#
# Drei Werkzeuge, drei Fragen:
#   Wo?          Bereich und Stockwerk. Nie ein Label.
#   Worum?       Label (mehrfach, ueber alle Objektarten, als Ziel label_id
#                und in Templates nutzbar).
#   Welche Art?  Kategorie (genau eine, nur in den Listen von Automationen,
#                Skripten, Szenen und Helfern; nicht als Ziel nutzbar).
#
# Achsen eines Labels:
#   thema      Sachgebiet oder Objekt, das ueber Bereiche oder Integrationen
#              verteilt ist. Name gleich dem Praefix der Automationsnamen
#              ("Bewaesserung: ..." -> Bewaesserung). Farbe je Thema.
#   geraetetyp Nur, wenn Domain und Geraeteklasse die Menge nicht trennen
#              (Fenster: auch Auto-Fenster melden device_class window).
#              Farbe blue-grey.
#   flag       Steuer-Flag, das ein Template, eine Automation oder Karte
#              liest. Die Beschreibung nennt den Verbraucher. Farbe grey.
#   Kein Label fuer Hersteller oder Integration: das filtert Home Assistant.
#
# Felder:
#   id            label_id, von Home Assistant aus dem Namen erzeugt und bei
#                 Umbenennung unveraendert. Neue Bedeutung -> neues Label.
#   name          deutsch, Einzahl, Substantiv
#   achse         thema | geraetetyp | flag
#   farbe         Farbname aus der Label-Farbauswahl von Home Assistant
#   icon          mdi:...
#   beschreibung  Pflicht, wird in der Instanz als Beschreibung eingetragen
#   ebene         geraet | entitaet | beide -- wo das Label haengt. Physische
#                 Geraete: am Geraet; Entitaeten ohne Geraet (Helfer,
#                 Automation, Skript, Szene, Gruppe): an der Entitaet. Nie
#                 dasselbe Label an Geraet und eigener Entitaet.
#   verbraucher   Pflicht bei flag: was das Label liest
#   status        aktiv | neu (noch anzulegen) | aufloesen (umhaengen, dann
#                 loeschen) | pruefen (nur mit Verbraucher behalten)
#   Stand der Instanz: umgesetzt am 2026-11-21.
#
# Templates lesen beide Ebenen:
#   label_devices(x) | map('device_entities') | sum(start=[]) + label_entities(x)

labels:
  # --- Thema -----------------------------------------------------------------
  - {id: sicherheit, name: Sicherheit, achse: thema, farbe: red, icon: mdi:shield-home, ebene: beide, status: aktiv,
     beschreibung: "Einbruch, Rauch, Wachmodus, Außenkameras"}
  - {id: haustur, name: Haustür, achse: thema, farbe: brown, icon: mdi:door-closed-lock, ebene: beide, status: aktiv,
     beschreibung: "Alles, was zur Haustür gehört: Kontakt, Schloss, Klingel, Leser, Gong"}
  - {id: pakete, name: Pakete, achse: thema, farbe: orange, icon: mdi:package-variant-closed, ebene: beide, status: aktiv,
     beschreibung: "Sendungsverfolgung und Zustellung"}
  - {id: heizung, name: Heizung, achse: thema, farbe: deep-orange, icon: mdi:heat-wave, ebene: beide, status: aktiv,
     beschreibung: "Heizkörper, Heizgruppen, Heizlüfter"}
  - {id: licht, name: Licht, achse: thema, farbe: amber, icon: mdi:lightbulb, ebene: beide, status: aktiv,
     beschreibung: "Beleuchtung, auch über Stecker geschaltet; keine Status-LEDs oder Bildschirme"}
  - {id: bewasserung, name: Bewässerung, achse: thema, farbe: cyan, icon: mdi:water-well, ebene: beide, status: aktiv,
     beschreibung: "Gartenbewässerung mit Brunnenpumpe"}
  - {id: wetter, name: Wetter, achse: thema, farbe: light-blue, icon: mdi:weather-hazy, ebene: beide, status: aktiv,
     beschreibung: "Wetterdaten und Warnungen"}
  - {id: gesundheit, name: Gesundheit, achse: thema, farbe: pink, icon: mdi:heart-pulse, ebene: beide, status: aktiv,
     beschreibung: "Vitalwerte, Schlaf, Bewegung"}
  - {id: flugradar, name: Flugradar, achse: thema, farbe: indigo, icon: mdi:airplane, ebene: beide, status: aktiv,
     beschreibung: "Flugverkehr über dem Haus (ADS-B, FlightRadar24)"}
  - {id: fussball, name: Fußball, achse: thema, farbe: green, icon: mdi:soccer, ebene: entitaet, status: aktiv,
     beschreibung: "Spielstände und Spielmeldungen"}
  - {id: server, name: Server, achse: thema, farbe: deep-purple, icon: mdi:server, ebene: entitaet, status: aktiv,
     beschreibung: "Docker, Proxmox, Dienstüberwachung; Geräte grenzen die Integrationen schon ab"}
  - {id: netzwerk, name: Netzwerk, achse: thema, farbe: blue, icon: mdi:lan, ebene: beide, status: aktiv,
     beschreibung: "LAN, WLAN, Router, Switches, Access Points, NAS"}
  - {id: fahrzeuge, name: Fahrzeuge, achse: thema, farbe: teal, icon: mdi:car, ebene: beide, status: aktiv,
     beschreibung: "Autos und Tankstellen"}
  - {id: hausgerate, name: Hausgeräte, achse: thema, farbe: lime, icon: mdi:washing-machine, ebene: beide, status: aktiv,
     beschreibung: "Waschen, Trocknen, Spülen, Kühlen, Saugen, Kochen; auch Messgeräte vor diesen Lasten"}
  - {id: batterien, name: Batterien, achse: thema, farbe: yellow, icon: mdi:battery-alert, ebene: entitaet, status: aktiv,
     beschreibung: "Batterieüberwachung und ihre Meldungen"}
  - {id: energie, name: Energie, achse: thema, farbe: light-green, icon: mdi:lightning-bolt, ebene: beide, status: aktiv,
     beschreibung: "Erzeugung, Speicher, Hausanschluss"}

  # --- Geraetetyp ------------------------------------------------------------
  - {id: fenster, name: Fenster, achse: geraetetyp, farbe: blue-grey, icon: mdi:window-closed, ebene: geraet, status: aktiv,
     beschreibung: "Fensterkontakte des Hauses; trennt sie von Auto-Fenstern mit derselben Geräteklasse"}
  - {id: tur, name: Tür, achse: geraetetyp, farbe: blue-grey, icon: mdi:door, ebene: geraet, status: aktiv,
     beschreibung: "Türkontakte und Türschloss des Hauses; trennt sie von Auto- und Gerätetüren"}
  - {id: temperatur, name: Temperatur, achse: geraetetyp, farbe: blue-grey, icon: mdi:temperature-celsius, ebene: geraet, status: aktiv,
     beschreibung: "Wandthermostate und Raumsensoren"}
  - {id: verbrauchszahler, name: Verbrauchszähler, achse: geraetetyp, farbe: blue-grey, icon: mdi:counter, ebene: geraet, status: aktiv,
     beschreibung: "Strom-, Gas- und Wasserzähler am Hausanschluss; keine Messgeräte einzelner Lasten"}
  - {id: handy, name: Handy, achse: geraetetyp, farbe: blue-grey, icon: mdi:cellphone, ebene: geraet, status: aktiv,
     beschreibung: "Handys mit Companion App; Ziel für notify.send_message"}
  - {id: tablet, name: Tablet, achse: geraetetyp, farbe: blue-grey, icon: mdi:tablet, ebene: geraet, status: aktiv,
     beschreibung: "Tablets mit Companion App; Ziel für notify.send_message"}
  - {id: smartwatch, name: Smartwatch, achse: geraetetyp, farbe: blue-grey, icon: mdi:watch, ebene: geraet, status: aktiv,
     beschreibung: "Uhren mit Companion App; Ziel für notify.send_message"}
  - {id: funk_gateway, name: Funk-Gateway, achse: geraetetyp, farbe: blue-grey, icon: mdi:access-point, ebene: geraet, status: aktiv,
     beschreibung: "Funkmodule, Bridges und Koordinatoren (Homematic, Hue, Zigbee)"}

  # --- Flag ------------------------------------------------------------------
  - {id: keine_batteriemeldung, name: Keine Batteriemeldung, achse: flag, farbe: grey, icon: mdi:battery-off-outline, ebene: beide, status: aktiv,
     verbraucher: "sensor.batterien (dashboard/sonstiges/batterien-konfig.yaml), Template nachtblau_batterien",
     beschreibung: "Geräte ohne Batteriemeldung: Speicher, Autos, Roboter und Geräte, die man selbst lädt. Wird von sensor.batterien ausgenommen."}

# Am 2026-11-21 geloescht (Ersatz dahinter). Nicht wieder anlegen.
geloescht:
  - {id: unifi, ersetzt_durch: [netzwerk, sicherheit, haustur]}
  - {id: security, ersetzt_durch: [sicherheit]}
  - {id: ccu_access_point, ersetzt_durch: [funk_gateway]}
  - {id: steckdose, ersetzt_durch: "Thema der Last (licht, heizung, hausgerate, energie)"}
  - {id: rauchmelder, ersetzt_durch: "device_class smoke; die Melder tragen sicherheit"}

# Kategorien: genau eine je Objekt. Fuer Skripte und Szenen keine, solange
# ihre Listen kurz sind.
kategorien:
  automation:
    - {name: Meldung, wofuer: "benachrichtigt oder sagt an"}
    - {name: Steuerung, wofuer: "schaltet Geräte oder Modi"}
    - {name: Merker, wofuer: "schreibt Helfer, zählt, führt Logbuch"}
    - {name: Wartung, wofuer: "hält Integrationen am Laufen (neu verbinden, überwachen)"}
  helfer:
    - {name: Meldeschalter, wofuer: "schaltet eine Meldung an oder aus"}
    - {name: Einstellung, wofuer: "wird von Hand gesetzt"}
    - {name: Merker, wofuer: "schreibt eine Automation; nicht von Hand ändern (auch Zähler, Timer)"}
