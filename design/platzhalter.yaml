# Platzhalter fuer persoenliche Angaben -- die verbindliche Liste.
#
# Persoenliche Angaben (Namen, Geraetenamen, Adresse, Kennzeichen, Seriennummern
# in Entity-IDs) stehen im Repo nur als Platzhalter. Die Platzhalter gibt es in
# keiner Home-Assistant-Instanz; eine unveraendert eingefuegte Karte bleibt leer.
# Wie man sie ersetzt: README.md, Abschnitt "Platzhalter ersetzen", und der
# Skill .claude/skills/platzhalter-einsetzen.
#
# ci/check_kopf.py sucht jedes "muster" (regulaerer Ausdruck) in den Dateien
# unter dashboard/ und vergleicht die Treffer mit der Kopfzeile "Platzhalter:"
# der Datei. Dateien ohne Kopfblock (Doku, Grafana-JSON), die einen Platzhalter
# enthalten, muessen unter "dateien_ohne_kopf" stehen.
#
# Neuer Platzhalter: hier eintragen (id, muster, anzeige, steht_fuer, finden),
# dann in der Datei verwenden und ihren Kopf ergaenzen. Die Tabelle in
# README.md erzeugt ci/gen_index.py aus dieser Datei; anzeige, steht_fuer und
# finden sind deshalb Markdown.

platzhalter:
  - id: person.bewohner
    muster: 'person\.bewohner'
    anzeige: '`person.bewohner`'
    steht_fuer: Personen-Entity
    finden: Einstellungen → Personen

  - id: sensor.iphone_*
    muster: 'sensor\.iphone_'
    anzeige: '`sensor.iphone_*`'
    steht_fuer: Sensoren der Companion App; `iphone` steht für den Gerätenamen
    finden: Einstellungen → Geräte & Dienste → Mobile App → Gerät

  - id: notify.mobile_app_iphone
    muster: 'notify\.mobile_app_iphone'
    anzeige: '`notify.mobile_app_iphone`'
    steht_fuer: Benachrichtigungen an dasselbe Gerät
    finden: Entwicklerwerkzeuge → Aktionen, Suche `notify.mobile_app_`

  - id: <breite>/<laenge>
    muster: '<breite>|<laenge>'
    anzeige: '`<breite>`, `<laenge>`'
    steht_fuer: Koordinaten von Zuhause
    finden: Entwicklerwerkzeuge → Zustände, `zone.home` (Attribute `latitude`, `longitude`)

  - id: sensor.pv_anlage_*
    muster: 'pv_anlage_'
    anzeige: '`sensor.pv_anlage_*`'
    steht_fuer: Sensoren der PV-/Solarbank-Anlage (in Grafana ohne `sensor.`)
    finden: Einstellungen → Geräte & Dienste → Integration der Anlage

  - id: kennzeichen
    muster: 'AB - (?:CD 123|EF 456)'
    anzeige: '`AB - CD 123`, `AB - EF 456`'
    steht_fuer: Kennzeichen, reiner Anzeigetext
    finden: "–"

  - id: passat_*_kombiniert
    muster: 'passat_(?:fenster|tueren)_kombiniert'
    anzeige: '`passat_fenster_kombiniert`, `passat_tueren_kombiniert`'
    steht_fuer: '`unique_id` der Template-Sensoren'
    finden: bisherige `unique_id` übernehmen, sonst legt HA neue Entities an

  - id: seriennr_<geraet>
    muster: 'seriennr_(?:geschirrspueler|waschmaschine|trockner)'
    anzeige: '`seriennr_geschirrspueler`, `seriennr_waschmaschine`, `seriennr_trockner`'
    steht_fuer: >-
      Seriennummer des Home-Connect-Geräts am Anfang der Entity-ID
      (`sensor.seriennr_…_bsh_common_…`)
    finden: Einstellungen → Geräte & Dienste → Home-Connect-Integration → Gerät → Entitäten

  - id: '*_seriennr'
    muster: '_seriennr(?:_[12])?(?![a-z])'
    anzeige: '`*_seriennr`, `*_seriennr_1`, `*_seriennr_2`'
    steht_fuer: >-
      Seriennummer des Geräts in der Entity-ID (Homematic IP, Owlet);
      `_1`/`_2` trennen zwei Geräte desselben Modells
    finden: Einstellungen → Geräte & Dienste → Integration → Gerät → Entitäten

  - id: '*_mac'
    muster: 'shelly[a-z0-9]*_mac'
    anzeige: '`*_mac`'
    steht_fuer: MAC-Adresse des Shelly-Geräts in der Entity-ID
    finden: Einstellungen → Geräte & Dienste → Shelly → Gerät → Entitäten

  - id: fin_*
    muster: 'fin_(?:passat|touran)'
    anzeige: '`fin_passat`, `fin_touran`'
    steht_fuer: >-
      Fahrgestellnummer in der Entity-ID: V2 (`volkswagencarnet`) mit voller FIN,
      V3 (`vag_connect`) mit deren letzten 6 Stellen
    finden: Einstellungen → Geräte & Dienste → Integration des Fahrzeugs → Gerät → Entitäten

  - id: ieee_adresse
    muster: 'ieee_adresse'
    anzeige: '`ieee_adresse`'
    steht_fuer: IEEE-Adresse des Zigbee-Geräts (`0x…`), solange die Entity nicht umbenannt ist
    finden: Einstellungen → Geräte & Dienste → Zigbee-Integration → Gerät

  - id: kind_1/kind_2
    muster: 'kind_[12]'
    anzeige: '`kind_1`, `kind_2`'
    steht_fuer: >-
      Vorname eines Kindes in der Entity-ID (`sensor.temperatur_kind_1_*`,
      `light.kind_2`, `light.kinderzimmer_kind_2_namenslicht`); `1`/`2` entsprechen
      den Anzeigenamen „Kinderzimmer 1“/„Kinderzimmer 2“
    finden: Einstellungen → Geräte & Dienste → Entitäten, nach Raum oder Gerät suchen

  - id: weather.wohnort
    muster: 'weather\.wohnort'
    anzeige: '`weather.wohnort`'
    steht_fuer: Wetter-Entity des Wohnorts (Vorhersage, Bedingung fürs Icon)
    finden: >-
      Einstellungen → Geräte & Dienste → Deutscher Wetterdienst (HACS,
      `dwd_weather`) → Station → Entität `weather.*`

  - id: sensor.warnregion_*
    muster: 'sensor\.warnregion_'
    anzeige: '`sensor.warnregion_*`'
    steht_fuer: >-
      Sensoren der DWD-Wetterwarnungen (`…_aktuelle_warnstufe`,
      `…_vorwarnstufe`); `warnregion` steht für den Namen der Warnregion
    finden: Einstellungen → Geräte & Dienste → DWD Weather Warnings → Region → Entitäten

  - id: sensor.claude_usage_konto_*
    muster: 'claude_usage_konto'
    anzeige: '`sensor.claude_usage_konto_*`'
    steht_fuer: >-
      Sensoren der HACS-Integration Claude Usage (`…_session_usage`,
      `…_weekly_reset_time`, `…_weekly_<modell>_limit_usage`); `konto` steht
      für Kontoname und Plan aus dem Gerätenamen (`claude_usage_<name>_<plan>`)
    finden: Einstellungen → Geräte & Dienste → Claude Usage → Gerät → Entitäten

  - id: VG Wohnort
    muster: 'VG Wohnort'
    anzeige: '`VG Wohnort`'
    steht_fuer: >-
      Verbandsgemeinde im Titel der Abfuhrtermine (`Restmüll in VG Wohnort`);
      die trash-card ordnet die Termine über diesen Text den Tonnen zu
    finden: >-
      Kalender des Abfallentsorgers (`calendar.mull`) → Titel eines Termins,
      der Teil nach „in“

  - id: telegram_eintrag
    muster: 'telegram_eintrag'
    anzeige: '`telegram_eintrag`'
    steht_fuer: >-
      Config-Entry-ID des Telegram-Bots (`config_entry_id` bei
      `telegram_bot.send_message`)
    finden: >-
      Automationseditor → Aktion „Telegram Bot: Nachricht senden“ → Bot
      auswählen; Home Assistant setzt die ID selbst ein

  - id: tankstelle_<n>
    muster: '[Tt]ankstelle[ _][1-4]'
    anzeige: '`sensor.tankstelle_1_*` bis `sensor.tankstelle_4_*`, Name `Tankstelle 1` bis `Tankstelle 4`'
    steht_fuer: >-
      Tankstelle aus der Tankerkönig-Integration. HA bildet die Entity-ID aus
      Marke und Adresse (`sensor.…_diesel`, `…_super`, `…_super_e10`,
      `binary_sensor.…_status`); der Anzeigename steht frei im Template
    finden: Einstellungen → Geräte & Dienste → Tankerkönig → Tankstelle → Entitäten

  - id: benutzer_id_1/benutzer_id_2
    muster: 'benutzer_id_[12]'
    anzeige: '`benutzer_id_1`, `benutzer_id_2`'
    steht_fuer: >-
      ID eines Home-Assistant-Benutzers in `visible:` (View) und
      `condition: user` (Karte); `1` und `2` trennen zwei Benutzer. Unersetzt
      sind die betroffenen Views und Karten für niemanden sichtbar
    finden: >-
      View- bzw. Karteneditor → *Sichtbarkeit* → Benutzer auswählen, Home
      Assistant setzt die ID selbst ein

  - id: DEIN_EMBED_KEY
    muster: 'DEIN_EMBED_KEY'
    anzeige: '`DEIN_EMBED_KEY`'
    steht_fuer: >-
      API-Schlüssel der Google Maps Embed API für die Routenkarte im Popup.
      Unersetzt zeigt das Popup statt der Karte einen Hinweis
    finden: >-
      Google Cloud Console → APIs & Dienste → Anmeldedaten; nur für „Maps
      Embed API“ freigeben und auf die Adressen der Instanz beschränken

  - id: wlan_heim/wlan_gast
    muster: 'wlan_(heim|gast)'
    anzeige: '`sensor.wlan_heim_clients`, `image.wlan_heim_qr_code`, `switch.wlan_heim_aktiviert`, dasselbe mit `wlan_gast`'
    steht_fuer: >-
      Entitäten der UniFi-Integration je WLAN (Sensor „Clients“, Bild
      „QR-Code“, Schalter „Aktiviert“); HA bildet die ID aus dem Netznamen
      (SSID), beim Clients-Sensor teils ohne `_clients`. Bild und Schalter
      legt die Integration nur an, wenn ihr Konto in der Network-App die
      Site-Rolle admin hat; das Bild ist standardmäßig deaktiviert.
      Unersetzt bleibt die Karte ohne Code
    finden: >-
      Einstellungen → Geräte & Dienste → UniFi Network → Gerät des WLANs
      (Modell „UniFi WLAN“) → Entitäten

# Dateien ohne Kopfblock, die Platzhalter enthalten duerfen. JSON kann keinen
# Kommentar tragen; Doku nennt Platzhalter, um sie zu erklaeren.
dateien_ohne_kopf:
  - .claude/skills/platzhalter-einsetzen/SKILL.md
  - README.md
  - dashboard/README.md
  - design/platzhalter.yaml
  - doku/karten-basemap-carto.md
  - grafana/README.md
  - grafana/energie-dashboard.json
