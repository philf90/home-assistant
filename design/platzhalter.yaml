# Platzhalter fuer persoenliche Angaben -- die verbindliche Liste.
#
# Persoenliche Angaben (Namen, Geraetenamen, Adresse, Kennzeichen, Seriennummern
# in Entity-IDs) stehen im Repo nur als Platzhalter. Die Platzhalter gibt es in
# keiner Home-Assistant-Instanz; eine unveraendert eingefuegte Karte bleibt leer.
# Wie man sie ersetzt: README.md, Abschnitt "Platzhalter ersetzen", und der
# Skill .claude/skills/platzhalter-einsetzen.
#
# ci/check_kopf.py sucht jedes "muster" (regulaerer Ausdruck) in den Dateien
# unter dashboard/ und vergleicht die Treffer mit der Kopfzeile "Platzhalter:"
# der Datei. Dateien ohne Kopfblock (Doku, Grafana-JSON), die einen Platzhalter
# enthalten, muessen unter "dateien_ohne_kopf" stehen.
#
# Neuer Platzhalter: hier eintragen (id, muster, steht_fuer, finden), dann in
# der Datei verwenden und ihren Kopf ergaenzen.

platzhalter:
  - id: person.bewohner
    muster: 'person\.bewohner'
    steht_fuer: Personen-Entity
    finden: Einstellungen -> Personen

  - id: sensor.iphone_*
    muster: 'sensor\.iphone_'
    steht_fuer: Sensoren der Companion App; "iphone" steht fuer den Geraetenamen
    finden: Einstellungen -> Geraete & Dienste -> Mobile App -> Geraet

  - id: notify.mobile_app_iphone
    muster: 'notify\.mobile_app_iphone'
    steht_fuer: Benachrichtigungen an dasselbe Geraet
    finden: Entwicklerwerkzeuge -> Aktionen, Suche "notify.mobile_app_"

  - id: <breite>/<laenge>
    muster: '<breite>|<laenge>'
    steht_fuer: Koordinaten von Zuhause
    finden: Entwicklerwerkzeuge -> Zustaende, zone.home (Attribute latitude, longitude)

  - id: sensor.pv_anlage_*
    muster: 'pv_anlage_'
    steht_fuer: Sensoren der PV-/Solarbank-Anlage (in Grafana ohne "sensor.")
    finden: Einstellungen -> Geraete & Dienste -> Integration der Anlage

  - id: kennzeichen
    muster: 'AB - (?:CD 123|EF 456)'
    steht_fuer: Kennzeichen "AB - CD 123" und "AB - EF 456", reiner Anzeigetext
    finden: "-"

  - id: passat_*_kombiniert
    muster: 'passat_(?:fenster|tueren)_kombiniert'
    steht_fuer: unique_id der Template-Sensoren
    finden: bisherige unique_id uebernehmen, sonst legt HA neue Entities an

  - id: seriennr_<geraet>
    muster: 'seriennr_(?:geschirrspueler|waschmaschine|trockner)'
    steht_fuer: Seriennummer des Home-Connect-Geraets am Anfang der Entity-ID
    finden: Einstellungen -> Geraete & Dienste -> Home-Connect-Integration -> Geraet -> Entitaeten

  - id: '*_seriennr'
    muster: '_seriennr(?:_[12])?(?![a-z])'
    steht_fuer: >-
      Seriennummer des Geraets in der Entity-ID (Homematic IP, Owlet);
      _1/_2 trennen zwei Geraete desselben Modells
    finden: Einstellungen -> Geraete & Dienste -> Integration -> Geraet -> Entitaeten

  - id: '*_mac'
    muster: 'shelly[a-z0-9]*_mac'
    steht_fuer: MAC-Adresse des Shelly-Geraets in der Entity-ID
    finden: Einstellungen -> Geraete & Dienste -> Shelly -> Geraet -> Entitaeten

  - id: fin_*
    muster: 'fin_(?:passat|touran)'
    steht_fuer: >-
      Fahrgestellnummer in der Entity-ID: V2 (volkswagencarnet) mit voller FIN,
      V3 (vag_connect) mit deren letzten 6 Stellen
    finden: Einstellungen -> Geraete & Dienste -> Integration des Fahrzeugs -> Geraet -> Entitaeten

  - id: ieee_adresse
    muster: 'ieee_adresse'
    steht_fuer: IEEE-Adresse des Zigbee-Geraets (0x...), solange die Entity nicht umbenannt ist
    finden: Einstellungen -> Geraete & Dienste -> Zigbee-Integration -> Geraet

  - id: kind_1/kind_2
    muster: 'kind_[12]'
    steht_fuer: >-
      Vorname eines Kindes in der Entity-ID; 1/2 entsprechen den Anzeigenamen
      "Kinderzimmer 1"/"Kinderzimmer 2"
    finden: Einstellungen -> Geraete & Dienste -> Entitaeten, nach Raum oder Geraet suchen

# Dateien ohne Kopfblock, die Platzhalter enthalten duerfen. JSON kann keinen
# Kommentar tragen; Doku nennt Platzhalter, um sie zu erklaeren.
dateien_ohne_kopf:
  - .claude/skills/platzhalter-einsetzen/SKILL.md
  - README.md
  - design/platzhalter.yaml
  - doku/karten-basemap-carto.md
  - grafana/README.md
  - grafana/energie-dashboard.json
