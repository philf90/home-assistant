<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!--
    Social Preview des Repos (GitHub: Settings -> Social preview). Das
    hochgeladene PNG liegt nicht im Repo (die Pruefungen lesen jede Datei als
    Text). Aufbau wie der README-Banner: Kartenhuelle mit
    Verlauf ueber die ganze Flaeche, Dachzeile, Titel, Untertitel und die
    Bereichsfarben der oberen Navigation. Farben: dunkle Werte aus
    design/palette.yaml. Schrift: Inter bzw. Inter Display; das PNG ist mit
    diesen Schriften in Chromium bei 1280 x 640 zu rendern. Nach einer
    Aenderung hier das PNG neu rendern und in GitHub neu hochladen.
  -->
  <defs>
    <linearGradient id="huelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2231"/>
      <stop offset="0.55" stop-color="#171d29"/>
    </linearGradient>
    <filter id="schatten" x="-10%" y="-20%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#171d29"/>
  <rect width="1280" height="640" fill="url(#huelle)"/>
  <text x="112" y="223.0" font-family="Inter, sans-serif" font-size="25.2" font-weight="600" letter-spacing="3.6" fill="#8794a5">HOME ASSISTANT · LOVELACE · GRAFANA</text>
  <text x="112" y="320.2" font-family="'Inter Display', Inter, sans-serif" font-size="86.4" font-weight="700" letter-spacing="-0.9" fill="#e7ecf3">Nachtblau-Dashboard</text>
  <text x="112" y="388.6" font-family="Inter, sans-serif" font-size="36.0" fill="#b4c0cf">Karten, Views und Grafana-Dashboards für Home Assistant</text>
  <rect x="112.0" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#7fb3d5"/>
  <rect x="218.8" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#e6b566"/>
  <rect x="325.6" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#77d4d0"/>
  <rect x="432.4" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#79b8c9"/>
  <rect x="539.2" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#b399d4"/>
  <rect x="646.0" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#f0736a"/>
  <rect x="752.8" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#bdd27f"/>
  <rect x="859.6" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#a6d49e"/>
  <rect x="966.4" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#cdd6e0"/>
  <rect x="1073.2" y="424.6" width="94.8" height="10.8" rx="5.4" fill="#8794a5"/>
</svg>
