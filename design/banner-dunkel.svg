<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="534.9" height="159.1" role="img" aria-label="Nachtblau-Dashboard: Karten, Views und Grafana-Dashboards für Home Assistant">
  <!--
    README-Banner, Fassung dunkel. Eingebunden im README per <picture>
    (prefers-color-scheme). Farben: dunkle Werte aus design/palette.yaml.
    Kartenhuelle wie DESIGN.md, Abschnitt "Bausteine": Verlauf 180 Grad
    (oben bis 0 %, unten ab 55 %), Rand, Schatten.
    Leiste: Bereichsfarben in der Reihenfolge der oberen Navigation
    (Home, Lichter, Energie, Heizung, Geraete, Kamera, Garten, Pflanzen,
    Wetter, Auto).
    Schrift: Systemschrift wie in den Karten; GitHub laedt in eingebundenen
    SVGs keine Webfonts.
  -->
  <title>Nachtblau-Dashboard: Karten, Views und Grafana-Dashboards für Home Assistant</title>
  <defs>
    <linearGradient id="huelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2231"/>
      <stop offset="0.55" stop-color="#171d29"/>
    </linearGradient>
    <filter id="schatten" x="-5%" y="-20%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect x="24" y="22" width="732" height="184" rx="24" fill="rgba(0,0,0,0.7)" filter="url(#schatten)" opacity="0.6"/>
  <rect x="8.5" y="8.5" width="763" height="199" rx="24" fill="url(#huelle)" stroke="rgba(255,255,255,0.05)"/>
  <text x="56" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#8794a5">HOME ASSISTANT · LOVELACE · GRAFANA</text>
  <text x="56" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5" fill="#e7ecf3">Nachtblau-Dashboard</text>
  <text x="56" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#b4c0cf">Karten, Views und Grafana-Dashboards für Home Assistant</text>
  <rect x="56" y="172" width="62" height="6" rx="3" fill="#7fb3d5"/>
