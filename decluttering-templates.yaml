# ============================================================================
# Zentrale Navigations-Bausteine fuer das Owlet-Dashboard (Decluttering-Card)
# ----------------------------------------------------------------------------
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> diesen "decluttering_templates:"
#   Block auf oberster Ebene (neben "views:") einfuegen.
#   Falls schon ein "decluttering_templates:" existiert -> nur die zwei
#   Eintraege darunter ergaenzen.
#
# In JEDER View dann nur noch referenzieren:
#   - type: custom:decluttering-card
#     template: top_navigation
#   ... eigene Karten der Seite ...
#   - type: custom:decluttering-card
#     template: floating_navbar
#
# Voraussetzung: HACS-Karte "decluttering-card".
# ============================================================================
decluttering_templates:
  top_navigation:
    card:
      # Top-Navigation (Launcher-Raster) im Design der ueberarbeiteten
      # Owlet-Smart-Sock-Karte.
      #
      # 10 Kacheln in zwei Reihen als custom:button-card: rundlich-quadratische
      # Icon-Kachel (dezent in der Sektionsfarbe getoent) + Label. Farbe pro Kachel
      # ueber variables.accent; die styles-Bloecke werden per YAML-Anker geteilt.
      #
      # Voraussetzung: custom:button-card (HACS) + die genutzten Icon-Sets
      # (bi, fa6-solid, phu, flat-ui) wie bisher.
      type: vertical-stack
      cards:
        # ---------- Reihe 1: mit Beschriftung ----------
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              variables: { accent: '#7fb3d5' }
              icon: mdi:home-assistant
              name: Home
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-home/home }
              styles: &tile_labeled
                card:
                  - padding: 12px 6px 11px
                  - border-radius: 18px
                  - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
                  - border: 1px solid rgba(255, 255, 255, 0.05)
                  - box-shadow: 0 12px 30px -20px rgba(0,0,0,0.7)
                grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-rows: min-content min-content
                  - justify-items: center
                img_cell:
                  - width: 44px
                  - height: 44px
                  - border-radius: 13px
                  - margin-bottom: 8px
                  - background: |
                      [[[ return variables.accent + '22'; ]]]
                  - border: |
                      [[[ return '1px solid ' + variables.accent + '44'; ]]]
                icon:
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[ return variables.accent; ]]]
                name:
                  - font-size: 12px
                  - font-weight: 600
                  - color: '#f2f5f8'
                  - white-space: nowrap
                  - overflow: hidden
                  - text-overflow: ellipsis
                  - max-width: 100%
            - type: custom:button-card
              variables: { accent: '#e6b566' }
              icon: bi:house-gear
              name: Lichter
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-home/lichter-fenster-temp }
              styles: *tile_labeled
            - type: custom:button-card
              variables: { accent: '#77d4d0' }
              icon: fa6-solid:plug-circle-bolt
              name: Verbrauch
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-home/energie }
              styles: *tile_labeled
            - type: custom:button-card
              variables: { accent: '#79b8c9' }
              icon: phu:thermostat-v2
              name: Heizung
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-home/heizung }
              styles: *tile_labeled
            - type: custom:button-card
              variables: { accent: '#b399d4' }
              icon: mdi:washing-machine
              name: Geräte
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-home/hausgerate }
              styles: *tile_labeled
        # ---------- Reihe 2: nur Icons ----------
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              variables: { accent: '#f0736a' }
              icon: mdi:cctv
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
              styles: &tile_icononly
                card:
                  - padding: 12px 6px
                  - border-radius: 18px
                  - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
                  - border: 1px solid rgba(255, 255, 255, 0.05)
                  - box-shadow: 0 12px 30px -20px rgba(0,0,0,0.7)
                grid:
                  - grid-template-areas: '"i"'
                  - justify-items: center
                img_cell:
                  - width: 44px
                  - height: 44px
                  - border-radius: 13px
                  - background: |
                      [[[ return variables.accent + '22'; ]]]
                  - border: |
                      [[[ return '1px solid ' + variables.accent + '44'; ]]]
                icon:
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[ return variables.accent; ]]]
            - type: custom:button-card
              variables: { accent: '#9ccc5a' }
              icon: phu:garden
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-home/garten }
              styles: *tile_icononly
            - type: custom:button-card
              variables: { accent: '#a6d49e' }
              icon: mdi:flower
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
              styles: *tile_icononly
            - type: custom:button-card
              variables: { accent: '#cdd6e0' }
              icon: flat-ui:weather
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
              styles: *tile_icononly
            - type: custom:button-card
              variables: { accent: '#8794a5' }
              icon: mdi:car
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
              styles: *tile_icononly


  floating_navbar:
    card:
      # Floating Navbar im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
      # Variante A: aktiver Punkt = gruen getoente Icon-Kachel (wie die Icon-Kacheln
      # im restlichen Dashboard). Inaktive Punkte gedaempft.
      #
      # Wichtig:
      #   - Aeusserer Kartenrahmen wird transparent gemacht (sonst doppelter Wrapper).
      #   - icon_color pro Route ENTFERNT -> Farben kommen komplett aus styles,
      #     sonst ueberstimmt der Inline-icon_color das aktive Gruen.
      #
      # Voraussetzung: custom:navbar-card (HACS).
      type: custom:navbar-card
      mobile:
        show_labels: true
        mode: floating
      desktop:
        show_labels: true
        position: left
        min_width: 768
      styles: |
        /* Aeusseren Kartenrahmen entfernen -> nur die eine Owlet-Leiste bleibt.
           Aktiv-Farbe (--primary-color) auf Owlet-Gruen -> aktives Icon wird gruen. */
        :host {
          background: transparent !important;
          --primary-color: #a6d49e !important;
          --navbar-primary-color: #a6d49e !important;
        }
        ha-card,
        .navbar-card {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          --ha-card-background: transparent !important;
          --card-mod-background: transparent !important;
        }
        /* Die eigentliche schwebende Leiste = Owlet-Huelle */
        .navbar {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.06) !important;
          border-radius: 26px !important;
          box-shadow: 0 22px 50px -20px rgba(0,0,0,0.85) !important;
          --primary-color: #a6d49e !important;
          /* etwas Luft, damit erster/letzter Punkt nicht an die runden Ecken stoesst */
          padding-left: 10px !important;
          padding-right: 10px !important;
        }
        /* Jeder Punkt: Icon + Label gedaempft */
        .route .button {
          border-radius: 14px !important;
        }
        .route ha-icon,
        .route .icon {
          color: #8794a5 !important;
        }
        .route .label {
          color: #8794a5 !important;
          font-size: 11px !important;
          font-weight: 600 !important;
          letter-spacing: 0.01em !important;
        }
        /* Aktiver Punkt: gruen getoente Kachel + gruenes Icon/Label */
        .route.active .button,
        .route[data-active="true"] .button,
        .button.active {
          background: rgba(166, 212, 158, 0.16) !important;
          border: 1px solid rgba(166, 212, 158, 0.28) !important;
          /* Feste, kompakte Groesse + zentriert -> umschliesst nur das Icon,
             keine Ueberlappung mit Nachbarn oder Rand */
          box-sizing: border-box !important;
          flex: 0 0 auto !important;
          width: 46px !important;
          min-width: 46px !important;
          max-width: 46px !important;
          height: 40px !important;
          padding: 0 !important;
          margin: 0 auto !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }
        .route.active ha-icon,
        .route[data-active="true"] ha-icon,
        .button.active ha-icon,
        .route.active .icon,
        .button.active .icon {
          color: #a6d49e !important;
        }
        .route.active .label,
        .route[data-active="true"] .label,
        .button.active .label {
          color: #a6d49e !important;
          font-weight: 700 !important;
        }
        /* "More"-Popup: Owlet-Hintergrund (Layout steuert navbar-card selbst) */
        .navbar-popup,
        .popup {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.06) !important;
          border-radius: 22px !important;
          box-shadow: 0 22px 50px -20px rgba(0,0,0,0.85) !important;
        }
        .navbar-popup ha-icon,
        .popup ha-icon {
          color: #f2f5f8 !important;
        }
      routes:
        - url: /dashboard-home/home
          icon: mdi:home-assistant
          icon_selected: mdi:home-assistant
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/home
        - url: /dashboard-home/lichter-fenster-temp
          icon: bi:house-gear
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/lichter-fenster-temp
        - url: /dashboard-home/energie
          icon: fa6-solid:plug-circle-bolt
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/energie
        - url: /dashboard-home/heizung
          icon: phu:thermostat-v2
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/heizung
        - url: /dashboard-home/hausgerate
          icon: mdi:washing-machine
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/hausgerate
        # "More" oeffnet ein Owlet-Raster-Menue via browser_mod.popup.
        # Voraussetzung: HACS-Integration "browser_mod".
        - icon: mdi:dots-horizontal
          label: More
          tap_action:
            action: call-service
            service: browser_mod.popup
            service_data:
              title: Menü
              # Dialog-Oberflaeche auf Owlet-Navy statt Schwarz
              style: |
                --mdc-theme-surface: #1b2231;
                --ha-card-background: #1b2231;
                --card-background-color: #1b2231;
                --primary-background-color: #171d29;
                --secondary-background-color: #1b2231;
                --primary-text-color: #f2f5f8;
                --secondary-text-color: #8794a5;
                --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
              content:
                type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:cctv
                    name: Kamera
                    tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
                    styles: &menu_tile
                      card:
                        - padding: 14px 8px 12px
                        - border-radius: 16px
                        - background: rgba(255, 255, 255, 0.04)
                        - border: 1px solid rgba(255, 255, 255, 0.06)
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 42px
                        - height: 42px
                        - border-radius: 13px
                        - background: 'rgba(166, 212, 158, 0.12)'
                        - border: 1px solid rgba(166, 212, 158, 0.20)
                        - margin-bottom: 9px
                      icon:
                        - width: 22px
                        - height: 22px
                        - color: '#a6d49e'
                      name:
                        - font-size: 12.5px
                        - font-weight: 600
                        - color: '#f2f5f8'
                  - type: custom:button-card
                    icon: mdi:flower
                    name: Pflanzen
                    tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:weather-partly-cloudy
                    name: Wetter
                    tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:car
                    name: Auto
                    tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:home-automation
                    name: Homematic
                    tap_action: { action: navigate, navigation_path: /dashboard-home/homematic-ip }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:router-network
                    name: Netzwerk
                    tap_action: { action: navigate, navigation_path: /dashboard-home/netzwerk }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:zigbee
                    name: Zigbee
                    tap_action: { action: navigate, navigation_path: /45df7312_zigbee2mqtt/ingress }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:cog
                    name: Einstellungen
                    tap_action: { action: navigate, navigation_path: /config/dashboard }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:hammer
                    name: Entwickler
                    tap_action: { action: navigate, navigation_path: /developer-tools/yaml }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:power
                    name: Neustart
                    tap_action:
                      action: call-service
                      service: homeassistant.restart
                      service_data: {}
                      confirmation:
                        text: Home Assistant neustarten?
                    styles:
                      card:
                        - padding: 14px 8px 12px
                        - border-radius: 16px
                        - background: 'rgba(240, 115, 106, 0.10)'
                        - border: 1px solid rgba(240, 115, 106, 0.24)
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 42px
                        - height: 42px
                        - border-radius: 13px
                        - background: 'rgba(240, 115, 106, 0.14)'
                        - border: 1px solid rgba(240, 115, 106, 0.24)
                        - margin-bottom: 9px
                      icon:
                        - width: 22px
                        - height: 22px
                        - color: '#f0736a'
                      name:
                        - font-size: 12.5px
                        - font-weight: 600
                        - color: '#f2f5f8'
