# HINWEIS PLATZHALTER: Seriennummer in den Entity-IDs (seriennr_geschirrspueler)
# Anonymisiert -- vor dem Einfuegen durch die eigenen Werte ersetzen.
# Tabelle und Vorgehen: README.md, Abschnitt "Platzhalter ersetzen".
#
# Geschirrspueler (Home Connect / BSH) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# Icon in zustandsgefaerbter Owlet-Kachel, Owlet-Huelle, separate Programmzeile
# (gruen, nur beim Laufen), Fortschrittsbalken + Restzeit (aus ISO-Endzeitpunkt)
# in der Owlet-Palette. Zustandsfarben: laeuft -> gruen, fertig -> teal,
# pausiert -> amber, Fehler -> rot, sonst gedaempft.
#
# Alle Zustandsabfragen laufen ueber variables.op_state statt entity.state:
# Home Connect verschluckt gelegentlich das Run-Event (beobachtet nach einem
# Aus/Ein kurz vor dem Start -- beide Integrationen blieben auf "Ready", waehrend
# Programm, Fortschritt und Endzeit normal aktualisiert wurden). op_state setzt
# dann "Run" ein, solange ein aktives Programm und ein Fortschritt > 0 gemeldet
# werden. Nach Programmende fallen beide sofort auf unknown / unavailable, der
# Fallback greift dann nicht mehr. "> 0" statt nur "numerisch", weil bei einer
# Startverzoegerung (DelayedStart) das Programm schon gesetzt ist und der
# Fortschritt stundenlang auf 0 steht -- ginge dieses Event verloren, stuende
# sonst die ganze Wartezeit "Laeuft" da.
#
# Voraussetzung: custom:button-card (HACS).
type: custom:button-card
entity: sensor.seriennr_geschirrspueler_bsh_common_status_operationstate
icon: mdi:dishwasher
name: Geschirrspüler
show_state: false
show_name: true
show_icon: true
variables:
  progress_entity: sensor.seriennr_geschirrspueler_bsh_common_option_programprogress
  time_entity: sensor.seriennr_geschirrspueler_bsh_common_option_remainingprogramtime
  program_entity: sensor.seriennr_geschirrspueler_active_program
  # Effektiver Betriebszustand (siehe Kopfkommentar). Nur Ready/Inactive bzw.
  # ein fehlender Status werden ueberstimmt, alle anderen Zustaende (Pause,
  # Fehler, Fertig, ...) kommen unveraendert durch.
  op_state: |
    [[[
      const s = entity ? entity.state : 'unknown';
      const overridable = ['BSH.Common.EnumType.OperationState.Ready',
                           'BSH.Common.EnumType.OperationState.Inactive',
                           'unknown', 'unavailable'];
      if (!overridable.includes(s)) return s;

      const prog = states[variables.program_entity];
      const prgs = states[variables.progress_entity];
      const hasProgram = prog && !['unknown', 'unavailable', ''].includes(prog.state);
      const hasProgress = prgs && parseFloat(prgs.state) > 0;
      return (hasProgram && hasProgress) ? 'BSH.Common.EnumType.OperationState.Run' : s;
    ]]]
state:
  - operator: template
    value: "[[[ return variables.op_state === 'BSH.Common.EnumType.OperationState.Run'; ]]]"
    spin: true
styles:
  card:
    - padding: 14px 16px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
    - overflow: hidden
    # Statusrand links (wie Personenkarten / Meteoalarm-Popup). Muss NACH
    # "border" stehen, sonst ueberschreibt die Kurzform ihn wieder.
    # "Finished" wird VOR "Run" geprueft - sonst greift der Run-Zweig zuerst.
    - border-left: |
        [[[
          const s = variables.op_state;
          if (s.includes('Finished')) return '4px solid #7fd0d5';
          if (s.includes('Error'))    return '4px solid #f0736a';
          if (s.includes('Pause'))    return '4px solid #e6b566';
          if (s.includes('Run'))      return '4px solid #a6d49e';
          return '4px solid #3a4453';
        ]]]
  grid:
    - grid-template-areas: '"i n" "i status" "i program" "i progress" "i time"'
    - grid-template-columns: min-content auto
    - grid-template-rows: auto auto auto auto auto
  img_cell:
    - width: 52px
    - height: 52px
    - border-radius: 15px
    - margin-right: 14px
    - align-self: center
    - background: |
        [[[
          const s = variables.op_state;
          let a = '#6e7988';
          if (s.includes('Finished')) a = '#7fd0d5';
          else if (s.includes('Run')) a = '#a6d49e';
          else if (s.includes('Error')) a = '#f0736a';
          else if (s.includes('Pause')) a = '#e6b566';
          return a + '29';
        ]]]
    - border: |
        [[[
          const s = variables.op_state;
          let a = '#6e7988';
          if (s.includes('Finished')) a = '#7fd0d5';
          else if (s.includes('Run')) a = '#a6d49e';
          else if (s.includes('Error')) a = '#f0736a';
          else if (s.includes('Pause')) a = '#e6b566';
          return '1px solid ' + a + '3d';
        ]]]
  icon:
    - width: 28px
    - height: 28px
    - color: |
        [[[
          const s = variables.op_state;
          if (s.includes('Finished')) return '#7fd0d5';
          if (s.includes('Run')) return '#a6d49e';
          if (s.includes('Error')) return '#f0736a';
          if (s.includes('Pause')) return '#e6b566';
          return '#6e7988';
        ]]]
  name:
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: '#f2f5f8'
    - text-align: left
    - justify-self: start
    - align-self: end
  custom_fields:
    status:
      - font-size: 13px
      - color: '#8794a5'
      - text-align: left
      - justify-self: start
      - align-self: start
      - margin-top: 2px
    program:
      - font-size: 12.5px
      - font-weight: 600
      - color: '#a6d49e'
      - text-align: left
      - justify-self: start
      - align-self: start
      - padding-bottom: 8px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    progress:
      - width: 100%
      - padding: 2px 0
    time:
      - font-size: 12px
      - color: '#8794a5'
      - text-align: right
      - width: 100%
      - padding-top: 4px
custom_fields:
  status: |
    [[[
      const state = variables.op_state;
      const stateMap = {
        'BSH.Common.EnumType.OperationState.Inactive':       'Inaktiv',
        'BSH.Common.EnumType.OperationState.Ready':          'Bereit',
        'BSH.Common.EnumType.OperationState.DelayedStart':   'Startverzögerung',
        'BSH.Common.EnumType.OperationState.Run':            'Läuft',
        'BSH.Common.EnumType.OperationState.Pause':          'Pausiert',
        'BSH.Common.EnumType.OperationState.ActionRequired': 'Eingriff erforderlich',
        'BSH.Common.EnumType.OperationState.Finished':       'Fertig',
        'BSH.Common.EnumType.OperationState.Error':          'Fehler',
        'BSH.Common.EnumType.OperationState.Aborting':       'Wird abgebrochen',
      };
      return stateMap[state] || state;
    ]]]
  program: |
    [[[
      const operationState = variables.op_state;
      if (!operationState.includes('Run')) return '';

      const programEntity = states[variables.program_entity];
      if (!programEntity || programEntity.state === 'unavailable' || programEntity.state === 'unknown') return '';

      // Achtung: Die Kennung schreibt sich "Dishwasher", nicht "DishWasher" --
      // mit dem falschen Binnen-W greift die Map nie und es bleibt beim Rohwert.
      const programMap = {
        'Dishcare.Dishwasher.Program.Auto1':         'Auto 45-65°',
        'Dishcare.Dishwasher.Program.Auto2':         'Auto 50-65°',
        'Dishcare.Dishwasher.Program.Auto3':         'Auto 60-70°',
        'Dishcare.Dishwasher.Program.Eco50':         'Eco 50°',
        'Dishcare.Dishwasher.Program.Quick45':       'Quick 45°',
        'Dishcare.Dishwasher.Program.Quick65':       'Quick 65°',
        'Dishcare.Dishwasher.Program.Intensiv70':    'Intensiv 70°',
        'Dishcare.Dishwasher.Program.Normal65':      'Normal 65°',
        'Dishcare.Dishwasher.Program.GlassShine':    'Glanz & Frische',
        'Dishcare.Dishwasher.Program.PreRinse':      'Vorspülen',
        'Dishcare.Dishwasher.Program.MachineCare':   'Maschinenpflege',
        'Dishcare.Dishwasher.Program.SteamFresh':    'Steam Fresh',
        'Dishcare.Dishwasher.Program.MixedLoad':     'Gemischte Beladung',
      };

      const programRaw = programEntity.state;
      if (programMap[programRaw]) return programMap[programRaw];

      // Unbekanntes Programm: letztes Segment nach dem letzten Punkt,
      // CamelCase → lesbar (statt der rohen BSH-Kennung)
      const parts = programRaw.split('.');
      return parts[parts.length - 1].replace(/([A-Z])/g, ' $1').trim();
    ]]]
  progress: |
    [[[
      const progressEntity = states[variables.progress_entity];
      const progress = progressEntity ? parseFloat(progressEntity.state) || 0 : 0;

      const operationState = variables.op_state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive) return '';

      const color = operationState.includes('Pause') ? '#e6b566' : '#a6d49e';

      return `
        <div style="
          width: 100%;
          background: rgba(255,255,255,0.08);
          border-radius: 5px;
          height: 6px;
          overflow: hidden;
        ">
          <div style="
            width: ${progress}%;
            background: ${color};
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
          "></div>
        </div>
      `;
    ]]]
  time: |
    [[[
      const timeEntity = states[variables.time_entity];
      const progressEntity = states[variables.progress_entity];

      const operationState = variables.op_state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || !timeEntity) return '';

      // Entität liefert einen ISO-Timestamp (Endzeitpunkt)
      const endTime = new Date(timeEntity.state);
      const remainingSeconds = Math.max(0, Math.round((endTime - new Date()) / 1000));
      const progress = parseFloat(progressEntity ? progressEntity.state : 0) || 0;

      if (isNaN(endTime.getTime()) || remainingSeconds === 0) return `${progress.toFixed(0)}%`;

      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);

      let timeStr = '';
      if (hours > 0) timeStr += `${hours} h `;
      timeStr += `${minutes} min`;

      return `${progress.toFixed(0)}% &nbsp;<span style="opacity:0.5">·</span>&nbsp; noch ca. ${timeStr}`;
    ]]]
