# Muellabfuhr v2 - "Countdown-Hero" im Owlet-Look
# ============================================================================
# Unterschied zur v1 (muellabfuhr-trash-card.yaml, bleibt unveraendert):
#   v1 = custom:trash-card, gleichrangige Zeilen je Termin.
#   v2 = custom:button-card, EIN grosser Hero fuer die naechste(n) Abholung(en)
#        + eine "Danach"-Liste (eine Zeile je Abholtag) fuer die Folgetermine.
#
# WARUM EIN ZUSAETZLICHER SENSOR?
#   button-card kann NICHT asynchron den Kalender abfragen. Eine calendar-Entity
#   liefert als Attribut nur den EINEN naechsten Termin. Deshalb liest ein
#   trigger-basierter Template-Sensor per calendar.get_events die naechsten Tage
#   in ein Listen-Attribut "events". Die Karte rendert daraus alles selbst.
#
# ---------------------------------------------------------------------------
# ERFORDERLICHER SENSOR  (configuration.yaml bzw. packages/) - EINMALIG:
# ---------------------------------------------------------------------------
# template:
#   - trigger:
#       - platform: homeassistant
#         event: start
#       - platform: time_pattern
#         hours: "/1"                 # stuendlich aktualisieren
#     action:
#       - service: calendar.get_events
#         target:
#           entity_id: calendar.mull
#         data:
#           start_date_time: "{{ today_at('00:00') }}"
#           duration: { days: 7 }      # = "next_days" der v1
#         response_variable: agenda
#     sensor:
#       - name: "Muell Termine"
#         unique_id: muell_termine
#         icon: mdi:recycle
#         state: >
#           {{ agenda['calendar.mull'].events | count }}
#         attributes:
#           events: >
#             {% set today = now().date() %}
#             {% set ns = namespace(list=[]) %}
#             {% for e in agenda['calendar.mull'].events %}
#               {% set d = strptime(e.start[:10], '%Y-%m-%d').date() %}
#               {% set ns.list = ns.list + [{
#                   'summary': e.summary,
#                   'date': d | string,
#                   'days': (d - today).days }] %}
#             {% endfor %}
#             {{ ns.list }}
#
#   -> Ergebnis: sensor.muell_termine.attributes.events =
#      [ {summary:'Restmuell in VG Offenbach', date:'2026-07-22', days:2}, ... ]
#      (nach Datum aufsteigend; die Karte sortiert zur Sicherheit erneut).
#
# HINWEIS: In der Karte unten nur den Sensor-Namen anpassen, falls abweichend:
#          variables.src_entity.
#
# Voraussetzung: custom:button-card + card-mod (HACS) + obiger Template-Sensor.
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 16px 14px !important;
      gap: 10px !important;
    }
cards:
  # ---------- Kopfzeile (wie v1) ----------
  - type: custom:button-card
    entity: calendar.mull
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    icon: mdi:recycle
    name: Müllabfuhr
    label: Nächste Abholungen
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 2px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: min-content 1fr
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 46px
        - height: 46px
        - border-radius: 14px
        - background: 'rgba(166, 212, 158, 0.14)'
        - border: 1px solid rgba(166, 212, 158, 0.22)
        - margin-right: 15px
      icon:
        - width: 24px
        - height: 24px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: end
        - font-size: 18px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 13px
        - color: '#6e7988'
        - margin-top: 2px

  # ---------- Countdown-Hero + Folgetermin-Chips ----------
  - type: custom:button-card
    entity: sensor.muell_termine
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    variables:
      src_entity: sensor.muell_termine
    triggers_update:
      - sensor.muell_termine
    tap_action:
      action: more-info
      entity: calendar.mull
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        # WICHTIG: button-card rendert jedes custom_field als
        # <div id="body" class="ellipsis"> und .ellipsis setzt
        # "white-space:nowrap; overflow:hidden". Ohne das Zuruecksetzen erbt
        # JEDER Text im Karteninhalt nowrap - lange Zeilen (z. B.
        # "Freitag, 7. Aug. · abends rausstellen") laufen dann ueber den
        # Kartenrand und werden hart abgeschnitten statt umzubrechen.
        body:
          - width: 100%
          - white-space: normal
          - overflow-wrap: break-word
    custom_fields:
      body: |
        [[[
          // ---------- Palette ----------
          const MUTED='#6e7988', TEXT='#f2f5f8', RED='#f0736a', SUB='rgba(255,255,255,0.55)';
          const font="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif";

          // ---------- Icons (mdi, exakt wie v1) ----------
          const ICONS={
            waste:  'mdi:trash-can-outline',
            organic:'mdi:flower-outline',
            paper:  'mdi:newspaper-variant-outline',
            recycle:'mdi:recycle',
            hazard: 'mdi:dump-truck'
          };
          // Typ-Erkennung ueber den Kalender-Summary (wie die v1-"pattern"-Liste)
          const RULES=[
            {re:/bio|organic/i,        label:'Bio',          color:'#a6d49e', icon:'organic'},
            {re:/papier|paper/i,       label:'Papier',       color:'#7fb3d5', icon:'paper'},
            {re:/wertstoff|gelb|recyc/i,label:'Gelber Sack',  color:'#e6b566', icon:'recycle'},
            {re:/restm|waste/i,        label:'Restmüll',     color:'#8794a5', icon:'waste'},
            {re:/problem/i,            label:'Problemabfall',color:'#b399d4', icon:'hazard'},
            {re:/sperr/i,              label:'Sperrmüll',    color:'#b399d4', icon:'hazard'}
          ];
          const classify=(sum)=>{
            for(const r of RULES){ if(r.re.test(sum||'')) return {label:r.label, color:r.color, icon:r.icon}; }
            return {label:(sum||'Termin'), color:'#8794a5', icon:'waste'};
          };
          const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
          const MO=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
          const dateFmt=(iso)=>{
            const p=(iso||'').split('-').map(Number);
            if(p.length<3) return {wd:'',txt:''};
            const dt=new Date(p[0],p[1]-1,p[2]);
            return { wd:WD[dt.getDay()], txt:`${p[2]}. ${MO[p[1]-1]}` };
          };
          // WICHTIG - Ursache des "verschobenen" Icons:
          // ha-icon rendert intern ein ha-svg-icon, das per Default
          // "display:inline-flex; vertical-align:middle" ist. Damit haengt das
          // Symbol an der Textbasislinie der umgebenden Zeile und sitzt
          // messbar 2,5px zu tief (deshalb stand im Hero frueher ein
          // translateY(-2px) als Pflaster).
          // Fix an der Wurzel: --ha-icon-display:block nimmt dem inneren
          // ha-svg-icon den Inline-Fluss, display:block gilt fuer die Huelle,
          // line-height:0 am Container laesst gar keine Textzeile entstehen.
          const ico=(name,color,px)=>`<ha-icon icon="${ICONS[name]||ICONS.waste}" style="display:block;--ha-icon-display:block;flex:0 0 auto;color:${color};--mdc-icon-size:${px}px;width:${px}px;height:${px}px;"></ha-icon>`;
          // Icon-Kachel (getoentes Quadrat) - zentriert das Icon zuverlaessig.
          const tile=(name,color,box,px,radius)=>`<div style="width:${box}px;height:${box}px;border-radius:${radius}px;display:flex;align-items:center;justify-content:center;line-height:0;flex:0 0 auto;background:${color}22;border:1px solid ${color}3d;">${ico(name,color,px)}</div>`;

          // ---------- Daten einlesen ----------
          const S=states[variables.src_entity];
          let raw=(S && S.attributes && Array.isArray(S.attributes.events)) ? S.attributes.events.slice() : null;

          // white-space:normal hebt das von .ellipsis geerbte nowrap auch dann
          // auf, wenn die Karte ohne die styles.custom_fields.body oben
          // kopiert wird. Doppelt gemoppelt, aber billig.
          const shell=(inner)=>`<div style="width:100%;font-family:${font};text-align:left;color:${TEXT};white-space:normal;overflow-wrap:break-word;">${inner}</div>`;

          // Sensor fehlt -> Hinweis (statt leerer Karte)
          if(raw===null){
            return shell(`<div style="display:flex;align-items:center;gap:12px;background:rgba(240,115,106,0.09);border:1px solid rgba(240,115,106,0.22);border-radius:16px;padding:14px 16px;">
              ${ico('hazard',RED,22)}
              <div><div style="font-weight:700;font-size:14px;color:${TEXT};">Sensor fehlt</div>
              <div style="font-size:12.5px;color:${MUTED};margin-top:2px;">Bitte <b>${variables.src_entity}</b> anlegen (siehe Kopf der YAML-Datei).</div></div></div>`);
          }

          // Bestimmte Termine komplett ausblenden (Summary-Muster).
          // "Restmüll blau" rausfiltern -> es bleibt nur der normale Restmüll.
          // Weitere unerwuenschte Termine einfach als Regex ergaenzen.
          const EXCLUDE=[/restm.*blau/i];
          raw=raw.filter(e=>!EXCLUDE.some(re=>re.test(e.summary||'')));

          // Normalisieren + sortieren (Tage; Fallback aus date berechnen)
          const today=new Date(); today.setHours(0,0,0,0);
          const items=raw.map(e=>{
            let days=(e.days!==undefined&&e.days!==null)?parseInt(e.days):null;
            if(days===null && e.date){ const p=e.date.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]); days=Math.round((d-today)/86400000); }
            const f=dateFmt(e.date);
            return Object.assign({days:days, wd:f.wd, dtxt:f.txt}, classify(e.summary));
          }).filter(x=>x.days!==null && x.days>=0).sort((a,b)=>a.days-b.days);

          // Keine Termine -> ruhiger Leerzustand
          if(items.length===0){
            return shell(`<div style="display:flex;align-items:center;gap:12px;background:rgba(166,212,158,0.08);border:1px solid rgba(166,212,158,0.2);border-radius:16px;padding:16px;">
              ${ico('organic','#a6d49e',22)}
              <div style="font-size:14px;color:${TEXT};font-weight:600;">Keine Abholung in den nächsten 7 Tagen</div></div>`);
          }

          // ---------- Gruppierung: gleicher Tag = ein Hero ----------
          const minDays=items[0].days;
          const heroItems=items.filter(i=>i.days===minDays);   // >1 => mehrere Tonnen am selben Tag
          const rest=items.filter(i=>i.days>minDays);

          // Dringlichkeit faerbt den Hero: heute=rot, morgen=amber, sonst Typfarbe
          const urgent = minDays===0 ? RED : (minDays===1 ? '#e6b566' : heroItems[0].color);
          const heroBg = minDays===0 ? 'rgba(240,115,106,0.10)' : (minDays===1 ? 'rgba(230,181,102,0.10)' : heroItems[0].color+'19');
          const heroBd = minDays===0 ? 'rgba(240,115,106,0.24)' : (minDays===1 ? 'rgba(230,181,102,0.24)' : heroItems[0].color+'3d');

          // Grosse Countdown-Anzeige
          const big = minDays===0
            ? `<div style="font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:.9;color:${urgent};">Heute</div>`
            : minDays===1
              ? `<div style="font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:.9;color:${urgent};">Morgen</div>`
              : `<div style="display:flex;align-items:baseline;gap:6px;color:${urgent};line-height:.85;">
                   <span style="font-size:50px;font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;">${minDays}</span>
                   <span style="font-size:19px;font-weight:600;color:${MUTED};">Tage</span></div>`;

          const heroWhen=`${heroItems[0].wd}, ${heroItems[0].dtxt}`;
          // Der Rausstell-Hinweis haengt NICHT mehr als " · abends rausstellen"
          // am Datum: als ein langer Textknoten konnte er nur mitten im Satz
          // umbrechen (und lief mit geerbtem nowrap ueber den Kartenrand).
          // Jetzt ist er eine eigene, nicht umbrechende Pille in der
          // Dringlichkeitsfarbe - passt er nicht mehr neben das Datum, rutscht
          // er als Ganzes in die naechste Zeile.
          const hintPill = minDays<=1
            ? `<span style="display:inline-flex;align-items:center;flex:0 0 auto;background:${urgent}1a;border:1px solid ${urgent}33;color:${urgent};font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;">abends rausstellen</span>`
            : '';
          const whenLine = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;">
                    <span style="font-size:12.5px;color:${MUTED};">${heroWhen}</span>${hintPill}
                  </div>`;
          const multi = heroItems.length>1;   // mehrere Tonnen am selben Tag?

          let hero;
          if(!multi){
            // EINE Abholung: grosse Titelzeile + eine Icon-Kachel rechts.
            const i0=heroItems[0];
            hero=`
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:${heroBg};border:1px solid ${heroBd};border-radius:18px;padding:16px 18px;">
                <div style="flex:0 0 auto;min-width:74px;">${big}</div>
                <div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 130px;">
                  <div style="font-size:18px;font-weight:750;letter-spacing:-0.02em;color:${TEXT};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i0.label}</div>
                  ${whenLine}
                </div>
                <div style="margin-left:auto;">${tile(i0.icon,i0.color,46,24,14)}</div>
              </div>`;
          } else {
            // MEHRERE Abholungen am selben Tag: Datum oben, darunter je Tonne
            // eine eigene Pille (Icon + voller Name). Bricht um -> nichts wird
            // abgeschnitten, alle Namen bleiben vollstaendig lesbar.
            const pills=heroItems.map(i=>`
              <span style="display:inline-flex;align-items:center;gap:6px;background:${i.color}1e;border:1px solid ${i.color}3d;color:${TEXT};font-size:13px;font-weight:700;padding:5px 10px;border-radius:11px;white-space:nowrap;">
                ${ico(i.icon,i.color,15)}${i.label}
              </span>`).join('');
            hero=`
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:${heroBg};border:1px solid ${heroBd};border-radius:18px;padding:16px 18px;">
                <div style="flex:0 0 auto;min-width:74px;">${big}</div>
                <div style="display:flex;flex-direction:column;gap:9px;min-width:0;flex:1 1 130px;">
                  ${whenLine}
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">${pills}</div>
                </div>
              </div>`;
          }

          // ---------- Folgetermine (dynamisch; leer => nichts) ----------
          // Frueher: zentrierte "+N Tg"-Kacheln nebeneinander. Bei nur EINEM
          // Folgetermin wirkte die einzelne, breit gezogene Kachel verloren.
          // Jetzt: volle Zeilen unter einer "Danach"-Ueberschrift, je Abholtag
          // eine Zeile (Datum + ausgeschriebener Countdown oben, Tonnen-Pillen
          // darunter). Eine Zeile sieht damit genauso gewollt aus wie fuenf und
          // benutzt dieselbe Pillen-Sprache wie der Hero.
          let follow='';
          if(rest.length>0){
            // Folgetermine nach Tag gruppieren -> mehrere Tonnen am selben Tag
            // landen in EINER Zeile statt in mehreren fast identischen Kacheln.
            const groups=[];
            rest.forEach(i=>{
              const g=groups.find(x=>x.days===i.days);
              if(g) g.items.push(i);
              else groups.push({days:i.days, wd:i.wd, dtxt:i.dtxt, items:[i]});
            });
            const row=(g)=>{
              const when = g.days===1 ? 'morgen' : `in ${g.days} Tagen`;
              const pills=g.items.map(i=>`
                <span style="display:inline-flex;align-items:center;gap:6px;background:${i.color}1e;border:1px solid ${i.color}3d;color:${TEXT};font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:10px;white-space:nowrap;">
                  ${ico(i.icon,i.color,15)}${i.label}
                </span>`).join('');
              return `<div style="background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                  <span style="font-size:12.5px;color:${MUTED};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${g.wd}, ${g.dtxt}</span>
                  <span style="font-size:12px;font-weight:700;color:${SUB};background:rgba(255,255,255,0.05);border-radius:8px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;">${when}</span>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">${pills}</div>
              </div>`;
            };
            follow=`<div style="margin-top:12px;">
              <div style="font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:${MUTED};margin:0 2px 7px;">Danach</div>
              <div style="display:flex;flex-direction:column;gap:8px;">${groups.map(row).join('')}</div>
            </div>`;
          }

          return shell(hero+follow);
        ]]]
