# Muellabfuhr im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
#
# Aufbau wie die Pollenflug-Karte: EINE Owlet-Huelle mit Kopfzeile
# (Icon-Kachel + Titel + Untertitel) und den getoenten Termin-Kacheln darin.
#
# WICHTIG:
# 1) Die trash-card liest den Kalender calendar.mull (mehrere Termine) und
#    rendert jeden Termin als eigene Karte. Deshalb wird alles in einen
#    vertical-stack gepackt, dessen #root per card_mod die Owlet-Huelle bekommt.
# 2) Im color_mode: background akzeptiert die trash-card nur BENANNTE Farben
#    (green/blue/amber/grey/purple/pink) - kein Hex/rgba.
# 3) Textfarbe der trash-card ueber CSS-Variablen (durchdringen Shadow-DOM).
#
# Voraussetzung: custom:button-card, custom:trash-card, card-mod (HACS).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 16px 14px !important;
      gap: 10px !important;
    }
cards:
  # ---------- Kopfzeile ----------
  - type: custom:button-card
    entity: calendar.mull
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    icon: mdi:recycle
    name: Müllabfuhr
    label: Nächste Abholungen
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 2px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: min-content 1fr
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 46px
        - height: 46px
        - border-radius: 14px
        - background: 'rgba(166, 212, 158, 0.14)'
        - border: 1px solid rgba(166, 212, 158, 0.22)
        - margin-right: 15px
      icon:
        - width: 24px
        - height: 24px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: end
        - font-size: 18px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 13px
        - color: '#6e7988'
        - margin-top: 2px

  # ---------- Muellabfuhr-Termine ----------
  - type: custom:trash-card
    entities:
      - calendar.mull
    event_grouping: true
    drop_todayevents_from: '10:00:00'
    next_days: 7
    day_style: default
    day_style_format: yyyy.MM.dd
    card_style: card
    alignment_style: left
    color_mode: background
    items_per_row: 1
    refresh_rate: 60
    with_label: true
    layout: default
    use_summary: false
    hide_time_range: false
    filter_events: true
    pattern:
      - icon: mdi:flower-outline
        color: green
        type: organic
        pattern: Biotonne in VG Offenbach
      - icon: mdi:newspaper-variant-outline
        color: blue
        type: paper
        pattern: Papiertonne in VG Offenbach
      - icon: mdi:recycle
        color: amber
        type: recycle
        pattern: Wertstoffsack in VG Offenbach
      - icon: mdi:trash-can-outline
        color: grey
        type: waste
        pattern: Restmüll in VG Offenbach
      - icon: mdi:dump-truck
        color: purple
        type: others
      - label: Problemabfall
        icon: mdi:dump-truck
        color: pink
        type: custom
        pattern: Problemabfall in VG Offenbach
      - label: Sperrmüll
        icon: mdi:dump-truck
        color: pink
        type: custom
        pattern: Sperrmüll
    card_mod:
      style: |
        ha-card {
          border-radius: 14px !important;
          border: 1px solid rgba(255, 255, 255, 0.06) !important;
          box-shadow: none !important;
          padding: 12px 14px !important;
          overflow: hidden !important;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
          /* Dunkler Schleier ueber der benannten Typfarbe -> dezente Toenung */
          background-image: linear-gradient(180deg, rgba(21,26,38,0.62) 0%, rgba(21,26,38,0.70) 100%) !important;
          /* Textfarben ueber Variablen (durchdringen das Shadow-DOM) */
          --primary-text-color: #ffffff !important;
          --secondary-text-color: rgba(255,255,255,0.66) !important;
          --mdc-theme-text-primary-on-background: #ffffff !important;
        }
        ha-card, ha-card * { color: #ffffff !important; }
        ha-card .secondary,
        ha-card [class*="secondary"],
        ha-card [class*="date"],
        ha-card [class*="time"] {
          color: rgba(255,255,255,0.66) !important;
        }
        ha-card ha-icon,
        ha-card ha-svg-icon,
        ha-card svg {
          color: #ffffff !important;
          --mdc-icon-size: 26px;
        }
