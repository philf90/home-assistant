# Muellabfuhr im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
#
# WICHTIG: Diese Karte liest einen Kalender (calendar.mull) mit mehreren
# zukuenftigen Terminen. Ein button-card-Template kann Kalender-Events nicht
# abfragen (nur den aktuellen Entity-Zustand). Deshalb bleibt die trash-card
# erhalten und wird per card_mod auf den Owlet-Look gebracht:
#   - Owlet-Verlaufhuelle, abgerundet, Schatten, Innenabstand
#   - Titel "Muellabfuhr" ueber der Liste
#   - Owlet-Palette + Linien-Icons; nur die Icons sind farbig (color_mode: icon),
#     Zeilen dezent statt vollflaechig bunt -> passt zum Rest des Dashboards.
#
# Voraussetzung: custom:trash-card + card-mod (HACS).
type: custom:trash-card
entities:
  - calendar.mull
event_grouping: true
drop_todayevents_from: '10:00:00'
next_days: 7
day_style: default
day_style_format: yyyy.MM.dd
card_style: card
alignment_style: left
color_mode: icon
items_per_row: 1
refresh_rate: 60
with_label: true
layout: default
use_summary: false
hide_time_range: false
filter_events: true
pattern:
  - icon: mdi:flower-outline
    color: '#a6d49e'
    type: organic
    pattern: Biotonne in VG Offenbach
  - icon: mdi:newspaper-variant-outline
    color: '#7fb3d5'
    type: paper
    pattern: Papiertonne in VG Offenbach
  - icon: mdi:recycle
    color: '#e6b566'
    type: recycle
    pattern: Wertstoffsack in VG Offenbach
  - icon: mdi:trash-can-outline
    color: '#8794a5'
    type: waste
    pattern: Restmüll in VG Offenbach
  - icon: mdi:dump-truck
    color: '#9aa7bd'
    type: others
  - label: Problemabfall
    icon: mdi:dump-truck
    color: '#c98fb0'
    type: custom
    pattern: Problemabfall in VG Offenbach
  - label: Sperrmüll
    icon: mdi:dump-truck
    color: '#c98fb0'
    type: custom
    pattern: Sperrmüll
card_mod:
  style: |
    ha-card {
      border-radius: 22px !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px 14px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    /* Titel ueber der Liste */
    ha-card::before {
      content: "Müllabfuhr";
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f2f5f8;
      padding-bottom: 12px;
    }
