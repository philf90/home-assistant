# Muellabfuhr im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
#
# WICHTIG: Diese Karte liest einen Kalender (calendar.mull) mit mehreren
# zukuenftigen Terminen. Ein button-card-Template kann Kalender-Events nicht
# abfragen, deshalb bleibt die trash-card erhalten und wird per card_mod
# gestylt. Jeder Termin ist eine eigene Karte -> es gibt keinen gemeinsamen
# Titel (der wuerde sich sonst pro Termin wiederholen).
#
# Optik:
#   - color_mode: background setzt die Typfarbe als Kartenhintergrund.
#   - card_mod legt einen dunklen Schleier darueber -> aus der kraeftigen
#     Farbe wird eine dezente Toenung passend zum Muelltyp (Owlet-Dunkel).
#   - Text hell, Icons hell, abgerundete Ecken, Schatten.
#
# Voraussetzung: custom:trash-card + card-mod (HACS).
type: custom:trash-card
entities:
  - calendar.mull
event_grouping: true
drop_todayevents_from: '10:00:00'
next_days: 7
day_style: default
day_style_format: yyyy.MM.dd
card_style: card
alignment_style: left
color_mode: background
items_per_row: 1
refresh_rate: 60
with_label: true
layout: default
use_summary: false
hide_time_range: false
filter_events: true
pattern:
  - icon: mdi:flower-outline
    color: '#5aa46b'
    type: organic
    pattern: Biotonne in VG Offenbach
  - icon: mdi:newspaper-variant-outline
    color: '#5a90c0'
    type: paper
    pattern: Papiertonne in VG Offenbach
  - icon: mdi:recycle
    color: '#d69a3c'
    type: recycle
    pattern: Wertstoffsack in VG Offenbach
  - icon: mdi:trash-can-outline
    color: '#7a8595'
    type: waste
    pattern: Restmüll in VG Offenbach
  - icon: mdi:dump-truck
    color: '#8a86b5'
    type: others
  - label: Problemabfall
    icon: mdi:dump-truck
    color: '#b56fa0'
    type: custom
    pattern: Problemabfall in VG Offenbach
  - label: Sperrmüll
    icon: mdi:dump-truck
    color: '#b56fa0'
    type: custom
    pattern: Sperrmüll
card_mod:
  style: |
    ha-card {
      border-radius: 20px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: 0 16px 40px -24px rgba(0,0,0,0.7) !important;
      padding: 6px 8px !important;
      overflow: hidden !important;
      /* Dunkler Schleier ueber der Typfarbe -> dezente Toenung */
      background-image: linear-gradient(180deg, rgba(20,25,36,0.80) 0%, rgba(20,25,36,0.87) 100%) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
      color: #f2f5f8 !important;
    }
    /* Text hell, Datum dezent */
    ha-card, ha-card * { color: #f2f5f8 !important; }
    ha-card .secondary,
    ha-card [class*="secondary"],
    ha-card [class*="date"],
    ha-card [class*="time"] {
      color: rgba(242,245,248,0.60) !important;
    }
    /* Icons hell und sichtbar auf dunklem Grund */
    ha-card ha-icon,
    ha-card ha-svg-icon,
    ha-card svg {
      color: #f2f5f8 !important;
      --mdc-icon-size: 26px;
    }
