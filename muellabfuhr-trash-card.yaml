# Muellabfuhr im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
#
# WICHTIG: Diese Karte liest einen Kalender (calendar.mull) mit mehreren
# zukuenftigen Terminen. Ein button-card-Template kann Kalender-Events nicht
# abfragen, deshalb bleibt die trash-card erhalten und wird per card_mod
# gestylt. Jeder Termin ist eine eigene Karte -> kein gemeinsamer Titel.
#
# Optik / Trick:
#   - color_mode: background setzt die "color" der Pattern als Kartenhintergrund.
#   - Die Farben sind hier bereits TRANSLUZENT (rgba mit niedriger Deckkraft)
#     -> ergibt eine dezente Toenung ueber dem dunklen Grund, passend zum
#     Muelltyp, statt vollflaechig kraeftig.
#   - card_mod stellt Text + Icons auf hell und rundet die Ecken ab.
#
# Voraussetzung: custom:trash-card + card-mod (HACS).
type: custom:trash-card
entities:
  - calendar.mull
event_grouping: true
drop_todayevents_from: '10:00:00'
next_days: 7
day_style: default
day_style_format: yyyy.MM.dd
card_style: card
alignment_style: left
color_mode: background
items_per_row: 1
refresh_rate: 60
with_label: true
layout: default
use_summary: false
hide_time_range: false
filter_events: true
pattern:
  - icon: mdi:flower-outline
    color: 'rgba(166, 212, 158, 0.32)'
    type: organic
    pattern: Biotonne in VG Offenbach
  - icon: mdi:newspaper-variant-outline
    color: 'rgba(127, 179, 213, 0.32)'
    type: paper
    pattern: Papiertonne in VG Offenbach
  - icon: mdi:recycle
    color: 'rgba(230, 181, 102, 0.32)'
    type: recycle
    pattern: Wertstoffsack in VG Offenbach
  - icon: mdi:trash-can-outline
    color: 'rgba(135, 148, 165, 0.30)'
    type: waste
    pattern: Restmüll in VG Offenbach
  - icon: mdi:dump-truck
    color: 'rgba(154, 167, 189, 0.30)'
    type: others
  - label: Problemabfall
    icon: mdi:dump-truck
    color: 'rgba(201, 143, 176, 0.32)'
    type: custom
    pattern: Problemabfall in VG Offenbach
  - label: Sperrmüll
    icon: mdi:dump-truck
    color: 'rgba(201, 143, 176, 0.32)'
    type: custom
    pattern: Sperrmüll
card_mod:
  style: |
    ha-card {
      border-radius: 20px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: 0 16px 40px -24px rgba(0,0,0,0.7) !important;
      padding: 14px 16px !important;
      overflow: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    /* Text hell, Datum dezent (Hintergrund NICHT anfassen -> Toenung bleibt) */
    ha-card, ha-card * { color: #f2f5f8 !important; }
    ha-card .secondary,
    ha-card [class*="secondary"],
    ha-card [class*="date"],
    ha-card [class*="time"] {
      color: rgba(242,245,248,0.60) !important;
    }
    /* Icons hell */
    ha-card ha-icon,
    ha-card ha-svg-icon,
    ha-card svg {
      color: #f2f5f8 !important;
      --mdc-icon-size: 26px;
    }
