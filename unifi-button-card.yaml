# UniFi Netzwerk im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
#
# Zwei Owlet-Sektionen:
#   INTERNET       -> Online-Badge (uptimekuma), Ping/Download/Upload,
#                     Uptime-Verlauf (custom:uptime-card, Owlet-gerahmt).
#   INFRASTRUKTUR  -> kompaktes 2-spaltiges Geraete-Raster: pro Geraet Icon
#                     (gruen=online), relevante Kennzahl gross (Clients/PoE/
#                     Temperatur) + Status-Punkt. Tap = more-info (Details/Graph).
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &shell, &head_styles, &m_styles,
# &m_val, &dev_styles, &dev_val, &dev_dot, &frame.
#
# Voraussetzung: custom:button-card + custom:uptime-card + card-mod (HACS).
type: vertical-stack
cards:
  # ================================ INTERNET ================================
  - type: vertical-stack
    card_mod: &shell
      style: |
        #root {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
      - type: custom:button-card
        entity: binary_sensor.uptimekuma_dream_machine_se
        icon: mdi:web
        name: Internet
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: more-info
        custom_fields:
          badge: &online_badge |
            [[[
              const e=(typeof entity!=='undefined')?entity:null;
              const on=e&&e.state==='on';
              const c=on?'#a6d49e':'#f0736a';
              const txt=on?'online':'offline';
              return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${txt}</span>`;
            ]]]
        styles: &head_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n badge"'
            - grid-template-columns: min-content 1fr min-content
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: 'rgba(166, 212, 158, 0.12)'
            - border: 1px solid rgba(166, 212, 158, 0.2)
          icon:
            - width: 23px
            - height: 23px
            - color: '#a6d49e'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          custom_fields:
            badge:
              - justify-self: end
              - align-self: center
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.ping
            icon: mdi:speedometer-slow
            name: Ping
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5', unit: ms, decimals: 2 }
            label: &m_val |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                let v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):NaN;
                const d=(variables.decimals===undefined?0:variables.decimals);
                let n=isNaN(v)?'–':v.toFixed(d);
                return `${n}<span style="font-size:0.5em;color:#6e7988;font-weight:600;margin-left:2px;">${variables.unit||''}</span>`;
              ]]]
            styles: &m_styles
              card:
                - border-radius: 16px
                - padding: 11px 12px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-columns: min-content 1fr
                - grid-template-areas: '"i l" "i n"'
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - height: 40px
                - border-radius: 11px
                - margin-right: 11px
                - align-self: center
                - background: |
                    [[[ return (variables.accent||'#7fb3d5')+'29'; ]]]
                - border: |
                    [[[ return '1px solid '+(variables.accent||'#7fb3d5')+'3d'; ]]]
              icon:
                - width: 21px
                - height: 21px
                - color: |
                    [[[ return variables.accent||'#7fb3d5'; ]]]
              label:
                - justify-self: start
                - align-self: end
                - font-size: 18px
                - font-weight: 750
                - letter-spacing: -0.02em
                - color: '#f2f5f8'
              name:
                - justify-self: start
                - align-self: start
                - font-size: 11px
                - color: '#6e7988'
                - margin-top: 2px
          - type: custom:button-card
            entity: sensor.download_speed
            icon: mdi:download
            name: Download
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#a6d49e', unit: Mbit/s, decimals: 1 }
            label: *m_val
            styles: *m_styles
          - type: custom:button-card
            entity: sensor.upload_speed
            icon: mdi:upload
            name: Upload
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#e6b566', unit: Mbit/s, decimals: 1 }
            label: *m_val
            styles: *m_styles
      # ---- Uptime-Verlauf (Owlet-gerahmt) ----
      - type: custom:uptime-card
        entity: binary_sensor.uptimekuma_dream_machine_se
        icon: si:ubiquiti
        tooltip_adaptive_color: true
        icon_adaptive_color: true
        status_adaptive_color: true
        title_adaptive_color: true
        title: Dream Machine SE
        alias: { ok: online, ko: offline }
        color: { icon: '#a6d49e', ok: '#a6d49e', ko: '#f0736a', title: '#e7ecf3' }
        bar: { spacing: 4, height: 10, round: 4 }
        show: { average: true, status: true }
        alignment: { status: spaced, header: left, icon_first: true }
        tap_action: { action: more-info }
        duration: { quantity: 1, unit: day }
        card_mod: &frame
          style: |
            ha-card {
              background: rgba(255,255,255,0.02) !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
              border-radius: 16px !important;
              box-shadow: none !important;
              padding: 6px 10px !important;
            }

  # ============================= INFRASTRUKTUR =============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:router-network
        name: Infrastruktur
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: none
        triggers_update: all
        custom_fields:
          badge: |
            [[[
              const ids=['sensor.u7_outdoor_state','sensor.u7_outdoor_state_2','sensor.u6_pro_wohnzimmer_state','sensor.u6_pro_spielzimmer_state','sensor.u6_pro_kinderzimmer_state','sensor.u6_pro_state','sensor.usw_pro_max_24_poe_uptime','sensor.dream_machine_special_edition_uptime'];
              const bad=['off','unavailable','disconnected','unknown','offline','none',''];
              let on=0; ids.forEach(id=>{ const s=states[id]; if(s && !bad.includes(String(s.state).toLowerCase())) on++; });
              const c=on===ids.length?'#a6d49e':'#e6b566';
              return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${on}/${ids.length} online</span>`;
            ]]]
        styles: *head_styles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.dream_machine_special_edition_uptime
            icon: mdi:server-network
            name: UDM SE · Gateway
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.dream_machine_special_edition_dream_machine_special_edition_local_temperature
              metric_unit: °C
              status_entity: sensor.dream_machine_special_edition_uptime
              decimals: 0
            label: &dev_val |
              [[[
                const id=variables.metric_entity; const s=id?states[id]:null;
                let v=s?parseFloat(s.state):NaN;
                const d=(variables.decimals===undefined?0:variables.decimals);
                let n=isNaN(v)?((s&&s.state)?s.state:'–'):v.toFixed(d);
                return `${n}<span style="font-size:0.5em;color:#6e7988;font-weight:600;margin-left:3px;">${variables.metric_unit||''}</span>`;
              ]]]
            custom_fields:
              dot: &dev_dot |
                [[[
                  const s=states[variables.status_entity];
                  const st=s?String(s.state).toLowerCase():'';
                  const bad=['off','unavailable','disconnected','unknown','offline','none',''].includes(st);
                  const c=bad?'#f0736a':'#a6d49e';
                  return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}28;"></span>`;
                ]]]
            styles: &dev_styles
              card:
                - border-radius: 16px
                - padding: 11px 13px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-columns: min-content 1fr min-content
                - grid-template-areas: '"i l dot" "i n dot"'
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 42px
                - height: 42px
                - border-radius: 12px
                - margin-right: 13px
                - align-self: center
                - background: &dev_bg |
                    [[[
                      const s=states[variables.status_entity]; const st=s?String(s.state).toLowerCase():'';
                      const bad=['off','unavailable','disconnected','unknown','offline','none',''].includes(st);
                      return (bad?'#f0736a':'#a6d49e')+'22';
                    ]]]
                - border: &dev_border |
                    [[[
                      const s=states[variables.status_entity]; const st=s?String(s.state).toLowerCase():'';
                      const bad=['off','unavailable','disconnected','unknown','offline','none',''].includes(st);
                      return '1px solid '+(bad?'#f0736a':'#a6d49e')+'3a';
                    ]]]
              icon:
                - width: 22px
                - height: 22px
                - color: &dev_col |
                    [[[
                      const s=states[variables.status_entity]; const st=s?String(s.state).toLowerCase():'';
                      const bad=['off','unavailable','disconnected','unknown','offline','none',''].includes(st);
                      return bad?'#f0736a':'#a6d49e';
                    ]]]
              label:
                - justify-self: start
                - align-self: end
                - font-size: 19px
                - font-weight: 750
                - letter-spacing: -0.02em
                - color: '#f2f5f8'
              name:
                - justify-self: start
                - align-self: start
                - font-size: 11.5px
                - color: '#6e7988'
                - margin-top: 2px
                - white-space: nowrap
                - overflow: hidden
                - text-overflow: ellipsis
              custom_fields:
                dot:
                  - justify-self: end
                  - align-self: center
          - type: custom:button-card
            entity: sensor.usw_pro_max_24_poe_uptime
            icon: mdi:switch
            name: USW Pro Max 24 · PoE
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.poe_power_usw_pro_max_24_poe
              metric_unit: W
              status_entity: sensor.usw_pro_max_24_poe_uptime
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u7_outdoor_state
            icon: mdi:access-point
            name: U7 Outdoor · Garten
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u7_outdoor_clients
              metric_unit: Clients
              status_entity: sensor.u7_outdoor_state
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u7_outdoor_state_2
            icon: mdi:access-point
            name: U7 Outdoor · Pumpe
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u7_outdoor_clients_2
              metric_unit: Clients
              status_entity: sensor.u7_outdoor_state_2
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u6_pro_wohnzimmer_state
            icon: mdi:access-point
            name: U6 Pro · Wohnzimmer
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u6_pro_wohnzimmer_clients
              metric_unit: Clients
              status_entity: sensor.u6_pro_wohnzimmer_state
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u6_pro_spielzimmer_state
            icon: mdi:access-point
            name: U6 Pro · Büro
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u6_pro_spielzimmer_clients
              metric_unit: Clients
              status_entity: sensor.u6_pro_spielzimmer_state
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u6_pro_kinderzimmer_state
            icon: mdi:access-point
            name: U6 Pro · Kinderzimmer
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u6_pro_kinderzimmer_clients
              metric_unit: Clients
              status_entity: sensor.u6_pro_kinderzimmer_state
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
          - type: custom:button-card
            entity: sensor.u6_pro_state
            icon: mdi:access-point
            name: U6 Pro · Keller
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update: all
            variables:
              metric_entity: sensor.u6_pro_clients
              metric_unit: Clients
              status_entity: sensor.u6_pro_state
              decimals: 0
            label: *dev_val
            custom_fields: { dot: *dev_dot }
            styles: *dev_styles
