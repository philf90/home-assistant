# WAN · Durchsatz live – Owlet-Karte (echte Rx/Tx-Auslastung am WAN-Port)
#
# Zeigt die momentane Auslastung der Internet-Leitung direkt an der UDM SE –
# im Gegensatz zur Speedtest-Zeile (sensor.download_speed/upload_speed) sind
# das Live-Werte des Gateways.
#
# ┌────────────── ENTITÄTEN PRÜFEN ──────────────────────────────────────────┐
# │ Die UniFi-Network-Integration liefert WAN-Durchsatz-Sensoren, die je nach │
# │ Version deaktiviert sind oder anders heißen. Falls "–": Entität in HA     │
# │ aktivieren bzw. ID unten anpassen.                                        │
# │   Rx (Download): sensor.dream_machine_special_edition_wan_rx              │
# │   Tx (Upload)  : sensor.dream_machine_special_edition_wan_tx              │
# │                                                                           │
# │ Einheit/Skalierung: 'unit' + 'scale' pro Kachel setzen. Liefert dein      │
# │ Sensor z. B. kB/s, dann unit: kB/s, scale: 1 – oder auf Mbit/s umrechnen  │
# │ (kB/s -> Mbit/s: scale: 0.008).                                           │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: vertical-stack
card_mod: &shell
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  - type: custom:button-card
    icon: mdi:speedometer
    name: WAN · Durchsatz
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    styles: &head_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content 1fr
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.dream_machine_special_edition_wan_rx
        icon: mdi:download
        name: Download (WAN Rx)
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update: all
        variables:
          metric_entity: sensor.dream_machine_special_edition_wan_rx
          accent: '#a6d49e'
          unit: Mbit/s
          decimals: 1
          scale: 1
        label: &wan_val |
          [[[
            const muted='#6e7988';
            const e=states[variables.metric_entity];
            let v=e?parseFloat(e.state):NaN;
            const sc=(variables.scale===undefined?1:variables.scale);
            if(!isNaN(v)) v=v*sc;
            const d=(variables.decimals===undefined?0:variables.decimals);
            const n=isNaN(v)?'–':v.toFixed(d).replace('.',',');
            return `${n}<span style="font-size:0.5em;color:${muted};font-weight:600;margin-left:2px;">${variables.unit||''}</span>`;
          ]]]
        styles: &wan_styles
          card:
            - border-radius: 16px
            - padding: 11px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i l" "i n"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 40px
            - height: 40px
            - border-radius: 11px
            - margin-right: 11px
            - align-self: center
            - background: |
                [[[ return (variables.accent||'#a6d49e')+'29'; ]]]
            - border: |
                [[[ return '1px solid '+(variables.accent||'#a6d49e')+'3d'; ]]]
          icon:
            - width: 21px
            - height: 21px
            - color: |
                [[[ return variables.accent||'#a6d49e'; ]]]
          label:
            - justify-self: start
            - align-self: end
            - font-size: 18px
            - font-weight: 750
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          name:
            - justify-self: start
            - align-self: start
            - font-size: 11px
            - color: '#6e7988'
            - margin-top: 2px
      - type: custom:button-card
        entity: sensor.dream_machine_special_edition_wan_tx
        icon: mdi:upload
        name: Upload (WAN Tx)
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update: all
        variables:
          metric_entity: sensor.dream_machine_special_edition_wan_tx
          accent: '#e6b566'
          unit: Mbit/s
          decimals: 1
          scale: 1
        label: *wan_val
        styles: *wan_styles
