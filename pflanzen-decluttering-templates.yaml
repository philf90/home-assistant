# ============================================================================
# Decluttering-Template owlet_pflanze fuer pflanzen-view.yaml
# ----------------------------------------------------------------------------
# EINMAL einfuegen: Raw-Konfigurationseditor des Dashboards -> den Eintrag
#   unter "decluttering_templates:" ergaenzen (neben top_navigation und
#   floating_navbar aus decluttering-templates.yaml).
#
# Eine button-card je Pflanze: Foto, Art, Status-Pille, Kacheln Bodenfeuchte
# und Bodentemperatur mit Sollband, Akku und Sensorname. Antippen oeffnet ein
# browser_mod-Popup mit der Bodenfeuchte der letzten 7 Tage (apexcharts-card).
# Ist input_boolean.<pflanze>_abgeerntet an, zeigt dieselbe Karte nur eine
# schmale Zeile; der Knopf rechts schaltet den Helfer mit Rueckfrage um
# ("Abgeerntet" / "Wieder bepflanzt").
#
# Warum so schlank: Eine fruehere Fassung hatte je Pflanze Stapel, zwei
# conditional-Karten, expander-card und apexcharts-card. expander-card 0.1.5
# erzeugt die inneren Karten auch zugeklappt, also liefen beim Oeffnen der
# View sieben Diagramme mit 21 Datenabfragen. Gemessen (Chromium, 4x
# gedrosselte CPU) brauchte das Laden ~1,7-2,2 s Rechenzeit, diese Fassung
# ~0,35-0,45 s und keine Datenabfrage. Das Diagramm entsteht erst im Popup.
#
# Variablen:
#   pflanze  Objekt-ID der Pflanze (plant.<pflanze>); daraus werden
#            sensor.<pflanze>_bodenfeuchtigkeit, _bodentemperatur und die
#            number.<pflanze>_min_/max_…-Grenzwerte gebildet
#   akku     Akku-Sensor des Bodensensors
#   sensor   Anzeigename des Bodensensors (Fusszeile, Popup-Titel)
#   hinweis  optional, z. B. "geteilt mit Gurken"
#
# Hinweise zu den Karten:
#   - button-card wertet Templates in verschachtelten Karten (custom_fields
#     mit card:) im Kontext der aeusseren Karte aus; der Knopf liest den
#     Helfer deshalb ueber states[...] statt ueber entity.
#   - button-card setzt bei ha-icon margin:auto und zentriert custom_fields;
#     daher margin:0 und text-align:left.
#   - Das Foto kommt ueber show_entity_picture (fest gebunden), nicht als
#     <img> im HTML, das bei jeder Aktualisierung neu entstuende.
#
# Voraussetzung: custom:decluttering-card, custom:button-card (v7),
#                custom:apexcharts-card, browser_mod (Popup),
#                je Pflanze ein Helfer input_boolean.<pflanze>_abgeerntet.
# ============================================================================
decluttering_templates:
  owlet_pflanze:
    default:
      - hinweis: ''
    card:
      # Eine button-card je Pflanze (statt Stack + 2 conditional + expander +
      # apexcharts): das Diagramm entsteht erst beim Antippen im Popup.
      type: custom:button-card
      entity: plant.[[pflanze]]
      variables:
        p: '[[pflanze]]'
        akku: '[[akku]]'
        sensor: '[[sensor]]'
        hinweis: '[[hinweis]]'
        ab: input_boolean.[[pflanze]]_abgeerntet
      show_icon: false
      show_name: false
      show_state: false
      show_entity_picture: true
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: '[[sensor]] · Bodenfeuchte'
            content:
              type: custom:apexcharts-card
              graph_span: 7d
              header:
                show: true
                title: Bodenfeuchte · 7 Tage (Tagesmittel)
                show_states: false
              apex_config:
                chart:
                  background: transparent
                  foreColor: '#8794a5'
                  height: 220
                  toolbar:
                    show: false
                dataLabels:
                  enabled: false
                grid:
                  borderColor: rgba(255,255,255,0.06)
                  strokeDashArray: 3
                legend:
                  show: false
                stroke:
                  curve: smooth
                  width: 2
                tooltip:
                  theme: dark
              yaxis:
                - min: 0
                  max: 100
                  decimals: 0
                  apex_config:
                    tickAmount: 4
              series:
                - entity: sensor.[[pflanze]]_bodenfeuchtigkeit
                  name: Bodenfeuchte
                  color: '#a6d49e'
                  type: area
                  opacity: 0.18
                  unit: '%'
                  statistics:
                    type: mean
                    period: day
                - entity: number.[[pflanze]]_min_bodenfeuchtigkeit
                  name: Min
                  color: '#6e7988'
                  stroke_width: 1
                - entity: number.[[pflanze]]_max_bodenfeuchtigkeit
                  name: Max
                  color: '#6e7988'
                  stroke_width: 1
      custom_fields:
        kopf: |
          [[[
            const A=entity?entity.attributes:{};
            const name=A.friendly_name||variables.p;
            const abS=states[variables.ab];
            if(abS&&abS.state==='on'){
              return `<div style="font-size:15px;font-weight:700;letter-spacing:-0.02em;color:#b4c0cf;">${name}</div>
                <div style="font-size:11.5px;color:#8794a5;margin-top:1px;">Abgeerntet · Werte ausgeblendet</div>`;
            }
            const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
            const p=variables.p;
            const f=zahl(`sensor.${p}_bodenfeuchtigkeit`), fMin=zahl(`number.${p}_min_bodenfeuchtigkeit`), fMax=zahl(`number.${p}_max_bodenfeuchtigkeit`);
            const t=zahl(`sensor.${p}_bodentemperatur`), tMin=zahl(`number.${p}_min_bodentemperatur`), tMax=zahl(`number.${p}_max_bodentemperatur`);
            let col='#a6d49e', txt='Alles gut';
            if(f<fMin){col='#e6b566';txt='Gießen';}
            else if(f>fMax){col='#e6b566';txt='Zu nass';}
            else if(t<tMin){col='#e6b566';txt='Boden kalt';}
            else if(t>tMax){col='#e6b566';txt='Boden warm';}
            const pille=`<span style="display:inline-flex;align-items:center;color:${col};background:${col}1f;border:1px solid ${col}3d;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap;">${txt}</span>`;
            return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;color:#f2f5f8;">${name}</span>${pille}</div>
              <div style="font-size:12px;font-style:italic;color:#8794a5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${A.species||''}</div>`;
          ]]]
        werte: |
          [[[
            const abS=states[variables.ab];
            if(abS&&abS.state==='on') return '';
            const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
            const de=(v,d)=>Number.isFinite(v)?v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
            const p=variables.p;
            const kachel=(o)=>{
              const v=zahl(o.wert), mn=zahl(o.min), mx=zahl(o.max);
              let col='#8794a5', txt='keine Daten';
              if(Number.isFinite(v)){
                if(v<mn){col=o.aus;txt=o.tief;}
                else if(v>mx){col=o.aus;txt=o.hoch;}
                else {col='#a6d49e';txt='im Sollbereich';}
              }
              const pos=x=>Math.max(0,Math.min(100,(x-o.von)/(o.bis-o.von)*100));
              const band=(Number.isFinite(mn)&&Number.isFinite(mx))?`<i style="position:absolute;top:0;bottom:0;left:${pos(mn)}%;width:${pos(mx)-pos(mn)}%;background:rgba(166,212,158,0.24);border-radius:3px;"></i>`:'';
              const mark=Number.isFinite(v)?`<i style="position:absolute;top:-3px;left:${pos(v)}%;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:${col};box-shadow:0 0 0 2px #171d29;"></i>`:'';
              return `<div style="background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);border-radius:13px;padding:10px 12px;min-width:0;">
                <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8794a5;"><ha-icon icon="${o.icon}" style="--mdc-icon-size:15px;width:15px;height:15px;display:flex;margin:0;color:${col};"></ha-icon>${o.titel}</div>
                <div style="font-size:20px;font-weight:750;letter-spacing:-0.02em;color:#f2f5f8;font-variant-numeric:tabular-nums;margin-top:4px;">${de(v,1)}<span style="font-size:0.6em;color:#8794a5;font-weight:600;margin-left:2px;">${o.einheit}</span></div>
                <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,0.07);margin:8px 0 7px;">${band}${mark}</div>
                <div style="font-size:11px;font-weight:600;color:${col===o.aus?col:'#8794a5'};">${txt}</div>
                <div style="font-size:11px;color:#8794a5;">Soll ${de(mn,0)}–${de(mx,0)} ${o.einheit}</div>
              </div>`;
            };
            return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">`
              + kachel({titel:'Bodenfeuchte',icon:'mdi:water',wert:`sensor.${p}_bodenfeuchtigkeit`,min:`number.${p}_min_bodenfeuchtigkeit`,max:`number.${p}_max_bodenfeuchtigkeit`,von:0,bis:100,einheit:'%',aus:'#e6b566',tief:'zu trocken',hoch:'zu nass'})
              + kachel({titel:'Bodentemperatur',icon:'mdi:thermometer-low',wert:`sensor.${p}_bodentemperatur`,min:`number.${p}_min_bodentemperatur`,max:`number.${p}_max_bodentemperatur`,von:0,bis:40,einheit:'°C',aus:'#e6b566',tief:'zu kalt',hoch:'zu warm'})
              + `</div>`;
          ]]]
        fuss: |
          [[[
            const abS=states[variables.ab];
            if(abS&&abS.state==='on') return '';
            const s=states[variables.akku];
            const a=s?parseFloat(s.state):NaN;
            let col='#8794a5';
            if(Number.isFinite(a)) col=a>=30?'#a6d49e':(a>=15?'#e6b566':'#f0736a');
            const icon=!Number.isFinite(a)?'mdi:battery-unknown':(a>=30?'mdi:battery-high':(a>=15?'mdi:battery-medium':'mdi:battery-alert'));
            const akku=`<span style="display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;color:${col};"><ha-icon icon="${icon}" style="--mdc-icon-size:14px;width:14px;height:14px;display:flex;margin:0;"></ha-icon>${Number.isFinite(a)?Math.round(a)+' %':'–'}</span>`;
            const zusatz=variables.hinweis?` · ${variables.hinweis}`:'';
            return `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#8794a5;min-width:0;">${akku}<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">· Sensor ${variables.sensor}${zusatz}</span></div>`;
          ]]]
        knopf:
          card:
            type: custom:button-card
            entity: input_boolean.[[pflanze]]_abgeerntet
            show_state: false
            name: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'Wieder bepflanzt' : 'Abgeerntet'; ]]]"
            icon: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'mdi:sprout' : 'mdi:basket-check-outline'; ]]]"
            tap_action:
              action: toggle
              confirmation:
                text: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'Pflanze wieder anzeigen?' : 'Als abgeerntet markieren? Die Werte werden bis zur Neubepflanzung ausgeblendet.'; ]]]"
            styles:
              card:
                - padding: 4px 10px
                - border-radius: 10px
                - box-shadow: none
                - background: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'rgba(166,212,158,0.12)' : 'rgba(255,255,255,0.028)'; ]]]"
                - border: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? '1px solid rgba(166,212,158,0.24)' : '1px solid rgba(255,255,255,0.06)'; ]]]"
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content auto
                - column-gap: 5px
              icon:
                - width: 14px
                - color: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? '#a6d49e' : '#6e7988'; ]]]"
              name:
                - font-size: 11.5px
                - font-weight: 600
                - color: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? '#a6d49e' : '#8794a5'; ]]]"
      styles:
        card:
          - padding: 14px 16px
          - border-radius: 22px
          - border: 1px solid rgba(255, 255, 255, 0.05)
          - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
          - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
        grid:
          - grid-template-areas: |
              [[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '"i kopf knopf"' : '"i kopf kopf" "werte werte werte" "fuss fuss knopf"'; ]]]
          - grid-template-rows: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'auto' : 'auto auto auto'; ]]]"
          - grid-template-columns: min-content minmax(0, 1fr) auto
          - row-gap: 12px
          - column-gap: 10px
          - align-items: center
        img_cell:
          - width: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '36px' : '52px'; ]]]"
          - height: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '36px' : '52px'; ]]]"
          - border-radius: 50%
          - overflow: hidden
          - margin-right: 2px
        entity_picture:
          - width: 100%
          - height: 100%
          - object-fit: cover
          - border-radius: 50%
          - filter: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'grayscale(0.6) opacity(0.55)' : 'none'; ]]]"
        custom_fields:
          kopf:
            - justify-self: stretch
            - text-align: left
            - min-width: 0
            - white-space: normal
          werte:
            - justify-self: stretch
            - text-align: left
            - display: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'none' : 'block'; ]]]"
          fuss:
            - justify-self: stretch
            - min-width: 0
            - display: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'none' : 'block'; ]]]"
          knopf:
            - justify-self: end
