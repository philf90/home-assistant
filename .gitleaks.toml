# gitleaks-Konfiguration.
#
# Basis sind die mitgelieferten Regeln; ergaenzt um eine Regel fuer
# Home-Assistant-Langzeit-Token und um Ausnahmen fuer Werte, die hier bewusst
# im Klartext stehen.

[extend]
useDefault = true

[[rules]]
id = "home-assistant-long-lived-token"
description = "Home-Assistant Long-Lived Access Token (JWT)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyJ"]

[allowlist]
description = "Bekannte, unkritische Fundstellen"

paths = [
  # Kompilierte Artefakte und Abhaengigkeiten, falls sie doch mal auftauchen.
  '''(^|/)__pycache__/''',
  '''(^|/)node_modules/''',
]

regexes = [
  # Private IPv4-Adressen (RFC 1918). Die stehen in der Doku und in den
  # Kartenkonfigurationen absichtlich und sind ausserhalb des LAN wertlos.
  '''\b(10|127)\.\d{1,3}\.\d{1,3}\.\d{1,3}\b''',
  '''\b192\.168\.\d{1,3}\.\d{1,3}\b''',
  '''\b172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b''',
  # Platzhalter statt echter Werte.
  '''!secret\s+\w+''',
  '''(DEIN|YOUR|CHANGE|REPLACE|XXX)[_-]?\w*''',
]
