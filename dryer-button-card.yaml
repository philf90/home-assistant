type: custom:button-card
entity: sensor.463120392821005583_bsh_common_status_operationstate
icon: mdi:tumble-dryer
name: Trockner
show_state: false
show_name: true
show_icon: true

variables:
  progress_entity: sensor.463120392821005583_bsh_common_option_programprogress
  time_entity: sensor.463120392821005583_bsh_common_option_estimatedtotalprogramtime
  program_entity: sensor.463120392821005583_active_program

# Dynamische Icon-Farbe je nach Betriebsstatus
color: |
  [[[
    const state = entity.state;
    if (state.includes('Run')) return 'var(--primary-color)';
    if (state.includes('Finished')) return 'var(--success-color, #4CAF50)';
    if (state.includes('Error')) return 'var(--error-color, #F44336)';
    if (state.includes('Pause')) return 'var(--warning-color, #FF9800)';
    return 'var(--disabled-color, #9E9E9E)';
  ]]]

# Karte nur animieren wenn der Trockner läuft
state:
  - value: BSH.Common.EnumType.OperationState.Run
    spin: true

styles:
  card:
    - padding: 12px
    - border-radius: 12px
  grid:
    - grid-template-areas: '"i n" "i status" "i program" "i progress" "i time"'
    - grid-template-columns: min-content auto
    - grid-template-rows: auto auto auto auto auto
  icon:
    - width: 48px
    - height: 48px
    - margin-right: 12px
  name:
    - font-size: 1em
    - font-weight: bold
    - text-align: left
    - justify-self: start
    - align-self: end
  custom_fields:
    status:
      - font-size: 0.85em
      - color: var(--secondary-text-color)
      - text-align: left
      - justify-self: start
      - align-self: start
    program:
      - font-size: 0.8em
      - color: var(--primary-text-color)
      - text-align: left
      - justify-self: start
      - align-self: start
      - padding-bottom: 8px
    progress:
      - width: 100%
      - padding: 4px 0
    time:
      - font-size: 0.8em
      - color: var(--secondary-text-color)
      - text-align: right
      - width: 100%
      - padding-top: 2px

custom_fields:
  # Lesbarer Betriebsstatus
  status: |
    [[[
      const state = entity.state;
      const stateMap = {
        'BSH.Common.EnumType.OperationState.Inactive':      'Inaktiv',
        'BSH.Common.EnumType.OperationState.Ready':         'Bereit',
        'BSH.Common.EnumType.OperationState.DelayedStart':  'Startverzögerung',
        'BSH.Common.EnumType.OperationState.Run':           'Läuft',
        'BSH.Common.EnumType.OperationState.Pause':         'Pausiert',
        'BSH.Common.EnumType.OperationState.ActionRequired':'Eingriff erforderlich',
        'BSH.Common.EnumType.OperationState.Finished':      'Fertig',
        'BSH.Common.EnumType.OperationState.Error':         'Fehler',
        'BSH.Common.EnumType.OperationState.Aborting':      'Wird abgebrochen',
      };
      return stateMap[state] || state;
    ]]]

  # Aktives Programm (nur bei laufendem Trockner)
  program: |
    [[[
      const operationState = entity.state;
      if (!operationState.includes('Run')) return '';

      const programEntity = states[variables.program_entity];
      if (!programEntity || programEntity.state === 'unavailable' || programEntity.state === 'unknown') return '';

      const programMap = {
        'LaundryCare.Dryer.Program.Cotton':           'Baumwolle',
        'LaundryCare.Dryer.Program.Synthetic':        'Pflegeleicht',
        'LaundryCare.Dryer.Program.Mix':              'Mischgewebe',
        'LaundryCare.Dryer.Program.BusinessShirts':   'Hemden',
        'LaundryCare.Dryer.Program.Delicates':        'Feinwäsche',
        'LaundryCare.Dryer.Program.WoolFinish':       'Wolle',
        'LaundryCare.Dryer.Program.Hygiene':          'Hygiene',
        'LaundryCare.Dryer.Program.Jeans':            'Jeans',
        'LaundryCare.Dryer.Program.Outdoor':          'Outdoor',
        'LaundryCare.Dryer.Program.Towels':           'Handtücher',
        'LaundryCare.Dryer.Program.Sportswear':       'Sportswear',
        'LaundryCare.Dryer.Program.Pillow':           'Kissen',
        'LaundryCare.Dryer.Program.AntiShrink':       'Knitterschutz',
        'LaundryCare.Dryer.Program.MyTime.MyDryingTime': 'Zeittrocknen',
      };

      const label = programMap[programEntity.state] || programEntity.state;
      return label;
    ]]]

  # Progress Bar (nur wenn Entität verfügbar und Wert > 0)
  progress: |
    [[[
      const progressEntity = states[variables.progress_entity];
      const progress = progressEntity ? parseFloat(progressEntity.state) : NaN;

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || isNaN(progress) || progress <= 0) return '';

      const color = operationState.includes('Pause')
        ? 'var(--warning-color, #FF9800)'
        : 'var(--primary-color)';

      return `
        <div style="
          width: 100%;
          background: var(--secondary-background-color, #e0e0e0);
          border-radius: 4px;
          height: 6px;
          overflow: hidden;
        ">
          <div style="
            width: ${progress}%;
            background: ${color};
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
          "></div>
        </div>
      `;
    ]]]

  # Verbleibende Zeit
  time: |
    [[[
      const timeEntity = states[variables.time_entity];

      const operationState = entity.state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || !timeEntity) return '';

      // State liegt im Format "H:MM" (Stunden:Minuten) vor
      const timeParts = timeEntity.state.split(':');
      let remainingSeconds = 0;
      if (timeParts.length === 2) {
        remainingSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60;
      } else if (timeParts.length === 3) {
        remainingSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60 + parseInt(timeParts[2]);
      }
      if (!remainingSeconds) return '';

      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);

      let timeStr = '';
      if (hours > 0) timeStr += `${hours}h `;
      timeStr += `${minutes}min`;

      return `noch ca. ${timeStr}`;
    ]]]
