# ============================================================================
# Fussball – button-card-Templates
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       fussball
# Status:        aktiv
# Karten:        keine
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Die Karten holen die Daten SELBST im Browser, die Ligen von OpenLigaDB
# (https://api.openligadb.de, kostenlos, ohne API-Key), den DFB-Pokal von ESPN
# (inoffiziell, ohne Key). Es gibt keine Sensoren, kein Paket und keinen
# Eintrag in configuration.yaml.
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> diesen "button_card_templates:"
#   Block auf oberster Ebene (neben "views:" und "decluttering_templates:").
#
# Aufbau:
#   fussball_daten       gemeinsamer Datenzugriff (variables.fb) + Puls-CSS
#   fussball_kopf        Kopfzeile im Owlet-Stil (Icon-Kachel, Name, Unterzeile,
#                        Badge rechts)
#   fussball_inhalt      randloser Inhaltsbereich unter der Kopfzeile
#   fussball_fck_kopf / fussball_fck              Lieblingsverein (F1),
#                        mit Zeitstrahl (Z1, siehe unten)
#   fussball_spieltag_kopf / fussball_spieltag    Spieltag als Liste (S1)
#   fussball_tabelle_kopf / fussball_tabelle      Tabelle mit Zonen (T1)
#   fussball_pokal_kopf / fussball_pokal          laufende Pokalrunde (S1)
#   fussball_pokalweg_kopf / fussball_pokalweg    Pokalweg des Vereins
#   fussball_spiel       Inhalt des Bubble-Card-Popups #fussball-spiel
#                        (Ticker, Kommentar, Statistik, Messung)
#   fussball_meldungen_kopf / fussball_meldungen  Schalter der Meldungen
#   Hervorhebung des Lieblingsvereins in Liste und Tabelle nach H1
#   (FCK-Rot als Flaeche + Kante, ohne Zonenstrich).
#
# Variablen in der View: liga (bl1 | bl2), fav (teamId fuer H1; in der
#   Pokalrunde die ESPN-ID), verein (teamId fuer Vereinskarte und Popup),
#   verein_espn (ESPN-ID fuer Pokalspiele in Vereinskarte, Popup und
#   Pokalweg). 1. FC Kaiserslautern = 76 bei OpenLigaDB, 130 bei ESPN.
#
# Datenzugriff (window.__fussball, einmal pro Browser-Seite):
#   - getcurrentgroup/<liga> -> getmatchdata/<liga>/<saison>/<spieltag>.
#     getmatchdata/<liga> OHNE Saison/Spieltag liefert waehrend eines Spiels
#     veraltete Staende (gemessen 11.10.2026: Koeln-Gladbach 0:0 statt 1:1).
#   - getbltable/<liga>/<saison> zaehlt laufende Spiele bereits mit.
#   - getmatchesbyteamid/<id>/10/3 enthaelt Duplikat-Ligen (z. B. "bl2h") ->
#     auf leagueShortcut + leagueSeason filtern.
#   - Saison: ab Juli das laufende Jahr, davor das Vorjahr (2026 = 2026/27).
#   - Spielminute: OpenLigaDB hat keine. Solange in einer Liga ein Spiel laeuft,
#     holt fb.espn() zusaetzlich das inoffizielle ESPN-Scoreboard (ger.1/ger.2,
#     ohne Key, alle 45 s). Zuordnung ueber Anstoss (+-10 min) und Vereinsnamen
#     mit Aliassen fuer englische Namen ("FC Cologne"). Gemessen 11.10.2026:
#     Minute zaehlt jede Minute hoch, in der Halbzeit steht "45'+x'" -> "HZ"
#     ueber status.type.name. Faellt ESPN aus (auch CORS), fehlt nur die Minute:
#     Liste zeigt "LIVE" + Hinweis, Vereinskarte die Minute des letzten Tors.
#   - Takt: alle 30 s wird neu gezeichnet; abgerufen wird, wenn der Stand
#     aelter ist als 1 min (Spiel laeuft: 5 min vor bis 150 min nach Anstoss)
#     bzw. 15 min (sonst), Vereinsspiele 30 min. Nach einem Fehler 1 min Pause.
#   - Nach einem Abruf schreibt jede Karte ihren Bereich (data-fb) direkt neu,
#     weil button-card ohne Entitaetsaenderung nicht neu rendert
#     (shouldUpdate in v7.0.1).
#   Folgen: Abgerufen wird nur, solange die View in einem Browser offen ist,
#   und jedes Geraet ruft selbst ab. Es entstehen keine Entitaeten und keine
#   Historie. Die Meldungen zum Lieblingsverein ruft Home Assistant deshalb
#   selbst ab (fussball-espn-konfig.yaml, Kopf von fussball-view.yaml); die
#   Karte "Meldungen" (fussball_meldungen) zeigt nur die Schalter.
#   - Update-sicher: window.__fussball traegt eine VERSION; nach einem
#     Dashboard-Update ersetzt eine hoehere Version das alte Objekt der
#     offenen Seite (sonst "fb.minute is not a function").
#   Voraussetzung: OpenLigaDB erlaubt Abrufe aus dem Browser (CORS); belegt
#   durch Web-Apps, die die API direkt per fetch nutzen. Schlaegt der Abruf
#   fehl, zeigt die Karte den Fehler statt leerer Flaechen.
#
# DFB-Pokal (Variante A und V1 der Entwurfsseite "DFB-Pokal in der Fussball-View"):
#   - Quelle ESPN, Liga ger.dfb_pokal; OpenLigaDB ist fuer den Pokal ungeprueft
#     (Kuerzel laut Drittquellen "dfb", das Beispiel-Repo nennt es uneinheitlich).
#   - Runden: leagues[0].calendar[0].entries des Scoreboards ohne dates (value
#     1-6, label "First Round" bis "Final"). detail nennt die Spieltage, solange
#     sie feststehen ("Oct 27-28", "Aug 21-Sep 2"), sonst das Zeitfenster der
#     Runde ("Dec 4-Feb 11"); mehr als 14 Tage gelten als offen. Laufende Runde
#     = zuletzt begonnene mit festen Tagen, die naechste schon 7 Tage vorher.
#   - Spiele: scoreboard?dates=JJJJMMTT je Spieltag. Ohne dates kam nur der
#     naechste Spieltag (gemessen 25.10.2026: 27.10., 8 von 16 Spielen), ein
#     Datumsbereich liefert HTTP 400 (zweimal gemessen). Abruf live 45 s, sind
#     alle Spiele beendet 6 h, sonst 15 min.
#   - Vereinsspiele: teams/<id>/schedule (gespielte, 1. Runde) und
#     ...?fixture=true (kommende, 2. Runde), alle 30 min. Dort steht status nur
#     in competitions[0], score als Objekt und logos statt logo. Von 6 h vor
#     bis 36 h nach Anstoss kommt das Scoreboard des Tages dazu (Tore, Karten).
#   - Vereinskarte V1 (fb.vereinAuswahl): laufendes Spiel aus Liga oder Pokal,
#     sonst das letzte bis 36 h nach Anstoss (nicht mehr ab 6 h vor dem
#     naechsten), sonst das naechste. Platz, Punkte und Form bleiben Liga.
#   - Status: STATUS_FINAL_AET (id 45, period 4) = "n. V.", STATUS_FINAL_PEN
#     (id 47, period 5) = "i. E." mit shootoutScore je Verein; winner markiert den
#     Sieger (an 3 Spielen mit Elfmeterschiessen und dem FCK in Mannheim
#     geprueft). Live gilt state "in"; ohne Zustand das Fenster POKAL_DAUER
#     (210 min, gerechnet aus 164 min mit Annahmen fuer Pausen und
#     Elfmeterschiessen). Die Statusnamen live in Verlaengerung und
#     Elfmeterschiessen sind ungemessen; die Messung im Popup schreibt sie mit.
#   - Namen: ESPN schreibt einige Vereine englisch ("Bayern Munich", "FC
#     Cologne"), NAME_DE uebersetzt die gemessenen. team.logo ist bei
#     Amateurvereinen leer (SV Waldhof Mannheim), dann stehen die Initialen.
#
# Spiel-Popup (#fussball-spiel), Muster wie #flug im Flugradar:
#   - Antippen von Spielstand (Vereinskarte) oder Spielzeile (Spieltag) merkt
#     das Spiel im Browser (fb.sel, je Geraet) und setzt den Hash per
#     history.pushState + location-changed; Bubble Card oeffnet das Popup.
#     Antippbar ist jedes Spiel ab Anstoss (live, beendet, offen), damit sich
#     die Messung auch nach Spielende ausfuehren laesst.
#   - Tore: aus OpenLigaDB (dieselben wie in der Karte). Karten, Wechsel,
#     Spielphasen, Kommentar und Statistik: ESPN summary?event=<id>
#     (inoffiziell). Die Event-ID kommt aus scoreboard?dates=JJJJMMTT des
#     Anstosstags (UTC; deutsche Anstosszeiten liegen auch in US-Zeit am
#     selben Tag), Zuordnung wie bei der Minute. Hat ESPN mehr Tore als
#     OpenLigaDB, erscheinen die fehlenden mit Quelle "ESPN".
#   - Abgerufen wird nur, solange das Popup offen ist: Spieltag und
#     Spieldetails alle 45 s (live) bzw. 5-15 min.
#   - Messung (Knopf "Messung" im Fuss des Popups; als fuenfter Reiter lag sie
#     in der 1. Liga ausserhalb der scrollenden Reiterleiste, jetzt sind es
#     hoechstens vier Reiter ohne Scrollen): was OpenLigaDB und ESPN fuer dieses
#     Spiel liefern -- Abruf und Fehler je Pfad (ein TypeError ohne HTTP-Status
#     heisst Netzwerk oder CORS), Ereignistypen, Kommentar, Statistik,
#     Aufstellung samt Positionsangaben und wann ein Spielstand je Quelle zuerst zu sehen
#     war (Genauigkeit etwa 30 s, nur solange die View offen ist). "Messung
#     kopieren" legt alles als JSON in die Zwischenablage; geht das nicht,
#     steht das JSON darunter zum Markieren.
#   - Gemessen 17.10.2026 an Cottbus-Nuernberg (ger.2, beendet): Abruf aus
#     dem Browser klappt fuer scoreboard?dates= und summary (CORS), die
#     Zuordnung ebenso. keyEvents: 15 (8 Wechsel, 5 Gelb, 2 Tore), alle mit
#     Verein und deutscher Beschriftung; Statistik 28 Werte, die 9 gezeigten
#     fuer beide Vereine; Aufstellung je 20 Spieler, 11 Startelf, Formation.
#     commentary: 15 Eintraege, so viele wie keyEvents, Beispiel wortgleich mit
#     dem Ereignistext -- in der 2. Liga also nur eine Wiederholung. Der Reiter
#     "Kommentar" erscheint deshalb nur, wenn er Texte enthaelt, die keinem
#     Ereignis entsprechen. lang=de lieferte denselben englischen Text (beim
#     zweiten Versuch HTTP 504); die Sprachprobe ist deshalb entfallen.
#   - Gemessen 17.10.2026 an Kaiserslautern-Bochum (ger.2, live, 88'): dasselbe
#     Bild, Kommentar wieder nur Wiederholung. Ein Wechsel hat zwei Teilnehmer,
#     der Text nennt nur einen; die Reihenfolge ist also kein Beleg. Die
#     Aufstellung markiert genau die 8 ein- und 8 ausgewechselten Spieler
#     (subbedIn/subbedOut, bei 8 Wechseln). Wer kommt und wer geht, ergibt
#     sich deshalb aus diesen Feldern; passt keiner, stehen beide Namen ohne
#     Richtung da.
#   - Reiter "Aufstellung" (Variante A der Entwurfsseite "Reiter Aufstellung"):
#     je Verein Formation, Startelf nach Tor/Abwehr/Mittelfeld/Angriff, Bank
#     mit den Eingewechselten zuerst; Tor, Karte und Wechsel als Marke mit
#     Minute am Spieler. Die Marken kommen aus den ESPN-Ereignissen (gleiche
#     Schreibweise wie die Aufstellung; OpenLigaDB schreibt Namen teils mit
#     Diakritika). Tor und Karte gelten dem zuerst genannten Teilnehmer, den
#     auch der Ereignistext nennt. Gruppiert wird nach position (Kuerzel oder
#     Name); ist auch nur ein Spieler der Startelf nicht zuzuordnen, steht die
#     Startelf ungegliedert da, sortiert nach formationPlace. In der Gruppe
#     stehen die Spieler von hinten nach vorn (Tiefe: Tor, Abwehr, CM/LM/RM/DM,
#     AM*/CF*, F) und je Reihe von links nach rechts wie auf dem Feld (Kuerzel
#     mit L am Anfang ganz links, -L halblinks, ohne Seite Mitte, -R, R ganz
#     rechts). Mit den gemessenen Kuerzeln ergeben die Tiefen genau die Reihen
#     der Formation (FCK 3-4-2-1, Bochum 4-2-3-1).
#   - Gemessen 17.10.2026 an Kaiserslautern-Bochum (beendet): alle 22
#     Startspieler zugeordnet, Kuerzel G, CD, CD-L, CD-R, LB, RB, CM-L, CM-R,
#     LM, RM, AM, AM-L, AM-R, CF-L, CF-R, F; jersey als Text; 24 von 24
#     Ereignis-Namen in der Aufstellung, 9 von 9 Wechseln mit Richtung (der
#     Ereignistext nennt den Eingewechselten). formationPlace folgt nicht den
#     Reihen (3-4-2-1: RM 2, LM 3, Abwehr 4-6) und taugt deshalb nicht zum
#     Sortieren nach Seite.
#   - Spielfeld (Variante B der Entwurfsseite "Aufstellung Spielfeld"): Feld ist
#     die Startansicht des Reiters, umschaltbar auf die Liste (fb.aufAnsicht,
#     gilt bis zum Neuladen). Jede belegte Tiefe wird eine Reihe, von unten
#     (Tor) nach oben, darin nach Seite und bei Gleichstand nach
#     formationPlace. Gezeichnet wird nur, wenn die Reihen genau zur Formation
#     passen (Torwartreihe plus z. B. 3-4-2-1); sonst Liste mit Hinweis. Das
#     belegen bisher nur die zwei Formationen oben; Ergebnis je Verein steht in
#     der Messung ("Spielfeld"). Auf dem Feld steht die Startelf (die
#     Position Eingewechselter ist ungemessen), darunter die Wechsel dieses
#     Vereins in zeitlicher Folge und die uebrige Bank.
#   - Gemessen 17.10.2026 an Elversberg-Augsburg (ger.1, live): Feld bei beiden
#     Vereinen (4-2-3-1, 3-4-2-1); commentary 112 Eintraege, davon 90 ohne
#     passendes Ereignis, in der 1. Liga gibt es also eigenen Kommentar
#     (englisch). athlete liefert lastName, fullName, displayName, shortName,
#     kein firstName; der Kurzname auf dem Feld ist deshalb lastName.
#     keyEvents enthalten "Start Delay"/"End Delay" (Unterbrechung/Fortsetzung).
#   - Pokalspiele (L 'pokal'): Spiel aus fb.pokalSpiele, Tore aus ESPN, Kopf
#     "DFB-Pokal · <Runde>", Ergebnis mit "n. V." bzw. "i. E. x:y"; die Messung
#     zeigt statt OpenLigaDB den Pokalstatus und die Statusfolge (Status,
#     Periode, Uhr, Zahl der details und der Elfmeterschiessen-Treffer je
#     Wechsel, solange die View offen ist) und wann der Endstand zuerst zu
#     sehen war.
#   - Text im Popup steht links: button-card zentriert Custom Fields, die
#     Huelle setzt deshalb text-align: left.
#   - Klickbarkeit und Touch wie im Flugradar: button-card setzt bei Karten
#     ohne Aktion pointer-events: none und verwirft am Handy den click nach
#     touchend; Tippziele setzen pointer-events: auto und loesen ueber
#     fb.tipp bei touchend aus. Links oeffnen per window.open.
#   - Kopf und Schliessen-Knopf rendert fussball_spiel selbst (Bubble zeigt
#     keinen Kopf, weil die Auswahl im Browser liegt).
#
# Zeitstrahl der Vereinskarte (Variante Z1 der Entwurfsseite "FCK-Zeitstrahl"):
#   - Zwei Spuren wie ein Ticker: Heimverein ueber, Gastverein unter der Linie,
#     Kuerzel von ESPN links (Lieblingsverein in Vereinsrot). Beide Halbzeiten
#     getrennt, Breite je Haelfte proportional zu 45 min + Nachspielzeit (Bereich
#     gestrichelt). Symbole: Tor (Elfmeter mit "E", Eigentor mit "ET" beim
#     beguenstigten Verein), Gelb, Gelb-Rot, Rot, wie im Ticker des Popups.
#     Gespielte Zeit hell, live ein Punkt an der aktuellen Minute. Antippen
#     oeffnet das Spiel-Popup.
#   - Verlaengerung (Pokal) als dritter und vierter Abschnitt (91.-105.,
#     106.-120. Minute, je 15 min plus Nachspielzeit), erst wenn sie gespielt
#     wird. Elfmeterschiessen nicht auf dem Strahl: ESPN fuehrt nur die Treffer
#     (shootout: true, Typ 104, Minute 121'-125'), ohne Fehlschuesse; rechts
#     steht stattdessen das Ergebnis (shootoutScore) je Spur, der Sieger hell.
#     Geprueft 25.10.2026 an Mannheim-Kaiserslautern (0:1 n. V., Ereignisse bis
#     120'+1', Schlussuhr 120'+3') und Saarbruecken-Hertha (1:1 n. V., 2:4 i. E.).
#   - Nur bei Status live oder post; bei "Ergebnis offen" und vor Anstoss nicht.
#     Ohne ESPN-Daten (Fehler, CORS, Spiel nicht gefunden) fehlt der Strahl
#     ganz, die Torschuetzenzeile aus OpenLigaDB bleibt.
#   - Daten: ESPN-Scoreboard competitions[0].details. Laeuft das Spiel, derselbe
#     Abruf wie die Spielminute (fb.espn, 45 s), sonst scoreboard?dates= des
#     Anstosstags (fb.espnSpiel, 15 min). Kein zusaetzlicher Abruf waehrend des
#     Spiels. Entscheidend ist der Status dieses Spiels, nicht der Liga: das
#     Live-Scoreboard fuehrt nur die Spiele des Tages, ein beendetes Spiel vom
#     Vortag fehlt dort (gesehen 25.10.2026, 14:13 Uhr: Strahl des Spiels vom
#     24.10. fehlte, weil drei andere Spiele der 2. Liga liefen).
#   - Gemessen 25.10.2026 an den 4 Spielen der 2. Liga vom 24.10.2026 (beendet):
#     26 details (15 Gelb, 8 Tore, 3 Elfmetertore), Tore je Verein = Endstand,
#     keine Wechsel. Felder: clock.displayValue ("58'", "90'+6'"), clock.value
#     (Sekunden; in der Nachspielzeit stets 5400, deshalb dort displayValue),
#     team.id, scoringPlay, penaltyKick, ownGoal, yellowCard, redCard,
#     athletesInvolved[0].id. Gelb-Rot hat keinen eigenen Typ: Rot fuer einen
#     Spieler mit Gelb im selben Spiel (Typ 93 nach 94, siehe Kopf von
#     fussball-view.yaml). Status: period (1/2), displayClock "90'+7'" am Ende.
#   - Gemessen 25.10.2026, 14:13 Uhr, an 3 laufenden Spielen der 2. Liga (44'):
#     das Live-Scoreboard fuellt details schon waehrend des Spiels (7 Eintraege:
#     3 Gelb, 4 Tore, Tore je Verein = Zwischenstand 1:0, 1:0, 2:0).
#   - Ungemessen: Rot und Eigentor im Scoreboard (kein Fall am 24.10.); die
#     Nachspielzeit der 1. Halbzeit nach der Pause (nur, solange die Seite offen
#     war, sonst 45 min).
#   - Ueberlappung: Die Breite ist beim Zeichnen unbekannt; gerechnet wird mit
#     280 px. Liegen zwei Symbole einer Spur naeher, rueckt das spaetere eine
#     Ebene nach aussen.
#
# Wappen: teamIconUrl aus OpenLigaDB (meist Wikimedia-SVG). Bis das Bild
# geladen ist bzw. falls es fehlt, stehen die Initialen im Kreis.
#
# Voraussetzung: custom:button-card (HACS, getestet mit v7.0.1),
#                fuer das Popup custom:bubble-card (Muster aus dem Flugradar,
#                dort mit v3.4.1).
# ============================================================================
button_card_templates:
  fussball_daten:
    variables:
      fb: |
        [[[
          // Gemeinsamer Datenzugriff, einmal pro Seite in window.__fussball.
          // VERSION bei jeder Aenderung an diesem Block erhoehen: Eine offene Seite behaelt
          // sonst nach einem Dashboard-Update das alte Objekt (fehlende Funktionen).
          const VERSION = 18, alt = window.__fussball;
          if (alt && alt.version === VERSION) { alt.hass = hass; return alt; }
          // Alte Instanz stilllegen, damit sie nicht weiter in die Karten zeichnet
          if (alt) { if (alt.subs) alt.subs.clear(); if (alt.timer) clearInterval(alt.timer); }
          const MIN = 60e3;
          // OpenLigaDB: Spielplan, Stand, Tabelle der Ligen. ESPN (inoffiziell): Spielminute, Zeitstrahl,
          // Spieldetails und der ganze DFB-Pokal.
          const BASIS = { oldb: 'https://api.openligadb.de/', espn: 'https://site.api.espn.com/apis/site/v2/sports/soccer/' };
          const F = "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;";
          const fb = { version: VERSION, F, hass, cache: {}, laeuft: {}, sperre: {}, fehler: null, fehlerEspn: null, fehlerPfad: {}, live: {}, subs: new Map() };
          fb.saison = () => { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; };
          // Abruf mit Cache: liefert sofort den letzten Stand und holt im Hintergrund neu,
          // wenn er aelter als maxAlter ist. Nach einem Fehler 1 min Pause je Pfad.
          // ESPN-Fehler stehen getrennt in fehlerEspn: ohne ESPN fehlt nur die Minute.
          // fehlerPfad haelt den letzten Fehler je Pfad (fuer die Messung im Spiel-Popup).
          fb.get = (pfad, maxAlter, quelle = 'oldb') => {
            const key = quelle === 'oldb' ? pfad : quelle + ':' + pfad;
            const c = fb.cache[key], now = Date.now();
            if ((!c || now - c.t > maxAlter) && !fb.laeuft[key] && !(fb.sperre[key] > now)) {
              fb.laeuft[key] = true;
              fetch(BASIS[quelle] + pfad)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(d => { fb.cache[key] = { t: Date.now(), d }; delete fb.fehlerPfad[key]; if (quelle === 'oldb') fb.fehler = null; else fb.fehlerEspn = null; })
                .catch(e => {
                  const t = (e && e.message) || String(e);
                  fb.fehlerPfad[key] = (e && e.name && e.name !== 'Error' ? e.name + ': ' : '') + t;
                  if (quelle === 'oldb') fb.fehler = t; else fb.fehlerEspn = t;
                  fb.sperre[key] = Date.now() + (quelle === 'oldb' ? MIN : 5 * MIN);
                })
                .finally(() => { fb.laeuft[key] = false; fb.neu(); });
            }
            return c ? c.d : undefined;
          };
          // Status: pre / live / post / offen (vorbei, aber noch kein Endergebnis). Pokalspiele (ESPN)
          // bringen ihren Zustand mit ("in" auch in Verlaengerung und Elfmeterschiessen); fehlt er, gilt
          // das Zeitfenster ab Anstoss, im Pokal POKAL_DAUER (210 min) statt 3 h.
          fb.status = m => {
            const a = Date.parse(m.anstoss), now = Date.now();
            if (m.beendet) return 'post';
            if (m.zustand === 'in') return 'live';
            return isNaN(a) || now < a ? 'pre' : (now <= a + (m.quelle === 'espn' ? POKAL_DAUER : 3 * 3600e3) ? 'live' : 'offen');
          };
          // Spiel kompakt. Stand: Endergebnis (resultTypeID 2) oder letztes Tor,
          // je nachdem, was mehr Tore zaehlt (= aktueller).
          fb.kompakt = m => {
            const g = m.goals || [], e = (m.matchResults || []).find(r => r.resultTypeID === 2), l = g.length ? g[g.length - 1] : null;
            let th = null, tg = null;
            if (e && (!l || e.pointsTeam1 + e.pointsTeam2 >= l.scoreTeam1 + l.scoreTeam2)) { th = e.pointsTeam1; tg = e.pointsTeam2; }
            else if (l) { th = l.scoreTeam1; tg = l.scoreTeam2; }
            return {
              id: m.matchID, anstoss: m.matchDateTimeUTC, beendet: !!m.matchIsFinished,
              heim: m.team1?.shortName || m.team1?.teamName, heim_id: m.team1?.teamId, heim_logo: m.team1?.teamIconUrl,
              gast: m.team2?.shortName || m.team2?.teamName, gast_id: m.team2?.teamId, gast_logo: m.team2?.teamIconUrl,
              heim_voll: m.team1?.teamName, gast_voll: m.team2?.teamName,
              th, tg,
              tore: g.map(x => ({ min: x.matchMinute, name: x.goalGetterName, h: x.scoreTeam1, g: x.scoreTeam2, et: x.isOwnGoal, elf: x.isPenalty }))
            };
          };
          // Aktueller Spieltag einer Liga
          fb.spieltag = L => {
            const gr = fb.get('getcurrentgroup/' + L, 15 * MIN);
            if (!gr || !gr.groupOrderID) return null;
            const d = fb.get(`getmatchdata/${L}/${fb.saison()}/${gr.groupOrderID}`, fb.live[L] ? MIN : 15 * MIN);
            if (!Array.isArray(d)) return null;
            const spiele = d.map(fb.kompakt), now = Date.now();
