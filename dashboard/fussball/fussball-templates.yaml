          const posTexte = pos => !pos ? [] : typeof pos === 'string' ? [pos] : [pos.abbreviation, pos.displayName, pos.name].filter(Boolean).map(String);
          const gruppe = pos => { const t = posTexte(pos); const g = GRUPPE.find(([, re]) => t.some(x => re.test(x))); return g ? g[0] : null; };
