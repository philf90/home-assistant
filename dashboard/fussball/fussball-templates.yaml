                if (n) { try { n.innerHTML = render(); } catch (e) { n.innerHTML = fb.hinweis('Fehler: ' + fb.esc(e.message)); } }
              });
            });
          };
          // Hilfen fuer die Darstellung
          fb.esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          fb.hinweis = t => `<div style="${F}color:var(--owlet-text-sekundaer, #8794a5);font-size:12.5px;padding:2px;">${t}</div>`;
          fb.warte = was => fb.fehler
            ? fb.hinweis('OpenLigaDB nicht erreichbar (' + fb.esc(fb.fehler) + ') – neuer Versuch in 1 Min.')
            : fb.hinweis(was + ' wird geladen …');
          fb.wappen = (url, name, px) => {
