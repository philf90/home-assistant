            }
            let html;
            try { html = render(); } catch (e) { html = fb.hinweis('Fehler: ' + fb.esc(e.message)); }
            return `<div data-fb="${key}" style="width:100%;">${html}</div>`;
          };
          fb.neu = () => {
            const now = Date.now();
            fb.subs.forEach((s, el) => {
              if (!el.isConnected) { if (now - s.t > 10 * MIN) fb.subs.delete(el); return; }
              s.t = now;
              s.r.forEach((render, key) => {
