          const FARBE = { tor: 'color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a))', gelb: 'var(--owlet-amber, #e6b566)', rot: 'var(--owlet-rot, #f0736a)', elf: 'var(--owlet-amber, #e6b566)', wechsel: 'var(--owlet-blau, #7fb3d5)', phase: 'var(--owlet-text-sekundaer, #8794a5)', sonst: 'var(--owlet-text-sekundaer, #8794a5)' };
