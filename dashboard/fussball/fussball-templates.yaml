              const ie = m.ie, sieg = k !== 'post' ? '' : th > tg || (th === tg && ie && ie[0] > ie[1]) ? 'heim' : tg > th || (th === tg && ie && ie[1] > ie[0]) ? 'gast' : '';
              const zeile = (n, l, x, seite) => {
                const r = sieg ? (sieg === seite ? 'w' : 'l') : '', c = r === 'l' ? 'var(--owlet-text-sekundaer, #8794a5)' : 'var(--owlet-text, #f2f5f8)';
                return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:8px;align-items:center;"><span style="display:flex;align-items:center;gap:8px;min-width:0;">${fb.wappen(l, n, 20)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${c};font-weight:${r === 'w' ? 700 : 500};">${fb.esc(n)}</span></span><span style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:${c};">${k === 'pre' || x === null || x === undefined ? '' : x}</span></div>`;
              };
              // Laufend: Minute von ESPN ("67'", "HZ", im Pokal auch "i. E."), sonst "LIVE"
              const min = k === 'live' ? fb.minute(L, m) : null;
              if (k === 'live' && !min && m.quelle !== 'espn') ohneMinute++;
              const st = k === 'live' ? `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--owlet-rot, #f0736a);"><span class="pulse"></span>${min || 'LIVE'}</span>`
                : k === 'post' ? (m.zusatz ? (m.zusatz === 'i. E.' && ie ? `i. E. ${ie[0]}:${ie[1]}` : m.zusatz) : 'Ende') : (k === 'offen' ? 'offen' : fb.zeit(d));
              const bg = fav ? 'background:rgba(227,6,19,0.12);box-shadow:inset 3px 0 0 #e30613;' : (k === 'live' ? 'background:color-mix(in srgb, var(--owlet-rot, #f0736a) 12%, transparent);' : '');
              // Ab Anstoss oeffnet die Zeile das Spiel-Popup
              const klick = fb.antippbar(m) ? `role="button" tabindex="0" aria-label="${fb.esc(m.heim + ' gegen ' + m.gast)} öffnen" ${fb.tippAttr(`window.__fussball.waehle('${L}',${Number(m.id)})`)}` : '';
              html += `<div ${klick} style="display:grid;grid-template-columns:60px minmax(0,1fr) 12px;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;font-size:13.5px;${bg}${klick ? 'pointer-events:auto;cursor:pointer;' : ''}"><span style="font-size:11.5px;font-weight:700;color:var(--owlet-text-sekundaer, #8794a5);white-space:nowrap;font-variant-numeric:tabular-nums;">${st}</span><div style="display:flex;flex-direction:column;gap:4px;min-width:0;">${zeile(m.heim, m.heim_logo, th, 'heim')}${zeile(m.gast, m.gast_logo, tg, 'gast')}</div><span style="color:var(--owlet-muted, #6e7988);">${klick ? fb.pfeil : ''}</span></div>`;
            });
            // Hinweis nur, wenn ESPN beim Abruf scheitert (Minute fehlt dann)
            const notiz = ohneMinute && fb.fehlerEspn ? `<div style="font-size:11px;color:var(--owlet-text-sekundaer, #8794a5);padding:6px 2px 0;">Spielminute nicht verfügbar (ESPN: ${fb.esc(fb.fehlerEspn)})</div>` : '';
            return `<div style="${F}display:flex;flex-direction:column;gap:2px;">${html}${notiz}</div>`;
          };
          // ---------- Meldungen (Schalter; gemeldet wird von der Automation "Fussball: Meldungen") ----------
          fb.zustand = id => fb.hass && fb.hass.states[id] ? fb.hass.states[id].state : undefined;
          fb.dienst = (domain, service, data) => fb.hass.callService(domain, service, data).catch(e => console.warn('Fussball:', e));
          fb.MELDUNGEN = [
            ['input_boolean.fussball_meldung_anpfiff', 'Anpfiff und Abpfiff', 'Spielbeginn und Endstand'],
            ['input_boolean.fussball_meldung_wechsel', 'Ein- und Auswechslungen', 'beide Vereine, wer kommt und wer geht'],
            ['input_boolean.fussball_meldung_tore', 'Tore', 'beide Vereine, mit Torschütze und Spielstand'],
            ['input_boolean.fussball_meldung_elfmeter', 'Elfmeter', 'beide Vereine'],
            ['input_boolean.fussball_meldung_platzverweis', 'Platzverweise', 'Rot und Gelb-Rot, beide Vereine']
          ];
          fb.meldungenAn = () => fb.MELDUNGEN.filter(([e]) => fb.zustand(e) === 'on').length;
          fb.schalter = (eid, titel, text) => {
            const an = fb.zustand(eid) === 'on';
            return `<div role="switch" tabindex="0" aria-checked="${an}" ${fb.tippAttr(`window.__fussball.dienst('input_boolean','toggle',{entity_id:'${eid}'})`)} style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 2px;cursor:pointer;pointer-events:auto;border-top:1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05));">
                <div style="min-width:0;">
                  <div style="font-size:13.5px;font-weight:700;color:${an ? 'var(--owlet-text, #f2f5f8)' : 'var(--owlet-label, #b4c0cf)'};">${titel}</div>
                  <div style="font-size:12px;color:var(--owlet-text-sekundaer, #8794a5);">${text}</div>
                </div>
                <span style="position:relative;width:42px;height:24px;border-radius:12px;flex:none;background:${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 45%, transparent)' : 'color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--owlet-dunkel-anteil, 100%), var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)))'};border:1px solid ${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 50%, transparent)' : 'var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'};">
                  <span style="position:absolute;top:2px;left:${an ? 20 : 2}px;width:18px;height:18px;border-radius:50%;background:${an ? 'color-mix(in srgb, var(--owlet-text, #f2f5f8) var(--owlet-dunkel-anteil, 100%), var(--owlet-flaeche-erhoeht, #222b3c))' : 'var(--owlet-text-sekundaer, #8794a5)'};"></span>
                </span>
              </div>`;
          };
          fb.meldungen = () => {
            const zeilen = fb.MELDUNGEN.map(([e, t, x]) => fb.zustand(e) === undefined ? fb.hinweis(`${e} fehlt`) : fb.schalter(e, t, x)).join('');
            return `<div ${fb.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;text-align:left;">${zeilen}</div>`;
          };
          fb.tag = d => d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
          fb.zeit = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
          fb.timer = setInterval(fb.neu, 30e3);
          window.__fussball = fb;
          return fb;
        ]]]
    extra_styles: |
      .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: fb-pulse 1.6s ease-in-out infinite; }
      @keyframes fb-pulse { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  # --------------------------------------------------------------------------
  # Kopfzeile wie in gesundheit-view.yaml; Unterzeile als custom_field "unter",
  # damit sie sich nach einem Abruf selbst aktualisieren kann.
  # --------------------------------------------------------------------------
  fussball_kopf:
    template: fussball_daten
    show_icon: true
    show_name: true
    show_label: false
    show_state: false
    tap_action:
      action: none
    styles:
      icon:
      - width: 23px
      - height: 23px
      - color: 'var(--owlet-blau, #7fb3d5)'
      - --ha-icon-display: block
      name:
      - justify-self: start
      - align-self: end
      - font-size: 17px
      - font-weight: 700
      - letter-spacing: -0.02em
      - color: 'var(--owlet-text, #f2f5f8)'
      - max-width: 100%
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 2px 2px 6px
      custom_fields:
        # Unterzeile darf umbrechen (button-card setzt sonst nowrap); mit
        # minmax(0, 1fr) unten schiebt sie sich nicht mehr unter das Badge
        # (wie flug_kopf in flugradar-templates.yaml).
        unter:
        - justify-self: start
        - align-self: start
        - font-size: 12.5px
        - line-height: 1.35
        - color: 'var(--owlet-text-sekundaer, #8794a5)'
        - margin-top: 1px
        - text-align: left
        - white-space: normal
        - max-width: 100%
        badge:
        - justify-self: end
        - align-self: center
        - margin-left: 10px
      grid:
      - grid-template-areas: '"i n badge" "i unter badge"'
      - grid-template-columns: min-content minmax(0, 1fr) min-content
      - grid-template-rows: min-content min-content
      img_cell:
      - width: 44px
      - height: 44px
      - border-radius: 13px
      - margin-right: 14px
      - align-self: center
      - background: 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent)'
      - border: '1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)'

  fussball_inhalt:
    template: fussball_daten
    show_icon: false
    show_name: false
    show_label: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 0
      custom_fields:
        inhalt:
        - width: 100%
      grid:
      - grid-template-areas: '"inhalt"'

  # ======================= Lieblingsverein (F1) =======================
  fussball_fck_kopf:
    template: fussball_kopf
    icon: mdi:shield-star
    styles:
      icon:
      - color: 'color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a))'
      custom_fields:
        unter:
        - color: 'var(--owlet-text-sekundaer, #8794a5)'
      img_cell:
      - background: rgba(227, 6, 19, 0.16)
      - border: 1px solid rgba(227, 6, 19, 0.24)
    custom_fields:
      unter: |
        [[[
          // Wettbewerb des gezeigten Spiels (fb.vereinAuswahl): Liga mit Spieltag oder DFB-Pokal mit Runde
          const fb = variables.fb, L = variables.liga, ID = variables.verein, IDE = variables.verein_espn;
          return fb.bereich(this, 'unter', () => {
            const w = fb.vereinAuswahl(L, ID, IDE);
            if (w.L === 'pokal' && w.m) return fb.teile(`${fb.pokalIcon(13)} DFB-Pokal`, fb.esc(w.m.runde));
            return fb.teile((L === 'bl1' ? '1.' : '2.') + ' Bundesliga', w.s ? `${w.s.nr}. Spieltag` : '');
          });
        ]]]
      badge: |
        [[[
          // LIVE / Anstoss / Endstand des gezeigten Spiels (Liga oder Pokal)
          const fb = variables.fb, L = variables.liga, ID = variables.verein, IDE = variables.verein_espn;
          return fb.bereich(this, 'badge', () => {
            const w = fb.vereinAuswahl(L, ID, IDE), m = w.m;
            const anstoss = d => fb.tag(d) + ' ' + fb.zeit(d);
            if (m) {
              const k = fb.status(m);
              if (k === 'live') return `<span style="display:inline-flex;align-items:center;gap:6px;color:#f2f5f8;background:rgba(227,6,19,0.85);border:1px solid rgba(255,255,255,0.14);font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span class="pulse"></span>LIVE</span>`;
              if (k === 'post') return fb.badge('var(--owlet-gruen, #a6d49e)', 'Endstand');
              if (k === 'offen') return fb.badge('var(--owlet-text-sekundaer, #8794a5)', 'offen');
              return fb.badge('var(--owlet-blau, #7fb3d5)', anstoss(new Date(m.anstoss)));
            }
            return w.nx ? fb.badge('var(--owlet-blau, #7fb3d5)', anstoss(new Date(w.nx.anstoss))) : '';
          });
        ]]]

  fussball_fck:
    template: fussball_inhalt
    styles:
      card:
      - padding: 0 2px 2px
    custom_fields:
      inhalt: |
        [[[
          // Spiel (live / naechstes / letztes, Liga oder DFB-Pokal nach fb.vereinAuswahl),
          // Torschuetzen, Zeitstrahl, Platz, Punkte, Form (Liga)
          const fb = variables.fb, L = variables.liga, ID = variables.verein, IDE = variables.verein_espn, F = fb.F;
          return fb.bereich(this, 'inhalt', () => {
            const w = fb.vereinAuswahl(L, ID, IDE), s = w.s, v = w.v, t = fb.tabelle(L);
            if (!s || !v || !t) return fb.warte('Vereinsdaten');
            // SL/SID: Wettbewerb und Vereins-ID in der Quelle des gezeigten Spiels
            const z = t.find(r => r.id == ID) || {}, now = Date.now(), m = w.m, nx = w.nx, SL = w.L, SID = SL === 'pokal' ? IDE : ID;
            let heim, gast, hl, gl, th = null, tg = null, k = 'pre', a, tore = [], heimId = null;
            if (m) {
              a = Date.parse(m.anstoss); heim = m.heim; gast = m.gast; hl = m.heim_logo; gl = m.gast_logo;
              th = m.th; tg = m.tg; tore = m.tore || []; heimId = m.heim_id; k = fb.status(m);
            } else if (nx) {
              a = Date.parse(nx.anstoss); const n = z.name || 'Kaiserslautern';
              heim = nx.heim ? n : nx.gegner; gast = nx.heim ? nx.gegner : n;
              hl = nx.heim ? z.logo : nx.gegner_logo; gl = nx.heim ? nx.gegner_logo : z.logo;
            } else return fb.hinweis('Kein Spiel gefunden.');
            if (k === 'live' && th === null) { th = 0; tg = 0; }
            // Kennung nach Verlaengerung bzw. Elfmeterschiessen (Pokal)
            const zusatz = m && m.zusatz ? `<span style="font-size:11px;font-weight:800;letter-spacing:0.04em;color:var(--owlet-label, #b4c0cf);background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));border-radius:7px;padding:1px 6px;">${m.zusatz}${m.zusatz === 'i. E.' && m.ie ? ' ' + m.ie[0] + ':' + m.ie[1] : ''}</span>` : '';
            let sub;
            if (k === 'live') {
              // Minute von ESPN; ohne ESPN die Minute des letzten Tors
              const min = fb.minute(SL, m), lt = tore.length ? tore[tore.length - 1] : null;
              const zusatzMin = min ? (min === 'HZ' ? ' · Halbzeit' : ' · ' + min) : (lt && lt.min ? ` · Tor ${lt.min}'` : '');
              sub = `<span style="display:inline-flex;align-items:center;gap:5px;color:color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a));"><span class="pulse"></span>LIVE${zusatzMin}</span>`;
            } else if (k === 'pre') {
              const diff = a - now, h = Math.round(diff / 3600e3), d = Math.round(diff / 86400e3);
              sub = `<span style="color:var(--owlet-text-sekundaer, #8794a5);">${diff < 3600e3 ? 'in ' + Math.max(1, Math.round(diff / 60e3)) + ' Min.' : (h < 24 ? 'in ' + h + ' Std.' : 'in ' + d + ' Tag' + (d === 1 ? '' : 'en'))}</span>`;
            } else sub = `${zusatz}<span style="color:var(--owlet-text-sekundaer, #8794a5);">${k === 'post' ? 'Endstand' : 'Ergebnis offen'}</span>`;
            // Spielstand oeffnet das Spiel-Popup, sobald das Spiel angepfiffen ist
            const klick = m && k !== 'pre' ? `role="button" tabindex="0" aria-label="Spiel öffnen" ${fb.tippAttr(`window.__fussball.waehle('${SL}',${Number(m.id)})`)}` : '';
            const score = k === 'pre'
              ? `<b style="font-size:24px;color:var(--owlet-text-sekundaer, #8794a5);font-variant-numeric:tabular-nums;">${fb.zeit(new Date(a))}</b>`
              : `<b style="font-size:36px;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--owlet-text, #f2f5f8);">${th ?? '–'} : ${tg ?? '–'}</b>`;
            const seite = (n, l, r) => `<div style="display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:13px;font-weight:700;color:var(--owlet-text, #f2f5f8);min-width:0;">${fb.wappen(l, n, 46)}<span style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${fb.esc(n)}</span><small style="font-size:11px;color:var(--owlet-text-sekundaer, #8794a5);font-weight:600;">${r}</small></div>`;
            // Torschuetzen: Heim/Gast aus der Aenderung des Spielstands
            let ph = 0;
            const tl = tore.map(x => {
              const heimTor = x.h > ph; ph = x.h;
              const unser = heimTor === (heimId == SID);
              return `<span style="color:${unser ? 'var(--owlet-text, #f2f5f8)' : 'var(--owlet-text-sekundaer, #8794a5)'};">⚽ ${x.min ? x.min + "' " : ''}${fb.esc(x.name || '')}${x.elf ? ' (E)' : ''}${x.et ? ' (ET)' : ''}</span>`;
            }).join('');
            // Pokalspiel vor Anpfiff: Wettbewerb und Stadion als Marke unter dem Spielstand
            const marke = m && SL === 'pokal' && k === 'pre' ? `<div style="display:flex;justify-content:center;"><span style="display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11.5px;font-weight:700;color:var(--owlet-label, #b4c0cf);background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));border-radius:9px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fb.pokalIcon(13)} DFB-Pokal${m.ort ? ' · ' + fb.esc(m.ort) : ''}</span></div>` : '';
            const form = v.form.map(f => `<i style="width:18px;height:18px;border-radius:6px;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;color:#10151d;background:${f === 'S' ? 'var(--owlet-gruen, #a6d49e)' : (f === 'N' ? 'var(--owlet-rot, #f0736a)' : 'var(--owlet-text-sekundaer, #8794a5)')};">${f}</i>`).join('');
            const zelle = (n, inhalt) => `<div style="background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));border-radius:14px;padding:9px 11px;min-width:0;"><div style="font-size:11px;font-weight:600;color:var(--owlet-text-sekundaer, #8794a5);">${n}</div>${inhalt}</div>`;
            const wert = (wt, e) => `<div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:var(--owlet-text, #f2f5f8);">${wt}${e ? `<span style="font-size:0.62em;color:var(--owlet-text-sekundaer, #8794a5);font-weight:600;"> ${e}</span>` : ''}</div>`;
            return `<div style="${F}display:flex;flex-direction:column;gap:12px;">
              <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;">
                ${seite(heim, hl, 'Heim')}
                <div ${klick} style="display:flex;flex-direction:column;align-items:center;gap:4px;${klick ? 'pointer-events:auto;cursor:pointer;padding:6px 10px;margin:-6px -10px;border-radius:16px;' : ''}">${score}<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;">${sub}${klick ? `<span style="color:var(--owlet-text-sekundaer, #8794a5);">${fb.pfeil}</span>` : ''}</span></div>
                ${seite(gast, gl, 'Gast')}
              </div>
              ${marke}
              ${tl ? `<div style="font-size:12px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;">${tl}</div>` : ''}
              ${m ? fb.zeitstrahl(SL, m, SID) : ''}
              <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
                ${zelle('Platz', wert(z.platz ?? '–'))}
                ${zelle('Punkte', wert(z.pkt ?? '–', z.sp != null ? z.sp + ' Sp' : ''))}
                ${zelle('Form', `<div style="display:flex;gap:4px;margin-top:4px;">${form || '<span style="color:var(--owlet-text-sekundaer, #8794a5);font-size:12px;">–</span>'}</div>`)}
              </div></div>`;
          });
        ]]]

  # ======================= Spieltag (S1) =======================
  fussball_spieltag_kopf:
    template: fussball_kopf
    icon: mdi:soccer
    custom_fields:
      unter: |
        [[[
          const fb = variables.fb, L = variables.liga;
          return fb.bereich(this, 'unter', () => {
            const s = fb.spieltag(L);
            if (!s) return 'Spieltag';
            let post = 0, pre = 0;
            s.spiele.forEach(m => { const k = fb.status(m); if (k === 'post') post++; else if (k === 'pre') pre++; });
            return fb.teile(`${s.nr}. Spieltag`, `${post} beendet`, `${pre} ausstehend`);
          });
        ]]]
      badge: |
        [[[
          // Laufende Spiele (rot), "beendet" (gruen) oder naechster Anstoss (blau)
          const fb = variables.fb, L = variables.liga;
          return fb.bereich(this, 'badge', () => {
            const s = fb.spieltag(L);
            if (!s) return '';
            let live = 0, post = 0, next = null;
            s.spiele.forEach(m => {
              const k = fb.status(m), a = Date.parse(m.anstoss);
              if (k === 'live') live++; else if (k === 'post') post++;
              else if (k === 'pre' && (next === null || a < next)) next = a;
            });
            if (live) return fb.badge('var(--owlet-rot, #f0736a)', live + ' live', true);
            if (s.spiele.length && post === s.spiele.length) return fb.badge('var(--owlet-gruen, #a6d49e)', 'beendet');
            if (next) { const d = new Date(next); return fb.badge('var(--owlet-blau, #7fb3d5)', fb.tag(d) + ' ' + fb.zeit(d)); }
            return '';
          });
        ]]]

  fussball_spieltag:
    template: fussball_inhalt
    custom_fields:
      inhalt: |
        [[[
          // S1: nach Anstoss gruppiert, Heim/Gast untereinander, Tore rechts (fb.spielListe)
          const fb = variables.fb, L = variables.liga, FAV = variables.fav;
          return fb.bereich(this, 'inhalt', () => {
            const s = fb.spieltag(L);
            if (!s) return fb.warte('Spieltag');
            if (!s.spiele.length) return fb.hinweis('Keine Spiele für diesen Spieltag gemeldet.');
            return fb.spielListe(L, s.spiele, FAV);
          });
        ]]]

  # ======================= Tabelle (T1) =======================
  fussball_tabelle_kopf:
    template: fussball_kopf
    icon: mdi:format-list-numbered
    custom_fields:
      unter: |
        [[[
          const fb = variables.fb, L = variables.liga;
          return fb.bereich(this, 'unter', () => {
            const c = fb.cache[`getbltable/${L}/${fb.saison()}`];
            return c ? fb.teile('Tabelle', 'Stand ' + fb.zeit(new Date(c.t)) + ' Uhr') : 'Tabelle';
          });
        ]]]
      badge: |
        [[[
          // Live-Stand, solange Spiele dieser Liga laufen; sonst Spieltag
          const fb = variables.fb, L = variables.liga;
          return fb.bereich(this, 'badge', () => {
            const s = fb.spieltag(L);
            if (!s) return '';
            if (s.spiele.some(m => fb.status(m) === 'live')) return fb.badge('var(--owlet-rot, #f0736a)', 'Live-Stand', true);
            return `<span style="display:inline-flex;align-items:center;color:var(--owlet-text-sekundaer, #8794a5);background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">${s.nr}. Spieltag</span>`;
          });
        ]]]

  fussball_tabelle:
    template: fussball_inhalt
    custom_fields:
      inhalt: |
        [[[
          // T1: Platz mit Zonenstrich, Verein, Sp, TD, Pkt; Lieblingsverein nach H1
          const fb = variables.fb, L = variables.liga, FAV = variables.fav, F = fb.F;
          return fb.bereich(this, 'inhalt', () => {
            const rows = fb.tabelle(L);
            if (!rows) return fb.warte('Tabelle');
            // 2. Liga: 1-2 Aufstieg, 3 + 16 Relegation, 17-18 Abstieg;
            // 1. Liga: 1-4 Champions League, 16 Relegation, 17-18 Abstieg
            const zone = p => L === 'bl2'
              ? (p <= 2 ? 'var(--owlet-gruen, #a6d49e)' : ((p === 3 || p === 16) ? 'var(--owlet-amber, #e6b566)' : (p >= 17 ? 'var(--owlet-rot, #f0736a)' : '')))
              : (p <= 4 ? 'var(--owlet-blau, #7fb3d5)' : (p === 16 ? 'var(--owlet-amber, #e6b566)' : (p >= 17 ? 'var(--owlet-rot, #f0736a)' : '')));
            // Vereine mit laufendem Spiel (die Tabelle zaehlt sie schon mit)
            const s = fb.spieltag(L), live = new Set();
            (s ? s.spiele : []).forEach(m => { if (fb.status(m) === 'live') { live.add(m.heim_id); live.add(m.gast_id); } });
            const th = 'font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--owlet-text-sekundaer, #8794a5);padding:0 6px 6px;text-align:right;';
            let body = '';
            rows.forEach((r, i) => {
              const fav = FAV && r.id == FAV, z = zone(r.platz);
              const td = 'padding:5px 6px;text-align:right;color:var(--owlet-text-sekundaer, #8794a5);' + (i ? 'border-top:1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05));' : '') + (fav ? 'background:rgba(227,6,19,0.12);' : '');
              const strich = (!fav && z) ? `<span style="position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:3px;background:${z};"></span>` : '';
              body += `<tr>
                <td style="${td}${fav ? 'box-shadow:inset 3px 0 0 #e30613;border-radius:8px 0 0 8px;' : ''}position:relative;text-align:center;width:30px;font-weight:700;color:var(--owlet-text, #f2f5f8);">${strich}${r.platz}</td>
                <td style="${td}text-align:left;color:var(--owlet-text, #f2f5f8);width:100%;max-width:0;"><div style="display:flex;align-items:center;gap:8px;min-width:0;">${fb.wappen(r.logo, r.name, 20)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${fav ? 'font-weight:700;' : ''}">${fb.esc(r.name)}</span>${live.has(r.id) ? '<span class="pulse" style="color:var(--owlet-rot, #f0736a);flex:0 0 auto;"></span>' : ''}</div></td>
                <td style="${td}">${r.sp}</td>
                <td style="${td}">${r.td > 0 ? '+' + r.td : r.td}</td>
                <td style="${td}${fav ? 'border-radius:0 8px 8px 0;' : ''}color:var(--owlet-text, #f2f5f8);font-weight:700;">${r.pkt}</td></tr>`;
            });
            const leg = L === 'bl2'
              ? [['var(--owlet-gruen, #a6d49e)', 'Aufstieg'], ['var(--owlet-amber, #e6b566)', 'Relegation'], ['var(--owlet-rot, #f0736a)', 'Abstieg']]
              : [['var(--owlet-blau, #7fb3d5)', 'Champions League'], ['var(--owlet-amber, #e6b566)', 'Relegation'], ['var(--owlet-rot, #f0736a)', 'Abstieg']];
            return `<div style="${F}display:flex;flex-direction:column;gap:10px;">
              <table style="width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;">
                <thead><tr><th style="${th}text-align:center;">#</th><th style="${th}text-align:left;">Verein</th><th style="${th}">Sp</th><th style="${th}">TD</th><th style="${th}">Pkt</th></tr></thead>
                <tbody>${body}</tbody></table>
              <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--owlet-text-sekundaer, #8794a5);">${leg.map(([c, n]) => `<span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:8px;height:8px;border-radius:3px;background:${c};display:inline-block;"></i>${n}</span>`).join('')}${live.size ? '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--owlet-rot, #f0736a);"><span class="pulse"></span>spielt gerade</span>' : ''}</div></div>`;
          });
        ]]]

  # ======================= DFB-Pokal: Runde (S1) und Pokalweg (Variante A) =======================
  # Daten von ESPN (fb.pokalRunde, fb.pokalVerein), Darstellung der Runde wie der Liga-Spieltag
  # (fb.spielListe). Pokal-Icon neutral: der Pokal hat keine eigene Farbe (DESIGN.md).
  fussball_pokal_kopf:
    template: fussball_kopf
    icon: mdi:trophy-outline
    styles: &pokal_kopf_stil
      icon:
      - color: 'var(--owlet-label, #b4c0cf)'
      img_cell:
      - background: 'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))'
      - border: '1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'
    custom_fields:
      unter: |
        [[[
          const fb = variables.fb;
          return fb.bereich(this, 'unter', () => {
            const r = fb.pokalRunde();
            if (!r) return 'Runde';
            if (!r.runde) return 'kein Spieltermin bekannt';
            const post = r.spiele.filter(m => fb.status(m) === 'post').length;
            return fb.teile(fb.esc(r.runde.name), `${r.spiele.length} Spiele`, `${post} beendet`);
          });
        ]]]
      badge: |
        [[[
          // Laufende Spiele (rot), "beendet" (gruen) oder naechster Anstoss (blau), wie im Spieltag
          const fb = variables.fb;
          return fb.bereich(this, 'badge', () => {
            const r = fb.pokalRunde();
            if (!r || !r.spiele.length) return '';
            let live = 0, post = 0, next = null;
            r.spiele.forEach(m => {
              const k = fb.status(m), a = Date.parse(m.anstoss);
              if (k === 'live') live++; else if (k === 'post') post++;
              else if (k === 'pre' && (next === null || a < next)) next = a;
            });
            if (live) return fb.badge('var(--owlet-rot, #f0736a)', live + ' live', true);
            if (post === r.spiele.length) return fb.badge('var(--owlet-gruen, #a6d49e)', 'beendet');
            if (next) { const d = new Date(next); return fb.badge('var(--owlet-blau, #7fb3d5)', fb.tag(d) + ' ' + fb.zeit(d)); }
            return '';
          });
        ]]]

  fussball_pokal:
    template: fussball_inhalt
    custom_fields:
      inhalt: |
        [[[
          // Alle Spiele der laufenden Runde; Variable fav = ESPN-ID des Lieblingsvereins (H1)
          const fb = variables.fb, FAV = variables.fav;
          return fb.bereich(this, 'inhalt', () => {
            const r = fb.pokalRunde();
            if (!r) return fb.warteEspn('DFB-Pokal', fb.pokalRundePfad);
            if (!r.runde) return fb.hinweis('ESPN nennt noch keine Spieltage für die nächste Runde.');
            if (!r.spiele.length) return r.laedt ? fb.warteEspn('Runde', fb.pokalTagPfad(r.runde.tage[0])) : fb.hinweis('Keine Spiele für diese Runde gemeldet.');
            return fb.spielListe('pokal', r.spiele, FAV);
          });
        ]]]

  fussball_pokalweg_kopf:
    template: fussball_kopf
    icon: mdi:trophy-outline
    styles: *pokal_kopf_stil
    custom_fields:
      unter: |
        [[[
          // Verein und Saison; Variable verein_espn = ESPN-ID des Vereins
          const fb = variables.fb, IDE = variables.verein_espn;
          return fb.bereich(this, 'unter', () => {
            const p = fb.pokalVerein(IDE), sn = fb.saison();
            return fb.teile(p && p.team ? fb.esc(p.team) : 'Verein', `Saison ${sn}/${String(sn + 1).slice(2)}`);
          });
        ]]]
      badge: |
        [[[
          // im Wettbewerb (gruen), ausgeschieden (grau) oder Pokalsieger (gruen)
          const fb = variables.fb, IDE = variables.verein_espn;
          return fb.bereich(this, 'badge', () => {
            const d = fb.pokalwegDaten(IDE);
            if (!d) return '';
            if (d.sieger) return fb.badge('var(--owlet-gruen, #a6d49e)', 'Pokalsieger');
            if (d.aus) return fb.badge('var(--owlet-text-sekundaer, #8794a5)', 'ausgeschieden');
            return d.p.spiele.length ? fb.badge('var(--owlet-gruen, #a6d49e)', 'im Wettbewerb') : '';
          });
        ]]]

  fussball_pokalweg:
    template: fussball_inhalt
    custom_fields:
      inhalt: |
        [[[
          // Je Runde Gegner, Termin oder Ergebnis; Antippen eines Spiels oeffnet das Spiel-Popup
          const fb = variables.fb, IDE = variables.verein_espn;
          return fb.bereich(this, 'inhalt', () => fb.pokalweg(IDE));
        ]]]

  # ======================= Spiel-Popup (Inhalt der Bubble Card #fussball-spiel) =======================
  # Variablen verein / verein_espn: Team-ID des Lieblingsvereins bei OpenLigaDB bzw. ESPN
  # (Hervorhebung nach H1; ESPN fuer Pokalspiele).
  fussball_spiel:
    template: fussball_inhalt
    hold_action:
      action: none
    styles:
      card:
      - padding: 2px 2px 8px
      - cursor: default
    custom_fields:
      inhalt: |
        [[[
          const fb = variables.fb;
          return fb.bereich(this, 'spiel', () => fb.spielPopup(variables.verein, variables.verein_espn));
        ]]]

  # ======================= Meldungen zum Lieblingsverein =======================
  # Nur die Schalter; abgefragt und gemeldet wird von Home Assistant selbst
  # (fussball-espn-konfig.yaml und Automation "Fussball: Meldungen", siehe Kopf
  # von fussball-view.yaml). Die Karten selbst rufen dafuer nichts ab.
  fussball_meldungen_kopf:
    template: fussball_kopf
    icon: mdi:bell-ring-outline
    name: Meldungen
    triggers_update: &meldung_schalter
    - input_boolean.fussball_meldung_anpfiff
    - input_boolean.fussball_meldung_wechsel
    - input_boolean.fussball_meldung_tore
    - input_boolean.fussball_meldung_elfmeter
    - input_boolean.fussball_meldung_platzverweis
    custom_fields:
      unter: aufs iPhone, bei Spielen des Lieblingsvereins
      badge: |
        [[[
          const fb = variables.fb, n = fb.meldungenAn();
          return fb.badge(n ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-text-sekundaer, #8794a5)', `${n} von ${fb.MELDUNGEN.length} an`, false);
        ]]]

  fussball_meldungen:
    template: fussball_inhalt
    triggers_update: *meldung_schalter
    custom_fields:
      inhalt: |
        [[[ return variables.fb.meldungen(); ]]]
