            const statZeilen = STAT.filter(([n]) => det && det.stat[n] && det.stat[n].heim != null && det.stat[n].gast != null);
            // Hoechstens vier Reiter, die Messung oeffnet der Knopf im Fuss
            const reiter = [['ticker', 'Ticker']];
            if (det && Object.values(det.teams).some(x => x.spieler.length)) reiter.push(['aufstellung', 'Aufstellung']);
            if (det && det.komEigen) reiter.push(['kommentar', 'Kommentar']);
            if (statZeilen.length) reiter.push(['statistik', 'Statistik']);
            const tab = fb.tab === 'messung' || reiter.some(r => r[0] === fb.tab) ? fb.tab : 'ticker';
            const reiterHtml = `<div role="tablist" style="display:grid;grid-template-columns:repeat(${reiter.length},minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));">${reiter.map(([id, n]) => {
              const an = id === tab;
              return `<button type="button" role="tab" aria-selected="${an}" ${fb.tippAttr(`window.__fussball.zeige('${id}')`)} style="font:inherit;font-size:12.5px;font-weight:700;padding:7px 2px;border-radius:10px;cursor:pointer;pointer-events:auto;color:${an ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-text-sekundaer, #8794a5)'};background:${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 16%, transparent)' : 'none'};border:1px solid ${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : 'transparent'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n}</button>`;
            }).join('')}</div>`;

            // Warum ESPN fehlt (fuer Ticker und Messung)
            const espnGrund = !offen ? '' : es.fehler ? 'ESPN nicht erreichbar (' + fb.esc(es.fehler) + ')'
              : !es.geladen ? 'ESPN wird geladen …' : !e ? 'Spiel bei ESPN nicht gefunden'
              : fb.fehlerPfad[sumKey] ? 'ESPN-Spieldetails nicht abrufbar (' + fb.esc(fb.fehlerPfad[sumKey]) + ')'
              : !det ? 'ESPN-Spieldetails werden geladen …' : '';
            const teamName = x => x.seite === 'heim' ? m.heim : (x.seite === 'gast' ? m.gast : x.team);

            // ----- Ticker: Tore aus OpenLigaDB, alles andere aus ESPN, neueste oben -----
            const ticker = () => {
              const z = [];
              let ph = 0;
              (m.tore || []).forEach((x, i) => {
                const heimTor = x.h > ph; ph = x.h;
                z.push({ sort: (Number(x.min) || 0) * 100, i, typ: 'tor', min: x.min ? x.min + "'" : '',
                  titel: `${x.et ? 'Eigentor' : 'Tor'} · ${x.h}:${x.g} ${heimTor ? m.heim : m.gast}`,
                  d: (x.name || '') + (x.elf ? ' (Elfmeter)' : ''), q: 'OpenLigaDB', unser: FAV && (heimTor ? m.heim_id : m.gast_id) == FAV });
              });
              if (det) {
                const espnTore = det.ev.filter(x => x.typ === 'tor');
                espnTore.slice((m.tore || []).length).forEach(x => z.push({ sort: x.sort, i: 1000 + x.i, typ: 'tor', min: x.min,
                  titel: `${x.label}${teamName(x) ? ' · ' + teamName(x) : ''}`, d: x.namen.join(' · '), q: 'ESPN, bei OpenLigaDB noch nicht eingetragen',
                  unser: FAV && ((x.seite === 'heim' && m.heim_id == FAV) || (x.seite === 'gast' && m.gast_id == FAV)) }));
                det.ev.filter(x => x.typ !== 'tor').forEach(x => z.push({ sort: x.sort, i: 1000 + x.i, typ: x.typ, min: x.min,
                  titel: x.typ === 'phase' ? x.label : `${x.label}${teamName(x) ? ' · ' + teamName(x) : ''}`,
                  d: x.typ === 'phase' ? '' : (x.wechsel ? `${x.wechsel.ein} für ${x.wechsel.aus}` : x.namen.join(' · ')), q: 'ESPN' }));
              }
              z.sort((p, q) => q.sort - p.sort || q.i - p.i);
              const zeilen = z.map(x => {
                const c = FARBE[x.typ] || 'var(--owlet-text-sekundaer, #8794a5)';
                const bg = x.unser ? 'background:rgba(227,6,19,0.12);border:1px solid rgba(227,6,19,0.24);box-shadow:inset 3px 0 0 #e30613;'
                  : x.typ === 'tor' ? 'background:color-mix(in srgb, color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a)) 12%, transparent);border:1px solid color-mix(in srgb, color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a)) 24%, transparent);'
                  : x.typ === 'phase' ? 'border:1px dashed var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));' : 'background:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));';
                return `<div style="display:grid;grid-template-columns:40px 30px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border-radius:13px;${bg}">
                  <span style="font-size:12.5px;font-weight:800;color:var(--owlet-label, #b4c0cf);font-variant-numeric:tabular-nums;padding-top:6px;text-align:right;white-space:nowrap;">${fb.esc(x.min)}</span>
                  <span style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:${c};background:color-mix(in srgb, ${c} 16%, transparent);">${ICON[x.typ] || ICON.phase}</span>
                  <span style="min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--owlet-text, #f2f5f8);"><b style="font-weight:700;">${fb.esc(x.titel)}</b>${x.d ? `<span style="font-size:12.5px;color:var(--owlet-label, #b4c0cf);">${fb.esc(x.d)}</span>` : ''}<span style="font-size:10.5px;font-weight:600;color:var(--owlet-text-sekundaer, #8794a5);">${x.q}</span></span></div>`;
              }).join('');
              const leer = !z.length ? fb.hinweis(k === 'live' ? 'Noch keine Tore.' : 'Keine Tore.') : '';
              const fehlt = espnGrund || (det && !det.ev.length ? 'ESPN meldet für dieses Spiel keine Ereignisse' : '');
              return `<div style="display:flex;flex-direction:column;gap:6px;">${zeilen}${leer}${fehlt ? `<div style="border:1px dashed color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--owlet-dunkel-anteil, 100%), var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)));border-radius:13px;padding:10px 12px;font-size:12.5px;color:var(--owlet-text-sekundaer, #8794a5);">Karten, Wechsel und Spielphasen fehlen: ${fehlt}.</div>` : ''}</div>`;
            };

            // ----- Kommentar von ESPN, Sprache wie geliefert -----
            const kommentar = () => {
              const l = det.kom.slice().sort((p, q) => q.sort - p.sort || q.i - p.i).slice(0, 80);
              return `<div style="display:flex;flex-direction:column;gap:4px;">${fb.hinweis('Kommentar von ESPN in der gelieferten Sprache')}${l.map(x => `<div style="display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:12px;background:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));"><span style="font-size:12px;font-weight:800;color:var(--owlet-label, #b4c0cf);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;">${fb.esc(x.min)}</span><span style="font-size:12.5px;color:var(--owlet-text, #f2f5f8);min-width:0;">${fb.esc(x.text)}</span></div>`).join('')}</div>`;
            };

            // ----- Aufstellung: Spielfeld (Variante B) oder Liste (Variante A) -----
            const aufstellung = () => {
              const seiten = ['heim', 'gast'].filter(x => det.teams[x] && det.teams[x].spieler.length);
              let sw = fb.aufSeite;
              if (!seiten.includes(sw)) sw = FAV && m.gast_id == FAV && seiten.includes('gast') ? 'gast' : seiten[0];
              const T = det.teams[sw], unser = FAV && (sw === 'heim' ? m.heim_id : m.gast_id) == FAV;
              const MK = {
                tor: ['color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a))', '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m12 7.5 3.6 2.6-1.4 4.3H9.8l-1.4-4.3L12 7.5Z" fill="currentColor"/></svg>'],
                gelb: ['var(--owlet-amber, #e6b566)', '<svg viewBox="0 0 24 24" width="11" height="11"><rect x="7" y="3.5" width="10" height="17" rx="2" fill="currentColor"/></svg>'],
                rot: ['var(--owlet-rot, #f0736a)', '<svg viewBox="0 0 24 24" width="11" height="11"><rect x="7" y="3.5" width="10" height="17" rx="2" fill="currentColor"/></svg>'],
                aus: ['var(--owlet-text-sekundaer, #8794a5)', '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'],
                ein: ['var(--owlet-blau, #7fb3d5)', '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>']
              };
              const markenVon = p => det.marken.get(norm(p.name)) || [];
              const zeileSp = p => {
                const mk = markenVon(p).map(x => { const [c, ic] = MK[x.typ]; return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);">${ic}${fb.esc(x.text)}</span>`; }).join('');
                const kurzPos = (posTexte(p.pos)[0] || '').replace(/^sub$/i, '');
                return `<div style="display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));font-size:13px;color:var(--owlet-text, #f2f5f8);">
                  <span style="width:30px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;${unser ? 'background:rgba(227,6,19,0.16);border:1px solid rgba(227,6,19,0.24);color:color-mix(in srgb, #ff8a80 var(--owlet-dunkel-anteil, 100%), var(--owlet-rot, #f0736a));' : 'background:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));color:var(--owlet-label, #b4c0cf);'}">${fb.esc(p.nr)}</span>
                  <span style="min-width:0;display:flex;flex-direction:column;"><b style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fb.esc(p.name)}</b>${kurzPos ? `<small style="font-size:11px;color:var(--owlet-text-sekundaer, #8794a5);">${fb.esc(kurzPos)}</small>` : ''}</span>
                  <span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">${mk}</span></div>`;
              };
              const titel = t => `<div style="font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--owlet-text-sekundaer, #8794a5);padding:6px 2px 0;">${t}</div>`;
              const start = T.spieler.filter(p => p.start), bank = T.spieler.filter(p => !p.start);
              const nummer = p => { const n = Number(p.nr); return isFinite(n) && p.nr !== '' ? n : 999; };
              const gruppiert = start.length && start.every(p => gruppe(p.pos));
              const startHtml = gruppiert
                ? ['Tor', 'Abwehr', 'Mittelfeld', 'Angriff'].map(g => { const l = start.filter(p => gruppe(p.pos) === g).sort((a, b) => tiefe(a.pos) - tiefe(b.pos) || quer(a.pos) - quer(b.pos) || platz(a) - platz(b)); return l.length ? titel(g) + l.map(zeileSp).join('') : ''; }).join('')
                : titel('Startelf') + start.slice().sort((a, b) => platz(a) - platz(b)).map(zeileSp).join('');
              // Bank: Eingewechselte zuerst (nach Minute), dann nach Rueckennummer
              const einSort = p => { const x = markenVon(p).find(k => k.typ === 'ein'); return x ? x.sort : null; };
              const bankSortiert = bank.slice().sort((a, b) => {
                const ea = einSort(a), eb = einSort(b);
                if (ea != null || eb != null) return ea == null ? 1 : eb == null ? -1 : ea - eb;
                return nummer(a) - nummer(b);
              });
              // Spielfeld: Startelf in den Reihen der Formation, Anker ist die Mitte des Nummernkreises
              const pr = feldPruefung(T), feld = pr.ok && fb.aufAnsicht !== 'liste';
              const feldHtml = () => {
                const R = reihen(start), n = R.length;
                const punkte = R.map((reihe, ri) => {
                  const y = 86 - ri * (78 / (n - 1)), k = reihe.length, abst = k > 1 ? Math.min(30, 88 / k) : 0;
                  return reihe.map((p, i) => {
                    const mk = markenVon(p).filter(x => x.typ !== 'ein').map(x => { const [c, ic] = MK[x.typ]; return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;color:${c};background:linear-gradient(color-mix(in srgb, ${c} 12%, transparent),color-mix(in srgb, ${c} 12%, transparent)),var(--owlet-flaeche-vertieft, #10151d);border:1px solid color-mix(in srgb, ${c} 24%, transparent);">${ic.replace(/width="11" height="11"/, 'width="9" height="9"')}${fb.esc(x.text)}</span>`; }).join('');
                    return `<div style="position:absolute;left:${50 + (i - (k - 1) / 2) * abst}%;top:${y}%;width:${k > 1 ? abst : 30}%;transform:translate(-50%,-15px);display:flex;flex-direction:column;align-items:center;gap:2px;">
                      <span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;color:#f2f5f8;background:${unser ? '#e30613' : '#3a4453'};border:1.5px solid rgba(255,255,255,0.24);box-sizing:border-box;">${fb.esc(p.nr)}</span>
                      <span style="font-size:10.5px;font-weight:700;color:var(--owlet-text, #f2f5f8);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px color-mix(in srgb, rgba(0, 0, 0, 0.5) var(--owlet-dunkel-anteil, 100%), transparent);">${fb.esc(nachname(p))}</span>
                      ${mk ? `<span style="display:flex;gap:2px;flex-wrap:wrap;justify-content:center;">${mk}</span>` : ''}</div>`;
                  }).join('');
                }).join('');
                const linien = '<svg viewBox="0 0 68 86" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;"><g fill="none" style="stroke:color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent)" stroke-width="0.45"><rect x="1.5" y="1.5" width="65" height="83"/><path d="M24.85 1.5 A 9.15 9.15 0 0 0 43.15 1.5"/><rect x="13.85" y="68" width="40.3" height="16.5"/><rect x="24.85" y="81" width="18.3" height="3.5"/></g></svg>';
                // Wechsel dieses Vereins in zeitlicher Folge; Bank ohne die Eingewechselten
                const namen = new Set(T.spieler.map(p => p.name));
                const wl = det.ev.filter(x => x.typ === 'wechsel' && (x.seite ? x.seite === sw : x.namen.some(nn => namen.has(nn)))).sort((a, b) => a.sort - b.sort || a.i - b.i);
                const pfeil = (typ, t, c) => `<span style="display:flex;align-items:center;gap:5px;min-width:0;color:${c};"><span style="color:${MK[typ][0]};display:inline-flex;">${MK[typ][1]}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fb.esc(t)}</span></span>`;
                const wechselHtml = wl.map(x => `<div style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));font-size:12.5px;">
                    <span style="font-weight:800;color:var(--owlet-blau, #7fb3d5);font-variant-numeric:tabular-nums;white-space:nowrap;">${fb.esc(x.min)}</span>
                    <span style="display:flex;flex-direction:column;min-width:0;">${x.wechsel ? pfeil('ein', x.wechsel.ein, 'var(--owlet-text, #f2f5f8)') + pfeil('aus', x.wechsel.aus, 'var(--owlet-text-sekundaer, #8794a5)') : `<span style="color:var(--owlet-label, #b4c0cf);">${fb.esc(x.namen.join(' · '))}</span>`}</span></div>`).join('');
                const rest = bank.filter(p => !p.ein).sort((a, b) => nummer(a) - nummer(b));
                return `<div style="position:relative;width:100%;height:0;padding-bottom:126.5%;border-radius:16px;overflow:hidden;background:color-mix(in srgb, var(--owlet-gruen, #a6d49e) 12%, transparent);border:1px solid color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent);box-sizing:border-box;">${linien}${punkte}</div>
                  ${wl.length ? titel('Wechsel') + wechselHtml : ''}
                  ${rest.length ? titel('Bank') + `<div style="font-size:12.5px;color:var(--owlet-label, #b4c0cf);padding:0 2px;line-height:1.6;">${rest.map(p => `<b style="color:var(--owlet-text, #f2f5f8);font-variant-numeric:tabular-nums;">${fb.esc(p.nr)}</b> ${fb.esc(p.name)}`).join(' · ')}</div>` : ''}`;
              };
              const ansichtKnopf = !pr.ok ? '' : `<span style="display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));">${[['feld', 'Feld'], ['liste', 'Liste']].map(([id, n]) => {
                const an = (id === 'feld') === feld;
                return `<button type="button" aria-pressed="${an}" ${fb.tippAttr(`window.__fussball.zeigeAnsicht('${id}')`)} style="font:inherit;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;pointer-events:auto;color:${an ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-text-sekundaer, #8794a5)'};background:${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 16%, transparent)' : 'none'};border:1px solid ${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : 'transparent'};">${n}</button>`;
              }).join('')}</span>`;
              const wahl = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">${['heim', 'gast'].map(x => {
                const an = x === sw, n = x === 'heim' ? m.heim : m.gast, ok = seiten.includes(x);
                return `<button type="button" aria-pressed="${an}" ${ok ? fb.tippAttr(`window.__fussball.zeigeSeite('${x}')`) : 'disabled'} style="font:inherit;font-size:12.5px;font-weight:700;padding:8px 6px;border-radius:12px;cursor:${ok ? 'pointer' : 'default'};pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;color:${an ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-text-sekundaer, #8794a5)'};background:${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 16%, transparent)' : 'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))'};border:1px solid ${an ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : 'var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'};">${fb.wappen(x === 'heim' ? m.heim_logo : m.gast_logo, n, 18)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fb.esc(n)}</span></button>`;
              }).join('')}</div>`;
              return `<div style="display:flex;flex-direction:column;gap:6px;">
                ${wahl}
                ${T.formation ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--owlet-text-sekundaer, #8794a5);padding:4px 2px 0;min-height:30px;"><span>Formation <b style="font-size:13px;color:var(--owlet-text, #f2f5f8);font-variant-numeric:tabular-nums;margin-left:4px;">${fb.esc(T.formation)}</b></span>${ansichtKnopf}</div>` : ''}
                ${gruppiert && !pr.ok && pr.soll ? fb.hinweis(`Kein Spielfeld: Reihen ${pr.ist.join('·')} passen nicht zur Formation ${fb.esc(T.formation)}, deshalb die Liste.`) : ''}
                ${feld ? feldHtml() : startHtml + (bankSortiert.length ? titel('Bank') + bankSortiert.map(zeileSp).join('') : '')}
                ${!gruppiert && start.length ? fb.hinweis('Positionen nicht zuzuordnen, Startelf ungegliedert (siehe Messung).') : ''}
              </div>`;
            };

            // ----- Statistik -----
            const statistik = () => {
              const hf = m.heim_id == FAV ? '#e30613' : 'var(--owlet-blau, #7fb3d5)';
              return `<div style="display:flex;flex-direction:column;gap:10px;padding:4px 2px;">${statZeilen.map(([n, label, einheit]) => {
                const x = det.stat[n], h = parseFloat(x.heim), g = parseFloat(x.gast);
                const w = v => isFinite(v) ? (einheit === '%' ? Math.round(v) + ' %' : fb.esc(String(Math.round(v * 10) / 10))) : fb.esc(String(v));
                const sum = (isFinite(h) ? h : 0) + (isFinite(g) ? g : 0);
                return `<div style="display:flex;flex-direction:column;gap:5px;">
                  <div style="display:grid;grid-template-columns:52px minmax(0,1fr) 52px;font-size:13px;font-weight:700;color:var(--owlet-text, #f2f5f8);font-variant-numeric:tabular-nums;"><span>${w(h)}</span><span style="text-align:center;font-size:11.5px;font-weight:600;color:var(--owlet-text-sekundaer, #8794a5);">${label}</span><span style="text-align:right;">${w(g)}</span></div>
                  ${sum > 0 ? `<div style="display:grid;grid-template-columns:${h / sum}fr ${g / sum}fr;gap:3px;height:6px;"><i style="border-radius:3px;background:${hf};"></i><i style="border-radius:3px;background:var(--owlet-text-sekundaer, #8794a5);"></i></div>` : ''}</div>`;
              }).join('')}</div>`;
            };

            // ----- Messung -----
            const messung = () => {
              const roh = fb.rohSpiel(s.L, sp.nr, m.id) || {}, tore = Array.isArray(roh.goals) ? roh.goals : [];
              const sumFehler = fb.fehlerPfad[sumKey] || '';
              const probe = x => x ? kurz((x.kom[0] && x.kom[0].text) || (x.ev[0] && x.ev[0].text) || '', 160) : '';
              const gesehen = Object.entries(fb.gesehen).filter(([kk]) => kk.startsWith(m.id + ':')).map(([kk, v]) => {
                const [, h, g] = kk.split(':'), d = v.oldb && v.espn ? Math.round((v.oldb - v.espn) / 1000) : null;
                return { stand: h + ':' + g, oldb: v.oldb ? uhrzeit(v.oldb) : '', espn: v.espn ? uhrzeit(v.espn) : '', espn_frueher_s: d };
              });
              const w = fb.messwerte = {
                version: VERSION, gemessen: new Date().toISOString(),
                spiel: { liga: s.L, oldb_id: m.id, heim: m.heim, gast: m.gast, anstoss: m.anstoss, status: k },
                oldb: {
                  // Stand laut OpenLigaDB selbst, nicht der ggf. von ESPN uebernommene Kopf-Stand
                  stand: m.th == null ? (k === 'live' ? '0:0' : null) : `${m.th}:${m.tg}`, tore: tore.length,
                  tore_ohne_minute: tore.filter(x => x.matchMinute == null).length,
                  tore_mit_kommentar: tore.filter(x => x.comment).length,
                  kommentar_beispiel: kurz((tore.find(x => x.comment) || {}).comment || '', 120),
                  letzte_aenderung: roh.lastUpdateDateTime || null, felder_spiel: Object.keys(roh), fehler: fb.fehler || null
                },
                espn_scoreboard: {
                  pfad: es.pfad, geladen: es.geladen, fehler: es.fehler || null, event_id: e ? e.id : null,
                  name: e ? e.roh.name || e.roh.shortName || null : null, status: e ? e.status : null, uhr: e ? e.uhr : null,
                  stand: e ? `${e.sh}:${e.sg}` : null,
                  details: e ? zaehle((e.roh.competitions?.[0]?.details || []).map(x => x.type?.text || '?')) : null,
                  link: e ? fb.espnLink(e) || null : null
                },
                espn_summary: {
                  pfad: sumPfad || null, geladen: !!fb.cache[sumKey], fehler: sumFehler || null,
                  schluessel: det ? det.keys : null,
                  ereignisse: det ? det.ev.length : null, ereignistypen: det ? zaehle(det.ev.map(x => x.typText || '?')) : null,
                  ereignisse_ohne_zuordnung: det ? det.ev.filter(x => x.typ === 'sonst').map(x => x.typText) : null,
                  ereignisse_ohne_team: det ? det.ev.filter(x => x.typ !== 'phase' && !x.seite).length : null,
                  kommentar: det ? det.kom.length : null, kommentar_eigen: det ? det.komEigen : null, kommentar_beispiel: det ? probe({ kom: det.kom, ev: [] }) : null,
                  ereignis_beispiel: det && det.ev[0] ? kurz(det.ev[0].text, 160) : null,
                  statistik: det ? Object.keys(det.stat) : null, statistik_beide_seiten: statZeilen.map(x => x[0]),
                  aufstellung: det ? det.aufst : null, heim_id: det ? det.heimId : null, gast_id: det ? det.gastId : null,
                  // Inhalt von jersey, position und formationPlace: drei Beispiele der Startelf je Verein
                  aufstellung_beispiel: det ? Object.entries(det.teams).map(([x, T]) => ({ seite: x, spieler: T.spieler.filter(p => p.start).slice(0, 3).map(p => ({ nr: p.nr, name: p.name, position: p.pos, formationPlace: p.platz })) })) : null,
                  positionen: det ? Object.entries(det.teams).map(([x, T]) => { const st = T.spieler.filter(p => p.start); return { seite: x, kuerzel: st.map(p => posTexte(p.pos)[0] || '?'), formationPlace: st.map(p => p.platz), ohne_gruppe: st.filter(p => !gruppe(p.pos)).length }; }) : null,
                  ereignis_namen_in_aufstellung: det ? `${det.namenGefunden}/${det.namenGesamt}` : null,
                  wechsel_beispiel: det ? det.wechsel : null, aufstellung_felder: det ? det.rosterFelder : null,
                  athlet_felder: det ? det.athletFelder : null, namen_beispiel: det ? det.namenBeispiel : null,
                  eingewechselt: det ? det.eingewechselt : null, ausgewechselt: det ? det.ausgewechselt : null,
                  wechsel: det ? det.ev.filter(x => x.typ === 'wechsel').length : null,
                  wechsel_mit_richtung: det ? det.ev.filter(x => x.typ === 'wechsel' && x.wechsel).length : null,
                  // Spielfeld: berechnete Reihen (mit Torwartreihe) gegen die Formation
                  spielfeld: det ? Object.entries(det.teams).map(([x, T]) => { const r = feldPruefung(T); return { seite: x, formation: T.formation, reihen: r.ist, feld: r.ok }; }) : null
                },
                zuerst_gesehen: gesehen
              };
              // Ampel je Zeile: gruen geliefert, amber leer oder abweichend, rot Fehler, grau offen
              const farbe = { ok: 'var(--owlet-gruen, #a6d49e)', leer: 'var(--owlet-amber, #e6b566)', fehler: 'var(--owlet-rot, #f0736a)', offen: 'var(--owlet-text-sekundaer, #8794a5)' };
              const zeile = (st, t, v) => `<div style="display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:start;padding:6px 2px;border-top:1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05));"><span style="width:8px;height:8px;border-radius:50%;margin-top:6px;background:${farbe[st]};"></span><span style="min-width:0;font-size:12.5px;color:var(--owlet-text, #f2f5f8);"><b style="font-weight:700;">${t}</b><span style="display:block;color:var(--owlet-label, #b4c0cf);overflow-wrap:anywhere;">${v}</span></span></div>`;
              const titel = t => `<div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--owlet-text-sekundaer, #8794a5);padding-top:8px;">${t}</div>`;
              const liste = o => o && Object.keys(o).length ? Object.entries(o).map(([n, z]) => `${fb.esc(n)} ${z}`).join(' · ') : '–';
              const S = w.espn_summary, B = w.espn_scoreboard, O = w.oldb;
              const nichtOffen = !offen ? zeile('offen', 'Popup geschlossen', 'ESPN wird nur bei offenem Popup abgerufen.') : '';
              const sbZeile = B.fehler ? zeile('fehler', 'Abruf', fb.esc(B.fehler))
                : !B.geladen ? zeile('offen', 'Abruf', 'läuft …')
                : !e ? zeile('leer', 'Zuordnung', 'kein ESPN-Spiel mit Anstoß ±10 min und passenden Vereinsnamen')
                : zeile('ok', 'Spiel', `${fb.esc(B.name || '')} · Event ${fb.esc(B.event_id)} · ${fb.esc(B.status)}${B.uhr ? ' · ' + fb.esc(B.uhr) : ''}`);
              const standZeile = e ? zeile(O.stand === B.stand ? 'ok' : 'leer', 'Stand ESPN / OpenLigaDB', `${fb.esc(B.stand)} / ${fb.esc(O.stand ?? '–')}`) : '';
              const sumZeilen = !e ? zeile('offen', 'Abruf', 'wartet auf die Event-ID') : S.fehler
                ? zeile('fehler', 'Abruf', fb.esc(S.fehler) + (/TypeError/.test(S.fehler) ? ' – ohne HTTP-Status: Netzwerk oder CORS' : ''))
                : !det ? zeile('offen', 'Abruf', 'läuft …')
                : [zeile('ok', 'Abruf', 'ok · Schlüssel: ' + fb.esc(S.schluessel.join(', '))),
                  zeile(S.ereignisse ? 'ok' : 'leer', `Ereignisse (keyEvents): ${S.ereignisse}`, liste(S.ereignistypen) + (S.ereignisse_ohne_zuordnung.length ? ' · ohne deutsche Beschriftung: ' + fb.esc(S.ereignisse_ohne_zuordnung.join(', ')) : '') + (S.ereignisse_ohne_team ? ` · ${S.ereignisse_ohne_team} ohne Vereinszuordnung` : '')),
                  zeile(S.kommentar_eigen ? 'ok' : 'leer', `Kommentar: ${S.kommentar}, davon ${S.kommentar_eigen} ohne passendes Ereignis`, fb.esc(S.kommentar_beispiel || '–') + (S.kommentar && !S.kommentar_eigen ? ' · nur Wiederholung der Ereignisse, Reiter ausgeblendet' : '')),
                  zeile(S.wechsel && S.wechsel_mit_richtung === S.wechsel ? 'ok' : 'leer', `Wechsel: ${S.wechsel}, davon ${S.wechsel_mit_richtung} mit Richtung`, 'Richtung aus subbedIn/subbedOut der Aufstellung'),
                  zeile(S.wechsel_beispiel ? 'ok' : 'leer', 'Wechsel (Rohdaten)', S.wechsel_beispiel ? fb.esc(S.wechsel_beispiel.text) + ' · ' + S.wechsel_beispiel.teilnehmer.map(x => `${fb.esc(x.name)} [${fb.esc(x.felder.join(', '))}]`).join(' · ') + ` · Aufstellung: ${S.eingewechselt} eingewechselt, ${S.ausgewechselt} ausgewechselt` : '–'),
                  zeile(statZeilen.length ? 'ok' : 'leer', `Statistik: ${S.statistik.length} Werte`, fb.esc(S.statistik.join(', ') || '–') + (S.statistik.length && !statZeilen.length ? ' · keinem Verein zuzuordnen' : '')),
                  zeile(S.positionen.length && S.positionen.every(x => !x.ohne_gruppe) ? 'ok' : 'leer', 'Positionen der Startelf', S.positionen.length ? S.positionen.map(x => `${x.seite}: ${fb.esc(x.kuerzel.join(', '))}${x.ohne_gruppe ? ` · ${x.ohne_gruppe} ohne Gruppe` : ''} · formationPlace ${fb.esc(x.formationPlace.join(', '))}`).join(' · ') : '–'),
                  zeile(S.athlet_felder.length ? 'ok' : 'leer', 'Namensfelder (athlete)', fb.esc(S.athlet_felder.join(', ') || '–') + (S.namen_beispiel.length ? ' · ' + S.namen_beispiel.map(x => fb.esc(Object.entries(x).map(([k, v]) => `${k}: ${v}`).join(', '))).join(' | ') : '')),
                  zeile(S.spielfeld.length && S.spielfeld.every(x => x.feld) ? 'ok' : 'leer', 'Spielfeld', S.spielfeld.length ? S.spielfeld.map(x => `${x.seite}: ${fb.esc(x.formation || '–')} · Reihen ${x.reihen.join('·')} · ${x.feld ? 'Feld' : 'Liste'}`).join(' · ') : '–'),
                  zeile(det.namenGesamt && det.namenGefunden === det.namenGesamt ? 'ok' : 'leer', `Ereignis-Namen in der Aufstellung: ${S.ereignis_namen_in_aufstellung}`, 'Tore, Karten und Wechsel, die einem Spieler zugeordnet werden konnten'),
                  zeile(S.aufstellung.some(x => x.n) ? 'ok' : 'leer', 'Aufstellung', S.aufstellung.length ? S.aufstellung.map(x => `${x.seite || '?'}: ${x.n} Spieler, ${x.start} Startelf${x.formation ? ', ' + fb.esc(x.formation) : ''}`).join(' · ') : '–')].join('');
              const gesZeilen = gesehen.length ? gesehen.map(x => zeile(x.oldb && x.espn ? 'ok' : 'offen', 'Stand ' + x.stand,
                `OpenLigaDB ${x.oldb || '–'} · ESPN ${x.espn || '–'}${x.espn_frueher_s != null ? ` · ESPN ${Math.abs(x.espn_frueher_s)} s ${x.espn_frueher_s >= 0 ? 'früher' : 'später'}` : ''}`)).join('')
                : zeile('offen', 'Noch kein Tor gesehen', 'Gezählt wird nur ein Tor, das fällt, während die View offen ist.');
              const knopf = `<button type="button" ${fb.tippAttr('window.__fussball.kopiere()')} style="font:inherit;font-size:12.5px;font-weight:700;color:var(--owlet-blau, #7fb3d5);background:color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent);border:1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent);border-radius:12px;padding:8px 12px;cursor:pointer;pointer-events:auto;">Messung kopieren</button>`;
              const kopiert = fb.kopiert === 'ok' ? '<span style="font-size:12px;font-weight:700;color:var(--owlet-gruen, #a6d49e);">kopiert</span>'
                : fb.kopiert === 'nein' ? '<span style="font-size:12px;color:var(--owlet-amber, #e6b566);">Zwischenablage gesperrt – Text unten markieren</span>' : '';
              return `<div style="display:flex;flex-direction:column;">
                ${nichtOffen}
                ${titel('OpenLigaDB')}
                ${zeile(O.fehler ? 'fehler' : 'ok', 'Spiel ' + m.id, `${O.tore} ${O.tore === 1 ? 'Tor' : 'Tore'} · ${O.tore_ohne_minute} ohne Minute · ${O.tore_mit_kommentar} mit Kommentar${O.kommentar_beispiel ? ' („' + fb.esc(O.kommentar_beispiel) + '“)' : ''}${O.letzte_aenderung ? ' · letzte Änderung ' + fb.esc(O.letzte_aenderung) : ''}`)}
                ${titel('ESPN Scoreboard')}
                ${sbZeile}${standZeile}
                ${e ? zeile(B.details && Object.keys(B.details).length ? 'ok' : 'leer', 'Ereignisse im Scoreboard', liste(B.details)) : ''}
                ${titel('ESPN Spieldetails')}
                ${sumZeilen}
                ${titel('Zuerst gesehen')}
                ${gesZeilen}
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;">${knopf}${kopiert}</div>
                <pre style="margin:10px 0 0;max-height:220px;overflow:auto;padding:10px;border-radius:12px;background:var(--owlet-flaeche-vertieft, #10151d);border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));color:var(--owlet-label, #b4c0cf);font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;">${fb.esc(JSON.stringify(w, null, 2))}</pre>
              </div>`;
            };

            const inhalt = tab === 'aufstellung' ? aufstellung() : tab === 'kommentar' ? kommentar() : tab === 'statistik' ? statistik() : tab === 'messung' ? messung() : ticker();
            const link = e ? fb.espnLink(e) : '';
            const cO = fb.cache[`getmatchdata/${s.L}/${fb.saison()}/${sp.nr}`], cE = fb.cache[sumKey];
            const fuss = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));font-size:11.5px;color:var(--owlet-text-sekundaer, #8794a5);">
                <span>Stand${cO ? ' OpenLigaDB ' + fb.zeit(new Date(cO.t)) : ''}${cE ? ' · ESPN ' + fb.zeit(new Date(cE.t)) : ''}</span>
                <span style="display:flex;gap:6px;flex-wrap:wrap;">
                  <button type="button" aria-pressed="${tab === 'messung'}" ${fb.tippAttr(`window.__fussball.zeige('${tab === 'messung' ? 'ticker' : 'messung'}')`)} style="font:inherit;font-size:12px;font-weight:700;color:${tab === 'messung' ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-label, #b4c0cf)'};padding:6px 10px;border-radius:10px;cursor:pointer;pointer-events:auto;background:${tab === 'messung' ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 16%, transparent)' : 'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))'};border:1px solid ${tab === 'messung' ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : 'var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'};">${tab === 'messung' ? 'Messung schließen' : 'Messung'}</button>
                  ${link ? `<a href="${fb.esc(link)}" target="_blank" rel="noopener" ${fb.tippAttr('window.open(this.href)')} style="font-size:12px;font-weight:700;color:var(--owlet-blau, #7fb3d5);text-decoration:none;padding:6px 10px;border-radius:10px;background:color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent);border:1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent);pointer-events:auto;">Spiel bei ESPN</a>` : ''}
                </span>
              </div>`;
            return huelle(kopf(`${s.L === 'bl1' ? '1.' : '2.'} Bundesliga · ${sp.nr}. Spieltag · ${fb.tag(a)} ${fb.zeit(a)}`) + stand + reiterHtml + inhalt + fuss);
          };
          // Bereich einer Karte, der nach jedem Abruf und alle 30 s neu gezeichnet wird
          fb.bereich = (el, key, render) => {
            if (el) {
              if (!fb.subs.has(el)) fb.subs.set(el, { r: new Map(), t: Date.now() });
