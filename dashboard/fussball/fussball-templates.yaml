            const img = url ? `<img src="${fb.esc(url)}" alt="" loading="lazy" style="position:absolute;inset:${Math.round(px * 0.08)}px;width:${Math.round(px * 0.84)}px;height:${Math.round(px * 0.84)}px;object-fit:contain;" onload="this.previousElementSibling.style.visibility='hidden';this.parentNode.style.background='none'" onerror="this.remove()">` : '';
            return `<span style="position:relative;flex:0 0 auto;width:${px}px;height:${px}px;border-radius:50%;background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));display:inline-grid;place-items:center;"><span style="font-size:${Math.round(px * 0.33)}px;font-weight:800;color:var(--owlet-text-sekundaer, #8794a5);">${ini}</span>${img}</span>`;
          };
