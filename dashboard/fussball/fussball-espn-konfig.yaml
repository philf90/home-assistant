# ============================================================================
# Fussball – ESPN-Abruf fuer die Meldungen
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       fussball
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
# Platzhalter:   keine
# ============================================================================
# Die Fussball-Karten holen ihre Daten im Browser (siehe
# fussball-templates.yaml); in Home Assistant entstehen dadurch keine
# Entitaeten. Fuer die Meldungen zum Lieblingsverein ruft Home Assistant die
# inoffizielle ESPN-API deshalb selbst ab. Dieses Paket stellt dafuer nur den
# Abruf bereit; was abgefragt und gemeldet wird, steht in Skript und
# Automation in fussball-meldungen-konfig.yaml.
#
#   rest_command.espn_fussball
#     pfad: Rest der URL nach .../sports/soccer/, z. B.
#           ger.2/scoreboard?dates=20261017   Spiele eines Tages
#           ger.2/summary?event=<id>          Spieldetails (keyEvents)
#     Antwort per response_variable: status, content (JSON), headers
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages:
#       fussball_espn: !include fussball-espn-konfig.yaml
# Danach die Aktion rest_command.reload ausfuehren (laedt configuration.yaml
# samt Paketen neu) oder Home Assistant neu starten.
#
# Kein Schluessel noetig. Die API ist nicht dokumentiert und kann sich
# aendern; die Automation meldet dann nichts, die Karten laufen weiter.

rest_command:
  espn_fussball:
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/{{ pfad }}"
    method: get
    headers:
      Accept: application/json
    timeout: 20
