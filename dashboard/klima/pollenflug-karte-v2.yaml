# ============================================================================
# Pollenflug v2 – Pollenkachel mit eigenem Kopf
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card
# Templates:     nachtblau_pollen_kachel (warnlage-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Loest pollenflug-karte.yaml ab (Detailkarte, jede Art mit dem heutigen
# Stand). Seit 14.11.2026 steht auf Home dieselbe Kachel wie in "Warnlage &
# Pollen" der Wetter-View (Entwurf home-pollen.html, Variante B):
#
#   Kopf     Icon-Kachel, "Pollenflug", "Tippen fuer Details"
#   Kachel   hoechste Stufe von heute als Pille, alle belasteten Arten,
#            Szenen je Art im Wechsel, Verlauf heute/morgen/uebermorgen
#
# Sichtbar, solange heute oder morgen eine Art belastet ist; ist erst morgen
# eine belastet, zeigt die Kachel die Vorschau "Ab morgen ...". Sonst blendet
# sich die Karte aus. Tippen oeffnet das Popup "Pollenflug" mit allen Arten
# und den DWD-Texten, langes Druecken die more-info.
#
# Andere Region: Eintraege unter variables.pollen und triggers_update im
# Template anpassen (hier DWD-Region 101).
# Voraussetzung: custom:button-card und browser_mod (HACS), Integration DWD
# Pollenflug (HACS), Templates aus warnlage-templates.yaml.
type: custom:button-card
template: nachtblau_pollen_kachel
variables:
  kopf: true
