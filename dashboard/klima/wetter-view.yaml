# ============================================================================
# Wetter – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card, card-mod, decluttering-card, weather-forecast-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                owlet_dwd_popup (warnlage-templates.yaml),
#                owlet_pollen_popup (warnlage-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   sensor.warnregion_*, weather.wohnort
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Wetter – komplette Ansicht (View) im Owlet-Stil
#
# Vorher stand hier nur die Wetter- und die Wind-Karte; Warnungen und Pollen
# gab es nur auf Home, die Vorhersage nur im Test-View. Die View fasst jetzt
# alles zusammen, was die Instanz zum Wetter liefert.
#
#   Section 1  Top-Navigation · Wetter (wetter-karte-v2.yaml: Bedingung,
#              sechs Kacheln, 7-Tage-Vorhersage, Wetter- und
#              Windanimation)
#   Section 2  Niederschlag & Temperatur (Diagramm, 7 Tage) ·
#              Warnlage & Pollen · DWD-Warnung (meteoalarm-karte.yaml) ·
#              Pollenflug (pollenflug-karte.yaml)
#   Section 3  schwebende Navbar
#
# Warnlage & Pollen steht immer da: zwei Kacheln mit der DWD-Warnstufe bzw.
# Vorabinformation und der hoechsten Pollenbelastung. Tippen oeffnet das
# jeweilige Popup (owlet_dwd_popup, owlet_pollen_popup aus
# warnlage-templates.yaml), langes Druecken die more-info. Die beiden
# Detailkarten darunter blenden sich weiter selbst aus, solange keine
# Warnung bzw. keine Belastung vorliegt. Farben: Pollen wie
# pollenflug-karte.yaml (gering gruen, mittel amber, hoch rot), Warnung
# amber, ab Stufe 3 rot, keine Warnung gruen; die Icon-Kachel im Kopf folgt
# der Warnlage.
#
# Das Diagramm (weather-forecast-card) bekommt die Owlet-Huelle ueber
# card-mod am vertical-stack (wie energie-monatsbilanz-karte.yaml). Die
# Temperaturlinie ist einfarbig (use_color_thresholds: false), weil die
# Schwellenfarben der Karte nicht aus der Palette stammen.
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include dashboard/klima/wetter-view.yaml
#   Die Includes unten sind relativ zu dieser Datei: wetter-karte-v2.yaml,
#   meteoalarm-karte.yaml und pollenflug-karte.yaml im selben Ordner ablegen.
#
# Voraussetzung: custom:button-card + custom:decluttering-card + card-mod
#                + Weather Forecast Card (troinine/ha-weather-forecast-card)
#                + browser_mod (alle via HACS), Integrationen
#                DWD-Wetterwarnungen (dwd_weather_warnings) und DWD
#                Pollenflug (HACS, Region 101), Templates aus
#                navigation-templates.yaml, wetter-templates.yaml und
#                warnlage-templates.yaml.
title: Wetter
path: wetter
icon: flat-ui:weather
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: top_navigation
      - !include wetter-karte-v2.yaml
  - type: grid
    cards:
      # =================== NIEDERSCHLAG & TEMPERATUR ===================
      - type: vertical-stack
        card_mod:
          style: &huelle |
            #root {
              background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
              border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
              border-radius: 22px !important;
              box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
              padding: 16px 18px !important;
              gap: 6px !important;
            }
        cards:
          - type: custom:button-card
            icon: mdi:weather-pouring
            name: Niederschlag & Temperatur
            label: 7 Tage · Vorhersage
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            tap_action:
              action: none
            variables:
              accent: 'var(--owlet-blau, #7fb3d5)'
            styles: &kopf
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 2px 2px 8px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: min-content 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 44px
                - height: 44px
                - border-radius: 13px
                - margin-right: 14px
                - align-self: center
                - background: '[[[ return `color-mix(in srgb, ${variables.accent} 16%, transparent)`; ]]]'
                - border: '[[[ return `1px solid color-mix(in srgb, ${variables.accent} 24%, transparent)`; ]]]'
              icon:
                - width: 23px
                - height: 23px
                - color: '[[[ return variables.accent; ]]]'
                - --ha-icon-display: block
              name:
                - justify-self: start
                - align-self: end
                - font-size: 17px
                - font-weight: 700
                - letter-spacing: -0.02em
                - color: 'var(--owlet-text, #f2f5f8)'
              label:
                - justify-self: start
                - align-self: start
                - font-size: 12.5px
                - margin-top: 2px
                - color: 'var(--owlet-text-sekundaer, #8794a5)'
          - type: custom:weather-forecast-card
            entity: weather.wohnort
            show_current: false
            show_forecast: true
            default_forecast: daily
            forecast_types: daily
            forecast:
              mode: chart
              daily_slots: 7
              default_chart_attribute: temperature_and_precipitation
              use_color_thresholds: false
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                  margin: 0 !important;
                }
      # =================== WARNLAGE & POLLEN ===================
      - type: vertical-stack
        card_mod:
          style: *huelle
        cards:
          - type: custom:button-card
            icon: '[[[ return variables.warnstufe > 0 || variables.vorwarnstufe > 0 ? "mdi:alert-outline" : "mdi:shield-check-outline"; ]]]'
            name: Warnlage & Pollen
            label: Tippen für Details
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            tap_action:
              action: none
            triggers_update:
              - sensor.warnregion_aktuelle_warnstufe
              - sensor.warnregion_vorwarnstufe
            variables:
              warnstufe: '[[[ return parseInt(states["sensor.warnregion_aktuelle_warnstufe"]?.state) || 0; ]]]'
              vorwarnstufe: '[[[ return parseInt(states["sensor.warnregion_vorwarnstufe"]?.state) || 0; ]]]'
              accent: |
                [[[
                  if (variables.warnstufe >= 3) return 'var(--owlet-rot, #f0736a)';
                  if (variables.warnstufe > 0 || variables.vorwarnstufe > 0) return 'var(--owlet-amber, #e6b566)';
                  return 'var(--owlet-gruen, #a6d49e)';
                ]]]
            styles: *kopf
          - type: grid
            columns: 2
            square: false
            cards:
              # ---- DWD: aktuelle Warnstufe vor Vorabinformation ----
              - type: custom:button-card
                template: owlet_dwd_popup
                entity: sensor.warnregion_aktuelle_warnstufe
                triggers_update:
                  - sensor.warnregion_aktuelle_warnstufe
                  - sensor.warnregion_vorwarnstufe
                show_name: false
                show_state: false
                show_icon: false
                show_label: false
                styles: &kachel
                  card:
                    - padding: 0
                    - background: none
                    - border: none
                    - box-shadow: none
                    - overflow: visible
                  grid:
                    - grid-template-areas: '"body"'
                    - grid-template-columns: minmax(0, 1fr)
                  custom_fields:
                    body:
                      - width: 100%
                      - min-width: 0
                custom_fields:
                  body: |
                    [[[
                      const green = 'var(--owlet-gruen, #a6d49e)', amber = 'var(--owlet-amber, #e6b566)', red = 'var(--owlet-rot, #f0736a)';
                      const value = 'var(--owlet-text, #f2f5f8)', muted = 'var(--owlet-text-sekundaer, #8794a5)';
                      const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
                      const svg = (inner, c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:${c};width:22px;height:22px;">${inner}</svg>`;
                      const iSchild = (c) => svg('<path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6Z"/><path d="m9 12 2 2 4-4"/>', c);
                      const iWarn = (c) => svg('<path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor" stroke="none"/>', c);
                      const s = states['sensor.warnregion_aktuelle_warnstufe'];
                      const v = states['sensor.warnregion_vorwarnstufe'];
                      const w = s ? parseInt(s.state) : NaN, vw = v ? parseInt(v.state) : NaN;
                      const name1 = (x) => x && x.attributes ? (x.attributes.warning_1_name || (x.attributes.warning_1 || {}).event || '') : '';
                      const anzahl = s && s.attributes ? (parseInt(s.attributes.warning_count) || 0) : 0;
                      // DWD schreibt Schluesselwoerter gross ("SCHWERES GEWITTER mit ORKANBOEN") -> "Schweres Gewitter mit Orkanboen"
                      const cap = (t) => String(t || '').split(' ').map((x) => (x.length > 1 && x === x.toUpperCase() && /[A-ZÄÖÜ]/.test(x)) ? x.charAt(0) + x.slice(1).toLowerCase() : x).join(' ');
                      let k;
                      if (isNaN(w)) k = [iWarn, 'Keine Daten', 'DWD-Warnung', muted];
                      else if (w > 0) k = [iWarn, `Warnung Stufe ${w}`, (cap(name1(s)) || 'DWD-Warnung') + (anzahl > 1 ? ` · +${anzahl - 1} weitere` : ''), w >= 3 ? red : amber];
                      else if (vw > 0) k = [iWarn, `Vorabinfo Stufe ${vw}`, cap(name1(v)) || 'DWD-Vorabinformation', amber];
                      else k = [iSchild, 'Keine Warnung', 'DWD-Wetterwarnung', green];
                      const [icon, wert, text, c] = k;
                      return `
                        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:${tint(c, 12)};border:1px solid ${tint(c, 24)};min-width:0;cursor:pointer;">
                          <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${tint(c, 16)};border:1px solid ${tint(c, 24)};">${icon(c)}</div>
                          <div style="min-width:0;text-align:left;">
                            <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;color:${value};line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${wert}</div>
                            <div style="font-size:12px;color:${muted};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${text}</div>
                          </div>
                        </div>`;
                    ]]]
              # ---- Pollen: hoechste Belastung heute, Stufen wie pollenflug-karte.yaml ----
              - type: custom:button-card
                template: owlet_pollen_popup
                entity: sensor.pollenflug_graeser_101
                triggers_update:
                  - sensor.pollenflug_graeser_101
                  - sensor.pollenflug_ambrosia_101
                  - sensor.pollenflug_beifuss_101
                  - sensor.pollenflug_birke_101
                  - sensor.pollenflug_erle_101
                  - sensor.pollenflug_esche_101
                  - sensor.pollenflug_hasel_101
                  - sensor.pollenflug_roggen_101
                show_name: false
                show_state: false
                show_icon: false
                show_label: false
                variables:
                  pollen:
                    - {name: Gräser, entity: sensor.pollenflug_graeser_101}
                    - {name: Ambrosia, entity: sensor.pollenflug_ambrosia_101}
                    - {name: Beifuß, entity: sensor.pollenflug_beifuss_101}
                    - {name: Birke, entity: sensor.pollenflug_birke_101}
                    - {name: Erle, entity: sensor.pollenflug_erle_101}
                    - {name: Esche, entity: sensor.pollenflug_esche_101}
                    - {name: Hasel, entity: sensor.pollenflug_hasel_101}
                    - {name: Roggen, entity: sensor.pollenflug_roggen_101}
                styles: *kachel
                custom_fields:
                  body: |
                    [[[
                      const green = 'var(--owlet-gruen, #a6d49e)', amber = 'var(--owlet-amber, #e6b566)', red = 'var(--owlet-rot, #f0736a)';
                      const value = 'var(--owlet-text, #f2f5f8)', muted = 'var(--owlet-text-sekundaer, #8794a5)';
                      const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
                      const icon = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:${c};width:22px;height:22px;"><circle cx="12" cy="14" r="2.1"/><circle cx="12" cy="9.4" r="2.1"/><circle cx="15.9" cy="11.7" r="2.1"/><circle cx="14.6" cy="16.3" r="2.1"/><circle cx="9.4" cy="16.3" r="2.1"/><circle cx="8.1" cy="11.7" r="2.1"/></svg>`;
                      const liste = variables.pollen || [];
                      let top = null, aktiv = 0, morgen = 0;
                      liste.forEach((p) => {
                        const s = states[p.entity];
                        const v = s ? parseFloat(s.state) : NaN;
                        const m = s && s.attributes ? parseFloat(s.attributes.state_tomorrow) : NaN;
                        if (!isNaN(m) && m > morgen) morgen = m;
                        if (isNaN(v) || v <= 0) return;
                        aktiv++;
                        if (!top || v > top.v) top = { name: p.name, v: v };
                      });
                      let wert, text, c;
                      if (!top) {
                        wert = 'Keine Belastung';
                        text = morgen > 0 ? 'Morgen beginnt Pollenflug' : `Pollenflug · ${liste.length} Arten`;
                        c = morgen > 0 ? amber : green;
                      } else {
                        const n = parseInt(top.v);
                        const st = n <= 1 ? ['Gering', green] : n <= 2 ? ['Mittel', amber] : ['Hoch', red];
                        wert = `${st[0]} · ${top.name}`;
                        text = aktiv > 1 ? `${aktiv} Arten mit Belastung` : 'Pollenflug heute';
                        c = st[1];
                      }
                      return `
                        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:${tint(c, 12)};border:1px solid ${tint(c, 24)};min-width:0;cursor:pointer;">
                          <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${tint(c, 16)};border:1px solid ${tint(c, 24)};">${icon(c)}</div>
                          <div style="min-width:0;text-align:left;">
                            <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;color:${value};line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${wert}</div>
                            <div style="font-size:12px;color:${muted};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${text}</div>
                          </div>
                        </div>`;
                    ]]]
      - !include meteoalarm-karte.yaml
      - !include pollenflug-karte.yaml
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: floating_navbar
