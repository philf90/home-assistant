# ============================================================================
# Wetter – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card, card-mod, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                nachtblau_dwd_popup (warnlage-templates.yaml),
#                nachtblau_pollen_kachel (warnlage-templates.yaml),
#                nachtblau_wisch (warnlage-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   sensor.warnregion_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Wetter – komplette Ansicht (View) im Nachtblau-Stil
#
# Vorher stand hier nur die Wetter- und die Wind-Karte; Warnungen und Pollen
# gab es nur auf Home. Die View zeigt jetzt Messwerte der Station, Warnlage
# und Pollen in einer Spalte, ohne Vorhersage-Diagramm.
#
#   Section 1  Top-Navigation · Wetter (wetter-karte-v2.yaml: Bedingung,
#              sechs Kacheln, Wetter- und Windanimation) · Warnlage &
#              Pollen
#   Section 2  schwebende Navbar
#
# Warnlage & Pollen steht immer da: zwei Kacheln, alle DWD-Warnungen und
# der Pollenflug. Tippen oeffnet das jeweilige Popup (nachtblau_dwd_popup,
# nachtblau_pollen_popup aus warnlage-templates.yaml), langes Druecken die
# more-info. Beide Kacheln folgen seit 14.11.2026 demselben Muster: hoechste
# Stufe als Pille, alle Ereignisse bzw. Pollenarten, Szenen im Wechsel und
# ein Verlauf darunter. Wischen nach links oder rechts springt zur naechsten
# bzw. vorigen Szene (nachtblau_wisch, seit 14.11.2026).
# Die Kacheln stehen immer untereinander, am Handy wie am Desktop.
#   Warnung  aktuelle Warnungen und Vorabinformationen, Zeitleiste der
#            naechsten 24 Stunden (ab jetzt, jede Minute neu), Szenen aus
#            nachtblau_warn_fx. Die Warnkarte (meteoalarm-karte.yaml) steht
#            deshalb nur noch auf Home.
#   Pollen   alle belasteten Arten, Verlauf heute/morgen/uebermorgen, Szenen
#            aus nachtblau_pollen_fx; Template nachtblau_pollen_kachel, das mit
#            eigenem Kopf auch auf Home steht (pollenflug-karte-v2.yaml).
# Farben: Warnung amber, ab Stufe 3 rot, keine Warnung gruen; Pollen nach
# pfx.stufe() (bis 1 gruen, bis 2 amber, 2,5 koralle, 3 rot); die
# Icon-Kachel im Kopf folgt der Warnlage.
#
# Warnlage & Pollen bekommt die Nachtblau-Huelle ueber card-mod am
# vertical-stack (wie energie-monatsbilanz-karte.yaml).
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include dashboard/klima/wetter-view.yaml
#   Das Include unten ist relativ zu dieser Datei: wetter-karte-v2.yaml im
#   selben Ordner ablegen.
#
# Voraussetzung: custom:button-card + custom:decluttering-card + card-mod
#                + browser_mod (alle via HACS), Integrationen
#                DWD-Wetterwarnungen (dwd_weather_warnings), DWD
#                Pollenflug (HACS, Region 101) und Uhrzeit & Datum
#                (sensor.date_time, fuer die Zeitleiste), Templates aus
#                navigation-templates.yaml, wetter-templates.yaml und
#                warnlage-templates.yaml.
title: Wetter
path: wetter
icon: flat-ui:weather
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: top_navigation
      - !include wetter-karte-v2.yaml
      # =================== WARNLAGE & POLLEN ===================
      - type: vertical-stack
        card_mod:
          style: |
            #root {
              background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
              border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
              border-radius: 22px !important;
              box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
              padding: 16px 18px !important;
              gap: 6px !important;
            }
        cards:
          - type: custom:button-card
            icon: '[[[ return variables.warnstufe > 0 || variables.vorwarnstufe > 0 ? "mdi:alert-outline" : "mdi:shield-check-outline"; ]]]'
            name: Warnlage & Pollen
            label: Tippen für Details
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            tap_action:
              action: none
            triggers_update:
              - sensor.warnregion_aktuelle_warnstufe
              - sensor.warnregion_vorwarnstufe
            variables:
              warnstufe: '[[[ return parseInt(states["sensor.warnregion_aktuelle_warnstufe"]?.state) || 0; ]]]'
              vorwarnstufe: '[[[ return parseInt(states["sensor.warnregion_vorwarnstufe"]?.state) || 0; ]]]'
              accent: |
                [[[
                  if (variables.warnstufe >= 3) return 'var(--nachtblau-rot, #f0736a)';
                  if (variables.warnstufe > 0 || variables.vorwarnstufe > 0) return 'var(--nachtblau-amber, #e6b566)';
                  return 'var(--nachtblau-gruen, #a6d49e)';
                ]]]
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 2px 2px 8px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: min-content 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 44px
                - height: 44px
                - border-radius: 13px
                - margin-right: 14px
                - align-self: center
                - background: '[[[ return `color-mix(in srgb, ${variables.accent} 16%, transparent)`; ]]]'
                - border: '[[[ return `1px solid color-mix(in srgb, ${variables.accent} 24%, transparent)`; ]]]'
              icon:
                - width: 23px
                - height: 23px
                - color: '[[[ return variables.accent; ]]]'
                - --ha-icon-display: block
              name:
                - justify-self: start
                - align-self: end
                - font-size: 17px
                - font-weight: 700
                - letter-spacing: -0.02em
                - color: 'var(--nachtblau-text, #f2f5f8)'
              label:
                - justify-self: start
                - align-self: start
                - font-size: 12.5px
                - margin-top: 2px
                - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
          # Warnung und Pollen immer untereinander, auch am Desktop: beide Kacheln
          # tragen Szene, Pillen und Verlauf und brauchen die volle Breite. Bis
          # 14.11.2026 zwei Spalten ab 441 px Bildschirmbreite; am Desktop blieben
          # der Zeitleiste dann rund 200 px und "jetzt" stiess an die erste Uhrzeit.
          - type: grid
            columns: 1
            square: false
            cards:
              # ---- DWD: alle Warnungen beider Sensoren, konsolidiert ----
              # Seit 14.11.2026 (Entwurf warnlage-kachel.html):
              # hoechste Stufe als Pille, alle Ereignisse, Zeitleiste der naechsten
              # 24 Stunden und die Szenen aus nachtblau_warn_fx im Wechsel (je 5 s,
              # das gezeigte Ereignis leuchtet im Text auf). Das Template kommt ueber
              # nachtblau_dwd_popup. Ersetzt die Warnkarte, die bis dahin darunter
              # stand und nur die erste Warnung zeigte.
              #
              # Zwei Felder: body (Icon, Text, Szene) und zeit (Zeitleiste).
              # sensor.date_time (Integration "Uhrzeit & Datum") laesst die Kachel
              # jede Minute neu zeichnen; dabei aendert sich nur der Text von zeit,
              # body bleibt gleich und die Szene laeuft ungestoert weiter (button-card
              # ersetzt nur Felder, deren Inhalt sich aendert). Hintergrund und Rand
              # stehen deshalb an der Karte selbst, nicht im HTML eines Feldes.
              #
              # Wischen nach links oder rechts springt zwischen den Szenen
              # (nachtblau_wisch, seit 14.11.2026); der Wechsel laeuft weiter.
              - type: custom:button-card
                template:
                  - nachtblau_dwd_popup
                  - nachtblau_wisch
                entity: sensor.warnregion_aktuelle_warnstufe
                triggers_update:
                  - sensor.warnregion_aktuelle_warnstufe
                  - sensor.warnregion_vorwarnstufe
                  - sensor.date_time
                show_name: false
                show_state: false
                show_icon: false
                show_label: false
                variables:
                  # Alle Warnungen beider Sensoren, fuer body, zeit und die Kartenfarbe
                  wl: |
                    [[[
                      const CAP = { 0: '#ff8080', 1: '#ffeb3b', 2: '#fb8c00', 3: '#e53935', 4: '#880e4f' }; // Rueckfall, CAP-Profil 3.5
                      const SONDER = { 246: '#fe68fe', 247: '#cc99ff', 248: '#9e46f8' };
                      const toDate = (v) => { if (v === undefined || v === null || v === '') return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
                      const lesen = (id, vorab) => {
                        const s = states[id], a = s && s.attributes ? s.attributes : {}, n = parseInt(a.warning_count) || 0, out = [];
                        for (let i = 1; i <= n; i++) {
                          const o = (a['warning_' + i] && typeof a['warning_' + i] === 'object') ? a['warning_' + i] : {};
                          const p = (k) => a['warning_' + i + '_' + k];
                          const lv = parseInt((p('level') !== undefined && p('level') !== null) ? p('level') : o.level) || 0;
                          const ii = (p('type') !== undefined && p('type') !== null) ? p('type') : o.event_code;
                          out.push({ name: p('name') || o.event || 'Wetterwarnung', ii, level: lv, vorab,
                            color: p('color') || o.color || SONDER[parseInt(ii)] || (vorab ? CAP[0] : CAP[lv]) || CAP[2],
                            start: toDate(p('start') || p('start_time') || o.start_time || o.start), end: toDate(p('end') || p('end_time') || o.end_time || o.end) });
                        }
                        return out;
                      };
                      const sAkt = states['sensor.warnregion_aktuelle_warnstufe'];
                      const ordnen = (x, y) => (y.level - x.level) || ((x.start ? x.start.getTime() : 0) - (y.start ? y.start.getTime() : 0));
                      const aktiv = lesen('sensor.warnregion_aktuelle_warnstufe', false).sort(ordnen);
                      const vorab = lesen('sensor.warnregion_vorwarnstufe', true).sort(ordnen);
                      const zeige = aktiv.length ? aktiv : vorab; // Szenen: aktuelle Warnungen, sonst Vorabinformationen
                      const daten = !!sAkt && !isNaN(parseInt(sAkt.state));
                      const status = !daten ? 'var(--nachtblau-text-sekundaer, #8794a5)'
                        : !zeige.length ? 'var(--nachtblau-gruen, #a6d49e)'
                        : (aktiv.length && aktiv[0].level >= 3) ? 'var(--nachtblau-rot, #f0736a)' : 'var(--nachtblau-amber, #e6b566)';
                      return { aktiv, vorab, zeige, daten, status };
                    ]]]
                styles:
                  card:
                    - padding: 12px 14px
                    - border-radius: 16px
                    - background: '[[[ return `color-mix(in srgb, ${variables.wl.status} 12%, transparent)`; ]]]'
                    - border: '[[[ return `1px solid color-mix(in srgb, ${variables.wl.status} 24%, transparent)`; ]]]'
                    - box-shadow: none
                    - overflow: hidden
                    - cursor: pointer
                  grid:
                    - grid-template-areas: '"body" "zeit"'
                    - grid-template-columns: minmax(0, 1fr)
                    - row-gap: '[[[ return variables.wl.zeige.length ? "10px" : "0px"; ]]]'
                  custom_fields:
                    body:
                      - width: 100%
                      - min-width: 0
                      # button-card setzt class="ellipsis" (nowrap, overflow hidden):
                      # Umbruch erlauben, Szene darf bis an den Kartenrand
                      - white-space: normal
                      - overflow: visible
                    zeit:
                      - width: 100%
                      - min-width: 0
                      - white-space: normal
                      - overflow: visible
                custom_fields:
                  body: |
                    [[[
                      variables.wisch(this); // Wischen zwischen den Szenen (nachtblau_wisch)
                      // ---------- Nachtblau-Palette ----------
                      const value = 'var(--nachtblau-text, #f2f5f8)', muted = 'var(--nachtblau-text-sekundaer, #8794a5)', label = 'var(--nachtblau-label, #b4c0cf)';
                      const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
                      const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--nachtblau-dunkel-anteil, 100%), ${hell})`;
                      const esc = (x) => String(x === null || x === undefined ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                      // DWD-Farbe wie in meteoalarm-karte.yaml: Ton nur, wenn er auf seiner Toenung lesbar ist
                      const NAVY = '#171d29', HELL = '#f2f5f8';
                      const rgbOf = (h) => { const m = /^#([0-9a-f]{6})$/i.exec(String(h || '').trim()); return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null; };
                      const lum = (c) => { const k = c.map((v) => v / 255).map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4))); return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2]; };
                      const kr = (x, y) => { const l1 = lum(x), l2 = lum(y); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); };
                      const aufFlaeche = (c) => { const r = rgbOf(c); return !r ? NAVY : (kr(r, rgbOf(NAVY)) >= kr(r, rgbOf(HELL)) ? NAVY : HELL); };
                      const GRUND = ['#1b2231', '#171d29']; // dunkler Grund der Kartenhuelle, nur fuer diese Rechnung
                      const lesbar = (c, anteil, ziel) => { const r = rgbOf(c); if (!r) return c; return GRUND.every((g) => kr(r, rgbOf(g).map((v, i) => v * (1 - anteil) + r[i] * anteil)) >= ziel) ? c : HELL; };
                      const randRot = 'var(--nachtblau-fuellung-rand-rot, rgba(240, 115, 106, 0.5))';
                      const leuchtenRot = 'var(--nachtblau-leuchten-rot, rgba(240, 115, 106, 0.5))';
                      const LABEL = { 1: 'Wetterwarnung', 2: 'Markante Warnung', 3: 'Unwetterwarnung', 4: 'Extreme Warnung' };
                      const wfx = variables.wfx;
                      const { aktiv, vorab, zeige, daten, status } = variables.wl;

                      // ---------- Keine Daten / keine Warnung: ruhige Kachel wie bisher ----------
                      const ruhig = (titel, text, schild) => `
                        <div style="display:flex;align-items:center;gap:12px;min-width:0;text-align:left;">
                          <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${tint(status, 16)};border:1px solid ${tint(status, 24)};"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:${status};width:22px;height:22px;display:block;">${schild ? '<path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6Z"/><path d="m9 12 2 2 4-4"/>' : '<path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor" stroke="none"/>'}</svg></div>
                          <div style="min-width:0;">
                            <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;color:${value};line-height:1.25;">${titel}</div>
                            <div style="font-size:12px;color:${muted};margin-top:2px;line-height:1.35;">${text}</div>
                          </div>
                        </div>`;
                      if (!daten) return ruhig('Keine Daten', 'DWD-Warnung', false);
                      if (!zeige.length) return ruhig('Keine Warnung', 'DWD-Wetter&shy;warnung', true);

                      // ---------- Kopfzeile: hoechste Warnung ----------
                      const top = zeige[0], nurVorab = !aktiv.length, n = zeige.length;
                      const farbe = top.color;
                      const extrem = !nurVorab && top.level >= 4, alarm = !nurVorab && top.level >= 3;
                      const key = (w) => wfx.szene(w.ii, w.name);
                      const kachel = extrem
                        ? `background:${farbe};border:1px solid ${randRot};--wf-glow:${leuchtenRot};`
                        : `background:${modus(tint(farbe, 16), farbe)};border:1px solid ${modus(tint(farbe, 24), farbe)};--wf-glow:${tint(farbe, 50)};`;
                      const iconFarbe = extrem ? aufFlaeche(farbe) : modus(lesbar(farbe, 0.16, 3), aufFlaeche(farbe));
                      const pillStil = 'display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:1;border-radius:999px;padding:3px 8px;white-space:nowrap;';
                      const pill = extrem
                        ? `<span style="${pillStil}color:${aufFlaeche(farbe)};background:${farbe};border:1px solid ${randRot};">${LABEL[top.level]}</span>`
                        : `<span style="${pillStil}color:${modus(lesbar(farbe, 0.12, 4.5), value)};background:${tint(farbe, 12)};border:1px solid ${tint(farbe, 24)};">${nurVorab ? 'Vorabinformation' : (LABEL[top.level] || 'Wetterwarnung')}</span>`;
                      const vorabPill = (!nurVorab && vorab.length) ? `<span style="${pillStil}color:${label};background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));">+${vorab.length} Vorabinfo</span>` : '';
                      // DWD schreibt Schluesselwoerter gross -> "Schweres Gewitter" (wfx.schreib,
                      // dieselbe Regel wie die Warnkarte auf Home); Kurzform am " mit "
                      const name = (w) => wfx.schreib(wfx.kurz(String(w.name).replace(/^VORABINFORMATION\s+/, '')).titel);
                      const titel = n === 1 ? name(top) : `${n} ${nurVorab ? 'Vorabinformationen' : 'Warnungen'}`;

                      // ---------- Zeitraum (eine Warnung) oder Ereignisse (mehrere) ----------
                      // Haengt nur am Tag (Heute/Morgen): body aendert sich so hoechstens um Mitternacht
                      const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                      const tag = (d) => {
                        const t0 = new Date(); t0.setHours(0, 0, 0, 0);
                        const dd = new Date(d); dd.setHours(0, 0, 0, 0);
                        const diff = Math.round((dd - t0) / 86400000);
                        return diff === 0 ? 'Heute' : diff === 1 ? 'Morgen' : diff === -1 ? 'Gestern' : d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
                      };
                      // Tag und Uhrzeit mit geschuetztem Leerzeichen: Umbruch nur am Gedankenstrich
                      const zeitraum = (w) => (w.start && w.end)
                        ? (w.start.toDateString() === w.end.toDateString() ? `${tag(w.start)}\u00a0${fmtT(w.start)}–${fmtT(w.end)}` : `${tag(w.start)}\u00a0${fmtT(w.start)} – ${tag(w.end)}\u00a0${fmtT(w.end)}`)
                        : (w.start ? `ab ${tag(w.start)}\u00a0${fmtT(w.start)}` : '');
                      const zeile2 = n === 1
                        ? `<div style="font-size:12px;color:${muted};line-height:1.35;">${esc(zeitraum(top))}</div>`
                        : `<div style="font-size:12.5px;color:${muted};line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;">${zeige.map((w, i) => `<span class="wl-name" style="${wfx.wechselStil('name', i, n)}">${esc(name(w))}</span>`).join(' · ')}</div>`;

                      // ---------- Szene(n): im Wechsel, rechts neben dem Text ----------
                      const szene = wfx.wechsel(zeige.map((w) => ({ key: key(w), stufe: w.level, ii: w.ii, vorab: w.vorab })));

                      return `
                        <div style="display:flex;align-items:center;gap:12px;position:relative;text-align:left;color:${value};">
                          <div class="${alarm ? 'wf-alarm' : ''}${extrem ? ' l4' : ''}" style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-sizing:border-box;${kachel}">${wfx.icon(key(top), iconFarbe, 22)}</div>
                          <div style="min-width:0;flex:0 1 auto;display:flex;flex-direction:column;gap:4px;">
                            <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${esc(titel)}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:5px;">${pill}${vorabPill}</div>
                            ${zeile2}
                          </div>
                          ${szene ? `<div class="wf-slot" style="margin:-12px -14px -4px 0;">${szene}</div>` : ''}
                        </div>`;
                    ]]]
                  zeit: |
                    [[[
                      // ---------- Zeitleiste: naechste 24 Stunden ab jetzt, je Warnung eine Spur ----------
                      // Neu gerechnet bei jedem Neuzeichnen, also mindestens jede Minute (sensor.date_time)
                      const { aktiv, vorab, zeige } = variables.wl;
                      if (!zeige.length) return '';
                      const label = 'var(--nachtblau-label, #b4c0cf)';
                      const randRot = 'var(--nachtblau-fuellung-rand-rot, rgba(240, 115, 106, 0.5))';
                      const jetzt = Date.now(), SPANNE = 24 * 3600000;
                      const lage = (d, rueckfall) => d ? Math.max(0, Math.min(1, (d.getTime() - jetzt) / SPANNE)) : rueckfall;
                      const kante = 'box-shadow:inset 0 0 0 1px color-mix(in srgb, transparent var(--nachtblau-dunkel-anteil, 100%), rgba(23, 29, 41, 0.24));'; // hell: Kante, damit Gelb auf heller Kachel steht
                      const spuren = aktiv.concat(vorab).map((w) => {
                        const a = lage(w.start, 0), b = lage(w.end, 1);
                        const fuell = w.vorab
                          ? `background:repeating-linear-gradient(135deg, #ff8080 0 3px, rgba(255, 128, 128, 0.18) 3px 6px);` // Vorabinformation schraffiert wie beim DWD
                          : `background:${w.color};${w.level >= 4 ? `box-shadow:0 0 0 1px ${randRot};` : kante}`;
                        const seg = b > a ? `<i style="position:absolute;top:0;bottom:0;left:${(a * 100).toFixed(2)}%;width:${((b - a) * 100).toFixed(2)}%;border-radius:2px;${fuell}"></i>` : '';
                        return `<div style="position:relative;height:4px;border-radius:2px;background:var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));">${seg}</div>`;
                      }).join('');
                      // Uhrzeiten: jetzt, dann die naechsten vollen 6-Stunden-Marken
                      const marke = new Date(jetzt); marke.setMinutes(0, 0, 0); marke.setHours(Math.floor(marke.getHours() / 6) * 6 + 6);
                      let ticks = `<span style="position:absolute;top:0;left:0;">jetzt</span>`;
                      for (let k = 0; k < 4; k++) {
                        const t = new Date(marke.getTime() + k * 6 * 3600000), x = (t.getTime() - jetzt) / SPANNE;
                        // Abstand zu "jetzt" (11 px, rund 26 px breit): ab 14 % der Breite,
                        // bei 306 px Kachel (278 px Zeitleiste) also ab 39 px Mitte
                        if (x < 0.14 || x > 1) continue;
                        const rechts = x > 0.9;
                        ticks += `<span style="position:absolute;top:0;left:${(x * 100).toFixed(2)}%;transform:translateX(${rechts ? '-100%' : '-50%'});white-space:nowrap;">${t.getHours()}${rechts ? ' Uhr' : ''}</span>`;
                      }
                      return `<div style="display:flex;flex-direction:column;gap:3px;text-align:left;">
                          <div style="position:relative;display:flex;flex-direction:column;gap:2px;">${spuren}<span style="position:absolute;top:-2px;bottom:-2px;left:0;width:2px;border-radius:1px;background:${label};"></span></div>
                          <div style="position:relative;height:14px;font-size:11px;color:${label};">${ticks}</div>
                        </div>`;
                    ]]]
              # ---- Pollen: nachtblau_pollen_kachel (warnlage-templates.yaml) ----
              # Hoechste Stufe, alle Arten, Szenen im Wechsel, Verlauf ueber drei
              # Tage; dieselbe Kachel steht mit eigenem Kopf auf Home
              # (pollenflug-karte-v2.yaml).
              - type: custom:button-card
                template: nachtblau_pollen_kachel
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: floating_navbar
