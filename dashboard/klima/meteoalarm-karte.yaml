# ============================================================================
# DWD-Wetterwarnung
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card
# Templates:     nachtblau_dwd_popup (warnlage-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   sensor.warnregion_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# DWD-Wetterwarnung im Nachtblau-Stil
# Ersetzt die custom:meteoalarm-card durch einen custom:button-card-Nachbau,
# damit dieselbe Nachtblau-Huelle, Palette und Typografie greift.
#
# - conditional-Wrapper blendet die Karte aus, wenn weder eine Warnung noch eine
#   Vorabinformation vorliegt (seit 14.11.2026 auch Vorabinformationen).
# - Oben die wichtigste Warnung: aktuelle Warnungen nach Stufe, dann Beginn,
#   danach Vorabinformationen (seit 14.11.2026; vorher immer warning_1 in der
#   Reihenfolge des DWD-Servers). Icon-Kachel und Pille in der DWD-Warnfarbe,
#   bei Vorabinformationen in der CAP-Vorabfarbe mit Pille "Vorabinformation".
# - Weitere Warnungen stehen darunter als Liste mit Icon, Name, Stufe und
#   Zeitraum, hoechstens drei, danach "+N weitere" (Entwurf warn-weitere.html,
#   Variante C). Bis 14.11.2026 nur "+N weitere".
# - Tippen oeffnet ein eigenes Popup (browser_mod.popup) mit allen Warnungen in
#   normalisierter Form statt des rohen more-info-Dialogs. Langes Druecken
#   oeffnet weiterhin das Standard-more-info mit allen Roh-Attributen.
#   Das Popup steht seit 19.10.2026 als Template nachtblau_dwd_popup in
#   warnlage-templates.yaml, weil auch die Karte "Warnlage & Pollen" der
#   Wetter-View es oeffnet.
# - Seit 14.11.2026 animiert (Template nachtblau_warn_fx, ueber
#   nachtblau_dwd_popup geerbt; Entwurf warnung-animiert.html): Szene je
#   Ereignis rechts neben dem Text, nach dem Ereigniscode der obersten Warnung;
#   das Icon bewegt sich mit. Ab Stufe 3 roter Schein und leuchtende
#   Icon-Kachel, Stufe 4 mit gefuellter Kachel und Pille (DESIGN.md,
#   "Animierte Hintergruende"). Text steht nie auf der Szene: Die Textspalte
#   laesst ihr mindestens 64 px, lange Namen brechen zweizeilig um, und
#   kombinierte Gewitter-Namen stehen gekuerzt da ("Schweres Gewitter",
#   darunter "mit Orkanboeen, ..."); den vollen Namen zeigt das Popup.
#   Steht die Liste darunter, endet die Szene ueber der Trennlinie und blendet
#   nach unten aus (18 px wie im Popup, seit 14.11.2026; vorher harte Kante).
# - Namen in Normalschreibung (wfx.schreib, seit 14.11.2026), oben wie in
#   der Liste und in der Warnlage-Kachel der Wetter-View; vorher stand der
#   Titel oben gross wie vom DWD geliefert ("FROST").
#
# Voraussetzung: custom:button-card (HACS), browser_mod (HACS), Templates
# nachtblau_dwd_popup und nachtblau_warn_fx aus warnlage-templates.yaml. Sensoren der
# DWD-Integration (dwd_weather_warnings) -> "aktuelle Warnstufe" + "Vorwarnstufe".
type: conditional
# Sichtbar bei einer aktuellen Warnung oder einer Vorabinformation; numeric_state
# ist bei unavailable/unknown falsch, die Karte bleibt dann aus
conditions:
  - condition: or
    conditions:
      - condition: numeric_state
        entity: sensor.warnregion_aktuelle_warnstufe
        above: 0
      - condition: numeric_state
        entity: sensor.warnregion_vorwarnstufe
        above: 0
card:
  type: custom:button-card
  entity: sensor.warnregion_aktuelle_warnstufe
  template: nachtblau_dwd_popup
  triggers_update:
    - sensor.warnregion_aktuelle_warnstufe
    - sensor.warnregion_vorwarnstufe
  # Langes Druecken zeigt weiterhin die Roh-Attribute des Sensors
  hold_action:
    action: more-info
  show_name: false
  show_state: false
  show_icon: false
  show_label: false
  styles:
    card:
      - padding: 16px 18px
      - border-radius: 22px
      - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
      - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
      - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
      - overflow: hidden
    grid:
      - grid-template-areas: '"body"'
    custom_fields:
      body:
        - width: 100%
        - min-width: 0
        # button-card setzt an Custom-Fields class="ellipsis" (nowrap, overflow
        # hidden): Titel soll zweizeilig umbrechen, die Szene ueber negative
        # Raender bis an den Kartenrand reichen (die Karte schneidet ab).
        - white-space: normal
        - overflow: visible
  custom_fields:
    body: |
      [[[
        // ---------- Nachtblau-Palette ----------
        const value = 'var(--nachtblau-text, #f2f5f8)';
        const muted = 'var(--nachtblau-text-sekundaer, #8794a5)';
        const label = 'var(--nachtblau-label, #b4c0cf)';
        const esc = (x) => String(x === null || x === undefined ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cardBot = 'var(--nachtblau-huelle-unten, #171d29)';
        // DWD-Farbe: dunkel wie bisher als Ton auf Toenung, hell nur als Flaeche
        // mit Navy- oder heller Schrift (DESIGN.md, "Sonderfarben im hellen Modus").
        // --nachtblau-dunkel-anteil ist im dunklen Modus 100 %, im hellen 0 %.
        const tint  = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
        const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--nachtblau-dunkel-anteil, 100%), ${hell})`;
        // Die Integration liefert eigene Farben (Stufe 1 z. B. ffeb3b statt der
        // Palettenwerte), deshalb die Schrift nach Kontrast waehlen statt nach Stufe.
        const NAVY = '#171d29', HELL = '#f2f5f8'; // Fuellung: Schrift auf der DWD-Flaeche, beide Modi gleich
        const rgbOf = (h) => {
          const m = /^#([0-9a-f]{6})$/i.exec(String(h || '').trim());
          return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null;
        };
        const lum = (c) => {
          const k = c.map((v) => v / 255).map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
          return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
        };
        const kr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
        const aufFlaeche = (c) => {
          const r = rgbOf(c);
          if (!r) return NAVY;
          return kr(r, rgbOf(NAVY)) >= kr(r, rgbOf(HELL)) ? NAVY : HELL;
        };
        // Dunkel: der DWD-Ton als Schrift oder Icon nur, wenn er auf seiner
        // eigenen Toenung (anteil) ueber dem dunklen Grund ziel erreicht
        // (Schrift 4,5:1, Icon 3:1); sonst Hell. Die Flaeche bleibt im DWD-Ton.
        const GRUND = ['#1b2231', '#171d29']; // dunkler Grund der Kartenhuelle (oben, unten), nur fuer diese Rechnung
        const lesbar = (c, anteil, ziel) => {
          const r = rgbOf(c);
          if (!r) return c;
          const ok = GRUND.every((g) => kr(r, rgbOf(g).map((v, i) => v * (1 - anteil) + r[i] * anteil)) >= ziel);
          return ok ? c : HELL;
        };

        // ---------- Alle Warnungen beider Sensoren, sortiert ----------
        // Die Integration liefert warning_1, warning_2, ... in der Reihenfolge des
        // DWD-Servers, ohne Sortierung (dwdwfsapi fragt ohne sortBy an). Seit
        // 14.11.2026 sortiert die Karte selbst wie die Warnlage-Kachel der
        // Wetter-View: aktuelle Warnungen nach Stufe (hoechste zuerst), bei gleicher
        // Stufe nach Beginn; danach die Vorabinformationen ebenso. Bis dahin stand
        // oben immer warning_1, eine Unwetterwarnung konnte in "+N weitere" stehen.
        const toDate = (v) => { if (v === undefined || v === null || v === '') return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
        // Rueckfall ohne gelieferte Farbe: dieselben Werte, die die Integration
        // sonst liefert (CAP-DWD-Profil 2.1.13, Kap. 3.5), Hitze und UV nach
        // Ereigniscode; Vorabinformation immer in der CAP-Vorabfarbe
        const lvlColor = { 1:'#ffeb3b', 2:'#fb8c00', 3:'#e53935', 4:'#880e4f' };
        const sonderColor = { 246:'#fe68fe', 247:'#cc99ff', 248:'#9e46f8' };
        const VORAB = '#ff8080';
        const lesen = (id, vorab) => {
          const s = states[id], a = s && s.attributes ? s.attributes : {}, n = parseInt(a.warning_count) || 0, out = [];
          for (let i = 1; i <= n; i++) {
            const o = (a['warning_' + i] && typeof a['warning_' + i] === 'object') ? a['warning_' + i] : {};
            const p = (k) => a['warning_' + i + '_' + k];
            const lv = parseInt((p('level') !== undefined && p('level') !== null) ? p('level') : o.level) || 0;
            // DWD-Ereigniscode (ii), waehlt Szene und Icon (FROST = 22)
            const ii = (p('type') !== undefined && p('type') !== null) ? p('type') : o.event_code;
            const nm = String(p('name') || o.event || p('headline') || 'Wetterwarnung').replace(/^VORABINFORMATION\s+/, '');
            out.push({ name: nm, ii, level: lv, vorab,
              color: vorab ? VORAB : (p('color') || o.color || sonderColor[parseInt(ii)] || lvlColor[lv] || '#fb8c00'),
              // warning_N_start/_end; aeltere Versionen und warning_N-Objekt: *_time
              start: toDate(p('start') || p('start_time') || o.start_time || o.start),
              end: toDate(p('end') || p('end_time') || o.end_time || o.end) });
          }
          return out;
        };
        const ordnen = (x, y) => (y.level - x.level) || ((x.start ? x.start.getTime() : 0) - (y.start ? y.start.getTime() : 0));
        const alle = lesen('sensor.warnregion_aktuelle_warnstufe', false).sort(ordnen)
          .concat(lesen('sensor.warnregion_vorwarnstufe', true).sort(ordnen));
        if (!alle.length) return '';

        // ---------- Oben die erste Warnung, darunter die weiteren ----------
        const top = alle[0], rest = alle.slice(1);
        const name = top.name, typ = top.ii, color = top.color, vorab = top.vorab;
        const wlvl = top.level || 1;
        const LABEL = { 1:'Wetterwarnung', 2:'Markante Warnung', 3:'Unwetterwarnung', 4:'Extreme Warnung' };
        const lvlLabel = vorab ? 'Vorabinformation' : (LABEL[wlvl] || ('Stufe ' + wlvl));

        // ---------- Zeitraum ----------
        const start = top.start, end = top.end;
        const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        const dayLabel = (d) => {
          const t0 = new Date(); t0.setHours(0,0,0,0);
          const dd = new Date(d); dd.setHours(0,0,0,0);
          const diff = Math.round((dd - t0) / 86400000);
          if (diff === 0) return 'Heute';
          if (diff === 1) return 'Morgen';
          if (diff === -1) return 'Gestern';
          return d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
        };
        let range = '';
        if (start && end) {
          const sameDay = start.toDateString() === end.toDateString();
          range = sameDay
            ? `${dayLabel(start)} ${fmtT(start)}–${fmtT(end)} Uhr`
            : `${dayLabel(start)} ${fmtT(start)} – ${dayLabel(end)} ${fmtT(end)}`;
        } else if (start) {
          range = `ab ${dayLabel(start)} ${fmtT(start)} Uhr`;
        }

        // ---------- Szene, Icon und Kachel (Template nachtblau_warn_fx) ----------
        const wfx = variables.wfx;
        const key = wfx.szene(typ, name);
        // Vorabinformation: Szene abgeschwaecht (wie in der Warnlage-Kachel), ohne Alarm.
        // Mit Liste darunter endet die Szene ueber der Trennlinie statt am Kartenrand;
        // 'popup' blendet sie dort nach unten aus (18 px wie Popup und Warnlage-Kachel)
        const szene = wfx.fx(key, wlvl, typ, vorab, rest.length ? 'popup' : 'karte');
        const alarm = !vorab && wlvl >= 3;
        // Stufe 4: Kachel und Pille deckend in der DWD-Farbe, Schrift nach Kontrast,
        // Rand und Leuchten in Rot (gefuellte Rot-Kachel). Getoent waere die
        // DWD-Farbe der Stufe 4 (dunkles Purpurrot laut CAP-Profil) nur 1,03:1 zur
        // Huelle, Icon und Schrift fielen auf Hell.
        const extrem = !vorab && wlvl >= 4;
        const randRot = 'var(--nachtblau-fuellung-rand-rot, rgba(240, 115, 106, 0.5))';
        const leuchtenRot = 'var(--nachtblau-leuchten-rot, rgba(240, 115, 106, 0.5))';
        const kachel = extrem
          ? `background:${color};border:1px solid ${randRot};--wf-glow:${leuchtenRot};`
          : `background:${modus(tint(color, 16), color)};border:1px solid ${modus(tint(color, 24), color)};--wf-glow:${tint(color, 50)};`;
        const iconFarbe = extrem ? aufFlaeche(color) : modus(lesbar(color, 0.16, 3), aufFlaeche(color));

        const iconTile = `
          <div class="${alarm ? 'wf-alarm' : ''}${extrem ? ' l4' : ''}" style="flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;box-sizing:border-box;${kachel}">
            ${wfx.icon(key, iconFarbe, 24)}
          </div>`;

        // Kurzform: "SCHWERES GEWITTER" als Titel, "mit ORKANBÖEN, ..." darunter;
        // beides in Normalschreibung wie die Liste und die Warnlage-Kachel
        // ("Schweres Gewitter", "mit Orkanböen"; wfx.schreib, seit 14.11.2026)
        const k = wfx.kurz(name);
        const clamp2 = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;';

        const pillFarben = extrem
          ? `color:${aufFlaeche(color)};background:${color};border:1px solid ${randRot};`
          : `color:${modus(lesbar(color, 0.12, 4.5), value)};background:${tint(color, 12)};border:1px solid ${tint(color, 24)};`;
        const pill = `<span style="display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;line-height:1;${pillFarben}border-radius:999px;padding:3px 8px;white-space:nowrap;">${lvlLabel}</span>`;

        // ---------- Weitere Warnungen: Liste (Entwurf warn-weitere.html, Variante C) ----------
        // Je Warnung Icon in ihrer Farbe, Name, Stufe und Zeitraum; hoechstens drei
        // Zeilen, danach "+N weitere" (Tippen oeffnet das Popup mit allen).
        const NB = String.fromCharCode(160); // Tag und Uhrzeit nicht trennen
        const zeitraum = (w) => (w.start && w.end)
          ? (w.start.toDateString() === w.end.toDateString() ? `${dayLabel(w.start)}${NB}${fmtT(w.start)}–${fmtT(w.end)}` : `${dayLabel(w.start)}${NB}${fmtT(w.start)} – ${dayLabel(w.end)}${NB}${fmtT(w.end)}`)
          : (w.start ? `ab ${dayLabel(w.start)}${NB}${fmtT(w.start)}` : '');
        const MAX = 3;
        const eintrag = (w) => {
          const voll = !w.vorab && w.level >= 4, c = w.color, k2 = wfx.szene(w.ii, w.name);
          const kachel2 = voll
            ? `background:${c};border:1px solid ${randRot};`
            : `background:${modus(tint(c, 16), c)};border:1px solid ${modus(tint(c, 24), c)};`;
          const icon2 = voll ? aufFlaeche(c) : modus(lesbar(c, 0.16, 3), aufFlaeche(c));
          const pill2 = voll
            ? `color:${aufFlaeche(c)};background:${c};border:1px solid ${randRot};`
            : `color:${modus(lesbar(c, 0.12, 4.5), value)};background:${tint(c, 12)};border:1px solid ${tint(c, 24)};`;
          return `
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
              <div style="flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;box-sizing:border-box;${kachel2}">${wfx.icon(k2, icon2, 17)}</div>
              <div style="min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px;">
                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;min-width:0;">
                  <span style="font-size:14px;font-weight:650;letter-spacing:-0.01em;line-height:1.2;">${esc(wfx.schreib(wfx.kurz(w.name).titel))}</span>
                  <span style="font-size:10.5px;font-weight:700;line-height:1;border-radius:999px;padding:2px 6px;white-space:nowrap;${pill2}">${w.vorab ? 'Vorabinformation' : (LABEL[w.level] || 'Wetterwarnung')}</span>
                </div>
                <div style="font-size:12px;color:${muted};line-height:1.25;">${esc(zeitraum(w))}</div>
              </div>
            </div>`;
        };
        const liste = rest.length ? `
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));display:flex;flex-direction:column;gap:10px;position:relative;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
            ${rest.slice(0, MAX).map(eintrag).join('')}
            ${rest.length > MAX ? `<div style="font-size:12px;color:${muted};padding-left:42px;">+${rest.length - MAX} weitere · Tippen für alle</div>` : ''}
          </div>` : '';

        // ---------- Aufbau ----------
        return `
          <div style="display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
            ${iconTile}
            <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:${szene ? '0 1 auto' : '1 1 auto'};">
              <div style="font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;${clamp2}text-wrap:balance;overflow-wrap:break-word;">${wfx.trenn(esc(wfx.schreib(k.titel)))}</div>
              ${k.zusatz ? `<div style="font-size:12.5px;color:${label};line-height:1.25;${clamp2}">${esc(wfx.schreib(k.zusatz, false))}</div>` : ''}
              <!-- Pille und Zeitraum untereinander: So endet die Textspalte am
                   laengsten Text, und die Szene bekommt den Rest der Zeile -->
              <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;">
                ${pill}
                <span style="font-size:12.5px;color:${muted};line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${range}</span>
              </div>
            </div>
            ${szene ? `<div class="wf-slot"${rest.length ? ' style="margin-bottom:0;"' : ''}>${szene}</div>` : ''}
          </div>${liste}`;
      ]]]
