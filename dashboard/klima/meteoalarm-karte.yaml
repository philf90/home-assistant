# ============================================================================
# DWD-Wetterwarnung
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card
# Templates:     owlet_dwd_popup (warnlage-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   sensor.warnregion_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# DWD-Wetterwarnung im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Ersetzt die custom:meteoalarm-card durch einen custom:button-card-Nachbau,
# damit dieselbe Owlet-Huelle, Palette und Typografie greift.
#
# - conditional-Wrapper blendet die Karte aus, wenn keine Warnung aktiv ist
#   (entspricht hide_when_no_warning: true der alten Karte).
# - Icon-Kachel und "Stufe"-Pille faerben sich in der offiziellen DWD-Warnfarbe
#   (Attribut warning_1_color), Icon je nach Warnungstyp (Wind/Gewitter/...).
# - Liegt mehr als eine Warnung an, wird "+N weitere" angezeigt.
# - Tippen oeffnet ein eigenes Popup (browser_mod.popup) mit allen Warnungen in
#   normalisierter Form statt des rohen more-info-Dialogs. Langes Druecken
#   oeffnet weiterhin das Standard-more-info mit allen Roh-Attributen.
#   Das Popup steht seit 19.10.2026 als Template owlet_dwd_popup in
#   warnlage-templates.yaml, weil auch die Karte "Warnlage & Pollen" der
#   Wetter-View es oeffnet.
#
# Voraussetzung: custom:button-card (HACS), browser_mod (HACS), Template
# owlet_dwd_popup aus warnlage-templates.yaml. Sensoren der
# DWD-Integration (dwd_weather_warnings) -> "aktuelle Warnstufe" + "Vorwarnstufe".
type: conditional
conditions:
  - entity: sensor.warnregion_aktuelle_warnstufe
    state_not: '0'
  - entity: sensor.warnregion_aktuelle_warnstufe
    state_not: unavailable
  - entity: sensor.warnregion_aktuelle_warnstufe
    state_not: unknown
card:
  type: custom:button-card
  entity: sensor.warnregion_aktuelle_warnstufe
  template: owlet_dwd_popup
  # Langes Druecken zeigt weiterhin die Roh-Attribute des Sensors
  hold_action:
    action: more-info
  show_name: false
  show_state: false
  show_icon: false
  show_label: false
  styles:
    card:
      - padding: 16px 18px
      - border-radius: 22px
      - border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05))
      - background: 'linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%)'
      - box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7))
      - overflow: hidden
    grid:
      - grid-template-areas: '"body"'
    custom_fields:
      body:
        - width: 100%
        - min-width: 0
  custom_fields:
    body: |
      [[[
        // ---------- Palette (identisch zur Owlet-Karte) ----------
        const value = 'var(--owlet-text, #f2f5f8)';
        const muted = 'var(--owlet-text-sekundaer, #8794a5)';
        const cardBot = 'var(--owlet-huelle-unten, #171d29)';
        // DWD-Farbe: dunkel wie bisher als Ton auf Toenung, hell nur als Flaeche
        // mit Navy- oder heller Schrift (DESIGN.md, "Sonderfarben im hellen Modus").
        // --owlet-dunkel-anteil ist im dunklen Modus 100 %, im hellen 0 %.
        const tint  = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
        const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--owlet-dunkel-anteil, 100%), ${hell})`;
        // Die Integration liefert eigene Farben (Stufe 1 z. B. ffeb3b statt der
        // Palettenwerte), deshalb die Schrift nach Kontrast waehlen statt nach Stufe.
        const NAVY = '#171d29', HELL = '#f2f5f8'; // Fuellung: Schrift auf der DWD-Flaeche, beide Modi gleich
        const rgbOf = (h) => {
          const m = /^#([0-9a-f]{6})$/i.exec(String(h || '').trim());
          return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null;
        };
        const lum = (c) => {
          const k = c.map((v) => v / 255).map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
          return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
        };
        const kr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
        const aufFlaeche = (c) => {
          const r = rgbOf(c);
          if (!r) return NAVY;
          return kr(r, rgbOf(NAVY)) >= kr(r, rgbOf(HELL)) ? NAVY : HELL;
        };
        // Dunkel: der DWD-Ton als Schrift oder Icon nur, wenn er auf seiner
        // eigenen Toenung (anteil) ueber dem dunklen Grund ziel erreicht
        // (Schrift 4,5:1, Icon 3:1); sonst Hell. Die Flaeche bleibt im DWD-Ton.
        const GRUND = ['#1b2231', '#171d29']; // dunkler Grund der Kartenhuelle (oben, unten), nur fuer diese Rechnung
        const lesbar = (c, anteil, ziel) => {
          const r = rgbOf(c);
          if (!r) return c;
          const ok = GRUND.every((g) => kr(r, rgbOf(g).map((v, i) => v * (1 - anteil) + r[i] * anteil)) >= ziel);
          return ok ? c : HELL;
        };

        const e = entity;
        const a = (e && e.attributes) ? e.attributes : {};
        const lvl = parseInt(e ? e.state : '0') || 0;
        const count = parseInt(a.warning_count) || 0;
        if (lvl <= 0 || count <= 0) return '';

        // ---------- Warnungsdaten (erste/hoechste Warnung) ----------
        const w1 = (a.warning_1 && typeof a.warning_1 === 'object') ? a.warning_1 : {};
        const name = a.warning_1_name || w1.event || a.warning_1_headline || 'Wetterwarnung';
        const wlvl = parseInt(a.warning_1_level) || lvl;

        // Offizielle DWD-Farbe, sonst Fallback nach Stufe
        const lvlColor = { 1:'#f2c500', 2:'#fb9a12', 3:'#e6480e', 4:'#c0392b' };
        const color = a.warning_1_color || w1.color || lvlColor[wlvl] || '#fb9a12';
        const lvlLabel = { 1:'Wetterwarnung', 2:'Markante Warnung', 3:'Unwetterwarnung', 4:'Extreme Warnung' }[wlvl] || ('Stufe ' + wlvl);

        // ---------- Zeitraum ----------
        // dwd_weather_warnings liefert warning_N_start/_end; aeltere Versionen
        // und das verschachtelte warning_N-Objekt nutzen *_time - beides lesen.
        const toDate = (v) => { if (v === undefined || v === null || v === '') return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
        const start = toDate(a.warning_1_start || a.warning_1_start_time || w1.start_time || w1.start);
        const end   = toDate(a.warning_1_end   || a.warning_1_end_time   || w1.end_time   || w1.end);
        const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        const dayLabel = (d) => {
          const t0 = new Date(); t0.setHours(0,0,0,0);
          const dd = new Date(d); dd.setHours(0,0,0,0);
          const diff = Math.round((dd - t0) / 86400000);
          if (diff === 0) return 'Heute';
          if (diff === 1) return 'Morgen';
          if (diff === -1) return 'Gestern';
          return d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
        };
        let range = '';
        if (start && end) {
          const sameDay = start.toDateString() === end.toDateString();
          range = sameDay
            ? `${dayLabel(start)} ${fmtT(start)}–${fmtT(end)} Uhr`
            : `${dayLabel(start)} ${fmtT(start)} – ${dayLabel(end)} ${fmtT(end)}`;
        } else if (start) {
          range = `ab ${dayLabel(start)} ${fmtT(start)} Uhr`;
        }

        // ---------- Icon nach Warnungstyp ----------
        const iconFor = (n) => {
          const s = (n || '').toLowerCase();
          const S = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${modus(lesbar(color, 0.16, 3), aufFlaeche(color))};width:24px;height:24px;flex:none;">${inner}</svg>`;
          // Gewitter zuerst: DWD-Namen wie "GEWITTER mit ORKANBÖEN" sollen den Blitz zeigen
          if (/(gewitter|blitz)/.test(s))            return S('<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path d="M12.5 13l-2.5 4h3l-2 4"/>');
          if (/(wind|böen|boen|sturm|orkan)/.test(s)) return S('<path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a3 3 0 1 1-3 3M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/>');
          if (/(stark ?regen|dauerregen|regen)/.test(s)) return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M8.5 18l-1 2.2M12 18l-1 2.2M15.5 18l-1 2.2"/>');
          if (/(schnee|schneefall)/.test(s))         return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>');
          if (/(glätte|glaette|frost|eis)/.test(s))  return S('<path d="M12 3v18M4.5 7.5 12 12l7.5-4.5M4.5 16.5 12 12l7.5 4.5M12 3l-2.5 2M12 3l2.5 2M12 21l-2.5-2M12 21l2.5-2"/>');
          if (/(hitze|wärme|waerme)/.test(s))        return S('<path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><circle cx="12" cy="17.4" r="1.8" fill="currentColor" stroke="none"/>');
          if (/(nebel)/.test(s))                     return S('<path d="M5 9h14M4 13h16M6 17h12"/>');
          // Fallback: Warndreieck
          return S('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="none"/>');
        };

        const iconTile = `
          <div style="flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;box-sizing:border-box;background:${modus(tint(color, 16), color)};border:1px solid ${modus(tint(color, 24), color)};">
            ${iconFor(name)}
          </div>`;

        const pill = `<span style="display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;line-height:1;color:${modus(lesbar(color, 0.12, 4.5), value)};background:${tint(color, 12)};border:1px solid ${tint(color, 24)};border-radius:999px;padding:3px 8px;white-space:nowrap;">${lvlLabel}</span>`;
        const more = count > 1 ? `<span style="font-size:12px;color:${muted};white-space:nowrap;">+${count - 1} weitere</span>` : '';

        // ---------- Aufbau ----------
        return `
          <div style="display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;overflow:hidden;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
            ${iconTile}
            <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto;">
              <div style="font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px 8px;min-width:0;">
                ${pill}
                <span style="font-size:12.5px;color:${muted};line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${range}</span>
              </div>
              ${more ? `<div style="margin-top:1px;">${more}</div>` : ''}
            </div>
          </div>`;
      ]]]
