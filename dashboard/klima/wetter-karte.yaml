# Wetter-Ansicht im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
# Variante A: "Wetter" und "Wind" je als eine Owlet-Karte mit Kopfzeile +
# Metrik-Raster (wie die Owlet-Basiskarte). Farben semantisch auf Icon-Kachel
# + Wert: Temperatur in Stufen nach den DWD-Kenntagen (unter 0 °C Blau, ab
# 25 °C Amber, ab 30 °C Rot, sonst Wolkengrau; DESIGN.md "Temperaturstufen"),
# Feuchte blau ohne Bewertung, Trocken gruen / Regen blau, Wind teal.
# Die Kachel "Bedingung" nutzt die Farbe ihrer animierten Szene (Sonne
# Sonnengelb, Nacht Indigo, Wolken/Nebel/Wind Wolkengrau, Regen Blau, Unwetter
# Rot); Gewitter bleibt Amber, Schnee Tuerkis (DESIGN.md).
# Werte/Einheiten/Labels wie im Original.
#
# Tap-Verhalten beider Karten: Jede Metrik-Kachel oeffnet die more-info ihrer
# eigenen Entitaet -- Wetter: Bedingung -> weather.landau_pfalz, Temperatur,
# Luftfeuchtigkeit, Wetterstation-Regen, Regenmenge; Wind: Windrichtung und
# Windgeschwindigkeit. Klicks auf Kopfzeile oder Kartenhintergrund fallen
# weiterhin auf das tap_action der jeweiligen Karte zurueck.
#
# Animierter Hintergrund (Template owlet_wetter_fx aus
# wetter-templates.yaml, Entwurf in
# wetter-animiert.html):
#   - Wetter-Karte: Szene nach der DWD-Bedingung; meldet die Wetterstation
#     Regen, zeigt sie Regen (bzw. Gewitter mit Regen). Wolken ziehen schneller
#     und Regen faellt schraeger, je staerker der Wind.
#   - Wind-Karte: Windschlieren nach Beaufort-Stufe, Richtung aus
#     sensor.windrichtung (Herkunft; die Schlieren ziehen dorthin, wohin der
#     Wind weht). Bei Windstille keine Animation.
#   - Die Beaufort-Stufe kommt aus dem Statistik-Helfer
#     sensor.garten_wetterstation_pro_windgeschwindigkeit_mittel_10_min
#     (zeitgewichtetes Mittel ueber 10 min). Der Rohwert springt alle paar
#     Minuten zwischen 0,0 und 4-8 km/h; angezeigt wird weiter der Rohwert.
#   - Lesbarkeit: Kachel-Beschriftungen und Einheiten in #b4c0cf. Die Kacheln
#     der Wetter-Karte haben einen Schutzgrund (#171d29, Deckkraft 0,62), damit
#     die Beschriftung auch bei Unwetter mindestens 4,5:1 haelt; die Animation
#     ist dort zu 38 % sichtbar, in Kopfzeile und Zwischenraeumen voll.
#     Die Wind-Karte zeigt nur duenne Linien und braucht keinen Schutzgrund.
#
# Voraussetzung: custom:button-card (HACS), Template owlet_wetter_fx und der
# Statistik-Helfer (Einstellungen -> Geraete & Dienste -> Helfer ->
# Statistik, Quelle sensor.wetterstation_pro_windgeschwindigkeit,
# Merkmal "average_step", Hoechstalter 10 min, letzte Probe behalten).
type: vertical-stack
cards:
  # =================== WETTER ===================
  - type: custom:button-card
    template: owlet_wetter_fx
    entity: weather.landau_pfalz
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: more-info
    variables:
      wind_mittel: sensor.garten_wetterstation_pro_windgeschwindigkeit_mittel_10_min
      stufe: '[[[ return variables.wx.bft(states[variables.wind_mittel]?.state) ]]]'
      wxr: '[[[ return variables.wx.richtung(states["sensor.windrichtung"]?.state, variables.stufe) ]]]'
    triggers_update:
      - weather.landau_pfalz
      - sensor.wetterstation_pro_temperatur
      - sensor.wetterstation_pro_luftfeuchtigkeit
      - binary_sensor.wetterstation_pro_regen
      - sensor.regenmenge
      - sensor.regen_aktuell
      - sensor.windrichtung
      - sensor.garten_wetterstation_pro_windgeschwindigkeit_mittel_10_min
    styles:
      card:
        - padding: 16px 18px
        - border-radius: 22px
        - border: 1px solid rgba(255, 255, 255, 0.05)
        - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
        - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
        - overflow: hidden
        - isolation: isolate
        - --wx-dir: '[[[ return String(variables.wxr.dir) ]]]'
        - --wx-tilt: '[[[ return variables.wxr.tilt + "deg" ]]]'
        - --wx-rain: '[[[ return variables.wxr.rain + "deg" ]]]'
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        fx:
          - position: absolute
          - inset: 0
          - z-index: 0
          - pointer-events: none
        body:
          - position: relative
          - z-index: 1
          - width: 100%
    custom_fields:
      fx: |
        [[[
          // Eigenes Feld: gleicher Zustand -> gleicher Text -> Animation laeuft weiter
          const w = states['weather.landau_pfalz'];
          const rb = states['binary_sensor.wetterstation_pro_regen'];
          const cond = variables.wx.effCond(w ? w.state : '', !!rb && rb.state === 'on');
          return variables.wx.wetter(cond, variables.stufe);
        ]]]
      body: |
        [[[
          const green='#a6d49e', value='#f2f5f8', muted='#8794a5', amber='#e6b566', red='#f0736a', blue='#7fb3d5', teal='#7fd0d5';
          // Wie die animierte Szene: Nacht Indigo, Wolken/Nebel/Wind Wolkengrau, Sonne Sonnengelb
          const indigo='#8ea2e6', cloud='#cdd6e0', sun='#e6c15a';
          // Beschriftung und Einheiten hellgrau: halten auf animiertem Grund 4,5:1
          const label='#b4c0cf';
          const S=(id)=>states[id];
          const numOf=(id,d)=>{const e=S(id);const v=e?parseFloat(e.state):NaN;return isNaN(v)?'–':v.toFixed(d===undefined?1:d);};
          const unit=(u)=>`<span style="font-size:12px;color:${label};font-weight:600;margin-left:3px;">${u}</span>`;
          const svg=(inner,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;">${inner}</svg>`;

          const iSun=(c)=>svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>',c);
          const iThermo=(c)=>svg('<path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><path d="M12 9.2v5.2"/><circle cx="12" cy="17.4" r="1.7" fill="'+c+'" stroke="none"/>',c);
          const iDrop=(c)=>svg('<path d="M12 3.5c3 3.6 5 6.2 5 8.6a5 5 0 0 1-10 0c0-2.4 2-5 5-8.6Z"/>',c);
          const iDropOff=(c)=>svg('<path d="M12 3.5c3 3.6 5 6.2 5 8.6a5 5 0 0 1-10 0c0-2.4 2-5 5-8.6Z"/><path d="M4 4l16 16"/>',c);
          const iRain=(c)=>svg('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M8.5 18l-1 2.2M12 18l-1 2.2M15.5 18l-1 2.2"/>',c);
          const iCloud=(c)=>svg('<path d="M7 18h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 9.4 3.8 3.8 0 0 0 7 18Z"/>',c);
          const iMoon=(c)=>svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>',c);
          const iSnow=(c)=>svg('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>',c);
          const iBolt=(c)=>svg('<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path d="M12.5 13l-2.5 4h3l-2 4"/>',c);
          const iFog=(c)=>svg('<path d="M5 9h14M4 13h16M6 17h12"/>',c);

          // Jede Kachel oeffnet die more-info ihrer eigenen Entitaet: Der
          // Klick feuert das Frontend-Event "hass-more-info" (bubbles +
          // composed, damit es aus dem Shadow-DOM der Karte herauskommt).
          // stopPropagation verhindert, dass zusaetzlich das tap_action der
          // Gesamtkarte (Wetter-Entitaet) ausgeloest wird; mousedown/touchstart
          // ebenfalls, damit die Karte keine Hold-Erkennung startet.
          const tap=(id)=>id?` onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${id}'},bubbles:true,composed:true}))" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"`:'';

          // Schutzgrund #171d29 (0,62) unter der Toenung: daempft die Animation
          // in der Kachel auf 38 %, damit die Beschriftung lesbar bleibt
          const cell=(iconFn, valueHtml, text, accent, entityId)=>`
            <div${tap(entityId)} style="display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:16px;background:linear-gradient(${accent}1f,${accent}1f),rgba(23,29,41,0.62);border:1px solid ${accent}3d;min-width:0;${entityId?'cursor:pointer;':''}">
              <div style="flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:${accent}29;border:1px solid ${accent}3d;">${iconFn(accent)}</div>
              <div style="min-width:0;">
                <div style="font-size:21px;font-weight:700;letter-spacing:-0.02em;color:${value};font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:1px;">${valueHtml}</div>
                <div style="font-size:12px;color:${label};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${text}</div>
              </div>
            </div>`;

          // ---- Bedingung ----
          const w=S('weather.landau_pfalz');
          const cond=w?w.state:'';
          const condMap={
            'sunny':['Sonnig',iSun,sun],'clear-night':['Klar',iMoon,indigo],
            'partlycloudy':['Teils bewölkt',iSun,sun],'cloudy':['Bewölkt',iCloud,cloud],
            'fog':['Nebel',iFog,cloud],'rainy':['Regnerisch',iRain,blue],'pouring':['Starkregen',iRain,blue],
            'lightning':['Gewitter',iBolt,amber],'lightning-rainy':['Gewitter',iBolt,amber],
            'snowy':['Schnee',iSnow,teal],'snowy-rainy':['Schneeregen',iSnow,teal],'hail':['Hagel',iSnow,teal],
            'windy':['Windig',iCloud,cloud],'windy-variant':['Windig',iCloud,cloud],'exceptional':['Unwetter',iBolt,red]
          };
          const cInfo=condMap[cond]||[(cond||'–'),iCloud,muted];

          // ---- Temperatur: Stufen nach den DWD-Kenntagen (DESIGN.md "Temperaturstufen") ----
          // unter 0 °C Frost Blau, ab 25 °C (Sommertag) Amber, ab 30 °C (heisser Tag) Rot,
          // dazwischen Wolkengrau. Verglichen wird der angezeigte, gerundete Wert.
          const tE=S('sensor.wetterstation_pro_temperatur');
          const t=tE?Math.round(parseFloat(tE.state)*10)/10:NaN;
          const tColor=isNaN(t)?muted:t>=30?red:t>=25?amber:t<0?blue:'#cdd6e0';

          // ---- Luftfeuchte: Info-Wert in Blau, aussen ohne Komfort-Bewertung ----
          const hE=S('sensor.wetterstation_pro_luftfeuchtigkeit');
          const hum=hE?parseFloat(hE.state):NaN;
          const hColor=isNaN(hum)?muted:blue;

          // ---- Regen (Wetterstation) ----
          const rb=S('binary_sensor.wetterstation_pro_regen');
          const raining=rb&&rb.state==='on';
          const rainLabel=raining?'Regen':'Trocken';
          const rainColor=raining?blue:green;
          const rainIcon=raining?iRain:iDropOff;

          // ---- Regenmenge ----
          const rmName=S('sensor.regen_aktuell');
          const rmLabel=rmName?rmName.state:'Regen';
          const rmE=S('sensor.regenmenge');
          const rmNum=(rmE&&!isNaN(parseFloat(rmE.state)))?parseFloat(rmE.state):0;
          const rmColor=rmNum>0?blue:muted;

          return `
            <div style="width:100%;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
              <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
                <div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:${green}29;border:1px solid ${green}3d;">${iThermo(green)}</div>
                <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;">Wetter</div>
              </div>
              ${cell(cInfo[1], cInfo[0], 'Bedingung', cInfo[2], 'weather.landau_pfalz')}
              <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                ${cell(iThermo, numOf('sensor.wetterstation_pro_temperatur',1)+unit('°C'), 'Temperatur', tColor, 'sensor.wetterstation_pro_temperatur')}
                ${cell(iDrop, numOf('sensor.wetterstation_pro_luftfeuchtigkeit',1)+unit('%'), 'Luftfeuchtigkeit', hColor, 'sensor.wetterstation_pro_luftfeuchtigkeit')}
                ${cell(rainIcon, rainLabel, 'Wetterstation', rainColor, 'binary_sensor.wetterstation_pro_regen')}
                ${cell(iRain, rmNum.toFixed(1)+unit('l/m²'), rmLabel, rmColor, 'sensor.regenmenge')}
              </div>
            </div>`;
        ]]]

  # =================== WIND ===================
  - type: custom:button-card
    template: owlet_wetter_fx
    entity: sensor.wetterstation_pro_windgeschwindigkeit
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: more-info
    variables:
      wind_mittel: sensor.garten_wetterstation_pro_windgeschwindigkeit_mittel_10_min
      stufe: '[[[ return variables.wx.bft(states[variables.wind_mittel]?.state) ]]]'
      wxr: '[[[ return variables.wx.richtung(states["sensor.windrichtung"]?.state, variables.stufe) ]]]'
    triggers_update:
      - sensor.windrichtung
      - sensor.wetterstation_pro_windgeschwindigkeit
      - sensor.windstarke_aktuell
      - sensor.garten_wetterstation_pro_windgeschwindigkeit_mittel_10_min
    styles:
      card:
        - padding: 16px 18px
        - border-radius: 22px
        - border: 1px solid rgba(255, 255, 255, 0.05)
        - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
        - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
        - overflow: hidden
        - isolation: isolate
        - --wx-dir: '[[[ return String(variables.wxr.dir) ]]]'
        - --wx-tilt: '[[[ return variables.wxr.tilt + "deg" ]]]'
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        fx:
          - position: absolute
          - inset: 0
          - z-index: 0
          - pointer-events: none
        body:
          - position: relative
          - z-index: 1
          - width: 100%
    custom_fields:
      fx: '[[[ return variables.wx.wind(variables.stufe) ]]]'
      body: |
        [[[
          const green='#a6d49e', value='#f2f5f8', muted='#8794a5', teal='#7fd0d5';
          // Beschriftung und Einheiten hellgrau, wie in der Wetter-Karte
          const label='#b4c0cf';
          const S=(id)=>states[id];
          const numOf=(id,d)=>{const e=S(id);const v=e?parseFloat(e.state):NaN;return isNaN(v)?'–':v.toFixed(d===undefined?1:d);};
          const unit=(u)=>`<span style="font-size:12px;color:${label};font-weight:600;margin-left:3px;">${u}</span>`;
          const svg=(inner,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;">${inner}</svg>`;
          const iWind=(c)=>svg('<path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a3 3 0 1 1-3 3M3 16h9a2.5 2.5 0 1 1-2.5 2.5"/>',c);
          const iSock=(c)=>svg('<path d="M6 21V4"/><path d="M6 5l11 2.4L6 10.6Z"/>',c);

          // Klick je Kachel -> more-info der eigenen Entitaet, siehe Wetter-Karte oben.
          const tap=(id)=>id?` onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${id}'},bubbles:true,composed:true}))" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"`:'';

          const cell=(iconFn, valueHtml, text, accent, entityId)=>`
            <div${tap(entityId)} style="display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:16px;background:${accent}1f;border:1px solid ${accent}3d;min-width:0;${entityId?'cursor:pointer;':''}">
              <div style="flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:${accent}29;border:1px solid ${accent}3d;">${iconFn(accent)}</div>
              <div style="min-width:0;">
                <div style="font-size:21px;font-weight:700;letter-spacing:-0.02em;color:${value};font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:1px;">${valueHtml}</div>
                <div style="font-size:12px;color:${label};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${text}</div>
              </div>
            </div>`;

          // Windrichtung: Kuerzel (englische 16-Punkt-Windrose) -> volle deutsche Schreibweise
          const dirMap={N:'Nord',NNE:'Nord-Nordost',NE:'Nordost',ENE:'Ost-Nordost',E:'Ost',ESE:'Ost-Südost',SE:'Südost',SSE:'Süd-Südost',S:'Süd',SSW:'Süd-Südwest',SW:'Südwest',WSW:'West-Südwest',W:'West',WNW:'West-Nordwest',NW:'Nordwest',NNW:'Nord-Nordwest'};
          const dirE=S('sensor.windrichtung');
          const dirRaw=dirE?dirE.state:'';
          const dirName=dirMap[(dirRaw||'').toUpperCase()]||(dirRaw&&dirRaw!=='unavailable'&&dirRaw!=='unknown'?dirRaw:'–');
          const dir=`<span style="display:inline-block;white-space:normal;line-height:1.15;max-width:100%;font-size:17px;">${dirName}</span>`;
          const strName=S('sensor.windstarke_aktuell');
          const strLabel=strName?strName.state:'Windgeschwindigkeit';

          return `
            <div style="width:100%;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
              <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
                <div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:${green}29;border:1px solid ${green}3d;">${iWind(green)}</div>
                <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;">Wind</div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                ${cell(iSock, dir, 'Windrichtung', teal, 'sensor.windrichtung')}
                ${cell(iWind, numOf('sensor.wetterstation_pro_windgeschwindigkeit',1)+unit('km/h'), strLabel, teal, 'sensor.wetterstation_pro_windgeschwindigkeit')}
              </div>
            </div>`;
        ]]]
