# ============================================================================
# Warnlage – Popups fuer DWD-Warnungen und Pollenflug
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   sensor.warnregion_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Zwei button-card-Templates, die das Antippen festlegen, dazu die
# Szenen-Bibliotheken fuer Warnungen und Pollenflug. Eine Karte bindet sie mit
# "template: nachtblau_dwd_popup" bzw. "nachtblau_pollen_popup" ein.
#
#   nachtblau_dwd_popup     Tippen: browser_mod-Popup "Wetterwarnungen" mit allen
#                       Warnungen und Vorabinformationen beider DWD-Sensoren,
#                       normalisiert (Stufe, Zeitraum, Text, Parameter).
#                       Genutzt von meteoalarm-karte.yaml und der Karte
#                       "Warnlage & Pollen" in wetter-view.yaml. Bis
#                       19.10.2026 stand der Block direkt in
#                       meteoalarm-karte.yaml.
#   nachtblau_pollen_popup  Tippen: Popup "Pollenflug" mit allen acht Arten fuer
#                       heute, morgen und uebermorgen; belastete Arten oben,
#                       Arten ohne Belastung in einer Zeile. Langes Druecken:
#                       more-info. Genutzt von nachtblau_pollen_kachel.
#   nachtblau_pollen_kachel Pollenkachel: hoechste Stufe, alle Arten, Szenen im
#                       Wechsel, Verlauf ueber drei Tage (seit 14.11.2026).
#                       In "Warnlage & Pollen" (wetter-view.yaml) und mit
#                       eigenem Kopf auf Home (pollenflug-karte-v2.yaml).
#   nachtblau_warn_fx       Animierte Szene und bewegte Icons je DWD-Ereignis
#                       (seit 14.11.2026, Entwurf warnung-animiert.html).
#                       nachtblau_dwd_popup erbt es, der Popup-Inhalt bindet
#                       es selbst ein. Beschreibung am Template unten.
#   nachtblau_pollen_fx     Stufen des Pollenflug-Index und Szene je Pollenart
#                       (seit 14.11.2026, Entwurf pollen-kachel.html).
#                       nachtblau_pollen_popup erbt es, der Popup-Inhalt
#                       bindet es selbst ein. Beschreibung am Template unten.
#
# Beide Popups haben dieselbe Oberflaeche (Nachtblau, Breite bis 720 px)
# und Lesbarkeitsregeln; Erklaerung der Breiten-Fesseln im DWD-Block.
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> alle fuenf Eintraege unter
#   "button_card_templates:" auf oberster Ebene ergaenzen.
#
# Voraussetzung: custom:button-card und browser_mod (HACS), Integrationen
# DWD-Wetterwarnungen (dwd_weather_warnings) und DWD Pollenflug (HACS,
# Region 101).
button_card_templates:
  nachtblau_dwd_popup:
    # Szenen-Bibliothek und Keyframes fuer die Karte, die dieses Template nutzt
    template: nachtblau_warn_fx
    tap_action:
      action: call-service
      service: browser_mod.popup
      service_data:
        title: Wetterwarnungen
        # Dialog-Oberflaeche auf Nachtblau statt Schwarz (wie im Navbar-Menue);
        # ha-dialog nimmt dafuer --card-background-color.
        # --mdc-dialog-scrim-color ist trotz mdc-Praefix noch aktiv: ha-dialog
        # liest sie (HA 2026.10, als legacy markiert) fuer die Abdunklung
        # hinter dem Popup - einen Nachfolger gibt es nicht, also bleibt sie.
        # Breite: min() statt Media-Query, damit ohne Umweg beides passt -
        # auf dem iPhone volle Viewport-Breite, auf dem Desktop bei 720px gedeckelt.
        # Seitenabstand: browser_mod >= 3.0 setzt --dialog-content-padding am
        # ha-dialog fest auf 0 und gibt Karten-Inhalt (content: {type: ...})
        # ein eigenes Padding von 8px links/rechts. Eine Variable von hier
        # kommt dort nicht an - die Inhaltsbreite steht deshalb unten in
        # widthCap und muss zu diesen 2x8px passen.
        style: |
          --ha-card-background: var(--nachtblau-huelle-oben, #1b2231);
          --card-background-color: var(--nachtblau-huelle-oben, #1b2231);
          --primary-background-color: var(--nachtblau-seite, #171d29);
          --secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);
          --primary-text-color: var(--nachtblau-text, #f2f5f8);
          --secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);
          --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
          --popup-min-width: min(100vw, 720px);
          --popup-max-width: min(100vw, 720px);
        content:
          type: custom:button-card
          # Eigene button-card im Popup: braucht Bibliothek und Keyframes selbst
          template: nachtblau_warn_fx
          entity: sensor.warnregion_aktuelle_warnstufe
          # Popup soll sich auch bei neuen Vorabinformationen aktualisieren
          triggers_update:
            - sensor.warnregion_aktuelle_warnstufe
            - sensor.warnregion_vorwarnstufe
          tap_action:
            action: none
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          styles:
            # Ohne diese Breiten-Fesseln sizet button-card sein Grid auf
            # max-content: der Beschreibungssatz stuende dann auf einer Zeile
            # und wuerde am rechten Dialogrand abgeschnitten statt umzubrechen.
            card:
              - padding: 0
              - border: none
              - box-shadow: none
              - background: none
              - width: 100%
              - max-width: 100%
              - box-sizing: border-box
            grid:
              - grid-template-areas: '"body"'
              - grid-template-columns: minmax(0, 1fr)
              - width: 100%
              - max-width: 100%
              - min-width: 0
            custom_fields:
              body:
                - width: 100%
                - max-width: 100%
                - min-width: 0
                - overflow: hidden
                # button-card haengt an diese Huelle class="ellipsis" mit
                # white-space: nowrap - hier direkt an der Quelle zuruecknehmen.
                - white-space: normal
          custom_fields:
            body: |
              [[[
                // ================= Popup: alle DWD-Warnungen normalisiert =================
                // Quelle: dwd_weather_warnings. Die Integration legt pro Warnung sowohl
                // Flach-Attribute (warning_N_name, warning_N_start, ...) als auch ein
                // Objekt warning_N { event, start_time, end_time, ... } an. Beide Formen
                // werden hier gelesen, damit die Karte integrationsversions-robust ist.

                // ---------- Nachtblau-Palette ----------
                const value = 'var(--nachtblau-text, #f2f5f8)';
                const soft  = 'var(--nachtblau-text-sekundaer, #8794a5)';
                // Kleine Schrift auf getoenten Chips im Block: Label haelt dort 4,5:1
                const label = 'var(--nachtblau-label, #b4c0cf)';
                const muted = 'var(--nachtblau-text-sekundaer, #8794a5)';
                const line  = 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                const panel = 'linear-gradient(180deg, var(--nachtblau-flaeche-erhoeht, #222b3c) 0%, var(--nachtblau-huelle-unten, #171d29) 100%)';
                // DWD-Farbe: dunkel wie bisher als Ton auf Toenung, hell nur als Flaeche
                // mit Navy- oder heller Schrift (DESIGN.md, "Sonderfarben im hellen Modus").
                // --nachtblau-dunkel-anteil ist im dunklen Modus 100 %, im hellen 0 %.
                const tint  = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
                const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--nachtblau-dunkel-anteil, 100%), ${hell})`;
                // Die Integration liefert eigene Farben (Stufe 1 z. B. ffeb3b statt der
                // Palettenwerte), deshalb die Schrift nach Kontrast waehlen statt nach Stufe.
                const NAVY = '#171d29', HELL = '#f2f5f8'; // Fuellung: Schrift auf der DWD-Flaeche, beide Modi gleich
                const rgbOf = (h) => {
                  const m = /^#([0-9a-f]{6})$/i.exec(String(h || '').trim());
                  return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null;
                };
                const lum = (c) => {
                  const k = c.map((v) => v / 255).map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
                  return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
                };
                const kr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
                const aufFlaeche = (c) => {
                  const r = rgbOf(c);
                  if (!r) return NAVY;
                  return kr(r, rgbOf(NAVY)) >= kr(r, rgbOf(HELL)) ? NAVY : HELL;
                };
                // Dunkel: der DWD-Ton als Schrift oder Icon nur, wenn er auf seiner
                // eigenen Toenung (anteil) ueber dem dunklen Grund ziel erreicht
                // (Schrift 4,5:1, Icon 3:1); sonst Hell. Die Flaeche bleibt im DWD-Ton.
                const GRUND = ['#222b3c', '#171d29']; // dunkler Grund des Popup-Blocks (oben, unten), nur fuer diese Rechnung
                const lesbar = (c, anteil, ziel) => {
                  const r = rgbOf(c);
                  if (!r) return c;
                  const ok = GRUND.every((g) => kr(r, rgbOf(g).map((v, i) => v * (1 - anteil) + r[i] * anteil)) >= ziel);
                  return ok ? c : HELL;
                };

                const esc = (s) => String(s === null || s === undefined ? '' : s)
                  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                // ---------- Breitenbegrenzung ----------
                // Die Karte haengt im Dialog in einer shrink-to-fit-Kette: dort ist
                // width/max-width 100% zirkulaer und setzt keine Grenze, der
                // Fliesstext bliebe einzeilig und liefe aus dem Viewport. Deshalb
                // eine *definite* Laenge: Popup-Breite minus das Karten-Padding von
                // browser_mod (>= 3.0: 8px links + 8px rechts, nicht einstellbar).
                // Handy: Popup = 100vw abzgl. Safe-Area links/rechts (Notch im
                // Querformat) -> davon nochmal 16px. Desktop: Popup = 720px
                // -> 704px. Ist die Grenze kleiner als der Platz, sitzt die Karte
                // links am Padding und der Rest landet rechts - genau so entstand
                // der ungleiche Rand (frueher 100vw - 28px: links 8px, rechts 20px).
                // Die Laenge steht in width, nicht nur in max-width: mit
                // width:100% schrumpfte der Inhalt in der shrink-to-fit-Kette auf
                // seinen Text (bei "Aktuell keine Warnungen" rund 270 px statt
                // 704 px). Zwei width-Deklarationen als Fallback-Kette:
                // verschachteltes calc() in min() haben aeltere WebKit-Versionen
                // nicht geparst, wodurch die ganze Deklaration weggefallen waere.
                // Bleibt min() unverstanden, greift weiterhin die 94vw-Zeile davor.
                //
                // white-space: normal ist hier der eigentliche Knackpunkt:
                // button-card rendert jede Custom-Field-Huelle als
                // <div id="body" class="ellipsis">, und .ellipsis setzt
                // white-space: nowrap. Das erbt der komplette Popup-Inhalt.
                // Die Boxen sind dann zwar korrekt breit, der Text bricht aber
                // nie um und quillt ueber den Kasten hinaus - deshalb blieb auch
                // overflow-wrap wirkungslos, das greift nur bei erlaubtem Umbruch.
                const widthCap = 'width:94vw;width:min(704px, 100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));max-width:100%;box-sizing:border-box;white-space:normal;';

                // ---------- Stufen-Normalisierung ----------
                // Farbe nur als Rueckfall, wenn die Integration keine liefert: dieselben
                // Werte wie sonst geliefert (CAP-DWD-Profil 2.1.13, Kap. 3.5)
                const lvlMeta = {
                  0: { label: 'Vorabinformation',  color: '#ff8080' },
                  1: { label: 'Wetterwarnung',     color: '#ffeb3b' },
                  2: { label: 'Markante Warnung',  color: '#fb8c00' },
                  3: { label: 'Unwetterwarnung',   color: '#e53935' },
                  4: { label: 'Extremes Unwetter', color: '#880e4f' }
                };
                // Sonderfarben nach Ereigniscode: UV, Starke Hitze, Extreme Hitze
                const sonderColor = { 246: '#fe68fe', 247: '#cc99ff', 248: '#9e46f8' };
                const urgencyLabel = {
                  immediate: 'sofort', expected: 'erwartet',
                  future: 'bevorstehend', past: 'vorbei', unknown: ''
                };

                // ---------- Zeit-Helfer ----------
                const toDate = (v) => {
                  if (v === undefined || v === null || v === '') return null;
                  const d = new Date(v);
                  return isNaN(d.getTime()) ? null : d;
                };
                const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                const dayLabel = (d) => {
                  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
                  const dd = new Date(d); dd.setHours(0, 0, 0, 0);
                  const diff = Math.round((dd - t0) / 86400000);
                  if (diff === 0) return 'Heute';
                  if (diff === 1) return 'Morgen';
                  if (diff === 2) return 'Übermorgen';
                  if (diff === -1) return 'Gestern';
                  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                };
                const span = (ms) => {
                  const m = Math.max(0, Math.round(ms / 60000));
                  if (m < 60) return m + ' Min.';
                  const h = Math.floor(m / 60), r = m % 60;
                  if (h < 24) return r ? `${h} Std. ${r} Min.` : `${h} Std.`;
                  const d = Math.round(h / 24);
                  return d === 1 ? '1 Tag' : `${d} Tage`;
                };
                const rangeText = (s, e) => {
                  if (s && e) {
                    return s.toDateString() === e.toDateString()
                      ? `${dayLabel(s)} ${fmtT(s)}–${fmtT(e)} Uhr`
                      : `${dayLabel(s)} ${fmtT(s)} Uhr – ${dayLabel(e)} ${fmtT(e)} Uhr`;
                  }
                  if (s) return `ab ${dayLabel(s)} ${fmtT(s)} Uhr`;
                  if (e) return `bis ${dayLabel(e)} ${fmtT(e)} Uhr`;
                  return 'Zeitraum unbekannt';
                };
                // Laufender Status statt roher Zeitstempel ("in 2 Tagen" statt "2 Tage")
                const spanIn = (ms) => span(ms).replace(/Tage$/, 'Tagen');
                const statusText = (s, e) => {
                  const now = new Date();
                  if (s && now < s) return { txt: 'beginnt in ' + spanIn(s - now), live: false };
                  if (e && now > e) return { txt: 'abgelaufen', live: false };
                  if (e) return { txt: 'läuft – endet in ' + spanIn(e - now), live: true };
                  return { txt: 'läuft', live: true };
                };

                // ---------- Szene und Icon: Template nachtblau_warn_fx ----------
                // Szene nach dem Ereigniscode warning_N_type, sonst nach dem Namen;
                // Icons kommen aus derselben Quelle wie in der Warnkarte.
                const wfx = variables.wfx;
                // Stufe 4: Kachel und Pille deckend in der DWD-Farbe, Schrift nach Kontrast,
                // Rand und Leuchten in Rot (gefuellte Rot-Kachel, DESIGN.md "Bausteine")
                const randRot = 'var(--nachtblau-fuellung-rand-rot, rgba(240, 115, 106, 0.5))';
                const leuchtenRot = 'var(--nachtblau-leuchten-rot, rgba(240, 115, 106, 0.5))';

                // ---------- Fliesstext / Handlungsempfehlungen normalisieren ----------
                // DWD liefert "Hinweis auf: \n · a\n\nHandlungsempfehlungen: \n · b"
                // -> Zwischenueberschriften + echte Bullet-Liste statt Rohtext.
                const blockify = (txt) => {
                  const lines = String(txt || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
                  if (!lines.length) return '';
                  let out = '', open = false;
                  const closeList = () => { if (open) { out += '</ul>'; open = false; } };
                  lines.forEach((l) => {
                    if (/^[·•\-\*]\s*/.test(l)) {
                      if (!open) { out += `<ul style="margin:2px 0 0;padding:0 0 0 16px;list-style:none;">`; open = true; }
                      const t = l.replace(/^[·•\-\*]\s*/, '');
                      out += `<li style="position:relative;font-size:13.5px;line-height:1.5;color:${value};margin:3px 0;overflow-wrap:anywhere;">`
                          +  `<span style="position:absolute;left:-14px;top:0;color:${muted};">•</span>${esc(t)}</li>`;
                    } else if (/[:：]$/.test(l)) {
                      closeList();
                      out += `<div style="font-size:11.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${soft};margin:10px 0 2px;overflow-wrap:anywhere;">${esc(l.replace(/[:：]$/, ''))}</div>`;
                    } else {
                      closeList();
                      out += `<div style="font-size:13.5px;line-height:1.55;color:${value};margin:4px 0;overflow-wrap:anywhere;">${esc(l)}</div>`;
                    }
                  });
                  closeList();
                  return out;
                };

                // ---------- Parameter normalisieren ----------
                // {"Windrichtung":"south-west","Böen":"~55 [km/h]"} -> Chips "Windrichtung · Südwest", "Böen · ca. 55 km/h"
                // Die Integration liefert manche Werte nur auf Englisch, obwohl der
                // Warntext deutsch ist. Uebersetzt werden nur belegte Werte: die
                // Himmelsrichtungen (Wortteile) und Ortsangaben, deren deutsche Fassung im
                // Warntext derselben Warnung steht. Unbekannte Werte bleiben, wie sie sind.
                const ORT = {
                  'particularly in valleys and dips': 'vor allem in Tal- und Muldenlagen' // FROST, 01.11.2026
                };
                const RICHTUNG = { north: 'Nord', east: 'Ost', south: 'Süd', west: 'West' };
                const paramChips = (params, color) => {
                  if (!params || typeof params !== 'object') return '';
                  const keys = Object.keys(params);
                  if (!keys.length) return '';
                  const clean = (v) => {
                    let t = String(v).replace(/\[([^\]]+)\]/g, '$1').replace(/\s+/g, ' ').trim();
                    const klein = t.toLowerCase();
                    if (ORT[klein]) return ORT[klein];
                    // "south-west" -> "Südwest", "north-north-east" -> "Nordnordost"
                    if (/^(north|east|south|west)(-(north|east|south|west))*$/.test(klein)) {
                      const teile = klein.split('-').map((x) => RICHTUNG[x]);
                      return teile[0] + teile.slice(1).join('').toLowerCase();
                    }
                    // "~-1 °C" -> "ca. -1 °C": die Tilde direkt vor dem Minus las sich als "~-"
                    t = t.replace(/^~\s*/, 'ca. ');
                    if (/^[a-zäöüß]+$/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
                    return t;
                  };
                  // Lange Werte (Ortsangaben koennen ganze Saetze sein) brechen im Chip um
                  // statt ueber den Rand zu laufen; die Bezeichnung bleibt einzeilig.
                  // Zeilenhoehe 1.3 mit 4px Innenabstand ergibt einzeilig dieselbe Hoehe
                  // wie zuvor 1 mit 6px; Radius 13px ist dort weiter eine Pille.
                  const chips = keys.map((k) =>
                    `<span style="display:inline-flex;align-items:baseline;gap:5px;max-width:100%;box-sizing:border-box;font-size:12px;line-height:1.3;background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid ${line};border-radius:13px;padding:4px 10px;">`
                    + `<span style="color:${label};flex:none;white-space:nowrap;">${esc(k)}</span>`
                    + `<span style="color:${value};font-weight:600;min-width:0;overflow-wrap:anywhere;">${esc(clean(params[k]))}</span></span>`
                  ).join('');
                  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">${chips}</div>`;
                };

                // ---------- Eine Warnung aus den Attributen lesen ----------
                const readWarning = (a, i) => {
                  const o = (a['warning_' + i] && typeof a['warning_' + i] === 'object') ? a['warning_' + i] : {};
                  const p = (k) => a['warning_' + i + '_' + k];
                  const lvlRaw = (p('level') !== undefined && p('level') !== null) ? p('level') : o.level;
                  return {
                    name:     p('name') || o.event || p('headline') || o.headline || 'Wetterwarnung',
                    headline: p('headline') || o.headline || '',
                    level:    parseInt(lvlRaw) || 0,
                    color:    p('color') || o.color || '',
                    desc:     p('description') || o.description || '',
                    instr:    p('instruction') || o.instruction || '',
                    start:    toDate(p('start') || p('start_time') || o.start_time || o.start),
                    end:      toDate(p('end') || p('end_time') || o.end_time || o.end),
                    params:   p('parameters') || o.parameters || {},
                    urgency:  String(p('urgency') || o.urgency || '').toLowerCase(),
                    // DWD-Ereigniscode (ii), waehlt die Szene; FROST = 22
                    type:     (p('type') !== undefined && p('type') !== null) ? p('type') : o.event_code
                  };
                };

                // ---------- Warnungsblock rendern ----------
                const renderWarning = (w, advance) => {
                  const meta  = lvlMeta[w.level] || lvlMeta[1];
                  const color = w.color || sonderColor[parseInt(w.type)] || meta.color;
                  const st    = statusText(w.start, w.end);
                  const dur   = (w.start && w.end) ? span(w.end - w.start) : '';
                  const urg   = urgencyLabel[w.urgency] || '';
                  const alarm  = !advance && w.level >= 3;
                  const extrem = !advance && w.level >= 4;
                  const key    = wfx.szene(w.type, w.name);
                  const szene  = wfx.fx(key, w.level, w.type, advance, 'popup');
                  const kachel = extrem
                    ? `background:${color};border:1px solid ${randRot};--wf-glow:${leuchtenRot};`
                    : `background:${modus(tint(color, 16), color)};border:1px solid ${modus(tint(color, 24), color)};--wf-glow:${tint(color, 50)};`;
                  const iconFarbe = extrem ? aufFlaeche(color) : modus(lesbar(color, 0.16, 3), aufFlaeche(color));

                  const pill = (txt, c, filled) =>
                    `<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:1;color:${filled ? modus(lesbar(c, 0.12, 4.5), value) : c};`
                    + `background:${filled ? tint(c, 12) : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'};border:1px solid ${filled ? tint(c, 24) : line};`
                    + `border-radius:999px;padding:4px 9px;white-space:nowrap;">${esc(txt)}</span>`;

                  const stufenPill = extrem
                    ? `<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:1;color:${aufFlaeche(color)};background:${color};border:1px solid ${randRot};border-radius:999px;padding:4px 9px;white-space:nowrap;">${esc(meta.label)}</span>`
                    : pill(advance ? 'Vorabinformation' : meta.label, color, true);
                  const pills = [
                    stufenPill,
                    st.live ? pill('aktiv', '#4ade80', true) : '',
                    (!st.live && urg) ? pill(urg, label, false) : ''
                  ].filter(Boolean).join('');

                  // Headline nur zeigen, wenn sie mehr aussagt als der Kurzname
                  const headlineExtra = (w.headline && w.headline.toUpperCase() !== w.name.toUpperCase())
                    ? `<div style="font-size:12.5px;color:${soft};line-height:1.35;margin-top:2px;overflow-wrap:anywhere;">${esc(w.headline)}</div>` : '';

                  return `
                    <div style="position:relative;overflow:hidden;background:${panel};border:1px solid ${line};border-left:3px solid ${color};border-radius:16px;padding:14px 16px;${widthCap}">
                      <div style="display:flex;align-items:flex-start;gap:12px;">
                        <div class="${alarm ? 'wf-alarm' : ''}${extrem ? ' l4' : ''}" style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-sizing:border-box;${kachel}">
                          ${wfx.icon(key, iconFarbe, 22)}
                        </div>
                        <div style="min-width:0;flex:${szene ? '0 1 auto' : '1 1 auto'};">
                          <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;color:${value};overflow-wrap:break-word;">${wfx.trenn(esc(w.name))}</div>
                          ${headlineExtra}
                          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${pills}</div>
                        </div>
                        ${szene ? `<div class="wf-slot pop">${szene}</div>` : ''}
                      </div>

                      <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:12px;padding-top:12px;border-top:1px solid ${line};">
                        <span style="font-size:13px;font-weight:600;color:${value};">${esc(rangeText(w.start, w.end))}</span>
                        <span style="font-size:12px;color:${muted};">${esc([dur ? 'Dauer ' + dur : '', st.txt].filter(Boolean).join(' · '))}</span>
                      </div>

                      ${w.desc ? `<div style="margin-top:10px;">${blockify(w.desc)}</div>` : ''}
                      ${paramChips(w.params, color)}
                      ${w.instr ? `<div style="margin-top:6px;">${blockify(w.instr)}</div>` : ''}
                    </div>`;
                };

                // ---------- Alle Warnungen beider Sensoren einsammeln ----------
                const sources = [
                  { id: 'sensor.warnregion_aktuelle_warnstufe', advance: false },
                  { id: 'sensor.warnregion_vorwarnstufe',       advance: true  }
                ];

                let blocks = '';
                let total = 0;
                let region = '';
                let stand = null;
                let attribution = 'Deutscher Wetterdienst';

                sources.forEach((src) => {
                  const s = states[src.id];
                  if (!s) return;
                  const a = s.attributes || {};
                  region = region || a.region_name || '';
                  const lu = toDate(a.last_update);
                  if (lu && (!stand || lu > stand)) stand = lu;
                  if (a.attribution) attribution = a.attribution.replace(/^Data provided by\s*/i, '');

                  const count = parseInt(a.warning_count) || 0;
                  if (!count) return;

                  const list = [];
                  for (let i = 1; i <= count; i++) list.push(readWarning(a, i));
                  // Hoechste Stufe zuerst, danach der frueheste Beginn
                  list.sort((x, y) => (y.level - x.level) || ((x.start ? x.start : 0) - (y.start ? y.start : 0)));

                  if (src.advance) {
                    blocks += `<div style="font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${muted};margin:6px 2px 0;">Vorabinformationen</div>`;
                  }
                  list.forEach((w) => { blocks += renderWarning(w, src.advance); total++; });
                });

                if (!total) {
                  blocks = `<div style="background:${panel};border:1px solid ${line};border-radius:16px;padding:22px 16px;text-align:center;${widthCap}">
                      <div style="font-size:14px;font-weight:600;color:${value};">Aktuell keine Warnungen</div>
                      <div style="font-size:12.5px;color:${muted};margin-top:4px;">Für ${esc(region || 'die Region')} liegt keine Warnung vor.</div>
                    </div>`;
                }

                const standTxt = stand
                  ? `Stand ${dayLabel(stand) === 'Heute' ? '' : dayLabel(stand) + ' '}${fmtT(stand)} Uhr`
                  : '';
                const footer = [esc(region), esc(standTxt), 'Quelle: ' + esc(attribution)]
                  .filter(Boolean).join(' · ');

                return `
                  <div style="display:flex;flex-direction:column;gap:10px;${widthCap}text-align:left;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                    ${blocks}
                    <div style="font-size:11.5px;color:${muted};line-height:1.45;padding:2px 2px 0;">${footer}</div>
                  </div>`;
              ]]]
  nachtblau_pollen_popup:
    # Stufen, Szenen und Keyframes fuer die Karte, die dieses Template nutzt
    template: nachtblau_pollen_fx
    tap_action:
      action: call-service
      service: browser_mod.popup
      service_data:
        title: Pollenflug
        # Oberflaeche, Breite und Seitenabstand wie im DWD-Popup oben
        style: |
          --ha-card-background: var(--nachtblau-huelle-oben, #1b2231);
          --card-background-color: var(--nachtblau-huelle-oben, #1b2231);
          --primary-background-color: var(--nachtblau-seite, #171d29);
          --secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);
          --primary-text-color: var(--nachtblau-text, #f2f5f8);
          --secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);
          --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
          --popup-min-width: min(100vw, 720px);
          --popup-max-width: min(100vw, 720px);
        content:
          type: custom:button-card
          # eigene button-card im Popup: braucht die Stufen aus der Bibliothek selbst
          template: nachtblau_pollen_fx
          entity: sensor.pollenflug_graeser_101
          triggers_update:
            - sensor.pollenflug_graeser_101
            - sensor.pollenflug_ambrosia_101
            - sensor.pollenflug_beifuss_101
            - sensor.pollenflug_birke_101
            - sensor.pollenflug_erle_101
            - sensor.pollenflug_esche_101
            - sensor.pollenflug_hasel_101
            - sensor.pollenflug_roggen_101
          tap_action:
            action: none
          show_name: false
          show_state: false
          show_icon: false
          show_label: false
          variables:
            pollen:
              - {name: Gräser, entity: sensor.pollenflug_graeser_101}
              - {name: Ambrosia, entity: sensor.pollenflug_ambrosia_101}
              - {name: Beifuß, entity: sensor.pollenflug_beifuss_101}
              - {name: Birke, entity: sensor.pollenflug_birke_101}
              - {name: Erle, entity: sensor.pollenflug_erle_101}
              - {name: Esche, entity: sensor.pollenflug_esche_101}
              - {name: Hasel, entity: sensor.pollenflug_hasel_101}
              - {name: Roggen, entity: sensor.pollenflug_roggen_101}
          styles:
            # Breiten-Fesseln wie im DWD-Popup: sonst sizet button-card auf
            # max-content und der Text bricht nicht um
            card:
              - padding: 0
              - border: none
              - box-shadow: none
              - background: none
              - width: 100%
              - max-width: 100%
              - box-sizing: border-box
            grid:
              - grid-template-areas: '"body"'
              - grid-template-columns: minmax(0, 1fr)
              - width: 100%
              - max-width: 100%
              - min-width: 0
            custom_fields:
              body:
                - width: 100%
                - max-width: 100%
                - min-width: 0
                - overflow: hidden
                - white-space: normal
          custom_fields:
            body: |
              [[[
                // ================= Popup: Pollenflug heute, morgen, uebermorgen =================
                // Quelle: DWD Pollenflug (hacs_dwd_pollenflug). Zustand = heute,
                // Attribute state_tomorrow / state_in_2_days und *_desc.
                // Werte 0 bis 3 in halben Stufen; Text und Farbe aus pfx.stufe()
                // (nachtblau_pollen_fx), wie in nachtblau_pollen_kachel.
                const value = 'var(--nachtblau-text, #f2f5f8)';
                const muted = 'var(--nachtblau-text-sekundaer, #8794a5)';
                const label = 'var(--nachtblau-label, #b4c0cf)';
                const line  = 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                const panel = 'linear-gradient(180deg, var(--nachtblau-flaeche-erhoeht, #222b3c) 0%, var(--nachtblau-huelle-unten, #171d29) 100%)';
                const tint  = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
                const esc = (s) => String(s === null || s === undefined ? '' : s)
                  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                // Breite wie im DWD-Popup (browser_mod >= 3.0: 2 x 8 px Kartenrand),
                // als width, damit der Inhalt nicht auf seinen Text schrumpft
                const widthCap = 'width:94vw;width:min(704px, 100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));max-width:100%;box-sizing:border-box;white-space:normal;';

                // Halbe Stufen zaehlen seit 14.11.2026 zur hoeheren Farbe (1,5 Amber, 2,5 Koralle)
                // Ohne Wert: "keine Daten", wenn der Sensor selbst keinen liefert; fehlt nur
                // die Vorhersage (DWD "-1", meist uebermorgen), "ohne Angabe" wie in der Kachel
                const stufe = (v, daten) => {
                  const st = variables.pfx.stufe(v);
                  if (st.wert === null) return { txt: daten ? 'ohne Angabe' : 'keine Daten', c: muted, an: false };
                  if (!st.an) return { txt: 'keine', c: muted, an: false };
                  return { txt: st.kurz, c: st.c, an: true };
                };
                const toDate = (v) => { const d = v ? new Date(v) : null; return d && !isNaN(d.getTime()) ? d : null; };
                const fmt = (d) => d.toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

                const TAGE = [['Heute', null, 'state_today_desc'], ['Morgen', 'state_tomorrow', 'state_tomorrow_desc'], ['Übermorgen', 'state_in_2_days', 'state_in_2_days_desc']];

                let stand = null, naechste = null;
                const rows = (variables.pollen || []).map((p) => {
                  const s = states[p.entity];
                  const a = s ? (s.attributes || {}) : {};
                  const lu = toDate(a.last_update); if (lu && (!stand || lu > stand)) stand = lu;
                  const nu = toDate(a.next_update); if (nu && (!naechste || nu < naechste)) naechste = nu;
                  const daten = !!s && !isNaN(parseFloat(s.state));
                  const tage = TAGE.map(([t, key, desc]) => {
                    const v = key ? a[key] : (s ? s.state : NaN);
                    return { tag: t, v: parseFloat(v), st: stufe(v, daten), desc: a[desc] || '' };
                  });
                  const max = Math.max(...tage.map((t) => (isNaN(t.v) ? 0 : t.v)));
                  return { name: p.name, tage, max };
                }).sort((x, y) => y.max - x.max);

                // "keine" in Label-Grau: Sekundaer-Grau fiele auf der neutralen
                // Kachel im hellen Teil des Blockverlaufs dunkel auf 4,35:1
                const chip = (t) => `
                  <div style="min-width:0;padding:7px 9px;border-radius:12px;background:${t.st.an ? tint(t.st.c, 12) : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'};border:1px solid ${t.st.an ? tint(t.st.c, 24) : line};">
                    <div style="font-size:11px;color:${label};">${t.tag}</div>
                    <div style="font-size:13px;font-weight:700;color:${t.st.an ? t.st.c : label};line-height:1.3;">${esc(t.st.txt)}</div>
                    ${t.desc && t.st.an ? `<div style="font-size:11px;color:${label};line-height:1.3;overflow-wrap:anywhere;">${esc(t.desc)}</div>` : ''}
                  </div>`;

                const aktiv = rows.filter((r) => r.max > 0);
                const ruhig = rows.filter((r) => r.max <= 0);

                const block = (r) => `
                  <div style="background:${panel};border:1px solid ${line};border-radius:16px;padding:12px 14px;${widthCap}">
                    <div style="font-size:15px;font-weight:700;color:${value};margin-bottom:8px;">${esc(r.name)}</div>
                    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:6px;">${r.tage.map(chip).join('')}</div>
                  </div>`;

                const leer = ruhig.length
                  ? `<div style="background:${panel};border:1px solid ${line};border-radius:16px;padding:12px 14px;${widthCap}">
                       <div style="font-size:13.5px;font-weight:600;color:${value};">${aktiv.length ? 'Ohne Belastung' : 'Aktuell keine Belastung'}</div>
                       <div style="font-size:12.5px;color:${muted};margin-top:3px;">${esc(ruhig.map((r) => r.name).join(', '))} · heute, morgen und übermorgen</div>
                     </div>`
                  : '';

                const footer = [
                  stand ? 'Stand ' + fmt(stand) + ' Uhr' : '',
                  naechste ? 'nächste Vorhersage ' + fmt(naechste) + ' Uhr' : '',
                  'Quelle: Deutscher Wetterdienst'
                ].filter(Boolean).join(' · ');

                return `
                  <div style="display:flex;flex-direction:column;gap:10px;${widthCap}text-align:left;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                    ${aktiv.map(block).join('')}
                    ${leer}
                    <div style="font-size:11.5px;color:${muted};line-height:1.45;padding:2px 2px 0;">${footer}</div>
                  </div>`;
              ]]]
    hold_action:
      action: more-info

  # ==========================================================================
  # nachtblau_pollen_kachel -- Pollenkachel fuer Wetter-View und Home
  # --------------------------------------------------------------------------
  # Seit 14.11.2026 (Entwuerfe pollen-kachel.html, home-pollen.html): hoechste
  # Stufe von heute als Pille, alle belasteten Arten, Szenen aus
  # nachtblau_pollen_fx im Wechsel (je 5 s; Name und Spur der gezeigten Art
  # heben sich hervor) und der Verlauf heute/morgen/uebermorgen je Art. Erst
  # ab morgen belastet: Vorschau "Ab morgen ...". Tippen und Bibliothek ueber
  # nachtblau_pollen_popup.
  #
  # Zwei Einsatzorte:
  #   ohne kopf  Kachel ohne eigene Huelle, steht immer da (Wetter-View,
  #              Raster in "Warnlage & Pollen"; ruhige Kachel ohne Belastung)
  #   kopf: true eigene Nachtblau-Huelle mit Kopf "Pollenflug" (Home,
  #              pollenflug-karte-v2.yaml); blendet sich aus, solange weder
  #              heute noch morgen eine Art belastet ist
  # Keine Minutenuhr noetig: Die Sensoren rechnen jede volle Stunde neu, auch
  # um Mitternacht; gleiche Werte ergeben denselben HTML-Text, die Szenen
  # starten also nicht neu.
  # ==========================================================================
  nachtblau_pollen_kachel:
    template: nachtblau_pollen_popup
    entity: sensor.pollenflug_graeser_101
    triggers_update:
      - sensor.pollenflug_graeser_101
      - sensor.pollenflug_ambrosia_101
      - sensor.pollenflug_beifuss_101
      - sensor.pollenflug_birke_101
      - sensor.pollenflug_erle_101
      - sensor.pollenflug_esche_101
      - sensor.pollenflug_hasel_101
      - sensor.pollenflug_roggen_101
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    variables:
      kopf: false
      pollen:
        - {name: Gräser, entity: sensor.pollenflug_graeser_101}
        - {name: Ambrosia, entity: sensor.pollenflug_ambrosia_101}
        - {name: Beifuß, entity: sensor.pollenflug_beifuss_101}
        - {name: Birke, entity: sensor.pollenflug_birke_101}
        - {name: Erle, entity: sensor.pollenflug_erle_101}
        - {name: Esche, entity: sensor.pollenflug_esche_101}
        - {name: Hasel, entity: sensor.pollenflug_hasel_101}
        - {name: Roggen, entity: sensor.pollenflug_roggen_101}
      # kopf: sichtbar, wenn heute oder morgen eine Art belastet ist (Vorschau)
      sichtbar: |
        [[[
          return (variables.pollen || []).some((p) => {
            const s = states[p.entity];
            if (!s) return false;
            const h = parseFloat(s.state), m = parseFloat(s.attributes ? s.attributes.state_tomorrow : NaN);
            return (!isNaN(h) && h > 0) || (!isNaN(m) && m > 0);
          });
        ]]]
    styles:
      card:
        - padding: '[[[ return variables.kopf === true ? "16px 18px" : "0"; ]]]'
        - border-radius: '[[[ return variables.kopf === true ? "22px" : "0"; ]]]'
        - background: '[[[ return variables.kopf === true ? "linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)" : "none"; ]]]'
        - border: '[[[ return variables.kopf === true ? "1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))" : "none"; ]]]'
        - box-shadow: '[[[ return variables.kopf === true ? "0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))" : "none"; ]]]'
        - overflow: '[[[ return variables.kopf === true ? "hidden" : "visible"; ]]]'
        - display: '[[[ return (variables.kopf !== true || variables.sichtbar) ? "block" : "none"; ]]]'
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
          # button-card setzt class="ellipsis" (nowrap): Umbruch erlauben
          - white-space: normal
    custom_fields:
      body: |
        [[[
          const value = 'var(--nachtblau-text, #f2f5f8)', muted = 'var(--nachtblau-text-sekundaer, #8794a5)', label = 'var(--nachtblau-label, #b4c0cf)';
          const green = 'var(--nachtblau-gruen, #a6d49e)', amber = 'var(--nachtblau-amber, #e6b566)';
          const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
          const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--nachtblau-dunkel-anteil, 100%), ${hell})`;
          const esc = (x) => String(x === null || x === undefined ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const pfx = variables.pfx;
          // kopf (Home, pollenflug-karte-v2.yaml): eigener Kopf ueber der Kachel, Huelle ueber styles.card
          const kopf = variables.kopf === true;
          const mitKopf = (inhalt, c) => !kopf ? inhalt : `
            <div style="display:flex;flex-direction:column;gap:6px;">
              <div style="display:flex;align-items:center;gap:14px;padding:2px 2px 8px;">
                <div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:${tint(c, 16)};border:1px solid ${tint(c, 24)};">${pfx.icon('blume', c, 23)}</div>
                <div style="min-width:0;text-align:left;">
                  <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${value};">Pollenflug</div>
                  <div style="font-size:12.5px;color:${muted};margin-top:2px;">Tippen für Details</div>
                </div>
              </div>
              ${inhalt}
            </div>`;
          const zahl = (v) => (v === null || v === undefined || v === '' || isNaN(parseFloat(v))) ? null : parseFloat(v);

          // ---------- Alle Arten: heute (Zustand), morgen, uebermorgen ----------
          let naechste = null, daten = false;
          const liste = (variables.pollen || []).map((p) => {
            const s = states[p.entity], a = s && s.attributes ? s.attributes : {};
            const h = s ? zahl(s.state) : null;
            if (h !== null) daten = true;
            const nu = a.next_update ? new Date(a.next_update) : null;
            if (nu && !isNaN(nu.getTime()) && (!naechste || nu < naechste)) naechste = nu;
            return { name: p.name, form: pfx.form(p.name), h, m: zahl(a.state_tomorrow), u: zahl(a.state_in_2_days) };
          });
          const heute = liste.filter((p) => p.h > 0).sort((x, y) => (y.h - x.h) || ((y.m || 0) - (x.m || 0)));
          const neuMorgen = liste.filter((p) => !(p.h > 0) && p.m > 0).sort((x, y) => y.m - x.m);
          const spaeter = liste.filter((p) => !(p.h > 0) && !(p.m > 0) && p.u > 0);
          const vorschau = !heute.length && neuMorgen.length > 0;

          // ---------- Ruhige Kachel: keine Belastung oder keine Daten ----------
          const tag = (d) => {
            const t0 = new Date(); t0.setHours(0, 0, 0, 0);
            const dd = new Date(d); dd.setHours(0, 0, 0, 0);
            const diff = Math.round((dd - t0) / 86400000);
            return diff === 0 ? 'heute' : diff === 1 ? 'morgen' : d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
          };
          const ruhig = (titel, text, c) => `
            <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:${tint(c, 12)};border:1px solid ${tint(c, 24)};min-width:0;cursor:pointer;">
              <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${tint(c, 16)};border:1px solid ${tint(c, 24)};">${pfx.icon('blume', c, 22)}</div>
              <div style="min-width:0;text-align:left;">
                <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;color:${value};line-height:1.25;">${titel}</div>
                <div style="font-size:12px;color:${muted};margin-top:2px;line-height:1.35;">${text}</div>
              </div>
            </div>`;
          if (!daten) return mitKopf(ruhig('Keine Daten', 'DWD-Pollenflug', muted), muted);
          if (!heute.length && !vorschau) {
            const t = naechste ? `Nächste Vorhersage ${tag(naechste)} ${naechste.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}` : `Pollenflug · ${liste.length} Arten`;
            return mitKopf(ruhig('Keine Belastung', t, green), green);
          }

          // ---------- Kopfzeile ----------
          const zeige = vorschau ? neuMorgen : heute, n = zeige.length, top = zeige[0];
          const st = vorschau ? null : pfx.stufe(top.h);
          const c = vorschau ? amber : st.c;
          const titel = vorschau ? (n === 1 ? `Ab morgen ${top.name}` : `Ab morgen ${n} Pollenarten`) : (n === 1 ? top.name : `${n} Pollenarten`);
          const pillStil = 'display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:1;border-radius:999px;padding:3px 8px;white-space:nowrap;';
          const pill = (txt, farbe, schrift) => `<span style="${pillStil}color:${schrift};background:${tint(farbe, 12)};border:1px solid ${tint(farbe, 24)};">${esc(txt)}</span>`;
          const neutral = (txt) => `<span style="${pillStil}color:${label};background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));">${esc(txt)}</span>`;
          // Vorschau: Amber-Schrift auf zweifacher Toenung dunkel 5,18:1, hell Primaertext
          let pills = vorschau ? pill('Vorschau', amber, modus(amber, value)) : pill(st.titel, c, st.pille);
          if (!vorschau) {
            const maxH = top.h, morgen = heute.map((p) => p.m).concat(neuMorgen.map((p) => p.m)).filter((v) => v !== null);
            // Trend nur bei mehreren Arten; bei einer steht der Ausblick in der zweiten Zeile
            if (neuMorgen.length) pills += neutral(`+${neuMorgen.length} ab morgen`);
            else if (n > 1 && morgen.length && Math.max(...morgen) > maxH) pills += neutral('Morgen stärker');
            else if (n > 1 && morgen.length && Math.max(...morgen) < maxH) pills += neutral('Morgen schwächer');
          }
          const kurz = (v) => pfx.stufe(v).kurz;
          const zeile2 = n === 1
            ? `<div style="font-size:12px;color:${muted};line-height:1.35;">${esc(`Morgen ${kurz(top.m)}, übermorgen ${kurz(top.u)}`)}</div>`
            : `<div style="font-size:12.5px;color:${muted};line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;">${zeige.slice(0, 4).map((p, i) => `<span class="wl-name" style="${pfx.wechselStil('name', i, n)}">${esc(p.name)}</span>`).join(' · ')}${n > 4 ? ` · +${n - 4}` : ''}</div>`;

          // ---------- Szenen im Wechsel ----------
          const s4 = zeige.slice(0, 4);
          const szene = pfx.wechsel(s4.map((p) => ({ form: p.form, wert: vorschau ? p.m : p.h, vorschau })));

          // ---------- Verlauf: je Art eine Spur, heute / morgen / uebermorgen ----------
          // Ohne Angabe (DWD "-1") schraffiert; die Spur der gezeigten Art hebt sich mit hervor
          const zelle = (v) => v === null
            ? `<i style="height:4px;border-radius:2px;background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--nachtblau-wolkengrau, #cdd6e0) 40%, transparent) 0 2px, rgba(205, 214, 224, 0) 2px 4px);"></i>`
            : `<i style="height:4px;border-radius:2px;background:${v > 0 ? pfx.stufe(v).c : 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'};"></i>`;
          const spuren = heute.concat(neuMorgen, spaeter).map((p) => {
            const i = s4.indexOf(p);
            const hl = s4.length > 1 ? (i >= 0 ? pfx.wechselStil('lane', i, s4.length) : 'opacity:0.45;') : '';
            return `<div class="wl-lane" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:2px;${hl}">${zelle(p.h)}${zelle(p.m)}${zelle(p.u)}</div>`;
          }).join('');
          const verlauf = `<div style="display:flex;flex-direction:column;gap:3px;">
              <div style="display:flex;flex-direction:column;gap:2px;">${spuren}</div>
              <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:2px;font-size:11px;color:${label};"><span>Heute</span><span style="text-align:center;">Morgen</span><span style="text-align:right;">Übermorgen</span></div>
            </div>`;

          const kachel = `
            <div style="position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:${tint(c, 12)};border:1px solid ${tint(c, 24)};min-width:0;cursor:pointer;text-align:left;color:${value};">
              <div style="display:flex;align-items:center;gap:12px;position:relative;">
                <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${tint(c, 16)};border:1px solid ${tint(c, 24)};">${pfx.icon(top.form, c, 22)}</div>
                <div style="min-width:0;flex:0 1 auto;display:flex;flex-direction:column;gap:4px;">
                  <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${esc(titel)}</div>
                  <div style="display:flex;flex-wrap:wrap;gap:5px;">${pills}</div>
                  ${zeile2}
                </div>
                <div class="pf-slot" style="margin:-12px -14px -4px 0;">${szene}</div>
              </div>
              ${verlauf}
            </div>`;
          return mitKopf(kachel, c);
        ]]]

  # ==========================================================================
  # nachtblau_warn_fx -- animierte Szene je DWD-Warnereignis
  # --------------------------------------------------------------------------
  # Genutzt von nachtblau_dwd_popup (erbt es, damit Warnkarte und "Warnlage &
  # Pollen" die Bibliothek haben) und vom Popup-Inhalt selbst (eigene
  # button-card, eigenes Shadow-DOM, braucht die Keyframes noch einmal).
  # Entwurf, Varianten und Entscheidungen: warnung-animiert.html.
  #
  # Szene nach dem Ereigniscode warning_N_type (DWD-ii-Code, CAP-DWD-Profil
  # 2.1.13, Kap. 3.1); fehlt er, nach dem Namen wie bisher beim Icon. Bei
  # Gewittern bestimmt der Code auch Regen, Hagel und Boeen (Gruppen RAIN,
  # HAIL, WIND, Kap. 3.3; nur Pflicht-Mitglieder, nicht die geklammerten).
  # Stufe (warning_N_level) skaliert Dichte und Tempo, ab Stufe 3 roter Schein.
  #
  # Aufbau:
  #   variables.wfx  Bibliothek, einmal pro Seite in window.__nachtblauWarnFx.
  #                  VERSION bei jeder Aenderung erhoehen.
  #     szene(ii, name)          -> Szenenschluessel ('keine' = ohne Szene)
  #     fx(szene, stufe, ii, vorab, ort)  -> HTML der Ebene (ort 'karte'|'popup')
  #     icon(szene, farbe, px)   -> SVG mit Animationsklassen
  #     kurz(name)               -> { titel, zusatz } (Schnitt am " mit ")
  #     trenn(html)              -> weiche Trennstellen fuer lange Namen
  #                                 (Gross- und Kleinschreibung egal, ab VERSION 4)
  #     schreib(text, anfang)    -> DWD-Namen in Normalschreibung (ab VERSION 4):
  #                                 "SCHWERES GEWITTER" -> "Schweres Gewitter",
  #                                 "mit HEFTIGEM STARKREGEN" -> "mit heftigem
  #                                 Starkregen", "UV-INDEX" -> "UV-Index"
  #     wechsel(szenen)          -> mehrere Szenen im Wechsel, je 5 s (ab VERSION 3,
  #                                 Warnlage-Kachel der Wetter-View)
  #     wechselStil(art, i, n)   -> dieselbe Taktung fuer Punkte und Text
  #   extra_styles   Keyframes und Klassen der Ebene ".wf".
  #
  # Die Karte setzt die Ebene als letztes Flex-Kind in ihre Zeile
  # (<div class="wf-slot">...</div>): Sie beginnt dadurch genau rechts neben
  # dem Text, ohne Messung, und reicht ueber negative Raender bis an den
  # Kartenrand. Text steht nie auf der Animation; die Ebene blendet ueber
  # 26 px ein, mindestens 64 px (Popup 72 px) bleiben fuer sie.
  #
  # Farben nur aus design/palette.yaml (DESIGN.md, "Animierte Hintergruende"):
  # Wolken, Nebel, Wind Wolkengrau; dunkle Wolken Muted; Regen, Frostschein
  # Blau; Schnee, Eis, Kristalle Weiss mit Deckkraft; Blitz Weiss 0,18; UV
  # Sonnengelb; Hitze Koralle (Stufe 1) und Rot (ab Stufe 3); Schein Rot.
  # Heller Modus ueber --nachtblau-dunkel-anteil: jedes Element nimmt den
  # Tiefton seiner Rolle mit dem Faktor aus DESIGN.md, "Wetteranimation im
  # hellen Modus" (Wolke x1,8, Regen x1,33, Weiss -> Eis hell x1,88, Blitz ->
  # Sonnengelb 0,72, Schein x1).
  #
  # "Bewegung reduzieren" zeigt ein Standbild (Animationen pausiert, SMIL
  # weggelassen). Blitz: Doppelblitz alle 8 s (WCAG 2.3.1).
  # ==========================================================================
  nachtblau_warn_fx:
    variables:
      wfx: |
        [[[
          const VERSION = 4, alt = window.__nachtblauWarnFx;
          if (alt && alt.version === VERSION) return alt;

          const ruhig = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          // Feste Pseudo-Zufallswerte: gleicher Zustand -> gleicher HTML-Text
          const R = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
          const f2 = (n) => n.toFixed(2);

          // ---------- Ereigniscodes -> Szene (CAP-DWD-Profil 2.1.13) ----------
          const SZENE = {};
          const setz = (s, codes) => codes.forEach((c) => { SZENE[c] = s; });
          setz('gewitter', [31, 33, 34, 36, 38, 40, 41, 42, 44, 45, 46, 48, 49, 90, 91, 92, 93, 95, 96]);
          setz('wind', [11, 12, 13, 51, 52, 53, 54, 55, 56, 57, 58]);
          setz('nebel', [59]);
          setz('starkregen', [61, 62, 66]);
          setz('dauerregen', [63, 64, 65]);
          setz('schnee', [70, 71, 72, 73]);
          setz('verwehung', [74, 75, 76]);
          setz('leiter', [79]);
          setz('frost', [22, 82]);
          setz('glaette', [84, 87]);
          setz('glatteis', [85, 86]);
          setz('tauwetter', [88, 89]);
          setz('uv', [246]);
          setz('hitze', [247, 248]);
          const GRP_WIND = [33, 36, 38, 40, 41, 44, 45, 48, 49, 96];
          const GRP_RAIN = [34, 36, 38, 42, 44, 45, 46, 48, 49, 95, 96];
          const GRP_HAIL = [38, 46, 48, 49, 95, 96];

          // Rueckfall ohne Code: Namenserkennung, Gewitter zuerst
          const nachName = (n) => {
            const s = String(n || '').toLowerCase();
            if (/(gewitter|blitz)/.test(s)) return 'gewitter';
            if (/verwehung/.test(s)) return 'verwehung';
            if (/(wind|böen|boen|sturm|orkan)/.test(s)) return 'wind';
            if (/dauerregen|ergiebig/.test(s)) return 'dauerregen';
            if (/regen/.test(s)) return 'starkregen';
            if (/schnee/.test(s)) return 'schnee';
            if (/frost/.test(s)) return 'frost';
            if (/glatteis/.test(s)) return 'glatteis';
            if (/(glätte|glaette)/.test(s)) return 'glaette';
            if (/tauwetter/.test(s)) return 'tauwetter';
            if (/leiterseil/.test(s)) return 'leiter';
            if (/(hitze|wärme|waerme)/.test(s)) return 'hitze';
            if (/(uv|sonne)/.test(s)) return 'uv';
            if (/nebel/.test(s)) return 'nebel';
            return 'keine';
          };
          const szene = (ii, name) => SZENE[parseInt(ii)] || nachName(name);

          // "SCHWERES GEWITTER mit ORKANBÖEN, ..." -> Titel und Zusatzzeile
          const kurz = (name) => {
            const n = String(name || ''), i = n.indexOf(' mit ');
            return i > 0 ? { titel: n.slice(0, i), zusatz: n.slice(i + 1) } : { titel: n, zusatz: '' };
          };
          const trenn = (html) => String(html || '')
            .replace(/(LEITERSEIL)(SCHWINGUNGEN)/i, '$1&shy;$2')
            .replace(/(SCHNEE)(VERWEHUNG)/i, '$1&shy;$2')
            .replace(/(VORAB)(INFORMATION)/i, '$1&shy;$2');

          // DWD schreibt die Ereignisnamen gross ("SCHWERES GEWITTER mit
          // HEFTIGEM STARKREGEN"). Normalschreibung: Substantive gross, die
          // Adjektive klein, am Anfang (anfang = true) gross. KLEIN sind alle
          // Adjektive und Adverbien aus den Ereignislisten des CAP-DWD-Profils
          // 2.1.13, Kap. 3.1.1 bis 3.1.5; unbekannte Woerter gelten als
          // Substantiv. Bindestrich-Teile einzeln (UV bleibt Abkuerzung),
          // Woerter mit Kleinbuchstaben ("mit", Hochsee "schwerer Sturm")
          // bleiben, nur am Anfang wird der erste Buchstabe gross.
          const KLEIN = new Set(['starkes', 'starker', 'starke', 'schweres', 'schwere',
            'extrem', 'extreme', 'extremes', 'extremen', 'heftiger', 'heftigem',
            'ergiebiger', 'orkanartige', 'leichter', 'strenger', 'geringe']);
          const ABK = new Set(['UV']);
          const gross1 = (t) => t.charAt(0).toUpperCase() + t.slice(1);
          const schreibWort = (x, anfang) => {
            if (x !== x.toUpperCase() || !/[A-ZÄÖÜ]/.test(x)) return anfang ? gross1(x) : x;
            return x.split('-').map((t, j) => {
              if (ABK.has(t)) return t;
              const klein = t.toLowerCase();
              return (KLEIN.has(klein.replace(/[^a-zäöüß]/g, '')) && !(anfang && j === 0)) ? klein : gross1(klein);
            }).join('-');
          };
          const schreib = (text, anfang = true) => String(text || '').split(' ')
            .map((x, i) => schreibWort(x, anfang && i === 0)).join(' ');

          // Stufe -> Dichte k und Tempo t (Vorabinformation: 0)
          const LV = { 0: { k: 0.8, t: 0.7 }, 1: { k: 1, t: 1 }, 2: { k: 1.35, t: 1.15 }, 3: { k: 1.75, t: 1.3 }, 4: { k: 2.2, t: 1.5 } };

          // ---------- Bausteine ----------
          const wolken = (dunkel, n) => [[8, 4, 62, 0.24, 9, 0.1], [46, 18, 50, 0.24, 11, 0.6], [24, 30, 44, 0.18, 10, 0.35]].slice(0, n)
            .map(([x, y, w, o, d, p]) => `<div class="wf-cl${dunkel ? ' dunkel' : ''}" style="--x:${x}%;--y:${y}%;--w:${w}px;--o:${dunkel ? o : o / 2};--d:${d}s;--p:${p}"></div>`).join('');
          const tropfen = (n, basis, len, t) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              const x = ((i + R(i, 1) * 0.8) / n * 100).toFixed(1);
              const d = (basis * (0.85 + 0.3 * R(i, 2)) / t).toFixed(2);
              h += `<i class="wf-dr" style="--x:${x}%;--d:${d}s;--p:${f2(R(i, 3))};--len:${len}px;--a:${i % 3 === 0 ? 0.5 : 0.24}"></i>`;
            }
            return h;
          };
          const flocken = (n, basis, gr, t, hagel) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              const x = ((i + R(i, 21) * 0.8) / n * 100).toFixed(1);
              const d = (basis * (0.8 + 0.4 * R(i, 22)) / t).toFixed(2);
              h += `<i class="wf-fl${hagel ? ' hagel' : ''}" style="--x:${x}%;--d:${d}s;--p:${f2(R(i, 23))};--s:${gr}px;--sw:${(2 + R(i, 24) * 2).toFixed(1)}s"></i>`;
            }
            return h;
          };
          const fall = (inner, neig) => `<div class="wf-fall" style="--neig:${neig}deg">${inner}</div>`;
          const ringe = (n, t, weiss, unten) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              h += `<i class="wf-sp${weiss ? ' weiss' : ''}" style="--x:${(12 + (i + R(i, 31) * 0.7) / n * 80).toFixed(1)}%;--d:${(1.1 / t * (0.8 + 0.4 * R(i, 32))).toFixed(2)}s;--p:${f2(R(i, 33))};${unten ? '--b:' + unten + ';' : ''}"></i>`;
            }
            return h;
          };
          const schlieren = (n, basis, len, t, boe, weiss) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              const y = (14 + (i + R(i, 4) * 0.9) / n * 72).toFixed(1);
              const d = (basis * (0.8 + 0.4 * R(i, 5)) / t).toFixed(2);
              const w = Math.round(len * (0.7 + 0.6 * R(i, 7)));
              h += `<div class="wf-dw" style="--y:${y}%;--w:${w}px;--d:${d}s;--p:${f2(R(i, 6))}"><i class="wf-st${boe ? ' boe' : ''}${weiss ? ' weiss' : ''}" style="--a:${i % 2 === 0 ? 0.5 : 0.24};--wv:${(1.4 + R(i, 8) * 1.6).toFixed(2)}s"></i></div>`;
            }
            return h;
          };
          const treiben = (n, basis, t) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              const y = (8 + (i + R(i, 41) * 0.9) / n * 80).toFixed(1);
              const d = (basis * (0.75 + 0.5 * R(i, 42)) / t).toFixed(2);
              const s = R(i, 43) > 0.6 ? 3.5 : 2.5;
              h += `<div class="wf-dw" style="--y:${y}%;--w:${s}px;--d:${d}s;--p:${f2(R(i, 44))}"><i class="wf-bf" style="--s:${s}px;--wv:${(0.8 + R(i, 45)).toFixed(2)}s"></i></div>`;
            }
            return h;
          };
          const blitz = '<div class="wf-flash"></div><svg class="wf-bolt" viewBox="0 0 18 46" fill="none"><path d="M11 0 4 20h7L5 46" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
          const nebel = (t) => [[6, 30, 22, 0.1], [32, 34, 28, 0.5], [60, 30, 20, 0.8], [80, 26, 26, 0.3]]
            .map(([y, hh, d, p]) => `<div class="wf-fog" style="--y:${y}%;--h:${hh}%;--d:${(d / t).toFixed(1)}s;--p:${p}"></div>`).join('');
          // Eiskristall: Die sechs Arme wachsen von der Mitte nach aussen, die
          // Seitenzweige erst danach; jedes Teil ist unsichtbar, bis es waechst.
          // (Bis VERSION 1 lief jeder Arm von Spitze zu Spitze und die Zweige
          // gleichzeitig; im Wachsen sah der Kristall aus wie ein Ladekreisel.)
          const ARME = 'M12 12V2.5M12 12V21.5M12 12 20.23 7.25M12 12 3.77 16.75M12 12 20.23 16.75M12 12 3.77 7.25';
          const ZWEIGE = 'M12 17.7l-2.12 2.12M12 17.7l2.12 2.12M7.06 14.85l-2.9-.78M7.06 14.85l-.78 2.9M7.06 9.15l-.78-2.9M7.06 9.15l-2.9.78M12 6.3l2.12-2.12M12 6.3l-2.12-2.12M16.94 9.15l2.9.78M16.94 9.15l.78-2.9M16.94 14.85l.78 2.9M16.94 14.85l2.9-.78';
          const teile = (pfad, cls) => pfad.split('M').filter(Boolean).map((seg) => `<path class="${cls}" pathLength="1" d="M${seg}"/>`).join('');
          const KRISTALL = 'M12 2.5V21.5M20.23 7.25 3.77 16.75M20.23 16.75 3.77 7.25M12 17.7l-2.12 2.12M12 17.7l2.12 2.12M7.06 14.85l-2.9-.78M7.06 14.85l-.78 2.9M7.06 9.15l-.78-2.9M7.06 9.15l-2.9.78M12 6.3l2.12-2.12M12 6.3l-2.12-2.12M16.94 9.15l2.9.78M16.94 9.15l.78-2.9M16.94 14.85l.78 2.9M16.94 14.85l2.9-.78';
          const kristall = (x, y, s, d, p) => `<svg class="wf-cr" style="--x:${x}%;--y:${y}%;--s:${s}px;--d:${d}s;--p:${p}" viewBox="0 0 24 24">`
            + teile(ARME, 'arm') + teile(ZWEIGE, 'zweig') + '</svg>';
          const funkeln = (n, oben, hoehe, t) => {
            let h = '';
            for (let i = 0; i < n; i++) {
              h += `<i class="wf-spk" style="--x:${(30 + R(i, 51) * 64).toFixed(1)}%;--y:${(oben + R(i, 52) * hoehe).toFixed(1)}%;--s:${R(i, 53) > 0.6 ? 7 : 5}px;--d:${((1.8 + R(i, 54) * 2.2) / t).toFixed(2)}s;--p:${f2(R(i, 55))}"></i>`;
            }
            return h;
          };
          const zapfen = (n, t) => {
            let h = '<div class="wf-icebar"></div>';
            for (let i = 0; i < n; i++) {
              const x = (32 + (i + R(i, 61) * 0.6) / n * 62).toFixed(1), w = 5 + Math.round(R(i, 62) * 3), hh = 12 + Math.round(R(i, 63) * 14);
              h += `<i class="wf-icl" style="--x:${x}%;--w:${w}px;--h:${hh}px"></i><i class="wf-dp" style="--x:${x}%;--w:${w}px;--h:${hh}px;--d:${(2.6 / t * (0.8 + 0.4 * R(i, 64))).toFixed(2)}s;--p:${f2(R(i, 65))}"></i>`;
            }
            return h;
          };
          const pegel = (cls, h, d) => `<div class="wf-lvl${cls}" style="--h:${h}%;--d:${d.toFixed(1)}s"></div>`;
          // Hitze: aufsteigende Waerme (Entscheidung 14.11.2026, warnung-animiert.html)
          const waerme = (n, t, rot) => {
            let h = `<div class="wf-heatglow${rot ? ' rot' : ''}"></div>`;
            for (let i = 0; i < n; i++) {
              const farbe = i % 2 ? 'gelb' : (rot ? 'rot' : 'koralle');
              h += `<i class="wf-ember ${farbe}" style="--x:${(14 + (i + R(i, 81) * 0.8) / n * 80).toFixed(1)}%;--s:${R(i, 82) > 0.6 ? 3 : 2}px;--d:${(3.2 / t * (0.75 + 0.5 * R(i, 83))).toFixed(2)}s;--p:${f2(R(i, 84))};--dx:${Math.round((R(i, 85) - 0.5) * 16)}px"></i>`;
            }
            return h;
          };
          const seil = (t) => {
            const dur = (1.8 / t).toFixed(2);
            const draht = (y0, sag, cls, phase) => {
              const a = `M0 ${y0} Q50 ${y0 + sag} 100 ${y0}`, b = `M0 ${y0} Q50 ${y0 - sag * 0.7} 100 ${y0}`;
              const anim = ruhig ? '' : `<animate attributeName="d" dur="${dur}s" begin="-${phase}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="${a};${b};${a}"/>`;
              return `<path class="${cls}" d="${a}" vector-effect="non-scaling-stroke">${anim}</path>`;
            };
            return `<svg class="wf-cab" viewBox="0 0 100 60" preserveAspectRatio="none">${draht(14, 22, 'wf-wire', 0)}${draht(34, 18, 'wf-wire leise', (0.4 / t).toFixed(2))}<path class="wf-mast" d="M99 0V60" vector-effect="non-scaling-stroke"/></svg>`;
          };

          // ---------- Szenen ----------
          const SZENEN = {
            gewitter: (l, t, k, ii) => {
              const c = parseInt(ii);
              let h = wolken(true, l >= 3 ? 3 : 2);
              if (GRP_RAIN.includes(c)) h += fall(tropfen(Math.round(10 * k), 0.7, 14, t), -10);
              if (GRP_HAIL.includes(c)) h += fall(flocken(Math.round(6 * k), 1.4, 3, t, true), -10);
              if (GRP_WIND.includes(c)) h += schlieren(Math.round(2 * k), 2.6, 60, t, l >= 3, false);
              return h + blitz;
            },
            wind: (l, t, k) => schlieren(Math.round(4 * k), 2.6, 70, t, l >= 3, false),
            starkregen: (l, t, k) => wolken(true, 2) + fall(tropfen(Math.round(14 * k), 0.5, 16, t), -12) + ringe(Math.round(3 * k), t, false),
            dauerregen: (l, t, k) => wolken(true, 1) + fall(tropfen(Math.round(10 * k), 1.0, 10, t), -4) + pegel('', 20 + l * 4, 18 / t),
            schnee: (l, t, k) => fall(flocken(Math.round(9 * k), 5, l >= 3 ? 3.5 : 3, t, false), -4) + pegel(' schnee', 16 + l * 3, 22 / t),
            verwehung: (l, t, k) => treiben(Math.round(10 * k), 1.9, t) + schlieren(Math.round(2 * k), 1.8, 50, t, false, true)
              + `<svg class="wf-dune" style="--d:${(8 / t).toFixed(1)}s" viewBox="0 0 400 30" preserveAspectRatio="none"><path d="M0 30V18Q25 6 50 18T100 18T150 18T200 18T250 18T300 18T350 18T400 18V30Z"/></svg>`,
            glaette: (l, t, k) => '<div class="wf-ice"></div>' + `<div class="wf-sheen" style="--d:${(5.5 / t).toFixed(1)}s"></div>` + funkeln(Math.round(3 * k), 66, 26, t),
            glatteis: (l, t, k) => '<div class="wf-ice"></div>' + fall(tropfen(Math.round(7 * k), 1.0, 9, t), -5)
              + ringe(Math.round(3 * k), t * 0.7, true, '12%') + `<div class="wf-sheen" style="--d:${(5.5 / t).toFixed(1)}s"></div>`,
            frost: (l, t) => {
              let h = '<div class="wf-cold"></div>';
              [[40, 6, 30, 0.0], [70, 40, 22, 0.45], [52, 52, 18, 0.7], [80, 2, 16, 0.25]].slice(0, l >= 2 ? 4 : 2)
                .forEach(([x, y, s, p], i) => { h += kristall(x, y, s, (10 / t + i).toFixed(1), p); });
              h += funkeln(l >= 2 ? 5 : 3, 10, 70, t);
              return h + (l >= 2 ? '<div class="wf-rime"></div>' : '');
            },
            tauwetter: (l, t, k) => zapfen(Math.round(3 * k), t) + ringe(Math.round(2 * k), t * 0.6, false) + pegel('', 14 + l * 3, 20 / t),
            nebel: (l, t) => nebel(t),
            hitze: (l, t, k) => waerme(Math.round(8 * k), t, l >= 3),
            uv: () => '<div class="wf-uvrays"></div><div class="wf-uvsun"></div><div class="wf-ring"></div><div class="wf-ring" style="animation-delay:-1.6s"></div>',
            leiter: (l, t) => seil(t)
          };

          const fx = (key, stufe, ii, vorab, ort) => {
            const bau = SZENEN[key];
            if (!bau) return '';
            const l = Math.max(1, Math.min(4, parseInt(stufe) || 1));
            const lv = LV[vorab ? 0 : l];
            const schein = (!vorab && l >= 3) ? `<div class="wf-glow${l >= 4 ? ' l4' : ''}"></div>` : '';
            return `<div class="wf${ort === 'popup' ? ' pop' : ''}${vorab ? ' vorab' : ''}" aria-hidden="true">${schein}${bau(l, lv.t, lv.k, ii)}</div>`;
          };

          // ---------- Icons (Pfade wie bisher in iconFor, plus Bewegung) ----------
          const icon = (key, farbe, px) => {
            const S = (inner) => `<svg class="wf-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${farbe};width:${px}px;height:${px}px;flex:none;display:block;overflow:visible;" aria-hidden="true">${inner}</svg>`;
            const WOLKE = '<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/>';
            const fallend = (d, dl, extra) => `<path class="ic-fall" style="animation-duration:${d};animation-delay:${dl};${extra || ''}"`;
            switch (key) {
              case 'gewitter': return S('<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path class="ic-bolt" d="M12.5 13l-2.5 4h3l-2 4"/>');
              case 'wind': return S('<path class="ic-flow" d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5"/><path class="ic-flow" style="animation-delay:-0.5s" d="M3 12h15a3 3 0 1 1-3 3"/><path class="ic-flow" style="animation-delay:-1s" d="M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/>');
              case 'starkregen': case 'dauerregen': {
                const d = key === 'starkregen' ? '1s' : '1.6s';
                return S(WOLKE + fallend(d, '0s') + ' d="M8.5 18l-1 2.2"/>' + fallend(d, '-0.4s') + ' d="M12 18l-1 2.2"/>' + fallend(d, '-0.8s') + ' d="M15.5 18l-1 2.2"/>');
              }
              case 'schnee': case 'verwehung': {
                const x = key === 'verwehung' ? 'animation-name:ic-slide;' : '';
                const d = key === 'verwehung' ? '1.2s' : '2.4s';
                return S(WOLKE + fallend(d, '0s', x) + ' d="M9 18.5h.01"/>' + fallend(d, '-0.8s', x) + ' d="M12 20h.01"/>' + fallend(d, '-1.6s', x) + ' d="M15 18.5h.01"/>');
              }
              // Frost: Thermometer mit Schneeflocke; die Saeule sinkt, die Flocke dreht sich
              case 'frost': return S('<path d="M8.4 14.8V5.6a1.7 1.7 0 0 0-3.4 0v9.2a3.2 3.2 0 1 0 3.4 0Z"/><path class="ic-down" stroke-width="1.6" d="M6.7 16.4V9.2"/><circle cx="6.7" cy="17.5" r="1.2" fill="currentColor" stroke="none"/><g class="ic-spin" style="animation-duration:20s"><path stroke-width="1.8" d="M16.5 3v12M21.7 6 11.3 12M21.7 12 11.3 6M16.5 12.7l-1.3 1.4M16.5 12.7l1.3 1.4M13.3 10.9l-1.9-.5M13.3 10.9l-.5 1.8M13.3 7.1l-.5-1.8M13.3 7.1l-1.9.5M16.5 5.3l1.3-1.4M16.5 5.3l-1.3-1.4M19.7 7.1l1.9.5M19.7 7.1l.5-1.8M19.7 10.9l.5 1.8M19.7 10.9l1.9-.5"/></g>');
              case 'glaette': case 'glatteis': return S(`<g class="ic-spin" style="animation-duration:${key === 'glatteis' ? 16 : 30}s"><path d="${KRISTALL}"/></g><circle class="ic-glint" cx="18.5" cy="5" r="1.1" fill="currentColor" stroke="none"/>`);
              case 'hitze': return S('<path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><path class="ic-up" stroke-width="1.8" d="M12 15.6V7.6"/><circle cx="12" cy="17.4" r="1.8" fill="currentColor" stroke="none"/>');
              case 'nebel': return S('<path class="ic-slide" d="M5 9h14"/><path class="ic-slide" style="animation-delay:-1.6s" d="M4 13h16"/><path class="ic-slide" style="animation-delay:-0.8s" d="M6 17h12"/>');
              case 'uv': return S('<circle cx="12" cy="12" r="4"/><g class="ic-spin" style="animation-duration:18s"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>');
              // neu: Eiszapfen mit Tropfen
              case 'tauwetter': return S('<path d="M3.5 4h17"/><path d="M6 4l1.4 5.5L8.8 4M10.6 4l1.5 8 1.5-8M15.4 4l1.3 5 1.3-5"/><circle class="ic-drip" cx="12.1" cy="15.4" r="1.25" fill="currentColor" stroke="none"/><path d="M8 20.5h8"/>');
              // neu: zwei Masten, schwingendes Seil
              case 'leiter': {
                const a = 'M4 7Q12 15 20 7', b = 'M4 7Q12 1.5 20 7';
                const anim = ruhig ? '' : `<animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="${a};${b};${a}"/>`;
                return S(`<path d="M4 4v16M20 4v16M2.5 6h3M18.5 6h3"/><path d="${a}">${anim}</path>`);
              }
              // Rueckfall: Warndreieck ohne Bewegung
              default: return S('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="none"/>');
            }
          };

          // ---------- Mehrere Szenen im Wechsel (Warnlage-Kachel der Wetter-View) ----------
          // Jede Szene steht WECHSEL_T Sekunden, Ueberblendung WECHSEL_BLENDE; hoechstens
          // vier. Der Verzug startet die erste Szene sichtbar, auch als Standbild bei
          // "Bewegung reduzieren". wechselStil(art, i, n) liefert dieselbe Taktung fuer
          // die Punkte ('dot') und das hervorgehobene Ereignis im Text ('name').
          const WECHSEL_T = 5, WECHSEL_BLENDE = 0.6;
          const wechselStil = (art, i, n) => (n > 1 && i < 4)
            ? `animation:wl-${art}-${Math.min(n, 4)} ${Math.min(n, 4) * WECHSEL_T}s linear ${-(((Math.min(n, 4) - i) % Math.min(n, 4)) * WECHSEL_T + WECHSEL_BLENDE)}s infinite;` : '';
          const wechsel = (szenen) => {
            const s = szenen.slice(0, 4), n = s.length;
            let h = s.map((x, i) => `<div class="wl-layer" style="${wechselStil('show', i, n)}">${fx(x.key, x.stufe, x.ii, x.vorab, 'popup')}</div>`).join('');
            if (n > 1) h += `<div class="wl-dots">${s.map((x, i) => `<i style="${wechselStil('dot', i, n)}"></i>`).join('')}</div>`;
            return h;
          };

          const lib = { version: VERSION, szene, kurz, trenn, schreib, fx, icon, wechsel, wechselStil };
          window.__nachtblauWarnFx = lib;
          return lib;
        ]]]
    extra_styles: |
      .wf-slot { position: relative; flex: 1 0 64px; align-self: stretch; margin: -16px -18px -16px 0; min-width: 64px; }
      .wf-slot.pop { flex-basis: 72px; min-width: 72px; margin: -14px -16px -12px 0; }
      .wf {
        position: absolute; inset: 0; overflow: hidden; pointer-events: none;
        -webkit-mask-image: linear-gradient(90deg, rgba(205, 214, 224, 0) 0, #cdd6e0 26px); mask-image: linear-gradient(90deg, rgba(205, 214, 224, 0) 0, #cdd6e0 26px);
        /* Farbrollen dunkel / hell (Faktoren aus DESIGN.md, "Wetteranimation im hellen Modus") */
        --wf-d: var(--nachtblau-dunkel-anteil, 100%);
        --wf-wolke: color-mix(in srgb, #cdd6e0 var(--wf-d), var(--nachtblau-wolkengrau, #cdd6e0));
        --wf-wolke12: color-mix(in srgb, rgba(205, 214, 224, 0.12) var(--wf-d), color-mix(in srgb, var(--nachtblau-wolkengrau, #cdd6e0) 21.5%, transparent));
        --wf-wolke24: color-mix(in srgb, rgba(205, 214, 224, 0.24) var(--wf-d), color-mix(in srgb, var(--nachtblau-wolkengrau, #cdd6e0) 43%, transparent));
        --wf-wolke50: color-mix(in srgb, rgba(205, 214, 224, 0.5) var(--wf-d), color-mix(in srgb, var(--nachtblau-wolkengrau, #cdd6e0) 81%, transparent));
        --wf-blau: color-mix(in srgb, #7fb3d5 var(--wf-d), var(--nachtblau-blau, #7fb3d5));
        --wf-blau12: color-mix(in srgb, rgba(127, 179, 213, 0.12) var(--wf-d), color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 16%, transparent));
        --wf-blau18: color-mix(in srgb, rgba(127, 179, 213, 0.18) var(--wf-d), color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent));
        --wf-blau24: color-mix(in srgb, rgba(127, 179, 213, 0.24) var(--wf-d), color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 32%, transparent));
        --wf-blau50: color-mix(in srgb, rgba(127, 179, 213, 0.5) var(--wf-d), color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 67%, transparent));
        --wf-w12: color-mix(in srgb, rgba(255, 255, 255, 0.12) var(--wf-d), color-mix(in srgb, var(--nachtblau-eis, #cfe3f2) 23%, transparent));
        --wf-w24: color-mix(in srgb, rgba(255, 255, 255, 0.24) var(--wf-d), color-mix(in srgb, var(--nachtblau-eis, #cfe3f2) 45%, transparent));
        --wf-w50: color-mix(in srgb, rgba(255, 255, 255, 0.5) var(--wf-d), color-mix(in srgb, var(--nachtblau-eis, #cfe3f2) 94%, transparent));
        --wf-eis18: color-mix(in srgb, rgba(207, 227, 242, 0.18) var(--wf-d), color-mix(in srgb, var(--nachtblau-eis, #cfe3f2) 34%, transparent));
        --wf-blitz: color-mix(in srgb, rgba(255, 255, 255, 0.18) var(--wf-d), rgba(230, 193, 90, 0.72));
        --wf-blitzlinie: color-mix(in srgb, rgba(255, 255, 255, 0.5) var(--wf-d), rgba(230, 193, 90, 0.72));
        --wf-rot18: color-mix(in srgb, rgba(240, 115, 106, 0.18) var(--wf-d), color-mix(in srgb, var(--nachtblau-rot, #f0736a) 18%, transparent));
        --wf-rot24: color-mix(in srgb, rgba(240, 115, 106, 0.24) var(--wf-d), color-mix(in srgb, var(--nachtblau-rot, #f0736a) 24%, transparent));
        --wf-rot50: color-mix(in srgb, rgba(240, 115, 106, 0.5) var(--wf-d), color-mix(in srgb, var(--nachtblau-rot, #f0736a) 50%, transparent));
        --wf-koralle18: color-mix(in srgb, rgba(231, 147, 110, 0.18) var(--wf-d), color-mix(in srgb, var(--nachtblau-koralle, #e7936e) 18%, transparent));
        --wf-koralle50: color-mix(in srgb, rgba(231, 147, 110, 0.5) var(--wf-d), color-mix(in srgb, var(--nachtblau-koralle, #e7936e) 50%, transparent));
        --wf-gelb18: color-mix(in srgb, rgba(230, 193, 90, 0.18) var(--wf-d), rgba(230, 193, 90, 0.45));
        --wf-gelb24: color-mix(in srgb, rgba(230, 193, 90, 0.24) var(--wf-d), rgba(230, 193, 90, 0.6));
        --wf-gelb50: color-mix(in srgb, rgba(230, 193, 90, 0.5) var(--wf-d), rgba(230, 193, 90, 0.9));
        --wf-k-wolke: calc(180% - 0.8 * var(--wf-d));
        --wf-k-regen: calc(133% - 0.33 * var(--wf-d));
      }
      .wf.pop {
        -webkit-mask-image: linear-gradient(90deg, rgba(205, 214, 224, 0) 0, #cdd6e0 26px), linear-gradient(0deg, rgba(205, 214, 224, 0) 0, #cdd6e0 18px);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(90deg, rgba(205, 214, 224, 0) 0, #cdd6e0 26px), linear-gradient(0deg, rgba(205, 214, 224, 0) 0, #cdd6e0 18px);
        mask-composite: intersect;
      }
      .wf.vorab { opacity: 0.55; }
      .wf * { will-change: transform; }
      .wf-cl { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: calc(var(--w) * 0.3); border-radius: 999px; background: var(--wf-wolke); opacity: calc(var(--o) * var(--wf-k-wolke)); animation: wf-sway var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * var(--p) * -1); }
      .wf-cl.dunkel { background: var(--nachtblau-muted, #6e7988); opacity: var(--o); }
      .wf-cl::before, .wf-cl::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
      .wf-cl::before { width: 46%; height: 150%; left: 14%; bottom: 30%; }
      .wf-cl::after { width: 34%; height: 112%; left: 50%; bottom: 34%; }
      @keyframes wf-sway { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
      .wf-fall { position: absolute; inset: -12% -18%; transform: rotate(var(--neig, -8deg)); }
      .wf-dr, .wf-fl { position: absolute; top: 0; height: 100%; left: var(--x); animation: wf-fall var(--d) linear infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-fall { from { transform: translateY(-100%); } to { transform: translateY(0); } }
      .wf-dr { width: 1.5px; opacity: calc(var(--a) * var(--wf-k-regen)); }
      .wf-dr::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: var(--len); border-radius: 1px; background: linear-gradient(180deg, rgba(127, 179, 213, 0), var(--wf-blau)); }
      .wf-fl { width: var(--s); }
      .wf-fl::after { content: ""; position: absolute; left: 0; bottom: 0; width: var(--s); height: var(--s); border-radius: 50%; background: var(--wf-w50); animation: wf-bob var(--sw) ease-in-out infinite alternate; }
      .wf-fl.hagel::after { border-radius: 1px; background: var(--wf-wolke50); animation: none; }
      @keyframes wf-bob { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
      .wf-sp { position: absolute; bottom: var(--b, 7%); left: var(--x); width: 12px; height: 4px; margin-left: -6px; border: 1px solid var(--wf-blau50); border-radius: 50%; opacity: 0; animation: wf-splash var(--d) ease-out infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      .wf-sp.weiss { border-color: var(--wf-w50); }
      @keyframes wf-splash { 0% { transform: scale(0.2); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }
      .wf-dw { position: absolute; left: 0; right: 0; top: var(--y); height: 0; animation: wf-drift var(--d) linear infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-drift { from { transform: translateX(0); } to { transform: translateX(calc(100% + var(--w))); } }
      .wf-st { position: absolute; right: 100%; top: 0; width: var(--w); height: 1.5px; border-radius: 2px; background: linear-gradient(90deg, rgba(205, 214, 224, 0), var(--wf-wolke) 70%, rgba(205, 214, 224, 0)); opacity: calc(var(--a) * (170% - 0.7 * var(--wf-d))); animation: wf-wave var(--wv) ease-in-out infinite alternate; }
      .wf-st.weiss { background: linear-gradient(90deg, rgba(255, 255, 255, 0), var(--wf-w50) 70%, rgba(255, 255, 255, 0)); opacity: var(--a); }
      .wf-st.boe { height: 2px; }
      @keyframes wf-wave { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
      .wf-bf { position: absolute; right: 100%; top: 0; width: var(--s); height: var(--s); border-radius: 50%; background: var(--wf-w50); animation: wf-wave var(--wv) ease-in-out infinite alternate; }
      .wf-flash { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 60% 0%, var(--wf-blitz), rgba(255, 255, 255, 0) 70%); opacity: 0; animation: wf-flash 8s linear infinite; animation-delay: -5s; }
      .wf-bolt { position: absolute; left: 54%; top: 22%; width: 18px; height: 46px; opacity: 0; overflow: visible; stroke: var(--wf-blitzlinie); animation: wf-flash 8s linear infinite; animation-delay: -5s; }
      @keyframes wf-flash { 0%, 88%, 100% { opacity: 0; } 89% { opacity: 1; } 90.5% { opacity: 0.25; } 92% { opacity: 0.85; } 95% { opacity: 0; } }
      .wf-fog { position: absolute; left: -40%; width: 180%; top: var(--y); height: var(--h); background: linear-gradient(180deg, rgba(205, 214, 224, 0), var(--wf-wolke12) 50%, rgba(205, 214, 224, 0)); animation: wf-haze var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-haze { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
      .wf-cold { position: absolute; right: -40%; top: -55%; width: 130%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--wf-blau18), rgba(127, 179, 213, 0) 65%); }
      .wf-cr { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); overflow: visible; }
      .wf-cr path { fill: none; stroke: var(--wf-w50); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: wf-grow-arm var(--d) linear infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      .wf-cr path.zweig { animation-name: wf-grow-zweig; }
      /* Arme 0-28 %, Zweige 28-42 %, stehen bis 82 %, tauen bis 100 % weg. Unsichtbar,
         solange nichts gezeichnet ist: runde Enden zeigten sonst einzelne Punkte. */
      @keyframes wf-grow-arm { 0% { stroke-dashoffset: 1; opacity: 0; } 1% { stroke-dashoffset: 0.96; opacity: 1; } 28% { stroke-dashoffset: 0; opacity: 1; } 82% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes wf-grow-zweig { 0%, 28% { stroke-dashoffset: 1; opacity: 0; } 29% { stroke-dashoffset: 0.93; opacity: 1; } 42% { stroke-dashoffset: 0; opacity: 1; } 82% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      .wf-spk { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); background: var(--wf-w50); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: wf-tw var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-tw { from { transform: scale(0.35); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
      .wf-rime { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: linear-gradient(0deg, var(--wf-w12), rgba(255, 255, 255, 0)); }
      .wf-ice { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: linear-gradient(0deg, var(--wf-eis18), rgba(207, 227, 242, 0)); }
      .wf-sheen { position: absolute; bottom: 0; height: 36%; left: 0; width: 42%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), var(--wf-w24), rgba(255, 255, 255, 0)); animation: wf-sheen var(--d, 5.5s) ease-in-out infinite; }
      @keyframes wf-sheen { 0% { transform: skewX(-24deg) translateX(-170%); } 55%, 100% { transform: skewX(-24deg) translateX(280%); } }
      .wf-icebar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--wf-w12); }
      .wf-icl { position: absolute; top: 3px; left: var(--x); width: var(--w); height: var(--h); background: linear-gradient(180deg, var(--wf-w24), var(--wf-w12)); clip-path: polygon(0 0, 100% 0, 50% 100%); }
      .wf-dp { position: absolute; top: calc(var(--h) + 1px); left: calc(var(--x) + var(--w) / 2 - 1.5px); width: 3px; height: 4px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; background: var(--wf-blau); opacity: 0; animation: wf-drip var(--d) ease-in infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-drip { 0% { transform: translateY(0) scale(0.3); opacity: 0; } 30% { transform: translateY(0) scale(1); opacity: 0.5; } 100% { transform: translateY(78px) scale(1); opacity: 0.5; } }
      .wf-lvl { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h, 28%); background: linear-gradient(0deg, var(--wf-blau18), var(--wf-blau12)); border-top: 1px solid var(--wf-blau24); transform-origin: bottom; animation: wf-rise var(--d, 16s) ease-in-out infinite; }
      .wf-lvl.schnee { background: linear-gradient(0deg, var(--wf-w12), rgba(255, 255, 255, 0)); border-top-color: var(--wf-w12); }
      @keyframes wf-rise { 0% { transform: scaleY(0.3); } 85% { transform: scaleY(1); } 100% { transform: scaleY(0.3); } }
      .wf-dune { position: absolute; left: -50%; bottom: 0; width: 200%; height: 26%; fill: var(--wf-w12); animation: wf-dune var(--d, 7s) linear infinite; }
      @keyframes wf-dune { from { transform: translateX(0); } to { transform: translateX(25%); } }
      .wf-cab { position: absolute; left: 0; top: 16%; width: 100%; height: 64%; overflow: visible; }
      .wf-wire { fill: none; stroke: var(--wf-wolke50); stroke-width: 1.5; }
      .wf-wire.leise { stroke: var(--wf-wolke24); }
      .wf-mast { stroke: var(--nachtblau-muted, #6e7988); stroke-width: 2; }
      .wf-heatglow { position: absolute; left: -10%; right: -30%; bottom: -45%; height: 95%; background: radial-gradient(ellipse 60% 70% at 55% 100%, var(--wf-koralle18), rgba(231, 147, 110, 0) 72%); animation: wf-pulse 3.2s ease-in-out infinite alternate; }
      .wf-heatglow.rot { background: radial-gradient(ellipse 60% 70% at 55% 100%, var(--wf-rot18), rgba(240, 115, 106, 0) 72%); }
      .wf-ember { position: absolute; bottom: 8%; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: var(--wf-koralle50); opacity: 0; animation: wf-ember var(--d) ease-out infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      .wf-ember.rot { background: var(--wf-rot50); }
      .wf-ember.gelb { background: var(--wf-gelb50); }
      @keyframes wf-ember { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -72px); opacity: 0; } }
      .wf-uvsun { position: absolute; right: 14px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: radial-gradient(circle, var(--wf-gelb50) 0%, var(--wf-gelb24) 55%, rgba(230, 193, 90, 0) 72%); animation: wf-pulse 4s ease-in-out infinite alternate; }
      .wf-uvrays { position: absolute; right: -31px; top: 50%; width: 120px; height: 120px; margin-top: -60px; border-radius: 50%; background: repeating-conic-gradient(var(--wf-gelb18) 0deg 5deg, rgba(230, 193, 90, 0) 5deg 20deg); -webkit-mask: radial-gradient(circle, rgba(205, 214, 224, 0) 20%, #cdd6e0 28%, rgba(205, 214, 224, 0) 70%); mask: radial-gradient(circle, rgba(205, 214, 224, 0) 20%, #cdd6e0 28%, rgba(205, 214, 224, 0) 70%); animation: wf-spin 40s linear infinite; }
      .wf-ring { position: absolute; right: 14px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; border: 1.5px solid var(--wf-gelb50); animation: wf-ring 3.2s ease-out infinite; }
      @keyframes wf-ring { from { transform: scale(0.8); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
      @keyframes wf-spin { to { transform: rotate(360deg); } }
      @keyframes wf-pulse { from { opacity: 0.55; } to { opacity: 1; } }
      .wf-glow { position: absolute; right: -45%; bottom: -70%; width: 150%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--wf-rot18), rgba(240, 115, 106, 0) 66%); animation: wf-pulse 3.5s ease-in-out infinite alternate; }
      .wf-glow.l4 { background: radial-gradient(circle, var(--wf-rot24), rgba(240, 115, 106, 0) 66%); animation-duration: 2.4s; }
      /* Szenen im Wechsel (wechsel(), Warnlage-Kachel): 2 bis 4 Szenen je 5 s, Ueberblendung 0,6 s */
      .wl-layer { position: absolute; inset: 0; }
      .wl-dots { position: absolute; right: 12px; bottom: 6px; display: flex; gap: 4px; z-index: 2; }
      .wl-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--nachtblau-label, #b4c0cf); opacity: 0.35; }
      @keyframes wl-show-2 { 0% { opacity: 0; } 6% { opacity: 1; } 50% { opacity: 1; } 56% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes wl-show-3 { 0% { opacity: 0; } 4% { opacity: 1; } 33.33% { opacity: 1; } 37.33% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes wl-show-4 { 0% { opacity: 0; } 3% { opacity: 1; } 25% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes wl-dot-2 { 0% { opacity: 0.35; } 6% { opacity: 1; } 50% { opacity: 1; } 56% { opacity: 0.35; } 100% { opacity: 0.35; } }
      @keyframes wl-dot-3 { 0% { opacity: 0.35; } 4% { opacity: 1; } 33.33% { opacity: 1; } 37.33% { opacity: 0.35; } 100% { opacity: 0.35; } }
      @keyframes wl-dot-4 { 0% { opacity: 0.35; } 3% { opacity: 1; } 25% { opacity: 1; } 28% { opacity: 0.35; } 100% { opacity: 0.35; } }
      @keyframes wl-name-2 { 0% { color: var(--nachtblau-text-sekundaer, #8794a5); } 6% { color: var(--nachtblau-text, #f2f5f8); } 50% { color: var(--nachtblau-text, #f2f5f8); } 56% { color: var(--nachtblau-text-sekundaer, #8794a5); } 100% { color: var(--nachtblau-text-sekundaer, #8794a5); } }
      @keyframes wl-name-3 { 0% { color: var(--nachtblau-text-sekundaer, #8794a5); } 4% { color: var(--nachtblau-text, #f2f5f8); } 33.33% { color: var(--nachtblau-text, #f2f5f8); } 37.33% { color: var(--nachtblau-text-sekundaer, #8794a5); } 100% { color: var(--nachtblau-text-sekundaer, #8794a5); } }
      @keyframes wl-name-4 { 0% { color: var(--nachtblau-text-sekundaer, #8794a5); } 3% { color: var(--nachtblau-text, #f2f5f8); } 25% { color: var(--nachtblau-text, #f2f5f8); } 28% { color: var(--nachtblau-text-sekundaer, #8794a5); } 100% { color: var(--nachtblau-text-sekundaer, #8794a5); } }
      /* Icon-Kachel: Leuchten ab Stufe 3 (0 0 14px -3px, Farbe aus --wf-glow) */
      .wf-alarm { animation: wf-kachel 3.5s ease-in-out infinite alternate; }
      .wf-alarm.l4 { animation-duration: 2.4s; }
      @keyframes wf-kachel { from { box-shadow: 0 0 14px -3px transparent; } to { box-shadow: 0 0 14px -3px var(--wf-glow); } }
      /* Icon-Bewegungen */
      .wf-ic * { transform-box: fill-box; }
      .ic-spin { transform-origin: center; animation: wf-spin 24s linear infinite; }
      .ic-down { transform-origin: bottom; animation: ic-down 4s ease-in-out infinite alternate; }
      .ic-up { transform-origin: bottom; animation: ic-up 3s ease-in-out infinite alternate; }
      @keyframes ic-down { from { transform: scaleY(1); } to { transform: scaleY(0.3); } }
      @keyframes ic-up { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }
      .ic-bolt { animation: ic-flick 8s linear infinite; animation-delay: -5s; }
      @keyframes ic-flick { 0%, 88%, 100% { opacity: 1; } 89% { opacity: 0.3; } 90.5% { opacity: 1; } 92% { opacity: 0.4; } 95% { opacity: 1; } }
      .ic-flow { stroke-dasharray: 16 4; animation: ic-flow 1.6s linear infinite; }
      @keyframes ic-flow { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
      .ic-fall { animation: ic-fall 1.3s ease-in infinite; }
      @keyframes ic-fall { 0% { transform: translateY(-2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(2px); opacity: 0; } }
      .ic-slide { animation: ic-slide 3.2s ease-in-out infinite alternate; }
      @keyframes ic-slide { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
      .ic-drip { animation: ic-drip 2.2s ease-in infinite; }
      @keyframes ic-drip { 0% { transform: translateY(0) scale(0.4); opacity: 0; } 25% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
      .ic-glint { animation: ic-glint 5.5s ease-in-out infinite; }
      @keyframes ic-glint { 0%, 70%, 100% { opacity: 0; } 80% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .wf *, .wf *::before, .wf *::after, .wf-ic *, .wf-alarm, .wl-layer, .wl-dots i, .wl-name { animation-play-state: paused !important; transition: none !important; }
      }

  # ==========================================================================
  # nachtblau_pollen_fx -- Szenen und Stufen fuer den Pollenflug
  # --------------------------------------------------------------------------
  # Seit 14.11.2026 (Entwurf pollen-kachel.html). nachtblau_pollen_popup erbt
  # es, damit nachtblau_pollen_kachel (Wetter-View und Home)
  # Bibliothek und Keyframes haben; der Popup-Inhalt bindet es selbst ein
  # (eigene button-card, eigenes Shadow-DOM).
  #
  # Stufen des DWD-Pollenflug-Gefahrenindex: 0, 0-1, 1, 1-2, 2, 2-3, 3; die
  # Integration DWD Pollenflug liefert sie als 0, 0.5, ... 3. Halbe Stufen
  # zaehlen zur hoeheren Farbe (bis 14.11.2026 per parseInt zur niedrigeren):
  # 0,5 und 1 Gruen, 1,5 und 2 Amber, 2,5 Koralle, 3 Rot.
  #
  # Aufbau:
  #   variables.pfx  Bibliothek, einmal pro Seite in window.__nachtblauPollenFx.
  #                  VERSION bei jeder Aenderung erhoehen.
  #     stufe(wert)               -> { an, wert, kurz, titel, c, pille }
  #                                  (c Farbe der Stufe, pille Schriftfarbe der
  #                                  Pille in einer getoenten Kachel)
  #     form(name)                -> Pflanzenform der Art ('hasel', 'gras', ...)
  #     icon(form, farbe, px)     -> Blume oder Halm, Pollen bewegt
  #     szene(form, wert, vorschau) -> HTML der Ebene (Baum, Gras oder Kraut)
  #     wechsel(szenen)           -> mehrere Szenen im Wechsel, je 5 s, hoechstens
  #                                  vier (wie wechsel() in nachtblau_warn_fx)
  #     wechselStil(art, i, n)    -> dieselbe Taktung fuer Punkte ('dot'), Namen
  #                                  ('name') und Spuren im Verlauf ('lane')
  #   extra_styles   Keyframes und Klassen der Ebene ".pf".
  #
  # Szenen: Baum mit Kaetzchen (Hasel lang, Birke mittel, Erle kurz in
  # Bueschen) oder Bluetenbueschel (Esche), Gras mit Aehre (Roggen mit
  # Grannen), Kraut (Beifuss Rispe, Ambrosia Aehren). Zweige und Staengel in
  # nachtblau-label 0,45, Bluete und Koerner in der Stufenfarbe, Schein 0,18,
  # Wind Wolkengrau 0,16. Mehr und schnellere Koerner je Stufe (3 bis 15).
  # Vorschau (Belastung erst ab morgen): hohle Koerner, Ebene 0,55. Gleicher
  # Zustand ergibt denselben HTML-Text (feste Pseudo-Zufallswerte), die Szene
  # startet beim Neuzeichnen also nicht neu.
  # "Bewegung reduzieren" zeigt ein Standbild.
  # ==========================================================================
  nachtblau_pollen_fx:
    variables:
      pfx: |
        [[[
          const VERSION = 2, alt = window.__nachtblauPollenFx;
          if (alt && alt.version === VERSION) return alt;

          const R = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
          const f1 = (n) => n.toFixed(1);

          // ---------- Stufen ----------
          const GRUEN = 'var(--nachtblau-gruen, #a6d49e)', AMBER = 'var(--nachtblau-amber, #e6b566)';
          const KORALLE = 'var(--nachtblau-koralle, #e7936e)', ROT = 'var(--nachtblau-rot, #f0736a)';
          const TEXT = 'var(--nachtblau-text, #f2f5f8)';
          const modus = (dunkel, hell) => `color-mix(in srgb, ${dunkel} var(--nachtblau-dunkel-anteil, 100%), ${hell})`;
          // Pille in einer Kachel, die selbst getoent ist (zweimal 0,12): dunkel
          // Gruen 5,18:1 und Amber 5,18:1 bleiben farbig, Koralle (4,42:1) und
          // Rot (3,95:1) nehmen Primaertext; hell fallen alle unter 4,5:1 und
          // nehmen Primaertext (DESIGN.md, Pollenflug)
          const ST = [
            { bis: 0.5, kurz: 'keine bis gering', titel: 'Keine bis gering', c: GRUEN, farbig: true },
            { bis: 1, kurz: 'gering', titel: 'Geringe Belastung', c: GRUEN, farbig: true },
            { bis: 1.5, kurz: 'gering bis mittel', titel: 'Gering bis mittel', c: AMBER, farbig: true },
            { bis: 2, kurz: 'mittel', titel: 'Mittlere Belastung', c: AMBER, farbig: true },
            { bis: 2.5, kurz: 'mittel bis hoch', titel: 'Mittel bis hoch', c: KORALLE, farbig: false },
            { bis: 99, kurz: 'hoch', titel: 'Hohe Belastung', c: ROT, farbig: false }
          ];
          const stufe = (v) => {
            const x = (v === null || v === undefined || v === '') ? NaN : parseFloat(v);
            if (isNaN(x)) return { an: false, wert: null, kurz: 'ohne Angabe', titel: 'Keine Daten', c: null };
            if (x <= 0) return { an: false, wert: 0, kurz: 'keine', titel: 'Keine Belastung', c: GRUEN };
            const s = ST.find((t) => x <= t.bis);
            return { an: true, wert: Math.min(3, Math.ceil(x * 2) / 2), kurz: s.kurz, titel: s.titel, c: s.c, pille: s.farbig ? modus(s.c, TEXT) : TEXT };
          };

          // ---------- Arten ----------
          const form = (name) => {
            const n = String(name || '').toLowerCase();
            if (/hasel/.test(n)) return 'hasel';
            if (/erle/.test(n)) return 'erle';
            if (/birke/.test(n)) return 'birke';
            if (/esche/.test(n)) return 'esche';
            if (/roggen/.test(n)) return 'roggen';
            if (/gr(ä|ae)ser|gras/.test(n)) return 'gras';
            if (/beifu/.test(n)) return 'beifuss';
            if (/ambrosia/.test(n)) return 'ambrosia';
            return 'gras';
          };
          const istGras = (f) => f === 'gras' || f === 'roggen';

          // ---------- Icons (Blume und Halm, Pollen bewegt) ----------
          const icon = (f, farbe, px) => {
            const punkte = (lst) => lst.map(([x, y, d]) => `<circle class="pf-ic-dot" cx="${x}" cy="${y}" r="0.6" fill="currentColor" stroke="none" style="animation-delay:-${d}s"/>`).join('');
            const kopf = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:${farbe};width:${px}px;height:${px}px;display:block;overflow:visible;"`;
            return istGras(f)
              ? `${kopf} stroke-width="1.9"><path d="M12 21v-9"/><path d="M12 12c0-3.2-1.8-5.6-4.8-6.4.2 3.2 2 5.6 4.8 6.4Z"/><path d="M12 12c0-3.2 1.8-5.6 4.8-6.4-.2 3.2-2 5.6-4.8 6.4Z"/>${punkte([[18.6, 4.2, 0], [20.4, 6, 0.8], [5.4, 4.4, 1.6]])}</svg>`
              : `${kopf} stroke-width="1.7"><circle cx="12" cy="14" r="2.1"/><circle cx="12" cy="9.4" r="2.1"/><circle cx="15.9" cy="11.7" r="2.1"/><circle cx="14.6" cy="16.3" r="2.1"/><circle cx="9.4" cy="16.3" r="2.1"/><circle cx="8.1" cy="11.7" r="2.1"/>${punkte([[18.5, 5, 0], [20.5, 6.7, 0.8], [18.2, 7.4, 1.6]])}</svg>`;
          };

          // ---------- Szenen ----------
          const KOERNER = { 0.5: 3, 1: 5, 1.5: 7, 2: 9, 2.5: 12, 3: 15 };
          const DAUER = { 0.5: 4.4, 1: 4, 1.5: 3.6, 2: 3.2, 2.5: 2.9, 3: 2.6 };
          const PFL = 'stroke:var(--nachtblau-label, #b4c0cf);fill:none;stroke-linecap:round;';
          const kaetzchen = (x, y, seg, rx, c, fo) => {
            let h = `<line x1="${x}" y1="${y - 3}" x2="${x}" y2="${y + 1}" style="${PFL}stroke-opacity:0.5;stroke-width:1"/>`;
            for (let i = 0; i < seg; i++) h += `<ellipse cx="${x + (i % 2 ? 0.5 : -0.5)}" cy="${f1(y + 3 + i * 3.3)}" rx="${rx}" ry="2.2" style="fill:${c};fill-opacity:${fo};stroke:${c};stroke-opacity:0.7;stroke-width:0.5"/>`;
            return h;
          };
          const szene = (f, wert, vorschau) => {
            const w = Math.min(3, Math.max(0.5, Math.ceil((parseFloat(wert) || 0.5) * 2) / 2));
            const c = vorschau ? AMBER : stufe(w).c, fo = vorschau ? 0.3 : 0.55;
            const seed = { hasel: 1, erle: 2, birke: 3, esche: 4, gras: 5, roggen: 6, beifuss: 7, ambrosia: 8 }[f] || 9;
            let pfl = '', pkt = [], ri, gy = 36;
            if (['hasel', 'erle', 'birke', 'esche'].includes(f)) {
              pfl += `<path d="M152 7 C 128 11, 104 5, 62 17" style="${PFL}stroke-opacity:0.45;stroke-width:2.2"/>`;
              pfl += `<path d="M120 9 l-4 -6 M94 9 l3 -6 M76 13 l-3 -6" style="${PFL}stroke-opacity:0.4;stroke-width:1.2"/>`;
              [[78, 14], [97, 10], [117, 10], [136, 9]].forEach(([x, y], i) => {
                let k = '';
                if (f === 'hasel') { k = kaetzchen(x, y, 8, 2.3, c, fo); pkt.push([x, y + 20], [x, y + 28]); }
                if (f === 'birke') { k = kaetzchen(x, y, 6, 2.7, c, fo); pkt.push([x, y + 16], [x, y + 22]); }
                if (f === 'erle') { k = kaetzchen(x - 3, y, 4, 2.4, c, fo) + kaetzchen(x + 3, y + 1, 3, 2.4, c, fo); pkt.push([x, y + 14]); }
                if (f === 'esche') {
                  k = `<line x1="${x}" y1="${y - 2}" x2="${x}" y2="${y + 4}" style="${PFL}stroke-opacity:0.5;stroke-width:1"/>`;
                  for (let j = 0; j < 7; j++) { const a = j / 7 * Math.PI * 2; k += `<circle cx="${f1(x + Math.cos(a) * 4.5)}" cy="${f1(y + 7 + Math.sin(a) * 3.5)}" r="1.9" style="fill:${c};fill-opacity:${fo + 0.1}"/>`; }
                  pkt.push([x, y + 8]);
                }
                pfl += `<g class="pf-sway" style="transform-origin:${x}px ${y - 3}px;--a1:${-3 - i}deg;--a2:${3 + i}deg;animation-delay:${-i * 0.7}s">${k}</g>`;
              });
              ri = { dx: [-95, -55], dy: [12, 34] }; gy = 34;
            } else if (istGras(f)) {
              pfl += `<path d="M90 96 q-6 -22 -16 -30 M118 96 q8 -20 18 -26 M104 96 q-2 -18 -10 -28" style="${PFL}stroke-opacity:0.3;stroke-width:1.4"/>`;
              const lang = f === 'roggen' ? 9 : 6, schritt = f === 'roggen' ? 3.1 : 3.6;
              [[84, 26], [100, 14], [114, 24], [129, 16]].forEach(([x, top], i) => {
                let k = `<path d="M${x + 4} 96 Q ${x + 2} ${(96 + top) / 2} ${x} ${f1(top + lang * schritt)}" style="${PFL}stroke-opacity:0.45;stroke-width:1.3"/>`;
                for (let j = 0; j < lang; j++) {
                  const yy = top + j * schritt, ox = j % 2 ? 1.8 : -1.8;
                  k += `<ellipse cx="${f1(x + ox)}" cy="${f1(yy)}" rx="${f === 'roggen' ? 1.4 : 1.8}" ry="2.6" transform="rotate(${ox > 0 ? 18 : -18} ${f1(x + ox)} ${f1(yy)})" style="fill:${c};fill-opacity:${fo}"/>`;
                  if (f === 'roggen') k += `<line x1="${f1(x + ox)}" y1="${f1(yy - 2)}" x2="${f1(x + ox * 3.2)}" y2="${f1(yy - 9)}" style="stroke:${c};stroke-opacity:0.5;stroke-width:0.6"/>`;
                }
                pfl += `<g class="pf-sway" style="transform-origin:${x + 4}px 96px;--a1:${-2 - i * 0.5}deg;--a2:${2.5 + i * 0.5}deg;animation-delay:${-i * 0.9}s">${k}</g>`;
                pkt.push([x, top + 6], [x, top + 14]);
              });
              ri = { dx: [-85, -50], dy: [-14, 10] }; gy = 30;
            } else {
              const x = 108;
              pfl += `<path d="M${x} 96 L${x - 1} 8" style="${PFL}stroke-opacity:0.45;stroke-width:1.6"/>`;
              if (f === 'beifuss') {
                [[20, -1], [30, 1], [42, -1], [54, 1], [66, -1]].forEach(([y, s], i) => {
                  const ex = x + s * (18 - i), ey = y + 8;
                  let k = `<path d="M${x} ${y} Q ${x + s * 8} ${y + 1} ${ex} ${ey}" style="${PFL}stroke-opacity:0.4;stroke-width:1.1"/>`;
                  for (let j = 1; j <= 3; j++) { const t = j / 3.4, hx = x + (ex - x) * t, hy = y + (ey - y) * t * t + 3; k += `<ellipse cx="${f1(hx)}" cy="${f1(hy)}" rx="1.5" ry="2" style="fill:${c};fill-opacity:${fo + 0.1}"/>`; pkt.push([hx, hy]); }
                  pfl += `<g class="pf-sway" style="transform-origin:${x}px ${y}px;--a1:-3deg;--a2:3deg;animation-delay:${-i * 0.6}s">${k}</g>`;
                });
              } else {
                pfl += `<path d="M${x} 80 l-12 -6 l4 -3 l-8 -4 M${x} 70 l11 -7 l-3 -3 l8 -4" style="${PFL}stroke-opacity:0.32;stroke-width:1.1;stroke-linejoin:round"/>`;
                [[x - 1, 8, 0], [x - 12, 22, -14], [x + 10, 24, 14]].forEach(([ax, ay, rot], i) => {
                  let k = `<line x1="${x}" y1="${ay + 14}" x2="${ax}" y2="${ay}" style="${PFL}stroke-opacity:0.4;stroke-width:1"/>`;
                  for (let j = 0; j < 5; j++) { const py = ay + j * 3.2, px = ax + (x - ax) * (j * 3.2) / 14; k += `<path d="M${f1(px - 2)} ${f1(py)} a2 2 0 0 0 4 0 z" style="fill:${c};fill-opacity:${fo + 0.1}"/>`; pkt.push([px, py + 1]); }
                  pfl += `<g class="pf-sway" style="transform-origin:${x}px ${ay + 14}px;--a1:${-2 + rot / 10}deg;--a2:${2 + rot / 10}deg;animation-delay:${-i * 0.8}s">${k}</g>`;
                });
              }
              ri = { dx: [-70, -35], dy: [-38, -12], steigt: true };
            }
            // Koerner: Anzahl und Tempo nach Stufe, Lage fest (R)
            const n = KOERNER[w], dur = DAUER[w] * (vorschau ? 1.3 : 1);
            let k = '';
            for (let i = 0; i < n; i++) {
              const p = pkt[i % pkt.length];
              const x = p[0] + (R(i, seed) - 0.5) * 6, y = p[1] + (R(i, seed + 10) - 0.5) * 6;
              const dx = ri.dx[0] + R(i, seed + 20) * (ri.dx[1] - ri.dx[0]), dy = ri.dy[0] + R(i, seed + 30) * (ri.dy[1] - ri.dy[0]);
              const d = dur * (0.8 + R(i, seed + 40) * 0.45), del = -R(i, seed + 50) * d;
              const fuell = vorschau ? `fill:none;stroke:${c};stroke-width:0.8` : `fill:${c}`;
              k += `<circle class="pf-k${ri.steigt ? ' steigt' : ''}" cx="${f1(x)}" cy="${f1(y)}" r="${(1.1 + R(i, seed + 60) * 0.8).toFixed(2)}" style="${fuell};--dx:${f1(dx)}px;--dy:${f1(dy)}px;animation-duration:${d.toFixed(2)}s;animation-delay:${del.toFixed(2)}s"/>`;
            }
            const wind = [[26, 5.2, 0], [58, 6.6, -2.3]].map(([y, d, del]) => `<path class="pf-wind" d="M150 ${y} h-26" style="stroke:var(--nachtblau-wolkengrau, #cdd6e0);stroke-opacity:0.16;stroke-width:1.2;stroke-linecap:round;fill:none;animation-duration:${d}s;animation-delay:${del}s"/>`).join('');
            // Schein als Verlauf; gleiche id heisst gleicher Inhalt, doppelte ids im Shadow-DOM schaden so nicht
            const gid = `pfg-${f}-${w * 10}-${vorschau ? 1 : 0}`;
            const schein = `<defs><radialGradient id="${gid}"><stop offset="0" style="stop-color:${c};stop-opacity:${vorschau ? 0.1 : 0.18}"/><stop offset="1" style="stop-color:${c};stop-opacity:0"/></radialGradient></defs><ellipse cx="104" cy="${gy}" rx="52" ry="40" fill="url(#${gid})"/>`;
            return `<div class="pf${vorschau ? ' vorab' : ''}"><svg viewBox="0 0 150 96" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${schein}${wind}${pfl}${k}</svg></div>`;
          };

          // ---------- Mehrere Szenen im Wechsel (wie nachtblau_warn_fx) ----------
          const WECHSEL_T = 5, WECHSEL_BLENDE = 0.6;
          const wechselStil = (art, i, n) => (n > 1 && i < 4)
            ? `animation:wl-${art}-${Math.min(n, 4)} ${Math.min(n, 4) * WECHSEL_T}s linear ${-(((Math.min(n, 4) - i) % Math.min(n, 4)) * WECHSEL_T + WECHSEL_BLENDE)}s infinite;` : '';
          const wechsel = (szenen) => {
            const s = szenen.slice(0, 4), n = s.length;
            let h = s.map((x, i) => `<div class="wl-layer" style="${wechselStil('show', i, n)}">${szene(x.form, x.wert, x.vorschau)}</div>`).join('');
            if (n > 1) h += `<div class="wl-dots">${s.map((x, i) => `<i style="${wechselStil('dot', i, n)}"></i>`).join('')}</div>`;
            return h;
          };

          const lib = { version: VERSION, stufe, form, istGras, icon, szene, wechsel, wechselStil };
          window.__nachtblauPollenFx = lib;
          return lib;
        ]]]
    extra_styles: |
