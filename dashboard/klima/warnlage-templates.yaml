      .pf-wind { animation: pf-wind linear infinite; }
      .pf-ic-dot { transform-box: fill-box; animation: pf-ic 2.4s ease-in-out infinite; }
      @keyframes pf-drift { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 78% { opacity: 0.9; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
      @keyframes pf-rise { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
      @keyframes pf-sway { from { transform: rotate(var(--a1, -4deg)); } to { transform: rotate(var(--a2, 4deg)); } }
      @keyframes pf-wind { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(-70px); opacity: 0; } }
      @keyframes pf-ic { 0%, 100% { transform: translate(0, 0); opacity: 0.35; } 50% { transform: translate(1px, -2px); opacity: 1; } }
      /* Szenen im Wechsel: dieselben Keyframes wie nachtblau_warn_fx, dazu die Spuren im Verlauf */
