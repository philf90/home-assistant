      @keyframes wl-name-3 { 0% { color: var(--nachtblau-text-sekundaer, #8794a5); } 4% { color: var(--nachtblau-text, #f2f5f8); } 33.33% { color: var(--nachtblau-text, #f2f5f8); } 37.33% { color: var(--nachtblau-text-sekundaer, #8794a5); } 100% { color: var(--nachtblau-text-sekundaer, #8794a5); } }
      @keyframes wl-name-4 { 0% { color: var(--nachtblau-text-sekundaer, #8794a5); } 3% { color: var(--nachtblau-text, #f2f5f8); } 25% { color: var(--nachtblau-text, #f2f5f8); } 28% { color: var(--nachtblau-text-sekundaer, #8794a5); } 100% { color: var(--nachtblau-text-sekundaer, #8794a5); } }
