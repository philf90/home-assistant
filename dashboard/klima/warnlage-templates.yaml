      @keyframes wf-wave { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
      .wf-bf { position: absolute; right: 100%; top: 0; width: var(--s); height: var(--s); border-radius: 50%; background: var(--wf-w50); animation: wf-wave var(--wv) ease-in-out infinite alternate; }
      .wf-flash { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 60% 0%, var(--wf-blitz), rgba(255, 255, 255, 0) 70%); opacity: 0; animation: wf-flash 8s linear infinite; animation-delay: -5s; }
      .wf-bolt { position: absolute; left: 54%; top: 22%; width: 18px; height: 46px; opacity: 0; overflow: visible; stroke: var(--wf-blitzlinie); animation: wf-flash 8s linear infinite; animation-delay: -5s; }
      @keyframes wf-flash { 0%, 88%, 100% { opacity: 0; } 89% { opacity: 1; } 90.5% { opacity: 0.25; } 92% { opacity: 0.85; } 95% { opacity: 0; } }
      .wf-fog { position: absolute; left: -40%; width: 180%; top: var(--y); height: var(--h); background: linear-gradient(180deg, rgba(205, 214, 224, 0), var(--wf-wolke12) 50%, rgba(205, 214, 224, 0)); animation: wf-haze var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-haze { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
      .wf-cold { position: absolute; right: -40%; top: -55%; width: 130%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--wf-blau18), rgba(127, 179, 213, 0) 65%); }
      .wf-cr { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); overflow: visible; }
      .wf-cr path { fill: none; stroke: var(--wf-w50); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: wf-grow var(--d) ease-out infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-grow { 0% { stroke-dashoffset: 1; opacity: 1; } 42% { stroke-dashoffset: 0; opacity: 1; } 82% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      .wf-spk { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); background: var(--wf-w50); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: wf-tw var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-tw { from { transform: scale(0.35); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
      .wf-rime { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: linear-gradient(0deg, var(--wf-w12), rgba(255, 255, 255, 0)); }
      .wf-ice { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: linear-gradient(0deg, var(--wf-eis18), rgba(207, 227, 242, 0)); }
      .wf-sheen { position: absolute; bottom: 0; height: 36%; left: 0; width: 42%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), var(--wf-w24), rgba(255, 255, 255, 0)); animation: wf-sheen var(--d, 5.5s) ease-in-out infinite; }
      @keyframes wf-sheen { 0% { transform: skewX(-24deg) translateX(-170%); } 55%, 100% { transform: skewX(-24deg) translateX(280%); } }
      .wf-icebar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--wf-w12); }
      .wf-icl { position: absolute; top: 3px; left: var(--x); width: var(--w); height: var(--h); background: linear-gradient(180deg, var(--wf-w24), var(--wf-w12)); clip-path: polygon(0 0, 100% 0, 50% 100%); }
      .wf-dp { position: absolute; top: calc(var(--h) + 1px); left: calc(var(--x) + var(--w) / 2 - 1.5px); width: 3px; height: 4px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; background: var(--wf-blau); opacity: 0; animation: wf-drip var(--d) ease-in infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      @keyframes wf-drip { 0% { transform: translateY(0) scale(0.3); opacity: 0; } 30% { transform: translateY(0) scale(1); opacity: 0.5; } 100% { transform: translateY(78px) scale(1); opacity: 0.5; } }
      .wf-lvl { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h, 28%); background: linear-gradient(0deg, var(--wf-blau18), var(--wf-blau12)); border-top: 1px solid var(--wf-blau24); transform-origin: bottom; animation: wf-rise var(--d, 16s) ease-in-out infinite; }
      .wf-lvl.schnee { background: linear-gradient(0deg, var(--wf-w12), rgba(255, 255, 255, 0)); border-top-color: var(--wf-w12); }
      @keyframes wf-rise { 0% { transform: scaleY(0.3); } 85% { transform: scaleY(1); } 100% { transform: scaleY(0.3); } }
      .wf-dune { position: absolute; left: -50%; bottom: 0; width: 200%; height: 26%; fill: var(--wf-w12); animation: wf-dune var(--d, 7s) linear infinite; }
      @keyframes wf-dune { from { transform: translateX(0); } to { transform: translateX(25%); } }
      .wf-cab { position: absolute; left: 0; top: 16%; width: 100%; height: 64%; overflow: visible; }
      .wf-wire { fill: none; stroke: var(--wf-wolke50); stroke-width: 1.5; }
      .wf-wire.leise { stroke: var(--wf-wolke24); }
      .wf-mast { stroke: var(--nachtblau-muted, #6e7988); stroke-width: 2; }
      .wf-heatglow { position: absolute; left: -10%; right: -30%; bottom: -45%; height: 95%; background: radial-gradient(ellipse 60% 70% at 55% 100%, var(--wf-koralle18), rgba(231, 147, 110, 0) 72%); animation: wf-pulse 3.2s ease-in-out infinite alternate; }
      .wf-heatglow.rot { background: radial-gradient(ellipse 60% 70% at 55% 100%, var(--wf-rot18), rgba(240, 115, 106, 0) 72%); }
      .wf-ember { position: absolute; bottom: 8%; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: var(--wf-koralle50); opacity: 0; animation: wf-ember var(--d) ease-out infinite; animation-delay: calc(var(--d) * var(--p) * -1); }
      .wf-ember.rot { background: var(--wf-rot50); }
      .wf-ember.gelb { background: var(--wf-gelb50); }
      @keyframes wf-ember { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -72px); opacity: 0; } }
      .wf-uvsun { position: absolute; right: 14px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: radial-gradient(circle, var(--wf-gelb50) 0%, var(--wf-gelb24) 55%, rgba(230, 193, 90, 0) 72%); animation: wf-pulse 4s ease-in-out infinite alternate; }
      .wf-uvrays { position: absolute; right: -31px; top: 50%; width: 120px; height: 120px; margin-top: -60px; border-radius: 50%; background: repeating-conic-gradient(var(--wf-gelb18) 0deg 5deg, rgba(230, 193, 90, 0) 5deg 20deg); -webkit-mask: radial-gradient(circle, rgba(205, 214, 224, 0) 20%, #cdd6e0 28%, rgba(205, 214, 224, 0) 70%); mask: radial-gradient(circle, rgba(205, 214, 224, 0) 20%, #cdd6e0 28%, rgba(205, 214, 224, 0) 70%); animation: wf-spin 40s linear infinite; }
      .wf-ring { position: absolute; right: 14px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; border: 1.5px solid var(--wf-gelb50); animation: wf-ring 3.2s ease-out infinite; }
      @keyframes wf-ring { from { transform: scale(0.8); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
      @keyframes wf-spin { to { transform: rotate(360deg); } }
      @keyframes wf-pulse { from { opacity: 0.55; } to { opacity: 1; } }
      .wf-glow { position: absolute; right: -45%; bottom: -70%; width: 150%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--wf-rot18), rgba(240, 115, 106, 0) 66%); animation: wf-pulse 3.5s ease-in-out infinite alternate; }
      .wf-glow.l4 { background: radial-gradient(circle, var(--wf-rot24), rgba(240, 115, 106, 0) 66%); animation-duration: 2.4s; }
      /* Icon-Kachel: Leuchten ab Stufe 3 (0 0 14px -3px, Farbe aus --wf-glow) */
      .wf-alarm { animation: wf-kachel 3.5s ease-in-out infinite alternate; }
      .wf-alarm.l4 { animation-duration: 2.4s; }
      @keyframes wf-kachel { from { box-shadow: 0 0 14px -3px transparent; } to { box-shadow: 0 0 14px -3px var(--wf-glow); } }
      /* Icon-Bewegungen */
      .wf-ic * { transform-box: fill-box; }
      .ic-spin { transform-origin: center; animation: wf-spin 24s linear infinite; }
      .ic-down { transform-origin: bottom; animation: ic-down 4s ease-in-out infinite alternate; }
      .ic-up { transform-origin: bottom; animation: ic-up 3s ease-in-out infinite alternate; }
      @keyframes ic-down { from { transform: scaleY(1); } to { transform: scaleY(0.3); } }
      @keyframes ic-up { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }
      .ic-bolt { animation: ic-flick 8s linear infinite; animation-delay: -5s; }
      @keyframes ic-flick { 0%, 88%, 100% { opacity: 1; } 89% { opacity: 0.3; } 90.5% { opacity: 1; } 92% { opacity: 0.4; } 95% { opacity: 1; } }
      .ic-flow { stroke-dasharray: 16 4; animation: ic-flow 1.6s linear infinite; }
      @keyframes ic-flow { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
      .ic-fall { animation: ic-fall 1.3s ease-in infinite; }
      @keyframes ic-fall { 0% { transform: translateY(-2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(2px); opacity: 0; } }
      .ic-slide { animation: ic-slide 3.2s ease-in-out infinite alternate; }
      @keyframes ic-slide { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
      .ic-drip { animation: ic-drip 2.2s ease-in infinite; }
      @keyframes ic-drip { 0% { transform: translateY(0) scale(0.4); opacity: 0; } 25% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
      .ic-glint { animation: ic-glint 5.5s ease-in-out infinite; }
      @keyframes ic-glint { 0%, 70%, 100% { opacity: 0; } 80% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .wf *, .wf *::before, .wf *::after, .wf-ic *, .wf-alarm { animation-play-state: paused !important; transition: none !important; }
