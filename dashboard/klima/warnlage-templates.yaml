      .wl-dots { position: absolute; right: 12px; bottom: 6px; display: flex; gap: 4px; z-index: 2; }
      .wl-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--nachtblau-label, #b4c0cf); opacity: 0.35; }
