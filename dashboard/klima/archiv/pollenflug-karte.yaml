# ============================================================================
# Pollenflug-Index
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       klima
# Status:        archiv: ersetzt durch pollenflug-karte-v2.yaml
# Karten:        button-card
# Templates:     nachtblau_pollen_popup (warnlage-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Pollenflug-Index im Nachtblau-Stil
# Fasst die bisher einzelnen mushroom-template-Karten zu EINER Nachtblau-Karte
# zusammen: Kopfzeile + 2-spaltiges Raster (wie das 2x2-Raster der Owlet-Smart-Sock-Karte).
#
# - Nur Pollenarten mit Belastung > 0 werden angezeigt, hoechste Stufe zuerst
#   (seit 14.11.2026; vorher in der Reihenfolge von variables.pollen).
# - Die ganze Karte blendet sich aus, wenn keine Art belastet ist (Saison-Ende).
# - Farbe je Stufe aus nachtblau_pollen_fx: bis 1 gruen, bis 2 amber,
#   2,5 (mittel bis hoch) koralle, 3 rot. Halbe Stufen zaehlen seit 14.11.2026
#   zur hoeheren Farbe; Text wie der DWD ("Gering bis mittel").
# - Kopf-Icon faerbt sich nach der hoechsten aktuellen Belastung.
#
# - Tippen oeffnet das Popup "Pollenflug" (Template nachtblau_pollen_popup aus
#   warnlage-templates.yaml) mit allen Arten fuer heute, morgen und
#   uebermorgen; langes Druecken die more-info.
#
# Archiviert am 14.11.2026: Auf Home steht seitdem pollenflug-karte-v2.yaml
# (Template nachtblau_pollen_kachel, wie in der Wetter-View), in der
# Wetter-View die Pollenkachel in "Warnlage & Pollen".
#
# Weitere/andere Region: Eintraege unter variables.pollen und triggers_update
# anpassen (hier DWD-Region 101).
# Voraussetzung: custom:button-card und browser_mod (HACS), Template
# nachtblau_pollen_popup aus warnlage-templates.yaml.
type: custom:button-card
entity: sensor.pollenflug_graeser_101
show_name: false
show_state: false
show_icon: false
show_label: false
template: nachtblau_pollen_popup
triggers_update:
  - sensor.pollenflug_graeser_101
  - sensor.pollenflug_ambrosia_101
  - sensor.pollenflug_beifuss_101
  - sensor.pollenflug_birke_101
  - sensor.pollenflug_erle_101
  - sensor.pollenflug_esche_101
  - sensor.pollenflug_hasel_101
  - sensor.pollenflug_roggen_101
variables:
  pollen:
    - name: Gräser
      entity: sensor.pollenflug_graeser_101
      kind: grass
    - name: Ambrosia
      entity: sensor.pollenflug_ambrosia_101
      kind: pollen
    - name: Beifuß
      entity: sensor.pollenflug_beifuss_101
      kind: pollen
    - name: Birke
      entity: sensor.pollenflug_birke_101
      kind: pollen
    - name: Erle
      entity: sensor.pollenflug_erle_101
      kind: pollen
    - name: Esche
      entity: sensor.pollenflug_esche_101
      kind: pollen
    - name: Hasel
      entity: sensor.pollenflug_hasel_101
      kind: pollen
    - name: Roggen
      entity: sensor.pollenflug_roggen_101
      kind: pollen
styles:
  card:
    - padding: 16px 18px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: '0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))'
    - overflow: hidden
    # Ganze Karte ausblenden, wenn keine Pollenart Belastung > 0 hat
    - display: |
        [[[
          const list = variables.pollen || [];
          const any = list.some((p) => {
            const s = states[p.entity];
            const v = s ? parseFloat(s.state) : NaN;
            return !isNaN(v) && v > 0;
          });
          return any ? 'block' : 'none';
        ]]]
  grid:
    - grid-template-areas: '"body"'
  custom_fields:
    body:
      - width: 100%
custom_fields:
  body: |
    [[[
      // ---------- Palette ----------
      const value = 'var(--nachtblau-text, #f2f5f8)';
      const muted = 'var(--nachtblau-text-sekundaer, #8794a5)';
      const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;

      const list = variables.pollen || [];

      // ---------- Stufen-Info ----------
      // Text und Farbe aus pfx.stufe() (nachtblau_pollen_fx, ueber das Template
      // nachtblau_pollen_popup). Halbe Stufen zaehlen seit 14.11.2026 zur
      // hoeheren Farbe: 1,5 Amber, 2,5 Koralle.
      const lvlInfo = (v) => {
        const st = variables.pfx.stufe(v);
        return { text: st.titel, color: st.c, tint: tint(st.c, 12), border: tint(st.c, 24) };
      };

      // ---------- Icons ----------
      const grassSvg = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:${c};width:23px;height:23px;">
        <path d="M12 21v-9"/>
        <path d="M12 12c0-3.2-1.8-5.6-4.8-6.4.2 3.2 2 5.6 4.8 6.4Z"/>
        <path d="M12 12c0-3.2 1.8-5.6 4.8-6.4-.2 3.2-2 5.6-4.8 6.4Z"/></svg>`;

      const flowerSvg = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:${c};width:23px;height:23px;">
        <circle cx="12" cy="14" r="2.1"/>
        <circle cx="12" cy="9.4" r="2.1"/>
        <circle cx="15.9" cy="11.7" r="2.1"/>
        <circle cx="14.6" cy="16.3" r="2.1"/>
        <circle cx="9.4" cy="16.3" r="2.1"/>
        <circle cx="8.1" cy="11.7" r="2.1"/>
        <circle cx="18.5" cy="5" r="0.5" fill="currentColor" stroke="none"/>
        <circle cx="20.5" cy="6.7" r="0.5" fill="currentColor" stroke="none"/>
        <circle cx="18.2" cy="7.4" r="0.5" fill="currentColor" stroke="none"/></svg>`;

      // ---------- Aktive Arten ----------
      const active = [];
      let maxN = 0;
      list.forEach((p) => {
        const s = states[p.entity];
        const v = s ? parseFloat(s.state) : NaN;
        if (isNaN(v) || v <= 0) return;
        if (v > maxN) maxN = v;
        active.push({ name: p.name, kind: p.kind, n: v });
      });
      // Hoechste Stufe zuerst wie in Pollenkachel und Popup; gleiche Stufe in Listenreihenfolge
      active.sort((x, y) => y.n - x.n);

      // ---------- Zellen ----------
      // Stufentext zweizeilig statt abgeschnitten: bei 306 px bleiben neben dem
      // Icon rund 87 px, "Hohe Belastung" endete bis 14.11.2026 auf "...".
      const cells = active.map((p) => {
        const info = lvlInfo(p.n);
        const icon = (p.kind === 'grass') ? grassSvg(info.color) : flowerSvg(info.color);
        return `
          <div style="display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:16px; background:${info.tint}; border:1px solid ${info.border}; min-width:0;">
            <div style="flex:0 0 auto; width:24px; height:24px; display:grid; place-items:center;">${icon}</div>
            <div style="min-width:0;">
              <div style="font-size:15px; font-weight:700; letter-spacing:-0.01em; color:${value}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
              <div style="font-size:12.5px; font-weight:600; color:${info.color}; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;">${info.text}</div>
            </div>
          </div>`;
      }).join('');

      // ---------- Kopfzeile ----------
      const hdr = lvlInfo(maxN || 1);
      const subtitle = `${active.length} ${active.length === 1 ? 'Pollenart' : 'Pollenarten'} mit Belastung`;

      return `
        <div style="width:100%; color:${value}; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; text-align:left;">
          <div style="display:flex; align-items:center; gap:15px;">
            <div style="flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:${hdr.tint}; border:1px solid ${hdr.border}; display:grid; place-items:center;">${flowerSvg(hdr.color)}</div>
            <div style="min-width:0;">
              <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; line-height:1.15;">Pollenflug</div>
              <div style="font-size:13px; color:${muted}; margin-top:2px;">${subtitle}</div>
            </div>
          </div>
          <div style="margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            ${cells}
          </div>
        </div>`;
    ]]]
