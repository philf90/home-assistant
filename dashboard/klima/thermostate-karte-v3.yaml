# ============================================================================
# Thermostate v3 – radiale Regler mit Animation und Fenster offen
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       klima
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     owlet_heizung_fx (heizung-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Thermostate/Heizung v3 - radiale Soll-Regler mit Animation und "Fenster offen"
# ============================================================================
# Unterschied zur v2 (thermostate-karte-v2.yaml, bleibt unveraendert):
#   - Regler, Statuszeile und Animation kommen aus dem Template
#     owlet_heizung_fx (heizung-templates.yaml).
#   - Neuer Zustand "Fenster offen" (Blau) mit Vorrang vor Heizt/Bereit: Die
#     Heizgruppen senken bei offenem Fenster auf 12 °C ab und melden "idle",
#     v2 zeigte das als gruenes "Bereit". Gestrichelter Bogen und Zeile
#     "Plan" zeigen den Sollwert laut Wochenplan.
#   - Heizt: Waermewellen in der Bogenluecke, Staerke nach Ventiloeffnung in
#     drei Stufen; die Statuszeile nennt den Wert ("Heizt · 15 %").
#   - Kopf-Badge: Flamme flackert, solange ein Raum heizt. Raeume mit offenem
#     Fenster zaehlen nicht als "bereit".
#   Bogen = Soll, Ist gross in der Mitte, Tap = more-info, wie v2.
#
# Fensterkontakte je Raum nach Bereich zugeordnet. Beobachtet (16.10.2026,
# Sollwert innerhalb von 2 s auf 12 °C): Kinderzimmer 1, Kinderzimmer 2,
# Bad unten (beide Kontakte), Kueche. Wohnzimmer, Schlafzimmer und Flur nur
# ueber den Bereich zugeordnet. Bad oben hat keinen Kontakt.
# Die Raumnamen der Kinderzimmer sind neutralisiert ("Kinderzimmer 1/2");
# in der eigenen Instanz den Anzeigenamen im Feld "name" eintragen.
#
# Die Fensterlisten stehen einmal als YAML-Anker in der Kopfzeile
# (variables.raeume) und werden in den Kacheln wiederverwendet.
# Kein triggers_update: button-card v7 kennt die Option nicht mehr und
# aktualisiert die Karte, sobald eine Entitaet wechselt, die ein Template
# ueber states[...] gelesen hat (Badge: alle Raeume und Kontakte).
#
# Voraussetzung: custom:button-card + card-mod (HACS) und das Template
# owlet_heizung_fx.
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopfzeile mit Status-Badge (N heizen / Alle bereit / N bereit / Alle aus) ----
  - type: custom:button-card
    icon: mdi:radiator
    name: Heizung
    show_icon: true
    show_name: true
    show_label: false
    tap_action:
      action: none
    variables:
      raeume:
        - climate: climate.heizung_wohnzimmer_int0000001
          fenster: &fenster_wohnzimmer
            - binary_sensor.fenster_wohnzimmer_hof
            - binary_sensor.fenster_wohnzimmer_links
            - binary_sensor.fenster_wohnzimmer_rechts
        - climate: climate.hmip_heating_int0000002
          fenster: &fenster_kinderzimmer_1
            - binary_sensor.fenster_kinderzimmer
        - climate: climate.hmip_heating_int0000006
          fenster: &fenster_schlafzimmer
            - binary_sensor.fenster_schlafzimmer_hof
            - binary_sensor.fenster_schlafzimmer_links
            - binary_sensor.fenster_schlafzimmer_rechts
        - climate: climate.hmip_heating_int0000004
          fenster: &fenster_kinderzimmer_2
            - binary_sensor.fenster_buro
        - climate: climate.hmip_heating_int0000003
          fenster: &fenster_bad_unten
            - binary_sensor.fenster_bad_unten_links
            - binary_sensor.fenster_bad_unten_rechts
        - climate: climate.hmip_heating_int0000005
          fenster: []
        - climate: climate.hmip_heating_int0000007
          fenster: &fenster_kueche
            - binary_sensor.fenster_kuche
        - climate: climate.hmip_heating_int0000008
          fenster: &fenster_flur
            - binary_sensor.fenster_garderobe
    custom_fields:
      badge: |
        [[[
          // Zaehlen wie die Kacheln: aus / Fenster offen / heizt / bereit.
          // Nicht erreichbare Thermostate (unavailable/unknown) zaehlen nirgends mit.
          let heat=0, off=0, ready=0, open=0;
          (variables.raeume||[]).forEach(r=>{
            const s=states[r.climate];
            if(!s||s.state==='unavailable'||s.state==='unknown') return;
            const act=s.attributes?s.attributes.hvac_action:undefined;
            const offen=(r.fenster||[]).filter(id=>states[id]&&states[id].state==='on').length>0;
            if(s.state==='off') off++;
            else if(offen) open++;
            else if(act==='heating') heat++;
            else ready++;
          });
          // Heizt = Amber, Bereit = Gruen, Aus = gedaempft (grau)
          let c='#8794a5', bg='rgba(255,255,255,0.05)', bd='rgba(255,255,255,0.08)', txt='Alle aus';
          if(heat>0){ c='#e6b566'; bg='rgba(230,181,102,0.12)'; bd='rgba(230,181,102,0.24)'; txt=heat+' heizen'; }
          else if(ready>0){ c='#a6d49e'; bg='rgba(166,212,158,0.12)'; bd='rgba(166,212,158,0.24)'; txt=((off>0||open>0)?(ready+' bereit'):'Alle bereit'); }
          else if(open>0){ c='#7fb3d5'; bg='rgba(127,179,213,0.12)'; bd='rgba(127,179,213,0.24)'; txt=open+' Fenster offen'; }
          // Flammen-Pfad belegt im 24er-Raster nur x 8..16 / y 3..14.8 (Mitte 12/8.9).
          // viewBox auf diese Mitte gelegt, damit das Icon optisch zentriert zum Text sitzt.
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${bg};border:1px solid ${bd};font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <svg class="${heat>0?'hz-flacker':''}" viewBox="3.5 0.4 17 17" width="14" height="14" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M12 3c1.2 3 4 4.2 4 7.8a4 4 0 0 1-8 0c0-1.3.5-2.3 1.1-3.2.4 1.9 1.9 2 1.9.2 0-1.6-1-2.8 1-4.8Z"/></svg>${txt}</span>`;
        ]]]
    extra_styles: |
      .hz-flacker { transform-origin: 50% 85%; animation: hz-flacker 2.6s ease-in-out infinite; }
      @keyframes hz-flacker { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(0.94, 1.08); } 55% { transform: scale(1.04, 0.95); } 75% { transform: scale(0.97, 1.04); } }
      @media (prefers-reduced-motion: reduce) { .hz-flacker { animation: none; } }
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.24)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center

  # ---- Raster aus radialen Reglern (Template owlet_heizung_fx) ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.heizung_wohnzimmer_int0000001
        name: Wohnzimmer
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.heizung_wohnzimmer_int0000001_ventil_offnungsgrad
          window_entities: *fenster_wohnzimmer
        styles: &therm_styles
          card:
            - border-radius: 16px
            - padding: 13px 12px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-areas: '"n" "dial"'
            - grid-template-rows: min-content min-content
            - justify-items: center
          name:
            - justify-self: start
            - align-self: start
            - width: 100%
            - font-size: 13px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            dial:
              - align-self: center
              - margin-top: 4px
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000002
        name: Kinderzimmer 1
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000002_ventil_offnungsgrad
          window_entities: *fenster_kinderzimmer_1
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000006
        name: Schlafzimmer
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000006_ventil_offnungsgrad
          window_entities: *fenster_schlafzimmer
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000004
        name: Kinderzimmer 2
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000004_ventil_offnungsgrad
          window_entities: *fenster_kinderzimmer_2
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000003
        name: Bad unten
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000003_ventil_offnungsgrad
          window_entities: *fenster_bad_unten
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000005
        name: Bad oben
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000005_ventil_offnungsgrad
          window_entities: []
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000007
        name: Küche
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000007_ventil_offnungsgrad
          window_entities: *fenster_kueche
        styles: *therm_styles
      - type: custom:button-card
        template: owlet_heizung_fx
        entity: climate.hmip_heating_int0000008
        name: Flur
        show_icon: false
        show_name: true
        show_state: false
        variables:
          valve_entity: sensor.hmip_heating_int0000008_ventil_offnungsgrad
          window_entities: *fenster_flur
        styles: *therm_styles
