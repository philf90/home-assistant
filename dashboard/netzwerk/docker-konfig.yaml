# ============================================================================
# Docker – Ereignisse, Absturzmeldung und Sammel-Update fuer die Docker-View
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       netzwerk
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
# Platzhalter:   notify.mobile_app_iphone
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Docker – Paket fuer die Docker-View (docker-view.yaml)
#
#   input_boolean.docker_meldung_absturz
#       Schalter "Push bei Absturz oder OOM" in der Karte Ereignisse.
#   input_datetime.docker_agent_getrennt_seit,
#   input_datetime.docker_arcane_nicht_erreichbar_seit
#       Merker fuer "Docker: Agent getrennt melden": Beginn eines gemeldeten
#       Ausfalls, Zeitstempel 0 = keiner gemeldet.
#   automation "Docker: Ereignisse ins Logbuch"
#       Schreibt die Ereignisse der Arcane-Integration mit deutschem Text ins
#       Logbuch, angehaengt an binary_sensor.local_docker_online. Die Karte
#       Ereignisse ist eine Logbuch-Karte auf diese Entitaet.
#         arcane_container_state_changed   gestartet, gestoppt, abgestuerzt
#         arcane_container_health_changed  nur healthy und unhealthy; den
#                                          Healthcheck-Start ("starting")
#                                          gibt es nach jedem Start
#         arcane_project_state_changed     Projekt laeuft, teilweise, gestoppt
#         arcane_event environment.disconnect / environment.connect
#                                          "docker-02 getrennt" / "wieder
#                                          verbunden" (HA-Arcane ab 0.8.0,
#                                          Option "Arcane Ereignisprotokoll
#                                          auf dem Bus")
#         arcane_event container.oom       "Speicher voll (OOM, vom Docker-
#                                          Daemon gemeldet)"
#       Von arcane_event nur diese drei Typen: Eine Beobachtung vom 15. bis
#       16.11.2026 (169 Ereignisse in 23 Stunden) bestand zu rund 93 % aus
#       Aufraeumen (image.untag, image.delete, image.prune, network.prune),
#       automatischen Updates (system.auto_update, image.pull, image.tag,
#       project.update) und Arcanes eigenen Benachrichtigungen
#       (notification.send). Nach Schwere zu filtern taugt nicht: Arcane
#       stuft container.delete bei jedem Auto-Update und von Hand geloeschte
#       Images als warning ein, und beim Neustart des Agenten kam ein
#       container.error ohne Containernamen. container.die nutzt das Paket
#       nicht: Es kaeme fast immer zusaetzlich zum Zustandswechsel, also
#       doppelt, und ein gewollter Stopp liefert auch ein die (Code 0). Nur
#       ein Container, der zwischen zwei Abfragen abstuerzt und gleich neu
#       startet, erschiene allein ueber container.die (mit Exit-Code
#       ungleich 0, Schwere warning); diese Luecke bleibt.
#       Ereignisse eines entfernten Hosts (HA-Arcane ab 0.11.0, environment_id
#       nicht "0") tragen den Namen der Umgebung vor dem Container
#       ("docker-02 portainer gestartet").
#   automation "Docker: Absturz melden"
#       Push, wenn ein Container abstuerzt. HA-Arcane setzt crashed, wenn
#       ein laufender Container mit Exit-Code ungleich 0 endet. Code 143
#       (SIGTERM) ist ein regulaerer Stopp und wird nicht gemeldet. Code 137
#       heisst SIGKILL: Das kann Speichermangel sein, aber auch ein Stopp,
#       den Docker nach Ablauf der Wartezeit erzwingt; der Push sagt deshalb
#       "SIGKILL oder Speicher voll" (oom_killed von HA-Arcane schliesst nur
#       aus dem Code). Echten Speichermangel meldet der Docker-Daemon als
#       container.oom (arcane_event, Schwere error, HA-Arcane ab 0.8.0 mit
#       Option "Arcane Ereignisprotokoll auf dem Bus"); dafuer kommt ein
#       eigener Push "Speicher voll". Bei einem OOM kommen also zwei Pushes,
#       Absturz mit Code 137 und Speicher voll. Typ, Schwere und Felder
#       stammen aus dem Quellcode von Arcane (backend/internal/event/
#       service.go, mapDaemonEvent). Erprobt am 16.11.2026 auf docker-01
#       mit einem alpine-Container mit 32 MB Speichergrenze (mem_limit und
#       memswap_limit), der nach 30 s "tail /dev/zero" startete:
#       Zustandswechsel auf exited mit Code 137 und 10 ms spaeter
#       container.oom kamen in derselben Aktualisierung; beide Pushes
#       gingen raus ("oom-test abgestuerzt", "oom-test Speicher voll"),
#       beide Eintraege stehen im Logbuch. Laeuft ein Container kuerzer als
#       eine Aktualisierung (hoechstens 10 s), fehlt der Zustandswechsel
#       (HA-Arcane meldet keinen fuer einen eben erst aufgetauchten
#       Container), container.oom kaeme trotzdem; aus dem Code von
#       HA-Arcane geschlossen, nicht erprobt.
#   automation "Docker: Auto-Update fehlgeschlagen melden"
#       Push und Logbuch-Eintrag, wenn ein Lauf von Arcanes automatischen
#       Updates fehlschlaegt (failed) oder nur teilweise klappt (partial).
#       Quelle sind die Sensoren "Job Auto Update" je Umgebung (HA-Arcane ab
#       0.10.0, Option "Arcane Hintergrund-Jobs"); hier die beiden Umgebungen
#       docker-01 und docker-02, fuer andere Umgebungen die Liste anpassen.
#       Ausgeloest wird bei jedem neuen Lauf (Attribut last_run aendert sich),
#       damit auch ein zweiter Fehlschlag in Folge gemeldet wird; nach einem
#       Neustart oder Neuladen (Sensor vorher unavailable) nicht. Abgebrochene
#       Laeufe (canceled, etwa wenn Arcane sich selbst neu startet) meldet sie
#       nicht.
#       Dazu meldet sie einen ausbleibenden Lauf: Der Job ist eingeschaltet,
#       aber next_run liegt mehr als 15 Minuten zurueck oder Arcane nennt
#       keinen naechsten Lauf (kein installierter Zeitplan). Einmal je
#       Ausbleiben; erneut erst, nachdem wieder ein Lauf kam. Ist die Umgebung
#       ganz unerreichbar (Sensor unavailable), meldet sie nichts.
#   automation "Docker: Agent getrennt melden"
#       Push und Logbuch-Eintrag, wenn der Arcane-Agent eines entfernten
#       Hosts (hier docker-02) laenger als 5 Minuten getrennt ist, und ein
#       zweiter, wenn er nach so einer Trennung wieder verbunden ist (mit der
#       Dauer). Quelle ist der Binaersensor Online der Umgebung; HA-Arcane ab
#       0.11.1 haelt ihn bei getrenntem Agenten verfuegbar (aus) und zeigt
#       daneben "Agent letzter Kontakt", der in der Meldung steht. Kuerzere
#       Trennungen (Neustart des Agenten) bleiben still, ebenso eine in
#       Arcane deaktivierte oder in den Optionen abgewaehlte Umgebung (nur
#       deren Sensor unavailable). Fuer einen weiteren Agenten zwei
#       Ausloeser, einen Merker (input_datetime) und den Kontakt-Sensor in der
#       Meldung ergaenzen.
#       Merker: Ein gemeldeter Ausfall steht mit seinem Beginn in
#       input_datetime.docker_agent_getrennt_seit bzw.
#       input_datetime.docker_arcane_nicht_erreichbar_seit, Zeitstempel 0 =
#       nichts gemeldet. Vorher (bis 20.11.2026) meldete ein Neustart von HA
#       mitten in einer Trennung sie nach 5 Minuten ein zweites Mal
#       (unavailable -> off), "wieder verbunden" fehlte nach off ->
#       unavailable -> on, und die Dauer zaehlte ab dem Neustart, weil HA
#       last_changed beim Start neu setzt; unter 5 Minuten kam dann gar keine
#       Meldung. Jetzt meldet "getrennt" nur ohne gemerkten Ausfall,
#       "wieder verbunden" reagiert auf jeden Wechsel nach "an", aber nur mit
#       gemerktem Ausfall, und die Dauer zaehlt ab dem Merker.
#       Die Logbuch-Eintraege haengen an binary_sensor.local_docker_online,
#       weil die Karte Ereignisse nur diese Entitaet zeigt (vorher hingen die
#       Agent-Eintraege an binary_sensor.docker_02_online und waren dort
#       unsichtbar).
#       Dazu "Arcane nicht erreichbar": Antwortet Arcane selbst nicht (Host
#       oder Container weg), sind alle Docker-Entitaeten unavailable, auch
#       binary_sensor.local_docker_online. Ist der laenger als 5 Minuten
#       unavailable, kommt eine Meldung, und nach so einem Ausfall eine
#       zweite, wenn Arcane wieder antwortet. Der Sensor von docker-02 meldet
#       dabei nichts: Er ist unavailable statt aus, und bei seiner Rueckkehr
#       ist keine Trennung gemerkt. Eine in
#       Home Assistant abgeschaltete Arcane-Integration meldet sich hier
#       ebenfalls als "nicht erreichbar".
#   script.docker_alle_updates_installieren
#       "Alle aktualisieren" in der Karte Image-Updates: installiert die
#       ausstehenden Image-Updates aller Hosts nacheinander, Container mit
#       einem Image von getarcaneapp (Arcane, Agenten) zuletzt (ihr Neustart
#       trennt die Verbindung zum Host kurz).
#       Updates, die Arcane zurueckhaelt (update_blocked, ab HA-Arcane
#       0.7.0), laesst es aus; HA wuerde sie ohnehin ablehnen. Waehrend
#       Arcanes Updater auf einem Host installiert (binary_sensor.*_updates_
#       werden_installiert je Umgebung, ab 0.9.0), startet es nicht. Seit HA-Arcane 0.9.0
#       meldet ein uebersprungenes oder fehlgeschlagenes Update einen
#       Fehler; das Skript macht weiter und schreibt am Ende ins Logbuch,
#       das die Karte Ereignisse zeigt: "3 von 4 erledigt · offen: grafana"
#       (erledigt = steht danach nicht mehr an).
#   script.docker_aufraeumen und input_text.docker_aufraeumen_status,
#   input_text.docker_02_aufraeumen_status
#       "Aufraeumen" in der Karte Speicher & Aufraeumen (je Host) und im
#       Pop-up eines Agenten in der Karte Hosts, mit Rueckmeldung. Feld knopf:
#       der Prune-Button des Hosts ("Ungenutztes entfernen"); ohne Angabe
#       button.docker_ungenutztes_entfernen (docker-01). Image-Speicher und
#       freigebbaren Speicher sucht das Skript unter den Entitaeten desselben
#       Geraets (Endungen _image_speicher, _freigebbarer_image_speicher).
#       Modus parallel: Zwei Hosts koennen gleichzeitig aufraeumen. Derselbe
#       Host startet nicht ein zweites Mal, solange sein Helfer auf
#       aufraeumen oder bericht steht und der Beginn hoechstens 25 Minuten
#       zurueckliegt (danach gilt ein abgebrochener Lauf als beendet).
#       Je Host ein Helfer, benannt nach dem Anfang der Button-ID:
#       button.docker_ungenutztes_entfernen -> input_text.docker_aufraeumen_
#       status, button.docker_02_ungenutztes_entfernen -> input_text.
#       docker_02_aufraeumen_status; fuer einen weiteren Host einen Helfer
#       nach diesem Muster anlegen. Das Skript schreibt seine Phase in den
#       Helfer, den jedes Geraet sieht:
#         aufraeumen;<Beginn>;      Prune laeuft (button.press wartet darauf)
#         bericht;<Beginn>;         Prune fertig, neuer Speicherbericht steht aus
#         fertig;<Beginn>;<GB>      freigegebene Menge in GB
#       <Beginn> ist UTC (ISO 8601). Die Menge ist der Image-Speicher vorher
#       minus nachher, gelesen direkt nach dem Druck. Arcane 3 raeumt im
#       Hintergrund auf und antwortet, bevor etwas geloescht ist; erst
#       HA-Arcane ab 0.10.1 laesst den Druck warten, bis Arcane fertig ist,
#       und aktualisiert die Zaehler, bevor er zurueckkehrt. Mit aelteren
#       Fassungen las das Skript den Stand vor dem Prune: am 16.11.2026
#       "nichts freizugeben", obwohl 5 Images und rund 1,25 GB weg waren
#       (am 15.11. passte es zufaellig). Auf den neuen Bericht wartet das
#       Skript danach nur noch fuer die Anzeige, bis report_started_at
#       (HA-Arcane ab 0.7.1) nach dem Beginn liegt; mit 0.7.0 fehlt das
#       Attribut, dann zaehlt eine Aenderung des Werts, sonst endet das
#       Warten nach 20 Minuten (Intervall 15). Ohne die Option "Freigebbarer
#       Speicher" wartet es nicht. Zum Schluss ein Eintrag im Logbuch, den
#       die Karte Ereignisse zeigt, bei einem Agenten mit dem Host im Namen
#       ("Aufraeumen docker-02").
#
# Namen in Meldungen ohne Compose-Anhaengsel wie in der Karte
# ("sonarr-sonarr-1" -> "sonarr").
#
# In der eigenen Instanz sind Helfer, Automationen und Skript ueber die
# Oberflaeche angelegt (Inhalt identisch). Dieses Paket ist die Fassung zum
# Nachbauen; nicht beides zugleich verwenden, sonst gibt es alles doppelt.
#
# Voraussetzung
#   - Integration Arcane (HACS) mit Option Events an (Standard) und den
#     API-Rechten image-updates:apply (Sammel-Update; bis HA-Arcane 0.8.1
#     containers:redeploy), system:prune und activities:read
#     (Aufraeumen); fuer eine richtige Rueckmeldung HA-Arcane ab 0.10.1,
#     fuer den neuen Speicherbericht dazu die Option "Freigebbarer Speicher";
#     fuer die Auto-Update-Meldung HA-Arcane ab 0.10.0 mit Option "Arcane
#     Hintergrund-Jobs" und Recht jobs:list; fuer die Meldung eines
#     getrennten Agenten HA-Arcane ab 0.11.1
#   - Companion App fuer die Push-Meldung
#   - in configuration.yaml:
#       homeassistant:
#         packages:
#           docker: !include docker-konfig.yaml

input_boolean:
  docker_meldung_absturz:
    name: Docker Meldung Absturz
    icon: mdi:bell-alert

input_text:
  docker_aufraeumen_status:
    name: Docker Aufräumen Status
    icon: mdi:broom
    max: 100
  docker_02_aufraeumen_status:
    name: Docker 02 Aufräumen Status
    icon: mdi:broom
    max: 100

# Beginn eines gemeldeten Ausfalls fuer "Docker: Agent getrennt melden";
# Zeitstempel 0 (1970) = nichts gemeldet. Nach dem Anlegen einmal auf 0 setzen
# (input_datetime.set_datetime mit timestamp: 0), sonst gilt das Anlegedatum.
input_datetime:
  docker_agent_getrennt_seit:
    name: Docker Agent getrennt seit
    icon: mdi:lan-disconnect
    has_date: true
    has_time: true
  docker_arcane_nicht_erreichbar_seit:
    name: Docker Arcane nicht erreichbar seit
    icon: mdi:server-network-off
    has_date: true
    has_time: true

automation:
  - id: docker_ereignisse_ins_logbuch
    alias: "Docker: Ereignisse ins Logbuch"
    description: >-
      Docker-View, Karte Ereignisse: schreibt die Ereignisse der
      Arcane-Integration ins Logbuch von binary_sensor.local_docker_online.
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: arcane_container_state_changed
        id: zustand
      - trigger: event
        event_type: arcane_container_health_changed
        event_data:
          health: healthy
        id: health
      - trigger: event
        event_type: arcane_container_health_changed
        event_data:
          health: unhealthy
        id: health
      - trigger: event
        event_type: arcane_project_state_changed
        id: projekt
      - trigger: event
        event_type: arcane_event
        event_data:
          type: environment.disconnect
        id: umgebung
      - trigger: event
        event_type: arcane_event
        event_data:
          type: environment.connect
        id: umgebung
      - trigger: event
        event_type: arcane_event
        event_data:
          type: container.oom
        id: oom
    conditions: []
    variables:
      name: >-
        {%- set d = trigger.event.data -%}
        {%- if trigger.id == 'umgebung' -%}
          {{ d.resource_name or d.environment or 'Umgebung' }}
        {%- else -%}
        {%- set roh = d.project if trigger.id == 'projekt' else (d.resource_name if trigger.id == 'oom' else d.container) -%}
        {%- set n = roh | regex_replace('-\d+$', '') -%}
        {%- set t = n.split('-') -%}
        {%- set h = (t | count) // 2 -%}
        {%- set n = t[:h] | join('-') if (t | count) is even and t[:h] == t[h:] else n -%}
        {#- entfernter Host (HA-Arcane ab 0.11.0): Name der Umgebung davor -#}
        {{ (d.environment ~ ' ') if d.environment and d.environment_id and d.environment_id != '0' else '' }}{{ n }}
        {%- endif -%}
      meldung: >-
        {%- set d = trigger.event.data -%}
        {%- if trigger.id == 'zustand' -%}
          {%- if d.oom_killed -%}abgestürzt (Code 137: SIGKILL oder Speicher voll)
          {%- elif d.crashed and d.exit_code == 143 -%}beendet (SIGTERM, Code 143)
          {%- elif d.crashed -%}abgestürzt (Code {{ d.exit_code }})
          {%- elif d.state == 'running' -%}{{ 'neu gestartet' if d.previous_state == 'restarting' else 'gestartet' }}
          {%- else -%}{{ {'exited': 'gestoppt', 'restarting': 'startet neu', 'paused': 'pausiert', 'removing': 'wird entfernt', 'created': 'angelegt', 'dead': 'ausgefallen (dead)'}.get(d.state, 'Zustand ' ~ d.state) }}
          {%- endif -%}
        {%- elif trigger.id == 'health' -%}
          {{ 'Healthcheck bestanden' if d.health == 'healthy' else 'ungesund (Healthcheck fehlgeschlagen)' }}
        {%- elif trigger.id == 'umgebung' -%}
          {{ 'getrennt' if d.type == 'environment.disconnect' else 'wieder verbunden' }}
        {%- elif trigger.id == 'oom' -%}
          Speicher voll (OOM, vom Docker-Daemon gemeldet)
        {%- else -%}
          {{ {'running': 'Projekt läuft', 'partially running': 'Projekt läuft nur teilweise', 'stopped': 'Projekt gestoppt'}.get(d.status, 'Projekt: ' ~ d.status) }}
        {%- endif -%}
    actions:
      - action: logbook.log
        data:
          name: "{{ name }}"
          message: "{{ meldung }}"
          entity_id: binary_sensor.local_docker_online

  - id: docker_absturz_melden
    alias: "Docker: Absturz melden"
    description: >-
      Docker-View, Karte Ereignisse: Push bei Absturz oder OOM eines
      Containers, solange input_boolean.docker_meldung_absturz an ist.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: arcane_container_state_changed
        event_data:
          crashed: true
        id: absturz
      - trigger: event
        event_type: arcane_event
        event_data:
          type: container.oom
        id: oom
    conditions:
      - condition: state
        entity_id: input_boolean.docker_meldung_absturz
        state: "on"
      # OOM immer; ein Absturz nur ohne Code 143. Der Exit-Code steht nur in
      # den Ereignisdaten, eine native Bedingung dafuer gibt es nicht.
      - condition: or
        conditions:
          - condition: trigger
            id: oom
          - condition: template
            value_template: "{{ trigger.event.data.exit_code != 143 }}"
    variables:
      name: >-
        {%- set d = trigger.event.data -%}
        {%- set n = (d.resource_name if trigger.id == 'oom' else d.container) | regex_replace('-\d+$', '') -%}
        {%- set t = n.split('-') -%}
        {%- set h = (t | count) // 2 -%}
        {{ t[:h] | join('-') if (t | count) is even and t[:h] == t[h:] else n }}
    actions:
      - action: notify.mobile_app_iphone
        data:
          title: "Docker: {{ name }} {{ 'Speicher voll' if trigger.id == 'oom' else 'abgestürzt' }}"
          message: >-
            {%- set d = trigger.event.data -%}
            {%- if trigger.id == 'oom' -%}Der Docker-Daemon meldet Speichermangel (OOM)
            {%- elif d.exit_code == 137 -%}Exit-Code 137 (SIGKILL oder Speicher voll)
            {%- else -%}Exit-Code {{ d.exit_code }}
            {%- endif %} · {{ d.environment or 'Docker' }}
          data:
            url: /dashboard-home/docker
            clickAction: /dashboard-home/docker
            group: docker

  - id: docker_auto_update_fehlgeschlagen_melden
    alias: "Docker: Auto-Update fehlgeschlagen melden"
    description: >-
      Push und Eintrag im Logbuch der Docker-View (Karte Ereignisse), wenn
      ein Lauf von Arcanes automatischen Updates fehlschlaegt, nur teilweise
      klappt oder ausbleibt. Quelle: Sensoren "Job Auto Update" je Umgebung
      (HA-Arcane ab 0.10.0).
    mode: queued
    max: 10
    triggers:
      # Jeder neue Lauf aendert last_run, auch bei gleichem Ergebnis
      - trigger: state
        entity_id:
          - sensor.docker_01_job_auto_update
          - sensor.docker_02_job_auto_update
        attribute: last_run
        id: lauf_beendet
      # Ausgeblieben: Template, weil die Frist an der Uhrzeit haengt (now()
      # rendert jede Minute neu); je Umgebung ein Ausloeser
      - trigger: template
        id: ausgeblieben
        variables:
          job: sensor.docker_01_job_auto_update
        value_template: >-
          {% set e = 'sensor.docker_01_job_auto_update' %}
          {% set n = state_attr(e, 'next_run') %}
          {{ states(e) != 'unavailable' and state_attr(e, 'enabled') == true
             and (n is none or now() - as_datetime(n) > timedelta(minutes=15)) }}
      - trigger: template
        id: ausgeblieben
        variables:
          job: sensor.docker_02_job_auto_update
        value_template: >-
          {% set e = 'sensor.docker_02_job_auto_update' %}
          {% set n = state_attr(e, 'next_run') %}
          {{ states(e) != 'unavailable' and state_attr(e, 'enabled') == true
             and (n is none or now() - as_datetime(n) > timedelta(minutes=15)) }}
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: lauf_beendet
              # Templates: Eine Zustandsbedingung auf mehrere Entitaeten
              # verlangt den Zustand bei allen; gemeint ist nur die
              # ausloesende. Nach Neustart oder Neuladen nicht melden.
              - condition: template
                value_template: >-
                  {{ trigger.from_state is not none
                     and trigger.from_state.state not in ['unavailable', 'unknown'] }}
              - condition: template
                value_template: "{{ trigger.to_state.state in ['failed', 'partial'] }}"
            sequence:
              - variables:
                  umgebung: "{{ trigger.to_state.name | replace(' Job Auto Update', '') }}"
              - variables:
                  ergebnis: >-
                    {{ 'fehlgeschlagen' if trigger.to_state.state == 'failed'
                       else 'teilweise fehlgeschlagen' }}
              - variables:
                  grund: >-
                    {{ trigger.to_state.attributes.last_error
                       or trigger.to_state.attributes.message
                       or 'ohne Meldung von Arcane' }}
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Auto-Update {{ ergebnis }}"
                  message: "{{ grund }} · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              - action: logbook.log
                data:
                  name: Auto-Update
                  message: "{{ ergebnis }} · {{ grund }} · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online
          - conditions:
              - condition: trigger
                id: ausgeblieben
            sequence:
              - variables:
                  umgebung: >-
                    {{ state_attr(job, 'friendly_name') | replace(' Job Auto Update', '') }}
              - variables:
                  faellig: >-
                    {% set n = state_attr(job, 'next_run') %}
                    {{ 'fällig seit ' ~ as_local(as_datetime(n)).strftime('%H:%M') ~ ' Uhr'
                       if n is not none else 'kein nächster Lauf geplant' }}
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Auto-Update ausgeblieben"
                  message: "{{ faellig }} · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              - action: logbook.log
                data:
                  name: Auto-Update
                  message: "ausgeblieben · {{ faellig }} · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online

  - id: docker_agent_getrennt_melden
    alias: "Docker: Agent getrennt melden"
    description: >-
      Push und Logbuch, wenn der Arcane-Agent von docker-02 laenger als
      5 Minuten getrennt ist, und wenn er danach wieder verbunden ist (mit der
      Dauer). Ebenso, wenn Arcane selbst laenger als 5 Minuten nicht
      erreichbar ist (Online-Sensor von docker-01 unavailable), und wenn es
      danach wieder antwortet. Ein gemeldeter Ausfall steht mit seinem Beginn
      in input_datetime.docker_agent_getrennt_seit bzw.
      input_datetime.docker_arcane_nicht_erreichbar_seit (0 = nichts
      gemeldet).
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: binary_sensor.docker_02_online
        to: "off"
        for:
          minutes: 5
        id: getrennt
      # Ohne from: auch off -> unavailable -> on (Neustart von HA oder Arcane
      # dazwischen). Ob eine Trennung gemeldet war, sagt der Merker.
      - trigger: state
        entity_id: binary_sensor.docker_02_online
        to: "on"
        id: wieder_da
      # Arcane antwortet nicht: alle Entitaeten unavailable. Nur der Sensor
      # der lokalen Umgebung, damit es eine Meldung bleibt; eine abgewaehlte
      # entfernte Umgebung macht nur ihren eigenen Sensor unavailable.
      - trigger: state
        entity_id: binary_sensor.local_docker_online
        to: unavailable
        for:
          minutes: 5
        id: arcane_weg
      - trigger: state
        entity_id: binary_sensor.local_docker_online
        to: "on"
        id: arcane_wieder_da
    actions:
      - variables:
          umgebung: "{{ trigger.to_state.name | replace(' Online', '') }}"
      - choose:
          - conditions:
              - condition: trigger
                id: getrennt
              # Noch nicht gemeldet. Nach einem Neustart mitten in einer
              # gemeldeten Trennung steht hier ihr Beginn: keine zweite Meldung.
              - condition: numeric_state
                entity_id: input_datetime.docker_agent_getrennt_seit
                attribute: timestamp
                below: 1
            sequence:
              - variables:
                  text: >-
                    {%- set k = states('sensor.docker_02_agent_letzter_kontakt') -%}
                    seit {{ as_local(trigger.to_state.last_changed).strftime('%H:%M') }}
                    Uhr nicht verbunden{% if k not in ['unknown', 'unavailable'] %}
                    · letzter Kontakt {{ as_local(as_datetime(k)).strftime('%H:%M') }}
                    Uhr{% endif %}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.docker_agent_getrennt_seit
                data:
                  timestamp: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Agent getrennt"
                  message: "{{ text }} · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              # Logbuch an den Sensor, den die Ereignisse-Karte zeigt
              - action: logbook.log
                data:
                  name: Agent
                  message: "getrennt · {{ text }} · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online
          - conditions:
              - condition: trigger
                id: wieder_da
              # Nur nach einer gemeldeten Trennung
              - condition: numeric_state
                entity_id: input_datetime.docker_agent_getrennt_seit
                attribute: timestamp
                above: 0
            sequence:
              # Dauer ab dem gemerkten Beginn; last_changed setzt ein Neustart neu
              - variables:
                  dauer: >-
                    {{ ((now().timestamp()
                         - state_attr('input_datetime.docker_agent_getrennt_seit', 'timestamp') | float(0))
                        / 60) | round(0) | int }}
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Agent wieder verbunden"
                  message: "nach {{ dauer }} Min. · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              - action: logbook.log
                data:
                  name: Agent
                  message: "wieder verbunden nach {{ dauer }} Min. · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.docker_agent_getrennt_seit
                data:
                  timestamp: 0
          - conditions:
              - condition: trigger
                id: arcane_weg
              - condition: numeric_state
                entity_id: input_datetime.docker_arcane_nicht_erreichbar_seit
                attribute: timestamp
                below: 1
            sequence:
              - variables:
                  text: >-
                    seit {{ as_local(trigger.to_state.last_changed).strftime('%H:%M') }}
                    Uhr keine Antwort von Arcane · alle Docker-Entitäten nicht verfügbar
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.docker_arcane_nicht_erreichbar_seit
                data:
                  timestamp: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Arcane nicht erreichbar"
                  message: "{{ text }} · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              - action: logbook.log
                data:
                  name: Arcane
                  message: "nicht erreichbar · {{ text }} · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online
          - conditions:
              - condition: trigger
                id: arcane_wieder_da
              - condition: numeric_state
                entity_id: input_datetime.docker_arcane_nicht_erreichbar_seit
                attribute: timestamp
                above: 0
            sequence:
              - variables:
                  dauer: >-
                    {{ ((now().timestamp()
                         - state_attr('input_datetime.docker_arcane_nicht_erreichbar_seit', 'timestamp') | float(0))
                        / 60) | round(0) | int }}
              - action: notify.mobile_app_iphone
                data:
                  title: "Docker: Arcane wieder erreichbar"
                  message: "nach {{ dauer }} Min. · {{ umgebung }}"
                  data:
                    url: /dashboard-home/docker
                    clickAction: /dashboard-home/docker
                    group: docker
              - action: logbook.log
                data:
                  name: Arcane
                  message: "wieder erreichbar nach {{ dauer }} Min. · {{ umgebung }}"
                  entity_id: binary_sensor.local_docker_online
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.docker_arcane_nicht_erreichbar_seit
                data:
                  timestamp: 0

script:
  docker_alle_updates_installieren:
    alias: "Docker: alle Image-Updates installieren"
    description: >-
      Docker-View, Karte Image-Updates: installiert die ausstehenden
      Image-Updates nacheinander, den Arcane-Container zuletzt, und
      schreibt das Ergebnis ins Logbuch. Gesperrte Updates (update_blocked)
      laesst es aus; waehrend Arcanes Updater auf einem Host installiert,
      startet es nicht. Container aller Hosts; Arcane und Agenten zuletzt.
    icon: mdi:package-up
    mode: single
    sequence:
      # Kein Updater eines Hosts darf laufen ("Updates werden installiert" je
      # Umgebung; ohne Option "Arcane Updater" gibt es keinen, dann geht es).
      - condition: template
        value_template: >-
          {{ integration_entities('arcane')
             | select('match', 'binary_sensor\..*_updates_werden_installiert$')
             | select('is_state', 'on') | list | count == 0 }}
      # Container mit einem Image von getarcaneapp (Arcane selbst und jeder
      # Agent, HA-Arcane ab 0.11.0) zuletzt: ihr Neustart trennt die
      # Verbindung zum Host kurz.
      - variables:
          liste: >-
            {%- set alle = integration_entities('arcane')
                | select('match', 'update\.container_')
                | select('is_state', 'on')
                | reject('is_state_attr', 'update_blocked', true) | list -%}
            {%- set ns = namespace(vorn=[], hinten=[]) -%}
            {%- for u in alle -%}
              {%- set b = u | regex_replace('^update\.', '') | regex_replace('_image_update$', '') -%}
              {%- if 'getarcaneapp/' in states('sensor.' ~ b ~ '_image') -%}
                {%- set ns.hinten = ns.hinten + [u] -%}
              {%- else -%}
                {%- set ns.vorn = ns.vorn + [u] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.vorn + ns.hinten }}
      - condition: template
        value_template: "{{ liste | count > 0 }}"
      - repeat:
          for_each: "{{ liste }}"
          sequence:
            - action: update.install
              target:
                entity_id: "{{ repeat.item }}"
              continue_on_error: true
            # Nach dem Installieren fragt die Integration neu ab; erst dann
            # steht das Update auf off. Bleibt es on (uebersprungen,
            # fehlgeschlagen), geht es nach 30 s weiter.
            - wait_template: "{{ not is_state(repeat.item, 'on') }}"
              timeout: "00:00:30"
      # Ergebnis aus dem Stand danach, nicht aus Fehlern der Schleife: Ein
      # Update, das noch ansteht, ist offen. "erledigt" statt "installiert",
      # weil Arcane ein uebersprungenes Update auch verwerfen kann.
      - variables:
          offen: "{{ liste | select('is_state', 'on') | list }}"
      - variables:
          meldung: >-
            {%- set ns = namespace(n=[]) -%}
            {%- for e in offen -%}
              {%- set n = (state_attr(e, 'friendly_name') or e)
                  | regex_replace('^Container ', '') | regex_replace(' Image Update$', '')
                  | regex_replace('-\d+$', '') -%}
              {#- "docker-02 dockge-dockge": Host abtrennen, kuerzen, voranstellen -#}
              {%- set teile = n.split(' ', 1) -%}
              {%- set vor = teile[0] ~ ' ' if teile | count > 1 else '' -%}
              {%- set n = teile[-1] -%}
              {%- set t = n.split('-') -%}
              {%- set h = (t | count) // 2 -%}
              {%- set ns.n = ns.n + [vor ~ (t[:h] | join('-') if (t | count) is even and t[:h] == t[h:] else n)] -%}
            {%- endfor -%}
            {{ (liste | count) - (offen | count) }} von {{ liste | count }} erledigt
            {{- (' · offen: ' ~ (ns.n | join(', '))) if ns.n else '' }}
      - action: logbook.log
        data:
          name: Image-Updates
          message: "{{ meldung }}"
          entity_id: binary_sensor.local_docker_online

  docker_aufraeumen:
    alias: "Docker: Ungenutztes aufräumen"
    description: >-
      Docker-View, Karte Speicher & Aufräumen: entfernt auf einem Host
      ungenutzte Images, Netzwerke und den Build-Cache (Button der
      Arcane-Integration, Feld knopf), meldet die freigegebene Menge und
      wartet auf den neuen Speicherbericht. Braucht HA-Arcane ab 0.10.1:
      erst dann kehrt der Druck zurueck, wenn Arcane fertig aufgeraeumt hat.
      Phase und Ergebnis stehen im Status-Helfer des Hosts.
    icon: mdi:broom
    mode: parallel
    max: 5
    fields:
      knopf:
        name: Prune-Button
        description: >-
          Button "Ungenutztes entfernen" des Hosts; ohne Angabe docker-01.
        example: button.docker_02_ungenutztes_entfernen
        selector:
          entity:
            filter:
              integration: arcane
              domain: button
    sequence:
      - variables:
          taste: >-
            {{ knopf if knopf is defined and knopf else 'button.docker_ungenutztes_entfernen' }}
      - variables:
          ents: "{{ device_entities(device_id(taste)) | list }}"
      # Unabhaengige Werte; je Block nur Werte, die nicht aufeinander zugreifen
      # (die Oberflaeche sortiert die Schluessel eines Blocks alphabetisch).
      - variables:
          speicher: >-
            {{ ents | select('match', 'sensor\\..*_image_speicher$')
               | reject('search', '_freigebbarer_') | first | default('', true) }}
          bericht_sensor: >-
            {{ ents | select('match', 'sensor\\..*_freigebbarer_image_speicher$') | first | default('', true) }}
          helfer: >-
            input_text.{{ taste.split('.')[1] | regex_replace('_ungenutztes_entfernen$', '') }}_aufraeumen_status
          name: >-
            {{ 'Aufräumen ' ~ (device_attr(device_id(taste), 'name_by_user') or device_attr(device_id(taste), 'name'))
               if device_attr(device_id(taste), 'model') == 'Arcane Agent' else 'Aufräumen' }}
      # Sperre je Host: laeuft fuer diesen Host schon ein Lauf, nicht noch einmal
      - condition: template
        value_template: >-
          {%- set t = (states(helfer) ~ ';;').split(';') -%}
          {%- set b = as_datetime(t[1]) if t[1] else none -%}
          {{ t[0] not in ['aufraeumen', 'bericht'] or b is none
             or (utcnow() - b).total_seconds() > 1500 }}
      - variables:
          beginn: "{{ utcnow().isoformat() }}"
          vorher: "{{ states(speicher) | float(none) if speicher else none }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ helfer }}"
        data:
          value: "aufraeumen;{{ beginn }};"
      # Ab HA-Arcane 0.10.1 kehrt der Druck erst zurueck, wenn Arcane das
      # Aufraeumen beendet hat und die Zaehler neu abgefragt sind.
      - action: button.press
        target:
          entity_id: "{{ taste }}"
      # Je Wert ein eigener Schritt: Ueber die Oberflaeche gespeichert, sortiert
      # HA die Schluessel eines Blocks alphabetisch, und "frei" laese dann
      # "nachher", bevor es feststeht.
      - variables:
          nachher: "{{ states(speicher) | float(none) if speicher else none }}"
      - variables:
          frei: >-
            {{ [vorher - nachher, 0] | max | round(4)
               if vorher is not none and nachher is not none else '' }}
      - variables:
          text: >-
            {%- if frei == '' -%}aufgeräumt
            {%- elif frei >= 1 -%}{{ ('%.2f' | format(frei)) | replace('.', ',') }} GB freigegeben
            {%- elif frei >= 0.001 -%}{{ (frei * 1000) | round(0) | int }} MB freigegeben
            {%- else -%}nichts freizugeben
            {%- endif -%}
      - action: input_text.set_value
        target:
          entity_id: "{{ helfer }}"
        data:
          value: "bericht;{{ beginn }};"
      # Erfuellt, sobald ein Bericht da ist, der nach dem Beginn angefragt
      # wurde; ohne Speichersensoren sofort. wait_template statt
      # wait_for_trigger: Ab 0.7.1 kann der Bericht schon da sein, bevor das
      # Warten beginnt, und ein Trigger wartete dann bis zum Timeout.
      - wait_template: >-
          {%- set e = bericht_sensor -%}
          {%- set t = state_attr(e, 'report_started_at') if e else none -%}
          {{ not e or states(e) in ['unknown', 'unavailable']
             or (t is not none and as_datetime(t) >= as_datetime(beginn))
             or (t is none and states[e].last_changed >= as_datetime(beginn)) }}
        timeout: "00:20:00"
        continue_on_timeout: true
      - action: input_text.set_value
        target:
          entity_id: "{{ helfer }}"
        data:
          value: "fertig;{{ beginn }};{{ frei }}"
      - action: logbook.log
        data:
          name: "{{ name }}"
          message: "{{ text }}"
          entity_id: binary_sensor.local_docker_online
