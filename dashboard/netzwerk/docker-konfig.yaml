# ============================================================================
# Docker – Ereignisse, Absturzmeldung und Sammel-Update fuer die Docker-View
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       netzwerk
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
# Platzhalter:   notify.mobile_app_iphone
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Docker – Paket fuer die Docker-View (docker-view.yaml)
#
#   input_boolean.docker_meldung_absturz
#       Schalter "Push bei Absturz oder OOM" in der Karte Ereignisse.
#   automation "Docker: Ereignisse ins Logbuch"
#       Schreibt die Ereignisse der Arcane-Integration mit deutschem Text ins
#       Logbuch, angehaengt an binary_sensor.local_docker_online. Die Karte
#       Ereignisse ist eine Logbuch-Karte auf diese Entitaet.
#         arcane_container_state_changed   gestartet, gestoppt, abgestuerzt
#         arcane_container_health_changed  nur healthy und unhealthy; den
#                                          Healthcheck-Start ("starting")
#                                          gibt es nach jedem Start
#         arcane_project_state_changed     Projekt laeuft, teilweise, gestoppt
#   automation "Docker: Absturz melden"
#       Push, wenn ein Container abstuerzt. HA-Arcane setzt crashed, wenn
#       ein laufender Container mit Exit-Code ungleich 0 endet, und
#       oom_killed bei Code 137. Code 143 (SIGTERM) ist ein regulaerer Stopp
#       und wird nicht gemeldet; ein Stopp, den Docker nach Ablauf der
#       Wartezeit mit SIGKILL erzwingt, endet ebenfalls mit 137 und erscheint
#       deshalb als OOM. HA-Arcane ab 0.8.0 kann mit der Option "Arcane
#       Ereignisprotokoll auf dem Bus" ein echtes container.oom vom
#       Docker-Daemon melden (arcane_event, Schwere error); dieses Paket
#       nutzt das noch nicht.
#   script.docker_alle_updates_installieren
#       "Alle aktualisieren" in der Karte Image-Updates: installiert die
#       ausstehenden Image-Updates nacheinander, den Arcane-Container zuletzt
#       (sein Neustart trennt die Verbindung kurz).
#       Updates, die Arcane zurueckhaelt (update_blocked, ab HA-Arcane
#       0.7.0), laesst es aus; HA wuerde sie ohnehin ablehnen.
#   script.docker_aufraeumen und input_text.docker_aufraeumen_status
#       "Aufraeumen" in der Karte Speicher & Aufraeumen, mit Rueckmeldung.
#       Das Skript schreibt seine Phase in den Helfer, den jedes Geraet sieht:
#         aufraeumen;<Beginn>;      Prune laeuft (button.press wartet darauf)
#         bericht;<Beginn>;         Prune fertig, neuer Speicherbericht steht aus
#         fertig;<Beginn>;<GB>      freigegebene Menge in GB
#       <Beginn> ist UTC (ISO 8601). Die Menge ist der Image-Speicher vorher
#       minus nachher; am 15.11.2026 war das auf das Byte die zuvor gemeldete
#       freigebbare Menge (1,5628 GB). Auf den Bericht wartet das Skript, bis
#       report_started_at (HA-Arcane ab 0.7.1) nach dem Beginn liegt; mit
#       0.7.0 fehlt das Attribut, dann zaehlt eine Aenderung des Werts, sonst
#       endet das Warten nach 20 Minuten (Intervall 15). Ohne die Option
#       "Freigebbarer Speicher" wartet es nicht. Zum Schluss ein Eintrag im
#       Logbuch, den die Karte Ereignisse zeigt.
#
# Namen in Meldungen ohne Compose-Anhaengsel wie in der Karte
# ("sonarr-sonarr-1" -> "sonarr").
#
# In der eigenen Instanz sind Helfer, Automationen und Skript ueber die
# Oberflaeche angelegt (Inhalt identisch). Dieses Paket ist die Fassung zum
# Nachbauen; nicht beides zugleich verwenden, sonst gibt es alles doppelt.
#
# Voraussetzung
#   - Integration Arcane (HACS) mit Option Events an (Standard) und den
#     API-Rechten containers:redeploy (Sammel-Update) und system:prune
#     (Aufraeumen); fuer die Rueckmeldung nach Sekunden HA-Arcane ab 0.7.1
#     mit Option "Freigebbarer Speicher"
#   - Companion App fuer die Push-Meldung
#   - in configuration.yaml:
#       homeassistant:
#         packages:
#           docker: !include docker-konfig.yaml

input_boolean:
  docker_meldung_absturz:
    name: Docker Meldung Absturz
    icon: mdi:bell-alert

input_text:
  docker_aufraeumen_status:
    name: Docker Aufräumen Status
    icon: mdi:broom
    max: 100

automation:
  - id: docker_ereignisse_ins_logbuch
    alias: "Docker: Ereignisse ins Logbuch"
    description: >-
      Docker-View, Karte Ereignisse: schreibt die Ereignisse der
      Arcane-Integration ins Logbuch von binary_sensor.local_docker_online.
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: arcane_container_state_changed
        id: zustand
      - trigger: event
        event_type: arcane_container_health_changed
        event_data:
          health: healthy
        id: health
      - trigger: event
        event_type: arcane_container_health_changed
        event_data:
          health: unhealthy
        id: health
      - trigger: event
        event_type: arcane_project_state_changed
        id: projekt
    conditions: []
    variables:
      name: >-
        {%- set d = trigger.event.data -%}
        {%- set roh = d.project if trigger.id == 'projekt' else d.container -%}
        {%- set n = roh | regex_replace('-\d+$', '') -%}
        {%- set t = n.split('-') -%}
        {%- set h = (t | count) // 2 -%}
        {{ t[:h] | join('-') if (t | count) is even and t[:h] == t[h:] else n }}
      meldung: >-
        {%- set d = trigger.event.data -%}
        {%- if trigger.id == 'zustand' -%}
          {%- if d.oom_killed -%}abgestürzt: Speicher voll (OOM, Code 137)
          {%- elif d.crashed and d.exit_code == 143 -%}beendet (SIGTERM, Code 143)
          {%- elif d.crashed -%}abgestürzt (Code {{ d.exit_code }})
          {%- elif d.state == 'running' -%}{{ 'neu gestartet' if d.previous_state == 'restarting' else 'gestartet' }}
          {%- else -%}{{ {'exited': 'gestoppt', 'restarting': 'startet neu', 'paused': 'pausiert', 'removing': 'wird entfernt', 'created': 'angelegt', 'dead': 'ausgefallen (dead)'}.get(d.state, 'Zustand ' ~ d.state) }}
          {%- endif -%}
        {%- elif trigger.id == 'health' -%}
          {{ 'Healthcheck bestanden' if d.health == 'healthy' else 'ungesund (Healthcheck fehlgeschlagen)' }}
        {%- else -%}
          {{ {'running': 'Projekt läuft', 'partially running': 'Projekt läuft nur teilweise', 'stopped': 'Projekt gestoppt'}.get(d.status, 'Projekt: ' ~ d.status) }}
        {%- endif -%}
    actions:
      - action: logbook.log
        data:
          name: "{{ name }}"
          message: "{{ meldung }}"
          entity_id: binary_sensor.local_docker_online

  - id: docker_absturz_melden
    alias: "Docker: Absturz melden"
    description: >-
      Docker-View, Karte Ereignisse: Push bei Absturz oder OOM eines
      Containers, solange input_boolean.docker_meldung_absturz an ist.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: arcane_container_state_changed
        event_data:
          crashed: true
    conditions:
      - condition: state
        entity_id: input_boolean.docker_meldung_absturz
        state: "on"
      # Exit-Code steht nur in den Ereignisdaten; ohne native Bedingung dafuer
      - condition: template
        value_template: "{{ trigger.event.data.exit_code != 143 }}"
    variables:
      name: >-
        {%- set n = trigger.event.data.container | regex_replace('-\d+$', '') -%}
        {%- set t = n.split('-') -%}
        {%- set h = (t | count) // 2 -%}
        {{ t[:h] | join('-') if (t | count) is even and t[:h] == t[h:] else n }}
    actions:
      - action: notify.mobile_app_iphone
        data:
          title: "Docker: {{ name }} abgestürzt"
          message: >-
            {{ 'Speicher voll (OOM, Exit-Code 137)' if trigger.event.data.oom_killed
               else 'Exit-Code ' ~ trigger.event.data.exit_code }}
            · {{ trigger.event.data.environment }}
          data:
            url: /dashboard-home/docker
            clickAction: /dashboard-home/docker
            group: docker

script:
  docker_alle_updates_installieren:
    alias: "Docker: alle Image-Updates installieren"
    description: >-
      Docker-View, Karte Image-Updates: installiert die ausstehenden
      Image-Updates nacheinander, den Arcane-Container zuletzt.
      Gesperrte Updates (update_blocked) laesst es aus.
    icon: mdi:package-up
    mode: single
    sequence:
      - variables:
          liste: >-
            {%- set alle = integration_entities('arcane')
                | select('match', 'update\.container_')
                | select('is_state', 'on')
                | reject('is_state_attr', 'update_blocked', true) | list -%}
            {{ (alle | reject('eq', 'update.container_arcane_image_update') | list)
               + (alle | select('eq', 'update.container_arcane_image_update') | list) }}
      - repeat:
          for_each: "{{ liste }}"
          sequence:
            - action: update.install
              target:
                entity_id: "{{ repeat.item }}"
              continue_on_error: true

  docker_aufraeumen:
    alias: "Docker: Ungenutztes aufräumen"
    description: >-
      Docker-View, Karte Speicher & Aufräumen: entfernt ungenutzte Images,
      Netzwerke und den Build-Cache (Button der Arcane-Integration), wartet
      auf den neuen Speicherbericht und meldet die freigegebene Menge.
      Phase und Ergebnis stehen in input_text.docker_aufraeumen_status.
    icon: mdi:broom
    mode: single
    sequence:
      - variables:
          beginn: "{{ utcnow().isoformat() }}"
          vorher: "{{ states('sensor.local_docker_image_speicher') | float(none) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.docker_aufraeumen_status
        data:
          value: "aufraeumen;{{ beginn }};"
      # Wartet, bis Arcane fertig ist; die Integration fragt danach neu ab.
      - action: button.press
        target:
          entity_id: button.docker_ungenutztes_entfernen
      - action: input_text.set_value
        target:
          entity_id: input_text.docker_aufraeumen_status
        data:
          value: "bericht;{{ beginn }};"
      # Erfuellt, sobald ein Bericht da ist, der nach dem Beginn angefragt
      # wurde; ohne Speichersensoren sofort. wait_template statt
      # wait_for_trigger: Ab 0.7.1 kann der Bericht schon da sein, bevor das
      # Warten beginnt, und ein Trigger wartete dann bis zum Timeout.
      - wait_template: >-
          {%- set e = 'sensor.docker_freigebbarer_image_speicher' -%}
          {%- set t = state_attr(e, 'report_started_at') -%}
          {{ states(e) in ['unknown', 'unavailable']
             or (t is not none and as_datetime(t) >= as_datetime(beginn))
             or (t is none and states[e].last_changed >= as_datetime(beginn)) }}
        timeout: "00:20:00"
        continue_on_timeout: true
      # Je Wert ein eigener Schritt: Ueber die Oberflaeche gespeichert, sortiert
      # HA die Schluessel eines Blocks alphabetisch, und "frei" laese dann
      # "nachher", bevor es feststeht.
      - variables:
          nachher: "{{ states('sensor.local_docker_image_speicher') | float(none) }}"
      - variables:
          frei: >-
            {{ [vorher - nachher, 0] | max | round(4)
               if vorher is not none and nachher is not none else '' }}
      - variables:
          text: >-
            {%- if frei == '' -%}aufgeräumt
            {%- elif frei >= 1 -%}{{ ('%.2f' | format(frei)) | replace('.', ',') }} GB freigegeben
            {%- elif frei >= 0.001 -%}{{ (frei * 1000) | round(0) | int }} MB freigegeben
            {%- else -%}nichts freizugeben
            {%- endif -%}
      - action: input_text.set_value
        target:
          entity_id: input_text.docker_aufraeumen_status
        data:
          value: "fertig;{{ beginn }};{{ frei }}"
      - action: logbook.log
        data:
          name: Aufräumen
          message: "{{ text }}"
          entity_id: binary_sensor.local_docker_online
