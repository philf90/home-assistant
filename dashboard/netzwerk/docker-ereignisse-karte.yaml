# ============================================================================
# Docker-Ereignisse – Logbuch der Container und Push bei Absturz
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     owlet_docker_kopf (docker-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Karte der Docker-View (docker-view.yaml).
#
#   Logbuch    48 Stunden, Eintraege an binary_sensor.local_docker_online,
#              als eigene Liste (button-card, logbook/event_stream).
#              Die Automation "Docker: Ereignisse ins Logbuch" aus
#              docker-konfig.yaml schreibt dort die Ereignisse der
#              Arcane-Integration mit deutschem Text hin ("sonarr:
#              abgestuerzt (Code 1)"); dazu kommen online/offline der
#              Umgebung selbst. Arcane-HA meldet nur Wechsel zwischen zwei
#              Abfragen; ein Container, der in weniger als einem
#              Abfrageintervall abstuerzt und neu startet, erscheint nicht.
#   Push       input_boolean.docker_meldung_absturz schaltet die Automation
#              "Docker: Absturz melden" (Push bei Absturz oder OOM).
#
# Voraussetzung: custom:button-card + card-mod (HACS), Integration Arcane
#                (HACS) mit Option Events, Paket docker-konfig.yaml (oder
#                dieselben Objekte ueber die Oberflaeche), Templates aus
#                docker-templates.yaml.
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
      border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  - type: custom:button-card
    template: owlet_docker_kopf
    icon: mdi:timeline-text-outline
    name: Ereignisse
    label: Letzte 48 Stunden · aus dem Logbuch

  # ---- Logbuch als eigene Liste ----
  # Statt der Logbuchkarte: Die ist fest 385 px hoch und virtualisiert, ihre
  # Hoehe folgt nicht der Zahl der Eintraege. Die Liste hier waechst mit den
  # Eintraegen (hoechstens 8, sonst Hinweis auf das Logbuch im Dialog) und
  # nennt den Container ("jellyseerr · Healthcheck bestanden").
  - type: custom:button-card
    entity: binary_sensor.local_docker_online
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    custom_fields:
      liste: |
        [[[
          const ENT = 'binary_sensor.local_docker_online';
          const STUNDEN = 48, MAX = 8;
          const TEXT = 'var(--owlet-text, #f2f5f8)', SEK = 'var(--owlet-text-sekundaer, #8794a5)';
          // Ein Abo je Seite fuer alle Karten: logbook/event_stream schickt erst die
          // letzten 48 Stunden, danach jeden neuen Eintrag (wie die Logbuchkarte).
          const lb = window.__owletDockerLogbuch || (window.__owletDockerLogbuch = { ev: [], keys: new Set(), karten: new Set(), abo: null, geladen: false });
          lb.karten.add(this);
          if (!lb.abo && hass.connection) {
            lb.abo = hass.connection.subscribeMessage((m) => {
              for (const e of m.events || []) {
                const k = e.when + '|' + (e.name || '') + '|' + (e.message || e.state || '');
                if (!lb.keys.has(k)) { lb.keys.add(k); lb.ev.push(e); }
              }
              lb.ev.sort((a, b) => b.when - a.when);
              lb.geladen = true;
              // button-card 7.0.1 zeichnet nur neu, wenn sich eine seiner Eigenschaften
              // aendert; _spinnerActive ist eine davon und hat sonst keine Wirkung.
              for (const c of lb.karten) { if (c.isConnected) c.requestUpdate('_spinnerActive'); else lb.karten.delete(c); }
            }, { type: 'logbook/event_stream', start_time: new Date(Date.now() - STUNDEN * 3600e3).toISOString(), entity_ids: [ENT] });
            lb.abo.catch(() => { lb.abo = null; });
          }
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const zeile = (inhalt, farbe) => `<div style="color:${farbe};font-size:13px;padding:2px 0;">${inhalt}</div>`;
          if (!lb.geladen) return zeile('lädt …', SEK);
          const grenze = Date.now() / 1000 - STUNDEN * 3600;
          const ev = lb.ev.filter((e) => e.when >= grenze);
          if (!ev.length) return zeile('Keine Ereignisse in den letzten 48 Stunden', SEK);
          const ROT = 'var(--owlet-rot, #f0736a)', AMBER = 'var(--owlet-amber, #e6b566)', GRUEN = 'var(--owlet-gruen, #a6d49e)';
          const art = (e) => {
            if (!e.message) {
              const s = { on: ['online', GRUEN], off: ['offline', ROT], unavailable: ['nicht erreichbar', AMBER] }[e.state] || [e.state || '–', SEK];
              return { name: 'Docker-Host', text: s[0], farbe: s[1] };
            }
            const t = e.message;
            const farbe = /abgestürzt|ungesund|ausgefallen/.test(t) ? ROT
              : /beendet|gestoppt|startet neu|pausiert|entfernt|teilweise/.test(t) ? AMBER
              : /bestanden|gestartet|läuft/.test(t) ? GRUEN : SEK;
            return { name: e.name || '', text: t, farbe };
          };
          const tag = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
          const heute = tag(new Date()), gestern = tag(new Date(Date.now() - 864e5));
          let h = '', letzter = '';
          for (const e of ev.slice(0, MAX)) {
            const d = new Date(e.when * 1000), t = tag(d);
            if (t !== letzter) {
              const vor = t === heute ? 'Heute · ' : t === gestern ? 'Gestern · ' : '';
              h += `<div style="font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${SEK};margin:${letzter ? 12 : 0}px 0 4px;">${vor}${t}</div>`;
              letzter = t;
            }
            const a = art(e);
            const uhr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            h += `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;">`
              + `<span style="flex:none;width:8px;height:8px;border-radius:50%;background:${a.farbe};"></span>`
              + `<span style="flex:1;min-width:0;font-size:13px;line-height:1.3;color:${TEXT};overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;overflow-wrap:anywhere;">`
              + (a.name ? `<b style="font-weight:700;">${esc(a.name)}</b> · ` : '') + `${esc(a.text)}</span>`
              + `<span style="flex:none;font-size:12px;color:${SEK};font-variant-numeric:tabular-nums;">${uhr}</span></div>`;
          }
          if (ev.length > MAX) h += zeile(`+ ${ev.length - MAX} weitere · antippen für das Logbuch`, SEK);
          return h;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 12px 14px
        - box-shadow: none
        - background: 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"liste"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        liste:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
          - overflow: visible

  # ---- Push bei Absturz; Schalter wie in owlet_docker_zeile ----
  - type: custom:button-card
    entity: input_boolean.docker_meldung_absturz
    icon: mdi:bell-alert-outline
    show_icon: true
    show_name: false
    show_state: false
    variables:
      an: '[[[ return !!entity && entity.state === "on"; ]]]'
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    custom_fields:
      titel: >-
        <span style="font-size:14px;font-weight:700;color:var(--owlet-text, #f2f5f8);">Push bei Absturz oder OOM</span>
      info: |
        [[[
          const txt = variables.an ? 'an · Exit-Code ungleich 0 und 143' : 'aus · Absturz steht nur im Logbuch';
          return `<span style="font-size:12px;color:var(--owlet-text-sekundaer, #8794a5);">${txt}</span>`;
        ]]]
      knopf: |
        [[[
          const gruen = 'var(--owlet-gruen, #a6d49e)';
          const spur = variables.an
            ? `background:color-mix(in srgb, ${gruen} 24%, transparent);border:1px solid color-mix(in srgb, ${gruen} 50%, transparent);`
            : 'background:var(--owlet-aus, #3a4453);border:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));';
          const punkt = variables.an ? `left:18px;background:${gruen};` : 'left:2px;background:var(--owlet-muted, #6e7988);';
          return `<span style="position:relative;display:block;width:40px;height:24px;box-sizing:border-box;border-radius:12px;transition:background .2s;${spur}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;transition:left .2s;${punkt}"></span></span>`;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"i titel knopf" "i info knopf"'
        - grid-template-columns: 36px minmax(0, 1fr) 52px
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[ return variables.an ? 'color-mix(in srgb, var(--owlet-amber, #e6b566) 16%, transparent)' : 'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.an ? '1px solid color-mix(in srgb, var(--owlet-amber, #e6b566) 24%, transparent)' : '1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.an ? "var(--owlet-amber, #e6b566)" : "var(--owlet-muted, #6e7988)"; ]]]'
      custom_fields:
        titel:
          - justify-self: start
          - align-self: end
          - text-align: left
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        knopf:
          - justify-self: center
          - align-self: center
