# ============================================================================
# Docker-Updates – Image-Updates der Container und von Arcane
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        auto-entities, bubble-card, button-card, card-mod
# Templates:     nachtblau_docker_autoupdate_chip (docker-templates.yaml),
#                nachtblau_docker_autoupdate_info (docker-templates.yaml),
#                nachtblau_docker_kopf (docker-templates.yaml),
#                nachtblau_docker_titel (docker-templates.yaml),
#                nachtblau_docker_update (docker-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Karte der Docker-View (docker-view.yaml).
#
#   Kopf       Anzahl ausstehender Updates, gesperrte getrennt ("2 Updates ·
#              1 gesperrt"); "Alle aktualisieren" startet
#              script.docker_alle_updates_installieren (docker-konfig.yaml)
#              nach Rueckfrage und zaehlt wie das Skript nur installierbare
#              Updates. Ohne solches Update, waehrend das Skript laeuft oder
#              waehrend Arcanes Updater installiert, ist der Knopf aus.
#              Installiert Arcane selbst (geplanter Lauf oder Button "Alle
#              Updates installieren"; binary_sensor.docker_updates_werden_
#              installiert, ab HA-Arcane 0.9.0 mit Option "Arcane Updater"),
#              steht im Kopf "Arcane installiert Updates ..." in Amber: Die
#              Zeilen zeigen "wird installiert" nur fuer Installationen aus
#              HA, und ein Update aus HA, das auf ein laufendes Update
#              desselben Compose-Projekts trifft, wartet bei Arcane bis zu
#              2 Minuten und scheitert dann (Arcane v3.0.1, admitUpdate,
#              DefaultActivitySlotWait). Gemessen im Nachbau mit geladenem
#              Roboto: 155 px breit, neben "Alle aktualisieren" (127 px) bleiben
#              117 px (360 px breites Handy) bzw. 151 px (iPhone 17 Pro), also
#              auf beiden zwei Zeilen.
#   Liste      je ausstehendem Image-Update eine Zeile (nachtblau_docker_update):
#              Image, installierte und neue Version, "Installieren" mit
#              Rueckfrage; ein gesperrtes Update in Koralle mit Grund und
#              ohne Knopf. Antippen oeffnet den Update-Dialog mit den
#              Versionshinweisen. Ohne Update: "Alle Container-Images aktuell".
#   Suchen     "Nach Updates suchen" (ab HA-Arcane 0.7.0): "Pruefen" laesst
#              Arcane sofort alle Images pruefen, auf allen Hosts (je Host ein
#              Button, translation_key check_updates). Daneben Arcanes eigene
#              Pruefung aus dem Job "Image Update Watcher" (ab HA-Arcane 0.10.0,
#              Option "Arcane Hintergrund-Jobs"): "Arcane prueft stuendlich ·
#              zuletzt 14:00"; war der letzte Druck in HA spaeter, "angestossen
#              14:30". Ist der Job fehlgeschlagen, "fehlgeschlagen" in
#              Koralle, bei mehreren Hosts mit dem Host ("(docker-02)") bzw.
#              der Zahl ("(2 Hosts)"). Ohne Jobs nur der Zeitpunkt des
#              letzten Anstosses. Recht: image-updates:check.
#   Automatisch  Zeile "Automatische Updates" (ab HA-Arcane 0.9.0, Optionen
#              "Arcane Updater" und "Auto-Update-Schalter"): oben der naechste
#              Lauf aus dem Job "Auto Update" (ab HA-Arcane 0.10.0, Option
#              "Arcane Hintergrund-Jobs"; bei mehreren Hosts der frueheste,
#              ein Host ohne automatische Updates mit "docker-02 aus"; auf
#              allen aus: "in Arcane ausgeschaltet" in Amber), darunter das
#              letzte Update aus Arcanes Verlauf (juengstes aller Hosts:
#              Container, Status, Zeitpunkt), waehrend eines Laufs "Arcane
#              installiert Updates ...". Der Sensor kennt nur den neuesten
#              Eintrag; nach einem Lauf ueber mehrere Container steht der
#              letzte da. Halten oeffnet den Sensor (Verlauf, Grund eines
#              Fehlers). Antippen oeffnet ein Bubble-Pop-up (#docker-autoupdates,
#              Blatt von unten wie das WLAN-Pop-up) mit einem Chip je Container
#              in zwei Spalten (switch.container_*_automatisch_aktualisieren,
#              Template nachtblau_docker_autoupdate_chip): Antippen nimmt den
#              Container aus Arcanes automatischen Updates aus oder wieder auf,
#              ohne Rueckfrage, denn der Container selbst wird nicht angefasst.
#              Die automatischen Updates selbst schaltet man in Arcane ein;
#              HA sieht diese Einstellung nur ueber die Jobs (enabled von "Auto
#              Update" ist autoUpdate, von "Image Update Watcher"
#              pollingEnabled; Arcane v3.0.1, types/meta.go) und kann sie nicht
#              schalten. Rechte: image-updates:read, image-updates:list,
#              containers:autoupdate.
#   Arcane     Arcane selbst, je Host eine Zeile. Ab HA-Arcane 0.14.0 startet
#              "Installieren" einen Upgrade-Job in Arcane (fuer docker-02
#              aktualisiert der Manager den Agenten) und verfolgt ihn bis zum
#              Ende: "wird installiert · 40 %" mit Balken (nachtblau_docker_
#              update). Kann Arcane sich nicht selbst aktualisieren oder
#              scheitert der Job, zeigt HA Arcanes Begruendung als Fehler.
#              Startet Arcane dabei neu, ist die Zeile kurz "keine Daten".
#              Rechte: system:upgrade, fuer den Fortschritt system:read.
#
# Arcane meldet die Versionen als Kurz-Digest (z. B. 696a5fb17b9a) oder als
# Tag; nach einer Installation stand bei new-watchtower auf beiden Seiten
# "latest" (21.10.2026).
#
# Voraussetzung: custom:button-card + custom:auto-entities + card-mod +
#                custom:bubble-card (HACS), Integration Arcane (HACS) ab 0.7.0 mit
#                Update-Entitaeten und Steuerung, fuer die Zeile
#                "Automatische Updates" ab 0.9.0 mit den Optionen "Arcane
#                Updater" und "Auto-Update-Schalter", fuer naechsten Lauf
#                und Arcanes Pruefung ab 0.10.0 mit "Arcane
#                Hintergrund-Jobs"; Rechte
#                image-updates:apply (bis HA-Arcane 0.8.1
#                containers:redeploy), system:upgrade, image-updates:read,
#                image-updates:check, image-updates:list und
#                containers:autoupdate; Skript aus docker-konfig.yaml,
#                Templates aus docker-templates.yaml.
type: vertical-stack
cards:
  # ======================= Sichtbare Karte =======================
  - type: vertical-stack
    card_mod:
      style: |
        #root {
          background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
          border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
      - type: custom:button-card
        template: nachtblau_docker_kopf
        entity: sensor.local_docker_container_updates_verfugbar
        icon: mdi:package-up
        name: Image-Updates
        label: |
          [[[
            // Alle Hosts: Updater ("Updates werden installiert") und Zaehler ueber
            // den translation_key der Sensoren der Umgebung
            if (Object.values(hass.entities || {}).some((e) => e.platform === 'arcane' && e.translation_key === 'updater_running' && (states[e.entity_id] || {}).state === 'on')) return 'Arcane installiert Updates …';
            const summe = (tk) => {
              let z = null;
              for (const e of Object.values(hass.entities || {})) {
                if (e.platform !== 'arcane' || e.translation_key !== tk) continue;
                const v = parseFloat((states[e.entity_id] || {}).state);
                if (!isNaN(v)) z = (z || 0) + v;
              }
              return z;
            };
            const n = summe('containers_update_available');
            const g = summe('containers_total');
            if (n === null) return 'keine Daten';
            if (n === 0) return 'Alle ' + (g !== null ? g + ' ' : '') + 'Container aktuell';
            // Der Zaehler enthaelt gesperrte Updates; die stehen getrennt da.
            let frei = 0, gesperrt = 0;
            for (const id of Object.keys(states)) {
              if (!/^update\.container_.+_image_update$/.test(id) || states[id].state !== 'on') continue;
              if (states[id].attributes.update_blocked === true) gesperrt++; else frei++;
            }
            const wort = (z) => z + (z === 1 ? ' Update' : ' Updates');
            if (!gesperrt) return wort(frei) + ' ausstehend';
            // Kurzform, gemessen im Nachbau mit geladenem Roboto: "12 Updates
            // ausstehend · 2 gesperrt" braucht neben dem Badge auf dem 360 px
            // breiten Handy (117 px) drei Zeilen, "12 Updates · 12 gesperrt" zwei.
            return frei ? wort(frei) + ' · ' + gesperrt + ' gesperrt' : wort(gesperrt) + ' gesperrt';
          ]]]
        styles:
          label:
            - color: |
                [[[
                  return Object.values(hass.entities || {}).some((e) => e.platform === 'arcane' && e.translation_key === 'updater_running' && (states[e.entity_id] || {}).state === 'on') ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
                ]]]
        custom_fields:
          badge:
            card:
              type: custom:button-card
              entity: script.docker_alle_updates_installieren
              name: |
                [[[ return entity && entity.state === 'on' ? 'läuft …' : 'Alle aktualisieren'; ]]]
              show_icon: false
              show_name: true
              show_state: false
              variables:
                # Nur installierbare Updates: on und nicht von Arcane gesperrt,
                # dieselbe Auswahl wie im Skript.
                anzahl: |
                  [[[
                    let n = 0;
                    for (const id of Object.keys(states)) {
                      if (!/^update\.container_.+_image_update$/.test(id)) continue;
                      if (states[id].state === 'on' && states[id].attributes.update_blocked !== true) n++;
                    }
                    return n;
                  ]]]
                # Aus, solange Arcanes Updater installiert (siehe Kopfkommentar).
                aktiv: |
                  [[[
                    const sk = states['script.docker_alle_updates_installieren'];
                    return variables.anzahl > 0 && !!sk && sk.state === 'off' && !Object.values(hass.entities || {}).some((e) => e.platform === 'arcane' && e.translation_key === 'updater_running' && (states[e.entity_id] || {}).state === 'on');
                  ]]]
              tap_action: |
                [[[
                  if (!variables.aktiv) return { action: 'none' };
                  return {
                    action: 'perform-action',
                    perform_action: 'script.turn_on',
                    target: { entity_id: 'script.docker_alle_updates_installieren' },
                    confirmation: { text: variables.anzahl + (variables.anzahl === 1 ? ' Image-Update' : ' Image-Updates') + ' nacheinander installieren? Jeder Container ist dabei kurz nicht erreichbar.' }
                  };
                ]]]
              hold_action:
                action: none
              styles:
                card:
                  - min-height: 40px
                  - padding: 0 12px
                  - border-radius: 12px
                  - box-shadow: none
                  - background: |
                      [[[ return variables.aktiv ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
                  - border: |
                      [[[ return variables.aktiv ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
                  - opacity: '[[[ return variables.aktiv || (entity && entity.state === "on") ? 1 : 0.4; ]]]'
                name:
                  - font-size: 13px
                  - font-weight: 700
                  - white-space: nowrap
                  - color: '[[[ return variables.aktiv ? "var(--nachtblau-amber, #e6b566)" : "var(--nachtblau-label, #b4c0cf)"; ]]]'

      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        sort:
          method: name
        filter:
          include:
            - integration: arcane
              domain: update
              entity_id: 'update.container_*'
              state: 'on'
              options:
                type: custom:button-card
                template: nachtblau_docker_update
        else:
          type: custom:button-card
          icon: mdi:package-variant-closed-check
          show_icon: true
          show_name: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
          custom_fields:
            titel: >-
              <span style="font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Alle Container-Images aktuell</span>
            info: >-
              <span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">Arcane prüft die Images selbst; neue erscheinen hier</span>
          styles:
            card:
              - border-radius: 14px
              - padding: 10px 12px
              - box-shadow: none
              - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
              - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
            grid:
              - grid-template-areas: '"i titel" "i info"'
              - grid-template-columns: 36px minmax(0, 1fr)
              - grid-template-rows: min-content min-content
              - column-gap: 12px
              - row-gap: 2px
            img_cell:
              - width: 36px
              - height: 36px
              - box-sizing: border-box
              - border-radius: 11px
              - margin: 0
              - background: 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 16%, transparent)'
              - border: '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)'
            icon:
              - width: 19px
              - height: 19px
              - margin: 0
              - --ha-icon-display: block
              - color: 'var(--nachtblau-gruen, #a6d49e)'
            custom_fields:
              titel:
                - justify-self: start
                - align-self: end
                - min-width: 0
                - max-width: 100%
                - overflow: hidden
                - white-space: normal
                - display: -webkit-box
                - -webkit-box-orient: vertical
                - -webkit-line-clamp: '2'
                - text-wrap: balance
                - text-align: left
              info:
                - justify-self: start
                - align-self: start
                - min-width: 0
                - max-width: 100%
                - overflow: hidden
                - white-space: normal
                - display: -webkit-box
                - -webkit-box-orient: vertical
                - -webkit-line-clamp: '2'
                - text-wrap: balance
                - font-size: 12px
                - line-height: 1.25
                - margin-top: 5px
                - text-align: left

      # ---- Nach Updates suchen (ab HA-Arcane 0.7.0) ----
      # "Pruefen" drueckt "Nach Updates suchen" aller Hosts (translation_key
      # check_updates; je Umgebung ein Button, HA-Arcane ab 0.11.0 auch fuer
      # Agenten). Der Zustand eines Buttons ist der Zeitpunkt des Drueckens,
      # nicht das Ende der Pruefung (HA schreibt ihn vorher). Die Pruefung
      # dauert bis zu fuenf Minuten, einen Fortschritt meldet die Entitaet
      # nicht. Keine Rueckfrage: Pruefen aendert nichts.
      # Infozeile (HA-Arcane ab 0.10.0, Option "Arcane Hintergrund-Jobs"):
      # Arcanes eigene Pruefung ist der Job "Image Update Watcher" (job_id
      # image-polling) je Host: Plan (schedule, "0 * * * *" = stuendlich) und
      # Ende des letzten Laufs (last_finished, bei mehreren Hosts der
      # aelteste). Der Button ruft Arcanes Pruefung direkt auf, nicht den Job;
      # war der letzte Druck in HA spaeter, steht "angestossen" mit dessen
      # Zeit. enabled des Jobs ist Arcanes Einstellung pollingEnabled (Arcane
      # v3.0.1, types/meta.go); ist sie auf allen Hosts aus: "Arcane prueft
      # nicht selbst". Ohne Jobs wie bisher "zuletzt angestossen".
      - type: custom:button-card
        entity: button.docker_nach_updates_suchen
        icon: mdi:refresh
        show_icon: true
        show_name: false
        show_state: false
        variables:
          knoepfe: |
            [[[
              return Object.values(hass.entities || {})
                .filter((e) => e.platform === 'arcane' && e.translation_key === 'check_updates' && states[e.entity_id] && states[e.entity_id].state !== 'unavailable')
                .map((e) => e.entity_id);
            ]]]
          aktiv: '[[[ return variables.knoepfe.length > 0; ]]]'
        tap_action: |
          [[[
            if (!variables.aktiv) return { action: 'none' };
            return { action: 'perform-action', perform_action: 'button.press', target: { entity_id: variables.knoepfe } };
          ]]]
        hold_action:
          action: none
        custom_fields:
          titel: >-
            <span style="font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Nach Updates suchen</span>
          info: |
            [[[
              const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
              if (!variables.aktiv) return `<span style="font-size:12px;color:${sek};">nicht verfügbar</span>`;
              const E = hass.entities || {}, D = hass.devices || {};
              const zeit = (t) => {
                const d = new Date(t);
                const heute = new Date().toDateString() === d.toDateString();
                return (heute ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ') + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
              };
              // Trennpunkt haengt am Teil davor, damit keine Zeile mit "·" beginnt.
              // Ein einzelner Teil darf umbrechen: "zuletzt angestossen 15.11.,
              // 21:07" ist 173 px breit, die Spalte auf dem 360 px breiten Handy 161 px.
              const zeile = (teile, farbe) => `<span style="font-size:12px;color:${farbe || sek};">${teile.length === 1 ? teile[0] : teile.map((t, i) => `<span style="white-space:nowrap;">${t}${i < teile.length - 1 ? '&nbsp;·' : ''}</span>`).join(' ')}</span>`;
              let druck = NaN;
              for (const id of variables.knoepfe) {
                const t = Date.parse(states[id].state);
                if (!isNaN(t) && (isNaN(druck) || t > druck)) druck = t;
              }
              const w = [];
              for (const e of Object.values(E)) {
                if (e.platform !== 'arcane' || e.translation_key !== 'job') continue;
                const st = states[e.entity_id];
                const d = D[e.device_id];
                if (st && st.state !== 'unavailable' && st.attributes.job_id === 'image-polling') w.push({ st, host: d ? (d.name_by_user || d.name || '') : '' });
              }
              if (!w.length) return zeile([isNaN(druck) ? 'noch nie angestoßen' : 'zuletzt angestoßen ' + zeit(druck)]);
              const an = w.filter((x) => x.st.attributes.enabled !== false);
              if (!an.length) return zeile(['Arcane prüft nicht selbst'].concat(isNaN(druck) ? [] : ['angestoßen ' + zeit(druck)]), 'var(--nachtblau-amber, #e6b566)');
              const intervall = (c) => {
                const z = String(c || '').trim().split(/\s+/);
                if (z.length === 5 && z.slice(2).every((x) => x === '*')) {
                  if (/^\d+$/.test(z[0]) && z[1] === '*') return 'stündlich';
                  const n = /^\*\/(\d+)$/.exec(z[1]);
                  if (/^\d+$/.test(z[0]) && n) return 'alle ' + n[1] + ' Std.';
                  if (/^\d+$/.test(z[0]) && /^\d+$/.test(z[1])) return 'täglich ' + z[1].padStart(2, '0') + ':' + z[0].padStart(2, '0');
                }
                return 'nach Plan';
              };
              const plaene = [...new Set(an.map((x) => intervall(x.st.attributes.schedule)))];
              const teile = ['Arcane prüft ' + (plaene.length === 1 ? plaene[0] : 'nach Plan')];
              const fehl = an.filter((x) => x.st.state === 'failed').map((x) => x.host);
              // Mehrere Hosts als Zahl: "fehlgeschlagen (docker-01, docker-02)" waere
              // 204 px breit und bricht nicht um (Spalte 161 bzw. 203 px).
              if (fehl.length) return zeile(teile.concat(['fehlgeschlagen' + (w.length > 1 ? ' (' + (fehl.length > 1 ? fehl.length + ' Hosts' : fehl[0]) + ')' : '')]), 'var(--nachtblau-koralle, #e7936e)');
              let fertig = NaN;
              for (const x of an) {
                const t = Date.parse(x.st.attributes.last_finished);
                if (!isNaN(t) && (isNaN(fertig) || t < fertig)) fertig = t;
              }
              if (!isNaN(druck) && (isNaN(fertig) || druck > fertig)) teile.push('angestoßen ' + zeit(druck));
              else if (!isNaN(fertig)) teile.push('zuletzt ' + zeit(fertig));
              return zeile(teile);
            ]]]
          knopf: |
            [[[
              return `<span style="display:inline-flex;align-items:center;box-sizing:border-box;min-height:40px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;opacity:${variables.aktiv ? 1 : 0.4};color:var(--nachtblau-label, #b4c0cf);background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));">Prüfen</span>`;
            ]]]
        styles:
          card:
            - border-radius: 14px
            - padding: 8px 8px 8px 10px
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          grid:
            - grid-template-areas: '"i titel knopf" "i info knopf"'
            - grid-template-columns: 36px minmax(0, 1fr) auto
            - grid-template-rows: min-content min-content
            - column-gap: 12px
            - row-gap: 3px
            - align-items: center
          img_cell:
            - width: 36px
            - height: 36px
            - box-sizing: border-box
            - border-radius: 11px
            - margin: 0
            - align-self: center
            - background: 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          icon:
            - width: 19px
            - height: 19px
            - margin: 0
            - --ha-icon-display: block
            - color: 'var(--nachtblau-label, #b4c0cf)'
          custom_fields:
            titel:
              - justify-self: start
              - align-self: end
              - min-width: 0
              - max-width: 100%
              - overflow: hidden
              - white-space: normal
              - display: -webkit-box
              - -webkit-box-orient: vertical
              - -webkit-line-clamp: '2'
              - text-wrap: balance
              - text-align: left
            # Gemessen im Nachbau mit geladenem Roboto: Neben "Pruefen" (65 px)
            # bleiben fuer den Text auf dem 360 px breiten Handy 161 px, auf dem
            # iPhone 17 Pro 203 px. "Arcane prueft stuendlich · zuletzt 14:00"
            # braucht auf dem Handy zwei Zeilen, auf dem iPhone eine; mit
            # "angestossen 14:30" oder einem Datum zwei auf beiden, ebenso die
            # laengsten Faelle ("Arcane prueft nicht selbst · angestossen 15.11.,
            # 21:07", "... · fehlgeschlagen (docker-02)").
            info:
              - justify-self: start
              - align-self: start
              - min-width: 0
              - max-width: 100%
              - overflow: hidden
              - white-space: normal
              - display: -webkit-box
              - -webkit-box-orient: vertical
              - -webkit-line-clamp: '2'
              - text-wrap: balance
              - font-size: 12px
              - line-height: 1.25
              - margin-top: 5px
              - text-align: left
            knopf:
              - align-self: center
              - overflow: visible

      # ---- Automatische Updates (ab HA-Arcane 0.9.0) ----
      # Ganze Zeile tippbar (Pfeil rechts), kein Knopf: Neben einem Knopf blieben
      # fuer die Infozeile auf dem 360 px breiten Handy 152 px, schon "radarr ·
      # aktualisiert · 16.11., 03:00" brauchte zwei Zeilen. Ohne Knopf, gemessen
      # im Nachbau mit geladenem Roboto: 206 px (iPhone 17 Pro 248 px), der
      # laengste Name (uptimekuma-mariadb-uptime-kuma) mit "fehlgeschlagen" und
      # Zeitpunkt in zwei Zeilen. Darueber "naechster Lauf 15:08" (HA-Arcane ab
      # 0.10.0) in einer Zeile, "naechster Lauf 17.11., 00:00 · docker-02 aus"
      # auf dem Handy in zwei; meist zusammen drei Zeilen (45 px), mit dem
      # laengsten Namen und "docker-02 aus" auf dem Handy vier (60 px). Ein
      # Container eines entfernten Hosts mit so langem Namen braeuchte drei
      # Zeilen und endet nach zwei mit "…"; auf docker-02 gibt es keinen. Die Zahl der ausgenommenen Container passte dann nicht
      # mehr dazu, sie steht im Pop-up; den Grund eines Fehlers zeigt Halten
      # (Sensor, Attribut error).
      # Antippen setzt den Hash #docker-autoupdates; das Bubble-Pop-up am Ende
      # dieser Datei geht dann auf (wie das WLAN-Pop-up, wlan-karte-v2.yaml).
      - type: custom:button-card
        entity: sensor.docker_letztes_image_update
        icon: mdi:autorenew
        show_icon: true
        show_name: false
        show_state: false
        variables:
          laeuft: "[[[ return Object.values(hass.entities || {}).some((e) => e.platform === 'arcane' && e.translation_key === 'updater_running' && (states[e.entity_id] || {}).state === 'on'); ]]]"
          # Juengstes Update aller Hosts ("Letztes Image-Update" je Umgebung,
          # translation_key updater_last_update); host = Name der Umgebung, wenn
          # es nicht die lokale ist (Modell "Arcane Agent").
          letztes: |
            [[[
              let best = null;
              for (const e of Object.values(hass.entities || {})) {
                if (e.platform !== 'arcane' || e.translation_key !== 'updater_last_update') continue;
                const st = states[e.entity_id];
                const t = st ? Date.parse(st.state) : NaN;
                if (isNaN(t) || (best && best.t >= t)) continue;
                const d = (hass.devices || {})[e.device_id];
                const host = d && d.model === 'Arcane Agent' ? (d.name_by_user || d.name || '') : '';
                best = { t, a: st.attributes, host };
              }
              return best;
            ]]]
          status: '[[[ return variables.letztes && variables.letztes.a.status ? String(variables.letztes.a.status) : ""; ]]]'
          # Naechster Lauf (HA-Arcane ab 0.10.0, Option "Arcane Hintergrund-
          # Jobs"): Job "Auto Update" (job_id auto-update) je Host, next_run.
          # Arcane fuehrt ihn nur aus, wenn die Einstellungen autoUpdate und
          # pollingEnabled an sind (Voraussetzungen des Jobs, Arcane v3.0.1,
          # types/meta.go); sie stehen in HA als enabled der Jobs Auto Update
          # bzw. Image Update Watcher. an = Hosts mit beiden an, aus = Namen
          # der uebrigen, naechster = fruehester next_run der Hosts mit an.
          plan: |
            [[[
              const E = hass.entities || {}, D = hass.devices || {};
              const h = {};
              for (const e of Object.values(E)) {
                if (e.platform !== 'arcane' || e.translation_key !== 'job') continue;
                const st = states[e.entity_id];
                if (!st || st.state === 'unavailable') continue;
                const id = st.attributes.job_id;
                if (id !== 'auto-update' && id !== 'image-polling') continue;
                const d = D[e.device_id];
                h[e.device_id] = h[e.device_id] || { name: d ? (d.name_by_user || d.name || '') : '' };
                h[e.device_id][id] = st;
              }
              const hosts = Object.values(h).filter((x) => x['auto-update']);
              if (!hosts.length) return null;
              const ein = (x) => x['auto-update'].attributes.enabled !== false && (!x['image-polling'] || x['image-polling'].attributes.enabled !== false);
              let naechster = NaN;
              for (const x of hosts.filter(ein)) {
                const t = Date.parse(x['auto-update'].attributes.next_run);
                if (!isNaN(t) && (isNaN(naechster) || t < naechster)) naechster = t;
              }
              return { an: hosts.filter(ein).length, aus: hosts.filter((x) => !ein(x)).map((x) => x.name), naechster };
            ]]]
          akzent: |
            [[[
              if (variables.laeuft) return 'var(--nachtblau-amber, #e6b566)';
              if (variables.plan && variables.plan.an === 0) return 'var(--nachtblau-amber, #e6b566)';
              if (variables.status === 'failed' || variables.status === 'blocked') return 'var(--nachtblau-koralle, #e7936e)';
              if (variables.status === 'updated' || variables.status === 'restarted') return 'var(--nachtblau-gruen, #a6d49e)';
              return '';
            ]]]
        tap_action:
          action: navigate
          navigation_path: '#docker-autoupdates'
        hold_action:
          action: more-info
        custom_fields:
          titel: >-
            <span style="font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Automatische Updates</span>
          info: |
            [[[
              const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
              const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
              const ganz = (t) => `<span style="white-space:nowrap;">${t}</span>`;
              if (variables.laeuft) return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">Arcane installiert Updates …</span>`;
              // Erste Zeile: naechster Lauf bzw. "in Arcane ausgeschaltet",
              // darunter das letzte Update (hoechstens zwei Zeilen)
              const p = variables.plan;
              let kopf = '';
              if (p && p.an === 0) kopf = `<div style="color:var(--nachtblau-amber, #e6b566);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">in Arcane ausgeschaltet</div>`;
              else if (p) {
                const d = new Date(p.naechster);
                const heute = new Date().toDateString() === d.toDateString();
                const wann = isNaN(d.getTime()) ? '' : 'nächster Lauf ' + (heute ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ') + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                const teile = [wann].concat(p.aus.length ? [esc(p.aus.join(', ')) + ' aus'] : []).filter(Boolean);
                // Umbruch nur zwischen ganzen Teilen: "naechster Lauf 17.11., 00:00 ·
                // docker-02 aus" passt auf dem 360 px breiten Handy nicht in eine Zeile
                if (teile.length) kopf = `<div style="color:var(--nachtblau-label, #b4c0cf);">${teile.map((t, i) => ganz(t + (i < teile.length - 1 ? '&nbsp;·' : ''))).join(' ')}</div>`;
              }
              const block = (html, farbe) => `<div style="font-size:12px;color:${farbe || sek};">${kopf}<div style="overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${html}</div></div>`;
              const l = variables.letztes;
              if (!l && (!entity || entity.state === 'unavailable')) return block('nicht verfügbar');
              if (!l || !l.a.resource_name) return block(`${ganz('noch kein Update')} ${ganz('über Arcanes Updater')}`);
              const a = l.a;
              const d = new Date(l.t);
              // Name wie in den Zeilen: "radarr-radarr-1" -> "radarr"; entfernter
              // Host davor ("docker-02 valhalla")
              let n = String(a.resource_name).replace(/-\d+$/, '');
              const t = n.split('-');
              if (t.length % 2 === 0) {
                const h = t.length / 2;
                if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
              }
              const woerter = { updated: 'aktualisiert', restarted: 'neu gestartet', skipped: 'übersprungen', failed: 'fehlgeschlagen', blocked: 'gesperrt', up_to_date: 'aktuell' };
              const s = variables.status;
              const wort = woerter[s] || esc(s || '?');
              const fehler = s === 'failed' || s === 'blocked';
              const wortHtml = s === 'updated' || s === 'restarted' ? `<span style="color:var(--nachtblau-gruen, #a6d49e);">${wort}</span>` : wort;
              const wann = d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
              // Trennpunkt haengt am Teil davor, damit keine Zeile mit "·" beginnt.
              return block(`<span style="overflow-wrap:anywhere;">${esc((l.host ? l.host + ' ' : '') + n)}&nbsp;·</span> ${ganz(wortHtml + '&nbsp;·')} ${ganz(wann)}`, fehler ? 'var(--nachtblau-koralle, #e7936e)' : '');
            ]]]
          pfeil: >-
            <ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:20px;--ha-icon-display:block;width:20px;height:20px;display:block;color:var(--nachtblau-text-sekundaer, #8794a5);"></ha-icon>
        styles:
          card:
            - border-radius: 14px
            - padding: 8px 8px 8px 10px
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          grid:
            - grid-template-areas: '"i titel pfeil" "i info pfeil"'
            - grid-template-columns: 36px minmax(0, 1fr) 20px
            - grid-template-rows: min-content min-content
            - column-gap: 12px
            - row-gap: 3px
            - align-items: center
          img_cell:
            - width: 36px
            - height: 36px
            - box-sizing: border-box
            - border-radius: 11px
            - margin: 0
            - align-self: center
            - background: |
                [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
            - border: |
                [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
          icon:
            - width: 19px
            - height: 19px
            - margin: 0
            - --ha-icon-display: block
            - color: '[[[ return variables.akzent || "var(--nachtblau-label, #b4c0cf)"; ]]]'
          custom_fields:
            titel:
              - justify-self: start
              - align-self: end
              - min-width: 0
              - max-width: 100%
              - overflow: hidden
              - white-space: normal
              - display: -webkit-box
              - -webkit-box-orient: vertical
              - -webkit-line-clamp: '2'
              - text-wrap: balance
              - text-align: left
            # Zwei Bloecke: "naechster Lauf" (eine Zeile) und das letzte Update
            # (hoechstens zwei Zeilen, Kuerzung im Block selbst)
            info:
              - justify-self: stretch
              - align-self: start
              - min-width: 0
              - max-width: 100%
              - overflow: hidden
              - white-space: normal
              - font-size: 12px
              - line-height: 1.25
              - margin-top: 5px
              - text-align: left
            pfeil:
              - align-self: center
              - justify-self: end

      - type: custom:button-card
        template: nachtblau_docker_titel
        name: Arcane

      # Arcane auf jedem Host: die Hauptinstanz (docker-01) und je Agent dessen
      # Version (HA-Arcane ab 0.11.0, "docker-02 Arcane"). Alle Update-Entitaeten
      # der Integration ausser denen der Container.
      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        sort:
          method: name
        filter:
          include:
            - integration: arcane
              domain: update
              options:
                type: custom:button-card
                template: nachtblau_docker_update
                variables:
                  frage: "[[[ return variables.anzeige + ' jetzt aktualisieren? Das neue Image wird geladen und Arcane startet auf diesem Host neu; er ist in HA dabei kurz nicht erreichbar.'; ]]]"
          exclude:
            - entity_id: 'update.container_*'

  # ======================= Pop-up Automatische Updates =======================
  # Unsichtbar, bis die Zeile "Automatische Updates" den Hash
  # #docker-autoupdates setzt. Aufbau wie das WLAN-Pop-up (wlan-karte-v2.yaml):
  # Bubble Card als Blatt von unten, eigener Kopf statt Bubble-Kopf, schliessen
  # per Wischen nach unten, Tipp daneben oder Escape; Hintergrund wie dort.
  # Platz (Bubble Card v3.4.2, src/cards/pop-up/styles.css): Inhalt = Breite -
  # 2 x 18 px Polster, also 324 px auf dem 360 px breiten Handy, 366 px auf dem
  # iPhone 17 Pro. Hoehe hoechstens 100vh - 56 px, davon 18 px Polster oben und
  # 84 px unten (with_bottom_offset, Platz fuer die Navbar): 539 px bei 697 px
  # Bildschirmhoehe, 716 px auf dem iPhone. Gerechnet, nicht am Geraet
  # gemessen.
  # Inhalt: Kopf in einer Zeile (nachtblau_docker_autoupdate_info), darunter
  # ein Chip je Container in zwei Spalten (nachtblau_docker_autoupdate_chip),
  # Chips 28 px hoch, Abstand 6 px zwischen den Spalten und 3 px zwischen den
  # Reihen (card_mod an der grid-Karte), 10 px zwischen Kopf und Raster
  # (--bubble-pop-up-gap, Standard 14 px). Container aller Hosts; die eines
  # entfernten Hosts tragen ihn im Namen ("docker-02 portainer") und stehen
  # nach Namen sortiert beieinander. Gemessen im Nachbau mit geladenem Roboto:
  # 522 px hoch bei 32 Containern (28 auf docker-01, 4 auf docker-02, 16
  # Reihen), auf beiden Breiten; mit 29 px und 4 px waeren es 553 px. Ein Reiter je Host
  # ist damit nicht noetig. Ab dem 33. Container kommt eine siebzehnte Reihe
  # dazu (+31 px), dann scrollt das Blatt auf dem 360 px breiten Handy.
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#docker-autoupdates'
    show_header: false
    popup_mode: fit-content
    with_bottom_offset: true
    bg_opacity: '100'
    # bg_color loest Bubble Card (v3.4.2) nur einmal auf; !important im eigenen
    # CSS schlaegt den Inline-Wert (wie im WLAN-Pop-up).
    styles: |
      .bubble-pop-up {
        --bubble-pop-up-background-color: color-mix(in srgb, var(--nachtblau-seite, #171d29) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-flaeche-erhoeht, #222b3c)) !important;
        --bubble-pop-up-gap: 10px;
      }
    cards:
      - type: custom:button-card
        template: nachtblau_docker_autoupdate_info
      - type: custom:auto-entities
        card:
          type: grid
          columns: 2
          square: false
          card_mod:
            style: |
              #root {
                gap: 3px 6px !important;
              }
        card_param: cards
        sort:
          method: name
        filter:
          include:
            - integration: arcane
              domain: switch
              entity_id: 'switch.container_*_automatisch_aktualisieren'
              options:
                type: custom:button-card
                template: nachtblau_docker_autoupdate_chip
        else:
          type: custom:button-card
          show_icon: false
          show_state: false
          show_name: true
          name: Keine Schalter. In der Integration unter Steuerung „Auto-Update-Schalter“ einschalten.
          tap_action:
            action: none
          hold_action:
            action: none
          styles:
            card:
              - padding: 10px 12px
              - border-radius: 14px
              - box-shadow: none
              - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
              - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
            name:
              - font-size: 12px
              - white-space: normal
              - text-align: left
              - justify-self: start
              - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
