# ============================================================================
# WLAN-QR – aufklappbar, internes und Gaeste-WLAN
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        button-card, card-mod, expander-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   wlan_heim/wlan_gast
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# WLAN-QR (aufklappbar) mit einem Code je Netz, nebeneinander
#
# Unterschied zu wlan-karte.yaml (archiv): Statt eines festen PNG ueber die
# volle Breite zeichnet eine button-card die Codes aus den Entitaeten der
# UniFi-Integration. Ein Netz zeigt einen Code mit hoechstens 210 px Breite,
# zwei Netze stehen in zwei Spalten. Unter jedem Code stehen der Netzname
# (Name des UniFi-WLAN-Geraets, also die SSID), die Rolle und die Anzahl
# verbundener Geraete. Die Kopfzeile nennt die gerade gezeigten Netze.
#
# Liste "netze" (YAML-Anker, gilt fuer Kopf und Codes):
#   rolle     Anzeige unter dem Netznamen und in der Kopfzeile
#   clients   Sensor "Clients" des WLANs; ueber sein Geraet kommt der
#             Netzname. Fehlt das Geraet, steht dort die Rolle
#   qr        Bild-Entitaet "QR-Code" des WLANs
#   schalter  Schalter "Aktiviert" des WLANs: Netz nur zeigen, solange er
#             "on" ist; fehlt die Entitaet, bleibt das Netz ausgeblendet
#
# Die UniFi-Integration legt QR-Bild und Schalter nur an, wenn ihr Konto in
# der Network-App die Site-Rolle admin hat. Das QR-Bild ist danach
# standardmaessig deaktiviert und muss in HA aktiviert werden. Es erzeugt den
# Code neu, sobald sich das Passwort aendert. Alle Entitaeten der Liste stehen
# auch in triggers_update (Anker trigger): HA tauscht den Token in
# entity_picture alle 5 Minuten, die Karte muss das Bild dann neu laden.
#
# Voraussetzung: custom:expander-card, custom:button-card, card-mod (HACS),
# UniFi Network mit Admin-Konto, QR-Bilder der WLANs aktiviert.
type: custom:expander-card
expanded: false
clear: false
clear-children: true
title-card:
  type: custom:button-card
  show_icon: true
  show_name: true
  show_label: true
  show_state: false
  icon: mdi:wifi
  name: WLAN
  variables:
    netze: &netze
      - rolle: Intern
        clients: sensor.wlan_heim_clients
        qr: image.wlan_heim_qr_code
        schalter: switch.wlan_heim_aktiviert
      - rolle: Gäste
        clients: sensor.wlan_gast_clients
        qr: image.wlan_gast_qr_code
        schalter: switch.wlan_gast_aktiviert
  triggers_update: &trigger
    - sensor.wlan_heim_clients
    - image.wlan_heim_qr_code
    - switch.wlan_heim_aktiviert
    - sensor.wlan_gast_clients
    - image.wlan_gast_qr_code
    - switch.wlan_gast_aktiviert
  label: |
    [[[
      const an = (variables.netze || []).filter((n) => states[n.schalter] && states[n.schalter].state === 'on');
      return an.length ? an.map((n) => n.rolle).join(' · ') : 'kein WLAN aktiv';
    ]]]
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 2px 2px 2px
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: min-content 1fr
      - grid-template-rows: min-content min-content
    img_cell:
      - width: 46px
      - height: 46px
      - border-radius: 14px
      - background: 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent)'
      - border: '1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)'
      - margin-right: 15px
    icon:
      - width: 24px
      - height: 24px
      - color: 'var(--owlet-blau, #7fb3d5)'
    name:
      - justify-self: start
      - align-self: end
      - font-size: 18px
      - font-weight: 700
      - letter-spacing: -0.02em
      - color: 'var(--owlet-text, #f2f5f8)'
    label:
      - justify-self: start
      - align-self: start
      - font-size: 13px
      - color: 'var(--owlet-text-sekundaer, #8794a5)'
      - margin-top: 2px
cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_label: false
    show_state: false
    variables:
      netze: *netze
    triggers_update: *trigger
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 4px 0 2px
      grid:
        - grid-template-areas: '"codes"'
        - grid-template-columns: 1fr
      custom_fields:
        codes:
          - width: 100%
    custom_fields:
      codes: |
        [[[
          const M = 'var(--owlet-text-sekundaer, #8794a5)';
          const L = 'var(--owlet-label, #b4c0cf)';
          const ents = hass.entities || {}, devs = hass.devices || {};
          const netze = (variables.netze || []).filter((n) => states[n.schalter] && states[n.schalter].state === 'on');
          // Netzname = Name des UniFi-WLAN-Geraets (SSID), sonst die Rolle
          const ssid = (n) => {
            const d = devs[(ents[n.clients] || {}).device_id];
            return d ? (d.name_by_user || d.name) : n.rolle;
          };
          const esc = (t) => String(t).replace(/[&<>"]/g, (z) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[z]);
          const zelle = (n) => {
            const q = states[n.qr];
            const src = q && q.state !== 'unavailable' ? q.attributes.entity_picture : '';
            const c = states[n.clients];
            const anzahl = c && !isNaN(parseInt(c.state, 10)) ? ` · ${parseInt(c.state, 10)} ${parseInt(c.state, 10) === 1 ? 'Gerät' : 'Geräte'}` : '';
            const code = src
              ? `<img src="${src}" alt="QR-Code ${esc(ssid(n))}" style="display:block;width:100%;height:auto;border-radius:14px;">`
              : `<div style="aspect-ratio:1;border-radius:14px;border:1px dashed var(--owlet-aus, #3a4453);display:grid;place-items:center;padding:10px;text-align:center;font-size:12px;color:${M};">QR-Code nicht verfügbar</div>`;
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;width:100%;">
              ${code}
              <span style="margin-top:2px;font-size:13px;font-weight:650;color:${L};max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(ssid(n))}</span>
              <span style="font-size:12px;color:${M};">${esc(n.rolle)}${anzahl}</span></div>`;
          };
          if (!netze.length) {
            return `<div style="font-size:12.5px;color:${M};text-align:center;padding:8px 0;">Kein WLAN aktiv</div>`;
          }
          const spalten = netze.length > 1 ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 210px)';
          return `<div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:grid;grid-template-columns:${spalten};justify-content:center;gap:12px;">${netze.map(zelle).join('')}</div>
            <div style="font-size:12.5px;color:${M};text-align:center;">Kamera-App öffnen und auf den Code richten</div></div>`;
        ]]]
card_mod:
  style: |
    ha-card {
      border-radius: 22px !important;
      border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
      box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 14px 16px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    /* Aufklapp-Pfeil dezent */
    ha-card ha-icon,
    ha-card .expander-icon,
    ha-card mwc-icon-button {
      color: var(--owlet-muted, #6e7988) !important;
    }
