    cards:
      - type: custom:button-card
        variables:
          netz: *gaeste
        triggers_update: *trigger
        show_icon: false
        show_name: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles: *popup_styles
        custom_fields: *popup_felder
