# ============================================================================
# Docker – button-card-Templates nachtblau_docker_* (Zeilen, Kopf, Kennzahlen)
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Genutzt von docker-karte.yaml (Netzwerk-View) und den Karten der
# Docker-View (docker-view.yaml). Entwuerfe: Vorschau-Artefakte "Docker-Karte
# Vorschau" und "Docker-View Konzept" (Oktober 2026).
#
# Uebersicht der Templates (Einzelheiten jeweils darueber):
#   nachtblau_docker_zeile     Container-Zeile mit Neustart und Start/Stop
#   nachtblau_docker_projekt   Compose-Projekt-Zeile (erbt nachtblau_docker_zeile)
#   nachtblau_docker_update    Zeile mit Image-Update und "Installieren"
#   nachtblau_docker_kopf      Kartenkopf: Icon-Kachel, Titel, Untertitel, Badge
#   nachtblau_docker_titel     Abschnittstitel (10,5 px, Versalien)
#   nachtblau_docker_aufklapper  Kopfzeile einer expander-card mit Zahl-Chip
#   nachtblau_docker_kpi       Kennzahl-Kachel (Laufend, Gestoppt, ...)
#   nachtblau_docker_messwert  Messwert mit Balken (Host-CPU, -RAM, -Disk)
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> die Eintraege unter
#   "button_card_templates:" auf oberster Ebene ergaenzen (neben "views:";
#   den Block gibt es schon, wenn andere Nachtblau-Templates drin sind).
#
# nachtblau_docker_zeile  Eine Zeile je Container. Entity ist der Start/Stop-
#                     Schalter der Arcane-Integration (switch.container_<x>).
#                     Daraus bildet das Template die Geschwister-Entitaeten:
#                       sensor.container_<x>_zustand       Zustand (enum)
#                       sensor.container_<x>_status        Docker-Status
#                       binary_sensor.container_<x>_healthy  nur mit Healthcheck
#                       update.container_<x>_image_update  Image-Update
#                       button.container_<x>_neustarten     Neustart
#                     Die Endungen _zustand und _neustarten stammen aus der
#                     deutschen Uebersetzung der Integration (HA bildet die
#                     Entity-ID aus dem Namen in der Sprache der Instanz). Auf
#                     einer englischen Instanz heissen sie anders; dann die
#                     Endungen unten anpassen.
#
# Zeile:
#   - Icon-Kachel nach Zustand: laeuft Gruen, ungesund und dead Rot,
#     Neustart/Pause und Healthcheck-Start Amber, gestoppt neutral
#     (gestoppt kann Absicht sein).
#   - Healthcheck-Start: Nach jedem Start, Neustart oder Update meldet Docker
#     "(health: starting)", bis der erste Healthcheck durch ist (beobachtet
#     am 21.10.2026: 29 s). Arcane setzt _healthy in dieser Zeit auf off. Die
#     Zeile wertet das nicht als "ungesund", sondern zeigt Amber und
#     "... · startet". Ungesund heisst: laeuft, _healthy off, kein Start.
#   - Name ohne "Container "-Vorsatz und ohne Compose-Anhaengsel:
#     "sonarr-sonarr-1" -> "sonarr", "docmost-db-1" -> "docmost-db".
#   - Docker-Status auf Deutsch ("Up 2 weeks (healthy)" -> "laeuft seit
#     2 Wochen · gesund"); unbekannte Formen erscheinen unveraendert.
#   - Pillen "ungesund" (Rot) und "Update" (Amber), Tönung 0,12 / Rand 0,24.
#     "Update" ist eine eigene eingebettete button-card: Antippen oeffnet den
#     Update-Dialog von HA (installierte und neue Version, "Installieren",
#     Fortschritt). Installiert wird per Arcane-Redeploy; der API-Key
#     braucht dafuer containers:redeploy. Waehrend der Installation steht
#     "Update laeuft" in der Pille. Innenabstand 4 px / 9 px, damit die
#     Pille als Tippziel mindestens 24 px hoch ist (WCAG 2.5.8).
#   - Antippen oeffnet die Detailansicht des Zustand-Sensors (von dort ist
#     das Geraet mit allen Entitaeten erreichbar). Bewusst nicht die des
#     Schalters: deren Umschalter stoppt ohne Rueckfrage.
#   - Rechts Neustart und Start/Stop als eingebettete button-cards. Neustart
#     und Stoppen fragen nach, Starten nicht. Ist die Steuerung in der
#     Integration aus, sind Schalter und Button nicht verfuegbar und
#     ausgegraut.
#
# Hinweise zu den Karten:
#   - button-card wertet JS-Templates in eingebetteten Karten (custom_fields
#     mit card:) im Kontext der aeusseren Karte aus (button-card docs,
#     "Nested cards with JS templates"). Neustart und Schalter lesen ihren
#     Zustand deshalb ueber die aeussere Karte: deren Entity ist der
#     Schalter, den Neustart-Button liest sie ueber states[...]. Aendert sich
#     die ausgewertete Konfiguration, gibt button-card sie per setConfig an
#     die eingebettete Karte weiter (src/button-card.ts, _cardsConfig).
#     Die Schreibweise mit vier Klammern (Auswertung in der eingebetteten
#     Karte) kennt ci/check-js-templates.js nicht; sie wird nicht gebraucht.
#   - button-card v7 erkennt die Entitaeten, die ein Template liest, selbst
#     und zeichnet bei deren Aenderung neu; triggers_update ist dort ohne
#     Wirkung.
#   - button-card setzt bei ha-icon margin:auto und zentriert custom_fields;
#     daher margin:0 und text-align:left.
#
# Kleine Schrift: Status und Titel in nachtblau-text-sekundaer (5,2:1), auf den
# getoenten Pillen steht die Schrift in der Pillenfarbe (DESIGN.md, Tabelle
# "Status und Akzente": hell mindestens 4,62:1 auf Toenung 0,12).
#
# Voraussetzung: custom:button-card (HACS, getestet wird mit v7.0.1),
#                Integration Arcane (HACS, ProfessorQuantumUniverse/Arcane-HA,
#                v0.5.2) mit Praefix im Geraetenamen (Optionen -> Entities,
#                Standard), sodass die Entity-IDs mit container_ beginnen.
# ============================================================================
button_card_templates:
  nachtblau_docker_zeile:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    extra_styles: |
      :host { container-type: inline-size; }
      /* Zeile: 306 px auf dem 360 px breiten Handy, 348 px auf dem iPhone 17 Pro.
         Neben dem Namen blieben schmal fuer Name und Update-Pille zusammen 110 px:
         Die Pille steht dann unter dem Status. */
      @container (max-width: 327px) {
        #container {
          grid-template-areas: "i titel neustart schalter" "i info neustart schalter" "i upd neustart schalter" !important;
          grid-template-columns: 36px minmax(0, 1fr) 40px 52px !important;
          grid-template-rows: min-content min-content min-content !important;
          row-gap: 0 !important;
        }
        #info { margin-top: 8px !important; }
        #upd { margin: 5px 0 0 !important; align-self: start !important; }
      }
    variables:
      basis: '[[[ return entity ? entity.entity_id.split(".")[1] : ""; ]]]'
      anzeige: |
        [[[
          let n = String((entity && entity.attributes.friendly_name) || variables.basis)
            .replace(/^Container /, '').replace(/-\d+$/, '');
          const t = n.split('-');
          if (t.length % 2 === 0) {
            const h = t.length / 2;
            if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
          }
          return n;
        ]]]
      zustand: |
        [[[
          const z = states['sensor.' + variables.basis + '_zustand'];
          return z ? z.state : 'unknown';
        ]]]
      status: |
        [[[
          const s = states['sensor.' + variables.basis + '_status'];
          return s ? s.state : '';
        ]]]
      startet: |
        [[[ return variables.zustand === 'running' && /\(health: starting\)/.test(variables.status); ]]]
      ungesund: |
        [[[
          const h = states['binary_sensor.' + variables.basis + '_healthy'];
          return !!h && h.state === 'off' && variables.zustand === 'running' && !variables.startet;
        ]]]
      update: |
        [[[
          const u = states['update.' + variables.basis + '_image_update'];
          return !!u && u.state === 'on';
        ]]]
      akzent: |
        [[[
          const z = variables.zustand;
          if (z === 'running' && variables.ungesund) return 'var(--nachtblau-rot, #f0736a)';
          if (z === 'running' && variables.startet) return 'var(--nachtblau-amber, #e6b566)';
          if (z === 'running') return 'var(--nachtblau-gruen, #a6d49e)';
          if (z === 'restarting' || z === 'paused' || z === 'removing') return 'var(--nachtblau-amber, #e6b566)';
          if (z === 'dead') return 'var(--nachtblau-rot, #f0736a)';
          return '';
        ]]]
      text: |
        [[[
          const EINHEIT = {
            second: ['Sekunde', 'Sekunden'], minute: ['Minute', 'Minuten'], hour: ['Stunde', 'Stunden'],
            day: ['Tag', 'Tagen'], week: ['Woche', 'Wochen'], month: ['Monat', 'Monaten'], year: ['Jahr', 'Jahren']
          };
          const FEST = {
            'Less than a second': 'weniger als einer Sekunde',
            'About a minute': 'etwa einer Minute',
            'About an hour': 'etwa einer Stunde'
          };
          const dauer = (d) => {
            if (FEST[d]) return FEST[d];
            const m = /^(\d+) (second|minute|hour|day|week|month|year)s?$/.exec(d);
            if (!m) return d;
            const n = parseInt(m[1], 10);
            return n + ' ' + EINHEIT[m[2]][n === 1 ? 0 : 1];
          };
          const s = variables.status;
          const z = variables.zustand;
          if (z === 'unavailable' || z === 'unknown') return 'keine Daten';
          let m = /^Up (.+?)(?: \((?:healthy|unhealthy|health: starting|Paused)\))?$/.exec(s);
          if (m) {
            if (z === 'paused') return 'pausiert';
            const zusatz = /\(healthy\)/.test(s) ? ' · gesund' : /\(health: starting\)/.test(s) ? ' · startet' : '';
            return 'läuft seit ' + dauer(m[1]) + zusatz;
          }
          m = /^Exited \((\d+)\) (.+) ago$/.exec(s);
          if (m) return 'gestoppt vor ' + dauer(m[2]) + ' · Code ' + m[1];
          if (z === 'restarting') return 'startet neu …';
          if (z === 'created') return 'erstellt, nicht gestartet';
          if (z === 'removing') return 'wird entfernt …';
          return s;
        ]]]
    icon: |
      [[[
        const z = variables.zustand;
        if (z === 'running' && variables.ungesund) return 'mdi:alert-circle-outline';
        if (z === 'running' && variables.startet) return 'mdi:progress-clock';
        if (z === 'running') return 'mdi:play-circle-outline';
        if (z === 'paused') return 'mdi:pause-circle-outline';
        if (z === 'restarting' || z === 'removing') return 'mdi:restart';
        if (z === 'dead') return 'mdi:alert-circle-outline';
        return 'mdi:stop-circle-outline';
      ]]]
    tap_action:
      action: more-info
      entity: '[[[ return "sensor." + variables.basis + "_zustand"; ]]]'
    hold_action:
      action: none
    custom_fields:
      titel: |
        [[[
          const pille = (txt, farbe) => `<span style="flex:0 0 auto;font-size:11px;font-weight:700;color:${farbe};background:color-mix(in srgb, ${farbe} 12%, transparent);border:1px solid color-mix(in srgb, ${farbe} 24%, transparent);padding:2px 7px;border-radius:8px;">${txt}</span>`;
          let h = `<span style="min-width:0;font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;overflow-wrap:anywhere;">${variables.anzeige}</span>`;
          if (variables.ungesund) h += pille('ungesund', 'var(--nachtblau-rot, #f0736a)');
          return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;min-width:0;">${h}</div>`;
        ]]]
      upd:
        card:
          type: custom:button-card
          entity: '[[[ return "update." + variables.basis + "_image_update"; ]]]'
          name: |
            [[[
              const u = states['update.' + variables.basis + '_image_update'];
              return u && u.attributes.in_progress ? 'Update läuft' : 'Update';
            ]]]
          show_icon: false
          show_name: true
          show_state: false
          tap_action:
            action: more-info
          hold_action:
            action: none
          styles:
            card:
              - padding: 4px 9px
              - border-radius: 8px
              - box-shadow: none
              - background: 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)'
              - border: '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)'
            name:
              - font-size: 11px
              - font-weight: 700
              - line-height: 1.4
              - white-space: nowrap
              - color: 'var(--nachtblau-amber, #e6b566)'
      info: |
        [[[
          const farbe = variables.zustand === 'restarting' || variables.startet ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
          return `<span style="font-size:12px;color:${farbe};">${variables.text}</span>`;
        ]]]
      neustart:
        card:
          type: custom:button-card
          entity: '[[[ return "button." + variables.basis + "_neustarten"; ]]]'
          icon: mdi:restart
          show_icon: true
          show_name: false
          show_state: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: '[[[ return "button." + variables.basis + "_neustarten"; ]]]'
            confirmation:
              text: '[[[ return variables.anzeige + " neu starten? Der Container ist dabei für einige Sekunden nicht erreichbar."; ]]]'
          hold_action:
            action: none
          styles:
            card:
              - width: 40px
              - height: 40px
              - padding: 0
              - border-radius: 12px
              - box-shadow: none
              - background: 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'
              - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
              - opacity: |
                  [[[
                    const b = states['button.' + variables.basis + '_neustarten'];
                    return b && b.state !== 'unavailable' ? 1 : 0.4;
                  ]]]
            icon:
              - width: 18px
              - height: 18px
              - color: 'var(--nachtblau-label, #b4c0cf)'
      schalter:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          show_icon: false
          show_name: false
          show_state: false
          tap_action: |
            [[[
              if (!entity || entity.state === 'unavailable') return { action: 'none' };
              if (entity.state !== 'on') return { action: 'toggle' };
              return {
                action: 'toggle',
                confirmation: { text: variables.anzeige + ' stoppen? Was darin läuft, ist danach nicht mehr erreichbar, bis du ihn wieder startest.' }
              };
            ]]]
          hold_action:
            action: none
          custom_fields:
            knopf: |
              [[[
                const an = entity && entity.state === 'on';
                const weg = !entity || entity.state === 'unavailable';
                const gruen = 'var(--nachtblau-gruen, #a6d49e)';
                const spur = an
                  ? `background:color-mix(in srgb, ${gruen} 24%, transparent);border:1px solid color-mix(in srgb, ${gruen} 50%, transparent);`
                  : 'background:var(--nachtblau-aus, #3a4453);border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));';
                const punkt = an ? `left:18px;background:${gruen};` : 'left:2px;background:var(--nachtblau-muted, #6e7988);';
                return `<span style="position:relative;display:block;width:40px;height:24px;box-sizing:border-box;border-radius:12px;opacity:${weg ? 0.4 : 1};transition:background .2s;${spur}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;transition:left .2s;${punkt}"></span></span>`;
              ]]]
          styles:
            card:
              - width: 52px
              - height: 40px
              - padding: 0
              - background: none
              - border: none
              - box-shadow: none
            grid:
              - grid-template-areas: '"knopf"'
              - grid-template-columns: 1fr
              - justify-items: center
              - align-items: center
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        # Mit Update waechst titel bis zur Breite des Namens, upd (auto) bekommt
        # die Breite der Pille und den Rest der Zeile. Ohne Update entfaellt
        # die Spalte upd: Die Statuszeile unter titel und upd zog sonst Breite
        # in die leere Spalte, auf dem 360 px breiten Handy blieben dem Namen
        # zum Teil 78 von 122 px. Lange Namen brechen in bis zu zwei Zeilen um.
        - grid-template-areas: '[[[ return variables.update ? `"i titel upd neustart schalter" "i info info neustart schalter"` : `"i titel neustart schalter" "i info neustart schalter"`; ]]]'
        - grid-template-columns: '[[[ return variables.update ? "36px minmax(0, max-content) auto 40px 52px" : "36px minmax(0, 1fr) 40px 52px"; ]]]'
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.akzent || "var(--nachtblau-muted, #6e7988)"; ]]]'
      custom_fields:
        titel:
          - justify-self: stretch
          - align-self: end
          - min-width: 0
          - text-align: left
        # Status in bis zu zwei Zeilen. 12 px mit 5 px Abstand nach oben halten
        # einzeilig die bisherige Lage (der 12-px-Text stand vorher in einer
        # Zeile der Feldschrift von 16,8 px).
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        upd:
          - display: '[[[ return variables.update ? "block" : "none"; ]]]'
          - justify-self: start
          - align-self: end
          - margin-left: -6px
        neustart:
          - align-self: center
        schalter:
          - align-self: center

  # ---------------------------------------------------------------------------
  # nachtblau_docker_projekt: Zeile je Compose-Projekt. Entity ist der Schalter
  # switch.project_<x> (an = compose up, aus = compose down). Erbt Aufbau,
  # Neustart und Schalter von nachtblau_docker_zeile; Geschwister:
  #   sensor.project_<x>_status             running | partially running | stopped
  #   sensor.project_<x>_laufende_services  und sensor.project_<x>_services
  #   binary_sensor.project_<x>_update_verfugbar
  #   button.project_<x>_neustarten
  # Herunterfahren fragt nach: compose down entfernt die Container des
  # Projekts, ihre Entitaeten verschwinden bis zum naechsten Start (laut
  # README von Arcane-HA). Starten fragt nicht nach.
  nachtblau_docker_projekt:
    template: nachtblau_docker_zeile
    variables:
      anzeige: '[[[ return String((entity && entity.attributes.friendly_name) || variables.basis).replace(/^Project /, ""); ]]]'
      zustand: |
        [[[
          const s = states['sensor.' + variables.basis + '_status'];
          return s ? s.state : 'unknown';
        ]]]
      status: '[[[ return ""; ]]]'
      startet: '[[[ return false; ]]]'
      ungesund: '[[[ return false; ]]]'
      update: '[[[ return false; ]]]'
      projekt_update: |
        [[[
          const u = states['binary_sensor.' + variables.basis + '_update_verfugbar'];
          return !!u && u.state === 'on';
        ]]]
      akzent: |
        [[[
          const z = variables.zustand;
          if (z === 'running') return 'var(--nachtblau-gruen, #a6d49e)';
          if (z === 'stopped' || z === 'unavailable' || z === 'unknown') return '';
          return 'var(--nachtblau-amber, #e6b566)';
        ]]]
      text: |
        [[[
          const z = variables.zustand;
          if (z === 'unavailable' || z === 'unknown') return 'keine Daten';
          const l = states['sensor.' + variables.basis + '_laufende_services'];
          const g = states['sensor.' + variables.basis + '_services'];
          const dienste = (l && g) ? ' · ' + l.state + '/' + g.state + ' Services' : '';
          const wort = { 'running': 'läuft', 'partially running': 'läuft teilweise', 'stopped': 'gestoppt' }[z] || z;
          return wort + dienste + (variables.projekt_update ? ' · Update verfügbar' : '');
        ]]]
    icon: '[[[ return variables.zustand === "stopped" ? "mdi:layers-off-outline" : "mdi:layers-outline"; ]]]'
    tap_action:
      action: more-info
      entity: '[[[ return "sensor." + variables.basis + "_status"; ]]]'
    custom_fields:
      info: |
        [[[
          const farbe = variables.zustand === 'partially running' ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
          return `<span style="font-size:12px;color:${farbe};">${variables.text}</span>`;
        ]]]
      neustart:
        card:
          tap_action:
            confirmation:
              text: '[[[ return "Projekt " + variables.anzeige + " neu starten? Alle Container des Projekts starten neu."; ]]]'
      schalter:
        card:
          tap_action: |
            [[[
              if (!entity || entity.state === 'unavailable') return { action: 'none' };
              if (entity.state !== 'on') return { action: 'toggle' };
              return {
                action: 'toggle',
                confirmation: { text: 'Projekt ' + variables.anzeige + ' herunterfahren? compose down entfernt seine Container; sie kommen erst mit dem nächsten Start zurück.' }
              };
            ]]]

  # ---------------------------------------------------------------------------
  # nachtblau_docker_update: Zeile je Image-Update. Entity ist eine update-Entitaet
  # der Arcane-Integration (update.container_<x>_image_update oder die von
  # Arcane selbst). Antippen oeffnet den Update-Dialog von HA, "Installieren"
  # ruft update.install mit Rueckfrage auf. Ohne ausstehendes Update steht
  # "aktuell" mit der installierten Version da und der Knopf ist aus.
  #   variables.titel  ersetzt den Namen (fuer Arcane selbst)
  #   variables.frage  Text der Rueckfrage (Standard: Container)
  # Rechte: containers:redeploy (Container), system:upgrade (Arcane).
  nachtblau_docker_update:
    variables:
      titel: ''
      frage: ''
      anzeige: |
        [[[
          if (variables.titel) return variables.titel;
          let n = String((entity && entity.attributes.friendly_name) || '')
            .replace(/ Image Update$/, '').replace(/^Container /, '').replace(/-\d+$/, '');
          const t = n.split('-');
          if (t.length % 2 === 0) {
            const h = t.length / 2;
            if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
          }
          return n;
        ]]]
      offen: '[[[ return !!entity && entity.state === "on"; ]]]'
      laeuft: '[[[ return !!entity && !!entity.attributes.in_progress; ]]]'
      akzent: |
        [[[
          if (!entity || entity.state === 'unavailable') return '';
          return variables.offen || variables.laeuft ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-gruen, #a6d49e)';
        ]]]
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    icon: '[[[ return variables.offen || variables.laeuft ? "mdi:package-up" : "mdi:package-variant-closed-check"; ]]]'
    tap_action:
      action: more-info
    hold_action:
      action: none
    custom_fields:
      titel: |
        [[[
          return `<span style="min-width:0;font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;overflow-wrap:anywhere;">${variables.anzeige}</span>`;
        ]]]
      info: |
        [[[
          const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (!entity || entity.state === 'unavailable') return `<span style="font-size:12px;color:${sek};">keine Daten</span>`;
          const a = entity.attributes;
          const bild = a.title ? a.title + ' · ' : '';
          if (variables.laeuft) return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">${bild}wird installiert …</span>`;
          if (!variables.offen) return `<span style="font-size:12px;color:${sek};">${bild}aktuell · ${a.installed_version || '–'}</span>`;
          return `<span style="font-size:12px;color:${sek};">${bild}${a.installed_version || '?'} → ${a.latest_version || '?'}</span>`;
        ]]]
      install:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          name: '[[[ return variables.laeuft ? "läuft …" : "Installieren"; ]]]'
          show_icon: false
          show_name: true
          show_state: false
          tap_action: |
            [[[
              if (!variables.offen || variables.laeuft) return { action: 'none' };
              const frage = variables.frage || (variables.anzeige + ' jetzt aktualisieren? Der Container wird mit dem neuen Image neu ausgerollt und ist dabei kurz nicht erreichbar.');
              return {
                action: 'perform-action',
                perform_action: 'update.install',
                target: { entity_id: entity.entity_id },
                confirmation: { text: frage }
              };
            ]]]
          hold_action:
            action: none
          styles:
            card:
              - min-height: 40px
              - padding: 0 12px
              - border-radius: 12px
              - box-shadow: none
              - background: |
                  [[[ return variables.offen ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
              - border: |
                  [[[ return variables.offen ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
              - opacity: '[[[ return variables.offen ? 1 : 0.4; ]]]'
            name:
              - font-size: 13px
              - font-weight: 700
              - white-space: nowrap
              - color: '[[[ return variables.offen ? "var(--nachtblau-amber, #e6b566)" : "var(--nachtblau-label, #b4c0cf)"; ]]]'
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"i titel install" "i info install"'
        - grid-template-columns: 36px minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.akzent || "var(--nachtblau-muted, #6e7988)"; ]]]'
      custom_fields:
        titel:
          - justify-self: stretch
          - align-self: end
          - min-width: 0
          - text-align: left
        # Status in bis zu zwei Zeilen. 12 px mit 5 px Abstand nach oben halten
        # einzeilig die bisherige Lage (der 12-px-Text stand vorher in einer
        # Zeile der Feldschrift von 16,8 px).
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        install:
          - align-self: center

  # ---------------------------------------------------------------------------
  # nachtblau_docker_kopf: Kopf einer Karte der Docker-View, wie der Kopf von
  # docker-karte.yaml. variables.farbe ist die Farbe der Icon-Kachel (Bereich
  # Netzwerk: Violett); ein Badge rechts setzt die Karte als custom_fields.badge.
  nachtblau_docker_kopf:
    variables:
      farbe: 'var(--nachtblau-violett, #b399d4)'
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kopf: 306 px auf dem 360 px breiten Handy, 348 px auf dem iPhone 17 Pro.
         Schmal ruecken Icon-Kachel und Badge zusammen 8 px naeher an den Namen;
         so passt "Image-Updates" (113 px) neben "Alle aktualisieren" (127 px). */
      @container (max-width: 327px) {
        #img-cell { margin-right: 10px !important; }
        #badge { margin-left: 4px !important; }
      }
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge" "i l badge"'
        - grid-template-columns: min-content minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: '[[[ return "color-mix(in srgb, " + variables.farbe + " 16%, transparent)"; ]]]'
        - border: '[[[ return "1px solid color-mix(in srgb, " + variables.farbe + " 24%, transparent)"; ]]]'
      icon:
        - width: 23px
        - height: 23px
        - --ha-icon-display: block
        - color: '[[[ return variables.farbe; ]]]'
      name:
        - justify-self: start
        - align-self: end
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
        - text-align: left
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--nachtblau-text, #f2f5f8)'
      label:
        - justify-self: start
        - align-self: start
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
        - text-align: left
        - font-size: 12.5px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        - margin-top: 2px
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
          - margin-left: 8px

  # ---------------------------------------------------------------------------
  # nachtblau_docker_titel: Abschnittstitel innerhalb einer Karte, z. B. "authentik".
  nachtblau_docker_titel:
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 2px 2px 0
      name:
        - justify-self: start
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.06em
        - text-transform: uppercase
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_aufklapper: Kopfzeile einer expander-card ("14 weitere
  # Projekte"), Name links, Zahl als Chip rechts (variables.zahl; leer = kein
  # Chip). Aufbau wie "Alle Container" in docker-karte.yaml; die Unterkachel
  # um die Kopfzeile setzt das card_mod der expander-card.
  nachtblau_docker_aufklapper:
    variables:
      zahl: ''
    show_icon: false
    show_name: true
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    # inline-block: Innenabstand eines Inline-Spans wuerde in der Zelle mit
    # overflow:hidden oben und unten abgeschnitten (wie in docker-karte.yaml)
    custom_fields:
      zahl: |
        [[[
          if (variables.zahl === '' || variables.zahl === null) return '';
          return `<span style="display:inline-block;line-height:1.4;font-size:12px;font-weight:700;color:var(--nachtblau-label, #b4c0cf);background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));padding:3px 9px;border-radius:9px;">${variables.zahl}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 12px 4px 12px 14px
      grid:
        - grid-template-areas: '"n zahl"'
        - grid-template-columns: 1fr min-content
        - align-items: center
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 700
        - color: 'var(--nachtblau-text, #f2f5f8)'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_kpi: Kennzahl-Kachel. Entity ist der Zaehler der Umgebung.
  #   variables.typ   anzahl (Standard) | laufend | ungesund
  #     laufend   zeigt "x/y" mit variables.gesamt; alle laufen Gruen, sonst Amber
  #     anzahl    getoent in variables.warn, sobald der Wert ueber 0 liegt
  #     ungesund  zaehlt selbst: laeuft, _healthy off, kein Healthcheck-Start.
  #               Arcane zaehlt Container im Start ("(health: starting)") als
  #               ungesund, z. B. 29 s nach jedem Update; die Entity bleibt
  #               fuer Antippen und Neuzeichnen.
  #   variables.warn  Farbe ab 1 (Standard Amber); '' = nie getoent
  #   variables.zusatz  Text unter der Beschriftung, z. B. "11 ungenutzt";
  #                   ohne Text entfaellt die Zeile samt Abstand
  # Beschriftung: 0,02em und 7 px Innenabstand, in der Viererreihe auf dem
  # 360 px breiten Handy 5 px (extra_styles, Breiten dort).
  # Auf getoenter Flaeche steht die Beschriftung in Label-Grau (DESIGN.md).
  nachtblau_docker_kpi:
    variables:
      typ: anzahl
      gesamt: ''
      warn: 'var(--nachtblau-amber, #e6b566)'
      zusatz: ''
      wert: |
        [[[
          if (variables.typ === 'laufend') {
            const g = states[variables.gesamt];
            if (!entity || isNaN(parseInt(entity.state, 10)) || !g || isNaN(parseInt(g.state, 10))) return '–';
            return entity.state + '/' + g.state;
          }
          if (variables.typ === 'ungesund') {
            let n = 0;
            for (const id of Object.keys(states)) {
              if (!/^binary_sensor\.container_.+_healthy$/.test(id) || states[id].state !== 'off') continue;
              const b = id.slice('binary_sensor.'.length, -'_healthy'.length);
              const z = states['sensor.' + b + '_zustand'];
              const s = states['sensor.' + b + '_status'];
              if (!z || z.state !== 'running') continue;
              if (s && /\(health: starting\)/.test(s.state)) continue;
              n++;
            }
            return String(n);
          }
          const n = entity ? parseInt(entity.state, 10) : NaN;
          return isNaN(n) ? '–' : String(n);
        ]]]
      akzent: |
        [[[
          if (variables.wert === '–') return '';
          if (variables.typ === 'laufend') {
            const t = variables.wert.split('/');
            return t[0] === t[1] ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-amber, #e6b566)';
          }
          return parseInt(variables.wert, 10) > 0 ? variables.warn : '';
        ]]]
    label: '[[[ return variables.wert; ]]]'
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kachel in der Viererreihe: 70,5 px auf dem 360 px breiten Handy, 81 px auf
         dem iPhone 17 Pro. "UNGESUND" braucht 57 px; mit 7 px Innenabstand blieben
         auf dem S25 54,5 px, mit 5 px sind es 58,5 px. */
      @container (max-width: 76px) {
        ha-card { padding-left: 5px !important; padding-right: 5px !important; }
      }
    show_icon: false
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      zusatz: |
        [[[
          return variables.zusatz ? `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${variables.zusatz}</span>` : '';
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 10px 7px
        - box-shadow: none
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 12%, transparent)' : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      grid:
        - grid-template-areas: '[[[ return variables.zusatz ? "\"l\" \"n\" \"zusatz\"" : "\"l\" \"n\""; ]]]'
        - grid-template-columns: 1fr
        - grid-template-rows: '[[[ return variables.zusatz ? "min-content min-content min-content" : "min-content min-content"; ]]]'
        - row-gap: 3px
      custom_fields:
        zusatz:
          - display: '[[[ return variables.zusatz ? "block" : "none"; ]]]'
          - justify-self: start
          - text-align: left
          - max-width: 100%
          - overflow: hidden
          - white-space: nowrap
          - text-overflow: ellipsis
      label:
        - justify-self: start
        - font-size: 20px
        - font-weight: 750
        - letter-spacing: -0.02em
        - color: '[[[ return variables.akzent || "var(--nachtblau-text-sekundaer, #8794a5)"; ]]]'
      name:
        - justify-self: start
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.02em
        - text-transform: uppercase
        - color: '[[[ return variables.akzent ? "var(--nachtblau-label, #b4c0cf)" : "var(--nachtblau-text-sekundaer, #8794a5)"; ]]]'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_messwert: Prozentwert mit Balken (Host-CPU, -RAM, -Disk).
  # Entity ist ein Sensor in %. Farbe nach Schwelle wie in system-karte.yaml:
  # ab variables.gelb Amber, ab variables.rot Rot, sonst Gruen.
  #   variables.zusatz  Text unter der Beschriftung, z. B. "5,1 von 8,3 GB"
  nachtblau_docker_messwert:
    variables:
      gelb: 75
      rot: 90
      zusatz: ''
      wert: |
        [[[
          const v = entity ? parseFloat(entity.state) : NaN;
          return isNaN(v) ? null : v;
        ]]]
      farbe: |
        [[[
          const v = variables.wert;
          if (v === null) return 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (v >= variables.rot) return 'var(--nachtblau-rot, #f0736a)';
          if (v >= variables.gelb) return 'var(--nachtblau-amber, #e6b566)';
          return 'var(--nachtblau-gruen, #a6d49e)';
        ]]]
    label: '[[[ return variables.wert === null ? "–" : variables.wert.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %"; ]]]'
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kachel in der Dreierreihe: 96,7 px auf dem 360 px breiten Handy, 110,7 px
         auf dem iPhone 17 Pro. "38,1 GB belegt" braucht 77,2 px; mit 11 px
         Innenabstand blieben auf dem S25 72,7 px, mit 8 px sind es 78,7 px. */
      @container (max-width: 103px) {
        ha-card { padding-left: 8px !important; padding-right: 8px !important; }
      }
    show_icon: false
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      balken: |
        [[[
          const p = variables.wert === null ? 0 : Math.max(0, Math.min(100, variables.wert));
          return `<div style="height:6px;border-radius:3px;background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));overflow:hidden;"><div style="height:100%;width:${p}%;border-radius:3px;background:${variables.farbe};"></div></div>`;
        ]]]
      zusatz: |
        [[[
          return variables.zusatz ? `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${variables.zusatz}</span>` : '';
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 10px 11px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"l" "balken" "n" "zusatz"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content min-content min-content
        - row-gap: 6px
      label:
        - justify-self: start
        - font-size: 20px
        - font-weight: 750
        - letter-spacing: -0.02em
        - color: '[[[ return variables.farbe; ]]]'
      name:
        - justify-self: start
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.02em
        - text-transform: uppercase
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
      custom_fields:
        balken:
          - justify-self: stretch
        zusatz:
          - justify-self: start
          - text-align: left
          - max-width: 100%
          - overflow: hidden
          - white-space: nowrap
          - text-overflow: ellipsis
