# ============================================================================
# Docker – button-card-Templates nachtblau_docker_* (Zeilen, Kopf, Kennzahlen)
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Genutzt von docker-karte.yaml (Netzwerk-View) und den Karten der
# Docker-View (docker-view.yaml). Entwuerfe: Vorschau-Artefakte "Docker-Karte
# Vorschau" und "Docker-View Konzept" (Oktober 2026).
#
# Uebersicht der Templates (Einzelheiten jeweils darueber):
#   nachtblau_docker_zeile     Container-Zeile mit Neustart und Start/Stop
#   nachtblau_docker_projekt   Compose-Projekt-Zeile (erbt nachtblau_docker_zeile)
#   nachtblau_docker_update    Zeile mit Image-Update und "Installieren"
#   nachtblau_docker_autoupdate_info  Kopf des Pop-ups "Automatische Updates"
#   nachtblau_docker_autoupdate_chip  Container-Chip im Popup (Auto-Update an/aus)
#   nachtblau_docker_kopf      Kartenkopf: Icon-Kachel, Titel, Untertitel, Badge
#   nachtblau_docker_titel     Abschnittstitel (10,5 px, Versalien)
#   nachtblau_docker_aufklapper  Kopfzeile einer expander-card mit Zahl-Chip
#   nachtblau_docker_kpi       Kennzahl-Kachel (Laufend, Gestoppt, ...)
#   nachtblau_docker_messwert  Messwert mit Balken (Host-CPU, -RAM, -Disk)
#   nachtblau_docker_host      Zeile je Host der Karte Hosts (docker-hosts-karte.yaml)
#   nachtblau_docker_host_info Kopf des Host-Pop-ups mit Systemdaten und Versionen
#   nachtblau_docker_ports     Pop-up "Ports" eines Hosts: belegte Host-Ports als Chips
#   nachtblau_docker_host_jobs Hintergrund-Jobs eines Hosts im Pop-up
#   nachtblau_docker_speicher_frei  Freigebbarer Speicher eines Hosts mit Balken
#   nachtblau_docker_aufraeumen  "Ungenutztes aufraeumen" eines Hosts (Skript)
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> die Eintraege unter
#   "button_card_templates:" auf oberster Ebene ergaenzen (neben "views:";
#   den Block gibt es schon, wenn andere Nachtblau-Templates drin sind).
#
# nachtblau_docker_zeile  Eine Zeile je Container. Entity ist der Start/Stop-
#                     Schalter der Arcane-Integration (switch.container_<x>).
#                     Daraus bildet das Template die Geschwister-Entitaeten:
#                       sensor.container_<x>_zustand       Zustand (enum)
#                       sensor.container_<x>_status        Docker-Status
#                       binary_sensor.container_<x>_healthy  nur mit Healthcheck
#                       update.container_<x>_image_update  Image-Update
#                       button.container_<x>_neustarten     Neustart
#                     Die Endungen _zustand und _neustarten stammen aus der
#                     deutschen Uebersetzung der Integration (HA bildet die
#                     Entity-ID aus dem Namen in der Sprache der Instanz). Auf
#                     einer englischen Instanz heissen sie anders; dann die
#                     Endungen unten anpassen.
#
# Zeile:
#   - Icon-Kachel nach Zustand: laeuft Gruen, ungesund und dead Rot,
#     Neustart/Pause und Healthcheck-Start Amber, gestoppt neutral
#     (gestoppt kann Absicht sein).
#   - Healthcheck-Start: Nach jedem Start, Neustart oder Update meldet Docker
#     "(health: starting)", bis der erste Healthcheck durch ist (beobachtet
#     am 21.10.2026: 29 s). Arcane setzt _healthy in dieser Zeit auf off. Die
#     Zeile wertet das nicht als "ungesund", sondern zeigt Amber und
#     "... · startet". Ungesund heisst: laeuft, _healthy off, kein Start.
#   - Name ohne "Container "-Vorsatz und ohne Compose-Anhaengsel:
#     "sonarr-sonarr-1" -> "sonarr", "docmost-db-1" -> "docmost-db".
#   - Docker-Status auf Deutsch ("Up 2 weeks (healthy)" -> "laeuft seit
#     2 Wo. · gesund"); unbekannte Formen erscheinen unveraendert. Einheiten
#     gekuerzt (Sek., Min., Std., Tag/Tagen, Wo., Mon., Jahr/Jahren), damit
#     die Ports noch in die zwei Zeilen passen.
#   - Veroeffentlichte Ports (HA-Arcane ab 0.12.0, Option "Veroeffentlichte
#     Ports"): hinter dem Status die Host-Ports des laufenden Containers,
#     etwa "laeuft seit 33 Std. · 80, 81, 443". Den Sensor "Ports" sucht das
#     Template ueber das Geraet des Schalters (translation_key
#     container_ports), nicht ueber den Namen: Bei einem entfernten Host
#     traegt er den Host in der ID (sensor.container_docker_02_portainer_
#     ports), der Schalter nicht (switch.container_portainer). Ports kommen
#     dazu, solange der Port-Teil samt "+N" hoechstens 11 Zeichen hat, mit
#     Zusatz ("gesund", "startet") hoechstens 7, und wenn der Status dabei
#     laenger als 24 Zeichen ist ("laeuft seit weniger als 1 Sek."),
#     hoechstens 5; passt nicht einmal das, steht nur der erste Port da.
#     Gemessen im Nachbau mit Roboto (als data-URL eingebettet und als
#     geladen geprueft): Die Infozeile ist 122 px (360 px breites Handy) bzw.
#     164 px (iPhone 17 Pro) breit; alle 189 Kombinationen aus neun
#     Dauern, ohne/mit "gesund"/"startet" und sieben Port-Listen bleiben auf
#     beiden Breiten bei hoechstens zwei Zeilen. Ohne die 5er-Grenze braeche
#     "laeuft seit weniger als 1 Sek. · gesund · 9100 +1" auf dem 360 px
#     breiten Handy in drei Zeilen um. Ohne die Option fehlt der Sensor,
#     und die Zeile bleibt wie vorher.
#   - Pillen "ungesund" (Rot) und "Update" (Amber), Tönung 0,12 / Rand 0,24.
#     "Update" ist eine eigene eingebettete button-card: Antippen oeffnet den
#     Update-Dialog von HA (installierte und neue Version, "Installieren",
#     Fortschritt). Installiert wird ueber Arcanes Updater (ab HA-Arcane
#     0.9.0, vorher per Redeploy); der API-Key braucht dafuer
#     image-updates:apply (bis 0.8.1 containers:redeploy). Waehrend der
#     Installation steht "Update laeuft" in der Pille. Innenabstand
#     4 px / 9 px, damit die Pille als Tippziel mindestens 24 px hoch ist
#     (WCAG 2.5.8).
#   - Antippen oeffnet die Detailansicht des Zustand-Sensors (von dort ist
#     das Geraet mit allen Entitaeten erreichbar). Bewusst nicht die des
#     Schalters: deren Umschalter stoppt ohne Rueckfrage.
#   - Rechts Neustart und Start/Stop als eingebettete button-cards. Neustart
#     und Stoppen fragen nach, Starten nicht. Ist die Steuerung in der
#     Integration aus, sind Schalter und Button nicht verfuegbar und
#     ausgegraut.
#
# Hinweise zu den Karten:
#   - button-card wertet JS-Templates in eingebetteten Karten (custom_fields
#     mit card:) im Kontext der aeusseren Karte aus (button-card docs,
#     "Nested cards with JS templates"). Neustart und Schalter lesen ihren
#     Zustand deshalb ueber die aeussere Karte: deren Entity ist der
#     Schalter, den Neustart-Button liest sie ueber states[...]. Aendert sich
#     die ausgewertete Konfiguration, gibt button-card sie per setConfig an
#     die eingebettete Karte weiter (src/button-card.ts, _cardsConfig).
#     Die Schreibweise mit vier Klammern (Auswertung in der eingebetteten
#     Karte) kennt ci/check-js-templates.js nicht; sie wird nicht gebraucht.
#   - button-card v7 erkennt die Entitaeten, die ein Template liest, selbst
#     und zeichnet bei deren Aenderung neu; triggers_update ist dort ohne
#     Wirkung.
#   - button-card setzt bei ha-icon margin:auto und zentriert custom_fields;
#     daher margin:0 und text-align:left.
#
# Kleine Schrift: Status und Titel in nachtblau-text-sekundaer (5,2:1), auf den
# getoenten Pillen steht die Schrift in der Pillenfarbe (DESIGN.md, Tabelle
# "Status und Akzente": hell mindestens 4,62:1 auf Toenung 0,12).
#
# Voraussetzung: custom:button-card (HACS, getestet wird mit v7.0.1),
#                Integration Arcane (philf90/HA-Arcane ab 0.6.0, Marketplace)
#                mit Praefix im Geraetenamen (Optionen -> Entities,
#                Standard), sodass die Entity-IDs mit container_ beginnen.
# ============================================================================
button_card_templates:
  nachtblau_docker_zeile:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    extra_styles: |
      :host { container-type: inline-size; }
      /* Zeile: 306 px auf dem 360 px breiten Handy, 348 px auf dem iPhone 17 Pro.
         Neben dem Namen blieben schmal fuer Name und Update-Pille zusammen 110 px:
         Die Pille steht dann unter dem Status. */
      @container (max-width: 327px) {
        #container {
          grid-template-areas: "i titel neustart schalter" "i info neustart schalter" "i upd neustart schalter" !important;
          grid-template-columns: 36px minmax(0, 1fr) 40px 52px !important;
          grid-template-rows: min-content min-content min-content !important;
          row-gap: 0 !important;
        }
        #info { margin-top: 8px !important; }
        #upd { margin: 5px 0 0 !important; align-self: start !important; }
      }
    variables:
      basis: '[[[ return entity ? entity.entity_id.split(".")[1] : ""; ]]]'
      # true in einer Gruppe, deren Titel den Host schon nennt (Container-Karte)
      ohne_host: false
      # Container eines entfernten Hosts heissen mit der Option "Environment im
      # Geraetenamen" (HA-Arcane ab 0.11.0) "docker-02 dockge-dockge-1": Host
      # abtrennen, Namen kuerzen, Host wieder voranstellen (ausser ohne_host).
      # Den Host liefert der Geraetebaum (Modell "Environment" bzw. "Arcane Agent").
      anzeige: |
        [[[
          const host = (() => {
            const E = hass.entities || {}, D = hass.devices || {};
            let d = entity && E[entity.entity_id] ? D[E[entity.entity_id].device_id] : null;
            for (let i = 0; d && i < 3; i++) {
              if (d.model === 'Environment' || d.model === 'Arcane Agent') return d.name_by_user || d.name || '';
              d = d.via_device_id ? D[d.via_device_id] : null;
            }
            return '';
          })();
          let n = String((entity && entity.attributes.friendly_name) || variables.basis).replace(/^Container /, '');
          let vor = '';
          if (host && n.startsWith(host + ' ')) { vor = host + ' '; n = n.slice(vor.length); }
          n = n.replace(/-\d+$/, '');
          const t = n.split('-');
          if (t.length % 2 === 0) {
            const h = t.length / 2;
            if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
          }
          return (variables.ohne_host ? '' : vor) + n;
        ]]]
      zustand: |
        [[[
          const z = states['sensor.' + variables.basis + '_zustand'];
          return z ? z.state : 'unknown';
        ]]]
      status: |
        [[[
          const s = states['sensor.' + variables.basis + '_status'];
          return s ? s.state : '';
        ]]]
      startet: |
        [[[ return variables.zustand === 'running' && /\(health: starting\)/.test(variables.status); ]]]
      ungesund: |
        [[[
          const h = states['binary_sensor.' + variables.basis + '_healthy'];
          return !!h && h.state === 'off' && variables.zustand === 'running' && !variables.startet;
        ]]]
      update: |
        [[[
          const u = states['update.' + variables.basis + '_image_update'];
          return !!u && u.state === 'on';
        ]]]
      # Host-Ports des Containers aus dem Sensor "Ports" desselben Geraets
      # (Attribut published, "8080→80/tcp", "127.0.0.1:5683→5683/udp"),
      # ohne Adresse und doppelte (tcp und udp auf demselben Port)
      ports: |
        [[[
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          if (!reg) return [];
          for (const e of Object.values(E)) {
            if (e.device_id !== reg.device_id || e.platform !== 'arcane' || e.translation_key !== 'container_ports') continue;
            const s = states[e.entity_id];
            const p = s && Array.isArray(s.attributes.published) ? s.attributes.published : [];
            return [...new Set(p.map((x) => String(x).split('→')[0].replace(/^.*:/, '')).filter(Boolean))];
          }
          return [];
        ]]]
      akzent: |
        [[[
          const z = variables.zustand;
          if (z === 'running' && variables.ungesund) return 'var(--nachtblau-rot, #f0736a)';
          if (z === 'running' && variables.startet) return 'var(--nachtblau-amber, #e6b566)';
          if (z === 'running') return 'var(--nachtblau-gruen, #a6d49e)';
          if (z === 'restarting' || z === 'paused' || z === 'removing') return 'var(--nachtblau-amber, #e6b566)';
          if (z === 'dead') return 'var(--nachtblau-rot, #f0736a)';
          return '';
        ]]]
      text: |
        [[[
          const EINHEIT = {
            second: ['Sek.', 'Sek.'], minute: ['Min.', 'Min.'], hour: ['Std.', 'Std.'],
            day: ['Tag', 'Tagen'], week: ['Wo.', 'Wo.'], month: ['Mon.', 'Mon.'], year: ['Jahr', 'Jahren']
          };
          const FEST = {
            'Less than a second': 'weniger als 1 Sek.',
            'About a minute': 'etwa 1 Min.',
            'About an hour': 'etwa 1 Std.'
          };
          const dauer = (d) => {
            if (FEST[d]) return FEST[d];
            const m = /^(\d+) (second|minute|hour|day|week|month|year)s?$/.exec(d);
            if (!m) return d;
            const n = parseInt(m[1], 10);
            return n + ' ' + EINHEIT[m[2]][n === 1 ? 0 : 1];
          };
          const s = variables.status;
          const z = variables.zustand;
          if (z === 'unavailable' || z === 'unknown') return 'keine Daten';
          let m = /^Up (.+?)(?: \((?:healthy|unhealthy|health: starting|Paused)\))?$/.exec(s);
          if (m) {
            if (z === 'paused') return 'pausiert';
            const zusatz = /\(healthy\)/.test(s) ? ' · gesund' : /\(health: starting\)/.test(s) ? ' · startet' : '';
            return 'läuft seit ' + dauer(m[1]) + zusatz;
          }
          m = /^Exited \((\d+)\) (.+) ago$/.exec(s);
          if (m) return 'gestoppt vor ' + dauer(m[2]) + ' · Code ' + m[1];
          if (z === 'restarting') return 'startet neu …';
          if (z === 'created') return 'erstellt, nicht gestartet';
          if (z === 'removing') return 'wird entfernt …';
          return s;
        ]]]
    icon: |
      [[[
        const z = variables.zustand;
        if (z === 'running' && variables.ungesund) return 'mdi:alert-circle-outline';
        if (z === 'running' && variables.startet) return 'mdi:progress-clock';
        if (z === 'running') return 'mdi:play-circle-outline';
        if (z === 'paused') return 'mdi:pause-circle-outline';
        if (z === 'restarting' || z === 'removing') return 'mdi:restart';
        if (z === 'dead') return 'mdi:alert-circle-outline';
        return 'mdi:stop-circle-outline';
      ]]]
    tap_action:
      action: more-info
      entity: '[[[ return "sensor." + variables.basis + "_zustand"; ]]]'
    hold_action:
      action: none
    custom_fields:
      titel: |
        [[[
          const pille = (txt, farbe) => `<span style="flex:0 0 auto;font-size:11px;font-weight:700;color:${farbe};background:color-mix(in srgb, ${farbe} 12%, transparent);border:1px solid color-mix(in srgb, ${farbe} 24%, transparent);padding:2px 7px;border-radius:8px;">${txt}</span>`;
          let h = `<span style="min-width:0;font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;overflow-wrap:anywhere;">${variables.anzeige}</span>`;
          if (variables.ungesund) h += pille('ungesund', 'var(--nachtblau-rot, #f0736a)');
          return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;min-width:0;">${h}</div>`;
        ]]]
      upd:
        card:
          type: custom:button-card
          entity: '[[[ return "update." + variables.basis + "_image_update"; ]]]'
          name: |
            [[[
              const u = states['update.' + variables.basis + '_image_update'];
              return u && u.attributes.in_progress ? 'Update läuft' : 'Update';
            ]]]
          show_icon: false
          show_name: true
          show_state: false
          tap_action:
            action: more-info
          hold_action:
            action: none
          styles:
            card:
              - padding: 4px 9px
              - border-radius: 8px
              - box-shadow: none
              - background: 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)'
              - border: '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)'
            name:
              - font-size: 11px
              - font-weight: 700
              - line-height: 1.4
              - white-space: nowrap
              - color: 'var(--nachtblau-amber, #e6b566)'
      info: |
        [[[
          const farbe = variables.zustand === 'restarting' || variables.startet ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
          const teile = String(variables.text).split(' · ');
          // Ports nur bei laufendem Container; Budget fuer den Port-Teil siehe oben
          const p = variables.zustand === 'running' ? variables.ports : [];
          if (p.length) {
            const budget = teile.length > 1 ? (teile[0].length > 24 ? 5 : 7) : 11;
            let n = p.length;
            const txt = (k) => p.slice(0, k).join(', ') + (k < p.length ? ' +' + (p.length - k) : '');
            while (n > 1 && txt(n).length > budget) n--;
            const port = txt(n).length <= budget ? txt(n) : p[0];
            teile.push(`<span style="color:var(--nachtblau-label, #b4c0cf);">${port}</span>`);
          }
          // Der erste Teil darf umbrechen, die folgenden bleiben samt "·" zusammen.
          const inhalt = teile.map((t, i) => i === 0
            ? `<span>${t}${teile.length > 1 ? '&nbsp;·' : ''}</span>`
            : `<span style="white-space:nowrap;">${t}${i < teile.length - 1 ? '&nbsp;·' : ''}</span>`).join(' ');
          return `<span style="font-size:12px;color:${farbe};">${inhalt}</span>`;
        ]]]
      neustart:
        card:
          type: custom:button-card
          entity: '[[[ return "button." + variables.basis + "_neustarten"; ]]]'
          icon: mdi:restart
          show_icon: true
          show_name: false
          show_state: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: '[[[ return "button." + variables.basis + "_neustarten"; ]]]'
            confirmation:
              text: '[[[ return variables.anzeige + " neu starten? Der Container ist dabei für einige Sekunden nicht erreichbar."; ]]]'
          hold_action:
            action: none
          styles:
            card:
              - width: 40px
              - height: 40px
              - padding: 0
              - border-radius: 12px
              - box-shadow: none
              - background: 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'
              - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
              - opacity: |
                  [[[
                    const b = states['button.' + variables.basis + '_neustarten'];
                    return b && b.state !== 'unavailable' ? 1 : 0.4;
                  ]]]
            icon:
              - width: 18px
              - height: 18px
              - color: 'var(--nachtblau-label, #b4c0cf)'
      schalter:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          show_icon: false
          show_name: false
          show_state: false
          tap_action: |
            [[[
              if (!entity || entity.state === 'unavailable') return { action: 'none' };
              if (entity.state !== 'on') return { action: 'toggle' };
              return {
                action: 'toggle',
                confirmation: { text: variables.anzeige + ' stoppen? Was darin läuft, ist danach nicht mehr erreichbar, bis du ihn wieder startest.' }
              };
            ]]]
          hold_action:
            action: none
          custom_fields:
            knopf: |
              [[[
                const an = entity && entity.state === 'on';
                const weg = !entity || entity.state === 'unavailable';
                const gruen = 'var(--nachtblau-gruen, #a6d49e)';
                const spur = an
                  ? `background:color-mix(in srgb, ${gruen} 24%, transparent);border:1px solid color-mix(in srgb, ${gruen} 50%, transparent);`
                  : 'background:var(--nachtblau-aus, #3a4453);border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));';
                const punkt = an ? `left:18px;background:${gruen};` : 'left:2px;background:var(--nachtblau-muted, #6e7988);';
                return `<span style="position:relative;display:block;width:40px;height:24px;box-sizing:border-box;border-radius:12px;opacity:${weg ? 0.4 : 1};transition:background .2s;${spur}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;transition:left .2s;${punkt}"></span></span>`;
              ]]]
          styles:
            card:
              - width: 52px
              - height: 40px
              - padding: 0
              - background: none
              - border: none
              - box-shadow: none
            grid:
              - grid-template-areas: '"knopf"'
              - grid-template-columns: 1fr
              - justify-items: center
              - align-items: center
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        # Mit Update waechst titel bis zur Breite des Namens, upd (auto) bekommt
        # die Breite der Pille und den Rest der Zeile. Ohne Update entfaellt
        # die Spalte upd: Die Statuszeile unter titel und upd zog sonst Breite
        # in die leere Spalte, auf dem 360 px breiten Handy blieben dem Namen
        # zum Teil 78 von 122 px. Lange Namen brechen in bis zu zwei Zeilen um.
        - grid-template-areas: '[[[ return variables.update ? `"i titel upd neustart schalter" "i info info neustart schalter"` : `"i titel neustart schalter" "i info neustart schalter"`; ]]]'
        - grid-template-columns: '[[[ return variables.update ? "36px minmax(0, max-content) auto 40px 52px" : "36px minmax(0, 1fr) 40px 52px"; ]]]'
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.akzent || "var(--nachtblau-muted, #6e7988)"; ]]]'
      custom_fields:
        titel:
          - justify-self: stretch
          - align-self: end
          - min-width: 0
          - text-align: left
        # Status in bis zu zwei Zeilen. 12 px mit 5 px Abstand nach oben halten
        # einzeilig die bisherige Lage (der 12-px-Text stand vorher in einer
        # Zeile der Feldschrift von 16,8 px).
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        upd:
          - display: '[[[ return variables.update ? "block" : "none"; ]]]'
          - justify-self: start
          - align-self: end
          - margin-left: -6px
        neustart:
          - align-self: center
        schalter:
          - align-self: center

  # ---------------------------------------------------------------------------
  # nachtblau_docker_projekt: Zeile je Compose-Projekt. Entity ist der Schalter
  # switch.project_<x> (an = compose up, aus = compose down). Erbt Aufbau,
  # Neustart und Schalter von nachtblau_docker_zeile; Geschwister:
  #   sensor.project_<x>_status             running | partially running | stopped
  #   sensor.project_<x>_laufende_services  und sensor.project_<x>_services
  #   binary_sensor.project_<x>_update_verfugbar
  #   button.project_<x>_neustarten
  # Herunterfahren fragt nach: compose down entfernt die Container des
  # Projekts, ihre Entitaeten verschwinden bis zum naechsten Start (laut
  # README von HA-Arcane). Starten fragt nicht nach.
  nachtblau_docker_projekt:
    template: nachtblau_docker_zeile
    variables:
      anzeige: '[[[ return String((entity && entity.attributes.friendly_name) || variables.basis).replace(/^Project /, ""); ]]]'
      zustand: |
        [[[
          const s = states['sensor.' + variables.basis + '_status'];
          return s ? s.state : 'unknown';
        ]]]
      status: '[[[ return ""; ]]]'
      startet: '[[[ return false; ]]]'
      ungesund: '[[[ return false; ]]]'
      update: '[[[ return false; ]]]'
      projekt_update: |
        [[[
          const u = states['binary_sensor.' + variables.basis + '_update_verfugbar'];
          return !!u && u.state === 'on';
        ]]]
      akzent: |
        [[[
          const z = variables.zustand;
          if (z === 'running') return 'var(--nachtblau-gruen, #a6d49e)';
          if (z === 'stopped' || z === 'unavailable' || z === 'unknown') return '';
          return 'var(--nachtblau-amber, #e6b566)';
        ]]]
      text: |
        [[[
          const z = variables.zustand;
          if (z === 'unavailable' || z === 'unknown') return 'keine Daten';
          const l = states['sensor.' + variables.basis + '_laufende_services'];
          const g = states['sensor.' + variables.basis + '_services'];
          const dienste = (l && g) ? ' · ' + l.state + '/' + g.state + ' Services' : '';
          const wort = { 'running': 'läuft', 'partially running': 'läuft teilweise', 'stopped': 'gestoppt' }[z] || z;
          return wort + dienste + (variables.projekt_update ? ' · Update verfügbar' : '');
        ]]]
    icon: '[[[ return variables.zustand === "stopped" ? "mdi:layers-off-outline" : "mdi:layers-outline"; ]]]'
    tap_action:
      action: more-info
      entity: '[[[ return "sensor." + variables.basis + "_status"; ]]]'
    custom_fields:
      info: |
        [[[
          const farbe = variables.zustand === 'partially running' ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
          return `<span style="font-size:12px;color:${farbe};">${variables.text}</span>`;
        ]]]
      neustart:
        card:
          tap_action:
            confirmation:
              text: '[[[ return "Projekt " + variables.anzeige + " neu starten? Alle Container des Projekts starten neu."; ]]]'
      schalter:
        card:
          tap_action: |
            [[[
              if (!entity || entity.state === 'unavailable') return { action: 'none' };
              if (entity.state !== 'on') return { action: 'toggle' };
              return {
                action: 'toggle',
                confirmation: { text: 'Projekt ' + variables.anzeige + ' herunterfahren? compose down entfernt seine Container; sie kommen erst mit dem nächsten Start zurück.' }
              };
            ]]]

  # ---------------------------------------------------------------------------
  # nachtblau_docker_update: Zeile je Image-Update. Entity ist eine update-Entitaet
  # der Arcane-Integration (update.container_<x>_image_update oder die von
  # Arcane selbst). Antippen oeffnet den Update-Dialog von HA, "Installieren"
  # ruft update.install mit Rueckfrage auf. Ohne ausstehendes Update steht
  # "aktuell" mit der installierten Version da und der Knopf ist aus.
  # Gesperrt (ab HA-Arcane 0.7.0): Haelt Arcane ein Update zurueck, etwa wegen
  # eines Schwachstellen-Limits, bleibt die Entitaet on, setzt
  # update_blocked: true und blocked_reason und bietet kein Installieren an.
  # Die Zeile steht dann in Koralle mit Schloss und Grund, der Knopf ist aus.
  # Versionshinweise zeigt der Update-Dialog von HA (Antippen der Zeile), ab
  # HA-Arcane 0.7.0 auch fuer Container-Updates; die Karte selbst fragt sie
  # nicht ab, sonst ginge bei jedem Zeichnen eine Anfrage an Arcane und GitHub.
  #   variables.titel  ersetzt den Namen (fuer Arcane selbst)
  #   variables.frage  Text der Rueckfrage (Standard: Container)
  # Installiert wird ueber Arcanes Updater (ab HA-Arcane 0.9.0): Er folgt der
  # Tag-Regel, zieht ueber Arcanes Schwachstellen-Pruefung und ueberspringt
  # unveraenderte Images; uebersprungen oder fehlgeschlagen meldet HA als
  # Fehler mit Grund.
  # Rechte: image-updates:apply (Container; bis 0.8.1 containers:redeploy),
  # system:upgrade (Arcane),
  # image-updates:read (Versionshinweise im Dialog).
  nachtblau_docker_update:
    variables:
      titel: ''
      frage: ''
      # Host-Praefix wie in nachtblau_docker_zeile ("docker-02 portainer")
      anzeige: |
        [[[
          if (variables.titel) return variables.titel;
          const host = (() => {
            const E = hass.entities || {}, D = hass.devices || {};
            let d = entity && E[entity.entity_id] ? D[E[entity.entity_id].device_id] : null;
            for (let i = 0; d && i < 3; i++) {
              if (d.model === 'Environment' || d.model === 'Arcane Agent') return d.name_by_user || d.name || '';
              d = d.via_device_id ? D[d.via_device_id] : null;
            }
            return '';
          })();
          let n = String((entity && entity.attributes.friendly_name) || '')
            .replace(/ Image Update$/, '').replace(/^Container /, '');
          let vor = '';
          if (host && n.startsWith(host + ' ')) { vor = host + ' '; n = n.slice(vor.length); }
          n = n.replace(/-\d+$/, '');
          const t = n.split('-');
          if (t.length % 2 === 0) {
            const h = t.length / 2;
            if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
          }
          return vor + n;
        ]]]
      offen: '[[[ return !!entity && entity.state === "on"; ]]]'
      laeuft: '[[[ return !!entity && !!entity.attributes.in_progress; ]]]'
      gesperrt: '[[[ return variables.offen && entity.attributes.update_blocked === true; ]]]'
      installierbar: '[[[ return variables.offen && !variables.gesperrt; ]]]'
      akzent: |
        [[[
          if (!entity || entity.state === 'unavailable') return '';
          if (variables.gesperrt) return 'var(--nachtblau-koralle, #e7936e)';
          return variables.offen || variables.laeuft ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-gruen, #a6d49e)';
        ]]]
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    icon: |
      [[[
        if (variables.gesperrt) return 'mdi:lock-outline';
        return variables.offen || variables.laeuft ? 'mdi:package-up' : 'mdi:package-variant-closed-check';
      ]]]
    tap_action:
      action: more-info
    hold_action:
      action: none
    custom_fields:
      titel: |
        [[[
          return `<span style="min-width:0;font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;overflow-wrap:anywhere;">${variables.anzeige}</span>`;
        ]]]
      info: |
        [[[
          const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (!entity || entity.state === 'unavailable') return `<span style="font-size:12px;color:${sek};">keine Daten</span>`;
          const a = entity.attributes;
          const bild = a.title ? a.title + ' · ' : '';
          if (variables.laeuft) return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">${bild}wird installiert …</span>`;
          if (!variables.offen) return `<span style="font-size:12px;color:${sek};">${bild}aktuell · ${a.installed_version || '–'}</span>`;
          if (variables.gesperrt) {
            const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
            return `<span style="font-size:12px;color:var(--nachtblau-koralle, #e7936e);">gesperrt · ${esc(a.blocked_reason || 'von Arcane zurückgehalten')}</span>`;
          }
          return `<span style="font-size:12px;color:${sek};">${bild}${a.installed_version || '?'} → ${a.latest_version || '?'}</span>`;
        ]]]
      install:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          name: '[[[ return variables.laeuft ? "läuft …" : "Installieren"; ]]]'
          show_icon: false
          show_name: true
          show_state: false
          tap_action: |
            [[[
              if (!variables.installierbar || variables.laeuft) return { action: 'none' };
              const frage = variables.frage || (variables.anzeige + ' jetzt aktualisieren? Arcane zieht das neue Image und erstellt den Container neu; er ist dabei kurz nicht erreichbar.');
              return {
                action: 'perform-action',
                perform_action: 'update.install',
                target: { entity_id: entity.entity_id },
                confirmation: { text: frage }
              };
            ]]]
          hold_action:
            action: none
          styles:
            card:
              - min-height: 40px
              - padding: 0 12px
              - border-radius: 12px
              - box-shadow: none
              - background: |
                  [[[ return variables.installierbar ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
              - border: |
                  [[[ return variables.installierbar ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
              - opacity: '[[[ return variables.installierbar ? 1 : 0.4; ]]]'
            name:
              - font-size: 13px
              - font-weight: 700
              - white-space: nowrap
              - color: '[[[ return variables.installierbar ? "var(--nachtblau-amber, #e6b566)" : "var(--nachtblau-label, #b4c0cf)"; ]]]'
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"i titel install" "i info install"'
        - grid-template-columns: 36px minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.akzent || "var(--nachtblau-muted, #6e7988)"; ]]]'
      custom_fields:
        titel:
          - justify-self: stretch
          - align-self: end
          - min-width: 0
          - text-align: left
        # Status in bis zu zwei Zeilen. 12 px mit 5 px Abstand nach oben halten
        # einzeilig die bisherige Lage (der 12-px-Text stand vorher in einer
        # Zeile der Feldschrift von 16,8 px).
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        install:
          - align-self: center

  # ---------------------------------------------------------------------------
  # nachtblau_docker_autoupdate_info: Kopf des Pop-ups "Automatische Updates"
  # (Bubble Card #docker-autoupdates in docker-updates-karte.yaml, ab
  # HA-Arcane 0.9.0). Eine Zeile: "Automatische Updates" links (16 px), rechts
  # die Zaehlung der Schalter switch.container_*_automatisch_aktualisieren
  # ("28 automatisch · 1 aus"), waehrend eines Laufs von Arcanes Updater
  # "Arcane installiert …" in Amber. Das letzte Update und den Grund eines
  # Fehlers zeigt die Zeile "Automatische Updates" in der Karte (Halten
  # oeffnet den Sensor); im Pop-up fehlt dafuer der Platz (Messung dort).
  nachtblau_docker_autoupdate_info:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      titel: >-
        <span style="font-size:16px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Automatische Updates</span>
      summe: |
        [[[
          // Updater irgendeines Hosts ("Updates werden installiert", translation_key updater_running)
          if (Object.values(hass.entities || {}).some((e) => e.platform === 'arcane' && e.translation_key === 'updater_running' && (states[e.entity_id] || {}).state === 'on')) return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">Arcane installiert …</span>`;
          let an = 0, aus = 0;
          for (const id of Object.keys(states)) {
            if (!/^switch\.container_.+_automatisch_aktualisieren$/.test(id)) continue;
            if (states[id].state === 'on') an++;
            else if (states[id].state === 'off') aus++;
          }
          const txt = an + aus === 0 ? 'keine Schalter' : an + ' automatisch · ' + aus + ' aus';
          return `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${txt}</span>`;
        ]]]
    styles:
      # Breiten-Fesseln wie im DWD-Popup (warnlage-templates.yaml): sonst
      # sizet button-card das Grid auf max-content und Text laeuft hinaus.
      card:
        - padding: 0 2px
        - border: none
        - box-shadow: none
        - background: none
        - width: 100%
        - max-width: 100%
        - box-sizing: border-box
        - cursor: default
      grid:
        - grid-template-areas: '"titel summe"'
        - grid-template-columns: minmax(0, 1fr) auto
        - column-gap: 10px
        - align-items: baseline
      custom_fields:
        titel:
          - justify-self: start
          - min-width: 0
          - text-align: left
          - white-space: nowrap
          - overflow: hidden
          - text-overflow: ellipsis
        summe:
          - justify-self: end
          - white-space: nowrap

  # ---------------------------------------------------------------------------
  # nachtblau_docker_autoupdate_chip: ein Container im Pop-up "Automatische
  # Updates". Entity ist switch.container_<x>_automatisch_aktualisieren (ab
  # HA-Arcane 0.9.0, Option "Auto-Update-Schalter"). Antippen schaltet um,
  # ohne Rueckfrage: Der Schalter bearbeitet nur Arcanes Liste der Container,
  # die automatische Updates auslassen; der Container wird nicht angefasst,
  # und Zuruecktippen nimmt es zurueck. Recht: containers:autoupdate.
  #   aufgenommen   gefuellter gruener Punkt, Name in Text-Weiss, fett
  #   ausgenommen   Ring in Sekundaer-Grau, Name in Label-Grau, normal, neutrale
  #                 Flaeche; Zustand also nicht nur ueber die Farbe
  #   nicht verfuegbar  ausgegraut, ohne Aktion
  # Ein Container mit dem Label com.getarcaneapp.arcane.updater=false bleibt
  # bei Arcane ausgenommen; die Integration gibt das nicht als Attribut aus,
  # Einschalten meldet dann einen Fehler mit dem Label.
  # Alle Chips gleich hoch (28 px), Name einzeilig in 12 px: Mit zwei Spalten
  # bleiben im Pop-up 126 px fuer den Namen (360 px breites Handy, iPhone
  # 17 Pro 147 px). Name wie in den Zeilen, ohne "Container " und
  # " Automatisch aktualisieren" ("sonarr-sonarr-1" -> "sonarr"). Ist er
  # laenger als 22 Zeichen und beginnt mit dem Namen seines Compose-Projekts
  # (Geraet, unter dem die Integration den Container einhaengt: "Project
  # <name>"), steht nur der Rest da: "uptimekuma-mariadb-uptime-kuma" ->
  # "uptime-kuma" (gemessen 188 px, sonst kein Name auf docker-01 ueber
  # 126 px; nachgemessen mit geladenem Roboto). Kuerzere Namen bleiben voll,
  # sonst stuende etwa "redis" zweimal da. Passt ein kuenftiger Name auch
  # gekuerzt nicht, endet er mit "…".
  # Container eines entfernten Hosts (HA-Arcane ab 0.11.0, Option
  # "Environment im Geraetenamen"): Host abtrennen, Namen kuerzen, Host wieder
  # voranstellen, "docker-02 dockge-dockge-1" -> "docker-02 dockge".
  # Nachgemessen mit geladenem Roboto (die erste Messung lief unbemerkt mit
  # einer Ersatzschrift): "docker-02 arcane-agent" ist fett 130 px, normal
  # 126 px breit. Auf dem 360 px breiten Handy (126 px) endet er deshalb
  # fett, also mit Auto-Update an, mit "…"; auf dem iPhone (147 px) passt er.
  nachtblau_docker_autoupdate_chip:
    variables:
      anzeige: |
        [[[
          const host = (() => {
            const E = hass.entities || {}, D = hass.devices || {};
            let d = entity && E[entity.entity_id] ? D[E[entity.entity_id].device_id] : null;
            for (let i = 0; d && i < 3; i++) {
              if (d.model === 'Environment' || d.model === 'Arcane Agent') return d.name_by_user || d.name || '';
              d = d.via_device_id ? D[d.via_device_id] : null;
            }
            return '';
          })();
          let n = String((entity && entity.attributes.friendly_name) || '')
            .replace(/ Automatisch aktualisieren$/, '').replace(/^Container /, '');
          let vor = '';
          if (host && n.startsWith(host + ' ')) { vor = host + ' '; n = n.slice(vor.length); }
          n = n.replace(/-\d+$/, '');
          const t = n.split('-');
          if (t.length % 2 === 0) {
            const h = t.length / 2;
            if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
          }
          if (vor) return vor + n;
          if (n.length > 22 && entity) {
            const e = (hass.entities || {})[entity.entity_id];
            const d = e && (hass.devices || {})[e.device_id];
            const v = d && d.via_device_id && (hass.devices || {})[d.via_device_id];
            const p = v ? String(v.name_by_user || v.name || '').replace(/^(Project|Projekt) /, '') : '';
            if (p && n.startsWith(p + '-') && n.length > p.length + 1) n = n.slice(p.length + 1);
          }
          return n;
        ]]]
      an: '[[[ return !!entity && entity.state === "on"; ]]]'
      verfuegbar: '[[[ return !!entity && (entity.state === "on" || entity.state === "off"); ]]]'
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action: |
      [[[ return variables.verfuegbar ? { action: 'toggle' } : { action: 'none' }; ]]]
    hold_action:
      action: none
    custom_fields:
      punkt: |
        [[[
          const stil = variables.an
            ? 'background:var(--nachtblau-gruen, #a6d49e);'
            : 'border:1.5px solid var(--nachtblau-text-sekundaer, #8794a5);';
          return `<span style="display:block;box-sizing:border-box;width:8px;height:8px;border-radius:50%;${stil}"></span>`;
        ]]]
      n: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const farbe = variables.an ? 'var(--nachtblau-text, #f2f5f8)' : 'var(--nachtblau-label, #b4c0cf)';
          return `<span style="font-size:12px;line-height:1.2;font-weight:${variables.an ? 700 : 400};color:${farbe};">${esc(variables.anzeige)}</span>`;
        ]]]
    styles:
      card:
        - height: 28px
        - box-sizing: border-box
        - padding: 0 8px
        - border-radius: 10px
        - box-shadow: none
        - background: |
            [[[ return variables.an ? 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
        - opacity: '[[[ return variables.verfuegbar ? 1 : 0.4; ]]]'
      grid:
        - grid-template-areas: '"punkt n"'
        - grid-template-columns: 8px minmax(0, 1fr)
        - grid-template-rows: 100%
        - column-gap: 7px
        - align-items: center
        - height: 100%
      custom_fields:
        punkt:
          - align-self: center
        n:
          - justify-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: nowrap
          - text-overflow: ellipsis
          - line-height: 1.2
          - text-align: left

  # ---------------------------------------------------------------------------
  # nachtblau_docker_kopf: Kopf einer Karte der Docker-View, wie der Kopf von
  # docker-karte.yaml. variables.farbe ist die Farbe der Icon-Kachel (Bereich
  # Netzwerk: Violett); ein Badge rechts setzt die Karte als custom_fields.badge.
  nachtblau_docker_kopf:
    variables:
      farbe: 'var(--nachtblau-violett, #b399d4)'
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kopf: 306 px auf dem 360 px breiten Handy, 348 px auf dem iPhone 17 Pro.
         Schmal ruecken Icon-Kachel und Badge zusammen 8 px naeher an den Namen;
         so passt "Image-Updates" (113 px) neben "Alle aktualisieren" (127 px). */
      @container (max-width: 327px) {
        #img-cell { margin-right: 10px !important; }
        #badge { margin-left: 4px !important; }
      }
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge" "i l badge"'
        - grid-template-columns: min-content minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: '[[[ return "color-mix(in srgb, " + variables.farbe + " 16%, transparent)"; ]]]'
        - border: '[[[ return "1px solid color-mix(in srgb, " + variables.farbe + " 24%, transparent)"; ]]]'
      icon:
        - width: 23px
        - height: 23px
        - --ha-icon-display: block
        - color: '[[[ return variables.farbe; ]]]'
      name:
        - justify-self: start
        - align-self: end
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
        - text-align: left
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--nachtblau-text, #f2f5f8)'
      label:
        - justify-self: start
        - align-self: start
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
        - text-align: left
        - font-size: 12.5px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        - margin-top: 2px
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
          - margin-left: 8px

  # ---------------------------------------------------------------------------
  # nachtblau_docker_titel: Abschnittstitel innerhalb einer Karte, z. B. "authentik".
  nachtblau_docker_titel:
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 2px 2px 0
      name:
        - justify-self: start
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.06em
        - text-transform: uppercase
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_aufklapper: Kopfzeile einer expander-card ("14 weitere
  # Projekte"), Name links, Zahl als Chip rechts (variables.zahl; leer = kein
  # Chip). Aufbau wie "Alle Container" in docker-karte.yaml; die Unterkachel
  # um die Kopfzeile setzt das card_mod der expander-card.
  nachtblau_docker_aufklapper:
    variables:
      zahl: ''
    show_icon: false
    show_name: true
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    # inline-block: Innenabstand eines Inline-Spans wuerde in der Zelle mit
    # overflow:hidden oben und unten abgeschnitten (wie in docker-karte.yaml)
    custom_fields:
      zahl: |
        [[[
          if (variables.zahl === '' || variables.zahl === null) return '';
          return `<span style="display:inline-block;line-height:1.4;font-size:12px;font-weight:700;color:var(--nachtblau-label, #b4c0cf);background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));padding:3px 9px;border-radius:9px;">${variables.zahl}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 12px 4px 12px 14px
      grid:
        - grid-template-areas: '"n zahl"'
        - grid-template-columns: 1fr min-content
        - align-items: center
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 700
        - color: 'var(--nachtblau-text, #f2f5f8)'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_kpi: Kennzahl-Kachel. Entity ist der Zaehler der Umgebung.
  #   variables.typ   anzahl (Standard) | laufend | ungesund
  #     laufend   zeigt "x/y" mit variables.gesamt; alle laufen Gruen, sonst Amber
  #     anzahl    getoent in variables.warn, sobald der Wert ueber 0 liegt
  #     ungesund  zaehlt selbst: laeuft, _healthy off, kein Healthcheck-Start.
  #               Arcane zaehlt Container im Start ("(health: starting)") als
  #               ungesund, z. B. 29 s nach jedem Update; die Entity bleibt
  #               fuer Antippen und Neuzeichnen.
  #   variables.warn  Farbe ab 1 (Standard Amber); '' = nie getoent
  #   variables.zusatz  Text unter der Beschriftung, z. B. "11 ungenutzt";
  #                   ohne Text entfaellt die Zeile samt Abstand
  # Beschriftung: 0,02em und 7 px Innenabstand, in der Viererreihe auf dem
  # 360 px breiten Handy 5 px (extra_styles, Breiten dort).
  # Auf getoenter Flaeche steht die Beschriftung in Label-Grau (DESIGN.md).
  nachtblau_docker_kpi:
    variables:
      typ: anzahl
      gesamt: ''
      # Summe ueber alle Hosts statt der Entitaet: translation_key des Sensors der
      # Umgebung (containers_running usw., HA-Arcane); summe_gesamt fuer "laufend".
      # Ein nicht verfuegbarer Host zaehlt nicht mit. Antippen oeffnet weiter
      # die Entitaet (docker-01).
      summe: ''
      summe_gesamt: ''
      warn: 'var(--nachtblau-amber, #e6b566)'
      zusatz: ''
      wert: |
        [[[
          const summe = (tk) => {
            let n = null;
            for (const e of Object.values(hass.entities || {})) {
              if (e.platform !== 'arcane' || e.translation_key !== tk) continue;
              const v = parseFloat((states[e.entity_id] || {}).state);
              if (!isNaN(v)) n = (n || 0) + v;
            }
            return n;
          };
          if (variables.typ === 'laufend' && variables.summe) {
            const l = summe(variables.summe), g = summe(variables.summe_gesamt);
            return l === null || g === null ? '–' : l + '/' + g;
          }
          if (variables.typ === 'laufend') {
            const g = states[variables.gesamt];
            if (!entity || isNaN(parseInt(entity.state, 10)) || !g || isNaN(parseInt(g.state, 10))) return '–';
            return entity.state + '/' + g.state;
          }
          if (variables.typ === 'ungesund') {
            let n = 0;
            for (const id of Object.keys(states)) {
              if (!/^binary_sensor\.container_.+_healthy$/.test(id) || states[id].state !== 'off') continue;
              const b = id.slice('binary_sensor.'.length, -'_healthy'.length);
              const z = states['sensor.' + b + '_zustand'];
              const s = states['sensor.' + b + '_status'];
              if (!z || z.state !== 'running') continue;
              if (s && /\(health: starting\)/.test(s.state)) continue;
              n++;
            }
            return String(n);
          }
          if (variables.summe) {
            const n = summe(variables.summe);
            return n === null ? '–' : String(n);
          }
          const n = entity ? parseInt(entity.state, 10) : NaN;
          return isNaN(n) ? '–' : String(n);
        ]]]
      akzent: |
        [[[
          if (variables.wert === '–') return '';
          if (variables.typ === 'laufend') {
            const t = variables.wert.split('/');
            return t[0] === t[1] ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-amber, #e6b566)';
          }
          return parseInt(variables.wert, 10) > 0 ? variables.warn : '';
        ]]]
    label: '[[[ return variables.wert; ]]]'
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kachel in der Viererreihe: 70,5 px auf dem 360 px breiten Handy, 81 px auf
         dem iPhone 17 Pro. "UNGESUND" braucht 57 px; mit 7 px Innenabstand blieben
         auf dem S25 54,5 px, mit 5 px sind es 58,5 px. */
      @container (max-width: 76px) {
        ha-card { padding-left: 5px !important; padding-right: 5px !important; }
      }
    show_icon: false
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      zusatz: |
        [[[
          return variables.zusatz ? `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${variables.zusatz}</span>` : '';
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 10px 7px
        - box-shadow: none
        - background: |
            [[[ return variables.akzent ? 'color-mix(in srgb, ' + variables.akzent + ' 12%, transparent)' : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
        - border: |
            [[[ return variables.akzent ? '1px solid color-mix(in srgb, ' + variables.akzent + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      grid:
        - grid-template-areas: '[[[ return variables.zusatz ? "\"l\" \"n\" \"zusatz\"" : "\"l\" \"n\""; ]]]'
        - grid-template-columns: 1fr
        - grid-template-rows: '[[[ return variables.zusatz ? "min-content min-content min-content" : "min-content min-content"; ]]]'
        - row-gap: 3px
      custom_fields:
        zusatz:
          - display: '[[[ return variables.zusatz ? "block" : "none"; ]]]'
          - justify-self: start
          - text-align: left
          - max-width: 100%
          - overflow: hidden
          - white-space: nowrap
          - text-overflow: ellipsis
      label:
        - justify-self: start
        - font-size: 20px
        - font-weight: 750
        - letter-spacing: -0.02em
        - color: '[[[ return variables.akzent || "var(--nachtblau-text-sekundaer, #8794a5)"; ]]]'
      name:
        - justify-self: start
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.02em
        - text-transform: uppercase
        - color: '[[[ return variables.akzent ? "var(--nachtblau-label, #b4c0cf)" : "var(--nachtblau-text-sekundaer, #8794a5)"; ]]]'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_messwert: Prozentwert mit Balken (Host-CPU, -RAM, -Disk).
  # Entity ist ein Sensor in %. Farbe nach Schwelle wie in system-karte.yaml:
  # ab variables.gelb Amber, ab variables.rot Rot, sonst Gruen.
  #   variables.zusatz  Text unter der Beschriftung, z. B. "5,1 von 8,3 GB"
  #   variables.belegt, variables.gesamt  statt zusatz: translation_key der
  #                     Sensoren desselben Geraets (host_memory_used,
  #                     host_memory_total, host_disk_used); ergibt "5,1 von
  #                     8,3 GB" bzw. "38,1 GB belegt" (Pop-up der Karte Hosts)
  nachtblau_docker_messwert:
    variables:
      gelb: 75
      rot: 90
      zusatz: ''
      belegt: ''
      gesamt: ''
      wert: |
        [[[
          const v = entity ? parseFloat(entity.state) : NaN;
          return isNaN(v) ? null : v;
        ]]]
      farbe: |
        [[[
          const v = variables.wert;
          if (v === null) return 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (v >= variables.rot) return 'var(--nachtblau-rot, #f0736a)';
          if (v >= variables.gelb) return 'var(--nachtblau-amber, #e6b566)';
          return 'var(--nachtblau-gruen, #a6d49e)';
        ]]]
    label: '[[[ return variables.wert === null ? "–" : variables.wert.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %"; ]]]'
    extra_styles: |
      :host { container-type: inline-size; }
      /* Kachel in der Dreierreihe: 96,7 px auf dem 360 px breiten Handy, 110,7 px
         auf dem iPhone 17 Pro. "38,1 GB belegt" braucht 77,2 px; mit 11 px
         Innenabstand blieben auf dem S25 72,7 px, mit 8 px sind es 78,7 px. */
      @container (max-width: 103px) {
        ha-card { padding-left: 8px !important; padding-right: 8px !important; }
      }
    show_icon: false
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      balken: |
        [[[
          const p = variables.wert === null ? 0 : Math.max(0, Math.min(100, variables.wert));
          return `<div style="height:6px;border-radius:3px;background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));overflow:hidden;"><div style="height:100%;width:${p}%;border-radius:3px;background:${variables.farbe};"></div></div>`;
        ]]]
      zusatz: |
        [[[
          let z = variables.zusatz;
          if (!z && variables.belegt && entity) {
            const E = hass.entities || {}, reg = E[entity.entity_id];
            const wert = (tk) => {
              for (const e of Object.values(E)) {
                if (!reg || e.device_id !== reg.device_id || e.platform !== 'arcane' || e.translation_key !== tk) continue;
                const v = parseFloat((states[e.entity_id] || {}).state);
                return isNaN(v) ? null : v.toLocaleString('de-DE', { maximumFractionDigits: 1 });
              }
              return null;
            };
            const b = wert(variables.belegt), g = variables.gesamt ? wert(variables.gesamt) : null;
            z = b && g ? b + ' von ' + g + ' GB' : (b ? b + ' GB belegt' : '');
          }
          return z ? `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${z}</span>` : '';
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 10px 11px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"l" "balken" "n" "zusatz"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content min-content min-content
        - row-gap: 6px
      label:
        - justify-self: start
        - font-size: 20px
        - font-weight: 750
        - letter-spacing: -0.02em
        - color: '[[[ return variables.farbe; ]]]'
      name:
        - justify-self: start
        - font-size: 10.5px
        - font-weight: 700
        - letter-spacing: 0.02em
        - text-transform: uppercase
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
      custom_fields:
        balken:
          - justify-self: stretch
        zusatz:
          - justify-self: start
          - text-align: left
          - max-width: 100%
          - overflow: hidden
          - white-space: nowrap
          - text-overflow: ellipsis

  # ---------------------------------------------------------------------------
  # nachtblau_docker_host: eine Zeile je Host (Umgebung) der Karte Hosts
  # (docker-hosts-karte.yaml, HA-Arcane ab 0.11.0). Entity ist der
  # Binaersensor "Online" der Umgebung; alle uebrigen Werte kommen von den
  # Sensoren desselben Geraets (translation_key), weil die Entity-IDs je Host
  # anders anfangen (local_docker_*, docker_host_*, docker_02_*).
  #   Titel   Name des Hosts (Geraet der Umgebung)
  #   Info    lokal: "lokal · Arcane v3.0.1"; Agent: "Agent 3.0.1 · 0,3 ms";
  #           getrennt: "letzter Kontakt 13:31"
  #   Werte   Container laufend/gesamt, CPU, RAM, Disk; Farben nach den
  #           Schwellen der Host-Messwerte (CPU 40/75 %, RAM und Disk 75/90 %)
  #   Pille   online (Gruen), offline (Rot, Agent getrennt), pruefen (Amber,
  #           Entitaet nicht verfuegbar)
  # Antippen oeffnet das Pop-up des Hosts (#docker-host-<object_id>).
  nachtblau_docker_host:
    variables:
      sib: |
        [[[
          // Sensoren desselben Geraets (der Umgebung) nach translation_key
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          const m = {};
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.platform === 'arcane' && e.translation_key && !(e.translation_key in m)) m[e.translation_key] = states[e.entity_id] || null;
          }
          return m;
        ]]]
      geraet: |
        [[[
          const E = hass.entities || {}, D = hass.devices || {};
          const reg = entity ? E[entity.entity_id] : null;
          const d = reg ? D[reg.device_id] : null;
          return { name: d ? (d.name_by_user || d.name || '') : '', agent: !!d && d.model === 'Arcane Agent', version: d ? (d.sw_version || '') : '' };
        ]]]
      zustand: '[[[ return !entity || ["unavailable", "unknown"].includes(entity.state) ? "nv" : (entity.state === "on" ? "an" : "aus"); ]]]'
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    icon: mdi:server
    tap_action: |
      [[[ return entity ? { action: 'navigate', navigation_path: '#docker-host-' + entity.entity_id.split('.')[1] } : { action: 'none' }; ]]]
    hold_action:
      action: more-info
    custom_fields:
      titel: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          return `<span style="font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">${esc(variables.geraet.name || 'Host')}</span>`;
        ]]]
      info: |
        [[[
          const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
          const g = variables.geraet, s = variables.sib;
          const ganz = (t) => `<span style="white-space:nowrap;">${t}</span>`;
          let t;
          if (variables.zustand !== 'an' && g.agent) {
            const k = s.agent_last_contact ? new Date(s.agent_last_contact.state) : null;
            t = k && !isNaN(k.getTime()) ? 'letzter Kontakt ' + k.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'nicht erreichbar';
          } else if (g.agent) {
            const l = s.agent_latency ? parseFloat(s.agent_latency.state) : NaN;
            t = ganz('Agent ' + (g.version || '?')) + (isNaN(l) ? '' : ' ' + ganz('· ' + l.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' ms'));
          } else {
            t = ganz('lokal') + ' ' + ganz('· Arcane ' + (g.version || '?'));
          }
          return `<span style="font-size:12px;color:${sek};">${t}</span>`;
        ]]]
      werte: |
        [[[
          if (variables.zustand !== 'an') return '';
          const s = variables.sib;
          const z = (k) => { const v = s[k] ? parseFloat(s[k].state) : NaN; return isNaN(v) ? null : v; };
          const farbe = (v, gelb, rot) => v === null ? 'var(--nachtblau-label, #b4c0cf)' : (v >= rot ? 'var(--nachtblau-rot, #f0736a)' : (v >= gelb ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-label, #b4c0cf)'));
          const zahl = (v) => v === null ? '–' : v.toLocaleString('de-DE', { maximumFractionDigits: v < 10 ? 1 : 0 });
          const teil = (n, v, gelb, rot, einheit) => `<span style="white-space:nowrap;">${n} <b style="font-weight:700;color:${farbe(v, gelb, rot)};">${zahl(v)}${einheit}</b></span>`;
          const l = z('containers_running'), ges = z('containers_total');
          const lauf = `<span style="white-space:nowrap;"><b style="font-weight:700;color:${l !== null && l === ges ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-amber, #e6b566)'};">${zahl(l)}/${zahl(ges)}</b> laufen</span>`;
          return `<span style="display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--nachtblau-text-sekundaer, #8794a5);font-variant-numeric:tabular-nums;">${lauf}${teil('CPU', z('host_cpu'), 40, 75, ' %')}${teil('RAM', z('host_memory_percent'), 75, 90, ' %')}${teil('Disk', z('host_disk_percent'), 75, 90, ' %')}</span>`;
        ]]]
      pille: |
        [[[
          const t = { an: ['online', 'var(--nachtblau-gruen, #a6d49e)'], aus: ['offline', 'var(--nachtblau-rot, #f0736a)'], nv: ['prüfen', 'var(--nachtblau-amber, #e6b566)'] }[variables.zustand];
          return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:11px;white-space:nowrap;color:${t[1]};background:color-mix(in srgb, ${t[1]} 12%, transparent);border:1px solid color-mix(in srgb, ${t[1]} 24%, transparent);"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>${t[0]}</span>`;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 9px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"i titel pille" "i info pille" "werte werte werte"'
        - grid-template-columns: 36px minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        - background: |
            [[[
              const c = { an: 'var(--nachtblau-gruen, #a6d49e)', aus: 'var(--nachtblau-rot, #f0736a)', nv: 'var(--nachtblau-amber, #e6b566)' }[variables.zustand];
              return 'color-mix(in srgb, ' + c + ' 16%, transparent)';
            ]]]
        - border: |
            [[[
              const c = { an: 'var(--nachtblau-gruen, #a6d49e)', aus: 'var(--nachtblau-rot, #f0736a)', nv: 'var(--nachtblau-amber, #e6b566)' }[variables.zustand];
              return '1px solid color-mix(in srgb, ' + c + ' 24%, transparent)';
            ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: |
            [[[ return { an: 'var(--nachtblau-gruen, #a6d49e)', aus: 'var(--nachtblau-rot, #f0736a)', nv: 'var(--nachtblau-amber, #e6b566)' }[variables.zustand]; ]]]
      custom_fields:
        titel:
          - justify-self: start
          - align-self: end
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-align: left
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - text-align: left
        werte:
          - justify-self: start
          - min-width: 0
          - max-width: 100%
          - margin-top: '[[[ return variables.zustand === "an" ? "6px" : "0"; ]]]'
          - text-align: left
        pille:
          - align-self: center

  # ---------------------------------------------------------------------------
  # nachtblau_docker_host_info: Kopf des Host-Pop-ups (docker-hosts-karte.yaml).
  # Entity ist der Binaersensor "Online" der Umgebung. Name, Pille mit
  # "online seit 11:08" (Agent verbunden seit), darunter Systemdaten: bei
  # einem Agenten aus den Attributen von "Online" (HA-Arcane ab 0.11.0:
  # Betriebssystem, Kernel, CPUs, Arbeitsspeicher, Architektur, Transport,
  # Sicherheitsmodus, Docker-Version) und dem letzten Kontakt mit Latenz; beim
  # lokalen Host Docker- und Arcane-Version. Ein Update von Arcane bzw. dem
  # Agenten steht in Amber ("· Update auf v3.1.0"); installiert wird es in der
  # Karte Image-Updates, Abschnitt Arcane.
  # Darunter, wie eine Zeile der Systemdaten, "Ports  26 belegt  ›" aus dem
  # Sensor "Belegte Host-Ports" desselben Geraets (HA-Arcane ab 0.12.0,
  # Option "Veroeffentlichte Ports", translation_key host_ports). Die Zeile ist
  # eine eingebettete button-card: Antippen oeffnet das Pop-up "Ports" des
  # Hosts (#docker-ports-<Objekt-ID von "Online">, nachtblau_docker_ports).
  # 4 px Polster oben und unten vergroessern die Tippflaeche; oben ergibt das
  # denselben Abstand wie zwischen den Zeilen darueber. Ohne die Option fehlt
  # die Zeile.
  nachtblau_docker_host_info:
    variables:
      sib: |
        [[[
          // Sensoren desselben Geraets (der Umgebung) nach translation_key
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          const m = {};
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.platform === 'arcane' && e.translation_key && !(e.translation_key in m)) m[e.translation_key] = states[e.entity_id] || null;
          }
          return m;
        ]]]
      geraet: |
        [[[
          const E = hass.entities || {}, D = hass.devices || {};
          const reg = entity ? E[entity.entity_id] : null;
          const d = reg ? D[reg.device_id] : null;
          return { name: d ? (d.name_by_user || d.name || '') : '', agent: !!d && d.model === 'Arcane Agent', version: d ? (d.sw_version || '') : '' };
        ]]]
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: more-info
    custom_fields:
      kopf: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const z = !entity || ['unavailable', 'unknown'].includes(entity.state) ? 'nv' : (entity.state === 'on' ? 'an' : 'aus');
          const s = variables.sib;
          let txt = { an: 'online', aus: 'offline', nv: 'prüfen' }[z];
          const seit = s.agent_connected_since ? new Date(s.agent_connected_since.state) : null;
          if (z === 'an' && seit && !isNaN(seit.getTime())) txt += ' seit ' + seit.toLocaleString('de-DE', { hour: '2-digit', minute: '2-digit' });
          const c = { an: 'var(--nachtblau-gruen, #a6d49e)', aus: 'var(--nachtblau-rot, #f0736a)', nv: 'var(--nachtblau-amber, #e6b566)' }[z];
          return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><span style="min-width:0;font-size:18px;font-weight:700;letter-spacing:-0.02em;color:var(--nachtblau-text, #f2f5f8);overflow-wrap:anywhere;">${esc(variables.geraet.name || 'Host')}</span><span style="flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:11px;white-space:nowrap;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>${txt}</span></div>`;
        ]]]
      daten: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const a = entity ? entity.attributes : {}, s = variables.sib, g = variables.geraet;
          // Update von Arcane bzw. dem Agenten: Update-Entitaet desselben Geraets
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          let upd = null;
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.entity_id.startsWith('update.') && states[e.entity_id]) { upd = states[e.entity_id]; break; }
          }
          const neu = upd && upd.state === 'on' ? ' · Update auf ' + (upd.attributes.latest_version || '?') : '';
          const zeilen = [];
          if (g.agent) {
            const sys = [a.os, a.kernel_version].filter(Boolean).join(' · ');
            if (sys) zeilen.push(['System', sys]);
            const hw = [];
            if (a.cpus) hw.push(a.cpus + ' CPUs');
            if (a.memory_bytes) hw.push((a.memory_bytes / 1e9).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' GB RAM');
            if (a.architecture) hw.push(a.architecture);
            if (hw.length) zeilen.push(['Hardware', hw.join(' · ')]);
            zeilen.push(['Agent', ([g.version, a.transport, a.security_mode].filter(Boolean).join(' · ') || '–') + neu]);
            const k = s.agent_last_contact ? new Date(s.agent_last_contact.state) : null;
            const l = s.agent_latency ? parseFloat(s.agent_latency.state) : NaN;
            const kt = k && !isNaN(k.getTime()) ? k.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
            zeilen.push(['Kontakt', kt + (isNaN(l) ? '' : ' · ' + l.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' ms')]);
            if (a.docker_version) zeilen.push(['Docker', a.docker_version]);
          } else {
            const d = s.docker_version;
            zeilen.push(['Docker', d && !['unavailable', 'unknown'].includes(d.state) ? d.state : '–']);
            zeilen.push(['Arcane', (g.version || '–') + neu]);
          }
          const kv = zeilen.map(([k, v]) => {
            const f = neu && v.endsWith(neu) ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text, #f2f5f8)';
            return `<span style="color:var(--nachtblau-text-sekundaer, #8794a5);">${k}</span><span style="color:${f};overflow-wrap:anywhere;">${esc(v)}</span>`;
          }).join('');
          return `<div style="display:grid;grid-template-columns:76px minmax(0, 1fr);gap:4px 10px;font-size:12.5px;line-height:1.35;text-align:left;">${kv}</div>`;
        ]]]
      ports:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          show_label: false
          tap_action: |
            [[[
              const s = variables.sib.host_ports;
              if (!s || !entity || ['unavailable', 'unknown'].includes(s.state)) return { action: 'none' };
              return { action: 'navigate', navigation_path: '#docker-ports-' + entity.entity_id.split('.')[1] };
            ]]]
          hold_action:
            action: none
          custom_fields:
            l: >-
              <span style="font-size:12.5px;line-height:1.35;color:var(--nachtblau-text-sekundaer, #8794a5);">Ports</span>
            v: |
              [[[
                const s = variables.sib.host_ports;
                const n = s ? parseInt(s.state, 10) : NaN;
                const txt = isNaN(n) ? 'nicht verfügbar' : (n === 0 ? 'keine belegt' : n + ' belegt');
                return `<span style="font-size:12.5px;line-height:1.35;color:var(--nachtblau-text, #f2f5f8);">${txt}</span>`;
              ]]]
            pf: |
              [[[
                const s = variables.sib.host_ports;
                if (!s || ['unavailable', 'unknown'].includes(s.state)) return '';
                return `<span style="font-size:16px;line-height:1;color:var(--nachtblau-text-sekundaer, #8794a5);">›</span>`;
              ]]]
          styles:
            card:
              - padding: 4px 0
              - border: none
              - border-radius: 6px
              - box-shadow: none
              - background: none
              - width: 100%
              - box-sizing: border-box
            grid:
              - grid-template-areas: '"l v pf"'
              - grid-template-columns: 76px minmax(0, 1fr) auto
              - column-gap: 10px
              - align-items: center
            custom_fields:
              l:
                - justify-self: start
              v:
                - justify-self: start
                - min-width: 0
                - text-align: left
              pf:
                - justify-self: end
    styles:
      card:
        - padding: 0 2px
        - border: none
        - box-shadow: none
        - background: none
        - width: 100%
        - max-width: 100%
        - box-sizing: border-box
        - cursor: default
      grid:
        - grid-template-areas: |
            [[[ return variables.sib.host_ports ? '"kopf" "daten" "ports"' : '"kopf" "daten"'; ]]]
        - grid-template-columns: minmax(0, 1fr)
        - row-gap: 0
      custom_fields:
        kopf:
          - justify-self: stretch
          - min-width: 0
          - margin-bottom: 10px
        daten:
          - justify-self: stretch
          - min-width: 0
          - white-space: normal
        ports:
          - justify-self: stretch
          - min-width: 0
          - display: '[[[ return variables.sib.host_ports ? "block" : "none"; ]]]'

  # ---------------------------------------------------------------------------
  # nachtblau_docker_ports: Inhalt des Pop-ups "Ports" eines Hosts
  # (#docker-ports-<Objekt-ID von "Online">, erzeugt in docker-hosts-karte.yaml;
  # geoeffnet ueber die Zeile "Ports" im Host-Pop-up). Entity ist der Sensor
  # "Belegte Host-Ports" der Umgebung (HA-Arcane ab 0.12.0, Option
  # "Veroeffentlichte Ports", translation_key host_ports); gelesen wird nur
  # sein Attribut ports (host_port, protocol, host_ip, container,
  # container_port). Ob ein Port an eine Adresse gebunden ist, zeigt die Karte
  # bewusst nicht.
  #   Kopf    "Ports · docker-01" links (16 px), rechts "26 belegt · alle TCP"
  #           bzw. "· 2 UDP"
  #   Chips   zwei Spalten, nach Port sortiert, je Chip der Host-Port (fett,
  #           UDP mit "/udp") und der Container. Chips 28 px hoch, 3 px
  #           zwischen den Reihen, 6 px zwischen den Spalten, wie im Pop-up
  #           "Automatische Updates"; ohne Aktion.
  # Name wie in den Container-Zeilen ohne Compose-Anhaengsel
  # ("sonarr-sonarr-1" -> "sonarr"). Ist er dann laenger als 17 Zeichen und
  # beginnt mit dem Namen seines Compose-Projekts (Geraet "Container <name>"
  # bzw. "Container <host> <name>", eingehaengt unter "Project <name>"), steht
  # nur der Rest da: "gethomepage-homepage" -> "homepage",
  # "uptimekuma-mariadb-uptime-kuma" -> "uptime-kuma". Gemessen im Nachbau
  # mit Roboto (als data-URL eingebettet und als geladen geprueft): Neben
  # einem bis zu vierstelligen Port bleiben fuer den Namen 106,5 px (360 px
  # breites Handy) bzw. 127,5 px (iPhone 17 Pro). Der breiteste Name mit
  # hoechstens 17 Zeichen in der Instanz, "nginxproxymanager", braucht
  # 105,3 px; "gethomepage-homepage" (20 Zeichen) braeuchte 133,8 px. Ein
  # kuenftiger Name, der trotzdem nicht passt, endet mit "…". Die Port-Spalte
  # ist mindestens 4ch breit (Ziffern in tabular-nums), damit die Namen bis zu
  # vierstelligen Ports buendig stehen. Hoehe des Pop-ups: docker-01 mit 26
  # Ports (13 Reihen) 429 px, docker-02 mit 4 Ports 88 px; Platz 539 px
  # (siehe Pop-up "Automatische Updates"). Ab dem 33. Port (17 Reihen)
  # scrollt das Blatt auf dem 360 px breiten Handy.
  nachtblau_docker_ports:
    variables:
      host: |
        [[[
          const E = hass.entities || {}, D = hass.devices || {};
          const reg = entity ? E[entity.entity_id] : null;
          const d = reg ? D[reg.device_id] : null;
          return d ? (d.name_by_user || d.name || '') : '';
        ]]]
      liste: |
        [[[
          const a = entity && Array.isArray(entity.attributes.ports) ? entity.attributes.ports : [];
          return a.filter((p) => p && p.host_port != null)
            .slice().sort((x, y) => (Number(x.host_port) - Number(y.host_port)) || String(x.protocol).localeCompare(String(y.protocol)));
        ]]]
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: more-info
    custom_fields:
      titel: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          return `<span style="font-size:16px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Ports${variables.host ? ' · ' + esc(variables.host) : ''}</span>`;
        ]]]
      summe: |
        [[[
          const l = variables.liste;
          let txt;
          if (!entity || ['unavailable', 'unknown'].includes(entity.state)) txt = 'nicht verfügbar';
          else if (!l.length) txt = 'keine belegt';
          else {
            const udp = l.filter((p) => String(p.protocol).toLowerCase() === 'udp').length;
            txt = l.length + ' belegt · ' + (udp ? udp + ' UDP' : 'alle TCP');
          }
          return `<span style="font-size:12px;color:var(--nachtblau-text-sekundaer, #8794a5);">${txt}</span>`;
        ]]]
      chips: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const l = variables.liste;
          const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (!entity || ['unavailable', 'unknown'].includes(entity.state)) return '';
          if (!l.length) return `<span style="font-size:12px;color:${sek};">Kein Container veröffentlicht einen Port.</span>`;
          // Geraete der Container nach Namen, fuer das Compose-Projekt
          const D = hass.devices || {}, geraete = {};
          for (const d of Object.values(D)) if (d.model === 'Container') geraete[d.name] = d;
          const kurz = (c) => {
            let n = String(c || '?').replace(/-\d+$/, '');
            const t = n.split('-');
            if (t.length % 2 === 0) {
              const h = t.length / 2;
              if (t.slice(0, h).join('-') === t.slice(h).join('-')) n = t.slice(0, h).join('-');
            }
            if (n.length > 17) {
              const d = geraete['Container ' + variables.host + ' ' + c] || geraete['Container ' + c];
              const v = d && d.via_device_id ? D[d.via_device_id] : null;
              const p = v ? String(v.name || '').replace(/^(Project|Projekt) /, '') : '';
              if (p && n.startsWith(p + '-') && n.length > p.length + 1) n = n.slice(p.length + 1);
            }
            return n;
          };
          const chip = (p) => {
            const udp = String(p.protocol).toLowerCase() === 'udp' ? `<span style="font-weight:400;color:${sek};">/udp</span>` : '';
            return `<div style="box-sizing:border-box;height:28px;padding:0 8px;border-radius:10px;background:var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));display:grid;grid-template-columns:minmax(4ch, auto) minmax(0, 1fr);column-gap:7px;align-items:center;font-size:12px;font-weight:700;line-height:1.2;">`
              + `<span style="font-variant-numeric:tabular-nums;color:var(--nachtblau-text, #f2f5f8);white-space:nowrap;">${esc(p.host_port)}${udp}</span>`
              + `<span style="min-width:0;font-weight:400;color:var(--nachtblau-label, #b4c0cf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;">${esc(kurz(p.container))}</span></div>`;
          };
          return `<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:3px 6px;">${l.map(chip).join('')}</div>`;
        ]]]
    styles:
      # Breiten-Fesseln wie im Pop-up "Automatische Updates". Ohne Polster an
      # der Karte, damit die Chips die volle Breite des Pop-ups haben (wie
      # dort die grid-Karte); Titel und Zahl ruecken 2 px ein wie dort.
      card:
        - padding: 0
        - border: none
        - box-shadow: none
        - background: none
        - width: 100%
        - max-width: 100%
        - box-sizing: border-box
        - cursor: default
      grid:
        - grid-template-areas: '"titel summe" "chips chips"'
        - grid-template-columns: minmax(0, 1fr) auto
        - column-gap: 10px
        - row-gap: 10px
        - align-items: baseline
      custom_fields:
        titel:
          - justify-self: start
          - min-width: 0
          - padding-left: 2px
          - text-align: left
          - white-space: nowrap
          - overflow: hidden
          - text-overflow: ellipsis
        summe:
          - justify-self: end
          - padding-right: 2px
          - white-space: nowrap
        chips:
          - justify-self: stretch
          - min-width: 0
          - text-align: left

  # ---------------------------------------------------------------------------
  # nachtblau_docker_host_jobs: Arcanes Hintergrund-Jobs eines Hosts im Pop-up
  # (HA-Arcane ab 0.10.0, Option "Arcane Hintergrund-Jobs"). Entity ist der
  # Binaersensor "Online"; die Jobs sind die Sensoren desselben Geraets mit
  # translation_key job. Einzeln stehen Auto Update, Image Update Watcher
  # (job_id image-polling), Vulnerability Scan und Scheduled Prune (Attribut
  # job_id), mit Ergebnis als
  # Punkt (Gruen erfolgreich, Amber teilweise oder uebersprungen, Rot
  # fehlgeschlagen, Ring ausgeschaltet) und rechts "laeuft", "aus" oder dem
  # naechsten Lauf. Die uebrigen Jobs (Wartung) fasst eine Zeile zusammen.
  # Fehler und ausbleibende Laeufe meldet ausserdem die Automation "Docker:
  # Auto-Update fehlgeschlagen melden" (docker-konfig.yaml).
  nachtblau_docker_host_jobs:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      jobs: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          const jobs = [];
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.platform === 'arcane' && e.translation_key === 'job' && states[e.entity_id]) jobs.push(states[e.entity_id]);
          }
          const SEK = 'var(--nachtblau-text-sekundaer, #8794a5)';
          const titel = `<div style="font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${SEK};padding:0 2px 4px;">Hintergrund-Jobs</div>`;
          if (!jobs.length) return titel + `<div style="font-size:12.5px;color:${SEK};">keine (Option „Arcane Hintergrund-Jobs“)</div>`;
          const WICHTIG = ['auto-update', 'image-polling', 'vulnerability-scan', 'scheduled-prune'];
          const farbe = (j) => {
            const st = j.state;
            if (st === 'failed') return 'var(--nachtblau-rot, #f0736a)';
            if (st === 'partial' || st === 'skipped' || st === 'canceled') return 'var(--nachtblau-amber, #e6b566)';
            if (st === 'succeeded') return 'var(--nachtblau-gruen, #a6d49e)';
            return '';
          };
          const rechts = (j) => {
            const a = j.attributes;
            if (a.running) return 'läuft';
            if (a.enabled === false) return 'aus';
            const n = a.next_run ? new Date(a.next_run) : null;
            if (n && !isNaN(n.getTime())) {
              const heute = new Date().toDateString() === n.toDateString();
              return 'nächster ' + (heute ? '' : n.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ') + n.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            }
            return { succeeded: 'erfolgreich', partial: 'teilweise', skipped: 'übersprungen', failed: 'fehlgeschlagen', canceled: 'abgebrochen' }[j.state] || '–';
          };
          const name = (j) => String(j.attributes.friendly_name || '').replace(/^.* Job /, '');
          const zeile = (j) => {
            const f = farbe(j), aus = j.attributes.enabled === false;
            const punkt = aus || !f ? `border:1.5px solid ${SEK};` : `background:${f};`;
            return `<div style="display:grid;grid-template-columns:8px minmax(0, 1fr) auto;gap:8px;align-items:center;padding:5px 2px;font-size:12.5px;"><span style="width:8px;height:8px;border-radius:50%;box-sizing:border-box;${punkt}"></span><span style="color:var(--nachtblau-text, #f2f5f8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(name(j))}</span><span style="color:${j.state === 'failed' ? 'var(--nachtblau-rot, #f0736a)' : SEK};white-space:nowrap;font-variant-numeric:tabular-nums;">${rechts(j)}</span></div>`;
          };
          const wichtig = WICHTIG.map((id) => jobs.find((j) => j.attributes.job_id === id)).filter(Boolean);
          const rest = jobs.filter((j) => !WICHTIG.includes(j.attributes.job_id));
          const fehler = rest.filter((j) => j.state === 'failed').length;
          let h = titel + wichtig.map(zeile).join('');
          if (rest.length) h += `<div style="padding:5px 2px 0;font-size:12px;color:${fehler ? 'var(--nachtblau-rot, #f0736a)' : SEK};">+ ${rest.length} Wartungs-Jobs · ${fehler ? fehler + ' fehlgeschlagen' : 'ohne Fehler'}</div>`;
          return h;
        ]]]
    styles:
      card:
        - padding: 0
        - border: none
        - box-shadow: none
        - background: none
        - width: 100%
        - max-width: 100%
        - box-sizing: border-box
        - cursor: default
      grid:
        - grid-template-areas: '"jobs"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        jobs:
          - justify-self: stretch
          - min-width: 0
          - white-space: normal
          - text-align: left

  # ---------------------------------------------------------------------------
  # nachtblau_docker_speicher_frei: freigebbarer Speicher eines Hosts in der
  # Karte Speicher & Aufraeumen (docker-speicher-karte.yaml). Entity ist sein
  # Sensor "Freigebbarer Image-Speicher" (HA-Arcane ab 0.7.0, Option
  # "Freigebbarer Speicher"), ohne die Option der Binaersensor "Online". Alle
  # Werte kommen von den Sensoren desselben Geraets (translation_key), weil
  # die Entity-IDs je Host anders anfangen.
  #   Kopf     Host und Disk-Belegung links, freigebbar von Image-Speicher
  #            rechts
  #   Balken   Image-Speicher, davon freigebbar (Amber); waehrend dieser Host
  #            aufraeumt, zieht eine Spur in Amber darueber
  #   Zeile    Images, Build-Cache, Volumes (bleiben); nach dem Aufraeumen bis
  #            zum naechsten Bericht "Stand vor dem Aufraeumen" (erkannt an
  #            report_started_at, HA-Arcane ab 0.7.1)
  # "Laeuft" heisst: script.docker_aufraeumen ist an und der Status-Helfer
  # dieses Hosts steht auf aufraeumen oder bericht (docker-konfig.yaml). Den
  # Helfer bildet das Template aus dem Prune-Button: button.docker_02_
  # ungenutztes_entfernen -> input_text.docker_02_aufraeumen_status.
  nachtblau_docker_speicher_frei:
    variables:
      sib: |
        [[[
          // Entitaeten desselben Geraets (der Umgebung) nach translation_key
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          const m = {};
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.platform === 'arcane' && e.translation_key && !(e.translation_key in m)) m[e.translation_key] = states[e.entity_id] || null;
          }
          return m;
        ]]]
      host: |
        [[[
          const E = hass.entities || {}, D = hass.devices || {};
          const reg = entity ? E[entity.entity_id] : null;
          const d = reg ? D[reg.device_id] : null;
          return d ? (d.name_by_user || d.name || '') : '';
        ]]]
      laeuft: |
        [[[
          const k = variables.sib.prune;
          if (!k) return false;
          const h = states['input_text.' + k.entity_id.split('.')[1].replace(/_ungenutztes_entfernen$/, '') + '_aufraeumen_status'];
          const sk = states['script.docker_aufraeumen'];
          return !!h && !!sk && sk.state === 'on' && /^(aufraeumen|bericht);/.test(h.state);
        ]]]
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    # Laufspur: Amber in der Stufe "Leuchten" (0,5), 35 % der Balkenbreite,
    # 1,6 s je Durchlauf; die Abschnitte darunter stehen solange auf 45 %,
    # sonst ist die Spur auf dem blauen Teil kaum zu sehen (Nachbau).
    # "Bewegung reduzieren" zeigt stattdessen den ganzen Balken in Amber,
    # Stufe "Rand" (0,24).
    extra_styles: |
      .nb-lauf { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--nachtblau-amber, #e6b566) 50%, transparent), transparent); animation: nb-lauf 1.6s linear infinite; }
      @keyframes nb-lauf { from { transform: translateX(-100%); } to { transform: translateX(286%); } }
      @media (prefers-reduced-motion: reduce) { .nb-lauf { animation: none; width: 100%; background: color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent); } }
    custom_fields:
      balken: |
        [[[
          const SEK = 'var(--nachtblau-text-sekundaer, #8794a5)', TEXT = 'var(--nachtblau-text, #f2f5f8)';
          const BLAU = 'var(--nachtblau-blau, #7fb3d5)', AMBER = 'var(--nachtblau-amber, #e6b566)';
          const esc = (s) => String(s).replace(/[&<>"]/g, (z) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
          const s = variables.sib;
          const zahl = (k) => { const v = s[k] ? parseFloat(s[k].state) : NaN; return isNaN(v) ? null : v; };
          const gb = (v) => v < 1
            ? Math.round(v * 1000).toLocaleString('de-DE') + ' MB'
            : v.toLocaleString('de-DE', { maximumFractionDigits: v < 10 ? 2 : 1 }) + ' GB';
          const zeile = (t) => `<div style="font-size:12px;color:${SEK};line-height:1.3;text-wrap:balance;">${t}</div>`;
          // Jeder Teil bleibt samt folgendem Trenner zusammen; umgebrochen wird
          // nur nach einem "·".
          const stuecke = (t) => t.map((x, i) => `<span style="white-space:nowrap;">${x}${i < t.length - 1 ? ' ·' : ''}</span>`).join(' ');
          const disk = zahl('host_disk_percent');
          const links = `<span style="min-width:0;"><b style="font-size:13px;color:${TEXT};">${esc(variables.host || 'Host')}</b>`
            + (disk === null ? '' : ` <span style="white-space:nowrap;">· Disk ${disk.toLocaleString('de-DE', { maximumFractionDigits: 1 })} %</span>`) + `</span>`;
          const fs = s.reclaimable_images;
          const frei = zahl('reclaimable_images');
          const gesamt = zahl('images_size');
          const rechts = frei === null ? '' : `<span style="font-variant-numeric:tabular-nums;white-space:nowrap;"><b style="font-size:14px;color:${TEXT};">${gb(frei)}</b>` + (gesamt ? ` von ${gb(gesamt)}` : '') + `</span>`;
          const kopf = `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:12px;color:${SEK};">${links}${rechts}</div>`;
          if (!fs || fs.state === 'unavailable') return kopf + zeile('Freigebbarer Speicher nicht verfügbar');
          if (frei === null) return kopf + zeile('Freigebbarer Speicher: Bericht folgt, höchstens alle 15 Minuten');
          // Bericht von vor dem letzten Druck: report_started_at (HA-Arcane ab
          // 0.7.1) ist der Beginn des Berichts; mit 0.7.0 bleibt nur die letzte
          // Wertaenderung. Nach 20 Minuten (Intervall 15) gilt er nicht mehr
          // als veraltet, falls kein neuer kommt.
          let stand = '';
          const p = s.prune;
          const pz = p ? new Date(p.state).getTime() : NaN;
          const rz = new Date(fs.attributes.report_started_at || fs.last_changed).getTime();
          if (!isNaN(pz) && Date.now() - pz < 20 * 60e3 && rz < pz) stand = 'Stand vor dem Aufräumen';
          const laeuft = variables.laeuft;
          const anteil = gesamt ? Math.min(100, Math.max(0, frei / gesamt * 100)) : 0;
          // Phase der Laufspur haengt an der Uhrzeit, damit sie beim Neuzeichnen
          // nicht von vorn beginnt.
          const lauf = laeuft ? `<span class="nb-lauf" style="animation-delay:-${Date.now() % 1600}ms;"></span>` : '';
          const spur = `<div style="position:relative;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--nachtblau-aus, #3a4453);margin:7px 0 6px;">`
            + `<span style="width:${100 - anteil}%;background:${BLAU};opacity:${laeuft ? 0.45 : 1};"></span><span style="width:${anteil}%;background:${AMBER};opacity:${laeuft ? 0.45 : 1};"></span>${lauf}</div>`;
          const teile = ['Images ' + gb(frei)];
          const bc = zahl('reclaimable_build_cache');
          if (bc !== null) teile.push('Build-Cache ' + gb(bc));
          const vol = zahl('reclaimable_volumes');
          if (vol !== null) teile.push('Volumes ' + gb(vol) + ' (bleiben)');
          if (stand) teile.push(stand);
          return kopf + spur + zeile(stuecke(teile));
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 10px 12px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"balken"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        balken:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
          - overflow: visible

  # ---------------------------------------------------------------------------
  # nachtblau_docker_aufraeumen: "Ungenutztes aufraeumen" eines Hosts, in der
  # Karte Speicher & Aufraeumen je Host und im Pop-up eines Agenten in der
  # Karte Hosts. Entity ist sein Button "Ungenutztes entfernen" (translation_
  # key prune). Antippen startet nach Rueckfrage script.docker_aufraeumen mit
  # knopf = diesem Button (docker-konfig.yaml); das Skript wird direkt
  # aufgerufen, nicht per script.turn_on, so meldet HA einen Fehler des Prune
  # als Hinweis. Phase und Ergebnis kommen aus dem Status-Helfer des Hosts
  # (input_text.<Anfang der Button-ID>_aufraeumen_status), den jedes Geraet
  # sieht. Fehlt der Helfer, ist der Knopf aus ("Helfer fehlt").
  #   Infozeile  "≈ 3,7 GB freigebbar · zuletzt 16.11., 12:17" (ungenutzte
  #              Images plus Build-Cache), waehrend des Laufs "raeumt auf …",
  #              dann "Werte werden aktualisiert …", danach "54 MB
  #              freigegeben · zuletzt …"
  #   Knopf      Amber ab 0,5 GB, ohne Bericht ab einem ungenutzten Image;
  #              waehrend dieser Host aufraeumt "laeuft …". Ein anderer Host
  #              kann gleichzeitig aufraeumen (Skript im Modus parallel).
  # Container und Volumes entfernt der Button nie (HA-Arcane button.py, api.py:
  # system/prune mit images: all, networks: unused, buildCache: unused).
  nachtblau_docker_aufraeumen:
    variables:
      sib: |
        [[[
          // Entitaeten desselben Geraets (der Umgebung) nach translation_key
          const E = hass.entities || {}, reg = entity ? E[entity.entity_id] : null;
          const m = {};
          if (reg) for (const e of Object.values(E)) {
            if (e.device_id === reg.device_id && e.platform === 'arcane' && e.translation_key && !(e.translation_key in m)) m[e.translation_key] = states[e.entity_id] || null;
          }
          return m;
        ]]]
      host: |
        [[[
          const E = hass.entities || {}, D = hass.devices || {};
          const reg = entity ? E[entity.entity_id] : null;
          const d = reg ? D[reg.device_id] : null;
          return d ? (d.name_by_user || d.name || '') : '';
        ]]]
      helfer: "[[[ return entity ? 'input_text.' + entity.entity_id.split('.')[1].replace(/_ungenutztes_entfernen$/, '') + '_aufraeumen_status' : ''; ]]]"
      frei: |
        [[[
          const s = variables.sib.images_unused;
          const n = s ? parseInt(s.state, 10) : NaN;
          return isNaN(n) ? null : n;
        ]]]
      aktiv: '[[[ return !!entity && entity.state !== "unavailable" && !!states[variables.helfer]; ]]]'
      # Phase;Beginn;GB aus dem Skript, siehe docker-konfig.yaml
      status: |
        [[[
          const s = states[variables.helfer];
          const t = s ? String(s.state).split(';') : [];
          const v = parseFloat(t[2]);
          return { phase: t[0] || '', beginn: t[1] || '', gb: isNaN(v) ? null : v };
        ]]]
      laeuft: |
        [[[
          const sk = states['script.docker_aufraeumen'];
          return !!sk && sk.state === 'on' && (variables.status.phase === 'aufraeumen' || variables.status.phase === 'bericht');
        ]]]
      # Bericht von vor dem letzten Druck, wie im Balken
      veraltet: |
        [[[
          const e = variables.sib.reclaimable_images;
          if (!e || !entity) return false;
          const pz = new Date(entity.state).getTime();
          const rz = new Date(e.attributes.report_started_at || e.last_changed).getTime();
          return !isNaN(pz) && Date.now() - pz < 20 * 60e3 && rz < pz;
        ]]]
      # Was der Knopf freigibt: ungenutzte Images und Build-Cache; null,
      # solange kein Bericht da ist
      gb: |
        [[[
          const s = variables.sib;
          const z = (k) => { const v = s[k] ? parseFloat(s[k].state) : NaN; return isNaN(v) ? null : v; };
          const img = z('reclaimable_images'), bc = z('reclaimable_build_cache');
          return img === null && bc === null ? null : (img || 0) + (bc || 0);
        ]]]
      gb_text: |
        [[[
          const v = variables.gb;
          if (v === null) return '';
          return v < 1 ? Math.round(v * 1000).toLocaleString('de-DE') + ' MB'
            : v.toLocaleString('de-DE', { maximumFractionDigits: v < 10 ? 2 : 1 }) + ' GB';
        ]]]
      # Amber ab 0,5 GB; ohne Bericht nach der Zahl ungenutzter Images. Nie,
      # solange das Aufraeumen laeuft oder der Bericht von davor ist.
      lohnt: |
        [[[
          if (variables.laeuft || variables.veraltet) return false;
          if (variables.gb !== null) return variables.gb >= 0.5;
          return variables.frei !== null && variables.frei > 0;
        ]]]
    show_icon: true
    show_name: false
    show_state: false
    icon: mdi:broom
    tap_action: |
      [[[
        if (!variables.aktiv || variables.laeuft) return { action: 'none' };
        const img = variables.frei === null ? 'alle ungenutzten Images' : (variables.frei === 1 ? '1 ungenutztes Image' : variables.frei + ' ungenutzte Images');
        const menge = variables.gb_text && !variables.veraltet ? 'Frei werden etwa ' + variables.gb_text + '. ' : '';
        return {
          action: 'perform-action',
          perform_action: 'script.docker_aufraeumen',
          data: { knopf: entity.entity_id },
          confirmation: { text: (variables.host || 'Host') + ' aufräumen? ' + menge + 'Entfernt werden ' + img + ', ungenutzte Netzwerke und der Build-Cache. Container und Volumes bleiben.' }
        };
      ]]]
    hold_action:
      action: none
    custom_fields:
      titel: >-
        <span style="font-size:14px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);">Ungenutztes aufräumen</span>
      info: |
        [[[
          const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
          if (entity && entity.state !== 'unavailable' && !states[variables.helfer]) return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">Helfer ${variables.helfer.replace('input_text.', '')} fehlt</span>`;
          if (!variables.aktiv) return `<span style="font-size:12px;color:${sek};">nicht verfügbar</span>`;
          if (variables.laeuft) {
            const t = variables.status.phase === 'bericht' ? 'Werte werden aktualisiert …' : 'räumt auf …';
            return `<span style="font-size:12px;color:var(--nachtblau-amber, #e6b566);">${t}</span>`;
          }
          let zuletzt = 'noch nie';
          const d = new Date(entity.state);
          if (!isNaN(d.getTime())) zuletzt = 'zuletzt ' + d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          const mb = (v) => v < 1 ? Math.round(v * 1000).toLocaleString('de-DE') + ' MB'
            : v.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' GB';
          // Ergebnis des Skripts, wenn es zum letzten Druck gehoert und jetzt
          // nichts Nennenswertes mehr freizugeben ist
          const st = variables.status;
          const passt = st.phase === 'fertig' && st.gb !== null && Math.abs(new Date(st.beginn).getTime() - d.getTime()) < 60e3;
          // Kurze Angaben bleiben samt "·" zusammen, "zuletzt …" ebenso; nur der
          // Ersatztext ohne Bericht darf in sich umbrechen.
          const ganz = (t) => `<span style="white-space:nowrap;">${t} ·</span>`;
          let was;
          if (variables.veraltet) was = ganz('Bericht folgt');
          else if (passt && (variables.gb === null || variables.gb < 0.5)) was = ganz(st.gb < 0.001 ? 'nichts freizugeben' : mb(st.gb) + ' freigegeben');
          else if (variables.gb_text) was = ganz('≈ ' + variables.gb_text + ' freigebbar');
          else was = 'Images, Netzwerke, <span style="white-space:nowrap;">Build-Cache ·</span>';
          return `<span style="font-size:12px;color:${sek};">${was} <span style="white-space:nowrap;">${zuletzt}</span></span>`;
        ]]]
      knopf: |
        [[[
          const c = 'var(--nachtblau-amber, #e6b566)';
          const neutral = 'color:var(--nachtblau-label, #b4c0cf);background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));';
          const form = 'display:inline-flex;align-items:center;box-sizing:border-box;min-height:40px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;';
          if (variables.laeuft) return `<span style="${form}${neutral}">läuft …</span>`;
          const stil = variables.aktiv && variables.lohnt
            ? `color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);`
            : neutral;
          return `<span style="${form}opacity:${variables.aktiv ? 1 : 0.4};${stil}">Aufräumen</span>`;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 8px 8px 8px 10px
        - box-shadow: none
        - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      grid:
        - grid-template-areas: '"i titel knopf" "i info knopf"'
        - grid-template-columns: 36px minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - row-gap: 3px
        - align-items: center
      img_cell:
        - width: 36px
        - height: 36px
        - box-sizing: border-box
        - border-radius: 11px
        - margin: 0
        - align-self: center
        # Waehrend des Aufraeumens getoent in Amber (Icon-Kachel 0,16, Rand 0,24)
        - background: |
            [[[ return variables.laeuft ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
        - border: |
            [[[ return variables.laeuft ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - margin: 0
        - --ha-icon-display: block
        - color: '[[[ return variables.laeuft ? "var(--nachtblau-amber, #e6b566)" : "var(--nachtblau-label, #b4c0cf)"; ]]]'
      custom_fields:
        titel:
          - justify-self: start
          - align-self: end
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '2'
          - text-wrap: balance
          - text-align: left
        # Neben dem Knopf bleiben fuer den Hinweis in der Karte auf dem 360 px
        # breiten Handy 116 px, auf dem iPhone 17 Pro 150 px (im Host-Pop-up
        # mehr). "Images, Netzwerke, Build-Cache · zuletzt …" (ohne Bericht)
        # braucht auf dem S25 drei Zeilen; "≈ 1,56 GB freigebbar · zuletzt …"
        # ist kuerzer.
        info:
          - justify-self: start
          - align-self: start
          - min-width: 0
          - max-width: 100%
          - overflow: hidden
          - white-space: normal
          - display: -webkit-box
          - -webkit-box-orient: vertical
          - -webkit-line-clamp: '3'
          - text-wrap: balance
          - font-size: 12px
          - line-height: 1.25
          - margin-top: 5px
          - text-align: left
        knopf:
          - align-self: center
          - overflow: visible
