# ============================================================================
# Docker-Host – Status, CPU, RAM, Disk und Versionen
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     nachtblau_docker_kopf (docker-templates.yaml),
#                nachtblau_docker_messwert (docker-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Erste Karte der Docker-View (docker-view.yaml).
#
#   Kopf       Name der Arcane-Umgebung (aus dem Namen von ..._online) und
#              Online-Badge
#   Messwerte  CPU, RAM (belegt von gesamt) und Disk des Docker-Hosts, Farbe
#              nach den Schwellen der System-Karte (system-karte.yaml):
#              CPU ab 40 % Amber, ab 75 % Rot; RAM und Disk ab 75 / 90 %.
#              Arcane misst den RAM ohne Cache; der Proxmox-Sensor der VM zeigt
#              deshalb mehr (am 21.10.2026: 60,8 % gegen 92 %).
#   Versionen  Docker und Arcane; ist ein Arcane-Update da, steht es in Amber.
#              Antippen oeffnet den Update-Dialog von Arcane.
#
# Voraussetzung: custom:button-card + card-mod (HACS), Integration Arcane
#                (HACS) mit Option "CPU, RAM und Festplatte des Hosts"
#                (Abfrage) und den aktivierten Diagnose-Sensoren
#                Docker-Version, Arcane Version und Host Arbeitsspeicher
#                gesamt; Templates aus docker-templates.yaml.
#                Die Entity-IDs der Hoststatistik beginnen mit dem Namen der
#                Umgebung zum Zeitpunkt ihres Anlegens (hier sensor.docker_host_*,
#                die aelteren mit sensor.local_docker_*).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
      border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  - type: custom:button-card
    template: nachtblau_docker_kopf
    entity: binary_sensor.local_docker_online
    icon: mdi:docker
    name: Docker-Host
    label: |
      [[[
        const n = String((entity && entity.attributes.friendly_name) || '').replace(/ Online$/, '');
        return (n || 'Docker') + ' · Arcane';
      ]]]
    tap_action:
      action: more-info
    custom_fields:
      badge: |
        [[[
          const on = entity && entity.state === 'on';
          const c = on ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-rot, #f0736a)';
          const txt = on ? 'online' : 'offline';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px color-mix(in srgb, ${c} 18%, transparent);"></span>${txt}</span>`;
        ]]]

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        template: nachtblau_docker_messwert
        entity: sensor.docker_host_cpu
        name: CPU
        variables:
          gelb: 40
          rot: 75
          zusatz: Auslastung
      - type: custom:button-card
        template: nachtblau_docker_messwert
        entity: sensor.docker_host_arbeitsspeicher
        name: RAM
        variables:
          zusatz: |
            [[[
              const f = (id) => { const s = states[id]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? null : v.toLocaleString('de-DE', { maximumFractionDigits: 1 }); };
              const b = f('sensor.docker_host_arbeitsspeicher_belegt');
              const g = f('sensor.docker_host_arbeitsspeicher_gesamt');
              return b && g ? b + ' von ' + g + ' GB' : (b ? b + ' GB belegt' : '');
            ]]]
      - type: custom:button-card
        template: nachtblau_docker_messwert
        entity: sensor.docker_host_festplatte
        name: Disk
        variables:
          zusatz: |
            [[[
              const s = states['sensor.docker_host_festplatte_belegt'];
              const v = s ? parseFloat(s.state) : NaN;
              return isNaN(v) ? '' : v.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' GB belegt';
            ]]]

  # ---- Versionen; Antippen: Update-Dialog von Arcane ----
  - type: custom:button-card
    entity: update.local_docker_arcane
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    custom_fields:
      chips: |
        [[[
          const chip = (txt, farbe) => {
            const f = farbe || 'var(--nachtblau-label, #b4c0cf)';
            const grund = farbe ? `color-mix(in srgb, ${farbe} 12%, transparent)` : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
            const rand = farbe ? `color-mix(in srgb, ${farbe} 24%, transparent)` : 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
            return `<span style="display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:${f};background:${grund};border:1px solid ${rand};padding:4px 9px;border-radius:9px;white-space:nowrap;">${txt}</span>`;
          };
          const d = states['sensor.local_docker_docker_version'];
          const a = entity ? entity.attributes : {};
          const neu = entity && entity.state === 'on';
          let h = chip('Docker ' + (d && d.state !== 'unavailable' ? d.state : '–'));
          h += neu
            ? chip('Arcane ' + (a.installed_version || '–') + ' · Update auf ' + (a.latest_version || '?'), 'var(--nachtblau-amber, #e6b566)')
            : chip('Arcane ' + (a.installed_version || '–') + ' · aktuell');
          return `<div style="display:flex;flex-wrap:wrap;gap:8px;">${h}</div>`;
        ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0 2px
      grid:
        - grid-template-areas: '"chips"'
        - grid-template-columns: 1fr
      custom_fields:
        chips:
          - justify-self: start
          - text-align: left
          - overflow: visible
