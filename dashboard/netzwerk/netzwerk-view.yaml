# ============================================================================
# Netzwerk – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Netzwerk – komplette Ansicht (View) im Owlet-Stil
#
# Sections-View, gebaut fuer das Handy: Auf schmalen Bildschirmen stehen die
# Sections untereinander, auf breiten nebeneinander.
#
#   Section 1  Top-Navigation · Netzwerk-Status · Netzplan
#   Section 2  Leitungen & Durchsatz · UDM SE kompakt · UNAS Pro ·
#              Verlauf (eingeklappt)
#   Section 3  schwebende Navbar
#
# Auf dem Handy folgt der Netzplan damit direkt auf die Statuskarte. Die
# frueheren Karten Internet und Infrastruktur sind in Statuskarte, Netzplan
# und Leitungs-Karte aufgegangen (alte Fassung: unifi-button-card.yaml im
# Git-Verlauf).
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include dashboard/netzwerk/netzwerk-view.yaml
#   Die Includes unten sind relativ zu dieser Datei: die sechs Karten im
#   selben Ordner ablegen wie die View.
#
# Voraussetzung: custom:button-card + custom:apexcharts-card
#                + custom:expander-card + custom:uptime-card
#                + custom:decluttering-card + card-mod (alle via HACS),
#                unifi-netzplan-card.js als Dashboard-Ressource (liegt im
#                Repo, kein HACS), Integration "UniFi WAN" (HACS,
#                benutzerdefiniertes Repository), Integration "UniFi UNAS
#                (non-invasive)" (HACS), Templates aus
#                navigation-templates.yaml.
title: Netzwerk
path: netzwerk
icon: mdi:router-wireless
visible:
- user: benutzer_id_1
type: sections
max_columns: 2
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation
  - !include unifi-netzwerk-status-karte.yaml
  - !include unifi-netzplan-karte.yaml
- type: grid
  cards:
  - !include unifi-leitungen-karte.yaml
  - !include unifi-udm-system-karte-v2.yaml
  - !include unifi-unas-pro-karte.yaml
  - !include unifi-verlauf-karte.yaml
- type: grid
  cards:
  - type: custom:decluttering-card
    template: floating_navbar
