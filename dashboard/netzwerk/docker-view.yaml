# ============================================================================
# Docker – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Docker – komplette Ansicht (View) im Owlet-Stil, erreichbar ueber das
# More-Menue (Technik -> Docker). Entwurf: Artefakt "Docker-View Konzept"
# (Oktober 2026). Quelle aller Werte ist die Integration Arcane.
#
# Sections-View; auf dem Handy stehen die Sections untereinander, auf
# breiten Bildschirmen bis zu drei nebeneinander.
#
#   Section 1  Top-Navigation · Docker-Host · Uebersicht · Image-Updates
#   Section 2  Compose-Projekte · Container nach Projekt
#   Section 3  Speicher & Aufraeumen · Ereignisse · Verlauf
#   Section 4  schwebende Navbar
#
# Auf dem Handy folgt so auf den Host-Zustand gleich, was Aufmerksamkeit
# braucht und welche Updates anstehen; Steuerung und Verlauf kommen danach.
# Die Netzwerk-View behaelt ihre kompakte Docker-Karte (docker-karte.yaml).
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include dashboard/netzwerk/docker-view.yaml
#   Die Includes unten sind relativ zu dieser Datei: die acht Karten im
#   selben Ordner ablegen wie die View.
#
# Voraussetzung: custom:button-card + custom:auto-entities
#                + custom:expander-card + custom:apexcharts-card
#                + custom:decluttering-card + card-mod (alle via HACS),
#                Integration Arcane (HACS) mit Hoststatistik, Projekten,
#                Events und Prune Button, Paket docker-konfig.yaml,
#                Templates aus navigation-templates.yaml und
#                docker-templates.yaml. API-Rechte: siehe README.md,
#                Abschnitt Voraussetzungen.
title: Docker
path: docker
icon: mdi:docker
visible:
- user: benutzer_id_1
type: sections
max_columns: 3
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation
  - !include docker-host-karte.yaml
  - !include docker-uebersicht-karte.yaml
  - !include docker-updates-karte.yaml
- type: grid
  cards:
  - !include docker-projekte-karte.yaml
  - !include docker-container-karte.yaml
- type: grid
  cards:
  - !include docker-speicher-karte.yaml
  - !include docker-ereignisse-karte.yaml
  - !include docker-verlauf-karte.yaml
- type: grid
  cards:
  - type: custom:decluttering-card
    template: floating_navbar
