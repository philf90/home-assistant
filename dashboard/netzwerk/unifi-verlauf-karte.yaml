# ============================================================================
# Netzwerk-Verlauf – aufklappbar
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       netzwerk
# Status:        aktiv
# Karten:        apexcharts-card, button-card, card-mod, expander-card,
#                uptime-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Netzwerk · Verlauf (aufklappbar) – Nachtblau-Karte
#
# Eingeklappt nur eine Kopfzeile, damit die Netzwerk-View auf dem Handy kurz
# bleibt. Aufgeklappt:
#   - Erreichbarkeit der UDM SE, 7 Tage (custom:uptime-card). Der Monitor von
#     Uptime Kuma prueft Port 443 der UDM im LAN; er sagt nichts darueber, ob
#     das Internet erreichbar ist. Deshalb heisst die Kachel "UDM erreichbar"
#     und nicht mehr "Internet".
#   - Latenz beider Leitungen, 24 h, Mittelwert je 5 min (Langzeitstatistik).
#
# Die Uptime-Leiste stand vorher in der Internet-Karte mit 1 Tag Zeitraum.
#
# ┌────────────── ENTITÄTEN PRÜFEN ───────────────────────────────────────────┐
# │ binary_sensor.uptimekuma_*: eigener Monitor aus der Uptime-Kuma-          │
# │ Integration. Latenz: WAN-Latenz-Sensoren der UniFi-Integration            │
# │ (standardmäßig deaktiviert); UniFi nennt den ersten Anschluss "WAN".      │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Voraussetzung: custom:expander-card + custom:button-card + custom:uptime-card
#                + custom:apexcharts-card + card-mod (HACS).
type: custom:expander-card
expanded: false
clear: false
clear-children: true
# Icon-Kachel als eigenes Flex-Markup statt ueber die Icon-Zelle von
# button-card: dort sass das Icon rund 3 px zu tief.
title-card:
  type: custom:button-card
  name: Verlauf
  label: UDM erreichbar · Latenz der Leitungen
  show_icon: false
  show_name: true
  show_label: true
  show_state: false
  tap_action:
    action: none
  custom_fields:
    tile: >-
      <div style="width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 16%, transparent);border:1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent);"><ha-icon icon="mdi:history" style="--mdc-icon-size:20px;width:20px;height:20px;display:flex;color:var(--nachtblau-gruen, #a6d49e);"></ha-icon></div>
  styles:
    card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 2px
    grid:
      - grid-template-areas: '"tile n" "tile l"'
      - grid-template-columns: min-content 1fr
      - grid-template-rows: min-content min-content
    custom_fields:
      tile:
        - display: flex
        - align-self: center
        - margin-right: 12px
    name:
      - justify-self: start
      - align-self: end
      - font-size: 15.5px
      - font-weight: 700
      - letter-spacing: -0.02em
      - color: 'var(--nachtblau-text, #f2f5f8)'
    label:
      - justify-self: start
      - align-self: start
      - font-size: 12px
      - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
      - margin-top: 1px
cards:
  - type: custom:uptime-card
    entity: binary_sensor.uptimekuma_dream_machine_se
    icon: mdi:router-network
    # Titel: friendly_name des Sensors (Standard von title_template; eine
    # Option "title" kennt uptime-card 0.16 nicht)
    alias: { ok: erreichbar, ko: nicht erreichbar }
    # Farben: uptime-card setzt sie als style (Titel, Icon, Status, Tooltip)
    # und als fill-Attribut der Balken; die Balken faerbt deshalb zusaetzlich
    # das card_mod-CSS unten. half/none statt der Vorgaben der Karte (Gelb, Hellgrau).
    color: { icon: 'var(--nachtblau-gruen, #a6d49e)', ok: 'var(--nachtblau-gruen, #a6d49e)', ko: 'var(--nachtblau-rot, #f0736a)', half: 'var(--nachtblau-amber, #e6b566)', none: 'var(--nachtblau-text-sekundaer, #8794a5)', title: 'var(--nachtblau-titel, #e7ecf3)', footer: 'var(--nachtblau-text-sekundaer, #8794a5)' }
    tooltip_adaptive_color: true
    icon_adaptive_color: true
    status_adaptive_color: true
    title_adaptive_color: true
    bar: { spacing: 3, height: 10, round: 4 }
    show: { average: true, status: true }
    alignment: { status: spaced, header: left, icon_first: true }
    duration: { quantity: 7, unit: day }
    # Zahlen deutsch: Komma statt Punkt, Uhrzeiten im Tooltip 24 h
    average_template: "[[[ return variables.uptime.toFixed(2).replace('.', ','); ]]] %"
    tooltip:
      hour24: true
      template: "[[[ return variables.from_date; ]]] – [[[ return variables.to_date; ]]] | [[[ return String(variables.average).replace('.', ','); ]]] %"
    tap_action: { action: more-info }
    card_mod:
      style: |
        ha-card {
          background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important;
          border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          padding: 6px 10px !important;
          margin-top: 8px !important;
        }
        /* uptime-card 0.16 schreibt "7 days ago" und "Now" fest ins Markup.
           Text ausblenden, deutschen Text als ::after zeigen (erbt Groesse
           und Farbe). "vor 7 Tagen" muss zu duration oben passen. */
        .footer-text { visibility: hidden; position: relative; opacity: 1 !important; }
        /* Balken: fill-Attribut -> CSS, damit jeder Browser den Modus aufloest */
        rect.bar[fill="var(--nachtblau-gruen, #a6d49e)"] { fill: var(--nachtblau-gruen, #a6d49e); }
        rect.bar[fill="var(--nachtblau-rot, #f0736a)"] { fill: var(--nachtblau-rot, #f0736a); }
        rect.bar[fill="var(--nachtblau-amber, #e6b566)"] { fill: var(--nachtblau-amber, #e6b566); }
        rect.bar[fill="var(--nachtblau-text-sekundaer, #8794a5)"] { fill: var(--nachtblau-text-sekundaer, #8794a5); }
        .footer-text::after { visibility: visible; position: absolute; top: 0; white-space: nowrap; }
        .footer-text:first-child::after { content: 'vor 7 Tagen'; left: 0; }
        .footer-text:last-child::after { content: 'jetzt'; right: 0; }
  - type: custom:apexcharts-card
    graph_span: 24h
    header:
      show: true
      title: Latenz der Leitungen
      show_states: false
    apex_config:
      chart:
        background: transparent
        fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
        foreColor: '#8794a5'
        height: 150
        toolbar:
          show: false
      dataLabels:
        enabled: false
      grid:
        borderColor: rgba(255,255,255,0.06)
        strokeDashArray: 3
      legend:
        show: true
        fontSize: 11px
        labels:
          colors: '#8794a5'
        markers:
          size: 5
          strokeWidth: 0
      stroke:
        curve: smooth
        width: 2
      tooltip:
        theme: dark
        x:
          format: HH:mm
      xaxis:
        labels:
          format: HH:mm
    card_mod:
      style: |
        ha-card {
          background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important;
          border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          margin-top: 8px !important;
        }
        /* apexcharts-card 2.2.3 hat kein .card-header: Kopf ist #header, Titel #header__title */
        #header { padding: 10px 12px 0 !important; }
        #header__title { font-size: 13px !important; color: var(--nachtblau-label, #b4c0cf) !important; }
        /* ApexCharts 5.3.3: Legendentext liegt sonst ueber dem Farbpunkt */
        .apexcharts-legend-text { margin-left: 0 !important; padding-left: 6px !important; }
        /* Farben je Modus (apexcharts-card zeichnet beim Wechsel nicht neu):
           Serien nach Index, Legende nach rel = Index + 1 */
        .apexcharts-series[data\:realIndex="0"], .apexcharts-legend-series[rel="1"] { --nw-c: var(--nachtblau-gruen, #a6d49e); }
        .apexcharts-series[data\:realIndex="1"], .apexcharts-legend-series[rel="2"] { --nw-c: var(--nachtblau-blau, #7fb3d5); }
        .apexcharts-line { stroke: var(--nw-c); }
        .apexcharts-marker { fill: var(--nw-c); }
        .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
        .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
        .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
        /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
        .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
        .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
        .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
        /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
        .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--nachtblau-gruen, #a6d49e) !important; }
        .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker { color: var(--nachtblau-blau, #7fb3d5) !important; }
    yaxis:
      - min: 0
        decimals: 0
        apex_config:
          forceNiceScale: true
          tickAmount: 3
    series:
      - entity: sensor.dream_machine_special_edition_cloudflare_wan2_latency
        name: Glasfaser
        color: '#a6d49e'
        unit: ms
        statistics:
          type: mean
          period: 5minute
      - entity: sensor.dream_machine_special_edition_cloudflare_wan_latency
        name: VDSL
        color: '#7fb3d5'
        unit: ms
        statistics:
          type: mean
          period: 5minute
card_mod:
  style: |
    ha-card {
      border-radius: 22px !important;
      border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
      box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 14px 16px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    ha-card ha-icon,
    ha-card .expander-icon,
    ha-card mwc-icon-button {
      color: var(--nachtblau-muted, #6e7988) !important;
    }
