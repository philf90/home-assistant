                        # Neben Neustart in der zweiten Reihe, die Verwaltung schon hat;
                        # neutral wie die Kacheln dieses Bereichs. Glyphe von mdi:docker ist
                        # mittig (Begrenzung 2..22 x 4,83..19,17).
