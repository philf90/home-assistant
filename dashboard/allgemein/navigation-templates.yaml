                              - margin-bottom: 6px
                            icon:
                              - width: 19px
                              - height: 19px
                              - color: 'var(--owlet-rot, #f0736a)'
                              # wie menu_tile: Grundlinie aus, Glyphe mittig (variables.glyph)
                              - --ha-icon-display: block
                              - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 19 / 24}px, ${-g[1] * 19 / 24}px)`; ]]]'
