# ============================================================================
# Top-Navigation – Launcher-Raster
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       allgemein
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   weather.wohnort
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Top-Navigation (Launcher-Raster) im Nachtblau-Stil.
#
# 10 Kacheln in zwei Reihen als custom:button-card: rundlich-quadratische
# Icon-Kachel (dezent in der Sektionsfarbe getoent) + Label. Farbe pro Kachel
# ueber variables.accent; die styles-Bloecke werden per YAML-Anker geteilt.
# Die Wetterkachel wechselt ihr Icon mit dem Zustand von weather.wohnort
# (MDI-Wettericons, nachts Mond), die Farbe bleibt Wolkengrau.
#
# Voraussetzung: custom:button-card (HACS) + die genutzten Icon-Sets
# (bi, fa6-solid, phu, flat-ui) wie bisher.
type: vertical-stack
cards:
  # ---------- Reihe 1: mit Beschriftung ----------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-blau, #7fb3d5)' }
        icon: mdi:home-assistant
        name: Home
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/home }
        styles: &tile_labeled
          card:
            - padding: 12px 6px 11px
            - border-radius: 18px
            - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
            - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
            - box-shadow: 0 12px 30px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: min-content min-content
            - justify-items: center
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-bottom: 8px
            - background: |
                [[[ return 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'; ]]]
            - border: |
                [[[ return '1px solid color-mix(in srgb, ' + variables.accent + ' 24%, transparent)'; ]]]
          icon:
            - width: 24px
            - height: 24px
            - color: |
                [[[ return variables.accent; ]]]
          name:
            - font-size: 12px
            - font-weight: 600
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
            - max-width: 100%
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-amber, #e6b566)' }
        icon: bi:house-gear
        name: Lichter
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/lichter-fenster-temp }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-tuerkis-hell, #77d4d0)' }
        icon: fa6-solid:plug-circle-bolt
        name: Energie
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/energie }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-petrol, #79b8c9)' }
        icon: phu:thermostat-v2
        name: Heizung
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/heizung }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-violett, #b399d4)' }
        icon: mdi:washing-machine
        name: Geräte
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/hausgerate }
        styles: *tile_labeled
  # ---------- Reihe 2: nur Icons ----------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-rot, #f0736a)' }
        icon: mdi:cctv
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
        styles: &tile_icononly
          card:
            - padding: 12px 6px
            - border-radius: 18px
            - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
            - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
            - box-shadow: 0 12px 30px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
          grid:
            - grid-template-areas: '"i"'
            - justify-items: center
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - background: |
                [[[ return 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'; ]]]
            - border: |
                [[[ return '1px solid color-mix(in srgb, ' + variables.accent + ' 24%, transparent)'; ]]]
          icon:
            - width: 24px
            - height: 24px
            - color: |
                [[[ return variables.accent; ]]]
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-limette, #bdd27f)' }
        icon: phu:garden
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/garten }
        styles: *tile_icononly
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-gruen, #a6d49e)' }
        icon: mdi:flower
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
        styles: *tile_icononly
      - type: custom:button-card
        variables:
          accent: 'var(--nachtblau-wolkengrau, #cdd6e0)'
          weather_entity: weather.wohnort
        # Icon nach dem Wetterzustand, die Farbe bleibt Wolkengrau. Nachtregel wie
        # im Begruessungs-Banner: Der DWD meldet auch nachts 'sunny'. Ohne Wert
        # bleibt das bisherige Icon stehen.
        icon: |
          [[[
            const w = states[variables.weather_entity];
            const cond = (!w || w.state === 'unavailable' || w.state === 'unknown') ? '' : w.state;
            const sunE = states['sun.sun'];
            const sunDown = !!sunE && sunE.state === 'below_horizon';
            if (sunDown && cond === 'sunny') return 'mdi:weather-night';
            if (sunDown && cond === 'partlycloudy') return 'mdi:weather-night-partly-cloudy';
            const map = {
              'sunny': 'mdi:weather-sunny', 'clear-night': 'mdi:weather-night',
              'partlycloudy': 'mdi:weather-partly-cloudy', 'cloudy': 'mdi:weather-cloudy',
              'fog': 'mdi:weather-fog', 'rainy': 'mdi:weather-rainy', 'pouring': 'mdi:weather-pouring',
              'lightning': 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy',
              'snowy': 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy', 'hail': 'mdi:weather-hail',
              'windy': 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant',
              'exceptional': 'mdi:weather-cloudy-alert'
            };
            return map[cond] || 'flat-ui:weather';
          ]]]
        # Die Kachel hat keine eigene entity; ohne triggers_update rendert sie bei
        # einem Wetterwechsel erst nach einem Neuladen neu
        triggers_update:
          - weather.wohnort
          - sun.sun
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
        styles: *tile_icononly
      - type: custom:button-card
        variables: { accent: 'var(--nachtblau-text-sekundaer, #8794a5)' }
        icon: mdi:car
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
        styles: *tile_icononly
