# ============================================================================
# Navbar – schwebende Navigation unten
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       allgemein
# Status:        aktiv
# Karten:        button-card, navbar-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Floating Navbar im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Variante A: aktiver Punkt = gruen getoente Icon-Kachel (wie die Icon-Kacheln
# im restlichen Dashboard). Inaktive Punkte gedaempft.
#
# Wichtig:
#   - Aeusserer Kartenrahmen wird transparent gemacht (sonst doppelter Wrapper).
#   - icon_color pro Route ENTFERNT -> Farben kommen komplett aus styles,
#     sonst ueberstimmt der Inline-icon_color das aktive Gruen.
#
# Voraussetzung: custom:navbar-card und custom:button-card (HACS), HACS-Integration
#   "browser_mod" fuer das More-Menue mit dem Darstellungs-Schalter.
type: custom:navbar-card
mobile:
  show_labels: true
  mode: floating
desktop:
  show_labels: true
  position: left
  min_width: 768
styles: |
  /* Farben aus dem Theme owlet (var(--owlet-...), Toenungen per color-mix);
     der zweite Wert in var() ist der dunkle Palettenwert ohne Theme. */
  /* Aeusseren Kartenrahmen entfernen -> nur die eine Owlet-Leiste bleibt.
     Aktiv-Farbe (--primary-color) auf Owlet-Gruen -> aktives Icon wird gruen. */
  :host {
    background: transparent !important;
    --primary-color: var(--owlet-gruen, #a6d49e) !important;
    --navbar-primary-color: var(--owlet-gruen, #a6d49e) !important;
  }
  /* navbar-card >= 1.7.2 gibt der mobilen schwebenden Leiste
     (.navbar-card.mobile.floating) einen Schatten aus --ha-box-shadow-s;
     die Regel ist spezifischer als ha-card/.navbar-card und zeichnete
     eine zweite Leiste in der Owlet-Huelle. Hier mit aufgefuehrt, damit
     nur die Huelle (.navbar) sichtbar bleibt. */
  ha-card,
  .navbar-card,
  .navbar-card.mobile.floating {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    --ha-card-background: transparent !important;
    --card-mod-background: transparent !important;
  }
  /* Die eigentliche schwebende Leiste = Owlet-Huelle */
  .navbar {
    background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 26px !important;
    box-shadow: 0 22px 50px -20px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
    --primary-color: var(--owlet-gruen, #a6d49e) !important;
    /* etwas Luft, damit erster/letzter Punkt nicht an die runden Ecken stoesst */
    padding-left: 10px !important;
    padding-right: 10px !important;
  }
  /* Mobile Leiste: navbar-card 1.7.2 setzt sie fest auf bottom: 0 und rechnet
     den Sicherheitsabstand nur mit mobile.safe_area ein (Standard aus, hier nicht gesetzt).
     iPhone (WebKit): buendig am unteren Rand, der Home-Indikator liegt darueber.
     Andere (Android): um --safe-area-inset-bottom anheben. Die App gibt den
     Abstand ab 2026.8.3 weiter (randlos); vorher ist er 0, nichts aendert sich.
     box-sizing: navbar-card setzt width: 100vw ohne border-box -> Padding und
     Rahmen oben machten die Leiste 22px breiter als den Bildschirm (rechts
     abgeschnitten). Mit border-box ist sie genau bildschirmbreit. */
  .navbar.mobile {
    bottom: 0 !important;
    box-sizing: border-box !important;
  }
  @supports not (-webkit-touch-callout: none) {
    .navbar.mobile { bottom: var(--safe-area-inset-bottom, 0px) !important; }
  }
  /* Jeder Punkt: Icon + Label gedaempft */
  .route .button {
    border-radius: 14px !important;
  }
  .route ha-icon,
  .route .icon {
    color: var(--owlet-text-sekundaer, #8794a5) !important;
  }
  .route .label {
    color: var(--owlet-text-sekundaer, #8794a5) !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.01em !important;
  }
  /* Aktiver Punkt: gruen getoente Kachel + gruenes Icon/Label */
  .route.active .button,
  .route[data-active="true"] .button,
  .button.active {
    background: color-mix(in srgb, var(--owlet-gruen, #a6d49e) 16%, transparent) !important;
    border: 1px solid color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent) !important;
    /* Feste, kompakte Groesse + zentriert -> umschliesst nur das Icon,
       keine Ueberlappung mit Nachbarn oder Rand */
    box-sizing: border-box !important;
    flex: 0 0 auto !important;
    width: 46px !important;
    min-width: 46px !important;
    max-width: 46px !important;
    height: 40px !important;
    padding: 0 !important;
    margin: 0 auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .route.active ha-icon,
  .route[data-active="true"] ha-icon,
  .button.active ha-icon,
  .route.active .icon,
  .button.active .icon {
    color: var(--owlet-gruen, #a6d49e) !important;
  }
  .route.active .label,
  .route[data-active="true"] .label,
  .button.active .label {
    color: var(--owlet-gruen, #a6d49e) !important;
    font-weight: 700 !important;
  }
  /* "More"-Popup: Owlet-Hintergrund (Layout steuert navbar-card selbst) */
  .navbar-popup,
  .popup {
    background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 22px !important;
    box-shadow: 0 22px 50px -20px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
  }
  .navbar-popup ha-icon,
  .popup ha-icon {
    color: var(--owlet-text, #f2f5f8) !important;
  }
routes:
  - url: /dashboard-home/home
    icon: mdi:home-assistant
    icon_selected: mdi:home-assistant
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/home
  - url: /dashboard-home/lichter-fenster-temp
    icon: bi:house-gear
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/lichter-fenster-temp
  - url: /dashboard-home/energie
    icon: fa6-solid:plug-circle-bolt
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/energie
  - url: /dashboard-home/heizung
    icon: phu:thermostat-v2
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/heizung
  - url: /dashboard-home/hausgerate
    icon: mdi:washing-machine
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/hausgerate
  # "More" oeffnet ein Owlet-Raster-Menue via browser_mod.popup, gegliedert
  # in Bereiche mit Ueberschrift: Zuhause, Draussen, Freizeit, Technik,
  # Verwaltung und Darstellung (System, Hell, Dunkel). Seit 19.10.2026 auch
  # mit Garten und System, die vorher nur ueber die obere Leiste bzw. gar
  # nicht ueber die Navigation erreichbar waren.
  # Seit 20.10.2026 mit Sicherheit (Zuhause); Wetter steht seitdem mit
  # Garten und Pflanzen unter "Draussen", damit das Menue weiter auf einen
  # iPhone-Bildschirm passt.
  # Seit 21.10.2026 mit Docker unter Technik (vierte Kachel, zweite Reihe).
  # Damit das Menue weiter auf den iPhone-Bildschirm passt, ist Neustart
  # eine schmale Zeile ueber die volle Breite statt einer Kachel, und die
  # Kacheln haben oben und unten je 2 px weniger Innenabstand. Gemessen an
  # Bildschirmfotos (iPhone, 3 Bildpunkte je CSS-Pixel): die zweite
  # Technik-Reihe kostet 82 px (Kachel 70, Abstand 12), Neustart als
  # schmale Zeile (31 statt 70 px) spart 39 px, der Innenabstand ueber
  # sechs Kachelreihen 24 px. Das Menue ist damit 19 px hoeher als mit
  # Docker unter Verwaltung; bis zur unteren Kante des Popups blieben
  # dort rund 45 px. Ohne den kleineren Innenabstand waeren es nur
  # wenige Pixel gewesen.
  # Aufruf als Browser-Call (fire-dom-event): Das Popup oeffnet nur im
  # aktuellen Browser. Als call-service ohne browser_id oeffnete browser_mod
  # es laut Doku auf allen registrierten Browsern.
  # Farben ueber die Theme-Variablen (var(--owlet-...), Toenungen per
  # color-mix), damit das Menue hell und dunkel kann; der zweite Wert in
  # var() ist der dunkle Palettenwert und gilt ohne Theme "owlet".
  # Voraussetzung: HACS-Integration "browser_mod".
  - icon: mdi:dots-horizontal
    label: More
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Menü
          # Dialog-Oberflaeche aus dem Theme (dunkel Owlet-Navy statt Schwarz)
          style: |
            --mdc-theme-surface: var(--owlet-huelle-oben, #1b2231);
            --ha-card-background: var(--owlet-huelle-oben, #1b2231);
            --card-background-color: var(--owlet-huelle-oben, #1b2231);
            --primary-background-color: var(--owlet-seite, #171d29);
            --secondary-background-color: var(--owlet-huelle-oben, #1b2231);
            --primary-text-color: var(--owlet-text, #f2f5f8);
            --secondary-text-color: var(--owlet-text-sekundaer, #8794a5);
            --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
            --vertical-stack-card-gap: 6px;
            --grid-card-gap: 6px;
          content:
            type: vertical-stack
            cards:
              # Ueberschrift je Bereich: klein, Versalien, Label-Grau (wie die
              # Abschnittskoepfe der Autokarte, dort Sekundaer-Grau; im Popup auf der
              # Huelle ist Label-Grau kraeftiger). Keine Aktion, nur Text.
              - type: custom:button-card
                name: Zuhause
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: &menu_kopf
                  card:
                    - padding: 2px 4px 0
                    - background: none
                    - border: none
                    - box-shadow: none
                  grid:
                    - grid-template-areas: '"n"'
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 700
                    - letter-spacing: 0.07em
                    - text-transform: uppercase
                    - color: 'var(--owlet-label, #b4c0cf)'
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:cctv
                    name: Kamera
                    variables: { farbe: 'var(--owlet-blau, #7fb3d5)' }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
                    extra_styles: &menu_extra |
                      /* Niedrige Bildschirme (z. B. 360 x 697 px): Kacheln kompakter, damit das Menue ohne Scrollen passt */
                      @media (max-height: 760px) {
                        ha-card { padding: 4px 6px 3px !important; }
                        #img-cell { width: 26px !important; height: 26px !important; margin-bottom: 3px !important; border-radius: 9px !important; }
                        #icon { width: 16px !important; height: 16px !important; }
                      }
                    styles: &menu_tile
                      card:
                        # 7/6 px statt 9/8 px: das Menue braucht die Hoehe fuer die
                        # zweite Technik-Reihe (Rechnung oben bei "More")
                        - padding: 7px 6px 6px
                        - border-radius: 14px
                        - background: var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))
                        - border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 34px
                        - height: 34px
                        - border-radius: 11px
                        # Farbe je Bereich ueber variables.farbe (var(--owlet-...)); ohne Farbe neutral
                        - background: "[[[ return variables.farbe ? 'color-mix(in srgb, ' + variables.farbe + ' 12%, transparent)' : 'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]"
                        - border: "[[[ return variables.farbe ? '1px solid color-mix(in srgb, ' + variables.farbe + ' 24%, transparent)' : '1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]"
                        - margin-bottom: 6px
                      icon:
                        - width: 19px
                        - height: 19px
                        - color: "[[[ return variables.farbe || 'var(--owlet-label, #b4c0cf)'; ]]]"
                        # Grundlinie aus: als inline-flex sitzt das Icon sonst ~0,6 px zu tief
                        - --ha-icon-display: block
                        # Glyphe mittig: variables.glyph ist die Mitte der Glyphe im 24er-Raster
                        # relativ zu (12, 12), gemessen an @mdi/js 7.4.47; verschoben wird um den
                        # Gegenwert, umgerechnet auf 19 px (nur ab 0,4 Einheiten eingetragen)
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 19 / 24}px, ${-g[1] * 19 / 24}px)`; ]]]'
                      name:
                        - font-size: 12px
                        - font-weight: 600
                        - color: 'var(--owlet-text, #f2f5f8)'
                  - type: custom:button-card
                    icon: mdi:car
                    name: Auto
                    variables: { farbe: 'var(--owlet-blau, #7fb3d5)', glyph: [0, 1] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:shield-home
                    name: Sicherheit
                    variables: { farbe: 'var(--owlet-blau, #7fb3d5)' }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/sicherheit }
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Draußen
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: *menu_kopf
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:grass
                    name: Garten
                    variables: { farbe: 'var(--owlet-limette, #bdd27f)' }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/garten }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:flower
                    name: Pflanzen
                    variables: { farbe: 'var(--owlet-limette, #bdd27f)', glyph: [0, -0.5] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:weather-partly-cloudy
                    name: Wetter
                    variables: { farbe: 'var(--owlet-limette, #bdd27f)', glyph: [-0.47, 0] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Freizeit
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: *menu_kopf
              - type: grid
                columns: 3
                square: false
                cards:
                  # Gesundheit: nur fuer einen Benutzer sichtbar (wie die View selbst)
                  - type: conditional
                    conditions:
                      - condition: user
                        users:
                          - benutzer_id_1
                    card:
                      type: custom:button-card
                      icon: mdi:heart-pulse
                      name: Gesundheit
                      variables: { farbe: 'var(--owlet-rose, #e6a0c4)' }
                      tap_action: { action: navigate, navigation_path: /dashboard-home/gesundheit }
                      styles: *menu_tile
                      extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:soccer
                    name: Fußball
                    variables: { farbe: 'var(--owlet-rose, #e6a0c4)' }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/fussball }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:airplane
                    name: Flüge
                    variables: { farbe: 'var(--owlet-rose, #e6a0c4)', glyph: [0.47, 0] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/fluege }
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Technik
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: *menu_kopf
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:home-automation
                    name: Homematic IP
                    variables: { farbe: 'var(--owlet-violett, #b399d4)', glyph: [0, -0.5] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/homematic-ip }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:router-network
                    name: Netzwerk
                    variables: { farbe: 'var(--owlet-violett, #b399d4)', glyph: [0, 4] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/netzwerk }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  # Glyphe von mdi:docker ist mittig (Begrenzung 2..22 x 4,83..19,17)
                  - type: custom:button-card
                    icon: mdi:docker
                    name: Docker
                    variables: { farbe: 'var(--owlet-violett, #b399d4)' }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/docker }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:zigbee
                    name: Zigbee
                    variables: { farbe: 'var(--owlet-violett, #b399d4)' }
                    tap_action: { action: navigate, navigation_path: /45df7312_zigbee2mqtt/ingress }
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Verwaltung
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: *menu_kopf
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:server
                    name: System
                    tap_action: { action: navigate, navigation_path: /dashboard-home/system }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:cog
                    name: Einstellungen
                    tap_action: { action: navigate, navigation_path: /config/dashboard }
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:hammer
                    name: Entwickler
                    tap_action: { action: navigate, navigation_path: /developer-tools/yaml }
                    styles: *menu_tile
                    extra_styles: *menu_extra
              # Neustart als schmale Zeile ueber die volle Breite (Aufbau wie die
              # Darstellungs-Knoepfe: Icon neben dem Text). Als vierte Kachel im
              # Raster brauchte Neustart eine eigene Kachelreihe.
              - type: custom:button-card
                icon: mdi:power
                name: Neustart
                variables: { glyph: [0, -0.5] }
                tap_action:
                  action: call-service
                  service: homeassistant.restart
                  service_data: {}
                  confirmation:
                    text: Home Assistant neustarten?
                styles:
                  card:
                    - padding: 8px 8px
                    - border-radius: 14px
                    - background: 'color-mix(in srgb, var(--owlet-rot, #f0736a) 12%, transparent)'
                    - border: '1px solid color-mix(in srgb, var(--owlet-rot, #f0736a) 24%, transparent)'
                    - box-shadow: none
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: min-content min-content
                    - justify-content: center
                    - align-items: center
                    - column-gap: 7px
                  icon:
                    - width: 18px
                    - height: 18px
                    - color: 'var(--owlet-rot, #f0736a)'
                    # wie menu_tile: Grundlinie aus, Glyphe mittig (variables.glyph)
                    - --ha-icon-display: block
                    - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 18 / 24}px, ${-g[1] * 18 / 24}px)`; ]]]'
                  name:
                    - font-size: 12px
                    - font-weight: 600
                    - color: 'var(--owlet-text, #f2f5f8)'
              - type: custom:button-card
                name: Darstellung
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles: *menu_kopf
              - type: grid
                columns: 3
                square: false
                cards:
                  # Darstellung fuer den angemeldeten Benutzer: System, Hell, Dunkel.
                  # browser_mod.set_theme setzt nur den Modus, das Theme bleibt wie im
                  # Profil gewaehlt. HA speichert die Wahl im Benutzerprofil, sie gilt also
                  # auf allen Geraeten dieses Benutzers. Danach schliesst das Popup; beim
                  # naechsten Oeffnen ist die neue Auswahl markiert (hass.selectedTheme.dark:
                  # undefined = System, false = Hell, true = Dunkel).
                  - type: custom:button-card
                    icon: mdi:theme-light-dark
                    name: System
                    variables: { modus: auto }
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: browser_mod.set_theme
                              data: { dark: auto }
                            - service: browser_mod.close_popup
                    styles: &theme_tile
                      card:
                        - padding: 8px 8px
                        - border-radius: 14px
                        - box-shadow: none
                        - background: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent)' : 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
                        - border: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? '1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : '1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: min-content min-content
                        - justify-content: center
                        - align-items: center
                        - column-gap: 7px
                      icon:
                        - width: 18px
                        - height: 18px
                        # Grundlinie aus (sonst ~2 px unter der Textmitte), Glyphe mittig wie menu_tile
                        - --ha-icon-display: block
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 18 / 24}px, ${-g[1] * 18 / 24}px)`; ]]]'
                        - color: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-label, #b4c0cf)'; ]]]
