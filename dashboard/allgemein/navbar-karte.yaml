# ============================================================================
# Navbar – schwebende Navigation unten
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       allgemein
# Status:        aktiv
# Karten:        button-card, navbar-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Floating Navbar im Nachtblau-Stil
# Variante A: aktiver Punkt = gruen getoente Icon-Kachel (wie die Icon-Kacheln
# im restlichen Dashboard). Inaktive Punkte gedaempft.
#
# Wichtig:
#   - Aeusserer Kartenrahmen wird transparent gemacht (sonst doppelter Wrapper).
#   - icon_color pro Route ENTFERNT -> Farben kommen komplett aus styles,
#     sonst ueberstimmt der Inline-icon_color das aktive Gruen.
#
# Voraussetzung: custom:navbar-card und custom:button-card (HACS), HACS-Integration
#   "browser_mod" fuer das More-Menue mit dem Darstellungs-Schalter.
type: custom:navbar-card
mobile:
  show_labels: true
  mode: floating
desktop:
  show_labels: true
  position: left
  min_width: 768
styles: |
  /* Farben aus dem Theme nachtblau (var(--nachtblau-...), Toenungen per color-mix);
     der zweite Wert in var() ist der dunkle Palettenwert ohne Theme. */
  /* Aeusseren Kartenrahmen entfernen -> nur die eine Nachtblau-Leiste bleibt.
     Aktiv-Farbe (--primary-color) auf Paletten-Gruen -> aktives Icon wird gruen. */
  :host {
    background: transparent !important;
    --primary-color: var(--nachtblau-gruen, #a6d49e) !important;
    --navbar-primary-color: var(--nachtblau-gruen, #a6d49e) !important;
  }
  /* navbar-card >= 1.7.2 gibt der mobilen schwebenden Leiste
     (.navbar-card.mobile.floating) einen Schatten aus --ha-box-shadow-s;
     die Regel ist spezifischer als ha-card/.navbar-card und zeichnete
     eine zweite Leiste in der Nachtblau-Huelle. Hier mit aufgefuehrt, damit
     nur die Huelle (.navbar) sichtbar bleibt. */
  ha-card,
  .navbar-card,
  .navbar-card.mobile.floating {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    --ha-card-background: transparent !important;
    --card-mod-background: transparent !important;
  }
  /* Die eigentliche schwebende Leiste = Nachtblau-Huelle */
  .navbar {
    background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 26px !important;
    box-shadow: 0 22px 50px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
    --primary-color: var(--nachtblau-gruen, #a6d49e) !important;
    /* etwas Luft, damit erster/letzter Punkt nicht an die runden Ecken stoesst */
    padding-left: 10px !important;
    padding-right: 10px !important;
  }
  /* Mobile Leiste: navbar-card 1.7.2 setzt sie fest auf bottom: 0 und rechnet
     den Sicherheitsabstand nur mit mobile.safe_area ein (Standard aus, hier nicht gesetzt).
     iPhone (WebKit): buendig am unteren Rand, der Home-Indikator liegt darueber.
     Andere (Android): um --safe-area-inset-bottom anheben. Die App gibt den
     Abstand ab 2026.8.3 weiter (randlos); vorher ist er 0, nichts aendert sich.
     box-sizing: navbar-card setzt width: 100vw ohne border-box -> Padding und
     Rahmen oben machten die Leiste 22px breiter als den Bildschirm (rechts
     abgeschnitten). Mit border-box ist sie genau bildschirmbreit. */
  .navbar.mobile {
    bottom: 0 !important;
    box-sizing: border-box !important;
  }
  @supports not (-webkit-touch-callout: none) {
    .navbar.mobile { bottom: var(--safe-area-inset-bottom, 0px) !important; }
  }
  /* Jeder Punkt: Icon + Label gedaempft */
  .route .button {
    border-radius: 14px !important;
  }
  .route ha-icon,
  .route .icon {
    color: var(--nachtblau-text-sekundaer, #8794a5) !important;
  }
  .route .label {
    color: var(--nachtblau-text-sekundaer, #8794a5) !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.01em !important;
  }
  /* Aktiver Punkt: gruen getoente Kachel + gruenes Icon/Label */
  .route.active .button,
  .route[data-active="true"] .button,
  .button.active {
    background: color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 16%, transparent) !important;
    border: 1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent) !important;
    /* Feste, kompakte Groesse + zentriert -> umschliesst nur das Icon,
       keine Ueberlappung mit Nachbarn oder Rand */
    box-sizing: border-box !important;
    flex: 0 0 auto !important;
    width: 46px !important;
    min-width: 46px !important;
    max-width: 46px !important;
    height: 40px !important;
    padding: 0 !important;
    margin: 0 auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .route.active ha-icon,
  .route[data-active="true"] ha-icon,
  .button.active ha-icon,
  .route.active .icon,
  .button.active .icon {
    color: var(--nachtblau-gruen, #a6d49e) !important;
  }
  .route.active .label,
  .route[data-active="true"] .label,
  .button.active .label {
    color: var(--nachtblau-gruen, #a6d49e) !important;
    font-weight: 700 !important;
  }
  /* "More"-Popup: Nachtblau-Hintergrund (Layout steuert navbar-card selbst) */
  .navbar-popup,
  .popup {
    background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 22px !important;
    box-shadow: 0 22px 50px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
  }
  .navbar-popup ha-icon,
  .popup ha-icon {
    color: var(--nachtblau-text, #f2f5f8) !important;
  }
routes:
  - url: /dashboard-home/home
    icon: mdi:home-assistant
    icon_selected: mdi:home-assistant
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/home
  - url: /dashboard-home/lichter-fenster-temp
    icon: bi:house-gear
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/lichter-fenster-temp
  - url: /dashboard-home/energie
    icon: fa6-solid:plug-circle-bolt
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/energie
  - url: /dashboard-home/heizung
    icon: phu:thermostat-v2
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/heizung
  - url: /dashboard-home/hausgerate
    icon: mdi:washing-machine
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/hausgerate
  # "More" oeffnet ein Nachtblau-Menue via browser_mod.popup, gegliedert in
  # Bereiche: Zuhause, Draussen, Freizeit, Technik, Verwaltung, Darstellung
  # (System, Hell, Dunkel) und am Ende der Knopf "Home Assistant neu starten".
  # Bisherige Staende: 19.10.2026 Garten und System dazu; 20.10.2026
  # Sicherheit (Zuhause), Wetter unter "Draussen"; 21.10.2026 Docker unter
  # Technik; 02.11.2026 Stand der Instanz mit Gaming und vier Spalten.
  # Seit 02.11.2026 als App-Raster (Entwurf, Messung und die verworfenen
  # Varianten: more-menue.html):
  #   - Alle Raster mit vier Spalten. Die Kachel hat keinen eigenen Rahmen
  #     mehr, die Icon-Kachel (42 px, Toenung 0,16, Rand 0,24 wie in DESIGN.md)
  #     traegt die Bereichsfarbe, die Ueberschrift einen Farbpunkt. Vorher
  #     wechselten 3 und 4 Spalten (Kachel am iPhone 123 bzw. 91 px breit), die
  #     Icon-Kachel war 34 px gross und mit 0,12 getoent.
  #   - Die aktuelle Ansicht hat einen gruenen Punkt und die Unterkachel als
  #     Grund, passend zur gruenen Markierung in der Leiste. Verglichen wird
  #     window.location.pathname mit variables.pfad, auch fuer Unterseiten
  #     (/dashboard-gaming/wow zaehlt zu /dashboard-gaming).
  #   - Darstellung ist ein Umschalter: ein Rahmen mit drei Segmenten, damit
  #     die Auswahl nicht wie ein Sprungziel aussieht.
  #   - Neustart ist keine Kachel: Er oeffnet keinen Bereich, sondern loest eine
  #     kritische Aktion aus. Deshalb ein Textknopf ganz unten, durch eine Linie
  #     abgesetzt, mit einem Verb als Beschriftung, roter Schrift und rotem Rand
  #     ohne rote Flaeche (rote Schrift auf Toenung 0,12 hielte nur 4,37:1,
  #     DESIGN.md) und einer Rueckfrage, die die Folge nennt (wie der
  #     Container-Neustart in docker-templates.yaml).
  #   - Hoehe im HTML-Nachbau bei 360 x 697 px (Galaxy S25): 613 von 629 px
  #     unter dem Dialogkopf, ohne die fruehere Verkleinerung per
  #     @media (max-height: 760px). Im Geraet nachmessen.
  # Aufruf als Browser-Call (fire-dom-event): Das Popup oeffnet nur im
  # aktuellen Browser. Als call-service ohne browser_id oeffnete browser_mod
  # es laut Doku auf allen registrierten Browsern.
  # Farben ueber die Theme-Variablen (var(--nachtblau-...), Toenungen per
  # color-mix), damit das Menue hell und dunkel kann; der zweite Wert in
  # var() ist der dunkle Palettenwert und gilt ohne Theme "nachtblau".
  # Voraussetzung: HACS-Integration "browser_mod".
  - icon: mdi:dots-horizontal
    label: More
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Menü
          # Dialog-Oberflaeche aus dem Theme (dunkel Nachtblau statt Schwarz).
          # Rasterabstand 2 px: vier Spalten bei 360 px Breite geben so 84 statt
          # 81 px je Zelle, "Einstellungen" passt einzeilig.
          style: |
            --mdc-theme-surface: var(--nachtblau-huelle-oben, #1b2231);
            --ha-card-background: var(--nachtblau-huelle-oben, #1b2231);
            --card-background-color: var(--nachtblau-huelle-oben, #1b2231);
            --primary-background-color: var(--nachtblau-seite, #171d29);
            --secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);
            --primary-text-color: var(--nachtblau-text, #f2f5f8);
            --secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);
            --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
            --vertical-stack-card-gap: 6px;
            --grid-card-gap: 2px;
          content:
            type: vertical-stack
            cards:
              # Ueberschrift je Bereich: klein, Versalien, Label-Grau, davor ein
              # Punkt in der Bereichsfarbe (variables.farbe; ohne Farbe Muted, nur
              # Dekoration). Keine Aktion, nur Text.
              - type: custom:button-card
                name: Zuhause
                show_icon: false
                variables: { farbe: 'var(--nachtblau-blau, #7fb3d5)' }
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: &menu_kopf_extra |
                  #name::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; background: var(--menu-farbe); }
                styles: &menu_kopf
                  card:
                    - padding: 2px 6px 0
                    - background: none
                    - border: none
                    - box-shadow: none
                    - --menu-farbe: "[[[ return variables.farbe || 'var(--nachtblau-muted, #6e7988)'; ]]]"
                  grid:
                    - grid-template-areas: '"n"'
                  name:
                    - justify-self: start
                    - display: flex
                    - align-items: center
                    - gap: 7px
                    - font-size: 11px
                    - font-weight: 700
                    - letter-spacing: 0.07em
                    - text-transform: uppercase
                    - color: 'var(--nachtblau-label, #b4c0cf)'
              - type: grid
                columns: 4
                square: false
                cards:
                  # Ziel-Kachel: Farbe je Bereich ueber variables.farbe (ohne Farbe
                  # neutral), Sprungziel ueber variables.pfad (auch fuer die
                  # Markierung der aktuellen Ansicht).
                  - type: custom:button-card
                    icon: mdi:cctv
                    name: Kamera
                    variables: { farbe: 'var(--nachtblau-blau, #7fb3d5)', pfad: /dashboard-home/kamera }
                    tap_action: &menu_ziel { action: navigate, navigation_path: '[[[ return variables.pfad; ]]]' }
                    extra_styles: &menu_extra |
                      /* Punkt "aktuelle Ansicht" rechts oben neben der Icon-Kachel (42 px breit,
                         rechte Kante bei 50 % + 21 px); sichtbar ueber --menu-hier aus styles.card */
                      ha-card::after { content: ""; position: absolute; top: 2px; left: calc(50% + 21px); width: 7px; height: 7px; border-radius: 50%; background: var(--nachtblau-gruen, #a6d49e); box-shadow: 0 0 0 3px color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 18%, transparent); opacity: var(--menu-hier, 0%); pointer-events: none; }
                    styles: &menu_tile
                      card:
                        - position: relative
                        - padding: 3px 0
                        - border-radius: 16px
                        - box-shadow: none
                        # 100 % in der aktuellen Ansicht, sonst 0 %: schaltet Punkt, Grund und Rand
                        - --menu-hier: "[[[ const p = window.location.pathname, z = variables.pfad || ''; return z && (p === z || p.startsWith(z + '/')) ? '100%' : '0%'; ]]]"
                        - background: 'color-mix(in srgb, var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) var(--menu-hier), transparent)'
                        - border: '1px solid color-mix(in srgb, var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) var(--menu-hier), transparent)'
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 42px
                        - height: 42px
                        - border-radius: 13px
                        - background: "[[[ return variables.farbe ? 'color-mix(in srgb, ' + variables.farbe + ' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]"
                        - border: "[[[ return variables.farbe ? '1px solid color-mix(in srgb, ' + variables.farbe + ' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]"
                        - margin-bottom: 5px
                      icon:
                        - width: 24px
                        - height: 24px
                        - color: "[[[ return variables.farbe || 'var(--nachtblau-label, #b4c0cf)'; ]]]"
                        # Grundlinie aus: als inline-flex sitzt das Icon sonst ~0,6 px zu tief
                        - --ha-icon-display: block
                        # Glyphe mittig: variables.glyph ist die Mitte der Glyphe im 24er-Raster
                        # relativ zu (12, 12), gemessen an @mdi/js 7.4.47; verschoben wird um den
                        # Gegenwert, bei 24 px ist eine Rastereinheit 1 px (nur ab 0,4 Einheiten eingetragen)
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0]}px, ${-g[1]}px)`; ]]]'
                      name:
                        - font-size: 12px
                        - font-weight: 600
                        - color: 'var(--nachtblau-titel, #e7ecf3)'
                        # bis zu zwei Zeilen statt abgeschnitten (DESIGN.md, "Text")
                        - max-width: 100%
                        - white-space: normal
                        - overflow: hidden
                        - display: -webkit-box
                        - -webkit-box-orient: vertical
                        - -webkit-line-clamp: 2
                        - text-wrap: balance
                  - type: custom:button-card
                    icon: mdi:car
                    name: Auto
                    variables: { farbe: 'var(--nachtblau-blau, #7fb3d5)', pfad: /dashboard-home/auto, glyph: [0, 1] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:shield-home
                    name: Sicherheit
                    variables: { farbe: 'var(--nachtblau-blau, #7fb3d5)', pfad: /dashboard-home/sicherheit }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Draußen
                show_icon: false
                variables: { farbe: 'var(--nachtblau-limette, #bdd27f)' }
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: *menu_kopf_extra
                styles: *menu_kopf
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:grass
                    name: Garten
                    variables: { farbe: 'var(--nachtblau-limette, #bdd27f)', pfad: /dashboard-home/garten }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:flower
                    name: Pflanzen
                    variables: { farbe: 'var(--nachtblau-limette, #bdd27f)', pfad: /dashboard-home/pflanzen, glyph: [0, -0.5] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:weather-partly-cloudy
                    name: Wetter
                    variables: { farbe: 'var(--nachtblau-limette, #bdd27f)', pfad: /dashboard-home/wetter, glyph: [-0.47, 0] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Freizeit
                show_icon: false
                variables: { farbe: 'var(--nachtblau-rose, #e6a0c4)' }
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: *menu_kopf_extra
                styles: *menu_kopf
              - type: grid
                columns: 4
                square: false
                cards:
                  # Gesundheit: nur fuer einen Benutzer sichtbar (wie die View selbst)
                  - type: conditional
                    conditions:
                      - condition: user
                        users:
                          - benutzer_id_1
                    card:
                      type: custom:button-card
                      icon: mdi:heart-pulse
                      name: Gesundheit
                      variables: { farbe: 'var(--nachtblau-rose, #e6a0c4)', pfad: /dashboard-home/gesundheit }
                      tap_action: *menu_ziel
                      styles: *menu_tile
                      extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:soccer
                    name: Fußball
                    variables: { farbe: 'var(--nachtblau-rose, #e6a0c4)', pfad: /dashboard-home/fussball }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:airplane
                    name: Flüge
                    variables: { farbe: 'var(--nachtblau-rose, #e6a0c4)', pfad: /dashboard-home/fluege, glyph: [0.47, 0] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  # Glyphe von mdi:gamepad-variant ist mittig (Begrenzung 1..23 x 6..18)
                  - type: custom:button-card
                    icon: mdi:gamepad-variant
                    name: Gaming
                    variables: { farbe: 'var(--nachtblau-rose, #e6a0c4)', pfad: /dashboard-gaming }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Technik
                show_icon: false
                variables: { farbe: 'var(--nachtblau-violett, #b399d4)' }
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: *menu_kopf_extra
                styles: *menu_kopf
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:home-automation
                    name: Homematic
                    variables: { farbe: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-home/homematic-ip, glyph: [0, -0.5] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:router-network
                    name: Netzwerk
                    variables: { farbe: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-home/netzwerk, glyph: [0, 4] }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  # Glyphe von mdi:docker ist mittig (Begrenzung 2..22 x 4,83..19,17)
                  - type: custom:button-card
                    icon: mdi:docker
                    name: Docker
                    variables: { farbe: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-home/docker }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:zigbee
                    name: Zigbee
                    variables: { farbe: 'var(--nachtblau-violett, #b399d4)', pfad: /45df7312_zigbee2mqtt/ingress }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Verwaltung
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: *menu_kopf_extra
                styles: *menu_kopf
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:server
                    name: System
                    variables: { pfad: /dashboard-home/system }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  # Weiche Trennstelle (­): bricht nur, wenn das Wort nicht in die Zelle passt
                  - type: custom:button-card
                    icon: mdi:cog
                    name: "Einstel­lungen"
                    variables: { pfad: /config/dashboard }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
                  - type: custom:button-card
                    icon: mdi:hammer
                    name: Werkzeuge
                    variables: { pfad: /config/tools/yaml }
                    tap_action: *menu_ziel
                    styles: *menu_tile
                    extra_styles: *menu_extra
              - type: custom:button-card
                name: Darstellung
                show_icon: false
                tap_action: { action: none }
                hold_action: { action: none }
                extra_styles: *menu_kopf_extra
                styles: *menu_kopf
              # Darstellung fuer den angemeldeten Benutzer: System, Hell, Dunkel, als
              # Umschalter (ein Rahmen, drei Segmente). browser_mod.set_theme setzt nur
              # den Modus, das Theme bleibt wie im Profil gewaehlt. HA speichert die Wahl
              # im Benutzerprofil, sie gilt also auf allen Geraeten dieses Benutzers.
              # Danach schliesst das Popup; beim naechsten Oeffnen ist die neue Auswahl
              # markiert (hass.selectedTheme.dark: undefined = System, false = Hell,
              # true = Dunkel).
              # Die Segmente sind eingebettete button-cards (custom_fields mit card:).
              # Deren JS-Templates wertet button-card im Kontext dieser aeusseren Karte
              # aus (siehe docker-templates.yaml), variables der Segmente waeren dort
              # nicht sichtbar. Deshalb nennt jedes Segment seinen Modus im Template
              # selbst und setzt nur --menu-an (100 % gewaehlt, sonst 0 %); Farben und
              # Masse teilen sich die Segmente ueber Anker.
              - type: custom:button-card
                show_icon: false
                show_name: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles:
                  card:
                    - padding: 3px
                    - border-radius: 14px
                    - box-shadow: none
                    - background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))
                    - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
                  grid:
                    - grid-template-areas: '"system hell dunkel"'
                    - grid-template-columns: repeat(3, minmax(0, 1fr))
                    - column-gap: 3px
                  custom_fields:
                    system: &seg_feld
                      - min-width: 0
                    hell: *seg_feld
                    dunkel: *seg_feld
                custom_fields:
                  system:
                    card:
                      type: custom:button-card
                      icon: mdi:theme-light-dark
                      name: System
                      tap_action:
                        action: fire-dom-event
                        browser_mod:
                          service: browser_mod.sequence
                          data:
                            sequence:
                              - service: browser_mod.set_theme
                                data: { dark: auto }
                              - service: browser_mod.close_popup
                      hold_action: { action: none }
                      styles:
                        card:
                          - --menu-an: "[[[ const d = (hass.selectedTheme || {}).dark; return d !== true && d !== false ? '100%' : '0%'; ]]]"
                          - height: 38px
                          - padding: 0 6px
                          - border-radius: 11px
                          - box-shadow: none
                          - background: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.16), transparent)'
                          - border: '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.24), transparent)'
                        grid: &seg_grid
                          - grid-template-areas: '"i n"'
                          - grid-template-columns: min-content min-content
                          - justify-content: center
                          - align-items: center
                          - column-gap: 7px
                        icon: &seg_icon
                          - width: 18px
                          - height: 18px
                          - color: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) var(--menu-an), var(--nachtblau-label, #b4c0cf))'
                          # Grundlinie aus (sonst ~2 px unter der Textmitte); Glyphe mittig
                          # ueber --menu-glyph-y (nur Dunkel: 0,49 Einheiten bei 18 px)
                          - --ha-icon-display: block
                          - transform: translateY(var(--menu-glyph-y, 0px))
                        name: &seg_name
                          - font-size: 13px
                          - font-weight: 600
                          - color: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) var(--menu-an), var(--nachtblau-label, #b4c0cf))'
                  hell:
                    card:
                      type: custom:button-card
                      icon: mdi:white-balance-sunny
                      name: Hell
                      tap_action:
                        action: fire-dom-event
                        browser_mod:
                          service: browser_mod.sequence
                          data:
                            sequence:
                              - service: browser_mod.set_theme
                                data: { dark: light }
                              - service: browser_mod.close_popup
                      hold_action: { action: none }
                      styles:
                        card:
                          - --menu-an: "[[[ return (hass.selectedTheme || {}).dark === false ? '100%' : '0%'; ]]]"
                          - height: 38px
                          - padding: 0 6px
                          - border-radius: 11px
                          - box-shadow: none
                          - background: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.16), transparent)'
                          - border: '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.24), transparent)'
                        grid: *seg_grid
                        icon: *seg_icon
                        name: *seg_name
                  dunkel:
                    card:
                      type: custom:button-card
                      icon: mdi:weather-night
                      name: Dunkel
                      tap_action:
                        action: fire-dom-event
                        browser_mod:
                          service: browser_mod.sequence
                          data:
                            sequence:
                              - service: browser_mod.set_theme
                                data: { dark: dark }
                              - service: browser_mod.close_popup
                      hold_action: { action: none }
                      styles:
                        card:
                          - --menu-an: "[[[ return (hass.selectedTheme || {}).dark === true ? '100%' : '0%'; ]]]"
                          - --menu-glyph-y: 0.37px
                          - height: 38px
                          - padding: 0 6px
                          - border-radius: 11px
                          - box-shadow: none
                          - background: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.16), transparent)'
                          - border: '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) calc(var(--menu-an) * 0.24), transparent)'
                        grid: *seg_grid
                        icon: *seg_icon
                        name: *seg_name
              # Trennlinie: setzt den Neustart von Navigation und Darstellung ab
              - type: custom:button-card
                show_icon: false
                show_name: false
                tap_action: { action: none }
                hold_action: { action: none }
                styles:
                  card:
                    - height: 1px
                    - padding: 0
                    - margin: 2px 0
                    - border: none
                    - border-radius: 0
                    - box-shadow: none
                    - background: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
              # Neustart: Aktion, kein Ziel (Begruendung oben bei "More"). Rote Schrift
              # auf dem Huellengrund haelt dunkel mindestens 5,5:1, hell 5,49:1.
              - type: custom:button-card
                icon: mdi:power
                name: Home Assistant neu starten
                variables: { glyph: [0, -0.5] }
                tap_action:
                  action: call-service
                  service: homeassistant.restart
                  service_data: {}
                  confirmation:
                    text: 'Home Assistant neu starten? Dashboard und Gerätesteuerung sind dabei kurz nicht erreichbar, Automationen laufen erst danach wieder.'
                hold_action: { action: none }
                styles:
                  card:
                    - height: 40px
                    - padding: 0 12px
                    - border-radius: 14px
                    - box-shadow: none
                    - background: none
                    - border: '1px solid color-mix(in srgb, var(--nachtblau-rot, #f0736a) 24%, transparent)'
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: min-content min-content
                    - justify-content: center
                    - align-items: center
                    - column-gap: 8px
                  icon:
                    - width: 18px
                    - height: 18px
                    - color: 'var(--nachtblau-rot, #f0736a)'
                    # wie menu_tile: Grundlinie aus, Glyphe mittig (variables.glyph, 18 px)
                    - --ha-icon-display: block
                    - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 18 / 24}px, ${-g[1] * 18 / 24}px)`; ]]]'
                  name:
                    - font-size: 13px
                    - font-weight: 600
                    - white-space: nowrap
                    - color: 'var(--nachtblau-rot, #f0736a)'
