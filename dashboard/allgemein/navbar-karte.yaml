# ============================================================================
# Navbar – schwebende Navigation unten
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       allgemein
# Status:        aktiv
# Karten:        button-card, navbar-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Floating Navbar im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Variante A: aktiver Punkt = gruen getoente Icon-Kachel (wie die Icon-Kacheln
# im restlichen Dashboard). Inaktive Punkte gedaempft.
#
# Wichtig:
#   - Aeusserer Kartenrahmen wird transparent gemacht (sonst doppelter Wrapper).
#   - icon_color pro Route ENTFERNT -> Farben kommen komplett aus styles,
#     sonst ueberstimmt der Inline-icon_color das aktive Gruen.
#
# Voraussetzung: custom:navbar-card und custom:button-card (HACS), HACS-Integration
#   "browser_mod" fuer das More-Menue mit dem Darstellungs-Schalter.
type: custom:navbar-card
mobile:
  show_labels: true
  mode: floating
desktop:
  show_labels: true
  position: left
  min_width: 768
styles: |
  /* Farben aus dem Theme owlet (var(--owlet-...), Toenungen per color-mix);
     der zweite Wert in var() ist der dunkle Palettenwert ohne Theme. */
  /* Aeusseren Kartenrahmen entfernen -> nur die eine Owlet-Leiste bleibt.
     Aktiv-Farbe (--primary-color) auf Owlet-Gruen -> aktives Icon wird gruen. */
  :host {
    background: transparent !important;
    --primary-color: var(--owlet-gruen, #a6d49e) !important;
    --navbar-primary-color: var(--owlet-gruen, #a6d49e) !important;
  }
  ha-card,
  .navbar-card {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    --ha-card-background: transparent !important;
    --card-mod-background: transparent !important;
  }
  /* Die eigentliche schwebende Leiste = Owlet-Huelle */
  .navbar {
    background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 26px !important;
    box-shadow: 0 22px 50px -20px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
    --primary-color: var(--owlet-gruen, #a6d49e) !important;
    /* etwas Luft, damit erster/letzter Punkt nicht an die runden Ecken stoesst */
    padding-left: 10px !important;
    padding-right: 10px !important;
  }
  /* navbar-card >= 1.7.0 hebt die mobile Leiste um --safe-area-inset-bottom
     an (iPhone: Home-Indikator, ca. 34px). Leiste wieder buendig an den
     unteren Bildschirmrand setzen.
     box-sizing: navbar-card setzt width: 100vw ohne border-box -> Padding und
     Rahmen oben machten die Leiste 22px breiter als den Bildschirm (rechts
     abgeschnitten). Mit border-box ist sie genau bildschirmbreit. */
  .navbar.mobile {
    bottom: 0 !important;
    box-sizing: border-box !important;
  }
  /* Jeder Punkt: Icon + Label gedaempft */
  .route .button {
    border-radius: 14px !important;
  }
  .route ha-icon,
  .route .icon {
    color: var(--owlet-text-sekundaer, #8794a5) !important;
  }
  .route .label {
    color: var(--owlet-text-sekundaer, #8794a5) !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.01em !important;
  }
  /* Aktiver Punkt: gruen getoente Kachel + gruenes Icon/Label */
  .route.active .button,
  .route[data-active="true"] .button,
  .button.active {
    background: color-mix(in srgb, var(--owlet-gruen, #a6d49e) 16%, transparent) !important;
    border: 1px solid color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent) !important;
    /* Feste, kompakte Groesse + zentriert -> umschliesst nur das Icon,
       keine Ueberlappung mit Nachbarn oder Rand */
    box-sizing: border-box !important;
    flex: 0 0 auto !important;
    width: 46px !important;
    min-width: 46px !important;
    max-width: 46px !important;
    height: 40px !important;
    padding: 0 !important;
    margin: 0 auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .route.active ha-icon,
  .route[data-active="true"] ha-icon,
  .button.active ha-icon,
  .route.active .icon,
  .button.active .icon {
    color: var(--owlet-gruen, #a6d49e) !important;
  }
  .route.active .label,
  .route[data-active="true"] .label,
  .button.active .label {
    color: var(--owlet-gruen, #a6d49e) !important;
    font-weight: 700 !important;
  }
  /* "More"-Popup: Owlet-Hintergrund (Layout steuert navbar-card selbst) */
  .navbar-popup,
  .popup {
    background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
    border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
    border-radius: 22px !important;
    box-shadow: 0 22px 50px -20px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
  }
  .navbar-popup ha-icon,
  .popup ha-icon {
    color: var(--owlet-text, #f2f5f8) !important;
  }
routes:
  - url: /dashboard-home/home
    icon: mdi:home-assistant
    icon_selected: mdi:home-assistant
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/home
  - url: /dashboard-home/lichter-fenster-temp
    icon: bi:house-gear
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/lichter-fenster-temp
  - url: /dashboard-home/energie
    icon: fa6-solid:plug-circle-bolt
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/energie
  - url: /dashboard-home/heizung
    icon: phu:thermostat-v2
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/heizung
  - url: /dashboard-home/hausgerate
    icon: mdi:washing-machine
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/hausgerate
  # "More" oeffnet ein Owlet-Raster-Menue via browser_mod.popup, darunter
  # den Schalter fuer die Darstellung (System, Hell, Dunkel).
  # Aufruf als Browser-Call (fire-dom-event): Das Popup oeffnet nur im
  # aktuellen Browser. Als call-service ohne browser_id oeffnete browser_mod
  # es laut Doku auf allen registrierten Browsern.
  # Farben ueber die Theme-Variablen (var(--owlet-...), Toenungen per
  # color-mix), damit das Menue hell und dunkel kann; der zweite Wert in
  # var() ist der dunkle Palettenwert und gilt ohne Theme "owlet".
  # Voraussetzung: HACS-Integration "browser_mod".
  - icon: mdi:dots-horizontal
    label: More
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Menü
          # Dialog-Oberflaeche aus dem Theme (dunkel Owlet-Navy statt Schwarz)
          style: |
            --mdc-theme-surface: var(--owlet-huelle-oben, #1b2231);
            --ha-card-background: var(--owlet-huelle-oben, #1b2231);
            --card-background-color: var(--owlet-huelle-oben, #1b2231);
            --primary-background-color: var(--owlet-seite, #171d29);
            --secondary-background-color: var(--owlet-huelle-oben, #1b2231);
            --primary-text-color: var(--owlet-text, #f2f5f8);
            --secondary-text-color: var(--owlet-text-sekundaer, #8794a5);
            --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
          content:
            type: vertical-stack
            cards:
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    icon: mdi:cctv
                    name: Kamera
                    tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
                    styles: &menu_tile
                      card:
                        - padding: 14px 8px 12px
                        - border-radius: 16px
                        - background: var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))
                        - border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 42px
                        - height: 42px
                        - border-radius: 13px
                        - background: 'color-mix(in srgb, var(--owlet-gruen, #a6d49e) 12%, transparent)'
                        - border: '1px solid color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent)'
                        - margin-bottom: 9px
                      icon:
                        - width: 22px
                        - height: 22px
                        - color: 'var(--owlet-gruen, #a6d49e)'
                        # Grundlinie aus: als inline-flex sitzt das Icon sonst ~0,6 px zu tief
                        - --ha-icon-display: block
                        # Glyphe mittig: variables.glyph ist die Mitte der Glyphe im 24er-Raster
                        # relativ zu (12, 12), gemessen an @mdi/js 7.4.47; verschoben wird um den
                        # Gegenwert, umgerechnet auf 22 px (nur ab 0,4 Einheiten eingetragen)
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 22 / 24}px, ${-g[1] * 22 / 24}px)`; ]]]'
                      name:
                        - font-size: 12.5px
                        - font-weight: 600
                        - color: 'var(--owlet-text, #f2f5f8)'
                  - type: custom:button-card
                    icon: mdi:flower
                    name: Pflanzen
                    variables: { glyph: [0, -0.5] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:weather-partly-cloudy
                    name: Wetter
                    variables: { glyph: [-0.47, 0] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:car
                    name: Auto
                    variables: { glyph: [0, 1] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:home-automation
                    name: Homematic IP
                    variables: { glyph: [0, -0.5] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/homematic-ip }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:router-network
                    name: Netzwerk
                    variables: { glyph: [0, 4] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/netzwerk }
                    styles: *menu_tile
                  # Gesundheit: nur fuer einen Benutzer sichtbar (wie die View selbst)
                  - type: conditional
                    conditions:
                      - condition: user
                        users:
                          - benutzer_id_1
                    card:
                      type: custom:button-card
                      icon: mdi:heart-pulse
                      name: Gesundheit
                      tap_action: { action: navigate, navigation_path: /dashboard-home/gesundheit }
                      styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:soccer
                    name: Fußball
                    tap_action: { action: navigate, navigation_path: /dashboard-home/fussball }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:airplane
                    name: Flüge
                    variables: { glyph: [0.47, 0] }
                    tap_action: { action: navigate, navigation_path: /dashboard-home/fluege }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:zigbee
                    name: Zigbee
                    tap_action: { action: navigate, navigation_path: /45df7312_zigbee2mqtt/ingress }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:cog
                    name: Einstellungen
                    tap_action: { action: navigate, navigation_path: /config/dashboard }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:hammer
                    name: Entwickler
                    tap_action: { action: navigate, navigation_path: /developer-tools/yaml }
                    styles: *menu_tile
                  - type: custom:button-card
                    icon: mdi:power
                    name: Neustart
                    variables: { glyph: [0, -0.5] }
                    tap_action:
                      action: call-service
                      service: homeassistant.restart
                      service_data: {}
                      confirmation:
                        text: Home Assistant neustarten?
                    styles:
                      card:
                        - padding: 14px 8px 12px
                        - border-radius: 16px
                        - background: 'color-mix(in srgb, var(--owlet-rot, #f0736a) 12%, transparent)'
                        - border: '1px solid color-mix(in srgb, var(--owlet-rot, #f0736a) 24%, transparent)'
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: min-content min-content
                        - justify-items: center
                      img_cell:
                        - width: 42px
                        - height: 42px
                        - border-radius: 13px
                        - background: 'color-mix(in srgb, var(--owlet-rot, #f0736a) 12%, transparent)'
                        - border: '1px solid color-mix(in srgb, var(--owlet-rot, #f0736a) 24%, transparent)'
                        - margin-bottom: 9px
                      icon:
                        - width: 22px
                        - height: 22px
                        - color: 'var(--owlet-rot, #f0736a)'
                        # wie menu_tile: Grundlinie aus, Glyphe mittig (variables.glyph)
                        - --ha-icon-display: block
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 22 / 24}px, ${-g[1] * 22 / 24}px)`; ]]]'
                      name:
                        - font-size: 12.5px
                        - font-weight: 600
                        - color: 'var(--owlet-text, #f2f5f8)'
              - type: grid
                columns: 3
                square: false
                cards:
                  # Darstellung fuer den angemeldeten Benutzer: System, Hell, Dunkel.
                  # browser_mod.set_theme setzt nur den Modus, das Theme bleibt wie im
                  # Profil gewaehlt. HA speichert die Wahl im Benutzerprofil, sie gilt also
                  # auf allen Geraeten dieses Benutzers. Danach schliesst das Popup; beim
                  # naechsten Oeffnen ist die neue Auswahl markiert (hass.selectedTheme.dark:
                  # undefined = System, false = Hell, true = Dunkel).
                  - type: custom:button-card
                    icon: mdi:theme-light-dark
                    name: System
                    variables: { modus: auto }
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: browser_mod.set_theme
                              data: { dark: auto }
                            - service: browser_mod.close_popup
                    styles: &theme_tile
                      card:
                        - padding: 10px 8px
                        - border-radius: 14px
                        - box-shadow: none
                        - background: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? 'color-mix(in srgb, var(--owlet-blau, #7fb3d5) 12%, transparent)' : 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
                        - border: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? '1px solid color-mix(in srgb, var(--owlet-blau, #7fb3d5) 24%, transparent)' : '1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: min-content min-content
                        - justify-content: center
                        - align-items: center
                        - column-gap: 7px
                      icon:
                        - width: 18px
                        - height: 18px
                        # Grundlinie aus (sonst ~2 px unter der Textmitte), Glyphe mittig wie menu_tile
                        - --ha-icon-display: block
                        - transform: '[[[ const g = variables.glyph || [0, 0]; return `translate(${-g[0] * 18 / 24}px, ${-g[1] * 18 / 24}px)`; ]]]'
                        - color: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-label, #b4c0cf)'; ]]]
                      name:
                        - font-size: 12.5px
                        - font-weight: 600
                        - color: |
                            [[[ const d = (hass.selectedTheme || {}).dark, m = d === true ? 'dark' : d === false ? 'light' : 'auto';
                                return m === variables.modus ? 'var(--owlet-blau, #7fb3d5)' : 'var(--owlet-label, #b4c0cf)'; ]]]
                  - type: custom:button-card
                    icon: mdi:white-balance-sunny
                    name: Hell
                    variables: { modus: light }
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: browser_mod.set_theme
                              data: { dark: light }
                            - service: browser_mod.close_popup
                    styles: *theme_tile
                  - type: custom:button-card
                    icon: mdi:weather-night
                    name: Dunkel
                    variables: { modus: dark, glyph: [0, -0.49] }
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: browser_mod.set_theme
                              data: { dark: dark }
                            - service: browser_mod.close_popup
                    styles: *theme_tile
