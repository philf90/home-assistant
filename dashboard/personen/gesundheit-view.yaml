      yaxis:
      - apex_config:
          labels:
            formatter: EVAL:function(v){ return (v===null||v===undefined)?'':Number(v).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0}); }
          tickAmount: 4
        decimals: 0
        min: 0
        # Weiches Maximum der Karte: mindestens 10.000, darueber der Datenhoechstwert. Ein max in
        # apex_config uebergeht die Karte (am iPhone blieben die Marken 2.437/4.874/.../9.748).
        max: ~10000
