      card_mod:
        style: |
          ha-card {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
          }
          /* ApexCharts 5.3.3 setzt am Legendentext padding-left:15px + margin-left:-15px (Text liegt ueber dem Punkt).
             Beides neutralisieren und echten Abstand zum Farbpunkt setzen. */
          .apexcharts-legend-text {
            margin-left: 0 !important;
            padding-left: 6px !important;
          }
          /* Farben je Modus (apexcharts-card zeichnet beim Wechsel nicht neu):
             Serien nach Index, Legende nach rel = Index + 1 */
          .apexcharts-series[data\:realIndex="0"], .apexcharts-legend-series[rel="1"] { --ge-c: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-series[data\:realIndex="1"], .apexcharts-legend-series[rel="2"] { --ge-c: var(--nachtblau-rot, #f0736a); }
          .apexcharts-bar-area { fill: var(--ge-c); stroke: var(--ge-c); }
          .apexcharts-marker { fill: var(--ge-c); }
          .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
