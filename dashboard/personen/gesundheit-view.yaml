          const ids=['sensor.iphone_sleep_duration','sensor.iphone_deep_sleep','sensor.iphone_core_sleep','sensor.iphone_rem_sleep','sensor.iphone_awake'];
          const t0=moment(start).startOf('day');
          const h=await hass.callWS({type:'history/history_during_period',start_time:t0.clone().subtract(1,'day').toISOString(),end_time:new Date(end).toISOString(),entity_ids:ids,minimal_response:true,no_attributes:true,significant_changes_only:false});
          // letzter numerischer Wert bis Zeitpunkt t (unavailable/unknown ueberspringen)
          const at=(id,t)=>{ let v=null; for(const p of (h[id]||[])){ if(p.lu*1000>t) break; const n=parseFloat(p.s); if(!isNaN(n)) v=n; } return v; };
          const out=[]; let prev=null;
          for(const d=t0.clone().subtract(1,'day'); d.isBefore(end); d.add(1,'day')){
            const e=Math.min(d.clone().endOf('day').valueOf(),Date.now());
            const sig=ids.map(id=>at(id,e)).join('/');
            const v=at(entity.entity_id,e);
            if(prev!==null) out.push([d.valueOf(), sig!==prev&&v!==null ? v/60 : null]);
            prev=sig;
          }
          return out;
