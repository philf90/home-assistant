          - grid-template-areas: '"l l" "i n"'
          - grid-template-rows: min-content min-content
          - align-items: center
          img_cell:
          - width: 16px
          - height: 16px
          - margin-right: 6px
          - align-self: center
          - margin-top: 0px
      - icon: mdi:fire
        type: custom:button-card
        entity: sensor.iphone_active_energy
        triggers_update:
        - sensor.date
        name: Aktive Energie
        label: |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            // Tageszaehler: Wert vom Vortag zaehlt heute als 0 (TAGESZAEHLER VOM VORTAG im Kopf)
            const v=!e?NaN:(new Date(e.last_updated).toDateString()===new Date().toDateString()?parseFloat(e.state):0);
            const n=isNaN(v)?'–':(v*variables.factor).toLocaleString('de-DE',{minimumFractionDigits:variables.decimals,maximumFractionDigits:variables.decimals});
            return `${n}<span style="font-size:0.55em;color:var(--nachtblau-text-sekundaer, #8794a5);font-weight:600;margin-left:3px;">${variables.unit||''}</span>`;
          ]]]
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          decimals: 0
          factor: 1
          unit: kcal
        styles:
          icon:
          - width: 16px
          - height: 16px
          - --ha-icon-display: block
          - color: 'var(--nachtblau-rot, #f0736a)'
          - align-self: center
          name:
          - justify-self: start
          - align-self: center
          - font-size: 11px
          - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
          - margin-top: 0px
          - white-space: nowrap
          - overflow: hidden
          - text-overflow: ellipsis
          - line-height: 1
          label:
          - justify-self: start
          - align-self: end
          - font-size: 17px
          - font-weight: 700
          - letter-spacing: -0.02em
          - color: 'var(--nachtblau-rot, #f0736a)'
          card:
          - border-radius: 14px
          - padding: 10px 12px
          - box-shadow: none
          - background: 'color-mix(in srgb, var(--nachtblau-rot, #f0736a) 12%, transparent)'
          - border: '1px solid color-mix(in srgb, var(--nachtblau-rot, #f0736a) 24%, transparent)'
          grid:
          - grid-template-columns: min-content 1fr
          - grid-template-areas: '"l l" "i n"'
          - grid-template-rows: min-content min-content
          - align-items: center
