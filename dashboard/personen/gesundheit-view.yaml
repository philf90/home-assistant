    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      custom_fields:
        seg: |
          [[[
            // Segmentbalken der letzten Nacht, Breite proportional zur Dauer
            // Ueber 60 min als Stunden + Minuten, sonst nur Minuten. Erst runden, damit nie "1 h 60 min" entsteht.
            const fmt=v=>{ const m=Math.round(v); return m>60?(Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'):(m+' min'); };
            const ph=[['sensor.iphone_deep_sleep','Tief','var(--nachtblau-violett, #b399d4)'],['sensor.iphone_core_sleep','Kern','var(--nachtblau-blau, #7fb3d5)'],['sensor.iphone_rem_sleep','REM','var(--nachtblau-tuerkis-hell, #77d4d0)'],['sensor.iphone_awake','Wach','var(--nachtblau-amber, #e6b566)']];
            const d=ph.map(([id,n,c])=>({n,c,v:parseFloat(states[id]?.state)})).filter(x=>!isNaN(x.v)&&x.v>0);
            const hinweis=t=>`<div style="color:var(--nachtblau-text-sekundaer, #8794a5);font-size:12.5px;">${t}</div>`;
            const ts=states['input_datetime.schlaf_letzte_nacht']?.attributes?.timestamp;
            if(!d.length||!ts) return hinweis('Noch keine Schlafdaten');
            // Nacht ohne Uhr: App behaelt die Vornacht -> keine veralteten Werte als "Letzte Nacht" zeigen
            const akt=new Date(ts*1000);
            if(akt.toDateString()!==new Date().toDateString())
              return hinweis(`Keine Schlafdaten für letzte Nacht · zuletzt ${akt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}`);
            const bar=d.map(x=>`<span style="flex:${x.v};background:${x.c};"></span>`).join('');
            const leg=d.map(x=>`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:3px;background:${x.c};"></span>${x.n} <b style="color:var(--nachtblau-text, #f2f5f8);font-weight:700;">${fmt(x.v)}</b></span>`).join('');
            return `<div style="display:flex;flex-direction:column;gap:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;">
              <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;">${bar}</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--nachtblau-text-sekundaer, #8794a5);font-variant-numeric:tabular-nums;">${leg}</div></div>`;
          ]]]
