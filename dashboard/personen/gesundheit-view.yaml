    - type: custom:apexcharts-card
      apex_config:
        chart:
          background: transparent
          fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
          foreColor: '#8794a5'
          height: 170
          stacked: true
          toolbar:
            show: false
        dataLabels:
          enabled: false
        grid:
          borderColor: rgba(255,255,255,0.06)
          strokeDashArray: 3
        legend:
          fontSize: 11px
          itemMargin:
            horizontal: 10
            vertical: 2
          labels:
            colors: '#8794a5'
          markers:
            size: 5
            strokeWidth: 0
          show: true
        markers:
          size: 4
          strokeWidth: 0
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 55%
        stroke:
          curve: smooth
          width: 2
        tooltip:
          theme: dark
        xaxis:
          labels:
            format: dd.MM.
        yaxis:
          forceNiceScale: true
          labels:
            formatter: EVAL:function(v){ return (v===null||v===undefined)?'':Number(v).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0}); }
          min: 0
          tickAmount: 4
      card_mod:
        style: |
          ha-card {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
          }
          /* ApexCharts 5.3.3 setzt am Legendentext padding-left:15px + margin-left:-15px (Text liegt ueber dem Punkt).
             Beides neutralisieren und echten Abstand zum Farbpunkt setzen. */
          .apexcharts-legend-text {
            margin-left: 0 !important;
            padding-left: 6px !important;
          }
          /* Farben je Modus (apexcharts-card zeichnet beim Wechsel nicht neu):
             Serien nach Index, Legende nach rel = Index + 1 */
          .apexcharts-series[data\:realIndex="0"], .apexcharts-legend-series[rel="1"] { --ge-c: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-series[data\:realIndex="1"], .apexcharts-legend-series[rel="2"] { --ge-c: var(--nachtblau-rot, #f0736a); }
          .apexcharts-bar-area { fill: var(--ge-c); stroke: var(--ge-c); }
          .apexcharts-marker { fill: var(--ge-c); }
          .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
          .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
          /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
          .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
          .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
          .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
          .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker { color: var(--nachtblau-rot, #f0736a) !important; }
      graph_span: 7d
      header:
        show: false
      series:
      - type: column
        entity: sensor.iphone_resting_energy
        name: Ruhe
        color: '#8794a5'
        group_by:
          duration: 1d
          fill: 'null'
          func: max
        opacity: 1
        stack_group: tag
      - type: column
        entity: sensor.iphone_active_energy
        name: Aktiv
        color: '#f0736a'
        group_by:
          duration: 1d
          fill: 'null'
          func: max
        opacity: 1
        stack_group: tag
      span:
        end: day
      stacked: true
