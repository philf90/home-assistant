    - type: grid
      cards:
      - type: custom:button-card
        entity: sensor.iphone_blutsauerstoff_mittel_24_stunden
        triggers_update:
        - sensor.iphone_blutsauerstoff_minimum_24_stunden
        name: Blutsauerstoff
        show_icon: false
        show_name: true
        show_state: false
        custom_fields:
          dial: |
            [[[
              // 270-Grad-Bogen wie Heizung. Skala 80-100 %.
              // Wert: zeitgewichtetes Mittel der letzten 24 h (Statistik-Helfer), nicht die letzte Einzelmessung --
              // die streut am Tag um mehrere Prozentpunkte (30.10.2026: 95-100 %).
              // Farbe: gruen bei Mittel ab 95 % (ueblicher Ruhe-Referenzbereich) und Minimum ueber 90 %,
              // amber bei Mittel 90-94 % oder Minimum bis 90 %, rot bei Mittel unter 90 %. Anzeigehilfe, keine Diagnose.
              const e=(typeof entity!=='undefined')?entity:null;
              const v=e?parseFloat(e.state):NaN;
              const mn=parseFloat(states['sensor.iphone_blutsauerstoff_minimum_24_stunden']?.state);
              let col='var(--nachtblau-text-sekundaer, #8794a5)', txt='Keine Daten';
              if(!isNaN(v)){ if(v<90){col='var(--nachtblau-rot, #f0736a)';txt='Mittel unter 90 %';} else if(v<95){col='var(--nachtblau-amber, #e6b566)';txt='Mittel unter 95 %';} else if(!isNaN(mn)&&mn<=90){col='var(--nachtblau-amber, #e6b566)';txt='Minimum '+Math.round(mn)+' %';} else {col='var(--nachtblau-gruen, #a6d49e)';txt='Referenzbereich';} }
              const unter=isNaN(mn)?'':`<div style="font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);">Min 24 h ${Math.round(mn)} %</div>`;
              const R=48, C=2*Math.PI*R, track=C*0.75;
              const frac=isNaN(v)?0:Math.max(0,Math.min(1,(v-80)/20));
              return `<div style="display:flex;flex-direction:column;align-items:center;gap:7px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                <div style="position:relative;width:118px;height:118px;">
                  <svg viewBox="0 0 118 118" style="width:118px;height:118px;"><g transform="rotate(135 59 59)">
                    <circle cx="59" cy="59" r="${R}" fill="none" style="stroke:color-mix(in srgb, rgba(255, 255, 255, 0.07) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))" stroke-width="8" stroke-linecap="round" stroke-dasharray="${track.toFixed(1)} ${C.toFixed(1)}"/>
                    ${frac>0?`<circle cx="59" cy="59" r="${R}" fill="none" style="stroke:${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(track*frac).toFixed(1)} ${C.toFixed(1)}"/>`:''}
                  </g></svg>
                  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;">
                    <div style="color:var(--nachtblau-text, #f2f5f8);font-weight:750;letter-spacing:-0.02em;"><span style="font-size:26px;font-variant-numeric:tabular-nums;">${isNaN(v)?'–':Math.round(v)}</span><span style="font-size:14px;">%</span></div>
                    <div style="font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);margin-top:3px;">SpO₂ Ø 24 h</div>
                  </div></div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><div style="font-size:11.5px;font-weight:600;color:${col};">${txt}</div>${unter}</div></div>`;
            ]]]
        styles:
          name:
          - justify-self: start
          - align-self: start
          - width: 100%
          - font-size: 13px
          - font-weight: 700
          - letter-spacing: -0.01em
