          theme: dark
        xaxis:
          labels:
            format: dd.MM.
      card_mod:
        style: |
          ha-card {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
          }
          /* ApexCharts 5.3.3 setzt am Legendentext padding-left:15px + margin-left:-15px (Text liegt ueber dem Punkt).
             Beides neutralisieren und echten Abstand zum Farbpunkt setzen. */
          .apexcharts-legend-text {
            margin-left: 0 !important;
            padding-left: 6px !important;
          }
          /* Farben je Modus (apexcharts-card zeichnet beim Wechsel nicht neu):
             Serien nach Index, Legende nach rel = Index + 1 */
          .apexcharts-series[data\:realIndex="0"], .apexcharts-legend-series[rel="1"] { --ge-c: var(--nachtblau-blau, #7fb3d5); }
          .apexcharts-series[data\:realIndex="1"], .apexcharts-legend-series[rel="2"] { --ge-c: var(--nachtblau-rose, #e6a0c4); }
          .apexcharts-bar-area { fill: var(--ge-c); stroke: var(--ge-c); }
          .apexcharts-line { stroke: var(--ge-c); }
          /* Trendlinie duenn und gestrichelt: apexcharts-card setzt fuer Linien eine eigene Strichstaerke
             (am iPhone etwa 5 px) und uebergeht stroke.width aus apex_config; CSS gilt trotzdem. */
          .apexcharts-series[data\:realIndex="1"] .apexcharts-line { stroke-width: 1.5px; stroke-dasharray: 5 4; }
          .apexcharts-marker { fill: var(--ge-c); }
          .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
          .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
          /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
          .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
          .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
          .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--nachtblau-blau, #7fb3d5) !important; }
          .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker { color: var(--nachtblau-rose, #e6a0c4) !important; }
      graph_span: 30d
      header:
        show: false
      series:
      - type: column
        entity: sensor.iphone_health_steps
        name: Schritte
        color: '#7fb3d5'
        opacity: 1
        float_precision: 0
        data_generator: |
          // Tageswert = Zaehlerstand am Tagesende aus der Langzeitstatistik (types: state), nicht die
          // Tagessumme (change), siehe "Schritte 30 Tage" im Kopf. Heute: aktueller Sensorwert.
          const tz = hass.config.time_zone;
          const id = entity.entity_id;
          const t0 = moment.tz(start, tz).startOf('day');
          const heute = moment.tz(tz).startOf('day').valueOf();
          const res = await hass.callWS({ type: 'recorder/statistics_during_period', start_time: t0.toISOString(), end_time: new Date(end).toISOString(), statistic_ids: [id], period: 'day', types: ['state', 'change'] });
          const out = (res[id] || []).filter((r) => r.start < heute).map((r) => [r.start, r.change > 0 ? r.state : null]);
          const s = hass.states[id];
          const v = s ? parseFloat(s.state) : NaN;
          if (!isNaN(v) && new Date(s.last_updated).toDateString() === new Date().toDateString()) out.push([heute, v]);
          return out;
      - type: line
        entity: sensor.iphone_health_steps
        name: Ø 7 Tage
        color: '#e6a0c4'
        float_precision: 0
        data_generator: |
          // Gleitendes Mittel der letzten 7 abgeschlossenen Tage (Tagesendstand wie die Saeulen);
          // ein Punkt nur mit mindestens 5 Werten im Fenster. Heute zaehlt nicht, der Tag ist offen.
          const tz = hass.config.time_zone;
          const id = entity.entity_id;
          const t0 = moment.tz(start, tz).startOf('day');
          const heute = moment.tz(tz).startOf('day').valueOf();
          const res = await hass.callWS({ type: 'recorder/statistics_during_period', start_time: t0.clone().subtract(7, 'day').toISOString(), end_time: new Date(end).toISOString(), statistic_ids: [id], period: 'day', types: ['state', 'change'] });
          const tage = (res[id] || []).filter((r) => r.start < heute).map((r) => ({ t: r.start, v: r.change > 0 ? r.state : null }));
          const out = [];
          tage.forEach((d, i) => {
            if (i < 6 || d.t < t0.valueOf()) return;
            const w = tage.slice(i - 6, i + 1).filter((x) => x.v !== null);
            if (w.length >= 5) out.push([d.t, Math.round(w.reduce((a, x) => a + x.v, 0) / w.length)]);
          });
          return out;
      span:
        end: day
