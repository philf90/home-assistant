    - type: custom:apexcharts-card
      apex_config:
        chart:
          background: transparent
          fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
          foreColor: '#8794a5'
          height: 170
          stacked: true
          toolbar:
            show: false
        dataLabels:
          enabled: false
        grid:
          borderColor: rgba(255,255,255,0.06)
          strokeDashArray: 3
        legend:
          fontSize: 11px
          itemMargin:
            horizontal: 10
            vertical: 2
          labels:
            colors: '#8794a5'
          markers:
            size: 5
            strokeWidth: 0
          show: true
        markers:
          size: 4
          strokeWidth: 0
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 55%
        stroke:
          curve: smooth
          width: 0
        tooltip:
          theme: dark
        xaxis:
          labels:
            format: dd.MM.
        yaxis:
          forceNiceScale: true
          labels:
            formatter: EVAL:function(v){ return (v===null||v===undefined)?'':Number(v).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:1}); }
          min: 0
          max: 12
          tickAmount: 4
      card_mod:
        style: |
          ha-card {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
          }
          /* ApexCharts 5.3.3 setzt am Legendentext padding-left:15px + margin-left:-15px (Text liegt ueber dem Punkt).
             Beides neutralisieren und echten Abstand zum Farbpunkt setzen. */
          .apexcharts-legend-text {
            margin-left: 0 !important;
            padding-left: 6px !important;
          }
          /* Farben je Modus (apexcharts-card zeichnet beim Wechsel nicht neu):
             Serien nach Index, Legende nach rel = Index + 1 */
          .apexcharts-series[data\:realIndex="0"], .apexcharts-legend-series[rel="1"] { --ge-c: var(--nachtblau-violett, #b399d4); }
          .apexcharts-series[data\:realIndex="1"], .apexcharts-legend-series[rel="2"] { --ge-c: var(--nachtblau-blau, #7fb3d5); }
          .apexcharts-series[data\:realIndex="2"], .apexcharts-legend-series[rel="3"] { --ge-c: var(--nachtblau-tuerkis-hell, #77d4d0); }
          .apexcharts-series[data\:realIndex="3"], .apexcharts-legend-series[rel="4"] { --ge-c: var(--nachtblau-amber, #e6b566); }
          .apexcharts-bar-area { fill: var(--ge-c); stroke: var(--ge-c); }
          .apexcharts-marker { fill: var(--ge-c); }
          .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
          .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
          .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
          /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
          .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
          .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
          /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
          .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--nachtblau-violett, #b399d4) !important; }
          .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker { color: var(--nachtblau-blau, #7fb3d5) !important; }
          .apexcharts-tooltip-series-group-2 .apexcharts-tooltip-marker { color: var(--nachtblau-tuerkis-hell, #77d4d0) !important; }
          .apexcharts-tooltip-series-group-3 .apexcharts-tooltip-marker { color: var(--nachtblau-amber, #e6b566) !important; }
      graph_span: 7d
      header:
        show: false
      series:
      - type: column
        entity: sensor.iphone_deep_sleep
        name: Tief
        color: '#b399d4'
        opacity: 1
        stack_group: tag
        data_generator: &schlaf_gen |
          // Naechte ohne Uhr: Die App behaelt die Werte der Vornacht. Ein Tag zaehlt nur, wenn sich
          // die Kombination Gesamt/Tief/Kern/REM/Wach zum Tagesende gegenueber dem Vortag geaendert hat.
          const ids=['sensor.iphone_sleep_duration','sensor.iphone_deep_sleep','sensor.iphone_core_sleep','sensor.iphone_rem_sleep','sensor.iphone_awake'];
          const t0=moment(start).startOf('day');
          const h=await hass.callWS({type:'history/history_during_period',start_time:t0.clone().subtract(1,'day').toISOString(),end_time:new Date(end).toISOString(),entity_ids:ids,minimal_response:true,no_attributes:true,significant_changes_only:false});
          // letzter numerischer Wert bis Zeitpunkt t (unavailable/unknown ueberspringen)
          const at=(id,t)=>{ let v=null; for(const p of (h[id]||[])){ if(p.lu*1000>t) break; const n=parseFloat(p.s); if(!isNaN(n)) v=n; } return v; };
          const out=[]; let prev=null;
          for(const d=t0.clone().subtract(1,'day'); d.isBefore(end); d.add(1,'day')){
            const e=Math.min(d.clone().endOf('day').valueOf(),Date.now());
            const sig=ids.map(id=>at(id,e)).join('/');
            const v=at(entity.entity_id,e);
            if(prev!==null) out.push([d.valueOf(), sig!==prev&&v!==null ? v/60 : null]);
            prev=sig;
          }
          return out;
        unit: h
      - type: column
        entity: sensor.iphone_core_sleep
        name: Kern
        color: '#7fb3d5'
        opacity: 1
        stack_group: tag
        data_generator: *schlaf_gen
        unit: h
      - type: column
        entity: sensor.iphone_rem_sleep
        name: REM
        color: '#77d4d0'
        opacity: 1
        stack_group: tag
        data_generator: *schlaf_gen
        unit: h
      - type: column
        entity: sensor.iphone_awake
        name: Wach
        color: '#e6b566'
        opacity: 1
        stack_group: tag
        data_generator: *schlaf_gen
        unit: h
      span:
        end: day
      stacked: true
    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      custom_fields:
        bilanz: |
          [[[
            // Naechte mit mindestens 7 h Schlaf in den 7 Tagen des Diagramms (SCHLAFBILANZ im Kopf).
            // Gleiche Erkennung von Naechten ohne Uhr wie im data_generator des Diagramms.
            const ids=['sensor.iphone_sleep_duration','sensor.iphone_deep_sleep','sensor.iphone_core_sleep','sensor.iphone_rem_sleep','sensor.iphone_awake'];
            const jetzt=new Date();
            const ts=states['input_datetime.schlaf_letzte_nacht']?.attributes?.timestamp||0;
            const key=jetzt.toDateString()+'|'+ts;
            const C=window.__nachtblauSchlafBilanz=window.__nachtblauSchlafBilanz||{};
            const sek='var(--nachtblau-text-sekundaer, #8794a5)';
            const vio='var(--nachtblau-violett, #b399d4)';
            const spur='color-mix(in srgb, rgba(255, 255, 255, 0.07) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))';
            const farbe={ja:vio, nein:`color-mix(in srgb, ${vio} 50%, transparent)`, ohne:spur, offen:spur};
            // nicht 'html' nennen: button-card uebergibt dem Template einen Parameter html
            const inhalt=r=>{
              const kopf=(l,w)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:600;color:${sek};margin-bottom:7px;"><span>${l}</span><span style="color:var(--nachtblau-text, #f2f5f8);font-variant-numeric:tabular-nums;white-space:nowrap;">${w}</span></div>`;
              if(!r) return kopf('Nächte ≥ 7 h Schlaf','…')+`<div style="height:8px;border-radius:4px;background:${spur};"></div>`;
              const zellen=r.tage.map(x=>`<span style="flex:1;height:8px;border-radius:4px;background:${farbe[x]};"></span>`).join('');
              return kopf(`Nächte ≥ 7 h Schlaf${r.ohne?` · ${r.ohne} ohne Uhr`:''}`, r.n?`${r.ja} von ${r.n}`:'–')+`<div style="display:flex;gap:3px;">${zellen}</div>`;
            };
            const karte=this;
            const ws=(karte&&karte._hass)||hass;
            if(C.key!==key&&ws&&typeof ws.callWS==='function'){
              C.key=key; C.erg=null;
              const t0=new Date(jetzt.getFullYear(),jetzt.getMonth(),jetzt.getDate()-7);
              const live=id=>{ const x=parseFloat(states[id]?.state); return isNaN(x)?null:x; };
              ws.callWS({type:'history/history_during_period',start_time:t0.toISOString(),end_time:jetzt.toISOString(),entity_ids:ids,minimal_response:true,no_attributes:true,significant_changes_only:false}).then(h=>{
                // letzter numerischer Wert bis Zeitpunkt t (unavailable/unknown ueberspringen)
                const at=(id,t)=>{ let v=null; for(const p of (h[id]||[])){ if(p.lu*1000>t) break; const n=parseFloat(p.s); if(!isNaN(n)) v=n; } return v; };
                const r={tage:[],ja:0,n:0,ohne:0}; let prev=null;
                for(let i=7;i>=0;i--){
                  const d=new Date(jetzt.getFullYear(),jetzt.getMonth(),jetzt.getDate()-i);
                  const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()-1;
                  // heute: aktueller Zustand (der Recorder schreibt verzoegert)
                  const wert=id=>i===0?(live(id)??at(id,Date.now())):at(id,e);
                  const sig=ids.map(wert).join('/');
                  const v=wert(ids[0]);
                  if(prev!==null){
                    if(sig!==prev&&v!==null){ r.n++; if(v>=420){ r.ja++; r.tage.push('ja'); } else r.tage.push('nein'); }
                    else if(i===0) r.tage.push('offen');
                    else { r.ohne++; r.tage.push('ohne'); }
                  }
                  prev=sig;
                }
                if(C.key!==key) return;
                C.erg=r;
                const el=karte&&karte.shadowRoot&&karte.shadowRoot.querySelector('[data-schlaf-bilanz]');
                if(el) el.innerHTML=inhalt(r);
              }).catch(()=>{ if(C.key===key) C.key=null; });
            }
            return `<div data-schlaf-bilanz style="width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;">${inhalt(C.key===key?C.erg:null)}</div>`;
          ]]]
      styles:
        card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0 2px 2px
        custom_fields:
          bilanz:
          - width: 100%
        grid:
        - grid-template-areas: '"bilanz"'
      tap_action:
        action: none
      triggers_update:
      - sensor.iphone_sleep_duration
      - input_datetime.schlaf_letzte_nacht
      - sensor.date
