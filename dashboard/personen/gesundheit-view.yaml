        - unknown
      - entity: sensor.iphone_body_fat_percentage
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_lean_body_mass
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_height
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_blood_pressure_systolic
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_blood_pressure_diastolic
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_body_temperature
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_basal_body_temperature
        condition: state
        state_not:
        - unavailable
        - unknown
      - entity: sensor.iphone_blood_glucose
        condition: state
        state_not:
        - unavailable
