        entity: sensor.iphone_walking_running_distance
        name: Gehen + Laufen
        label: |
          [[[
            // Distanz, dahinter die Schritte von heute (Sensor ohne Ziel, nur Anzeige).
            // Beide Teile als Flex-Zellen: passt die Zeile nicht, rutschen die Schritte
