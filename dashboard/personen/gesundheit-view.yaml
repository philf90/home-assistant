# ============================================================================
# Gesundheit – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       personen
# Status:        aktiv
# Karten:        apexcharts-card, button-card, card-mod, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   sensor.iphone_*, benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Gesundheit – komplette Ansicht (View) im Nachtblau-Stil
#
# Apple-Health-Daten aus der Companion App (Geraet "iPhone",
# Sensoren sensor.iphone_*), aufgeteilt in sechs Nachtblau-Huellen:
#   - Aktivitaet: drei Ringe (Bewegung und Schritte heute, Training der
#     letzten 7 Tage) gegen die Ziel-Helfer, Badge "x / 3 Ziele", Balken
#     Training 7 Tage mit WHO-Marken, Distanz (dahinter die Schritte),
#     Stockwerke, Schritte 30 Tage mit gleitendem 7-Tage-Mittel
#   - Herz: Ruhepuls, HRV, Puls beim Gehen, Herzfrequenz + 7-Tage-Verlauf
#   - Schlaf: Dauer-Badge, Phasen-Segmentbalken, 7 Naechte gestapelt
#     (Naechte ohne Uhr bleiben leer, siehe "NAECHTE OHNE UHR" unten)
#   - Vitalwerte: SpO2-Bogen (wie Heizung), Atemfrequenz, VO2max, Training
#   - Energieumsatz: Gesamt-Badge, Ruhe/aktiv, 7 Tage gestapelt
#   - Koerperwerte: nur sichtbar, sobald mindestens ein Wert existiert
#
# Passt zur Route /dashboard-home/gesundheit (Eintrag im "More"-Menue von
# navbar-karte.yaml / navigation-templates.yaml, Bereich "Freizeit").
#
# Sichtbarkeit: View (visible) und jede Huelle (visibility) nur fuer einen Benutzer.
# Das versteckt nur die Darstellung -- andere Nutzer koennen die Sensoren
# weiterhin z. B. im Verlauf oeffnen.
#
# Ziel-Helfer (UI: Einstellungen > Geraete & Dienste > Helfer > Zahlenwert,
# ohne "initial", damit der Wert Neustarts ueberlebt):
#   input_number.ziel_aktive_energie   400 kcal  (100-2000, Schritt 10)
#   input_number.ziel_training_woche   150 min   (30-600, Schritt 10)
#   input_number.ziel_schritte        7500 steps (1000-30000, Schritt 500)
#
# TRAINING ALS WOCHENZIEL
#   Die WHO empfiehlt 150-300 min moderate Bewegung pro Woche (Bull et al.
#   2020), kein Tagesziel. Der Trainingsring zaehlt deshalb die letzten 7 Tage
#   (Statistik-Helfer sensor.iphone_training_7_tage, siehe ERFORDERLICH) gegen
#   input_number.ziel_training_woche; der Balken darunter zeigt dieselbe Summe
#   mit Marken beim Ziel und bei 300 min. Das fruehere Tagesziel
#   (input_number.ziel_trainingszeit, 30 min) wurde im Oktober 2026 an 4 von
#   29 Tagen erreicht; die Wochensummen lagen bei 134/171/99/72 min.
#   "Training heute" in den Vitalwerten zeigt weiter die Minuten des Tages.
#
# Hinweise zu den Diagrammen (apexcharts-card v2.2.3 / ApexCharts 5.3.3):
#   - Gestapelte Saeulen brauchen einen gemeinsamen stack_group. Ohne ihn legt
#     ApexCharts 5 jede Serie in eine eigene Gruppe -> Saeulen nebeneinander.
#   - Legendentext hat in ApexCharts 5 padding-left:15px + margin-left:-15px
#     (liegt ueber dem Farbpunkt); card_mod neutralisiert beides.
#   - Verlaeufe lesen den Recorder (Standard 10 Tage) -> 7 Tage passen.
#   - Schritte 30 Tage: aus der Langzeitstatistik (recorder/statistics_during_
#     period, period: day), weil der Recorder nur 10 Tage behaelt. Tageswert ist
#     der Zaehlerstand am Tagesende (types: state), NICHT die Tagessumme
#     (change): Die App korrigiert den Zaehler teils um mehr als 10 % nach
#     unten (31.10.2026 09:36: 535 -> 438), HA wertet das bei total_increasing
#     als Zaehlerreset und zaehlt den neuen Stand doppelt (change 2004 statt
#     Stand 1815; im Oktober 2026 an 9 von 29 Tagen zu hoch, z. B. 14.10.
#     9000 statt 6722). Tage mit change 0 haben keine neuen Werte und bleiben
#     leer. Heute nimmt den aktuellen Sensorwert, weil die Statistik bis zu
#     einer Stunde alt ist. Rosa Linie: Mittel der letzten 7 abgeschlossenen
#     Tage (mind. 5 mit Wert), heute zaehlt nicht mit; 1,5 px gestrichelt per
#     CSS (apexcharts-card uebergeht stroke.width aus apex_config). Y-Achse mit
#     weichem Maximum ~10000 der Karte (0-10.000 in 2.500er-Schritten).
#   - Gestapelte Diagramme haben KEINE Karten-yaxis: deren "auto"-max nimmt die
#     groesste Einzelserie statt der Stapelsumme und schneidet obere Segmente ab.
#     Die Achse steht stattdessen in apex_config.yaxis (ApexCharts rechnet mit Summe).
#   - Schlafdauern: ueber 60 min als "x h mm min", sonst "n min" (erst runden).
#   - Schlaf-Diagramm: Achse fest 0-12 h. Mit forceNiceScale allein waehlt
#     ApexCharts 5.3.3 bei Naechten um 8-9 h die Skala 0-20 (nachgestellt
#     31.10.2026). stroke.width 0: apexcharts-card reicht Naechte ohne Uhr als 0
#     durch, mit Rand 2 zeichnete ApexCharts dort einen Strich auf der Nulllinie.
#   - Herz-Diagramm: Ruhepuls als letzter Wert des Tages (Apples Endwert; der
#     Mittelwert enthielt den hoeheren vorlaeufigen Morgenwert), HRV als Median
#     (eine einzelne Messung wie 78 ms verschiebt sonst den Tagespunkt).
#   - Farben: apexcharts-card zeichnet beim Wechsel zwischen hell und dunkel
#     nicht neu. Saeulen, Linien, Achsen und Gitter faerbt deshalb das
#     card_mod-CSS jeder Diagrammkarte mit var(--nachtblau-...); die Farben unter
#     series und apex_config gelten nur ohne dieses CSS.
#
# NAECHTE OHNE UHR (Schlaf-Huelle)
#   Nach einer Nacht ohne Uhr liefert die Companion App keine leeren Werte,
#   sondern behaelt die der Vornacht -- und schreibt sie u. U. sogar mit neuem
#   Zeitstempel erneut (beobachtet 03.10.2026 20:49: 464/36/303/125/11 min wie
#   am 02.10.). Kennzeichen einer neuen Nacht ist deshalb, dass sich die
#   Kombination Gesamt/Tief/Kern/REM/Wach aendert (zwei echte Naechte sind
#   praktisch nie in allen fuenf Werten minutengenau gleich).
#   - Diagramm: data_generator liest den Verlauf selbst und zeigt einen Tag nur,
#     wenn die Kombination zum Tagesende anders ist als am Vortag. Kommt ohne
#     Helfer aus und wirkt rueckwirkend auf den ganzen Recorder-Verlauf.
#   - Badge + Phasenbalken: button-card kann keinen Verlauf abfragen, daher
#     merkt sich eine Automation den Zeitpunkt der letzten neuen Nacht.
#     "Letzte Nacht" nur, wenn dieser Zeitpunkt heute ist.
#   Grenze: Eine Nacht zaehlt fuer den Tag, an dem die Daten ankommen.
#
# TAGESZAEHLER VOM VORTAG (Aktivitaet, Energieumsatz)
#   Schritte, Distanz, Stockwerke, Training, aktive und Ruheenergie setzt die
#   Companion App nicht um Mitternacht auf 0, sondern erst mit dem ersten Wert
#   des neuen Tags. Bis dahin steht der Endstand von gestern im Sensor
#   (beobachtet 31.10.2026 08:36: Training 5 min und Stockwerke 7 vom
#   30.10. 22:30; Schritte 30.10. 00:00-06:36 noch 3.077 vom 29.10.).
#   - Ringe, Ziel-Badge, Kacheln und Energie-Badge werten einen Zaehler nur,
#     wenn sein last_updated von heute ist, sonst als 0.
#   - sensor.date in triggers_update zeichnet die Karten um Mitternacht neu;
#     ohne ihn bliebe bei offener Seite der alte Wert bis zum naechsten Update
#     stehen. Gilt auch fuer "Letzte Nacht" in der Schlaf-Huelle.
#   - Grenzfall: Ist der heutige Wert genau gleich dem gestrigen Endstand,
#     aendert sich last_updated nicht und die Karte zeigt 0 bis zum naechsten
#     Wert. Bei Zaehlern ab 0 praktisch nur in den ersten Minuten des Tags.
#   - Grenzfall: Ein Neustart von Home Assistant nach Mitternacht schreibt
#     den wiederhergestellten Vortagswert mit neuem last_updated; dann zeigt
#     die Karte ihn wieder, bis die App den ersten Wert des Tags sendet.
#   - Die Diagramme brauchen das nicht: group_by je Tag sieht nur Werte, die
#     an diesem Tag geschrieben wurden.
#
# EIGENES NORMAL (Kacheln Ruhepuls, HRV, Atemfrequenz)
#   Unter dem Wert steht das Mittel der letzten 7 Tage ("Ø 7 T") und die
#   Abweichung davon (Ruhepuls vor 20 Uhr nur mit "vorl."). Schwellen wie in der
#   Frueherkennung (Oktober 2026 rueckwirkend geprueft):
#     Ruhepuls     ab +2 bpm Amber, ab +3 bpm Koralle "erhoeht"; erst ab 20 Uhr,
#                  weil Apple den Tagesruhepuls bis zum Abend neu rechnet
#                  (30.10.2026: 08:09 72, 22:30 63 bpm)
#     Atemfrequenz ab +1,5/min Amber, ab +2/min Koralle "erhoeht"
#     HRV 24 h     ab -3 ms Amber, ab -5 ms Koralle "niedrig"; Kachelwert ist
#                  das Mittel der letzten 24 h, nicht die letzte Einzelmessung
#   Feste Abstaende statt Standardabweichung: Die Standardabweichung ueber die
#   Einzelmessungen misst die Schwankung innerhalb eines Tages, nicht die von
#   Tag zu Tag (7 Tage bis 31.10.2026: Ruhepuls 3,3 statt 1,9 bpm, HRV 12,4
#   statt 5,5 ms).
#   Mittel zeitgewichtet (average_step): App-Meldungen mit gleichem Wert zaehlen
#   sonst mehrfach (HRV-Helfer mit "mean": 40,3 ms, nachgerechnet 34,6 ms).
#
# ---------------------------------------------------------------------------
# ERFORDERLICH (UI, kein configuration.yaml) - EINMALIG:
# ---------------------------------------------------------------------------
#   Helfer (Einstellungen > Geraete & Dienste > Helfer, ohne "initial"):
#     input_text.schlaf_signatur       Text, max. 100 Zeichen
#     input_datetime.schlaf_letzte_nacht   Datum und Uhrzeit
#   Statistik-Helfer (Helfer > Statistik), je: Merkmal "Durchschnitt Stufe"
#   (average_step), max. Alter 7 Tage, Stichprobengroesse 1000, Genauigkeit 1:
#     Ruhepuls Normal 7 Tage      Quelle sensor.iphone_resting_heart_rate
#     HRV Normal 7 Tage           Quelle sensor.iphone_heart_rate_variability
#     Atemfrequenz Normal 7 Tage  Quelle sensor.iphone_respiratory_rate,
#                                 "letzten Wert behalten" an (ein Wert je Nacht)
#     Training 7 Tage             Quelle sensor.iphone_exercise_time, Merkmal
#                                 "Summe der nichtnegativen Differenzen"
#                                 (sum_differences_nonnegative), Stichproben-
#                                 groesse 2000, Genauigkeit 0; wertet den
#                                 taeglichen Ruecksprung als Neustart bei 0
#   dazu mit max. Alter 1 Tag (Stichprobengroesse 1000):
#     HRV 24 Stunden              Quelle sensor.iphone_heart_rate_variability,
#                                 "Durchschnitt Stufe", Genauigkeit 1
#     Blutsauerstoff Mittel 24 Stunden   Quelle sensor.iphone_blood_oxygen,
#                                 "Durchschnitt Stufe", Genauigkeit 1
#     Blutsauerstoff Minimum 24 Stunden  Quelle sensor.iphone_blood_oxygen,
#                                 "Minimalwert" (value_min), Genauigkeit 0
#   Datum-Helfer (Datum und Uhrzeit), Startwert von Hand setzen:
#     input_datetime.vo2max_stand   Zeitpunkt der letzten VO2max-Aenderung
#     input_datetime.gewicht_stand  Zeitpunkt der letzten Gewichtsaenderung
#   HA haengt die Helfer an das Quellgeraet; die Entitaeten heissen dann
#   sensor.iphone_ruhepuls_normal_7_tage usw. Die 7 Tage passen in die
#   10 Tage, die der Recorder behaelt.
#   Automation "Gesundheit: Stand von VO2max und Gewicht merken"
#   (last_changed taugt nicht als Datum: Neustarts und kurze Ausfaelle setzen
#   ihn neu, 30.10.2026 21:48 bei VO2max 40,2 seit 04.10. 16 Uhr):
#     mode: queued
#     max: 5
#     triggers:
#       - trigger: state
#         entity_id: sensor.iphone_vo2_max
#         to: null                       # nur Zustandswechsel
#         not_from: [unavailable, unknown]
#         id: vo2max
#       - trigger: state
#         entity_id: sensor.iphone_weight
#         to: null
#         not_from: [unavailable, unknown]
#         id: gewicht
#     actions:
#       - choose:
#           - conditions:
#               - { condition: trigger, id: vo2max }
#               - { condition: numeric_state, entity_id: sensor.iphone_vo2_max, above: 0 }
#             sequence:
#               - action: input_datetime.set_datetime
#                 target: { entity_id: input_datetime.vo2max_stand }
#                 data: { timestamp: "{{ now().timestamp() }}" }
#           - conditions:
#               - { condition: trigger, id: gewicht }
#               - { condition: numeric_state, entity_id: sensor.iphone_weight, above: 0 }
#             sequence:
#               - action: input_datetime.set_datetime
#                 target: { entity_id: input_datetime.gewicht_stand }
#                 data: { timestamp: "{{ now().timestamp() }}" }
#   Automation "Schlaf: neue Nacht erkennen":
#     mode: queued          # App schreibt alle fuenf nacheinander -> keinen
#     max: 10               # Durchlauf verlieren, der letzte sieht alles
#     triggers:
#       - trigger: state
#         entity_id:
#           - sensor.iphone_sleep_duration
#           - sensor.iphone_deep_sleep
#           - sensor.iphone_core_sleep
#           - sensor.iphone_rem_sleep
#           - sensor.iphone_awake
#         not_to: [unavailable, unknown]
#     variables:
#       sig: >-
#         {{ ['sleep_duration','deep_sleep','core_sleep','rem_sleep','awake']
#            | map('regex_replace','^','sensor.iphone_')
#            | map('states') | join('/') }}
#     conditions:
#       - condition: template
#         value_template: >-
#           {{ sig.split('/') | select('is_number') | list | count == 5
#              and sig != states('input_text.schlaf_signatur') }}
#     actions:
#       - action: input_text.set_value
#         target: { entity_id: input_text.schlaf_signatur }
#         data: { value: "{{ sig }}" }
#       - action: input_datetime.set_datetime
#         target: { entity_id: input_datetime.schlaf_letzte_nacht }
#         data: { timestamp: "{{ now().timestamp() }}" }
#
# Meldungen (Morgen-Briefing, Fruehwarnung bei mehreren abweichenden
# Vitalwerten): gesundheit-meldungen-konfig.yaml, nutzt dieselben Helfer.
#
# Voraussetzung: custom:button-card + custom:apexcharts-card +
#                custom:decluttering-card + card-mod (alle via HACS)
#                + obige Helfer und Automation
#                + sensor.date (Integration "Time & Date", Anzeige "Datum").
title: Gesundheit
path: gesundheit
icon: mdi:heart-pulse
visible:
- user: benutzer_id_1
type: sections
max_columns: 2
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation
  - type: vertical-stack
    visibility:
    - condition: user
      users:
      - benutzer_id_1
    card_mod:
      style: |
        #root {
          background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
          border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
    - icon: mdi:fire
      type: custom:button-card
      name: Aktivität
      label: Heute · Training 7 Tage
      show_icon: true
      show_name: true
      show_label: true
      custom_fields:
        badge: |
          [[[
            // Zaehlt erreichte Tagesziele. Gruen = alle, Amber = teilweise, gedaempft = keins
            // Tageszaehler zaehlen nur mit Update von heute (TAGESZAEHLER VOM VORTAG im Kopf)
            const v=id=>parseFloat(states[id]?.state);
            const h=id=>{ const s=states[id]; return !s?NaN:(new Date(s.last_updated).toDateString()===new Date().toDateString()?parseFloat(s.state):0); };
            // Training zaehlt als Wochenziel: Summe der letzten 7 Tage (TRAINING ALS WOCHENZIEL im Kopf)
            const pairs=[['sensor.iphone_active_energy','input_number.ziel_aktive_energie',h],['sensor.iphone_training_7_tage','input_number.ziel_training_woche',v],['sensor.iphone_health_steps','input_number.ziel_schritte',h]];
            let ok=0; pairs.forEach(([a,g,w])=>{ if(!isNaN(w(a))&&!isNaN(v(g))&&v(g)>0&&w(a)>=v(g)) ok++; });
            const c= ok===3?'var(--nachtblau-gruen, #a6d49e)':(ok>0?'var(--nachtblau-amber, #e6b566)':'var(--nachtblau-text-sekundaer, #8794a5)');
            const txt=ok+' / 3 Ziele';
            return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums;">${txt}</span>`;
          ]]]
      styles:
        icon:
        - width: 23px
        - height: 23px
        - --ha-icon-display: block
        - color: 'var(--nachtblau-rot, #f0736a)'
        name:
        - justify-self: start
        - align-self: end
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--nachtblau-text, #f2f5f8)'
        label:
        - justify-self: start
        - align-self: start
        - font-size: 12.5px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        - margin-top: 1px
        card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
        custom_fields:
          badge:
          - justify-self: end
          - align-self: center
        grid:
        - grid-template-areas: '"i n badge" "i l badge"'
        - grid-template-columns: min-content 1fr min-content
        - grid-template-rows: min-content min-content
        img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'color-mix(in srgb, var(--nachtblau-rot, #f0736a) 12%, transparent)'
        - border: '1px solid color-mix(in srgb, var(--nachtblau-rot, #f0736a) 24%, transparent)'
      tap_action:
        action: none
      triggers_update:
      - sensor.iphone_active_energy
      - sensor.iphone_training_7_tage
      - sensor.iphone_health_steps
      - input_number.ziel_aktive_energie
      - input_number.ziel_training_woche
      - input_number.ziel_schritte
      - sensor.date
    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      custom_fields:
        rings: |
          [[[
            // Drei konzentrische Ringe (Bewegung / Training / Schritte) gegen die Ziel-Helfer;
            // Training als Summe der letzten 7 Tage gegen das Wochenziel (TRAINING ALS WOCHENZIEL im Kopf).
            // Strichstaerke 8 und Spur wie die Heizungs-Boegen (dunkel Weiss 0,07).
            const v=id=>{ const x=parseFloat(states[id]?.state); return isNaN(x)?null:x; };
            // Tageszaehler: Wert vom Vortag zaehlt heute als 0 (TAGESZAEHLER VOM VORTAG im Kopf)
            const h=id=>{ const s=states[id]; if(!s) return null; if(!(new Date(s.last_updated).toDateString()===new Date().toDateString())) return 0; const x=parseFloat(s.state); return isNaN(x)?null:x; };
            const de=n=>n===null?'–':Math.round(n).toLocaleString('de-DE');
            const rows=[
              {id:'sensor.iphone_active_energy', g:'input_number.ziel_aktive_energie', c:'var(--nachtblau-rot, #f0736a)', r:50, l:'Bewegung', u:'kcal'},
              {id:'sensor.iphone_training_7_tage', g:'input_number.ziel_training_woche', c:'var(--nachtblau-gruen, #a6d49e)', r:38, l:'Training 7 T', u:'min', woche:true},
              {id:'sensor.iphone_health_steps', g:'input_number.ziel_schritte', c:'var(--nachtblau-blau, #7fb3d5)', r:26, l:'Schritte', u:''}
            ];
            const wert=x=>x.woche?v(x.id):h(x.id);
            const ring=x=>{ const C=2*Math.PI*x.r; const val=wert(x), goal=v(x.g);
              const p=(val!==null&&goal)?Math.max(0,Math.min(1,val/goal)):0;
              return `<circle cx="60" cy="60" r="${x.r}" fill="none" style="stroke:color-mix(in srgb, rgba(255, 255, 255, 0.07) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))" stroke-width="8"/>`+
                (p>0?`<circle cx="60" cy="60" r="${x.r}" fill="none" style="stroke:${x.c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}"/>`:''); };
            const leg=rows.map(x=>{ const val=wert(x), goal=v(x.g); const pct=(val!==null&&goal)?Math.round(val/goal*100):null;
              return `<div style="display:flex;flex-direction:column;gap:2px;">
                <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--nachtblau-text-sekundaer, #8794a5);"><span style="width:8px;height:8px;border-radius:3px;background:${x.c};"></span>${x.l}${pct!==null?' · '+pct+' %':''}</div>
                <div style="color:var(--nachtblau-text, #f2f5f8);font-size:17px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">${de(val)}<span style="font-size:0.62em;color:var(--nachtblau-text-sekundaer, #8794a5);font-weight:600;"> / ${de(goal)} ${x.u}</span></div></div>`; }).join('');
            // Balken Training 7 Tage: Marken beim Wochenziel und bei 300 min (obere WHO-Empfehlung).
            // Skala bis 110 % von max(300, Wert), damit die 300er-Marke nicht am Rand klebt.
            const tw=v('sensor.iphone_training_7_tage'), tz=v('input_number.ziel_training_woche')||150;
            const skala=Math.max(300,tw||0)*1.1, pos=x=>(x/skala*100).toFixed(1);
            const marke=x=>`<div style="position:absolute;left:${pos(x)}%;top:-3px;width:2px;height:14px;border-radius:1px;transform:translateX(-1px);background:var(--nachtblau-text-sekundaer, #8794a5);"></div>
              <div style="position:absolute;left:${pos(x)}%;top:15px;transform:translateX(-50%);font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);font-variant-numeric:tabular-nums;">${x}</div>`;
            const balken=tw===null?'':`<div style="width:100%;padding:0 2px 18px;box-sizing:border-box;">
