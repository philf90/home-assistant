      condition: or
    visibility:
    - condition: user
      users:
      - benutzer_id_1
    card:
      type: vertical-stack
      card_mod:
        style: |
          #root {
            background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
            border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
            border-radius: 22px !important;
            box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
            padding: 16px 18px !important;
            gap: 10px !important;
          }
      cards:
      - icon: mdi:human
        type: custom:button-card
        name: Körperwerte
        label: erscheint, sobald Apple Health Werte liefert
        show_icon: true
        show_name: true
        show_label: true
        styles:
          icon:
          - width: 23px
          - height: 23px
          - --ha-icon-display: block
          - color: 'var(--nachtblau-blau, #7fb3d5)'
          name:
          - justify-self: start
          - align-self: end
          - font-size: 17px
          - font-weight: 700
          - letter-spacing: -0.02em
          - color: 'var(--nachtblau-text, #f2f5f8)'
          label:
          - justify-self: start
          - align-self: start
          - font-size: 12.5px
          - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
          - margin-top: 1px
          card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 2px 2px 6px
          custom_fields:
            badge:
            - justify-self: end
            - align-self: center
          grid:
          - grid-template-areas: '"i n badge" "i l badge"'
          - grid-template-columns: min-content 1fr min-content
          - grid-template-rows: min-content min-content
          img_cell:
          - width: 44px
          - height: 44px
          - border-radius: 13px
          - margin-right: 14px
          - align-self: center
          - background: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 12%, transparent)'
          - border: '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent)'
        tap_action:
          action: none
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        custom_fields:
          list: |
            [[[
              // Listet nur Sensoren mit Wert, damit keine leeren Kacheln entstehen
              const L=[['sensor.iphone_weight','Gewicht','kg',1],['sensor.iphone_body_fat_percentage','Körperfett','%',1],['sensor.iphone_lean_body_mass','Fettfreie Masse','kg',1],['sensor.iphone_height','Größe','cm',0],['sensor.iphone_blood_pressure_systolic','Blutdruck sys.','mmHg',0],['sensor.iphone_blood_pressure_diastolic','Blutdruck dia.','mmHg',0],['sensor.iphone_body_temperature','Körpertemperatur','°C',1],['sensor.iphone_basal_body_temperature','Basaltemperatur','°C',1],['sensor.iphone_blood_glucose','Blutzucker','mg/dL',0],['sensor.iphone_water','Wasser','ml',0]];
              const rows=L.map(([id,n,u,d])=>({id,n,u,v:parseFloat(states[id]?.state),d})).filter(x=>!isNaN(x.v));
              // Gewicht: Datum der letzten echten Aenderung (Automation "Gesundheit: Stand von VO2max und Gewicht merken");
              // ein Wert, der sich nie aendert, ist eher eine einmalige Eingabe als eine Messung. Ab 30 Tagen Amber.
              const gts=states['input_datetime.gewicht_stand']?.attributes?.timestamp;
              const seit=id=>{ if(id!=='sensor.iphone_weight'||!gts) return ''; const tage=Math.floor((Date.now()-gts*1000)/86400000);
                return ` · <span style="color:${tage>=30?'var(--nachtblau-amber, #e6b566)':'var(--nachtblau-text-sekundaer, #8794a5)'};">seit ${new Date(gts*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</span>`; };
              return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;">${rows.map(x=>`
                <div style="border-radius:14px;padding:10px 12px;background:color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 12%, transparent);border:1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent);text-align:left;">
                  <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--nachtblau-blau, #7fb3d5);font-variant-numeric:tabular-nums;">${x.v.toFixed(x.d).replace('.',',')}<span style="font-size:0.55em;color:var(--nachtblau-text-sekundaer, #8794a5);font-weight:600;margin-left:3px;">${x.u}</span></div>
                  <div style="font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);margin-top:2px;">${x.n}${seit(x.id)}</div></div>`).join('')}</div>`;
            ]]]
        styles:
          card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: '0'
          custom_fields:
            list:
            - width: 100%
          grid:
          - grid-template-areas: '"list"'
        tap_action:
          action: none
        triggers_update:
        - input_datetime.gewicht_stand
        - sensor.date
        - sensor.iphone_weight
        - sensor.iphone_body_fat_percentage
        - sensor.iphone_lean_body_mass
        - sensor.iphone_height
        - sensor.iphone_blood_pressure_systolic
        - sensor.iphone_blood_pressure_diastolic
        - sensor.iphone_body_temperature
        - sensor.iphone_basal_body_temperature
        - sensor.iphone_blood_glucose
        - sensor.iphone_water
  - type: custom:decluttering-card
    template: floating_navbar
