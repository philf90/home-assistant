                          el.innerHTML = `<span data-zeit style="padding:4px 9px;border-radius:8px;background:${FLAECHE};border:1.5px solid ${BLAU};color:${HELL};line-height:1.2;white-space:nowrap;"></span>`
                            + `<span style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid ${BLAU};"></span>`
                            + `<span style="width:16px;height:16px;margin-top:2px;border-radius:50%;border:2.5px solid ${BLAU};background:rgba(127,179,213,0.3);box-shadow:0 0 0 1.5px ${GRUND};box-sizing:border-box;"></span>`;
