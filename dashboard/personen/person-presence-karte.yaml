                        // Ortsnamen fuer Aufenthalte ohne Zone, aus der Integration Places
                        // (OpenStreetMap): Sensoren <places_prefix>_place_name und _place_type. Places
                        // fragt bei jeder neuen Position ab und schreibt beide Sensoren zugleich; der
                        // Verlauf speichert nur Aenderungen, deshalb gilt je Zeitpunkt der letzte
                        // Wert beider Sensoren. Strassen (Typ motorway bis footway) nennen keinen Ort
                        // und fallen weg. Haltestellen heissen in OpenStreetMap oft "Ort, Name": Bei
                        // ihnen faellt der Ort vor dem ersten Komma weg (18.11.2026: Places nannte fuer
                        // eine Halle nur die gleichnamige Bushaltestelle davor).
                        const KEIN_ORT = new Set(['', 'unknown', 'unavailable', 'none', 'null']);
                        const STRASSE = new Set(['motorway', 'motorway_link', 'trunk', 'trunk_link', 'primary', 'primary_link', 'secondary', 'secondary_link', 'tertiary', 'tertiary_link', 'unclassified', 'residential', 'living_street', 'service', 'road', 'track', 'pedestrian', 'footway', 'path', 'cycleway', 'bridleway', 'steps', 'busway']);
                        const HALTESTELLE = new Set(['bus_stop', 'tram_stop', 'stop_position', 'platform']);
                        sp.orte = (namen, typen) => {
                          const ev = namen.map((r) => ({ t: r.lu, name: r.s })).concat(typen.map((r) => ({ t: r.lu, typ: r.s }))).sort((a, b) => a.t - b.t);
                          const out = [];
                          let name = '', typ = '';
                          ev.forEach((e) => {
                            if ('name' in e) name = String(e.name ?? ''); else typ = String(e.typ ?? '');
                            const letzte = out[out.length - 1];
                            // beide Sensoren derselben Abfrage liegen Millisekunden auseinander
                            if (letzte && e.t - letzte.t < 2) { letzte.name = name; letzte.typ = typ; } else out.push({ t: e.t, name, typ });
