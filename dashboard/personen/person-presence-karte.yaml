                          };
                          const eintraege = [];
                          tg.fahrten.forEach((f, k) => {
                            const ende = f.pkt[f.pkt.length - 1];
                            const art = hauptArt(erg[k]);
                            const text = { auto: ['Abfahrt', 'Weiterfahrt'], fuss: ['Zu Fuß los', 'Zu Fuß weiter'], rad: ['Mit dem Rad los', 'Mit dem Rad weiter'] }[art][f.nachHalt ? 1 : 0];
                            eintraege.push({ t: abfahrt[k], farbe: BLAU, icon: SYMBOL[art], text, wert: kmTxt(erg[k].kmFest + erg[k].kmGeschaetzt), box: f.pkt.map((x) => [x.lat, x.lon]).concat(erg[k].fest.flat()) });
                            if (f.heim) eintraege.push({ t: ende.t, farbe: GRUEN, icon: heimIcon, text: 'Ankunft zuhause', wert: '', box: [[ende.lat, ende.lon]] });
                          });
                          halte.forEach((h) => eintraege.push({ t: h.von, farbe: VIOLETT, icon: zonenIcon(h.name), text: h.name || h.ort || 'Aufenthalt', wert: dauer(h.bis - h.von), box: [[h.lat, h.lon]] }));
                          eintraege.sort((a, b) => a.t - b.t);
                          ui.eintraege = eintraege;
                          ui.liste.innerHTML = eintraege.map((e, k) => `<div data-eintrag="${k}" style="display:grid;grid-template-columns:40px 16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 9px;border-radius:10px;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);cursor:pointer;">
                              <b style="font-weight:600;font-variant-numeric:tabular-nums;color:var(--nachtblau-text, ${HELL});">${uhr(e.t)}</b>${zeichen(e)}
                              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--nachtblau-text, ${HELL});">${sp.esc(e.text)}</span><span style="font-variant-numeric:tabular-nums;">${e.wert}</span></div>`).join('');
                          ui.liste.style.display = 'flex';
