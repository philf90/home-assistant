                        const strich = (gestrichelt) => `<svg viewBox="0 0 18 6" style="width:18px;height:6px;flex:none;"><line x1="1" y1="3" x2="17" y2="3" stroke="var(--nachtblau-blau, ${BLAU})" stroke-width="${gestrichelt ? 2.4 : 3.2}" stroke-linecap="${gestrichelt ? 'butt' : 'round'}"${gestrichelt ? ' stroke-dasharray="3.4 3"' : ''}/></svg>`;
