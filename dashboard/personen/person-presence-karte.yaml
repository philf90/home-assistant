                        // Ankunft): der naechste genaue Punkt zu Hause innerhalb RAND, ohne eine
                        // andere Abwesenheit zu ueberspringen. Nur die direkte Nachbarzeile reichte
                        // nicht: Am 16.11.2026 war die letzte Zeile zu Hause 64 m ungenau, die Spur
                        // begann 80 m vom Haus entfernt auf der Strasse; 6 s davor lag ein Punkt mit
                        // 5 m. 300 s reichten auch nicht: Am 18.11.2026 (Fussweg 190 m, 20 min an
                        // einer Stelle) lag die letzte Meldung zu Hause 15 min vor dem Aufbruch und
                        // die erste nach der Rueckkehr 5:52 min nach der letzten unterwegs; Hin- und
                        // Rueckweg fehlten. Zu Hause meldet das iPhone etwa alle 15 min. Die
                        // Abfahrt schaetzt sp.rechne, einen Aufenthalt am Haus verhindert sp.tag.
                        const RAND = 1800; // s
                        const nachbar = (z, i, schritt, t) => {
                          for (let k = i; k >= 0 && k < z.length && Math.abs(z[k].t - t) <= RAND; k += schritt) {
                            if (weg(z[k].s)) break;
                            if (z[k].s === 'home' && genau(z[k])) return k;
                          }
                          return -1;
                        };
                        const spannPunkte = (z, [anf, ende]) => {
                          const v = nachbar(z, anf - 1, -1, z[anf].t), n = nachbar(z, ende + 1, 1, z[ende].t);
                          return sp.punkte(z.slice(v >= 0 ? v : anf, (n >= 0 ? n : ende) + 1));
