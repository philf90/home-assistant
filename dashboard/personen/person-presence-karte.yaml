                            b.style.color = an ? HELL : GRAU;
                          });
                          return tag ? sp.tagesansicht(hass, st, ui.z, ui) : sp.letzte(hass, st, ui.z, ui);
                        };
                        // Eine Runde: Historie laden, aktuellen Reiter zeichnen. Rueckgabe: unterwegs?
                        sp.lauf = async (hass, eid, ui) => {
                          try {
                            const ende = new Date(), start = new Date(ende.getTime() - FENSTER * 3600e3);
                            const ortIds = ui.ortPfx ? [ui.ortPfx + '_place_name', ui.ortPfx + '_place_type'].filter((x) => hass.states[x]) : [];
                            const ids = (ui.aktEid && hass.states[ui.aktEid] ? [eid, ui.aktEid] : [eid]).concat(ortIds);
                            const h = await hass.callWS({ type: 'history/history_during_period', start_time: start.toISOString(), end_time: ende.toISOString(), entity_ids: ids, minimal_response: false, no_attributes: false, significant_changes_only: false });
                            ui.z = sp.zeilen(h[eid] || []);
                            ui.akt = ui.aktEid ? sp.aktivitaet(h[ui.aktEid] || []) : [];
                            ui.orte = ortIds.length === 2 ? sp.orte(h[ortIds[0]] || [], h[ortIds[1]] || []) : [];
                            const st = await sp.karte(ui.kasten, eid);
                            return await sp.zeige(hass, st, ui);
                          } catch (e) {
                            ui.info.innerHTML = `<span style="color:var(--nachtblau-amber, #e6b566);">Strecke nicht verfügbar: ${sp.esc(e && e.message ? e.message : e)}</span>`;
                            return false;
                          }
                        };
                        // Start je Popup-Karte; unterwegs jede Minute neu, solange das Popup offen ist.
                        // Den Reiter "Tagesprofil" sieht nur die Person selbst (user_id der Person =
                        // angemeldeter Benutzer), mit tag_fuer: alle jeder.
                        sp.start = (karte, eid, h0, tagFuer, aktEid, ortPfx) => {
                          const r = karte.shadowRoot;
                          const q = (s) => r && r.querySelector(s);
                          const ui = { kasten: q('[data-spur-karte]'), info: q('[data-spur-info]'), liste: q('[data-spur-liste]'), reiter: q('[data-spur-reiter]'), modus: 'letzte', zeitraum: 'heute', z: [], akt: [], aktEid, ortPfx, orte: [], eintraege: [] };
                          const wurzel = q('[data-spur]');
                          if (!ui.kasten || !ui.info || !ui.liste || !ui.reiter || !wurzel) return;
                          // button-card (7.0.1, src/action-handler.ts) ruft auf seiner ha-card bei
                          // touchend preventDefault. Der Browser erzeugt dann fuer den Finger keinen
                          // click: Reiter, Umschalter, Liste und das Antippen der Karte reagierten auf
