                            const bewegt = lauf.filter((x) => x.weg >= 50).reduce((sum, x) => sum + x.dauer, 0);
                            const nb = [auftraege[i - 1], auftraege[j]].filter(Boolean).map((x) => x.r.art);
                            const erben = bewegt <= 900 && nb.length && nb.every((x) => x === nb[0]);
