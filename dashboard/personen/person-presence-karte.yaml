# ============================================================================
# Personen-Praesenz
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       personen
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   person.bewohner, sensor.iphone_*, sensor.places_bewohner
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Personen-Präsenzkarte im Nachtblau-Stil
# Gleiche Kartenhülle, Palette (#a6d49e / #f2f5f8 / #6e7988), Linien-Icons und
# fette Ziffern mit Schwellenwert-Färbung wie owlet-smart-sock-karte.yaml.
#
# Layout: Kopfzeile mit Avatar (links) und Akku-Pille (rechts), darunter Name und
# Status über die volle Kartenbreite -> Texte werden auch bei schmaler
# horizontal-stack-Spalte (iPhone) vollständig angezeigt statt abgeschnitten.
# Zustand "home" -> gruener Ring + gruener Home-Badge, "not_home" -> Graustufen-Foto
# + roter Home-Export-Badge. In einer anderen Zone (Zustand = Zonenname, z. B.
# "Arbeit") -> Graustufen-Foto mit blauem Ring, blauer Badge mit dem Icon der
# Zone, Status-Icon blau, Text = Zonenname. Blau ist die Rolle "Info-Wert"
# (DESIGN.md): ein bekannter Ort, keine Bewertung wie Gruen oder Rot. Die Zone
# kommt aus dem Attribut in_zones der Person (ohne zone.home); ohne Zonen-Icon
# steht eine Stecknadel. Der Rand bleibt Dragonfruit, die Person ist nicht da.
# Akku: gruen >= 30 %, gelb 15-29 %, rot < 15 %.
# Zusaetzlich faerbt sich der linke Kartenrand (4 px) statusabhaengig in den
# Identitaetsfarben: Zuhause -> #4B2E7A, Abwesend -> Dragonfruit #FF4696.
# #4B2E7A ist ein aufgehelltes Night Violet (#1E1033) - der Originalton liegt
# zu nah am Kartenhintergrund #1b2231, um als Rand erkennbar zu sein.
# Beim Laden (charging_entity = ..._battery_state): gruener Akku + Lade-Blitz.
#
# Ort unterwegs: Statt "Unterwegs" steht die Strasse, darunter Ort und Alter
# der letzten Position ("<Ort> · vor 3 Min"). Zwei Quellen:
#   - geocoded_entity: Adress-Sensor der Companion App (iOS: Apple, Android:
#     Geocoder des Systems). Attribute thoroughfare/locality, auf iOS mit
#     Grossbuchstaben und Leerzeichen; "N/A" und "null" gelten als leer.
#   - places_prefix: Integration Places (OpenStreetMap). Liefert zusaetzlich
#     die Strassennummer (route_number, bei Landesstrassen teils in street)
#     und die Richtung zu Hause; im Tagesprofil die Namen der Aufenthalte
#     (Sensoren _place_name und _place_type).
#   Strassennummer: Liefert die App eine Nummer als Strasse (iOS meldete auf
#   der Testfahrt Landesstrassen wie "L 123"), kommt sie von dort, sonst von Places.
#   Das Tempo steht nicht an person.*, sondern am Tracker in deren
#   Attribut source (Einheit m/s).
# Genommen wird die Quelle, deren eigene Position (App: Attribut location,
# Places: Sensoren _latitude/_longitude) naeher an der Position der Person
# liegt, hoechstens 2 km. Fehlt Places die Position, gilt die App bis 150 m
# plus GPS-Ungenauigkeit; fehlen beide Positionen, gilt eine Quelle, wenn sie
# hoechstens 2 min aelter ist als die Position, bei Gleichstand die App.
# Passt keine, steht "Unterwegs" mit "zuletzt <Ort>". Fehlt der gewaehlten
# Quelle die Strasse, kommt sie von der anderen, wenn die nah liegt
# (150 m plus GPS-Ungenauigkeit, ohne Position 30 s).
# Beobachtet: Places hat _latitude/_longitude nach einem Neustart von Home
# Assistant selbst wieder deaktiviert; dann gilt die Regel ohne Places-
# Position (Sensoren unter Einstellungen -> Geraete -> Places wieder an). In Tests auf dem
# Android-Handy kam der App-Sensor unterwegs nicht mit, Places schon; auf dem
# iPhone umgekehrt zuverlaessig. Daher beide.
# Faehrt die Person (Tempo ab 30 km/h oder Aktivitaet Automotive/in_vehicle,
# Position juenger als 10 min) und Places kennt eine Strassennummer, steht
# sie als Schild neben dem Tempo ("A 1  119 km/h"), darunter "bei <Ort>"
# und die Richtung (Places "towards home" -> "Heimweg", "away from home" ->
# "entfernt sich"). Ohne Strassennummer: Strasse, darunter Ort und Tempo.
# Zu Fuss zeigt die Karte keine Richtung, weil sie bei 20-90 m
# GPS-Genauigkeit hin und her springt. Bei 168 px Kartenbreite (S25) passt
# neben Symbol und Schild nur ein kurzer Wert, deshalb steht der Ort darunter.
# Ist die letzte Position 60 min alt oder aelter, steht wieder "Unterwegs",
# darunter "zuletzt <Ort> · vor 1 Std". 15 min waeren zu kurz: Das iPhone
# meldete im Stehen ausserhalb bis zu 30 min lang keine Position.
# sensor.time laesst die Karte jede Minute neu zeichnen (Altersangabe).
# Zonen (Zuhause, Arbeit) haben Vorrang vor der Adresse.
#
# Voraussetzung: custom:button-card und browser_mod (beide HACS), sensor.time
# (Integration "Time & Date"), fuer die Bewegungsspur ein Valhalla-Server und
# das Paket bewegungsspur-konfig.yaml. Optional fuer den Ort: Adress-Sensor
# ..._geocoded_location und Aktivitaet (iOS ..._activity, Android ..._detected_activity) der Companion
# App, in Home Assistant und in der App eingeschaltet; Integration Places
# (HACS) je Person mit eingeschalteten Untersensoren _street,
# _route_number, _city, _last_updated, _direction_of_travel, _latitude und
# _longitude (Places legt street, route_number, last_updated, latitude und
# longitude deaktiviert an). Ohne diese Sensoren
# zeigt die Karte wie bisher "Unterwegs".
#
# Bewegungsspur: Tippen oeffnet ein browser_mod-Popup mit der Strecke der
# laufenden bzw. letzten Abwesenheit, auf Strassen eingerastet, und dem
# Tagesprofil (zweiter Reiter, siehe unten); Halten oeffnet wie bisher den
# Standard-Dialog (more-info). Titel ist der Name der Person,
# darunter ein Kopf: Icon-Kachel und Punkt in der Statusfarbe wie das Badge der
# Karte, "Zuhause seit 09:54" bzw. "Unterwegs seit 09:37", unterwegs "Letzte
# Position vor 3 Min". Das "seit" kommt aus der Historie (48 h, Bibliothek
# window.__nachtblauKopf) und ueberspringt kurze Ausreisser nach derselben
# Regel wie die Strecke (unter 2 min, unbekannt oder als Abwesenheit ohne 2
# genaue Punkte). Bis die Historie da ist, steht der letzte Zustandswechsel.
#
# Ablauf (Bibliothek window.__nachtblauSpur in der Karte "Strecke" im Popup):
#   1. Historie von person.* der letzten 48 h (history/history_during_period,
#      mit Attributen, auch reine Positionsaenderungen). Zeitfenster ist die
#      laufende Abwesenheit, sonst die letzte mit mindestens 2 genauen Punkten;
#      Zonen ausser Zuhause zaehlen als abwesend. Dazu je der naechste genaue
#      Punkt zu Hause bis 30 min vor dem Aufbruch und nach der Rueckkehr
#      (Abfahrt, Ankunft; zu Hause meldet das iPhone etwa alle 15 min). Diese
#      Punkte zaehlen zu keinem Aufenthalt. Die Bedingung ueberspringt
#      Ausreisser: Am 15.11.2026 stand person.* 25 s auf not_home, mit einer
#      Position 2 km entfernt und 100 m Ungenauigkeit. person.* hat dieselben Positionen wie der Handy-Tracker (Messung
#      im Recorder, 05.-15.11.2026), ohne doppelte Zeilen, und folgt einem
#      Trackerwechsel von selbst.
#   2. Filter: Punkte ueber 50 m Ungenauigkeit fallen weg (Android meldete im
#      Stand Netzortungen bis 100 m), von mehreren Meldungen innerhalb einer
#      Sekunde bleibt die genaueste (Android lieferte solche Buendel, teils in
#      falscher Reihenfolge).
#   3. Einrasten mit Valhalla ueber rest_command.valhalla_trace
#      (bewegungsspur-konfig.yaml): Ein Abstand ueber 2 min trennt die Punkte in
#      Gruppen. Jede Gruppe wird fuer sich eingerastet und durchgezogen
#      gezeichnet, jede Luecke einzeln als kuerzester Weg zwischen ihren
#      Endpunkten, gestrichelt (geschaetzt). Eine Anfrage fuer die ganze Fahrt
#      erzwaenge Wenden auf der Strasse: Valhalla legte bei der Testfahrt vom
#      15.11.2026 statt des Rueckwegs auf derselben Strasse einen Bogen um den
#      Block. iOS meldet auf laengeren Fahrten nur etwa alle 5 min, dort ist
#      die Strecke ueberwiegend gestrichelt.
#      Profil je Abschnitt: pedestrian (zu Fuss), bicycle (Rad) oder auto.
#      Mit auto fehlten auf Fusspfaden Linien oder liefen daneben (Simulation
#      Spaziergang 16.11.2026: 64 bzw. 68 % des Wegs abgedeckt, mit
#      pedestrian 100 %). Die Art kommt aus Tempo und Aktivitaetssensor
#      (Variable activity_entity), Regeln in der Bibliothek bei sp.art. Die
#      Texte folgen ihr: "7,8 km zu Fuss", in der Tagesliste "Zu Fuss los".
#      Luecken mit dem Auto ohne unbefestigte Wege (exclude_unpaved): Zwischen
#      zwei Punkten nahm Valhalla sonst Feldwege als kuerzesten Weg (Fahrt
#      16.11.2026: 1,37 km Schotter statt der Landstrasse). Fuer Luecken
#      ausserdem breakage_distance = dreifache Luftlinie, mindestens 10 km
#      (Server-Vorgabe 10 km; Fahrt 18.11.2026: 10,06 km in 5 min auf der
#      Autobahn scheiterte). Der Server muss breakage_distance in
#      meili.customizable freigeben (bewegungsspur-konfig.yaml).
#   4. Karte: das Element ha-map der eingebauten Karten-Karte, mit Marker und
#      Profilbild der Person. ha-map zeichnet eigene Pfade mit einem Kreis an
#      jedem Punkt (auf Touch 8 px), bei einer eingerasteten Linie eine
#      Perlenkette. Die Linien kommen deshalb als eigene Ebenen in die
#      Vektorkarte, ueber interne Methoden der Engine (_engine,
#      _addCustomSource, _addCustomLayer, _setCustomSourceData; Frontend
#      2026.11, maplibre-map-engine.ts). Keine offizielle Schnittstelle: Fehlen
#      sie nach einem Frontend-Update oder ohne WebGL2, zeichnet ha-map die
#      Linien als eigene Pfade (mit Kreisen). Schlaegt das Einrasten fehl, steht
#      dort die ungefilterte Linie mit Hinweis. ha-map legt eigene Ebenen unter
#      die Beschriftung; die Punkte hebt die Karte darueber (moveLayer, auch
#      nach einem Stilwechsel), sonst verschwinden Meldungen in Orten unter
#      deren Namen (Fahrt 17.11.2026).
#   Unterwegs laedt das offene Popup jede Minute neu; gerechnet wird nur, wenn
#   neue Punkte da sind.
# Farben: Linie Blau (Rolle "Info-Wert", wie die Zone), gemessene Punkte
# Hellgrau mit dunklem Rand. Die Kartenebenen nehmen keine Theme-Variablen; im
# hellen Modus bleiben sie in den dunklen Werten. Die Karte selbst folgt dem
# Hell/Dunkel des Themes (Vektorkacheln der Integration map_tiles, ab 2026.9).
# Reiter "Tagesprofil" (ueber der Karte, neben "Letzte Strecke"): alle Wege seit
# Mitternacht, umschaltbar auf die letzten 24 Stunden. Grundlage sind dieselben
# 48 h Historie und dieselben Regeln (Filter, Ausreisser, Einrasten).
#   - Aufenthalt: mindestens 10 min innerhalb von 150 m, oder eine Meldeluecke
#     ab 10 min mit hoechstens 300 m Ortswechsel (iOS meldet im Stand teils
#     30 min nichts). Er trennt die Abwesenheit in Fahrten; jede Fahrt wird fuer
#     sich eingerastet (Ergebnis zwischengespeichert, hoechstens 4 Abrufe
#     gleichzeitig). Testfahrt 13.11.2026 (5 h, Android): 3 Aufenthalte
#     erkannt, darunter 16 min Stand 535 m von Zuhause.
#   - Schilder auf der Karte: Aufenthalt mit Zone (wenn die Person in einer
#     stand) und "von-bis" in Violett, Beginn jeder Fahrt ab Zuhause als
#     "ab HH:MM" in Blau; Schilder innerhalb von 150 m werden zusammengefasst.
#     Marker aus der MapLibre-Instanz der Engine (_maplibre.Marker), ohne sie
#     keine Schilder.
#   - Antippen der Karte: der naechste Messpunkt im Umkreis von 14 px zeigt
#     seine Uhrzeit, in beiden Reitern. Eigenes Schild (_maplibre.Marker):
#     Das Popup von MapLibre gestaltet ha-map grau, die Uhrzeit
#     hatte darauf 2,15:1 Kontrast. Jetzt Flaeche #222b3c mit Text #f2f5f8
#     (12,98:1) und blauem Rand, lesbar auf dunkler und heller Karte.
#   - Tagesliste unter der Karte: Abfahrt bzw. Weiterfahrt mit km, Aufenthalt
#     mit Dauer, Ankunft zuhause; Antippen zeigt den Eintrag auf der Karte.
#     Wege mit Symbol ihrer Art (mdi:car, mdi:walk, mdi:bike), Ankunft zuhause
#     und Aufenthalte in einer Zone mit dem Icon der Zone, sonst ein Punkt.
#     Name eines Aufenthalts: die Zone, sonst der Ortsname aus Places
#     (<places_prefix>_place_name, Typ aus _place_type), der waehrend des
#     Aufenthalts am laengsten galt; Strassen zaehlen nicht, bei Haltestellen
#     ("Ort, Name") faellt der Ort weg. Ohne Namen steht "Aufenthalt".
#     Abfahrt: Beginnt ein Weg mit einer Luecke, gilt der naechste Punkt minus
#     Fahrzeit laut Valhalla (das iPhone meldet im Stand nichts); ein
#     Aufenthalt endet mit dieser Abfahrt.
#   Sichtbar ist der Reiter nur fuer die Person selbst: Attribut user_id der
#   Person gleich dem angemeldeten Benutzer. Variable tag_fuer der
#   Personenkarte: eigene (Standard) oder alle. Andere sehen nur die letzte
#   Strecke, wie bisher. Das ist eine Anzeigeregel, kein Zugriffsschutz: Die
#   Historie ist fuer jeden Benutzer der Instanz abrufbar.
# Groesse: Popup hoechstens 480 px breit, Karte quadratisch, hoechstens
# 100vh - 260 px (Reiter "Letzte Strecke") bzw. 100vh - 390 px (Tagesprofil,
# darunter die Liste mit hoechstens 104 px, drei Zeilen, scrollbar), jeweils
# abzueglich Safe Area oben und unten (env()). Grundlage: Bildschirmfoto
# iPhone 17 Pro vom 15.11.2026, Karte 2:3 war 551 px hoch, Beginn bei 288 px,
# Ende bei 839 von 874 px; im Tagesprofil musste man scrollen. Jetzt
# gemessen (Chromium, Touch): 360 px breit 344 x 344 bzw. 344 x 307 (bei
# 697 px Hoehe), 402 px breit 386 x 386 in beiden Reitern.
# Die Spur braucht die Integration history (Standard); wie weit sie
# zurueckreicht, begrenzt der Recorder (purge_keep_days).
type: horizontal-stack
cards:
  - type: custom:button-card
    entity: person.bewohner
    variables:
      battery_entity: sensor.iphone_battery_level
      charging_entity: sensor.iphone_battery_state
      geocoded_entity: sensor.iphone_geocoded_location
      activity_entity: sensor.iphone_activity
      places_prefix: sensor.places_bewohner
      avatar_fallback: linear-gradient(160deg,#4a5a74,#33404f)
      # Reiter Tagesprofil im Popup: eigene = nur die Person selbst, alle = jeder
      tag_fuer: eigene
    tap_action: &spur_popup
      # Browser-Aufruf (fire-dom-event): das Popup oeffnet nur auf dem Geraet, auf
      # dem getippt wurde. Als Dienstaufruf ohne browser_id ginge es laut
      # browser_mod-Doku an alle registrierten, gerade verbundenen Browser.
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        # button-card wertet beim Tippen jedes [[[ ]]] in der Aktion aus
        # (_objectEvalTemplate): Titel und Entitaet kommen so von der Karte, die
        # Aktion gilt fuer beide Personen. [[[[ ]]]] (vier Klammern) verschont
        # button-card beim Tippen und reicht es als [[[ ]]] an die Karte im
        # Popup weiter: Der Kopf rechnet dort live (Minutentakt ueber sensor.time).
        data:
          title: '[[[ return (entity && entity.attributes.friendly_name) || "Bewegung"; ]]]'
          # Oberflaeche wie im Tankstellen- und DWD-Popup (warnlage-templates.yaml,
          # Erklaerung dort), Breite auf 480 px gedeckelt (Kartenhoehe, siehe oben)
          style: |
            --ha-card-background: var(--nachtblau-huelle-oben, #1b2231);
            --card-background-color: var(--nachtblau-huelle-oben, #1b2231);
            --primary-background-color: var(--nachtblau-seite, #171d29);
            --secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);
            --primary-text-color: var(--nachtblau-text, #f2f5f8);
            --secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);
            --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
            --popup-min-width: min(100vw, 480px);
            --popup-max-width: min(100vw, 480px);
          content:
            type: vertical-stack
            cards:
              # Kopf: Icon-Kachel in der Statusfarbe der Karte (Gruen zuhause,
              # Blau in einer Zone, Rot unterwegs), darunter Status mit Uhrzeit
              # und unterwegs das Alter der letzten Position
              - type: custom:button-card
                entity: '[[[ return entity.entity_id; ]]]'
                show_name: false
                show_state: false
                show_icon: false
                show_label: false
                tap_action:
                  action: none
                hold_action:
                  action: none
                styles:
                  card:
                    - padding: 2px 4px 6px
                    - background: none
                    - border: none
                    - box-shadow: none
                    - cursor: default
                  grid:
                    - grid-template-areas: '"kopf"'
                  custom_fields:
                    kopf:
                      - width: 100%
                      - min-width: 0
                custom_fields:
                  kopf: |
                    [[[[
                      const e = entity;
                      states['sensor.time']; // Minutentakt fuer das Alter der Position
                      const gruen = 'var(--nachtblau-gruen, #a6d49e)';
                      const blau = 'var(--nachtblau-blau, #7fb3d5)';
                      const rot = 'var(--nachtblau-rot, #f0736a)';
                      const text = 'var(--nachtblau-text, #f2f5f8)';
                      const sek = 'var(--nachtblau-text-sekundaer, #8794a5)';
                      const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                      const raw = e ? e.state : 'unknown';
                      const home = raw === 'home';
                      const weg = raw === 'not_home';
                      const unbekannt = !e || ['unknown', 'unavailable'].includes(raw);
                      const zone = !home && !weg && !unbekannt;
                      const farbe = home ? gruen : (zone ? blau : (weg ? rot : sek));
                      const status = home ? 'Zuhause' : (weg ? 'Unterwegs' : (unbekannt ? 'Ort unbekannt' : esc(raw)));
                      // Uhrzeit: heute "09:54", gestern "gestern 18:51", sonst "Mo 16:35"
                      const uhr = (t) => {
                        const d = new Date(t);
                        const hm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                        const heute = new Date(); heute.setHours(0, 0, 0, 0);
                        if (d >= heute) return hm;
                        if (d >= heute.getTime() - 86400000) return 'gestern ' + hm;
                        return d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '') + ' ' + hm;
                      };
                      // "seit": Beginn des aktuellen Zustands ohne kurze Ausreisser. Ein Abschnitt
                      // mit anderem Zustand zaehlt nicht, wenn er kuerzer als 2 min ist, unbekannt
                      // war oder als Abwesenheit keine 2 genauen Punkte (bis 50 m) hat; wie die
                      // Strecke unten. Am 15.11.2026 zeigte der Kopf sonst "Zuhause seit 19:32"
                      // nach einem 25-s-Sprung, statt 19:02. Historie: 48 h, einmal je Zustandswechsel.
                      const VERSION = 2;
                      if (!window.__nachtblauKopf || window.__nachtblauKopf.version !== VERSION) {
                        const kp = { version: VERSION, cache: {} };
                        kp.beginn = (rows) => {
                          let attr = null;
                          const z = rows.map((r) => { if (r.a) attr = r.a; return { s: r.s, a: r.a || attr, t: r.lu }; });
                          if (!z.length) return null;
                          const genau = (x) => x.a && typeof x.a.latitude === 'number' && (x.a.gps_accuracy ?? 999) <= 50;
                          // Abschnitte gleichen Zustands
                          const ab = [];
                          z.forEach((x) => {
                            const l = ab[ab.length - 1];
                            if (l && l.s === x.s) { l.genau += genau(x) ? 1 : 0; return; }
                            ab.push({ s: x.s, von: x.t, genau: genau(x) ? 1 : 0 });
                          });
                          ab.forEach((x, i) => { x.bis = i + 1 < ab.length ? ab[i + 1].von : Infinity; });
                          const ausreisser = (x) => ['unknown', 'unavailable'].includes(x.s) || x.bis - x.von < 120
                            || (x.s !== 'home' && x.genau < 2);
                          let i = ab.length - 1;
                          const jetzt = ab[i].s;
                          // Rueckwaerts: Ausreisser zwischen zwei Abschnitten des aktuellen Zustands ueberspringen
                          for (let k = i - 1; k >= 0; k--) {
                            if (!ausreisser(ab[k])) break;
                            if (k - 1 >= 0 && ab[k - 1].s === jetzt) { i = k - 1; k = i; continue; }
                            if (k - 1 < 0) break;
                          }
                          return ab[i].von;
                        };
                        kp.lade = async (hass, eid) => {
                          const ende = new Date(), start = new Date(ende.getTime() - 48 * 3600e3);
                          const h = await hass.callWS({ type: 'history/history_during_period', start_time: start.toISOString(), end_time: ende.toISOString(), entity_ids: [eid], minimal_response: false, no_attributes: false, significant_changes_only: false });
                          return kp.beginn(h[eid] || []);
                        };
                        window.__nachtblauKopf = kp;
                      }
                      const kp = window.__nachtblauKopf;
                      let seitT = e ? Date.parse(e.last_changed) : NaN;
                      if (e) {
                        const c = kp.cache[e.entity_id];
                        if (!c || c.lc !== e.last_changed) {
                          const karte = this, hh = this._hass || hass, eintrag = { lc: e.last_changed, t: null };
                          kp.cache[e.entity_id] = eintrag;
                          kp.lade(hh, e.entity_id).then((t) => {
                            // Nur frueher als der letzte Wechsel uebernehmen; beginnt der Abschnitt am
                            // Anfang der 48 h, gilt der letzte Wechsel
                            if (t && t * 1000 < seitT - 1000) { eintrag.t = t * 1000; if (karte.requestUpdate) karte.requestUpdate(); }
                          }).catch(() => {});
                        } else if (c.t) {
                          seitT = c.t;
                        }
                      }
                      const seit = !unbekannt && !isNaN(seitT) ? ' seit ' + uhr(seitT) : '';
                      const posT = e ? Date.parse(e.last_updated) : NaN;
                      const min = isNaN(posT) ? null : Math.max(0, Math.floor((Date.now() - posT) / 60000));
                      const alter = min === null ? '' : (min < 1 ? 'gerade eben' : (min < 60 ? `vor ${min} Min` : 'um ' + uhr(posT)));
                      const zeile2 = weg && alter ? `Letzte Position ${alter}` : '';
                      const zweiZeilen = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';
                      return `
                        <div style="display:flex;align-items:center;gap:12px;min-width:0;text-align:left;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                          <div style="width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;color:${farbe};background:color-mix(in srgb, ${farbe} 16%, transparent);border:1px solid color-mix(in srgb, ${farbe} 24%, transparent);">
