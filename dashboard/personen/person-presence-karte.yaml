                      }
                      const sp = window.__nachtblauSpur;
                      if (!this.__spurGestartet) {
                        this.__spurGestartet = true;
                        const karte = this, eid = entity.entity_id, h0 = hass, tagFuer = variables.tag_fuer || 'eigene', aktEid = variables.aktivitaet || '', ortPfx = variables.places || '';
                        setTimeout(() => sp.start(karte, eid, h0, tagFuer, aktEid, ortPfx), 50);
                      }
                      const knopf = (modus, text) => `<button type="button" data-modus="${modus}" style="flex:1;font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding:7px 4px;border:0;border-radius:9px;cursor:pointer;background:${modus === 'letzte' ? '#222b3c' : 'transparent'};color:${modus === 'letzte' ? '#f2f5f8' : '#8794a5'};">${text}</button>`;
                      return `<div data-spur style="display:flex;flex-direction:column;gap:8px;text-align:left;white-space:normal;pointer-events:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                        <div data-spur-reiter style="display:none;gap:4px;padding:3px;border-radius:12px;background:#10151d;">${knopf('letzte', 'Letzte Strecke')}${knopf('tag', 'Tagesprofil')}</div>
                        <div data-spur-info style="min-height:16px;font-size:12.5px;line-height:1.35;color:var(--nachtblau-text-sekundaer, #8794a5);">Strecke wird geladen …</div>
                        <div data-spur-karte style="width:100%;aspect-ratio:1 / 1;max-height:${sp.hochLetzte};border-radius:14px;overflow:hidden;background:#10151d;"></div>
                        <div data-spur-liste style="display:none;flex-direction:column;gap:5px;max-height:104px;overflow-y:auto;font-size:12.5px;color:var(--nachtblau-text-sekundaer, #8794a5);"></div>
                      </div>`;
                    ]]]]
    hold_action:
      action: more-info
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    styles:
      card:
        - padding: 14px 15px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - overflow: hidden
        # Beide Karten gleich hoch: Die Huelle fuellt die Zeile des
        # horizontal-stack (wie energie_mb_kachel). Ohne das ist die Karte
        # mit Unterzeile ("Ort · vor 3 Min") hoeher als die andere.
        - height: 100%
        # Statusrand links (Vorbild: Warnungsblock im Meteoalarm-Popup,
