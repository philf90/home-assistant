                          const k = schluessel(pkt) + '|' + auftraege.map((a) => a.art[0]).join('');
                          if (sp.cache[k]) return sp.cache[k];
                          // Luecke mit dem Auto: unbefestigte Wege ausschliessen. Zwischen nur zwei
                          // Punkten nimmt das Map-Matching den kuerzesten Weg und dafuer auch
                          // Feldwege; Fahrt 16.11.2026: 1,6 km Luftlinie, 2,04 km davon 1,37 km
                          // Schotter-Feldweg statt der Landstrasse; mit exclude_unpaved 2,32 km ohne
                          // Feldweg, Routenplanung (route) 2,34 km. 35 Luecken der Testfahrten A1-B4 (als Auto):
                          // nur A2 (dasselbe Muster, 1,37 km Feldweg) und eine um 0,03 km anders.
                          // Gemessene Gruppen bleiben ohne die Option: Dort zeigen die Punkte, wo
                          // gefahren wurde.
                          const LUECKE_AUTO = { auto: { exclude_unpaved: true } };
                          // Luecke: breakage_distance (Server 10 000 m, in meili.customizable
                          // freigegeben) auf das Dreifache der Luftlinie, mindestens 10 000 m. Fahrt
                          // 18.11.2026: 10,06 km Luftlinie in 301 s auf der Autobahn, Valhalla
