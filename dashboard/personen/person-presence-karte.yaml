                            belegt = false;
                            if (!laufend) { clearInterval(karte.__spurTakt); karte.__spurTakt = null; }
                            else if (!karte.__spurTakt) karte.__spurTakt = setInterval(runde, 60000);
                          };
                          const wechsel = async () => {
                            if (belegt || !ui.kasten.__spur || !ui.z.length) return;
                            belegt = true;
                            try { await sp.zeige(hass(), ui.kasten.__spur, ui); } finally { belegt = false; }
                          };
                          ui.reiter.addEventListener('click', (ev) => {
                            const b = ev.target.closest('[data-modus]');
