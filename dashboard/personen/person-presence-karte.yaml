                            const name = HALTESTELLE.has(o.typ) && o.name.includes(', ') ? o.name.slice(o.name.indexOf(', ') + 2) : o.name;
                            dauer.set(name.trim(), (dauer.get(name.trim()) || 0) + Math.max(0, ende - Math.max(von, o.t)));
                          });
                          let best = '', max = -1;
                          dauer.forEach((d, n) => { if (d > max) { best = n; max = d; } });
                          return best;
