                        // nichts). Name: die Zone, in der die Person dabei stand, sonst leer.
                        sp.halte = (pkt) => {
                          const out = [];
                          let i = 0;
                          while (i < pkt.length) {
                            let j = i;
                            while (j + 1 < pkt.length && meter(pkt[i], pkt[j + 1]) <= HALT_M) j++;
                            if (j > i && pkt[j].t - pkt[i].t >= HALT_S) { out.push([i, j]); i = j + 1; }
                            else if (i + 1 < pkt.length && pkt[i + 1].t - pkt[i].t >= HALT_S && meter(pkt[i], pkt[i + 1]) <= 2 * HALT_M) { out.push([i, i + 1]); i += 2; }
