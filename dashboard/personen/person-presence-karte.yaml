                          });
                          ui.info.addEventListener('click', (ev) => {
                            const b = ev.target.closest('[data-zeitraum]');
                            if (b && b.dataset.zeitraum !== ui.zeitraum) { ui.zeitraum = b.dataset.zeitraum; wechsel(); }
                          });
