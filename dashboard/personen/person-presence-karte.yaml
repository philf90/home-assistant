                          });
                          return { fahrten, halte, laufend };
                        };
                        sp.valhalla = async (hass, pts, profil, optionen, spur) => {
                          const anfrage = {
                            shape: pts.map((x) => ({ lat: +x.lat.toFixed(6), lon: +x.lon.toFixed(6), time: Math.round(x.t) })),
                            costing: profil || 'auto', shape_match: 'map_snap',
                            directions_options: { units: 'kilometers', narrative: false },
                          };
                          if (optionen) anfrage.costing_options = optionen;
                          if (spur) anfrage.trace_options = spur;
                          const res = await hass.callWS({ type: 'call_service', domain: 'rest_command', service: 'valhalla_trace', service_data: { anfrage: JSON.stringify(anfrage) }, return_response: true });
                          const a = res && res.response;
                          if (!a || a.status !== 200 || !a.content || !a.content.trip) throw new Error('HTTP ' + (a ? a.status : '?'));
                          // Weitere Teilstuecke bei Unterbrechungen stehen unter alternates
                          const teile = [a.content.trip].concat((a.content.alternates || []).map((x) => x.trip));
                          return {
                            linien: teile.map((t) => t.legs.reduce((acc, leg) => acc.concat(sp.dec(leg.shape)), [])).filter((l) => l.length > 1),
                            km: teile.reduce((s, t) => s + t.summary.length, 0),
                            // Fahrzeit laut Valhalla (Profil, nicht die Zeitstempel der Punkte), s
                            zeit: teile.reduce((s, t) => s + t.summary.time, 0),
                          };
                        };
                        // Hoechstens n Auftraege gleichzeitig (ein Tag kann viele Abschnitte haben)
                        const gedrosselt = async (auftraege, n) => {
                          const erg = new Array(auftraege.length);
                          let next = 0;
                          const arbeiter = async () => { while (next < auftraege.length) { const k = next++; erg[k] = await auftraege[k](); } };
                          await Promise.all(Array.from({ length: Math.min(n, auftraege.length) }, arbeiter));
                          return erg;
                        };
                        const schluessel = (pkt) => pkt.length + '|' + pkt[0].t + '|' + pkt[pkt.length - 1].t;
                        // Fortbewegung je Abschnitt, daraus das Profil fuer Valhalla. Mit "auto"
                        // fehlten auf Fusspfaden Linien oder liefen als Gerade bzw. Umweg daneben
                        // (Simulation Spaziergang 16.11.2026: 64 bzw. 68 % des Wegs abgedeckt, mit
                        // "pedestrian" 100 %). Reihenfolge:
                        //   1. Tempo ab 40 km/h, oder ab 25 km/h ohne Rad: Auto (Sensoren hinken nach)
                        //   2. Aktivitaetssensor des Handys (activity_entity der Karte), wenn er im
                        //      Abschnitt mindestens 30 % der Zeit eine Fortbewegung meldet:
                        //      Gehen/Laufen -> Fuss, Rad -> Rad, Auto/Fahrzeug -> Auto
                        //   3. sonst Tempo: ab 15 km/h Auto, darunter Fuss
