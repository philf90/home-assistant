              # Strecke: laufende bzw. letzte Abwesenheit, auf Strassen eingerastet
              # (Valhalla ueber rest_command.valhalla_trace, bewegungsspur-konfig.yaml).
              # Erklaerung im Kopfkommentar der Datei, Abschnitt "Bewegungsspur".
              - type: custom:button-card
                entity: '[[[ return entity.entity_id; ]]]'
                # tag_fuer der Personenkarte, beim Tippen ausgewertet (siehe oben)
                variables:
                  tag_fuer: '[[[ return variables.tag_fuer || "eigene"; ]]]'
                  # Aktivitaetssensor des Handys fuer die Wahl Fuss/Rad/Auto
                  aktivitaet: '[[[ return variables.activity_entity || ""; ]]]'
                  # Places-Praefix: Ortsnamen fuer Aufenthalte ohne Zone (Tagesliste)
                  places: '[[[ return variables.places_prefix || ""; ]]]'
                show_name: false
                show_state: false
                show_icon: false
                show_label: false
                tap_action:
                  action: none
                hold_action:
                  action: none
                styles:
                  card:
                    - padding: 0 4px 4px
                    - background: none
                    - border: none
                    - box-shadow: none
                    - cursor: default
                  grid:
                    - grid-template-areas: '"spur"'
                  custom_fields:
                    spur:
                      - width: 100%
                      - min-width: 0
                custom_fields:
                  spur: |
                    [[[[
                      // Bibliothek, einmal pro Seite. VERSION bei jeder Aenderung erhoehen.
                      const VERSION = 14;
                      if (!window.__nachtblauSpur || window.__nachtblauSpur.version !== VERSION) {
                        const sp = { version: VERSION, cache: {} };
                        const LUECKE = 120;    // s: groessere Abstaende gelten als geschaetzt
                        const GENAU = 50;      // m: ungenauere Punkte (Netzortung) fallen weg
                        const FENSTER = 48;    // h Historie (deckt Letzte Strecke, Heute und 24 Std)
                        const HALT_S = 600;    // s: Aufenthalt ab 10 Min ...
                        const HALT_M = 150;    // m: ... im Umkreis von 150 m
                        const BLAU = '#7fb3d5', VIOLETT = '#b399d4', GRUEN = '#a6d49e', PUNKT = '#b4c0cf';
                        const GRUND = '#10151d', FLAECHE = '#222b3c', HELL = '#f2f5f8', GRAU = '#8794a5';
                        // Kartenhoehe: quadratisch, hoechstens so hoch, dass das Popup ohne Scrollen
                        // passt. Abzug = alles ausser der Karte (iPhone 17 Pro gemessen: 288 px bis
                        // zur Karte inkl. 62 px Statusleiste, darunter ~24 px Rand) ohne Safe Area,
                        // die env() je Geraet abzieht; im Tagesprofil zusaetzlich Liste (104 px),
                        // Abstand und Umschalter.
                        const SICHER = 'env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)';
                        const HOCH_LETZTE = `calc(100vh - 260px - ${SICHER})`;
                        const HOCH_TAG = `calc(100vh - 390px - ${SICHER})`;
                        sp.hochLetzte = HOCH_LETZTE;
                        const SCHRIFT = "-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";
                        sp.esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        // Polyline mit Genauigkeit 6 (Valhalla)
                        sp.dec = (s) => {
                          let i = 0, lat = 0, lon = 0; const out = [];
                          while (i < s.length) {
                            for (let k = 0; k < 2; k++) {
                              let sh = 0, res = 0, b;
                              do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
                              const d = (res & 1) ? ~(res >> 1) : (res >> 1);
                              if (k === 0) lat += d; else lon += d;
                            }
                            out.push([lat / 1e6, lon / 1e6]);
                          }
                          return out;
                        };
                        const meter = (a, b) => {
                          const r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
                          const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
                          return 12742000 * Math.asin(Math.sqrt(h));
