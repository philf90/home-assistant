                        sp.punkte = (z) => {
                          const p = z.filter(genau)
                            .map((x) => ({ lat: x.a.latitude, lon: x.a.longitude, acc: x.a.gps_accuracy ?? 999, t: x.t, s: x.s }))
                            .sort((a, b) => a.t - b.t);
                          const out = [];
                          p.forEach((x) => {
                            const l = out[out.length - 1];
                            if (l && x.t - l.t < 1) { if (x.acc < l.acc) out[out.length - 1] = x; return; }
