                            return { i, j, von: pkt[i].t, bis: pkt[j].t, lat: teil.reduce((s, x) => s + x.lat, 0) / teil.length, lon: teil.reduce((s, x) => s + x.lon, 0) / teil.length, name: zone || '' };
