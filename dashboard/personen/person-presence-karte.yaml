                        // Letzte Strecke: laufende oder juengste echte Abwesenheit
                        sp.abwesenheit = (z) => {
                          const wahl = spannen(z).find((s, k) => (k === 0 && s[1] === z.length - 1) || echt(z, s));
                          if (!wahl) return { pkt: [], laufend: false };
                          return { pkt: spannPunkte(z, wahl), laufend: wahl[1] === z.length - 1 };
