                        const weg = (s) => s !== 'home' && s !== 'unknown' && s !== 'unavailable';
                        const genau = (x) => x.a && typeof x.a.latitude === 'number' && typeof x.a.longitude === 'number' && (x.a.gps_accuracy ?? 999) <= GENAU;
                        // Zeilen der Historie (person.*) -> {s, a, t}; eine Zeile ohne Attribute erbt die der vorigen
                        sp.zeilen = (rows) => {
                          let attr = null;
                          return rows.map((r) => { if (r.a) attr = r.a; return { s: r.s, a: r.a || attr, t: r.lu }; });
