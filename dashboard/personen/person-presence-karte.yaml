# ============================================================================
# Personen-Praesenz
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       personen
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   person.bewohner, sensor.iphone_*, sensor.places_bewohner
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Personen-Präsenzkarte im Nachtblau-Stil
# Gleiche Kartenhülle, Palette (#a6d49e / #f2f5f8 / #6e7988), Linien-Icons und
# fette Ziffern mit Schwellenwert-Färbung wie owlet-smart-sock-karte.yaml.
#
# Layout: Kopfzeile mit Avatar (links) und Akku-Pille (rechts), darunter Name und
# Status über die volle Kartenbreite -> Texte werden auch bei schmaler
# horizontal-stack-Spalte (iPhone) vollständig angezeigt statt abgeschnitten.
# Zustand "home" -> gruener Ring + gruener Home-Badge, "not_home" -> Graustufen-Foto
# + roter Home-Export-Badge. In einer anderen Zone (Zustand = Zonenname, z. B.
# "Arbeit") -> Graustufen-Foto mit blauem Ring, blauer Badge mit dem Icon der
# Zone, Status-Icon blau, Text = Zonenname. Blau ist die Rolle "Info-Wert"
# (DESIGN.md): ein bekannter Ort, keine Bewertung wie Gruen oder Rot. Die Zone
# kommt aus dem Attribut in_zones der Person (ohne zone.home); ohne Zonen-Icon
# steht eine Stecknadel. Der Rand bleibt Dragonfruit, die Person ist nicht da.
# Akku: gruen >= 30 %, gelb 15-29 %, rot < 15 %.
# Zusaetzlich faerbt sich der linke Kartenrand (4 px) statusabhaengig in den
# Identitaetsfarben: Zuhause -> #4B2E7A, Abwesend -> Dragonfruit #FF4696.
# #4B2E7A ist ein aufgehelltes Night Violet (#1E1033) - der Originalton liegt
# zu nah am Kartenhintergrund #1b2231, um als Rand erkennbar zu sein.
# Beim Laden (charging_entity = ..._battery_state): gruener Akku + Lade-Blitz.
#
# Ort unterwegs: Statt "Unterwegs" steht die Strasse, darunter Ort und Alter
# der letzten Position ("<Ort> · vor 3 Min"). Zwei Quellen:
#   - geocoded_entity: Adress-Sensor der Companion App (iOS: Apple, Android:
#     Geocoder des Systems). Attribute thoroughfare/locality, auf iOS mit
#     Grossbuchstaben und Leerzeichen; "N/A" und "null" gelten als leer.
#   - places_prefix: Integration Places (OpenStreetMap). Liefert zusaetzlich
#     die Strassennummer (route_number, bei Landesstrassen teils in street)
#     und die Richtung zu Hause.
# Genommen wird die Quelle, die zur letzten Position der Person passt
# (hoechstens 2 min aelter); passen beide, gewinnt die App. In Tests auf dem
# Android-Handy kam der App-Sensor unterwegs nicht mit, Places schon; auf dem
# iPhone umgekehrt zuverlaessig. Daher beide.
# Faehrt die Person (Tempo ab 30 km/h oder Aktivitaet Automotive/in_vehicle,
# Position juenger als 10 min) und Places kennt eine Strassennummer, steht
# sie als Schild neben dem Tempo ("A 1  119 km/h"), darunter "bei <Ort>"
# und die Richtung (Places "towards home" -> "Heimweg", "away from home" ->
# "entfernt sich"). Ohne Strassennummer: Strasse, darunter Ort und Tempo.
# Zu Fuss zeigt die Karte keine Richtung, weil sie bei 20-90 m
# GPS-Genauigkeit hin und her springt. Bei 168 px Kartenbreite (S25) passt
# neben Symbol und Schild nur ein kurzer Wert, deshalb steht der Ort darunter.
# Ist die letzte Position 60 min alt oder aelter, steht wieder "Unterwegs",
# darunter "zuletzt <Ort> · vor 1 Std". 15 min waeren zu kurz: Das iPhone
# meldete im Stehen ausserhalb bis zu 30 min lang keine Position.
# sensor.time laesst die Karte jede Minute neu zeichnen (Altersangabe).
# Zonen (Zuhause, Arbeit) haben Vorrang vor der Adresse.
#
# Voraussetzung: custom:button-card (HACS), sensor.time (Integration "Time &
# Date"). Optional fuer den Ort: Adress-Sensor ..._geocoded_location und
# Aktivitaet (iOS ..._activity, Android ..._detected_activity) der Companion
# App, in Home Assistant und in der App eingeschaltet; Integration Places
# (HACS) je Person mit eingeschalteten Untersensoren _street,
# _route_number, _city, _last_updated und _direction_of_travel (Places legt
# street, route_number und last_updated deaktiviert an). Ohne diese Sensoren
# zeigt die Karte wie bisher "Unterwegs".
type: horizontal-stack
cards:
  - type: custom:button-card
    entity: person.bewohner
    variables:
      battery_entity: sensor.iphone_battery_level
      charging_entity: sensor.iphone_battery_state
      geocoded_entity: sensor.iphone_geocoded_location
      activity_entity: sensor.iphone_activity
      places_prefix: sensor.places_bewohner
      avatar_fallback: linear-gradient(160deg,#4a5a74,#33404f)
    tap_action:
      action: more-info
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    styles:
      card:
        - padding: 14px 15px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - overflow: hidden
        # Beide Karten gleich hoch: Die Huelle fuellt die Zeile des
        # horizontal-stack (wie energie_mb_kachel). Ohne das ist die Karte
        # mit Unterzeile ("Ort · vor 3 Min") hoeher als die andere.
        - height: 100%
        # Statusrand links (Vorbild: Warnungsblock im Meteoalarm-Popup,
        # meteoalarm-karte.yaml -> border-left:3px solid ${color}).
        # Muss NACH "border" stehen, sonst ueberschreibt die Kurzform hier.
        - border-left: &edge_tpl |
            [[[
              return (entity && entity.state === 'home')
                ? '4px solid #4B2E7A'
                : '4px solid #FF4696';
            ]]]
      grid:
        - grid-template-areas: '"body"'
        # Inhalt oben halten: #container von button-card v7 hat height: 100%
        # und align-items/align-content: center, in der gestreckten Karte
        # saesse der Inhalt sonst mittig.
        - align-content: start
        - align-items: start
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
    custom_fields:
      body: &body_tpl |
        [[[
          // ---------- Nachtblau-Palette ----------
          const green = 'var(--nachtblau-gruen, #a6d49e)';
          const value = 'var(--nachtblau-text, #f2f5f8)';
          const muted = 'var(--nachtblau-text-sekundaer, #8794a5)';
          const warn  = 'var(--nachtblau-amber, #e6b566)';
          const bad   = 'var(--nachtblau-rot, #f0736a)';
          const cardBot = 'var(--nachtblau-huelle-unten, #171d29)';

          // ---------- Person ----------
          const e = entity;
          const home = e && e.state === 'home';
          const stateMap = { home: 'Zuhause', not_home: 'Unterwegs' };
          const raw = e ? e.state : 'unknown';
          const statusLabel = stateMap[raw] || (raw.charAt(0).toUpperCase() + raw.slice(1));
          const pic  = e && e.attributes ? e.attributes.entity_picture : null;
          const name = (e && e.attributes && e.attributes.friendly_name) || '';
          const initial = name ? name.trim().charAt(0).toUpperCase() : '?';
          // Andere Zone: Zustand ist der Zonenname, in_zones nennt die Zone.
          const blau = 'var(--nachtblau-blau, #7fb3d5)';
          const inZone = !home && !!e && !['not_home', 'unknown', 'unavailable'].includes(e.state);
          const zonen = (e && e.attributes && Array.isArray(e.attributes.in_zones)) ? e.attributes.in_zones : [];
          const zoneId = zonen.find((z) => z !== 'zone.home');
          const zoneIcon = inZone && zoneId && states[zoneId] ? states[zoneId].attributes.icon : null;
          const accent = home ? green : (inZone ? blau : muted);
          const fb = variables.avatar_fallback || 'linear-gradient(160deg,#4a5a74,#33404f)';

          // ---------- Ort unterwegs: Adress-Sensor der App + Places ----------
          states['sensor.time']; // liest die Uhrzeit, damit button-card jede Minute neu zeichnet (Alter)
          const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const leer = (v) => v === undefined || v === null || ['', 'unknown', 'unavailable', 'null', 'n/a', 'none'].includes(String(v).trim().toLowerCase());
          const zeit = (v) => { if (leer(v)) return null; const t = Date.parse(String(v).trim().replace(' ', 'T')); return isNaN(t) ? null : t; };
          // Attribut ohne Ruecksicht auf Schreibweise: iOS "Thoroughfare", Android "thoroughfare"
          const attr = (o, k) => {
            if (!o || !o.attributes) return null;
            const key = Object.keys(o.attributes).find((x) => x.toLowerCase().replace(/ /g, '_') === k);
            return key && !leer(o.attributes[key]) ? String(o.attributes[key]).trim() : null;
          };
          const pz = variables.places_prefix || '';
          const pl = (s) => { const o = pz ? states[pz + '_' + s] : null; return o && !leer(o.state) ? String(o.state).trim() : null; };
          const posT = e ? zeit(e.last_updated) : null;
          const frisch = (t) => t !== null && posT !== null && t >= posT - 120000;
          const geo = states[variables.geocoded_entity];
          const geoT = geo && !leer(geo.state) ? zeit(geo.last_updated) : null;
          const geoStr = attr(geo, 'thoroughfare');
          const geoOrt = attr(geo, 'locality');
          const plT = zeit(pl('last_updated'));
          const plStr = pl('street');
          const plOrt = pl('city');
          const geoOk = geoT !== null && !!(geoStr || geoOrt);
          const plOk = plT !== null && !!(plStr || plOrt);
          // Quelle passend zur letzten Position; passen beide, gewinnt die App
          let quelle = null;
          if (geoOk && frisch(geoT)) quelle = 'geo';
          else if (plOk && frisch(plT)) quelle = 'places';
          else if (geoOk || plOk) quelle = (geoOk && (!plOk || geoT >= plT)) ? 'geo' : 'places';
          const strasse = quelle === 'geo' ? geoStr : (quelle === 'places' ? plStr : null);
          const ort = quelle === 'geo' ? (geoOrt || plOrt) : (quelle === 'places' ? (plOrt || geoOrt) : null);
          // Strassennummer nur aus Places (route_number, bei Landesstrassen in street)
          const refMuster = /^(A|B|L|K|St|S|E)\s?\d+[a-z]?$/i;
          const plRefRoh = pl('route_number') || (plStr && refMuster.test(plStr) ? plStr : null);
          const strRef = plRefRoh && frisch(plT) ? plRefRoh.split(';')[0].trim().replace(/^([A-Za-z]+)\s?(\d)/, '$1 $2') : null;
          // Alter der letzten Position
          const alterMin = posT !== null ? Math.max(0, Math.floor((Date.now() - posT) / 60000)) : null;
          const alterTxt = alterMin === null ? '' : (alterMin < 1 ? 'gerade eben' : (alterMin < 60 ? `vor ${alterMin} Min` : `vor ${Math.floor(alterMin / 60)} Std`));
          const veraltet = alterMin !== null && alterMin >= 60;
          // Faehrt? Tempo (m/s) ab 30 km/h oder Aktivitaet Auto, Position juenger als 10 min
          const speed = e && e.attributes && typeof e.attributes.speed === 'number' ? e.attributes.speed : null;
          const akt = states[variables.activity_entity];
          const aktT = akt ? zeit(akt.last_updated) : null;
          const imAuto = !!akt && ['automotive', 'in_vehicle'].includes(String(akt.state).toLowerCase()) && aktT !== null && Date.now() - aktT < 900000;
          const faehrt = alterMin !== null && alterMin < 10 && ((speed !== null && speed >= 8.3) || imAuto);
          const kmh = speed !== null && speed > 0 ? `${Math.round(speed * 3.6)} km/h` : null;
          const richtungMap = { 'towards home': 'Heimweg', 'away from home': 'entfernt sich' };
          const richtung = frisch(plT) ? (richtungMap[String(pl('direction_of_travel') || '').toLowerCase()] || null) : null;
          // Zeilen: Status (Strasse oder Schild + "bei Ort") und Unterzeile
          let zeile1 = esc(statusLabel);
          let zeile2 = '';
          let schild = '';
          const unterwegs = !home && !inZone && raw === 'not_home' && !!quelle;
          if (unterwegs) {
            if (veraltet) {
              zeile1 = 'Unterwegs';
              zeile2 = ['zuletzt ' + esc(strasse || ort), alterTxt].join(' · ');
            } else if (faehrt && strRef) {
              // Schild und Tempo sind kurz und passen in eine Zeile, Ort und Richtung bekommen die volle Breite
              schild = esc(strRef);
              zeile1 = kmh || '';
              zeile2 = [ort ? 'bei ' + esc(ort) : null, richtung].filter(Boolean).join(' · ') || alterTxt;
            } else {
              zeile1 = esc(strasse || ort);
              const teile = [];
              if (strasse && ort) teile.push(esc(ort));
              teile.push(faehrt ? kmh : alterTxt);
              zeile2 = teile.filter(Boolean).join(' · ');
            }
          }

          // ---------- Akku ----------
          const bat = states[variables.battery_entity];
          const batBad = !bat || bat.state === 'unavailable' || bat.state === 'unknown';
          const batVal = batBad ? null : parseFloat(bat.state);
          const batColor = batBad ? muted : (batVal < 15 ? bad : (batVal < 30 ? warn : green));
          const batTxt = batBad ? '–' : Math.round(batVal);
          const fill = batBad ? 0 : Math.max(1, Math.min(10.6, (batVal / 100) * 10.6));

          // ---------- Ladezustand ----------
          const chg = states[variables.charging_entity];
          const isCharging = chg && ['charging', 'full'].includes(String(chg.state).toLowerCase());
          const batIconColor = isCharging ? green : batColor;

          // ---------- Icons ----------
          const icoHomeStatus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${muted};width:13px;height:13px;flex:none;">
            <path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.6V19h12v-8.4"/></svg>`;
          const icoAwayStatus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${muted};width:13px;height:13px;flex:none;">
            <circle cx="12" cy="10" r="3"/><path d="M12 21c5-4.6 7-7.6 7-11a7 7 0 1 0-14 0c0 3.4 2 6.4 7 11Z"/></svg>`;
          const icoZoneStatus = zoneIcon
            ? `<ha-icon icon="${zoneIcon}" style="--mdc-icon-size:13px;width:13px;height:13px;display:flex;flex:none;color:${blau};"></ha-icon>`
            : icoAwayStatus.replace(`color:${muted}`, `color:${blau}`);
          const icoCarStatus = `<ha-icon icon="mdi:car" style="--mdc-icon-size:13px;--ha-icon-display:block;width:13px;height:13px;display:flex;flex:none;color:${muted};"></ha-icon>`;
          const statusIcon = home ? icoHomeStatus : (inZone ? icoZoneStatus : (unterwegs && faehrt && !veraltet ? icoCarStatus : icoAwayStatus));
          // Strassennummer als Schild, getoent in Blau (Info-Wert)
          const schildHtml = schild
            ? `<span style="flex:none;font-size:11.5px;font-weight:700;line-height:17px;padding:0 6px;border-radius:5px;white-space:nowrap;color:${blau};background:color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 16%, transparent);border:1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent);">${schild}</span>`
            : '';
          // Texte brechen in bis zu zwei Zeilen um (DESIGN.md, Bildschirmbreiten)
          const zweiZeilen = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';

          const badgeHome = `<svg viewBox="0 0 24 24" fill="none" stroke="#12161f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;">
            <path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.6V19h12v-8.4"/></svg>`;
          const badgeAway = `<svg viewBox="0 0 24 24" fill="none" stroke="#12161f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;">
            <path d="M4 11.5 11 5.7V19h-5v-8.4"/><path d="M13 12h8m0 0-3-3m3 3-3 3"/></svg>`;
          const badgeZone = zoneIcon
            ? `<ha-icon icon="${zoneIcon}" style="--mdc-icon-size:11px;width:11px;height:11px;display:flex;color:#12161f;"></ha-icon>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="#12161f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;">
            <circle cx="12" cy="10" r="3"/><path d="M12 21c5-4.6 7-7.6 7-11a7 7 0 1 0-14 0c0 3.4 2 6.4 7 11Z"/></svg>`;
          // Fuellung: bleibt in beiden Modi pastell
          const badgeBg   = home ? '#a6d49e' : (inZone ? '#7fb3d5' : '#f0736a');
          const badgeIcon = home ? badgeHome : (inZone ? badgeZone : badgeAway);

          const icoBat = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${batIconColor};width:18px;height:18px;flex:none;">
            <rect x="2.5" y="8" width="16.5" height="8" rx="2.4"/>
            <rect x="4.4" y="9.9" width="${fill}" height="4.2" rx="1.2" fill="currentColor" stroke="none"/>
            <path d="M21.4 10.7v2.6"/></svg>`;

          // Lade-Blitz (nur waehrend des Ladens)
          const boltIco = isCharging
            ? `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color:${green};width:11px;height:14px;flex:none;margin:0 -1px 0 -3px;"><path d="M13 2 5 13.5h5l-1 8.5 9-12.5h-5.5z"/></svg>`
            : '';

          // ---------- Avatar ----------
          const dim = 'width:46px;height:46px;flex:none;';
          const photo = pic
            ? `<img src="${pic}" style="${dim}border-radius:50%;object-fit:cover;box-sizing:border-box;border:2px solid ${accent};${home ? '' : 'filter:grayscale(100%);opacity:0.82;'}"/>`
            : `<div style="${dim}border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:#12161f;box-sizing:border-box;background:${fb};border:2px solid ${accent};${home ? '' : 'filter:grayscale(100%);opacity:0.82;'}">${initial}</div>`;

          const avatar = `
            <div style="position:relative;flex:none;width:46px;height:46px;">
              ${photo}
              <div style="position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:${badgeBg};display:grid;place-items:center;border:2px solid ${cardBot};">${badgeIcon}</div>
            </div>`;

          // ---------- Akku-Pille (oben rechts) ----------
          const batteryPill = `
            <div style="display:flex;align-items:center;gap:4px;flex:none;padding:4px 9px 4px 7px;border-radius:999px;background:${isCharging ? 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'};border:1px solid ${isCharging ? 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)' : 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'};">
              ${icoBat}${boltIco}
              <span style="font-size:15px;font-weight:700;color:${value};font-variant-numeric:tabular-nums;line-height:1;">${batTxt}<span style="font-size:10px;color:${muted};font-weight:600;margin-left:1px;">%</span></span>
            </div>`;

          // ---------- Aufbau ----------
          return `
            <div style="display:flex;flex-direction:column;gap:11px;width:100%;box-sizing:border-box;overflow:hidden;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                ${avatar}
                ${batteryPill}
              </div>
              <div style="min-width:0;">
                <div style="font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:3px;color:${muted};font-size:13px;line-height:1.2;min-width:0;">
                  ${statusIcon}${schildHtml}${zeile1 ? `<span style="min-width:0;${zweiZeilen}">${zeile1}</span>` : ''}
                </div>
                ${zeile2 ? `<div style="margin-top:3px;color:${muted};font-size:12px;line-height:1.25;min-width:0;${zweiZeilen}">${zeile2}</div>` : ''}
              </div>
            </div>`;
        ]]]

  - type: custom:button-card
    entity: person.bewohner_2
    variables:
      battery_entity: sensor.iphone_2_battery_level
      charging_entity: sensor.iphone_2_battery_state
      geocoded_entity: sensor.iphone_2_geocoded_location
      activity_entity: sensor.iphone_2_activity
      places_prefix: sensor.places_bewohner_2
      avatar_fallback: linear-gradient(160deg,#6d5480,#4a3a5c)
    tap_action:
      action: more-info
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    styles:
      card:
        - padding: 14px 15px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - overflow: hidden
        - height: 100%
        - border-left: *edge_tpl
      grid:
        - grid-template-areas: '"body"'
        - align-content: start
        - align-items: start
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
    custom_fields:
      body: *body_tpl
