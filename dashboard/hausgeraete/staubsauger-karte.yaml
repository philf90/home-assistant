# ============================================================================
# Staubsauger mit Karte
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       hausgeraete
# Status:        aktiv
# Karten:        button-card, mushroom-vacuum-card, xiaomi-vacuum-map-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Staubsauger im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
#
# Hybrid: Owlet-Huelle mit Kopfzeile und Status-Badge als button-card, darin
# die funktionalen Spezialkarten mushroom-vacuum-card (Steuerung/Animation)
# und xiaomi-vacuum-map-card (Reinigungskarte) als eingebettete Karten
# (custom_fields mit card:). Die Reinigungskarte erscheint nur beim Reinigen
# (conditional).
#
# Warum keine vertical-stack mit card-mod: Bis 2026-10 war die Karte eine
# vertical-stack, deren Huelle card-mod per "#root" gesetzt hat. Auf dem
# Handy griff in dieser Karte keiner der card-mod-Stile (weder die Huelle
# noch der Rahmen der Mushroom-Karte); im hellen Modus lag die Kopfzeile
# ohne Innenabstand auf dem Seitengrund. Die Ursache liess sich ohne Zugriff
# auf die Browser-Konsole nicht klaeren. Jetzt traegt button-card die Huelle
# selbst (wie die Geraetekarten), und die eingebetteten Karten bekommen
# Grund und Rand ueber die ha-card-Variablen (--ha-card-background usw.),
# die in ihr Shadow DOM vererbt werden. card-mod ist nicht mehr noetig.
#
# Status-Badge: sensor.roborock_s6_maxv_status + Akku, Farbe nach
# vacuum-Zustand. Der Sensor liefert den Rohwert (z. B. "charging").
#
# Voraussetzung: custom:button-card + Mushroom + xiaomi-vacuum-map-card (HACS).
type: custom:button-card
entity: vacuum.roborock_s6_maxv
icon: mdi:robot-vacuum
name: Staubsauger
show_icon: true
show_name: true
show_state: false
triggers_update: all
tap_action:
  action: none
custom_fields:
  badge: |
    [[[
      const v=states['vacuum.roborock_s6_maxv'];
      const st=v?v.state:'';
      const stat=states['sensor.roborock_s6_maxv_status'];
      const txt= (stat && stat.state) ? stat.state : st;
      const bat= (v&&v.attributes)?v.attributes.battery_level:undefined;
      let c='var(--owlet-gruen, #a6d49e)';
      if(st==='cleaning') c='var(--owlet-amber, #e6b566)';
      else if(st==='returning') c='var(--owlet-blau, #7fb3d5)';
      else if(st==='paused') c='var(--owlet-amber, #e6b566)';
      else if(st==='error') c='var(--owlet-rot, #f0736a)';
      const batStr=(bat!==undefined&&bat!==null)?` · ${Math.round(bat)}%`:'';
      return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">${txt}${batStr}</span>`;
    ]]]
  # ---- Geraet + Steuerung ----
  steuerung:
    card:
      type: custom:mushroom-vacuum-card
      entity: vacuum.roborock_s6_maxv
      icon_animation: true
      fill_container: true
      commands:
        - start_pause
        - stop
        - locate
        - return_home
  # ---- Reinigungskarte (nur beim Saugen) ----
  karte:
    card:
      type: conditional
      conditions:
        - entity: vacuum.roborock_s6_maxv
          state: cleaning
      card:
        type: custom:xiaomi-vacuum-map-card
        entity: vacuum.roborock_s6_maxv
        map_source:
          camera: image.roborock_s6_maxv_erdgeschoss
        vacuum_platform: default
        calibration_source:
          camera: true
        map_locked: true
        two_finger_pan: false
styles:
  card:
    # Huelle wie die Geraetekarten; 18/20 px = bisher 16/18 px Huelle + 2 px
    # Innenabstand der Kopfzeile
    - padding: 18px 20px 16px
    - border-radius: 22px
    - border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n badge" "steuerung steuerung steuerung" "karte karte karte"'
    - grid-template-columns: min-content 1fr min-content
    - grid-template-rows: auto auto auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--owlet-gruen, #a6d49e) 12%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--owlet-gruen, #a6d49e) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - color: 'var(--owlet-gruen, #a6d49e)'
    - --ha-icon-display: block
  name:
    - justify-self: start
    - align-self: center
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--owlet-text, #f2f5f8)'
  custom_fields:
    badge:
      - justify-self: end
      - align-self: center
    # Unterkachel fuer die eingebetteten Karten ueber die ha-card-Variablen;
    # 16 px Abstand = bisher 6 px unter der Kopfzeile + 10 px Stapelabstand
    steuerung:
      - margin-top: 16px
      - --ha-card-background: var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))
      - --ha-card-border-color: var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - --ha-card-border-width: 1px
      - --ha-card-border-radius: 16px
      - --ha-card-box-shadow: none
    karte:
      - margin-top: "[[[ return entity && entity.state === 'cleaning' ? '10px' : '0'; ]]]"
      - --ha-card-background: var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))
      - --ha-card-border-color: var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - --ha-card-border-width: 1px
      - --ha-card-border-radius: 16px
      - --ha-card-box-shadow: none
