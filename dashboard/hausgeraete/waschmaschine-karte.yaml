# HINWEIS PLATZHALTER: Seriennummer in den Entity-IDs (seriennr_waschmaschine)
# Anonymisiert -- vor dem Einfuegen durch die eigenen Werte ersetzen.
# Tabelle und Vorgehen: README.md, Abschnitt "Platzhalter ersetzen".
#
# Waschmaschine (Home Connect / BSH) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# Icon in zustandsgefaerbter Owlet-Kachel, Owlet-Huelle, separate Programmzeile
# (gruen, nur beim Laufen), Fortschrittsbalken + Restzeit in Owlet-Palette.
# Zustandsfarben: laeuft -> gruen, fertig -> teal, pausiert -> amber, Fehler -> rot,
# sonst gedaempft.
#
# Alle Zustandsabfragen laufen ueber variables.op_state statt entity.state:
# Home Connect verschluckt gelegentlich das Run-Event (beobachtet beim
# Geschirrspueler: Status blieb auf "Ready", waehrend Programm, Fortschritt und
# Endzeit normal aktualisiert wurden). op_state setzt dann "Run" ein, solange
# ein aktives Programm und ein Fortschritt > 0 gemeldet werden. Nach
# Programmende steht der Status auf "Finished" (wird nicht ueberstimmt), das
# Programm faellt danach auf unknown. "> 0" statt nur "numerisch", weil bei
# einer Startverzoegerung (DelayedStart) das Programm schon gesetzt ist und der
# Fortschritt stundenlang auf 0 steht -- ginge dieses Event verloren, stuende
# sonst die ganze Wartezeit "Laeuft" da.
#
# Animation (Variante B aus hausgeraete.html) ueber das Template
# owlet_geraete_fx aus hausgeraete-templates.yaml: Beim
# Laufen bewegt sich die Icon-Kachel (Bullauge bzw. Spruehram) und hinter dem
# Inhalt laeuft eine Szene, bei Pause steht beides still, bei Fertig zieht
# zweimal ein Glanz ueber die Karte. Status und Restzeit stehen dann in
# #b4c0cf, damit sie auf der Szene 4,5:1 halten. Ist die Entitaet
# unavailable (Home Connect meldet das Geraet als getrennt), setzt op_state
# "Offline": Rand und Kachel Amber, mdi:wifi-off und ein Hinweis statt des
# Rohwerts "unavailable".
#
# Voraussetzung: custom:button-card (HACS) und das Template owlet_geraete_fx.
type: custom:button-card
template: owlet_geraete_fx
entity: sensor.seriennr_waschmaschine_bsh_common_status_operationstate
name: Waschmaschine
show_state: false
show_name: true
show_icon: false
variables:
  fx_art: waschmaschine
  fx_icon: mdi:washing-machine
  # Nur fuer die Schleuder-Animation; Home Connect meldet die Phase lueckenhaft
  phase_entity: sensor.seriennr_waschmaschine_laundrycare_common_option_processphase
  progress_entity: sensor.seriennr_waschmaschine_bsh_common_option_programprogress
  time_entity: sensor.seriennr_waschmaschine_bsh_common_option_estimatedtotalprogramtime
  program_entity: sensor.seriennr_waschmaschine_active_program
  # Effektiver Betriebszustand (siehe Kopfkommentar). Nur Ready/Inactive bzw.
  # ein fehlender Status werden ueberstimmt, alle anderen Zustaende (Pause,
  # Fehler, Fertig, ...) kommen unveraendert durch.
  op_state: |
    [[[
      const s = entity ? entity.state : 'unknown';
      const overridable = ['BSH.Common.EnumType.OperationState.Ready',
                           'BSH.Common.EnumType.OperationState.Inactive',
                           'unknown', 'unavailable'];
      if (!overridable.includes(s)) return s;

      const prog = states[variables.program_entity];
      const prgs = states[variables.progress_entity];
      const hasProgram = prog && !['unknown', 'unavailable', ''].includes(prog.state);
      const hasProgress = prgs && parseFloat(prgs.state) > 0;
      if (hasProgram && hasProgress) return 'BSH.Common.EnumType.OperationState.Run';
      // unavailable: Home Connect meldet das Geraet als getrennt
      return s === 'unavailable' ? 'Offline' : s;
    ]]]
styles:
  card:
    - padding: 14px 16px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
    - overflow: hidden
    # Statusrand links (wie Personenkarten / Meteoalarm-Popup). Muss NACH
    # "border" stehen, sonst ueberschreibt die Kurzform ihn wieder.
    # "Finished" wird VOR "Run" geprueft - sonst greift der Run-Zweig zuerst.
    - border-left: |
        [[[
          const s = variables.op_state;
          if (s.includes('Finished')) return '4px solid #7fd0d5';
          if (s.includes('Error'))    return '4px solid #f0736a';
          if (s.includes('Pause'))    return '4px solid #e6b566';
          if (s === 'Offline')        return '4px solid #e6b566';
          if (s.includes('Run'))      return '4px solid #a6d49e';
          return '4px solid #3a4453';
        ]]]
  grid:
    # "tile" ist die Icon-Kachel aus dem Template (statt "i", show_icon: false)
    - grid-template-areas: '"tile n" "tile status" "tile program" "tile progress" "tile time" "tile hint"'
    # minmax(0, 1fr) statt auto: die Textspalte darf nicht breiter als die
    # Karte werden, sonst ragt der Offline-Hinweis auf dem Handy in den Rand
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: auto auto auto auto auto auto
  name:
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: '#f2f5f8'
    - text-align: left
    - justify-self: start
    - align-self: end
  custom_fields:
    status:
      - font-size: 13px
      - color: '[[[ return variables.hg.text(variables.hg.zustand(variables.op_state)); ]]]'
      - text-align: left
      - justify-self: start
      - align-self: start
      - margin-top: 2px
    program:
      - font-size: 12.5px
      - font-weight: 600
      - color: '#a6d49e'
      - text-align: left
      - justify-self: start
      - align-self: start
      - padding-bottom: 8px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    progress:
      - width: 100%
      - padding: 2px 0
    time:
      - font-size: 12px
      - color: '[[[ return variables.hg.text(variables.hg.zustand(variables.op_state)); ]]]'
      - text-align: right
      - width: 100%
      - padding-top: 4px
    hint:
      - font-size: 12px
      - line-height: 1.35
      - color: '#8794a5'
      - text-align: left
      - justify-self: stretch
      - min-width: 0
      - white-space: normal
      - overflow-wrap: anywhere
      - padding-top: 4px
custom_fields:
  status: |
    [[[
      const state = variables.op_state;
      const stateMap = {
        'BSH.Common.EnumType.OperationState.Inactive':       'Inaktiv',
        'BSH.Common.EnumType.OperationState.Ready':          'Bereit',
        'BSH.Common.EnumType.OperationState.DelayedStart':   'Startverzögerung',
        'BSH.Common.EnumType.OperationState.Run':            'Läuft',
        'BSH.Common.EnumType.OperationState.Pause':          'Pausiert',
        'BSH.Common.EnumType.OperationState.ActionRequired': 'Eingriff erforderlich',
        'BSH.Common.EnumType.OperationState.Finished':       'Fertig',
        'BSH.Common.EnumType.OperationState.Error':          'Fehler',
        'BSH.Common.EnumType.OperationState.Aborting':       'Wird abgebrochen',
      };
      return stateMap[state] || state;
    ]]]
  program: |
    [[[
      const operationState = variables.op_state;
      if (!operationState.includes('Run')) return '';

      const programEntity = states[variables.program_entity];
      if (!programEntity || programEntity.state === 'unavailable' || programEntity.state === 'unknown') return '';

      const programMap = {
        'LaundryCare.Washer.Program.Cotton':                  'Baumwolle',
        'LaundryCare.Washer.Program.Cotton.Eco4060':          'Eco 40-60',
        'LaundryCare.Washer.Program.Cotton.CottonEco':        'Baumwolle Eco',
        'LaundryCare.Washer.Program.Cotton.Colour':           'Buntwäsche',
        'LaundryCare.Washer.Program.EasyCare':                'Pflegeleicht',
        'LaundryCare.Washer.Program.Mix':                     'Mischgewebe',
        'LaundryCare.Washer.Program.Mix.NightWash':           'Nachtwaschen',
        'LaundryCare.Washer.Program.DelicatesSilk':           'Fein/Seide',
        'LaundryCare.Washer.Program.Wool':                    'Wolle',
        'LaundryCare.Washer.Program.Sensitive':               'Sensitiv',
        'LaundryCare.Washer.Program.Auto30':                  'Auto 30°',
        'LaundryCare.Washer.Program.Auto40':                  'Auto 40°',
        'LaundryCare.Washer.Program.Auto60':                  'Auto 60°',
        'LaundryCare.Washer.Program.Chiffon':                 'Chiffon',
        'LaundryCare.Washer.Program.Curtains':                'Gardinen',
        'LaundryCare.Washer.Program.DarkWash':                'Dunkle Wäsche',
        'LaundryCare.Washer.Program.Dessous':                 'Dessous',
        'LaundryCare.Washer.Program.Monsoon':                 'Monsoon',
        'LaundryCare.Washer.Program.Outdoor':                 'Outdoor',
        'LaundryCare.Washer.Program.PlushToy':                'Plüschtiere',
        'LaundryCare.Washer.Program.ShirtsBlouses':           'Hemden/Blusen',
        'LaundryCare.Washer.Program.SportFitness':            'Sportwäsche',
        'LaundryCare.Washer.Program.Towels':                  'Handtücher',
        'LaundryCare.Washer.Program.WaterProof':              'Imprägnieren',
        'LaundryCare.Washer.Program.PowerSpeed59':            'Power/Speed 59\'',
        'LaundryCare.Washer.Program.Super153045.Super15':     'Super 15\'',
        'LaundryCare.Washer.Program.Super153045.Super1530':   'Super 15/30\'',
        'LaundryCare.Washer.Program.DrumClean':               'Trommel reinigen',
        'LaundryCare.Washer.Program.Rinse.RinseSpinDrain':    'Spülen/Schleudern',
      };

      const programRaw = programEntity.state;
      if (programMap[programRaw]) return programMap[programRaw];

      // Unbekanntes Programm: letztes Segment nach dem letzten Punkt,
      // CamelCase → lesbar (statt der rohen BSH-Kennung)
      const parts = programRaw.split('.');
      return parts[parts.length - 1].replace(/([A-Z])/g, ' $1').trim();
    ]]]
  progress: |
    [[[
      const progressEntity = states[variables.progress_entity];
      const progress = progressEntity ? parseFloat(progressEntity.state) || 0 : 0;

      const operationState = variables.op_state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive) return '';

      const color = operationState.includes('Pause') ? '#e6b566' : '#a6d49e';

      return `
        <div style="
          width: 100%;
          background: rgba(255,255,255,0.08);
          border-radius: 5px;
          height: 6px;
          overflow: hidden;
        ">
          <div class="${operationState.includes('Pause') ? '' : 'hg-lauf'}" style="
            width: ${progress}%;
            background: ${color};
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
          "></div>
        </div>
      `;
    ]]]
  time: |
    [[[
      const timeEntity = states[variables.time_entity];
      const progressEntity = states[variables.progress_entity];

      const operationState = variables.op_state;
      const isActive = operationState.includes('Run') || operationState.includes('Pause');

      if (!isActive || !timeEntity) return '';

      // Entität liefert Restzeit direkt im Format HH:mm
      const timeRaw = timeEntity.state;
      const progress = parseFloat(progressEntity ? progressEntity.state : 0) || 0;

      let timeStr = '';
      const match = timeRaw.match(/^(\d+):(\d{2})$/);
      if (match) {
        const h = parseInt(match[1], 10);
        const m = parseInt(match[2], 10);
        if (h > 0) timeStr += `${h} h `;
        timeStr += `${m} min`;
      } else {
        timeStr = timeRaw;
      }

      return `${progress.toFixed(0)}% &nbsp;<span style="opacity:0.5">·</span>&nbsp; noch ca. ${timeStr}`;
    ]]]
  hint: |
    [[[
      if (variables.op_state !== 'Offline') return '';
      return 'Home Connect getrennt · Gerät 1 min stromlos machen';
    ]]]
