# ============================================================================
# Pflanzen – Decluttering-Template nachtblau_pflanze
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       garten
# Status:        aktiv
# Karten:        apexcharts-card, button-card, card-mod
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter decluttering_templates:
# Platzhalter:   keine
# ============================================================================
# EINMAL einfuegen: Raw-Konfigurationseditor des Dashboards -> den Eintrag
#   unter "decluttering_templates:" ergaenzen (neben top_navigation und
#   floating_navbar aus navigation-templates.yaml).
#
# Eine button-card je Pflanze: Foto, Art, Status-Pille, Kacheln Bodenfeuchte
# und Bodentemperatur mit Sollband, Akku und Sensorname. Antippen oeffnet ein
# browser_mod-Popup mit der Bodenfeuchte der letzten 7 Tage (apexcharts-card).
# Ist input_boolean.<pflanze>_abgeerntet an, zeigt dieselbe Karte nur eine
# schmale Zeile; der Knopf rechts schaltet den Helfer mit Rueckfrage um
# ("Abgeerntet" / "Wieder bepflanzt").
#
# Warum so schlank: Eine fruehere Fassung hatte je Pflanze Stapel, zwei
# conditional-Karten, expander-card und apexcharts-card. expander-card 0.1.5
# erzeugt die inneren Karten auch zugeklappt, also liefen beim Oeffnen der
# View sieben Diagramme mit 21 Datenabfragen. Gemessen (Chromium, 4x
# gedrosselte CPU) brauchte das Laden ~1,7-2,2 s Rechenzeit, diese Fassung
# ~0,35-0,45 s und keine Datenabfrage. Das Diagramm entsteht erst im Popup.
#
# Variablen:
#   pflanze  Objekt-ID der Pflanze (plant.<pflanze>); daraus werden
#            sensor.<pflanze>_bodenfeuchtigkeit, _bodentemperatur und die
#            number.<pflanze>_min_/max_…-Grenzwerte gebildet
#   akku     Akku-Sensor des Bodensensors
#   sensor   Anzeigename des Bodensensors (Fusszeile)
#   hinweis  optional, z. B. "geteilt mit Gurken"
#
# Hinweise zu den Karten:
#   - button-card wertet Templates in verschachtelten Karten (custom_fields
#     mit card:) im Kontext der aeusseren Karte aus; der Knopf liest den
#     Helfer deshalb ueber states[...] statt ueber entity.
#   - button-card setzt bei ha-icon margin:auto und zentriert custom_fields;
#     daher margin:0 und text-align:left.
#   - Das Foto kommt ueber show_entity_picture (fest gebunden), nicht als
#     <img> im HTML, das bei jeder Aktualisierung neu entstuende.
#   - Popup: button-card wertet [[[ ]]] auch in fire-dom-event-Daten aus;
#     der Titel nimmt daher den Anzeigenamen der Pflanze. popup_styles setzt
#     die Nachtblau-Popupflaeche nachtblau-flaeche-erhoeht (browser_mod 3.3,
#     documentation/styles.md).
#   - Popup-Diagramm, Farben: apexcharts-card 2.2.3 zeichnet bei einem Wechsel
#     zwischen hell und dunkel nicht neu, und var() in series/apex_config
#     bricht das Diagramm. Die Farben stehen deshalb im card_mod-CSS als
#     var(--nachtblau-...); die Werte unter series und apex_config gelten nur ohne
#     card-mod und sind die dunklen (wie energie-monatsbilanz-karte.yaml).
#     Min/Max bleiben in beiden Modi #6e7988 (nachtblau-muted ist hell und dunkel
#     gleich), der Tooltip bleibt dunkel.
#   - Popup-Diagramm: statistics.align: start legt jeden Tagesmittelwert auf
#     00:00 seines Tages; mit dem Standard "middle" (12:00) begann die Flaeche
#     eingerueckt. chart.offsetX greift auf iOS nicht, deshalb rueckt ein
#     negativer Rand an #graph die y-Beschriftung unter den Titel.
#
# Voraussetzung: custom:decluttering-card, custom:button-card (v7),
#                custom:apexcharts-card, browser_mod (Popup), card-mod,
#                je Pflanze ein Helfer input_boolean.<pflanze>_abgeerntet.
# ============================================================================
decluttering_templates:
  nachtblau_pflanze:
    default:
      - hinweis: ''
    card:
      # Eine button-card je Pflanze (statt Stack + 2 conditional + expander +
      # apexcharts): das Diagramm entsteht erst beim Antippen im Popup.
      type: custom:button-card
      entity: plant.[[pflanze]]
      variables:
        p: '[[pflanze]]'
        akku: '[[akku]]'
        sensor: '[[sensor]]'
        hinweis: '[[hinweis]]'
        ab: input_boolean.[[pflanze]]_abgeerntet
      show_icon: false
      show_name: false
      show_state: false
      show_entity_picture: true
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: "[[[ return (entity && entity.attributes.friendly_name ? entity.attributes.friendly_name : variables.p) + ' · Bodenfeuchte'; ]]]"
            # Nachtblau-Stil: Popups bekommen die erhoehte Flaeche nachtblau-flaeche-erhoeht (DESIGN.md)
            popup_styles:
              - style: all
                styles: |
                  ha-dialog {
                    --ha-dialog-surface-background: var(--nachtblau-flaeche-erhoeht, #222b3c);
                    --ha-card-background: transparent;
                    --primary-text-color: var(--nachtblau-text, #f2f5f8);
                    --ha-dialog-border-radius: 22px !important;
                  }
            content:
              type: custom:apexcharts-card
              graph_span: 7d
              header:
                show: true
                title: 7 Tage · Tagesmittel
                show_states: false
              apex_config:
                chart:
                  background: transparent
                  foreColor: '#8794a5'
                  height: 220
                  toolbar:
                    show: false
                dataLabels:
                  enabled: false
                grid:
                  borderColor: rgba(255,255,255,0.06)
                  strokeDashArray: 3
                legend:
                  show: false
                stroke:
                  curve: smooth
                  width: 2
                tooltip:
                  theme: dark
              yaxis:
                - min: 0
                  max: 100
                  decimals: 0
                  apex_config:
                    tickAmount: 4
              series:
                - entity: sensor.[[pflanze]]_bodenfeuchtigkeit
                  name: Bodenfeuchte
                  color: '#a6d49e'
                  type: area
                  opacity: 0.18
                  unit: '%'
                  statistics:
                    type: mean
                    period: day
                    # Standard "middle" setzt jeden Tagesmittelwert auf 12:00; der erste Punkt liegt dann
                    # Stunden nach Fensterbeginn und die Flaeche beginnt eingerueckt. "start" = 00:00 des Tages.
                    align: start
                - entity: number.[[pflanze]]_min_bodenfeuchtigkeit
                  name: Min
                  color: '#6e7988'
                  stroke_width: 1
                - entity: number.[[pflanze]]_max_bodenfeuchtigkeit
                  name: Max
                  color: '#6e7988'
                  stroke_width: 1
              card_mod:
                style: |
                  ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
                  /* apexcharts-card 2.2.3 rendert den Titel als #header__title */
                  #header { padding: 4px 4px 0 !important; }
                  #header__title { font-size: 13px !important; font-weight: 600 !important; color: var(--nachtblau-label, #b4c0cf) !important; }
                  /* Diagrammfarben folgen dem Modus nur hier; Werte unter series/apex_config sind die dunklen (s. Dateikopf) */
                  .apexcharts-series[data\:realIndex="0"] .apexcharts-area:not([fill="none"]) { fill: color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 18%, transparent); }
                  .apexcharts-series[data\:realIndex="0"] .apexcharts-area:not([stroke="none"]) { stroke: var(--nachtblau-gruen, #a6d49e); }
                  .apexcharts-series[data\:realIndex="0"] .apexcharts-marker { fill: var(--nachtblau-gruen, #a6d49e); }
                  .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
                  .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
                  /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
                  .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
                  .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
                  .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
                  .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
                  .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
                  .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
                  .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
                  /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
                  .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--nachtblau-gruen, #a6d49e) !important; }
                  .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker, .apexcharts-tooltip-series-group-2 .apexcharts-tooltip-marker { color: var(--nachtblau-muted, #6e7988) !important; }
                  /* ApexCharts laesst links ~23 px frei, bevor die y-Beschriftung beginnt. chart.offsetX wirkt
                     auf iOS nicht (SVG-transform); negativer Rand am HTML-Container rueckt "100" unter den Titel. */
                  #graph { margin-left: -23px !important; }
      custom_fields:
        kopf: |
          [[[
            const A=entity?entity.attributes:{};
            const name=A.friendly_name||variables.p;
            const abS=states[variables.ab];
            if(abS&&abS.state==='on'){
              return `<div style="font-size:15px;font-weight:700;letter-spacing:-0.02em;color:var(--nachtblau-label, #b4c0cf);">${name}</div>
                <div style="font-size:11.5px;color:var(--nachtblau-text-sekundaer, #8794a5);margin-top:1px;">Abgeerntet · Werte ausgeblendet</div>`;
            }
            const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
            const p=variables.p;
            const f=zahl(`sensor.${p}_bodenfeuchtigkeit`), fMin=zahl(`number.${p}_min_bodenfeuchtigkeit`), fMax=zahl(`number.${p}_max_bodenfeuchtigkeit`);
            const t=zahl(`sensor.${p}_bodentemperatur`), tMin=zahl(`number.${p}_min_bodentemperatur`), tMax=zahl(`number.${p}_max_bodentemperatur`);
            let col='var(--nachtblau-gruen, #a6d49e)', txt='Alles gut';
            if(f<fMin){col='var(--nachtblau-amber, #e6b566)';txt='Gießen';}
            else if(f>fMax){col='var(--nachtblau-amber, #e6b566)';txt='Zu nass';}
            else if(t<tMin){col='var(--nachtblau-amber, #e6b566)';txt='Boden kalt';}
            else if(t>tMax){col='var(--nachtblau-amber, #e6b566)';txt='Boden warm';}
            const pille=`<span style="display:inline-flex;align-items:center;color:${col};background:color-mix(in srgb, ${col} 12%, transparent);border:1px solid color-mix(in srgb, ${col} 24%, transparent);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap;">${txt}</span>`;
            return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--nachtblau-text, #f2f5f8);">${name}</span>${pille}</div>
              <div style="font-size:12px;font-style:italic;color:var(--nachtblau-text-sekundaer, #8794a5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${A.species||''}</div>`;
          ]]]
        werte: |
          [[[
            const abS=states[variables.ab];
            if(abS&&abS.state==='on') return '';
            const zahl=id=>{const s=states[id];const v=s?parseFloat(s.state):NaN;return Number.isFinite(v)?v:NaN;};
            const de=(v,d)=>Number.isFinite(v)?v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
            const p=variables.p;
            const kachel=(o)=>{
              const v=zahl(o.wert), mn=zahl(o.min), mx=zahl(o.max);
              let col='var(--nachtblau-text-sekundaer, #8794a5)', txt='keine Daten';
              if(Number.isFinite(v)){
                if(v<mn){col=o.aus;txt=o.tief;}
                else if(v>mx){col=o.aus;txt=o.hoch;}
                else {col='var(--nachtblau-gruen, #a6d49e)';txt='im Sollbereich';}
              }
              const pos=x=>Math.max(0,Math.min(100,(x-o.von)/(o.bis-o.von)*100));
              const band=(Number.isFinite(mn)&&Number.isFinite(mx))?`<i style="position:absolute;top:0;bottom:0;left:${pos(mn)}%;width:${pos(mx)-pos(mn)}%;background:color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent);border-radius:3px;"></i>`:'';
              const mark=Number.isFinite(v)?`<i style="position:absolute;top:-3px;left:${pos(v)}%;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:${col};box-shadow:0 0 0 2px var(--nachtblau-huelle-unten, #171d29);"></i>`:'';
              return `<div style="background:var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));border-radius:13px;padding:10px 12px;min-width:0;">
                <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--nachtblau-text-sekundaer, #8794a5);"><ha-icon icon="${o.icon}" style="--mdc-icon-size:15px;width:15px;height:15px;display:flex;margin:0;color:${col};"></ha-icon>${o.titel}</div>
                <div style="font-size:20px;font-weight:750;letter-spacing:-0.02em;color:var(--nachtblau-text, #f2f5f8);font-variant-numeric:tabular-nums;margin-top:4px;">${de(v,1)}<span style="font-size:0.6em;color:var(--nachtblau-text-sekundaer, #8794a5);font-weight:600;margin-left:2px;">${o.einheit}</span></div>
                <div style="position:relative;height:6px;border-radius:3px;background:color-mix(in srgb, rgba(255, 255, 255, 0.07) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05)));margin:8px 0 7px;">${band}${mark}</div>
                <div style="font-size:11px;font-weight:600;color:${col===o.aus?col:'var(--nachtblau-text-sekundaer, #8794a5)'};">${txt}</div>
                <div style="font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);">Soll ${de(mn,0)}–${de(mx,0)} ${o.einheit}</div>
              </div>`;
            };
            return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">`
              + kachel({titel:'Bodenfeuchte',icon:'mdi:water',wert:`sensor.${p}_bodenfeuchtigkeit`,min:`number.${p}_min_bodenfeuchtigkeit`,max:`number.${p}_max_bodenfeuchtigkeit`,von:0,bis:100,einheit:'%',aus:'var(--nachtblau-amber, #e6b566)',tief:'zu trocken',hoch:'zu nass'})
              + kachel({titel:'Bodentemperatur',icon:'mdi:thermometer-low',wert:`sensor.${p}_bodentemperatur`,min:`number.${p}_min_bodentemperatur`,max:`number.${p}_max_bodentemperatur`,von:0,bis:40,einheit:'°C',aus:'var(--nachtblau-amber, #e6b566)',tief:'zu kalt',hoch:'zu warm'})
              + `</div>`;
          ]]]
        fuss: |
          [[[
            const abS=states[variables.ab];
            if(abS&&abS.state==='on') return '';
            const s=states[variables.akku];
            const a=s?parseFloat(s.state):NaN;
            let col='var(--nachtblau-text-sekundaer, #8794a5)';
            if(Number.isFinite(a)) col=a>=30?'var(--nachtblau-gruen, #a6d49e)':(a>=15?'var(--nachtblau-amber, #e6b566)':'var(--nachtblau-rot, #f0736a)');
            const icon=!Number.isFinite(a)?'mdi:battery-unknown':(a>=30?'mdi:battery-high':(a>=15?'mdi:battery-medium':'mdi:battery-alert'));
            const akku=`<span style="display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;color:${col};"><ha-icon icon="${icon}" style="--mdc-icon-size:14px;width:14px;height:14px;display:flex;margin:0;"></ha-icon>${Number.isFinite(a)?Math.round(a)+' %':'–'}</span>`;
            const zusatz=variables.hinweis?` · ${variables.hinweis}`:'';
            return `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--nachtblau-text-sekundaer, #8794a5);min-width:0;">${akku}<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">· Sensor ${variables.sensor}${zusatz}</span></div>`;
          ]]]
        knopf:
          card:
            type: custom:button-card
            entity: input_boolean.[[pflanze]]_abgeerntet
            show_state: false
            name: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'Wieder bepflanzt' : 'Abgeerntet'; ]]]"
            icon: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'mdi:sprout' : 'mdi:basket-check-outline'; ]]]"
            tap_action:
              action: toggle
              confirmation:
                text: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'Pflanze wieder anzeigen?' : 'Als abgeerntet markieren? Die Werte werden bis zur Neubepflanzung ausgeblendet.'; ]]]"
            styles:
              card:
                - padding: 4px 10px
                - border-radius: 10px
                - box-shadow: none
                - background: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)' : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]"
                - border: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]"
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content auto
                - column-gap: 5px
              icon:
                - width: 14px
                - color: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-muted, #6e7988)'; ]]]"
              name:
                - font-size: 11.5px
                - font-weight: 600
                - color: "[[[ return states['input_boolean.[[pflanze]]_abgeerntet'] && states['input_boolean.[[pflanze]]_abgeerntet'].state === 'on' ? 'var(--nachtblau-gruen, #a6d49e)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]"
      styles:
        card:
          - padding: 14px 16px
          - border-radius: 22px
          - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
          - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
          - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        grid:
          - grid-template-areas: |
              [[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '"i kopf knopf"' : '"i kopf kopf" "werte werte werte" "fuss fuss knopf"'; ]]]
          - grid-template-rows: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'auto' : 'auto auto auto'; ]]]"
          - grid-template-columns: min-content minmax(0, 1fr) auto
          - row-gap: 12px
          - column-gap: 10px
          - align-items: center
        img_cell:
          - width: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '36px' : '52px'; ]]]"
          - height: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? '36px' : '52px'; ]]]"
          - border-radius: 50%
          - overflow: hidden
          - margin-right: 2px
        entity_picture:
          - width: 100%
          - height: 100%
          - object-fit: cover
          - border-radius: 50%
          - filter: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'grayscale(0.6) opacity(0.55)' : 'none'; ]]]"
        custom_fields:
          kopf:
            - justify-self: stretch
            - text-align: left
            - min-width: 0
            - white-space: normal
          werte:
            - justify-self: stretch
            - text-align: left
            - display: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'none' : 'block'; ]]]"
          fuss:
            - justify-self: stretch
            - min-width: 0
            - display: "[[[ const s=states[variables.ab]; return (s&&s.state==='on') ? 'none' : 'block'; ]]]"
          knopf:
            - justify-self: end
