            - grid-template-columns: 1fr
          custom_fields:
            txt:
              - justify-self: start
              - text-align: left
              - font-size: 12.5px
              - color: '#b4c0cf'
              - white-space: normal

  # ============================== MÄHROBOTER ==============================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:robot-mower
        name: Mähroboter
        show_icon: true
        show_name: true
        show_label: false
        tap_action:
          action: none
        styles: *header_styles
      - type: custom:button-card
        entity: lawn_mower.a2
        icon: mdi:robot-mower
        name: Lawn Solo
        show_icon: true
        show_name: true
        show_state: false
        variables: { battery_entity: sensor.a2_battery_level }
        triggers_update: all
        state:
          - value: mowing
            spin: true
          - value: returning
            spin: true
        custom_fields:
          status: |
            [[[
              const m={ mowing:'Mäht', docked:'Angedockt', returning:'Fährt zurück', paused:'Pausiert', error:'Fehler', idle:'Bereit' };
              const e=(typeof entity!=='undefined')?entity:null;
              return e?(m[e.state]||e.state):'';
            ]]]
          battery: |
            [[[
              const b=states[variables.battery_entity];
              if(!b||b.state==='unavailable') return '';
              const level=parseFloat(b.state)||0;
              let icon,color;
              if(level>=90){icon='mdi:battery';color='#a6d49e';}
              else if(level>=70){icon='mdi:battery-80';color='#a6d49e';}
              else if(level>=50){icon='mdi:battery-60';color='#a6d49e';}
              else if(level>=30){icon='mdi:battery-40';color='#e6b566';}
              else if(level>=10){icon='mdi:battery-20';color='#f0736a';}
              else {icon='mdi:battery-alert';color='#f0736a';}
              return `<span style="display:inline-flex;align-items:center;gap:5px;color:${color};"><ha-icon icon="${icon}" style="--mdc-icon-size:16px;"></ha-icon><span style="color:#8794a5;font-weight:600;">${level.toFixed(0)} %</span></span>`;
            ]]]
        styles:
          card:
            - border-radius: 16px
            - padding: 13px 14px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i n" "i status" "i battery"'
            - grid-template-rows: min-content min-content min-content
          img_cell:
            - width: 46px
            - height: 46px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: |
                [[[
                  const s=(typeof entity!=='undefined'&&entity)?entity.state:'';
                  let c='#8794a5';
                  if(s==='mowing'||s==='docked') c='#a6d49e';
                  else if(s==='returning') c='#7fb3d5';
                  else if(s==='paused') c='#e6b566';
                  else if(s==='error') c='#f0736a';
                  return c+'29';
                ]]]
            - border: |
                [[[
                  const s=(typeof entity!=='undefined'&&entity)?entity.state:'';
                  let c='#8794a5';
                  if(s==='mowing'||s==='docked') c='#a6d49e';
                  else if(s==='returning') c='#7fb3d5';
                  else if(s==='paused') c='#e6b566';
                  else if(s==='error') c='#f0736a';
                  return '1px solid '+c+'3d';
                ]]]
          icon:
            - width: 26px
            - height: 26px
            - color: |
                [[[
                  const s=(typeof entity!=='undefined'&&entity)?entity.state:'';
                  if(s==='mowing'||s==='docked') return '#a6d49e';
                  if(s==='returning') return '#7fb3d5';
                  if(s==='paused') return '#e6b566';
                  if(s==='error') return '#f0736a';
                  return '#8794a5';
                ]]]
          name:
            - justify-self: start
            - align-self: end
            - font-size: 15px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
          custom_fields:
            status:
              - justify-self: start
              - align-self: center
              - font-size: 12.5px
              - color: '#8794a5'
              - padding-top: 2px
            battery:
              - justify-self: start
              - align-self: start
              - font-size: 12px
              - padding-top: 3px
