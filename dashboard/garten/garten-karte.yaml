            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          grid:
            - grid-template-columns: min-content minmax(0, 1fr) auto
            - grid-template-areas: '"i n sw" "i sub sw"'
            - grid-template-rows: min-content min-content
            - column-gap: 4px
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - margin-right: 9px
            - align-self: center
            - background: |
                [[[ return (entity && entity.state === 'on') ? 'color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
            - border: |
                [[[ return (entity && entity.state === 'on') ? '1px solid color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
          icon:
            - width: 22px
            - height: 22px
            - --ha-icon-display: block
            - color: |
                [[[ return (entity && entity.state === 'on') ? 'var(--nachtblau-limette, #bdd27f)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
          name:
            - justify-self: stretch
            - align-self: end
