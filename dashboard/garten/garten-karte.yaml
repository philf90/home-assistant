# ============================================================================
# Garten – Pool, Bewaesserung, Maehroboter
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       garten
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   notify.mobile_app_iphone, *_seriennr, *_mac
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Garten-Ansicht (Pool / Garten / Bewaesserung einstellen / Maehroboter) im
# Nachtblau-Stil. Vier Sektionen mit
# Kopfzeile + Nachtblau-Kacheln.
#
# Aktiv-Zustand (an/offen/maeht) faerbt Icon + Kachel:
#   Pumpen -> gruen (accent_on #a6d49e), Wasser/Ventile -> blau (#7fb3d5).
#   Die Einstellungen tragen das Lime der Kategorie Garten (#bdd27f).
# Tap = Toggle (Schalter/Ventile/Regenschutz); Maehroboter, Verschleiss und
# Eingabefelder -> more-info.
#
# Heller Modus: Farben ueber die nachtblau-Variablen, Toenungen per color-mix.
# Wasserringe (Blau 0,5) und Glow der Pumpe (Gruen 0,5) in der Stufe
# "Leuchten", hell im Tiefton (Ringe 2,1:1 zum Grund; Zusatzsignal neben Text
# und Icon). Schalter "Meldung am Ende": an hell voll im Limette-Tiefton (Knopf
# 5,42:1, mit 0,5 waeren es 2,11:1), dunkel unveraendert 0,5; aus dunkel
# unveraendert Weiss 0,1/0,08 ueber nachtblau-dunkel-anteil.
#
# Bewaesserung:
#   Brunnenpumpe        gruener Glow, solange sie laeuft; Leistung und
#                       "laeuft fuer n Zonen"
#   Gartenbewaesserung  Ventilgruppe: schaltet alle drei Zonen; die Pumpe
#                       ziehen die Automationen nach
#   vorne/mitte/hinten  Wasserringe am Icon, solange das Ventil offen ist;
#                       Durchfluss, Tagesmenge, "vor X"; Endzeit, Restminuten
#                       und Fortschrittsbalken aus dem Timer der Zone
#   Bewaesserung        Laufzeit, Laufzeit nach Regen und Regen-Schwelle mit
#   einstellen          -/+ (Grenzen kommen aus den Helfern, am Rand wird das
#                       Symbol grau); Knopf "Standard" (60 min / 30 min /
#                       1,0 mm) nur, wenn ein Wert abweicht; Schalter
#                       "Meldung am Ende"; Hinweis, mit welcher Laufzeit der
#                       naechste Start laeuft
#
# Frostschutz (Winter: Ventile eingelagert, Gartenleitung entleert):
#   Schalter            erste Zeile in "Bewaesserung einstellen", Pille in Blau
#                       (DESIGN.md: Frost = Blau), Tippen mit Rueckfrage,
#                       Halten -> more-info. Nur von Hand; keine Automation
#                       schaltet ihn.
#   Sperre              bei Frostschutz nehmen Pumpe, Gruppe, Zonen, -/+,
#                       "Standard" und "Meldung am Ende" kein Tippen an
#                       (pointer-events per Style-Template); Zeilen zeigen
#                       Schloss und "Frostschutz · ..." in Blau, die Zonen die
#                       Temperatur des eingelagerten Ventils (ab 2 °C abwaerts
#                       Amber), die Pumpe weiter ihre Leistung.
#   Hinweis             statt der Laufzeit-Vorschau; Amber, wenn die
#                       Automation "Frostschutz-Sperre" aus ist. Chip
#                       "Frostschutz" in der Kopfzeile Garten.
#   Die Karte sperrt nur die Bedienung. Wirksam ist die Automation
#   "Frostschutz-Sperre": Sie schaltet Pumpe und Ventile bei Frostschutz
#   sofort wieder aus, egal woher der Befehl kam.
#
# Maehroboter (Dreame A2, Integration antondaubert/dreame-mower):
#   Lawn Solo           Status aus dem Statussensor, waehrend des Maehens
#                       Fortschritt in % mit Balken und Flaeche; Akku und
#                       Schnitthoehe (bei Einstellungen je Zone die Spanne der
#                       Zonen). Hinweise unter der Zeile, schwerster zuerst:
#                       Fehler (Rot) und Warnung (Amber) mit Geraetecode im
#                       Klartext, Infos wie "Akku schwach, faehrt zur Station"
#                       (Amber, Frost Blau) nur ausserhalb von Maehen und
#                       Station, Regenpause (Blau) mit der Uhrzeit, ab der er
#                       wieder maeht. Der A2 meldet die Regenpause als
#                       "pausiert wegen Fehler" mit Code 56 (Info); die Karte
#                       zeigt sie deshalb nicht rot. Der Geraetecode bleibt
#                       stehen, bis ein neuer kommt; ein Hinweis aus dem Code
#                       verschwindet deshalb beim naechsten Zustandswechsel,
#                       die Regenpause zur gemeldeten Uhrzeit.
#   Verschleiss         Messer, Stationsbuerste, Wartung: Rest in % und
#                       Stunden; Gruen ab 30 %, Amber ab 10 %, darunter Rot
#   Regenschutz         Schalter; Halten oeffnet die Wartezeit nach Regen
#
# button-card v7 ignoriert triggers_update: Neu gezeichnet wird, wenn sich
# eine Entity aendert, die ein Template liest. Die Timer-Zeilen lesen deshalb
# sensor.time, damit die Restminuten jede Minute weiterzaehlen.
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &shell, &header_styles, &row_styles,
# &acc_icon, &acc_bg, &acc_border; Bewaesserung &bw_extra (Ringe, Glow,
# Balken-Animation, reduzierte Bewegung), &bw_tm, &bw_bar, &bw_zone_sub,
# &bw_styles_timed; Einstellungen &bw_val, &bw_set_row, &bw_step_card,
# &bw_minus_color, &bw_plus_color; Schalter-Pille &sw_pille, &sw_zeile
# ("Meldung am Ende", "Regenschutz"). Aktiv-Farbe je Kachel ueber
# variables.accent_on, Timer je Kachel ueber variables.timers. Maehroboter:
# Zustandslogik in variables.mw der Hauptkachel (lage, fortschritt).
#
# Voraussetzungen:
#   - custom:button-card (v7) + card-mod (HACS), sensor.time
#   - Helfer (UI):
#       timer.bewasserung_vorne, _mitte, _hinten  (Zustand wiederherstellen an)
#       valve.bewasserung_garten  Gruppe der drei Ventile
#       input_number.bewasserung_laufzeit             10-90 min, Schritt 5
#       input_number.bewasserung_laufzeit_nach_regen  10-90 min, Schritt 5
#       input_number.bewasserung_regen_schwelle       0,5-10 mm, Schritt 0,5
#       input_boolean.bewasserung_meldung  Schalter der Meldung am Ende
#       input_boolean.bewasserung_frostschutz  Frostschutz, ohne initial
#           (behaelt den Zustand ueber Neustarts)
#   - Skript script.bewasserung_einstellungen_setzen: Felder laufzeit,
#     laufzeit_nach_regen, regen_schwelle -> je input_number.set_value
#   - Automationen (UI):
#       Regel: Wer Pumpe oder Ventil einschaltet, prueft den Frostschutz;
#       wer ausschaltet oder schliesst, prueft ihn nie.
#       "Bewaesserung: Zonen-Timer"  Ventil auf -> Pumpe an und Timer der Zone
#           starten: Laufzeit, nach Regen ueber der Schwelle (Tagesregen) die
#           Laufzeit nach Regen, hoechstens 90 min; Ventil zu -> Timer
#           abbrechen. Bei Frostschutz bricht der Zweig "Ventil auf" vor dem
#           Einschalten ab (Bedingung als erster Schritt).
#       "Bewaesserung: Frostschutz-Sperre"  bei Frostschutz: Pumpe an -> sofort
#           aus, Ventil auf -> Gruppe zu (continue_on_error), beim Einschalten
#           des Frostschutzes und nach HA-Start dasselbe; Meldung an
#           notify.mobile_app_iphone mit Laufzeit des Shelly. Trigger auf die
#           Pumpe als state mit to: "on", damit auch der Wechsel aus
#           unavailable zaehlt; mode restart.
#       "Bewaesserung: Frostwarnung Ventillager"  bei Frostschutz: eine der
#           drei Ventil-Temperaturen 30 min unter 3 °C -> Meldung (die
#           ELV-SH-WSM sind laut Hersteller nicht frostsicher). Schaltet nichts.
#       "Bewaesserung: Zone nach Ablauf schliessen"  timer.finished -> Ventil
#           der Zone zu
#       "Bewaesserung: Pumpe aus ohne laufende Zone"  Timer beendet oder
#           abgebrochen, Pumpe 1 min an, HA-Start (1 min Wartezeit) -> laeuft
#           kein Timer: Pumpe aus, offene Ventile zu. Lief die Pumpe und ist
#           der Schalter an: Meldung an notify.mobile_app_iphone mit Grund
#           (Laufzeit abgelaufen / von Hand beendet / Regen / Pumpe ohne Zone /
#           Neustart), Uhrzeit, Pumpenlaufzeit und Tagesmengen der Zonen;
#           Tippen oeffnet /dashboard-home/garten
#       "Bewaesserung: Abbruch bei Regen"  Regensensor meldet Naesse, ein
#           Ventil offen -> alle Ventile zu
#     Jahresablauf und Shelly-Einstellungen: doku/bewaesserung-frostschutz.md
#   - Maehroboter: antondaubert/dreame-mower (HACS, geprueft mit v1.10.1),
#     Geraet "Lawn Solo" im Bereich Garten. Genutzt: lawn_mower, Sensoren
#     Status, Geraetecode, Batterie, Maeh Fortschritt, Klingen- und
#     Buerstenverschleiss, Wartungszustand, "Maehen wird nach Regenschutz
#     fortgesetzt", number Schnitthoehe, switch Regenschutz, select Wartezeit
#     nach Regen. Andere Geraetenamen oder Bereiche aendern die Entity-IDs.
type: vertical-stack
cards:
  # ================================ POOL ================================
  - type: vertical-stack
    card_mod: &shell
      style: |
        #root {
          background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
          border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
          padding: 16px 18px !important;
          gap: 9px !important;
        }
    cards:
      - type: custom:button-card
        icon: mdi:pool
        name: Pool
        show_icon: true
        show_name: true
        show_label: false
        tap_action:
          action: none
        styles: &header_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: min-content 1fr
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)'
            - border: '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)'
          icon:
            - width: 23px
            - height: 23px
            - --ha-icon-display: block
            - color: 'var(--nachtblau-gruen, #a6d49e)'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: 'var(--nachtblau-text, #f2f5f8)'
      - type: custom:button-card
        entity: switch.shelly_outdoor_plugs_pool_switch_0
        name: Pool Pumpe
        icon: phu:pool-filter
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables: { accent_on: 'var(--nachtblau-gruen, #a6d49e)' }
        custom_fields:
          sub: |
            [[[
              const t=states['sensor.shellyplus1_mac_temperature'];
              if(!t) return 'Pool Pumpe';
              return `${parseFloat(t.state).toFixed(1).replace('.',',')} ${t.attributes.unit_of_measurement||'°C'}`;
            ]]]
        styles: &row_styles
          card:
            - border-radius: 16px
            - padding: 12px 14px
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i n" "i sub"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - margin-right: 13px
            - align-self: center
            - background: &acc_bg |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  const on=['on','open','mowing','returning','cleaning','running'].includes(e.state);
                  return on ? 'color-mix(in srgb, '+onc+' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                ]]]
            - border: &acc_border |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  const on=['on','open','mowing','returning','cleaning','running'].includes(e.state);
                  return on ? '1px solid color-mix(in srgb, '+onc+' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                ]]]
          icon:
            - width: 22px
            - height: 22px
            - --ha-icon-display: block
            - color: &acc_icon |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-text-sekundaer, #8794a5)';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  const on=['on','open','mowing','returning','cleaning','running'].includes(e.state);
                  return on ? onc : 'var(--nachtblau-text-sekundaer, #8794a5)';
                ]]]
          name:
            - justify-self: start
            - align-self: end
            - font-size: 14.5px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            sub:
              - justify-self: start
              - align-self: start
              - font-size: 12.5px
              - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
              - margin-top: 2px
              - white-space: nowrap
              - overflow: hidden
              - text-overflow: ellipsis

  # ================================ GARTEN ================================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:grass
        name: Garten
        show_icon: true
        show_name: true
        show_label: false
        tap_action:
          action: none
        # Wie &header_styles, dazu rechts der Chip "Frostschutz" (nur bei
        # Frostschutz an). Neu gezeichnet wird, weil das Feld den Helfer liest.
        custom_fields:
          fs: |
            [[[
              const f=states['input_boolean.bewasserung_frostschutz'];
              if(!(f&&f.state==='on')) return '';
              return `<span style="display:inline-flex;align-items:center;gap:4px;line-height:1"><ha-icon icon="mdi:snowflake" style="--mdc-icon-size:13px;width:13px;height:13px;display:flex"></ha-icon><span>Frostschutz</span></span>`;
            ]]]
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n fs"'
            - grid-template-columns: min-content minmax(0, 1fr) auto
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)'
            - border: '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)'
          icon:
            - width: 23px
            - height: 23px
            - --ha-icon-display: block
            - color: 'var(--nachtblau-gruen, #a6d49e)'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: 'var(--nachtblau-text, #f2f5f8)'
          custom_fields:
            fs:
              - display: |
                  [[[
                    const f=states['input_boolean.bewasserung_frostschutz'];
                    return (f&&f.state==='on') ? 'block' : 'none';
                  ]]]
              - justify-self: end
              - align-self: center
              - padding: 4px 9px
              - border-radius: 999px
              - font-size: 12px
              - font-weight: 600
              - white-space: nowrap
              - color: 'var(--nachtblau-blau, #7fb3d5)'
              - background: 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 12%, transparent)'
              - border: '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent)'
      - type: custom:button-card
        entity: switch.shelly_outdoor_plug_s_gen3_brunnenpumpe
        name: Brunnenpumpe
        icon: mdi:water-pump
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables:
          accent_on: 'var(--nachtblau-gruen, #a6d49e)'
          timers:
            - timer.bewasserung_vorne
            - timer.bewasserung_mitte
            - timer.bewasserung_hinten
        extra_styles: &bw_extra |
          #img-cell::before, #img-cell::after {
            content: ""; position: absolute; inset: -1px; border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 50%, transparent); opacity: 0; pointer-events: none;
            display: var(--bw-ring, none); animation: bw-ring 2.6s ease-out infinite;
          }
          #img-cell::after { animation-delay: 1.3s; }
          @keyframes bw-ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.55); opacity: 0; } }
          @keyframes bw-leer { to { width: 0%; } }
          @keyframes bw-glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 0%, transparent); } to { box-shadow: 0 0 14px -3px color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 50%, transparent); } }
          @media (prefers-reduced-motion: reduce) {
            #img-cell { animation: none !important; }
            #img-cell::before { animation: none; opacity: 0.6; transform: scale(1.2); }
            #img-cell::after { animation: none; opacity: 0; }
            #bar i { animation: none !important; }
          }
        custom_fields:
          sub: |
            [[[
              const p=states['sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power'];
              const pw= p?`${parseFloat(p.state).toFixed(1).replace('.',',')} ${p.attributes.unit_of_measurement||'W'}`:'';
              const n=(variables.timers||[]).filter(id=>states[id]&&states[id].state==='active').length;
              const z= n?`läuft für ${n} ${n===1?'Zone':'Zonen'}`:'';
              const f=states['input_boolean.bewasserung_frostschutz'];
              if(f&&f.state==='on'){
                // Frostschutz: Schloss in Blau; laeuft die Pumpe trotzdem, Amber
                const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
                const c=an?'var(--nachtblau-amber, #e6b566)':'var(--nachtblau-blau, #7fb3d5)';
                const lock=`<ha-icon icon="mdi:lock" style="--mdc-icon-size:13px;width:13px;height:13px;display:inline-flex;vertical-align:-2px;margin-right:3px"></ha-icon>`;
                return `<span style="color:${c}">${lock}Frostschutz · ${an?'läuft trotzdem':'aus'}${pw?' · '+pw:''}</span>`;
              }
              return [pw,z].filter(Boolean).join(' · ');
            ]]]
        styles:
          card:
            - border-radius: 16px
            - padding: 12px 14px
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
            - pointer-events: &fs_sperre |
                [[[
                  const f=states['input_boolean.bewasserung_frostschutz'];
                  return (f&&f.state==='on') ? 'none' : 'auto';
                ]]]
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i n" "i sub"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - margin-right: 13px
            - align-self: center
            - background: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                  return e.state==='on' ? 'color-mix(in srgb, '+variables.accent_on+' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                ]]]
            - border: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                  return e.state==='on' ? '1px solid color-mix(in srgb, '+variables.accent_on+' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                ]]]
            - animation: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null;
                  return (e&&e.state==='on') ? 'bw-glow 2.4s ease-in-out infinite alternate' : 'none';
                ]]]
          icon:
            - width: 22px
            - height: 22px
            - --ha-icon-display: block
            - color: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-text-sekundaer, #8794a5)';
                  return e.state==='on' ? variables.accent_on : 'var(--nachtblau-text-sekundaer, #8794a5)';
                ]]]
          name:
            - justify-self: start
            - align-self: end
            - font-size: 14.5px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            sub:
              - justify-self: start
              - align-self: start
              - font-size: 12.5px
              - color: |
                  [[[
                    const e=(typeof entity!=='undefined')?entity:null;
                    return (e&&e.state==='on') ? 'var(--nachtblau-label, #b4c0cf)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
                  ]]]
              - margin-top: 2px
              - white-space: nowrap
              - overflow: hidden
              - text-overflow: ellipsis
      - type: custom:button-card
        entity: valve.bewasserung_garten
        name: Gartenbewässerung
        icon: mdi:sprinkler-variant
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables:
          accent_on: 'var(--nachtblau-blau, #7fb3d5)'
          timers:
            - timer.bewasserung_vorne
            - timer.bewasserung_mitte
            - timer.bewasserung_hinten
        extra_styles: *bw_extra
        custom_fields:
          sub: |
            [[[
              const e=(typeof entity!=='undefined')?entity:null;
              const ids=(e&&e.attributes.entity_id)||[];
              const n=ids.filter(id=>states[id]&&states[id].state==='open').length;
              const f=states['input_boolean.bewasserung_frostschutz'];
              if(f&&f.state==='on'){
                const lock=`<ha-icon icon="mdi:lock" style="--mdc-icon-size:13px;width:13px;height:13px;display:inline-flex;vertical-align:-2px;margin-right:3px"></ha-icon>`;
                return `<span style="color:var(--nachtblau-blau, #7fb3d5)">${lock}Frostschutz · gesperrt</span>`;
              }
              return n?`An · ${n} von ${ids.length} ${ids.length===1?'Zone':'Zonen'}`:'Aus';
            ]]]
          tm: &bw_tm |
            [[[
              states['sensor.time']; // liest die Uhrzeit, damit button-card v7 jede Minute neu zeichnet
              const akt=(variables.timers||[]).map(id=>states[id]).filter(t=>t&&t.state==='active'&&t.attributes.finishes_at);
              if(!akt.length) return '';
              const t=akt.reduce((a,b)=>new Date(b.attributes.finishes_at)>new Date(a.attributes.finishes_at)?b:a);
              const end=new Date(t.attributes.finishes_at);
              const rest=Math.max(0,end-Date.now());
              const bis=end.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
              return `bis ${bis} · noch ${Math.ceil(rest/60000)} min`;
            ]]]
          bar: &bw_bar |
            [[[
              states['sensor.time']; // liest die Uhrzeit, damit button-card v7 jede Minute neu zeichnet
              const akt=(variables.timers||[]).map(id=>states[id]).filter(t=>t&&t.state==='active'&&t.attributes.finishes_at);
              if(!akt.length) return '';
              const t=akt.reduce((a,b)=>new Date(b.attributes.finishes_at)>new Date(a.attributes.finishes_at)?b:a);
              const p=String(t.attributes.duration||'0:00:00').split(':').map(Number);
              const dauer=((p[0]||0)*3600+(p[1]||0)*60+(p[2]||0))*1000;
              const rest=Math.max(0,new Date(t.attributes.finishes_at)-Date.now());
              const pct=dauer?Math.min(100,rest/dauer*100):0;
              return `<i style="display:block;height:100%;border-radius:2px;background:var(--nachtblau-blau, #7fb3d5);width:${pct.toFixed(2)}%;animation:bw-leer ${Math.round(rest/1000)}s linear forwards"></i>`;
            ]]]
        styles: &bw_styles_timed
          card:
            - pointer-events: *fs_sperre
            - position: relative
            - border-radius: 16px
            - padding: |
                [[[
                  const akt=(variables.timers||[]).some(id=>states[id]&&states[id].state==='active');
                  return akt ? '12px 14px 16px' : '12px 14px';
                ]]]
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
          grid:
            - position: static
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i n" "i sub" "i tm"'
            - grid-template-rows: min-content min-content min-content
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - margin-right: 13px
            - align-self: center
            - position: relative
            - overflow: visible
            - --bw-ring: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null;
                  return (e&&e.state==='open') ? 'block' : 'none';
                ]]]
            - background: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  return e.state==='open' ? 'color-mix(in srgb, '+onc+' 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
                ]]]
            - border: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  return e.state==='open' ? '1px solid color-mix(in srgb, '+onc+' 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
                ]]]
          icon:
            - width: 22px
            - height: 22px
            - --ha-icon-display: block
            - color: |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null; if(!e) return 'var(--nachtblau-text-sekundaer, #8794a5)';
                  const onc=variables.accent_on||'var(--nachtblau-gruen, #a6d49e)';
                  return e.state==='open' ? onc : 'var(--nachtblau-text-sekundaer, #8794a5)';
                ]]]
          name:
            - justify-self: start
            - align-self: end
            - font-size: 14.5px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            sub:
              - justify-self: start
              - align-self: start
              - font-size: 12.5px
              - color: |
                  [[[
                    const e=(typeof entity!=='undefined')?entity:null;
                    return (e&&e.state==='open') ? 'var(--nachtblau-label, #b4c0cf)' : 'var(--nachtblau-text-sekundaer, #8794a5)';
                  ]]]
              - margin-top: 2px
              - white-space: nowrap
              - overflow: hidden
              - text-overflow: ellipsis
            tm:
              - justify-self: start
              - align-self: start
              - font-size: 12.5px
              - color: 'var(--nachtblau-label, #b4c0cf)'
              - margin-top: 1px
              - font-variant-numeric: tabular-nums
              - white-space: nowrap
              - overflow: hidden
              - text-overflow: ellipsis
            bar:
              - position: absolute
              - left: 69px
              - right: 14px
              - bottom: 6px
              - height: 3px
              - border-radius: 2px
              - background: 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'
              - overflow: hidden
              - display: |
                  [[[
                    const akt=(variables.timers||[]).some(id=>states[id]&&states[id].state==='active');
                    return akt ? 'block' : 'none';
                  ]]]
      - type: custom:button-card
        entity: valve.bewasserung_vorne
        name: Bewässerung vorne
        icon: mdi:water-well
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables:
          accent_on: 'var(--nachtblau-blau, #7fb3d5)'
          timers:
            - timer.bewasserung_vorne
          flow: sensor.elv_sh_wsm_seriennr_1_water_flow
          daily: sensor.garten_bewasserung_daily
          temp: sensor.elv_sh_wsm_seriennr_1_temperatur
        extra_styles: *bw_extra
        custom_fields:
          sub: &bw_zone_sub |
            [[[
              const e=(typeof entity!=='undefined')?entity:null;
              if(!e) return '';
              const f=states['input_boolean.bewasserung_frostschutz'];
              if(f&&f.state==='on'){
                // Frostschutz: Ventil eingelagert; Temperatur des Geraets = Lager.
                // Ab 2 °C abwaerts Amber (Frostwarnung der Automation unter 3 °C).
                const t=states[variables.temp];
                const tv=t?parseFloat(t.state):NaN;
                const kalt=!isNaN(tv)&&tv<=2;
                const c=kalt?'var(--nachtblau-amber, #e6b566)':'var(--nachtblau-blau, #7fb3d5)';
                const lock=`<ha-icon icon="mdi:lock" style="--mdc-icon-size:13px;width:13px;height:13px;display:inline-flex;vertical-align:-2px;margin-right:3px"></ha-icon>`;
                const temp=isNaN(tv)?'':` · ${tv.toFixed(0)} °C`;
                return `<span style="color:${c}">${lock}Frostschutz · gesperrt${temp}</span>`;
              }
              const diff=Math.floor((Date.now()-new Date(e.last_changed).getTime())/1000);
              const since= diff<60?`vor ${diff} Sek.`: diff<3600?`vor ${Math.floor(diff/60)} Min.`: diff<86400?`vor ${Math.floor(diff/3600)} Std.`:`vor ${Math.floor(diff/86400)} Tagen`;
              if(e.state!=='open') return `geschlossen · ${since}`;
              const flow=states[variables.flow];
              const daily=states[variables.daily];
              const flowStr= flow?`${parseFloat(flow.state).toFixed(2).replace('.',',')} ${flow.attributes.unit_of_measurement||'L/min'}`:'';
              const dailyStr= daily?`${daily.state} ${daily.attributes.unit_of_measurement||'L'}`:'';
              return [...[flowStr,dailyStr].filter(Boolean),since].join(' · ');
            ]]]
          tm: *bw_tm
          bar: *bw_bar
        styles: *bw_styles_timed
      - type: custom:button-card
        entity: valve.bewasserung_mitte
        name: Bewässerung mitte
        icon: mdi:water-well
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables:
          accent_on: 'var(--nachtblau-blau, #7fb3d5)'
          timers:
            - timer.bewasserung_mitte
          flow: sensor.bewasserung_mitte_wasser_durchfluss
          daily: sensor.garten_bewasserung_mitte_daily
          temp: sensor.bewasserung_mitte_temperatur
        extra_styles: *bw_extra
        custom_fields:
          sub: *bw_zone_sub
          tm: *bw_tm
          bar: *bw_bar
        styles: *bw_styles_timed
      - type: custom:button-card
        entity: valve.elv_sh_wsm_seriennr_2
        name: Bewässerung hinten
        icon: mdi:water-well
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
        variables:
          accent_on: 'var(--nachtblau-blau, #7fb3d5)'
          timers:
            - timer.bewasserung_hinten
          flow: sensor.elv_sh_wsm_seriennr_2_wasser_durchfluss
          daily: sensor.garten_bewasserung_hinten_daily
          temp: sensor.elv_sh_wsm_seriennr_2_temperatur
        extra_styles: *bw_extra
        custom_fields:
          sub: *bw_zone_sub
          tm: *bw_tm
          bar: *bw_bar
        styles: *bw_styles_timed

  # ======================== BEWÄSSERUNG EINSTELLEN ========================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:tune-variant
        name: Bewässerung einstellen
        show_icon: true
        show_name: true
        show_label: false
        tap_action:
          action: none
        # Standardwerte hier UND in custom_fields.reset.card.tap_action.data
        # gleich halten. Neu gezeichnet wird, weil das display-Template die
        # Eingabefelder liest (button-card v7 erkennt Entitaeten automatisch).
        variables:
          standard:
            laufzeit: 60
            laufzeit_nach_regen: 30
            regen_schwelle: 1
        custom_fields:
          reset:
            card:
              type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.bewasserung_einstellungen_setzen
                data:
                  laufzeit: 60
                  laufzeit_nach_regen: 30
                  regen_schwelle: 1
              styles:
                card:
                  - padding: 7px 12px
                  - border-radius: 11px
                  - box-shadow: none
                  - background: 'color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 12%, transparent)'
                  - border: '1px solid color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 24%, transparent)'
                grid:
                  - grid-template-areas: '"lbl"'
                  - grid-template-columns: auto
                  - align-items: center
                custom_fields:
                  lbl:
                    - display: flex
                    - align-items: center
                    - font-size: 12.5px
                    - font-weight: 600
                    - color: 'var(--nachtblau-limette, #bdd27f)'
                    - white-space: nowrap
              # Icon und Text in einer Flex-Zeile: das eingebaute button-card-Icon
              # sitzt bei 16 px sichtbar zu tief.
              custom_fields:
                lbl: |
                  [[[
                    return `<span style="display:inline-flex;align-items:center;gap:6px;line-height:1"><ha-icon icon="mdi:restore" style="--mdc-icon-size:16px;width:16px;height:16px;display:flex"></ha-icon><span>Standard</span></span>`;
                  ]]]
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n reset"'
            - grid-template-columns: min-content minmax(0, 1fr) auto
            - column-gap: 8px
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 6px
            - align-self: center
            - background: 'color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 12%, transparent)'
            - border: '1px solid color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 24%, transparent)'
          icon:
            - width: 23px
            - height: 23px
            - --ha-icon-display: block
            - color: 'var(--nachtblau-limette, #bdd27f)'
          name:
            - justify-self: stretch
            - align-self: center
            - min-width: 0
            - text-align: left
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            reset:
              - justify-self: end
              - align-self: center
              - display: |
                  [[[
                    const st=variables.standard||{};
                    const ids={laufzeit:'input_number.bewasserung_laufzeit',laufzeit_nach_regen:'input_number.bewasserung_laufzeit_nach_regen',regen_schwelle:'input_number.bewasserung_regen_schwelle'};
                    const ab=Object.keys(ids).some(k=>{const s=states[ids[k]];const v=s?parseFloat(s.state):NaN;return !isNaN(v)&&Math.abs(v-st[k])>0.001;});
                    const f=states['input_boolean.bewasserung_frostschutz'];
                    return (ab&&!(f&&f.state==='on')) ? 'block' : 'none';
                  ]]]
      # Frostschutz: Hauptschalter fuer den Winter, nur von Hand. Pille wie
      # "Meldung am Ende", Akzent Blau (DESIGN.md: Frost = Blau). Die Rueckfrage
      # ist fest formuliert und passt fuer beide Richtungen.
      - type: custom:button-card
        entity: input_boolean.bewasserung_frostschutz
        name: Frostschutz
        icon: |
          [[[ return (entity && entity.state === 'on') ? 'mdi:snowflake' : 'mdi:snowflake-off'; ]]]
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: toggle
          confirmation:
            text: >-
              Frostschutz umschalten? Ein: Brunnenpumpe und Ventile bleiben
              gesperrt. Aus: Die Pumpe kann die Gartenleitung wieder mit Wasser
              füllen.
        hold_action:
          action: more-info
        custom_fields:
          sub: |
            [[[
              const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
              return an ? 'Brunnenpumpe und Ventile gesperrt' : 'Bewässerung freigegeben';
            ]]]
          sw: |
            [[[
              const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
              return `<span style="position:relative;display:block;box-sizing:border-box;width:42px;height:24px;border-radius:12px;background:${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-blau, #7fb3d5))':'color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05)))'};border:1px solid ${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-blau, #7fb3d5))':'color-mix(in srgb, rgba(255, 255, 255, 0.08) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))'};"><span style="position:absolute;top:2px;left:${an?20:2}px;width:18px;height:18px;border-radius:50%;background:${an?'#f2f5f8':'var(--nachtblau-text-sekundaer, #8794a5)'};transition:left 0.15s ease;"></span></span>`;
            ]]]
        styles:
          card:
            - border-radius: 16px
            - padding: 12px 14px
            - box-shadow: none
            - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
            - border: |
                [[[ return (entity && entity.state === 'on') ? '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
          grid:
            - grid-template-columns: min-content minmax(0, 1fr) auto
            - grid-template-areas: '"i n sw" "i sub sw"'
            - grid-template-rows: min-content min-content
            - column-gap: 4px
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - margin-right: 9px
            - align-self: center
            - background: |
                [[[ return (entity && entity.state === 'on') ? 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
            - border: |
                [[[ return (entity && entity.state === 'on') ? '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
          icon:
            - width: 22px
            - height: 22px
            - --ha-icon-display: block
            - color: |
                [[[ return (entity && entity.state === 'on') ? 'var(--nachtblau-blau, #7fb3d5)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
          name:
            - justify-self: stretch
            - align-self: end
            - min-width: 0
            - text-align: left
            - font-size: 14.5px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: 'var(--nachtblau-text, #f2f5f8)'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            sub:
              - justify-self: stretch
              - align-self: start
              - min-width: 0
              - text-align: left
              - font-size: 12.5px
              - line-height: 1.25
              - color: |
                  [[[ return (entity && entity.state === 'on') ? 'var(--nachtblau-blau, #7fb3d5)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
              - margin-top: 2px
              - white-space: normal
            sw:
              - align-self: center
              - justify-self: end
              - margin-left: 8px
      - type: custom:button-card
