              const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
              const fz=states['input_boolean.bewasserung_frostschutz'];
              const gesperrt=!!(variables.frostsperre&&fz&&fz.state==='on');
              return `<span style="opacity:${gesperrt?0.45:1};position:relative;display:block;box-sizing:border-box;width:42px;height:24px;border-radius:12px;background:${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-limette, #bdd27f))':'color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05)))'};border:1px solid ${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-limette, #bdd27f) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-limette, #bdd27f))':'color-mix(in srgb, rgba(255, 255, 255, 0.08) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))'};"><span style="position:absolute;top:2px;left:${an?20:2}px;width:18px;height:18px;border-radius:50%;background:${an?'#f2f5f8':'var(--nachtblau-text-sekundaer, #8794a5)'};transition:left 0.15s ease;"></span></span>`;
            ]]]
        styles: &sw_zeile
          card:
            - pointer-events: |
                [[[
                  const f=states['input_boolean.bewasserung_frostschutz'];
                  return (variables.frostsperre&&f&&f.state==='on') ? 'none' : 'auto';
