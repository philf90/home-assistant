          custom_fields:
            sub:
              - justify-self: stretch
              - align-self: start
              - min-width: 0
              - text-align: left
              - font-size: 12.5px
              - line-height: 1.25
              - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
              - margin-top: 2px
