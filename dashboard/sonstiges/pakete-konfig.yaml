# ============================================================================
# Pakete – Skript "Sendung hinzufuegen" und Meldungen
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       sonstiges
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
#                (oder Skript und Automation einzeln im YAML-Editor der UI)
# Platzhalter:   notify.mobile_app_iphone
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Gehoert zur Pakete-View (pakete-view.yaml) und zur Pakete-Karte
# (pakete-karte.yaml).
#
# Inhalt:
#   sensor.pakete_in_zustellung  Zahl der Sendungen mit Status
#                                out_for_delivery, je Sendungsnummer einmal
#                                (Amazon und Zusteller koennen dieselbe
#                                Sendung melden); steuert zusammen mit
#                                sensor.parcel_aggregator_awaiting_pickup die
#                                Sichtbarkeit der Home-Karte (pakete-karte.yaml)
#   script.paket_hinzufuegen     traegt eine Sendungsnummer bei DHL, Hermes,
#                                GLS oder UPS ein (Formular "+ Sendung");
#                                Felder nummer und dienst (dhl, hermes, gls,
#                                ups)
#   automation "Pakete: Meldungen"
#                                meldet "in Zustellung", "abholbereit" und
#                                Probleme fuer alle Paketdienste zugleich,
#                                ueber die Ereignisse des Parcel Aggregators
#
# Aktionen und Felder aus den READMEs der Integrationen (Stand 11/2026):
#   dhl.track_parcel      tracking_code, direction, config_entry_id (optional)
#   hermes.track_parcel   tracking_code; wirkt nur auf den Nummern-Hub, nie
#                         auf das Hermes-Konto
#   gls.track_parcel      tracking_code, postal_code (optional, waehlt den
#                         Hub bei mehreren PLZ)
#   ups.track_parcel      tracking_code
# DPD hat keine solche Aktion; DPD-Sendungen kommen nur ueber das myDPD-Konto.
#
# Einrichtung der Integrationen (je einmal, Einstellungen -> Geraete &
# Dienste -> Integration hinzufuegen):
#   DHL      "Account" (Login ueber die DHL-App, Weiterleitungsadresse
#            dhllogin://... aus den Entwicklerwerkzeugen einfuegen). Keinen
#            zweiten DHL-Eintrag anlegen: dhl.track_parcel funktioniert auch
#            auf dem Konto, und die Uebergabe von Amazon an DHL scheitert,
#            wenn mehrere DHL-Eintraege zur Wahl stehen (README ha-amazon).
#   DPD      Land Deutschland, E-Mail und Passwort von myDPD
#   Hermes   "Hermes account" UND "Tracking codes" (Nummern-Hub fuer das
#            Formular)
#   GLS      Land Deutschland und Liefer-PLZ
#   UPS      nichts auszufuellen
#   Amazon   Land Deutschland, Login im Browser, Adresse der Seite
#            .../ap/maplanding einfuegen; Uebergabe an Zusteller anlassen
#   Parcel Aggregator  nichts auszufuellen
# In jeder Paket-Integration unter "Konfigurieren" die Option "Parcel
# history" einschalten, sonst zeigt die View keinen Verlauf.
#
# Anpassen:
#   - notify.mobile_app_iphone: eigenes Geraet (Platzhalter, siehe oben)
#   - /dashboard-home/pakete: Pfad, den das Tippen auf die Meldung oeffnet
#
# Einbinden als Paket in configuration.yaml:
#   homeassistant:
#     packages:
#       pakete: !include pakete-konfig.yaml
# Danach Home Assistant neu starten oder unter Einstellungen -> Werkzeuge ->
# YAML Template-Entitaeten, Skripte und Automationen neu laden.
#
# Den Sensor kann man stattdessen auch in der UI anlegen (Einstellungen ->
# Geraete & Dienste -> Helfer -> Template -> Template-Sensor, Name "Pakete in
# Zustellung", Zustand wie unten); dann den template:-Block hier weglassen.
#
# Ohne Paket: Skript und Automation einzeln einfuegen (Neues Skript bzw. Neue
# Automation -> Drei-Punkte-Menue -> In YAML bearbeiten). Einzufuegen ist beim
# Skript alles unter "paket_hinzufuegen:", bei der Automation der
# Listeneintrag ohne "- " (ohne id, die vergibt die UI).
#
# Voraussetzung: Integrationen DHL, DPD, Hermes, GLS, UPS, Amazon und Parcel
#                Aggregator (HACS, Familie ha-parcel-integrations), Home
#                Assistant Companion App fuer die Meldungen.

template:
  - sensor:
      - name: Pakete in Zustellung
        unique_id: pakete_in_zustellung
        icon: mdi:truck-delivery
        state_class: measurement
        # Ohne Parcel Aggregator 0, die Home-Karte bleibt dann verborgen
        state: >-
          {% set p = (state_attr('sensor.parcel_aggregator_incoming_parcels', 'parcels') or [])
             | selectattr('status', 'eq', 'out_for_delivery') | list %}
          {% set mit = p | selectattr('barcode') | map(attribute='barcode') | map('string')
             | map('replace', ' ', '') | map('upper') | unique | list | count %}
          {{ mit + (p | rejectattr('barcode') | list | count) }}

script:
  paket_hinzufuegen:
    alias: "Pakete: Sendung hinzufügen"
    description: >-
      Pakete-View, Formular "+ Sendung": traegt eine Sendungsnummer bei der
      passenden Paket-Integration ein. DPD fehlt, weil ha-dpd keine Aktion
      zum Hinzufuegen hat.
    icon: mdi:package-variant-plus
    mode: queued
    fields:
      nummer:
        name: Sendungsnummer
        description: Wie auf dem Beleg, Leerzeichen werden entfernt
        required: true
        example: JJD000390007855342
        selector:
          text:
      dienst:
        name: Paketdienst
        required: true
        selector:
          select:
            options:
              - label: DHL
                value: dhl
              - label: Hermes
                value: hermes
              - label: GLS
                value: gls
              - label: UPS
                value: ups
    sequence:
      - variables:
          code: "{{ (nummer | string) | replace(' ', '') | upper }}"
      - choose:
          - conditions: "{{ dienst == 'dhl' }}"
            sequence:
              - action: dhl.track_parcel
                data:
                  tracking_code: "{{ code }}"
          - conditions: "{{ dienst == 'hermes' }}"
            sequence:
              - action: hermes.track_parcel
                data:
                  tracking_code: "{{ code }}"
          - conditions: "{{ dienst == 'gls' }}"
            sequence:
              - action: gls.track_parcel
                data:
                  tracking_code: "{{ code }}"
          - conditions: "{{ dienst == 'ups' }}"
            sequence:
              - action: ups.track_parcel
                data:
                  tracking_code: "{{ code }}"
        default:
          - stop: "Unbekannter Paketdienst"
            error: true

automation:
  - id: pakete_meldungen
    alias: "Pakete: Meldungen"
    description: >-
      Pakete-View: meldet aufs Handy, wenn eine Sendung in Zustellung geht,
      abholbereit ist oder ein Problem hat (zurueck an den Absender
      eingeschlossen). Ein Ausloeser je Status ueber das Ereignis
      parcel_aggregator_parcel_status_changed, damit alle Paketdienste
      zugleich abgedeckt sind. Die Zustellung selbst meldet die Kamera
      (Paket vor der Tuer).
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: out_for_delivery
        id: zustellung
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: at_pickup_point
        id: abholbereit
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: problem
        id: problem
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: returning
        id: problem
    # name und fenster lesen trigger.event.data direkt, nicht p: Home Assistant
    # speichert die Schluessel alphabetisch (fenster, name, p, ziel) und rendert
    # sie in dieser Reihenfolge, p waere dort noch nicht definiert.
    variables:
      ziel: /dashboard-home/pakete
      p: "{{ trigger.event.data }}"
      name: "{{ trigger.event.data.sender or ('…' ~ (trigger.event.data.barcode | string)[-6:]) }}"
      fenster: >-
        {% set von = trigger.event.data.planned_from | as_datetime(none) %}{% set bis = trigger.event.data.planned_to | as_datetime(none) %}{% if von and bis and (bis - von).total_seconds() < 72000 %}{{ (von | as_local).strftime('%H:%M') }}–{{ (bis | as_local).strftime('%H:%M') }} Uhr{% endif %}
    actions:
      - action: notify.mobile_app_iphone
        data:
          title: >-
            {{ {'zustellung': 'In Zustellung', 'abholbereit': 'Abholbereit', 'problem': 'Problem mit Sendung'}[trigger.id] }} · {{ p.carrier }}
          message: >-
            {% if trigger.id == 'zustellung' %}{{ name }} kommt heute{{ ', ' ~ fenster if fenster }}.{% elif trigger.id == 'abholbereit' %}{{ name }} liegt bereit{{ ': ' ~ p.pickup_point if p.pickup_point }}.{% else %}{{ name }}: {{ p.raw_status or p.new_status }}{% endif %}
          data:
            url: "{{ ziel }}"
            clickAction: "{{ ziel }}"
            group: pakete
