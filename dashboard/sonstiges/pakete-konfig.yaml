# ============================================================================
# Pakete – Skript "Sendung hinzufuegen" und Meldungen
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       sonstiges
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
#                (oder Skript und Automation einzeln im YAML-Editor der UI)
# Platzhalter:   notify.mobile_app_iphone
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Gehoert zur Pakete-View (pakete-view.yaml) und zur Pakete-Karte
# (pakete-karte.yaml).
#
# Inhalt:
#   input_boolean.pakete_meldung_zustellung, _abholbereit, _problem,
#     _stopps, _zustellfoto     Schalter je Push-Meldung (Karte "Meldungen"
#                                in pakete-view.yaml); die Automationen
#                                melden nur bei "an". Neu angelegt stehen sie
#                                auf "aus": nach dem Anlegen einmal
#                                einschalten, sonst kommt keine Meldung mehr
#   sensor.pakete_in_zustellung  Zahl der Sendungen mit Status
#                                out_for_delivery, je Sendungsnummer einmal
#                                (Amazon und Zusteller koennen dieselbe
#                                Sendung melden); steuert zusammen mit
#                                sensor.parcel_aggregator_awaiting_pickup die
#                                Sichtbarkeit der Home-Karte (pakete-karte.yaml)
#   sensor.pakete_amazon_stopps  Stopps des Fahrers bis zur Zustellung je
#                                Amazon-Sendung in Zustellung (nur Amazons
#                                eigene Flotte, Stand der letzten Abfrage,
#                                alle 15 Minuten); Zustand: Zahl solcher
#                                Sendungen, Attribut stopps: {Nummer: Stopps}.
#                                Liest pakete-templates.yaml fuer "noch 3
#                                Stopps"
#   sensor.pakete_amazon_fotos   Zustellfoto je zugestellter Amazon-Sendung
#                                (nur Amazons eigene Flotte); Zustand: Zahl
#                                der Fotos, Attribut fotos: {Nummer:
#                                Bild-Entitaet}. Liest pakete-templates.yaml
#                                fuer das Foto in "Zuletzt zugestellt"
#   script.paket_hinzufuegen     traegt eine Sendungsnummer bei DHL, Hermes,
#                                GLS oder UPS ein (Formular "+ Sendung");
#                                Felder nummer, dienst (dhl, hermes, gls,
#                                ups) und inhalt (optional, geht als
#                                contents an track_parcel)
#   automation "Pakete: Meldungen"
#                                meldet "in Zustellung", "abholbereit" und
#                                Probleme fuer alle Paketdienste zugleich,
#                                ueber die Ereignisse des Parcel Aggregators;
#                                "abholbereit" mit Knopf "Karte und
#                                Oeffnungszeiten" (Apple Karten), wenn eine
#                                Adresse mit PLZ bekannt ist (bei DHL aus dem
#                                Verlauf); alle Meldungen nennen den Inhalt,
#                                falls bekannt, in einer zweiten Zeile
#   automation "Pakete: Amazon-Fahrer fast da"
#                                meldet je Amazon-Sendung einmal, sobald der
#                                Fahrer nur noch schwelle (3) Stopps oder
#                                weniger vor ihr hat; liest
#                                sensor.pakete_amazon_stopps
#   automation "Pakete: Amazon-Zustellfoto"
#                                meldet eine Amazon-Zustellung mit Foto der
#                                eigenen Flotte, das Foto als Bild der
#                                Meldung; ueber das Ereignis
#                                amazon_orders_parcel_delivered
#
# Aktionen und Felder aus den READMEs der Integrationen (Stand 23.11.2026,
# DHL, Hermes, UPS 2.0.0, GLS 2.0.1); contents ist ueberall optional:
#   dhl.track_parcel      tracking_code, direction, contents, config_entry_id
#   hermes.track_parcel   tracking_code, contents; wirkt nur auf den
#                         Nummern-Hub, nie auf das Hermes-Konto
#   gls.track_parcel      tracking_code, postal_code (optional, waehlt den
#                         Hub bei mehreren PLZ), contents
#   ups.track_parcel      tracking_code, contents
# DPD hat keine solche Aktion; DPD-Sendungen kommen nur ueber das myDPD-Konto.
#
# Einrichtung der Integrationen (je einmal, Einstellungen -> Geraete &
# Dienste -> Integration hinzufuegen):
#   DHL      "Account" (Login ueber die DHL-App, Weiterleitungsadresse
#            dhllogin://... aus den Entwicklerwerkzeugen einfuegen). Keinen
#            zweiten DHL-Eintrag anlegen: dhl.track_parcel funktioniert auch
#            auf dem Konto, und die Uebergabe von Amazon an DHL scheitert,
#            wenn mehrere DHL-Eintraege zur Wahl stehen (README ha-amazon).
#   DPD      Land Deutschland, E-Mail und Passwort von myDPD
#   Hermes   "Hermes account" UND "Tracking codes" (Nummern-Hub fuer das
#            Formular)
#   GLS      Land Deutschland und Liefer-PLZ
#   UPS      nichts auszufuellen
#   Amazon   Land Deutschland, Login im Browser, Adresse der Seite
#            .../ap/maplanding einfuegen; Uebergabe an Zusteller anlassen
#   Parcel Aggregator  nichts auszufuellen
# In jeder Paket-Integration unter "Konfigurieren" die Option "Parcel
# history" einschalten, sonst zeigt die View keinen Verlauf (und bei DHL
# fehlt die Adresse fuer den Kartenknopf).
#
# Anpassen:
#   - notify.mobile_app_iphone: eigenes Geraet (Platzhalter, siehe oben)
#   - /dashboard-home/pakete: Pfad, den das Tippen auf die Meldung oeffnet
#
# Einbinden als Paket in configuration.yaml:
#   homeassistant:
#     packages:
#       pakete: !include pakete-konfig.yaml
# Danach Home Assistant neu starten oder unter Einstellungen -> Werkzeuge ->
# YAML Eingabe-Booleans, Template-Entitaeten, Skripte und Automationen neu
# laden.
#
# Die Schalter kann man stattdessen in der UI anlegen (Helfer -> Schalter,
# Name wie unten unter name:, dann stimmt auch die Entity-ID); dann den
# input_boolean:-Block hier weglassen.
#
# Den Sensor "Pakete in Zustellung" kann man stattdessen auch in der UI
# anlegen (Einstellungen -> Geraete & Dienste -> Helfer -> Template ->
# Template-Sensor, Zustand wie unten); dann ihn hier weglassen. "Pakete
# Amazon Stopps" und "Pakete Amazon Fotos" brauchen YAML, weil der
# UI-Helfer keine Attribute kennt.
#
# Ohne Paket: Skript und Automation einzeln einfuegen (Neues Skript bzw. Neue
# Automation -> Drei-Punkte-Menue -> In YAML bearbeiten). Einzufuegen ist beim
# Skript alles unter "paket_hinzufuegen:", bei der Automation der
# Listeneintrag ohne "- " (ohne id, die vergibt die UI).
#
# Voraussetzung: Integrationen DHL, DPD, Hermes, GLS, UPS, Amazon und Parcel
#                Aggregator (Marketplace, Familie ha-parcel-integrations), Home
#                Assistant Companion App fuer die Meldungen.

# Kein initial: Home Assistant stellt den letzten Zustand wieder her; initial
# wuerde die Wahl auf der Karte bei jedem Neustart ueberschreiben.
input_boolean:
  pakete_meldung_zustellung:
    name: "Pakete: Meldung Zustellung"
    icon: mdi:truck-delivery
  pakete_meldung_abholbereit:
    name: "Pakete: Meldung Abholbereit"
    icon: mdi:storefront-outline
  pakete_meldung_problem:
    name: "Pakete: Meldung Problem"
    icon: mdi:alert-circle-outline
  pakete_meldung_stopps:
    name: "Pakete: Meldung Stopps"
    icon: mdi:map-marker-distance
  pakete_meldung_zustellfoto:
    name: "Pakete: Meldung Zustellfoto"
    icon: mdi:camera-outline

template:
  - sensor:
      - name: Pakete in Zustellung
        unique_id: pakete_in_zustellung
        icon: mdi:truck-delivery
        state_class: measurement
        # Ohne Parcel Aggregator 0, die Home-Karte bleibt dann verborgen
        state: >-
          {% set p = (state_attr('sensor.parcel_aggregator_incoming_parcels', 'parcels') or [])
             | selectattr('status', 'eq', 'out_for_delivery') | list %}
          {% set mit = p | selectattr('barcode') | map(attribute='barcode') | map('string')
             | map('replace', ' ', '') | map('upper') | unique | list | count %}
          {{ mit + (p | rejectattr('barcode') | list | count) }}

      # Stopps bis zur Zustellung bei Amazons eigener Flotte. Amazon traegt
      # sie nur in raw.stops_away, das der Aggregator weglaesst; gelesen wird
      # die Paketliste der Amazon-Sensoren, gefunden ueber die Integration
      # (keine Entity-ID noetig). Schluessel wie in pakete-templates.yaml
      # (pk.schluessel): Sendungsnummer ohne Leerraum, gross geschrieben.
      # Die Schleife steht in state und attributes, weil beide Templates
      # getrennt gerendert werden.
      - name: Pakete Amazon Stopps
        unique_id: pakete_amazon_stopps
        icon: mdi:map-marker-distance
        state: >-
          {%- set ns = namespace(m={}) %}
          {%- for s in expand(integration_entities('amazon_orders') | select('match', 'sensor\.') | list) %}
            {%- for p in (s.attributes.get('parcels') or []) if p.get('status') == 'out_for_delivery' and p.get('barcode') %}
              {%- set n = (p.get('raw') or {}).get('stops_away') %}
              {%- if n is number and n is not boolean %}
                {%- set ns.m = dict(ns.m, **{(p.barcode | string | regex_replace('\s', '') | upper): n | int}) %}
              {%- endif %}
            {%- endfor %}
          {%- endfor %}
          {{ ns.m | count }}
        attributes:
          stopps: >-
            {%- set ns = namespace(m={}) %}
            {%- for s in expand(integration_entities('amazon_orders') | select('match', 'sensor\.') | list) %}
              {%- for p in (s.attributes.get('parcels') or []) if p.get('status') == 'out_for_delivery' and p.get('barcode') %}
                {%- set n = (p.get('raw') or {}).get('stops_away') %}
                {%- if n is number and n is not boolean %}
                  {%- set ns.m = dict(ns.m, **{(p.barcode | string | regex_replace('\s', '') | upper): n | int}) %}
                {%- endif %}
              {%- endfor %}
            {%- endfor %}
            {{ ns.m }}

      # Zustellfoto von Amazons eigener Flotte. Amazon legt es als Bild-
      # Entitaet an und nennt sie in raw.delivery_photo_entity_id der
      # zugestellten Sendung (README ha-amazon "Delivery photo", ab 0.8.0);
      # der Aggregator laesst raw weg. Schluessel wie bei den Stopps. Das Foto
      # bleibt, solange die Sendung in Amazons Liste "zugestellt" steht.
      - name: Pakete Amazon Fotos
        unique_id: pakete_amazon_fotos
        icon: mdi:camera-outline
        state: >-
          {%- set ns = namespace(m={}) %}
          {%- for s in expand(integration_entities('amazon_orders') | select('match', 'sensor\.') | list) %}
            {%- for p in (s.attributes.get('parcels') or []) if p.get('delivered') and p.get('barcode') %}
              {%- set e = (p.get('raw') or {}).get('delivery_photo_entity_id') %}
              {%- if e is string and e.startswith('image.') %}
                {%- set ns.m = dict(ns.m, **{(p.barcode | string | regex_replace('\s', '') | upper): e}) %}
              {%- endif %}
            {%- endfor %}
          {%- endfor %}
          {{ ns.m | count }}
        attributes:
          fotos: >-
            {%- set ns = namespace(m={}) %}
            {%- for s in expand(integration_entities('amazon_orders') | select('match', 'sensor\.') | list) %}
              {%- for p in (s.attributes.get('parcels') or []) if p.get('delivered') and p.get('barcode') %}
                {%- set e = (p.get('raw') or {}).get('delivery_photo_entity_id') %}
                {%- if e is string and e.startswith('image.') %}
                  {%- set ns.m = dict(ns.m, **{(p.barcode | string | regex_replace('\s', '') | upper): e}) %}
                {%- endif %}
              {%- endfor %}
            {%- endfor %}
            {{ ns.m }}

script:
  paket_hinzufuegen:
    alias: "Pakete: Sendung hinzufügen"
    description: >-
      Pakete-View, Formular "+ Sendung": traegt eine Sendungsnummer bei der
      passenden Paket-Integration ein. DPD fehlt, weil ha-dpd keine Aktion
      zum Hinzufuegen hat.
    icon: mdi:package-variant-plus
    mode: queued
    fields:
      nummer:
        name: Sendungsnummer
        description: Wie auf dem Beleg, Leerzeichen werden entfernt
        required: true
        example: JJD000390007855342
        selector:
          text:
      dienst:
        name: Paketdienst
        required: true
        selector:
          select:
            options:
              - label: DHL
                value: dhl
              - label: Hermes
                value: hermes
              - label: GLS
                value: gls
              - label: UPS
                value: ups
      inhalt:
        name: Inhalt
        description: >-
          Optional, was im Paket ist; geht als contents an track_parcel
          (seit den Updates vom 23.11.2026) und erscheint in der Pakete-View
        required: false
        example: Winterjacke
        selector:
          text:
    # daten: tracking_code und, nur wenn ein Inhalt angegeben ist, contents.
    # Ein leerer Text bliebe sonst als Inhalt stehen.
    sequence:
      - variables:
          daten: >-
            {%- set i = ((inhalt if inhalt is defined and inhalt is string else '') | trim)[:120] %}
            {{ dict({'tracking_code': (nummer | string) | replace(' ', '') | upper}, **({'contents': i} if i else {})) }}
      - choose:
          - conditions: "{{ dienst == 'dhl' }}"
            sequence:
              - action: dhl.track_parcel
                data: "{{ daten }}"
          - conditions: "{{ dienst == 'hermes' }}"
            sequence:
              - action: hermes.track_parcel
                data: "{{ daten }}"
          - conditions: "{{ dienst == 'gls' }}"
            sequence:
              - action: gls.track_parcel
                data: "{{ daten }}"
          - conditions: "{{ dienst == 'ups' }}"
            sequence:
              - action: ups.track_parcel
                data: "{{ daten }}"
        default:
          - stop: "Unbekannter Paketdienst"
            error: true

automation:
  - id: pakete_meldungen
    alias: "Pakete: Meldungen"
    description: >-
      Pakete-View: meldet aufs Handy, wenn eine Sendung in Zustellung geht,
      abholbereit ist oder ein Problem hat (zurueck an den Absender
      eingeschlossen). Ein Ausloeser je Status ueber das Ereignis
      parcel_aggregator_parcel_status_changed, damit alle Paketdienste
      zugleich abgedeckt sind. Die Zustellung selbst meldet die Kamera
      (Paket vor der Tuer).
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: out_for_delivery
        id: zustellung
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: at_pickup_point
        id: abholbereit
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: problem
        id: problem
      - trigger: event
        event_type: parcel_aggregator_parcel_status_changed
        event_data:
          new_status: returning
        id: problem
    # Je Ausloeser der passende Schalter der Karte "Meldungen"
    conditions:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: zustellung
              - condition: state
                entity_id: input_boolean.pakete_meldung_zustellung
                state: "on"
          - condition: and
            conditions:
              - condition: trigger
                id: abholbereit
              - condition: state
                entity_id: input_boolean.pakete_meldung_abholbereit
                state: "on"
          - condition: and
            conditions:
              - condition: trigger
                id: problem
              - condition: state
                entity_id: input_boolean.pakete_meldung_problem
                state: "on"
    # name und fenster lesen trigger.event.data direkt, nicht p: Home Assistant
    # speichert die Schluessel alphabetisch (fenster, name, p, ziel) und rendert
    # sie in dieser Reihenfolge, p waere dort noch nicht definiert.
    # fenster liest planned_from/planned_to mit .get() (seit 18.11.2026): Ein
    # fehlender Schluessel bricht sonst mit UndefinedError den ganzen Lauf ab,
    # bevor die Bedingungen geprueft werden (in HA getestet). Laut Parcel
    # Aggregator sind beide Felder immer da (Wert oder null); .get() sichert den
    # Fall ab, dass ein Paketdienst sie weglaesst.
    # name: Absender (falls bekannt) und die ganze Sendungsnummer wie in der
    # Paketzeile der View, z. B. "Versandhaus · JJD000390007855342"; der
    # Dienst steht schon im Titel. Ohne beides "Sendung".
    # inhalt: Feld contents (seit den Updates vom 23.11.2026; Amazon:
    # Artikelnamen), auf 60 Zeichen gekuerzt, als zweite Zeile der Meldung.
    # fenster: "10:00–12:00 Uhr"; nennt der Dienst nur den Beginn, endet das
    # Fenster um 23:59:59 desselben Tages (Paket-Vertrag), dann "ab 10:00
    # Uhr"; ab 00:00 bis 23:59 ist es der ganze Tag und bleibt leer.
    variables:
      ziel: /dashboard-home/pakete
      p: "{{ trigger.event.data }}"
      name: "{{ [trigger.event.data.get('sender') or '', trigger.event.data.get('barcode') or ''] | map('string') | select | join(' · ') or 'Sendung' }}"
      inhalt: "{{ (trigger.event.data.get('contents') or '') | string | trim | truncate(60, False, '…', 0) }}"
      fenster: >-
        {%- set von = trigger.event.data.get('planned_from') | as_datetime(none) %}
        {%- set bis = trigger.event.data.get('planned_to') | as_datetime(none) %}
        {%- if von and bis %}
          {%- set v = von | as_local %}{% set b = bis | as_local %}
          {%- if b.date() == v.date() and b.strftime('%H:%M') == '23:59' %}
            {%- if v.strftime('%H:%M') != '00:00' %}ab {{ v.strftime('%H:%M') }} Uhr{% endif %}
          {%- elif (bis - von).total_seconds() < 72000 %}{{ v.strftime('%H:%M') }}–{{ b.strftime('%H:%M') }} Uhr{% endif %}
        {%- endif %}
    actions:
      - action: notify.mobile_app_iphone
        data:
          title: >-
            {{ {'zustellung': 'In Zustellung', 'abholbereit': 'Abholbereit', 'problem': 'Problem mit Sendung'}[trigger.id] }} · {{ p.carrier }}
          message: >-
            {% if trigger.id == 'zustellung' %}{{ name }} kommt heute{{ ', ' ~ fenster if fenster }}.{% elif trigger.id == 'abholbereit' %}{{ name }} liegt bereit{{ ': ' ~ p.pickup_point if p.pickup_point }}.{% else %}{{ name }}: {{ (p.raw_status or p.new_status) | string | regex_replace('<[^>]*>', '') }}{% endif %}{{ '\nInhalt: ' ~ inhalt if inhalt }}
          data:
            url: "{{ ziel }}"
            clickAction: "{{ ziel }}"
            group: pakete
            # Abholbereit: Knopf "Karte und Oeffnungszeiten". Keine
            # Paket-Integration liefert Oeffnungszeiten; Apple Karten zeigt
            # sie zur Adresse. Nur mit Postleitzahl, sonst traefe die Suche
            # womoeglich einen falschen Ort. Seit den Updates vom 23.11.2026
            # nennen DHL und Hermes in pickup_point nur noch den Namen (GLS
            # die Shopnummer, DPD, UPS und Amazon nichts). Die volle Adresse
            # steht bei DHL noch im Verlauf: die Meldung "zur Abholung bereit"
            # verlinkt die Packstation als <a ...>Packstation 216, Strasse,
            # PLZ Ort</a> (Quelltext ha-dhl, _pickup_point_from_events). Also
            # erst pickup_point, dann der Linktext der neuesten Verlaufszeile
            # mit Link; braucht bei DHL die Option "Parcel history". Gaengige
            # HTML-Entities werden ersetzt. "\\b" statt "\b": in Jinja waere
            # \b ein Rueckschritt. Ohne Adresse eine leere Liste, kein Knopf.
            actions: >-
              {%- set ns = namespace(ort=none) %}
              {%- if trigger.id == 'abholbereit' %}
                {%- if p.pickup_point is string and p.pickup_point | regex_search('\\b\\d{5}\\b') %}{% set ns.ort = p.pickup_point %}{% endif %}
                {%- for h in (p.history or []) | reverse if ns.ort is none and h.raw_status is string and '<a' in h.raw_status %}
                  {%- set t = (h.raw_status | regex_findall('<a[^>]*>(.*?)</a>') | first | default('')) | regex_replace('<[^>]*>', '') | replace('&amp;', '&') | replace('&szlig;', 'ß') | replace('&auml;', 'ä') | replace('&ouml;', 'ö') | replace('&uuml;', 'ü') | replace('&Auml;', 'Ä') | replace('&Ouml;', 'Ö') | replace('&Uuml;', 'Ü') | replace('&nbsp;', ' ') %}
                  {%- if t | regex_search('\\b\\d{5}\\b') %}{% set ns.ort = t | trim %}{% endif %}
                {%- endfor %}
              {%- endif %}
              {%- if ns.ort %}
              {{- [{'action': 'URI', 'title': 'Karte und Öffnungszeiten', 'uri': 'https://maps.apple.com/?q=' ~ (ns.ort | urlencode)}] }}
              {%- else %}[]{% endif %}

  - id: pakete_amazon_stopps
    alias: "Pakete: Amazon-Fahrer fast da"
    description: >-
      Pakete-View: meldet aufs Handy, sobald Amazons eigener Fahrer nur noch
      wenige Stopps (Variable schwelle) vor einer Sendung hat, je Sendung
      einmal. Quelle ist sensor.pakete_amazon_stopps; die Zahl ist so frisch
      wie die letzte Amazon-Abfrage (alle 15 Minuten in Zustellung).
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.pakete_amazon_stopps
        attribute: stopps
    # Nach einem Neustart oder Neuladen der Templates fehlt der alte Zustand
    # (none oder unavailable); ohne diese Bedingung kaeme die Meldung erneut
    conditions:
      - condition: state
        entity_id: input_boolean.pakete_meldung_stopps
        state: "on"
      - "{{ trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) }}"
    variables:
      schwelle: 3
    # Jede variables-Liste hat nur unabhaengige Schluessel: Home Assistant
    # speichert sie alphabetisch und rendert sie in dieser Reihenfolge
    actions:
      # Sendungen, die die Schwelle gerade erreicht haben (vorher darueber
      # oder noch nicht da); weitere Stopps darunter melden nichts mehr
      - variables:
          neu: >-
            {%- set alt = trigger.from_state.attributes.get('stopps') or {} %}
            {%- set jetzt = trigger.to_state.attributes.get('stopps') or {} %}
            {%- set ns = namespace(l=[]) %}
            {%- for k, n in jetzt.items() if n is number and n <= schwelle and not (alt.get(k) is number and alt.get(k) <= schwelle) %}
              {%- set ns.l = ns.l + [k] %}
            {%- endfor %}
            {{ ns.l }}
      - condition: template
        value_template: "{{ neu | count > 0 }}"
      - repeat:
          for_each: "{{ neu }}"
          sequence:
            # Name wie in "Pakete: Meldungen": Absender (falls bekannt) und
            # die ganze Sendungsnummer; Inhalt wie dort, gekuerzt
            - variables:
                n: "{{ trigger.to_state.attributes.stopps[repeat.item] }}"
                inhalt: >-
                  {%- set ns = namespace(c='') %}
                  {%- for p in (state_attr('sensor.parcel_aggregator_incoming_parcels', 'parcels') or []) if p.get('barcode') and (p.barcode | string | regex_replace('\s', '') | upper) == repeat.item %}
                    {%- set ns.c = (p.get('contents') or '') | string | trim %}
                  {%- endfor %}
                  {{ ns.c | truncate(60, False, '…', 0) }}
                name: >-
                  {%- set ns = namespace(s='') %}
                  {%- for p in (state_attr('sensor.parcel_aggregator_incoming_parcels', 'parcels') or []) if p.get('barcode') and (p.barcode | string | regex_replace('\s', '') | upper) == repeat.item %}
                    {%- set ns.s = p.get('sender') or '' %}
                  {%- endfor %}
                  {{ [ns.s, repeat.item] | select | join(' · ') }}
            - action: notify.mobile_app_iphone
              data:
                title: "Fahrer fast da · Amazon"
                message: >-
                  {{ name }}: {{ 'du bist der nächste Stopp.' if n == 0 else 'noch 1 Stopp bis zu dir.' if n == 1 else 'noch ' ~ n ~ ' Stopps bis zu dir.' }}{{ '\nInhalt: ' ~ inhalt if inhalt }}
                data:
                  url: /dashboard-home/pakete
                  clickAction: /dashboard-home/pakete
                  group: pakete
                  tag: "{{ 'pakete-stopps-' ~ repeat.item }}"
                  # iOS: zeitkritisch, kommt durch jeden Fokus (auch "Nicht
                  # stoeren"), der zeitkritische Mitteilungen erlaubt;
                  # Android ignoriert den Schluessel
                  push:
                    interruption-level: time-sensitive

  - id: pakete_amazon_zustellfoto
    alias: "Pakete: Amazon-Zustellfoto"
    description: >-
      Pakete-View: meldet aufs Handy, wenn Amazons eigene Flotte eine Sendung
      mit Zustellfoto zugestellt hat, und zeigt das Foto in der Meldung.
      Ohne Foto keine Meldung (die Zustellung meldet die Kamera, Paket vor
      der Tuer).
    mode: queued
    max: 10
    # Ereignis der Amazon-Integration, nicht des Aggregators: nur dort steht
    # raw.delivery_photo_entity_id. Die Bild-Entitaet existiert schon, wenn
    # es feuert (README ha-amazon "Delivery photo", ab 0.8.0)
    triggers:
      - trigger: event
        event_type: amazon_orders_parcel_delivered
    # Kein Schluessel liest einen anderen: Home Assistant speichert variables
    # alphabetisch und rendert sie in dieser Reihenfolge
    variables:
      foto: "{{ (trigger.event.data.get('raw') or {}).get('delivery_photo_entity_id') or '' }}"
      inhalt: "{{ (trigger.event.data.get('contents') or '') | string | trim | truncate(60, False, '…', 0) }}"
      name: "{{ [trigger.event.data.get('sender') or '', trigger.event.data.get('barcode') or ''] | map('string') | select | join(' · ') or 'Sendung' }}"
      ziel: /dashboard-home/pakete
    conditions:
      - condition: state
        entity_id: input_boolean.pakete_meldung_zustellfoto
        state: "on"
      - "{{ foto is string and foto.startswith('image.') }}"
    actions:
      - action: notify.mobile_app_iphone
        data:
          title: "Zugestellt · Amazon"
          message: "{{ name }} wurde zugestellt.{{ '\nInhalt: ' ~ inhalt if inhalt }}"
          data:
            # Die Companion-App laedt den Pfad mit dem eigenen Konto, kein
            # Token noetig (README ha-amazon "Delivery photo" und deren
            # Beispiel-Automation unter examples/automations)
            image: "{{ '/api/image_proxy/' ~ foto }}"
            url: "{{ ziel }}"
            clickAction: "{{ ziel }}"
            group: pakete
            tag: "{{ 'pakete-zugestellt-' ~ trigger.event.data.get('barcode') }}"
