# ============================================================================
# WoW – Berufe
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   wow_charakter
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Berufe eines Charakters: je Beruf Name, Stufe (Erweiterung) und Skill als
# Balken bis zum Maximum der neuesten Stufe. Sortiert nach Fortschritt.
#
# Daten: je Beruf ein Sensor sensor.<praefix>_beruf_<beruf> (Zustand =
# Skill, Attribute tier und max_skill). Die Endung nach _beruf_ ist der Name,
# den die API beim Anlegen lieferte (bei aelteren Installationen englisch,
# z. B. _beruf_tailoring); die Karte sucht deshalb alle Sensoren mit diesem
# Anfang. Den Anzeigenamen nimmt sie aus dem Entitaetsnamen ("Beruf
# Schneiderei"). Die Stufe kommt ab Integration 0.6.0 in der Sprache der
# Region, vorher englisch ("Midnight Tailoring").
# Ab Integration 0.8.0 steht das Symbol des Berufs vor der Zeile (Bild der
# Entitaet, entity_picture); vorher bleibt es weg.
# Kochkunst und Angeln koennen eine aeltere Stufe zeigen: Die Integration
# nimmt die neueste Stufe, die der Charakter gelernt hat.
# WoW Classic: Die Classic-API liefert keine Berufe, die Integration legt die
# Sensoren nicht an; die Karte nennt das statt der Einrichtungs-Meldung
# (Spielversion aus dem Modell des Charakter-Geraets).
#
# Unterzeile: Spielversion (Retail, Classic Era, ...) vor dem Namen des
# Charakters, wie in wow-werte-karte.yaml; bis zu zwei Zeilen.
#
# Farben: Nachtblau-Theme-Variablen mit dunklem Rueckfall, Akzent Rose (Bereich
# Freizeit); ein ausgelernter Beruf (Skill = Maximum) bekommt Gruen und den
# Wert als Text.
#
# Voraussetzung: custom:button-card (HACS) und die HACS-Integration
# "WoW Charakter" (philf90/HA-WOW) ab 0.3.0.
type: custom:button-card
triggers_update: all
show_icon: true
show_name: true
show_label: true
show_state: false
icon: mdi:hammer-wrench
name: Berufe
label: |
  [[[
    const p = variables.prefix;
    const geraet = String(states[`sensor.${p}_level`]?.attributes?.friendly_name || '')
      .replace(/\s*Level$/, '').split(' – ')[0];
    const n = Object.keys(states).filter((id) => id.startsWith(`sensor.${p}_beruf_`)).length;
    // Spielversion aus dem Modell des Geraets: "World of Warcraft" (Retail),
    // "World of Warcraft Classic Era" oder bis 0.21.x "World of Warcraft (classic_era)"
    const versionen = {
      retail: 'Retail', classic_era: 'Classic Era', classic_progression: 'Classic Progression',
      classic_anniversary: 'Classic Anniversary', forever: 'Forever',
    };
    const modell = (hass.devices || {})[(hass.entities || {})[`sensor.${p}_level`]?.device_id]?.model;
    const m = /^World of Warcraft(?: \((.+)\)| (.+))?$/.exec(modell || '');
    const spiel = m ? (m[1] ? (versionen[m[1]] || m[1]) : (m[2] || 'Retail')) : null;
    return [spiel, geraet, n === 1 ? '1 Beruf' : `${n} Berufe`].filter(Boolean).join(' · ');
  ]]]
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Nur diese Zeile anpassen: Entity-ID ohne Domain und Endung,
  # z. B. sensor.<charakter>_<realm>_level -> <charakter>_<realm>
  prefix: wow_charakter
  farben: |
    [[[
      return {
        akzent: 'var(--nachtblau-rose, #e6a0c4)',
        gruen:  'var(--nachtblau-gruen, #a6d49e)',
        text:   'var(--nachtblau-text, #f2f5f8)',
        label:  'var(--nachtblau-label, #b4c0cf)',
        sek:    'var(--nachtblau-text-sekundaer, #8794a5)',
        kachel: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))',
        rand:   'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))',
        spur:   'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))',
      };
    ]]]
custom_fields:
  body: |
    [[[
      const f = variables.farben, p = variables.prefix;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const zweizeilig = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';
      const berufe = Object.keys(states)
        .filter((id) => id.startsWith(`sensor.${p}_beruf_`))
        .map((id) => {
          const e = states[id];
          const skill = parseFloat(e.state);
          const max = parseFloat(e.attributes?.max_skill);
          const name = String(e.attributes?.friendly_name || id).split(' Beruf ').pop();
          return { name, tier: e.attributes?.tier, bild: e.attributes?.entity_picture, skill: isNaN(skill) ? null : skill, max: isNaN(max) ? null : max };
        })
        .sort((a, b) => ((b.max ? (b.skill || 0) / b.max : 0) - (a.max ? (a.skill || 0) / a.max : 0))
          || a.name.localeCompare(b.name, 'de'));
      if (!berufe.length) {
        // Schluessel der Spielversion aus dem Modell des Geraets: "World of Warcraft
        // Classic Era" ergibt classic_era, ohne Zusatz retail; bis 0.21.x
        // "World of Warcraft (classic_era)"
        const modell = (hass.devices || {})[(hass.entities || {})[`sensor.${p}_level`]?.device_id]?.model;
        const treffer = /^World of Warcraft(?: \((.+)\)| (.+))?$/.exec(modell || '');
        const version = treffer ? (treffer[1] || (treffer[2] ? treffer[2].toLowerCase().replace(/ /g, '_') : 'retail')) : undefined;
        if (version?.startsWith('classic_')) {
          return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Berufe gibt es für WoW Classic nicht: Die Classic-API von Blizzard liefert keine Berufsdaten.</div>`;
        }
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Berufe unter <span style="color:${f.label};">sensor.${esc(p)}_beruf_*</span> gefunden. Integration „WoW Charakter“ einrichten und das Präfix in der Karte anpassen.</div>`;
      }
      const zeilen = berufe.map((b) => {
        const fertig = b.max && b.skill !== null && b.skill >= b.max;
        const farbe = fertig ? f.gruen : f.akzent;
        const breite = b.max && b.skill !== null ? Math.max(0, Math.min(100, b.skill / b.max * 100)) : 0;
        // Symbol des Berufs (ab Integration 0.8.0), sonst nur Text
        const symbol = b.bild
          ? `<img src="${esc(b.bild)}" alt="" style="grid-row:1 / span 2;align-self:center;width:30px;height:30px;border-radius:8px;border:1px solid ${f.rand};">`
          : '';
        return `
          <div style="display:grid;grid-template-columns:${b.bild ? '30px ' : ''}minmax(0,1fr) auto;gap:3px 10px;align-items:baseline;">
            ${symbol}
            <span style="min-width:0;font-size:13px;font-weight:700;color:${f.text};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(b.name)}</span>
            <span style="font-size:12px;color:${f.sek};white-space:nowrap;"><b style="font-size:14px;font-weight:750;color:${fertig ? f.gruen : f.text};font-variant-numeric:tabular-nums;">${b.skill === null ? '–' : b.skill}</b>${b.max ? ` / ${b.max}` : ''}</span>
            ${b.tier ? `<span style="grid-column:${b.bild ? '2' : '1'} / -1;font-size:12px;line-height:1.3;color:${f.sek};${zweizeilig}">${esc(b.tier)}</span>` : ''}
            <div style="grid-column:${b.bild ? '2' : '1'} / -1;height:6px;border-radius:5px;background:${f.spur};overflow:hidden;"><div style="height:100%;width:${breite}%;border-radius:5px;background:${farbe};"></div></div>
          </div>`;
      }).join('');
      return `<div style="background:${f.kachel};border:1px solid ${f.rand};border-radius:14px;padding:10px 12px;display:grid;gap:12px;">${zeilen}</div>`;
    ]]]
styles:
  card:
    - padding: 14px 16px 16px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n" "i l" "body body"'
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: min-content min-content auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 16%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - --ha-icon-display: block
    - color: 'var(--nachtblau-rose, #e6a0c4)'
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--nachtblau-text, #f2f5f8)'
  label:
    - justify-self: start
    - align-self: start
    # Spielversion, Name und Zusatz: bis zu zwei Zeilen statt "..."
    - max-width: 100%
    - overflow: hidden
    - white-space: normal
    - display: -webkit-box
    - -webkit-box-orient: vertical
    - -webkit-line-clamp: '2'
    - text-wrap: balance
    - text-align: left
    - font-size: 12.5px
    - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
    - margin-top: 1px
  custom_fields:
    body:
      - padding-top: 12px
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
