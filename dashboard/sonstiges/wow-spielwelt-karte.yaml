# ============================================================================
# WoW – Spielwelt und Woche
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card, apexcharts-card, card-mod
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Was fuer alle Charaktere einer Region gilt, aus dem Geraet "WoW-Spielwelt"
# der Integration "WoW Charakter":
#   Kopf     Countdown bis zum woechentlichen Reset und dessen Zeitpunkt
#   Kacheln  Preis der WoW-Marke in Gold; je Realm Server online/offline,
#            Bevoelkerung und Warteschlange
#   Verlauf  Preis der WoW-Marke der letzten 7 Tage (apexcharts-card,
#            Stundenmittel aus dem Verlauf; die Standard-Aufbewahrung von
#            10 Tagen reicht dafuer)
# Realms: alle Server-Sensoren binary_sensor.<welt>_server_<realm>, also
# jeder Realm, auf dem ein Charakter angelegt ist.
#
# Region: variables.welt ist das Praefix des Geraets, bei EU
# wow_spielwelt_eu (keine persoenliche Angabe). Fuer eine andere Region dort
# und im Diagramm (series.entity) anpassen. Die Endungen (_wow_marke,
# _wochentlicher_reset, _server_, _warteschlange_, _bevolkerung_) sind die
# Namen bei deutscher Oberflaeche.
#
# Farben: Owlet-Theme-Variablen mit dunklem Rueckfall, Akzent Rose (Bereich
# Freizeit). Server online Gruen, offline Rot, Warteschlange Amber (Hinweis);
# der Zustand steht immer auch als Wort in der Pille. Das Diagramm faerbt per
# card-mod-CSS nach Modus, weil apexcharts-card bei einem Themewechsel nicht
# neu zeichnet (wie energie-monatsbilanz-karte.yaml); die Farbe unter series
# ist der dunkle Wert und gilt nur ohne card-mod.
#
# Voraussetzung: custom:button-card, custom:apexcharts-card (getestet
# v2.2.3) und card-mod (HACS), dazu die HACS-Integration "WoW Charakter"
# (philf90/HA-WOW) ab 0.3.0.
type: custom:button-card
triggers_update: all
show_icon: true
show_name: true
show_label: true
show_state: false
icon: mdi:earth
name: |
  [[[
    const e = states[`sensor.${variables.welt}_wow_marke`];
    const geraet = String(e?.attributes?.friendly_name || '').replace(/\s*WoW-Marke$/, '');
    return geraet.replace(/^WoW-/, '') || 'Spielwelt';
  ]]]
label: |
  [[[
    const e = states[`sensor.${variables.welt}_wochentlicher_reset`];
    const d = new Date(e?.state);
    if (!e || isNaN(d.getTime())) return 'Reset unbekannt';
    const min = Math.max(0, Math.round((d - Date.now()) / 60000));
    const t = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    const rest = t >= 1 ? `${t} T ${h} h` : h >= 1 ? `${h} h ${m} min` : `${m} min`;
    const tage = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
    const uhr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    return `Reset in ${rest} · ${tage[d.getDay()]} ${uhr}`;
  ]]]
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Praefix des Spielwelt-Geraets; bei einer anderen Region auch im
  # Diagramm unten anpassen
  welt: wow_spielwelt_eu
  farben: |
    [[[
      return {
        akzent: 'var(--owlet-rose, #e6a0c4)',
        gruen:  'var(--owlet-gruen, #a6d49e)',
        amber:  'var(--owlet-amber, #e6b566)',
        rot:    'var(--owlet-rot, #f0736a)',
        text:   'var(--owlet-text, #f2f5f8)',
        titel:  'var(--owlet-titel, #e7ecf3)',
        label:  'var(--owlet-label, #b4c0cf)',
        sek:    'var(--owlet-text-sekundaer, #8794a5)',
        kachel: 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))',
        rand:   'var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))',
      };
    ]]]
custom_fields:
  body: |
    [[[
      const f = variables.farben, w = variables.welt;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const marke = states[`sensor.${w}_wow_marke`];
      if (!marke) {
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Entitäten unter <span style="color:${f.label};">sensor.${esc(w)}_*</span> gefunden. Integration „WoW Charakter“ einrichten und variables.welt anpassen.</div>`;
      }
      const pille = (farbe, text) => `<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:9px;background:color-mix(in srgb, ${farbe} 12%, transparent);border:1px solid color-mix(in srgb, ${farbe} 24%, transparent);color:${farbe};font-size:12px;font-weight:700;white-space:nowrap;"><span style="width:6px;height:6px;border-radius:50%;background:${farbe};"></span>${text}</span>`;
      const kachel = (inhalt) => `<div style="min-width:0;background:${f.kachel};border:1px solid ${f.rand};border-radius:14px;padding:10px 12px;display:grid;gap:5px;align-content:start;">${inhalt}</div>`;

      const gold = parseFloat(marke.state);
      const preis = isNaN(gold) ? '–' : `${Math.round(gold).toLocaleString('de-DE')} g`;
      const kacheln = [kachel(`
        <div style="font-size:12px;color:${f.sek};">WoW-Marke</div>
        <div style="font-size:18px;font-weight:750;letter-spacing:-0.01em;color:${f.text};font-variant-numeric:tabular-nums;white-space:nowrap;">${preis}</div>
        <div style="font-size:12px;color:${f.sek};">Preis im Auktionshaus</div>`)];

      const vorne = `binary_sensor.${w}_server_`;
      const realms = Object.keys(states).filter((id) => id.startsWith(vorne)).sort();
      for (const id of realms) {
        const slug = id.slice(vorne.length);
        const server = states[id];
        const name = String(server.attributes?.friendly_name || slug).split(' Server ').pop();
        const schlange = states[`binary_sensor.${w}_warteschlange_${slug}`];
        const volk = states[`sensor.${w}_bevolkerung_${slug}`];
        const status = server.state === 'on' ? pille(f.gruen, 'online')
          : server.state === 'off' ? pille(f.rot, 'offline')
          : `<span style="font-size:12px;color:${f.sek};">keine Daten</span>`;
        const warte = schlange?.state === 'on' ? pille(f.amber, 'Warteschlange')
          : `<div style="font-size:12px;color:${f.sek};">keine Warteschlange</div>`;
        const bevoelkerung = volk && !['unknown', 'unavailable'].includes(volk.state)
          ? `<div style="font-size:12px;color:${f.sek};">Bevölkerung: <span style="color:${f.label};">${esc(volk.state)}</span></div>` : '';
        kacheln.push(kachel(`
          <div style="min-width:0;font-size:13px;font-weight:700;line-height:1.3;color:${f.text};overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${esc(name)}</div>
          <div>${status}</div>${bevoelkerung}${warte}`));
      }
      return `<div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;">${kacheln.join('')}</div>`;
    ]]]
  titel: |
    [[[
      return `<div style="font-size:12px;color:${variables.farben.sek};">WoW-Marke · 7 Tage, Stundenmittel</div>`;
    ]]]
  verlauf:
    card:
      type: custom:apexcharts-card
      graph_span: 7d
      header:
        show: false
      show:
        last_updated: false
      apex_config:
        chart:
          height: 120
        legend:
          show: false
        grid:
          padding:
            left: 4
            right: 8
        tooltip:
          x:
            format: 'dd.MM. HH:mm'
      yaxis:
        - decimals: 0
          apex_config:
            tickAmount: 2
      series:
        - entity: sensor.wow_spielwelt_eu_wow_marke
          name: WoW-Marke
          type: line
          # Dunkler Wert; das CSS unten setzt die Farbe je Modus
          color: '#e6a0c4'
          stroke_width: 2
          group_by:
            func: avg
            duration: 1h
          show:
            legend_value: false
      card_mod:
        style: |
          ha-card {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
          }
          .apexcharts-line { stroke: var(--owlet-rose, #e6a0c4); }
          .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--owlet-text-sekundaer, #8794a5); }
          .apexcharts-gridline { stroke: var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
          .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--owlet-flaeche-erhoeht, #222b3c) !important; color: var(--owlet-text, #f2f5f8) !important; border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important; }
          .apexcharts-tooltip-title { background: var(--owlet-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
          .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--owlet-flaeche-erhoeht, #222b3c) !important; }
          .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker { color: var(--owlet-rose, #e6a0c4) !important; }
styles:
  card:
    - padding: 14px 16px 12px
    - border-radius: 22px
    - border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n" "i l" "body body" "titel titel" "verlauf verlauf"'
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: min-content min-content auto auto auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--owlet-rose, #e6a0c4) 16%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--owlet-rose, #e6a0c4) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - --ha-icon-display: block
    - color: 'var(--owlet-rose, #e6a0c4)'
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--owlet-text, #f2f5f8)'
  label:
    - justify-self: start
    - align-self: start
    - font-size: 12.5px
    - color: 'var(--owlet-text-sekundaer, #8794a5)'
    - margin-top: 1px
  custom_fields:
    body:
      - padding-top: 12px
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
    titel:
      - justify-self: start
      - padding: 12px 2px 0
    verlauf:
      - justify-self: stretch
      - min-width: 0
      - margin-top: 2px
