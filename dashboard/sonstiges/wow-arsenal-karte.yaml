# ============================================================================
# WoW – Arsenal eines Charakters
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     wow_basis (wow-templates.yaml),
#                wow_platz (wow-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   wow_charakter
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Charakterseite wie im Arsenal von World of Warcraft, gebaut fuer 360 px:
#   Kopf     Avatar (ab Integration 0.8.0 mit Symbol der Spezialisierung),
#            Name, Titel, Stufe, Volk, Spezialisierung und Klasse,
#            Spielversion (Retail, Classic Era, ...);
#            Pillen fuer Itemlevel, Mythic+-Wertung, Fraktion und Realm
#   Mitte    Ganzkoerperbild, links und rechts je 8 Ausruestungsplaetze in
#            der Reihenfolge des Arsenals, darunter Waffen- und Schildhand
#   Unten    Kennzahlen: Raid-Fortschritt (hoechste Schwierigkeit mit Kills),
#            Erfolgspunkte, Reittiere, Ehrenstufe
# Jeder Platz zeigt das Item-Symbol mit einem Rand in der Qualitaetsfarbe und
# das Itemlevel. Leere Plaetze (z. B. Hemd) stehen gestrichelt da. Hat ein
# Item einen leeren Sockel, sitzt oben rechts am Symbol ein Amber-Punkt; im
# Tooltip steht der Sockel dann mit "leer" in Amber. Mit der
# Maus zeigt ein Platz beim Darueberfahren den Item-Tooltip wie im Spiel;
# Tippen oeffnet ihn als Popup (Templates wow_platz und wow_tooltip in
# wow-templates.yaml, dort auch die Farben). Jeder Platz ist dafuer eine
# eigene button-card in einem custom_field; nur so hat jeder Platz eine
# eigene Aktion. Die Entitaet setzt die Karte aus variables.prefix.
#
# Farben: Die Item-Qualitaet nutzt die offiziellen Spielfarben (Sonderfarben
# in design/palette.yaml, DESIGN.md "Sonderfarben"). Selten und Episch halten
# auf der Huelle nur 3,06:1 bzw. 3,02:1 -- genug fuer den Rand (3:1 fuer
# Grafiken), nicht fuer Text. Die Farben stehen deshalb nur als Rand am
# Symbol, nie als Schrift. Gewoehnlich (im Spiel Weiss) nimmt den Primaertext
# #f2f5f8, weil Weiss deckend nicht erlaubt ist.
# Hell und dunkel: Die Karte bleibt in beiden Modi dunkel (Identitaetshuelle,
# DESIGN.md "Heller Modus"); auf heller Huelle hielte Ungewoehnlich #1eff00
# nur 1,25:1. Alle Farben stehen deshalb als dunkle Hex-Werte.
#
# Mythic+: Die Pille zeigt den Sensorwert der aktuellen Season, sonst das
# Attribut api_rating -- denselben Wert wie das Arsenal.
#
# Spielversion: steht im Modell des Charakter-Geraets ("World of Warcraft
# (classic_era)", Integration ab 0.3.0, Classic ab 0.9.0); die Karte liest es
# ueber hass.entities und hass.devices wie wow-charaktere-karte.yaml. Ohne
# Geraet fehlt sie, ein unbekannter Schluessel erscheint unveraendert.
#
# Voraussetzung: custom:button-card und browser_mod (HACS), die Templates aus
# wow-templates.yaml im Dashboard und die HACS-Integration "WoW Charakter"
# (philf90/HA-WOW) ab 0.5.0 mit einem Charakter als Untereintrag. Die Karte liest die Entitaeten ueber variables.prefix; die
# Endungen (_level, _ausrustung_kopf, ...) sind die Namen, die Home Assistant
# mit deutscher Oberflaeche vergibt. Mit englischer Oberflaeche heissen sie
# anders (_equipment_head) und muessen hier angepasst werden.
type: custom:button-card
template: wow_basis
entity: sensor.wow_charakter_level
# Kopf und Kennzahlen lesen weitere Entitaeten ueber variables.prefix;
# button-card erkennt sie nicht selbst, deshalb bei jeder Zustandsaenderung
# neu zeichnen. Die Plaetze sind eigene Karten und zeichnen sich selbst.
triggers_update: all
show_icon: false
show_name: false
show_label: false
show_state: false
# Die Karte selbst hat keine Aktion: sonst bekommt sie bei jedem Tippen den
# Klick-Effekt ueber die ganze Flaeche (button-card zeigt ihn, sobald eine
# Kartenaktion etwas tut) und oeffnet ausserhalb der Plaetze die Details des
# Level-Sensors. Die Plaetze bleiben antippbar, weil button-card eine Karte
# mit eingebetteten Karten trotzdem bedienbar laesst.
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Nur diese Zeile anpassen: Entity-ID ohne Domain und Endung,
  # z. B. sensor.<charakter>_<realm>_level -> <charakter>_<realm>
  prefix: wow_charakter
custom_fields:
  kopf: |
    [[[
      const w = variables.wow, f = w.farben, esc = w.esc, p = variables.prefix;
      const st = (domain, endung) => states[`${domain}.${p}_${endung}`];
      const leer = (e) => !e || ['unavailable', 'unknown', ''].includes(e.state);
      const zahl = (e) => (leer(e) || isNaN(parseFloat(e.state))) ? null : parseFloat(e.state);
      const zweizeilig = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';

      const lvl = st('sensor', 'level');
      if (!lvl) {
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Entitäten unter <span style="color:${f.label};">sensor.${esc(p)}_*</span> gefunden. Integration „WoW Charakter“ einrichten und das Präfix in der Karte anpassen.</div>`;
      }
      const a = lvl.attributes || {};
      // Name aus dem Geraetenamen ("Name – Realm Level"), Titel ohne Namen
      const geraet = String(a.friendly_name || '').replace(/\s*Level$/, '');
      const name = geraet.split(' – ')[0] || p;
      let titel = a.title || '';
      if (titel && titel.includes(name)) {
        titel = titel.replace(name, '').replace(/^[\s,]+|[\s,]+$/g, '');
      }
      const avatar = st('image', 'avatar')?.attributes?.entity_picture;
      // Spielversion aus dem Modell des Geraets, z. B. "World of Warcraft (retail)"
      const versionen = {
        retail: 'Retail', classic_era: 'Classic Era', classic_progression: 'Classic Progression',
        classic_anniversary: 'Classic Anniversary', forever: 'Forever',
      };
      const modell = (hass.devices || {})[(hass.entities || {})[lvl.entity_id]?.device_id]?.model;
      const m = /^World of Warcraft \((.+)\)$/.exec(modell || '');
      const spiel = m ? (versionen[m[1]] || m[1]) : null;
      const zeile = [
        leer(lvl) ? null : `Stufe ${esc(lvl.state)}`,
        a.race,
        [a.spec, a.class].filter(Boolean).join(' '),
        spiel,
      ].filter(Boolean).map(esc).join(' · ');

      const ilvl = zahl(st('sensor', 'itemlevel'));
      // Mythic+: Wert der aktuellen Season, sonst api_rating wie im Arsenal
      const mplus = st('sensor', 'mythic_wertung');
      let wertung = zahl(mplus);
      if (wertung === null) wertung = mplus?.attributes?.api_rating ?? null;
      const pille = (inhalt) => `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:10px;background:${f.pille};border:1px solid ${f.rand};font-size:12px;font-weight:600;color:${f.label};white-space:nowrap;">${inhalt}</span>`;
      const wert = (v) => `<b style="color:${f.text};font-weight:750;font-variant-numeric:tabular-nums;">${v}</b>`;
      const pillen = [
        ilvl === null ? '' : pille(`${wert(Math.round(ilvl))} Itemlevel`),
        wertung === null ? '' : pille(`M+ ${wert(Math.round(wertung))}`),
        a.faction ? pille(esc(a.faction)) : '',
        a.realm ? pille(esc(a.realm)) : '',
        a.guild ? pille(esc(a.guild)) : '',
      ].join('');

      return `
        <div style="display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 12px;align-items:center;">
          <div style="position:relative;width:44px;height:44px;">
            <div style="width:44px;height:44px;border-radius:13px;overflow:hidden;background:${f.pille};border:1px solid ${f.rand};box-sizing:border-box;">
              ${avatar ? `<img src="${avatar}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;">` : ''}
            </div>
            ${a.spec_icon ? `<img src="${esc(a.spec_icon)}" alt="" title="${esc(a.spec || '')}" style="position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #1b2231;">` : ''}
          </div>
          <div style="min-width:0;">
            <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:${f.titel};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(name)}</div>
            ${titel ? `<div style="font-size:12.5px;line-height:1.3;color:${f.label};${zweizeilig}">${esc(titel)}</div>` : ''}
          </div>
          <div style="grid-column:1 / -1;margin-top:8px;font-size:12.5px;line-height:1.3;color:${f.sek};${zweizeilig}">${zeile}</div>
          ${pillen ? `<div style="grid-column:1 / -1;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${pillen}</div>` : ''}
        </div>`;
    ]]]
  # Ganzkoerperbild (1600 x 1200, transparent): Die Figur fuellt nur gut die
  # Haelfte der Hoehe, deshalb auf 140 % vergroessert und mittig
  bild: |
    [[[
      const bild = states[`image.${variables.prefix}_ganzkorperbild`]?.attributes?.entity_picture;
      return bild ? `<img src="${bild}" alt="" style="position:absolute;left:50%;top:50%;height:140%;width:auto;max-width:none;transform:translate(-50%, -52%);">` : '';
    ]]]
  l1:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_kopf`; ]]]'
      variables:
        seite: links
  l2:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_hals`; ]]]'
      variables:
        seite: links
  l3:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_schultern`; ]]]'
      variables:
        seite: links
  l4:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_rucken`; ]]]'
      variables:
        seite: links
  l5:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_brust`; ]]]'
      variables:
        seite: links
  l6:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_hemd`; ]]]'
      variables:
        seite: links
  l7:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_wappenrock`; ]]]'
      variables:
        seite: links
  l8:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_handgelenke`; ]]]'
      variables:
        seite: links
  r1:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_hande`; ]]]'
      variables:
        seite: rechts
  r2:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_taille`; ]]]'
      variables:
        seite: rechts
  r3:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_beine`; ]]]'
      variables:
        seite: rechts
  r4:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_fusse`; ]]]'
      variables:
        seite: rechts
  r5:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_finger_1`; ]]]'
      variables:
        seite: rechts
  r6:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_finger_2`; ]]]'
      variables:
        seite: rechts
  r7:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_schmuck_1`; ]]]'
      variables:
        seite: rechts
  r8:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_schmuck_2`; ]]]'
      variables:
        seite: rechts
  w1:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_waffenhand`; ]]]'
      variables:
        seite: rechts
  w2:
    card:
      type: custom:button-card
      template: wow_platz
      entity: '[[[ return `sensor.${variables.prefix}_ausrustung_schildhand`; ]]]'
      variables:
        seite: links
  leiste: |
    [[[
      const w = variables.wow, f = w.farben, p = variables.prefix;
      const st = (endung) => states[`sensor.${p}_${endung}`];
      const zahl = (e) => (!e || isNaN(parseFloat(e.state))) ? null : parseFloat(e.state);
      const zweizeilig = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';
      // Raid in der hoechsten Schwierigkeit mit Kills
      const stufen = [['mythisch', 'Mythisch'], ['heroisch', 'Heroisch'], ['normal', 'Normal'], ['lfr', 'LFR']];
      let raid = { wert: '–', name: 'Raid' };
      for (const [endung, anzeige] of stufen) {
        const e = st('raid_fortschritt_' + endung);
        const n = zahl(e);
        if (n !== null && (n > 0 || endung === 'lfr')) {
          const gesamt = e.attributes?.total_bosses;
          raid = { wert: gesamt ? `${n}/${gesamt}` : `${n}`, name: `Raid ${anzeige}` };
          break;
        }
      }
      const format = (v) => v === null ? '–' : Math.round(v).toLocaleString('de-DE');
      const kennzahlen = [
        raid,
        { wert: format(zahl(st('erfolgspunkte'))), name: 'Erfolge' },
        { wert: format(zahl(st('reittiere'))), name: 'Reittiere' },
        { wert: format(zahl(st('ehrenstufe'))), name: 'Ehren&shy;stufe' },
      ];
      return `
        <div style="display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:6px;">
          ${kennzahlen.map((k) => `
            <div style="min-width:0;padding:8px 6px;border-radius:13px;background:${f.kachel};border:1px solid ${f.rand};text-align:center;">
              <div style="font-size:15px;font-weight:750;color:${f.text};font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${k.wert}</div>
              <div style="margin-top:2px;font-size:11.5px;line-height:1.25;color:${f.sek};${zweizeilig}">${k.name}</div>
            </div>`).join('')}
        </div>`;
    ]]]
styles:
  card:
    # Nachtblau-Huelle mit festen dunklen Werten: bleibt in beiden Modi dunkel
    - padding: 18px
    - border-radius: 22px
    - border: 1px solid rgba(255, 255, 255, 0.05)
    - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
    - box-shadow: 0 18px 44px -22px rgba(0, 0, 0, 0.7)
    - color: '#f2f5f8'
    # Tooltips der Plaetze ragen ueber die Kartenkante
    - overflow: visible
    # Die Karte selbst ist nicht antippbar (siehe tap_action), nur die Plaetze
    - cursor: default
  grid:
    # Plaetze links und rechts, das Bild ueber acht Zeilen in der Mitte,
    # darunter Waffen- und Schildhand mittig
    - grid-template-areas: >-
        "kopf kopf kopf kopf"
        "l1 bild bild r1" "l2 bild bild r2" "l3 bild bild r3" "l4 bild bild r4"
        "l5 bild bild r5" "l6 bild bild r6" "l7 bild bild r7" "l8 bild bild r8"
        ". w1 w2 ."
        "leiste leiste leiste leiste"
    - grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto
    - row-gap: 5px
    - column-gap: 6px
  custom_fields:
    kopf:
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      # button-card setzt an custom_fields white-space: nowrap (Klasse
      # ellipsis); Titel und Infozeile brechen sonst nicht zweizeilig um
      - white-space: normal
      - margin-bottom: 9px
    bild:
      - position: relative
      - align-self: stretch
      - justify-self: stretch
      - min-width: 0
      - overflow: hidden
      - border-radius: 16px
    w1:
      - justify-self: end
      - margin-right: 3px
      - margin-top: 1px
    w2:
      - justify-self: start
      - margin-left: 3px
      - margin-top: 1px
    leiste:
      - justify-self: stretch
      - min-width: 0
      - white-space: normal
      - margin-top: 9px
    l1:
      - justify-self: start
    l2:
      - justify-self: start
    l3:
      - justify-self: start
    l4:
      - justify-self: start
    l5:
      - justify-self: start
    l6:
      - justify-self: start
    l7:
      - justify-self: start
    l8:
      - justify-self: start
    r1:
      - justify-self: end
    r2:
      - justify-self: end
    r3:
      - justify-self: end
    r4:
      - justify-self: end
    r5:
      - justify-self: end
    r6:
      - justify-self: end
    r7:
      - justify-self: end
    r8:
      - justify-self: end
