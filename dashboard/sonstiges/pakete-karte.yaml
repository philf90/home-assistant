# ============================================================================
# Pakete – kompakte Karte fuer Home
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     pakete_kompakt (pakete-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Kurzfassung der Pakete-View (pakete-view.yaml) fuer die Startseite:
#
#   Kopf          Pakete, Zusammenfassung ("2 heute · 3 unterwegs ·
#                 1 abholbereit") und Knopf "+ Sendung" (Popup)
#   Problem       je Paket mit Status problem oder returning eine rote Zeile
#   Naechste      in Zustellung als gefuellte Amber-Kachel mit Zeitfenster;
#   Lieferung     kommt heute ohne Zustellung Amber getoent; sonst die
#                 naechste geplante Lieferung Blau getoent; ohne Plan entfaellt
#                 sie
#   Abholbereit   Koralle-Orange, Dienst und Abholort
#   Vor der Tuer  Paket-Erkennung der Kamera (input_boolean.paket_vor_der_tur)
#
# Tippen auf die Karte oeffnet /dashboard-home/pakete. Ohne Parcel Aggregator
# zeigt die Karte einen Hinweis statt leer zu bleiben.
#
# Voraussetzung: Templates aus pakete-templates.yaml (dort alle Integrationen
#                und Helfer), Skript aus pakete-konfig.yaml fuer "+ Sendung".
type: custom:button-card
template: pakete_kompakt
