# ============================================================================
# Pakete – kompakte Karte fuer Home
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     pakete_kompakt (pakete-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Hinweis auf der Startseite, solange mindestens eine Sendung in Zustellung
# (Status out_for_delivery) oder abholbereit (at_pickup_point) ist. Sonst ist
# die Karte unsichtbar und nimmt keinen Platz ein.
#
#   Sichtbar      visibility, eine der zwei Bedingungen genuegt:
#                 sensor.pakete_in_zustellung ueber 0 (Template-Sensor aus
#                 pakete-konfig.yaml, je Sendungsnummer einmal gezaehlt) oder
#                 sensor.parcel_aggregator_awaiting_pickup ueber 0 (Parcel
#                 Aggregator). Ohne Aggregator ist beides 0 bzw. nicht da.
#   Kopf          Pakete, "1 in Zustellung · 1 abholbereit · 3 unterwegs"
#   Kacheln       je Sendung in Zustellung eine gefuellte Amber-Kachel mit
#                 Dienst, Absender und Zeitfenster; darunter je abholbereite
#                 Sendung eine Koralle-Kachel mit Abholort; je Art hoechstens
#                 drei, darunter "und N weitere"
#
# Nicht auf der Karte: "Paket vor der Tuer" (zeigt auf Home schon die Karte
# fuer Klingel und Paket-Erkennung), Probleme und "+ Sendung" (beides in der
# Pakete-View, Probleme zusaetzlich als Push-Meldung).
#
# Platz auf Home: direkt unter der Karte fuer Klingel und "Paket vor der
# Tuer", vor der Personen-Zeile. So stehen alle Hinweise, die nur zeitweise
# erscheinen (Wetterwarnung, Klingel/Paket, Pakete), oben beisammen.
#
# Tippen auf die Karte oeffnet /dashboard-home/pakete.
#
# Voraussetzung: Templates aus pakete-templates.yaml (dort alle Integrationen
#                und Helfer), Template-Sensor aus pakete-konfig.yaml.
type: custom:button-card
template: pakete_kompakt
visibility:
  - condition: or
    conditions:
      - condition: numeric_state
        entity: sensor.pakete_in_zustellung
        above: 0
      - condition: numeric_state
        entity: sensor.parcel_aggregator_awaiting_pickup
        above: 0
