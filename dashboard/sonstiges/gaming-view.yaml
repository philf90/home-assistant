# ============================================================================
# Gaming – zwei Ansichten fuer Battlefield 6 und World of Warcraft
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        bf6-arsenal-card, bf6-classes-card, bf6-history-card,
#                bf6-maps-card, bf6-modes-card, bf6-player-card,
#                bf6-world-card, button-card, decluttering-card,
#                wow-arsenal-card, wow-characters-card, wow-collections-card,
#                wow-guild-card, wow-mythic-card, wow-professions-card,
#                wow-pvp-card, wow-raid-card, wow-reputation-card,
#                wow-stats-card, wow-talent-tree-card, wow-wardrobe-card,
#                wow-world-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                gaming_umschalter (gaming-templates.yaml),
#                gaming_wahl (gaming-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor eines eigenen Dashboards
#                (URL dashboard-gaming), Block views: ersetzen
# Platzhalter:   bf6_spieler, wow_charakter
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Eigenes Dashboard "Gaming" mit den Karten der Integrationen BF6 Spieler und
# WoW Charakter. Umgesetzt ist Vorschlag A "Zwei Spiele" aus dem Entwurf
# entwuerfe/gaming-dashboard.html:
#
#   Battlefield 6      Umschalter, Spieler, Verlauf K/D, Verlauf Kills,
#                      Klassen, Karten, Modi, Arsenal, Spielwelt
#   World of Warcraft  Umschalter, Spielwelt, Arsenal, Werte, Mythic+, Raids,
#                      PvP, Talentbaum, Berufe, Ruf, Sammlungen, Garderobe,
#                      Gilde, Charaktere
#
# Reihenfolge wie im Entwurf: zuerst, was sich taeglich aendert, dann
# Fortschritt, dann Sammlung. Abweichend vom Entwurf zwei Verlaeufe wie im
# frueheren Test-Dashboard: K/D (Mittel je Tag) und Kills (Zuwachs je Tag). Oben in jedem View der Umschalter
# (gaming_umschalter) mit beiden Spielen und je einer Kennzahl; das Spiel des
# offenen Views ist Rose getoent, die andere Kachel wechselt den View.
# Jeder View endet mit der Navbar aus dem Home-Dashboard (floating_navbar);
# "Gaming" steht dort im More-Menue unter Freizeit und oeffnet
# /dashboard-gaming, also den ersten View (Battlefield 6).
#
# Aufbau: sections, max_columns 3. Der Umschalter liegt in einem Abschnitt
# ueber alle Spalten (column_span 3), jede Integrationskarte in einem eigenen
# Abschnitt. Am Handy liegen die Abschnitte in dieser Reihenfolge
# untereinander, am Desktop verteilen sie sich auf drei Spalten. Alle
# Integrationskarten fuellen die Breite ihres Abschnitts (12 von 12 Spalten).
#
# Ein Charakter: Jede WoW-Karte zeigt genau einen Charakter (entity). Alle
# Karten nutzen denselben (wow_charakter); die uebrigen zeigt "WoW
# Charaktere" am Ende. BF6 Squad fehlt bewusst: Sie vergleicht mehrere
# Spieler und lohnt erst ab dem zweiten.
#
# EINRICHTEN (einmal):
#   1. Einstellungen -> Dashboards -> Dashboard hinzufuegen -> "Neues
#      Dashboard von Grund auf", Titel "Gaming", Symbol mdi:gamepad-variant,
#      URL dashboard-gaming (die Pfade unten und im More-Menue nutzen sie).
#   2. Dashboard oeffnen -> Bearbeiten -> 3 Punkte -> Raw-Konfigurationseditor:
#      - button_card_templates: aus gaming-templates.yaml
#      - decluttering_templates: floating_navbar aus navigation-templates.yaml
#        (Templates gelten nur im eigenen Dashboard; aendert sich das
#        More-Menue, auch hier nachziehen)
#      - views: aus dieser Datei
#   3. Platzhalter ersetzen: bf6_spieler (sensor.<spieler>_kills),
#      wow_charakter (sensor.<charakter>_<realm>_level).
#
# Voraussetzung: custom:button-card ab 7.0 und custom:decluttering-card
# (HACS), HACS-Integration browser_mod (More-Menue der Navbar);
# HACS-Integrationen "BF6 Spieler" (philf90/HA-BF6) ab 0.6.2 und
# "WoW Charakter" (philf90/HA-WOW) ab 0.33.9. Beide liefern ihre Karten
# selbst aus, eine Dashboard-Ressource ist nicht noetig.
views:
  # --------------------------------------------------------------------------
  # Battlefield 6
  # --------------------------------------------------------------------------
  - title: Battlefield 6
    path: bf6
    icon: mdi:target
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: gaming_umschalter
            custom_fields:
              links:
                card:
                  type: custom:button-card
                  template: gaming_wahl
                  variables: { spiel: bf6, prefix: bf6_spieler, aktiv: true }
                  tap_action: { action: none }
              rechts:
                card:
                  type: custom:button-card
                  template: gaming_wahl
                  variables: { spiel: wow, aktiv: false }
                  tap_action: { action: navigate, navigation_path: /dashboard-gaming/wow }
      - type: grid
        cards:
          - type: custom:bf6-player-card
            entity: sensor.bf6_spieler_kills
      - type: grid
        cards:
          - type: custom:bf6-history-card
            entity: sensor.bf6_spieler_kills
            metric: kd
            period: day
            days: 30
      - type: grid
        cards:
          - type: custom:bf6-history-card
            entity: sensor.bf6_spieler_kills
            metric: kills
            period: day
            days: 30
      - type: grid
        cards:
          - type: custom:bf6-classes-card
            entity: sensor.bf6_spieler_kills
      - type: grid
        cards:
          - type: custom:bf6-maps-card
            entity: sensor.bf6_spieler_kills
            limit: 10
            min_matches: 1
      - type: grid
        cards:
          - type: custom:bf6-modes-card
            entity: sensor.bf6_spieler_kills
      - type: grid
        cards:
          - type: custom:bf6-arsenal-card
            entity: sensor.bf6_spieler_kills
      - type: grid
        cards:
          - type: custom:bf6-world-card
      - &navbar
        type: grid
        cards:
          - type: custom:decluttering-card
            template: floating_navbar

  # --------------------------------------------------------------------------
  # World of Warcraft
  # --------------------------------------------------------------------------
  - title: World of Warcraft
    path: wow
    icon: mdi:sword-cross
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: gaming_umschalter
            custom_fields:
              links:
                card:
                  type: custom:button-card
                  template: gaming_wahl
                  variables: { spiel: bf6, prefix: bf6_spieler, aktiv: false }
                  tap_action: { action: navigate, navigation_path: /dashboard-gaming/bf6 }
              rechts:
                card:
                  type: custom:button-card
                  template: gaming_wahl
                  variables: { spiel: wow, aktiv: true }
                  tap_action: { action: none }
      - type: grid
        cards:
          - type: custom:wow-world-card
            entity: sensor.wow_spielwelt_eu_wow_marke
      - type: grid
        cards:
          - type: custom:wow-arsenal-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-stats-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-mythic-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-raid-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-pvp-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-talent-tree-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-professions-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-reputation-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-collections-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-wardrobe-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-guild-card
            entity: sensor.wow_charakter_level
      - type: grid
        cards:
          - type: custom:wow-characters-card
      - *navbar
