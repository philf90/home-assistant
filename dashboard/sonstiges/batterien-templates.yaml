# ============================================================================
# Batterien – Darstellung fuer Hinweiszeile, Karte und Popups
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        keine
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Ein button-card-Template fuer alle Batterie-Anzeigen. Es liest nur
# sensor.batterien (batterien-konfig.yaml) und die Helfer, rechnet selbst
# nichts aus. Die Karte waehlt mit variables.modus, was sie zeigt:
#
#   hinweis       Zeile fuer Home: "2 Batterien wechseln", Geraete mit Wert,
#                 Pille mit der hoechsten Stufe. Leer, wenn nichts offen ist
#                 (die Karte blendet sich ueber visibility selbst aus).
#   karte         Karte "Batterien" fuer die System-View: Zaehler je Stufe,
#                 Listen Wechseln, Beobachten, Zuletzt gewechselt, Fusszeile.
#   liste         Inhalt des Popups "Batterien" (aus der Hinweiszeile).
#   ausgenommen   Liste der ausgenommenen Geraete fuer das Popup
#                 "Batterie-Meldungen", aus Registry und Label gerechnet.
#
# Stufen und Farben (DESIGN.md, Status): 1 Hinweis Amber, 2 erhoeht
# Koralle-Orange (immer mit dem Wort), 3 kritisch Rot, nicht erreichbar Rot.
# Kleine Schrift bleibt in Textfarbe; die Farbe tragen Icon-Kachel, Punkt und
# Balken. Werte mit Komma, Prozentzeichen mit geschuetztem Leerzeichen.
#
# Breiten: Inhalt 306 px (Galaxy S25) bzw. 348 px (iPhone 17 Pro); Namen und
# Unterzeilen brechen in hoechstens zwei Zeilen um.
#
# Voraussetzung: custom:button-card (HACS), sensor.batterien und die Helfer
# input_number.batterie_stufe_1..3 aus batterien-konfig.yaml, das Label
# keine_batteriemeldung.
button_card_templates:
  nachtblau_batterien:
    entity: sensor.batterien
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    triggers_update:
      - sensor.batterien
      - input_number.batterie_stufe_1
    variables:
      # hinweis | karte | liste | ausgenommen
      modus: karte
      label: keine_batteriemeldung
    styles:
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        body:
          - width: 100%
          - min-width: 0
          - white-space: normal
    extra_styles: |
      .bt { width: 100%; color: var(--nachtblau-text, #f2f5f8); text-align: left; }
      .bt-kopf { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; }
      .bt-ik { width: 46px; height: 46px; box-sizing: border-box; border-radius: 14px; display: grid; place-items: center; }
      .bt-t { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
      .bt-u { font-size: 13px; color: var(--nachtblau-label, #b4c0cf); margin-top: 3px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-wrap: balance; }
      .bt-gear { width: 36px; height: 36px; box-sizing: border-box; border-radius: 11px; display: grid; place-items: center; background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)); border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
      .bt-ue { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
      .bt-uk { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)); border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); border-radius: 13px; padding: 9px 10px 8px; min-width: 0; }
      .bt-un { font-size: 21px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
      .bt-un i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .bt-ul { font-size: 12.5px; color: var(--nachtblau-text-sekundaer, #8794a5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bt-ab { margin-top: 14px; display: grid; gap: 7px; }
      .bt-abt { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--nachtblau-text-sekundaer, #8794a5); }
      .bt-z { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)); border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); border-radius: 13px; padding: 8px 10px 8px 8px; min-width: 0; }
      .bt-zi { width: 34px; height: 34px; box-sizing: border-box; border-radius: 11px; display: grid; place-items: center; }
      .bt-zm { min-width: 0; }
      .bt-zn { font-size: 14px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
      .bt-zs { font-size: 12.5px; color: var(--nachtblau-text-sekundaer, #8794a5); line-height: 1.3; margin-top: 1px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .bt-zw { display: grid; justify-items: end; gap: 5px; }
      .bt-zw b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .bt-bar { width: 46px; height: 5px; border-radius: 3px; background: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); overflow: hidden; display: block; }
      .bt-bar i { display: block; height: 100%; border-radius: 3px; }
      .bt-leer { font-size: 13px; color: var(--nachtblau-text-sekundaer, #8794a5); padding: 2px 4px; line-height: 1.35; }
      .bt-warn { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 13px; font-size: 13px; line-height: 1.35; background: color-mix(in srgb, var(--nachtblau-rot, #f0736a) 12%, transparent); border: 1px solid color-mix(in srgb, var(--nachtblau-rot, #f0736a) 24%, transparent); }
      .bt-fuss { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); display: flex; align-items: center; gap: 9px; font-size: 12.5px; line-height: 1.3; color: var(--nachtblau-text-sekundaer, #8794a5); min-width: 0; }
      .bt-fuss > span { min-width: 0; }
      .bt-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 18px; gap: 11px; align-items: center; }
      .bt-ht { font-size: 15px; font-weight: 700; line-height: 1.25; }
      .bt-hs { font-size: 12.5px; color: var(--nachtblau-label, #b4c0cf); line-height: 1.3; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-wrap: balance; }
      .bt-p { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; background: color-mix(in srgb, var(--a) 12%, transparent); border: 1px solid color-mix(in srgb, var(--a) 24%, transparent); }
      .bt-p i { width: 7px; height: 7px; border-radius: 50%; background: var(--a); }
      .bt-hin { font-size: 12.5px; color: var(--nachtblau-text-sekundaer, #8794a5); line-height: 1.4; padding: 2px 4px 0; }
      .bt-aus { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)); border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); border-radius: 13px; padding: 10px 12px; display: grid; gap: 5px; }
      .bt-at { font-size: 14px; font-weight: 600; }
      .bt-as { font-size: 12.5px; color: var(--nachtblau-label, #b4c0cf); line-height: 1.4; }
      .bt-as b { color: var(--nachtblau-text, #f2f5f8); font-weight: 600; }
    custom_fields:
      body: |
        [[[
          const M = variables.modus || 'karte';
          // ---------- Nachtblau-Palette ----------
          const TEXT = 'var(--nachtblau-text, #f2f5f8)';
          const LABEL = 'var(--nachtblau-label, #b4c0cf)';
          const SEK = 'var(--nachtblau-text-sekundaer, #8794a5)';
          const ROT = 'var(--nachtblau-rot, #f0736a)';
          const KOR = 'var(--nachtblau-koralle, #e7936e)';
          const AMB = 'var(--nachtblau-amber, #e6b566)';
          const GRUEN = 'var(--nachtblau-gruen, #a6d49e)';
          const STUFE = {
            3: { wort: 'kritisch', farbe: ROT, icon: 'mdi:battery-10' },
            2: { wort: 'erhöht', farbe: KOR, icon: 'mdi:battery-20' },
            1: { wort: 'Hinweis', farbe: AMB, icon: 'mdi:battery-30' },
          };
          // ---------- Bausteine ----------
          const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
          const icon = (name, c, px) => `<ha-icon icon="${name}" style="--mdc-icon-size:${px}px;--ha-icon-display:block;width:${px}px;height:${px}px;margin:0;display:block;flex:none;color:${c};"></ha-icon>`;
          // Icon-Kachel: Flaeche 0,16, Rand 0,24 der Farbe (DESIGN.md, Toenungen)
          const ton = (c) => `background:color-mix(in srgb, ${c} 16%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);`;
          const p2 = (n) => String(n).padStart(2, '0');
          const tag = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.`; };
          const istZahl = (w) => typeof w === 'number' && isFinite(w);
          const zahl = (w) => istZahl(w) ? String(Math.round(w * 10) / 10).replace('.', ',') : '';
          const pz = (w) => zahl(w) + '&nbsp;%';

          // ================= Ausgenommene Geraete (Popup Einstellungen) =================
          if (M === 'ausgenommen') {
            const E = hass.entities || {}, D = hass.devices || {};
            const auto = new Map(), lab = new Map();
            for (const [id, s] of Object.entries(states)) {
              if (!(id.startsWith('sensor.') || id.startsWith('binary_sensor.'))) continue;
              if (!s.attributes || s.attributes.device_class !== 'battery') continue;
              const e = E[id] || {}, d = e.device_id ? D[e.device_id] : null;
              const name = d ? (d.name_by_user || d.name) : (s.attributes.friendly_name || id);
              const key = e.device_id || id;
              if (['mobile_app', 'browser_mod'].includes(e.platform)) auto.set(key, name);
              else if ((e.labels || []).includes(variables.label) || (d && (d.labels || []).includes(variables.label))) lab.set(key, name);
            }
            const namen = [...lab.values()].sort((a, b) => a.localeCompare(b, 'de')).map(esc).join(', ');
            return `
              <div class="bt"><div class="bt-aus">
                <div class="bt-at">Ausgenommen · ${auto.size + lab.size} Geräte</div>
                <div class="bt-as"><b>Automatisch (${auto.size}):</b> Handys, Tablets, Uhren und Browser</div>
                <div class="bt-as"><b>Label „Keine Batteriemeldung“ (${lab.size}):</b> ${namen || 'keine'}</div>
                <div class="bt-as">Gerät ausnehmen: Gerät öffnen und das Label setzen.</div>
              </div></div>`;
          }

          // ---------- Daten aus sensor.batterien ----------
          const s = states['sensor.batterien'];
          const ok = !!s && !['unavailable', 'unknown'].includes(s.state);
          const A = ok ? s.attributes : {};
          const faelle = Array.isArray(A.faelle) ? A.faelle : [];
          const beob = Array.isArray(A.beobachten) ? A.beobachten : [];
          const gew = Array.isArray(A.gewechselt) ? A.gewechselt : [];
          const stoer = Array.isArray(A.stoerung) ? A.stoerung : [];
          const n = faelle.length;
          const hs = Math.max(0, ...faelle.map((f) => Number(f.stufe) || 1));
          const kopf = STUFE[hs] || null;
          const zahlStufe = (k) => Number((states['input_number.batterie_stufe_' + k] || {}).state);
          const s1 = [zahlStufe(1), zahlStufe(2), zahlStufe(3)].filter(isFinite).sort((a, b) => b - a)[0] || 30;

          // ---------- Zeilen ----------
          const fallZeile = (f) => {
            const st = STUFE[f.stufe] || STUFE[1];
            const weg = f.art === 'weg';
            const ohneWert = !istZahl(f.wert);
            const ic = weg ? 'mdi:battery-off-outline' : (ohneWert ? 'mdi:battery-alert-variant-outline' : st.icon);
            const wert = weg ? 'weg' : (ohneWert ? 'schwach' : pz(f.wert));
            const unter = [
              (weg ? 'nicht erreichbar' : st.wort) + ' seit ' + tag(f.stufe_seit),
              f.bereich,
              (istZahl(f.tiefst) && istZahl(f.wert) && f.tiefst < f.wert - 0.4) ? 'tiefster Wert ' + zahl(f.tiefst) + ' %' : '',
            ].filter(Boolean).map(esc).join(' · ');
            const balken = ohneWert || weg ? '' : `<span class="bt-bar"><i style="width:${Math.max(4, Math.min(100, f.wert))}%;background:${st.farbe}"></i></span>`;
            return `<div class="bt-z"><div class="bt-zi" style="${ton(st.farbe)}">${icon(ic, st.farbe, 19)}</div><div class="bt-zm"><div class="bt-zn">${esc(f.name)}</div><div class="bt-zs">${unter}</div></div><div class="bt-zw"><b>${wert}</b>${balken}</div></div>`;
          };
          const beobZeile = (b) => `<div class="bt-z"><div class="bt-zi" style="${ton(LABEL)}">${icon('mdi:battery-40', LABEL, 19)}</div><div class="bt-zm"><div class="bt-zn">${esc(b.name)}</div><div class="bt-zs">${esc(b.bereich || 'beobachten')}</div></div><div class="bt-zw"><b>${pz(b.wert)}</b><span class="bt-bar"><i style="width:${Math.max(4, Math.min(100, b.wert))}%;background:${LABEL}"></i></span></div></div>`;
          const gewZeile = (g) => {
            const unter = 'gewechselt am ' + tag(g.am) + (istZahl(g.hielt_tage) ? ` · hielt ${g.hielt_tage} Tage` : '');
            return `<div class="bt-z"><div class="bt-zi" style="${ton(GRUEN)}">${icon('mdi:battery-check', GRUEN, 19)}</div><div class="bt-zm"><div class="bt-zn">${esc(g.name)}</div><div class="bt-zs">${esc(unter)}</div></div><div class="bt-zw"><b>${istZahl(g.nachher) ? pz(g.nachher) : 'ok'}</b></div></div>`;
          };
          const stoerZeile = stoer.length
            ? `<div class="bt-warn">${icon('mdi:alert-circle-outline', ROT, 17)}<span>Gestört: ${stoer.map(esc).join(', ')}. Dort zählt „nicht erreichbar“ vorerst nicht.</span></div>`
            : '';

          // ================= Hinweiszeile (Home) =================
          if (M === 'hinweis') {
            if (!ok || !n) return '';
            const titel = n === 1 ? '1 Batterie wechseln' : `${n} Batterien wechseln`;
            // Hoechstens zwei Zeilen: bis zwei Geraete ausgeschrieben, sonst das erste und "+N weitere"
            // Technische Namen (Seriennummer, z. B. "HmIP-eTRV-B-2 R4M 0039a2699ebb5e") brechen
            // nicht um; dort steht der Raum. Den vollen Namen zeigt das Popup.
            const anzeige = (f) => (/[0-9a-f]{8,}/i.test(f.name || '') && f.bereich) ? 'Gerät ' + f.bereich : f.name;
            const kurz = (f) => esc(anzeige(f)) + '&nbsp;' + (f.art === 'weg' ? 'weg' : (istZahl(f.wert) ? pz(f.wert) : 'schwach'));
            const namen = n <= 2 ? faelle.map(kurz).join(' · ') : `${kurz(faelle[0])} · +${n - 1}&nbsp;weitere`;
            return `<div class="bt"><div class="bt-h">
              <div class="bt-zi" style="${ton(kopf.farbe)}">${icon('mdi:battery-alert-variant-outline', kopf.farbe, 20)}</div>
              <div style="min-width:0;"><div class="bt-ht">${titel}</div><div class="bt-hs">${namen}</div></div>
              <span class="bt-p" style="--a:${kopf.farbe}"><i></i>${kopf.wort}</span>
              ${icon('mdi:chevron-right', SEK, 18)}
            </div></div>`;
          }

          // ================= Popup "Batterien" (aus der Hinweiszeile) =================
          if (M === 'liste') {
            if (!ok) return `<div class="bt"><div class="bt-leer">Die Prüfung ist noch nicht gelaufen.</div></div>`;
            return `<div class="bt">
              ${stoerZeile}
              <div class="bt-ab" style="margin-top:${stoerZeile ? 12 : 0}px"><div class="bt-abt">Wechseln</div>${n ? faelle.map(fallZeile).join('') : '<div class="bt-leer">Keine.</div>'}</div>
              <div class="bt-ab"><div class="bt-abt">Beobachten</div>${beob.length ? beob.map(beobZeile).join('') : '<div class="bt-leer">Keine.</div>'}</div>
              <div class="bt-hin" style="margin-top:12px;">Gemeldet wird bei jeder Stufe einmal, ab Stufe 3 täglich. Ein Fall endet von selbst, wenn die neue Batterie erkannt ist.</div>
            </div>`;
          }

          // ================= Karte "Batterien" (System-View) =================
          const zaehl = (k) => faelle.filter((f) => (Number(f.stufe) || 1) === k).length;
          const kf = !ok ? LABEL : (kopf ? kopf.farbe : GRUEN);
          const unterKopf = !ok
            ? 'Prüfung noch nicht gelaufen'
            : (n ? `${n} wechseln · ${A.ueberwacht} Geräte überwacht` : `Alles in Ordnung · ${A.ueberwacht} Geräte überwacht`);
          const zaehler = [3, 2, 1].map((k) => `<div class="bt-uk"><div class="bt-un"><i style="background:${STUFE[k].farbe}"></i>${ok ? zaehl(k) : '–'}</div><div class="bt-ul">${STUFE[k].wort}</div></div>`).join('');
          const inhalt = !ok
            ? `<div class="bt-ab"><div class="bt-leer">sensor.batterien fehlt oder ist nicht verfügbar. Das Paket batterien-konfig.yaml einspielen und die Template-Entitäten neu laden.</div></div>`
            : `
              ${stoerZeile ? `<div class="bt-ab">${stoerZeile}</div>` : ''}
              ${n ? `<div class="bt-ab"><div class="bt-abt">Wechseln</div>${faelle.map(fallZeile).join('')}</div>` : ''}
              <div class="bt-ab"><div class="bt-abt">Beobachten</div>${beob.length ? beob.map(beobZeile).join('') : `<div class="bt-leer">Keine Geräte zwischen ${zahl(s1)} und ${zahl(s1 + 10)} %.</div>`}</div>
              <div class="bt-ab"><div class="bt-abt">Zuletzt gewechselt</div>${gew.length ? gew.slice(0, 3).map(gewZeile).join('') : '<div class="bt-leer">Noch keine Einträge.</div>'}</div>`;
          const fuss = ok
            ? `Prüfung alle 15 min · ${Math.max(0, (A.ueberwacht || 0) - n)} in Ordnung · ${A.ausgenommen ?? 0} ausgenommen`
            : 'Prüfung alle 15 min';
          return `<div class="bt">
            <div class="bt-kopf">
              <div class="bt-ik" style="${ton(kf)}">${icon(n || !ok ? 'mdi:battery-alert-variant-outline' : 'mdi:battery-check', kf, 24)}</div>
              <div style="min-width:0;"><div class="bt-t">Batterien</div><div class="bt-u">${unterKopf}</div></div>
              <div class="bt-gear">${icon('mdi:cog-outline', LABEL, 20)}</div>
            </div>
            ${ok ? `<div class="bt-ue">${zaehler}</div>` : ''}
            ${inhalt}
            <div class="bt-fuss">${icon('mdi:clock-outline', SEK, 15)}<span>${fuss}</span></div>
          </div>`;
        ]]]
