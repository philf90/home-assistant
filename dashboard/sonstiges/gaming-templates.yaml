# ============================================================================
# Gaming – Umschalter zwischen den Spielen
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        keine
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Zwei Templates fuer das Gaming-Dashboard (gaming-view.yaml), Vorschlag A
# "Zwei Spiele" aus dem Entwurf gaming-dashboard.html:
#
#   gaming_umschalter  Huelle oben in jedem View, Innenabstand 10 px, darin
#                      zwei Kacheln nebeneinander (custom_fields links: BF6,
#                      rechts: WoW, je eine gaming_wahl-Karte, setzt die View).
#   gaming_wahl        Kachel eines Spiels: Icon-Kachel 34 px, Name, darunter
#                      eine Kennzahl.
#                        Battlefield 6      "K/D 1,50"
#                        World of Warcraft  "Reset 1 T 12 h"
#                      Das Spiel des offenen Views (variables.aktiv: true)
#                      ist Rose getoent (Flaeche 0,12, Rand 0,24, Icon-Kachel
#                      0,16/0,24, Icon Rose); das andere hat Unterkachel-Grund,
#                      neutrale Icon-Kachel (erhoehte Flaeche) und Label-Grau.
#                      Die Aktion (navigate) setzt die View an der Kachel des
#                      anderen Spiels. Die Kacheln sind eigene button-cards in
#                      der Huelle; die Huelle selbst hat keine Aktion.
#
# Variablen von gaming_wahl:
#   spiel    bf6 oder wow
#   prefix   nur BF6: Spieler (sensor.<spieler>_k_d -> <spieler>)
#   welt     nur WoW: Spielwelt-Geraet, Vorgabe wow_spielwelt_eu
#            (sensor.wow_spielwelt_eu_wochentlicher_reset)
#   aktiv    true beim Spiel des offenen Views
#
# Daten (Namen bei deutscher Oberflaeche): sensor.<spieler>_k_d und
# sensor.<welt>_wochentlicher_reset. Fehlt ein Wert, steht "–". Restzeit ab
# 2 Tagen "77 Tage", darunter "1 T 13 h", unter einem Tag "13 h", unter einer
# Stunde "45 min"; sie rechnet beim Zeichnen, triggers_update: all zeichnet
# bei jeder Zustandsaenderung neu.
#
# Breiten (DESIGN.md, Bildschirmbreiten): Karte 344 px (Galaxy S25) bzw.
# 386 px (iPhone 17 Pro), Inhalt nach 10 px Innenabstand und 1 px Rand
# 322 bzw. 364 px, Kachel bei 8 px Abstand 157 bzw. 178 px, Platz fuer den
# Text nach Innenabstand, Rand, Icon-Kachel und Spalt 92 bzw. 113 px.
# Gemessen (Roboto): "World of Warcraft" 107,5 px (700, 13,5 px) bricht beim
# S25 in zwei Zeilen um, beim iPhone nicht; "Battlefield 6" 73,6 px. Die
# Kennzahl ist einzeilig, laengste Form "Reset 100 Tage" 82,3 px (400, 12 px).
# Beide Kacheln sind gleich hoch (Raster, Hoehe 100 %).
#
# Farben: Nachtblau-Theme-Variablen mit dunklem Rueckfall, Akzent Rose
# (Bereich Freizeit, wie die Karten beider Integrationen).
#
# Voraussetzung: custom:button-card (HACS) ab 7.0 (eingebettete Karten in
# custom_fields); Integrationen "BF6 Spieler" (philf90/HA-BF6) und
# "WoW Charakter" (philf90/HA-WOW).
button_card_templates:
  gaming_umschalter:
    show_icon: false
    show_name: false
    show_label: false
    show_state: false
    tap_action: { action: none }
    hold_action: { action: none }
    double_tap_action: { action: none }
    styles:
      card:
        - padding: 10px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - cursor: default
      grid:
        - grid-template-areas: '"links rechts"'
        - grid-template-columns: repeat(2, minmax(0, 1fr))
        - column-gap: 8px
        - align-items: stretch
      custom_fields:
        links:
          - min-width: 0
        rechts:
          - min-width: 0
    # Kacheln gleich hoch: die eingebettete Karte fuellt ihr Rasterfeld
    extra_styles: |
      #links > *, #rechts > * { display: block; height: 100%; }

  gaming_wahl:
    triggers_update: all
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    hold_action: { action: none }
    double_tap_action: { action: none }
    variables:
      spiel: bf6
      prefix: ''
      welt: wow_spielwelt_eu
      aktiv: false
    icon: "[[[ return variables.spiel === 'wow' ? 'mdi:sword-cross' : 'mdi:target'; ]]]"
    name: "[[[ return variables.spiel === 'wow' ? 'World of Warcraft' : 'Battlefield 6'; ]]]"
    label: |
      [[[
        const da = (e) => e && !['unknown', 'unavailable'].includes(e.state);
        if (variables.spiel === 'wow') {
          const e = states[`sensor.${variables.welt}_wochentlicher_reset`];
          const t = da(e) ? Date.parse(e.state) : NaN;
          if (isNaN(t)) return 'Reset –';
          const m = Math.max(0, Math.round((t - Date.now()) / 60000));
          const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
          const rest = d >= 2 ? `${d} Tage` : d === 1 ? `1 T ${h} h` : h >= 1 ? `${h} h` : `${m} min`;
          return `Reset ${rest}`;
        }
        const e = states[`sensor.${variables.prefix}_k_d`];
        const kd = da(e) ? parseFloat(e.state) : NaN;
        return isNaN(kd) ? 'K/D –'
          : `K/D ${kd.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      ]]]
    styles:
      card:
        - height: 100%
        - box-sizing: border-box
        - padding: 10px
        - border-radius: 16px
        - box-shadow: none
        - background: |
            [[[ return variables.aktiv
                  ? 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 12%, transparent)'
                  : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
        - border: |
            [[[ return variables.aktiv
                  ? '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
                  : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
        - cursor: "[[[ return variables.aktiv ? 'default' : 'pointer'; ]]]"
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 34px minmax(0, 1fr)
        - grid-template-rows: auto auto
        - column-gap: 9px
        - align-content: center
      img_cell:
        - width: 34px
        - height: 34px
        - border-radius: 11px
        - align-self: center
        - background: |
            [[[ return variables.aktiv
                  ? 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 16%, transparent)'
                  : 'var(--nachtblau-flaeche-erhoeht, #222b3c)'; ]]]
        - border: |
            [[[ return variables.aktiv
                  ? '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
                  : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      icon:
        - width: 19px
        - height: 19px
        - --ha-icon-display: block
        - color: |
            [[[ return variables.aktiv
                  ? 'var(--nachtblau-rose, #e6a0c4)' : 'var(--nachtblau-label, #b4c0cf)'; ]]]
      name:
        - justify-self: start
        - align-self: end
        - text-align: left
        - font-size: 13.5px
        - font-weight: 700
        - line-height: 1.2
        - color: 'var(--nachtblau-text, #f2f5f8)'
        # Spielname bis zu zwei Zeilen statt "..." (S25: "World of Warcraft")
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
      label:
        - justify-self: start
        - align-self: start
        - max-width: 100%
        - font-size: 12px
        - line-height: 1.35
        - margin-top: 1px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        # Kennzahl: einzeilig
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
