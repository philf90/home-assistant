# ============================================================================
# Gaming – Spielkopf und Themen-Kachel
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        keine
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Zwei Templates fuer das Gaming-Dashboard (gaming-view.yaml), Vorschlag B
# "Lobby" aus dem Entwurf gaming-dashboard.html:
#
#   gaming_spiel  Kopf eines Spiels im Nachtblau-Stil.
#                 In der Lobby (ohne variables.thema): Symbol des Spiels,
#                 Name, Spieler bzw. Charakter und drei Kennzahlen.
#                   Battlefield 6      K/D, Siegquote, Restzeit der Saison
#                   World of Warcraft  Itemlevel, Mythic+-Wertung, Reset
#                 Auf einer Unterseite (variables.thema gesetzt): Pfeil
#                 zurueck, Thema als Titel, keine Kennzahlen. Die Aktion
#                 (zurueck zur Lobby) setzt die Karte in der View; das
#                 Template selbst hat keine.
#   gaming_thema  Kachel eines Themas (Icon ueber dem Namen). Die Kachel der
#                 gerade offenen Unterseite ist Rose getoent (Flaeche 0,12,
#                 Rand 0,24, Icon Rose, Name Primaertext). Erkannt wird sie am
#                 Pfad der Seite: endet er auf "/<variables.pfad>", ist sie
#                 aktiv. Jede View hat eigene Karten, der Pfad stimmt also
#                 beim ersten Zeichnen und aendert sich fuer diese Karte nicht.
#
# Variablen von gaming_spiel:
#   spiel    bf6 oder wow
#   prefix   Entity-ID ohne Domain und Endung: bei BF6 der Spieler
#            (sensor.<spieler>_k_d -> <spieler>), bei WoW der Charakter
#            (sensor.<charakter>_<realm>_level -> <charakter>_<realm>)
#   welt     nur WoW: Spielwelt-Geraet, Vorgabe wow_spielwelt_eu
#            (sensor.wow_spielwelt_eu_wochentlicher_reset)
#   thema    nur Unterseiten: Titel, z. B. "Kampf"
#
# Daten (Namen bei deutscher Oberflaeche):
#   BF6  sensor.<spieler>_k_d, _siegquote, _rang (Attribut rank_name),
#        _plattform; sensor.bf6_spielwelt_saisonende (Attribut season).
#        Name des Spielers = Name seines Geraets, wie in den Karten der
#        Integration. Siegquote in Farbe wie dort: ab 55 % Gruen, ab 45 %
#        Amber, darunter Rot; die Zahl steht immer dabei.
#   WoW  sensor.<charakter>_<realm>_level (Attribute class, spec),
#        _itemlevel, _mythic_wertung (ohne Lauf in der Season das Attribut
#        api_rating, dann "M+ laut Arsenal" wie in der Mythic+-Karte);
#        sensor.<welt>_wochentlicher_reset.
#   Fehlt ein Wert (unknown, unavailable, Classic ohne Mythic+), steht "–".
#   Restzeiten: ab 2 Tagen "77 Tage", darunter "1 T 13 h", unter einem Tag
#   "13 h", unter einer Stunde "45 min". Sie rechnen beim Zeichnen; triggers_update: all zeichnet
#   bei jeder Zustandsaenderung in Home Assistant neu.
#
# Breiten (DESIGN.md, Bildschirmbreiten): Inhalt der Huelle 310 px
# (Galaxy S25, Karte 344 px, 16 px Innenabstand, 1 px Rand) bzw. 352 px
# (iPhone 17 Pro); drei Kennzahlen je 99,3 bzw. 113,3 px, Platz fuer den
# Wert 77,3 bzw. 91,3 px. Laengste Werte gemessen (Roboto 700, 17 px):
# "100 Tage" 70,3 px, "1 T 13 h" 61,1 px, "100,0 %" 60 px; Labels brechen
# in zwei Zeilen um.
# Themen-Kachel im Raster mit 4 Spalten (WoW, Abstand 8 px): 80 bzw.
# 90,5 px breit, Platz fuer den Namen 66 bzw. 76,5 px; laengster Name
# "Sammlung" 58 px (Roboto 600, 12 px, gemessen).
#
# Farben: Nachtblau-Theme-Variablen mit dunklem Rueckfall, Akzent Rose
# (Bereich Freizeit, wie die Karten beider Integrationen).
#
# Voraussetzung: custom:button-card (HACS); Integrationen "BF6 Spieler"
# (philf90/HA-BF6) und "WoW Charakter" (philf90/HA-WOW).
button_card_templates:
  gaming_spiel:
    triggers_update: all
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action: { action: none }
    hold_action: { action: none }
    double_tap_action: { action: none }
    variables:
      spiel: bf6
      prefix: ''
      welt: wow_spielwelt_eu
      thema: ''
    icon: |
      [[[
        if (variables.thema) return 'mdi:arrow-left';
        return variables.spiel === 'wow' ? 'mdi:sword-cross' : 'mdi:target';
      ]]]
    name: |
      [[[
        if (variables.thema) return variables.thema;
        return variables.spiel === 'wow' ? 'World of Warcraft' : 'Battlefield 6';
      ]]]
    label: |
      [[[
        const v = variables, p = v.prefix;
        const spiel = v.spiel === 'wow' ? 'World of Warcraft' : 'Battlefield 6';
        if (v.thema) return `${spiel} · zurück zur Lobby`;
        const da = (e) => e && !['unknown', 'unavailable'].includes(e.state);
        if (v.spiel === 'wow') {
          const lvl = states[`sensor.${p}_level`];
          if (!lvl) return 'Charakter nicht gefunden';
          const a = lvl.attributes || {};
          const name = String(a.friendly_name || '').replace(/\s*Level$/, '').split(' – ')[0];
          const klasse = [a.spec, a.class].filter(Boolean).join(' ');
          return [name, klasse, da(lvl) ? `Stufe ${lvl.state}` : ''].filter(Boolean).join(' · ');
        }
        const kd = `sensor.${p}_k_d`;
        if (!states[kd]) return 'Spieler nicht gefunden';
        const ent = (hass.entities || {})[kd];
        const geraet = ent && (hass.devices || {})[ent.device_id];
        const name = geraet ? (geraet.name_by_user || geraet.name || '') : '';
        const plattformen = { steam: 'Steam', ea: 'EA app', epic: 'Epic Games', pc: 'PC',
          psn: 'PlayStation', ps4: 'PlayStation', ps5: 'PlayStation',
          xbox: 'Xbox', xboxone: 'Xbox', xboxseries: 'Xbox' };
        const plattform = plattformen[states[`sensor.${p}_plattform`]?.state] || '';
        const rang = states[`sensor.${p}_rang`];
        return [name, plattform, da(rang) ? `Rang ${rang.state}` : ''].filter(Boolean).join(' · ');
      ]]]
    custom_fields:
      kennzahlen: |
        [[[
          if (variables.thema) return '';
          const p = variables.prefix;
          const da = (e) => e && !['unknown', 'unavailable'].includes(e.state);
          const zahl = (e) => (da(e) && !isNaN(parseFloat(e.state))) ? parseFloat(e.state) : null;
          const de = (n, d) => n.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
          const rest = (e) => {
            const t = da(e) ? Date.parse(e.state) : NaN;
            if (isNaN(t)) return null;
            const m = Math.max(0, Math.round((t - Date.now()) / 60000));
            const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
            if (d >= 2) return `${d} Tage`;
            if (d === 1) return `1 T ${h} h`;
            return h >= 1 ? `${h} h` : `${m} min`;
          };
          const kachel = (titel, wert, farbe) => `
            <div style="min-width:0;padding:8px 10px;border-radius:13px;text-align:left;
              background:var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028));
              border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));">
              <div style="font-size:12px;line-height:1.25;color:var(--nachtblau-text-sekundaer, #8794a5);
                overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;">${titel}</div>
              <div style="font-size:17px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                color:${wert === null ? 'var(--nachtblau-text-sekundaer, #8794a5)' : (farbe || 'var(--nachtblau-text, #f2f5f8)')};">${wert === null ? '–' : wert}</div>
            </div>`;
          let k = [];
          if (variables.spiel === 'wow') {
            const ilvl = zahl(states[`sensor.${p}_itemlevel`]);
            const mp = states[`sensor.${p}_mythic_wertung`];
            const wertung = zahl(mp);
            const arsenal = wertung === null && mp ? parseFloat(mp.attributes?.api_rating) : NaN;
            const reset = rest(states[`sensor.${variables.welt}_wochentlicher_reset`]);
            k = [
              kachel('Itemlevel', ilvl === null ? null : de(ilvl, 0)),
              wertung !== null ? kachel('M+-Wertung', de(wertung, 0))
                : kachel('M+ laut Arsenal', isNaN(arsenal) ? null : de(arsenal, 0)),
              kachel('Reset in', reset),
            ];
          } else {
            const kd = zahl(states[`sensor.${p}_k_d`]);
            const sq = zahl(states[`sensor.${p}_siegquote`]);
            const ende = states['sensor.bf6_spielwelt_saisonende'];
            const saison = ende?.attributes?.season;
            const farbe = sq === null ? null : sq >= 55 ? 'var(--nachtblau-gruen, #a6d49e)'
              : sq >= 45 ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-rot, #f0736a)';
            k = [
              kachel('K/D', kd === null ? null : de(kd, 2)),
              kachel('Siegquote', sq === null ? null : `${de(sq, 1)} %`, farbe),
              kachel(saison ? `Saison ${saison} endet in` : 'Saison endet in', rest(ende)),
            ];
          }
          return `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;">${k.join('')}</div>`;
        ]]]
    styles:
      card:
        - padding: 14px 16px 14px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - cursor: "[[[ return variables.thema ? 'pointer' : 'default'; ]]]"
      grid:
        - grid-template-areas: "[[[ return variables.thema ? '\"i n\" \"i l\"' : '\"i n\" \"i l\" \"kennzahlen kennzahlen\"'; ]]]"
        - grid-template-columns: min-content minmax(0, 1fr)
        - grid-template-rows: min-content min-content auto
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 16%, transparent)'
        - border: '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
      icon:
        - width: 23px
        - height: 23px
        - --ha-icon-display: block
        - color: 'var(--nachtblau-rose, #e6a0c4)'
      name:
        - justify-self: start
        - align-self: end
        - text-align: left
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--nachtblau-text, #f2f5f8)'
      label:
        - justify-self: start
        - align-self: start
        # Spieler bzw. Charakter, Plattform, Rang: bis zu zwei Zeilen statt "..."
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-wrap: balance
        - text-align: left
        - font-size: 12.5px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        - margin-top: 1px
      custom_fields:
        kennzahlen:
          - padding-top: 12px
          - justify-self: stretch
          - min-width: 0
          - white-space: normal

  gaming_thema:
    show_icon: true
    show_name: true
    show_label: false
    show_state: false
    hold_action: { action: none }
    double_tap_action: { action: none }
    variables:
      pfad: ''
    styles:
      card:
        - padding: 8px 6px 7px
        - border-radius: 14px
        - box-shadow: none
        - background: |
            [[[ return window.location.pathname.endsWith('/' + variables.pfad)
                  ? 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 12%, transparent)'
                  : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'; ]]]
        - border: |
            [[[ return window.location.pathname.endsWith('/' + variables.pfad)
                  ? '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
                  : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: min-content min-content
        - justify-items: center
        - row-gap: 4px
      img_cell:
        - width: 20px
        - height: 20px
      icon:
        - width: 19px
        - height: 19px
        - --ha-icon-display: block
        - color: |
            [[[ return window.location.pathname.endsWith('/' + variables.pfad)
                  ? 'var(--nachtblau-rose, #e6a0c4)' : 'var(--nachtblau-label, #b4c0cf)'; ]]]
      name:
        - font-size: 12px
        - font-weight: 600
        - line-height: 1.25
        # Namen bis zu zwei Zeilen statt "..."
        - max-width: 100%
        - overflow: hidden
        - white-space: normal
        - display: -webkit-box
        - -webkit-box-orient: vertical
        - -webkit-line-clamp: '2'
        - text-align: center
        - color: |
            [[[ return window.location.pathname.endsWith('/' + variables.pfad)
                  ? 'var(--nachtblau-text, #f2f5f8)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
