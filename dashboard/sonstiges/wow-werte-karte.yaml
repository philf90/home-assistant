# ============================================================================
# WoW – Charakterwerte und Ausruestungs-Check
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     wow_platz (wow-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   wow_charakter
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Werte wie im Charakterfenster des Spiels, dazu ein Blick auf die Ausruestung:
#   Kopf        Spezialisierung und Heldentalente
#   Kacheln     Leben und Primaerwert (Staerke, Beweglichkeit oder Intelligenz)
#   Zweitwerte  Krit, Tempo, Meisterschaft, Vielseitigkeit in Prozent; die
#               Balken stehen im Verhaeltnis zum hoechsten der vier Werte
#   Ausruestung Set wie im Item-Tooltip des Arsenals: Teile (angelegt hell,
#               fehlend grau) und alle Boni (aktiv gruen, inaktiv grau);
#               die Zahl der Teile (3/5) als Pille: gruen, wenn alle Boni
#               aktiv sind, Amber, wenn ein Teil der Boni aktiv ist, grau
#               ohne aktiven Bonus (ohne Boni in den Daten: gruen bei allen
#               Teilen, Amber bei einigen);
#               darunter die Plaetze mit leerem Sockel und die verzauberten
#               Plaetze als Item-Symbole wie im Arsenal
# Leere Sockel sind ein Hinweis (Amber, mit Anzahl als Text). Fehlende
# Verzauberungen bewertet die Karte nicht: Welche Plaetze verzauberbar sind,
# liefert die API nicht.
#
# Item-Symbole: Jeder Platz ist eine eigene button-card mit dem Template
# wow_platz (wow-templates.yaml), genau wie im Arsenal: Rand in der
# Qualitaetsfarbe, Amber-Punkt bei leerem Sockel, Tooltip beim Darueber-
# fahren, Popup beim Tippen. Daneben steht der Name des Platzes, das Itemlevel
# klein darunter. Die Plaetze stehen in einer Raster-Karte (grid, zwei Spalten), die
# nur so viele Karten enthaelt wie Plaetze; ohne Plaetze faellt sie weg. Die
# Entitaet je Platz (_ausrustung_kopf, ...) setzt variables.ausruestung aus
# dem Feld slot der API zusammen; fehlt sie, steht nur der Name als Text da.
#
# Die sechs Werte-Sensoren (_leben, _primarwert, _kritische_trefferchance,
# _tempo, _meisterschaft, _vielseitigkeit) legt die Integration deaktiviert
# an. Erst einschalten: Einstellungen -> Geraete & Dienste -> WoW Charakter
# -> Charakter -> Entitaeten. Sind sie aus, steht dort ein Hinweis.
# Spezialisierung, Set, Sockel und Verzauberungen (_spezialisierung,
# _set_fortschritt, _leere_sockel, _verzauberungen) gibt es ab 0.6.0; ohne
# sie fallen die Zeilen weg, die Spezialisierung kommt dann aus dem
# Level-Sensor. Namen bei deutscher Oberflaeche.
#
# Farben: Nachtblau-Theme-Variablen mit dunklem Rueckfall, Akzent Rose (Bereich
# Freizeit) fuer Icon-Kachel und Balken; aktive Set-Boni Gruen (wie im
# Spiel), fehlende Set-Teile und inaktive Boni Sekundaer, leere Sockel Amber.
# Set-Pille: Status-Farben Gruen (alle Boni) und Amber (Hinweis: weitere Boni
# moeglich), ohne aktiven Bonus Label-Grau ohne Bewertung. Die Zahl der
# verzauberten Plaetze steht ebenfalls als Pille in Label-Grau, ohne
# Bewertung (siehe oben: welche Plaetze verzauberbar sind, ist unbekannt).
# Die Item-Symbole kommen aus wow_platz und behalten dessen feste Farben
# (Qualitaetsrand, Amber-Punkt); Namen und Itemlevel daneben faerbt die Karte
# selbst (variables.textfarbe, variables.unterfarbe), damit sie auch im hellen
# Modus lesbar bleiben.
#
# Voraussetzung: custom:button-card und browser_mod (HACS), die Templates aus
# wow-templates.yaml im Dashboard (fuer die Item-Symbole) und die
# HACS-Integration "WoW Charakter" (philf90/HA-WOW) ab 0.3.0, fuer
# Spezialisierung und Ausruestung ab 0.6.0.
type: custom:button-card
triggers_update: all
show_icon: true
show_name: true
show_label: true
show_state: false
icon: mdi:account-star
name: |
  [[[
    const p = variables.prefix;
    const spec = states[`sensor.${p}_spezialisierung`];
    const lvl = states[`sensor.${p}_level`]?.attributes || {};
    const name = spec && !['unknown', 'unavailable'].includes(spec.state) ? spec.state : lvl.spec;
    return [name, lvl.class].filter(Boolean).join(' ') || 'Charakterwerte';
  ]]]
label: |
  [[[
    const p = variables.prefix;
    const geraet = String(states[`sensor.${p}_level`]?.attributes?.friendly_name || '')
      .replace(/\s*Level$/, '').split(' – ')[0];
    const held = states[`sensor.${p}_spezialisierung`]?.attributes?.hero_talents;
    return [geraet, held].filter(Boolean).join(' · ') || ' ';
  ]]]
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Nur diese Zeile anpassen: Entity-ID ohne Domain und Endung,
  # z. B. sensor.<charakter>_<realm>_level -> <charakter>_<realm>
  prefix: wow_charakter
  farben: |
    [[[
      return {
        akzent: 'var(--nachtblau-rose, #e6a0c4)',
        gruen:  'var(--nachtblau-gruen, #a6d49e)',
        amber:  'var(--nachtblau-amber, #e6b566)',
        text:   'var(--nachtblau-text, #f2f5f8)',
        label:  'var(--nachtblau-label, #b4c0cf)',
        sek:    'var(--nachtblau-text-sekundaer, #8794a5)',
        kachel: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))',
        rand:   'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))',
        spur:   'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))',
      };
    ]]]
  # Karte je Item-Symbol (wie ein Platz im Arsenal); Entitaet und Name des
  # Platzes setzt variables.ausruestung
  platz:
    type: custom:button-card
    template: wow_platz
    variables:
      seite: links
      textfarbe: 'var(--nachtblau-label, #b4c0cf)'
      unterfarbe: 'var(--nachtblau-text-sekundaer, #8794a5)'
  # Daten fuer den Abschnitt Ausruestung (ab Integration 0.6.0); null, wenn
  # keiner der drei Sensoren da ist
  ausruestung: |
    [[[
      const p = variables.prefix, platz = variables.platz;
      const st = (endung) => states[`sensor.${p}_${endung}`];
      if (!st('level')) return null;
      const set = st('set_fortschritt'), sockel = st('leere_sockel'), verz = st('verzauberungen');
      if (!set && !sockel && !verz) return null;
      // Platz der API -> Endung der Ausruestungs-Entitaet (deutsche Oberflaeche,
      // dieselben Endungen wie in wow-arsenal-karte.yaml)
      const endungen = {
        HEAD: 'kopf', NECK: 'hals', SHOULDER: 'schultern', BACK: 'rucken',
        CHEST: 'brust', SHIRT: 'hemd', TABARD: 'wappenrock', WRIST: 'handgelenke',
        HANDS: 'hande', WAIST: 'taille', LEGS: 'beine', FEET: 'fusse',
        FINGER_1: 'finger_1', FINGER_2: 'finger_2', TRINKET_1: 'schmuck_1',
        TRINKET_2: 'schmuck_2', MAIN_HAND: 'waffenhand', OFF_HAND: 'schildhand',
      };
      // Je Platz eine Karte wie im Arsenal; zwei leere Sockel im selben Item
      // zaehlen als ein Platz. Ohne Entitaet bleibt nur der Name.
      const plaetze = (liste) => {
        const gesehen = new Set(), karten = [], ohne = [];
        for (const s of Array.isArray(liste) ? liste : []) {
          if (!s?.slot || gesehen.has(s.slot)) continue;
          gesehen.add(s.slot);
          const name = s.slot_name || s.slot;
          const id = endungen[s.slot] ? `sensor.${p}_ausrustung_${endungen[s.slot]}` : null;
          if (id && states[id]) {
            karten.push({ ...platz, entity: id, variables: { ...platz.variables, text: name } });
          } else {
            ohne.push(name);
          }
        }
        return { karten, ohne };
      };
      return { set, sockel, verz,
        sockelPlaetze: plaetze(sockel?.attributes?.sockets),
        verzPlaetze: plaetze(verz?.attributes?.slots) };
    ]]]
  # Getoente Pille (Flaeche 0,12, Rand 0,24) fuer Zahlen im Abschnitt
  # Ausruestung
  pille: |
    [[[
      return (farbe, text) => `<span style="color:${farbe};background:color-mix(in srgb, ${farbe} 12%, transparent);border:1px solid color-mix(in srgb, ${farbe} 24%, transparent);padding:1px 8px;border-radius:9px;">${text}</span>`;
    ]]]
  # Raster-Karte fuer die Item-Symbole; null, wenn es keine gibt
  raster: |
    [[[
      return (karten) => karten.length
        ? { type: 'grid', columns: 2, square: false, cards: karten }
        : null;
    ]]]
custom_fields:
  body: |
    [[[
      const f = variables.farben, p = variables.prefix;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const st = (endung) => states[`sensor.${p}_${endung}`];
      const zahl = (e) => (!e || isNaN(parseFloat(e.state))) ? null : parseFloat(e.state);
      if (!st('level')) {
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Entitäten unter <span style="color:${f.label};">sensor.${esc(p)}_*</span> gefunden. Integration „WoW Charakter“ einrichten und das Präfix in der Karte anpassen.</div>`;
      }
      const teile = [];
      const abschnitt = (ueberschrift, inhalt) => `
        <div style="background:${f.kachel};border:1px solid ${f.rand};border-radius:14px;padding:10px 12px;display:grid;gap:9px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${f.sek};">${ueberschrift}</div>
          ${inhalt}
        </div>`;

      // Werte: nur, wenn die Sensoren eingeschaltet sind
      const leben = zahl(st('leben')), primaer = st('primarwert');
      const zweit = [
        ['kritische_trefferchance', 'Krit'], ['tempo', 'Tempo'],
        ['meisterschaft', 'Meisterschaft'], ['vielseitigkeit', 'Vielseitigkeit'],
      ].map(([endung, name]) => ({ name, wert: zahl(st(endung)) }));
      if (leben === null && zahl(primaer) === null && zweit.every((z) => z.wert === null)) {
        teile.push(`<div style="font-size:12.5px;line-height:1.4;color:${f.sek};padding:0 2px;">Die Werte-Sensoren sind aus. Einschalten unter Einstellungen → Geräte &amp; Dienste → WoW Charakter → Charakter → Entitäten.</div>`);
      } else {
        const namen = { strength: 'Stärke', agility: 'Beweglichkeit', intellect: 'Intelligenz' };
        const kachel = (wert, titel) => `
          <div style="min-width:0;background:${f.kachel};border:1px solid ${f.rand};border-radius:13px;padding:8px 10px;">
            <div style="font-size:16px;font-weight:750;color:${f.text};font-variant-numeric:tabular-nums;white-space:nowrap;">${wert === null ? '–' : Math.round(wert).toLocaleString('de-DE')}</div>
            <div style="margin-top:2px;font-size:11.5px;color:${f.sek};">${titel}</div>
          </div>`;
        teile.push(`<div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:6px;">
          ${kachel(leben, 'Leben')}${kachel(zahl(primaer), namen[primaer?.attributes?.stat] || 'Primärwert')}
        </div>`);
        const max = Math.max(1, ...zweit.map((z) => z.wert || 0));
        teile.push(abschnitt('Zweitwerte', zweit.map((z) => `
          <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline;">
            <span style="font-size:12.5px;color:${f.label};">${z.name}</span>
            <span style="font-size:13px;font-weight:700;color:${f.text};font-variant-numeric:tabular-nums;">${z.wert === null ? '–' : `${z.wert.toLocaleString('de-DE', { maximumFractionDigits: 1 })}&thinsp;%`}</span>
            <div style="grid-column:1 / -1;height:6px;border-radius:5px;background:${f.spur};overflow:hidden;"><div style="height:100%;width:${z.wert ? Math.max(2, z.wert / max * 100) : 0}%;border-radius:5px;background:${f.akzent};"></div></div>
          </div>`).join('')));
      }

      return `<div style="display:grid;gap:8px;">${teile.join('')}</div>`;
    ]]]
  # Abschnitt Ausruestung: eine Unterkachel ueber fuenf Felder (Kopf mit Set
  # und Zeile "Leere Sockel", Raster, Zeile "Verzauberte Plaetze", Raster,
  # Abschluss). Rand und Hintergrund setzen die Felder selbst (styles unten),
  # damit die Raster-Karten innerhalb der Kachel stehen.
  aus_kopf: |
    [[[
      const a = variables.ausruestung;
      if (!a) return null;
      const f = variables.farben;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const zahl = (e) => (!e || isNaN(parseFloat(e.state))) ? null : parseFloat(e.state);
      const zeile = (titel, wert, farbe = f.text) => `
        <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;">
          <span style="font-size:12.5px;color:${f.label};">${titel}</span>
          <span style="font-size:13px;font-weight:700;color:${farbe};font-variant-numeric:tabular-nums;white-space:nowrap;">${wert}</span>
        </div>`;
      const pille = variables.pille;
      // Zeile mit grauem Zusatz darunter (Plaetze ohne Entitaet, kein Set)
      const mitZusatz = (html, zusatz) => zusatz
        ? `<div style="display:grid;gap:2px;">${html}<div style="font-size:12px;line-height:1.3;color:${f.sek};">${esc(zusatz)}</div></div>`
        : html;
      const teile = [`<div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${f.sek};">Ausrüstung</div>`];
      // Set wie im Item-Tooltip des Arsenals (wow-templates.yaml)
      if (a.set && a.set.attributes?.name) {
        const s = a.set.attributes;
        // Farbe der Pille: alle Boni aktiv gruen, einige Amber, keiner grau;
        // ohne Boni in den Daten nach der Zahl der Teile
        const n = parseFloat(a.set.state) || 0, boni = Array.isArray(s.effects) ? s.effects : [];
        const aktiv = boni.filter((b) => b.active).length;
        const farbe = boni.length
          ? (aktiv === boni.length ? f.gruen : aktiv ? f.amber : f.label)
          : (n >= s.total ? f.gruen : n ? f.amber : f.label);
        const liste = (eintraege, farbe) => eintraege.map((e) =>
          `<div style="font-size:12.5px;line-height:1.35;color:${farbe(e)};">${esc(e.name ?? e.text)}</div>`).join('');
        teile.push(`<div style="display:grid;gap:2px;">
          ${zeile(`<span style="font-weight:650;">${esc(s.name)}</span>`, pille(farbe, `${esc(a.set.state)}/${esc(s.total)}`))}
          ${liste(Array.isArray(s.items) ? s.items : [], (i) => i.equipped ? f.text : f.sek)}
          ${Array.isArray(s.effects) && s.effects.length
            ? `<div style="margin-top:4px;display:grid;gap:4px;">${liste(s.effects, (e) => e.active ? f.gruen : f.sek)}</div>` : ''}
        </div>`);
      } else if (a.set) {
        teile.push(mitZusatz(zeile('Set', '–'), 'kein Set angelegt'));
      }
      if (a.sockel) {
        const n = zahl(a.sockel) || 0;
        teile.push(mitZusatz(n
          ? zeile('Leere Sockel', pille(f.amber, `${n} leer`))
          : zeile('Leere Sockel', 'keine'), a.sockelPlaetze.ohne.join(', ')));
      }
      return `<div style="display:grid;gap:9px;">${teile.join('')}</div>`;
    ]]]
  sockel:
    card: '[[[ return variables.ausruestung ? variables.raster(variables.ausruestung.sockelPlaetze.karten) : null; ]]]'
  aus_verz: |
    [[[
      const a = variables.ausruestung;
      if (!a?.verz) return null;
      const f = variables.farben;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const n = parseFloat(a.verz.state);
      const ohne = a.verzPlaetze.ohne.length
        ? `<div style="font-size:12px;line-height:1.3;color:${f.sek};">${esc(a.verzPlaetze.ohne.join(', '))}</div>` : '';
      return `
        <div style="display:grid;gap:2px;">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;">
            <span style="font-size:12.5px;color:${f.label};">Verzauberte Plätze</span>
            <span style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;">${variables.pille(f.label, isNaN(n) ? '–' : n)}</span>
          </div>
          ${ohne}
        </div>`;
    ]]]
  verz:
    card: '[[[ return variables.ausruestung ? variables.raster(variables.ausruestung.verzPlaetze.karten) : null; ]]]'
  aus_ende: '[[[ return variables.ausruestung ? "" : null; ]]]'
styles:
  card:
    - padding: 14px 16px 16px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n" "i l" "body body" "aus_kopf aus_kopf" "sockel sockel" "aus_verz aus_verz" "verz verz" "aus_ende aus_ende"'
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: min-content min-content auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 16%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - --ha-icon-display: block
    - color: 'var(--nachtblau-rose, #e6a0c4)'
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--nachtblau-text, #f2f5f8)'
  label:
    - justify-self: start
    - align-self: start
    - font-size: 12.5px
    - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
    - margin-top: 1px
  custom_fields:
    body:
      - padding-top: 12px
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
    # Die fuenf Felder der Ausruestung bilden zusammen eine Unterkachel
    aus_kopf:
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
      - box-sizing: border-box
      - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
      - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - border-bottom: none
      - border-radius: 14px 14px 0 0
      - margin-top: 8px
      # unten 2 px, sonst schneidet overflow: hidden den Rand der Pille ab
      - padding: 10px 12px 2px
    sockel: &aus_mitte
      - justify-self: stretch
      - min-width: 0
      - box-sizing: border-box
      - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
      - border-left: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - border-right: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - padding: 8px 12px 0
      # Abstand der Item-Symbole in der Raster-Karte
      - --grid-card-gap: 6px 8px
    aus_verz:
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
      - box-sizing: border-box
      - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
      - border-left: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - border-right: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      # unten 2 px fuer den Rand der Pille (overflow: hidden, siehe aus_kopf)
      - padding: 9px 12px 2px
    verz: *aus_mitte
    aus_ende:
      - justify-self: stretch
      - box-sizing: border-box
      - height: 10px
      - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
      - border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
      - border-top: none
      - border-radius: 0 0 14px 14px
