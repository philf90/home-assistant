# ============================================================================
# WoW – Raid-Fortschritt
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   wow_charakter
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Raid-Fortschritt eines Charakters in der neuesten Erweiterung:
#   Kopf     Erweiterung und hoechste Schwierigkeit mit Kills
#   Je Schwierigkeit (LFR, Normal, Heroisch, Mythisch) eine Unterkachel mit
#            besiegten Bossen gesamt und je Raid als Balken, ab Integration
#            0.8.0 mit dem Bild des Raids davor
#   Fuss     letzter besiegter Boss seit dem Start von Home Assistant
#            (Ereignis "Boss besiegt")
# Schwierigkeiten ohne Bosse in der Antwort (0 von 0) blendet die Karte aus.
# Raidnamen kommen von der API auf Englisch.
#
# Daten: Sensoren _raid_fortschritt_<stufe> (Zustand = besiegte Bosse,
# Attribute expansion, total_bosses, raids, images) und event._boss_besiegt. Die
# Endungen sind die Namen bei deutscher Oberflaeche.
#
# Farben: Owlet-Theme-Variablen mit dunklem Rueckfall, Akzent Rose (Bereich
# Freizeit) fuer Icon-Kachel und Balken; ein voll besiegter Raid bekommt
# Gruen (Zustand "erledigt", DESIGN.md "Status") und den Wert als Text.
#
# Voraussetzung: custom:button-card (HACS) und die HACS-Integration
# "WoW Charakter" (philf90/HA-WOW) ab 0.3.0.
type: custom:button-card
# Keine entity: Die Karte liest alle Sensoren ueber variables.prefix und
# zeichnet bei jeder Zustandsaenderung neu.
triggers_update: all
show_icon: true
show_name: true
show_label: true
show_state: false
icon: mdi:sword-cross
name: |
  [[[
    const x = states[`sensor.${variables.prefix}_raid_fortschritt_lfr`]?.attributes?.expansion;
    return x ? `Raids · ${x}` : 'Raids';
  ]]]
label: |
  [[[
    const p = variables.prefix;
    const geraet = String(states[`sensor.${p}_level`]?.attributes?.friendly_name || '')
      .replace(/\s*Level$/, '').split(' – ')[0];
    const hoechste = variables.stufen.slice().reverse().find(([endung]) =>
      parseFloat(states[`sensor.${p}_raid_fortschritt_${endung}`]?.state) > 0);
    return [geraet, hoechste ? `höchste Stufe: ${hoechste[1]}` : 'noch kein Boss'].filter(Boolean).join(' · ');
  ]]]
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Nur diese Zeile anpassen: Entity-ID ohne Domain und Endung,
  # z. B. sensor.<charakter>_<realm>_level -> <charakter>_<realm>
  prefix: wow_charakter
  stufen:
    - [lfr, LFR]
    - [normal, Normal]
    - [heroisch, Heroisch]
    - [mythisch, Mythisch]
  farben: |
    [[[
      return {
        akzent: 'var(--owlet-rose, #e6a0c4)',
        gruen:  'var(--owlet-gruen, #a6d49e)',
        text:   'var(--owlet-text, #f2f5f8)',
        label:  'var(--owlet-label, #b4c0cf)',
        sek:    'var(--owlet-text-sekundaer, #8794a5)',
        kachel: 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))',
        rand:   'var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))',
        spur:   'var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05))',
      };
    ]]]
custom_fields:
  body: |
    [[[
      const f = variables.farben, p = variables.prefix;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const zweizeilig = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';
      if (!states[`sensor.${p}_raid_fortschritt_lfr`]) {
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Entitäten unter <span style="color:${f.label};">sensor.${esc(p)}_*</span> gefunden. Integration „WoW Charakter“ einrichten und das Präfix in der Karte anpassen.</div>`;
      }
      const balken = (wert, max, farbe) => `<div style="height:6px;border-radius:5px;background:${f.spur};overflow:hidden;"><div style="height:100%;width:${max ? Math.max(0, Math.min(100, wert / max * 100)) : 0}%;border-radius:5px;background:${farbe};"></div></div>`;

      const kacheln = [];
      for (const [endung, anzeige] of variables.stufen) {
        const e = states[`sensor.${p}_raid_fortschritt_${endung}`];
        const gesamt = e?.attributes?.total_bosses;
        if (!e || !gesamt) continue;
        const besiegt = parseFloat(e.state) || 0;
        const bilder = e.attributes.images || {};
        const raids = Object.entries(e.attributes.raids || {}).map(([raid, text]) => {
          const [n, m] = String(text).split('/').map((v) => parseInt(v, 10));
          const fertig = m > 0 && n >= m;
          // Bild des Raids (2:1, ab Integration 0.8.0) links neben Name und Balken
          const bild = bilder[raid];
          return `
            <div style="display:grid;grid-template-columns:${bild ? '52px ' : ''}minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;">
              ${bild ? `<img src="${esc(bild)}" alt="" style="grid-row:1 / span 2;align-self:center;width:52px;height:26px;object-fit:cover;border-radius:6px;border:1px solid ${f.rand};">` : ''}
              <span style="min-width:0;font-size:12.5px;line-height:1.3;color:${f.label};${zweizeilig}">${esc(raid)}</span>
              <span style="font-size:13px;font-weight:700;color:${fertig ? f.gruen : f.text};font-variant-numeric:tabular-nums;">${esc(text)}</span>
              <div style="grid-column:${bild ? '2' : '1'} / -1;">${balken(n, m, fertig ? f.gruen : f.akzent)}</div>
            </div>`;
        }).join('');
        kacheln.push(`
          <div style="background:${f.kachel};border:1px solid ${f.rand};border-radius:14px;padding:10px 12px;display:grid;gap:8px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
              <span style="font-size:13px;font-weight:700;color:${f.text};">${anzeige}</span>
              <span style="font-size:12px;color:${f.sek};white-space:nowrap;"><b style="font-size:15px;font-weight:750;color:${f.text};font-variant-numeric:tabular-nums;">${besiegt}/${gesamt}</b> Bosse</span>
            </div>
            ${raids}
          </div>`);
      }
      if (!kacheln.length) {
        kacheln.push(`<div style="font-size:12.5px;color:${f.sek};">Die API meldet für diese Erweiterung noch keine Raids.</div>`);
      }

      // Letzter Boss: Ereignis-Entitaet, Zustand = Zeitpunkt des Ereignisses
      const ev = states[`event.${p}_boss_besiegt`];
      const d = new Date(ev?.state);
      let fuss = 'Letzter Boss: noch keiner seit dem Start von Home Assistant';
      if (ev && !isNaN(d.getTime()) && ev.attributes?.boss) {
        const a = ev.attributes;
        const wann = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        fuss = `Letzter Boss: ${esc(a.boss)}${a.difficulty ? ` (${esc(a.difficulty)})` : ''} · ${wann}`;
      }
      return `<div style="display:grid;gap:8px;">${kacheln.join('')}<div style="font-size:12px;line-height:1.3;color:${f.sek};padding:0 2px;${zweizeilig}">${fuss}</div></div>`;
    ]]]
styles:
  card:
    - padding: 14px 16px 14px
    - border-radius: 22px
    - border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n" "i l" "body body"'
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: min-content min-content auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--owlet-rose, #e6a0c4) 16%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--owlet-rose, #e6a0c4) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - --ha-icon-display: block
    - color: 'var(--owlet-rose, #e6a0c4)'
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--owlet-text, #f2f5f8)'
  label:
    - justify-self: start
    - align-self: start
    - font-size: 12.5px
    - color: 'var(--owlet-text-sekundaer, #8794a5)'
    - margin-top: 1px
  custom_fields:
    body:
      - padding-top: 12px
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - white-space: normal
