# ============================================================================
# WoW – Charakterliste
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Alle Charaktere der Integration "WoW Charakter" auf einen Blick, je
# Charakter eine Zeile:
#   Avatar, Name, Itemlevel
#   Stufe · Spezialisierung Klasse · Realm, Mythic+-Wertung
#   Letzter Login als "vor 3 Tagen"
# Sortiert nach Stufe, dann Itemlevel. Ohne Avatar bleibt der Platzhalter.
#
# Charaktere: Die Karte sucht selbst alle Sensoren sensor.<praefix>_level mit
# den Attributen class, race und realm (so legt die Integration den
# Level-Sensor an). Wer nur bestimmte zeigen will, traegt die Praefixe in
# variables.charaktere ein (Entity-ID ohne Domain und Endung _level).
# Die Endungen (_itemlevel, _mythic_wertung, _letzter_login) sind die Namen
# bei deutscher Oberflaeche; mit englischer Oberflaeche heissen sie anders.
#
# Mythic+: Wert der aktuellen Season, sonst das Attribut api_rating (der Wert
# im Arsenal), wie in wow-arsenal-karte.yaml.
#
# Farben: Nachtblau-Theme-Variablen mit dunklem Rueckfall, also heller und
# dunkler Modus. Akzent Rose (Bereich Freizeit, DESIGN.md "Akzente und
# Bereiche"). Kleine Schrift in nachtblau-text-sekundaer.
#
# Voraussetzung: custom:button-card (HACS) und die HACS-Integration
# "WoW Charakter" (philf90/HA-WOW) ab 0.3.0.
type: custom:button-card
# Die Zeilen lesen beliebige Sensoren; bei jeder Zustandsaenderung neu zeichnen.
triggers_update: all
show_icon: true
show_name: true
show_label: true
show_state: false
icon: mdi:account-group
name: Charaktere
label: |
  [[[
    const n = variables.liste.length;
    return n === 1 ? '1 Charakter' : `${n} Charaktere`;
  ]]]
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
variables:
  # Leer: alle Charaktere der Integration. Sonst Praefixe, z. B.
  # [name_realm, zweitname_realm]
  charaktere: []
  farben: |
    [[[
      return {
        akzent: 'var(--nachtblau-rose, #e6a0c4)',
        text:   'var(--nachtblau-text, #f2f5f8)',
        titel:  'var(--nachtblau-titel, #e7ecf3)',
        label:  'var(--nachtblau-label, #b4c0cf)',
        sek:    'var(--nachtblau-text-sekundaer, #8794a5)',
        kachel: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))',
        rand:   'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))',
        spur:   'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))',
      };
    ]]]
  # Praefixe der Charaktere, sortiert nach Stufe und Itemlevel
  liste: |
    [[[
      const zahl = (id) => {
        const v = parseFloat(states[id]?.state);
        return isNaN(v) ? -1 : v;
      };
      let praefixe = variables.charaktere || [];
      if (!praefixe.length) {
        praefixe = Object.keys(states)
          .filter((id) => /^sensor\..+_level$/.test(id))
          .filter((id) => {
            const a = states[id].attributes || {};
            return 'class' in a && 'race' in a && 'realm' in a;
          })
          .map((id) => id.slice('sensor.'.length, -'_level'.length));
      }
      return praefixe.slice().sort((a, b) =>
        (zahl(`sensor.${b}_level`) - zahl(`sensor.${a}_level`))
        || (zahl(`sensor.${b}_itemlevel`) - zahl(`sensor.${a}_itemlevel`)));
    ]]]
custom_fields:
  body: |
    [[[
      const f = variables.farben;
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const leer = (e) => !e || ['unavailable', 'unknown', ''].includes(e.state);
      const zahl = (e) => (leer(e) || isNaN(parseFloat(e.state))) ? null : parseFloat(e.state);
      const zweizeilig = 'overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;';

      if (!variables.liste.length) {
        return `<div style="font-size:12.5px;line-height:1.4;color:${f.sek};">Keine Charaktere gefunden. Integration „WoW Charakter“ einrichten oder variables.charaktere füllen.</div>`;
      }
      // "vor 3 Tagen" aus einem Zeitstempel
      const vor = (iso) => {
        const d = new Date(iso);
        if (!iso || isNaN(d.getTime())) return null;
        const min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
        if (min < 60) return `vor ${min} min`;
        const h = Math.round(min / 60);
        if (h < 24) return `vor ${h} h`;
        const t = Math.round(h / 24);
        return t === 1 ? 'vor 1 Tag' : `vor ${t.toLocaleString('de-DE')} Tagen`;
      };

      const zeilen = variables.liste.map((p) => {
        const lvl = states[`sensor.${p}_level`];
        const a = lvl?.attributes || {};
        const name = String(a.friendly_name || p).replace(/\s*Level$/, '').split(' – ')[0];
        const avatar = states[`image.${p}_avatar`]?.attributes?.entity_picture;
        const ilvl = zahl(states[`sensor.${p}_itemlevel`]);
        const mplus = states[`sensor.${p}_mythic_wertung`];
        let wertung = zahl(mplus);
        if (wertung === null) wertung = mplus?.attributes?.api_rating ?? null;
        const login = vor(states[`sensor.${p}_letzter_login`]?.state);
        const info = [
          leer(lvl) ? null : `Stufe ${lvl.state}`,
          [a.spec, a.class].filter(Boolean).join(' '),
          a.realm,
        ].filter(Boolean).map(esc).join(' · ');
        return `
          <div style="background:${f.kachel};border:1px solid ${f.rand};border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;align-items:center;">
            <div style="grid-row:1 / span 3;width:40px;height:40px;border-radius:12px;overflow:hidden;background:${f.spur};border:1px solid ${f.rand};">
              ${avatar ? `<img src="${avatar}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;">` : ''}
            </div>
            <div style="min-width:0;font-size:14.5px;font-weight:700;color:${f.titel};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(name)}</div>
            <div style="justify-self:end;font-size:13px;color:${f.sek};white-space:nowrap;"><b style="font-size:14.5px;font-weight:750;color:${f.text};font-variant-numeric:tabular-nums;">${ilvl === null ? '–' : Math.round(ilvl)}</b> ilvl</div>
            <div style="min-width:0;font-size:12px;line-height:1.3;color:${f.sek};${zweizeilig}">${info}</div>
            <div style="justify-self:end;align-self:start;font-size:12px;color:${f.sek};white-space:nowrap;">M+ <b style="color:${f.label};font-weight:700;font-variant-numeric:tabular-nums;">${wertung === null ? '–' : Math.round(wertung)}</b></div>
            <div style="grid-column:2 / -1;font-size:12px;color:${f.sek};">${login ? `Login ${login}` : 'Login unbekannt'}</div>
          </div>`;
      });
      return `<div style="display:grid;gap:8px;">${zeilen.join('')}</div>`;
    ]]]
styles:
  card:
    - padding: 14px 16px 16px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
    - cursor: default
  grid:
    - grid-template-areas: '"i n" "i l" "body body"'
    - grid-template-columns: min-content minmax(0, 1fr)
    - grid-template-rows: min-content min-content auto
  img_cell:
    - width: 44px
    - height: 44px
    - border-radius: 13px
    - margin-right: 14px
    - align-self: center
    - background: 'color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 16%, transparent)'
    - border: '1px solid color-mix(in srgb, var(--nachtblau-rose, #e6a0c4) 24%, transparent)'
  icon:
    - width: 23px
    - height: 23px
    - --ha-icon-display: block
    - color: 'var(--nachtblau-rose, #e6a0c4)'
  name:
    - justify-self: start
    - align-self: end
    - font-size: 17px
    - font-weight: 700
    - letter-spacing: -0.02em
    - color: 'var(--nachtblau-text, #f2f5f8)'
  label:
    - justify-self: start
    - align-self: start
    - font-size: 12.5px
    - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
    - margin-top: 1px
  custom_fields:
    body:
      - padding-top: 12px
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      # button-card setzt an custom_fields white-space: nowrap (Klasse
      # ellipsis); die Infozeile soll zweizeilig umbrechen
      - white-space: normal
