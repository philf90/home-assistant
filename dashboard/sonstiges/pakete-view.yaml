# ============================================================================
# Pakete – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                pakete_liste (pakete-templates.yaml),
#                pakete_uebersicht (pakete-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   keine
# ============================================================================
# Pakete-View im Nachtblau-Stil. Alle Inhalte kommen aus der Bibliothek in
# pakete-templates.yaml (Entitaeten dort im Block KONFIGURATION).
#
#   Sendungen     Zahlen Heute, Unterwegs, Abholbereit, Zugestellt; Pakete
#                 mit Problem; "Paket vor der Tuer"; Knopf "+ Sendung"
#   Heute         in Zustellung oder Zeitfenster heute
#   Abholbereit   am PaketShop, an der Packstation oder Filiale
#   Unterwegs     alle uebrigen aktiven, nach geplanter Lieferung
#   Zugestellt    kuerzlich zugestellt (Fenster je Integration einstellbar)
#
# Jedes Paket klappt per Tipp auf: Nummer, Verlauf (mit Option
# "Parcel history" der jeweiligen Integration), "Beim Dienst oeffnen",
# "Nummer kopieren" und bei GLS und UPS "Nicht mehr verfolgen".
#
# Passt zur Route /dashboard-home/pakete (Eintrag im "More"-Menue von
# navbar-karte.yaml / navigation-templates.yaml, Bereich "Zuhause").
# Skript und Meldungen: pakete-konfig.yaml.
#
# Voraussetzung: custom:button-card (v7) + custom:decluttering-card +
#                browser_mod (HACS), Templates aus pakete-templates.yaml und
#                navigation-templates.yaml.
title: Pakete
path: pakete
icon: mdi:package-variant-closed
type: sections
max_columns: 2
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation

  - type: custom:button-card
    template: pakete_uebersicht

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: heute }

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: abholbereit }

- type: grid
  cards:
  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: unterwegs }

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: zugestellt }

  - type: custom:decluttering-card
    template: floating_navbar
