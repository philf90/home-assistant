# ============================================================================
# Pakete – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       sonstiges
# Status:        aktiv
# Karten:        button-card, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                pakete_liste (pakete-templates.yaml),
#                pakete_meldungen (pakete-templates.yaml),
#                pakete_uebersicht (pakete-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   keine
# ============================================================================
# Pakete-View im Nachtblau-Stil. Alle Inhalte kommen aus der Bibliothek in
# pakete-templates.yaml (Entitaeten dort im Block KONFIGURATION).
#
#   Sendungen     Zahlen Heute, Unterwegs, Abholbereit, Zugestellt; Pakete
#                 mit Problem; "Paket vor der Tuer"; Knopf "+ Sendung"
#   Heute         in Zustellung oder Zeitfenster heute
#   Abholbereit   am PaketShop, an der Packstation oder Filiale
#   Unterwegs     alle uebrigen aktiven, nach geplanter Lieferung
#   Zugestellt    kuerzlich zugestellt (Fenster je Integration einstellbar),
#                 auch Ruecksendungen, die wieder beim Absender sind
#   Versendet     Sendungen, die du verschickt hast (bei DHL aus dem Konto,
#                 ohne Nummer einzutragen), mit dem Text des Dienstes; nur
#                 sichtbar, solange eine aktiv oder kuerzlich zugestellt ist
#   Meldungen     Schalter je Push-Meldung (wie in der Sicherheit-View)
#
# Jede Paketzeile zeigt das Logo des Dienstes, daneben oben den Dienst mit
# Inhalt (oder Absender, falls kein Inhalt bekannt), darunter die ganze
# Sendungsnummer, dann Zeitpunkt ("heute ab 10:00 Uhr"), Stopps oder
# Abholort, bei Sendungen an eine Abholstelle vorn "zur Abholstelle". Per
# Tipp klappt sie auf: Inhalt, Absender und Abholstelle ganz, bei
# Amazon-Zustellungen das Zustellfoto, Verlauf (mit Option "Parcel history"
# der jeweiligen Integration), "Beim Dienst oeffnen", "Nummer kopieren" und
# bei GLS und UPS "Nicht mehr verfolgen". Das Formular "+ Sendung" nimmt
# optional einen Inhalt.
#
# Passt zur Route /dashboard-home/pakete (Eintrag im "More"-Menue von
# navbar-karte.yaml / navigation-templates.yaml, Bereich "Zuhause").
# Skript und Meldungen: pakete-konfig.yaml.
#
# Voraussetzung: custom:button-card (v7) + custom:decluttering-card +
#                browser_mod (Marketplace), Templates aus pakete-templates.yaml und
#                navigation-templates.yaml.
title: Pakete
path: pakete
icon: mdi:package-variant-closed
type: sections
max_columns: 2
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation

  - type: custom:button-card
    template: pakete_uebersicht

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: heute }

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: abholbereit }

- type: grid
  cards:
  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: unterwegs }

  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: zugestellt }

  # Nur mit verschickten Sendungen; zugestellte bleiben so lange, wie die
  # Integration sie im Sensor fuehrt (DHL: Option "Delivered parcels")
  - type: custom:button-card
    template: pakete_liste
    variables: { gruppe: versendet }
    visibility:
    - condition: or
      conditions:
      - condition: numeric_state
        entity: sensor.parcel_aggregator_outgoing_parcels
        above: 0
      - condition: numeric_state
        entity: sensor.parcel_aggregator_outgoing_delivered_parcels
        above: 0

  - type: custom:button-card
    template: pakete_meldungen

  - type: custom:decluttering-card
    template: floating_navbar
