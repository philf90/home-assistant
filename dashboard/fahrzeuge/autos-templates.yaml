# ============================================================================
# Auto-Animation – button-card-Template nachtblau_auto_fx
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       fahrzeuge
# Status:        aktiv
# Karten:        keine
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   keine
# ============================================================================
# Genutzt von autos-karte-v4.yaml (Auto-View). Entwurf, Datenlage und
# Kontrastrechnung: autos-animation.html.
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> den Eintrag "nachtblau_auto_fx"
#   unter "button_card_templates:" auf oberster Ebene ergaenzen (neben
#   "views:"; den Block gibt es schon, wenn die Wetter-, Hausgeraete-,
#   Heizungs- oder Fussball-Templates drin sind).
#
# Was das Template liefert:
#   variables.au      Bibliothek, einmal pro Seite in window.__nachtblauAu.
#                     VERSION bei jeder Aenderung erhoehen, sonst behaelt eine
#                     offene Seite nach einem Dashboard-Update das alte Objekt.
#   au.kachel(...)    HTML der Icon-Kachel fuer das Feld "tile" der
#                     Kennzahl-Kacheln: Zustandsfarbe, beim Tank die Fuellung
#                     mit Welle, bei Handlungsbedarf der Hinweis-Puls.
#   au.melder(...)    Zweiquellige on/off-Melder fuer Status-Chips und
#                     Sicherheitsleiste (variables.quellen).
#   extra_styles      Keyframes und Klassen ".au-*", Ringe am #img-cell fuer
#                     die Sicherheitsleiste, Drehung fuer "Daten aktualisieren".
#
# Die Karte setzt dazu je nach Einsatz:
#   Kennzahl-Kachel  variables.fx (tank | adblue | wartung), variables.fx_icon,
#                    variables.accent (Farbe im Normalzustand),
#                    show_icon: false und die Grid-Flaeche "tile" statt "i".
#                    tank:    entity = Reichweite (km), variables.level_id
#                    adblue:  entity = AdBlue-Reichweite (km)
#                    wartung: entity = km bis faellig, variables.days_id
#                             (Tage bis faellig), date_id, due_prefix
#                    Zweitquelle: variables.ids (Reichweite bzw. km bis
#                    faellig; die erste Entitaet mit einer Zahl gewinnt,
#                    ohne ids zaehlt die Kartenentitaet), level_ids,
#                    days_ids, date_ids nach derselben Regel statt level_id,
#                    days_id, date_id. Entitaeten in neg_ids zaehlen
#                    rueckwaerts (das EU-Data-Act-Portal meldet -27600 km
#                    bis zur Inspektion), ihr Vorzeichen wird gedreht.
#                    Fehlen die Tage bis faellig, rechnet wartung sie aus
#                    dem Faelligkeitsdatum.
#                    Fuellhoehe als CSS-Variable --au-lvl auf styles.card:
#                    so bleibt das Element beim Wertwechsel bestehen und die
#                    Hoehe gleitet (gleiches Vorgehen wie --wx-dir in
#                    nachtblau_wetter_fx).
#   Sicherheitsleiste  --au-ring (block | none) auf styles.img_cell.
#   Leiste und Chips variables.quellen: Liste von Entitaetslisten, vag_connect
#                    zuerst, dann Portal. au.melder nimmt die erste Quelle, in
#                    der mindestens ein Melder auf on/off steht, und liefert
#                    an (Indizes mit 'on'), bekannt (Melder auf on/off), ids
#                    (gewaehlte Liste), q (Index der Quelle) und luecke (ein
#                    Melder fehlt oder keine Quelle brauchbar). Die Leiste
#                    traegt dazu variables.namen je Quelle in gleicher Folge.
#   Aktualisieren    variables.upd_id (Zeitstempel des letzten Abrufs); die
#                    Karte liest sensor.time, damit die Drehung spaetestens
#                    nach 3 min endet.
#
# Zustaende und Schwellen (Variablen, hier die Vorgaben):
#   Tank     100 % gilt nur bei Reichweite >= tank_voll_ab_km (700). In
#            10 Tagen meldete die Integration 9x fuer 12-30 min 100 %, ohne
#            dass die Reichweite stieg (hoechstens 640 km); beim echten
#            Tanken am 05.10.2026 stiegen beide in derselben Stunde
#            (48 -> 100 %, 380 -> 820 km). Unplausibel: Kachel grau,
#            gestrichelt, "Tank: –". Grenze beruht auf einem Tankvorgang,
#            nach weiteren nachpruefen.
#            Reichweite < tank_koralle_km (150): Koralle, "bald tanken", Puls
#            Reichweite < tank_rot_km (75):      Rot, "Reserve", Puls
#   AdBlue   <= adblue_hinweis_km (2400): Amber, "nachfuellen", Puls
#            <= adblue_rot_km (1000):     Rot, "dringend nachfuellen", Puls
#            2400 km ist die erste VW-Warnstufe laut Haendlerseite, nicht aus
#            der Betriebsanleitung belegt.
#   Wartung  <= wartung_tage (30) oder <= wartung_km (1000): Amber,
#            "in n Tagen" bzw. "bald faellig", Puls; <= 0: Rot, "ueberfaellig"
#
# Bewegung:
#   Tankwelle  6 s pro Durchlauf, dauerhaft, solange ein plausibler Wert da
#              ist (variables.welle: false schaltet sie ab, die Fuellung
#              gleitet dann nur beim Wertwechsel).
#   Puls       zwei Ringe aus der Icon-Kachel wie bei der Bewaesserung im
#              Garten, dreimal, danach ruhender Schein (0,18). Laeuft neu,
#              wenn der Zustand neu eintritt oder die View geoeffnet wird.
#   Schloss    dieselben Ringe am Schloss-Symbol, nur bei "on" (nicht
#              verriegelt). unknown/unavailable loesen nichts aus: in 10 Tagen
#              42x unknown und 7x unavailable gegenueber 17x on.
#   Abruf      Symbol dreht sich, solange der Tastendruck neuer ist als der
#              letzte Abruf und hoechstens 3 min alt; danach bis zum naechsten
#              Minutenwechsel ein gruener Haken. Ob ein Tastendruck sofort
#              abruft, ist nicht geprueft; die Drehung endet mit dem naechsten
#              Abruf (Intervall 10 min), nicht zwingend mit neuen Daten.
#
# Wie bei nachtblau_geraete_fx liefert die Bibliothek fuer denselben Zustand
# immer denselben HTML-Text. Aendert sich nur der Wert, bleibt die Kachel
# dasselbe Element: Welle und Puls laufen weiter, die Fuellung gleitet.
#
# Lesbarkeit: Das Tank-Symbol liegt ab 24 % Fuellung auf der Fuellung
# (Stufe 0,24). Amber haelt dort 3,50:1, Koralle 3,13:1 (WCAG 1.4.11, 3:1);
# Rot (2,89:1) erscheint nur unter 75 km, bei heute 7,9 km pro Prozent also
# um 9 % Fuellung, unter dem Symbol. Die Ringe wachsen 11,5 px pro Seite,
# der Abstand zum Text betraegt 13 px; nichts bewegt sich hinter Schrift.
#
# Heller Modus: Farben ueber die nachtblau-Variablen, Toenungen per color-mix
# mit denselben Stufen. Das Tank-Symbol haelt auf der Fuellung hell in jeder
# Zustandsfarbe mindestens 3,13:1 (Rot jetzt auch, dunkel 2,89:1). Die
# Schloss-Ringe (Amber 0,5, Stufe "Leuchten") heben sich hell nur mit
# 2,11:1 vom Grund ab (dunkel 3,04:1); sie sind Zusatzsignal, das Schloss
# steht immer auch als Text und Icon in Amber da.
#
# Farben nur aus design/palette.yaml. "Bewegung reduzieren" am Geraet zeigt
# ein Standbild derselben Zustaende.
#
# Voraussetzung: custom:button-card (HACS, getestet wird mit v7.0.1).
# ============================================================================
button_card_templates:
  nachtblau_auto_fx:
    variables:
      fx: ''
      fx_icon: mdi:car
      accent: 'var(--nachtblau-blau, #7fb3d5)'
      welle: true
      tank_voll_ab_km: 700
      tank_koralle_km: 150
      tank_rot_km: 75
      adblue_hinweis_km: 2400
      adblue_rot_km: 1000
      wartung_tage: 30
      wartung_km: 1000
      au: |
        [[[
          const VERSION = 4, alt = window.__nachtblauAu;
          if (alt && alt.version === VERSION) return alt;

          const zahl = (s) => {
            if (!s || s.state === undefined || s.state === null) return null;
            const n = parseFloat(s.state);
            return isNaN(n) ? null : n;
          };
          // Zweitquelle: erste Entitaet aus ids mit einer Zahl gewinnt, ohne
          // ids die Kartenentitaet e. Entitaeten in v.neg_ids zaehlen
          // rueckwaerts (Portal: -27600 km bis Inspektion), ihr Vorzeichen
          // wird gedreht.
          const wert = (st, v, ids, e) => {
            if (!ids || !ids.length) return zahl(e);
            for (const id of ids) {
              const n = zahl(st[id]);
              if (n !== null) return (v.neg_ids || []).includes(id) ? -n : n;
            }
            return null;
          };
          // Erste Entitaet aus ids mit brauchbarem Zustand (Datum)
          const erste = (st, ids) => {
            for (const id of ids || []) {
              const s = st[id];
              if (s && s.state && s.state !== 'unknown' && s.state !== 'unavailable') return s;
            }
            return null;
          };
          // Tage bis zum Datum einer Entitaet, wenn keine Entitaet sie liefert
          const tageBis = (s) => {
            const t = s ? Date.parse(s.state) : NaN;
            return isNaN(t) ? null : Math.round((t - Date.now()) / 86400000);
          };
          // ---------- Status-Chips und Sicherheitsleiste ----------
          // v.quellen = Liste von Entitaetslisten (vag_connect zuerst, dann
          // Portal); die erste Liste mit einem Melder auf on/off gewinnt.
          const melder = (st, v) => {
            for (const ids of v.quellen || []) {
              const an = []; let bekannt = 0;
              ids.forEach((id, i) => {
                const s = st[id]; if (!s) return;
                if (s.state === 'on') { an.push(i); bekannt++; } else if (s.state === 'off') bekannt++;
              });
              if (bekannt) return { an, bekannt, ids, q: v.quellen.indexOf(ids), luecke: bekannt < ids.length };
            }
            return { an: [], bekannt: 0, ids: [], q: -1, luecke: true };
          };
          const ROT = 'var(--nachtblau-rot, #f0736a)', KORALLE = 'var(--nachtblau-koralle, #e7936e)', AMBER = 'var(--nachtblau-amber, #e6b566)', GRAU = 'var(--nachtblau-muted, #6e7988)';

          // ---------- Zustand einer Kennzahl-Kachel ----------
          // e = Entitaet der Kachel, st = states, v = variables. Die
          // Bibliothek liest states nie selbst, weil sie einmal pro Seite
          // entsteht und sonst alte Werte saehe.
          const lage = (st, v, e) => {
            const ok = { z: 'ok', acc: v.accent, txt: '', puls: false, lvl: 0 };
            if (v.fx === 'tank') {
              const pct = wert(st, v, v.level_ids || [v.level_id]), km = wert(st, v, v.ids, e);
              if (pct === null) return { z: 'leer', acc: GRAU, txt: '', puls: false, lvl: 0 };
              // Artefakt: 100 % ohne passende Reichweite
              if (pct >= 100 && (km === null || km < v.tank_voll_ab_km)) return { z: 'unplausibel', acc: GRAU, txt: '', puls: false, lvl: 0 };
              const lvl = Math.max(0, Math.min(100, pct));
              if (km !== null && km < v.tank_rot_km) return { z: 'reserve', acc: ROT, txt: 'Reserve', puls: true, lvl, pct };
              if (km !== null && km < v.tank_koralle_km) return { z: 'knapp', acc: KORALLE, txt: 'bald tanken', puls: true, lvl, pct };
              return { ...ok, lvl, pct };
            }
            if (v.fx === 'adblue') {
              const km = wert(st, v, v.ids, e);
              if (km === null) return ok;
              if (km <= v.adblue_rot_km) return { z: 'kritisch', acc: ROT, txt: 'dringend nachfüllen', puls: true, lvl: 0 };
              if (km <= v.adblue_hinweis_km) return { z: 'hinweis', acc: AMBER, txt: 'nachfüllen', puls: true, lvl: 0 };
              return ok;
            }
            if (v.fx === 'wartung') {
              const km = wert(st, v, v.ids, e);
              let tage = wert(st, v, v.days_ids || [v.days_id]);
              if (tage === null) tage = tageBis(erste(st, v.date_ids || [v.date_id]));
              if ((tage !== null && tage <= 0) || (km !== null && km <= 0)) return { z: 'ueberfaellig', acc: ROT, txt: '', puls: true, lvl: 0, tage };
              if ((tage !== null && tage <= v.wartung_tage) || (km !== null && km <= v.wartung_km)) return { z: 'faellig', acc: AMBER, txt: '', puls: true, lvl: 0, tage };
              return { ...ok, tage };
            }
            return ok;
          };

          // ---------- Name unter dem Wert ----------
          const datum = (s) => {
            if (!s || !s.state || s.state === 'unknown' || s.state === 'unavailable') return '–';
            const dt = new Date(s.state);
            if (isNaN(dt.getTime())) return s.state;
            const p = (n) => String(n).padStart(2, '0');
            return `${p(dt.getDate())}.${p(dt.getMonth() + 1)}.${dt.getFullYear()}`;
          };
          const name = (l, st, v) => {
            if (v.fx === 'tank') {
              if (l.z === 'leer' || l.z === 'unplausibel') return 'Tank: –';
              return 'Tank: ' + l.pct + ' %' + (l.txt ? ' · ' + l.txt : '');
            }
            if (v.fx === 'adblue') return 'AdBlue' + (l.txt ? ' · ' + l.txt : '');
            const pre = v.due_prefix || '';
            if (l.z === 'ueberfaellig') return pre + 'überfällig';
            if (l.z === 'faellig') {
              if (l.tage !== null && l.tage <= v.wartung_tage) return pre + 'in ' + Math.round(l.tage) + (Math.round(l.tage) === 1 ? ' Tag' : ' Tagen');
              return pre + 'bald fällig';
            }
            return pre + datum(erste(st, v.date_ids || [v.date_id]));
          };

          // ---------- Icon-Kachel ----------
          // Fuellhoehe steckt NICHT im HTML (sondern in --au-lvl), damit der
          // Text bei gleichem Zustand gleich bleibt.
          const WELLE = '<svg class="au-welle" viewBox="0 0 84 5" preserveAspectRatio="none"><path d="M0 2.5 Q10.5 0 21 2.5 T42 2.5 T63 2.5 T84 2.5 V5 H0 Z"/></svg>';
          const kachel = (l, v) => {
            const a = l.acc;
            const cls = 'au-k' + (l.puls ? ' au-puls' : '') + (l.z === 'unplausibel' ? ' au-strich' : '');
            const fuell = v.fx === 'tank' && l.z !== 'leer' && l.z !== 'unplausibel'
              ? `<div class="au-tank${v.welle === false ? ' au-ruhig' : ''}"><i class="au-fill"></i>${WELLE}</div>` : '';
            return `<div class="${cls}" style="--acc:${a};--acc16:color-mix(in srgb, ${a} 16%, transparent);--acc24:color-mix(in srgb, ${a} 24%, transparent);--acc2e:color-mix(in srgb, ${a} 18%, transparent);--acc80:color-mix(in srgb, ${a} 50%, transparent)">${fuell}<ha-icon icon="${v.fx_icon}"></ha-icon></div>`;
          };

          // ---------- Daten aktualisieren ----------
          // e = button-Entitaet (Zustand = Zeitpunkt des letzten Drucks)
          const abruf = (st, v, e) => {
            const b = e ? Date.parse(e.state) : NaN;
            const u = st[v.upd_id] ? Date.parse(st[v.upd_id].state) : NaN;
            const jetzt = Date.now();
            if (isNaN(b)) return 'ruhe';
            if ((isNaN(u) || b > u) && jetzt - b < 180000) return 'laeuft';
            if (!isNaN(u) && u >= b && u - b < 180000 && jetzt - u < 60000) return 'fertig';
            return 'ruhe';
          };

          const lib = { version: VERSION, lage, name, kachel, abruf, melder };
          window.__nachtblauAu = lib;
          return lib;
        ]]]
    # Kein custom_fields hier: Sicherheitsleiste und Aktualisieren-Knopf nutzen
    # das Template auch, haben aber keine Grid-Flaeche "tile". Die Kacheln
    # setzen das Feld selbst (Anker &tile_fx in autos-karte-v4.yaml).
    extra_styles: |
      /* Icon-Kachel: Grund 0,16, Rand 0,24 der Zustandsfarbe */
      .au-k { position: relative; width: 42px; height: 42px; box-sizing: border-box; border-radius: 12px; display: grid; place-items: center; background: var(--acc16); border: 1px solid var(--acc24); }
      .au-k ha-icon { position: relative; z-index: 1; --mdc-icon-size: 22px; width: 22px; height: 22px; color: var(--acc); }
      .au-k.au-strich { border-style: dashed; }

      /* Tank: Fuellung von unten, Hoehe aus --au-lvl (0-100) */
      .au-tank { position: absolute; inset: 0; border-radius: 11px; overflow: hidden; pointer-events: none; }
      .au-fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--au-lvl, 0) * 1%); background: var(--acc24); transition: height 1.2s cubic-bezier(0.3, 0.7, 0.3, 1); }
      .au-welle { position: absolute; left: 0; width: 84px; height: 5px; bottom: calc(var(--au-lvl, 0) * 1% - 1px); transition: bottom 1.2s cubic-bezier(0.3, 0.7, 0.3, 1); animation: au-welle 6s linear infinite; will-change: transform; }
      .au-welle path { fill: var(--acc24); }
      .au-ruhig .au-welle { animation: none; }
      @keyframes au-welle { from { transform: translateX(0); } to { transform: translateX(-42px); } }

      /* Hinweis-Puls: zwei Ringe, dreimal, danach ruhender Schein */
      .au-k.au-puls { box-shadow: 0 0 0 3px var(--acc2e); }
      .au-k.au-puls::before, .au-k.au-puls::after { content: ""; position: absolute; inset: -1px; border-radius: 12px; border: 1px solid var(--acc80); opacity: 0; pointer-events: none; animation: au-ring 2.6s ease-out 3; }
      .au-k.au-puls::after { animation-delay: 1.3s; }
      @keyframes au-ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.55); opacity: 0; } }

      /* Sicherheitsleiste: Ringe am Schloss, eingeschaltet ueber --au-ring */
      #img-cell::before, #img-cell::after { content: ""; position: absolute; inset: -1px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 50%, transparent); opacity: 0; pointer-events: none; display: var(--au-ring, none); animation: au-ring 2.6s ease-out 3; }
      #img-cell::after { animation-delay: 1.3s; }

      /* Daten aktualisieren */
      @keyframes au-dreh { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .au-welle, .au-k::before, .au-k::after, #img-cell, #img-cell::before, #img-cell::after, #icon { animation: none !important; }
        .au-fill, .au-welle { transition: none !important; }
        #img-cell::before { opacity: 0.6; transform: scale(1.2); }
        .au-k.au-puls::before { opacity: 0.6; transform: scale(1.2); }
      }
