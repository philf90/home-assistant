# ============================================================================
# Fahrzeiten – Waze-Fahrzeit je angemeldeter Person, Routen-Popup
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       fahrzeuge
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor,
#                oberste Ebene unter button_card_templates:
# Platzhalter:   DEIN_EMBED_KEY
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Zwei button-card-Templates fuer fahrzeiten-karte.yaml:
#
#   nachtblau_fahrzeiten        Die ganze Karte: Kopf, Start-Chips, eine Zeile je
#                           Ziel. Rechnet im Browser fuer die angemeldete
#                           Person. Enthaelt die Bibliothek window.__nachtblauFz.
#   nachtblau_fahrzeit_popup    Inhalt des Popups: Kennzahlen, Routenkarte
#                           (Google Maps Embed API), Alternativrouten, Links
#                           zu Google Maps und Waze. Mit variables.eingabe
#                           (Person) stattdessen das Eingabefeld fuer eine
#                           freie Adresse.
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> beide Eintraege unter
#   "button_card_templates:" auf oberster Ebene ergaenzen.
#
# Person: die Person aus variables.personen, deren Attribut user_id dem
# angemeldeten Benutzer gleicht (button-card: user.id). Nur die gelisteten
# Personen werden gelesen; ein Durchsuchen aller Zustaende liesse die Karte
# bei jeder Aenderung im System neu zeichnen (button-card v7 merkt sich
# gelesene Zustaende). Ihr Standort sind die Attribute latitude/longitude
# der Person (Quelle ist ihr aktueller Tracker, attribute source).
#
# Startpunkt je Geraet: Die Wahl (variables.starts, Feld id) steht in
# localStorage unter "nachtblauFahrtStart:<person>"; ohne localStorage nur bis
# zum Neuladen. Tatsaechlicher Start:
#   gewaehlter Start, wenn er gerade sichtbar ist (Standort: wenn die Person
#   Koordinaten hat); sonst unterwegs mit Koordinaten der Standort; sonst
#   der Start mit zone.home.
# Sichtbar: Feld sichtbar "daheim" / "unterwegs" (Person home oder nicht),
# Feld personen beschraenkt Start oder Ziel auf diese Personen.
# Ziele: ausgeblendet, wenn die Zone der Start ist oder die Person in der Zone
# ist (Attribut in_zones; zone.home auch bei Zustand home). Ein Ort ist so
# nie Start und Ziel zugleich.
#
# Freie Adresse: Die Zeile "Andere Adresse …" steht fuer jede Person unter
# den Zielen und oeffnet ein Popup mit Eingabefeld. Die Adresse steht danach
# in localStorage unter "nachtblauFahrtZiel:<person>" und erscheint als weitere
# Zielzeile mit Knopf zum Entfernen; das Ergebnis-Popup oeffnet sich sofort.
# Waze loest die Adresse selbst auf (pywaze, Adresssuche bei Waze):
# "Roemerberg 1, Frankfurt am Main" lieferte Routen, "Hauptstrasse 1" ohne
# Ort einen Treffer nahe dem Start, eine Fantasieadresse den Fehler "Cannot
# get coords for ...", den Zeile und Popup als "Waze findet diese Adresse
# nicht" zeigen. Das Popup nennt die letzte Strasse der Route, um den Treffer
# zu pruefen. Routenkarte und Google-Link bekommen die Adresse als Text;
# Google sucht sie selbst und kann einen anderen Punkt treffen als Waze. Der
# Waze-Link sucht sie mit q=. Das Eingabefeld haelt Tastenereignisse an,
# sonst loesten Buchstaben die Tastenkuerzel des HA-Frontends aus;
# Schriftgroesse 16 px, damit iOS beim Antippen nicht hineinzoomt.
#
# Rechnung: je Start|Ziel zwei Aufrufe von waze_travel_time.get_travel_times
# (hass.callService mit returnResponse, HA-Frontend src/types.ts), einmal mit
# realtime: true, einmal ohne. Ohne Echtzeit rechnet Waze mit
# crossTimeWithoutRealTime (pywaze, Modul route_calculator), also ohne
# aktuellen Verkehr. Start und Ziel gehen als Koordinaten "breite,laenge"
# hinein (pywaze erkennt sie, COORD_MATCH); der Standort ist auf drei
# Nachkommastellen (rund 100 m) gerundet, damit kleine GPS-Spruenge nicht neu
# rechnen. Ergebnisse stehen in window.__nachtblauFz.cache je Person, Start und
# Ziel (nicht je Koordinate, sonst fragte die Karte beim Fahren bei jeder
# neuen Position): neu gerechnet wird nach 5 min, bei geaendertem Start oder
# Ziel nach 2 min. Ein Takt jede Minute zeichnet Karte und offenes Popup neu
# (Ankunftszeit) und stoesst faellige Rechnungen an. Waehrend eine Rechnung
# laeuft, bleiben die alten Werte stehen. Gerechnet wird nur, solange eine
# Karte offen ist, und in jedem Browser fuer sich.
# Angezeigt wird je Aufruf die schnellste Route. Die Differenz live minus
# typisch ist die Verzoegerung der Pille:
#   unter 3 min frei (Gruen), 3 bis 9 min zaeh (Amber), ab 10 min Stau (Rot),
#   ohne Wert "keine Daten". Die Stufe steht immer als Text in der Pille.
# Die Grenzen sind gesetzt, nicht gemessen.
#
# Neu zeichnen: button-card zeichnet nur bei Aenderung gelesener Zustaende
# neu (shouldUpdate, button-card.ts). Nach einer Antwort von Waze, einem
# Startwechsel und im Minutentakt schreibt window.__nachtblauFz.neu() den Inhalt
# deshalb selbst in jede offene Karte (Element data-fz-karte) und in die
# Bloecke data-fz-teil des Popups. Routenkarte und Links (data-fz-ort)
# tauscht es nur, wenn sich Start, Ziel oder Schluessel geaendert haben;
# sonst laedt das iframe bei jedem Takt neu.
#
# Dauer: unter 60 min "45 min", ab 60 min "1 h 14 min", volle Stunden
# "2 h". Erst auf ganze Minuten runden, dann teilen.
#
# Popup: window.browser_mod.service('popup', ...) (browser_mod,
# js/plugin/services.ts); es oeffnet nur im aktuellen Browser. Inhalt ist
# nachtblau_fahrzeit_popup mit variables.key (Person|Start|Ziel); es liest
# dieselben Daten aus dem Cache, die Alternativrouten kommen aus dem
# Live-Aufruf.
#
# Routenkarte: iframe der Maps Embed API, Modus directions, mit Start und
# Ziel als Koordinaten. Laut Google sind Embed-Abrufe kostenlos und
# unbegrenzt; der Schluessel braucht trotzdem ein Abrechnungskonto. Er steht
# in variables.embed_key der Karte und ist im Browser sichtbar: in der Cloud
# Console nur fuer "Maps Embed API" freigeben und auf die Adressen der
# Instanz beschraenken (Websites). Das HA-Frontend setzt
# <meta name="referrer" content="same-origin">; ohne eigenes
# referrerpolicy="origin" schickte das iframe keinen Referrer, und Google
# lehnte einen so beschraenkten Schluessel ab (RefererNotAllowedMapError).
# Steht noch der Platzhalter drin, zeigt das Popup statt der Karte einen
# Hinweis. Waze liefert keine Linienfuehrung und die Embed-Karte keinen
# Parameter zur Routenwahl; die Karte zeigt Googles eigene Route.
#
# Klicks (wie im Flugradar, flugradar-templates.yaml, gemessen): Karte und
# Popup-Inhalt haben keine Aktion; button-card gibt ihnen die Klasse
# "disabled" mit pointer-events: none (styles.ts, _computeIsClickable). Der
# Inhalt setzt pointer-events: auto und haelt touchstart/-end/-cancel an,
# weil button-card bei touchend preventDefault() aufruft und am Handy dann
# kein click mehr kommt. Chips, Zeilen und Knoepfe loesen ueber
# window.__nachtblauFz.tipp bei touchend (echter Tipp: unter 10 px, unter
# 800 ms) oder click aus; Links oeffnen per window.open.
#
# Waze-Eintrag als Anker: Die Aktion registriert die Integration in
# async_setup (waze_travel_time/__init__.py), und die Integration laesst sich
# nur ueber Eintraege einrichten (config_entry_only_config_schema). Ohne
# einen Eintrag laedt Home Assistant sie nach dem Neustart nicht, und die
# Aktion fehlt. Ein beliebiger Eintrag genuegt; sein Sensor wird nicht
# gelesen. Start und Ziel des Eintrags muessen sich aber aufloesen lassen,
# am einfachsten zwei Zonen (zone.home, zone.arbeit): Zeigt er auf eine
# geloeschte Entity, bleibt er im Einrichtungsfehler ("Cannot get coords
# for ...") und versucht es immer wieder. Aendern ueber "Neu
# konfigurieren" des Eintrags. Unter Systemoptionen "Abfrage von
# Aenderungen aktivieren" ausschalten, sonst fragt er weiter alle 5 min bei
# Waze; beim Laden rechnet er trotzdem einmal.
#
# Voraussetzung: custom:button-card (v7) und browser_mod (HACS), Integration
# Waze Travel Time mit mindestens einem Eintrag (siehe oben), je Ziel eine
# Zone, je Person ein Benutzer und ein Tracker mit Koordinaten. Benutzer
# ohne Admin-Rechte duerfen die Aktion aufrufen: Sie ist mit
# hass.services.async_register angemeldet, nicht als Admin-Aktion.
button_card_templates:
  nachtblau_fahrzeiten:
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      personen: []
      starts: []
      ziele: []
      region: eu
      embed_key: DEIN_EMBED_KEY
    styles:
      card:
        - padding: 16px
        - border-radius: 22px
        - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
        - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
        - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
        - overflow: hidden
        - cursor: default
      grid:
        - grid-template-areas: '"inhalt"'
      custom_fields:
        inhalt:
          - width: 100%
          - min-width: 0
    custom_fields:
      inhalt: |
        [[[
          // Bibliothek, einmal pro Seite. VERSION bei jeder Aenderung erhoehen.
          const VERSION = 7;
          if (!window.__nachtblauFz || window.__nachtblauFz.version !== VERSION) {
            if (window.__nachtblauFz && window.__nachtblauFz.takt) clearInterval(window.__nachtblauFz.takt);
            const fz = { version: VERSION, cache: {}, ctx: {}, karten: new Set(), wahlen: {}, adressen: {}, freiKey: {} };
            const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const GRAU = 'var(--nachtblau-text-sekundaer, #8794a5)';
            const BLAU = 'var(--nachtblau-blau, #7fb3d5)';
            const LUPE = 'M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5';
            const KACHEL = 'background:var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));';
            fz.esc = esc;
            fz.dauer = (min) => {
              const t = Math.round(min), h = Math.floor(t / 60), m = t % 60;
              return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`;
            };
            fz.km = (k) => k.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
            fz.zeit = (ms) => new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            fz.koord = (s, stellen) => (s && typeof s.attributes.latitude === 'number' && typeof s.attributes.longitude === 'number')
              ? s.attributes.latitude.toFixed(stellen) + ',' + s.attributes.longitude.toFixed(stellen) : null;
            fz.beste = (r) => (Array.isArray(r) && r.length)
              ? r.filter((x) => typeof x.duration === 'number').reduce((a, b) => (!a || b.duration < a.duration ? b : a), null) : null;
            fz.erlaubt = (e, pid) => !Array.isArray(e.personen) || e.personen.includes(pid);
            // Schluessel in localStorage; Werte unter dem frueheren Namen (bis
            // Oktober 2026 "owlet…") einmal uebernehmen. Nur innerhalb von try.
            fz.schluessel = (art, pid) => {
              const k = 'nachtblau' + art + ':' + pid, alt = 'owlet' + art + ':' + pid;
              if (localStorage.getItem(k) === null && localStorage.getItem(alt) !== null) {
                localStorage.setItem(k, localStorage.getItem(alt));
                localStorage.removeItem(alt);
              }
              return k;
            };
            fz.wahl = (pid) => {
              try { const w = localStorage.getItem(fz.schluessel('FahrtStart', pid)); if (w) return w; } catch (e) { /* kein localStorage */ }
              return fz.wahlen[pid] || 'zuhause';
            };
            fz.waehle = (pid, id) => {
              fz.wahlen[pid] = id;
              try { localStorage.setItem(fz.schluessel('FahrtStart', pid), id); } catch (e) { /* nur bis zum Neuladen */ }
              fz.neu();
            };
            // Freie Adresse je Person und Geraet (null entfernt sie)
            fz.adresse = (pid) => {
              try { const a = localStorage.getItem(fz.schluessel('FahrtZiel', pid)); if (a) return a; } catch (e) { /* kein localStorage */ }
              return fz.adressen[pid] || '';
            };
            fz.setzeAdresse = (pid, text) => {
              fz.adressen[pid] = text || '';
              try {
                if (text) localStorage.setItem(fz.schluessel('FahrtZiel', pid), text);
                else localStorage.removeItem(fz.schluessel('FahrtZiel', pid));
              } catch (e) { /* nur bis zum Neuladen */ }
              fz.neu();
            };

            // Lage der angemeldeten Person: sichtbare Starts, tatsaechlicher Start, Ziele
            fz.lage = (states, user, v) => {
              const p = (v.personen || []).map((id) => states[id])
                .find((s) => s && user && s.attributes.user_id === user.id);
              if (!p) return null;
              const pid = p.entity_id, daheim = p.state === 'home';
              const zonen = Array.isArray(p.attributes.in_zones) ? p.attributes.in_zones : [];
              const pos = fz.koord(p, 3);
              const alle = (v.starts || []).filter((s) => fz.erlaubt(s, pid));
              const sichtbar = alle.filter((s) => s.sichtbar === 'daheim' ? daheim : s.sichtbar === 'unterwegs' ? !daheim : true);
              const wahl = fz.wahl(pid);
              const gewaehlt = sichtbar.find((s) => s.id === wahl);
              const standort = alle.find((s) => s.standort);
              const heim = alle.find((s) => s.zone === 'zone.home');
              let start;
              if (gewaehlt && (!gewaehlt.standort || pos)) start = gewaehlt;
              else if (!daheim && pos && standort) start = standort;
              else start = heim;
              if (!start) return null;
              const koord = start.standort ? pos : fz.koord(states[start.zone], 5);
              const ziele = (v.ziele || []).filter((z) => fz.erlaubt(z, pid) && z.zone !== start.zone
                && !zonen.includes(z.zone) && !(z.zone === 'zone.home' && daheim));
              const unbekannt = !pos && start === heim && (wahl === (standort && standort.id) || !daheim);
              return { p, pid, pos, sichtbar, start, koord, ziele, unbekannt };
            };

            // Waze: live und typisch je Person|Start|Ziel. Neu nach 5 min,
            // bei geaendertem Start nach 2 min, bei geaendertem Ziel (freie
            // Adresse) sofort.
            fz.abruf = (hass, key, o, d, region) => {
              const c = fz.cache[key];
              const alter = c ? Date.now() - c.zeit : Infinity;
              if (c && (c.laeuft || (c.d === d && alter < (c.o === o ? 300000 : 120000)))) return;
              fz.cache[key] = { ...(c || {}), laeuft: true, zeit: Date.now() };
              const frage = (rt) => hass.callService('waze_travel_time', 'get_travel_times',
                { origin: o, destination: d, region: region, realtime: rt }, undefined, false, true)
                .then((r) => (r && r.response && r.response.routes) || []);
              Promise.all([frage(true), frage(false)])
                .then(([live, typ]) => { fz.cache[key] = { zeit: Date.now(), o, d, live, typ }; fz.neu(); })
                .catch((e) => {
                  // Unbekannte Adresse: Waze meldet "Cannot get coords for ..."
                  const text = String((e && (e.message || (e.error && e.error.message))) || '');
                  const alt = c && c.d === d ? c : {};
                  fz.cache[key] = { ...alt, zeit: Date.now(), o, d, fehler: true, unbekannt: /coords/i.test(text) };
                  fz.neu();
                });
            };
            // Cache-Eintrag nur, wenn er zum aktuellen Ziel gehoert; nach
            // einer neuen Adresse zeigt die Zeile bis zur Antwort keine
            // Werte der alten.
            fz.daten = (key) => {
              const c = fz.cache[key] || {}, x = fz.ctx[key] || {};
              return (x.d && c.d && c.d !== x.d) ? { laeuft: true } : c;
            };

            // Tippen: touchend (echter Tipp) oder click, nicht beides
            fz.tipp = (e, aktion) => {
              e.stopPropagation();
              if (e.type === 'touchstart') {
                const t = e.touches && e.touches[0];
                fz._tipp = t ? { x: t.clientX, y: t.clientY, z: Date.now() } : null;
                return;
              }
              if (e.type === 'touchend') {
                const t = e.changedTouches && e.changedTouches[0], st = fz._tipp;
                fz._tipp = null;
                if (!t || !st || Math.hypot(t.clientX - st.x, t.clientY - st.y) > 10 || Date.now() - st.z > 800) return;
                if (e.cancelable) e.preventDefault();
                fz._tippZeit = Date.now();
                if (aktion) aktion();
                return;
              }
              if (e.type === 'click') {
                e.preventDefault();
                if (Date.now() - (fz._tippZeit || 0) < 700) return;
                if (aktion) aktion();
              }
            };
            fz.tippAttr = (js) => `ontouchstart="window.__nachtblauFz.tipp(event)" ontouchend="window.__nachtblauFz.tipp(event,()=>{${js}})" onclick="window.__nachtblauFz.tipp(event,()=>{${js}})"`;
            fz.touchStopp = 'ontouchstart="event.stopPropagation()" ontouchend="event.stopPropagation()" ontouchcancel="event.stopPropagation()"';

            // Oberflaeche, Breite und Seitenabstand wie im DWD-Popup
            // (warnlage-templates.yaml, Erklaerung dort)
            fz.popupStil = '--ha-card-background: var(--nachtblau-huelle-oben, #1b2231);'
              + '--card-background-color: var(--nachtblau-huelle-oben, #1b2231);'
              + '--primary-background-color: var(--nachtblau-seite, #171d29);'
              + '--secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);'
              + '--primary-text-color: var(--nachtblau-text, #f2f5f8);'
              + '--secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);'
              + '--mdc-dialog-scrim-color: rgba(0,0,0,0.62);'
              + '--popup-min-width: min(100vw, 720px);--popup-max-width: min(100vw, 720px);';
            fz.oeffne = (key) => {
              const x = fz.ctx[key];
              if (!x || !window.browser_mod) return;
              window.browser_mod.service('popup', {
                title: x.ziel,
                style: fz.popupStil,
                content: { type: 'custom:button-card', template: 'nachtblau_fahrzeit_popup', variables: { key } },
              });
            };

            // Freie Adresse: Eingabe im Popup, danach das Ergebnis-Popup
            fz.eingabe = (pid) => {
              if (!window.browser_mod) return;
              window.browser_mod.service('popup', {
                title: 'Andere Adresse',
                style: fz.popupStil,
                content: { type: 'custom:button-card', template: 'nachtblau_fahrzeit_popup', variables: { eingabe: pid } },
              });
            };
            fz.suche = (el, pid) => {
              const root = el.getRootNode();
              const feld = root.querySelector('input[data-fz-adresse]');
              const meldung = root.querySelector('[data-fz-meldung]');
              const text = feld ? feld.value.trim().slice(0, 200) : '';
              if (!text) { if (meldung) meldung.textContent = 'Bitte eine Adresse eingeben.'; return; }
              fz.setzeAdresse(pid, text);
              const key = fz.freiKey[pid];
              if (key) fz.oeffne(key);
              else if (meldung) meldung.textContent = 'Gerade ist kein Startpunkt bekannt. Die Adresse ist gemerkt und wird gerechnet, sobald einer da ist.';
            };
            // Tastatur: Ereignisse anhalten, sonst loesen Buchstaben die
            // Tastenkuerzel des HA-Frontends aus.
            fz.eingabeHtml = (pid) => `
              <div ${fz.touchStopp} style="display:flex;flex-direction:column;gap:10px;text-align:left;pointer-events:auto;white-space:normal;">
                <input data-fz-adresse type="text" value="${esc(fz.adresse(pid))}" placeholder="Straße Hausnummer, Ort"
                  autocomplete="street-address" enterkeyhint="go" aria-label="Adresse"
                  onkeyup="event.stopPropagation()" onkeypress="event.stopPropagation()"
                  onkeydown="event.stopPropagation();if(event.key==='Enter'){event.preventDefault();window.__nachtblauFz.suche(this,'${pid}')}"
                  style="font:inherit;font-size:16px;color:var(--nachtblau-text, #f2f5f8);background:var(--nachtblau-flaeche-vertieft, #10151d);width:100%;box-sizing:border-box;
                    border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));border-radius:12px;padding:10px 12px;outline:none;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" ${fz.tippAttr(`window.__nachtblauFz.suche(this,'${pid}')`)} style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;
                     font:inherit;font-size:13.5px;font-weight:600;color:var(--nachtblau-titel, #e7ecf3);border-radius:13px;padding:9px 14px;
                     background:color-mix(in srgb, ${BLAU} 12%, transparent);border:1px solid color-mix(in srgb, ${BLAU} 24%, transparent);">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;color:${BLAU};"><path d="${LUPE}"/></svg>Fahrzeit berechnen</button>
                </div>
                <div data-fz-meldung style="font-size:12.5px;color:${GRAU};">Ort mit angeben, wenn der Straßenname häufig ist. Die Adresse bleibt auf diesem Gerät gemerkt, bis du sie in der Karte mit × entfernst.</div>
              </div>`;

            // Eine Zeile je Ziel
            fz.zeile = (key, ziel) => {
              const c = fz.daten(key);
              const x = fz.ctx[key] || {};
              const live = fz.beste(c.live), typ = fz.beste(c.typ);
              let stufe = { text: 'keine Daten', farbe: 'var(--nachtblau-muted, #6e7988)' };
              if (live && typ) {
                const v = Math.max(0, Math.round(live.duration - typ.duration));
                if (v < 3) stufe = { text: v > 0 ? `frei · +${fz.dauer(v)}` : 'frei', farbe: 'var(--nachtblau-gruen, #a6d49e)' };
                else if (v < 10) stufe = { text: `zäh · +${fz.dauer(v)}`, farbe: 'var(--nachtblau-amber, #e6b566)' };
                else stufe = { text: `Stau · +${fz.dauer(v)}`, farbe: 'var(--nachtblau-rot, #f0736a)' };
              }
              const teile = [];
              if (live) {
                if (typeof live.distance === 'number') teile.push(fz.km(live.distance));
                teile.push('an ' + fz.zeit(Date.now() + live.duration * 60000));
                if (live.name) teile.push('über ' + esc(String(live.name).replace(/;\s*/g, ' · ')));
              }
              const info = teile.length ? teile.join(' · ')
                : (c.laeuft ? 'wird bei Waze berechnet …' : c.unbekannt ? 'Waze findet diese Adresse nicht' : 'Waze liefert gerade keine Route');
              // Freie Adresse: Knopf zum Entfernen neben dem Namen
              const weg = x.frei ? `<span role="button" aria-label="Adresse entfernen" ${fz.tippAttr(`window.__nachtblauFz.setzeAdresse('${x.pid}',null)`)}
                  style="flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--nachtblau-label, #b4c0cf);
                    background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));">
                  <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>` : '';
              const einheit = (u) => `<span style="font-size:13px;font-weight:500;color:${GRAU};margin-left:2px;">${u}</span>`;
              let gross = '–';
              if (live) {
                const t = Math.round(live.duration), h = Math.floor(t / 60), m = t % 60;
                gross = h ? `${h}${einheit('h')}${m ? ` ${m}${einheit('min')}` : ''}` : `${m}${einheit('min')}`;
              }
              const pille = `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap;
                  border-radius:999px;padding:2px 8px;color:var(--nachtblau-label, #b4c0cf);
                  background:color-mix(in srgb, ${stufe.farbe} 12%, transparent);border:1px solid color-mix(in srgb, ${stufe.farbe} 24%, transparent);">
                  <i style="width:7px;height:7px;border-radius:50%;background:${stufe.farbe};box-shadow:0 0 0 3px color-mix(in srgb, ${stufe.farbe} 18%, transparent);"></i>${stufe.text}</span>`;
              return `
                <div role="button" tabindex="0" ${fz.tippAttr(`window.__nachtblauFz.oeffne('${key}')`)}
                  onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__nachtblauFz.oeffne('${key}')}"
                  style="${KACHEL}border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer;
                    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;">
                  <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;">
                    <span style="font-size:15px;font-weight:600;color:var(--nachtblau-titel, #e7ecf3);min-width:0;overflow-wrap:anywhere;">${esc(ziel.name)}</span>${pille}${weg}
                  </div>
                  <div style="grid-row:span 2;font-size:24px;line-height:1;font-weight:700;color:var(--nachtblau-text, #f2f5f8);font-variant-numeric:tabular-nums;white-space:nowrap;">${gross}</div>
                  <div style="font-size:12.5px;color:${GRAU};font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere;">${info}</div>
                </div>`;
            };

            // Ganze Karte
            fz.html = (states, user, hass, v) => {
              const auto = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px;">
                <path d="M5 11l1.5-4.5h11L19 11M17.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m-11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3M18.92 6c-.2-.58-.76-1-1.42-1h-11c-.66 0-1.22.42-1.42 1L3 12v8a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-8z"/></svg>`;
              const l = fz.lage(states, user, v);
              const unter = !l ? 'Für diesen Benutzer ist keine Person eingetragen'
                : (l.unbekannt ? 'Standort unbekannt · ab ' + esc(l.start.name) : 'ab ' + esc(l.start.name)) + ' · Waze, mit Verkehr';
              const kopf = `
                <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                  <div style="width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;color:${GRAU};
                    background:color-mix(in srgb, ${GRAU} 16%, transparent);border:1px solid color-mix(in srgb, ${GRAU} 24%, transparent);">${auto}</div>
                  <div style="display:flex;flex-direction:column;min-width:0;">
                    <span style="font-size:16px;font-weight:600;color:var(--nachtblau-titel, #e7ecf3);">Fahrzeiten</span>
                    <span style="font-size:12.5px;color:${GRAU};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${unter}</span>
                  </div>
                </div>`;
              if (!l) return kopf;
              const chips = l.sichtbar.map((s) => {
                const an = s.id === l.start.id;
                const gesperrt = s.standort && !l.pos;
                const pfad = s.standort
                  ? 'M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7m0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5'
                  : s.zone === 'zone.home' ? 'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'
                  : 'M10 2h4a2 2 0 0 1 2 2v2h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4V4a2 2 0 0 1 2-2m4 4V4h-4v2z';
                const aktion = (an || gesperrt) ? '' : fz.tippAttr(`window.__nachtblauFz.waehle('${l.pid}','${s.id}')`);
                return `<button type="button" ${aktion} style="display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;
                    white-space:nowrap;border-radius:999px;padding:6px 12px;cursor:${aktion ? 'pointer' : 'default'};opacity:${gesperrt ? 0.45 : 1};
                    color:${an ? 'var(--nachtblau-titel, #e7ecf3)' : 'var(--nachtblau-label, #b4c0cf)'};
                    background:${an ? `color-mix(in srgb, ${BLAU} 12%, transparent)` : 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'};
                    border:1px solid ${an ? `color-mix(in srgb, ${BLAU} 24%, transparent)` : 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'};">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:15px;height:15px;color:${an ? BLAU : 'var(--nachtblau-muted, #6e7988)'};"><path d="${pfad}"/></svg>${esc(s.name)}</button>`;
              }).join('');
              const zeilen = l.koord ? l.ziele.map((z) => {
                const ziel = fz.koord(states[z.zone], 5);
                if (!ziel) return '';
                const key = l.pid + '|' + l.start.id + '|' + z.id;
                fz.ctx[key] = { ziel: z.name, start: l.start.name, embed_key: v.embed_key, d: ziel };
                fz.abruf(hass, key, l.koord, ziel, v.region || 'eu');
                return fz.zeile(key, z);
              }).join('') : '';
              // Freie Adresse (je Person und Geraet gemerkt) als weitere Zeile
              const adr = fz.adresse(l.pid);
              let frei = '';
              delete fz.freiKey[l.pid];
              if (adr && l.koord) {
                const key = l.pid + '|' + l.start.id + '|frei';
                fz.ctx[key] = { ziel: adr, start: l.start.name, embed_key: v.embed_key, d: adr, frei: true, pid: l.pid };
                fz.abruf(hass, key, l.koord, adr, v.region || 'eu');
                fz.freiKey[l.pid] = key;
                frei = fz.zeile(key, { name: adr });
              }
              const eingabe = `
                <div role="button" tabindex="0" ${fz.tippAttr(`window.__nachtblauFz.eingabe('${l.pid}')`)}
                  onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__nachtblauFz.eingabe('${l.pid}')}"
                  style="border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer;display:flex;align-items:center;gap:8px;
                    font-size:14px;font-weight:500;color:var(--nachtblau-label, #b4c0cf);
                    border:1px dashed color-mix(in srgb, var(--nachtblau-muted, #6e7988) 45%, transparent);">
                  <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;color:var(--nachtblau-muted, #6e7988);"><path d="${LUPE}"/></svg>Andere Adresse …</div>`;
              return `${kopf}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">${chips}</div>${zeilen}${frei}${eingabe}`;
            };

            // Popup: Zeile ueber der Karte, Kennzahlen und Routen aus dem Cache
            fz.popupTeile = (key) => {
              const c = fz.daten(key);
              const x = fz.ctx[key] || {};
              const live = fz.beste(c.live), typ = fz.beste(c.typ);
              const hinweis = (t) => `<div style="font-size:13px;color:var(--nachtblau-label, #b4c0cf);">${t}</div>`;
              const zahlen = [
                ['Mit Verkehr', live ? fz.dauer(live.duration) : '–'],
                ['Typisch', typ ? fz.dauer(typ.duration) : '–'],
                ['Ankunft', live ? fz.zeit(Date.now() + live.duration * 60000) : '–'],
                ['Strecke', live && typeof live.distance === 'number' ? fz.km(live.distance) : '–'],
              ].map(([l, w]) => `
                <div style="${KACHEL}border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;">
                  <span style="font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;color:${GRAU};">${l}</span>
                  <span style="font-size:19px;font-weight:700;color:var(--nachtblau-text, #f2f5f8);font-variant-numeric:tabular-nums;">${w}</span>
                </div>`).join('');
              const ueber = live && live.name ? ' · über ' + esc(String(live.name).replace(/;\s*/g, ' · ')) : '';
              const stand = c.zeit && !c.laeuft ? ' · Stand ' + fz.zeit(c.zeit) : '';
              // Freie Adresse: letzte Strasse der Route, um Waze' Treffer zu pruefen
              const sn = live && Array.isArray(live.street_names) ? live.street_names : [];
              const endet = x.frei && sn.length ? ' · endet in ' + esc(sn[sn.length - 1]) : '';
              // Alternativen aus dem Live-Aufruf, schnellste zuerst
              const liste = (Array.isArray(c.live) ? c.live : []).filter((r) => typeof r.duration === 'number').sort((a, b) => a.duration - b.duration);
              const routen = liste.length ? liste.map((r, i) => {
                const nr = i === 0
                  ? `background:color-mix(in srgb, ${BLAU} 16%, transparent);color:${BLAU};`
                  : 'background:var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05));color:var(--nachtblau-label, #b4c0cf);';
                return `<div style="display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:12px;${KACHEL}font-variant-numeric:tabular-nums;">
                    <span style="width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;${nr}">${i + 1}</span>
                    <span style="color:var(--nachtblau-titel, #e7ecf3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(String(r.name || '–').replace(/;\s*/g, ' · '))}</span>
                    <span style="color:${GRAU};">${typeof r.distance === 'number' ? fz.km(r.distance) : ''}</span>
                    <span style="font-weight:700;color:var(--nachtblau-text, #f2f5f8);text-align:right;">${fz.dauer(r.duration)}${i ? `<span style="font-weight:500;color:${GRAU};"> +${fz.dauer(Math.round(r.duration - liste[0].duration))}</span>` : ''}</span>
                  </div>`;
              }).join('') : hinweis(c.laeuft ? 'Routen werden bei Waze abgefragt …'
                : c.unbekannt ? 'Waze findet diese Adresse nicht. Schreibweise prüfen oder den Ort ergänzen.'
                : 'Waze kennt für diese Strecke gerade keine Routen.');
              return { zeile: `ab ${esc(x.start || '–')}${ueber}${endet}${stand}`, zahlen, routen };
            };

            // Popup: Routenkarte und Links. sig wechselt nur mit Start, Ziel,
            // Schluessel oder Fund der Adresse; neu() tauscht die Bloecke nur
            // dann, sonst laedt das iframe bei jedem Takt neu.
            fz.popupKarte = (key) => {
              const c = fz.daten(key), x = fz.ctx[key] || {};
              const ekey = String(x.embed_key || '');
              const oe = c.o ? encodeURIComponent(c.o) : '', de = c.d ? encodeURIComponent(c.d) : '';
              const sig = [c.o || '', c.d || '', ekey, c.unbekannt ? 1 : 0].join('|');
              const hinweis = (t) => `<div style="${KACHEL}border-radius:16px;padding:14px;font-size:13px;color:var(--nachtblau-label, #b4c0cf);">${t}</div>`;
              let karte;
              if (c.unbekannt) karte = hinweis('Keine Routenkarte: Waze findet die Adresse nicht.');
              else if (!oe || !de) karte = hinweis('Waze hat für diese Strecke noch nicht gerechnet.');
              else if (!ekey || ekey === 'DEIN_EMBED_KEY') karte = hinweis('Für die Routenkarte fehlt der API-Schlüssel der Maps Embed API (variables.embed_key in fahrzeiten-karte.yaml).');
              else {
                const src = 'https://www.google.com/maps/embed/v1/directions?key=' + encodeURIComponent(ekey)
                  + '&mode=driving&language=de&origin=' + oe + '&destination=' + de;
                karte = `<iframe src="${src}" loading="lazy" referrerpolicy="origin" allowfullscreen
                  style="display:block;width:100%;height:320px;border:0;border-radius:16px;background:var(--nachtblau-flaeche-vertieft, #10151d);"></iframe>`;
              }
              const knopf = (href, text, pfad) => `
                <button type="button" ${fz.tippAttr(`window.open('${href}','_blank')`)} style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;
                   font:inherit;font-size:13.5px;font-weight:600;color:var(--nachtblau-titel, #e7ecf3);border-radius:13px;padding:9px 14px;
                   background:color-mix(in srgb, ${BLAU} 12%, transparent);border:1px solid color-mix(in srgb, ${BLAU} 24%, transparent);">
                  <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;color:${BLAU};"><path d="${pfad}"/></svg>${text}</button>`;
              // Waze: Koordinaten als ll, eine Adresse als Suchbegriff q
              const waze = /^-?[\d.]+,-?[\d.]+$/.test(c.d || '') ? 'll=' : 'q=';
              const links = (oe && de && !c.unbekannt) ? `
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  ${knopf('https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + oe + '&destination=' + de, 'In Google Maps öffnen',
                    'M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z')}
                  ${knopf('https://waze.com/ul?navigate=yes&' + waze + de, 'In Waze navigieren', 'M12 2 4.5 20.29l.71.71L12 18l6.79 3 .71-.71z')}
                </div>` : '';
              return { sig, karte, links };
            };

            // Offene Karten und Popups neu schreiben (Antwort, Startwechsel,
            // Minutentakt). Im Popup die Bloecke data-fz-teil, Routenkarte und
            // Links (data-fz-ort) nur bei neuer sig.
            fz.neu = () => {
              fz.karten.forEach((k) => {
                if (!k.isConnected) { fz.karten.delete(k); return; }
                const r = k.shadowRoot;
                if (!r) return;
                if (k.__fzKey !== undefined) {
                  const t = fz.popupTeile(k.__fzKey);
                  r.querySelectorAll('[data-fz-teil]').forEach((el) => { el.innerHTML = t[el.getAttribute('data-fz-teil')] || ''; });
                  const o = fz.popupKarte(k.__fzKey);
                  r.querySelectorAll('[data-fz-ort]').forEach((el) => {
                    if (el.getAttribute('data-fz-sig') === o.sig) return;
                    el.innerHTML = o[el.getAttribute('data-fz-ort')] || '';
                    el.setAttribute('data-fz-sig', o.sig);
                  });
                  return;
                }
                const el = r.querySelector('[data-fz-karte]');
                if (el && k._hass && k.__fzV) el.innerHTML = fz.html(k._hass.states, k._hass.user, k._hass, k.__fzV);
              });
            };
            fz.takt = setInterval(fz.neu, 60000);
            window.__nachtblauFz = fz;
          }
          const fz = window.__nachtblauFz;
          this.__fzV = variables;
          fz.karten.add(this);
          return `<div data-fz-karte ${fz.touchStopp} style="display:flex;flex-direction:column;text-align:left;pointer-events:auto;white-space:normal;">${fz.html(states, user, this._hass || hass, variables)}</div>`;
        ]]]

  nachtblau_fahrzeit_popup:
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      key: ''
      eingabe: ''
    styles:
      card:
        - padding: 4px 0 8px
        - background: none
        - border: none
        - box-shadow: none
        - cursor: default
      grid:
        - grid-template-areas: '"inhalt"'
      custom_fields:
        inhalt:
          - width: 100%
          - min-width: 0
    custom_fields:
      inhalt: |
        [[[
          const fz = window.__nachtblauFz;
          const hinweis = (t) => `<div style="font-size:13px;color:var(--nachtblau-label, #b4c0cf);">${t}</div>`;
          if (!fz || !fz.eingabeHtml) return hinweis('Die Karte Fahrzeiten ist auf dieser Seite noch nicht geladen.');
          // Eingabe einer freien Adresse (variables.eingabe: Person)
          if (variables.eingabe) {
            setTimeout(() => { const f = this.shadowRoot && this.shadowRoot.querySelector('input[data-fz-adresse]'); if (f) f.focus(); }, 100);
            return fz.eingabeHtml(variables.eingabe);
          }
          const key = String(variables.key || '');
          const t = fz.popupTeile(key);
          const k = fz.popupKarte(key);
          this.__fzKey = key;
          fz.karten.add(this);
          const grau = 'var(--nachtblau-text-sekundaer, #8794a5)';
          const sig = fz.esc(k.sig);
          return `
            <div ${fz.touchStopp} style="display:flex;flex-direction:column;gap:12px;text-align:left;pointer-events:auto;white-space:normal;">
              <div data-fz-teil="zeile" style="font-size:12.5px;color:${grau};">${t.zeile}</div>
              <div data-fz-teil="zahlen" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));gap:8px;">${t.zahlen}</div>
              <div data-fz-ort="karte" data-fz-sig="${sig}">${k.karte}</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                <span style="font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;color:${grau};">Routen laut Waze, mit Verkehr</span>
                <div data-fz-teil="routen" style="display:flex;flex-direction:column;gap:6px;">${t.routen}</div>
              </div>
              <div data-fz-ort="links" data-fz-sig="${sig}">${k.links}</div>
            </div>`;
        ]]]
