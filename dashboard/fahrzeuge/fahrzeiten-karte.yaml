# ============================================================================
# Fahrzeiten – Waze-Fahrzeit je angemeldeter Person, Route im Popup
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       fahrzeuge
# Status:        aktiv
# Karten:        button-card
# Templates:     owlet_fahrzeiten (fahrzeiten-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   person.bewohner, DEIN_EMBED_KEY
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Fahrzeiten (Owlet-Karte) fuer die Auto-View. Jeder Benutzer sieht die
# Fahrzeiten ab seinem eigenen Standort; die Person ergibt sich aus dem
# angemeldeten Benutzer (Attribut user_id der Person).
#
#   Kopf     Icon-Kachel in Auto-Grau, "Fahrzeiten", darunter der Startpunkt
#            ("ab Zuhause", "ab Arbeit", "ab Standort" oder "Standort
#            unbekannt · ab Zuhause")
#   Chips    Startpunkt, gemerkt je Geraet. Daheim: Zuhause und Standort,
#            unterwegs: Arbeit (nur person.bewohner) und Standort. Standort
#            ist die Position der Person; der Chip ist gedimmt, solange sie
#            keine Koordinaten hat. Aktiv ist der tatsaechliche Start.
#   Zeilen   je Ziel (Zuhause nur unterwegs, Arbeit nur fuer
#            person.bewohner, kein Ziel gleich dem Start): Name, Pille mit
#            Verzoegerung gegenueber typisch, Fahrzeit mit Verkehr, Strecke,
#            Ankunft, Strasse laut Waze. Tippen oeffnet das Popup mit
#            Kennzahlen, Routenkarte, Alternativrouten und Links zu Google
#            Maps und Waze.
#   Adresse  "Andere Adresse …" (fuer jede Person): Eingabe einer freien
#            Adresse im Popup. Sie bleibt auf dem Geraet gemerkt und steht
#            als weitere Zeile mit × zum Entfernen unter den Zielen.
# Logik, Stufen der Pille und Startpunkt: fahrzeiten-templates.yaml.
#
#   personen   Personen, die die Karte nutzen; jede braucht einen Benutzer.
#              Benutzer ohne Person sehen nur den Kopf mit Hinweis.
#   starts     id, name, und entweder zone oder standort: true.
#              sichtbar: daheim / unterwegs (fehlt: immer),
#              personen: nur fuer diese Personen (fehlt: fuer alle).
#   ziele      id, name, zone, optional personen wie oben.
# Weiteres Ziel: Zone anlegen und unter ziele eintragen.
#
# DEIN_EMBED_KEY: API-Schluessel der Maps Embed API (Einrichtung und
# Beschraenkung siehe fahrzeiten-templates.yaml). Ohne Schluessel zeigt das
# Popup statt der Karte einen Hinweis, der Rest funktioniert.
#
# Voraussetzung: custom:button-card (v7) und browser_mod (HACS), die
# Templates aus fahrzeiten-templates.yaml, Integration Waze Travel Time
# mit mindestens einem Eintrag (Grund: fahrzeiten-templates.yaml),
# Zone zone.arbeit.
type: custom:button-card
template: owlet_fahrzeiten
variables:
  personen:
    - person.bewohner
    - person.bewohner_2
  starts:
    - id: zuhause
      name: Zuhause
      zone: zone.home
      sichtbar: daheim
    - id: arbeit
      name: Arbeit
      zone: zone.arbeit
      sichtbar: unterwegs
      personen:
        - person.bewohner
    - id: standort
      name: Standort
      standort: true
  ziele:
    - id: zuhause
      name: Zuhause
      zone: zone.home
    - id: arbeit
      name: Arbeit
      zone: zone.arbeit
      personen:
        - person.bewohner
  region: eu
  embed_key: DEIN_EMBED_KEY
