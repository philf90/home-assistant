# ============================================================================
# Tanken – guenstigster Diesel in der Naehe
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       fahrzeuge
# Status:        aktiv
# Karten:        button-card
# Templates:     nachtblau_tanken_popup (tanken-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Tanken (Nachtblau-Karte) fuer die Auto-View, unter den beiden Autos.
#
# Beide Autos fahren Diesel, deshalb zeigt die Karte zuerst Diesel:
#   Kopf     Icon-Kachel Amber (wie die Tank-Kachel der Autos), "Tanken",
#            darunter die Sorte, rechts "n von 4 geoeffnet"
#   Hero     guenstigster Preis der Sorte unter den geoeffneten Tankstellen,
#            gruen getoent; darunter die Tankstelle und der Abstand zur
#            teuersten geoeffneten (untereinander, weil nebeneinander auf dem
#            Handy umbricht)
#   Liste    die uebrigen Tankstellen nach Preis, mit Aufschlag zum
#            guenstigsten. Geschlossene rutschen ans Ende, Name und Preis in
#            Sekundaer-Grau, kein Aufschlag.
#   Chips    die beiden anderen Sorten mit ihrem guenstigsten geoeffneten
#            Preis. Antippen schaltet die ganze Karte auf diese Sorte um, der
#            Chip der bisherigen Sorte erscheint dafuer (bei Super: Chips
#            Diesel und Super E10).
# Ist keine Tankstelle geoeffnet, ist der Hero neutral und nennt das.
#
# Tippen ausserhalb der Chips: Popup mit allen Sorten und dem Diesel-Verlauf
# (nachtblau_tanken_popup). Tankstellen, Entity-IDs und Anzeigenamen stehen im
# Template nachtblau_tankstellen in tanken-templates.yaml, nicht hier.
#
# Umschalten ohne Neuzeichnen: Die Karte rendert alle drei Ansichten und
# zeigt nur die gewaehlte (data-tk-sorte). Die Chips rufen tk.waehle() aus
# nachtblau_tankstellen auf; die Funktion blendet um und merkt sich die Sorte in
# window.__nachtblauTkSorte, damit sie beim naechsten Neuzeichnen (neuer Preis)
# bleibt. Neu laden der Seite beginnt wieder mit Diesel. Die Chips haben
# eigene touchend- und click-Handler mit stopPropagation: button-card loest
# das Antippen der Karte auf touchend bzw. click aus (action-handler.ts) und
# wuerde sonst zusaetzlich das Popup oeffnen. Ausserdem stoppen sie
# pointerdown: Der Ripple der Karte (ha-ripple, Material Web ripple.ts)
# startet bei pointerdown und endet erst mit dem click, den der Chip
# abfaengt; ohne den Stopp bliebe die Karte hell hinterlegt.
#
# Farben nur aus vorhandenen Rollen (DESIGN.md): Gruen = guenstigster Preis,
# Amber = Tank wie in autos-karte-v4.yaml. Entwurf mit Daten der Woche
# 12.-19.10.2026: Artefakt "Spritpreise in der Auto-View" (nicht im Repo).
#
# Voraussetzung: custom:button-card (v7) und browser_mod (HACS), die
# Templates aus tanken-templates.yaml, Integration Tankerkoenig.
type: custom:button-card
template: nachtblau_tanken_popup
show_name: false
show_state: false
show_icon: false
show_label: false
styles:
  card:
    - padding: 16px 18px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
  grid:
    - grid-template-areas: '"body"'
    - grid-template-columns: minmax(0, 1fr)
  custom_fields:
    # button-card setzt auf jedes Feld .ellipsis (nowrap, overflow hidden);
    # zuruecksetzen, damit lange Zeilen umbrechen
    body:
      - width: 100%
      - min-width: 0
      - white-space: normal
custom_fields:
  body: |
    [[[
      const tk = variables.tk, ts = variables.tankstellen || [];
      const TEXT  = 'var(--nachtblau-text, #f2f5f8)';
      const LABEL = 'var(--nachtblau-label, #b4c0cf)';
      const SEK   = 'var(--nachtblau-text-sekundaer, #8794a5)';
      const GRUEN = 'var(--nachtblau-gruen, #a6d49e)';
      const AMBER = 'var(--nachtblau-amber, #e6b566)';
      const UK    = 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))';
      const UKR   = 'var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
      const NK    = 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
      const tint  = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;
      const esc = (s) => String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Sorten in Chip-Reihenfolge; "best" mit Artikel fuer den Hero
      const SORTEN = [
        { k: 'diesel', n: 'Diesel', best: 'Günstigster Diesel' },
        { k: 'e10', n: 'Super E10', best: 'Günstigstes Super E10' },
        { k: 'super', n: 'Super', best: 'Günstigstes Super' },
      ];
      const gewaehlt = SORTEN.some((s) => s.k === window.__nachtblauTkSorte) ? window.__nachtblauTkSorte : 'diesel';
      const nOffen = ts.filter((t) => tk.offen(states, t.status) === true).length;
      // ohne geoeffnete Tankstelle Label-Grau: Sekundaer-Grau auf der eigenen
      // Toenung kaeme dunkel nur auf 4,38:1
      const pillC = nOffen ? GRUEN : LABEL;

      const zeile = (e, best) => {
        const zu = e.offen === false;
        const status = zu ? 'geschlossen' : (e.offen === true ? 'geöffnet' : 'Status unbekannt');
        const punkt = e.offen === true ? GRUEN : SEK;
        const auf = !zu && best && Number.isFinite(e.p) ? '+' + tk.euro(e.p - best.p) : '';
        return `
          <div style="display:grid;grid-template-columns:minmax(0, 1fr) auto auto;align-items:center;gap:10px;padding:10px 13px;border-radius:14px;background:${UK};border:1px solid ${UKR};">
            <div style="min-width:0;">
              <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${zu ? SEK : TEXT};">${esc(e.name)}</div>
              <div style="font-size:12px;color:${SEK};display:flex;align-items:center;gap:5px;margin-top:1px;"><span style="width:6px;height:6px;border-radius:50%;background:${punkt};flex:none;"></span>${status}</div>
            </div>
            <div style="font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:${zu ? SEK : TEXT};">${tk.fmt(e.p)}</div>
            <div style="font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:8px;min-width:52px;box-sizing:border-box;text-align:center;font-variant-numeric:tabular-nums;color:${LABEL};background:${auf ? NK : 'transparent'};">${auf}</div>
          </div>`;
      };

      // Chip einer anderen Sorte: schaltet um, oeffnet kein Popup (siehe Kopf)
      const chip = (s) => {
        const b = tk.bester(tk.liste(states, ts, s.k));
        const h = `window.__nachtblauTk.waehle(event, '${s.k}')`;
        return `<span role="button" onpointerdown="event.stopPropagation()" ontouchstart="window.__nachtblauTk.drueck(event)" ontouchend="${h}" onclick="${h}" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:11px;background:${UK};border:1px solid ${UKR};color:${LABEL};font-size:12.5px;font-weight:600;white-space:nowrap;">${s.n} <b style="color:${TEXT};font-weight:700;font-variant-numeric:tabular-nums;">${b ? 'ab ' + tk.fmt(b.p) : '–'}</b></span>`;
      };

      const ansicht = (s) => {
        const l = tk.liste(states, ts, s.k);
        const best = tk.bester(l);
        const offenMitPreis = l.filter((e) => Number.isFinite(e.p) && e.offen !== false);
        const teuerster = offenMitPreis.length ? offenMitPreis[offenMitPreis.length - 1].p : NaN;

        // ---- Kopf ----
        const kopf = `
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="flex:none;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:${tint(AMBER, 16)};border:1px solid ${tint(AMBER, 24)};">
              <ha-icon icon="mdi:gas-station" style="--mdc-icon-size:23px;width:23px;height:23px;display:flex;color:${AMBER};"></ha-icon>
            </div>
            <div style="min-width:0;">
              <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${TEXT};">Tanken</div>
              <div style="font-size:13px;color:${SEK};margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${s.n} · ${ts.length} Tankstellen</div>
            </div>
            <span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:11px;white-space:nowrap;color:${pillC};background:${tint(pillC, 12)};border:1px solid ${tint(pillC, 24)};">
              <span style="width:7px;height:7px;border-radius:50%;background:${pillC};"></span>${nOffen} von ${ts.length} geöffnet
            </span>
          </div>`;

        // ---- Hero: guenstigster geoeffneter Preis der Sorte ----
        let hero;
        if (best) {
          const spanne = teuerster - best.p;
          const zusatz = offenMitPreis.length > 1 && spanne >= 0.005
            ? ` · ${tk.euro(spanne)} € unter dem teuersten`
            : '';
          const zustand = best.offen === true ? 'geöffnet' : 'Status unbekannt';
          hero = `
            <div style="border-radius:16px;padding:14px 16px;background:${tint(GRUEN, 12)};border:1px solid ${tint(GRUEN, 24)};">
              <div style="font-size:12px;font-weight:600;color:${LABEL};">${s.best}</div>
              <div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;margin-top:4px;color:${TEXT};font-variant-numeric:tabular-nums;">${tk.fmt(best.p)}<span style="font-size:16px;font-weight:600;color:${LABEL};margin-left:4px;letter-spacing:0;">€/l</span></div>
              <div style="font-size:14px;font-weight:700;color:${TEXT};margin-top:8px;">${esc(best.name)}<span style="display:block;font-size:12px;font-weight:600;color:${LABEL};margin-top:2px;">${zustand}${zusatz}</span></div>
            </div>`;
        } else {
          hero = `
            <div style="border-radius:16px;padding:14px 16px;background:${UK};border:1px solid ${UKR};">
              <div style="font-size:14px;font-weight:700;color:${TEXT};">Keine Tankstelle geöffnet</div>
              <div style="font-size:12px;color:${SEK};margin-top:2px;">Ohne geöffnete Tankstelle gibt es keinen aktuellen Preis für ${s.n}.</div>
            </div>`;
        }

        // ---- Liste der uebrigen Tankstellen ----
        const rest = l.filter((e) => e !== best);
        const liste = rest.length
          ? `<div style="display:flex;flex-direction:column;gap:8px;">${rest.map((e) => zeile(e, best)).join('')}</div>`
          : '';

        // ---- Chips: die beiden anderen Sorten ----
        const chips = `<div style="display:flex;flex-wrap:wrap;gap:6px;">${SORTEN.filter((x) => x.k !== s.k).map(chip).join('')}</div>`;

        return `
          <div data-tk-sorte="${s.k}" style="${s.k === gewaehlt ? '' : 'display:none;'}">
            <div style="display:flex;flex-direction:column;gap:14px;">${kopf}${hero}${liste}${chips}</div>
          </div>`;
      };

      return `
        <div data-tk-wahl style="text-align:left;line-height:1.3;color:${TEXT};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
          ${SORTEN.map(ansicht).join('')}
        </div>`;
    ]]]
