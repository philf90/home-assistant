# HINWEIS PLATZHALTER: sensor.pv_anlage_*
# Anonymisiert -- vor dem Einfuegen durch die eigenen Werte ersetzen.
# Tabelle und Vorgehen: README.md, Abschnitt "Platzhalter ersetzen".
#
# Solarbank & PV im Owlet-Stil. Zeigt nur, was der Energiefluss nicht zeigt:
# Betriebszustand als Badge (Uebersetzung wie in energie-pv-karte.yaml),
# AC-Hausabgabe, Akkuenergie, Solarertrag heute und die vier PV-Strings als
# Balken mit ihrem Anteil an der Solarleistung. Ladestand, Akku- und
# Solarleistung stehen im Energiefluss.
#
# Ersetzt in der Energie-View die Abschnitte "Solarbank 3 Pro" und
# "PV Module" aus energie-pv-karte.yaml (bleibt als aeltere Variante).
#
# Voraussetzung: custom:button-card + card-mod (HACS), Templates aus
# energie-templates.yaml (energie_kopf, energie_kachel_klein).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 12px !important;
    }
cards:
- type: custom:button-card
  template: energie_kopf
  entity: sensor.solarbank_3_e2700_pro_betriebszustand
  icon: mdi:battery-charging-high
  name: Solarbank & PV
  label: |
    [[[
      const s=states['sensor.solarbank_3_e2700_pro_solarleistung']; const v=s?parseFloat(s.state):NaN;
      return 'Solarleistung ' + (isNaN(v)?'–':Math.round(v)+' W');
    ]]]
  triggers_update:
  - sensor.solarbank_3_e2700_pro_betriebszustand
  - sensor.solarbank_3_e2700_pro_solarleistung
  tap_action:
    action: more-info
  custom_fields:
    badge: |
      [[[
        const bz=(typeof entity!=='undefined')?entity:null;
        const bzMap={
          'detection':'Erkennung','bypass':'Nulleinspeisung','discharge':'Entladen',
          'charge':'Laden','charge_bypass':'Überschussladung','charge_priority':'Vorrangladung',
          'full_bypass':'Voller Bypass','wakeup':'Aufwachen','standby':'Standby',
          'protection_charge':'Schutzladung','output':'Ausgabe'
        };
        let t = bz ? bz.state : '–';
        if (bz) {
          try { const f=(typeof hass!=='undefined'&&hass&&typeof hass.formatEntityState==='function')?hass.formatEntityState(bz):null; if(f&&f!==bz.state) t=f; } catch(e){}
          if (t===bz.state && bzMap[bz.state]) t=bzMap[bz.state];
          if (t===bz.state) t=String(bz.state).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
        }
        return `<span style="display:inline-flex;align-items:center;gap:6px;color:#7fb3d5;background:#7fb3d51f;border:1px solid #7fb3d53d;font-size:12px;font-weight:700;padding:6px 11px;border-radius:12px;white-space:nowrap;"><ha-icon icon="mdi:state-machine" style="--mdc-icon-size:14px;"></ha-icon>${t}</span>`;
      ]]]
- type: grid
  cards:
  - type: custom:button-card
    template: energie_kachel_klein
    entity: sensor.solarbank_3_e2700_pro_ac_hausabgabe
    icon: mdi:home-import-outline
    name: Hausabgabe
    variables:
      accent: '#7fb3d5'
      decimals: 0
      unit: W
  - type: custom:button-card
    template: energie_kachel_klein
    entity: sensor.solarbank_3_e2700_pro_akkuenergie
    icon: mdi:home-battery-outline
    name: Akkuenergie
    variables:
      accent: '#7fb3d5'
      decimals: 0
      unit: Wh
  - type: custom:button-card
    template: energie_kachel_klein
    entity: sensor.pv_anlage_taglicher_solarertrag
    icon: mdi:solar-power
    name: Ertrag heute
    variables:
      accent: '#e6c15a'
      decimals: 2
      unit: kWh
  columns: 3
  square: false
- type: custom:button-card
  entity: sensor.solarbank_3_e2700_pro_solarleistung
  show_icon: false
  show_name: false
  show_label: false
  show_state: false
  triggers_update:
  - sensor.solarbank_3_e2700_pro_solar_pv1
  - sensor.solarbank_3_e2700_pro_solar_pv2
  - sensor.solarbank_3_e2700_pro_solar_pv3
  - sensor.solarbank_3_e2700_pro_solar_pv4
  tap_action:
    action: more-info
  custom_fields:
    pv: |
      [[[
        const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
        const pv=[1,2,3,4].map(i=>g('sensor.solarbank_3_e2700_pro_solar_pv'+i));
        const tot=pv.reduce((a,v)=>a+(isNaN(v)?0:v),0);
        const rows=pv.map((v,i)=>{ const p=tot>0&&!isNaN(v)?v/tot*100:0; const c=v>0?'#e6c15a':'#6e7988';
          return `<div style="display:grid;grid-template-columns:36px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:12.5px;color:#b4c0cf;font-variant-numeric:tabular-nums;">
            <span>PV${i+1}</span><div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.05);overflow:hidden;"><div style="height:100%;width:${p.toFixed(1)}%;border-radius:6px;background:${c};"></div></div>
            <b style="color:#f2f5f8;font-weight:700;text-align:right;">${isNaN(v)?'–':Math.round(v)+' W'}</b></div>`; }).join('');
        return `<div style="display:flex;flex-direction:column;gap:9px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px;">
            <span style="font-size:12px;color:#8794a5;">PV-Strings · Anteil an der Solarleistung</span>
            <b style="font-size:13px;color:#f2f5f8;font-variant-numeric:tabular-nums;">${Math.round(tot)} W</b></div>${rows}</div>`;
      ]]]
  styles:
    card:
    - background: rgba(255,255,255,0.028)
    - border: 1px solid rgba(255,255,255,0.06)
    - border-radius: 16px
    - box-shadow: none
    - padding: 12px 14px
    custom_fields:
      pv:
      - width: 100%
      - text-align: left
    grid:
    - grid-template-areas: '"pv"'
