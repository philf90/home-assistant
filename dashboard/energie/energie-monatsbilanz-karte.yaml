      - entity: input_number.energie_monatsbilanz_jahr
        name: Prognose Netzbezug
        type: line
        color: '#f0736a'
        yaxis_id: kwh
        curve: smooth
        stroke_width: 2
        stroke_dash: 2
        extend_to: false
        unit: kWh
        float_precision: 1
        show:
          legend_value: false
          in_legend: false
        data_generator: |
          const ID = 'sensor.hmip_esi_stromzahler_energiezahler_ch2';
          const SCHWELLE = 0.10; // hoechstens 10 % mittlere Abweichung im Rueckblick
          const tz = hass.config.time_zone;
          const jetzt = moment.tz(tz);
          const wahl = parseInt(entity.state, 10);
          const jahr = wahl >= 2000 ? wahl : jetzt.year();
          const anfang = moment.tz([jahr, 0, 1], tz);
          const x = (m) => moment.tz([jetzt.year(), m, 1], tz).valueOf();
          const rund = (v) => Math.round(v * 10) / 10;
          const lade = async (von, bis) => {
            const res = await hass.callWS({
              type: 'recorder/statistics_during_period',
              start_time: von.toISOString(),
              end_time: bis.toISOString(),
              statistic_ids: [ID],
              period: 'month',
              types: ['change'],
            });
            const o = {};
            (res[ID] || []).forEach((r) => {
              o[moment.tz(r.start, tz).format('YYYY-MM')] = r.change;
            });
            return o;
          };
          // Immer 12 Punkte, sonst zeigt der gemeinsame Tooltip nicht alle Serien.
          const out = [];
          for (let m = 0; m < 12; m++) out.push([x(m), null]);
          if (jahr !== jetzt.year()) return out;
          const lauf = jetzt.clone().startOf('month');
          const z = await lade(lauf.clone().subtract(16, 'months'), lauf);
          const wert = (k) => {
            const v = z[lauf.clone().subtract(k, 'months').format('YYYY-MM')];
            return v == null ? null : v;
          };
          // Rueckblick: dieselbe Prognose fuer die letzten 12 Monate nachrechnen.
          const fehler = [];
          for (let k = 1; k <= 12; k++) {
            const w = [k + 3, k + 2, k + 1, k].map(wert);
            if (w.includes(null)) break;
            const ist = (w[1] + w[2] + w[3]) / 3;
            const prog = (w[1] + w[2] + (w[0] + w[1] + w[2]) / 3) / 3;
            fehler.push(Math.abs(prog - ist) / ist);
          }
          const mittel = fehler.reduce((s, f) => s + f, 0) / fehler.length;
          if (fehler.length < 6 || !(mittel <= SCHWELLE)) return out;
          const a = [3, 2, 1].map(wert);
          const i = lauf.month();
          out[i][1] = rund((a[1] + a[2] + (a[0] + a[1] + a[2]) / 3) / 3);
          if (i > 0) out[i - 1][1] = rund((a[0] + a[1] + a[2]) / 3);
          return out;
