# ============================================================================
# Monatsbilanz Strom – Netzbezug, Solarertrag, Autarkie je Monat
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       energie
# Status:        aktiv
# Karten:        apexcharts-card, auto-entities, button-card, card-mod
# Templates:     energie_mb_kachel (energie-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   sensor.pv_anlage_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Monatsbilanz Strom im Nachtblau-Stil: Netzbezug und Solarertrag je Monat eines
# Kalenderjahres als Saeulen, dazu je eine Trendlinie (gleitender
# 3-Monats-Durchschnitt). Unter dem Diagramm waehlen Chips das Jahr; ohne
# Auswahl zeigt die Karte das laufende Jahr. Noch nicht begonnene Monate
# bleiben leer.
#
# Datenquelle ist die Langzeitstatistik des Recorders, abgefragt per
# recorder/statistics_during_period (period: month, types: change) direkt an
# den Zaehlern:
#   - Netzbezug:   sensor.hmip_esi_stromzahler_energiezahler_ch2
#   - Solarertrag: sensor.pv_anlage_taglicher_solarertrag
#                  (Tageszaehler, total_increasing; der taegliche Reset wird
#                  von der Statistik als Zaehlerreset verbucht)
# Die IDs stehen als Konstante ID am Anfang jedes Generators.
#
# Jahresauswahl: Helfer input_number.energie_monatsbilanz_jahr
#   (Einstellungen -> Helfer -> Zahlenwert: min 0, max 2100, Schritt 1,
#   Eingabefeld). 0 = laufendes Jahr, sonst die Jahreszahl. Die Chips setzen
#   ihn; der Chip des laufenden Jahres setzt 0, damit die Karte an Neujahr von
#   selbst ins neue Jahr wechselt. Die Chips erzeugt auto-entities aus einer
#   Vorlage mit range(ERSTES_JAHR, now().year + 1) -- jedes neue Jahr bekommt
#   so ohne Zutun seinen Chip. ERSTES_JAHR in der Vorlage anpassen. Die
#   Auswahl gilt fuer alle Geraete, die das Dashboard zeigen.
#
# Kennzahlen ueber dem Diagramm: Netzbezug, Solarertrag und Autarkie des
# gewaehlten Jahres. Sie rechnen aus derselben Statistik wie die Saeulen und
# folgen der Jahresauswahl (Template energie_mb_kachel, Daten ueber
# energie_mb_daten aus energie-templates.yaml). Fruehere Fassungen
# zeigten hier die Utility-Meter des laufenden Jahres und Monats; die folgten
# der Jahresauswahl nicht, und die Balkonkraftwerk-Kachel mass die Abgabe am
# Shelly-Stecker statt des Solarertrags der Saeulen (Oktober 2026: 62,5 gegen
# 67,6 kWh).
#
# Warum die Serien den Helfer als entity haben: apexcharts-card laedt nur dann
# neu, wenn sich eine Entitaet einer Serie aendert, und nur ohne
# update_interval. Mit dem Helfer laedt das Diagramm rund 1,5 s nach dem
# Antippen eines Chips neu; die unsichtbare Serie mit sensor.date sorgt
# zusaetzlich fuer ein Neuladen nach Mitternacht. Die Zaehler selbst als
# entity wuerden bei jeder Zaehleraenderung (etwa minuetlich) neu laden.
#
# Achse: Die Karte zeichnet jedes gewaehlte Jahr auf die Monate des
# laufenden Jahres (span start: year), denn graph_span/span sind fest und
# kennen kein waehlbares Jahr. Die Achse zeigt nur Monatsnamen; das Jahr
# steht in der Kopfzeile, der Tooltip nennt deshalb nur den Monat.
#
# Trend: Durchschnitt aus dem Monat und den zwei Vormonaten (fuer Januar
# aus dem Vorjahr). Der laufende Monat ist unvollstaendig und zaehlt nicht.
# Prognose (gepunktet, nur im laufenden Jahr): Trendwert fuer den laufenden
# Monat, wobei der Monat selbst durch den Durchschnitt der letzten drei
# abgeschlossenen Monate ersetzt wird. Gezeichnet wird sie nur, wenn dieselbe
# Prognose fuer die letzten 12 Monate (mindestens 6) im Mittel hoechstens
# SCHWELLE (10 %) danebenlag. Weiter als einen Monat sagt die Karte nichts
# voraus: Im Rueckblick lag der Fehler ab zwei Monaten bei 15 % und mehr.
#
# Autarkie je Monat: eigene Serie "Autarkie in %" als Zeile von Schildern
# oben im Diagramm, je Schild ueber den Saeulen seines Monats. Autarkie =
# 1 - Netznutzung / Hausverbrauch (sensor.pv_anlage_tagliche_netznutzung,
# sensor.pv_anlage_taglicher_hausverbrauch), wie Tageszeile und Kachel. Die
# Serie liegt auf einer unsichtbaren Achse "band" (0..1) bei 0,97; der
# Prozentwert steckt in den Nachkommastellen (0,97 + Prozent / 1e6), daraus
# lesen Datenlabel und Tooltip ihn. Ein Streifen unter dem Diagramm liess sich
# den Monaten nicht sicher zuordnen. In den Schildern steht nur die Zahl: Mit
# "%" ueberlappten sie bei 380 px Kartenbreite, und ApexCharts blendete jedes
# zweite aus. Mit mehr als einer Achse braucht jede Serie ein yaxis_id.
#
# Farben: apexcharts-card zeichnet bei einem Wechsel zwischen hell und dunkel
# nicht neu (v2.2.3 reagiert nur auf Aenderungen der Serien-Entitaeten, hier
# Jahr-Helfer und sensor.date). Die Diagrammfarben stehen deshalb im
# card_mod-CSS der Diagrammkarte als var(--nachtblau-...) mit dem dunklen Wert als
# Ersatz: CSS ueberschreibt die Farbattribute von ApexCharts und folgt dem
# Modus sofort. Die Farben unter series und apex_config gelten nur ohne
# card-mod und sind die dunklen Werte. Im CSS stehen die Serien nach Index
# (Reihenfolge unter series), die Legende nach rel = Index + 1; wer Serien
# umsortiert, passt dort die Zuordnung an. PV-Saeulen sind in beiden Modi
# hellgelb gefuellt (#e6c15a) mit 1,5 px Rand in nachtblau-sonnengelb-grafik,
# PV-Linien nutzen nachtblau-sonnengelb-grafik: Im hellen Modus waeren gelbe
# Saeulen im Tiefton so dunkel wie die roten Netzsaeulen (DESIGN.md,
# Sonnengelb in Grafiken). Leere Monate (barHeight 0) bekommen keinen Rand,
# sonst stuende dort ein Strich auf der Nulllinie.
# Der Grund der Autarkie-Schilder deckt im hellen Modus 0,12 statt 0,16:
# ApexCharts toent ihn in der Schriftfarbe, bei 0,16 laege die Schrift mit
# 4,39:1 unter 4,5:1 (bei 0,12: 4,66:1).
#
# Voraussetzung: custom:button-card + card-mod + custom:apexcharts-card
# (ab v2.0, data_generator laeuft dort als async-Funktion; getestet v2.2.3)
# + custom:auto-entities (getestet v1.16.1) + Templates aus
# energie-templates.yaml (energie_mb_daten, energie_mb_kachel).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%) !important;
      border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 16px 18px !important;
      gap: 6px !important;
    }
cards:
  - type: custom:button-card
    entity: input_number.energie_monatsbilanz_jahr
    icon: mdi:chart-bar
    name: Monatsbilanz
    label: |
      [[[
        const n = new Date();
        const w = parseInt(entity ? entity.state : '0', 10);
        const j = w >= 2000 ? w : n.getFullYear();
        const M = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
          'August', 'September', 'Oktober', 'November', 'Dezember'];
        const lauf = j === n.getFullYear() ? ' · ' + M[n.getMonth()] + ' läuft' : '';
        return j + lauf + ' · Netzbezug & Solarertrag';
      ]]]
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 8px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: min-content 1fr
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)'
        - border: '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)'
      icon:
        - width: 23px
        - height: 23px
        - color: 'var(--nachtblau-gruen, #a6d49e)'
        - --ha-icon-display: block
      name:
        - justify-self: start
        - align-self: end
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--nachtblau-text, #f2f5f8)'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12.5px
        - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
        - margin-top: 1px
  # Kennzahlen des gewaehlten Jahres aus der Langzeitstatistik.
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: energie_mb_kachel
        variables:
          was: netz
          titel: Netzbezug
          accent: 'var(--nachtblau-rot, #f0736a)'
      - type: custom:button-card
        template: energie_mb_kachel
        variables:
          was: solar
          titel: Solarertrag
          accent: 'var(--nachtblau-sonnengelb, #e6c15a)'
      - type: custom:button-card
        template: energie_mb_kachel
        variables:
          was: autarkie
          titel: Autarkie
          accent: 'var(--nachtblau-mint, #89d2b0)'
  - type: custom:apexcharts-card
    # Januar bis Dezember des laufenden Jahres: Das Fenster beginnt einen
    # halben Monat frueher (Januar-Saeule ganz sichtbar) und endet um den
    # 22. Dezember. Bei 365d reichte es bis zum 1. Januar, und die Achse
    # zeigte dort ein zusaetzliches "Jan".
    graph_span: 355d
    span:
      start: year
      offset: -15d
    header:
      show: false
    card_mod:
      style: |
        ha-card {
          background: none !important;
          border: none !important;
          box-shadow: none !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        /* ApexCharts 5.3.3: Legendentext liegt sonst ueber dem Farbpunkt */
        .apexcharts-legend-text { margin-left: 0 !important; padding-left: 6px !important; }
        /* Farben je Modus, siehe Kopfkommentar: Serien nach Index, Legende nach rel = Index + 1 */
        .apexcharts-series[data\:realIndex="0"], .apexcharts-series[data\:realIndex="2"], .apexcharts-series[data\:realIndex="4"],
        .apexcharts-legend-series[rel="1"], .apexcharts-legend-series[rel="3"], .apexcharts-legend-series[rel="5"] { --mb-c: var(--nachtblau-rot, #f0736a); }
        .apexcharts-series[data\:realIndex="1"], .apexcharts-series[data\:realIndex="3"], .apexcharts-series[data\:realIndex="5"],
        .apexcharts-legend-series[rel="2"], .apexcharts-legend-series[rel="4"], .apexcharts-legend-series[rel="6"] { --mb-c: var(--nachtblau-sonnengelb-grafik, #e6c15a); }
        .apexcharts-series[data\:realIndex="6"], .apexcharts-legend-series[rel="7"] { --mb-c: var(--nachtblau-mint, #89d2b0); }
        .apexcharts-bar-area { fill: var(--mb-c); stroke: var(--mb-c); }
        .apexcharts-line { stroke: var(--mb-c); }
        .apexcharts-marker { fill: var(--mb-c); stroke: var(--nachtblau-huelle-unten, #171d29); }
        .apexcharts-datalabel { fill: var(--nachtblau-mint, #89d2b0); }
        .apexcharts-datalabels rect { fill: var(--nachtblau-mint, #89d2b0); stroke: var(--nachtblau-mint, #89d2b0); opacity: calc(12% + 0.04 * var(--nachtblau-dunkel-anteil, 100%)); }
        .apexcharts-xaxis-label, .apexcharts-yaxis-label { fill: var(--nachtblau-text-sekundaer, #8794a5); }
        .apexcharts-legend-text { color: var(--nachtblau-text-sekundaer, #8794a5) !important; }
        .apexcharts-gridline { stroke: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)); }
        /* Tooltips folgen dem Modus wie Popups (erhoehte Flaeche); ApexCharts faerbt sie sonst fest dunkel (tooltip.theme) */
        .apexcharts-tooltip, .apexcharts-xaxistooltip, .apexcharts-yaxistooltip { background: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; color: var(--nachtblau-text, #f2f5f8) !important; border: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-tooltip { box-shadow: 0 8px 20px -10px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7)) !important; }
        .apexcharts-tooltip-title { background: var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028)) !important; border-bottom: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-bottom::before { border-bottom-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
        .apexcharts-xaxistooltip-top::before { border-top-color: var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)) !important; }
        .apexcharts-xaxistooltip-top::after { border-top-color: var(--nachtblau-flaeche-erhoeht, #222b3c) !important; }
        /* Punkt im Tooltip: Serienfarbe des Modus statt der dunklen aus series */
        .apexcharts-tooltip-series-group-0 .apexcharts-tooltip-marker, .apexcharts-tooltip-series-group-2 .apexcharts-tooltip-marker, .apexcharts-tooltip-series-group-4 .apexcharts-tooltip-marker { color: var(--nachtblau-rot, #f0736a) !important; }
        .apexcharts-tooltip-series-group-1 .apexcharts-tooltip-marker, .apexcharts-tooltip-series-group-3 .apexcharts-tooltip-marker, .apexcharts-tooltip-series-group-5 .apexcharts-tooltip-marker { color: var(--nachtblau-sonnengelb-grafik, #e6c15a) !important; }
        .apexcharts-tooltip-series-group-6 .apexcharts-tooltip-marker { color: var(--nachtblau-mint, #89d2b0) !important; }
        /* PV-Saeulen: hellgelbe Fuellung, Rand im Grafik-Ton (hell 3,65:1 zur Huelle) */
        .apexcharts-series[data\:realIndex="1"] .apexcharts-bar-area:not([barHeight="0"]), .apexcharts-legend-series[rel="2"] .apexcharts-marker { fill: #e6c15a; stroke: var(--nachtblau-sonnengelb-grafik, #e6c15a); stroke-width: 1.5px; }
        .apexcharts-series .apexcharts-bar-area[barHeight="0"] { stroke-width: 0; }
        /* Schmale Bildschirme (z. B. 360 px breites Handy): Monatsnamen kleiner, damit sie sich nicht ueberlappen.
           Kein labels.formatter: damit erzeugt ApexCharts auf der Datumsachse nur noch drei Teilstriche. */
        @media (max-width: 380px) { .apexcharts-xaxis-label { font-size: 10px !important; } }
    apex_config:
      chart:
        background: transparent
        fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
        foreColor: '#8794a5'
        height: 260
        toolbar:
          show: false
        zoom:
          enabled: false
      plotOptions:
        bar:
          columnWidth: 62%
          borderRadius: 4
          borderRadiusApplication: end
      # Nur die Serie "Autarkie in %" (show.datalabels); Wert siehe Kopf.
      dataLabels:
        enabled: true
        formatter: |
          EVAL:function(v) {
            // Prozentwert aus den Nachkommastellen, siehe data_generator der Serie 'Autarkie in %'
            if (v === null || v === undefined || isNaN(v)) return '';
            return String(Math.round((v - 0.97) * 1e6));
          }
        style:
          fontSize: 10px
          fontWeight: 700
          colors: ['#89d2b0']
        background:
          enabled: true
          foreColor: '#89d2b0'
          borderRadius: 5
          padding: 3
          opacity: 0.16
          borderWidth: 1
          borderColor: '#89d2b0'
        dropShadow:
          enabled: false
      grid:
        borderColor: rgba(255,255,255,0.06)
        strokeDashArray: 3
      # Groesse je Serie in der Reihenfolge unten: nur die Prognose bekommt
      # Punkte, damit ihr Wert auch allein sichtbar ist.
      markers:
        size: [0, 0, 0, 0, 4, 4, 0]
        strokeWidth: 2
        strokeColors: '#171d29'
      # Die Prognose-Serien stehen nicht in der Legende: ApexCharts kann eine
      # Serie ohne Werte dort nicht ausblenden. Der Tooltip benennt sie.
      legend:
        show: true
        position: bottom
        fontSize: 11px
        labels:
          colors: '#8794a5'
        # 0 fuer die beiden Prognose-Serien, sonst bliebe ihr Farbpunkt stehen.
        markers:
          size: [5, 5, 5, 5, 0, 0]
          strokeWidth: 0
      tooltip:
        theme: dark
        shared: true
        intersect: false
        x:
          formatter: |
            EVAL:function(val) {
              return new Date(val).toLocaleDateString('de-DE', { month: 'long' });
            }
        # Ersetzt den Formatter der Karte, der fehlende Werte als "null kWh"
        # ausgibt. Die Autarkie-Serie zeigt ihren Prozentwert.
        y:
          formatter: |
            EVAL:function(v, o) {
              if (v === null || v === undefined || isNaN(v)) return '–';
              if (o && o.w && o.w.config.series[o.seriesIndex] && o.w.config.series[o.seriesIndex].name === 'Autarkie in %') {
                return Math.round((v - 0.97) * 1e6) + ' %';
              }
              return v.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kWh';
            }
      xaxis:
        labels:
          format: MMM
          hideOverlappingLabels: false
          rotate: 0
        tooltip:
          enabled: false
        axisBorder:
          show: false
        axisTicks:
          show: false
    # Gleiche Skala fuer alle Jahre (0-600 kWh), damit sich Jahre beim
    # Umschalten vergleichen lassen. "~600" ist eine weiche Grenze: Liegt ein
    # Monat darueber, waechst die Achse auf das naechste Vielfache von 150.
    # "band" traegt nur die Autarkie-Schilder und bleibt unsichtbar.
    yaxis:
      - id: kwh
        min: 0
        max: '~600'
        decimals: 0
        align_to: 150
        apex_config:
          tickAmount: 4
      - id: band
        show: false
        min: 0
        max: 1
    series:
      - entity: input_number.energie_monatsbilanz_jahr
        name: Netzbezug
        type: column
        color: '#f0736a'
        yaxis_id: kwh
        unit: kWh
        float_precision: 1
        show:
          legend_value: false
        data_generator: |
          const ID = 'sensor.hmip_esi_stromzahler_energiezahler_ch2';
          const tz = hass.config.time_zone;
          const jetzt = moment.tz(tz);
          const wahl = parseInt(entity.state, 10);
          const jahr = wahl >= 2000 ? wahl : jetzt.year();
          const anfang = moment.tz([jahr, 0, 1], tz);
          const x = (m) => moment.tz([jetzt.year(), m, 1], tz).valueOf();
          const rund = (v) => Math.round(v * 10) / 10;
          const lade = async (von, bis) => {
            const res = await hass.callWS({
              type: 'recorder/statistics_during_period',
              start_time: von.toISOString(),
              end_time: bis.toISOString(),
              statistic_ids: [ID],
              period: 'month',
              types: ['change'],
            });
            const o = {};
            (res[ID] || []).forEach((r) => {
              o[moment.tz(r.start, tz).format('YYYY-MM')] = r.change;
            });
            return o;
          };
          const z = await lade(anfang, anfang.clone().add(1, 'year'));
          const out = [];
          for (let m = 0; m < 12; m++) {
            const v = z[anfang.clone().add(m, 'months').format('YYYY-MM')];
            out.push([x(m), v == null ? null : rund(v)]);
          }
          return out;
      - entity: input_number.energie_monatsbilanz_jahr
        name: Solarertrag
        type: column
        color: '#e6c15a'
        yaxis_id: kwh
        unit: kWh
        float_precision: 1
        show:
          legend_value: false
        data_generator: |
          const ID = 'sensor.pv_anlage_taglicher_solarertrag';
          const tz = hass.config.time_zone;
          const jetzt = moment.tz(tz);
          const wahl = parseInt(entity.state, 10);
          const jahr = wahl >= 2000 ? wahl : jetzt.year();
          const anfang = moment.tz([jahr, 0, 1], tz);
          const x = (m) => moment.tz([jetzt.year(), m, 1], tz).valueOf();
          const rund = (v) => Math.round(v * 10) / 10;
          const lade = async (von, bis) => {
            const res = await hass.callWS({
              type: 'recorder/statistics_during_period',
              start_time: von.toISOString(),
              end_time: bis.toISOString(),
              statistic_ids: [ID],
              period: 'month',
              types: ['change'],
            });
            const o = {};
            (res[ID] || []).forEach((r) => {
              o[moment.tz(r.start, tz).format('YYYY-MM')] = r.change;
            });
            return o;
          };
          const z = await lade(anfang, anfang.clone().add(1, 'year'));
          const out = [];
          for (let m = 0; m < 12; m++) {
            const v = z[anfang.clone().add(m, 'months').format('YYYY-MM')];
            out.push([x(m), v == null ? null : rund(v)]);
          }
          return out;
      - entity: input_number.energie_monatsbilanz_jahr
        name: Trend Netzbezug
        type: line
        color: '#f0736a'
        yaxis_id: kwh
        curve: smooth
        stroke_width: 2
        stroke_dash: 5
        extend_to: false
        unit: kWh
        float_precision: 1
        show:
          legend_value: false
        data_generator: |
          const ID = 'sensor.hmip_esi_stromzahler_energiezahler_ch2';
          const tz = hass.config.time_zone;
          const jetzt = moment.tz(tz);
          const wahl = parseInt(entity.state, 10);
          const jahr = wahl >= 2000 ? wahl : jetzt.year();
          const anfang = moment.tz([jahr, 0, 1], tz);
          const x = (m) => moment.tz([jetzt.year(), m, 1], tz).valueOf();
          const rund = (v) => Math.round(v * 10) / 10;
          const lade = async (von, bis) => {
            const res = await hass.callWS({
              type: 'recorder/statistics_during_period',
              start_time: von.toISOString(),
              end_time: bis.toISOString(),
              statistic_ids: [ID],
              period: 'month',
              types: ['change'],
            });
            const o = {};
            (res[ID] || []).forEach((r) => {
              o[moment.tz(r.start, tz).format('YYYY-MM')] = r.change;
            });
            return o;
          };
          const z = await lade(anfang.clone().subtract(2, 'months'), anfang.clone().add(1, 'year'));
