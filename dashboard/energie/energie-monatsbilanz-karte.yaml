            fehler.push(Math.abs(prog - ist) / ist);
          }
          const mittel = fehler.reduce((s, f) => s + f, 0) / fehler.length;
          if (fehler.length < 6 || !(mittel <= SCHWELLE)) return out;
          const a = [3, 2, 1].map(wert);
          const i = lauf.month();
          out[i][1] = rund((a[1] + a[2] + (a[0] + a[1] + a[2]) / 3) / 3);
          if (i > 0) out[i - 1][1] = rund((a[0] + a[1] + a[2]) / 3);
          return out;
      - entity: input_number.energie_monatsbilanz_jahr
        name: Autarkie in %
        type: line
        color: '#89d2b0'
        yaxis_id: band
        stroke_width: 0
        extend_to: false
        show:
          datalabels: true
          legend_value: false
        data_generator: |
          const IDS = ['sensor.pv_anlage_taglicher_hausverbrauch', 'sensor.pv_anlage_tagliche_netznutzung'];
          const tz = hass.config.time_zone;
          const jetzt = moment.tz(tz);
          const wahl = parseInt(entity.state, 10);
          const jahr = wahl >= 2000 ? wahl : jetzt.year();
          const anfang = moment.tz([jahr, 0, 1], tz);
          const x = (m) => moment.tz([jetzt.year(), m, 1], tz).valueOf();
          const res = await hass.callWS({
            type: 'recorder/statistics_during_period',
            start_time: anfang.toISOString(),
            end_time: anfang.clone().add(1, 'year').toISOString(),
            statistic_ids: IDS,
            period: 'month',
            types: ['change'],
          });
          const monat = (id) => {
            const o = {};
            (res[id] || []).forEach((r) => {
              o[moment.tz(r.start, tz).format('YYYY-MM')] = r.change;
            });
            return o;
          };
          const haus = monat(IDS[0]);
          const netz = monat(IDS[1]);
          // Autarkie = 1 - Netznutzung / Hausverbrauch (Anker-System, wie Tageszeile und Kachel).
          // Die Zeile steht oben im Diagramm: Achse 'band' (0..1), Lage 0,97. Der Prozentwert
          // steckt in den Nachkommastellen (0,97 + Prozent / 1e6); Label und Tooltip lesen ihn
          // dort heraus. Die Lage verschiebt sich dadurch um hoechstens 0,01 %.
          const out = [];
          for (let m = 0; m < 12; m++) {
            const k = anfang.clone().add(m, 'months').format('YYYY-MM');
            const h = haus[k];
            const n = netz[k];
            const a = (h == null || n == null || h <= 0) ? null : Math.round(Math.max(0, Math.min(1, 1 - n / h)) * 100);
            out.push([x(m), a === null ? null : 0.97 + a / 1e6]);
          }
          return out;
      # Unsichtbar: laedt das Diagramm nach Mitternacht neu.
      - entity: sensor.date
        name: Datum
        show:
          in_chart: false
          in_legend: false
        data_generator: return [];
  - type: custom:auto-entities
    card_param: cards
    card:
      type: horizontal-stack
      card_mod:
        style: |
          #root { gap: 6px !important; }
    filter:
      template: |
        {% set ERSTES_JAHR = 2024 %}
        {% set jetzt = now().year %}
        {% set wahl = states('input_number.energie_monatsbilanz_jahr') | int(0) %}
        {% set aktiv = wahl if ERSTES_JAHR <= wahl <= jetzt else jetzt %}
        [{% for j in range(ERSTES_JAHR, jetzt + 1) %}
          {% set an = j == aktiv %}
          {'type': 'custom:button-card',
           'name': '{{ j }}',
           'show_icon': False,
           'tap_action': {'action': 'perform-action',
                          'perform_action': 'input_number.set_value',
                          'target': {'entity_id': 'input_number.energie_monatsbilanz_jahr'},
                          'data': {'value': {{ 0 if j == jetzt else j }}}},
           'styles': {'card': [{'border-radius': '999px'}, {'padding': '7px 4px'},
                               {'box-shadow': 'none'},
                               {'background': '{{ 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)' if an else 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))' }}'},
                               {'border': '1px solid {{ 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)' if an else 'color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))' }}'}],
                      'name': [{'font-size': '12.5px'}, {'font-weight': 600},
                               {'font-variant-numeric': 'tabular-nums'},
                               {'color': '{{ 'var(--nachtblau-text, #f2f5f8)' if an else 'var(--nachtblau-text-sekundaer, #8794a5)' }}'}]}},
        {% endfor %}]
