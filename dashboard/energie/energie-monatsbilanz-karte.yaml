          const wert = (k) => {
            const v = z[lauf.clone().subtract(k, 'months').format('YYYY-MM')];
            return v == null ? null : v;
          };
          // Rueckblick: dieselbe Prognose fuer die letzten 12 Monate nachrechnen.
          const fehler = [];
          for (let k = 1; k <= 12; k++) {
            const w = [k + 3, k + 2, k + 1, k].map(wert);
            if (w.includes(null)) break;
            const ist = (w[1] + w[2] + w[3]) / 3;
