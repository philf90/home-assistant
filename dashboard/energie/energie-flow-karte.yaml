# ============================================================================
# Energiefluss – animiertes Diagramm mit Autarkie
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       energie
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   sensor.pv_anlage_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Energiefluss-Diagramm (Konzept A · dynamischer Faecher, v2) im Owlet-Look
# ============================================================================
# Quellen oben (Solar + Akku), Netz links, Haus mittig; die aktiven Live-
# Verbraucher haengen auf einem flachen Bogen darunter. Entwurf, Messwerte
# und Begruendung: energiefluss.html.
#
# AUTARKIE: Der Kopf zeigt die Autarkie jetzt, die Tageszeile die Autarkie
# heute als Ring links neben dem Herkunftsbalken (beides 1 - Netz / Haus,
# wie die Monatsbilanz). Unter dem Balken steht die Einspeisung heute
# (sensor.solar_uberschuss_daily), getrennt, weil sie nicht zum
# Hausverbrauch gehoert.
#
# ANIMATION: Lichtstriche (stroke-dasharray) statt SMIL-Punkten. Breite und
# Tempo wachsen logarithmisch mit der Leistung, gerastert in 6 Stufen
# (n = log10(1 + P/10) / log10(301), Obergrenze 3000 W). Die Phase haengt an
# der Uhrzeit (negativer animation-delay): Die Karte zeichnet bei jedem
# Sensor-Update neu (gemessen etwa alle 2 s), der Fluss laeuft trotzdem ohne
# Sprung weiter. Nur die Hauptquelle pulsiert. "Bewegung reduzieren" am Geraet
# zeigt ein Standbild.
#
# RINGE: Akku = Ladestand, Solar = Anteil an PV_PEAK (1828 W, hoechster
# gemessener Wert, Juni 2026), Haus = Quellenmix (PV/Akku/Netz), Verbraucher
# = Anteil am Hausverbrauch. Bezugsgroesse dafuer ist der groessere Wert aus
# Hausbedarf und Summe der gemessenen Verbraucher: Die Anlage meldet nur etwa
# alle 5 min (gemessen 17.10.2026), die Shelly-Stecker alle 5-7 s. Ohne das
# zeigte ein PC, der gerade von 200 auf 900 W springt, bis zu 5 min mehr als
# das ganze Haus (Ring voll, Anteile zusammen > 100 %). Die Zahl im Haus-Knoten bleibt
# der Anlagenwert, passend zur Autarkie.
#
# VERBRAUCHER: nur > 0 W, absteigend. Der nicht zugeordnete Rest
# (Haus minus Summe, auf 0 begrenzt) erscheint ab 15 W als "Sonstige".
# Hoechstens 6 Knoten: sonst bleiben die 5 groessten stehen, der Rest wandert
# in "Sonstige" (Anzahl als "+n"). Grund: bei 7 Knoten ueberlappen die Namen.
# Ausnahme pin:true (PC): ab 15 W (TH, PC laeuft) behaelt er immer einen der
# 5 Plaetze, auch wenn andere Geraete mehr ziehen; darunter (Standby) zaehlt
# er wie alle anderen. Die Geraete sind dieselben wie in
# energie-verbraucher-karte.yaml; ein neues Geraet in beiden Karten eintragen.
#
# FARBEN nach DESIGN.md: Hausgeraete und Heizluefter #e6b566, Server/Pool
# #7fd0d5, PoE, Schreibtisch und PC #b399d4 (Geraete), TV und Klima #7fb3d5,
# Garten #bdd27f, Heizung #79b8c9, Sonstige neutral. Netzbezug rot, Einspeisung/Autark Mint, PV
# Sonnengelb, Akku-Entladung blau, -Ladung gruen. Akku am SOC-Minimum ohne
# Leistung: Amber + "Reserve", rot nur darunter. Solar nachts: Mond in Indigo.
#
# KLICKBARKEIT: Quellen + Haus (feste Positionen) per transparenter
# type:image-Flaeche (more-info). Die Verbraucher-Knoten reflowen dynamisch
# und sind daher NICHT einzeln klickbar (Detail: "Verbraucher live"-Karte).
#
# Sensoren (W, ausser SOC): Solar solarleistung · Netz smart_meter_netzbezug
# (>0 Bezug) · Akku akkuleistung (>0 laedt) · SOC ladestand · akkuenergie (Wh)
# · soc_minimum (number) · Haus pv_anlage_hausbedarf · sun.sun · Tageswerte
# pv_anlage_taglicher_hausverbrauch, _tagliche_netznutzung,
# _tagliche_pv_hausabgabe, _tagliche_akku_hausabgabe (kWh).
#
# Voraussetzung: custom:button-card + card-mod (HACS). picture-elements = Core.
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
      border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
  # ---- Kopf: Zustandskachel, Autarkie jetzt, Badge ----
  - type: custom:button-card
    icon: mdi:transmission-tower
    name: Energiefluss
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action: { action: none }
    triggers_update:
      - sensor.smart_meter_netzbezug
      - sensor.pv_anlage_hausbedarf
      - sensor.pv_anlage_taglicher_hausverbrauch
      - sensor.pv_anlage_tagliche_netznutzung
    variables:
      zustand: |
        [[[
          const s=states['sensor.smart_meter_netzbezug']; const netz=s?parseFloat(s.state):NaN;
          if(isNaN(netz)) return {txt:'Keine Daten', c:'var(--owlet-text-sekundaer, #8794a5)'};
          if(netz>15) return {txt:'Netzbezug', c:'var(--owlet-rot, #f0736a)'};
          if(netz<-15) return {txt:'Einspeisung', c:'var(--owlet-mint, #89d2b0)'};
          return {txt:'Autark', c:'var(--owlet-mint, #89d2b0)'};
        ]]]
    label: |
      [[[
        const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
        const netz=g('sensor.smart_meter_netzbezug'), haus=g('sensor.pv_anlage_hausbedarf');
        const imp=(!isNaN(netz)&&netz>15)?netz:0;
        const jetzt=(!isNaN(haus)&&haus>0) ? Math.round(Math.max(0,Math.min(1,1-imp/haus))*100)+' %' : '–';
        return `Autarkie jetzt ${jetzt}`;
      ]]]
    custom_fields:
      badge: |
        [[[
          const z=variables.zustand, c=z.c;
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 24%, transparent);font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <span style="width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 0 3px color-mix(in srgb, ${c} 18%, transparent);"></span>${z.txt}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge" "i l badge"'
        - grid-template-columns: min-content 1fr min-content
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: '[[[ return "color-mix(in srgb, " + variables.zustand.c + " 16%, transparent)"; ]]]'
        - border: '[[[ return "1px solid color-mix(in srgb, " + variables.zustand.c + " 24%, transparent)"; ]]]'
      icon:
        - width: 23px
        - height: 23px
        - color: '[[[ return variables.zustand.c; ]]]'
        - --ha-icon-display: block
      name:
        - justify-self: start
        - align-self: end
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: 'var(--owlet-text, #f2f5f8)'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: 'var(--owlet-text-sekundaer, #8794a5)'
        - font-variant-numeric: tabular-nums
      custom_fields:
        badge: [ justify-self: end, align-self: center ]

  # ---- Diagramm ----
  - type: picture-elements
    image: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMzQwIj48L3N2Zz4="
    card_mod:
      style: |
        ha-card { background:none !important; border:none !important; box-shadow:none !important; }
    elements:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        triggers_update:
          - sensor.solarbank_3_e2700_pro_solarleistung
          - sensor.smart_meter_netzbezug
          - sensor.solarbank_3_e2700_pro_akkuleistung
          - sensor.solarbank_3_e2700_pro_ladestand
          - sensor.solarbank_3_e2700_pro_akkuenergie
          - number.solarbank_3_e2700_pro_soc_minimum
          - sensor.pv_anlage_hausbedarf
          - sun.sun
          - sensor.poe_power_total
          - sensor.stromverbrauch_hausgerate_aktuell
          - sensor.stromverbrauch_server_aktuell
          - sensor.shelly_plugs_fernseher_switch_0_power
          - sensor.shelly_outdoor_plugs_pool_switch_0_power
          - sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power
          - sensor.shelly_plus_1pm_heizung_switch_0_power
          - sensor.shelly_plugs_schreibtisch_switch_0_power
          - sensor.buro_shelly_plug_m_gen3_pc_leistung
        card_mod:
          style: |
            ha-card { background:none !important; border:none !important; box-shadow:none !important; pointer-events:none !important; }
        extra_styles: |
          @keyframes ef-flow { to { stroke-dashoffset: -28; } }
          @keyframes ef-pulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.32); opacity: 0; } }
          .ef-flow { animation-name: ef-flow; animation-timing-function: linear; animation-iteration-count: infinite; }
          .ef-pulse { transform-box: fill-box; transform-origin: center; animation: ef-pulse 2.8s ease-out infinite; }
          @media (prefers-reduced-motion: reduce) {
            .ef-flow, .ef-pulse { animation: none !important; }
            .ef-pulse { opacity: 0; }
          }
        custom_fields:
          flow: |
            [[[
              const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
              const solar=g('sensor.solarbank_3_e2700_pro_solarleistung');
              const netz =g('sensor.smart_meter_netzbezug');
              const akku =g('sensor.solarbank_3_e2700_pro_akkuleistung');
              const soc  =g('sensor.solarbank_3_e2700_pro_ladestand');
              const wh   =g('sensor.solarbank_3_e2700_pro_akkuenergie');
              const haus =g('sensor.pv_anlage_hausbedarf');
              const socMinRaw=g('number.solarbank_3_e2700_pro_soc_minimum');
              const SOC_MIN=isNaN(socMinRaw)?10:socMinRaw;
              const sunDown=(states['sun.sun']||{}).state==='below_horizon';
              const PV_PEAK=1828, TH=15, MAXN=6;

              const C={yel:'var(--owlet-sonnengelb, #e6c15a)',grn:'var(--owlet-gruen, #a6d49e)',red:'var(--owlet-rot, #f0736a)',blu:'var(--owlet-blau, #7fb3d5)',mint:'var(--owlet-mint, #89d2b0)',amb:'var(--owlet-amber, #e6b566)',ind:'var(--owlet-indigo, #8ea2e6)',
                       txt:'var(--owlet-text, #f2f5f8)',lab:'var(--owlet-label, #b4c0cf)',mut:'var(--owlet-text-sekundaer, #8794a5)',deco:'var(--owlet-muted, #6e7988)'};
              const tint=(c,p)=>`color-mix(in srgb, ${c} ${p}%, transparent)`;
              const SPEED=[16,26,36,48,60,74];   // px/s je Stufe
              const nrm=(w)=>{ const a=Math.abs(w)||0; return Math.max(0,Math.min(1,Math.log10(1+a/10)/Math.log10(301))); };
              const lvl=(w)=>Math.round(nrm(w)*5);
              const fmt=(w)=>{ if(isNaN(w)) return '–'; const a=Math.abs(w);
                return a>=1000 ? (a/1000).toFixed(1).replace('.',',')+' kW' : Math.round(a)+' W'; };
              const pct=(x)=>Math.round(x*100)+' %';
              const now=Date.now()/1000;
              const T=(x,y,t,s,c,w)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${s}" font-weight="${w||700}" font-family="-apple-system,system-ui,sans-serif" style="fill:${c||C.txt};font-variant-numeric:tabular-nums">${t}</text>`;
              const ico=(p,x,y,c,sc)=>`<g transform="translate(${x} ${y}) scale(${sc||1})" style="stroke:${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${p}</g>`;
              const I={
                sun:'<circle cx="0" cy="0" r="4.2"/><path d="M0-8.5V-11M0 8.5V11M-8.5 0H-11M8.5 0H11M6 6 7.8 7.8M-6 6-7.8 7.8M6-6 7.8-7.8M-6-6-7.8-7.8"/>',
                moon:'<path d="M3-8A8 8 0 1 0 8 3 6.3 6.3 0 0 1 3-8Z"/>',
                bat:'<rect x="-9" y="-5" width="16" height="10" rx="2"/><path d="M7-2v4"/>',
                grid:'<path d="M-6-8 0-11 6-8M-4 11 0-11 4 11M-7 2H7M-5 6H5"/>',
                home:'<path d="M-9 1 0-8 9 1M-6-1V9H6V-1"/>',
                dishwasher:'<rect x="-7" y="-8" width="14" height="16" rx="2"/><path d="M-7-3H7"/><circle cx="0" cy="3" r="3.2"/>',
                server:'<rect x="-8" y="-7" width="16" height="6" rx="1.4"/><rect x="-8" y="1" width="16" height="6" rx="1.4"/><path d="M4-4h.3M4 4h.3"/>',
                ethernet:'<path d="M-6-2v-3h12v3M0-5v-3"/><rect x="-5" y="-2" width="10" height="8" rx="1.4"/><path d="M-3 6v1.4M0 6v1.4M3 6v1.4"/>',
                tv:'<rect x="-9" y="-7" width="18" height="12" rx="1.6"/><path d="M-3 9h6"/>',
                pool:'<path d="M-8 3c2-2 3 2 5 0s3-2 5 0 3 2 3 0M-8 8c2-2 3 2 5 0s3-2 5 0 3 2 3 0M-3-6a2 2 0 0 1 4 0v9"/>',
                pump:'<path d="M-6 8V-2a4 4 0 0 1 8 0M-6 8h8M2-2h5M4-2v3"/><circle cx="-2" cy="-2" r="1"/>',
                radiator:'<path d="M-8-6v12M-3-6v12M2-6v12M7-6v12M-9 6h18"/>',
                desk:'<rect x="-7" y="-7" width="14" height="10" rx="1.4"/><path d="M0 3v3M-4 6h8"/>',
                pc:'<rect x="-9" y="-7" width="11" height="9" rx="1.4"/><path d="M-3.5 2v3M-6 5h5"/><rect x="4" y="-8" width="6" height="16" rx="1.2"/><path d="M6.2-4.5h1.6"/>',
                heat:'<path d="M-5.5 8c-2.4-2.6 2.4-5.4 0-8s2.4-5.4 0-8M0 8c-2.4-2.6 2.4-5.4 0-8s2.4-5.4 0-8M5.5 8c-2.4-2.6 2.4-5.4 0-8s2.4-5.4 0-8"/>',
                ac:'<rect x="-9" y="-8" width="18" height="9" rx="2"/><path d="M-5-2.5h10M-4.5 4.5l-1.5 3.5M0 4.5v3.5M4.5 4.5l1.5 3.5"/>',
                more:'<path d="M-6 0h.2M0 0h.2M6 0h.2" stroke-width="3.2"/>'
              };

              // ---------- Bausteine ----------
              // Leitung: getoente Spur (steht) + Lichtstriche (laufen, Phase an der Uhr)
              const edge=(d,c,w,on)=>{
                if(!on) return `<path d="${d}" style="stroke:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))" stroke-width="1.5" stroke-dasharray="2 6" fill="none" stroke-linecap="round"/>`;
                const L=lvl(w), sw=1.5+L*0.5, dur=28/SPEED[L];
                return `<path d="${d}" style="stroke:${tint(c,12)}" stroke-width="${sw+5}" fill="none" stroke-linecap="round"/>`+
                       `<path d="${d}" class="ef-flow" stroke-width="${sw}" stroke-dasharray="${7+L} ${21-L}" fill="none" stroke-linecap="round" style="stroke:${c};animation-duration:${dur.toFixed(2)}s;animation-delay:-${(now%dur).toFixed(2)}s"/>`;
              };
              const arc=(cx,cy,r,frac,c,sw,off)=>{
                const circ=2*Math.PI*r, len=Math.max(0,Math.min(1,frac||0))*circ;
                if(len<0.5) return '';
                return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${circ.toFixed(1)}" stroke-dashoffset="${(-(off||0)*circ).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
              };
              const disc=(cx,cy,r,c,on)=> on
                ? `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${tint(c,12)};stroke:${tint(c,24)}" stroke-width="1.5"/>`
                : `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));stroke:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))" stroke-width="1.5"/>`;
              const pulse=(cx,cy,r,c)=>`<circle class="ef-pulse" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="2" style="stroke:${c};animation-delay:-${(now%2.8).toFixed(2)}s"/>`;

              // ---------- Zustaende ----------
              const pvOn=!isNaN(solar)&&solar>TH;
              const imp=!isNaN(netz)&&netz>TH, exp=!isNaN(netz)&&netz<-TH;
              const chg=!isNaN(akku)&&akku>TH, dis=!isNaN(akku)&&akku<-TH;
              const H=isNaN(haus)?0:Math.max(0,haus);
              const sImp=imp?netz:0, sDis=dis?-akku:0, sPv=Math.max(0,H-sImp-sDis);

              // ---------- Verbraucher: nur > 0 W, Rest als "Sonstige", hoechstens 6 Knoten ----------
              let list=[
                {id:'sensor.stromverbrauch_hausgerate_aktuell',              n:'Hausgeräte',   ic:'dishwasher', c:'var(--owlet-amber, #e6b566)'},
                {id:'sensor.stromverbrauch_server_aktuell',                  n:'Server',       ic:'server',     c:'var(--owlet-tuerkis, #7fd0d5)'},
                {id:'sensor.poe_power_total',                                n:'PoE',          ic:'ethernet',   c:'var(--owlet-violett, #b399d4)'},
                {id:'sensor.shelly_plugs_fernseher_switch_0_power',          n:'TV',           ic:'tv',         c:'var(--owlet-blau, #7fb3d5)'},
                {id:'sensor.shelly_outdoor_plugs_pool_switch_0_power',       n:'Pool',         ic:'pool',       c:'var(--owlet-tuerkis, #7fd0d5)'},
                {id:'sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power',  n:'Garten',       ic:'pump',       c:'var(--owlet-limette, #bdd27f)'},
                {id:'sensor.shelly_plus_1pm_heizung_switch_0_power',         n:'Heizung',      ic:'radiator',   c:'var(--owlet-petrol, #79b8c9)'},
                {id:'sensor.shelly_plugs_schreibtisch_switch_0_power',       n:'Schreibtisch', ic:'desk',       c:'var(--owlet-violett, #b399d4)'},
                {id:'sensor.buro_shelly_plug_m_gen3_pc_leistung',            n:'PC',           ic:'pc',         c:'var(--owlet-violett, #b399d4)', pin:true},
                {id:'sensor.heizlufter_leistung',                            n:'Heizlüfter',   ic:'heat',       c:'var(--owlet-amber, #e6b566)'},
                {id:'sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_leistung', n:'Klima',    ic:'ac',         c:'var(--owlet-blau, #7fb3d5)'}
              ].map(o=>Object.assign(o,{w:g(o.id)}))
               .filter(o=>!isNaN(o.w)&&o.w>0)
               .sort((a,b)=>b.w-a.w);
              const sum=list.reduce((a,o)=>a+o.w,0);
              // Bezug der Anteile: Haus meldet seltener als die Stecker, daher nie unter der Summe
              const B=H>0?Math.max(H,sum):0;
              let rest=Math.max(0,H-sum), folded=0;
              if(list.length+(rest>=TH?1:0)>MAXN){
                // pin:true ab TH immer sichtbar, die uebrigen Plaetze an die groessten
                const pin=list.filter(o=>o.pin&&o.w>=TH);
                const keep=pin.concat(list.filter(o=>!pin.includes(o)).slice(0,Math.max(0,MAXN-1-pin.length)));
                const drop=list.filter(o=>!keep.includes(o));
                rest+=drop.reduce((a,o)=>a+o.w,0); folded=drop.length; list=keep.sort((a,b)=>b.w-a.w);
              }
              if(rest>=TH||folded) list.push({n:'Sonstige', ic:'more', c:C.mut, w:rest, neutral:true});

              // ---------- Geometrie (viewBox 360 x 340) ----------
              const hx=180, hy=154, hr=42;
              const S={x:118,y:62,r:28}, A={x:242,y:62,r:28}, G={x:44,y:154,r:28};
              let tracks='', nodes='';

              // Quellen-Leitungen
              const dSH=`M${S.x} ${S.y+S.r} Q${S.x} ${hy-36} ${hx-22} ${hy-36}`;
              const dAH=`M${A.x} ${A.y+A.r} Q${A.x} ${hy-36} ${hx+22} ${hy-36}`;
              const dHA=`M${hx+22} ${hy-36} Q${A.x} ${hy-36} ${A.x} ${A.y+A.r}`;
              const dGH=`M${G.x+G.r} ${hy} L${hx-hr} ${hy}`, dHG=`M${hx-hr} ${hy} L${G.x+G.r} ${hy}`;
              tracks+=edge(dSH,C.yel,solar,pvOn);
              tracks+=chg ? edge(dHA,C.grn,akku,true) : edge(dAH,C.blu,akku,dis);
              tracks+=exp ? edge(dHG,C.mint,netz,true) : edge(dGH,C.red,netz,imp);

              // Verbraucher-Bogen: eigene Ansatzpunkte am Hausring, S-Kurven nach unten
              const N=list.length;
              const span=N>1?Math.min(310,(N-1)*62):0, sp=N>1?span/(N-1):62;
              const r=Math.min(23,sp/2-7);
              const pos=list.map((o,i)=>{ const x=N>1?hx-span/2+i*sp:hx, u=(x-hx)/155; return {x, y:282-14*u*u, u}; });
              list.forEach((o,i)=>{
                const p=pos[i], th=(90-p.u*58)*Math.PI/180;
                const sx=hx+hr*Math.cos(th), sy=hy+hr*Math.sin(th), ey=p.y-r;
                const d=`M${sx.toFixed(1)} ${sy.toFixed(1)} C${sx.toFixed(1)} ${(sy+34).toFixed(1)} ${p.x.toFixed(1)} ${(ey-34).toFixed(1)} ${p.x.toFixed(1)} ${ey.toFixed(1)}`;
                tracks+=edge(d,o.c,o.w,true);
              });

              // Hauptquelle (groesster Anteil am Hausverbrauch) pulsiert
              const main=[['pv',sPv],['akku',sDis],['netz',sImp]].sort((a,b)=>b[1]-a[1])[0];

              // Solar
              const night=sunDown&&!pvOn;
              const sc=pvOn?C.yel:(night?C.ind:C.deco);
              nodes+=disc(S.x,S.y,S.r,sc,pvOn||night);
              if(pvOn) nodes+=arc(S.x,S.y,S.r,solar/PV_PEAK,C.yel,3);
              if(main[0]==='pv'&&main[1]>TH&&pvOn) nodes+=pulse(S.x,S.y,S.r,C.yel);
              nodes+=ico(night?I.moon:I.sun,S.x,S.y-8,sc,.9)+T(S.x,S.y+12,fmt(solar),12,pvOn?C.txt:C.mut);
              nodes+=T(S.x,S.y-S.r-9,night?'Nacht':'Solar',10.5,pvOn?C.yel:(night?C.ind:C.mut),600);

              // Akku
              const hasSoc=!isNaN(soc);
              const atMin=hasSoc&&soc<=SOC_MIN&&!chg&&!dis;
              const ac=!hasSoc?C.deco:(soc<SOC_MIN?C.red:((atMin||soc<=20)?C.amb:(dis?C.blu:C.grn)));
              nodes+=disc(A.x,A.y,A.r,ac,hasSoc)+(hasSoc?arc(A.x,A.y,A.r,soc/100,ac,3):'');
              if(main[0]==='akku'&&main[1]>TH) nodes+=pulse(A.x,A.y,A.r,ac);
              const fillW=hasSoc?Math.max(1,12*soc/100):0;
              nodes+=`<g transform="translate(${A.x} ${A.y-8}) scale(.9)"><g style="stroke:${ac}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${I.bat}</g><rect x="-7" y="-3" width="${fillW.toFixed(1)}" height="6" rx="1" style="fill:${ac}"/></g>`;
              nodes+=T(A.x,A.y+12,hasSoc?Math.round(soc)+' %':'–',12);
              const aWord=chg?'lädt '+fmt(akku):(dis?'entlädt '+fmt(akku):(atMin?('Reserve'+(isNaN(wh)?'':' · '+Math.round(wh)+' Wh')):'bereit'));
              nodes+=T(A.x,A.y-A.r-9,aWord,10.5,hasSoc?ac:C.mut,600);

              // Netz
              const gc=imp?C.red:(exp?C.mint:C.deco);
              nodes+=disc(G.x,G.y,G.r,gc,imp||exp);
              if(main[0]==='netz'&&main[1]>TH) nodes+=pulse(G.x,G.y,G.r,C.red);
              nodes+=ico(I.grid,G.x,G.y-8,gc,.9)+T(G.x,G.y+12,fmt(netz),12,(imp||exp)?C.txt:C.mut);
              nodes+=T(G.x,G.y+G.r+15,imp?'Bezug':(exp?'Einspeisung':'Netz'),10.5,(imp||exp)?gc:C.mut,600);

              // Haus mit Quellenmix-Ring
              nodes+=`<circle cx="${hx}" cy="${hy}" r="${hr}" style="fill:${tint(C.blu,12)};stroke:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))" stroke-width="4"/>`;
              const segs=[[sPv,C.yel],[sDis,C.blu],[sImp,C.red]].filter(s=>s[0]>0);
              const tot=segs.reduce((a,s)=>a+s[0],0)||1, gap=segs.length>1?0.012:0;
              let off=0;
              segs.forEach(s=>{ const f=s[0]/tot; nodes+=arc(hx,hy,hr,Math.max(0,f-gap),s[1],4,off+gap/2); off+=f; });
              nodes+=ico(I.home,hx,hy-11,C.blu,1.2)+T(hx,hy+15,fmt(haus),15);

              // Namen: in der viewBox halten und Ueberlappungen auseinanderschieben
              // (Breite geschaetzt: 5,6 Einheiten je Zeichen bei 10er-Schrift)
              const lab=list.map((o,i)=>({x:pos[i].x, hw:o.n.length*2.8}));
              lab.forEach(l=>{ l.x=Math.min(Math.max(l.x,l.hw+2),358-l.hw); });
              for(let i=1;i<lab.length;i++){ const m=lab[i-1].x+lab[i-1].hw+4+lab[i].hw; if(lab[i].x<m) lab[i].x=m; }
              for(let i=lab.length-1;i>=0;i--){
                const m=i===lab.length-1 ? 358-lab[i].hw : lab[i+1].x-lab[i+1].hw-4-lab[i].hw;
                if(lab[i].x>m) lab[i].x=m;
              }

              // Verbraucher-Knoten
              list.forEach((o,i)=>{
                const p=pos[i];
                nodes+=o.neutral
                  ? `<circle cx="${p.x}" cy="${p.y}" r="${r}" style="fill:var(--owlet-unterkachel, rgba(255, 255, 255, 0.028));stroke:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))" stroke-width="1.5"/>`
                  : disc(p.x,p.y,r,o.c,true);
                nodes+=arc(p.x,p.y,r,B?o.w/B:0,o.c,2.5);
                nodes+=ico(I[o.ic],p.x,p.y-7,o.neutral?C.lab:o.c,.78)+T(p.x,p.y+10,fmt(o.w),11);
                const lx=lab[i].x.toFixed(1);
                nodes+=T(lx,p.y+r+14,o.n,10,o.neutral?C.lab:o.c,600);
                nodes+=T(lx,p.y+r+27,(B?pct(Math.min(1,o.w/B)):'–')+(o.neutral&&folded?' · +'+folded:''),10,C.mut,600);
              });

              return `<div style="width:100%;"><svg viewBox="0 0 360 340" style="width:100%;height:auto;display:block;">${tracks}${nodes}</svg></div>`;
            ]]]
        styles:
          card: [ background: none, box-shadow: none, border: none, padding: 0 ]
          grid: [ grid-template-areas: '"flow"' ]
          custom_fields:
            flow: [ width: 100% ]
        style:
          top: 50%
          left: 50%
          width: 100%
          transform: translate(-50%, -50%)
          pointer-events: none

      # ---- Klickflaechen: nur feste Knoten (Quellen + Haus) ----
      - type: image
        entity: sensor.solarbank_3_e2700_pro_solarleistung
        image: &pixel "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        tap_action: { action: more-info }
        style: { top: 16%, left: 32.8%, width: 18%, height: 24%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.solarbank_3_e2700_pro_ladestand
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 16%, left: 67.2%, width: 18%, height: 24%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.smart_meter_netzbezug
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 47.5%, left: 12.2%, width: 18%, height: 24%, transform: 'translate(-50%, -50%)', border-radius: 16px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.pv_anlage_hausbedarf
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 45.3%, left: 50%, width: 24%, height: 25%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }

  # ---- Tageszeile: Autarkie heute, Herkunft des Stroms, Einspeisung ----
  - type: custom:button-card
    entity: sensor.pv_anlage_taglicher_hausverbrauch
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: more-info }
    triggers_update:
      - sensor.pv_anlage_taglicher_hausverbrauch
      - sensor.pv_anlage_tagliche_netznutzung
      - sensor.pv_anlage_tagliche_pv_hausabgabe
      - sensor.pv_anlage_tagliche_akku_hausabgabe
      - sensor.solar_uberschuss_daily
    custom_fields:
      heute: |
        [[[
          const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
          const use=g('sensor.pv_anlage_taglicher_hausverbrauch'), grid=g('sensor.pv_anlage_tagliche_netznutzung');
          const ex=g('sensor.solar_uberschuss_daily');
          const kwh=(x)=>isNaN(x)?'–':x.toFixed(2).replace('.',',')+' kWh';
          const all=[
            [grid,                                                 'var(--owlet-rot, #f0736a)', 'Netz'],
            [g('sensor.pv_anlage_tagliche_pv_hausabgabe'),   'var(--owlet-sonnengelb, #e6c15a)', 'PV'],
            [g('sensor.pv_anlage_tagliche_akku_hausabgabe'), 'var(--owlet-blau, #7fb3d5)', 'Akku']
          ];
          // Fehlt ein Wert, bleibt der Balken leer: ein Teilbalken saehe vollstaendig aus
          const ok=all.every(s=>!isNaN(s[0]));
          const segs=ok ? all.filter(s=>s[0]>0) : all;
          const tot=segs.reduce((a,s)=>a+(s[0]||0),0)||1;
          const bar=!ok ? '' : segs.map(s=>`<i style="display:block;height:100%;width:${(s[0]/tot*100).toFixed(1)}%;background:${s[1]};"></i>`).join('');
          const leg=segs.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:7px;height:7px;border-radius:50%;background:${s[1]};display:inline-block;"></i>${s[2]} ${kwh(s[0])}</span>`).join('');
          // Autarkie heute = Anteil von PV und Akku am Hausverbrauch (gleiche Formel wie die Monatsbilanz)
          const aut=(use>0&&!isNaN(grid)) ? Math.max(0,Math.min(1,1-grid/use)) : NaN;
          const C=2*Math.PI*28.5, len=isNaN(aut)?0:aut*C;
          const ring=`<div style="position:relative;width:64px;height:64px;flex:none;">
            <svg viewBox="0 0 64 64" width="64" height="64" style="display:block;transform:rotate(-90deg);">
              <circle cx="32" cy="32" r="28.5" fill="none" style="stroke:var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))" stroke-width="7"/>
              ${len>0.5?`<circle cx="32" cy="32" r="28.5" fill="none" style="stroke:var(--owlet-mint, #89d2b0)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}"/>`:''}
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;">
              <b style="font-size:17px;font-weight:750;letter-spacing:-0.02em;color:var(--owlet-text, #f2f5f8);font-variant-numeric:tabular-nums;">${isNaN(aut)?'–':Math.round(aut*100)+'%'}</b>
              <span style="font-size:10px;color:var(--owlet-text-sekundaer, #8794a5);margin-top:3px;">autark</span></div></div>`;
          return `<div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;gap:14px;align-items:center;">${ring}
              <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
                  <span style="font-size:12px;color:var(--owlet-text-sekundaer, #8794a5);">Heute · Herkunft des Stroms</span>
                  <b style="font-size:13px;color:var(--owlet-text, #f2f5f8);font-variant-numeric:tabular-nums;white-space:nowrap;">${kwh(use)}</b></div>
                <div style="display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;background:var(--owlet-neutral-kachel, rgba(255, 255, 255, 0.05));">${bar}</div>
                <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--owlet-label, #b4c0cf);font-variant-numeric:tabular-nums;">${leg}</div>
              </div></div>
            <div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06));padding-top:8px;font-size:12px;color:var(--owlet-label, #b4c0cf);font-variant-numeric:tabular-nums;">
              <span style="display:inline-flex;align-items:center;gap:6px;"><ha-icon icon="mdi:transmission-tower-export" style="--mdc-icon-size:15px;color:var(--owlet-mint, #89d2b0);"></ha-icon>Eingespeist heute</span>
              <b style="color:var(--owlet-mint, #89d2b0);font-weight:700;">${kwh(ex)}</b></div>
          </div>`;
        ]]]
    styles:
      card:
        - background: 'var(--owlet-unterkachel, rgba(255, 255, 255, 0.028))'
        - border: 1px solid var(--owlet-unterkachel-rand, rgba(255, 255, 255, 0.06))
        - border-radius: 16px
        - box-shadow: none
        - padding: 12px 14px
      grid:
        - grid-template-areas: '"heute"'
      custom_fields:
        heute: [ width: 100%, text-align: left ]
