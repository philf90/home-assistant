# ============================================================================
# Verbraucher – Leistung, kWh heute und Anteil
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       energie
# Status:        aktiv
# Karten:        button-card, card-mod
# Templates:     energie_kopf (energie-templates.yaml),
#                energie_verbraucher_zeile (energie-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   sensor.pv_anlage_*
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Verbraucher im Owlet-Stil: eine Liste statt "Verbraucher live" und
# "Top-Verbraucher" (energie-verbrauch-uebersicht-karte.yaml, aeltere
# Variante, bleibt erhalten). Je Geraet in einer Zeile: Leistung jetzt mit
# Statuspunkt, kWh heute, Anteil am Hausverbrauch als Zahl und Balken.
# Jede Zeile ist klickbar (more-info auf den Tageszaehler); die Knoten im
# Energiefluss sind es nicht.
#
# Bezugsgroesse ist sensor.pv_anlage_taglicher_hausverbrauch, dieselbe Zahl
# wie in der Tageszeile des Energieflusses. "Nicht erfasst" = Hausverbrauch
# minus Summe der Geraete (Einspeisung zaehlt nicht mit, sie ist kein
# Verbrauch).
#
# Geraete ohne Leistung (<= 1 W) und ohne Verbrauch heute blendet je eine
# Conditional-Karte mit "or"-Bedingung aus; die Fusszeile nennt sie. Die
# Liste der Geraete steht dort ein zweites Mal (variables.geraete), ebenso
# die Tageszaehler in "Nicht erfasst" (variables.ids) -- bei neuen Geraeten
# alle drei Stellen ergaenzen, dazu die Liste im Energiefluss
# (energie-flow-karte.yaml).
#
# Farben nach DESIGN.md wie im Energiefluss: Hausgeraete/Heizluefter Amber,
# Server/Pool Tuerkis, PoE/Schreibtisch/PC Violett, Heizung Petrol, Garten
# Limette, TV/Klima Blau.
#
# PC: eigener Shelly Plug M Gen3 (Leistung ..._pc_leistung, Tageszaehler
# sensor.stromverbrauch_pc_daily aus ..._pc_energie). Bis zum Umbau lief der
# PC ueber den Schreibtisch-Stecker; seitdem misst Schreibtisch nur noch den
# Rest des Arbeitsplatzes.
#
# Voraussetzung: custom:button-card + card-mod (HACS), Templates aus
# energie-templates.yaml (energie_kopf, energie_verbraucher_zeile).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
- type: custom:button-card
  template: energie_kopf
  icon: mdi:chart-bar
  name: Verbraucher
  label: |
    [[[
      const s=states['sensor.pv_anlage_taglicher_hausverbrauch']; const v=s?parseFloat(s.state):NaN;
      return 'jetzt · heute · Anteil an ' + (isNaN(v)?'–':v.toFixed(2).replace('.',',')+' kWh');
    ]]]
  triggers_update:
  - sensor.pv_anlage_taglicher_hausverbrauch
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.stromverbrauch_hausgerate_aktuell
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_hausgerate_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_hausgerate_daily
    icon: mdi:dishwasher
    name: Hausgeräte
    variables:
      accent: '#e6b566'
      power_entity: sensor.stromverbrauch_hausgerate_aktuell
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.stromverbrauch_server_aktuell
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_server_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_server_daily
    icon: mdi:server
    name: Server
    variables:
      accent: '#7fd0d5'
      power_entity: sensor.stromverbrauch_server_aktuell
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.poe_power_total
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_poe_power_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_poe_power_daily
    icon: mdi:ethernet
    name: PoE-Infrastruktur
    variables:
      accent: '#b399d4'
      power_entity: sensor.poe_power_total
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.shelly_plugs_fernseher_switch_0_power
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_fernseher_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_fernseher_daily
    icon: mdi:television
    name: Fernseher
    variables:
      accent: '#7fb3d5'
      power_entity: sensor.shelly_plugs_fernseher_switch_0_power
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.shelly_plus_1pm_heizung_switch_0_power
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_heizung_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_heizung_daily
    icon: mdi:radiator
    name: Heizung
    variables:
      accent: '#79b8c9'
      power_entity: sensor.shelly_plus_1pm_heizung_switch_0_power
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.shelly_plugs_schreibtisch_switch_0_power
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_schreibtisch_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_schreibtisch_daily
    icon: mdi:desk
    name: Schreibtisch
    variables:
      accent: '#b399d4'
      power_entity: sensor.shelly_plugs_schreibtisch_switch_0_power
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.buro_shelly_plug_m_gen3_pc_leistung
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_pc_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_pc_daily
    icon: mdi:desktop-tower-monitor
    name: PC
    variables:
      accent: '#b399d4'
      power_entity: sensor.buro_shelly_plug_m_gen3_pc_leistung
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.shelly_outdoor_plugs_pool_switch_0_power
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_pool_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_pool_daily
    icon: mdi:pool
    name: Pool
    variables:
      accent: '#7fd0d5'
      power_entity: sensor.shelly_outdoor_plugs_pool_switch_0_power
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_leistung
      above: 1
    - condition: numeric_state
      entity: sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_stromverbrauch_klimaanlage_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_stromverbrauch_klimaanlage_daily
    icon: mdi:air-conditioner
    name: Klimaanlage
    variables:
      accent: '#7fb3d5'
      power_entity: sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_leistung
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power
      above: 1
    - condition: numeric_state
      entity: sensor.stromverbrauch_gartenpumpe_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.stromverbrauch_gartenpumpe_daily
    icon: mdi:water-pump
    name: Gartenpumpe
    variables:
      accent: '#bdd27f'
      power_entity: sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power
- type: conditional
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity: sensor.heizlufter_leistung
      above: 1
    - condition: numeric_state
      entity: sensor.heizlufter_stromverbrauch_heizlufter_daily
      above: 0
  card:
    type: custom:button-card
    template: energie_verbraucher_zeile
    entity: sensor.heizlufter_stromverbrauch_heizlufter_daily
    icon: mdi:heat-wave
    name: Heizlüfter
    variables:
      accent: '#e6b566'
      power_entity: sensor.heizlufter_leistung
- type: custom:button-card
  template: energie_verbraucher_zeile
  entity: sensor.pv_anlage_taglicher_hausverbrauch
  icon: mdi:dots-horizontal
  name: Nicht erfasst
  label: |
    [[[
      const tot=parseFloat(states[variables.total_entity]?.state)||0;
      let sum=0; (variables.ids||[]).forEach(id=>{ const s=states[id]; if(s){ const v=parseFloat(s.state); if(!isNaN(v)) sum+=v; } });
      const unt=Math.max(0,tot-sum), share= tot>0 ? Math.round(unt/tot*100) : 0;
      return `${unt.toFixed(2).replace('.',',')}<span style="color:#8794a5;font-weight:600;font-size:0.72em;margin-left:5px;">kWh · ${share} %</span>`;
    ]]]
  variables:
    accent: '#8794a5'
    ids:
    - sensor.stromverbrauch_hausgerate_daily
    - sensor.stromverbrauch_server_daily
    - sensor.stromverbrauch_poe_power_daily
    - sensor.stromverbrauch_fernseher_daily
    - sensor.stromverbrauch_heizung_daily
    - sensor.stromverbrauch_schreibtisch_daily
    - sensor.stromverbrauch_pc_daily
    - sensor.stromverbrauch_pool_daily
    - sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_stromverbrauch_klimaanlage_daily
    - sensor.stromverbrauch_gartenpumpe_daily
    - sensor.heizlufter_stromverbrauch_heizlufter_daily
  custom_fields:
    bar: |
      [[[
        const tot=parseFloat(states[variables.total_entity]?.state)||0;
        let sum=0; (variables.ids||[]).forEach(id=>{ const s=states[id]; if(s){ const v=parseFloat(s.state); if(!isNaN(v)) sum+=v; } });
        const share= tot>0 ? Math.min(100, Math.max(0,tot-sum)/tot*100) : 0;
        return `<div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.05);overflow:hidden;">
          <div style="height:100%;width:${share}%;border-radius:6px;background:#8794a5;"></div></div>`;
      ]]]
    watt: <span style="color:#8794a5;">Rest des Hauses</span>
  styles:
    name:
    - color: '#b4c0cf'
    card:
    - background: none
- type: custom:button-card
  label: |
    [[[
      const v=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
      const aus=(variables.geraete||[]).filter(x=>!(v(x[1])>1)&&!(v(x[2])>0)).map(x=>x[0]);
      return aus.length ? 'Ohne Verbrauch heute ausgeblendet: '+aus.join(', ') : '';
    ]]]
  show_icon: false
  show_name: false
  show_label: true
  show_state: false
  triggers_update: all
  tap_action:
    action: none
  variables:
    geraete:
    - - Hausgeräte
      - sensor.stromverbrauch_hausgerate_aktuell
      - sensor.stromverbrauch_hausgerate_daily
    - - Server
      - sensor.stromverbrauch_server_aktuell
      - sensor.stromverbrauch_server_daily
    - - PoE-Infrastruktur
      - sensor.poe_power_total
      - sensor.stromverbrauch_poe_power_daily
    - - Fernseher
      - sensor.shelly_plugs_fernseher_switch_0_power
      - sensor.stromverbrauch_fernseher_daily
    - - Heizung
      - sensor.shelly_plus_1pm_heizung_switch_0_power
      - sensor.stromverbrauch_heizung_daily
    - - Schreibtisch
      - sensor.shelly_plugs_schreibtisch_switch_0_power
      - sensor.stromverbrauch_schreibtisch_daily
    - - PC
      - sensor.buro_shelly_plug_m_gen3_pc_leistung
      - sensor.stromverbrauch_pc_daily
    - - Pool
      - sensor.shelly_outdoor_plugs_pool_switch_0_power
      - sensor.stromverbrauch_pool_daily
    - - Klimaanlage
      - sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_leistung
      - sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_stromverbrauch_klimaanlage_daily
    - - Gartenpumpe
      - sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power
      - sensor.stromverbrauch_gartenpumpe_daily
    - - Heizlüfter
      - sensor.heizlufter_leistung
      - sensor.heizlufter_stromverbrauch_heizlufter_daily
  styles:
    label:
    - justify-self: start
    - text-align: left
    - font-size: 12px
    - color: '#8794a5'
    - white-space: normal
    card:
    - background: none
    - box-shadow: none
    - border: none
    - padding: 0 4px
    grid:
    - grid-template-areas: '"l"'
