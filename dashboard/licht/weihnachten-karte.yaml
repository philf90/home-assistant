# ============================================================================
# Weihnachten – Hauptschalter der Saison
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       licht
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Schalter fuer input_boolean.weihnachtssaison, im Einsatz direkt unter der
# Lichter-Karte (lichter-reiter-karte.yaml) in der View "Licht & Fenster".
# Vorbild: der Frostschutz-Schalter in garten-karte.yaml (Schiebeschalter
# rechts, Rueckfrage beim Tippen), hier in eigener Kartenhuelle, weil die
# Karte allein steht. Akzent Amber (DESIGN.md: Amber = Lichter).
#
# Der Helfer wird nur von Hand geschaltet. Was er bewirkt (Automation
# "Weihnachten: Saison umschalten", Template-Helfer sensor.lichter_an, Feld
# sichtbar in der Lichter-Karte): doku/weihnachtsbeleuchtung-vorbereitung.md.
#   an   Automationen "bei Daemmerung an" und "um 22:30 aus" aktiv, Schalter
#        Tannenbaum und Fenster in der Lichter-Karte sichtbar und gezaehlt;
#        ist es zwischen 14:00 und 22:30 dunkel, geht die Beleuchtung an
#   aus  beide Automationen aus, Baum und Fenster sofort aus, ihre Schalter
#        ausgeblendet und nicht gezaehlt
#
# Tippen: Rueckfrage, dann umschalten. Halten: more-info.
#
# Fusszeile (Feld hint): Die Alexa-Freigabe von light.weihnachtsbeleuchtung
# schaltet nicht mit (Home Assistant hat dafuer keine Aktion, siehe Doku,
# Abschnitt "Alexa"). Die Zeile erinnert daran, sie beim Abbau von Hand
# auszuschalten und beim Aufbau wieder einzuschalten. Sie zeigt nicht den
# tatsaechlichen Stand der Freigabe: den kann die Karte nicht lesen. Stil wie
# die Hinweiszeilen in tanken-templates.yaml und fussball-templates.yaml:
# 11,5 px in Sekundaergrau (#8794a5; Muted #6e7988 ist nie Text), Trennlinie
# im Unterkachel-Rand.
#
# Breite (gebaut fuer 360 px, Inhalt der Huelle 306 px; iPhone 17 Pro 348 px):
#   Text: 306 - 46 Icon - 15 Abstand - 4 Spaltenabstand - 8 - 42 Schalter
#   = 191 px (iPhone 233 px); der Untertitel bricht in bis zu zwei Zeilen um.
#   Gemessen in Chromium (Raster nachgebaut): 187 px Text bei 360 px, 229 px
#   bei 402 px; Hoehe 76 px, bei "Ausgeblendet, Automationen aus" auf 360 px
#   zweizeilig 83 px.
#   Fusszeile ueber die volle Breite (306 px, iPhone 348 px), am 2026-11-24
#   in Chromium mit Roboto nachgebaut: beide Texte zweizeilig bei 360 und
#   402 px, Karte 132 px hoch. "beim Aufbau von Hand wieder einschalten" lief
#   bei 360 px in die dritte Zeile (149 px), deshalb ohne "wieder".
#
# Voraussetzung: custom:button-card, Helfer input_boolean.weihnachtssaison.
type: custom:button-card
entity: input_boolean.weihnachtssaison
name: Weihnachtssaison
icon: |
  [[[ return (entity && entity.state === 'on') ? 'mdi:pine-tree' : 'mdi:pine-tree-variant-outline'; ]]]
show_icon: true
show_name: true
show_state: false
tap_action:
  action: toggle
  confirmation:
    text: >-
      Weihnachtssaison umschalten? Aus: Baum und Fenster gehen aus, ihre
      Schalter und Automationen ruhen. An: Alles wieder aktiv; ist es dunkel,
      geht die Beleuchtung an.
hold_action:
  action: more-info
custom_fields:
  sub: |
    [[[
      const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
      return an ? 'Baum und Fenster aktiv' : 'Ausgeblendet, Automationen aus';
    ]]]
  hint: |
    [[[
      const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
      return an
        ? 'Alexa-Freigabe schaltet nicht mit: beim Abbau von Hand ausschalten (Einstellungen › Sprachassistenten › Alexa).'
        : 'Alexa-Freigabe schaltet nicht mit: beim Aufbau von Hand einschalten (Einstellungen › Sprachassistenten › Alexa).';
    ]]]
  sw: |
    [[[
      const an=(typeof entity!=='undefined'&&entity&&entity.state==='on');
      return `<span style="position:relative;display:block;box-sizing:border-box;width:42px;height:24px;border-radius:12px;background:${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-amber, #e6b566) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-amber, #e6b566))':'color-mix(in srgb, rgba(255, 255, 255, 0.1) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05)))'};border:1px solid ${an?'color-mix(in srgb, color-mix(in srgb, var(--nachtblau-amber, #e6b566) 50%, transparent) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-amber, #e6b566))':'color-mix(in srgb, rgba(255, 255, 255, 0.08) var(--nachtblau-dunkel-anteil, 100%), var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06)))'};"><span style="position:absolute;top:2px;left:${an?20:2}px;width:18px;height:18px;border-radius:50%;background:${an?'#f2f5f8':'var(--nachtblau-text-sekundaer, #8794a5)'};transition:left 0.15s ease;"></span></span>`;
    ]]]
styles:
  card:
    - padding: 14px 18px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
  grid:
    - grid-template-columns: min-content minmax(0, 1fr) auto
    - grid-template-areas: '"i n sw" "i sub sw" "hint hint hint"'
    - grid-template-rows: min-content min-content min-content
    - column-gap: 4px
  img_cell:
    - width: 46px
    - height: 46px
    - border-radius: 14px
    - margin-right: 15px
    - align-self: center
    - background: |
        [[[ return (entity && entity.state === 'on') ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 16%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))'; ]]]
    - border: |
        [[[ return (entity && entity.state === 'on') ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))'; ]]]
  icon:
    - width: 24px
    - height: 24px
    - --ha-icon-display: block
    - color: |
        [[[ return (entity && entity.state === 'on') ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
  name:
    - justify-self: stretch
    - align-self: end
    - min-width: 0
    - text-align: left
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: 'var(--nachtblau-text, #f2f5f8)'
    - white-space: nowrap
    - overflow: hidden
    - text-overflow: ellipsis
  custom_fields:
    sub:
      - justify-self: stretch
      - align-self: start
      - min-width: 0
      - text-align: left
      - font-size: 12.5px
      - line-height: 1.25
      - color: |
          [[[ return (entity && entity.state === 'on') ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]
      - margin-top: 2px
      - white-space: normal
    sw:
      - align-self: center
      - justify-self: end
      - margin-left: 8px
    hint:
      - justify-self: stretch
      - min-width: 0
      - text-align: left
      - font-size: 11.5px
      - line-height: 1.45
      - color: 'var(--nachtblau-text-sekundaer, #8794a5)'
      - white-space: normal
      - margin-top: 12px
      - padding-top: 10px
      - border-top: 1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
