# ============================================================================
# Fenster & Lichter – Kachel
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       licht
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# "Fenster & Lichter" im Nachtblau-Stil
# Ersetzt die custom:bubble-card durch einen custom:button-card-Nachbau.
#
# - Nachtblau-Huelle, Palette und rundlich-quadratische Icon-Kachel wie die
#   anderen Karten.
# - Zwei Chips rechts (offene Fenster/Tueren + Lichter an) mit eigener
#   Tap-Navigation; Farbe je Zustand: nichts offen/aus -> gruen bzw. gedaempft,
#   offen -> blau, Licht an -> amber.
# - Die Chip-Templates haben vier statt drei eckige Klammern. Mit drei wertet
#   die aeussere Karte sie aus, entity ist dann light.alle_lichter ("on" -> 0),
#   und die Chips blieben immer gruen bzw. grau.
# - Haupt-Tap toggelt weiterhin light.alle_lichter.
#
# Voraussetzung: custom:button-card (HACS) ab 4.2.0 (verschachtelte Templates).
type: custom:button-card
entity: light.alle_lichter
name: Fenster & Lichter
show_icon: true
show_name: true
show_state: false
show_label: false
icon: mdi:home-lightbulb
tap_action:
  action: toggle
styles:
  card:
    - padding: 14px 16px
    - border-radius: 22px
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
    - box-shadow: '0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))'
    - overflow: hidden
  grid:
    - grid-template-areas: '"i n c1 c2"'
    - grid-template-columns: min-content 1fr min-content min-content
    - grid-template-rows: min-content
  img_cell:
    - width: 46px
    - height: 46px
    - border-radius: 14px
    - background: 'linear-gradient(160deg, var(--nachtblau-aus, #3a4453) 0%, var(--nachtblau-flaeche-erhoeht, #222b3c) 100%)'
    - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
    - margin-right: 15px
  icon:
    - width: 24px
    - height: 24px
    - color: 'var(--nachtblau-gruen, #a6d49e)'
  name:
    - justify-self: start
    - align-self: center
    - font-size: 16px
    - font-weight: 700
    - letter-spacing: -0.01em
    - color: 'var(--nachtblau-text, #f2f5f8)'
    # Schmale Karte (z. B. 360 px breites Handy): Titel darf zweizeilig umbrechen
    - white-space: normal
    - text-wrap: balance
    - line-height: 1.2
  custom_fields:
    c1:
      - align-self: center
      - justify-self: end
    c2:
      - align-self: center
      - justify-self: end
      - margin-left: 8px
custom_fields:
  # ---------- Chip 1: offene Fenster & Tueren ----------
  c1:
    card:
      type: custom:button-card
      entity: sensor.summe_offene_fenster_turen
      show_name: false
      show_icon: true
      show_state: true
      icon: |
        [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'mdi:window-open' : 'mdi:window-closed'; ]]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/lichter-fenster-temp
      styles:
        card:
          - padding: 7px 13px 7px 11px
          - border-radius: 999px
          - box-shadow: none
          - background: |
              [[[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? 'color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 12%, transparent)' : 'color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 12%, transparent)';
              ]]]]
          - border: |
              [[[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? '1px solid color-mix(in srgb, var(--nachtblau-blau, #7fb3d5) 24%, transparent)' : '1px solid color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 24%, transparent)';
              ]]]]
        grid:
          - grid-template-areas: '"i s"'
          - grid-template-columns: min-content min-content
          - grid-template-rows: min-content
          - align-items: center
        # Icon 15 px, so hoch wie die Zahlzeile: Eine hoehere Zelle kappt
        # button-card auf die Zeilenhoehe (max-height: 100 %), das Icon wurde
        # dann ohnehin mit 15 px gezeichnet und sass nur per Versatz mittig.
        # Abstaende an der Glyphe: window-open/-closed lassen links und rechts
        # 4 von 24 Einheiten frei (2,5 px). Polster links 11 px -> 13,5 px bis
        # zur Glyphe wie rechts bis zur Zahl, Luecke zur Zahl 6,5 + 2,5 = 9 px.
        img_cell:
          - width: 15px
          - height: 15px
          - margin-right: 6.5px
          - align-self: center
        icon:
          - width: 15px
          - height: 15px
          - --ha-icon-display: block
          - color: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'var(--nachtblau-blau, #7fb3d5)' : 'var(--nachtblau-gruen, #a6d49e)'; ]]]]
        state:
          - font-size: 15px
          - font-weight: 700
          - font-variant-numeric: tabular-nums
          - line-height: 1
          - color: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'var(--nachtblau-text, #f2f5f8)' : 'var(--nachtblau-gruen, #a6d49e)'; ]]]]
  # ---------- Chip 2: Lichter an ----------
  c2:
    card:
      type: custom:button-card
      entity: sensor.lichter_an
      show_name: false
      show_icon: true
      show_state: true
      icon: |
        [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'mdi:lightbulb-group' : 'mdi:lightbulb-outline'; ]]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/lichter-fenster-temp
      styles:
        card:
          # Polster und Luecke wie Chip 1 an der Glyphe gemessen: lightbulb-group
          # laesst je Seite 2 von 24 Einheiten frei (1,25 px), lightbulb-outline
          # 5 (3,125 px). Links 13,5 px bis zur Glyphe, 9 px Luecke zur Zahl.
          - padding: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? '7px 13px 7px 12.25px' : '7px 13px 7px 10.375px'; ]]]]
          - border-radius: 999px
          - box-shadow: none
          - background: |
              [[[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? 'color-mix(in srgb, var(--nachtblau-amber, #e6b566) 12%, transparent)' : 'var(--nachtblau-neutral-kachel, rgba(255, 255, 255, 0.05))';
              ]]]]
          - border: |
              [[[[
                const n = parseFloat(entity.state) || 0;
                return n > 0 ? '1px solid color-mix(in srgb, var(--nachtblau-amber, #e6b566) 24%, transparent)' : '1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))';
              ]]]]
        grid:
          - grid-template-areas: '"i s"'
          - grid-template-columns: min-content min-content
          - grid-template-rows: min-content
          - align-items: center
        img_cell:
          - width: 15px
          - height: 15px
          - margin-right: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? '7.75px' : '5.875px'; ]]]]
          - align-self: center
        icon:
          - width: 15px
          - height: 15px
          - --ha-icon-display: block
          # Glyphe mittig: lightbulb-group hat ihre Mitte bei (12, 12,5) im
          # 24er-Raster, also 0,5 Einheiten (0,31 px bei 15 px) hoeher setzen
          - transform: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'translateY(-0.31px)' : 'none'; ]]]]
          - color: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'var(--nachtblau-amber, #e6b566)' : 'var(--nachtblau-muted, #6e7988)'; ]]]]
        state:
          - font-size: 15px
          - font-weight: 700
          - font-variant-numeric: tabular-nums
          - line-height: 1
          - color: |
              [[[[ return (parseFloat(entity.state) || 0) > 0 ? 'var(--nachtblau-text, #f2f5f8)' : 'var(--nachtblau-text-sekundaer, #8794a5)'; ]]]]
