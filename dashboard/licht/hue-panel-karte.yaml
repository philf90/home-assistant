# ============================================================================
# Hue-Licht-Panel (ersetzt more-info der Hue-Leuchten)
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       licht
# Status:        aktiv
# Karten:        popup-card, button-card
# Templates:     nachtblau_licht_panel (hue-panel-templates.yaml)
# Einfuegen:     jeden Listeneintrag einzeln: Karte hinzufuegen -> Manuell,
#                in die View "Licht & Fenster"
# Platzhalter:   kind_1/kind_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Eigenes Licht-Panel fuer die Hue-Farbleuchten und Hue-Raeume der
# Lichter-Karten (lichter-raum-karte.yaml, lichter-reiter-karte.yaml).
#
# Wie es wirkt:
#   Jede custom:popup-card ersetzt das more-info der Entitaet unter
#   target.entity_id. Die Lichter-Karten oeffnen beim Halten more-info,
#   also erscheint dort dieses Panel. Tippen schaltet weiter nur an/aus.
#   Inhalt: button-card-Template nachtblau_licht_panel
#   (hue-panel-templates.yaml): Kopf mit Schalter, Helligkeit, Favoriten,
#   Effekte, alle Szenen des Raums, "Alle Einstellungen" (normales
#   more-info).
#   Die Popup-Karten selbst sind nur im Bearbeitungsmodus zu sehen. Mit
#   popup_card_all_views: true gelten sie im ganzen Dashboard, nicht nur in
#   der View, in der sie liegen.
#
# Szenen (variables szene, hue_gruppe):
#   - szene: Szenen-Auswahl der Hue-Integration (select.<raum>_szene); ihre
#     Optionen sind die Szenen des Panels, ihr Zustand die aktive Szene.
#   - hue_gruppe: group_name der Hue-Szenen, fuer Helligkeit, "dynamisch"
#     und den Start mit hue.activate_scene (dynamische mit dynamic: true).
#   - Bad und Raum "Bad" nutzen die Zone "Bad" (select.bad_szene), nicht den
#     Raum "Badezimmer": Der Raum enthaelt den Heizluefter-Zwischenstecker,
#     Raum-Szenen koennten ihn mit einschalten.
#   - Farbverlaeufe (Signe, Lowboard) kann HA nicht direkt setzen; sie kommen
#     ueber Szenen, die in der Hue-App angelegt werden. Neue Szenen erscheinen
#     von selbst im Panel.
#   - Schlafzimmer (Hue Go) hat keine Hue-Szene, daher ohne Szenen.
#
# Dialogfarben und -breite wie im DWD-Popup (warnlage-templates.yaml,
# Erklaerung dort); Panel bis 520 px, auf dem Handy volle Breite.
#
# Voraussetzung: Integration Philips Hue (Bridge v2), browser_mod (HACS,
# getestet 3.4.2), custom:button-card (v7) und das Template aus
# hue-panel-templates.yaml.

- type: custom:popup-card
  target: { entity_id: light.stehlampe_2 }
  title: Couch
  popup_card_all_views: true
  style: &dialog |
    --ha-card-background: var(--nachtblau-huelle-oben, #1b2231);
    --card-background-color: var(--nachtblau-huelle-oben, #1b2231);
    --primary-background-color: var(--nachtblau-seite, #171d29);
    --secondary-background-color: var(--nachtblau-huelle-oben, #1b2231);
    --primary-text-color: var(--nachtblau-text, #f2f5f8);
    --secondary-text-color: var(--nachtblau-text-sekundaer, #8794a5);
    --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
    --popup-min-width: min(100vw, 520px);
    --popup-max-width: min(100vw, 520px);
  card:
    type: custom:button-card
    template: nachtblau_licht_panel
    entity: light.stehlampe_2
    variables: { szene: select.wohnzimmer_wohnzimmer_szene, hue_gruppe: Wohnzimmer }

