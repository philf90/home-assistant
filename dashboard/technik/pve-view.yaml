# ============================================================================
# PVE – Proxmox VE: Knoten, virtuelle Maschinen, Speicher, Platten
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       technik
# Status:        aktiv
# Karten:        button-card, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                pve_vm_info_popup (pve-templates.yaml),
#                pve_vm_popup (pve-templates.yaml),
#                top_navigation_technik (technik-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor des Dashboards "Technik" unter
#                views: oder per !include
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Erste View des Dashboards "Technik" (dashboard-technik), Route
# /dashboard-technik/pve, Klasse admin (design/routen.yaml). Entwurf:
# Artefakt "Technik-Dashboard" (26.11.2026).
#
# Sections-View; auf dem Handy untereinander, breit bis zu drei Spalten.
#   Section 1  Top-Navigation · Knoten
#   Section 2  Virtuelle Maschinen · Popups je VM (#pve-vm-<id>)
#   Section 3  Speicher · Platten & ZFS
#   Section 4  schwebende Navbar (floating_navbar, 1:1 wie im Home-Dashboard)
#
# Jede Karte ist eine custom:button-card in der Kartenhuelle; der Inhalt
# entsteht als HTML im Feld "inhalt".
#   Knoten               feste Entitaeten des Knotens (variables.knoten) und
#                        der Messsteckdose davor (variables.leistung,
#                        variables.energie_heute); im Fuss Load 5/15 min,
#                        Threads und RAM des Knotens (Sensoren load_5m,
#                        load_15m, cpus, memory_total; deaktiviert angelegt).
#                        Waehrend einer Sicherung (backup_running an) steht
#                        unter dem Kopf "Backup laeuft seit hh:mm" in Blau,
#                        mit Name der VM, wenn die Aufgabe eine nennt.
#   Virtuelle Maschinen  sucht die Geraete selbst: Geraetename "QEMU <name>
#                        (<id>)" bzw. "LXC <name> (<id>)" der Integration
#                        proxmoxve_custom, dazu deren Sensoren mit den
#                        translation_keys status_raw, cpu_used und
#                        memory_used_perc. Neue oder geloeschte VMs erscheinen
#                        ohne Aenderung an der Karte. Gelesen wird der Name der
#                        Integration (device.name), nicht ein eigener Name.
#                        Tippen auf eine Zeile oeffnet das Popup der VM
#                        (Hash #pve-vm-<id>, pve-templates.yaml): Details und
#                        Aktionen. Das Popup muss es je VM geben (Section 2,
#                        unten); fehlt es, passiert beim Tippen nichts. Die
#                        Zeilen setzen pointer-events: auto, weil button-card
#                        Karten ohne Aktion "disabled" setzt (pointer-events:
#                        none), wie in Fussball, Sicherheit und Flugradar.
#                        RAM: Wert von PVE; der zaehlt den Cache als belegt
#                        (VM 102: PVE etwa 95 %, in der VM etwa 30 %). Fuer
#                        VMs in variables.gast_ram steht stattdessen die
#                        Messung in der VM. Im Fuss die Vergabe: vCPU
#                        (Attribut cpus) und RAM (genutzt + frei = maxmem)
#                        aller VMs gegen Threads und RAM des Knotens.
#   Speicher             Geraete mit Modell "Storage" oder "Shared storage",
#                        Sensor disk_used_perc, dazu frei in GB (disk_free;
#                        deaktiviert angelegt). local und local-zfs liegen im
#                        selben Pool und zeigen denselben freien Platz.
#                        Meldet storage_active "aus" (PVE erreicht den
#                        Speicher nicht, z. B. PBS oder NFS), steht an der
#                        Zeile "nicht erreichbar" in Rot, im Kopf ein Badge.
#   Platten & ZFS        Geraete der Integration mit Modell "ZFS" (Pool:
#                        zfs_health, zfs_used, zfs_total, zfs_used_perc) und
#                        Geraete "Disk <knoten>: <modell>" (health,
#                        temperature, disk_wearout, power_hours,
#                        power_cycles, disk_size). Verschleiss ist der
#                        verbrauchte Anteil (SMART "Percentage Used"; PVE und
#                        Integration rechnen je 100 minus).
#
# Beschriftungen der Knoten-Kacheln bleiben einzeilig: Text in der Viererreihe
#   62,0 px (S25) bzw. 72,5 px (iPhone). "Fehlgeschlagen" ist bei 11,5 px Roboto
#   80,2 px breit und wurde am iPhone trotz weicher Trennstelle nicht getrennt;
#   die Kachel heisst deshalb "Fehler" (31,5 px), Wert: fehlgeschlagene Aufgaben.
#
# Schwellen (Vorschlag aus dem Entwurf, je Karte in variables):
#   Knoten CPU/RAM       ab 75 % Amber, ab 90 % Rot (wie system-karte.yaml)
#   VM-Arbeitsspeicher   ab 85 % Amber, ab 95 % Rot
#   Speicherbelegung     ab 80 % Amber, ab 90 % Rot
#   Platten              Temperatur ab 60 °C Amber, ab 70 °C Rot;
#                        Verschleiss ab 80 % Amber, ab 90 % Rot
#
# Voraussetzung: custom:button-card + custom:decluttering-card (HACS),
#   Integration "Proxmox VE Custom" (dougiteixeira/proxmoxve, getestet 6.0.6,
#   deutsche Entitaetsnamen), Shelly-Messsteckdose vor dem Knoten mit
#   utility_meter "daily", Templates aus technik-templates.yaml,
#   pve-templates.yaml und navigation-templates.yaml; custom:bubble-card fuer
#   die Popups, Integration "System Monitor" fuer den RAM in VM 102,
#   Icon phu:proxmox aus Custom Brand Icons (HACS/Marketplace).
title: PVE
path: pve
icon: phu:proxmox
visible:
- user: benutzer_id_1
type: sections
max_columns: 3
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation_technik
  # ---------------------------------------------------------------- Knoten
  - type: custom:button-card
    entity: binary_sensor.node_pve_status
    variables:
      knoten: pve
      leistung: sensor.shelly_plugs_proxmox_switch_0_power
      energie_heute: sensor.stromverbrauch_proxmox_daily
      gelb: 75
      rot: 90
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    custom_fields:
      inhalt: |
        [[[
          const V = 'var(--nachtblau-violett, #b399d4)';
          const G = 'var(--nachtblau-gruen, #a6d49e)', A = 'var(--nachtblau-amber, #e6b566)', R = 'var(--nachtblau-rot, #f0736a)';
          const S = 'var(--nachtblau-text-sekundaer, #8794a5)', T = 'var(--nachtblau-text, #f2f5f8)';
          const k = 'sensor.node_' + variables.knoten + '_';
          const zahl = (id) => { const e = states[id]; const v = e ? parseFloat(e.state) : NaN; return isNaN(v) ? null : v; };
          const de = (v, d) => v === null ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
          const stufe = (v) => v === null ? T : v >= variables.rot ? R : v >= variables.gelb ? A : T;
          const kachel = (wert, einheit, name, farbe) =>
            `<div style="padding:9px 4px 8px;border-radius:13px;background:var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028));border:1px solid var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));text-align:center;min-width:0;">` +
            `<div style="font-size:16px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:${farbe || T};">${wert}<span style="font-size:11px;font-weight:600;color:${S};">${einheit ? ' ' + einheit : ''}</span></div>` +
            `<div style="font-size:11.5px;line-height:1.25;color:${S};margin-top:1px;">${name}</div></div>`;
          const reihe = (inhalt) => `<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px;margin-top:6px;">${inhalt}</div>`;
          const an = entity && entity.state === 'on';
          const bc = an ? G : R;
          const badge = `<span style="flex:none;display:inline-flex;align-items:center;gap:6px;color:${bc};background:color-mix(in srgb, ${bc} 12%, transparent);border:1px solid color-mix(in srgb, ${bc} 24%, transparent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${bc};"></span>${an ? 'Online' : 'Offline'}</span>`;
          const ver = states[k + 'version'];
          const st = states[k + 'letzter_start'];
          let seit = '';
          const d = st ? new Date(st.state) : null;
          if (d && !isNaN(d)) {
            const z = (n) => String(n).padStart(2, '0');
            seit = ` · läuft seit ${d.getDate()}.${d.getMonth() + 1}., ${z(d.getHours())}:${z(d.getMinutes())}`;
          }
          const unter = (ver && ver.state !== 'unavailable' ? 'Proxmox ' + ver.state : 'Proxmox VE') + seit;
          const kopf =
            `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">` +
            `<div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb, ${V} 16%, transparent);border:1px solid color-mix(in srgb, ${V} 24%, transparent);"><ha-icon icon="phu:proxmox" style="--mdc-icon-size:23px;--ha-icon-display:block;color:${V};"></ha-icon></div>` +
            `<div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${T};">Node ${variables.knoten}</div>` +
            `<div style="font-size:12.5px;line-height:1.3;color:${S};overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${unter}</div></div>${badge}</div>`;
          const cpu = zahl(k + 'cpu_auslastung'), ram = zahl(k + 'prozentsatz_genutzter_arbeitsspeicher');
          const io = zahl(k + 'io_delay'), load = zahl(k + 'load_average_1_min');
          const upd = zahl(k + 'gesamte_updates'), fehl = zahl(k + 'fehlgeschlagene_aufgaben');
          const w = zahl(variables.leistung), kwh = zahl(variables.energie_heute);
          const nullOk = (v) => v === null ? T : v > 0 ? A : G;
          // Laufende Sicherung (vzdump): binary_sensor ..._backup_running mit running_since und
          // running_guests (ID aus der Aufgabe; leer, wenn ein Lauf alle Gaeste sichert)
          const bk = states['binary_sensor.node_' + variables.knoten + '_backup_running'];
          let sicherung = '';
          if (bk && bk.state === 'on') {
            const B = 'var(--nachtblau-blau, #7fb3d5)';
            const a = bk.attributes || {};
            const ab = a.running_since ? new Date(a.running_since) : null;
            const z = (n) => String(n).padStart(2, '0');
            let gast = '';
            const gid = a.running_guests ? String(a.running_guests) : '';
            if (/^\d+$/.test(gid)) {
              gast = 'VM ' + gid;
              for (const g of Object.values(hass.devices || {})) {
                const m = /^(QEMU|LXC)\s+(.+?)\s+\((\d+)\)$/.exec(g.name || '');
                if (m && m[3] === gid) { gast = m[2]; break; }
              }
            }
            const text = 'Backup läuft' + (ab && !isNaN(ab) ? ' seit ' + z(ab.getHours()) + ':' + z(ab.getMinutes()) : '') + (gast ? ' · ' + gast : '');
            sicherung = `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:13px;background:color-mix(in srgb, ${B} 12%, transparent);border:1px solid color-mix(in srgb, ${B} 24%, transparent);color:${B};font-size:13px;font-weight:600;"><ha-icon icon="mdi:backup-restore" style="--mdc-icon-size:18px;--ha-icon-display:block;flex:none;"></ha-icon><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${text}</span></div>`;
          }
          // Fuss: Load 5/15 min, Threads, RAM des Knotens (Sensoren deaktiviert angelegt; fehlen sie, entfaellt der Teil)
          const l5 = zahl(k + 'load_average_5_min'), l15 = zahl(k + 'load_average_15_min');
          const thr = zahl(k + 'cpus'), ramG = zahl(k + 'gesamtarbeitsspeicher');
          const fussTeile = [];
          if (l5 !== null || l15 !== null) fussTeile.push(`Load 5 / 15 min ${de(l5, 2)} / ${de(l15, 2)}`);
          if (thr !== null) fussTeile.push(`${thr} Threads`);
          if (ramG !== null) fussTeile.push(`${de(ramG / 1.073741824, 1)} GiB RAM`);
          const fuss = fussTeile.length ? `<div style="font-size:11.5px;line-height:1.4;color:${S};margin-top:8px;">${fussTeile.map((t) => `<span style="white-space:nowrap;">${t}</span>`).join(' · ')}</div>` : '';
          return kopf + sicherung +
            reihe(kachel(de(cpu, 1), '%', 'CPU', stufe(cpu)) + kachel(de(ram, 1), '%', 'RAM', stufe(ram)) +
                  kachel(de(io, 1), '%', 'IO-Delay') + kachel(de(load, 2), '', 'Load 1 min')) +
            reihe(kachel(upd === null ? '–' : String(upd), '', 'Updates', nullOk(upd)) +
                  kachel(fehl === null ? '–' : String(fehl), '', 'Fehler', fehl > 0 ? R : nullOk(fehl)) +
                  kachel(de(w, 1), 'W', 'Leistung') + kachel(de(kwh, 2), 'kWh', 'heute')) + fuss;
        ]]]
    styles: &huelle
      card:
      - padding: 16px 18px
      - border-radius: 22px
      - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
      - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
      - box-shadow: 0 18px 44px -22px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
      grid:
      - grid-template-areas: '"inhalt"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        inhalt:
        - justify-self: stretch
        - text-align: left
        - min-width: 0
        # button-card setzt auf jedes Feld .ellipsis (nowrap); zuruecksetzen,
        # damit Fusszeilen und Unterzeilen umbrechen (Einzeiler setzen nowrap selbst)
        - white-space: normal
- type: grid
  cards:
  # ---------------------------------------------------- Virtuelle Maschinen
  - type: custom:button-card
    variables:
      knoten: pve
      # RAM gemessen in der VM statt Wert von PVE (Schluessel: VM-ID)
      gast_ram:
        '102': sensor.system_monitor_speicherauslastung_2
      gelb: 85
      rot: 95
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      inhalt: |
        [[[
          const V = 'var(--nachtblau-violett, #b399d4)';
          const G = 'var(--nachtblau-gruen, #a6d49e)', A = 'var(--nachtblau-amber, #e6b566)', R = 'var(--nachtblau-rot, #f0736a)';
          const S = 'var(--nachtblau-text-sekundaer, #8794a5)', L = 'var(--nachtblau-label, #b4c0cf)', T = 'var(--nachtblau-text, #f2f5f8)';
          // Antippen einer Zeile oeffnet das Popup #pve-vm-<id> (Bubble Card), Muster wie im Fussball-Popup:
          // history.pushState + location-changed; touchend nur bei echtem Tipp (nicht beim Scrollen).
          // Die Karte hat keine eigene Aktion, button-card setzt dann pointer-events: none ("disabled");
          // die Zeilen setzen deshalb pointer-events: auto (wie Fussball, Sicherheit, Flugradar).
          const P = window.__nachtblauPve || (window.__nachtblauPve = {});
          P.oeffne = (id) => {
            const h = '#pve-vm-' + id;
            if (location.hash === h) return;
            history.pushState(null, '', location.pathname + location.search + h);
            window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } }));
          };
          P.tipp = (e, id) => {
            e.stopPropagation();
            if (e.type === 'touchstart') { const t = e.touches && e.touches[0]; P._t = t ? { x: t.clientX, y: t.clientY, z: Date.now() } : null; return; }
            if (e.type === 'touchend') {
              const t = e.changedTouches && e.changedTouches[0], a = P._t;
              P._t = null;
              if (!t || !a || Math.hypot(t.clientX - a.x, t.clientY - a.y) > 10 || Date.now() - a.z > 800) return;
              if (e.cancelable) e.preventDefault();
              P._zeit = Date.now();
              P.oeffne(id);
              return;
            }
            if (e.type === 'click') { e.preventDefault(); if (Date.now() - (P._zeit || 0) < 700) return; P.oeffne(id); }
          };
          const vms = {};
          const geraete = hass.devices || {};
          for (const e of Object.values(hass.entities || {})) {
            if (e.platform !== 'proxmoxve_custom' || !e.device_id) continue;
            const g = geraete[e.device_id];
            const m = g ? /^(QEMU|LXC)\s+(.+?)\s+\((\d+)\)$/.exec(g.name || g.name_by_user || '') : null;
            if (!m) continue;
            const v = vms[e.device_id] || (vms[e.device_id] = { typ: m[1], name: m[2], id: parseInt(m[3], 10) });
            if (e.translation_key === 'status_raw') v.status = e.entity_id;
            else if (e.translation_key === 'cpu_used') v.cpu = e.entity_id;
            else if (e.translation_key === 'memory_used_perc') v.ram = e.entity_id;
            else if (e.translation_key === 'memory_used') v.belegt = e.entity_id;
            else if (e.translation_key === 'memory_free') v.frei = e.entity_id;
          }
          const liste = Object.values(vms).sort((a, b) => a.id - b.id);
          const zahl = (id) => { const e = id ? states[id] : null; const v = e ? parseFloat(e.state) : NaN; return isNaN(v) ? null : v; };
          const de = (v, d = 1) => v === null ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
          const stufe = (v) => v === null ? S : v >= variables.rot ? R : v >= variables.gelb ? A : G;
          const laeuft = (v) => v.status && states[v.status] && states[v.status].state === 'running';
          const gastRam = variables.gast_ram || {};
          const vmZahl = liste.filter((v) => v.typ === 'QEMU').length;
          const ctZahl = liste.length - vmZahl;
          const an = liste.filter(laeuft).length;
          const bc = liste.length && an === liste.length ? G : A;
          const badge = liste.length ? `<span style="flex:none;color:${bc};background:color-mix(in srgb, ${bc} 12%, transparent);border:1px solid color-mix(in srgb, ${bc} 24%, transparent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;">${an}/${liste.length}</span>` : '';
          const unter = liste.length ? `${an} von ${liste.length} laufen · ${vmZahl} VM${vmZahl === 1 ? '' : 's'}, ${ctZahl} Container` : 'Keine VMs gefunden';
          const kopf =
            `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">` +
            `<div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb, ${V} 16%, transparent);border:1px solid color-mix(in srgb, ${V} 24%, transparent);"><ha-icon icon="mdi:monitor-dashboard" style="--mdc-icon-size:23px;--ha-icon-display:block;color:${V};"></ha-icon></div>` +
            `<div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${T};">Virtuelle Maschinen</div>` +
            `<div style="font-size:12.5px;line-height:1.3;color:${S};overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance;">${unter}</div></div>${badge}</div>`;
          const pfeil = `<svg viewBox="0 0 24 24" width="12" height="12" style="display:block;flex:none;"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          let vcpu = 0, ramVergeben = 0;
          const zeilen = liste.map((v, i) => {
            const cpuS = v.cpu ? states[v.cpu] : null;
            if (cpuS && cpuS.attributes && cpuS.attributes.cpus) vcpu += cpuS.attributes.cpus;
            const b = zahl(v.belegt), f = zahl(v.frei);
            if (b !== null && f !== null) ramVergeben += b + f;
            const gast = gastRam[String(v.id)] ? zahl(gastRam[String(v.id)]) : null;
            const ram = gast !== null ? gast : zahl(v.ram), cpu = zahl(v.cpu);
            const st = v.status && states[v.status] ? states[v.status].state : 'unbekannt';
            const ok = st === 'running';
            const text = { stopped: 'gestoppt', paused: 'pausiert', suspended: 'angehalten', shutdown: 'fährt herunter' }[st] || st;
            const rechts = ok
              ? `CPU ${de(cpu)} % · RAM <b style="color:${stufe(ram)};font-weight:700;">${de(ram)} %</b>`
              : `<b style="color:${st === 'stopped' ? S : A};font-weight:700;">${text}</b>`;
            const balken = ok && ram !== null
              ? `<div style="grid-column:1 / -1;height:5px;border-radius:3px;background:var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));overflow:hidden;"><div style="height:100%;width:${Math.min(100, Math.max(0, ram))}%;border-radius:3px;background:${stufe(ram)};"></div></div>`
              : '';
            return `<div role="button" tabindex="0" aria-label="${v.name}: Details und Aktionen" onpointerdown="event.stopPropagation()" ontouchstart="window.__nachtblauPve.tipp(event)" ontouchend="window.__nachtblauPve.tipp(event,${v.id})" onclick="window.__nachtblauPve.tipp(event,${v.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__nachtblauPve.oeffne(${v.id});}" style="cursor:pointer;pointer-events:auto;display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:4px 10px;align-items:center;padding:8px 2px;${i ? 'border-top:1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05));' : ''}">` +
              `<div style="font-size:14px;font-weight:500;color:${T};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v.name} <span style="font-size:12px;font-weight:400;color:${S};">${v.typ === 'LXC' ? 'CT ' : ''}${v.id}</span></div>` +
              `<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:${L};white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;">${rechts}<span style="color:${S};">${pfeil}</span></div>${balken}</div>`;
          }).join('');
          // Vergabe gegen den Knoten (Sensoren cpus und memory_total, deaktiviert angelegt)
          const k = 'sensor.node_' + variables.knoten + '_';
          const thr = zahl(k + 'cpus'), ramK = zahl(k + 'gesamtarbeitsspeicher');
          const gib = (gb) => gb / 1.073741824;
          const vergabe = [];
          if (vcpu) vergabe.push(`${vcpu} vCPU${thr !== null ? ' auf ' + thr + ' Threads' : ''}`);
          if (ramVergeben) vergabe.push(`${de(gib(ramVergeben), 0)}${ramK !== null ? ' von ' + de(gib(ramK), 1) : ''} GiB RAM`);
          const gastNamen = liste.filter((v) => gastRam[String(v.id)]).map((v) => v.name);
          const fuss = `<div style="font-size:11.5px;line-height:1.4;color:${S};margin-top:8px;">` +
            (vergabe.length ? `Vergeben: ${vergabe.join(', ')}.<br>` : '') +
            `RAM aus Sicht von PVE (Cache zählt als belegt)${gastNamen.length ? ', bei ' + gastNamen.join(', ') + ' gemessen in der VM' : ''}. Ab ${variables.gelb} % Amber, ab ${variables.rot} % Rot. Tippen zeigt Details und Aktionen.</div>`;
          return kopf + zeilen + (liste.length ? fuss : '');
        ]]]
    styles: *huelle
