- type: grid
  cards:
  # ---------------------------------------------------------------- Speicher
  - type: custom:button-card
    variables:
      gelb: 80
      rot: 90
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      inhalt: |
        [[[
          const V = 'var(--nachtblau-violett, #b399d4)', B = 'var(--nachtblau-blau, #7fb3d5)';
          const A = 'var(--nachtblau-amber, #e6b566)', R = 'var(--nachtblau-rot, #f0736a)';
          const S = 'var(--nachtblau-text-sekundaer, #8794a5)', T = 'var(--nachtblau-text, #f2f5f8)';
          const geraete = hass.devices || {};
          const liste = [];
          // frei in GB je Geraet (disk_free, deaktiviert angelegt; fehlt er, entfaellt die Angabe)
          const freiId = {}, aktivId = {};
          for (const e of Object.values(hass.entities || {})) {
            if (e.platform !== 'proxmoxve_custom' || !e.device_id) continue;
            if (e.translation_key === 'disk_free') freiId[e.device_id] = e.entity_id;
            else if (e.translation_key === 'storage_active') aktivId[e.device_id] = e.entity_id;
          }
          const gb = (v) => v === null ? '' : v >= 1000 ? (v / 1000).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' TB' : v.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' GB';
          for (const e of Object.values(hass.entities || {})) {
            if (e.platform !== 'proxmoxve_custom' || e.translation_key !== 'disk_used_perc' || !e.device_id) continue;
            const g = geraete[e.device_id];
            if (!g || (g.model !== 'Storage' && g.model !== 'Shared storage')) continue;
            const voll = (g.name || '').replace(/^Storage\s+/, '');
            const teile = voll.split('/');
            const s = states[e.entity_id];
            const v = s ? parseFloat(s.state) : NaN;
            const fs = freiId[e.device_id] ? states[freiId[e.device_id]] : null;
            const fv = fs ? parseFloat(fs.state) : NaN;
            const ort = g.model === 'Shared storage' ? 'geteilt' : (teile.length > 1 ? teile[0] : '');
            // storage_active: kann PVE den Speicher gerade erreichen (z. B. PBS, NFS)? Fehlt der Sensor, gilt er als erreichbar.
            const ak = aktivId[e.device_id] ? states[aktivId[e.device_id]] : null;
            liste.push({
              name: teile[teile.length - 1],
              zusatz: [ort, isNaN(fv) ? '' : gb(fv) + ' frei'].filter(Boolean).join(' · '),
              wert: isNaN(v) ? null : v,
              weg: !!ak && ak.state === 'off',
            });
          }
          liste.sort((a, b) => (b.wert === null ? -1 : b.wert) - (a.wert === null ? -1 : a.wert));
          const de = (v) => v === null ? '–' : v < 1 && v > 0 ? '< 1' : v.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
          const stufe = (v) => v === null ? S : v >= variables.rot ? R : v >= variables.gelb ? A : B;
          const weg = liste.filter((x) => x.weg).length;
          const badge = weg ? `<span style="flex:none;color:${R};background:color-mix(in srgb, ${R} 12%, transparent);border:1px solid color-mix(in srgb, ${R} 24%, transparent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;">${weg} nicht erreichbar</span>` : '';
          const kopf =
            `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">` +
            `<div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb, ${V} 16%, transparent);border:1px solid color-mix(in srgb, ${V} 24%, transparent);"><ha-icon icon="mdi:harddisk" style="--mdc-icon-size:23px;--ha-icon-display:block;color:${V};"></ha-icon></div>` +
            `<div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${T};">Speicher</div>` +
            `<div style="font-size:12.5px;line-height:1.3;color:${S};">Belegung aus Sicht von PVE</div></div>${badge}</div>`;
          const zeilen = liste.map((x, i) =>
            `<div style="display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:4px 10px;align-items:center;padding:8px 2px;${i ? 'border-top:1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05));' : ''}">` +
            `<div style="font-size:14px;font-weight:500;color:${T};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${x.name} <span style="font-size:12px;font-weight:400;color:${S};">${x.zusatz}</span></div>` +
            (x.weg
              ? `<div style="font-size:13px;font-weight:700;white-space:nowrap;color:${R};">nicht erreichbar</div>`
              : `<div style="font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:${x.wert !== null && x.wert >= variables.gelb ? stufe(x.wert) : T};">${de(x.wert)} %</div>`) +
            `<div style="grid-column:1 / -1;height:5px;border-radius:3px;background:var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));overflow:hidden;"><div style="height:100%;width:${x.weg || x.wert === null ? 0 : Math.min(100, Math.max(1, x.wert))}%;border-radius:3px;background:${stufe(x.wert)};"></div></div></div>`
          ).join('');
          return kopf + (zeilen || `<div style="font-size:13px;color:${S};">Keine Speicher gefunden</div>`);
        ]]]
    styles: *huelle
  # ---------------------------------------------------------- Platten & ZFS
  - type: custom:button-card
    variables:
      temp: [60, 70]
      verschleiss: [80, 90]
      gelb: 80
      rot: 90
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      inhalt: |
        [[[
          const V = 'var(--nachtblau-violett, #b399d4)', B = 'var(--nachtblau-blau, #7fb3d5)';
          const G = 'var(--nachtblau-gruen, #a6d49e)', A = 'var(--nachtblau-amber, #e6b566)', R = 'var(--nachtblau-rot, #f0736a)';
          const S = 'var(--nachtblau-text-sekundaer, #8794a5)', L = 'var(--nachtblau-label, #b4c0cf)', T = 'var(--nachtblau-text, #f2f5f8)';
          const geraete = hass.devices || {};
          const je = {};
          for (const e of Object.values(hass.entities || {})) {
            if (e.platform !== 'proxmoxve_custom' || !e.device_id || !e.translation_key) continue;
            const g = geraete[e.device_id];
            if (!g) continue;
            const art = g.model === 'ZFS' ? 'zfs' : /^Disk\s/.test(g.name || '') ? 'disk' : null;
            if (!art) continue;
            const x = je[e.device_id] || (je[e.device_id] = { art, g, e: {} });
            x.e[e.translation_key] = e.entity_id;
          }
          const wert = (x, k) => { const s = x.e[k] ? states[x.e[k]] : null; return s ? s.state : null; };
          const zahl = (x, k) => { const v = parseFloat(wert(x, k)); return isNaN(v) ? null : v; };
          const de = (v, d) => v === null ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
          const tb = (v) => v === null ? '' : v >= 1000 ? de(v / 1000, 1) + ' TB' : de(v, 0) + ' GB';
          const stufe = (v, [g, r], normal) => v === null ? S : v >= r ? R : v >= g ? A : normal;
          const pools = Object.values(je).filter((x) => x.art === 'zfs').sort((a, b) => (a.g.name || '').localeCompare(b.g.name || ''));
          const platten = Object.values(je).filter((x) => x.art === 'disk').sort((a, b) => (a.g.name || '').localeCompare(b.g.name || ''));
          const poolOk = (x) => wert(x, 'zfs_health') === 'ONLINE';
          const platteOk = (x) => wert(x, 'health') !== 'on';
          const probleme = pools.filter((x) => !poolOk(x)).length + platten.filter((x) => !platteOk(x)).length;
          const bc = probleme ? R : G;
          const badge = pools.length + platten.length ? `<span style="flex:none;color:${bc};background:color-mix(in srgb, ${bc} 12%, transparent);border:1px solid color-mix(in srgb, ${bc} 24%, transparent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;">${probleme ? probleme + ' Problem' + (probleme === 1 ? '' : 'e') : 'OK'}</span>` : '';
          const unter = [platten.length ? platten.length + ' Platte' + (platten.length === 1 ? '' : 'n') : '', pools.length ? (pools.length === 1 ? 'ZFS-Pool ' + (pools[0].g.name || '').replace(/^.*ZFS Pool\s+/, '') : pools.length + ' ZFS-Pools') : ''].filter(Boolean).join(' · ') || 'Keine Platten gefunden';
          const kopf =
            `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">` +
            `<div style="flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb, ${V} 16%, transparent);border:1px solid color-mix(in srgb, ${V} 24%, transparent);"><ha-icon icon="mdi:expansion-card-variant" style="--mdc-icon-size:23px;--ha-icon-display:block;color:${V};"></ha-icon></div>` +
            `<div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:${T};">Platten &amp; ZFS</div>` +
            `<div style="font-size:12.5px;line-height:1.3;color:${S};">${unter}</div></div>${badge}</div>`;
          const balken = (p, farbe) => `<div style="grid-column:1 / -1;height:5px;border-radius:3px;background:var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06));overflow:hidden;"><div style="height:100%;width:${p === null ? 0 : Math.min(100, Math.max(1, p))}%;border-radius:3px;background:${farbe};"></div></div>`;
          const rahmen = (i) => `display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:3px 10px;align-items:center;padding:8px 2px;${i ? 'border-top:1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05));' : ''}`;
          const zeilen = [];
          for (const x of pools) {
            const p = zahl(x, 'zfs_used_perc'), ok = poolOk(x);
            const name = (x.g.name || '').replace(/^.*ZFS Pool\s+/, '');
            zeilen.push(`<div style="${rahmen(zeilen.length)}">` +
              `<div style="font-size:14px;font-weight:500;color:${T};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name} <span style="font-size:12px;font-weight:400;color:${S};">ZFS · ${tb(zahl(x, 'zfs_used'))} von ${tb(zahl(x, 'zfs_total'))}</span></div>` +
              `<div style="font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:${ok ? (p !== null && p >= variables.gelb ? stufe(p, [variables.gelb, variables.rot], T) : T) : R};">${ok ? de(p, 1) + ' %' : wert(x, 'zfs_health') || 'unbekannt'}</div>` +
              balken(p, stufe(p, [variables.gelb, variables.rot], B)) + `</div>`);
          }
          for (const x of platten) {
            const name = (x.g.name || '').replace(/^Disk\s+[^:]+:\s*/, '');
            const typ = ((x.g.model || '').split(/\s+/)[0] || '').replace(/^NVME$/i, 'NVMe');
            const t = zahl(x, 'temperature'), w = zahl(x, 'disk_wearout'), h = zahl(x, 'power_hours'), c = zahl(x, 'power_cycles');
            const ok = platteOk(x);
            const rechts = ok ? `<span style="color:${stufe(t, variables.temp, T)};">${de(t, 0)} °C</span>` : `<span style="color:${R};">SMART-Fehler</span>`;
            const info = [w !== null ? `Verschleiß <b style="font-weight:700;color:${stufe(w, variables.verschleiss, L)};">${de(w, 0)} %</b>` : '', h !== null ? de(h, 0) + ' h' : '', c !== null ? de(c, 0) + ' Starts' : ''].filter(Boolean).map((v) => `<span style="white-space:nowrap;">${v}</span>`).join(' · ');
            zeilen.push(`<div style="${rahmen(zeilen.length)}">` +
              `<div style="font-size:14px;font-weight:500;color:${T};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name} <span style="font-size:12px;font-weight:400;color:${S};">${[tb(zahl(x, 'disk_size')), typ].filter(Boolean).join(' · ')}</span></div>` +
              `<div style="font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;">${rechts}</div>` +
              `<div style="grid-column:1 / -1;font-size:12px;line-height:1.35;color:${S};">${info}</div>` +
              (w !== null ? balken(w, stufe(w, variables.verschleiss, B)) : '') + `</div>`);
          }
          const fuss = platten.length ? `<div style="font-size:11.5px;line-height:1.4;color:${S};margin-top:8px;">Verschleiß: verbrauchter Anteil laut SMART, ab ${variables.verschleiss[0]} % Amber. Temperatur ab ${variables.temp[0]} °C Amber, ab ${variables.temp[1]} °C Rot.</div>` : '';
          return kopf + (zeilen.join('') || `<div style="font-size:13px;color:${S};">Keine Platten gefunden</div>`) + fuss;
        ]]]
    styles: *huelle
- type: grid
  cards:
  - type: custom:decluttering-card
    template: floating_navbar
