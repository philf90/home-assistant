# ============================================================================
# Technik – Decluttering-Template top_navigation_technik
# ----------------------------------------------------------------------------
# Art:           templates
# Bereich:       technik
# Status:        aktiv
# Karten:        button-card
# Templates:     keine
# Einfuegen:     Raw-Konfigurationseditor des Dashboards "Technik",
#                oberste Ebene unter decluttering_templates:
# Platzhalter:   keine
# ============================================================================
# Top-Navigation des Dashboards "Technik" (dashboard-technik). Raster,
# Kachelform und Styles wie top_navigation in navigation-templates.yaml:
# 10 Kacheln in zwei Reihen, Reihe 1 mit Beschriftung, Reihe 2 nur Icons.
# Entwurf: Artefakt "Technik-Dashboard" (26.11.2026), Variante B.
#
# Belegung:
#   Reihe 1  PVE, PBS, Netzwerk, Docker, HmIP
#   Reihe 2  Zigbee, NAS, System, frei, frei
#   Zigbee springt auf die Zigbee2MQTT-App (/45df7312_zigbee2mqtt/ingress),
#   wie im More-Menue; eine eigene View gibt es dafuer nicht.
#   Docker ist seit 26.11.2026 verlinkt (docker-view.yaml, Pilot des Umzugs),
#   NAS ebenso (nas-view.yaml, neu gebaut), Netzwerk und Homematic IP ebenfalls
#   seit 26.11.2026 (netzwerk-view.yaml, homematic-view.yaml), System ebenso
#   (system-view.yaml).
#   frei: gestrichelte Kachel mit Plus, ohne Aktion.
#
# Abweichungen von top_navigation (Home):
#   - Eine Farbe fuer alle belegten Kacheln: Violett, die Bereichsfarbe
#     Technik (DESIGN.md, "Akzente und Bereiche").
#   - Gruener Punkt an der aktuellen View, wie im More-Menue: Verglichen wird
#     window.location.pathname mit variables.pfad (auch Unterseiten).
#   - Kacheln ohne Ziel haben tap_action und hold_action none; button-card
#     zeichnet dann keinen Ripple.
#
# Einbindung: Dieses Template und floating_navbar gehoeren in die
#   decluttering_templates des Dashboards "Technik". floating_navbar wird
#   unveraendert aus navigation-templates.yaml kopiert (Bottom-Navigation
#   1:1 wie im Home-Dashboard); die Templates gelten nur im eigenen Dashboard.
#   In jeder View:
#     - type: custom:decluttering-card
#       template: top_navigation_technik
#
# Voraussetzung: custom:decluttering-card + custom:button-card (HACS); Icons mdi,
#   dazu selfhst:homematic-ip aus dem Icon-Set Selfh.st icons (HACS/Marketplace).
decluttering_templates:
  top_navigation_technik:
    card:
      type: vertical-stack
      cards:
        # ---------- Reihe 1: mit Beschriftung ----------
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              # Glyphe von mdi:server-network sitzt 1 Einheit unter der Mitte
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/pve, glyph: [0, 1] }
              icon: mdi:server-network
              name: PVE
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-technik/pve }
              # Klasse admin (design/routen.yaml): nur fuer Admins
              hidden: &nur_admin '[[[ return !user.is_admin; ]]]'
              extra_styles: &hier_punkt |
                /* Punkt "aktuelle View" rechts oben an der Icon-Kachel (44 px breit,
                   rechte Kante bei 50 % + 22 px); sichtbar ueber --tn-hier aus styles.card */
                ha-card::after { content: ""; position: absolute; top: 9px; left: calc(50% + 17px); width: 7px; height: 7px; border-radius: 50%; background: var(--nachtblau-gruen, #a6d49e); box-shadow: 0 0 0 3px color-mix(in srgb, var(--nachtblau-gruen, #a6d49e) 18%, transparent); opacity: var(--tn-hier, 0%); pointer-events: none; }
              styles: &tile_labeled
                card:
                  - position: relative
                  - padding: 12px 6px 11px
                  - border-radius: 18px
                  - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
                  - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
                  - box-shadow: 0 12px 30px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
                  # 100 % in der aktuellen View, sonst 0 %
                  - --tn-hier: "[[[ const p = window.location.pathname, z = variables.pfad || ''; return z && (p === z || p.startsWith(z + '/')) ? '100%' : '0%'; ]]]"
                grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-rows: min-content min-content
                  - justify-items: center
                img_cell:
                  - width: 44px
                  - height: 44px
                  - border-radius: 13px
                  - margin-bottom: 8px
                  - background: |
                      [[[ return 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'; ]]]
                  - border: |
                      [[[ return '1px solid color-mix(in srgb, ' + variables.accent + ' 24%, transparent)'; ]]]
                icon:
                  - --ha-icon-display: block
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[ return variables.accent; ]]]
                  # Glyphe mittig wie im More-Menue (navigation-templates.yaml): variables.glyph
                  # ist die Mitte der Glyphe im 24er-Raster relativ zu (12, 12); bei 24 px ist
                  # eine Rastereinheit 1 px (nur ab 0,4 Einheiten eingetragen). variables.skala fuer
                  # Icons ohne MDI-Rand (Logo fuellt 24 von 24): 20/24 wie eine MDI-Glyphe
                  - transform: '[[[ const g = variables.glyph || [0, 0], s = variables.skala || 1; return `translate(${-g[0]}px, ${-g[1]}px)` + (s !== 1 ? ` scale(${s})` : ``); ]]]'
                name:
                  - font-size: 12px
                  - font-weight: 600
                  - color: 'var(--nachtblau-text, #f2f5f8)'
                  - white-space: nowrap
                  - overflow: hidden
                  - text-overflow: ellipsis
                  - max-width: 100%
            - type: custom:button-card
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/pbs }
              icon: mdi:backup-restore
              name: PBS
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-technik/pbs }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_labeled
            - type: custom:button-card
              # Glyphe von mdi:router-network sitzt 4 Einheiten unter der Mitte (wie More-Menue)
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/netzwerk, glyph: [0, 4] }
              icon: mdi:router-network
              name: Netzwerk
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-technik/netzwerk }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_labeled
            - type: custom:button-card
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/docker }
              icon: mdi:docker
              name: Docker
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-technik/docker }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_labeled
            - type: custom:button-card
              # Homematic-IP-Logo aus Selfh.st icons (Marketplace, Praefix selfhst:); fuellt das
              # Raster ganz (0..512 von 512), daher skala 20/24 wie eine MDI-Glyphe
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/homematic-ip, skala: 0.8333 }
              icon: selfhst:homematic-ip
              name: HmIP
              show_icon: true
              show_name: true
              tap_action: { action: navigate, navigation_path: /dashboard-technik/homematic-ip }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_labeled
        # ---------- Reihe 2: nur Icons ----------
        - type: horizontal-stack
          cards:
            # Zigbee: keine eigene View, sondern die Zigbee2MQTT-App (Ingress), wie der
            # Zigbee-Eintrag im More-Menue; Route der Klasse admin. Glyphe mittig.
            - type: custom:button-card
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /45df7312_zigbee2mqtt/ingress }
              icon: mdi:zigbee
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /45df7312_zigbee2mqtt/ingress }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              # wie tile_icononly in navigation-templates.yaml, dazu Punkt "aktuelle View"
              styles: &tile_icononly
                card:
                  - position: relative
                  - padding: 12px 6px
                  - border-radius: 18px
                  - background: 'linear-gradient(180deg, var(--nachtblau-huelle-oben, #1b2231) 0%, var(--nachtblau-huelle-unten, #171d29) 55%)'
                  - border: 1px solid var(--nachtblau-huelle-rand, rgba(255, 255, 255, 0.05))
                  - box-shadow: 0 12px 30px -20px var(--nachtblau-schatten, rgba(0, 0, 0, 0.7))
                  - --tn-hier: "[[[ const p = window.location.pathname, z = variables.pfad || ''; return z && (p === z || p.startsWith(z + '/')) ? '100%' : '0%'; ]]]"
                grid:
                  - grid-template-areas: '"i"'
                  - justify-items: center
                img_cell:
                  - width: 44px
                  - height: 44px
                  - border-radius: 13px
                  - background: |
                      [[[ return 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'; ]]]
                  - border: |
                      [[[ return '1px solid color-mix(in srgb, ' + variables.accent + ' 24%, transparent)'; ]]]
                icon:
                  - --ha-icon-display: block
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[ return variables.accent; ]]]
            - type: custom:button-card
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/nas }
              icon: mdi:nas
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-technik/nas }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_icononly
            - type: custom:button-card
              variables: { accent: 'var(--nachtblau-violett, #b399d4)', pfad: /dashboard-technik/system }
              icon: mdi:monitor-dashboard
              show_icon: true
              show_name: false
              tap_action: { action: navigate, navigation_path: /dashboard-technik/system }
              hidden: *nur_admin
              extra_styles: *hier_punkt
              styles: *tile_icononly
            # frei: gestrichelt, ohne Huelle, Plus in Muted
            - type: custom:button-card
              icon: mdi:plus
              show_icon: true
              show_name: false
              tap_action: { action: none }
              hold_action: { action: none }
              styles: &frei_icononly
                card:
                  - padding: 12px 6px
                  - border-radius: 18px
                  - background: none
                  - border: 1px dashed var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
                  - box-shadow: none
                grid:
                  - grid-template-areas: '"i"'
                  - justify-items: center
                img_cell:
                  - width: 44px
                  - height: 44px
                  - border-radius: 13px
                  - background: 'var(--nachtblau-unterkachel, rgba(255, 255, 255, 0.028))'
                  - border: 1px dashed var(--nachtblau-unterkachel-rand, rgba(255, 255, 255, 0.06))
                icon:
                  - --ha-icon-display: block
                  - width: 24px
                  - height: 24px
                  - color: 'var(--nachtblau-muted, #6e7988)'
            - type: custom:button-card
              icon: mdi:plus
              show_icon: true
              show_name: false
              tap_action: { action: none }
              hold_action: { action: none }
              styles: *frei_icononly
