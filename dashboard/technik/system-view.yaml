# ============================================================================
# System – Home Assistant, Claude-Nutzung, Batterien
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       technik
# Status:        aktiv
# Karten:        decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                top_navigation_technik (technik-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor des Dashboards "Technik" unter
#                views: oder per !include
# Platzhalter:   benutzer_id_1/benutzer_id_2
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# View des Dashboards "Technik" (dashboard-technik), Route
# /dashboard-technik/system, Klasse admin (design/routen.yaml). Bis 26.11.2026
# lag sie nur in der Instanz (Home-Dashboard, /dashboard-home/system); die
# Karten standen schon einzeln im Repo und werden hier eingebunden.
#
# Sections-View; auf dem Handy untereinander, breit bis zu drei Spalten.
#   Section 1  Top-Navigation · Home Assistant und Proxmox-VM
#              (system-karte.yaml)
#   Section 2  Claude-Nutzungslimits (claude-nutzung-karte.yaml)
#   Section 3  Batterien (batterien-karte.yaml)
#   Section 4  schwebende Navbar (floating_navbar, 1:1 wie im Home-Dashboard)
#
# Einbindung (YAML-Dashboard):
#   views:
#     - !include dashboard/technik/system-view.yaml
#   Die Includes unten sind relativ zu dieser Datei und zeigen in die Ordner
#   netzwerk/ und sonstiges/; beim Kopieren die Ordnerstruktur beibehalten.
#   Platzhalter der eingebundenen Karten (Claude-Konto) stehen in deren Kopf.
#
# Templates: Die Batterie-Karte braucht nachtblau_batterien
#   (batterien-templates.yaml) in den button_card_templates des Dashboards
#   "Technik"; die Hinweiszeile der Home-Startseite nutzt dasselbe Template im
#   Home-Dashboard. button-card-Templates gelten je Dashboard, es steht daher
#   in beiden.
#
# Voraussetzung: custom:button-card + custom:decluttering-card
#                + custom:uptime-card + card-mod (HACS), Paket
#                batterien-konfig.yaml, Integration "Claude Usage",
#                Templates aus technik-templates.yaml,
#                navigation-templates.yaml und batterien-templates.yaml.
title: System
path: system
# wie die Kachel der Top-Navigation (technik-templates.yaml); phu:proxmox hat PVE
icon: mdi:monitor-dashboard
visible:
- user: benutzer_id_1
type: sections
max_columns: 3
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation_technik
  - !include ../netzwerk/system-karte.yaml
- type: grid
  cards:
  - !include ../sonstiges/claude-nutzung-karte.yaml
- type: grid
  cards:
  - !include ../sonstiges/batterien-karte.yaml
- type: grid
  cards:
  - type: custom:decluttering-card
    template: floating_navbar
