# ============================================================================
# Sicherheit – komplette Ansicht
# ----------------------------------------------------------------------------
# Art:           view
# Bereich:       sicherheit
# Status:        aktiv
# Karten:        button-card, card-mod, decluttering-card
# Templates:     floating_navbar (navigation-templates.yaml),
#                sicherheit_inhalt (sicherheit-templates.yaml),
#                sicherheit_kopf (sicherheit-templates.yaml),
#                sicherheit_wache (sicherheit-templates.yaml),
#                top_navigation (navigation-templates.yaml)
# Einfuegen:     Raw-Konfigurationseditor unter views: oder per !include
# Platzhalter:   keine
# ============================================================================
# Sicherheits-View im Owlet-Stil. Alle Inhalte kommen aus der Bibliothek in
# sicherheit-templates.yaml (Entitaeten dort im Block KONFIGURATION).
#
#   Sicherheit      Gesamtstatus, Hinweise, "Vor dem Gehen" bzw. "Zustand"
#                   und Knopf fuer den Wachmodus (gedrueckt halten)
#   Zutritt         Schloss, Keypad, Haustuer verriegeln, Zugaenge und
#                   Schloss der letzten 24 h
#   Tueren/Fenster  offene Kontakte; bei Abwesenheit amber
#   Rauch & CO      Rauchmelder und Audioerkennung der Kameras
#   Kameras         online, Paket, zuletzt erkannte Person
#   System          Backup, Updates, Internet
#   Meldungen       Schalter je Ereignis (Push nur bei aktivem Wachmodus)
#
# Passt zur Route /dashboard-home/sicherheit (Eintrag im "More"-Menue von
# navbar-karte.yaml / navigation-templates.yaml, Bereich "Zuhause").
# Helfer und Automationen: wachmodus-konfig.yaml.
#
# Voraussetzung: custom:button-card (v7) + custom:decluttering-card + card-mod
#                (HACS), Templates aus sicherheit-templates.yaml und
#                navigation-templates.yaml.
title: Sicherheit
path: sicherheit
icon: mdi:shield-home
type: sections
max_columns: 2
cards: []
sections:
- type: grid
  cards:
  - type: custom:decluttering-card
    template: top_navigation

  - type: custom:button-card
    template: sicherheit_wache

  # ======================= Zutritt =======================
  - type: vertical-stack
    card_mod: &huelle
      style: |
        #root {
          background: linear-gradient(180deg, var(--owlet-huelle-oben, #1b2231) 0%, var(--owlet-huelle-unten, #171d29) 55%) !important;
          border: 1px solid var(--owlet-huelle-rand, rgba(255, 255, 255, 0.05)) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px var(--owlet-schatten, rgba(0, 0, 0, 0.7)) !important;
          padding: 16px 18px !important;
          gap: 8px !important;
        }
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:door-closed-lock
      name: Zutritt
      variables: { abschnitt: zutritt }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: zutritt }

  # ======================= Tueren und Fenster =======================
  - type: vertical-stack
    card_mod: *huelle
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:window-open-variant
      name: Türen & Fenster
      variables: { abschnitt: oeffnungen }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: oeffnungen }

- type: grid
  cards:
  # ======================= Rauch und CO =======================
  - type: vertical-stack
    card_mod: *huelle
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:smoke-detector-variant
      name: Rauch & CO
      variables: { abschnitt: rauch }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: rauch }

  # ======================= Kameras =======================
  - type: vertical-stack
    card_mod: *huelle
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:cctv
      name: Kameras
      variables: { abschnitt: kameras }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: kameras }

  # ======================= System =======================
  - type: vertical-stack
    card_mod: *huelle
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:backup-restore
      name: System
      variables: { abschnitt: system }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: system }

  # ======================= Meldungen =======================
  - type: vertical-stack
    card_mod: *huelle
    cards:
    - type: custom:button-card
      template: sicherheit_kopf
      icon: mdi:bell-ring-outline
      name: Meldungen
      variables: { abschnitt: meldungen }
    - type: custom:button-card
      template: sicherheit_inhalt
      variables: { abschnitt: meldungen }

  - type: custom:decluttering-card
    template: floating_navbar
