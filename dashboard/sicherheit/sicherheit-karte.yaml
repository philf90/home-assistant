# ============================================================================
# Sicherheit – Karte fuer die Home-View
# ----------------------------------------------------------------------------
# Art:           karte
# Bereich:       sicherheit
# Status:        aktiv
# Karten:        button-card
# Templates:     sicherheit_wache (sicherheit-templates.yaml)
# Einfuegen:     Karte hinzufuegen -> Manuell
# Platzhalter:   keine
# ============================================================================
# Dieselbe Karte wie oben in der Sicherheits-View: Gesamtstatus, Hinweise,
# "Vor dem Gehen" bzw. "Zustand" und Knopf fuer den Wachmodus. Ein Tipp auf
# die Karte oeffnet die Sicherheits-View; der Knopf faengt Tipps selbst ab
# und schaltet erst nach 0,8 s Gedrueckthalten.
#
# Voraussetzung: custom:button-card (v7), Templates aus
#                sicherheit-templates.yaml.
type: custom:button-card
template: sicherheit_wache
tap_action:
  action: navigate
  navigation_path: /dashboard-home/sicherheit
styles:
  card:
  - cursor: pointer
