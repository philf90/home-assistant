# ============================================================================
# Sicherheit – Rauchalarm (Automationen und Helfer)
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       sicherheit
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
#                (oder die Automationen einzeln im YAML-Editor der UI einfuegen)
# Platzhalter:   notify.mobile_app_iphone, *_seriennr, telegram_eintrag
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Meldet einen Alarm der vier Homematic-IP-Rauchwarnmelder (HmIP-SWSD-2) an
# Abwesende und Anwesende: kritischer Hinweis aufs iPhone (klingelt auch bei
# Stummschaltung) und Telegram, beide gleichzeitig, mit Raum und Etage des
# ausloesenden Melders. Das zweite Handy (Android) ist seit 18.11.2026 bewusst
# nicht dabei; wer es braucht, ergaenzt im parallel-Block einen Zweig mit
# notify.mobile_app_<handy>, data: ttl 0, priority high, channel alarm_stream
# (Alarmton auch bei Stummschaltung).
# Umgesetzt am 18.11.2026 nach dem Plan "Umbauplan Rauchalarm" (eigene und
# unabhaengige Pruefung); vorher ging nur ein fester Text ohne Raum per
# Telegram raus, und ein Alarm aus einem Neustart heraus gar nicht.
#
# Inhalt:
#   automation "Sicherheit: Rauchalarm melden"
#       Die Melder sind per Funk vernetzt: der ausloesende steht auf
#       primary_alarm, die uebrigen auf secondary_alarm. Jeder Wechsel auf
#       primary_alarm wird sofort gemeldet (zweiter Raum, erneuter Alarm). Ein
#       secondary_alarm meldet nur, wenn nach 5 s kein Ursprung bekannt ist,
#       und dann genau einmal. Modus parallel: nichts wird verworfen.
#       Start-Trigger: Beim Start von Home Assistant sind die Melder geladen,
#       bevor die Trigger zuhoeren (gemessen: 10 s vorher); ohne ihn kaeme ein
#       Alarm aus dem Neustart heraus nie an. Bewusst ein state-Trigger statt
#       air_quality.smoke_detected: nur er feuert, wenn ein Melder nach einer
#       Unterbrechung zur CCU direkt im Alarm zurueckkommt.
#       "Aktionen ausfuehren" schickt eine TEST-Meldung ueber alle Kanaele,
#       ausser waehrend eines echten Alarms.
#   automation "Sicherheit: Rauchalarm Entwarnung"
#       sobald kein Melder mehr im Alarm ist, mit Dauer; ist ein Melder dabei
#       nicht erreichbar, kritisch "Entwarnung unsicher" mit dem Raum.
#   automation "Sicherheit: Rauchalarm-Hinweis merken"   (seit 18.11.2026)
#       merkt Beginn und Raum eines Alarms fuer die Rauchalarm-Karte der Home
#       View (rauchalarm-karte.yaml) und schaltet den Hinweis ein. Die Karte
#       zeigt damit nach dem Alarm "Rauchalarm vorbei" bzw. "Entwarnung
#       unsicher", bis jemand "Gesehen" tippt. Neuer Alarm (Hinweis aus, oder
#       kein anderer Melder seit mehr als 60 s im Alarm): Beginn und Raeume
#       neu; laufender Alarm: ein weiterer Raum mit Rauch kommt dazu. Modus
#       queued, damit die Schreibzugriffe auf die Helfer nacheinander laufen.
#       Aendert nichts am Versand. "Aktionen ausfuehren" ohne Alarm setzt
#       nichts (der erste Schritt bricht ab).
#   input_boolean.rauchalarm_hinweis, input_datetime.rauchalarm_beginn,
#   input_text.rauchalarm_ort
#       Helfer der Karte, ohne initial, damit sie einen Neustart ueberstehen.
#       Der Ort steht als "Raum|Etage;Raum|Etage", leer = Ursprung unbekannt.
#       In der Instanz ueber die UI angelegt; hier die gleichwertige Fassung
#       fuer ein Package.
#
# Raum und Etage kommen aus dem Bereich, dem das Melder-Geraet zugeordnet ist
# (area_name, floor_name). Melder also den richtigen Bereichen zuordnen.
#
# Hinweise:
#   - Die Schluessel eines variables-Blocks werden in der Instanz sortiert
#     gespeichert; HA rendert sie der Reihe nach. Deshalb liest jeder Block nur
#     Werte aus frueheren Schritten (titel/text in einem eigenen Schritt).
#   - Versand ist immer der letzte Schritt: ein fehlender Dienst
#     (ServiceNotFound) beendet den Lauf trotz continue_on_error.
#   - Telegram mit parse_mode plain_text, unabhaengig vom Standard-Parser des
#     Bots.
#   - Neuer Melder: in allen drei Automationen (Trigger, Variable melder,
#     Bedingungen) und in rauchalarm-karte.yaml eintragen.
#
# Voraussetzung: Homematic(IP) Local mit den Meldern
#   (sensor.*_rauchmelder_alarmstatus), Companion App auf dem iPhone
#   ("Kritische Hinweise" erlaubt), Telegram-Bot.

input_boolean:
  rauchalarm_hinweis:
    name: Rauchalarm-Hinweis
    icon: mdi:smoke-detector-variant-alert

input_datetime:
  rauchalarm_beginn:
    name: Rauchalarm Beginn
    icon: mdi:clock-alert-outline
    has_date: true
    has_time: true

input_text:
  rauchalarm_ort:
    name: Rauchalarm Ort
    icon: mdi:map-marker-alert-outline
    min: 0
    max: 255
    mode: text

automation:
  - id: sicherheit_rauchalarm_melden
    alias: "Sicherheit: Rauchalarm melden"
    description: >-
      Meldet einen Rauchalarm der vier HmIP-Rauchmelder kritisch aufs iPhone und per Telegram,
      mit Raum und Etage. Die Melder sind per Funk vernetzt: Der
      auslösende steht auf primary_alarm, die übrigen auf secondary_alarm. Jeder Wechsel auf
      primary_alarm wird sofort gemeldet, also auch ein zweiter Raum oder ein erneuter Alarm. Ein
      secondary_alarm wird nur gemeldet, wenn nach 5 s kein Melder auf primary_alarm steht, und dann
      nur einmal. Beim Start von Home Assistant werden die Melder geprüft, weil die Trigger erst nach
      dem Laden der Integrationen zuhören. Manuell ausgeführt (Aktionen ausführen) geht eine
      TEST-Meldung über alle Kanäle, außer während eines echten Alarms. Neuer Melder: in den
      Triggern und in der Variablen melder ergänzen, ebenso in "Sicherheit: Rauchalarm Entwarnung",
      "Sicherheit: Rauchalarm-Hinweis merken" und in der Rauchalarm-Karte der Home View. Raum und
      Etage kommen aus dem Bereich des Melders.
    mode: parallel
    max: 10
    trace:
      stored_traces: 20
    variables:
      melder:
        - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
        - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
        - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
        - sensor.rauchmelder_buro_rauchmelder_alarmstatus
      ziel: /dashboard-home/sicherheit
    triggers:
      - trigger: state
        id: herd
        entity_id:
          - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
          - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
          - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
          - sensor.rauchmelder_buro_rauchmelder_alarmstatus
        to: primary_alarm
        note: >-
          state statt air_quality.smoke_detected: Er feuert auch, wenn ein Melder nach einer
          Verbindungsunterbrechung zur CCU direkt im Alarm zurückkommt (unavailable -> primary_alarm).
      - trigger: state
        id: netz
        entity_id:
          - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
          - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
          - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
          - sensor.rauchmelder_buro_rauchmelder_alarmstatus
        to: secondary_alarm
      - trigger: homeassistant
        id: start
        event: start
        note: >-
          Beim Start sind die Melder schon geladen, bevor die Trigger zuhören (18.11.: Melder 07:30:25,
          Start 07:30:35). Ein Alarm aus dem Neustart heraus käme ohne diesen Trigger nicht an.
    conditions: []
    actions:
      - variables:
          test: "{{ trigger.platform is none }}"
      - if:
          - condition: trigger
            id: netz
        then:
          - wait_template: "{{ melder | select('is_state', 'primary_alarm') | list | count > 0 }}"
            timeout: "00:00:05"
          - if:
              - condition: template
                value_template: >-
                  {% set netz = melder | select('is_state', 'secondary_alarm') | list %}
                  {{ wait.completed or not netz or trigger.entity_id != netz[0] }}
            then:
              - stop: Ursprung bekannt, Alarm vorbei oder ein anderer Lauf meldet
        note: >-
          Weitergeleiteter Alarm: Den Ursprung meldet der Lauf des primary_alarm. Nur wenn nach 5 s
          keiner da ist, meldet genau ein Lauf (der erste Melder der Liste im secondary_alarm).
      - if:
          - condition: trigger
            id: start
        then:
          - wait_template: "{{ melder | select('has_value') | list | count == melder | count }}"
            timeout: "00:02:00"
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id:
                      - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
                      - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
                      - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
                      - sensor.rauchmelder_buro_rauchmelder_alarmstatus
                    state:
                      - primary_alarm
                      - secondary_alarm
                    match: any
            then:
              - stop: Kein Melder im Alarm
      - if:
          - condition: template
            value_template: "{{ test }}"
          - condition: state
            entity_id:
              - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
              - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
              - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
              - sensor.rauchmelder_buro_rauchmelder_alarmstatus
            state:
              - primary_alarm
              - secondary_alarm
            match: any
        then:
          - stop: Kein Test während eines echten Alarms
      - variables:
          herd: "{{ melder | select('is_state', 'primary_alarm') | list }}"
          alarm: "{{ melder | select('is_state', ['primary_alarm', 'secondary_alarm']) | list }}"
      - note: "Eigener Schritt: liest herd und alarm aus dem Schritt davor (die Schlüssel eines Blocks werden sortiert gespeichert)."
        variables:
          titel: >-
            {%- macro raum(e) -%}{{ area_name(e) or state_attr(e, 'friendly_name') or e }}{%- endmacro -%}
            {%- if test -%}TEST: Rauchalarm
            {%- elif trigger.id == 'herd' -%}Rauchalarm: {{ raum(trigger.entity_id) }}
            {%- elif herd -%}Rauchalarm: {% for e in herd %}{{ raum(e) }}{{ ', ' if not loop.last else '' }}{% endfor %}
            {%- else -%}Rauchalarm
            {%- endif -%}
          text: >-
            {%- macro ort(e) -%}{{ area_name(e) or state_attr(e, 'friendly_name') or e }}{{ ' (' ~ floor_name(e) ~ ')' if floor_name(e) else '' }}{%- endmacro -%}
            {%- if test -%}Probelauf der Rauchalarm-Meldung, kein Alarm.
            {%- elif trigger.id == 'herd' -%}Rauch erkannt: {{ ort(trigger.entity_id) }}.{{ ' Der Melder war vorher nicht erreichbar.' if trigger.from_state.state in ['unavailable', 'unknown'] else '' }}
            {%- elif trigger.id == 'start' and herd -%}Beim Start von Home Assistant im Alarm. Rauch erkannt: {% for e in herd %}{{ ort(e) }}{{ ', ' if not loop.last else '' }}{% endfor %}.
            {%- else -%}{{ 'Beim Start von Home Assistant im Alarm. ' if trigger.id == 'start' else '' }}Ursprung unbekannt. Melder im Alarm: {% for e in alarm %}{{ ort(e) }}{{ ', ' if not loop.last else '' }}{% endfor %}.
            {%- endif %} {{ now().strftime('%H:%M') }} Uhr
      - parallel:
          - action: notify.mobile_app_iphone
            continue_on_error: true
            data:
              title: "{{ titel }}"
              message: "{{ text }}"
              data:
                url: "{{ ziel }}"
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              config_entry_id: telegram_eintrag
              parse_mode: plain_text
              message: "{{ titel }}\n{{ text }}"
        note: >-
          Letzter Schritt: Ein fehlender Dienst (ServiceNotFound) beendet den Lauf trotz
          continue_on_error, die anderen Zweige senden trotzdem.

  - id: sicherheit_rauchalarm_entwarnung
    alias: "Sicherheit: Rauchalarm Entwarnung"
    description: >-
      Meldet das Ende eines Rauchalarms, sobald kein Melder mehr im Alarm ist. Ist dabei ein Melder
      nicht erreichbar (zum Beispiel durch Feuer zerstört), kommt statt der Entwarnung eine kritische
      Meldung "Entwarnung unsicher". Ein Alarmende während eines Neustarts wird nicht gemeldet.
      Eigene Automation, damit sie die Alarmmeldung nie blockiert. Neuer Melder: in Triggern,
      Bedingung und der Variablen melder ergänzen, ebenso in "Sicherheit: Rauchalarm melden",
      "Sicherheit: Rauchalarm-Hinweis merken" und in der Rauchalarm-Karte der Home View.
    mode: single
    max_exceeded: silent
    variables:
      melder:
        - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
        - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
        - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
        - sensor.rauchmelder_buro_rauchmelder_alarmstatus
      ziel: /dashboard-home/sicherheit
    triggers:
      - trigger: state
        entity_id:
          - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
          - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
          - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
          - sensor.rauchmelder_buro_rauchmelder_alarmstatus
        from:
          - primary_alarm
          - secondary_alarm
        to: idle_off
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id:
              - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
              - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
              - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
              - sensor.rauchmelder_buro_rauchmelder_alarmstatus
            state:
              - primary_alarm
              - secondary_alarm
            match: any
        note: Erst wenn kein Melder mehr im Alarm ist; ein nicht erreichbarer Melder blockiert nicht.
    actions:
      - variables:
          test: "{{ trigger.platform is none }}"
          weg: "{{ melder | reject('has_value') | list }}"
          minuten: >-
            {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int
               if trigger.platform == 'state' else 0 }}
      - note: "Eigener Schritt: liest test, weg und minuten aus dem Schritt davor (die Schlüssel eines Blocks werden sortiert gespeichert)."
        variables:
          titel: >-
            {{ 'TEST: ' if test else '' }}{{ 'Entwarnung unsicher' if weg else 'Rauchalarm beendet' }}
          text: >-
            {%- if test -%}Probelauf der Entwarnung.
            {%- elif weg -%}Kein Melder mehr im Alarm, aber nicht erreichbar: {% for e in weg %}{{ area_name(e) or e }}{{ ', ' if not loop.last else '' }}{% endfor %}. Bitte prüfen.
            {%- else -%}Alle Rauchmelder wieder ruhig, Alarm dauerte {{ 'etwa ' ~ minuten ~ ' min' if minuten >= 1 else 'unter 1 min' }}.
            {%- endif %} {{ now().strftime('%H:%M') }} Uhr
      - if:
          - condition: template
            value_template: "{{ weg | count > 0 }}"
        then:
          - parallel:
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  title: "{{ titel }}"
                  message: "{{ text }}"
                  data:
                    url: "{{ ziel }}"
                    push:
                      sound:
                        name: default
                        critical: 1
                        volume: 1.0
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  config_entry_id: telegram_eintrag
                  parse_mode: plain_text
                  message: "{{ titel }}\n{{ text }}"
        else:
          - parallel:
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  title: "{{ titel }}"
                  message: "{{ text }}"
                  data:
                    url: "{{ ziel }}"
                    push:
                      interruption-level: time-sensitive
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  config_entry_id: telegram_eintrag
                  parse_mode: plain_text
                  message: "{{ titel }}\n{{ text }}"

  - id: sicherheit_rauchalarm_hinweis_merken
    alias: "Sicherheit: Rauchalarm-Hinweis merken"
    description: >-
      Merkt Beginn und Raum eines Rauchalarms für die Rauchalarm-Karte der Home View und schaltet
      input_boolean.rauchalarm_hinweis ein. Nach dem Alarm zeigt die Karte damit "Rauchalarm vorbei"
      (oder "Entwarnung unsicher", solange ein Melder nicht erreichbar ist), bis jemand auf der
      Karte "Gesehen" tippt; das schaltet den Hinweis aus. Neuer Alarm (Hinweis aus, oder kein
      anderer Melder seit mehr als 60 s im Alarm): Beginn und Räume neu. Laufender Alarm: ein
      weiterer Raum mit Rauch wird ergänzt. Ändert nichts am Versand, der läuft über "Sicherheit:
      Rauchalarm melden". Raum und Etage kommen aus dem Bereich des Melders, gespeichert als
      Raum|Etage, mehrere mit ; getrennt, leer heißt Ursprung unbekannt. Neuer Melder: in den
      Triggern, im ersten Schritt (Melder im Alarm) und in der Variablen melder ergänzen, ebenso in
      "Sicherheit: Rauchalarm melden", "Sicherheit: Rauchalarm Entwarnung" und in der
      Rauchalarm-Karte.
    mode: queued
    max: 10
    trace:
      stored_traces: 20
    variables:
      melder:
        - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
        - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
        - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
        - sensor.rauchmelder_buro_rauchmelder_alarmstatus
    triggers:
      - trigger: state
        id: alarm
        entity_id:
          - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
          - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
          - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
          - sensor.rauchmelder_buro_rauchmelder_alarmstatus
        to:
          - primary_alarm
          - secondary_alarm
        note: >-
          state auf dem Alarmstatus statt eines Rauch-Triggers auf dem Binärsensor: Nur so kommt
          auch der Wechsel secondary_alarm -> primary_alarm an (ein mitalarmierter Melder erkennt
          selbst Rauch), der Binärsensor bleibt dabei an.
      - trigger: homeassistant
        id: start
        event: start
        note: >-
          Ein Alarm, der während eines Neustarts beginnt, käme sonst nicht an (die Melder sind vor
          den Triggern geladen).
    conditions: []
    actions:
      - condition: state
        entity_id:
          - sensor.rauchmelder_wohnzimmer_rauchmelder_alarmstatus
          - sensor.rauchmelder_schlafzimmer_rauchmelder_alarmstatus
          - sensor.hmip_swsd_2_seriennr_rauchmelder_alarmstatus
          - sensor.rauchmelder_buro_rauchmelder_alarmstatus
        match: any
        state:
          - primary_alarm
          - secondary_alarm
        note: >-
          Als Schritt statt als Bedingung, damit auch "Aktionen ausführen" ohne Alarm nichts setzt.
          Beendet auch einen Lauf aus der Warteschlange, wenn der Alarm schon vorbei ist.
      - variables:
          herd: "{{ melder | select('is_state', 'primary_alarm') | list }}"
          beginn: >-
            {{ expand(melder) | selectattr('state', 'in', ['primary_alarm', 'secondary_alarm'])
            | map(attribute='last_changed') | map('as_timestamp') | min }}
          laeuft_schon: >-
            {%- set ns = namespace(n=0) -%} {%- if trigger.id == 'alarm' -%} {%- set grenze =
            as_timestamp(trigger.to_state.last_changed) - 60 -%} {%- for s in expand(melder) if
            s.entity_id != trigger.entity_id and s.state in ['primary_alarm', 'secondary_alarm'] and
            as_timestamp(s.last_changed) < grenze -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%} {%-
            endif -%} {{ ns.n > 0 }}
        note: >-
          beginn: frühester Wechsel in den Alarm der Melder, die gerade alarmieren. laeuft_schon:
          ein anderer Melder ist seit mehr als 60 s vor diesem Wechsel im Alarm.
      - variables:
          neu: >-
            {{ not is_state('input_boolean.rauchalarm_hinweis', 'on') or (trigger.id == 'alarm' and
            not laeuft_schon) }}
        note: >-
          Eigener Schritt: liest laeuft_schon aus dem Schritt davor (die Schlüssel eines Blocks
          werden sortiert gespeichert). Beim Start mit Hinweis an gilt der Alarm als laufend, weil
          last_changed beim Start neu gestempelt wird.
      - variables:
          text: >-
            {%- set ns = namespace(l=[]) -%} {%- set alt = states('input_text.rauchalarm_ort') -%}
            {%- if not neu and alt not in ['unknown', 'unavailable'] -%}{%- set ns.l =
            alt.split(';') | reject('eq', '') | list -%}{%- endif -%} {%- for e in herd -%} {%- set
            r = ((area_name(e) or state_attr(e, 'friendly_name') or e) | replace(';', ',') |
            replace('|', '/')) ~ '|' ~ ((floor_name(e) or '') | replace(';', ',') | replace('|',
            '/')) -%} {%- if r not in ns.l -%}{%- set ns.l = ns.l + [r] -%}{%- endif -%} {%- endfor
            -%} {{ (ns.l | join(';'))[:255] }}
        note: "Neuer Alarm: nur die Räume mit Rauch. Laufender Alarm: bisherige Räume plus neue."
      - if:
          - condition: template
            value_template: "{{ neu }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.rauchalarm_beginn
            data:
              timestamp: "{{ beginn }}"
        note: Den Beginn setzt nur ein neuer Alarm.
      - action: input_text.set_value
        target:
          entity_id: input_text.rauchalarm_ort
        data:
          value: "{{ text }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rauchalarm_hinweis
        note: Zuletzt, damit die Karte beim Umschalten schon Beginn und Raum hat.
