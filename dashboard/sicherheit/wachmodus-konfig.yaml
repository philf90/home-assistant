# ============================================================================
# Sicherheit – Wachmodus und Meldungen (Helfer, Automationen)
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       sicherheit
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
#                (oder Helfer in der UI anlegen und die Automationen einzeln
#                im YAML-Editor der UI einfuegen)
# Platzhalter:   person.bewohner, notify.mobile_app_iphone, *_seriennr,
#                telegram_eintrag
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Wachmodus: Home Assistant meldet bei Abwesenheit mehr als sonst. Er ist keine
# Alarmanlage und loest keine Sirene aus; die Alarme in UniFi Protect laufen
# unabhaengig davon weiter.
#
# Abwesenheit = Zone Zuhause (zone.home) mindestens 3 Minuten leer. Die
# 3 Minuten filtern GPS-Spruenge an der Zonengrenze und Standortmeldungen,
# die in falscher Reihenfolge ankommen (laengster beobachteter Fehlsprung
# 2:20 min), und die kurzen 0-Werte von zone.home beim Neuladen. Ohne sie
# schloss die Haustuer bei Rueckkehrern ab und der Wachmodus ging beim
# Heimkommen kurz wieder an. Der Radius von zone.home sollte nicht zu klein
# sein (bewaehrt: 35 m).
#
# Inhalt:
#   input_boolean.wachmodus                  an, solange niemand zuhause ist
#                                            (Knopf in der Sicherheitskarte)
#   input_boolean.sicherheit_meldung_*       Schalter je Meldung (Karte
#                                            "Meldungen" in sicherheit-view.yaml)
#   automation "Sicherheit: Wachmodus nach Anwesenheit"
#       an, sobald zone.home 3 Minuten leer ist; die Meldung wartet bis zu
#       60 s, bis die Haustuer verriegelt ist oder ihr Kontakt offen meldet,
#       und nennt alles, was noch offen ist. Aus, sobald jemand heimkommt
#       (sofort, sonst meldet der eigene Zugang als Alarm).
#   automation "Sicherheit: Meldungen im Wachmodus"
#       Tuer oder Fenster geoeffnet, Keypad gesperrt. Die Haustuer nicht, wenn
#       der Door Hub in den 60 s davor einen gewaehrten Zugang gemeldet hat.
#   automation "Sicherheit: Haustuer-Zugang im Wachmodus"
#       Zugang am Door Hub (gewaehrt oder verweigert), Haustuer aufgeschlossen
#       (nicht doppelt, wenn der Door Hub in der Minute davor einen Zugang
#       gemeldet hat). Eigene Automation mit 5 s Sperre: der Door Hub meldet
#       jeden Zugang zweimal (1-2 ms Abstand).
#   automation "Haustuer abschliessen bei Abwesenheit"
#       schliesst die Haustuer ab, sobald zone.home 3 Minuten leer ist, und
#       meldet ueber Telegram erst nach bestaetigtem "locked". Steht die Tuer
#       offen: Warnung und bis zu 1 Stunde Warten auf das Schliessen;
#       abgeschlossen wird danach nur, wenn noch niemand zuhause ist.
#   automation "Unifi: G3 Reader Pro - Haustuer oeffnen (Door Hub)"
#       oeffnet die Haustuer (lock.open am HmIP-DLD), wenn der Door Hub einen
#       gewaehrten Zugang meldet. Loest das Ereignis der UniFi-Access-
#       Integration aus statt eines Webhooks: ein Webhook ohne Pruefung oeffnet
#       die Tuer fuer jede Anfrage aus dem lokalen Netz, die seine ID kennt.
#       Etwa 0,8 s langsamer als der Webhook.
#   automation "Sicherheit: Person an Aussenkamera"
#       Personenerkennung an Haustuer, Hof, Garage und Pool mit Kamerabild,
#       hoechstens eine Meldung je Minute. Die Kamera "Trampolin" fehlt, weil
#       dort die Personenerkennung in Protect aus ist.
#   Alle Meldungen gehen an notify.mobile_app_iphone, Gruppe "sicherheit",
#   iOS "time-sensitive" (durchbricht Fokus, nicht aber "Nicht stoeren" ohne
#   Freigabe); Tippen oeffnet /dashboard-home/sicherheit.
#
# Anpassen:
#   - person.bewohner_1, person.bewohner_2: eigene Personen (Platzhalter)
#   - notify.mobile_app_iphone: eigenes Geraet (Platzhalter)
#   - binary_sensor.hmip_wkp_seriennr_*: Keypad HmIP-WKP (Platzhalter);
#     "Temporaer gesperrt" und "Permanent gesperrt" sind in der Integration
#     standardmaessig deaktiviert und muessen aktiviert sein
#   - telegram_eintrag: Config-Entry-ID des Telegram-Bots (Platzhalter)
#   - Tuer- und Fensterkontakte, Kameras: Listen in den Triggern und in
#     kontakte; Innentueren, die dauerhaft offen stehen, nicht in kontakte
#     (sonst stehen sie in jeder Meldung "Wachmodus an")
#   - namen: eigene Namen fuer Kontakte, deren Anzeigename in Home Assistant
#     nicht in die Meldung passt (sonst gilt der Anzeigename); in beiden
#     Automationen gleich halten
#
# Einbinden als Paket in configuration.yaml:
#   homeassistant:
#     packages:
#       wachmodus: !include wachmodus-konfig.yaml
# Danach Eingabe-Booleans und Automationen neu laden (Werkzeuge -> YAML).
# Gibt es Helfer oder Automationen mit denselben IDs schon aus der UI, diese
# vorher loeschen, sonst kommt jede Meldung doppelt.
#
# Voraussetzung: Home Assistant 2026.7 oder neuer (Trigger
#                zone.occupancy_cleared, zone.entered, door.opened,
#                window.opened, event.received; Bedingung
#                zone.occupancy_is_not_detected), Companion App,
#                Integrationen Homematic(IP) Local, UniFi Protect, UniFi
#                Access, Telegram Bot.

input_boolean:
  wachmodus:
    name: Wachmodus
    icon: mdi:shield-home
  sicherheit_meldung_wachmodus:
    name: "Sicherheit: Meldung Wachmodus an/aus"
    icon: mdi:shield-home-outline
  sicherheit_meldung_oeffnung:
    name: "Sicherheit: Meldung Türen und Fenster"
    icon: mdi:window-open-variant
  sicherheit_meldung_zugang:
    name: "Sicherheit: Meldung Haustür-Zugang und Schloss"
    icon: mdi:door-closed-lock
  sicherheit_meldung_keypad:
    name: "Sicherheit: Meldung Keypad gesperrt"
    icon: mdi:dialpad
  sicherheit_meldung_person:
    name: "Sicherheit: Meldung Person an Außenkamera"
    icon: mdi:cctv

automation:
  - id: sicherheit_wachmodus_nach_anwesenheit
    alias: "Sicherheit: Wachmodus nach Anwesenheit"
    description: >-
      Sicherheits-View: schaltet input_boolean.wachmodus an, sobald zone.home
      3 Minuten leer ist (gleicher Zeitpunkt wie das automatische Abschliessen;
      filtert GPS-Spruenge), und sofort aus, sobald jemand heimkommt. Beim
      Einschalten wartet die Meldung bis zu 60 s, bis die Haustuer verriegelt
      ist oder der Tuerkontakt offen meldet, und nennt dann, was noch offen
      ist. Schalter der Meldung: input_boolean.sicherheit_meldung_wachmodus.
      Die Kellertuer (Innentuer, steht dauerhaft offen) ist absichtlich nicht
      in der Liste.
    mode: queued
    max: 5
    variables:
      ziel: /dashboard-home/sicherheit
      personen:
        - person.bewohner_1
        - person.bewohner_2
      # Ohne binary_sensor.tur_keller: Innentuer, steht dauerhaft offen
      kontakte:
        - binary_sensor.haustur
        - binary_sensor.tur_windfang
        - binary_sensor.balkontur
        - binary_sensor.fenster_kuche
        - binary_sensor.fenster_wohnzimmer_links
        - binary_sensor.fenster_wohnzimmer_rechts
        - binary_sensor.fenster_wohnzimmer_hof
        - binary_sensor.fenster_buro
        - binary_sensor.fenster_schlafzimmer_links
        - binary_sensor.fenster_schlafzimmer_rechts
        - binary_sensor.fenster_schlafzimmer_hof
        - binary_sensor.fenster_kinderzimmer
        - binary_sensor.fenster_bad_unten_links
        - binary_sensor.fenster_bad_unten_rechts
        - binary_sensor.fenster_windfang
        - binary_sensor.fenster_garderobe
      namen:
        binary_sensor.fenster_kinderzimmer: Kinderzimmer 1
        binary_sensor.fenster_buro: Kinderzimmer 2
    triggers:
      - trigger: zone.occupancy_cleared
        options:
          zone: zone.home
          for: "00:03:00"
        id: weg
      - trigger: zone.entered
        target:
          entity_id:
            - person.bewohner_1
            - person.bewohner_2
        options:
          zone: zone.home
          behavior: first
        id: da
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: weg
              - condition: state
                entity_id: input_boolean.wachmodus
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.wachmodus
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_wachmodus
                state: "on"
              # Das Abschliessen startet zum selben Zeitpunkt (eigene
              # Automation); bei offener Tuer geht es sofort weiter
              - wait_template: "{{ is_state('lock.haustur_schloss', 'locked') or is_state('binary_sensor.haustur', 'on') }}"
                timeout: "00:01:00"
                continue_on_timeout: true
              - variables:
                  offen: >-
                    {% set ns = namespace(l=[]) %}{% for e in kontakte | select('is_state', 'on') %}{% set ns.l = ns.l + [namen.get(e) or state_attr(e, 'friendly_name')] %}{% endfor %}{{ ns.l }}
                  schloss: "{{ states('lock.haustur_schloss') }}"
              - action: notify.mobile_app_iphone
                data:
                  title: Wachmodus an
                  message: >-
                    {% set t = [] %}{% if schloss != 'locked' %}{% set t = t + ['Haustür nicht verriegelt'] %}{% endif %}{% if offen | count > 0 %}{% set t = t + ['offen: ' ~ (offen | join(', '))] %}{% endif %}Niemand zuhause. {{ (t | join(' · ')) if t else 'Alles zu und verriegelt.' }}
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
          - conditions:
              - condition: trigger
                id: da
              - condition: state
                entity_id: input_boolean.wachmodus
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.wachmodus
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_wachmodus
                state: "on"
              - action: notify.mobile_app_iphone
                data:
                  title: Wachmodus aus
                  message: "{{ personen | select('is_state', 'home') | map('state_attr', 'friendly_name') | join(' und ') or 'Jemand' }} ist zuhause."
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit

  - id: sicherheit_meldungen_im_wachmodus
    alias: "Sicherheit: Meldungen im Wachmodus"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus geoeffnete Tueren und
      Fenster und die Sperre des Keypads. Jede Art hat einen eigenen Schalter
      (input_boolean.sicherheit_meldung_oeffnung, _keypad). Zugang am Door Hub
      und Schloss: Automation "Sicherheit: Haustuer-Zugang im Wachmodus".
      Die Oeffnung der Haustuer wird nicht gemeldet, wenn der Door Hub in den
      60 s davor einen gewaehrten Zugang gemeldet hat (dann kam bereits
      "Zugang gewaehrt").
    mode: queued
    max: 20
    variables:
      ziel: /dashboard-home/sicherheit
      namen:
        binary_sensor.fenster_kinderzimmer: Kinderzimmer 1
        binary_sensor.fenster_buro: Kinderzimmer 2
    triggers:
      - trigger: door.opened
        target:
          entity_id:
            - binary_sensor.tur_windfang
            - binary_sensor.tur_keller
            - binary_sensor.balkontur
        options:
          behavior: each
        id: oeffnung
      # Haustuer eigener Trigger: nach einem gewaehrten Zugang keine zweite Meldung
      - trigger: door.opened
        target:
          entity_id: binary_sensor.haustur
        options:
          behavior: each
        id: oeffnung_haustur
      - trigger: window.opened
        target:
          entity_id:
            - binary_sensor.fenster_kuche
            - binary_sensor.fenster_wohnzimmer_links
            - binary_sensor.fenster_wohnzimmer_rechts
            - binary_sensor.fenster_wohnzimmer_hof
            - binary_sensor.fenster_buro
            - binary_sensor.fenster_schlafzimmer_links
            - binary_sensor.fenster_schlafzimmer_rechts
            - binary_sensor.fenster_schlafzimmer_hof
            - binary_sensor.fenster_kinderzimmer
            - binary_sensor.fenster_bad_unten_links
            - binary_sensor.fenster_bad_unten_rechts
            - binary_sensor.fenster_windfang
            - binary_sensor.fenster_garderobe
        options:
          behavior: each
        id: oeffnung
      - trigger: state
        entity_id:
          - binary_sensor.hmip_wkp_seriennr_vorubergehend_gesperrt
          - binary_sensor.hmip_wkp_seriennr_dauerhaft_gesperrt
        from: "off"
        to: "on"
        id: keypad
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - oeffnung
                  - oeffnung_haustur
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_oeffnung
                state: "on"
              # not mit and: "not" allein waere nur wahr, wenn beide falsch sind
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: oeffnung_haustur
                      # Gewaehrter Zugang am Door Hub juenger als 60 s; dafuer
                      # gibt es keine native Bedingung
                      - condition: template
                        value_template: >-
                          {% set z = states('event.haustur_door_hub_zugang') %}{% set t = as_datetime(z, none) %}{{ t is not none and state_attr('event.haustur_door_hub_zugang', 'event_type') == 'access_granted' and (now() - t).total_seconds() < 60 }}
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: "{{ namen.get(trigger.entity_id) or state_attr(trigger.entity_id, 'friendly_name') }} geöffnet"
                  message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
                  data: &push
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
          - conditions:
              - condition: trigger
                id: keypad
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_keypad
                state: "on"
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: Keypad gesperrt
                  message: "{{ 'Dauerhaft' if 'dauerhaft' in trigger.entity_id else 'Vorübergehend' }} gesperrt nach falschen Codes · {{ now().strftime('%H:%M') }} Uhr"
                  data: *push

  - id: sicherheit_hausturzugang_im_wachmodus
    alias: "Sicherheit: Haustür-Zugang im Wachmodus"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus Zugaenge am Door Hub
      (gewaehrt oder verweigert) und das Aufschliessen der Haustuer. Hoechstens
      eine Meldung je 5 s (mode single + Pause), weil der Door Hub jeden Zugang
      doppelt meldet (Abstand 1-2 ms); das Aufschliessen nach einem Zugang
      unterdrueckt die 60-s-Pruefung. Schalter:
      input_boolean.sicherheit_meldung_zugang.
    mode: single
    max_exceeded: silent
    variables:
      ziel: /dashboard-home/sicherheit
    triggers:
      - trigger: event.received
        target:
          entity_id: event.haustur_door_hub_zugang
        options:
          event_type:
            - access_granted
            - access_denied
        id: zugang
      # Das Schloss (HmIP-DLD) laeuft ueber "unlocking"/"locking", deshalb kein
      # from: locked; Neustarts (unavailable -> unlocked) zaehlen nicht
      - trigger: state
        entity_id: lock.haustur_schloss
        to:
          - unlocked
          - open
        not_from:
          - unavailable
          - unknown
          - unlocked
          - open
        id: schloss
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
      - condition: state
        entity_id: input_boolean.sicherheit_meldung_zugang
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: zugang
            sequence:
              - variables:
                  art: "{{ state_attr('event.haustur_door_hub_zugang', 'event_type') }}"
                  wer: "{{ state_attr('event.haustur_door_hub_zugang', 'actor') or '' }}"
                  wie: >-
                    {% set a = state_attr('event.haustur_door_hub_zugang', 'authentication') or '' %}{{ {'FACE': 'Gesicht', 'NFC': 'Karte', 'PIN_CODE': 'PIN', 'MOBILE_TAP': 'App', 'MOBILE_BUTTON': 'App', 'QR_CODE': 'QR-Code', 'REMOTE_THROUGH_UAH': 'aus der Ferne'}.get(a, a) }}
              - action: notify.mobile_app_iphone
                data:
                  title: "{{ 'Zugang verweigert' if art == 'access_denied' else 'Zugang gewährt' }} · Haustür"
                  message: "{{ ([wer, wie] | select | join(' · ')) or 'ohne Angabe' }} · {{ now().strftime('%H:%M') }} Uhr"
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
          - conditions:
              - condition: trigger
                id: schloss
              # Alter des letzten Door-Hub-Ereignisses (Zeitstempel als Zustand);
              # dafuer gibt es keine native Bedingung
              - condition: template
                value_template: >-
                  {% set z = states('event.haustur_door_hub_zugang') %}{{ z in ['unknown', 'unavailable'] or (now() - as_datetime(z)).total_seconds() > 60 }}
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: Haustür aufgeschlossen
                  message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
      # Laenger nicht: in der Sperre gehen alle weiteren Ereignisse verloren,
      # auch ein verweigerter Zugang
      - delay: "00:00:05"

  - id: sicherheit_person_an_aussenkamera
    alias: "Sicherheit: Person an Außenkamera"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus eine erkannte Person an
      den Aussenkameras mit Kamerabild, hoechstens eine Meldung je Minute.
      Schalter: input_boolean.sicherheit_meldung_person.
    mode: single
    max_exceeded: silent
    variables:
      ziel: /dashboard-home/sicherheit
    # id = Kamera, deren Bild die Meldung zeigt
    triggers:
      - trigger: state
        entity_id: binary_sensor.haustur_person_detected
        from: "off"
        to: "on"
        id: camera.haustur_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.hof_person_detected
        from: "off"
        to: "on"
        id: camera.hof_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.garage_person_detected
        from: "off"
        to: "on"
        id: camera.garage_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.pool_person_erkannt
        from: "off"
        to: "on"
        id: camera.g5_bullet_high_resolution_channel_2
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
      - condition: state
        entity_id: input_boolean.sicherheit_meldung_person
        state: "on"
    actions:
      - variables:
          kamera: "{{ trigger.id }}"
          ort: "{{ (state_attr(trigger.id, 'friendly_name') or 'Kamera') | replace(' High resolution channel', '') }}"
      - action: notify.mobile_app_iphone
        data:
          title: "Person erkannt · {{ ort }}"
          message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
          data:
            image: "/api/camera_proxy/{{ kamera }}"
            entity_id: "{{ kamera }}"
            url: "{{ ziel }}"
            clickAction: "{{ ziel }}"
            group: sicherheit
            push:
              interruption-level: time-sensitive
      - delay: "00:01:00"

  - id: haustuer_abschliessen_bei_abwesenheit
    alias: "Haustür abschließen bei abwesend"
    description: >-
      Schliesst die Haustuer ab, wenn zone.home mindestens 3 Minuten leer ist.
      Die 3 Minuten filtern GPS-Spruenge (laengster beobachteter Fehlsprung
      2:20 min) und die kurzen 0-Werte beim Neuladen. Steht die Tuer offen,
      wird gewarnt und bis zu 1 Stunde auf das Schliessen gewartet;
      abgeschlossen wird danach nur, wenn noch niemand zuhause ist.
      Erfolgsmeldung erst nach bestaetigtem "locked".
    mode: single
    triggers:
      - trigger: zone.occupancy_cleared
        options:
          zone: zone.home
          for: "00:03:00"
    conditions:
      - condition: state
        entity_id: lock.haustur_schloss
        state: unlocked
    actions:
      # Offene Tuer: der Riegel faehrt sonst ins Leere und die Tuer schliesst
      # nicht mehr
      - if:
          - condition: state
            entity_id: binary_sensor.haustur
            state: "on"
        then:
          - action: telegram_bot.send_message
            data:
              config_entry_id: telegram_eintrag
              message: Niemand zu Hause, aber die Haustür steht offen – sie wird abgeschlossen, sobald sie geschlossen ist.
          - wait_template: "{{ is_state('binary_sensor.haustur', 'off') }}"
            timeout: "01:00:00"
            continue_on_timeout: true
          - if:
              - condition: state
                entity_id: binary_sensor.haustur
                state: "on"
            then:
              - action: telegram_bot.send_message
                data:
                  config_entry_id: telegram_eintrag
                  message: Haustür steht seit 1 Stunde offen – nicht abgeschlossen.
              - stop: Haustür nach 1 Stunde noch offen
      # Nach dem Warten erneut: inzwischen heimgekommen oder schon abgeschlossen
      - condition: zone.occupancy_is_not_detected
        options:
          zone: zone.home
      - condition: state
        entity_id: lock.haustur_schloss
        state: unlocked
      - action: lock.lock
        target:
          entity_id: lock.haustur_schloss
      # Das Schloss (HmIP-DLD) braucht 6-8 s bis "locked"
      - wait_template: "{{ is_state('lock.haustur_schloss', 'locked') }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      - if:
          - condition: state
            entity_id: lock.haustur_schloss
            state: locked
        then:
          - action: telegram_bot.send_message
            data:
              config_entry_id: telegram_eintrag
              message: Haustür durch Abwesenheit automatisch abgeschlossen.
        else:
          - action: telegram_bot.send_message
            data:
              config_entry_id: telegram_eintrag
              message: "Abschließen fehlgeschlagen – Schlosszustand: {{ states('lock.haustur_schloss') }}"

  - id: unifi_g3_reader_haustuer_oeffnen
    alias: "Unifi: G3 Reader Pro - Haustür öffnen (Door Hub)"
    description: >-
      Öffnet die Haustür (lock.open), wenn der UniFi Door Hub einen gewährten
      Zugang meldet. Ersetzt den Webhook-Auslöser der Automation
      „Unifi: G3 Reader Pro - Haustür öffnen“ (deaktiviert als Backup).
      Der Zeitstempel des Ereignisses muss jünger als 10 s sein, damit ein nach
      einem Neustart wiederhergestelltes Ereignis die Tür nicht öffnet.
    # Der Door Hub meldet jeden Zugang zweimal (1-2 ms Abstand); single
    # verwirft die zweite Meldung ohne Warnung
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event.received
        target:
          entity_id: event.haustur_door_hub_zugang
        options:
          event_type:
            - access_granted
    conditions:
      # Zeitstempel des Ereignisses (Zustand der Event-Entity) juenger als
      # 10 s; dafuer gibt es keine native Bedingung
      - condition: template
        value_template: >-
          {% set t = as_datetime(states('event.haustur_door_hub_zugang'), none) %}{{ t is not none and (now() - t).total_seconds() < 10 }}
    actions:
      - action: lock.open
        target:
          entity_id: lock.haustur_schloss
