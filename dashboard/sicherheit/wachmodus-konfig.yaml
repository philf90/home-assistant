# ============================================================================
# Sicherheit – Wachmodus und Meldungen (Helfer, Automationen)
# ----------------------------------------------------------------------------
# Art:           konfig
# Bereich:       sicherheit
# Status:        aktiv
# Einfuegen:     configuration.yaml unter homeassistant: packages:
#                (oder Helfer in der UI anlegen und die Automationen einzeln
#                im YAML-Editor der UI einfuegen)
# Platzhalter:   person.bewohner, notify.mobile_app_iphone, *_seriennr,
#                telegram_eintrag
#                (vor dem Einfuegen ersetzen, siehe README.md)
# ============================================================================
# Wachmodus: Home Assistant meldet bei Abwesenheit mehr als sonst. Er ist keine
# Alarmanlage und loest keine Sirene aus; die Alarme in UniFi Protect laufen
# unabhaengig davon weiter.
#
# Abwesenheit = Zone Zuhause (zone.home) mindestens 3 Minuten leer. Die
# 3 Minuten filtern GPS-Spruenge an der Zonengrenze und Standortmeldungen,
# die in falscher Reihenfolge ankommen (laengster beobachteter Fehlsprung
# 2:20 min), und die kurzen 0-Werte von zone.home beim Neuladen. Ohne sie
# schloss die Haustuer bei Rueckkehrern ab und der Wachmodus ging beim
# Heimkommen kurz wieder an. Der Radius von zone.home sollte nicht zu klein
# sein (bewaehrt: 35 m).
#
# Inhalt:
#   input_boolean.wachmodus                  an, solange niemand zuhause ist
#                                            (Knopf in der Sicherheitskarte)
#   input_boolean.sicherheit_meldung_*       Schalter je Meldung (Karte
#                                            "Meldungen" in sicherheit-view.yaml)
#   automation "Sicherheit: Wachmodus nach Anwesenheit"
#       an, sobald zone.home 3 Minuten leer ist; die Meldung wartet bis zu
#       60 s, bis die Haustuer verriegelt ist oder ihr Kontakt offen meldet,
#       und nennt, was noch offen ist und welche Kontakte (oder das Schloss)
#       keinen Status haben. Aus, sobald jemand heimkommt (sofort, sonst
#       meldet der eigene Zugang als Alarm). Seit 19.11.2026 neustartfest:
#       Ein Neustart setzt die 3-Minuten-Uhr des Triggers zurueck, darum
#       wartet sie nach dem Start bis zu 3 Minuten und gleicht den Wachmodus
#       mit zone.home ab (Meldung mit "(nach Neustart)"). Heimkehr zusaetzlich
#       ueber zone.occupancy_detected, weil zone.entered Wechsel aus
#       unavailable/unknown ueberspringt.
#   automation "Sicherheit: Meldungen im Wachmodus"
#       Tuer oder Fenster geoeffnet, Keypad gesperrt. Die Haustuer nicht, wenn
#       der Door Hub in den 60 s davor einen gewaehrten Zugang gemeldet hat.
#   input_text.sicherheit_offene_kontakte    Merker: zuletzt sicher bekannte
#                                            offene Kontakte (Objekt-IDs)
#   automation "Sicherheit: Oeffnungen nach Unterbrechung melden"
#       Seit 21.11.2026. door.opened und window.opened ueberspringen Wechsel
#       aus unavailable/unknown und ohne Vorzustand; eine Oeffnung waehrend
#       eines Neustarts oder Funkausfalls blieb deshalb ungemeldet (belegt an
#       der dauerhaft offenen Kellertuer: Neustarts 20.11.2026 07:53 und 08:01
#       unavailable -> on, 21.11.2026 08:40 ohne Vorzustand -> on, jeweils
#       ohne Lauf von "Meldungen im Wachmodus"). Die Automation fuehrt den
#       Merker bei jedem Wechsel nach "auf" oder "zu" nach (Kontakte ohne
#       Status behalten ihren Eintrag) und meldet im Wachmodus einen Kontakt,
#       der aus unavailable/unknown oder ohne Vorzustand auf "auf" springt und
#       im Merker nicht offen war. Nach dem Start von HA wartet sie bis zu
#       3 Minuten auf alle Kontakte und vergleicht dann alle offenen mit dem
#       Merker. Gleicher Schalter wie die Oeffnungsmeldung
#       (input_boolean.sicherheit_meldung_oeffnung). Nicht erkennbar: Oeffnen
#       und Schliessen ganz innerhalb der Unterbrechung. Die Liste fasst
#       255 Zeichen (bei diesen 17 Kontakten 13 offene); weitere gelten als
#       unbekannt und werden im Zweifel gemeldet, nicht verschwiegen. Ohne
#       Ausnahme fuer einen gewaehrten Zugang an der Haustuer: Ein Zugang
#       waehrend der Unterbrechung kommt ohnehin nicht an.
#   automation "Sicherheit: Haustuer-Zugang im Wachmodus"
#       Zugang am Door Hub (gewaehrt oder verweigert), Haustuer aufgeschlossen
#       (nicht doppelt, wenn der Door Hub in der Minute davor einen Zugang
#       gemeldet hat). Eigene Automation mit 5 s Sperre: der Door Hub meldet
#       jeden Zugang zweimal (1-2 ms Abstand).
#   input_boolean.haustur_abschluss_ausstehend  Merker: Haus wurde leer, waehrend
#                                            die Haustuer nicht verriegelt war
#   automation "Haustuer: Abschluss ausstehend merken"
#       setzt den Merker, wenn das Haus bei unverriegelter Tuer leer wird, und
#       loescht ihn, sobald jemand heimkommt, das Schloss verriegelt ist oder
#       jemand bewusst oeffnet bzw. entriegelt (G3-Leser, App). Eigene
#       Automation im Modus queued, damit kein Lauf der zweiten sie blockiert.
#   automation "Haustuer abschliessen bei Abwesenheit"
#       schliesst die Haustuer ab, sobald zone.home 3 Minuten leer ist, und
#       meldet ueber Telegram erst nach bestaetigtem "locked". Seit 18.11.2026
#       (Plan "Umbauplan Haustuer-Abschluss", zwei Pruefungen) holt sie einen
#       ausstehenden Abschluss nach: nach einem Neustart von Home Assistant,
#       wenn Schloss oder Tuerkontakt nach einer Stoerung zurueck sind, wenn
#       die offene Tuer geschlossen wird und 1 Stunde nach dem Gehen. Diese
#       Wege verlangen erneut 3 Minuten Leere. Vorher liess ein Neustart in
#       den 3 Minuten nach dem Gehen die Tuer ohne Meldung offen (22 Neustarts
#       in 10 Tagen), und nach einer Stoerung wurde nie nachgeholt. Geprueft
#       wird positiv: abgeschlossen wird nur bei Tuerkontakt "zu" und ruhendem
#       Schloss (10 s), sonst Meldung; Meldungen halten das Abschliessen nie
#       auf (continue_on_error), Fehlerfaelle zusaetzlich als Push. Abbrueche
#       in if-Zweigen sind ausdrueckliche stop: Eine fehlschlagende Bedingung
#       beendet dort nur den Zweig, nicht den Lauf.
#   automation "Unifi: G3 Reader Pro - Haustuer oeffnen (Door Hub)"
#       oeffnet die Haustuer (lock.open am HmIP-DLD), wenn der Door Hub einen
#       gewaehrten Zugang meldet. Loest das Ereignis der UniFi-Access-
#       Integration aus statt eines Webhooks: ein Webhook ohne Pruefung oeffnet
#       die Tuer fuer jede Anfrage aus dem lokalen Netz, die seine ID kennt.
#       Etwa 0,8 s langsamer als der Webhook.
#   automation "Sicherheit: Person an Aussenkamera"
#       Personenerkennung an Haustuer, Hof, Garage und Pool mit Kamerabild,
#       hoechstens eine Meldung je Minute. Die Kamera "Trampolin" fehlt, weil
#       dort die Personenerkennung in Protect aus ist.
#   Alle Meldungen gehen an notify.mobile_app_iphone, Gruppe "sicherheit",
#   iOS "time-sensitive" (durchbricht Fokus, nicht aber "Nicht stoeren" ohne
#   Freigabe); Tippen oeffnet /dashboard-home/sicherheit.
#
# Anpassen:
#   - person.bewohner_1, person.bewohner_2: eigene Personen (Platzhalter)
#   - notify.mobile_app_iphone: eigenes Geraet (Platzhalter)
#   - binary_sensor.hmip_wkp_seriennr_*: Keypad HmIP-WKP (Platzhalter);
#     "Temporaer gesperrt" und "Permanent gesperrt" sind in der Integration
#     standardmaessig deaktiviert und muessen aktiviert sein
#   - telegram_eintrag: Config-Entry-ID des Telegram-Bots (Platzhalter)
#   - Tuer- und Fensterkontakte, Kameras: Listen in den Triggern und in
#     kontakte; Innentueren, die dauerhaft offen stehen, nicht in kontakte
#     von "Wachmodus nach Anwesenheit" (sonst stehen sie in jeder Meldung
#     "Wachmodus an"). "Oeffnungen nach Unterbrechung melden" fuehrt alle
#     Kontakte aus "Meldungen im Wachmodus" (auch die Innentuer; der Merker
#     kennt sie als offen)
#   - namen: eigene Namen fuer Kontakte, deren Anzeigename in Home Assistant
#     nicht in die Meldung passt (sonst gilt der Anzeigename); in allen drei
#     Automationen gleich halten
#
# Einbinden als Paket in configuration.yaml:
#   homeassistant:
#     packages:
#       wachmodus: !include wachmodus-konfig.yaml
# Danach Eingabe-Booleans und Automationen neu laden (Werkzeuge -> YAML).
# Gibt es Helfer oder Automationen mit denselben IDs schon aus der UI, diese
# vorher loeschen, sonst kommt jede Meldung doppelt.
#
# Voraussetzung: Home Assistant 2026.7 oder neuer (Trigger
#                zone.occupancy_cleared, zone.occupancy_detected,
#                zone.entered, door.opened, door.closed, window.opened,
#                event.received; Bedingungen zone.occupancy_is_detected,
#                zone.occupancy_is_not_detected; Vorlagenfunktion
#                state_translated), Companion App,
#                Integrationen Homematic(IP) Local, UniFi Protect, UniFi
#                Access, Telegram Bot.

input_boolean:
  wachmodus:
    name: Wachmodus
    icon: mdi:shield-home
  sicherheit_meldung_wachmodus:
    name: "Sicherheit: Meldung Wachmodus an/aus"
    icon: mdi:shield-home-outline
  sicherheit_meldung_oeffnung:
    name: "Sicherheit: Meldung Türen und Fenster"
    icon: mdi:window-open-variant
  sicherheit_meldung_zugang:
    name: "Sicherheit: Meldung Haustür-Zugang und Schloss"
    icon: mdi:door-closed-lock
  sicherheit_meldung_keypad:
    name: "Sicherheit: Meldung Keypad gesperrt"
    icon: mdi:dialpad
  sicherheit_meldung_person:
    name: "Sicherheit: Meldung Person an Außenkamera"
    icon: mdi:cctv
  haustur_abschluss_ausstehend:
    name: Haustür Abschluss ausstehend
    icon: mdi:lock-clock

input_text:
  # Merker fuer "Sicherheit: Oeffnungen nach Unterbrechung melden". Neu
  # angelegt ist er leer: einmal mit den gerade offenen Kontakten fuellen
  # (Objekt-IDs ohne "binary_sensor.", kommagetrennt), sonst meldet der
  # erste Start im Wachmodus alles Offene, auch dauerhaft offene Innentueren.
  sicherheit_offene_kontakte:
    name: Sicherheit offene Kontakte
    icon: mdi:door-open
    max: 255

automation:
  - id: sicherheit_wachmodus_nach_anwesenheit
    alias: "Sicherheit: Wachmodus nach Anwesenheit"
    description: >-
      Sicherheits-View: schaltet input_boolean.wachmodus an, sobald zone.home
      3 Minuten leer ist (gleicher Zeitpunkt wie das automatische Abschliessen;
      filtert GPS-Spruenge), und sofort aus, sobald jemand heimkommt.
      Neustartfest seit 19.11.2026: Nach einem Start von Home Assistant wartet
      sie bis zu 3 Minuten; ist dann jemand zu Hause, geht der Wachmodus aus,
      war das Haus die ganzen 3 Minuten leer, geht er an (ein Neustart setzt
      die 3-Minuten-Uhr des Triggers zurueck). Heimkehr zusaetzlich ueber
      zone.occupancy_detected, weil zone.entered Wechsel aus
      unavailable/unknown ueberspringt. Beim Einschalten wartet die Meldung
      bis zu 60 s, bis die Haustuer verriegelt ist oder der Tuerkontakt offen
      meldet, und nennt dann, was offen ist und welche Kontakte oder das
      Schloss keinen Status haben. Schalter der Meldung:
      input_boolean.sicherheit_meldung_wachmodus. Die Kellertuer (Innentuer,
      steht dauerhaft offen) ist absichtlich nicht in der Liste.
    mode: queued
    max: 5
    trace:
      stored_traces: 20
    variables:
      ziel: /dashboard-home/sicherheit
      personen:
        - person.bewohner_1
        - person.bewohner_2
      # Ohne binary_sensor.tur_keller: Innentuer, steht dauerhaft offen
      kontakte:
        - binary_sensor.haustur
        - binary_sensor.tur_windfang
        - binary_sensor.balkontur
        - binary_sensor.fenster_kuche
        - binary_sensor.fenster_wohnzimmer_links
        - binary_sensor.fenster_wohnzimmer_rechts
        - binary_sensor.fenster_wohnzimmer_hof
        - binary_sensor.fenster_buro
        - binary_sensor.fenster_schlafzimmer_links
        - binary_sensor.fenster_schlafzimmer_rechts
        - binary_sensor.fenster_schlafzimmer_hof
        - binary_sensor.fenster_kinderzimmer
        - binary_sensor.fenster_bad_unten_links
        - binary_sensor.fenster_bad_unten_rechts
        - binary_sensor.fenster_windfang
        - binary_sensor.fenster_garderobe
      namen:
        binary_sensor.fenster_kinderzimmer: Kinderzimmer 1
        binary_sensor.fenster_buro: Kinderzimmer 2
      # Kennzeichnet Meldungen aus dem Abgleich nach einem Neustart
      zusatz: "{{ ' (nach Neustart)' if trigger.id == 'start' else '' }}"
    triggers:
      - trigger: zone.occupancy_cleared
        options:
          zone: zone.home
          for: "00:03:00"
        id: weg
      - trigger: zone.entered
        target:
          entity_id:
            - person.bewohner_1
            - person.bewohner_2
        options:
          zone: zone.home
          behavior: first
        id: da
      # zone.entered ueberspringt Wechsel aus unavailable/unknown; die Zone
      # selbst meldet jede Heimkehr
      - trigger: zone.occupancy_detected
        options:
          zone: zone.home
        id: da
      # Ein Neustart setzt die 3-Minuten-Uhr oben zurueck und bricht laufende
      # Laeufe ab; danach wird der Wachmodus mit zone.home abgeglichen
      - trigger: homeassistant
        event: start
        id: start
    actions:
      # zone.home steht beim Start kurz auf 0: bis zu 3 Minuten warten, ob
      # jemand zu Hause ist. Bleibt sie 0, war das Haus 3 Minuten leer.
      - if:
          - condition: trigger
            id: start
        then:
          - wait_template: "{{ not is_state('zone.home', '0') }}"
            timeout: "00:03:00"
            continue_on_timeout: true
      - choose:
          - alias: Wachmodus an
            conditions:
              - condition: trigger
                id:
                  - weg
                  - start
              - condition: zone.occupancy_is_not_detected
                options:
                  zone: zone.home
              - condition: state
                entity_id: input_boolean.wachmodus
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.wachmodus
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_wachmodus
                state: "on"
              # Das Abschliessen startet zum selben Zeitpunkt (eigene
              # Automation); bei offener Tuer geht es sofort weiter
              - wait_template: "{{ is_state('lock.haustur_schloss', 'locked') or is_state('binary_sensor.haustur', 'on') }}"
                timeout: "00:01:00"
                continue_on_timeout: true
              - variables:
                  offen: >-
                    {% set ns = namespace(l=[]) %}{% for e in kontakte | select('is_state', 'on') %}{% set ns.l = ns.l + [namen.get(e) or state_attr(e, 'friendly_name')] %}{% endfor %}{{ ns.l }}
                  ohne: >-
                    {% set ns = namespace(l=[]) %}{% for e in kontakte if states(e) in ['unavailable', 'unknown'] %}{% set ns.l = ns.l + [namen.get(e) or state_attr(e, 'friendly_name') or e] %}{% endfor %}{{ ns.l }}
                  schloss: "{{ states('lock.haustur_schloss') }}"
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  title: Wachmodus an
                  message: >-
                    {% set t = [] %}{% if schloss in ['unavailable', 'unknown'] %}{% set t = t + ['Haustür-Schloss ohne Status'] %}{% elif schloss != 'locked' %}{% set t = t + ['Haustür nicht verriegelt'] %}{% endif %}{% if offen | count > 0 %}{% set t = t + ['offen: ' ~ (offen | join(', '))] %}{% endif %}{% if ohne | count > 0 %}{% set t = t + ['ohne Status: ' ~ (ohne | join(', '))] %}{% endif %}Niemand zuhause{{ zusatz }}. {{ (t | join(' · ')) if t else 'Alles zu und verriegelt.' }}
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
          - alias: Wachmodus aus
            conditions:
              - condition: trigger
                id:
                  - da
                  - start
              - condition: zone.occupancy_is_detected
                options:
                  zone: zone.home
              - condition: state
                entity_id: input_boolean.wachmodus
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.wachmodus
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_wachmodus
                state: "on"
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  title: Wachmodus aus
                  message: "{{ personen | select('is_state', 'home') | map('state_attr', 'friendly_name') | join(' und ') or 'Jemand' }} ist zuhause{{ zusatz }}."
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit

  - id: sicherheit_meldungen_im_wachmodus
    alias: "Sicherheit: Meldungen im Wachmodus"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus geoeffnete Tueren und
      Fenster und die Sperre des Keypads. Jede Art hat einen eigenen Schalter
      (input_boolean.sicherheit_meldung_oeffnung, _keypad). Zugang am Door Hub
      und Schloss: Automation "Sicherheit: Haustuer-Zugang im Wachmodus".
      Die Oeffnung der Haustuer wird nicht gemeldet, wenn der Door Hub in den
      60 s davor einen gewaehrten Zugang gemeldet hat (dann kam bereits
      "Zugang gewaehrt"). Oeffnungen waehrend eines Neustarts oder
      Funkausfalls (Wechsel aus nicht verfuegbar/unbekannt, die
      door.opened/window.opened ueberspringen) meldet "Sicherheit:
      Oeffnungen nach Unterbrechung melden".
    mode: queued
    max: 20
    variables:
      ziel: /dashboard-home/sicherheit
      namen:
        binary_sensor.fenster_kinderzimmer: Kinderzimmer 1
        binary_sensor.fenster_buro: Kinderzimmer 2
    triggers:
      - trigger: door.opened
        target:
          entity_id:
            - binary_sensor.tur_windfang
            - binary_sensor.tur_keller
            - binary_sensor.balkontur
        options:
          behavior: each
        id: oeffnung
      # Haustuer eigener Trigger: nach einem gewaehrten Zugang keine zweite Meldung
      - trigger: door.opened
        target:
          entity_id: binary_sensor.haustur
        options:
          behavior: each
        id: oeffnung_haustur
      - trigger: window.opened
        target:
          entity_id:
            - binary_sensor.fenster_kuche
            - binary_sensor.fenster_wohnzimmer_links
            - binary_sensor.fenster_wohnzimmer_rechts
            - binary_sensor.fenster_wohnzimmer_hof
            - binary_sensor.fenster_buro
            - binary_sensor.fenster_schlafzimmer_links
            - binary_sensor.fenster_schlafzimmer_rechts
            - binary_sensor.fenster_schlafzimmer_hof
            - binary_sensor.fenster_kinderzimmer
            - binary_sensor.fenster_bad_unten_links
            - binary_sensor.fenster_bad_unten_rechts
            - binary_sensor.fenster_windfang
            - binary_sensor.fenster_garderobe
        options:
          behavior: each
        id: oeffnung
      - trigger: state
        entity_id:
          - binary_sensor.hmip_wkp_seriennr_vorubergehend_gesperrt
          - binary_sensor.hmip_wkp_seriennr_dauerhaft_gesperrt
        from: "off"
        to: "on"
        id: keypad
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - oeffnung
                  - oeffnung_haustur
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_oeffnung
                state: "on"
              # not mit and: "not" allein waere nur wahr, wenn beide falsch sind
              - condition: not
                conditions:
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: oeffnung_haustur
                      # Gewaehrter Zugang am Door Hub juenger als 60 s; dafuer
                      # gibt es keine native Bedingung
                      - condition: template
                        value_template: >-
                          {% set z = states('event.haustur_door_hub_zugang') %}{% set t = as_datetime(z, none) %}{{ t is not none and state_attr('event.haustur_door_hub_zugang', 'event_type') == 'access_granted' and (now() - t).total_seconds() < 60 }}
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: "{{ namen.get(trigger.entity_id) or state_attr(trigger.entity_id, 'friendly_name') }} geöffnet"
                  message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
                  data: &push
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
          - conditions:
              - condition: trigger
                id: keypad
              - condition: state
                entity_id: input_boolean.sicherheit_meldung_keypad
                state: "on"
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: Keypad gesperrt
                  message: "{{ 'Dauerhaft' if 'dauerhaft' in trigger.entity_id else 'Vorübergehend' }} gesperrt nach falschen Codes · {{ now().strftime('%H:%M') }} Uhr"
                  data: *push

  - id: sicherheit_oeffnungen_nach_unterbrechung
    alias: "Sicherheit: Öffnungen nach Unterbrechung melden"
    description: >-
      Ergaenzt "Sicherheit: Meldungen im Wachmodus": Deren Ausloeser
      Tuer/Fenster geoeffnet ueberspringen Wechsel aus nicht
      verfuegbar/unbekannt und ohne Vorzustand, eine Oeffnung waehrend eines
      Neustarts oder Funkausfalls blieb deshalb ungemeldet. Merker
      input_text.sicherheit_offene_kontakte: die zuletzt sicher bekannten
      offenen Kontakte (Objekt-IDs, kommagetrennt; Kontakte ohne Status
      behalten ihren Eintrag). Meldet bei aktivem Wachmodus und
      eingeschaltetem input_boolean.sicherheit_meldung_oeffnung einen Kontakt,
      der aus nicht verfuegbar/unbekannt oder ohne Vorzustand auf offen
      springt und im Merker nicht offen war. Nach dem Start von Home Assistant
      wartet sie bis zu 3 Minuten auf alle Kontakte und vergleicht dann alle
      offenen mit dem Merker. Ein Oeffnen und Schliessen ganz innerhalb der
      Unterbrechung ist nicht erkennbar. Bei mehr als 13 offenen Kontakten
      passt die Liste nicht mehr in 255 Zeichen; die uebrigen gelten dann als
      unbekannt und werden im Zweifel gemeldet.
    mode: queued
    max: 30
    trace:
      stored_traces: 30
    variables:
      ziel: /dashboard-home/sicherheit
      # Alle Kontakte aus "Meldungen im Wachmodus", auch die Innentuer
      kontakte:
        - binary_sensor.haustur
        - binary_sensor.tur_windfang
        - binary_sensor.tur_keller
        - binary_sensor.balkontur
        - binary_sensor.fenster_kuche
        - binary_sensor.fenster_wohnzimmer_links
        - binary_sensor.fenster_wohnzimmer_rechts
        - binary_sensor.fenster_wohnzimmer_hof
        - binary_sensor.fenster_buro
        - binary_sensor.fenster_schlafzimmer_links
        - binary_sensor.fenster_schlafzimmer_rechts
        - binary_sensor.fenster_schlafzimmer_hof
        - binary_sensor.fenster_kinderzimmer
        - binary_sensor.fenster_bad_unten_links
        - binary_sensor.fenster_bad_unten_rechts
        - binary_sensor.fenster_windfang
        - binary_sensor.fenster_garderobe
      namen:
        binary_sensor.fenster_kinderzimmer: Kinderzimmer 1
        binary_sensor.fenster_buro: Kinderzimmer 2
      # Merker als Liste von Entity-IDs
      vorher: >-
        {%- set t = states('input_text.sicherheit_offene_kontakte') -%}
        {{ [] if t in ['', 'unknown', 'unavailable'] else t.split(',') | map('trim') | reject('eq', '') | map('regex_replace', '^', 'binary_sensor.') | list }}
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      # Absichtlich state statt door.opened/window.opened: die ueberspringen
      # genau diese Wechsel
      - trigger: state
        entity_id:
          - binary_sensor.haustur
          - binary_sensor.tur_windfang
          - binary_sensor.tur_keller
          - binary_sensor.balkontur
          - binary_sensor.fenster_kuche
          - binary_sensor.fenster_wohnzimmer_links
          - binary_sensor.fenster_wohnzimmer_rechts
          - binary_sensor.fenster_wohnzimmer_hof
          - binary_sensor.fenster_buro
          - binary_sensor.fenster_schlafzimmer_links
          - binary_sensor.fenster_schlafzimmer_rechts
          - binary_sensor.fenster_schlafzimmer_hof
          - binary_sensor.fenster_kinderzimmer
          - binary_sensor.fenster_bad_unten_links
          - binary_sensor.fenster_bad_unten_rechts
          - binary_sensor.fenster_windfang
          - binary_sensor.fenster_garderobe
        to: "on"
        not_from: "off"
        id: unterbrechung
        note: Offen aus nicht verfügbar, unbekannt oder ohne Vorzustand.
      - trigger: state
        entity_id:
          - binary_sensor.haustur
          - binary_sensor.tur_windfang
          - binary_sensor.tur_keller
          - binary_sensor.balkontur
          - binary_sensor.fenster_kuche
          - binary_sensor.fenster_wohnzimmer_links
          - binary_sensor.fenster_wohnzimmer_rechts
          - binary_sensor.fenster_wohnzimmer_hof
          - binary_sensor.fenster_buro
          - binary_sensor.fenster_schlafzimmer_links
          - binary_sensor.fenster_schlafzimmer_rechts
          - binary_sensor.fenster_schlafzimmer_hof
          - binary_sensor.fenster_kinderzimmer
          - binary_sensor.fenster_bad_unten_links
          - binary_sensor.fenster_bad_unten_rechts
          - binary_sensor.fenster_windfang
          - binary_sensor.fenster_garderobe
        from: "off"
        to: "on"
        id: auf
        note: Normales Öffnen, gemeldet von "Meldungen im Wachmodus"; hier nur den Merker nachführen.
      - trigger: state
        entity_id:
          - binary_sensor.haustur
          - binary_sensor.tur_windfang
          - binary_sensor.tur_keller
          - binary_sensor.balkontur
          - binary_sensor.fenster_kuche
          - binary_sensor.fenster_wohnzimmer_links
          - binary_sensor.fenster_wohnzimmer_rechts
          - binary_sensor.fenster_wohnzimmer_hof
          - binary_sensor.fenster_buro
          - binary_sensor.fenster_schlafzimmer_links
          - binary_sensor.fenster_schlafzimmer_rechts
          - binary_sensor.fenster_schlafzimmer_hof
          - binary_sensor.fenster_kinderzimmer
          - binary_sensor.fenster_bad_unten_links
          - binary_sensor.fenster_bad_unten_rechts
          - binary_sensor.fenster_windfang
          - binary_sensor.fenster_garderobe
        to: "off"
        id: zu
        note: Jedes Schließen, auch aus nicht verfügbar; nur den Merker nachführen.
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - alias: Bis zu 3 Minuten warten, bis alle Kontakte einen Status haben
            wait_template: >-
              {{ kontakte | map('states') | select('in', ['unavailable', 'unknown']) | list | count == 0 }}
            timeout: "00:03:00"
            continue_on_timeout: true
      - variables:
          neu: >-
            {%- if trigger.id == 'start' -%}
            {{ kontakte | select('is_state', 'on') | reject('in', vorher) | list }}
            {%- elif trigger.id == 'unterbrechung' and trigger.entity_id not in vorher -%}
            {{ [trigger.entity_id] }}
            {%- else -%}
            {{ [] }}
            {%- endif -%}
          # Offen = jetzt auf + Eintraege ohne Status; gekuerzt auf 255 Zeichen
          merker: >-
            {%- set offen = kontakte | select('is_state', 'on') | list + (vorher | select('in', kontakte) | reject('is_state', ['on', 'off']) | list) -%}
            {%- set ns = namespace(s='') -%}
            {%- for e in offen | unique -%}
            {%- set k = (ns.s ~ ',' ~ e.split('.')[1]) if ns.s else e.split('.')[1] -%}
            {%- if k | length <= 255 -%}{%- set ns.s = k -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.s }}
      - if:
          - condition: template
            value_template: "{{ neu | count > 0 }}"
          - condition: state
            entity_id: input_boolean.wachmodus
            state: "on"
          - condition: state
            entity_id: input_boolean.sicherheit_meldung_oeffnung
            state: "on"
        then:
          - action: notify.mobile_app_iphone
            continue_on_error: true
            data:
              title: >-
                {% set ns = namespace(l=[]) %}{% for e in neu %}{% set ns.l = ns.l + [namen.get(e) or state_attr(e, 'friendly_name') or e] %}{% endfor %}{{ ns.l | join(', ') }} geöffnet
              message: >-
                Wachmodus aktiv · geöffnet während einer Unterbrechung
                ({{ 'Neustart' if trigger.id == 'start' else 'Neustart oder Funkausfall' }})
                · {{ now().strftime('%H:%M') }} Uhr
              data:
                group: sicherheit
                url: "{{ ziel }}"
                clickAction: "{{ ziel }}"
                push:
                  interruption-level: time-sensitive
      - if:
          - condition: template
            value_template: "{{ merker != states('input_text.sicherheit_offene_kontakte') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sicherheit_offene_kontakte
            data:
              value: "{{ merker }}"

  - id: sicherheit_hausturzugang_im_wachmodus
    alias: "Sicherheit: Haustür-Zugang im Wachmodus"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus Zugaenge am Door Hub
      (gewaehrt oder verweigert) und das Aufschliessen der Haustuer. Hoechstens
      eine Meldung je 5 s (mode single + Pause), weil der Door Hub jeden Zugang
      doppelt meldet (Abstand 1-2 ms); das Aufschliessen nach einem Zugang
      unterdrueckt die 60-s-Pruefung. Schalter:
      input_boolean.sicherheit_meldung_zugang.
    mode: single
    max_exceeded: silent
    variables:
      ziel: /dashboard-home/sicherheit
    triggers:
      - trigger: event.received
        target:
          entity_id: event.haustur_door_hub_zugang
        options:
          event_type:
            - access_granted
            - access_denied
        id: zugang
      # Das Schloss (HmIP-DLD) laeuft ueber "unlocking"/"locking", deshalb kein
      # from: locked; Neustarts (unavailable -> unlocked) zaehlen nicht
      - trigger: state
        entity_id: lock.haustur_schloss
        to:
          - unlocked
          - open
        not_from:
          - unavailable
          - unknown
          - unlocked
          - open
        id: schloss
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
      - condition: state
        entity_id: input_boolean.sicherheit_meldung_zugang
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: zugang
            sequence:
              - variables:
                  art: "{{ state_attr('event.haustur_door_hub_zugang', 'event_type') }}"
                  wer: "{{ state_attr('event.haustur_door_hub_zugang', 'actor') or '' }}"
                  wie: >-
                    {% set a = state_attr('event.haustur_door_hub_zugang', 'authentication') or '' %}{{ {'FACE': 'Gesicht', 'NFC': 'Karte', 'PIN_CODE': 'PIN', 'MOBILE_TAP': 'App', 'MOBILE_BUTTON': 'App', 'QR_CODE': 'QR-Code', 'REMOTE_THROUGH_UAH': 'aus der Ferne'}.get(a, a) }}
              - action: notify.mobile_app_iphone
                data:
                  title: "{{ 'Zugang verweigert' if art == 'access_denied' else 'Zugang gewährt' }} · Haustür"
                  message: "{{ ([wer, wie] | select | join(' · ')) or 'ohne Angabe' }} · {{ now().strftime('%H:%M') }} Uhr"
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
          - conditions:
              - condition: trigger
                id: schloss
              # Alter des letzten Door-Hub-Ereignisses (Zeitstempel als Zustand);
              # dafuer gibt es keine native Bedingung
              - condition: template
                value_template: >-
                  {% set z = states('event.haustur_door_hub_zugang') %}{{ z in ['unknown', 'unavailable'] or (now() - as_datetime(z)).total_seconds() > 60 }}
            sequence:
              - action: notify.mobile_app_iphone
                data:
                  title: Haustür aufgeschlossen
                  message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
                  data:
                    url: "{{ ziel }}"
                    clickAction: "{{ ziel }}"
                    group: sicherheit
                    push:
                      interruption-level: time-sensitive
      # Laenger nicht: in der Sperre gehen alle weiteren Ereignisse verloren,
      # auch ein verweigerter Zugang
      - delay: "00:00:05"

  - id: sicherheit_person_an_aussenkamera
    alias: "Sicherheit: Person an Außenkamera"
    description: >-
      Sicherheits-View: meldet bei aktivem Wachmodus eine erkannte Person an
      den Aussenkameras mit Kamerabild, hoechstens eine Meldung je Minute.
      Schalter: input_boolean.sicherheit_meldung_person.
    mode: single
    max_exceeded: silent
    variables:
      ziel: /dashboard-home/sicherheit
    # id = Kamera, deren Bild die Meldung zeigt
    triggers:
      - trigger: state
        entity_id: binary_sensor.haustur_person_detected
        from: "off"
        to: "on"
        id: camera.haustur_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.hof_person_detected
        from: "off"
        to: "on"
        id: camera.hof_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.garage_person_detected
        from: "off"
        to: "on"
        id: camera.garage_high_resolution_channel
      - trigger: state
        entity_id: binary_sensor.pool_person_erkannt
        from: "off"
        to: "on"
        id: camera.g5_bullet_high_resolution_channel_2
    conditions:
      - condition: state
        entity_id: input_boolean.wachmodus
        state: "on"
      - condition: state
        entity_id: input_boolean.sicherheit_meldung_person
        state: "on"
    actions:
      - variables:
          kamera: "{{ trigger.id }}"
          ort: "{{ (state_attr(trigger.id, 'friendly_name') or 'Kamera') | replace(' High resolution channel', '') }}"
      - action: notify.mobile_app_iphone
        data:
          title: "Person erkannt · {{ ort }}"
          message: "Wachmodus aktiv · {{ now().strftime('%H:%M') }} Uhr"
          data:
            image: "/api/camera_proxy/{{ kamera }}"
            entity_id: "{{ kamera }}"
            url: "{{ ziel }}"
            clickAction: "{{ ziel }}"
            group: sicherheit
            push:
              interruption-level: time-sensitive
      - delay: "00:01:00"

  - id: haustur_abschluss_ausstehend_merken
    alias: "Haustür: Abschluss ausstehend merken"
    description: >-
      Merkt, dass das Haus leer wurde, während die Haustür nicht verriegelt war. Der Merker
      übersteht Neustarts. Die Abschließ-Automation holt damit einen ausstehenden Abschluss
      nach einem Neustart, nach einer Gerätestörung oder nach dem Schließen einer offenen Tür
      nach. Gelöscht wird er, sobald jemand zu Hause ist, das Schloss verriegelt ist oder jemand
      bewusst öffnet oder aufschließt (G3-Leser, App); solches Öffnen wird deshalb nie wieder
      abgeschlossen.
    mode: queued
    max: 10
    triggers:
      - trigger: zone.occupancy_cleared
        id: leer
        options:
          zone: zone.home
      - trigger: zone.occupancy_detected
        id: da
        options:
          zone: zone.home
      - trigger: state
        entity_id: lock.haustur_schloss
        id: verriegelt
        to: locked
      - note: "Die Abschließ-Automation öffnet oder entriegelt nie selbst."
        trigger: state
        entity_id: lock.haustur_schloss
        id: bewusst
        to:
          - opening
          - unlocking
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: leer
            sequence:
              - note: Eindeutig setzen, damit ein veralteter Merker nicht stehen bleibt.
                if:
                  - condition: state
                    entity_id: lock.haustur_schloss
                    state: locked
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.haustur_abschluss_ausstehend
                else:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.haustur_abschluss_ausstehend
          - conditions:
              - condition: or
                conditions:
                  - condition: trigger
                    id:
                      - da
                      - verriegelt
                      - bewusst
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: start
                      - condition: zone.occupancy_is_detected
                        options:
                          zone: zone.home
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.haustur_abschluss_ausstehend

  - id: haustuer_abschliessen_bei_abwesenheit
    alias: "Haustür abschließen bei abwesend"
    description: >-
      Schließt die Haustür ab, wenn zone.home mindestens 3 Minuten leer ist (laut bisheriger
      Beschreibung filtern die 3 Minuten GPS-Sprünge bis 2:20 min). Steht der Abschluss danach
      noch aus (input_boolean.haustur_abschluss_ausstehend), holt ihn die Automation nach: nach
      einem Neustart, wenn Schloss oder Türkontakt zurück sind, wenn die offene Tür geschlossen
      wird und 1 Stunde nach dem Gehen. Diese Nachhol-Wege verlangen erneut 3 Minuten Leere.
      Abgeschlossen wird nur bei Türkontakt „zu“ und ruhendem Schloss; ist etwas nicht bereit,
      kommt eine Meldung. Meldungen halten das Abschließen nie auf.
    mode: single
    max_exceeded: silent
    trace:
      stored_traces: 50
    variables:
      zusatz: |-
        {{ {'neustart': ' (nach Neustart)', 'zurueck': ' (nach Störung)',
            'tuer_zu': ' (Tür wurde geschlossen)'}.get(trigger.id, '') }}
    triggers:
      - trigger: zone.occupancy_cleared
        id: verlassen
        options:
          for: "00:03:00"
          zone: zone.home
      - note: "Ein Neustart setzt die 3-Minuten-Uhr oben zurück und bricht laufende Läufe ab."
        trigger: homeassistant
        event: start
        id: neustart
      - note: "Schloss oder Türkontakt wieder gültig, nach einem Neustart oder einer Störung."
        trigger: state
        entity_id:
          - lock.haustur_schloss
          - binary_sensor.haustur
        for: "00:00:10"
        from:
          - unavailable
          - unknown
        id: zurueck
        not_to:
          - unavailable
          - unknown
      - note: "Ersetzt die frühere Stunde Warten im Lauf; übersteht Neustarts und hat kein Zeitlimit."
        trigger: door.closed
        id: tuer_zu
        options:
          for: "00:00:10"
        target:
          entity_id: binary_sensor.haustur
      - note: "Erinnerung bei offener Tür und einmaliger Nachhol-Versuch, 1 h nach dem Gehen."
        trigger: zone.occupancy_cleared
        id: leer_1h
        options:
          for: "01:00:00"
          zone: zone.home
    conditions:
      - condition: zone.occupancy_is_not_detected
        options:
          zone: zone.home
      - note: Nachhol-Wege nur, wenn ein Abschluss aussteht.
        condition: or
        conditions:
          - condition: trigger
            id: verlassen
          - condition: state
            entity_id: input_boolean.haustur_abschluss_ausstehend
            state: "on"
    actions:
      - if:
          - condition: trigger
            id:
              - neustart
              - zurueck
              - tuer_zu
        then:
          - note: >-
              3 Minuten Leere wie beim Verlassen. Fängt den 0-Sprung von zone.home beim Start
              und Heimkehrer, deren Handy die Zone spät meldet.
            wait_template: "{{ not is_state('zone.home', '0') }}"
            timeout: "00:03:00"
          - note: >-
              Ausdrücklich stoppen: Eine fehlschlagende Bedingung beendet hier nur den then-Zweig,
              nicht den Lauf (helpers/script.py, _ConditionFail).
            if:
              - condition: not
                conditions:
                  - condition: zone.occupancy_is_not_detected
                    options:
                      zone: zone.home
            then:
              - stop: Jemand zu Hause
      - note: "Nach einem Start sind die Geräte 21–33 s später zurück; im Normalfall sofort\
          \ weiter."
        wait_template: "{{ has_value('lock.haustur_schloss') and has_value('binary_sensor.haustur')\
          \ }}"
        timeout: "00:10:00"
      - note: "Übergangszustände (opening, locking, unlocking) dauern 1,5–14,4 s."
        wait_template: "{{ states('lock.haustur_schloss') in ['locked', 'unlocked', 'jammed',\
          \ 'open'] }}"
        timeout: "00:00:30"
      - if:
          - condition: state
            entity_id: lock.haustur_schloss
            state: locked
        then:
          - stop: Bereits abgeschlossen
      - if:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: lock.haustur_schloss
                    state: unlocked
              - condition: not
                conditions:
                  - condition: state
                    entity_id: binary_sensor.haustur
                    state:
                      - "on"
                      - "off"
        then:
          - note: "Sicherheitshalber; die Rückkehr des Geräts holt den Abschluss nach."
            action: input_boolean.turn_on
            target:
              entity_id: input_boolean.haustur_abschluss_ausstehend
          - parallel:
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  config_entry_id: telegram_eintrag
                  message: >-
                    Niemand zu Hause, aber Schloss „{{ state_translated('lock.haustur_schloss')
                    }}“, Türkontakt „{{ state_translated('binary_sensor.haustur') }}“ – noch
                    nicht abgeschlossen, wird nachgeholt{{ zusatz }}.
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  message: >-
                    Schloss „{{ state_translated('lock.haustur_schloss') }}“, Türkontakt „{{
                    state_translated('binary_sensor.haustur') }}“{{ zusatz }}.
                  title: "Haustür nicht abgeschlossen"
          - stop: "Gerät nicht bereit"
      - if:
          - condition: state
            entity_id: binary_sensor.haustur
            state: "on"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.haustur_abschluss_ausstehend
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              config_entry_id: telegram_eintrag
              message: |-
                {{ 'Haustür steht seit 1 Stunde offen, niemand zu Hause – noch nicht abgeschlossen.'
                   if trigger.id == 'leer_1h' else
                   'Niemand zu Hause, aber die Haustür steht offen – sie wird abgeschlossen, sobald sie geschlossen ist' ~ zusatz ~ '.' }}
          - stop: "Wartet auf das Schließen der Tür"
      - note: >-
          Letzte Prüfung direkt vor dem Abschließen. Tür und Schloss müssen 10 s ruhen: Nach
          einem Öffnen meldet der Kontakt bis zu 5,3 s später „offen“.
        if:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: zone.occupancy_is_not_detected
                    options:
                      zone: zone.home
              - condition: not
                conditions:
                  - condition: state
                    entity_id: binary_sensor.haustur
                    for: "00:00:10"
                    state: "off"
              - condition: not
                conditions:
                  - condition: state
                    entity_id: lock.haustur_schloss
                    for: "00:00:10"
                    state: unlocked
        then:
          - stop: "Jemand zu Hause oder Tür bzw. Schloss gerade bewegt"
      - note: "Homematic-Fehler kommen als HomeAssistantError an; der Lauf geht weiter zur Prüfung."
        action: lock.lock
        continue_on_error: true
        target:
          entity_id: lock.haustur_schloss
      - note: "Das Schloss (HmIP-DLD) braucht 4–14 s bis „locked“."
        wait_template: "{{ is_state('lock.haustur_schloss', 'locked') }}"
        timeout: "00:01:00"
      - if:
          - condition: state
            entity_id: lock.haustur_schloss
            state: locked
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            data:
              config_entry_id: telegram_eintrag
              message: "Haustür durch Abwesenheit automatisch abgeschlossen{{ zusatz }}."
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.haustur_abschluss_ausstehend
          - parallel:
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  config_entry_id: telegram_eintrag
                  message: >-
                    Abschließen fehlgeschlagen – Schloss „{{ state_translated('lock.haustur_schloss')
                    }}“{{ zusatz }}.
              - action: notify.mobile_app_iphone
                continue_on_error: true
                data:
                  message: >-
                    Abschließen fehlgeschlagen, Schloss „{{ state_translated('lock.haustur_schloss')
                    }}“{{ zusatz }}.
                  title: "Haustür nicht abgeschlossen"

  - id: unifi_g3_reader_haustuer_oeffnen
    alias: "Unifi: G3 Reader Pro - Haustür öffnen (Door Hub)"
    description: >-
      Öffnet die Haustür (lock.open), wenn der UniFi Door Hub einen gewährten
      Zugang meldet. Der Zeitstempel des Ereignisses muss jünger als 10 s sein,
      damit ein nach einem Neustart wiederhergestelltes Ereignis die Tür nicht
      öffnet.
    # Der Door Hub meldet jeden Zugang zweimal (1-2 ms Abstand); single
    # verwirft die zweite Meldung ohne Warnung
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event.received
        target:
          entity_id: event.haustur_door_hub_zugang
        options:
          event_type:
            - access_granted
    conditions:
      # Zeitstempel des Ereignisses (Zustand der Event-Entity) juenger als
      # 10 s; dafuer gibt es keine native Bedingung
      - condition: template
        value_template: >-
          {% set t = as_datetime(states('event.haustur_door_hub_zugang'), none) %}{{ t is not none and (now() - t).total_seconds() < 10 }}
    actions:
      - action: lock.open
        target:
          entity_id: lock.haustur_schloss
