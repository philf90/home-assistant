# Pflanzen im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
#
# Die custom:flower-card ist eine Spezial-Karte (Balken faerben sich anhand
# der Min/Max-Grenzwerte der Plant-Integration). Sie behaelt daher Inhalt und
# Funktion (Bild, Name, Art, Akku, Sollwert-Balken) und bekommt nur die
# Owlet-Huelle: dunkler Verlauf, 22px Rundung, weicher Schatten, feiner Rahmen.
#
# Voraussetzung: custom:flower-card + card-mod (HACS).
type: vertical-stack
cards:
  - type: custom:flower-card
    entity: plant.erdbeeren
    battery_sensor: sensor.erdbeeren_battery
    show_bars:
      - moisture
      - temperature
      - humidity
      - soil_temperature
    card_mod: &owlet_shell
      style: |
        ha-card {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
        }
  - type: custom:flower-card
    entity: plant.tomaten
    battery_sensor: sensor.0xffffb40e0601f519_battery
    show_bars:
      - moisture
      - conductivity
      - temperature
      - humidity
      - soil_temperature
    card_mod: *owlet_shell
  - type: custom:flower-card
    entity: plant.pimentos
    battery_sensor: sensor.hochbeet_rechts_battery
    show_bars:
      - moisture
      - conductivity
      - temperature
      - humidity
      - soil_temperature
    card_mod: *owlet_shell
  - type: custom:flower-card
    entity: plant.gurken
    battery_sensor: sensor.hochbeet_rechts_battery
    show_bars:
      - moisture
      - conductivity
      - temperature
      - humidity
      - soil_temperature
    card_mod: *owlet_shell
