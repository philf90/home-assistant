# Thermostate/Heizung v2 - radiale Soll-Regler im Owlet-Look
# ============================================================================
# Unterschied zur v1 (thermostate-button-card.yaml, bleibt unveraendert):
#   v1 = Kachel mit Ist-Temperatur gross + Status/Soll als Textzeilen.
#   v2 = Kachel mit RADIALEM Regler: 270deg-Bogen = Solltemperatur auf der
#        Klima-Skala (min_temp..max_temp), Ist-Temperatur gross in der Mitte,
#        darunter "Soll x,x" + Status. Farb-Semantik wie v1:
#          Heizt = Amber, Kuehlt = Blau, Bereit = Gruen, Aus = gedaempft.
#   Tap = more-info (voller Klima-Dialog mit +/--Reglern), wie v1.
#
# Rein aus den Klima-Attributen berechnet (current_temperature, temperature,
# hvac_action, state) - KEIN zusaetzlicher Sensor noetig.
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &header_styles, &therm_styles,
# &dial_body.
#
# Voraussetzung: custom:button-card + card-mod (HACS).
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopfzeile mit "N heizen"-Badge ----
  - type: custom:button-card
    icon: mdi:radiator
    name: Heizung
    show_icon: true
    show_name: true
    show_label: false
    tap_action:
      action: none
    triggers_update:
      - climate.heizung_wohnzimmer_int0000001
      - climate.hmip_heating_int0000002
      - climate.hmip_heating_int0000006
      - climate.hmip_heating_int0000004
      - climate.hmip_heating_int0000003
      - climate.hmip_heating_int0000005
      - climate.hmip_heating_int0000007
      - climate.hmip_heating_int0000008
    custom_fields:
      badge: |
        [[[
          const ids=[
            'climate.heizung_wohnzimmer_int0000001','climate.hmip_heating_int0000002',
            'climate.hmip_heating_int0000006','climate.hmip_heating_int0000004',
            'climate.hmip_heating_int0000003','climate.hmip_heating_int0000005',
            'climate.hmip_heating_int0000007','climate.hmip_heating_int0000008'
          ];
          let heat=0;
          ids.forEach(id=>{ const s=states[id]; if(s&&s.attributes&&s.attributes.hvac_action==='heating') heat++; });
          const heating=heat>0;
          const c=heating?'#e6b566':'#6e7988';
          const bg=heating?'rgba(230,181,102,0.15)':'rgba(255,255,255,0.05)';
          const bd=heating?'rgba(230,181,102,0.28)':'rgba(255,255,255,0.08)';
          const txt=heating?(heat+' heizen'):'Alle bereit';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${bg};border:1px solid ${bd};font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.2 3 4 4.2 4 7.8a4 4 0 0 1-8 0c0-1.3.5-2.3 1.1-3.2.4 1.9 1.9 2 1.9.2 0-1.6-1-2.8 1-4.8Z"/></svg>${txt}</span>`;
        ]]]
    styles: &header_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center

  # ---- Raster aus radialen Reglern ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: climate.heizung_wohnzimmer_int0000001
        name: Wohnzimmer
        show_icon: false
        show_name: true
        show_state: false
        custom_fields:
          dial: &dial_body |
            [[[
              const e=(typeof entity!=='undefined')?entity:null;
              const A=(e&&e.attributes)?e.attributes:{};
              const num=(x)=>(x!==undefined&&x!==null&&!isNaN(x))?Number(x):null;
              const cur=num(A.current_temperature);
              const tgt=num(A.temperature);
              const minT=num(A.min_temp)!==null?Number(A.min_temp):5;
              const maxT=num(A.max_temp)!==null?Number(A.max_temp):30;
              const st=e?e.state:'off';
              const act=A.hvac_action;

              // Farb-/Status-Semantik exakt wie v1
              let col='#6e7988', txt='Aus';
              if(act==='heating'){ col='#e6b566'; txt='Heizt'; }
              else if(act==='cooling'||st==='cool'){ col='#7fb3d5'; txt='Kühlt'; }
              else if(st==='off'){ col='#6e7988'; txt='Aus'; }
              else if(act==='idle'){ col='#a6d49e'; txt='Bereit'; }
              else if(st){ txt=st; }

              const de=(n,d)=>(n===null||isNaN(n))?'–':Number(n).toFixed(d).replace('.',',');

              // 270deg-Bogen, Luecke unten
              const R=48, C=2*Math.PI*R, SWEEP=0.75;
              const track=C*SWEEP;
              let frac=0;
              if(tgt!==null){ frac=Math.max(0,Math.min(1,(tgt-minT)/((maxT-minT)||1))); }
              const val=track*frac;
              const dim = st==='off';
              const arcCol = dim ? '#3a4453' : col;

              // Ist-Temp: Ganzzahl gross, Nachkomma klein
              let curBig='–', curDec='°';
              if(cur!==null){ const s=de(cur,1).split(','); curBig=s[0]; curDec=(s[1]!==undefined?(','+s[1]+'°'):'°'); }

              return `
                <div style="display:flex;flex-direction:column;align-items:center;gap:7px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                  <div style="position:relative;width:118px;height:118px;">
                    <svg viewBox="0 0 118 118" style="width:118px;height:118px;">
                      <g transform="rotate(135 59 59)">
                        <circle cx="59" cy="59" r="${R}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${track.toFixed(1)} ${C.toFixed(1)}"/>
                        ${tgt!==null?`<circle cx="59" cy="59" r="${R}" fill="none" stroke="${arcCol}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${val.toFixed(1)} ${C.toFixed(1)}"/>`:''}
                      </g>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;">
                      <div style="color:#f2f5f8;font-weight:750;letter-spacing:-0.02em;">
                        <span style="font-size:26px;font-variant-numeric:tabular-nums;">${curBig}</span><span style="font-size:14px;">${curDec}</span>
                      </div>
                      <div style="font-size:11px;color:#6e7988;margin-top:3px;font-variant-numeric:tabular-nums;">${tgt!==null?('Soll '+de(tgt,1)+'°'):'—'}</div>
                    </div>
                  </div>
                  <div style="font-size:11.5px;font-weight:600;color:${dim?'#6e7988':col};">${txt}</div>
                </div>`;
            ]]]
        styles: &therm_styles
          card:
            - border-radius: 16px
            - padding: 13px 12px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-areas: '"n" "dial"'
            - grid-template-rows: min-content min-content
            - justify-items: center
          name:
            - justify-self: start
            - align-self: start
            - width: 100%
            - font-size: 13px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          custom_fields:
            dial:
              - align-self: center
              - margin-top: 4px
      - type: custom:button-card
        entity: climate.hmip_heating_int0000002
        name: Pauline
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000006
        name: Schlafzimmer
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000004
        name: Büro
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000003
        name: Bad unten
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000005
        name: Bad oben
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000007
        name: Küche
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
      - type: custom:button-card
        entity: climate.hmip_heating_int0000008
        name: Flur
        show_icon: false
        show_name: true
        show_state: false
        custom_fields: { dial: *dial_body }
        styles: *therm_styles
