# DWD-Wetterwarnung im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
# Ersetzt die custom:meteoalarm-card durch einen custom:button-card-Nachbau,
# damit dieselbe Owlet-Huelle, Palette und Typografie greift.
#
# - conditional-Wrapper blendet die Karte aus, wenn keine Warnung aktiv ist
#   (entspricht hide_when_no_warning: true der alten Karte).
# - Icon-Kachel und "Stufe"-Pille faerben sich in der offiziellen DWD-Warnfarbe
#   (Attribut warning_1_color), Icon je nach Warnungstyp (Wind/Gewitter/...).
# - Liegt mehr als eine Warnung an, wird "+N weitere" angezeigt.
# - Tippen oeffnet ein eigenes Popup (browser_mod.popup) mit allen Warnungen in
#   normalisierter Form statt des rohen more-info-Dialogs. Langes Druecken
#   oeffnet weiterhin das Standard-more-info mit allen Roh-Attributen.
#
# Voraussetzung: custom:button-card (HACS), browser_mod (HACS). Sensoren der
# DWD-Integration (dwd_weather_warnings) -> "aktuelle Warnstufe" + "Vorwarnstufe".
type: conditional
conditions:
  - entity: sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
    state_not: '0'
  - entity: sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
    state_not: unavailable
  - entity: sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
    state_not: unknown
card:
  type: custom:button-card
  entity: sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
  tap_action:
    action: call-service
    service: browser_mod.popup
    service_data:
      title: Wetterwarnungen
      # Dialog-Oberflaeche auf Owlet-Navy statt Schwarz (wie im Navbar-Menue).
      # Breite: min() statt Media-Query, damit ohne Umweg beides passt -
      # auf dem iPhone volle Viewport-Breite, auf dem Desktop bei 720px gedeckelt.
      # Weniger Content-Padding holt auf dem Handy ~24px Textbreite zurueck.
      style: |
        --mdc-theme-surface: #1b2231;
        --ha-card-background: #1b2231;
        --card-background-color: #1b2231;
        --primary-background-color: #171d29;
        --secondary-background-color: #1b2231;
        --primary-text-color: #f2f5f8;
        --secondary-text-color: #8794a5;
        --mdc-dialog-scrim-color: rgba(0,0,0,0.62);
        --mdc-dialog-min-width: min(100vw, 720px);
        --mdc-dialog-max-width: min(100vw, 720px);
        --popup-min-width: min(100vw, 720px);
        --popup-max-width: min(100vw, 720px);
        --dialog-content-padding: 12px;
      content:
        type: custom:button-card
        entity: sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
        # Popup soll sich auch bei neuen Vorabinformationen aktualisieren
        triggers_update:
          - sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe
          - sensor.kreis_sudliche_weinstrasse_vorwarnstufe
        tap_action:
          action: none
        show_name: false
        show_state: false
        show_icon: false
        show_label: false
        styles:
          # Ohne diese Breiten-Fesseln sizet button-card sein Grid auf
          # max-content: der Beschreibungssatz stuende dann auf einer Zeile
          # und wuerde am rechten Dialogrand abgeschnitten statt umzubrechen.
          card:
            - padding: 0
            - border: none
            - box-shadow: none
            - background: none
            - width: 100%
            - max-width: 100%
            - box-sizing: border-box
          grid:
            - grid-template-areas: '"body"'
            - grid-template-columns: minmax(0, 1fr)
            - width: 100%
            - max-width: 100%
            - min-width: 0
          custom_fields:
            body:
              - width: 100%
              - max-width: 100%
              - min-width: 0
              - overflow: hidden
        custom_fields:
          body: |
            [[[
              // ================= Popup: alle DWD-Warnungen normalisiert =================
              // Quelle: dwd_weather_warnings. Die Integration legt pro Warnung sowohl
              // Flach-Attribute (warning_N_name, warning_N_start, ...) als auch ein
              // Objekt warning_N { event, start_time, end_time, ... } an. Beide Formen
              // werden hier gelesen, damit die Karte integrationsversions-robust ist.

              // ---------- Palette (identisch zur Owlet-Karte) ----------
              const value = '#f2f5f8';
              const soft  = '#8794a5';
              const muted = '#6e7988';
              const line  = 'rgba(255,255,255,0.07)';
              const panel = 'linear-gradient(180deg, #1f2736 0%, #1a202c 100%)';

              const esc = (s) => String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

              // ---------- Stufen-Normalisierung ----------
              const lvlMeta = {
                0: { label: 'Vorabinformation',  color: '#7c8ba1' },
                1: { label: 'Wetterwarnung',     color: '#f2c500' },
                2: { label: 'Markante Warnung',  color: '#fb9a12' },
                3: { label: 'Unwetterwarnung',   color: '#e6480e' },
                4: { label: 'Extremes Unwetter', color: '#c0392b' }
              };
              const urgencyLabel = {
                immediate: 'sofort', expected: 'erwartet',
                future: 'bevorstehend', past: 'vorbei', unknown: ''
              };

              // ---------- Zeit-Helfer ----------
              const toDate = (v) => {
                if (v === undefined || v === null || v === '') return null;
                const d = new Date(v);
                return isNaN(d.getTime()) ? null : d;
              };
              const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
              const dayLabel = (d) => {
                const t0 = new Date(); t0.setHours(0, 0, 0, 0);
                const dd = new Date(d); dd.setHours(0, 0, 0, 0);
                const diff = Math.round((dd - t0) / 86400000);
                if (diff === 0) return 'Heute';
                if (diff === 1) return 'Morgen';
                if (diff === 2) return 'Übermorgen';
                if (diff === -1) return 'Gestern';
                return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
              };
              const span = (ms) => {
                const m = Math.max(0, Math.round(ms / 60000));
                if (m < 60) return m + ' Min.';
                const h = Math.floor(m / 60), r = m % 60;
                if (h < 24) return r ? `${h} Std. ${r} Min.` : `${h} Std.`;
                const d = Math.round(h / 24);
                return d === 1 ? '1 Tag' : `${d} Tage`;
              };
              const rangeText = (s, e) => {
                if (s && e) {
                  return s.toDateString() === e.toDateString()
                    ? `${dayLabel(s)} ${fmtT(s)}–${fmtT(e)} Uhr`
                    : `${dayLabel(s)} ${fmtT(s)} Uhr – ${dayLabel(e)} ${fmtT(e)} Uhr`;
                }
                if (s) return `ab ${dayLabel(s)} ${fmtT(s)} Uhr`;
                if (e) return `bis ${dayLabel(e)} ${fmtT(e)} Uhr`;
                return 'Zeitraum unbekannt';
              };
              // Laufender Status statt roher Zeitstempel ("in 2 Tagen" statt "2 Tage")
              const spanIn = (ms) => span(ms).replace(/Tage$/, 'Tagen');
              const statusText = (s, e) => {
                const now = new Date();
                if (s && now < s) return { txt: 'beginnt in ' + spanIn(s - now), live: false };
                if (e && now > e) return { txt: 'abgelaufen', live: false };
                if (e) return { txt: 'läuft – endet in ' + spanIn(e - now), live: true };
                return { txt: 'läuft', live: true };
              };

              // ---------- Icon nach Warnungstyp ----------
              const iconFor = (n, color, px) => {
                const s = (n || '').toLowerCase();
                const S = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${px}px;height:${px}px;flex:none;">${inner}</svg>`;
                // Gewitter zuerst: DWD-Namen wie "GEWITTER mit ORKANBÖEN" sollen den Blitz zeigen
                if (/(gewitter|blitz)/.test(s))            return S('<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path d="M12.5 13l-2.5 4h3l-2 4"/>');
                if (/(wind|böen|boen|sturm|orkan)/.test(s)) return S('<path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a3 3 0 1 1-3 3M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/>');
                if (/(stark ?regen|dauerregen|regen)/.test(s)) return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M8.5 18l-1 2.2M12 18l-1 2.2M15.5 18l-1 2.2"/>');
                if (/(schnee|schneefall)/.test(s))         return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>');
                if (/(glätte|glaette|frost|eis)/.test(s))  return S('<path d="M12 3v18M4.5 7.5 12 12l7.5-4.5M4.5 16.5 12 12l7.5 4.5M12 3l-2.5 2M12 3l2.5 2M12 21l-2.5-2M12 21l2.5-2"/>');
                if (/(hitze|wärme|waerme)/.test(s))        return S('<path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><circle cx="12" cy="17.4" r="1.8" fill="' + color + '" stroke="none"/>');
                if (/(nebel)/.test(s))                     return S('<path d="M5 9h14M4 13h16M6 17h12"/>');
                if (/(uv|sonne)/.test(s))                  return S('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
                return S('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r="0.6" fill="' + color + '" stroke="none"/>');
              };

              // ---------- Fliesstext / Handlungsempfehlungen normalisieren ----------
              // DWD liefert "Hinweis auf: \n · a\n\nHandlungsempfehlungen: \n · b"
              // -> Zwischenueberschriften + echte Bullet-Liste statt Rohtext.
              const blockify = (txt) => {
                const lines = String(txt || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
                if (!lines.length) return '';
                let out = '', open = false;
                const closeList = () => { if (open) { out += '</ul>'; open = false; } };
                lines.forEach((l) => {
                  if (/^[·•\-\*]\s*/.test(l)) {
                    if (!open) { out += `<ul style="margin:2px 0 0;padding:0 0 0 16px;list-style:none;">`; open = true; }
                    const t = l.replace(/^[·•\-\*]\s*/, '');
                    out += `<li style="position:relative;font-size:13.5px;line-height:1.5;color:${value};margin:3px 0;overflow-wrap:anywhere;">`
                        +  `<span style="position:absolute;left:-14px;top:0;color:${muted};">•</span>${esc(t)}</li>`;
                  } else if (/[:：]$/.test(l)) {
                    closeList();
                    out += `<div style="font-size:11.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${soft};margin:10px 0 2px;overflow-wrap:anywhere;">${esc(l.replace(/[:：]$/, ''))}</div>`;
                  } else {
                    closeList();
                    out += `<div style="font-size:13.5px;line-height:1.55;color:${value};margin:4px 0;overflow-wrap:anywhere;">${esc(l)}</div>`;
                  }
                });
                closeList();
                return out;
              };

              // ---------- Parameter normalisieren ----------
              // {"Windrichtung":"west","Böen":"~55 [km/h]"} -> Chips "Böen · ~55 km/h"
              const paramChips = (params, color) => {
                if (!params || typeof params !== 'object') return '';
                const keys = Object.keys(params);
                if (!keys.length) return '';
                const clean = (v) => {
                  let t = String(v).replace(/\[([^\]]+)\]/g, '$1').replace(/\s+/g, ' ').trim();
                  if (/^[a-zäöüß]+$/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
                  return t;
                };
                const chips = keys.map((k) =>
                  `<span style="display:inline-flex;align-items:baseline;gap:5px;font-size:12px;line-height:1;background:rgba(255,255,255,0.045);border:1px solid ${line};border-radius:999px;padding:6px 10px;white-space:nowrap;">`
                  + `<span style="color:${muted};">${esc(k)}</span>`
                  + `<span style="color:${value};font-weight:600;">${clean(params[k])}</span></span>`
                ).join('');
                return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">${chips}</div>`;
              };

              // ---------- Eine Warnung aus den Attributen lesen ----------
              const readWarning = (a, i) => {
                const o = (a['warning_' + i] && typeof a['warning_' + i] === 'object') ? a['warning_' + i] : {};
                const p = (k) => a['warning_' + i + '_' + k];
                const lvlRaw = (p('level') !== undefined && p('level') !== null) ? p('level') : o.level;
                return {
                  name:     p('name') || o.event || p('headline') || o.headline || 'Wetterwarnung',
                  headline: p('headline') || o.headline || '',
                  level:    parseInt(lvlRaw) || 0,
                  color:    p('color') || o.color || '',
                  desc:     p('description') || o.description || '',
                  instr:    p('instruction') || o.instruction || '',
                  start:    toDate(p('start') || p('start_time') || o.start_time || o.start),
                  end:      toDate(p('end') || p('end_time') || o.end_time || o.end),
                  params:   p('parameters') || o.parameters || {},
                  urgency:  String(p('urgency') || o.urgency || '').toLowerCase()
                };
              };

              // ---------- Warnungsblock rendern ----------
              const renderWarning = (w, advance) => {
                const meta  = lvlMeta[w.level] || lvlMeta[1];
                const color = w.color || meta.color;
                const st    = statusText(w.start, w.end);
                const dur   = (w.start && w.end) ? span(w.end - w.start) : '';
                const urg   = urgencyLabel[w.urgency] || '';

                const pill = (txt, c, filled) =>
                  `<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:1;color:${c};`
                  + `background:${filled ? c + '1f' : 'rgba(255,255,255,0.04)'};border:1px solid ${filled ? c + '4d' : line};`
                  + `border-radius:999px;padding:4px 9px;white-space:nowrap;">${esc(txt)}</span>`;

                const pills = [
                  pill(advance ? 'Vorabinformation' : meta.label, color, true),
                  st.live ? pill('aktiv', '#4ade80', true) : '',
                  (!st.live && urg) ? pill(urg, soft, false) : ''
                ].filter(Boolean).join('');

                // Headline nur zeigen, wenn sie mehr aussagt als der Kurzname
                const headlineExtra = (w.headline && w.headline.toUpperCase() !== w.name.toUpperCase())
                  ? `<div style="font-size:12.5px;color:${soft};line-height:1.35;margin-top:2px;overflow-wrap:anywhere;">${esc(w.headline)}</div>` : '';

                return `
                  <div style="background:${panel};border:1px solid ${line};border-left:3px solid ${color};border-radius:16px;padding:14px 16px;">
                    <div style="display:flex;align-items:flex-start;gap:12px;">
                      <div style="flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-sizing:border-box;background:${color}22;border:1px solid ${color}55;">
                        ${iconFor(w.name, color, 22)}
                      </div>
                      <div style="min-width:0;flex:1 1 auto;">
                        <div style="font-size:15.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;color:${value};overflow-wrap:anywhere;">${esc(w.name)}</div>
                        ${headlineExtra}
                        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${pills}</div>
                      </div>
                    </div>

                    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:12px;padding-top:12px;border-top:1px solid ${line};">
                      <span style="font-size:13px;font-weight:600;color:${value};">${esc(rangeText(w.start, w.end))}</span>
                      <span style="font-size:12px;color:${muted};">${esc([dur ? 'Dauer ' + dur : '', st.txt].filter(Boolean).join(' · '))}</span>
                    </div>

                    ${w.desc ? `<div style="margin-top:10px;">${blockify(w.desc)}</div>` : ''}
                    ${paramChips(w.params, color)}
                    ${w.instr ? `<div style="margin-top:6px;">${blockify(w.instr)}</div>` : ''}
                  </div>`;
              };

              // ---------- Alle Warnungen beider Sensoren einsammeln ----------
              const sources = [
                { id: 'sensor.kreis_sudliche_weinstrasse_aktuelle_warnstufe', advance: false },
                { id: 'sensor.kreis_sudliche_weinstrasse_vorwarnstufe',       advance: true  }
              ];

              let blocks = '';
              let total = 0;
              let region = '';
              let stand = null;
              let attribution = 'Deutscher Wetterdienst';

              sources.forEach((src) => {
                const s = states[src.id];
                if (!s) return;
                const a = s.attributes || {};
                region = region || a.region_name || '';
                const lu = toDate(a.last_update);
                if (lu && (!stand || lu > stand)) stand = lu;
                if (a.attribution) attribution = a.attribution.replace(/^Data provided by\s*/i, '');

                const count = parseInt(a.warning_count) || 0;
                if (!count) return;

                const list = [];
                for (let i = 1; i <= count; i++) list.push(readWarning(a, i));
                // Hoechste Stufe zuerst, danach der frueheste Beginn
                list.sort((x, y) => (y.level - x.level) || ((x.start ? x.start : 0) - (y.start ? y.start : 0)));

                if (src.advance) {
                  blocks += `<div style="font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${muted};margin:6px 2px 0;">Vorabinformationen</div>`;
                }
                list.forEach((w) => { blocks += renderWarning(w, src.advance); total++; });
              });

              if (!total) {
                blocks = `<div style="background:${panel};border:1px solid ${line};border-radius:16px;padding:22px 16px;text-align:center;">
                    <div style="font-size:14px;font-weight:600;color:${value};">Aktuell keine Warnungen</div>
                    <div style="font-size:12.5px;color:${muted};margin-top:4px;">Für ${esc(region || 'die Region')} liegt keine Warnung vor.</div>
                  </div>`;
              }

              const standTxt = stand
                ? `Stand ${dayLabel(stand) === 'Heute' ? '' : dayLabel(stand) + ' '}${fmtT(stand)} Uhr`
                : '';
              const footer = [esc(region), esc(standTxt), 'Quelle: ' + esc(attribution)]
                .filter(Boolean).join(' · ');

              // max-width als definite Laenge (nicht 100%): die Karte haengt im
              // Dialog in einer shrink-to-fit-Kette - dort waere 100% zirkulaer
              // und der Fliesstext bliebe einzeilig. Der Wert deckt sich mit der
              // Dialogbreite: volle Viewport-Breite am Handy, 720px am Desktop.
              return `
                <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:min(720px, calc(100vw - 28px));box-sizing:border-box;text-align:left;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
                  ${blocks}
                  <div style="font-size:11.5px;color:${muted};line-height:1.45;padding:2px 2px 0;">${footer}</div>
                </div>`;
            ]]]
  # Langes Druecken zeigt weiterhin die Roh-Attribute des Sensors
  hold_action:
    action: more-info
  show_name: false
  show_state: false
  show_icon: false
  show_label: false
  styles:
    card:
      - padding: 16px 18px
      - border-radius: 22px
      - border: 1px solid rgba(255, 255, 255, 0.05)
      - background: 'linear-gradient(180deg, #1b2231 0%, #171d29 55%)'
      - box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7)
      - overflow: hidden
    grid:
      - grid-template-areas: '"body"'
    custom_fields:
      body:
        - width: 100%
        - min-width: 0
  custom_fields:
    body: |
      [[[
        // ---------- Palette (identisch zur Owlet-Karte) ----------
        const value = '#f2f5f8';
        const muted = '#6e7988';
        const cardBot = '#171d29';

        const e = entity;
        const a = (e && e.attributes) ? e.attributes : {};
        const lvl = parseInt(e ? e.state : '0') || 0;
        const count = parseInt(a.warning_count) || 0;
        if (lvl <= 0 || count <= 0) return '';

        // ---------- Warnungsdaten (erste/hoechste Warnung) ----------
        const w1 = (a.warning_1 && typeof a.warning_1 === 'object') ? a.warning_1 : {};
        const name = a.warning_1_name || w1.event || a.warning_1_headline || 'Wetterwarnung';
        const wlvl = parseInt(a.warning_1_level) || lvl;

        // Offizielle DWD-Farbe, sonst Fallback nach Stufe
        const lvlColor = { 1:'#f2c500', 2:'#fb9a12', 3:'#e6480e', 4:'#c0392b' };
        const color = a.warning_1_color || w1.color || lvlColor[wlvl] || '#fb9a12';
        const lvlLabel = { 1:'Wetterwarnung', 2:'Markante Warnung', 3:'Unwetterwarnung', 4:'Extreme Warnung' }[wlvl] || ('Stufe ' + wlvl);

        // ---------- Zeitraum ----------
        // dwd_weather_warnings liefert warning_N_start/_end; aeltere Versionen
        // und das verschachtelte warning_N-Objekt nutzen *_time - beides lesen.
        const toDate = (v) => { if (v === undefined || v === null || v === '') return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
        const start = toDate(a.warning_1_start || a.warning_1_start_time || w1.start_time || w1.start);
        const end   = toDate(a.warning_1_end   || a.warning_1_end_time   || w1.end_time   || w1.end);
        const fmtT = (d) => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        const dayLabel = (d) => {
          const t0 = new Date(); t0.setHours(0,0,0,0);
          const dd = new Date(d); dd.setHours(0,0,0,0);
          const diff = Math.round((dd - t0) / 86400000);
          if (diff === 0) return 'Heute';
          if (diff === 1) return 'Morgen';
          if (diff === -1) return 'Gestern';
          return d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
        };
        let range = '';
        if (start && end) {
          const sameDay = start.toDateString() === end.toDateString();
          range = sameDay
            ? `${dayLabel(start)} ${fmtT(start)}–${fmtT(end)} Uhr`
            : `${dayLabel(start)} ${fmtT(start)} – ${dayLabel(end)} ${fmtT(end)}`;
        } else if (start) {
          range = `ab ${dayLabel(start)} ${fmtT(start)} Uhr`;
        }

        // ---------- Icon nach Warnungstyp ----------
        const iconFor = (n) => {
          const s = (n || '').toLowerCase();
          const S = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;flex:none;">${inner}</svg>`;
          // Gewitter zuerst: DWD-Namen wie "GEWITTER mit ORKANBÖEN" sollen den Blitz zeigen
          if (/(gewitter|blitz)/.test(s))            return S('<path d="M7 15h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 6.6 6.4 3.8 3.8 0 0 0 6.6 15"/><path d="M12.5 13l-2.5 4h3l-2 4"/>');
          if (/(wind|böen|boen|sturm|orkan)/.test(s)) return S('<path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a3 3 0 1 1-3 3M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/>');
          if (/(stark ?regen|dauerregen|regen)/.test(s)) return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M8.5 18l-1 2.2M12 18l-1 2.2M15.5 18l-1 2.2"/>');
          if (/(schnee|schneefall)/.test(s))         return S('<path d="M7 15h10a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.6 6.4 3.8 3.8 0 0 0 7 15Z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>');
          if (/(glätte|glaette|frost|eis)/.test(s))  return S('<path d="M12 3v18M4.5 7.5 12 12l7.5-4.5M4.5 16.5 12 12l7.5 4.5M12 3l-2.5 2M12 3l2.5 2M12 21l-2.5-2M12 21l2.5-2"/>');
          if (/(hitze|wärme|waerme)/.test(s))        return S('<path d="M12 3.6a2.3 2.3 0 0 1 2.3 2.3v8.1a4 4 0 1 1-4.6 0V5.9A2.3 2.3 0 0 1 12 3.6Z"/><circle cx="12" cy="17.4" r="1.8" fill="'+color+'" stroke="none"/>');
          if (/(nebel)/.test(s))                     return S('<path d="M5 9h14M4 13h16M6 17h12"/>');
          // Fallback: Warndreieck
          return S('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r="0.6" fill="'+color+'" stroke="none"/>');
        };

        const iconTile = `
          <div style="flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;box-sizing:border-box;background:${color}22;border:1px solid ${color}55;">
            ${iconFor(name)}
          </div>`;

        const pill = `<span style="display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;line-height:1;color:${color};background:${color}1f;border:1px solid ${color}4d;border-radius:999px;padding:3px 8px;white-space:nowrap;">${lvlLabel}</span>`;
        const more = count > 1 ? `<span style="font-size:12px;color:${muted};white-space:nowrap;">+${count - 1} weitere</span>` : '';

        // ---------- Aufbau ----------
        return `
          <div style="display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;overflow:hidden;color:${value};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;text-align:left;">
            ${iconTile}
            <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto;">
              <div style="font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                ${pill}
                <span style="font-size:12.5px;color:${muted};line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${range}</span>
              </div>
              ${more ? `<div style="margin-top:1px;">${more}</div>` : ''}
            </div>
          </div>`;
      ]]]
