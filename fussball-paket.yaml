# Fussball – Datenpaket fuer die View fussball-view.yaml (OpenLigaDB)
#
# Liefert fuer die 1. und 2. Bundesliga den aktuellen Spieltag und die
# Tabelle sowie Form und naechstes Spiel des 1. FC Kaiserslautern:
#   sensor.fussball_bl1_spieltag / sensor.fussball_bl2_spieltag
#       state = Nummer des aktuellen Spieltags, Attribut "spiele"
#   sensor.fussball_bl1_tabelle / sensor.fussball_bl2_tabelle
#       state = Spieltag, Attribut "tabelle"
#   sensor.fussball_fck
#       state = Tabellenplatz, Attribute punkte, spiele, tordifferenz, form,
#       naechstes
#   binary_sensor.fussball_live
#       an von 5 min vor bis 150 min nach einem Anstoss ohne Endergebnis
#
# Datenquelle: https://api.openligadb.de (kostenlos, ohne API-Key).
# Geprueft am 11.10.2026 aus der Instanz heraus:
#   - getmatchdata/<liga> OHNE Saison/Spieltag liefert waehrend eines Spiels
#     veraltete Staende (Koeln-Gladbach 0:0 statt 1:1). Deshalb immer
#     getcurrentgroup -> getmatchdata/<liga>/<saison>/<spieltag>.
#   - getbltable zaehlt laufende Spiele bereits mit (Live-Tabelle).
#   - getmatchesbyteamid liefert auch Duplikat-Ligen (z. B. "bl2h") ->
#     auf leagueShortcut und leagueSeason filtern.
#   - Feldnamen: team1/team2 {teamId, teamName, shortName, teamIconUrl},
#     goals[] {scoreTeam1, scoreTeam2, matchMinute, goalGetterName,
#     isPenalty, isOwnGoal}, matchResults[] {resultTypeID 2 = Endergebnis
#     bzw. aktueller Stand}, Tabelle {teamInfoId, shortName, teamIconUrl,
#     matches, won, draw, lost, goals, opponentGoals, goalDiff, points}.
#   - 1. FC Kaiserslautern: teamInfoId 76 (ESPN-ID 130).
#
# Saison: ab Juli das laufende Jahr, davor das Vorjahr (2026 = 2026/27).
#
# Abruftakt: Das Paket fragt NICHT selbst periodisch ab. Die Automation
# "Fussball: Daten aktualisieren" (per UI/API angelegt) feuert das Event
# fussball_aktualisieren:
#   - alle 15 min mit umfang: voll   -> Spieltage + Tabellen + FCK
#   - jede Minute, solange binary_sensor.fussball_live an ist, mit
#     umfang: live                   -> nur Spieltage
#   - einmal beim Wechsel von live auf aus mit umfang: voll
# Dazu beim Start von Home Assistant einmal alles.
# Last: voll = 7 Abrufe, live = 4 Abrufe pro Minute.
#
# Groessen: Attribute bleiben gekuerzt bei ca. 3-4 KB pro Sensor und damit
# unter der Recorder-Grenze von 16 384 Bytes (MAX_STATE_ATTRS_BYTES).
#
# ---------------------------------------------------------------------------
# EINRICHTUNG (einmalig, YAML noetig: rest_command und Trigger-Templates mit
# actions/attributes haben keinen UI-Dialog)
# ---------------------------------------------------------------------------
#   1. In configuration.yaml Pakete aktivieren (falls noch nicht vorhanden):
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Diese Datei als /config/packages/fussball.yaml ablegen.
#   3. Entwicklerwerkzeuge > YAML > Konfiguration pruefen, danach
#      Home Assistant neu starten (rest_command kennt kein Reload).
#   Danach erscheinen die Sensoren; die Automation und der Helfer
#   input_select.fussball_liga existieren bereits (per API angelegt).

rest_command:
  openligadb:
    url: "https://api.openligadb.de/{{ pfad }}"
    method: GET
    timeout: 20

template:
  # -------------------------------------------------------------------------
  # Spieltage (live): bei jedem Event fussball_aktualisieren
  # -------------------------------------------------------------------------
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: fussball_aktualisieren
    actions:
      - variables:
          saison: "{{ now().year if now().month >= 7 else now().year - 1 }}"
      - action: rest_command.openligadb
        data:
          pfad: getcurrentgroup/bl1
        response_variable: gruppe_bl1
        continue_on_error: true
      - action: rest_command.openligadb
        data:
          pfad: >-
            getmatchdata/bl1/{{ saison }}/{{ gruppe_bl1.content.groupOrderID
            if gruppe_bl1 is defined and gruppe_bl1.status == 200
            and gruppe_bl1.content is mapping else 1 }}
        response_variable: spiele_bl1
        continue_on_error: true
      - action: rest_command.openligadb
        data:
          pfad: getcurrentgroup/bl2
        response_variable: gruppe_bl2
        continue_on_error: true
      - action: rest_command.openligadb
        data:
          pfad: >-
            getmatchdata/bl2/{{ saison }}/{{ gruppe_bl2.content.groupOrderID
            if gruppe_bl2 is defined and gruppe_bl2.status == 200
            and gruppe_bl2.content is mapping else 1 }}
        response_variable: spiele_bl2
        continue_on_error: true
      - variables:
          # Antwort -> kompakte Liste. Stand: Endergebnis (resultTypeID 2) oder
          # letztes Tor, je nachdem, was mehr Tore zaehlt (aktueller).
          spiele_kompakt: >-
            {%- macro liste(r) -%}
            {%- set ns = namespace(l=[]) -%}
            {%- if r is defined and r.status == 200 and r.content is list -%}
            {%- for m in r.content -%}
            {%- set g = m.goals | default([], true) -%}
            {%- set e = m.matchResults | default([], true)
                | selectattr('resultTypeID', 'eq', 2) | list -%}
            {%- set th = none -%}{%- set tg = none -%}
            {%- if e and (not g or (e[0].pointsTeam1 + e[0].pointsTeam2)
                >= ((g | last).scoreTeam1 + (g | last).scoreTeam2)) -%}
            {%- set th = e[0].pointsTeam1 -%}{%- set tg = e[0].pointsTeam2 -%}
            {%- elif g -%}
            {%- set th = (g | last).scoreTeam1 -%}{%- set tg = (g | last).scoreTeam2 -%}
            {%- endif -%}
            {%- set tore = namespace(l=[]) -%}
            {%- for x in g -%}
            {%- set tore.l = tore.l + [{'min': x.matchMinute, 'name': x.goalGetterName,
                'h': x.scoreTeam1, 'g': x.scoreTeam2, 'et': x.isOwnGoal,
                'elf': x.isPenalty}] -%}
            {%- endfor -%}
            {%- set ns.l = ns.l + [{'id': m.matchID, 'anstoss': m.matchDateTimeUTC,
                'beendet': m.matchIsFinished,
                'heim': m.team1.shortName or m.team1.teamName, 'heim_id': m.team1.teamId,
                'heim_logo': m.team1.teamIconUrl,
                'gast': m.team2.shortName or m.team2.teamName, 'gast_id': m.team2.teamId,
                'gast_logo': m.team2.teamIconUrl,
                'th': th, 'tg': tg, 'tore': tore.l}] -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.l | to_json -}}
            {%- endmacro -%}
            {{ {'bl1': liste(spiele_bl1) | from_json,
                'bl2': liste(spiele_bl2) | from_json} }}
    sensor:
      - name: Fußball BL1 Spieltag
        unique_id: fussball_bl1_spieltag
        icon: mdi:soccer
        state: >-
          {{ gruppe_bl1.content.groupOrderID
             if gruppe_bl1 is defined and gruppe_bl1.status == 200
             and gruppe_bl1.content is mapping else this.state }}
        attributes:
          spiele: >-
            {{ spiele_kompakt.bl1 if spiele_kompakt.bl1 | count > 0
               else this.attributes.get('spiele', []) }}
          aktualisiert: >-
            {{ now().isoformat() if spiele_kompakt.bl1 | count > 0
               else this.attributes.get('aktualisiert') }}
      - name: Fußball BL2 Spieltag
        unique_id: fussball_bl2_spieltag
        icon: mdi:soccer
        state: >-
          {{ gruppe_bl2.content.groupOrderID
             if gruppe_bl2 is defined and gruppe_bl2.status == 200
             and gruppe_bl2.content is mapping else this.state }}
        attributes:
          spiele: >-
            {{ spiele_kompakt.bl2 if spiele_kompakt.bl2 | count > 0
               else this.attributes.get('spiele', []) }}
          aktualisiert: >-
            {{ now().isoformat() if spiele_kompakt.bl2 | count > 0
               else this.attributes.get('aktualisiert') }}

  # -------------------------------------------------------------------------
  # Tabellen + FCK: beim Start und bei umfang: voll
  # -------------------------------------------------------------------------
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: fussball_aktualisieren
        event_data:
          umfang: voll
    variables:
      fck_id: 76
      fck_liga: bl2
    actions:
      - variables:
          saison: "{{ now().year if now().month >= 7 else now().year - 1 }}"
      - action: rest_command.openligadb
        data:
          pfad: "getbltable/bl1/{{ saison }}"
        response_variable: tabelle_bl1
        continue_on_error: true
      - action: rest_command.openligadb
        data:
          pfad: "getbltable/bl2/{{ saison }}"
        response_variable: tabelle_bl2
        continue_on_error: true
      - action: rest_command.openligadb
        data:
          pfad: "getmatchesbyteamid/{{ fck_id }}/10/3"
        response_variable: fck_spiele
        continue_on_error: true
      - variables:
          tabellen: >-
            {%- macro liste(r) -%}
            {%- set ns = namespace(l=[]) -%}
            {%- if r is defined and r.status == 200 and r.content is list -%}
            {%- for t in r.content -%}
            {%- set ns.l = ns.l + [{'platz': loop.index, 'id': t.teamInfoId,
                'name': t.shortName or t.teamName, 'logo': t.teamIconUrl,
                'sp': t.matches, 's': t.won, 'u': t.draw, 'n': t.lost,
                'tore': t.goals, 'gegen': t.opponentGoals, 'td': t.goalDiff,
                'pkt': t.points}] -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.l | to_json -}}
            {%- endmacro -%}
            {{ {'bl1': liste(tabelle_bl1) | from_json,
                'bl2': liste(tabelle_bl2) | from_json} }}
          fck: >-
            {%- set ns = namespace(form=[], naechstes=none) -%}
            {%- if fck_spiele is defined and fck_spiele.status == 200
                and fck_spiele.content is list -%}
            {%- set liga = fck_spiele.content
                | selectattr('leagueShortcut', 'eq', fck_liga)
                | selectattr('leagueSeason', 'eq', saison | int)
                | sort(attribute='matchDateTimeUTC') | list -%}
            {%- for m in liga -%}
            {%- set heim = m.team1.teamId == fck_id -%}
            {%- set e = m.matchResults | default([], true)
                | selectattr('resultTypeID', 'eq', 2) | list -%}
            {%- if m.matchIsFinished and e -%}
            {%- set a = e[0].pointsTeam1 if heim else e[0].pointsTeam2 -%}
            {%- set b = e[0].pointsTeam2 if heim else e[0].pointsTeam1 -%}
            {%- set ns.form = ns.form + ['S' if a > b else ('U' if a == b else 'N')] -%}
            {%- elif not m.matchIsFinished and ns.naechstes is none -%}
            {%- set geg = m.team2 if heim else m.team1 -%}
            {%- set ns.naechstes = {'id': m.matchID, 'anstoss': m.matchDateTimeUTC,
                'heim': heim, 'gegner': geg.shortName or geg.teamName,
                'gegner_logo': geg.teamIconUrl, 'spieltag': m.group.groupOrderID} -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {%- set zeile = tabellen[fck_liga] | selectattr('id', 'eq', fck_id) | list -%}
            {{ {'ok': zeile | count > 0, 'zeile': zeile[0] if zeile else none,
                'form': ns.form[-5:], 'naechstes': ns.naechstes} }}
    sensor:
      - name: Fußball BL1 Tabelle
        unique_id: fussball_bl1_tabelle
        icon: mdi:format-list-numbered
        state: "{{ tabellen.bl1 | map(attribute='sp') | max if tabellen.bl1 else this.state }}"
        attributes:
          tabelle: >-
            {{ tabellen.bl1 if tabellen.bl1 | count > 0
               else this.attributes.get('tabelle', []) }}
          aktualisiert: >-
            {{ now().isoformat() if tabellen.bl1 | count > 0
               else this.attributes.get('aktualisiert') }}
      - name: Fußball BL2 Tabelle
        unique_id: fussball_bl2_tabelle
        icon: mdi:format-list-numbered
        state: "{{ tabellen.bl2 | map(attribute='sp') | max if tabellen.bl2 else this.state }}"
        attributes:
          tabelle: >-
            {{ tabellen.bl2 if tabellen.bl2 | count > 0
               else this.attributes.get('tabelle', []) }}
          aktualisiert: >-
            {{ now().isoformat() if tabellen.bl2 | count > 0
               else this.attributes.get('aktualisiert') }}
      - name: Fußball FCK
        unique_id: fussball_fck
        icon: mdi:shield-star
        state: "{{ fck.zeile.platz if fck.ok else this.state }}"
        attributes:
          team_id: "{{ fck_id }}"
          liga: "{{ fck_liga }}"
          name: "{{ fck.zeile.name if fck.ok else this.attributes.get('name') }}"
          logo: "{{ fck.zeile.logo if fck.ok else this.attributes.get('logo') }}"
          punkte: "{{ fck.zeile.pkt if fck.ok else this.attributes.get('punkte') }}"
          spiele: "{{ fck.zeile.sp if fck.ok else this.attributes.get('spiele') }}"
          tordifferenz: "{{ fck.zeile.td if fck.ok else this.attributes.get('tordifferenz') }}"
          form: "{{ fck.form if fck.form else this.attributes.get('form', []) }}"
          naechstes: "{{ fck.naechstes if fck.naechstes else this.attributes.get('naechstes') }}"

  # -------------------------------------------------------------------------
  # Live-Fenster: steuert den Minutentakt der Automation
  # -------------------------------------------------------------------------
  - binary_sensor:
      - name: Fußball live
        unique_id: fussball_live
        icon: mdi:soccer-field
        state: >-
          {%- set ns = namespace(live=false) -%}
          {%- for s in ['sensor.fussball_bl1_spieltag', 'sensor.fussball_bl2_spieltag'] -%}
          {%- for m in state_attr(s, 'spiele') or [] -%}
          {%- set a = as_datetime(m.anstoss) -%}
          {%- if a and not m.beendet
              and now() >= a - timedelta(minutes=5)
              and now() <= a + timedelta(minutes=150) -%}
          {%- set ns.live = true -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.live }}
