# System-Ansicht (Home Assistant / Proxmox VM) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# Owlet-Sektion: Kopf mit Online-Badge, Uptime-Verlauf (custom:uptime-card),
# kompakte Status-Kacheln (Knoten/IP/Status/Gesundheit) und die vertrauten
# custom:mini-graph-card-Verlaeufe (CPU/Arbeitsspeicher/Swap/Traffic) -
# Owlet-gerahmt und in der Owlet-Palette. CPU nutzt Schwellwert-Farben.
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &shell, &head_styles, &info_styles,
# &val_text, &val_status, &graph_frame.
#
# Voraussetzung: custom:button-card + custom:uptime-card +
# custom:mini-graph-card + card-mod (HACS).
type: vertical-stack
card_mod: &shell
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopf mit Online-Badge ----
  - type: custom:button-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: mdi:home-assistant
    name: Home Assistant
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      badge: |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const on=e&&e.state==='on';
          const c=on?'#a6d49e':'#f0736a';
          const txt=on?'online':'offline';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${txt}</span>`;
        ]]]
    styles: &head_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
  # ---- Uptime-Verlauf (Owlet-gerahmt) ----
  - type: custom:uptime-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: si:homeassistant
    tooltip_adaptive_color: false
    icon_adaptive_color: true
    status_adaptive_color: true
    title_adaptive_color: true
    title: Uptime
    alias: { ok: online, ko: offline }
    color: { icon: '#a6d49e', ok: '#a6d49e', ko: '#f0736a', title: '#e7ecf3' }
    bar: { spacing: 4, height: 10, round: 4 }
    show: { average: true, status: true }
    alignment: { status: spaced, header: left, icon_first: true }
    tap_action: { action: more-info }
    duration: { quantity: 1, unit: day }
    card_mod: &graph_frame
      style: |
        ha-card {
          background: rgba(255,255,255,0.02) !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
        }
  # ---- Status-Kacheln (Knoten / IP / Status / Gesundheit) ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_knoten
        icon: mdi:server
        name: Knoten
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#8794a5' }
        label: &val_text |
          [[[ const e=(typeof entity!=='undefined')?entity:null; return e?e.state:'–'; ]]]
        styles: &info_styles
          card:
            - border-radius: 14px
            - padding: 10px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i l" "i n"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 36px
            - height: 36px
            - border-radius: 10px
            - margin-right: 11px
            - align-self: center
            - background: |
                [[[ return (variables.accent||'#8794a5')+'24'; ]]]
            - border: |
                [[[ return '1px solid '+(variables.accent||'#8794a5')+'3d'; ]]]
          icon:
            - width: 19px
            - height: 19px
            - color: |
                [[[ return variables.accent||'#8794a5'; ]]]
          label:
            - justify-self: start
            - align-self: end
            - font-size: 14.5px
            - font-weight: 750
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          name:
            - justify-self: start
            - align-self: start
            - font-size: 10.5px
            - color: '#6e7988'
            - margin-top: 1px
            - text-transform: uppercase
            - letter-spacing: 0.06em
            - font-weight: 700
      - type: custom:button-card
        entity: sensor.system_monitor_ipv4_adresse_enp0s18
        icon: mdi:ip-network
        name: IP-Adresse
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#7fb3d5' }
        label: *val_text
        styles: *info_styles
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_status
        icon: mdi:play-circle
        name: Status
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#a6d49e' }
        label: &val_status |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const s=e?String(e.state).toLowerCase():'';
            const good=['running','läuft','on','ok','online','active'].includes(s);
            const c=good?'#a6d49e':'#f0736a';
            return `<span style="color:${c};">${e?e.state:'–'}</span>`;
          ]]]
        styles: *info_styles
      - type: custom:button-card
        entity: binary_sensor.qemu_homeassistant_102_gesundheit
        icon: mdi:heart-pulse
        name: Gesundheit
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#a6d49e' }
        label: |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const s=e?String(e.state).toLowerCase():'';
            const good=['on','ok','online','healthy','running'].includes(s);
            const c=good?'#a6d49e':'#f0736a';
            const txt = (s==='on') ? 'OK' : (s==='off' ? 'Fehler' : (e?e.state:'–'));
            return `<span style="color:${c};">${txt}</span>`;
          ]]]
        styles: *info_styles
  # ---- CPU (mini-graph, Schwellwert-Farben) ----
  - type: custom:mini-graph-card
    name: CPU-Auslastung
    icon: mdi:cpu-64-bit
    entities:
      - entity: sensor.qemu_homeassistant_102_cpu_auslastung
        name: CPU
    line_width: 3
    smoothing: true
    show: { extrema: true, average: true, state: true }
    color_thresholds:
      - { value: 0, color: '#a6d49e' }
      - { value: 40, color: '#e6b566' }
      - { value: 75, color: '#f0736a' }
    card_mod: *graph_frame
  # ---- Arbeitsspeicher (mini-graph) ----
  - type: custom:mini-graph-card
    name: Arbeitsspeicher
    icon: mdi:memory
    line_color:
      - '#e6b566'
      - '#7fb3d5'
    line_width: 3
    smoothing: true
    hours_to_show: 48
    hour24: true
    update_interval: 60
    show: { state: true, legend: false, average: false, extrema: true, labels: true }
    entities:
      - entity: sensor.qemu_homeassistant_102_genutzter_arbeitsspeicher
        name: Genutzt
      - entity: sensor.qemu_homeassistant_102_freier_arbeitsspeicher
        name: Frei
    card_mod: *graph_frame
  # ---- Swap (mini-graph) ----
  - type: custom:mini-graph-card
    name: Swap
    icon: mdi:harddisk
    line_color:
      - '#b399d4'
      - '#7fb3d5'
    line_width: 3
    smoothing: true
    show: { state: false, legend: false, average: true, extrema: true, labels: true }
    entities:
      - entity: sensor.system_monitor_swap_frei
        name: Swap frei
      - entity: sensor.system_monitor_swap_verwendung
        name: Swap belegt
    card_mod: *graph_frame
  # ---- Traffic (mini-graph) ----
  - type: custom:mini-graph-card
    name: Traffic
    icon: mdi:swap-vertical-bold
    line_color:
      - '#e6b566'
      - '#7fb3d5'
    line_width: 3
    smoothing: true
    show: { state: false, legend: false, average: true, extrema: true, labels: true }
    entities:
      - entity: sensor.system_monitor_ausgehender_netzwerkdurchsatz_enp0s18
        name: Ausgehend
      - entity: sensor.system_monitor_eingehender_netzwerkdurchsatz_enp0s18
        name: Eingehend
    card_mod: *graph_frame
