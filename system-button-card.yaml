# System-Ansicht (Home Assistant / Proxmox VM) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# Owlet-Sektion: Kopf mit Online-Badge, Uptime-Verlauf (custom:uptime-card),
# kompakte Status-Kacheln (Knoten/IP/Status/Gesundheit), CPU + Arbeitsspeicher
# als Ringe (Schwellwert-Farben) und Swap + Traffic (ein/aus) als Balken-Zeilen.
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &shell, &head_styles, &info_styles,
# &val_text, &val_status, &graph_frame, &ring_styles, &res_styles, &res_label,
# &res_bar.
#
# Voraussetzung: custom:button-card + custom:uptime-card + card-mod (HACS).
type: vertical-stack
card_mod: &shell
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopf mit Online-Badge ----
  - type: custom:button-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: mdi:home-assistant
    name: Home Assistant
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      badge: |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const on=e&&e.state==='on';
          const c=on?'#a6d49e':'#f0736a';
          const txt=on?'online':'offline';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${txt}</span>`;
        ]]]
    styles: &head_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
  # ---- Uptime-Verlauf (Owlet-gerahmt) ----
  - type: custom:uptime-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: si:homeassistant
    tooltip_adaptive_color: false
    icon_adaptive_color: true
    status_adaptive_color: true
    title_adaptive_color: true
    title: Uptime
    alias: { ok: online, ko: offline }
    color: { icon: '#a6d49e', ok: '#a6d49e', ko: '#f0736a', title: '#e7ecf3' }
    bar: { spacing: 4, height: 10, round: 4 }
    show: { average: true, status: true }
    alignment: { status: spaced, header: left, icon_first: true }
    tap_action: { action: more-info }
    duration: { quantity: 1, unit: day }
    card_mod: &graph_frame
      style: |
        ha-card {
          background: rgba(255,255,255,0.02) !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
        }
  # ---- Status-Kacheln (Knoten / IP / Status / Gesundheit) ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_knoten
        icon: mdi:server
        name: Knoten
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#8794a5' }
        label: &val_text |
          [[[ const e=(typeof entity!=='undefined')?entity:null; return e?e.state:'–'; ]]]
        styles: &info_styles
          card:
            - border-radius: 14px
            - padding: 10px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i l" "i n"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 36px
            - height: 36px
            - border-radius: 10px
            - margin-right: 11px
            - align-self: center
            - background: |
                [[[ return (variables.accent||'#8794a5')+'24'; ]]]
            - border: |
                [[[ return '1px solid '+(variables.accent||'#8794a5')+'3d'; ]]]
          icon:
            - width: 19px
            - height: 19px
            - color: |
                [[[ return variables.accent||'#8794a5'; ]]]
          label:
            - justify-self: start
            - align-self: end
            - font-size: 14.5px
            - font-weight: 750
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
          name:
            - justify-self: start
            - align-self: start
            - font-size: 10.5px
            - color: '#6e7988'
            - margin-top: 1px
            - text-transform: uppercase
            - letter-spacing: 0.06em
            - font-weight: 700
      - type: custom:button-card
        entity: sensor.system_monitor_ipv4_adresse_enp0s18
        icon: mdi:ip-network
        name: IP-Adresse
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#7fb3d5' }
        label: *val_text
        styles: *info_styles
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_status
        icon: mdi:play-circle
        name: Status
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#a6d49e' }
        label: &val_status |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const s=e?String(e.state).toLowerCase():'';
            const good=['running','läuft','on','ok','online','active'].includes(s);
            const c=good?'#a6d49e':'#f0736a';
            return `<span style="color:${c};">${e?e.state:'–'}</span>`;
          ]]]
        styles: *info_styles
      - type: custom:button-card
        entity: binary_sensor.qemu_homeassistant_102_gesundheit
        icon: mdi:heart-pulse
        name: Gesundheit
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: { accent: '#a6d49e' }
        label: |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const s=e?String(e.state).toLowerCase():'';
            const good=['on','ok','online','healthy','running'].includes(s);
            const c=good?'#a6d49e':'#f0736a';
            const txt = (s==='on') ? 'OK' : (s==='off' ? 'Fehler' : (e?e.state:'–'));
            return `<span style="color:${c};">${txt}</span>`;
          ]]]
        styles: *info_styles
  # ---- CPU + Arbeitsspeicher als Ringe ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_cpu_auslastung
        show_icon: false
        show_name: false
        show_state: false
        tap_action: { action: more-info }
        styles: &ring_styles
          card:
            - border-radius: 16px
            - padding: 14px 8px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-areas: '"ring"'
          custom_fields:
            ring:
              - width: 100%
        custom_fields:
          ring: |
            [[[
              const v=parseFloat(entity.state)||0;
              const pct=Math.max(0,Math.min(100,v));
              const c = pct>=75?'#f0736a':(pct>=40?'#e6b566':'#a6d49e');
              const circ=314.16, off=Math.max(0,circ*(1-pct/100));
              return `
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="position:relative;width:110px;height:110px;">
                    <svg viewBox="0 0 120 120" style="width:110px;height:110px;transform:rotate(-90deg);">
                      <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="11"/>
                      <circle cx="60" cy="60" r="50" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                      <div style="color:#f2f5f8;font-size:24px;font-weight:750;letter-spacing:-0.03em;line-height:1;">${v.toFixed(2).replace('.',',')}<span style="font-size:13px;">%</span></div>
                      <div style="color:#6e7988;font-size:10.5px;margin-top:2px;">CPU</div>
                    </div>
                  </div>
                  <div style="font-size:12px;color:#6e7988;font-weight:600;">Auslastung</div>
                </div>`;
            ]]]
      - type: custom:button-card
        entity: sensor.qemu_homeassistant_102_genutzter_arbeitsspeicher
        show_icon: false
        show_name: false
        show_state: false
        tap_action: { action: more-info }
        triggers_update: all
        variables:
          used_entity: sensor.qemu_homeassistant_102_genutzter_arbeitsspeicher
          free_entity: sensor.qemu_homeassistant_102_freier_arbeitsspeicher
        styles: *ring_styles
        custom_fields:
          ring: |
            [[[
              const used=parseFloat(states[variables.used_entity]?.state)||0;
              const free=parseFloat(states[variables.free_entity]?.state)||0;
              const tot=used+free;
              const pct= tot>0 ? Math.round(used/tot*100) : 0;
              const c = pct>=90?'#f0736a':(pct>=75?'#e6b566':'#a6d49e');
              const circ=314.16, off=Math.max(0,circ*(1-pct/100));
              return `
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="position:relative;width:110px;height:110px;">
                    <svg viewBox="0 0 120 120" style="width:110px;height:110px;transform:rotate(-90deg);">
                      <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="11"/>
                      <circle cx="60" cy="60" r="50" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                      <div style="color:#f2f5f8;font-size:24px;font-weight:750;letter-spacing:-0.03em;line-height:1;">${pct}<span style="font-size:13px;">%</span></div>
                      <div style="color:#6e7988;font-size:10.5px;margin-top:2px;">${used.toFixed(2).replace('.',',')} GB</div>
                    </div>
                  </div>
                  <div style="font-size:12px;color:#6e7988;font-weight:600;">Arbeitsspeicher</div>
                </div>`;
            ]]]
  # ---- Swap + Traffic als Balken-Zeilen ----
  - type: custom:button-card
    entity: sensor.system_monitor_swap_verwendung
    icon: mdi:harddisk
    name: Swap belegt
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    triggers_update: all
    variables:
      accent: '#b399d4'
      total_entity: sensor.system_monitor_swap_frei
      decimals: 1
    label: &res_label |
      [[[
        const e=(typeof entity!=='undefined')?entity:null;
        let v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):NaN;
        const d=(variables.decimals===undefined?2:variables.decimals);
        let n=isNaN(v)?((e&&e.state)?e.state:'–'):v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
        const u=variables.unit || ((e&&e.attributes)?e.attributes.unit_of_measurement:'') || '';
        return `${n}<span style="font-size:0.7em;color:#6e7988;font-weight:600;margin-left:3px;">${u}</span>`;
      ]]]
    custom_fields:
      bar: &res_bar |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          let v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):0; if(isNaN(v))v=0;
          let pct;
          if(variables.total_entity){ const o=parseFloat(states[variables.total_entity]?.state)||0; const tot=v+o; pct= tot>0? v/tot*100:0; }
          else { const mx=variables.max||100; pct= mx>0? v/mx*100:0; }
          pct=Math.max(0,Math.min(100,pct));
          const a=variables.accent||'#7fb3d5';
          return `<div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;"><div style="height:100%;width:${pct}%;border-radius:6px;background:${a};"></div></div>`;
        ]]]
    styles: &res_styles
      card:
        - border-radius: 16px
        - padding: 12px 14px
        - box-shadow: none
        - background: 'rgba(255,255,255,0.028)'
        - border: 1px solid rgba(255,255,255,0.06)
      grid:
        - grid-template-columns: min-content 1fr auto
        - grid-template-areas: '"i n l" "i bar bar"'
        - grid-template-rows: min-content min-content
        - grid-row-gap: 8px
      img_cell:
        - width: 34px
        - height: 34px
        - border-radius: 10px
        - margin-right: 12px
        - align-self: center
        - background: |
            [[[ return (variables.accent||'#7fb3d5')+'26'; ]]]
        - border: |
            [[[ return '1px solid '+(variables.accent||'#7fb3d5')+'3a'; ]]]
      icon:
        - width: 18px
        - height: 18px
        - color: |
            [[[ return variables.accent||'#7fb3d5'; ]]]
      name:
        - justify-self: start
        - align-self: center
        - font-size: 13px
        - font-weight: 600
        - color: '#e7ecf3'
      label:
        - justify-self: end
        - align-self: center
        - font-size: 13.5px
        - font-weight: 700
        - color: '#f2f5f8'
      custom_fields:
        bar:
          - align-self: center
  - type: custom:button-card
    entity: sensor.system_monitor_eingehender_netzwerkdurchsatz_enp0s18
    icon: mdi:download-network
    name: Traffic eingehend
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    triggers_update: all
    variables: { accent: '#7fb3d5', unit: MB/s, decimals: 2, max: 100 }
    label: *res_label
    custom_fields: { bar: *res_bar }
    styles: *res_styles
  - type: custom:button-card
    entity: sensor.system_monitor_ausgehender_netzwerkdurchsatz_enp0s18
    icon: mdi:upload-network
    name: Traffic ausgehend
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    triggers_update: all
    variables: { accent: '#e6b566', unit: MB/s, decimals: 2, max: 100 }
    label: *res_label
    custom_fields: { bar: *res_bar }
    styles: *res_styles
