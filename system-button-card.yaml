# System (Home Assistant / VM) im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
# Variante B ("Grafana-Hero"): Kopf mit Online-Badge, schlanke Statuszeile,
# KPI-Leiste (CPU/RAM/Swap/Netz) als ApexCharts-Sparklines und eine grosse
# Flaechenkurve (CPU + RAM) mit Verlaufsfuellung. Abschluss: Owlet-gerahmte
# uptime-card als Verfuegbarkeits-Historie.
#
# Gemeinsame Optik ueber YAML-Anker: &shell, &head_styles, &online_badge,
# &kpi_apex, &kpi_frame, &frame.
#
# Voraussetzung: custom:button-card + custom:apexcharts-card + custom:uptime-card
# + card-mod (HACS).
type: vertical-stack
card_mod: &shell
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  # ---- Kopf mit Online-Badge ----
  - type: custom:button-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: mdi:home-assistant
    name: Home Assistant
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      badge: &online_badge |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const on=e&&e.state==='on';
          const c=on?'#a6d49e':'#f0736a';
          const txt=on?'online':'offline';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}3d;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}2e;"></span>${txt}</span>`;
        ]]]
    styles: &head_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center

  # ---- Statuszeile (Status / Gesundheit / Knoten / IP) ----
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_label: false
    triggers_update: all
    tap_action:
      action: none
    custom_fields:
      chips: |
        [[[
          const S=(id)=>states[id];
          const bad=['off','unavailable','unknown','none','','error','problem',
                     'critical','kritisch','offline','stopped','disconnected'];
          const isBad=(s)=>!s||bad.includes(String(s.state).toLowerCase());
          const map={running:'Läuft',on:'An',off:'Aus',stopped:'Gestoppt',
                     idle:'Bereit',healthy:'OK',unavailable:'—',unknown:'—'};
          const txt=(s)=>{const v=s?String(s.state):''; return map[v.toLowerCase()]||v||'—';};
          const dotChip=(s,label)=>{
            const c=isBad(s)?'#f0736a':'#a6d49e';
            return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#c7d0dd;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}28;"></span>${label}</span>`;
          };
          const iconChip=(svg,val)=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#c7d0dd;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.06);white-space:nowrap;">${svg}<span>${val}</span></span>`;
          const st=S('sensor.qemu_homeassistant_102_status');
          const hp=S('binary_sensor.qemu_homeassistant_102_gesundheit');
          const kn=S('sensor.qemu_homeassistant_102_knoten');
          const ip=S('sensor.system_monitor_ipv4_adresse_enp0s18');
          const icoNode=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#6e7988" stroke-width="1.7"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M12 7.2V13M12 13H6v3.8M12 13h6v3.8" stroke-linecap="round"/></svg>`;
          const icoIp=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#6e7988" stroke-width="1.7"><rect x="2" y="9" width="20" height="6" rx="2"/><path d="M6 12h.01M10 12h.01M14 12h4" stroke-linecap="round"/></svg>`;
          const knTxt=kn&&kn.state&&kn.state!=='unavailable'?kn.state:'–';
          const ipTxt=ip&&ip.state&&ip.state!=='unavailable'?ip.state:'–';
          return `<div style="display:flex;flex-wrap:wrap;gap:7px;">
            ${dotChip(st, txt(st))}
            ${dotChip(hp, 'Gesundheit')}
            ${iconChip(icoNode, knTxt+' Knoten')}
            ${iconChip(icoIp, ipTxt)}
          </div>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0 2px 2px
      grid:
        - grid-template-areas: '"chips"'
      custom_fields:
        chips:
          - justify-self: start

  # ---- KPI-Leiste: ApexCharts-Sparklines mit aktuellem Wert ----
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        header: &kpi_header
          show: true
          show_states: true
          colorize_states: true
        show:
          loading: false
        all_series_config:
          type: area
          stroke_width: 2
          show:
            legend_value: false
        apex_config: &kpi_apex
          chart:
            height: 95
            sparkline:
              enabled: true
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.4
              opacityTo: 0.0
          tooltip:
            enabled: false
        series:
          - entity: sensor.qemu_homeassistant_102_cpu_auslastung
            name: CPU
            color: '#a6d49e'
        card_mod: &kpi_frame
          style: |
            ha-card {
              background: rgba(255,255,255,0.028) !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
              border-radius: 14px !important;
              box-shadow: none !important;
              padding: 4px 6px !important;
            }
      - type: custom:apexcharts-card
        graph_span: 24h
        header: *kpi_header
        show:
          loading: false
        all_series_config:
          type: area
          stroke_width: 2
          show:
            legend_value: false
        apex_config: *kpi_apex
        series:
          - entity: sensor.qemu_homeassistant_102_genutzter_arbeitsspeicher
            name: RAM
            color: '#e6b566'
        card_mod: *kpi_frame
      - type: custom:apexcharts-card
        graph_span: 24h
        header: *kpi_header
        show:
          loading: false
        all_series_config:
          type: area
          stroke_width: 2
          show:
            legend_value: false
        apex_config: *kpi_apex
        series:
          - entity: sensor.system_monitor_swap_verwendung
            name: Swap
            color: '#a6d49e'
        card_mod: *kpi_frame
      - type: custom:apexcharts-card
        graph_span: 24h
        header: *kpi_header
        show:
          loading: false
        all_series_config:
          type: area
          stroke_width: 2
          show:
            legend_value: false
        apex_config: *kpi_apex
        series:
          - entity: sensor.system_monitor_ausgehender_netzwerkdurchsatz_enp0s18
            name: Netz ↑
            color: '#7fb3d5'
        card_mod: *kpi_frame

  # ---- Hero-Kurve: CPU + RAM ueber die Zeit (Owlet-gerahmt) ----
  - type: custom:apexcharts-card
    graph_span: 48h
    header:
      show: true
      title: Auslastung · 48 h
      show_states: false
    show:
      loading: false
    all_series_config:
      type: area
      stroke_width: 2
      curve: smooth
    yaxis:
      - id: pct
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
      - id: mem
        opposite: true
        min: 0
        decimals: 1
        apex_config:
          tickAmount: 4
    series:
      - entity: sensor.qemu_homeassistant_102_cpu_auslastung
        name: CPU
        color: '#a6d49e'
        yaxis_id: pct
      - entity: sensor.qemu_homeassistant_102_genutzter_arbeitsspeicher
        name: RAM
        color: '#e6b566'
        yaxis_id: mem
    apex_config:
      chart:
        height: 190
      fill:
        type: gradient
        gradient:
          shadeIntensity: 0.3
          opacityFrom: 0.45
          opacityTo: 0.05
          stops: [0, 95]
      grid:
        borderColor: 'rgba(255,255,255,0.06)'
        strokeDashArray: 4
      legend:
        show: true
        position: top
        horizontalAlign: right
        labels:
          colors: '#8794a5'
      stroke:
        curve: smooth
      xaxis:
        labels:
          style:
            colors: '#6e7988'
      tooltip:
        theme: dark
    card_mod: &frame
      style: |
        ha-card {
          background: rgba(255,255,255,0.02) !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          padding: 8px 10px !important;
        }

  # ---- Verfuegbarkeit (Owlet-gerahmte uptime-card) ----
  - type: custom:uptime-card
    entity: binary_sensor.uptimekuma_home_assistant
    icon: si:homeassistant
    title: Home Assistant
    tooltip_adaptive_color: true
    icon_adaptive_color: true
    status_adaptive_color: true
    title_adaptive_color: true
    alias: { ok: online, ko: offline }
    color: { icon: '#a6d49e', ok: '#a6d49e', ko: '#f0736a', title: '#e7ecf3' }
    bar: { spacing: 4, height: 10, round: 4 }
    show: { average: true, status: true }
    alignment: { status: spaced, header: left, icon_first: true }
    tap_action: { action: more-info }
    duration: { quantity: 1, unit: day }
    card_mod: *frame
