type: custom:button-card
entity: input_boolean.bewasserung_garten
name: Gartenbewässerung
icon: mdi:sprinkler-variant
tap_action:
  action: toggle
layout: custom
styles:
  card:
    - border-radius: 24px
    - padding: 16px
  grid:
    - grid-template-areas: "\"i n\" \"i status\""
    - grid-template-columns: 64px 1fr
    - grid-template-rows: 1fr 1fr
    - justify-items: start
  icon:
    - width: 36px
    - color: |
        [[[
          return entity.state === 'on'
            ? 'var(--primary-color)'
            : 'var(--disabled-color)';
        ]]]
  name:
    - font-size: 14px
    - font-weight: 600
    - align-self: end
    - justify-self: start
  custom_fields:
    status:
      - font-size: 12px
      - color: var(--secondary-text-color)
      - align-self: start
      - justify-self: start
custom_fields:
  status: |
    [[[
      return entity.state === 'on' ? 'an' : 'aus';
    ]]]
