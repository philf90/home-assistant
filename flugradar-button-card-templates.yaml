# ============================================================================
# Flugradar – button-card-Templates fuer die View flugradar-view.yaml
# ----------------------------------------------------------------------------
# Daten: HACS-Integration "Flightradar24" (AlexandrErohin, getestet v2.3.0),
# Sensor sensor.flightradar24_current_in_area, Attribut "flights" (Liste mit
# Position, Hoehe, Kurs, Route, Typ, Kennzeichen, Foto-URL, Spur
# "coordinates"). Einrichtung: Einstellungen > Geraete & Dienste >
# Flightradar24; Radius in METERN (50000 = 50 km), Mittelpunkt = zone.home.
#
# EINMAL einfuegen: Dashboard -> 3 Punkte -> "Dashboard bearbeiten" ->
#   3 Punkte -> "Raw-Konfigurationseditor" -> die Eintraege unter
#   "button_card_templates:" neben den vorhandenen Templates ergaenzen.
#
# Aufbau (Varianten aus dem Artefakt "Flugradar-View"):
#   flug_daten          gemeinsamer Datenzugriff (variables.fr) + Hilfen
#   flug_kopf           Kopfzeile im Owlet-Stil (Icon-Kachel, Name, Unterzeile,
#                       Badge rechts)
#   flug_karte_kopf / flug_karte    K1: Kartenausschnitt mit Spuren
#   flug_liste_kopf / flug_liste    E2: Liste "Jetzt ueber uns"
#   flug_detail                     D1: Inhalt des Bubble-Card-Popups #flug
#   flug_verkehr_kopf               P5: Kopf mit Umschalter 24 h / 7 Tage
#                                   (Diagramme in flugradar-view.yaml)
#   flug_heute_kopf / flug_heute    P6 Tageszaehler, P7 naechster Ueberflug
#   flug_verfolgen_kopf / flug_verfolgen   P10 Flug verfolgen
#   flug_meldungen_kopf / flug_meldungen   P8 Schalter der Meldungen
#   Helfer und Automationen dazu: siehe Kopf von flugradar-view.yaml.
#
# Popup (P2): Abschnitt "Ankunft" mit Abweichung vom Flugplan
#   (time_estimated_arrival bzw. time_real_arrival minus
#   time_scheduled_arrival; unter 5 min "puenktlich"), Landung, Ortszeit am
#   Ziel (airport_destination_timezone_offset, nur wenn abweichend),
#   Restflugzeit, Reststrecke (Grosskreis zur Zielposition), Terminal.
#   Die Liste zeigt die Abweichung als Chip (+47 / -21).
# Karte (P3): gestrichelter Grosskreis vom gewaehlten Flug zum Ziel; liegt
#   das Ziel ausserhalb, steht "SOF · 1.373 km" am Rand des Ausschnitts
#   (neu berechnet bei jedem Verschieben/Zoomen).
#
# Eingabefeld (P10): button-card zeichnet Felder bei jeder Aenderung neu,
#   setzt sie aber per unsafeHTML ein (button-card.ts _unsafeHTMLorNot); lit
#   uebernimmt das DOM unveraendert, wenn der String gleich bleibt. Das Feld
#   "eingabe" liefert deshalb immer denselben String (fr.EINGABE), Text und
#   Fokus bleiben erhalten. Tastendruecke werden angehalten (keine
#   HA-Tastenkuerzel). Die Integration sucht innerhalb von text.set_value
#   (exakte Flugnummer, Callsign oder Kennzeichen); ohne Treffer schreibt sie
#   nur ins Log, die Karte meldet das nach 4 s selbst.
# button-card: custom_fields tragen class "ellipsis" (white-space: nowrap);
#   mehrzeilige Inhalte setzen white-space: normal. Arrays aus Templates
#   (z. B. triggers_update) werden verkettet, nicht ersetzt (helpers.ts).
#
# Karte (K1):
#   - Leaflet 1.9.4 von unpkg, dieselbe Datei wie die Karte der Integration
#     (window.L wird geteilt, kein doppeltes Laden).
#   - Kacheln: tile.openstreetmap.org, per CSS-Filter abgedunkelt (Owlet-Navy).
#     Referrer-Policy wie in der Integrationskarte, sonst lehnt OSM ab.
#   - Ringe 10 / 25 / 50 km um zone.home, Spur aus "coordinates".
#   - Beschriftung (Callsign + Hoehe) fuer den gewaehlten Flug und Fluege unter
#     25 km, ohne Ueberlappung: Rangfolge gewaehlt, dann nach Entfernung; je
#     Flug 8 Lagen um das Symbol, sonst Kurzform (nur Callsign), sonst keine.
#     Neu berechnet bei jeder Aktualisierung und nach Zoomen/Verschieben.
#   - Die Karte wird EINMAL pro Seite angelegt und bei jedem Neuzeichnen von
#     button-card in den neuen Platzhalter verschoben; Zoom und Ausschnitt
#     bleiben dadurch erhalten. Am Handy: verschieben mit zwei Fingern aus
#     (Seite soll scrollen), Zoom ueber +/- und Pinch.
#
# Farben (Hoehenband, wie die uebrigen Owlet-Views):
#   amber  unter 1.500 m (Anflug, Kleinflugzeuge)
#   tuerkis 1.500-7.500 m (Steig- und Sinkflug)
#   blau   Reiseflug
#   violett Sonderflug: Hubschrauber, Militaer, Polizei, Rettung (Kategorie
#           "Helicopter" oder Airline-Name mit Air Force/Army/Navy/Luftwaffe/
#           Bundeswehr/Police/Polizei/Ambulance/Rettung)
#   rot    Notfall-Squawk 7500/7600/7700 (Squawk nur mit FR24-Login)
#   grau   am Boden
#
# Auswahl: Antippen in Karte oder Liste merkt den Flug im Browser
# (window.__flugradar.sel, je Geraet) und oeffnet das Popup ueber den Hash
# #flug wie eine navigate-Aktion (history.pushState + location-changed).
#
# Klickbarkeit: button-card setzt bei Karten ohne Aktion (tap/hold none) die
# Klasse "disabled" mit pointer-events: none (styles.ts). Liste, Popup-Inhalt
# und Karte setzen deshalb selbst pointer-events: auto, sonst reagieren
# Zeilen, X und Links nicht (Leaflet-Marker setzen auto von sich aus).
#
# Touch: button-card ruft auf ha-card bei touchend preventDefault() auf, dann
# feuert am Handy kein click (Marker und Listenzeilen reagierten nicht).
# Karte, Liste und Details halten touchstart/-end/-cancel deshalb selbst an.
# Die Karte hat einen eigenen Stapelkontext (isolation: isolate), sonst liegen
# Leaflets Ebenen (z-index 400-1000) ueber dem Bubble-Popup.
#
# Popup-Kopf: Bubble zeigt keinen eigenen Kopf (show_header: false), weil
# Bubble "name" auf dem Server rendert, die Auswahl aber im Browser liegt.
# flug_detail rendert Flugnummer und Schliessen-Knopf selbst.
# Links: button-card verwirft auch click per preventDefault(); der
# FR24-Link oeffnet deshalb wie die url-Aktion von HA per window.open.
# Hoehe: FR24 liefert Druckhoehe in Fuss; Karte, Liste und Popup zeigen Meter,
# das Popup darunter Flugflaeche und Fuss.
#
# Update-sicher: window.__flugradar traegt eine VERSION; eine hoehere Version
# ersetzt nach einem Dashboard-Update das alte Objekt der offenen Seite.
#
# Voraussetzung: custom:button-card (v7.0.1), custom:bubble-card (v3.4.1),
#                card-mod, Integration Flightradar24 (alle via HACS).
# ============================================================================
button_card_templates:
  flug_daten:
    entity: sensor.flightradar24_current_in_area
    triggers_update:
    - sensor.flightradar24_current_in_area
    variables:
      fr: |
        [[[
          // VERSION bei jeder Aenderung an diesem Block erhoehen (siehe Kopf).
          const VERSION = 9, vorher = window.__flugradar;
          if (vorher && vorher.version === VERSION) { vorher.hass = hass; return vorher; }
          if (vorher) {
            if (vorher.subs) vorher.subs.clear();
            if (vorher.map) { try { vorher.map.remove(); } catch (e) { /* schon entfernt */ } }
          }
          const SENSOR = 'sensor.flightradar24_current_in_area';
          const LEAFLET_JS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          const LEAFLET_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
          const SANS = "-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif";
          const F = 'font-family:' + SANS + ';';
          const PLANE = 'M0,-7 L1.2,-2 L7,1.6 L7,3 L1.2,1.6 L0.9,4.8 L2.6,6.3 L2.6,7.3 L0,6.6 L-2.6,7.3 L-2.6,6.3 L-0.9,4.8 L-1.2,1.6 L-7,3 L-7,1.6 L-1.2,-2 Z';
          const fr = { version: VERSION, hass, F, SENSOR, PLANE, sel: null, subs: new Map(), map: null, mapEl: null, layer: null, laden: null };

          // ---------- Daten ----------
          fr.sensor = () => fr.hass && fr.hass.states ? fr.hass.states[SENSOR] : undefined;
          fr.flights = () => {
            const s = fr.sensor(), l = s && s.attributes ? s.attributes.flights : null;
            return Array.isArray(l) ? l.filter(f => f && f.latitude != null && f.longitude != null) : [];
          };
          fr.nachEntfernung = () => fr.flights().slice().sort((a, b) => (a.distance ?? 1e9) - (b.distance ?? 1e9));
          fr.home = () => {
            const z = fr.hass && fr.hass.states['zone.home'];
            if (z && z.attributes.latitude != null) return [z.attributes.latitude, z.attributes.longitude];
            return [fr.hass.config.latitude, fr.hass.config.longitude];
          };

          // ---------- Darstellung ----------
          fr.esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
          fr.id = f => String(f.id ?? '').replace(/[^A-Za-z0-9_-]/g, '');
          fr.de = n => Number(n).toLocaleString('de-DE');
          fr.hinweis = t => `<div style="${F}color:#6e7988;font-size:12.5px;padding:2px;white-space:normal;">${t}</div>`;
          fr.badge = (c, t, puls) => `<span style="${F}display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}26;border:1px solid ${c}47;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums;">${puls ? '<span class="pulse"></span>' : ''}${t}</span>`;
          fr.notfall = f => ['7500', '7600', '7700'].includes(String(f.squawk || ''));
          fr.sonder = f => f.aircraft_category === 'Helicopter'
            || /air force|army|navy|luftwaffe|bundeswehr|police|polizei|ambulan|rettung/i.test(f.airline || '');
          fr.farbe = f => fr.notfall(f) ? '#f0736a' : f.on_ground ? '#6e7988' : fr.sonder(f) ? '#b399d4'
            : fr.m(f) < 1500 ? '#e6b566' : fr.m(f) < 7500 ? '#77d4d0' : '#7fb3d5';
          fr.band = f => fr.notfall(f) ? 'Notfall ' + f.squawk : f.on_ground ? 'am Boden' : fr.sonder(f) ? 'Sonderflug'
            : fr.m(f) < 1500 ? 'tief' : fr.m(f) < 7500 ? 'Steig-/Sinkflug' : 'Reiseflug';
          // Hoehe in Metern (FR24 liefert Druckhoehe in Fuss), gerundet auf 10 m
          fr.m = f => (Number(f.altitude) || 0) * 0.3048;
          fr.meter = f => fr.de(Math.round(fr.m(f) / 10) * 10);
          fr.hoehe = f => f.on_ground ? 'am Boden' : fr.meter(f) + ' m';
          fr.cs = f => f.callsign || f.flight_number || f.aircraft_registration || '?';
          fr.ap = (f, art) => f['airport_' + art + '_code_iata'] || f['airport_' + art + '_code_icao'] || '';
          fr.route = f => {
            const o = fr.ap(f, 'origin'), d = fr.ap(f, 'destination');
            return o || d ? `${o || '?'} → ${d || '?'}` : 'Route unbekannt';
          };
          fr.peilung = f => {
            const [la, lo] = fr.home(), r = Math.PI / 180;
            const y = Math.sin((f.longitude - lo) * r) * Math.cos(f.latitude * r);
            const x = Math.cos(la * r) * Math.sin(f.latitude * r) - Math.sin(la * r) * Math.cos(f.latitude * r) * Math.cos((f.longitude - lo) * r);
            return (Math.atan2(y, x) / r + 360) % 360;
          };
          fr.himmel = d => ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8];
          fr.uhr = t => t ? new Date(t * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '–';
          fr.kachel = (k, v, u, unter) => `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:9px 11px;min-width:0;">
              <div style="font-size:11px;font-weight:600;color:#6e7988;">${k}</div>
              <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:#f2f5f8;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v}<span style="font-size:0.62em;color:#6e7988;font-weight:600;"> ${u}</span></div>
              ${unter ? `<div style="font-size:11px;font-weight:600;color:#6e7988;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${unter}</div>` : ''}</div>`;
          fr.titel = t => `<div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#6e7988;">${t}</div>`;

          // ---------- Grosskreis (P2 Reststrecke, P3 Ziellinie) ----------
          fr.winkel = (a, b) => {
            const r = Math.PI / 180, la1 = a[0] * r, la2 = b[0] * r;
            const h = Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
            return 2 * Math.asin(Math.min(1, Math.sqrt(h)));
          };
          fr.km = (a, b) => 6371.0088 * fr.winkel(a, b);
          fr.gcPunkt = (a, b, t) => {
            const r = Math.PI / 180, d = fr.winkel(a, b);
            if (d < 1e-9) return [a[0], a[1]];
            const A = Math.sin((1 - t) * d) / Math.sin(d), B = Math.sin(t * d) / Math.sin(d);
            const la1 = a[0] * r, lo1 = a[1] * r, la2 = b[0] * r, lo2 = b[1] * r;
            const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
            const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
            const z = A * Math.sin(la1) + B * Math.sin(la2);
            return [Math.atan2(z, Math.hypot(x, y)) / r, Math.atan2(y, x) / r];
          };
          fr.ziel = f => {
            const la = Number(f.airport_destination_latitude), lo = Number(f.airport_destination_longitude);
            return f.airport_destination_latitude != null && f.airport_destination_longitude != null && isFinite(la) && isFinite(lo) ? [la, lo] : null;
          };

          // ---------- Puenktlichkeit und Ankunft (P2) ----------
          // Abweichung der (geschaetzten oder echten) Ankunft vom Flugplan in Minuten
          fr.verspaetung = f => {
            const plan = f.time_scheduled_arrival, ist = f.time_real_arrival || f.time_estimated_arrival;
            return plan && ist ? Math.round((ist - plan) / 60) : null;
          };
          fr.chip = (c, t) => `<span style="display:inline-flex;align-items:center;color:${c};background:${c}1f;border:1px solid ${c}40;font-size:11px;font-weight:700;padding:1px 6px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;">${t}</span>`;
          fr.vChip = (f, kurz) => {
            const v = fr.verspaetung(f);
            if (v == null) return '';
            if (Math.abs(v) < 5) return kurz ? '' : fr.badge('#a6d49e', 'pünktlich', false);
            const c = v > 0 ? '#e6b566' : '#77d4d0';
            if (kurz) return fr.chip(c, (v > 0 ? '+' : '−') + Math.abs(v));
            return fr.badge(c, Math.abs(v) + (v > 0 ? ' min später' : ' min früher'), false);
          };
          fr.dauer = s => {
            const m = Math.max(0, Math.round(s / 60));
            return m >= 60 ? [Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'), 'min'] : [String(m), 'min'];
          };
          // Ortszeit am Ziel aus dem UTC-Offset des Flughafens (Sekunden)
          fr.ortszeit = (t, off) => new Date((t + off) * 1000).toISOString().substr(11, 5);
          fr.ortsUhr = (t, off) => off != null && off !== -new Date(t * 1000).getTimezoneOffset() * 60 ? fr.ortszeit(t, off) : null;
          fr.ankunft = f => {
            const plan = f.time_scheduled_arrival, ist = f.time_real_arrival, schaetz = f.time_estimated_arrival;
            const landung = ist || schaetz || plan;
            if (!landung) return '';
            const ziel = fr.ziel(f), stadt = f.airport_destination_city || fr.ap(f, 'destination');
            const ort = fr.ortsUhr(landung, f.airport_destination_timezone_offset);
            const unterL = plan && plan !== landung ? 'geplant ' + fr.uhr(plan) : (ist ? 'gelandet' : schaetz ? 'geschätzt' : 'laut Flugplan');
            const km = ziel && !f.on_ground ? fr.km([f.latitude, f.longitude], ziel) : null;
            const rest = !ist && !f.on_ground ? landung - Date.now() / 1000 : null;
            const kacheln = [fr.kachel(ist ? 'Gelandet' : 'Landung', fr.uhr(landung), 'Uhr', unterL)];
            if (rest != null && rest > 0) {
              const [v, u] = fr.dauer(rest);
              kacheln.push(fr.kachel('Restflugzeit', v, u, km != null ? 'noch ~' + fr.de(Math.round(km / 10) * 10) + ' km' : ''));
            } else if (km != null) {
              kacheln.push(fr.kachel('Reststrecke', '~' + fr.de(Math.round(km / 10) * 10), 'km', ''));
            }
            const zusatz = [ort ? `${ort} Ortszeit ${fr.esc(stadt)}` : '', f.airport_destination_terminal ? 'Terminal ' + fr.esc(f.airport_destination_terminal) : ''].filter(Boolean).join(' · ');
            return `<div style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">${fr.titel('Ankunft')}${fr.vChip(f, false)}</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;">${kacheln.join('')}</div>
                ${zusatz ? `<div style="font-size:12px;font-weight:600;color:#aeb8c6;">${zusatz}</div>` : ''}
              </div>`;
          };
          // ---------- Dienste ----------
          fr.dienst = (domain, service, data) => fr.hass.callService(domain, service, data).catch(e => console.warn('Flugradar:', e));

          // ---------- Bereiche, die sich bei Auswahl selbst neu zeichnen ----------
          fr.bereich = (el, key, render) => {
            if (el) {
              if (!fr.subs.has(el)) fr.subs.set(el, new Map());
              fr.subs.get(el).set(key, render);
            }
            let html;
            try { html = render(); } catch (e) { html = fr.hinweis('Fehler: ' + fr.esc(e.message)); }
            return `<div data-fr="${key}" style="width:100%;">${html}</div>`;
          };
          fr.neu = () => {
            fr.subs.forEach((s, el) => {
              if (!el.isConnected) return;
              s.forEach((render, key) => {
                const n = el.shadowRoot && el.shadowRoot.querySelector(`[data-fr="${key}"]`);
                if (n) { try { n.innerHTML = render(); } catch (e) { n.innerHTML = fr.hinweis('Fehler: ' + fr.esc(e.message)); } }
              });
            });
            fr.zeichne();
          };
          // button-card (Action-Handler auf ha-card) ruft bei touchend preventDefault() auf;
          // dann erzeugt der Browser keinen click. Touch-Ereignisse aus Karte, Liste und
          // Details deshalb dort anhalten (Leaflet selbst arbeitet mit Pointer-Events).
          fr.touchStopp = el => ['touchstart', 'touchend', 'touchcancel'].forEach(t => el.addEventListener(t, e => e.stopPropagation(), { passive: true }));
          fr.touchAttr = 'ontouchstart="event.stopPropagation()" ontouchend="event.stopPropagation()" ontouchcancel="event.stopPropagation()"';
          // Antippen wie Bubble Card es fuer seine eigenen Knoepfe macht (create.js:
          // click UND touchend): im Popup und in button-card kommt der vom Browser
          // erzeugte click am Handy nicht zuverlaessig an. touchend loest nur bei
          // einem echten Tipp aus (< 10 px Bewegung, < 800 ms), damit Scrollen nichts
          // auswaehlt; der folgende click wird dann ignoriert (kein Doppelausloesen).
          fr.tipp = (e, aktion) => {
            e.stopPropagation();
            if (e.type === 'touchstart') {
              const t = e.touches && e.touches[0];
              fr._tipp = t ? { x: t.clientX, y: t.clientY, z: Date.now() } : null;
              return;
            }
            if (e.type === 'touchend') {
              const t = e.changedTouches && e.changedTouches[0], st = fr._tipp;
              fr._tipp = null;
              if (!t || !st || Math.hypot(t.clientX - st.x, t.clientY - st.y) > 10 || Date.now() - st.z > 800) return;
              if (e.cancelable) e.preventDefault();
              fr._tippZeit = Date.now();
              if (aktion) aktion();
              return;
            }
            if (e.type === 'click') {
              e.preventDefault();
              if (Date.now() - (fr._tippZeit || 0) < 700) return;
              if (aktion) aktion();
            }
          };
          fr.tippAttr = js => `ontouchstart="window.__flugradar.tipp(event)" ontouchend="window.__flugradar.tipp(event,()=>{${js}})" onclick="window.__flugradar.tipp(event,()=>{${js}})"`;
          fr.waehle = id => {
            fr.sel = id;
            fr.neu();
            if (location.hash !== '#flug') {
              history.pushState(null, '', location.pathname + location.search + '#flug');
              window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } }));
            }
          };

          // ---------- Karte (K1) ----------
          const KARTE_CSS = `
            .fr-wrap{pointer-events:auto;position:relative;z-index:0;isolation:isolate;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#141b26;}
            .fr-wrap .leaflet-container{width:100%;height:100%;background:#141b26;font-family:${SANS};}
            .fr-wrap .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.8) contrast(.9) saturate(.4);}
            .fr-wrap .leaflet-bar{border:1px solid rgba(255,255,255,.08);box-shadow:none;border-radius:12px;overflow:hidden;}
            .fr-wrap .leaflet-bar a{background:#1b2231;color:#aeb8c6;border-bottom-color:rgba(255,255,255,.08);}
            .fr-wrap .leaflet-bar a:hover{background:#232c3d;color:#f2f5f8;}
            .fr-wrap .leaflet-control-attribution{background:rgba(16,21,29,.72);color:#6e7988;font-size:9.5px;border-radius:8px 0 0 0;}
            .fr-wrap .leaflet-control-attribution a{color:#8794a5;}
            .fr-ic{background:none;border:none;}
            .fr-ic .p{position:absolute;left:0;top:0;width:28px;height:28px;display:grid;place-items:center;}
            .fr-ic .l{position:absolute;left:27px;top:1px;white-space:nowrap;font:700 11px/1.15 ${SANS};color:#c3ccd8;text-shadow:0 1px 2px #000,0 0 6px #10151d;pointer-events:none;}
            .fr-ic .l small{display:block;font-weight:600;font-size:10px;color:#8794a5;}
            .fr-ic .l.re{text-align:right;}
            .fr-ic.sel .l{color:#f2f5f8;}
            .fr-ic .ring{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid #ff4696;box-sizing:border-box;}
            .fr-home{width:12px;height:12px;border-radius:50%;background:#10151d;border:2.5px solid #f2f5f8;box-sizing:border-box;}
            .fr-ziel{background:none;border:none;}
            .fr-ziel span{display:inline-block;white-space:nowrap;font:700 11px/20px ${SANS};padding:0 8px;border-radius:8px;background:rgba(16,21,29,.86);border:1px solid currentColor;font-variant-numeric:tabular-nums;}
          `;
          fr.leaflet = () => {
            if (window.L) return Promise.resolve(window.L);
            if (fr.laden) return fr.laden;
            fr.laden = new Promise((ok, fehler) => {
              let s = document.querySelector(`script[src="${LEAFLET_JS}"]`);
              if (!s) { s = document.createElement('script'); s.src = LEAFLET_JS; document.head.appendChild(s); }
              s.addEventListener('load', () => ok(window.L));
              s.addEventListener('error', () => { fr.laden = null; fehler(new Error('Leaflet konnte nicht geladen werden')); });
              setTimeout(() => { if (window.L) ok(window.L); }, 50);
            });
            return fr.laden;
          };
          fr.karte = (el, versuch = 0) => {
            const host = el && el.shadowRoot && el.shadowRoot.querySelector('[data-fr-host]');
            if (!host) { if (versuch < 20) setTimeout(() => fr.karte(el, versuch + 1), 100); return; }
            fr.leaflet().then(L => {
              if (!fr.mapEl) {
                fr.mapEl = document.createElement('div');
                fr.mapEl.className = 'fr-wrap';
                fr.mapEl.innerHTML = `<link rel="stylesheet" href="${LEAFLET_CSS}"><style>${KARTE_CSS}</style><div class="fr-map" style="width:100%;height:100%;"></div>`;
                fr.mapEl.querySelector('link').addEventListener('load', () => { if (fr.map) fr.map.invalidateSize(); });
                fr.touchStopp(fr.mapEl);
              }
              if (fr.mapEl.parentNode !== host) { host.innerHTML = ''; host.appendChild(fr.mapEl); }
              if (!fr.map) {
                const home = fr.home();
                fr.map = L.map(fr.mapEl.querySelector('.fr-map'), {
                  center: home, zoom: 8, scrollWheelZoom: false, dragging: !L.Browser.mobile, attributionControl: true
                });
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 15, referrerPolicy: 'strict-origin-when-cross-origin',
                  attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
                }).addTo(fr.map);
                [10, 25, 50].forEach(r => L.circle(home, { radius: r * 1000, color: '#7fb3d5', opacity: 0.3, weight: 1, dashArray: '3 6', fill: false, interactive: false }).addTo(fr.map));
                L.marker(home, { icon: L.divIcon({ className: '', html: '<div class="fr-home"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }), interactive: false, keyboard: false }).addTo(fr.map);
                fr.map.attributionControl.setPrefix('Leaflet');
                fr.layer = L.layerGroup().addTo(fr.map);
                fr.zielLayer = L.layerGroup().addTo(fr.map);
                // Beschriftungen haengen am Massstab und am sichtbaren Ausschnitt
                fr.map.on('moveend', () => fr.zeichne());
              }
              // Ausschnitt (50-km-Ring) erst setzen, wenn die Karte eine Groesse hat;
              // danach bleibt Zoom/Verschiebung des Nutzers erhalten.
              setTimeout(() => {
                try {
                  fr.map.invalidateSize();
                  if (!fr.gepasst && fr.mapEl.clientWidth > 0) { fr.map.fitBounds(L.latLng(fr.home()).toBounds(100000)); fr.gepasst = true; }
                } catch (e) { /* Karte gerade nicht sichtbar */ }
              }, 60);
              fr.zeichne();
            }).catch(e => { host.innerHTML = fr.hinweis('Karte nicht verfügbar: ' + fr.esc(e.message)); });
          };
          fr.zeichne = () => {
            if (!fr.map || !fr.layer || !window.L) return;
            const L = window.L, liste = fr.flights();
            fr.layer.clearLayers();
            liste.forEach(f => {
              if (!Array.isArray(f.coordinates) || f.coordinates.length < 2) return;
              const s = f.id === fr.sel;
              L.polyline(f.coordinates.concat([[f.latitude, f.longitude]]), {
                color: fr.farbe(f), weight: s ? 2.5 : 1.5, opacity: s ? 0.9 : 0.4, dashArray: s ? null : '2 6', interactive: false
              }).addTo(fr.layer);
            });
            const lage = fr.beschriftung(liste);
            liste.forEach(f => {
              const c = fr.farbe(f), s = f.id === fr.sel, b = lage.get(f.id);
              const html = (s ? '<span class="ring"></span>' : '')
                + `<span class="p"><svg viewBox="-8 -8 16 16" width="22" height="22"><path d="${PLANE}" fill="${c}" stroke="#10151d" stroke-width="0.6" transform="rotate(${Number(f.heading) || 0})"/></svg></span>`
                + (b ? `<span class="l${b.rechtsbuendig ? ' re' : ''}" style="left:${Math.round(14 + b.dx)}px;top:${Math.round(14 + b.dy)}px;">${fr.esc(fr.cs(f))}${b.kurz ? '' : `<small>${fr.hoehe(f)}</small>`}</span>` : '');
              const m = L.marker([f.latitude, f.longitude], {
                icon: L.divIcon({ className: 'fr-ic' + (s ? ' sel' : ''), html, iconSize: [28, 28], iconAnchor: [14, 14] }),
                zIndexOffset: s ? 1000 : 0, title: fr.cs(f)
              });
              m.on('click', () => fr.waehle(f.id));
              m.addTo(fr.layer);
            });
            fr.zeichneZiel();
          };
          // Beschriftungen ohne Ueberlappung: Rangfolge gewaehlter Flug, dann nach Entfernung.
          // Jede Beschriftung probiert 8 Lagen um ihr Flugzeug (rechts zuerst) und nimmt die
          // erste, die kein Flugzeug-Symbol, keine schon gesetzte Beschriftung und nicht den
          // Kartenrand trifft. Passt keine, folgt die Kurzform (nur Callsign), sonst entfaellt
          // sie; das Flugzeug bleibt antippbar. Der gewaehlte Flug ist immer beschriftet.
          fr.textBreite = (t, px, gewicht) => {
            const c = fr._messen || (fr._messen = document.createElement('canvas').getContext('2d'));
            c.font = `${gewicht} ${px}px ${SANS}`;
            return c.measureText(t).width;
          };
          fr.beschriftung = liste => {
            const lage = new Map(), sz = fr.map.getSize(), R = 4;
            const pt = f => fr.map.latLngToContainerPoint([f.latitude, f.longitude]);
            // Flugzeug-Symbole (22 px) sind belegt, Beschriftungen kommen hinzu
            const belegt = liste.map(f => { const p = pt(f); return { id: f.id, x1: p.x - 11, y1: p.y - 11, x2: p.x + 11, y2: p.y + 11 }; });
            const frei = (r, id) => r.x1 >= R && r.y1 >= R && r.x2 <= sz.x - R && r.y2 <= sz.y - R
              && belegt.every(o => o.id === id && !o.text || r.x2 <= o.x1 || r.x1 >= o.x2 || r.y2 <= o.y1 || r.y1 >= o.y2);
            const lagen = (w, h) => [[13, -13, 0], [-13 - w, -13, 1], [-w / 2, -13 - h, 0], [-w / 2, 13, 0],
              [10, -10 - h, 0], [10, 10, 0], [-10 - w, -10 - h, 1], [-10 - w, 10, 1]];
            liste.filter(f => f.id === fr.sel || (f.distance != null && f.distance < 25))
              .sort((a, b) => (b.id === fr.sel) - (a.id === fr.sel) || (a.distance ?? 1e9) - (b.distance ?? 1e9))
              .forEach(f => {
                const p = pt(f), wCs = fr.textBreite(fr.cs(f), 11, 700) + 2;
                const formen = [[Math.ceil(Math.max(wCs, fr.textBreite(fr.hoehe(f), 10, 600) + 2)), 25, false], [Math.ceil(wCs), 13, true]];
                for (const [w, h, kurz] of formen) {
                  for (const [dx, dy, rb] of lagen(w, h)) {
                    const r = { id: f.id, text: true, x1: p.x + dx, y1: p.y + dy, x2: p.x + dx + w, y2: p.y + dy + h };
                    if (frei(r, f.id)) { belegt.push(r); lage.set(f.id, { dx, dy, kurz, rechtsbuendig: !!rb }); return; }
                  }
                }
                if (f.id === fr.sel) lage.set(f.id, { dx: 13, dy: -13, kurz: false, rechtsbuendig: false });
              });
            return lage;
          };
          // P3: gestrichelter Grosskreis vom gewaehlten Flug zum Zielflughafen. Liegt das Ziel
          // ausserhalb des Ausschnitts, steht "SOF · 1.373 km" dort, wo die Linie den Rand verlaesst.
          fr.zeichneZiel = () => {
            if (!fr.map || !fr.zielLayer || !window.L) return;
            const L = window.L;
            fr.zielLayer.clearLayers();
            const f = fr.sel ? fr.flights().find(x => x.id === fr.sel) : null, ziel = f ? fr.ziel(f) : null;
            if (!f || !ziel || f.on_ground) return;
            const start = [f.latitude, f.longitude], km = fr.km(start, ziel);
            if (km < 1) return;
            const n = Math.min(256, Math.max(16, Math.ceil(km / 15)));
            const pts = [];
            for (let i = 0; i <= n; i++) {
              const p = fr.gcPunkt(start, ziel, i / n);
              // Laengengrad stetig halten (kein Sprung bei +-180 Grad)
              if (pts.length) { const v = pts[pts.length - 1][1]; while (p[1] - v > 180) p[1] -= 360; while (p[1] - v < -180) p[1] += 360; }
              pts.push(p);
            }
            const c = fr.farbe(f);
            L.polyline(pts, { color: c, weight: 2, opacity: 0.85, dashArray: '6 7', interactive: false }).addTo(fr.zielLayer);
            const b = fr.map.getBounds();
            let pos;
            if (b.contains(pts[n])) pos = L.latLng(pts[n]);
            else if (!b.contains(start)) return;
            else {
              // Randpunkt per Bisektion auf dem Grosskreis
              let lo = 0, hi = 1;
              for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (b.contains(fr.gcPunkt(start, ziel, m))) lo = m; else hi = m; }
              pos = L.latLng(fr.gcPunkt(start, ziel, lo));
            }
            const text = `${fr.esc(fr.ap(f, 'destination') || 'Ziel')} · ${fr.de(Math.round(km))} km`;
            const w = Math.round(text.length * 6.6 + 18), h = 22, sz = fr.map.getSize(), p = fr.map.latLngToContainerPoint(pos);
            const x = Math.min(Math.max(p.x - w / 2, 6), sz.x - w - 6);
            let y = Math.min(Math.max(p.y - h / 2, 6), sz.y - h - 22);
            // nicht ueber Flugzeug und dessen Beschriftung (rechts unterhalb, ca. 30 px) legen
            const fp = fr.map.latLngToContainerPoint(start);
            if (x < fp.x + 100 && x + w > fp.x - 16 && y < fp.y + 32 && y + h > fp.y - 16) {
              y = fp.y + 40 + h <= sz.y - 22 ? fp.y + 40 : Math.max(6, fp.y - 20 - h);
            }
            L.marker(fr.map.containerPointToLatLng([x, y]), {
              icon: L.divIcon({ className: 'fr-ziel', html: `<span style="color:${c};">${text}</span>`, iconSize: [w, h], iconAnchor: [0, 0] }),
              interactive: false, keyboard: false
            }).addTo(fr.zielLayer);
          };

          // ---------- Liste (E2) ----------
          fr.liste = () => {
            if (!fr.sensor()) return fr.hinweis(`${SENSOR} fehlt – ist die Integration Flightradar24 eingerichtet?`);
            const l = fr.nachEntfernung(), N = 12;
            if (!l.length) return fr.hinweis('Gerade kein Flugzeug im Bereich.');
            const zeilen = l.slice(0, N).map((f, i) => {
              const id = fr.id(f), c = fr.farbe(f), s = f.id === fr.sel;
              const rand = s ? 'background:rgba(127,179,213,0.1);border:1px solid rgba(127,179,213,0.26);'
                : 'border:1px solid transparent;' + (i ? 'border-top-color:rgba(255,255,255,0.045);' : '');
              const wer = [f.airline_short || f.airline, f.aircraft_code].filter(Boolean).map(fr.esc).join(' · ');
              return `<div role="button" tabindex="0" ${fr.tippAttr(`window.__flugradar.waehle('${id}')`)} onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__flugradar.waehle('${id}')}" style="display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer;${rand}">
                <span style="width:10px;height:10px;border-radius:4px;background:${c};"></span>
                <div style="min-width:0;">
                  <div style="font-size:13.5px;font-weight:700;color:#f2f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fr.esc(fr.cs(f))} <span style="color:#6e7988;font-weight:600;">${fr.esc(fr.route(f))}</span> ${fr.vChip(f, true)}</div>
                  <div style="font-size:12px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${wer || '–'}</div>
                </div>
                <div style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:#f2f5f8;white-space:nowrap;">${f.distance != null ? fr.de(Math.round(f.distance)) + ' km' : '–'}<span style="display:block;font-size:11px;color:#6e7988;font-weight:600;">${fr.hoehe(f)}</span></div>
              </div>`;
            }).join('');
            return `<div ${fr.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;">${zeilen}</div>`
              + (l.length > N ? fr.hinweis(`+ ${l.length - N} weitere auf der Karte`) : '');
          };

          // ---------- Details (D1) ----------
          // Eigener Kopf statt Bubble-Kopf: Bubble rendert "name" auf dem Server (Jinja),
          // die Auswahl lebt aber im Browser. Schliessen wie Bubble selbst (removeHash):
          // URL ohne Hash per replaceState, dann location-changed.
          fr.schliesse = () => {
            if (!location.hash) return;
            history.replaceState(history.state, '', location.href.split('#')[0]);
            // genau wie removeHash(true) in Bubble Card (helpers.js): Event mit
            // source 'bubble-popup-remove-hash'; Bubble raeumt dann auch den beim
            // Oeffnen angelegten Verlaufseintrag wieder ab.
            const ev = new Event('location-changed');
            ev.detail = { source: 'bubble-popup-remove-hash', direct: true };
            window.dispatchEvent(ev);
          };
          fr.detail = () => {
            if (!fr.sel) return fr.hinweis('Flugzeug in der Karte oder Liste antippen.');
            const f = fr.flights().find(x => x.id === fr.sel);
            if (!f) return fr.hinweis('Dieser Flug ist nicht mehr im Bereich.');
            const c = fr.farbe(f), o = fr.ap(f, 'origin'), d = fr.ap(f, 'destination');
            const ab = f.time_real_departure || f.time_scheduled_departure, an = f.time_estimated_arrival || f.time_scheduled_arrival;
            const anteil = ab && an && an > ab ? Math.min(1, Math.max(0, (Date.now() / 1000 - ab) / (an - ab))) : null;
            const foto = f.aircraft_photo_large || f.aircraft_photo_medium;
            const kachel = fr.kachel;
            const vs = Number(f.vertical_speed) || 0, steig = vs > 100 ? '↑ ' + fr.de(vs) : vs < -100 ? '↓ ' + fr.de(-vs) : '→ 0';
            const p = fr.peilung(f);
            const nummer = f.flight_number || f.callsign || f.aircraft_registration || '?';
            const kopfUnter = [f.callsign && f.callsign !== nummer ? f.callsign : '', f.airline_short || f.airline].filter(Boolean).map(fr.esc).join(' · ');
            const kopf = `<div style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 14px;align-items:center;">
                <div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:${c}1f;border:1px solid ${c}33;"><svg viewBox="-8 -8 16 16" width="24" height="24"><path d="${PLANE}" fill="${c}" transform="rotate(${Number(f.heading) || 0})"/></svg></div>
                <div style="min-width:0;"><div style="font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;color:#f2f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fr.esc(nummer)}</div><div style="font-size:12.5px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${kopfUnter || '–'}</div></div>
                <button type="button" aria-label="Schließen" ${fr.tippAttr('window.__flugradar.schliesse()')} style="width:40px;height:40px;padding:0;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#aeb8c6;display:grid;place-items:center;cursor:pointer;"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
              </div>`;
            const bild = foto ? `<div style="position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#1a2232;border:1px solid rgba(255,255,255,0.07);">
                <img src="${fr.esc(foto)}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.style.display='none'">
                <span style="position:absolute;left:10px;bottom:7px;font-size:10.5px;color:#f2f5f8;text-shadow:0 1px 3px #000;">Foto: JetPhotos</span></div>` : '';
            const strecke = o || d ? `<div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;">
                <div style="min-width:0;"><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#f2f5f8;">${fr.esc(o || '?')}</div><div style="font-size:11.5px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;">${fr.esc(f.airport_origin_city || '')}</div>${ab ? `<div style="font-size:12px;font-weight:700;color:#aeb8c6;">ab ${fr.uhr(ab)}</div>` : ''}</div>
                <div style="position:relative;height:3px;border-radius:3px;background:rgba(255,255,255,0.1);">${anteil != null ? `<div style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(anteil * 100)}%;border-radius:3px;background:${c};"></div><svg viewBox="-8 -8 16 16" width="16" height="16" style="position:absolute;top:50%;left:${Math.round(anteil * 100)}%;transform:translate(-50%,-50%);"><path d="${PLANE}" fill="${c}" transform="rotate(90)"/></svg>` : ''}</div>
                <div style="min-width:0;text-align:right;"><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#f2f5f8;">${fr.esc(d || '?')}</div><div style="font-size:11.5px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;margin-left:auto;">${fr.esc(f.airport_destination_city || '')}</div>${an ? `<div style="font-size:12px;font-weight:700;color:#aeb8c6;">an ${fr.uhr(an)}</div>` : ''}</div>
              </div>` : `<span style="display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;color:#8794a5;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);">Route unbekannt</span>`;
            const geraet = [f.aircraft_model || f.aircraft_code, f.aircraft_registration].filter(Boolean).map(fr.esc).join(' · ');
            const extra = ['Kurs ' + (Number(f.heading) || 0) + '°', f.squawk ? 'Squawk ' + fr.esc(f.squawk) : '',
              f.closest_distance != null ? 'am nächsten ' + fr.de(Math.round(f.closest_distance * 10) / 10) + ' km' : ''].filter(Boolean).join(' · ');
            const hoehe = f.on_ground ? kachel('Höhe', 'am Boden', '', '')
              : kachel('Höhe', fr.meter(f), 'm', (f.altitude >= 10000 ? 'FL' + Math.round(f.altitude / 100) + ' · ' : '') + fr.de(f.altitude || 0) + ' ft');
            // Link wie die url-Aktion von HA per window.open (funktioniert auch in der App);
            // ein normaler <a>-Klick wird vom Action-Handler von button-card per preventDefault() verworfen.
            const link = `https://www.flightradar24.com/${encodeURIComponent(f.callsign || f.flight_number || '')}/${encodeURIComponent(f.id || '')}`;
            return `<div ${fr.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;gap:12px;">
              ${kopf}
              ${bild}
              <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;">
                <div style="min-width:0;font-size:13px;font-weight:600;color:#aeb8c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${geraet || '–'}</div>
                ${fr.badge(c, fr.band(f), false)}
              </div>
              ${strecke}
              ${fr.ankunft(f)}
              ${fr.titel('Jetzt')}
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;">
                ${hoehe}
                ${kachel('Speed', fr.de(Math.round((Number(f.ground_speed) || 0) * 1.852)), 'km/h', fr.de(Number(f.ground_speed) || 0) + ' kn')}
                ${kachel('Steigen', steig, 'ft/min', '')}
                ${kachel('Entfernung', f.distance != null ? fr.de(Math.round(f.distance * 10) / 10) : '–', 'km ' + fr.himmel(p), '')}
              </div>
              <div style="font-size:12px;color:#6e7988;">${extra}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="${link}" target="_blank" rel="noopener" ${fr.tippAttr('window.open(this.href)')} style="font-size:12.5px;font-weight:700;color:#7fb3d5;text-decoration:none;padding:8px 12px;border-radius:12px;background:rgba(127,179,213,0.08);border:1px solid rgba(127,179,213,0.18);">Auf Flightradar24 öffnen</a>
              </div>
            </div>`;
          };

          // ---------- Umschalter und Schalter (P5, P8) ----------
          fr.zustand = id => fr.hass && fr.hass.states[id] ? fr.hass.states[id].state : undefined;
          fr.segment = (eid, optionen) => {
            const ist = fr.zustand(eid);
            const knopf = o => {
              const an = o === ist;
              return `<button type="button" aria-pressed="${an}" ${fr.tippAttr(`window.__flugradar.dienst('input_select','select_option',{entity_id:'${eid}',option:'${o}'})`)} style="${F}font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;color:${an ? '#7fb3d5' : '#8794a5'};background:${an ? 'rgba(127,179,213,0.16)' : 'transparent'};border:1px solid ${an ? 'rgba(127,179,213,0.34)' : 'transparent'};">${fr.esc(o)}</button>`;
            };
            return `<div ${fr.touchAttr} style="pointer-events:auto;display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);">${optionen.map(knopf).join('')}</div>`;
          };
          fr.schalter = (eid, titel, text, hinweis) => {
            const an = fr.zustand(eid) === 'on';
            return `<div role="switch" tabindex="0" aria-checked="${an}" ${fr.tippAttr(`window.__flugradar.dienst('input_boolean','toggle',{entity_id:'${eid}'})`)} onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__flugradar.dienst('input_boolean','toggle',{entity_id:'${eid}'})}" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 2px;cursor:pointer;border-top:1px solid rgba(255,255,255,0.045);">
                <div style="min-width:0;">
                  <div style="font-size:13.5px;font-weight:700;color:${an ? '#f2f5f8' : '#aeb8c6'};">${titel}</div>
                  <div style="font-size:12px;color:#6e7988;">${text}</div>
                  ${hinweis ? `<div style="font-size:11.5px;font-weight:600;color:#e6b566;margin-top:2px;">${hinweis}</div>` : ''}
                </div>
                <span style="position:relative;width:42px;height:24px;border-radius:12px;flex:none;background:${an ? 'rgba(127,179,213,0.45)' : 'rgba(255,255,255,0.1)'};border:1px solid ${an ? 'rgba(127,179,213,0.6)' : 'rgba(255,255,255,0.08)'};">
                  <span style="position:absolute;top:2px;left:${an ? 20 : 2}px;width:18px;height:18px;border-radius:50%;background:${an ? '#f2f5f8' : '#8794a5'};"></span>
                </span>
              </div>`;
          };
          fr.MELDUNGEN = [
            ['input_boolean.flug_meldung_tief', 'Tief und nah', 'unter 1.500 m und unter 5 km'],
            ['input_boolean.flug_meldung_sonderflug', 'Sonderflüge', 'Hubschrauber, Militär, Polizei, Rettung unter 15 km'],
            ['input_boolean.flug_meldung_selten', 'Seltene Typen', 'z. B. B748, A388, A124, C17, A400 beim Eintritt'],
            ['input_boolean.flug_meldung_notfall', 'Notfall-Squawk', '7500 / 7600 / 7700'],
            ['input_boolean.flug_meldung_verfolgt', 'Verfolgte Flüge', 'Start, Landung, am Gate']
          ];
          fr.meldungenAn = () => fr.MELDUNGEN.filter(([e]) => fr.zustand(e) === 'on').length;
          fr.meldungen = () => {
            // Squawk liefert die Integration nur mit FR24-Login; ohne Login ist er bei allen Fluegen leer
            const l = fr.flights(), ohneSquawk = l.length > 0 && l.every(f => !f.squawk);
            const zeilen = fr.MELDUNGEN.map(([e, t, x]) => fr.zustand(e) === undefined
              ? fr.hinweis(`${e} fehlt`)
              : fr.schalter(e, t, x, e.endsWith('_notfall') && ohneSquawk ? 'braucht FR24-Login (Squawk derzeit leer)' : '')).join('');
            return `<div ${fr.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;">${zeilen}</div>`;
          };

          // ---------- Tageszaehler und naechster Ueberflug (P6, P7) ----------
          fr.zahl = id => { const v = parseFloat(fr.zustand(id)); return isNaN(v) ? '–' : fr.de(v); };
          fr.bestwert = () => {
            const s = fr.zustand('input_text.flug_bestwert');
            if (!s || s[0] !== '{') return null;
            try { return JSON.parse(s); } catch (e) { return null; }
          };
          fr.heute = () => {
            const k = (t, id, unter) => fr.kachel(t, fr.zahl(id), '', unter);
            const zaehler = `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">
                ${k('Flüge', 'counter.flug_heute', 'im Bereich')}
                ${k('Nachts', 'counter.flug_nachts', '22–6 Uhr')}
                ${k('Unter 3 km', 'counter.flug_nah', 'geringster Abstand')}
                ${k('Unter 1.500 m', 'counter.flug_tief', 'in der Luft')}
              </div>`;
            const b = fr.bestwert();
            let naechst;
            if (!b) naechst = fr.hinweis('Heute noch kein Überflug erfasst.');
            else {
              const jetzt = fr.flights().find(f => f.id === b.id);
              const route = b.o || b.d ? `${fr.esc(b.oc || b.o || '?')} → ${fr.esc(b.dc || b.d || '?')}` : 'Route unbekannt';
              const nummer = b.fn || b.cs || '?';
              const kopf = `<div ${jetzt ? fr.tippAttr(`window.__flugradar.waehle('${fr.id(b)}')`) + ' role="button" tabindex="0"' : ''} style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;${jetzt ? 'cursor:pointer;' : ''}">
                  <div style="min-width:0;">
                    <div style="font-size:14px;font-weight:700;color:#f2f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fr.esc(nummer)}${b.cs && b.cs !== nummer ? ` <span style="color:#6e7988;font-weight:600;">${fr.esc(b.cs)}</span>` : ''} · ${fr.esc(b.al || '')}</div>
                    <div style="font-size:12px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${route}${b.t ? ' · ' + fr.esc(b.t) : ''}${jetzt ? ' · <span style="color:#7fb3d5;font-weight:700;">jetzt im Bereich ›</span>' : ''}</div>
                  </div>
                  <div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#f2f5f8;font-variant-numeric:tabular-nums;white-space:nowrap;">${fr.de(b.k)}<span style="font-size:0.55em;color:#6e7988;font-weight:600;"> km</span></div>
                </div>`;
              naechst = `${kopf}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
                  ${fr.kachel('Abstand', fr.de(b.k), 'km', '')}
                  ${fr.kachel('Höhe', fr.de(b.m), 'm', '')}
                  ${fr.kachel('Zeit', fr.uhr(b.z), 'Uhr', '')}
                </div>`;
            }
            return `<div ${fr.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;gap:10px;">
                ${zaehler}
                ${fr.titel('Nächster Überflug heute')}
                ${naechst}
              </div>`;
          };

          // ---------- Flug verfolgen (P10) ----------
          const VERFOLGT = 'sensor.flightradar24_additional_tracked';
          fr.verfolgt = () => {
            const s = fr.hass && fr.hass.states[VERFOLGT], l = s && s.attributes ? s.attributes.flights : null;
            return Array.isArray(l) ? l : [];
          };
          fr.kennung = f => f.flight_number || f.callsign || f.aircraft_registration || '';
          fr.status = f => f.tracked_type === 'schedule' ? ['#8794a5', 'geplant']
            : f.time_real_arrival || f.has_landed ? ['#a6d49e', 'gelandet']
            : f.on_ground ? ['#6e7988', 'am Boden']
            : f.latitude != null ? ['#7fb3d5', 'in der Luft'] : ['#8794a5', 'gesucht'];
          fr.verfolgtListe = () => {
            if (!fr.hass || !fr.hass.states[VERFOLGT]) return fr.hinweis(`${VERFOLGT} fehlt – ist die Integration Flightradar24 eingerichtet?`);
            const l = fr.verfolgt();
            if (!l.length) return fr.hinweis('Kein Flug in Verfolgung. Zum Beispiel einen Flug von Familie oder Freunden eintragen; Meldung bei Start, Landung und am Gate.');
            return `<div ${fr.touchAttr} style="${F}pointer-events:auto;white-space:normal;display:flex;flex-direction:column;gap:8px;">` + l.map(f => {
              const [c, t] = fr.status(f), nr = fr.kennung(f), o = fr.ap(f, 'origin'), d = fr.ap(f, 'destination');
              const ab = f.time_real_departure || f.time_estimated_departure || f.time_scheduled_departure;
              const an = f.time_real_arrival || f.time_estimated_arrival || f.time_scheduled_arrival;
              const ort = an ? fr.ortsUhr(an, f.airport_destination_timezone_offset) : null;
              const wer = [f.airline_short || f.airline, f.aircraft_code, f.aircraft_registration].filter(Boolean).map(fr.esc).join(' · ');
              const zeiten = o || d ? `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-variant-numeric:tabular-nums;">
                  <div style="min-width:0;"><span style="font-size:16px;font-weight:700;color:#f2f5f8;">${fr.esc(o || '?')}</span> <span style="font-size:12px;font-weight:700;color:#aeb8c6;">${ab ? 'ab ' + fr.uhr(ab) : ''}</span></div>
                  <svg viewBox="-8 -8 16 16" width="14" height="14"><path d="${PLANE}" fill="${c}" transform="rotate(90)"/></svg>
                  <div style="min-width:0;text-align:right;"><span style="font-size:12px;font-weight:700;color:#aeb8c6;">${an ? 'an ' + fr.uhr(an) : ''}</span> <span style="font-size:16px;font-weight:700;color:#f2f5f8;">${fr.esc(d || '?')}</span>${ort ? `<div style="font-size:11px;color:#6e7988;">${ort} Ortszeit</div>` : ''}</div>
                </div>` : '';
              return `<div style="display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);">
                  <div style="display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;">
                    <div style="min-width:0;">
                      <div style="font-size:14px;font-weight:700;color:#f2f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fr.esc(nr || '?')} ${fr.vChip(f, true)}</div>
                      <div style="font-size:12px;color:#6e7988;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${wer || (f.airport_origin_city || f.airport_destination_city ? fr.esc(f.airport_origin_city || '?') + ' → ' + fr.esc(f.airport_destination_city || '?') : '–')}</div>
                    </div>
                    ${fr.chip(c, t)}
                    <button type="button" aria-label="Nicht mehr verfolgen" ${fr.tippAttr(`window.__flugradar.entferne('${fr.esc(nr).replace(/[^A-Za-z0-9-]/g, '')}')`)} style="width:32px;height:32px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#aeb8c6;display:grid;place-items:center;cursor:pointer;"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                  </div>
                  ${zeiten}
                </div>`;
            }).join('') + '</div>';
          };
          // Eingabe: konstantes HTML (siehe Kopf), damit Text und Fokus Neuzeichnen ueberstehen
          fr.EINGABE = `<div data-fr-eingabe ${fr.touchAttr} style="${F}pointer-events:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;">
              <input type="text" placeholder="LH400 / DLH400 / D-AIXP" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="12"
                onkeydown="event.stopPropagation();if(event.key==='Enter'){event.preventDefault();window.__flugradar.verfolge(this)}" onkeyup="event.stopPropagation()" onkeypress="event.stopPropagation()"
                style="${F}min-width:0;font-size:16px;font-weight:600;color:#f2f5f8;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:9px 12px;outline:none;text-transform:uppercase;">
              <button type="button" ${fr.tippAttr('window.__flugradar.verfolge(this)')} style="${F}font-size:13px;font-weight:700;color:#7fb3d5;background:rgba(127,179,213,0.12);border:1px solid rgba(127,179,213,0.3);border-radius:12px;padding:0 14px;cursor:pointer;">Verfolgen</button>
              <div data-fr-status style="grid-column:1/-1;white-space:normal;font-size:12px;color:#6e7988;min-height:16px;"></div>
            </div>`;
          fr.gefunden = v => fr.verfolgt().some(f => [f.flight_number, f.callsign, f.aircraft_registration].some(x => x && String(x).toUpperCase() === v));
          fr.verfolge = el => {
            const box = el.closest('[data-fr-eingabe]'), inp = box.querySelector('input'), st = box.querySelector('[data-fr-status]');
            const v = (inp.value || '').trim().toUpperCase().replace(/\s+/g, '');
            const melde = (c, t) => { st.style.color = c; st.textContent = t; };
            if (!/^[A-Z0-9-]{2,12}$/.test(v)) { melde('#e6b566', 'Flugnummer, Callsign oder Kennzeichen eingeben (z. B. LH400).'); inp.focus(); return; }
            if (fr.gefunden(v)) { melde('#8794a5', v + ' wird schon verfolgt.'); return; }
            melde('#8794a5', 'Suche ' + v + ' …');
            // Die Integration sucht innerhalb von text.set_value; der Sensor ist danach aktualisiert,
            // im Browser kommt der neue Zustand aber erst kurz darauf an.
            fr.hass.callService('text', 'set_value', { entity_id: 'text.flightradar24_add_to_track', value: v }).then(() => {
              let n = 0;
              const pruefe = () => {
                if (fr.gefunden(v)) { melde('#a6d49e', v + ' wird verfolgt.'); inp.value = ''; return; }
                if (++n < 8) { setTimeout(pruefe, 500); return; }
                melde('#e6b566', 'Kein Flug „' + v + '“ gefunden. Flugnummer (LH400), Callsign (DLH400) oder Kennzeichen (D-AIXP) prüfen.');
              };
              setTimeout(pruefe, 300);
            }).catch(e => melde('#f0736a', 'Fehler: ' + (e && e.message ? e.message : e)));
          };
          fr.entferne = nr => { if (nr) fr.dienst('text', 'set_value', { entity_id: 'text.flightradar24_remove_from_track', value: nr }); };

          window.__flugradar = fr;
          return fr;
        ]]]
    extra_styles: |
      .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: fr-pulse 1.6s ease-in-out infinite; }
      @keyframes fr-pulse { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  # --------------------------------------------------------------------------
  # Kopfzeile wie fussball_kopf / gesundheit-view.yaml
  # --------------------------------------------------------------------------
  flug_kopf:
    template: flug_daten
    show_icon: true
    show_name: true
    show_label: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      icon:
      - width: 23px
      - height: 23px
      - color: '#7fb3d5'
      name:
      - justify-self: start
      - align-self: end
      - font-size: 17px
      - font-weight: 700
      - letter-spacing: -0.02em
      - color: '#f2f5f8'
      - max-width: 100%
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 2px 2px 6px
      - cursor: default
      custom_fields:
        # Unterzeile darf umbrechen (button-card setzt sonst nowrap); mit
        # minmax(0, 1fr) unten schiebt sie sich nicht mehr unter das Badge.
        unter:
        - justify-self: start
        - align-self: start
        - font-size: 12.5px
        - line-height: 1.35
        - color: '#6e7988'
        - margin-top: 1px
        - text-align: left
        - white-space: normal
        - max-width: 100%
        badge:
        - justify-self: end
        - align-self: center
        - margin-left: 10px
      grid:
      - grid-template-areas: '"i n badge" "i unter badge"'
      - grid-template-columns: min-content minmax(0, 1fr) min-content
      - grid-template-rows: min-content min-content
      img_cell:
      - width: 44px
      - height: 44px
      - border-radius: 13px
      - margin-right: 14px
      - align-self: center
      - background: rgba(127, 179, 213, 0.12)
      - border: 1px solid rgba(127, 179, 213, 0.2)

  flug_inhalt:
    template: flug_daten
    show_icon: false
    show_name: false
    show_label: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 0
      - cursor: default
      custom_fields:
        inhalt:
        - width: 100%
      grid:
      - grid-template-areas: '"inhalt"'

  # ======================= Karte (K1) =======================
  flug_karte_kopf:
    template: flug_kopf
    icon: mdi:airplane
    name: Luftraum
    custom_fields:
      unter: |
        [[[
          const fr = variables.fr, l = fr.flights();
          if (!fr.sensor()) return 'Integration Flightradar24 fehlt';
          const nah = l.filter(f => f.distance != null && f.distance < 25).length;
          const tief = l.filter(f => !f.on_ground).sort((a, b) => a.altitude - b.altitude)[0];
          // Teile einzeln umbruchfrei; umgebrochen wird nur an " · "
          const teil = t => `<span style="white-space:nowrap;">${t}</span>`;
          return teil(`${nah} unter 25 km`) + (tief ? ' · ' + teil(`tiefster ${fr.esc(fr.cs(tief))} ${fr.hoehe(tief)}`) : '');
        ]]]
      badge: |
        [[[
          const fr = variables.fr, n = fr.flights().length;
          return fr.badge('#7fb3d5', n === 1 ? '1 Flug' : n + ' Flüge', n > 0);
        ]]]

  flug_karte:
    template: flug_inhalt
    custom_fields:
      inhalt: |
        [[[
          const fr = variables.fr, el = this;
          setTimeout(() => fr.karte(el), 0);
          const leg = [['#e6b566', 'unter 1.500 m'], ['#77d4d0', '1.500–7.500 m'], ['#7fb3d5', 'Reiseflug'], ['#b399d4', 'Sonderflug'], ['#6e7988', 'am Boden']]
            .map(([c, t]) => `<span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:8px;height:8px;border-radius:3px;background:${c};display:inline-block;"></i>${t}</span>`).join('');
          return `<div data-fr-host style="width:100%;height:380px;border-radius:16px;border:1px solid rgba(255,255,255,0.07);background:#141b26;overflow:hidden;"></div>`
            + `<div style="${fr.F}display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:#8794a5;margin-top:10px;">${leg}</div>`;
        ]]]

  # ======================= Liste (E2) =======================
  flug_liste_kopf:
    template: flug_kopf
    icon: mdi:format-list-bulleted
    name: Jetzt über uns
    custom_fields:
      unter: nach Entfernung
      badge: |
        [[[
          const fr = variables.fr;
          return fr.badge('#8794a5', String(fr.flights().length), false);
        ]]]

  flug_liste:
    template: flug_inhalt
    custom_fields:
      inhalt: |
        [[[
          const fr = variables.fr;
          return fr.bereich(this, 'liste', () => fr.liste());
        ]]]

  # ======================= Details (D1, Inhalt des Popups #flug) =======================
  flug_detail:
    template: flug_inhalt
    styles:
      card:
      - padding: 2px 2px 8px
    custom_fields:
      inhalt: |
        [[[
          const fr = variables.fr;
          return fr.bereich(this, 'detail', () => fr.detail());
        ]]]

  # ======================= Verkehr (P5, Kopf mit Umschalter 24 h / 7 Tage) =======================
  # Die Diagramme selbst stehen in flugradar-view.yaml (apexcharts-card mit data_generator).
  flug_verkehr_kopf:
    template: flug_kopf
    icon: mdi:chart-areaspline
    name: Verkehr
    triggers_update:
    - sensor.flightradar24_current_in_area
    - input_select.flug_verkehr_zeitraum
    custom_fields:
      unter: |
        [[[
          return variables.fr.zustand('input_select.flug_verkehr_zeitraum') === '7 Tage'
            ? 'Ø Flüge je Stunde' : 'Ø Flüge je 15 min';
        ]]]
      badge: |
        [[[ return variables.fr.segment('input_select.flug_verkehr_zeitraum', ['24 h', '7 Tage']); ]]]

  # ======================= Heute (P6 Tageszaehler, P7 naechster Ueberflug) =======================
  flug_heute_kopf:
    template: flug_kopf
    icon: mdi:counter
    name: Heute
    triggers_update:
    - counter.flug_heute
    custom_fields:
      unter: seit 0:00 Uhr
      badge: |
        [[[
          const fr = variables.fr, n = parseFloat(fr.zustand('counter.flug_heute'));
          return isNaN(n) ? '' : fr.badge('#7fb3d5', fr.de(n) + (n === 1 ? ' Flug' : ' Flüge'), false);
        ]]]

  flug_heute:
    template: flug_inhalt
    triggers_update:
    - sensor.flightradar24_current_in_area
    - counter.flug_heute
    - counter.flug_nachts
    - counter.flug_nah
    - counter.flug_tief
    - input_text.flug_bestwert
    custom_fields:
      inhalt: |
        [[[ return variables.fr.heute(); ]]]

  # ======================= Meldungen (P8) =======================
  flug_meldungen_kopf:
    template: flug_kopf
    icon: mdi:bell-ring-outline
    name: Meldungen
    triggers_update:
    - input_boolean.flug_meldung_tief
    - input_boolean.flug_meldung_sonderflug
    - input_boolean.flug_meldung_selten
    - input_boolean.flug_meldung_notfall
    - input_boolean.flug_meldung_verfolgt
    custom_fields:
      unter: aufs iPhone, mit Foto
      badge: |
        [[[
          const fr = variables.fr, n = fr.meldungenAn();
          return fr.badge(n ? '#7fb3d5' : '#8794a5', `${n} von ${fr.MELDUNGEN.length} an`, false);
        ]]]

  flug_meldungen:
    template: flug_inhalt
    triggers_update:
    - sensor.flightradar24_current_in_area
    - input_boolean.flug_meldung_tief
    - input_boolean.flug_meldung_sonderflug
    - input_boolean.flug_meldung_selten
    - input_boolean.flug_meldung_notfall
    - input_boolean.flug_meldung_verfolgt
    custom_fields:
      inhalt: |
        [[[ return variables.fr.meldungen(); ]]]

  # ======================= Flug verfolgen (P10) =======================
  flug_verfolgen_kopf:
    template: flug_kopf
    icon: mdi:airplane-search
    name: Flug verfolgen
    triggers_update:
    - sensor.flightradar24_additional_tracked
    custom_fields:
      unter: Flugnummer, Callsign oder Kennzeichen
      badge: |
        [[[
          const fr = variables.fr, n = fr.verfolgt().length;
          return n ? fr.badge('#7fb3d5', String(n), false) : '';
        ]]]

  # Zwei Felder: "liste" wird neu gezeichnet, "eingabe" ist konstant (fr.EINGABE), damit
  # Text und Fokus im Eingabefeld eine Aktualisierung ueberstehen (lit uebernimmt das DOM
  # unveraendert, wenn unsafeHTML denselben String bekommt).
  # Eigenes Raster statt flug_inhalt (dessen Feld "inhalt" laesst sich nicht entfernen).
  flug_verfolgen:
    template: flug_daten
    show_icon: false
    show_name: false
    show_label: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
    - sensor.flightradar24_additional_tracked
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 0
      - cursor: default
      custom_fields:
        liste:
        - width: 100%
        eingabe:
        - width: 100%
      grid:
      - grid-template-areas: '"liste" "eingabe"'
      - row-gap: 12px
    custom_fields:
      liste: |
        [[[ return variables.fr.verfolgtListe(); ]]]
      eingabe: |
        [[[ return variables.fr.EINGABE; ]]]
