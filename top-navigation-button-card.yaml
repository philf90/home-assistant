# Top-Navigation (Launcher-Raster) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte.
#
# 10 Kacheln in zwei Reihen als custom:button-card: rundlich-quadratische
# Icon-Kachel (dezent in der Sektionsfarbe getoent) + Label. Farbe pro Kachel
# ueber variables.accent; die styles-Bloecke werden per YAML-Anker geteilt.
#
# Voraussetzung: custom:button-card (HACS) + die genutzten Icon-Sets
# (bi, fa6-solid, phu, flat-ui) wie bisher.
type: vertical-stack
cards:
  # ---------- Reihe 1: mit Beschriftung ----------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        variables: { accent: '#7fb3d5' }
        icon: mdi:home-assistant
        name: Home
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/home }
        styles: &tile_labeled
          card:
            - padding: 12px 6px 11px
            - border-radius: 18px
            - background: rgba(255, 255, 255, 0.03)
            - border: 1px solid rgba(255, 255, 255, 0.06)
            - box-shadow: none
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: min-content min-content
            - justify-items: center
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-bottom: 8px
            - background: |
                [[[ return variables.accent + '22'; ]]]
            - border: |
                [[[ return '1px solid ' + variables.accent + '44'; ]]]
          icon:
            - width: 24px
            - height: 24px
            - color: |
                [[[ return variables.accent; ]]]
          name:
            - font-size: 12px
            - font-weight: 600
            - color: '#f2f5f8'
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
            - max-width: 100%
      - type: custom:button-card
        variables: { accent: '#e6b566' }
        icon: bi:house-gear
        name: Lichter
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/lichter-fenster-temp }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: '#77d4d0' }
        icon: fa6-solid:plug-circle-bolt
        name: Verbrauch
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/energie }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: '#79b8c9' }
        icon: phu:thermostat-v2
        name: Heizung
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/heizung }
        styles: *tile_labeled
      - type: custom:button-card
        variables: { accent: '#b399d4' }
        icon: mdi:washing-machine
        name: Geräte
        show_icon: true
        show_name: true
        tap_action: { action: navigate, navigation_path: /dashboard-home/hausgerate }
        styles: *tile_labeled
  # ---------- Reihe 2: nur Icons ----------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        variables: { accent: '#f0736a' }
        icon: mdi:cctv
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/kamera }
        styles: &tile_icononly
          card:
            - padding: 12px 6px
            - border-radius: 18px
            - background: rgba(255, 255, 255, 0.03)
            - border: 1px solid rgba(255, 255, 255, 0.06)
            - box-shadow: none
          grid:
            - grid-template-areas: '"i"'
            - justify-items: center
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - background: |
                [[[ return variables.accent + '22'; ]]]
            - border: |
                [[[ return '1px solid ' + variables.accent + '44'; ]]]
          icon:
            - width: 24px
            - height: 24px
            - color: |
                [[[ return variables.accent; ]]]
      - type: custom:button-card
        variables: { accent: '#9ccc5a' }
        icon: phu:garden
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/garten }
        styles: *tile_icononly
      - type: custom:button-card
        variables: { accent: '#a6d49e' }
        icon: mdi:flower
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/pflanzen }
        styles: *tile_icononly
      - type: custom:button-card
        variables: { accent: '#cdd6e0' }
        icon: flat-ui:weather
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/wetter }
        styles: *tile_icononly
      - type: custom:button-card
        variables: { accent: '#8794a5' }
        icon: mdi:car
        show_icon: true
        show_name: false
        tap_action: { action: navigate, navigation_path: /dashboard-home/auto }
        styles: *tile_icononly
