# UniFi-Netzplan – Owlet-Karte (Prototyp)
#
# Zeichnet die Topologie des UniFi-Netzes als Baum: Internetleitungen →
# Gateway → Switches → Access Points → Clients. Die Struktur kommt live aus
# der UniFi-Network-Integration, neue oder ausgefallene Geräte erscheinen ohne
# Pflege dieser Datei.
#
# Was automatisch kommt und was konfiguriert werden muss:
#   automatisch   Gerät → Uplink-Gerät (Sensor "Uplink-MAC"), Funk-Mesh
#                 (Uplink zeigt auf einen AP), WLAN-Client → AP (ap_mac),
#                 Zustand, Client-Zähler je Gerät
#   wan:          Internetleitungen. Die Integration liefert keine WAN-Topologie.
#   pins:         Kabel-Clients mit bekanntem Switch. Den Switch-Port eines
#                 Kabel-Clients gibt die Integration nicht weiter; ohne pins
#                 landen sie im Sammelknoten "Kabel-Clients".
#   inactive:     Geräte, die bewusst getrennt sind (grau statt Störung).
#   labels:       Anzeigenamen, z. B. für Geräte mit Sonderrolle.
#
# Klick auf ein Gerät oder einen Client öffnet den Mehr-Info-Dialog. Klick auf
# die WLAN-Zahl eines APs bzw. auf den Sammelknoten klappt die Clients auf.
#
# ┌────────────── ENTITÄTEN PRÜFEN ───────────────────────────────────────────┐
# │ Die device_tracker unter wan, pins, inactive und labels sind an die        │
# │ eigene Instanz gebunden. Für die Zähler an Switches den standardmäßig      │
# │ deaktivierten Sensor "Clients" des Switches aktivieren, für den Status     │
# │ der Leitungen die WAN-Latenz-Sensoren des Gateways.                        │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Voraussetzung: unifi-netzplan-card.js als Dashboard-Ressource
#   1. Datei nach /config/www/unifi-netzplan-card.js kopieren
#   2. Einstellungen → Dashboards → Ressourcen → URL /local/unifi-netzplan-card.js,
#      Typ "JavaScript-Modul"
# Keine HACS-Karte nötig; ha-card und ha-icon stellt Home Assistant bereit.
type: custom:unifi-netzplan-card
title: Netzplan
wan:
  # Reihenfolge = Anzeige. primary markiert die Leitung, über die der Verkehr
  # per Regel läuft; die andere erscheint gestrichelt als Reserve.
  - name: Deutsche Glasfaser
    detail: WAN2 · Glasfaser · per Regel aktiv
    primary: true
    # Latenz der Leitung als Status (Punkt + ms). Die Integration legt je WAN
    # drei Latenz-Sensoren an (Microsoft, Google, Cloudflare), alle standard-
    # mäßig deaktiviert. UniFi nennt den ersten Anschluss "WAN", nicht "WAN1".
    # Die Latenz zeigt, dass die Leitung erreichbar ist, nicht, ob sie gerade
    # den Verkehr trägt.
    entity: sensor.dream_machine_special_edition_cloudflare_wan2_latency
  - name: Telekom VDSL
    detail: WAN1 · VDSL · Reserve
    entity: sensor.dream_machine_special_edition_cloudflare_wan_latency
    # Modem; erscheint hier statt unter den Kabel-Clients
    device: device_tracker.draytek_vigor_167
inactive:
  - device_tracker.usw_lite_8_poe_garage
pins:
  device_tracker.unas_pro_2: device_tracker.usw_pro_max_24_poe
labels:
  device_tracker.fritz_box_7590ax: FRITZ!Box (DECT-Telefonie)
  device_tracker.draytek_vigor_167: DrayTek Vigor 167
