# WLAN-QR (aufklappbar) im Design der ueberarbeiteten Owlet-Smart-Sock-Karte
#
# Die expander-card bleibt (fuer das Auf-/Zuklappen). Der Titel wird zu einer
# Owlet-Kopfzeile (Icon-Kachel + Titel + Untertitel), die Huelle bekommt per
# card_mod den Owlet-Look, der QR-Code wird abgerundet dargestellt.
#
# Voraussetzung: custom:expander-card, custom:button-card, card-mod (HACS).
type: custom:expander-card
expanded: false
clear: false
clear-children: true
title-card:
  type: custom:button-card
  show_icon: true
  show_name: true
  show_label: true
  show_state: false
  icon: mdi:wifi
  name: WLAN
  label: Ohne Foos nix los!
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 2px 2px 2px
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: min-content 1fr
      - grid-template-rows: min-content min-content
    img_cell:
      - width: 46px
      - height: 46px
      - border-radius: 14px
      - background: 'rgba(127, 179, 213, 0.14)'
      - border: 1px solid rgba(127, 179, 213, 0.22)
      - margin-right: 15px
    icon:
      - width: 24px
      - height: 24px
      - color: '#7fb3d5'
    name:
      - justify-self: start
      - align-self: end
      - font-size: 18px
      - font-weight: 700
      - letter-spacing: -0.02em
      - color: '#f2f5f8'
    label:
      - justify-self: start
      - align-self: start
      - font-size: 13px
      - color: '#6e7988'
      - margin-top: 2px
cards:
  - type: picture
    image: /local/wlan/ui-wlan-qr.png
    card_mod:
      style: |
        ha-card {
          border-radius: 16px !important;
          overflow: hidden !important;
          background: none !important;
          border: none !important;
          box-shadow: none !important;
          margin-top: 4px !important;
        }
card_mod:
  style: |
    ha-card {
      border-radius: 22px !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 14px 16px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    /* Aufklapp-Pfeil dezent */
    ha-card ha-icon,
    ha-card .expander-icon,
    ha-card mwc-icon-button {
      color: #6e7988 !important;
    }
