type: custom:button-card
entity: binary_sensor.tur_windfang
icon: |
  [[[
    return entity.state === 'on' ? 'mdi:door-open' : 'mdi:door-closed';
  ]]]
name: Tür Windfang
show_state: false
show_name: true
show_icon: true

# Icon-Farbe: Rot wenn geöffnet, Grün wenn geschlossen
color: |
  [[[
    return entity.state === 'on'
      ? 'var(--error-color, #F44336)'
      : 'var(--success-color, #4CAF50)';
  ]]]

styles:
  card:
    - padding: 6px 12px 6px 12px
    - border-radius: 24px
  grid:
    - grid-template-areas: '"i n status"'
    - grid-template-columns: min-content auto min-content
    - grid-template-rows: auto
  icon:
    - width: 36px
    - height: 36px
    - margin-right: 12px
  name:
    - font-size: 0.85em
    - font-weight: bold
    - text-align: left
    - justify-self: start
    - align-self: center
  custom_fields:
    status:
      - font-size: 0.85em
      - text-align: right
      - justify-self: end
      - align-self: center
      - font-weight: 500
      - padding-right: 4px

custom_fields:
  status: |
    [[[
      const isOpen = entity.state === 'on';
      const label = isOpen ? 'Geöffnet' : 'Geschlossen';
      const color = isOpen
        ? 'var(--error-color, #F44336)'
        : 'var(--success-color, #4CAF50)';

      return `
        <span style="
          display: inline-flex;
          align-items: center;
          gap: 5px;
          color: ${color};
        ">
          <span style="
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: ${color};
            flex-shrink: 0;
          "></span>
          ${label}
        </span>
      `;
    ]]]
