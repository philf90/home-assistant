type: custom:button-card
entity: sensor.solarbank_e2700_solar_production
name: " "
show_state: false
show_name: false
show_icon: false

variables:
  # ── Entitäten anpassen ──────────────────────────────────────────
  solar_power_entity: sensor.solarbank_e2700_solar_production
  grid_power_entity: sensor.solarbank_e2700_grid_power
  battery_power_entity: sensor.solarbank_e2700_battery_power
  battery_soc_entity: sensor.solarbank_e2700_battery_percentage
  home_power_entity: sensor.solarbank_e2700_home_usage
  output_power_entity: sensor.solarbank_e2700_output_power
  # ── Gerätename ──────────────────────────────────────────────────
  solarbank_name: "Solarbank 3 E2700 Pro"

styles:
  card:
    - padding: 0
    - border-radius: 16px
    - overflow: hidden
    - background: linear-gradient(180deg, #dce8f5 0%, #e8f0fa 40%, #eef4fc 100%)
    - aspect-ratio: 1 / 1
    - position: relative
  grid:
    - grid-template-areas: '"card"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
  custom_fields:
    card:
      - padding: 0
      - margin: 0
      - width: 100%
      - height: 100%

custom_fields:
  card: |
    [[[
      // ── Sensordaten auslesen ──────────────────────────────────
      const val = (id, fallback) => {
        const e = states[id];
        if (!e || e.state === 'unavailable' || e.state === 'unknown') return fallback;
        return parseFloat(e.state) || 0;
      };

      const solarW   = val(variables.solar_power_entity, 0);
      const gridW    = val(variables.grid_power_entity, 0);
      const battW    = val(variables.battery_power_entity, 0);
      const battSoc  = val(variables.battery_soc_entity, 0);
      const homeW    = val(variables.home_power_entity, 0);
      const outputW  = val(variables.output_power_entity, 0);

      const fmt = (w) => {
        if (w >= 1000) return (w / 1000).toFixed(1) + ' kW';
        return Math.round(w) + ' W';
      };

      const isCharging = battW > 10;
      const battIcon = isCharging ? '&#9889;' : '';

      // ── Animated flow dash style ──────────────────────────────
      const flowAnim = `
        @keyframes flowDash {
          to { stroke-dashoffset: -20; }
        }
      `;

      // Flow line style helper
      const flowStyle = (active) => active
        ? 'stroke:#7ec8e3;stroke-width:4;fill:none;stroke-dasharray:8,6;animation:flowDash 1s linear infinite;filter:drop-shadow(0 0 3px rgba(126,200,227,0.5))'
        : 'stroke:#b0c4d8;stroke-width:3;fill:none;opacity:0.3';

      const flowStyleReverse = (active) => active
        ? 'stroke:#7ec8e3;stroke-width:4;fill:none;stroke-dasharray:8,6;animation:flowDash 1s linear infinite reverse;filter:drop-shadow(0 0 3px rgba(126,200,227,0.5))'
        : 'stroke:#b0c4d8;stroke-width:3;fill:none;opacity:0.3';

      return `
        <style>
          ${flowAnim}
          .anker-card { position:relative; width:100%; height:100%; font-family:'Segoe UI',Roboto,sans-serif; }
          .anker-card svg { width:100%; height:100%; }

          /* ── Daten-Labels ─────────────────────────────────── */
          .data-label {
            position:absolute;
            text-align:center;
            line-height:1.2;
          }
          .data-label .title {
            font-size:0.75em;
            color:#6b7f94;
            font-weight:500;
            letter-spacing:0.02em;
          }
          .data-label .value {
            font-size:1.35em;
            font-weight:700;
            color:#2c3e50;
          }
          .data-label .value .chevron {
            font-size:0.7em;
            color:#9ab;
            margin-left:2px;
          }
          .data-label .sub {
            font-size:0.7em;
            color:#7a8fa3;
            font-weight:500;
          }

          /* ── Positionen ──────────────────────────────────── */
          .solar-label  { top:4%; left:4%; }
          .grid-label   { top:4%; right:4%; }
          .batt-label   { bottom:2%; left:6%; text-align:center; }
          .home-label   { bottom:2%; right:6%; text-align:center; }

          /* ── Output Bubble ───────────────────────────────── */
          .output-bubble {
            position:absolute;
            bottom:22%;
            left:50%;
            transform:translateX(-50%);
            background:rgba(126,200,227,0.25);
            color:#2980b9;
            font-weight:700;
            font-size:0.85em;
            padding:3px 12px;
            border-radius:14px;
            backdrop-filter:blur(4px);
            white-space:nowrap;
          }

          .charging-icon {
            color:#4CAF50;
          }
        </style>

        <div class="anker-card">
          <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

            <!-- ══════════════ HAUS (Isometrisch) ══════════════ -->

            <!-- Hauswand links (Schatten) -->
            <polygon points="115,195 200,245 200,335 115,285"
              fill="#e8e8ec" stroke="#ccc" stroke-width="0.5"/>

            <!-- Hauswand rechts (Front) -->
            <polygon points="200,245 310,190 310,280 200,335"
              fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>

            <!-- Dach links -->
            <polygon points="105,185 200,130 200,240 105,195"
              fill="#7a8ea6" stroke="#6b7d93" stroke-width="0.5"/>

            <!-- Dach rechts -->
            <polygon points="200,130 320,185 320,190 310,190 200,240"
              fill="#8fa3b8" stroke="#7a8ea6" stroke-width="0.5"/>

            <!-- Dachfirst-Linie -->
            <line x1="200" y1="130" x2="200" y2="240"
              stroke="#6b7d93" stroke-width="1"/>

            <!-- ── Solarpanels auf Dach links ── -->
            <g opacity="0.9">
              <!-- Panel 1 -->
              <polygon points="118,189 148,173 160,180 130,196"
                fill="#4a6a8a" stroke="#3d5a75" stroke-width="0.5"/>
              <line x1="133" y1="181" x2="145" y2="186"
                stroke="#5a7a9a" stroke-width="0.3"/>
              <line x1="126" y1="185" x2="152" y2="177"
                stroke="#5a7a9a" stroke-width="0.3"/>

              <!-- Panel 2 -->
              <polygon points="135,181 165,165 177,172 147,188"
                fill="#4a6a8a" stroke="#3d5a75" stroke-width="0.5"/>
              <line x1="150" y1="173" x2="162" y2="178"
                stroke="#5a7a9a" stroke-width="0.3"/>
              <line x1="143" y1="177" x2="169" y2="169"
                stroke="#5a7a9a" stroke-width="0.3"/>

              <!-- Panel 3 -->
              <polygon points="152,173 182,157 194,164 164,180"
                fill="#4a6a8a" stroke="#3d5a75" stroke-width="0.5"/>
              <line x1="167" y1="165" x2="179" y2="170"
                stroke="#5a7a9a" stroke-width="0.3"/>
              <line x1="160" y1="169" x2="186" y2="161"
                stroke="#5a7a9a" stroke-width="0.3"/>
            </g>

            <!-- ── Fenster auf rechter Wand ── -->
            <rect x="230" y="215" width="25" height="22" rx="1"
              fill="#dce8f5" stroke="#b0bec5" stroke-width="0.8"/>
            <line x1="242.5" y1="215" x2="242.5" y2="237"
              stroke="#b0bec5" stroke-width="0.5"/>
            <line x1="230" y1="226" x2="255" y2="226"
              stroke="#b0bec5" stroke-width="0.5"/>

            <!-- ── Tür auf rechter Wand ── -->
            <rect x="270" y="222" width="22" height="35" rx="1"
              fill="#e0e0e0" stroke="#b0bec5" stroke-width="0.8"/>
            <circle cx="288" cy="240" r="1.5" fill="#999"/>

            <!-- ── Solarbank Gerät (unten Mitte) ── -->
            <g transform="translate(172,290)">
              <!-- Gehäuse -->
              <rect x="0" y="0" width="50" height="28" rx="4"
                fill="#6b7b8a" stroke="#555" stroke-width="0.8"/>
              <!-- Display/LED -->
              <rect x="18" y="18" width="14" height="4" rx="2"
                fill="#7ec8e3" opacity="0.8"/>
              <!-- Oberkante Akzent -->
              <rect x="2" y="2" width="46" height="3" rx="1.5"
                fill="#7a8b99"/>
            </g>

            <!-- ── Strommast (rechts oben) ── -->
            <g transform="translate(335,100)" opacity="0.5">
              <line x1="0" y1="0" x2="0" y2="85"
                stroke="#9aa" stroke-width="2"/>
              <line x1="-12" y1="15" x2="12" y2="15"
                stroke="#9aa" stroke-width="1.5"/>
              <line x1="-8" y1="25" x2="8" y2="25"
                stroke="#9aa" stroke-width="1.2"/>
              <line x1="-5" y1="35" x2="5" y2="35"
                stroke="#9aa" stroke-width="1"/>
            </g>

            <!-- ── Busch links unten ── -->
            <g transform="translate(75,285)" opacity="0.6">
              <ellipse cx="0" cy="0" rx="18" ry="14" fill="#6aaa6a"/>
              <ellipse cx="12" cy="-5" rx="14" ry="11" fill="#5a9a5a"/>
              <ellipse cx="-8" cy="-3" rx="12" ry="10" fill="#7ab87a"/>
            </g>

            <!-- ── Baum rechts oben ── -->
            <g transform="translate(100,120)" opacity="0.5">
              <line x1="0" y1="15" x2="0" y2="35"
                stroke="#6a5" stroke-width="3"/>
              <polygon points="-12,18 0,-5 12,18" fill="#4a8a4a"/>
              <polygon points="-9,10 0,-2 9,10" fill="#5a9a5a"/>
            </g>

            <!-- ══════════ ENERGIEFLUSS-LINIEN ══════════ -->

            <!-- Solar → Solarbank (links oben nach Mitte unten) -->
            <path d="M 140,188 L 140,260 C 140,280 160,295 180,300"
              style="${flowStyle(solarW > 0)}"/>

            <!-- Solarbank → Haus (Mitte unten nach rechts) -->
            <path d="M 222,300 C 250,295 280,280 295,265 L 295,240"
              style="${flowStyle(outputW > 0)}"/>

            <!-- Netz → Haus (rechts oben nach rechts Mitte) -->
            <path d="M 335,175 L 310,185 L 310,220"
              style="${flowStyleReverse(gridW > 0)}"/>

          </svg>

          <!-- ── Datenwerte als Overlays ── -->

          <div class="data-label solar-label">
            <div class="title">Solarbetrieb</div>
            <div class="value">${fmt(solarW)} <span class="chevron">&#x203A;</span></div>
          </div>

          <div class="data-label grid-label">
            <div class="title">Netz</div>
            <div class="value">${fmt(gridW)} <span class="chevron">&#x203A;</span></div>
          </div>

          <div class="data-label batt-label">
            <div class="title">${variables.solarbank_name}</div>
            <div class="value">
              <span class="charging-icon">${battIcon}</span>
              ${fmt(battW)} &middot; ${Math.round(battSoc)}%
              <span class="chevron">&#x203A;</span>
            </div>
          </div>

          <div class="data-label home-label">
            <div class="title">Zuhause</div>
            <div class="value">${fmt(homeW)} <span class="chevron">&#x203A;</span></div>
          </div>

          ${outputW > 0 ? '<div class="output-bubble">' + fmt(outputW) + '</div>' : ''}

        </div>
      `;
    ]]]
