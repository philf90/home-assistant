# Clients – Owlet-Karte (WLAN-Clients gesamt / APs online / Gäste)
#
# "WLAN gesamt" und "APs online" werden aus den bereits bestätigten
# Access-Point-Sensoren berechnet (dieselben wie in unifi-button-card.yaml) –
# funktioniert also ohne weitere Einrichtung.
#
# ┌────────────── ENTITÄT PRÜFEN ────────────────────────────────────────────┐
# │ Die Gäste-Kachel braucht einen Gast-Client-Sensor. Den liefert die        │
# │ UniFi-Network-Integration je nach Version unterschiedlich (oft            │
# │ deaktiviert). Falls "–": Entität aktivieren bzw. guest_entity anpassen.    │
# │   Gäste: sensor.dream_machine_special_edition_guest_clients               │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: vertical-stack
card_mod: &shell
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  - type: custom:button-card
    icon: mdi:account-group
    name: Clients
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    styles: &head_styles
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content 1fr
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
  - type: grid
    columns: 3
    square: false
    cards:
      # WLAN-Clients gesamt = Summe aller AP-Client-Sensoren
      - type: custom:button-card
        icon: mdi:wifi
        name: WLAN gesamt
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update: all
        variables:
          kind: sum
          accent: '#a6d49e'
          ids:
            - sensor.u7_outdoor_clients
            - sensor.u7_outdoor_clients_2
            - sensor.u6_pro_wohnzimmer_clients
            - sensor.u6_pro_spielzimmer_clients
            - sensor.u6_pro_kinderzimmer_clients
            - sensor.u6_pro_clients
        label: &cli_val |
          [[[
            const muted='#6e7988';
            const bad=['off','unavailable','disconnected','unknown','offline','none',''];
            let out='–';
            if(variables.kind==='sum'){
              let t=0, any=false;
              (variables.ids||[]).forEach(id=>{ const s=states[id]; const v=s?parseFloat(s.state):NaN; if(!isNaN(v)){ t+=v; any=true; } });
              out=any?String(t):'–';
            } else if(variables.kind==='count_online'){
              let n=0; (variables.ids||[]).forEach(id=>{ const s=states[id]; if(s && !bad.includes(String(s.state).toLowerCase())) n++; });
              out=`${n}<span style="font-size:0.5em;color:${muted};font-weight:600;margin-left:2px;">/${(variables.ids||[]).length}</span>`;
            } else {
              const s=states[variables.single_entity]; const v=s?parseFloat(s.state):NaN;
              out=isNaN(v)?'–':String(v);
            }
            return out;
          ]]]
        styles: &cli_styles
          card:
            - border-radius: 16px
            - padding: 11px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr
            - grid-template-areas: '"i l" "i n"'
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 40px
            - height: 40px
            - border-radius: 11px
            - margin-right: 11px
            - align-self: center
            - background: |
                [[[ return (variables.accent||'#a6d49e')+'29'; ]]]
            - border: |
                [[[ return '1px solid '+(variables.accent||'#a6d49e')+'3d'; ]]]
          icon:
            - width: 21px
            - height: 21px
            - color: |
                [[[ return variables.accent||'#a6d49e'; ]]]
          label:
            - justify-self: start
            - align-self: end
            - font-size: 18px
            - font-weight: 750
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          name:
            - justify-self: start
            - align-self: start
            - font-size: 11px
            - color: '#6e7988'
            - margin-top: 2px
      # APs online = Anzahl online / gesamt
      - type: custom:button-card
        icon: mdi:access-point-network
        name: APs online
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update: all
        variables:
          kind: count_online
          accent: '#7fb3d5'
          ids:
            - sensor.u7_outdoor_state
            - sensor.u7_outdoor_state_2
            - sensor.u6_pro_wohnzimmer_state
            - sensor.u6_pro_spielzimmer_state
            - sensor.u6_pro_kinderzimmer_state
            - sensor.u6_pro_state
        label: *cli_val
        styles: *cli_styles
      # Gäste – Entität ggf. anpassen (siehe Kopf-Kommentar)
      - type: custom:button-card
        entity: sensor.dream_machine_special_edition_guest_clients
        icon: mdi:account-clock
        name: Gäste
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update: all
        variables:
          kind: single
          single_entity: sensor.dream_machine_special_edition_guest_clients
          accent: '#e6b566'
        label: *cli_val
        styles: *cli_styles
