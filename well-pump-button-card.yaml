type: custom:button-card
entity: switch.shelly_outdoor_plug_s_gen3_brunnenpumpe
name: Brunnenpumpe
icon: mdi:water-pump
tap_action:
  action: toggle
layout: custom
styles:
  card:
    - border-radius: 24px
    - padding: 16px
  grid:
    - grid-template-areas: "\"i n\" \"i power\""
    - grid-template-columns: 64px 1fr
    - grid-template-rows: 1fr 1fr
    - justify-items: start
  icon:
    - width: 36px
    - color: |
        [[[
          return entity.state === 'on'
            ? 'var(--primary-color)'
            : 'var(--disabled-color)';
        ]]]
  name:
    - font-size: 14px
    - font-weight: 600
    - align-self: end
    - justify-self: start
  custom_fields:
    power:
      - font-size: 12px
      - color: var(--secondary-text-color)
      - align-self: start
      - justify-self: start
custom_fields:
  power: |
    [[[
      const power = states['sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power'];
      if (!power) return '';
      return `⚡ ${power.state} ${power.attributes.unit_of_measurement || 'W'}`;
    ]]]
