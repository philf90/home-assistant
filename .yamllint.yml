# yamllint-Konfiguration fuer die Lovelace-Karten in diesem Repo.
#
# Bewusst locker gehalten: Die Dateien sind handkuratierte Dashboard-Snippets
# mit langen CSS-/JS-Bloecken, YAML-Ankern und Inline-Flow-Mappings. Geprueft
# wird nur, was auf einen echten Fehler hindeutet -- reine Formatierungsfragen
# sind abgeschaltet, damit die Ausgabe signalstark bleibt.

extends: default

rules:
  # Karten enthalten lange style-/JS-Zeilen, die sich nicht sinnvoll umbrechen
  # lassen, ohne die erzeugte CSS-Ausgabe zu veraendern.
  line-length: disable

  # Erklaerende Kommentare stehen teils auf Blockebene ueber eingerueckten
  # Schluesseln -- das ist hier Absicht.
  comments-indentation: disable

  # Die Dateien sind Snippets zum Einfuegen, kein eigenstaendiges Dokument.
  document-start: disable

  # Repo-Stil: "{ on_txt: offen, off_txt: zu }" mit Leerzeichen innen.
  # 0 und 1 Leerzeichen sind beide erlaubt.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # "on"/"off" sind in Home-Assistant-Konfigurationen echte Zustandswerte
  # und keine versehentlichen Booleans.
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]

  indentation:
    spaces: consistent
    indent-sequences: consistent
