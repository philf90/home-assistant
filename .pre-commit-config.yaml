# Lokale Variante der CI-Pruefungen (siehe ci/README.md).
#
#   pip install pre-commit && pre-commit install
#
# Danach laufen die Checks vor jedem Commit -- der Fehler faellt auf, bevor er
# gepusht wird.

# Die meisten Hooks laufen vor dem Commit; die Pruefung auf echte Namen
# zusaetzlich auf die Commit-Nachricht.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: dateien
        name: Jede Datei einer Art zuordnen
        entry: python ci/dateien.py
        language: system
        always_run: true
        pass_filenames: false

      - id: verweise
        name: Verweise auf Repo-Dateien
        entry: python ci/check_verweise.py
        language: system
        always_run: true
        pass_filenames: false

      - id: struktur
        name: Ablage und Dateinamen
        entry: python ci/check_struktur.py --streng
        language: system
        always_run: true
        pass_filenames: false

      - id: kopf
        name: Kopfblock (Karten, Templates, Platzhalter)
        entry: python ci/check_kopf.py
        language: system
        always_run: true
        pass_filenames: false

      - id: index
        name: Uebersichten im README aktuell
        entry: python ci/gen_index.py --pruefen
        language: system
        always_run: true
        pass_filenames: false

      - id: theme
        name: Owlet-Theme aus der Palette aktuell
        entry: python ci/gen_theme.py --pruefen
        language: system
        always_run: true
        pass_filenames: false

      - id: template-version
        name: Template-VERSION erhoeht
        entry: python ci/check_template_version.py --basis origin/main
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: persoenlich
        name: Keine echten Namen (lokal/sperrliste.txt)
        entry: python ci/check_persoenlich.py
        language: system
        always_run: true
        pass_filenames: false

      - id: persoenlich-commit-msg
        name: Keine echten Namen in der Commit-Nachricht
        entry: python ci/check_persoenlich.py --commit-msg
        language: system
        stages: [commit-msg]

      - id: js-templates
        name: button-card JS-Templates
        entry: node ci/check-js-templates.js
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: lovelace-yaml
        name: Lovelace-YAML-Struktur
        entry: python ci/check_yaml.py
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: owlet-palette
        name: Farben gegen die Owlet-Palette
        entry: python ci/check_palette.py
        language: system
        files: \.(yaml|js)$
        pass_filenames: false

      - id: bildschirmbreiten
        name: Regeln fuer die Bildschirmbreiten
        entry: python ci/check_mobil.py
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: grafana-dashboards
        name: Grafana-Dashboards
        entry: python ci/check_grafana.py
        language: system
        files: (^grafana/.*\.json$|^design/palette\.yaml$)
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "-c", ".yamllint.yml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        files: ^(grafana|ci)/.*\.py$
