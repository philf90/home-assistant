# Lokale Variante der CI-Pruefungen (siehe ci/README.md).
#
#   pip install pre-commit && pre-commit install
#
# Danach laufen die Checks vor jedem Commit -- der Fehler faellt auf, bevor er
# gepusht wird.

repos:
  - repo: local
    hooks:
      - id: js-templates
        name: button-card JS-Templates
        entry: node ci/check-js-templates.js
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: lovelace-yaml
        name: Lovelace-YAML-Struktur
        entry: python ci/check_yaml.py
        language: system
        files: \.yaml$
        pass_filenames: false

      - id: grafana-dashboards
        name: Grafana-Dashboards
        entry: python ci/check_grafana.py
        language: system
        files: ^grafana/.*\.json$
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "-c", ".yamllint.yml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        files: ^(grafana|ci)/.*\.py$
