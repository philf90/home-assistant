# Verbrauchs-Uebersicht im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
# Ein Stack aus zwei Sektionen:
#   OBEN  C = Live-Geraete-Kacheln (Watt jetzt + Richtungspfeil, 3er-Raster)
#   UNTEN B = Verbraucher-Ranking  (Tages-kWh + Anteil als Balken)
#
# Jede Kachel / jeder Balken ist eine eigene button-card -> klickbar
# (Tap = more-info). Gemeinsame Optik ueber YAML-Anker.
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: vertical-stack
cards:
  # ======================= C · LIVE-GERAETE-KACHELN =======================
  - type: vertical-stack
    card_mod: &shell
      style: |
        #root {
          background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          border-radius: 22px !important;
          box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
          padding: 16px 18px !important;
          gap: 10px !important;
        }
    cards:
      - type: custom:button-card
        icon: mdi:flash
        name: Verbraucher live
        label: jetzt · Watt pro Gerät
        show_icon: true
        show_name: true
        show_label: true
        tap_action:
          action: none
        styles: &header_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 2px 2px 6px
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: min-content 1fr
            - grid-template-rows: min-content min-content
          img_cell:
            - width: 44px
            - height: 44px
            - border-radius: 13px
            - margin-right: 14px
            - align-self: center
            - background: 'rgba(166, 212, 158, 0.12)'
            - border: 1px solid rgba(166, 212, 158, 0.2)
          icon:
            - width: 23px
            - height: 23px
            - color: '#a6d49e'
          name:
            - justify-self: start
            - align-self: end
            - font-size: 17px
            - font-weight: 700
            - letter-spacing: -0.02em
            - color: '#f2f5f8'
          label:
            - justify-self: start
            - align-self: start
            - font-size: 12.5px
            - color: '#6e7988'
            - margin-top: 1px
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.poe_power_total
            icon: mdi:ethernet
            name: PoE
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#b399d4' }
            label: &lbl_watt |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                const v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):NaN;
                if(isNaN(v)) return '–';
                return `${Math.round(v)}<span style="font-size:0.55em;color:#6e7988;font-weight:600;margin-left:2px;">W</span>`;
              ]]]
            custom_fields:
              flow: &flow_watt |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null;
                  const v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):NaN;
                  const a=variables.accent||'#7fb3d5';
                  if(isNaN(v)||v<=1) return '<span style="color:#6e7988;">–</span>';
                  return `<span style="color:${a};">↓</span>`;
                ]]]
            styles: &live_styles
              card:
                - border-radius: 16px
                - padding: 12px 12px 13px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-columns: min-content 1fr
                - grid-template-areas: '"i flow" "l l" "n n"'
                - grid-template-rows: min-content min-content min-content
                - grid-row-gap: 8px
              img_cell:
                - width: 34px
                - height: 34px
                - border-radius: 10px
                - justify-self: start
                - align-self: start
                - background: |
                    [[[ return (variables.accent||'#7fb3d5')+'29'; ]]]
              icon:
                - width: 18px
                - height: 18px
                - color: |
                    [[[ return variables.accent||'#7fb3d5'; ]]]
              custom_fields:
                flow:
                  - justify-self: end
                  - align-self: start
                  - font-size: 16px
                  - font-weight: 700
              label:
                - justify-self: start
                - align-self: end
                - font-size: 19px
                - font-weight: 750
                - letter-spacing: -0.02em
                - color: '#f2f5f8'
              name:
                - justify-self: start
                - align-self: start
                - font-size: 11.5px
                - color: '#6e7988'
                - white-space: nowrap
                - overflow: hidden
                - text-overflow: ellipsis
          - type: custom:button-card
            entity: sensor.stromverbrauch_hausgerate_aktuell
            icon: mdi:dishwasher
            name: Hausgeräte
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#e6b566' }
            label: *lbl_watt
            custom_fields: { flow: *flow_watt }
            styles: *live_styles
          - type: custom:button-card
            entity: sensor.stromverbrauch_server_aktuell
            icon: mdi:server
            name: Server
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fd0d5' }
            label: *lbl_watt
            custom_fields: { flow: *flow_watt }
            styles: *live_styles
          - type: custom:button-card
            entity: sensor.shelly_plugs_fernseher_switch_0_power
            icon: mdi:television
            name: TV
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fb3d5' }
            label: *lbl_watt
            custom_fields: { flow: *flow_watt }
            styles: *live_styles
          - type: custom:button-card
            entity: sensor.shelly_outdoor_plugs_pool_switch_0_power
            icon: mdi:pool
            name: Pool
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#7fd0d5' }
            label: *lbl_watt
            custom_fields: { flow: *flow_watt }
            styles: *live_styles
          # ---- Akku (Sonderfall: laedt/entlaedt) ----
          - type: custom:button-card
            entity: sensor.solarbank_3_e2700_pro_ladestand
            icon: mdi:battery-charging
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables: { accent: '#a6d49e' }
            triggers_update: all
            name: |
              [[[
                const soc=states['sensor.solarbank_3_e2700_pro_ladestand']?.state;
                return 'Akku ' + (soc!==undefined?Math.round(parseFloat(soc)):'–') + '%';
              ]]]
            label: |
              [[[
                const ch=parseFloat(states['sensor.solarbank_3_e2700_pro_aufladeleistung']?.state)||0;
                const di=parseFloat(states['sensor.solarbank_3_e2700_pro_entladeleistung']?.state)||0;
                const w=ch>di?ch:di;
                return `${Math.round(w)}<span style="font-size:0.55em;color:#6e7988;font-weight:600;margin-left:2px;">W</span>`;
              ]]]
            custom_fields:
              flow: |
                [[[
                  const ch=parseFloat(states['sensor.solarbank_3_e2700_pro_aufladeleistung']?.state)||0;
                  const di=parseFloat(states['sensor.solarbank_3_e2700_pro_entladeleistung']?.state)||0;
                  if(ch>di && ch>1) return '<span style="color:#a6d49e;">↑</span>';
                  if(di>1) return '<span style="color:#e6b566;">↓</span>';
                  return '<span style="color:#6e7988;">–</span>';
                ]]]
            styles: *live_styles

  # ======================= B · VERBRAUCHER-RANKING =======================
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:chart-bar
        name: Top-Verbraucher
        label: heute · Anteil am Bedarf
        show_icon: true
        show_name: true
        show_label: true
        tap_action:
          action: none
        styles: *header_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_hausgerate_daily
        icon: mdi:dishwasher
        name: Hausgeräte
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables: &rank_vars
          accent: '#e6b566'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: &lbl_rank |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):NaN;
            const tot=parseFloat(states[variables.total_entity]?.state)||0;
            if(isNaN(v)) return '–';
            const share= tot>0 ? Math.round(v/tot*100) : 0;
            return `${v.toFixed(2).replace('.',',')}<span style="color:#6e7988;font-weight:600;font-size:0.72em;margin-left:5px;">${variables.unit} · ${share}%</span>`;
          ]]]
        custom_fields:
          bar: &bar_rank |
            [[[
              const e=(typeof entity!=='undefined')?entity:null;
              const v=(e&&e.state!==undefined&&e.state!==null)?parseFloat(e.state):0;
              const tot=parseFloat(states[variables.total_entity]?.state)||0;
              const share= tot>0 ? Math.min(100, v/tot*100) : 0;
              const a=variables.accent||'#7fb3d5';
              return `<div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.05);overflow:hidden;">
                <div style="height:100%;width:${share}%;border-radius:6px;background:${a};"></div></div>`;
            ]]]
        styles: &rank_styles
          card:
            - border-radius: 16px
            - padding: 12px 14px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-columns: min-content 1fr auto
            - grid-template-areas: '"i n l" "i bar bar"'
            - grid-template-rows: min-content min-content
            - grid-row-gap: 8px
          img_cell:
            - width: 30px
            - height: 30px
            - border-radius: 9px
            - margin-right: 12px
            - align-self: center
            - background: |
                [[[ return (variables.accent||'#7fb3d5')+'29'; ]]]
          icon:
            - width: 17px
            - height: 17px
            - color: |
                [[[ return variables.accent||'#7fb3d5'; ]]]
          name:
            - justify-self: start
            - align-self: center
            - font-size: 13.5px
            - font-weight: 600
            - color: '#e7ecf3'
          label:
            - justify-self: end
            - align-self: center
            - font-size: 13.5px
            - font-weight: 700
            - letter-spacing: -0.01em
            - color: '#f2f5f8'
          custom_fields:
            bar:
              - align-self: center
      - type: custom:button-card
        entity: sensor.stromverbrauch_server_daily
        icon: mdi:server
        name: Server
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#7fd0d5'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_poe_power_daily
        icon: mdi:ethernet
        name: PoE-Infrastruktur
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#b399d4'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_fernseher_daily
        icon: mdi:television
        name: Fernseher
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#7fb3d5'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_heizung_daily
        icon: mdi:radiator
        name: Heizung
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#f0736a'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_schreibtisch_daily
        icon: mdi:desk
        name: Schreibtisch
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#a6d49e'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_pool_daily
        icon: mdi:pool
        name: Pool
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#7fd0d5'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.schlafzimmer_shelly_plugin_g3_klimaanlage_stromverbrauch_klimaanlage_daily
        icon: mdi:air-conditioner
        name: Klimaanlage
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#7fb3d5'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.stromverbrauch_gartenpumpe_daily
        icon: mdi:water-pump
        name: Gartenpumpe
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#a6d49e'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
      - type: custom:button-card
        entity: sensor.heizlufter_stromverbrauch_heizlufter_daily
        icon: mdi:heat-wave
        name: Heizlüfter
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        variables:
          accent: '#e6b566'
          total_entity: sensor.bkw_netz
          unit: kWh
        triggers_update: all
        label: *lbl_rank
        custom_fields: { bar: *bar_rank }
        styles: *rank_styles
