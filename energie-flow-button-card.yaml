# Energiefluss-Diagramm (Konzept A · dynamischer Faecher) im Owlet-Look
# ============================================================================
# Quellen oben (Solar + Akku), Netz links, Haus mittig; die aktiven Live-
# Verbraucher haengen als Faecher unten. 0-W-Geraete werden AUSGEBLENDET -> der
# Faecher rueckt zusammen und zentriert sich (dynamisch in Groesse & Form).
# Partikel wandern in Flussrichtung, Tempo ~ Leistung.
#
# Verbraucherfarben = Top-Verbraucher-Karte: Hausgeraete #e6b566, Server
# #7fd0d5, PoE #b399d4, TV #7fb3d5, Pool #7fd0d5, Gartenpumpe #a6d49e.
#
# KLICKBARKEIT: Quellen + Haus (feste Positionen) sind per transparenter
# type:image-Flaeche klickbar (more-info). Die Verbraucher-Knoten reflowen
# dynamisch und sind daher NICHT einzeln klickbar (Detail: "Verbraucher live"-
# Karte). Diagramm-Hintergrund pointer-events:none.
#
# Sensoren (W, ausser SOC): Solar solarleistung · Netz smart_meter_netzbezug
# (>0 Bezug) · Akku akkuleistung (>0 laedt) · SOC ladestand · Haus
# system_muhlweg_hausbedarf · Verbraucher: poe_power_total,
# stromverbrauch_hausgerate_aktuell, stromverbrauch_server_aktuell,
# shelly_plugs_fernseher_switch_0_power, shelly_outdoor_plugs_pool_switch_0_power,
# shelly_outdoor_plug_s_gen3_brunnenpumpe_power.
#
# Voraussetzung: custom:button-card + card-mod (HACS). picture-elements = Core.
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
  - type: custom:button-card
    icon: mdi:transmission-tower
    name: Energiefluss
    show_icon: true
    show_name: true
    show_state: false
    tap_action: { action: none }
    triggers_update:
      - sensor.smart_meter_netzbezug
    custom_fields:
      badge: |
        [[[
          const netz=(()=>{const s=states['sensor.smart_meter_netzbezug'];return s?parseFloat(s.state):NaN;})();
          const TH=15;
          let txt='Autark', c='#a6d49e';
          if(!isNaN(netz)&&netz>TH){ txt='Netzbezug'; c='#f0736a'; }
          else if(!isNaN(netz)&&netz<-TH){ txt='Einspeisung'; c='#a6d49e'; }
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}47;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <span style="width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}33;"></span>${txt}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge: [ justify-self: end, align-self: center ]

  - type: picture-elements
    image: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMzIwIj48L3N2Zz4="
    card_mod:
      style: |
        ha-card { background:none !important; border:none !important; box-shadow:none !important; }
    elements:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        triggers_update:
          - sensor.solarbank_3_e2700_pro_solarleistung
          - sensor.smart_meter_netzbezug
          - sensor.solarbank_3_e2700_pro_akkuleistung
          - sensor.solarbank_3_e2700_pro_ladestand
          - sensor.system_muhlweg_hausbedarf
          - sensor.poe_power_total
          - sensor.stromverbrauch_hausgerate_aktuell
          - sensor.stromverbrauch_server_aktuell
          - sensor.shelly_plugs_fernseher_switch_0_power
          - sensor.shelly_outdoor_plugs_pool_switch_0_power
          - sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power
          - sensor.shelly_plus_1pm_heizung_switch_0_power
        card_mod:
          style: |
            ha-card { background:none !important; border:none !important; box-shadow:none !important; pointer-events:none !important; }
        custom_fields:
          flow: |
            [[[
              const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
              const solar=g('sensor.solarbank_3_e2700_pro_solarleistung');
              const netz =g('sensor.smart_meter_netzbezug');
              const akku =g('sensor.solarbank_3_e2700_pro_akkuleistung');
              const soc  =g('sensor.solarbank_3_e2700_pro_ladestand');

              const YEL='#e6c15a',GRN='#a6d49e',RED='#f0736a',BLU='#7fb3d5',MUT='#6e7988',TXT='#f2f5f8',TRK='rgba(255,255,255,0.08)';
              const TH=15;
              const fmt=(w)=>{ if(w===null||isNaN(w))return '–'; const a=Math.abs(w);
                return a>=1000 ? (w/1000).toFixed(1).replace('.',',')+' kW' : Math.round(w)+' W'; };
              const fmtAbs=(w)=>{ if(w===null||isNaN(w))return '–'; const a=Math.abs(w);
                return a>=1000 ? (a/1000).toFixed(1).replace('.',',')+' kW' : Math.round(a)+' W'; };
              const dur=(w)=>{ const a=Math.abs(w)||0; const t=Math.max(0,Math.min(1,(a-50)/(2500-50))); return (2.8 - t*(2.8-1.2)).toFixed(2); };
              const parts=(path,color,d,n)=>{ let o=''; for(let i=0;i<n;i++){ o+=`<circle r="3" fill="${color}"><animateMotion dur="${d}s" begin="${(d*i/n).toFixed(2)}s" repeatCount="indefinite" path="${path}"/></circle>`; } return o; };
              const ring=(cx,cy,r,c)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}1f" stroke="${c}5c" stroke-width="1.5"/>`;
              const txt=(x,y,t,s,c,w)=>`<text x="${x}" y="${y}" text-anchor="middle" fill="${c||TXT}" font-size="${s}" font-weight="${w||700}" font-family="-apple-system,system-ui,sans-serif" style="font-variant-numeric:tabular-nums">${t}</text>`;
              const ico=(paths,x,y,c,sc)=>`<g transform="translate(${x} ${y}) scale(${sc||1})" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">${paths}</g>`;
              const I={
                sun:'<circle cx="0" cy="0" r="4.2"/><path d="M0-8.5V-11M0 8.5V11M-8.5 0H-11M8.5 0H11M6 6 7.8 7.8M-6 6-7.8 7.8M6-6 7.8-7.8M-6-6-7.8-7.8"/>',
                bat:'<rect x="-9" y="-5" width="16" height="10" rx="2"/><path d="M7-2v4"/>',
                grid:'<path d="M-6-8 0-11 6-8M-4 11 0-11 4 11M-7 2H7M-5 6H5"/>',
                home:'<path d="M-9 1 0-8 9 1M-6-1V9H6V-1"/>',
                dishwasher:'<rect x="-7" y="-8" width="14" height="16" rx="2"/><path d="M-7-3H7"/><circle cx="0" cy="3" r="3.2"/>',
                server:'<rect x="-8" y="-7" width="16" height="6" rx="1.4"/><rect x="-8" y="1" width="16" height="6" rx="1.4"/><path d="M4-4h.3M4 4h.3"/>',
                ethernet:'<path d="M-6-2v-3h12v3M0-5v-3"/><rect x="-5" y="-2" width="10" height="8" rx="1.4"/><path d="M-3 6v1.4M0 6v1.4M3 6v1.4"/>',
                tv:'<rect x="-9" y="-7" width="18" height="12" rx="1.6"/><path d="M-3 9h6"/>',
                pool:'<path d="M-8 3c2-2 3 2 5 0s3-2 5 0 3 2 3 0M-8 8c2-2 3 2 5 0s3-2 5 0 3 2 3 0M-3-6a2 2 0 0 1 4 0v9"/>',
                pump:'<path d="M-6 8V-2a4 4 0 0 1 8 0M-6 8h8M2-2h5M4-2v3"/><circle cx="-2" cy="-2" r="1"/>',
                radiator:'<path d="M-8-6v12M-3-6v12M2-6v12M7-6v12M-9 6h18"/>'
              };

              // ---------- Quellen-Zustaende ----------
              const pvOn=!isNaN(solar)&&solar>TH;
              const gridImp=!isNaN(netz)&&netz>TH, gridExp=!isNaN(netz)&&netz<-TH;
              const batChg=!isNaN(akku)&&akku>TH, batDis=!isNaN(akku)&&akku<-TH;
              const pvCol=pvOn?YEL:MUT, gridCol=gridImp?RED:(gridExp?GRN:MUT), batCol=(!isNaN(soc)&&soc<=10)?RED:GRN;

              // ---------- Kanten Quellen ----------
              const P_SH='M162 78 L182 114', P_AH='M238 78 L218 114', P_GH='M79 150 L160 150';
              let base=`<g fill="none" stroke-linecap="round">
                <path d="${P_SH}" stroke="${TRK}" stroke-width="2.5"/>
                <path d="${P_AH}" stroke="${TRK}" stroke-width="2.5"/>
                <path d="${P_GH}" stroke="${TRK}" stroke-width="2.5"/>`;
              let flow='';
              if(pvOn) flow+=parts(P_SH, YEL, dur(solar), 3);
              if(gridImp) flow+=parts('M79 150 L160 150', RED, dur(netz), 3);
              else if(gridExp) flow+=parts('M160 150 L79 150', GRN, dur(netz), 3);
              if(batChg) flow+=parts('M218 114 L238 78', GRN, dur(akku), 3);
              else if(batDis) flow+=parts('M238 78 L218 114', BLU, dur(akku), 3);

              // ---------- Verbraucher (nur aktive) ----------
              const cons=[
                {id:'sensor.stromverbrauch_hausgerate_aktuell', n:'Hausgeräte', ic:'dishwasher', c:'#e6b566'},
                {id:'sensor.stromverbrauch_server_aktuell',     n:'Server',     ic:'server',     c:'#7fd0d5'},
                {id:'sensor.poe_power_total',                   n:'PoE',        ic:'ethernet',   c:'#b399d4'},
                {id:'sensor.shelly_plugs_fernseher_switch_0_power', n:'TV',      ic:'tv',         c:'#7fb3d5'},
                {id:'sensor.shelly_outdoor_plugs_pool_switch_0_power', n:'Pool', ic:'pool',       c:'#7fd0d5'},
                {id:'sensor.shelly_outdoor_plug_s_gen3_brunnenpumpe_power', n:'Garten', ic:'pump', c:'#a6d49e'},
                {id:'sensor.shelly_plus_1pm_heizung_switch_0_power', n:'Heizung', ic:'radiator', c:'#f0736a'}
              ].map(o=>Object.assign(o,{w:g(o.id)}))
               .filter(o=>!isNaN(o.w)&&o.w>0)   // Verbraucher: alles >0 W zeigen (Quellen bleiben bei TH)
               .sort((a,b)=>b.w-a.w);

              const N=cons.length, cy=270, cr=24, hy=190;
              const sp = N>1 ? Math.min(64, 300/(N-1)) : 0;
              const x0 = 200 - sp*(N-1)/2;
              for(let i=0;i<N;i++){ base+=`<path d="M200 ${hy} L${(x0+i*sp).toFixed(1)} ${cy-cr}" stroke="${TRK}" stroke-width="1.8" fill="none"/>`; }
              base+='</g>';
              for(let i=0;i<N;i++){ flow+=parts(`M200 ${hy} L${(x0+i*sp).toFixed(1)} ${cy-cr}`, cons[i].c, dur(cons[i].w), 2); }

              // ---------- Knoten ----------
              const socTxt=(!isNaN(soc))?Math.round(soc)+' %':'–';
              const batWord= batChg?('lädt '+fmtAbs(akku)):(batDis?('entlädt '+fmtAbs(akku)):'bereit');
              let nodes='';
              nodes+=ring(150,54,27,pvCol)+ico(I.sun,150,47,pvCol)+txt(150,64,fmt(solar),11.5);
              nodes+=ring(250,54,27,batCol)+ico(I.bat,250,47,batCol)+txt(250,64,socTxt,12)+txt(250,92,batWord,10.5,batCol,600);
              nodes+=ring(52,150,27,gridCol)+ico(I.grid,52,143,gridCol)+txt(52,163,fmtAbs(netz),11.5)+txt(52,190,gridImp?'Bezug':(gridExp?'Einspeisung':'Netz'),10.5,gridCol,600);
              nodes+=ring(200,150,40,BLU)+ico(I.home,200,142,BLU,1.15)+txt(200,167,fmt(g('sensor.system_muhlweg_hausbedarf')),13);
              for(let i=0;i<N;i++){ const o=cons[i], x=x0+i*sp;
                nodes+=ring(x,cy,cr,o.c)+ico(I[o.ic],x,cy-8,o.c,.82)+txt(x,cy+9,fmt(o.w),10.5,TXT)+txt(x,cy+cr+13,o.n,9.5,o.c,600);
              }

              return `<div style="width:100%;"><svg viewBox="0 0 400 320" style="width:100%;height:auto;display:block;">${base}${flow}${nodes}</svg></div>`;
            ]]]
        styles:
          card: [ background: none, box-shadow: none, border: none, padding: 0 ]
          grid: [ grid-template-areas: '"flow"' ]
          custom_fields:
            flow: [ width: 100% ]
        style:
          top: 50%
          left: 50%
          width: 100%
          transform: translate(-50%, -50%)
          pointer-events: none

      # ---- Klickflaechen: nur feste Knoten (Quellen + Haus) ----
      - type: image
        entity: sensor.solarbank_3_e2700_pro_solarleistung
        image: &pixel "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        tap_action: { action: more-info }
        style: { top: 17%, left: 37.5%, width: 15%, height: 20%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.solarbank_3_e2700_pro_ladestand
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 17%, left: 62.5%, width: 15%, height: 24%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.smart_meter_netzbezug
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 47%, left: 13%, width: 15%, height: 24%, transform: 'translate(-50%, -50%)', border-radius: 16px, cursor: pointer, opacity: 0, z-index: 2 }
      - type: image
        entity: sensor.system_muhlweg_hausbedarf
        image: *pixel
        tap_action: { action: more-info }
        style: { top: 47%, left: 50%, width: 20%, height: 26%, transform: 'translate(-50%, -50%)', border-radius: 999px, cursor: pointer, opacity: 0, z-index: 2 }
