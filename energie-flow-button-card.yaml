# Energiefluss-Diagramm im Owlet-Look
# ============================================================================
# Kompakte Uebersicht "woher kommt / wohin geht der Strom": vier Knoten
# (PV oben, Netz links, Haus Mitte, Akku rechts) mit animierten Partikeln,
# die in FLUSSRICHTUNG wandern. Richtung + Farbe reagieren live auf den Zustand.
# Partikeltempo richtet sich nach der Leistung (viel W = schneller).
#
# KLICKBARKEIT: Das Diagramm liegt als Hintergrund in einer picture-elements-
# Karte; darueber liegen vier transparente button-card-Flaechen mit nativem
# tap_action: more-info (CSP-fest, ohne Inline-JS). So oeffnet ein Tap auf einen
# Knoten den more-info-Dialog der jeweiligen Entity.
#
# Ergaenzt energie-pv-button-card.yaml (fasst deren Live-Kacheln grafisch
# zusammen, ersetzt sie nicht). Sensoren/Vorzeichen:
#   Solar   sensor.solarbank_3_e2700_pro_solarleistung      (>=0)
#   Netz    sensor.smart_meter_netzbezug     (>0 Bezug / <0 Einspeisung)
#   Akku    sensor.solarbank_3_e2700_pro_akkuleistung   (>0 laedt / <0 entlaedt)
#   Haus    sensor.system_muhlweg_hausbedarf      (Verbrauch)
#   SOC     sensor.solarbank_3_e2700_pro_ladestand          (Ladestand %)
#
# KEIN zusaetzlicher Sensor noetig. picture-elements ist Core (kein HACS).
# Voraussetzung: custom:button-card + card-mod (HACS).
# ============================================================================
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
  # ---- Kopfzeile mit Autark/Bezug-Badge ----
  - type: custom:button-card
    icon: mdi:transmission-tower
    name: Energiefluss
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    triggers_update:
      - sensor.smart_meter_netzbezug
    custom_fields:
      badge: |
        [[[
          const netz=(()=>{const s=states['sensor.smart_meter_netzbezug'];return s?parseFloat(s.state):NaN;})();
          const TH=15;
          let txt='Autark', c='#a6d49e';
          if(!isNaN(netz)&&netz>TH){ txt='Netzbezug'; c='#f0736a'; }
          else if(!isNaN(netz)&&netz<-TH){ txt='Einspeisung'; c='#a6d49e'; }
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${c}22;border:1px solid ${c}47;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;">
            <span style="width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 0 3px ${c}33;"></span>${txt}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center

  # ---- Diagramm (Hintergrund) + klickbare Knoten (Overlay) ----
  - type: picture-elements
    # Transparentes 2:1-Bild -> setzt das Seitenverhaeltnis, damit die
    # Prozent-Positionen der Klickflaechen exakt auf die SVG-Knoten passen.
    image: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMjAwIj48L3N2Zz4="
    card_mod:
      style: |
        ha-card {
          background: none !important;
          border: none !important;
          box-shadow: none !important;
        }
    elements:
      # ---- Fluss-Diagramm (nicht klickbar, fuellt die Flaeche) ----
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        triggers_update:
          - sensor.solarbank_3_e2700_pro_solarleistung
          - sensor.smart_meter_netzbezug
          - sensor.solarbank_3_e2700_pro_akkuleistung
          - sensor.system_muhlweg_hausbedarf
          - sensor.solarbank_3_e2700_pro_ladestand
        card_mod:
          style: |
            ha-card {
              background: none !important;
              border: none !important;
              box-shadow: none !important;
              pointer-events: none !important;
            }
        custom_fields:
          flow: |
            [[[
              // ---------- Werte ----------
              const g=(id)=>{ const s=states[id]; return s?parseFloat(s.state):NaN; };
              const solar=g('sensor.solarbank_3_e2700_pro_solarleistung');
              const netz =g('sensor.smart_meter_netzbezug');
              const akku =g('sensor.solarbank_3_e2700_pro_akkuleistung');
              const haus =g('sensor.system_muhlweg_hausbedarf');
              const soc  =g('sensor.solarbank_3_e2700_pro_ladestand');

              // ---------- Palette ----------
              const YEL='#e6c15a', GRN='#a6d49e', RED='#f0736a', BLU='#7fb3d5',
                    MUT='#6e7988', TXT='#f2f5f8', TRK='rgba(255,255,255,0.08)';

              const fmt=(w)=>{ if(w===null||isNaN(w))return '–'; const a=Math.abs(w);
                return a>=1000 ? (w/1000).toFixed(1).replace('.',',')+' kW' : Math.round(w)+' W'; };
              const fmtAbs=(w)=>{ if(w===null||isNaN(w))return '–'; const a=Math.abs(w);
                return a>=1000 ? (a/1000).toFixed(1).replace('.',',')+' kW' : Math.round(a)+' W'; };

              // ---------- Fluss-Zustaende ----------
              const TH=15;
              const pvOn   = !isNaN(solar)&&solar> TH;
              const gridImp= !isNaN(netz) &&netz > TH;   // Bezug  (Netz -> Haus)
              const gridExp= !isNaN(netz) &&netz <-TH;   // Einspeisung (Haus -> Netz)
              const batChg = !isNaN(akku) &&akku > TH;   // laedt  (Haus -> Akku)
              const batDis = !isNaN(akku) &&akku <-TH;   // entlaedt (Akku -> Haus)

              const gridCol = gridImp?RED:(gridExp?GRN:MUT);
              const batCol  = (!isNaN(soc)&&soc<=10)?RED:GRN;
              const pvCol   = pvOn?YEL:MUT;

              // ---------- Partikel (Tempo ~ Leistung) ----------
              const dur=(w)=>{
                const a=Math.abs(w)||0;
                const t=Math.max(0,Math.min(1,(a-50)/(2500-50)));
                return (2.8 - t*(2.8-1.2)).toFixed(2);
              };
              const parts=(path,color,d,n)=>{
                let o='';
                for(let i=0;i<n;i++){
                  const b=(d*i/n).toFixed(2);
                  o+=`<circle r="3" fill="${color}"><animateMotion dur="${d}s" begin="${b}s" repeatCount="indefinite" path="${path}"/></circle>`;
                }
                return o;
              };

              // ---------- Kanten ----------
              const P_PV='M200 68 L200 102', P_GH='M86 140 L162 140', P_HB='M238 140 L314 140';
              const base=`<g stroke-width="2.5" fill="none" stroke-linecap="round">
                <path d="${P_PV}" stroke="${TRK}"/><path d="${P_GH}" stroke="${TRK}"/><path d="${P_HB}" stroke="${TRK}"/></g>`;

              // Farbe zeigt Richtung: Bezug rot / Einspeisung gruen,
              // laden gruen / entladen blau, PV gelb.
              let flow='';
              if(pvOn) flow+=parts(P_PV, YEL, dur(solar), 3);
              if(gridImp) flow+=parts('M86 140 L162 140', RED, dur(netz), 3);
              else if(gridExp) flow+=parts('M162 140 L86 140', GRN, dur(netz), 3);
              if(batChg) flow+=parts('M238 140 L314 140', GRN, dur(akku), 3);
              else if(batDis) flow+=parts('M314 140 L238 140', BLU, dur(akku), 3);

              // ---------- Knoten ----------
              const ring=(cx,cy,r,col)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}1f" stroke="${col}5c" stroke-width="1.5"/>`;
              const val=(cx,y,t,size,col)=>`<text x="${cx}" y="${y}" text-anchor="middle" fill="${col||TXT}" font-size="${size}" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif" style="font-variant-numeric:tabular-nums;">${t}</text>`;
              const cap=(cx,y,t,col)=>`<text x="${cx}" y="${y}" text-anchor="middle" fill="${col}" font-size="10.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">${t}</text>`;

              const icPV=(c)=>`<g transform="translate(200 32)" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="4.5"/><path d="M0 -9V-12M0 9V12M-9 0H-12M9 0H12M6.4 6.4 8.5 8.5M-6.4 6.4-8.5 8.5M6.4-6.4 8.5-8.5M-6.4-6.4-8.5-8.5"/></g>`;
              const icGrid=(c)=>`<g transform="translate(58 132)" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-6-8 0-11 6-8M-4 11 0-11 4 11M-7 2H7M-5 6H5"/></g>`;
              const icBat=(c)=>`<g transform="translate(342 132)" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-5" width="16" height="10" rx="2"/><path d="M7-2v4"/></g>`;
              const icHome=(c)=>`<g transform="translate(200 131)" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 1 0-9 11 1M-8-1V10H8V-1"/></g>`;

              const nPV   = ring(200,40,28,pvCol)  + icPV(pvCol)   + val(200,54, fmt(solar),11.5);
              const nGrid = ring(58,140,28,gridCol)+ icGrid(gridCol)+ val(58,154, fmtAbs(netz),11.5)
                          + cap(58,181, gridImp?'Bezug':(gridExp?'Einspeisung':'Netz'), gridCol);
              const socTxt = (!isNaN(soc))?Math.round(soc)+' %':'–';
              const batWord= batChg?('lädt '+fmtAbs(akku)):(batDis?('entlädt '+fmtAbs(akku)):'bereit');
              const nBat  = ring(342,140,28,batCol)+ icBat(batCol) + val(342,153, socTxt,12)
                          + cap(342,181, batWord, batCol);
              const nHome = ring(200,140,38,BLU)   + icHome(BLU)   + val(200,157, fmt(haus),13);

              return `<div style="width:100%;">
                <svg viewBox="0 0 400 200" style="width:100%;height:auto;display:block;">
                  ${base}${flow}${nPV}${nGrid}${nBat}${nHome}
                </svg></div>`;
            ]]]
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 0
          grid:
            - grid-template-areas: '"flow"'
          custom_fields:
            flow:
              - width: 100%
        style:
          top: 50%
          left: 50%
          width: 100%
          transform: translate(-50%, -50%)
          pointer-events: none

      # ---- Klickflaechen: transparente type:image-Elemente mit more-info ----
      # (bewaehrte, CSP-feste Methode fuer unsichtbare Tap-Zonen)
      - type: image
        entity: sensor.solarbank_3_e2700_pro_solarleistung
        image: &pixel "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        tap_action:
          action: more-info
        style:
          top: 20%
          left: 50%
          width: 16%
          height: 30%
          transform: translate(-50%, -50%)
          border-radius: 999px
          cursor: pointer
          opacity: 0
          z-index: 2
      - type: image
        entity: sensor.smart_meter_netzbezug
        image: *pixel
        tap_action:
          action: more-info
        style:
          top: 74%
          left: 14.5%
          width: 18%
          height: 40%
          transform: translate(-50%, -50%)
          border-radius: 16px
          cursor: pointer
          opacity: 0
          z-index: 2
      - type: image
        entity: sensor.solarbank_3_e2700_pro_ladestand
        image: *pixel
        tap_action:
          action: more-info
        style:
          top: 74%
          left: 85.5%
          width: 18%
          height: 40%
          transform: translate(-50%, -50%)
          border-radius: 16px
          cursor: pointer
          opacity: 0
          z-index: 2
      - type: image
        entity: sensor.system_muhlweg_hausbedarf
        image: *pixel
        tap_action:
          action: more-info
        style:
          top: 70%
          left: 50%
          width: 20%
          height: 38%
          transform: translate(-50%, -50%)
          border-radius: 999px
          cursor: pointer
          opacity: 0
          z-index: 2
