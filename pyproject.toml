# Konfiguration fuer ruff (Linting der Python-Skripte in grafana/ und ci/).
#
# Der Regelsatz ist bewusst explizit gesetzt: Bei den ruff-Standardregeln
# koennte eine neue Version zusaetzliche Checks aktivieren und die Pipeline
# ohne Codeaenderung rot faerben.
#
# Bewusst nicht eingebunden: "ruff format". Die vorhandenen Skripte sind
# handformatiert; ein Formatierungszwang waere ein grosser, sachfremder Diff.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes -- ungenutzte Importe/Variablen, undefinierte Namen
  "W",  # Whitespace-Warnungen
  "B",  # flake8-bugbear -- typische Fallstricke
]

# Bewusst nicht aktiviert:
#   UP (pyupgrade)  -- wuerde Idiome verlangen, die neuere Python-Versionen
#                      voraussetzen (z. B. datetime.UTC ab 3.11). Die Skripte
#                      in grafana/ laufen auch auf aelteren Interpretern.
#   I  (isort)      -- reine Sortierfrage, kein Fehlerrisiko.
