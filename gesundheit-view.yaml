            const pairs=[['sensor.philipps_iphone17pro_active_energy','input_number.ziel_aktive_energie'],['sensor.philipps_iphone17pro_exercise_time','input_number.ziel_trainingszeit'],['sensor.philipps_iphone17pro_health_steps','input_number.ziel_schritte']];
