                <div style="color:#f2f5f8;font-size:17px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">${de(val)}<span style="font-size:0.62em;color:#6e7988;font-weight:600;"> / ${de(goal)} ${x.u}</span></div></div>`; }).join('');
            return `<div style="display:flex;align-items:center;justify-content:space-evenly;gap:16px;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;">
              <svg viewBox="0 0 120 120" style="width:120px;height:120px;flex:none;transform:rotate(-90deg);">${rows.map(ring).join('')}</svg>
              <div style="display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0;text-align:left;">${leg}</div></div>`;
          ]]]
