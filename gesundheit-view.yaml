            // Drei konzentrische Ringe (Bewegung / Training / Schritte) gegen die Ziel-Helfer.
            // Strichstaerke 8 und Spur rgba(255,255,255,0.07) wie die Heizungs-Boegen.
            const v=id=>{ const x=parseFloat(states[id]?.state); return isNaN(x)?null:x; };
            const de=n=>n===null?'–':Math.round(n).toLocaleString('de-DE');
            const rows=[
              {id:'sensor.philipps_iphone17pro_active_energy', g:'input_number.ziel_aktive_energie', c:'#f0736a', r:50, l:'Bewegung', u:'kcal'},
              {id:'sensor.philipps_iphone17pro_exercise_time', g:'input_number.ziel_trainingszeit', c:'#a6d49e', r:38, l:'Training', u:'min'},
              {id:'sensor.philipps_iphone17pro_health_steps', g:'input_number.ziel_schritte', c:'#7fb3d5', r:26, l:'Schritte', u:''}
            ];
            const ring=x=>{ const C=2*Math.PI*x.r; const val=v(x.id), goal=v(x.g);
              const p=(val!==null&&goal)?Math.max(0,Math.min(1,val/goal)):0;
              return `<circle cx="60" cy="60" r="${x.r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>`+
