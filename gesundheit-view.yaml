        - background: rgba(255,255,255,0.028)
        - border: 1px solid rgba(255,255,255,0.06)
        custom_fields:
          seg:
          - width: 100%
        grid:
        - grid-template-areas: '"seg"'
      tap_action:
        action: none
      triggers_update:
      - sensor.philipps_iphone17pro_deep_sleep
      - sensor.philipps_iphone17pro_core_sleep
      - sensor.philipps_iphone17pro_rem_sleep
      - sensor.philipps_iphone17pro_awake
      - input_datetime.schlaf_letzte_nacht
    - type: custom:apexcharts-card
      apex_config:
        chart:
          background: transparent
          fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
          foreColor: '#6e7988'
          height: 170
          stacked: true
