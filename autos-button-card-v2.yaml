  # =============================== STANDORTE ===============================
  # Beide Fahrzeuge auf einer Karte -- der device_tracker aus Volkswagen
  # Connect liefert die Parkposition, nicht die Fahrt.
  - type: vertical-stack
    card_mod: *shell
    cards:
      - type: custom:button-card
        icon: mdi:map-marker-multiple
        name: Standorte
        show_icon: true
        show_name: true
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles: *header_styles
      - type: map
        entities:
          - device_tracker.wvwzzz3czpe076722_position
          - device_tracker.touran_position
        theme_mode: dark
        hours_to_show: 24
        card_mod: *frame
