              - sensor.wvwzzz3czpe076722_long_term_trip_average_speed
            variables:
              ids:
                - sensor.wvwzzz3czpe076722_long_term_trip_average_speed_2
                - sensor.wvwzzz3czpe076722_long_term_trip_average_speed
                - sensor.passat_variant_elegance_20_l_tdi_scr_o_geschwindigkeit_langzeit
            label: *lbl_speed
