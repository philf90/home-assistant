            triggers_update:
              - sensor.wvwzzz3czpe076722_long_term_trip_average_fuel_consumption_2
              - sensor.wvwzzz3czpe076722_long_term_trip_average_fuel_consumption
            variables:
              unit: l/100km
              decimals: 1
              ids:
                - sensor.wvwzzz3czpe076722_long_term_trip_average_fuel_consumption_2
                - sensor.wvwzzz3czpe076722_long_term_trip_average_fuel_consumption
                - sensor.passat_variant_elegance_20_l_tdi_scr_o_verbrauch_benzin_langzeit
            label: *lbl_dual
            styles: *mini_styles
      # ---- Aktionen: Datenabruf und Standheizung ----
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: switch.wvwzzz3czpe076722_force_data_refresh
            show_icon: true
            show_name: true
            show_state: false
            triggers_update:
              - binary_sensor.wvwzzz3czpe076722_request_in_progress
            variables: { busy_id: binary_sensor.wvwzzz3czpe076722_request_in_progress }
            tap_action:
              action: toggle
              confirmation:
                text: Fahrzeugdaten jetzt neu abrufen?
            name: &act_refresh_name |
              [[[
                const b=states[variables.busy_id];
                return (b&&b.state==='on') ? 'Abruf läuft …' : 'Daten aktualisieren';
              ]]]
            icon: &act_refresh_icon |
              [[[
                const b=states[variables.busy_id];
                return (b&&b.state==='on') ? 'mdi:cloud-sync' : 'mdi:cloud-refresh-variant';
              ]]]
            styles: &act_styles
              card:
                - border-radius: 13px
                - padding: 10px 12px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - width: 20px
                - height: 20px
                - margin: 0 10px 0 0
                - align-self: center
              icon:
                - width: 20px
                - height: 20px
                - color: &act_col |
                    [[[
                      const b=states[variables.busy_id];
                      return (b&&b.state==='on') ? '#7fb3d5' : '#8794a5';
                    ]]]
              name:
                - justify-self: start
                - align-self: center
                - font-size: 12px
                - font-weight: 600
                - letter-spacing: -0.01em
                - color: *act_col
          # Standheizung nur beim Passat -- der Touran hat keine climate-Entitaet.
          - type: custom:button-card
            entity: climate.wvwzzz3czpe076722_auxiliary_climatisation
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.wvwzzz3czpe076722_auxiliary_heater_heating_ventilation_duration
            variables: { duration_id: sensor.wvwzzz3czpe076722_auxiliary_heater_heating_ventilation_duration }
            tap_action:
              action: more-info
            name: |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                if(!e||e.state==='unavailable') return 'Standheizung offline';
                return (e.state==='off') ? 'Standheizung aus' : 'Standheizung läuft';
              ]]]
            icon: |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                return (e&&e.state!=='off'&&e.state!=='unavailable') ? 'mdi:radiator' : 'mdi:radiator-off';
              ]]]
            label: |
              [[[
                const e=(typeof entity!=='undefined')?entity:null;
                if(!e||e.state==='unavailable') return '';
                const rest=e.attributes?e.attributes.auxiliary_remaining_time_minutes:null;
                if(e.state!=='off' && rest) return 'noch ' + rest + ' min';
                const d=states[variables.duration_id];
                const v=d?parseFloat(d.state):NaN;
                return isNaN(v) ? '' : v + ' min';
              ]]]
            styles: &heat_styles
              card:
                - border-radius: 13px
                - padding: 10px 12px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-areas: '"i n l"'
                - grid-template-columns: min-content 1fr min-content
                - align-items: center
              img_cell:
                - width: 20px
                - height: 20px
                - margin: 0 10px 0 0
                - align-self: center
              icon:
                - width: 20px
                - height: 20px
                - color: &heat_col |
                    [[[
                      const e=(typeof entity!=='undefined')?entity:null;
                      if(!e||e.state==='unavailable') return '#8794a5';
                      return (e.state==='off') ? '#8794a5' : '#e6b566';
                    ]]]
              name:
                - justify-self: start
                - align-self: center
                - font-size: 12px
                - font-weight: 600
                - letter-spacing: -0.01em
                - color: *heat_col
              label:
                - justify-self: end
                - align-self: center
                - font-size: 11px
                - color: '#6e7988'
                - white-space: nowrap
                - margin-left: 8px
      # ---- Datenstand: wann war das Auto zuletzt online, wann kam der Abruf ----
      - type: custom:button-card
        entity: sensor.wvwzzz3czpe076722_last_connected
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update:
          - sensor.wvwzzz3czpe076722_last_data_refresh
        variables: { refresh_id: sensor.wvwzzz3czpe076722_last_data_refresh }
        tap_action:
          action: more-info
        name: &data_name |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const dt=e?new Date(e.state):null;
            if(!dt||isNaN(dt.getTime())) return 'Fahrzeugdaten: kein Zeitstempel';
            const p=v=>String(v).padStart(2,'0');
            const n=new Date();
            const hm=`${p(dt.getHours())}:${p(dt.getMinutes())}`;
            return 'Fahrzeugdaten von ' + (dt.toDateString()===n.toDateString()
              ? hm : `${p(dt.getDate())}.${p(dt.getMonth()+1)}. ${hm}`);
          ]]]
        icon: &data_icon |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const dt=e?new Date(e.state):null;
            if(!dt||isNaN(dt.getTime())) return 'mdi:cloud-question';
            const h=(Date.now()-dt.getTime())/3600000;
            return (h>48) ? 'mdi:cloud-alert' : 'mdi:cloud-check-variant';
          ]]]
        label: &data_label |
          [[[
            const s=states[variables.refresh_id];
            const dt=s?new Date(s.state):null;
            if(!dt||isNaN(dt.getTime())) return '';
            const p=v=>String(v).padStart(2,'0');
            return 'Abruf ' + `${p(dt.getHours())}:${p(dt.getMinutes())}`;
          ]]]
        styles: &data_styles
          card:
            - border-radius: 13px
            - padding: 9px 14px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.02)'
            - border: 1px solid rgba(255,255,255,0.05)
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: min-content 1fr min-content
            - align-items: center
          img_cell:
            - width: 18px
            - height: 18px
            - margin: 0 10px 0 0
            - align-self: center
          icon:
            - width: 18px
            - height: 18px
            - color: &data_col |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null;
                  const dt=e?new Date(e.state):null;
                  if(!dt||isNaN(dt.getTime())) return '#8794a5';
                  const h=(Date.now()-dt.getTime())/3600000;
                  if(h>48) return '#e6b566';
                  return '#6e7988';
                ]]]
          name:
            - justify-self: start
            - align-self: center
            - font-size: 11px
            - color: *data_col
          label:
            - justify-self: end
            - align-self: center
            - font-size: 11px
            - color: '#6e7988'
            - white-space: nowrap
            - margin-left: 10px

