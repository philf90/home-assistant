type: custom:button-card
entity: switch.shelly_outdoor_plugs_pool_switch_0
name: Pool Pumpe
icon: phu:pool-filter
tap_action:
  action: toggle
layout: custom
styles:
  card:
    - border-radius: 24px
    - padding: 16px
  grid:
    - grid-template-areas: "\"i n\" \"i temperature\""
    - grid-template-columns: 64px 1fr
    - grid-template-rows: 1fr 1fr
    - justify-items: start
  icon:
    - width: 36px
    - color: |
        [[[
          return entity.state === 'on'
            ? 'var(--primary-color)'
            : 'var(--disabled-color)';
        ]]]
  name:
    - font-size: 14px
    - font-weight: 600
    - align-self: end
    - justify-self: start
  custom_fields:
    temperature:
      - font-size: 12px
      - color: var(--secondary-text-color)
      - align-self: start
      - justify-self: start
custom_fields:
  temperature: |
    [[[
      const temp = states['sensor.shellyplus1_78ee4cd5f7b8_temperature'];
      if (!temp) return '';
      return `🌡️ ${temp.state} ${temp.attributes.unit_of_measurement || '°C'}`;
    ]]]
