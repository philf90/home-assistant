      # ---- Letzte Fahrt (Kurzzeitspeicher: seit Start) ----
      # Ohne Label im Kopf: den Startkilometerstand legt vag_connect zwar im
      # Register an, die Entitaet existiert aber nicht.
      - type: custom:button-card
        icon: mdi:map-marker-path
        name: Letzte Fahrt
        show_icon: true
        show_name: true
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles: &sub_styles
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 4px 4px 0
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: min-content 1fr min-content
            - align-items: center
          img_cell:
            - width: 16px
            - height: 16px
            - margin: 0 8px 0 0
            - align-self: center
          icon:
            - width: 16px
            - height: 16px
            - color: '#6e7988'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 11px
            - font-weight: 700
            - letter-spacing: 0.07em
            - text-transform: uppercase
            - color: '#6e7988'
          label:
            - justify-self: end
            - align-self: center
            - font-size: 11px
            - color: '#6e7988'
            - white-space: nowrap
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_letzte_fahrt_strecke
            name: Strecke
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_strecke_kurzzeit
            variables:
              unit: km
              decimals: 0
              ids:
                - sensor.garage_volkswagen_076722_letzte_fahrt_strecke
                - sensor.passat_variant_elegance_20_l_tdi_scr_strecke_kurzzeit
            # Zweiquellig: erste Entitaet mit einer Zahl gewinnt (siehe Kopf).
            label: &lbl_dual |
              [[[
                const ids=variables.ids||[];
                let v=NaN;
                for(const id of ids){ const s=states[id]; if(!s) continue;
                  const n=parseFloat(s.state); if(!isNaN(n)){ v=n; break; } }
                if(isNaN(v)) return '–';
                if(variables.abs) v=Math.abs(v);
                const d=(variables.decimals===undefined?0:variables.decimals);
                const t=v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
                return `${t}<span style="font-size:0.6em;color:#6e7988;font-weight:600;margin-left:3px;">${variables.unit||''}</span>`;
              ]]]
            styles: &mini_styles
              card:
                - border-radius: 13px
                - padding: 9px 9px
                - box-shadow: none
                - background: 'rgba(255,255,255,0.028)'
                - border: 1px solid rgba(255,255,255,0.06)
              grid:
                - grid-template-areas: '"l" "n"'
                - grid-template-columns: 1fr
              label:
                - justify-self: start
                - font-size: 14px
                - font-weight: 700
                - letter-spacing: -0.02em
                - font-variant-numeric: tabular-nums
                - color: '#f2f5f8'
              name:
                - justify-self: start
                - font-size: 10.5px
                - color: '#6e7988'
                - margin-top: 1px
                - white-space: nowrap
                - overflow: hidden
                - text-overflow: ellipsis
          # Dauer und Ø Tempo der letzten Fahrt kennt vag_connect nicht --
          # einzige Quelle ist hier der Kurzzeitspeicher aus cupra_eu_data_act.
          - type: custom:button-card
            entity: sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_kurzzeit
            name: Dauer
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            variables:
              ids:
                - sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_kurzzeit
            # Minuten bleiben Minuten, ab 90 wird auf Stunden umgestellt.
            label: &lbl_dur |
              [[[
                const ids=variables.ids||[];
                let m=NaN;
                for(const id of ids){ const s=states[id]; if(!s) continue;
                  const n=parseFloat(s.state); if(!isNaN(n)){ m=n; break; } }
                if(isNaN(m)) return '–';
                const u=t=>`<span style="font-size:0.6em;color:#6e7988;font-weight:600;margin-left:3px;">${t}</span>`;
                if(m<90) return Math.round(m)+u('min');
                return (m/60).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+u('h');
              ]]]
            styles: *mini_styles
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_letzte_fahrt_strecke
            name: Ø Tempo
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_kurzzeit
            variables:
              dist_id: sensor.garage_volkswagen_076722_letzte_fahrt_strecke
              time_id: sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_kurzzeit
            # Kein Durchschnittstempo fuer die letzte Fahrt in beiden Quellen --
            # ersatzweise aus Strecke und Fahrzeit gerechnet.
            label: &lbl_speed |
              [[[
                const ids=variables.ids||[];
                let v=NaN;
                for(const id of ids){ const s=states[id]; if(!s) continue;
                  const n=parseFloat(s.state); if(!isNaN(n)){ v=n; break; } }
                if(isNaN(v) && variables.dist_id && variables.time_id){
                  const d=parseFloat((states[variables.dist_id]||{}).state);
                  const t=parseFloat((states[variables.time_id]||{}).state);
                  if(!isNaN(d) && !isNaN(t) && t>0) v=d/t*60;
                }
                if(isNaN(v)) return '–';
                return Math.round(v)+'<span style="font-size:0.6em;color:#6e7988;font-weight:600;margin-left:3px;">km/h</span>';
              ]]]
            styles: *mini_styles
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_letzte_fahrt_o_kraftstoffverbrauch
            name: Verbrauch
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_o_verbrauch_benzin_kurzzeit
            variables:
              unit: l/100km
              decimals: 1
              ids:
                - sensor.garage_volkswagen_076722_letzte_fahrt_o_kraftstoffverbrauch
                - sensor.passat_variant_elegance_20_l_tdi_scr_o_verbrauch_benzin_kurzzeit
            label: *lbl_dual
            styles: *mini_styles
      # ---- Langzeit (Gesamtspeicher seit letztem Reset) ----
      - type: custom:button-card
        icon: mdi:chart-timeline-variant
        name: Langzeit
        show_icon: true
        show_name: true
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles: *sub_styles
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_langzeit_fahrtstrecke
            name: Strecke
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_strecke_langzeit
            variables:
              unit: km
              decimals: 0
              ids:
                - sensor.garage_volkswagen_076722_langzeit_fahrtstrecke
                - sensor.passat_variant_elegance_20_l_tdi_scr_strecke_langzeit
            label: *lbl_dual
            styles: *mini_styles
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_fahrzeit_gesamt
            name: Dauer
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_langzeit
            variables:
              ids:
                - sensor.garage_volkswagen_076722_fahrzeit_gesamt
                - sensor.passat_variant_elegance_20_l_tdi_scr_fahrzeit_langzeit
            label: *lbl_dur
            styles: *mini_styles
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_o_geschwindigkeit_gesamt
            name: Ø Tempo
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_o_geschwindigkeit_langzeit
            variables:
              ids:
                - sensor.garage_volkswagen_076722_o_geschwindigkeit_gesamt
                - sensor.passat_variant_elegance_20_l_tdi_scr_o_geschwindigkeit_langzeit
            label: *lbl_speed
            styles: *mini_styles
          # vag_connect fuehrt als einzigen Langzeitverbrauch den Lebensdauer-
          # Durchschnitt -- er entspricht dem bisherigen Langzeitwert.
          - type: custom:button-card
            entity: sensor.garage_volkswagen_076722_durchschnittsverbrauch_lebensdauer
            name: Verbrauch
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            triggers_update:
              - sensor.passat_variant_elegance_20_l_tdi_scr_o_verbrauch_benzin_langzeit
            variables:
              unit: l/100km
              decimals: 1
              ids:
                - sensor.garage_volkswagen_076722_durchschnittsverbrauch_lebensdauer
                - sensor.passat_variant_elegance_20_l_tdi_scr_o_verbrauch_benzin_langzeit
            label: *lbl_dual
            styles: *mini_styles
      # ---- Aktion: Datenabruf anstossen (button.press, mit Rueckfrage) ----
      # Die Standheizungs-Kachel aus V2 entfaellt: vag_connect hat keine
      # climate-Entitaet.
      - type: custom:button-card
        entity: button.garage_volkswagen_076722_daten_aktualisieren
        icon: mdi:cloud-refresh-variant
        name: Daten aktualisieren
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.garage_volkswagen_076722_daten_aktualisieren
          confirmation:
            text: Fahrzeugdaten jetzt neu abrufen?
        styles: &act_styles
          card:
            - border-radius: 13px
            - padding: 10px 12px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.028)'
            - border: 1px solid rgba(255,255,255,0.06)
          grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: min-content 1fr
            - align-items: center
          img_cell:
            - width: 20px
            - height: 20px
            - margin: 0 10px 0 0
            - align-self: center
          icon:
            - width: 20px
            - height: 20px
            - color: '#8794a5'
          name:
            - justify-self: start
            - align-self: center
            - font-size: 12px
            - font-weight: 600
            - letter-spacing: -0.01em
            - color: '#8794a5'
      # ---- Datenstand: Zeitpunkt des letzten Datensatzes und Abfragetakt ----
      - type: custom:button-card
        entity: sensor.garage_volkswagen_076722_letzte_aktualisierung
        show_icon: true
        show_name: true
        show_label: true
        show_state: false
        triggers_update:
          - number.vw_group_connect_abfrageintervall
        variables: { interval_id: number.vw_group_connect_abfrageintervall }
        tap_action:
          action: more-info
        name: &data_name |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const dt=e?new Date(e.state):null;
            if(!dt||isNaN(dt.getTime())) return 'Fahrzeugdaten: kein Zeitstempel';
            const p=v=>String(v).padStart(2,'0');
            const n=new Date();
            const hm=`${p(dt.getHours())}:${p(dt.getMinutes())}`;
            return 'Fahrzeugdaten von ' + (dt.toDateString()===n.toDateString()
              ? hm : `${p(dt.getDate())}.${p(dt.getMonth()+1)}. ${hm}`);
          ]]]
        icon: &data_icon |
          [[[
            const e=(typeof entity!=='undefined')?entity:null;
            const dt=e?new Date(e.state):null;
            if(!dt||isNaN(dt.getTime())) return 'mdi:cloud-question';
            const h=(Date.now()-dt.getTime())/3600000;
            return (h>48) ? 'mdi:cloud-alert' : 'mdi:cloud-check-variant';
          ]]]
        label: &data_label |
          [[[
            const s=states[variables.interval_id];
            const v=s?parseFloat(s.state):NaN;
            return isNaN(v) ? '' : 'alle ' + Math.round(v) + ' min';
          ]]]
        styles: &data_styles
          card:
            - border-radius: 13px
            - padding: 9px 14px
            - box-shadow: none
            - background: 'rgba(255,255,255,0.02)'
            - border: 1px solid rgba(255,255,255,0.05)
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: min-content 1fr min-content
            - align-items: center
          img_cell:
            - width: 18px
            - height: 18px
            - margin: 0 10px 0 0
            - align-self: center
          icon:
            - width: 18px
            - height: 18px
            - color: &data_col |
                [[[
                  const e=(typeof entity!=='undefined')?entity:null;
                  const dt=e?new Date(e.state):null;
                  if(!dt||isNaN(dt.getTime())) return '#8794a5';
                  const h=(Date.now()-dt.getTime())/3600000;
                  if(h>48) return '#e6b566';
                  return '#6e7988';
                ]]]
          name:
            - justify-self: start
            - align-self: center
            - font-size: 11px
            - color: *data_col
          label:
            - justify-self: end
            - align-self: center
            - font-size: 11px
            - color: '#6e7988'
            - white-space: nowrap
            - margin-left: 10px

