# Lichter/Steckdosen im Design der ueberarbeiteten Owlet-Smart-Sock-Karte.
# Variante B: Mushroom-Light-Karten, nach Raeumen gruppiert.
#
# Ruhigeres Bild durch collapsible_controls: der Helligkeits-Regler erscheint
# nur, wenn ein Licht an ist (bzw. auf Tipp) -> im Normalfall gleich hohe
# Kacheln. Gruppierung nach Raeumen ueber dezente Zwischenueberschriften.
#
# Ausklappbare Sektion (input_boolean.lichter_expanded bleibt erhalten):
# Kopf mit Status-Badge + Ausklapp-Pfeil, darunter Master "Alle Lichter"
# und die Raum-Gruppen.
#
# Voraussetzung: custom:button-card + Mushroom + card-mod (HACS).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 10px !important;
    }
cards:
  - type: custom:button-card
    entity: input_boolean.lichter_expanded
    icon: mdi:home-lightbulb
    name: Lichter
    show_icon: true
    show_name: true
    show_state: false
    triggers_update: all
    tap_action:
      action: toggle
    custom_fields:
      badge: |
        [[[
          const s=states['sensor.lichter_an'];
          const n= s?parseInt(parseFloat(s.state))||0:0;
          const on=n>0;
          const c=on?'#e6b566':'#6e7988';
          const bg=on?'rgba(230,181,102,0.14)':'rgba(255,255,255,0.05)';
          const bd=on?'rgba(230,181,102,0.26)':'rgba(255,255,255,0.08)';
          const txt=on?(n===1?'1 an':n+' an'):'Alles aus';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${c};background:${bg};border:1px solid ${bd};font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 4 10.5c-.6.6-1 1.2-1 2H9c0-.8-.4-1.4-1-2A6 6 0 0 1 12 3ZM9 18h6"/></svg>${txt}</span>`;
        ]]]
      chev: |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const up = e && e.state==='on';
          return `<span style="display:inline-flex;transform:rotate(${up?180:0}deg);transition:transform .2s;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8794a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 4px
      grid:
        - grid-template-areas: '"i n badge chev"'
        - grid-template-columns: min-content 1fr min-content min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        badge:
          - justify-self: end
          - align-self: center
        chev:
          - justify-self: end
          - align-self: center
          - margin-left: 10px
  - type: conditional
    conditions:
      - entity: input_boolean.lichter_expanded
        state: "on"
    card:
      type: vertical-stack
      cards:
        # ---- Master ----
        - type: custom:mushroom-light-card
          entity: light.alle_lichter
          name: Alle Lichter
          icon: mdi:lightbulb-group
          use_light_color: false
          show_brightness_control: true
          collapsible_controls: true
          fill_container: true
          card_mod: &owlet
            style: |
              ha-card {
                background: rgba(255,255,255,0.028) !important;
                border: 1px solid rgba(255,255,255,0.06) !important;
                border-radius: 16px !important;
                box-shadow: none !important;
              }
        # ============================ WOHNZIMMER ============================
        - type: custom:button-card
          name: Wohnzimmer
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: &room_label
            card:
              - background: none
              - box-shadow: none
              - border: none
              - padding: 8px 2px 2px
            grid:
              - grid-template-areas: '"n"'
            name:
              - justify-self: start
              - font-size: 11.5px
              - font-weight: 800
              - letter-spacing: 0.11em
              - text-transform: uppercase
              - color: '#6e7988'
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.wohnzimmer
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.stehlampe_2
              icon: hue:signe
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.lowboard
              icon: hue:gradient-lightstrip
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.hue_smart_plug_1
              name: Weihnachtsbaum
              icon: phu:christmas-tree-v2
              fill_container: true
              card_mod: *owlet
        # ============================== BAD ==============================
        - type: custom:button-card
          name: Bad
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.badezimmer
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.bad
              icon: hue:iris
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-entity-card
              entity: switch.heizlufter
              name: Heizlüfter
              icon: hue:plug-eu
              tap_action: { action: toggle }
              fill_container: true
              card_mod: *owlet
        # ========================== KINDERZIMMER ==========================
        - type: custom:button-card
          name: Kinderzimmer
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.kinderzimmer
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.kinderbett
              name: Bett
              icon: hue:lightstrip
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.hue_smart_plug_1_3
              name: Lichterkette
              icon: mdi:string-lights
              fill_container: true
              card_mod: *owlet
        # ========================== SCHLAFZIMMER ==========================
        - type: custom:button-card
          name: Schlafzimmer
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.schlafzimmer
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.hue_go_1
              icon: hue:go
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-entity-card
              entity: switch.schlafzimmer_shelly_plugin_g3_klimaanlage
              name: Klimaanlage
              icon: mdi:air-conditioner
              tap_action: { action: toggle }
              fill_container: true
              card_mod: *owlet
        # ============================== BÜRO ==============================
        - type: custom:button-card
          name: Büro
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.buro
              fill_container: true
              card_mod: *owlet
            - type: custom:mushroom-light-card
              entity: light.buro_lightstrip
              icon: hue:lightstrip
              use_light_color: false
              show_brightness_control: true
              collapsible_controls: true
              fill_container: true
              card_mod: *owlet
        # ============================= WINDFANG =============================
        - type: custom:button-card
          name: Windfang
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.hue_smart_plug_1_2
              name: Windfang
              icon: hue:plug-eu
              fill_container: true
              card_mod: *owlet
        # ============================= GARTEN =============================
        - type: custom:button-card
          name: Garten
          show_icon: false
          show_name: true
          tap_action: { action: none }
          styles: *room_label
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-light-card
              entity: light.shellyoutdoorsg3_e4b3232d6708_switch_0
              name: Lichterkette
              icon: mdi:string-lights
              fill_container: true
              card_mod: *owlet
