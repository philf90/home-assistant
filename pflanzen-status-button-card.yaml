# Pflanzen-Status (Ampel-Liste) im Design der ueberarbeiteten
# Owlet-Smart-Sock-Karte. Eigenstaendige Karte.
#
# Eine Sektion "Pflanzen" mit Kopfzeile (inkl. Zusammenfassung der Hinweise)
# und einer Zeile je Pflanze: rundes Foto (entity_picture), Name, Art und
# rechts eine Status-Pille aus dem plant-Status (ok -> gruen "Alles gut" /
# problem -> rot "Aufmerksamkeit"). Tap = more-info (volle flower-card-Details).
#
# Gemeinsame Optik/Logik ueber YAML-Anker: &row_styles, &status_pill,
# &spec_field.
#
# Voraussetzung: custom:button-card + card-mod (HACS).
type: vertical-stack
card_mod:
  style: |
    #root {
      background: linear-gradient(180deg, #1b2231 0%, #171d29 55%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 22px !important;
      box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7) !important;
      padding: 16px 18px !important;
      gap: 8px !important;
    }
cards:
  # ---- Kopfzeile mit Hinweis-Zusammenfassung ----
  - type: custom:button-card
    icon: mdi:sprout
    name: Pflanzen
    show_icon: true
    show_name: true
    show_label: false
    tap_action:
      action: none
    triggers_update: all
    custom_fields:
      summary: |
        [[[
          const ids=['plant.erdbeeren','plant.tomaten','plant.pimentos','plant.gurken','plant.aprikosenbaum','plant.olivenbaum','plant.bananen'];
          let p=0; ids.forEach(id=>{ const s=states[id]; if(s && s.state==='problem') p++; });
          const col=p>0?'#f0736a':'#6e7988';
          const txt=p===0?'Alles im grünen Bereich':(p===1?'1 braucht Aufmerksamkeit':`${p} brauchen Aufmerksamkeit`);
          return `<span style="color:${col};font-size:12.5px;font-weight:600;white-space:nowrap;">${txt}</span>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 2px 6px
      grid:
        - grid-template-areas: '"i n summary"'
        - grid-template-columns: min-content 1fr min-content
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 13px
        - margin-right: 14px
        - align-self: center
        - background: 'rgba(166, 212, 158, 0.12)'
        - border: 1px solid rgba(166, 212, 158, 0.2)
      icon:
        - width: 23px
        - height: 23px
        - color: '#a6d49e'
      name:
        - justify-self: start
        - align-self: center
        - font-size: 17px
        - font-weight: 700
        - letter-spacing: -0.02em
        - color: '#f2f5f8'
      custom_fields:
        summary:
          - justify-self: end
          - align-self: center
  # ---- Pflanzen-Zeilen ----
  - type: custom:button-card
    entity: plant.erdbeeren
    name: Erdbeeren
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields:
      spec: &spec_field |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const s=(e&&e.attributes&&e.attributes.species)?e.attributes.species:'';
          return s?`<span>${s}</span>`:'';
        ]]]
      status: &status_pill |
        [[[
          const e=(typeof entity!=='undefined')?entity:null;
          const problem = e && e.state==='problem';
          const col = problem?'#f0736a':'#a6d49e';
          const bg  = problem?'rgba(240,115,106,0.13)':'rgba(166,212,158,0.13)';
          const bd  = problem?'rgba(240,115,106,0.26)':'rgba(166,212,158,0.24)';
          const txt = problem?'Aufmerksamkeit':'Alles gut';
          const ico = problem
            ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16v.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'
            : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          return `<span style="display:inline-flex;align-items:center;gap:6px;color:${col};background:${bg};border:1px solid ${bd};font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:11px;white-space:nowrap;">${ico}${txt}</span>`;
        ]]]
    styles: &row_styles
      card:
        - border-radius: 14px
        - padding: 9px 12px
        - box-shadow: none
        - background: 'rgba(255,255,255,0.028)'
        - border: 1px solid rgba(255,255,255,0.06)
      grid:
        - grid-template-columns: min-content 1fr min-content
        - grid-template-areas: '"p n status" "p spec status"'
        - grid-template-rows: min-content min-content
      img_cell:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - margin-right: 12px
        - align-self: center
      entity_picture:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - object-fit: cover
      name:
        - justify-self: start
        - align-self: end
        - font-size: 14.5px
        - font-weight: 700
        - letter-spacing: -0.01em
        - color: '#f2f5f8'
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      custom_fields:
        spec:
          - justify-self: start
          - align-self: start
          - font-size: 11.5px
          - font-style: italic
          - color: '#6e7988'
          - margin-top: 1px
          - white-space: nowrap
          - overflow: hidden
          - text-overflow: ellipsis
        status:
          - justify-self: end
          - align-self: center
  - type: custom:button-card
    entity: plant.tomaten
    name: Tomaten
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
  - type: custom:button-card
    entity: plant.pimentos
    name: Pimentos
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
  - type: custom:button-card
    entity: plant.gurken
    name: Gurken
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
  - type: custom:button-card
    entity: plant.aprikosenbaum
    name: Aprikosenbaum
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
  - type: custom:button-card
    entity: plant.olivenbaum
    name: Olivenbaum
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
  - type: custom:button-card
    entity: plant.bananen
    name: Bananen
    show_icon: false
    show_entity_picture: true
    show_name: true
    show_state: false
    custom_fields: { spec: *spec_field, status: *status_pill }
    styles: *row_styles
